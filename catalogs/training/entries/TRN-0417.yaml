title: ops-transformer concat 末 tile 全量拷贝越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: concat kernel 末 tile 长度 c
  behavior: TilingFunc 设 tileNum=ceil(posPerBlock/posPerTile)、tileLength=posPerTile*headDim，kernel 对每个 tile 恒用完整 tileLength 的 CopyIn
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: shape 使 posPerBlock 不能整除 posPerTile 时末 tile 必越界：相邻核数据被越界读写、末核读写越过张量边界上万元素（如 x[1,1024,128]、196608B UB 下末核越写 16128 元素），输出悄悄错或进程崩溃，随 shape 与 UB 容量浮动。
  visibility: 静默错误
mitigation:
  detect: memcheck/保护带定量（报告者给出越界元素数计算）；tile 边界 shape 扫描用例。
  fix: 待定（issue open；修复方向为末 tile 按剩余量 clamp）。
