original:
  mechanism: 'Ascend op-plugin（torch_npu 2.7.1.post4 + CANN 9.1.0，Atlas A3 910_9362×2）的 F.cross_entropy NPU 实现入口缺少主机端 target 边界校验（CPU 会先校验抛 IndexError），越界值直接下发设备端 kernel。reduction=mean 时越界样本被静默排除（结果可复现但与语义不符）；reduction=none 时越界槽位为真实越界读：同输入 npu:0 得 0.624、npu:1 得 1.797，跨芯不一致即非确定性。复现：x=torch.randn(4,8,requires_grad=True).npu(); t=[0,1,99,2]；CPU 抛 IndexError，NPU 静默返回。报告者注与 #592（index_select 越界崩核）同族——那边 fail-loud 崩核、这边 fail-silent 更隐蔽。训练侧收录依据：越界 target 常来自上游数据/label 污染，GPU 上 fail-loud、NPU 上静默吞掉并可能注入非确定垃圾值进 loss/梯度。cross → INF-1471（推理库同源已收，标题核对一致）。复现脚本：A3 真机 /mnt/workspace/a3hunt/round5/。'
  source: https://gitcode.com/Ascend/op-plugin/issues/598
  behavior: NPU 上训练时若某个 batch 的 target 含越界类别（如类别数 8 里的 99，常来自数据管线 bug），cross_entropy 不报错：reduction=mean 的 loss 悄悄少算该样本、数值看似正常；reduction=none 的对应槽位返回跨卡不一致的垃圾值（同一输入 npu:0 与 npu:1 结果不同）。CPU 上同代码会立刻抛 IndexError。环境：CANN 9.1.0、torch_npu 2.7.1.post4、Atlas A3，双芯一致复现。
  trigger_surface: torch_npu + CANN 9.1.0（A3）F.cross_entropy 且 target 含越界值（数据污染、label 错误或未 clamp 的动态类别数）。
