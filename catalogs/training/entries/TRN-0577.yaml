id: TRN-0577
legacy_ids: []
slug: hcomm_comminitrootinfo_groupmap_unlocked_race
aliases: []
title: hcomm CommInitRootInfo 竞态访问 hcclGroupMap
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: CommInitRootInfo 线程安全缺失
  behavior: CommInitRootInfo 直接 find/read opbasedCommInfoV2.hcclGroupMap 未按数据结构定义加 groupParamsLock；分级建链多 root 并发调用时 map 访问竞争。
effect:
  objects:
  - 可用性/进度
  detail: Ascend 950/960 分级建链场景（多 root 并发初始化通信域，如多机多卡启动的通信域建立阶段）可能出现通信域初始化异常、建链失败或偶发 hang/崩溃等不确定行为；复现取决于线程时序，相同配置重跑结果可能不同；未见静默错值实测报告，主要风险在建链阶段稳定性。
  visibility: 不可复现
mitigation:
  detect: 多线程/多 root 并发建链压测（TSAN）；审查通信域初始化调用方的并发拓扑。
  fix: 修复 MR https://gitcode.com/cann/hcomm/merge_requests/6394 （open，2026-10-31）：补齐线程安全访问封装。未核实发布。
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-11-01'
remarks: 训练面：HCCL 通信域初始化是 NPU 分布式训练启动路径；分级建链（多 root）并发场景竞态。静默面为竞态下错误通信域状态（未见实测错值报告，标注保守），主判定为不可复现竞态。
evidence:
- url: https://gitcode.com/cann/hcomm/issues/1182
  kind: gitcode_issue
- url: https://gitcode.com/cann/hcomm/merge_requests/6394
  kind: gitcode_pr
relations: []
original:
  mechanism: 'cann/hcomm #1182（2026-10-31，open；Ascend 950/960）+ 修复 MR !6394（open，2026-10-31）：CommInitRootInfo 实现中 opbasedCommInfoV2.hcclGroupMap.find(identifier) 等访问未按数据结构定义加锁——HcclCommInfoCtxV2 自带 std::mutex groupParamsLock（注释明写「操作hcclGroupMap前加锁」），该接口路径未使用。触发场景：分级建链（hierarchical link建立）过程中多个 root 同时调用 CommInitRootInfo，并发读写 hcclGroupMap 产生数据竞争。issue 附源码片段与结构体定义截图；修复 MR 为 CommInitRootInfo 等接口补齐线程安全访问封装。'
  source: https://gitcode.com/cann/hcomm/issues/1182 （open，2026-10-31）+ 修复 https://gitcode.com/cann/hcomm/merge_requests/6394 （open）
  behavior: NPU 分布式训练在分级建链场景（多 root 并发初始化通信域，如多机多卡启动的通信域建立阶段）可能出现通信域初始化异常、建链失败或偶发 hang/崩溃等不确定行为，复现取决于线程时序（竞态）；相同配置重跑结果可能不同。未见静默错值实测报告，主要风险在建链阶段稳定性。
  trigger_surface: Ascend 950/960；HCCL CommInitRootInfo 分级建链多 root 并发；分布式训练通信域初始化。
  discovery: 2026-11-01 每日扫描
