original:
  mechanism: 'CANN ops-nn aclnnDynamicQuant 系列（950PR/950DT/A3 arch35 向量寄存器路径）的 quant/dynamic_quant/op_kernel/arch35/dynamic_quant_regbase_full_load.h 中 Sub(vregMaxSubMin,...)+Muls(...) 向量序列（约 L358-363）计算非对称量化行极差 (max-min) 时 fp32 中间量溢出为 inf，导致 scale=inf、y 全饱和且静默返回 0；moe_full_load/large_shape_db/pertoken_large_multicore/perchannel_* 等 regbase 模板同款序列（约 6-8 处需逐模板排查）。与 A2（910B）标量路径 #7533 同根因；#7533 的修复 PR !13078（closed）用标量 guard 范式，arch35 侧极差在向量寄存器级计算、需向量级 Select/Greater 组合 guard（改为溢出时两端分别除以量化粒度再作差），改动面大未随 A2 修复一并处理、单独立项。复现：x bf16 行内交替 ±bf16 最大值（|x|>FLT_MAX/2≈1.70e38），非对称量化（dstType=2/29 等）在 950/A3 上执行，scaleOut=inf、yOut 全饱和。'
  source: https://gitcode.com/cann/ops-nn/issues/7721（根因同 https://gitcode.com/cann/ops-nn/issues/7533）
  behavior: 950/A3 系列 NPU 上训练含动态量化的模型（MoE 量化、QAT 路径）时，若某行内同时存在 ±bf16 极值（极差 >3.4e38），量化 scale 变 inf、整行输出饱和为 127（负值也变正、符号丢失），两段接口返回 0 无报错；scale/offset 与反量化结果全错，下游梯度也随之错
  discovery: 2026-10-30 每日扫描
  notes:
  - 2026-10-31 2026-10-31 回访：#7721 open；arch35 修复 !13078 closed（未见 merged，2026-10-29T14:08Z），无实质变化。
