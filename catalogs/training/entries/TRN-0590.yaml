id: TRN-0590
legacy_ids: []
slug: swift_eval_loss_divided_by_accumulation
aliases: []
title: swift 评估 loss 被训练累积窗口相除
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: ms-swift
    component: Trainer 评估路径
  behavior: Trainer/RerankerTrainer/ScoringTrainer 的评估 loss 也被训练梯度累积窗口相除；num_items_in_batch 不能区分训练/评估调用，应仅对 training mode 施加缩放
effect:
  objects:
  - 训练信号
  - 指标/日志
  detail: accumulation=8 时评估分类 loss 0.693147→0.086643；评估跟在完整/部分训练窗口后时除数变化，可反向影响 checkpoint 选择
  visibility: 静默错误
mitigation:
  detect: 固定权重下比较 accumulation=1 与 8 的评估 loss 是否一致
  fix: 修复 PR https://github.com/modelscope/ms-swift/pull/10487（open，未合入）：仅对 training mode 的模型施加累积缩放，附 CPU 复现与 36 项回归（原实现 9 项预期失败）（未核实合入）
