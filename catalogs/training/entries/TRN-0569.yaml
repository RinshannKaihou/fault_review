original:
  mechanism: 'cann/ops-nn #7853（2026-10-31，open；Atlas A2/Ascend910B、CANN 9.2.0-beta.2、torch_npu 2.12.0）：aclnnIndex 在 indices 为整型（int64/int32）时完全不校验 out 形状。源码 index/index/op_api/aclnn_index.cpp:164 的 CheckShape 只检查 indices 个数且为 void+OP_LOGW（返回值被丢弃），无一处检查 out。实测矩阵：self=fp32[6,4]、indices=int64[3]={0,1,2}（真实输出 (3,4)），out=(0,4) 全丢、(1,4) 只写 self[0] 丢 2 行、(2,4) 写前 2 行、(4,4)/(6,4) 尾部未初始化、(3,5) 末维错仍放行——两段接口全部返回 0；1 维同形态。对照：同一 self、BOOL 索引（3 个 True）在 out 失配时两段返回 0 后流同步报 507018（有设备侧暴露），整型通路无任何暴露，校验强度不一致。'
  source: https://gitcode.com/cann/ops-nn/issues/7853 （open，2026-10-31；含 7×out 形状矩阵、BOOL 通路对照与源码行号）
  behavior: NPU 训练/数据管线用整型索引调 aclnnIndex 并复用/预算 out 缓冲时：out 比真实小就静默丢行（数据丢失），比真实大就尾部保留未初始化垃圾值，接口始终返回成功、synchronize 无异常；同样输入走 BOOL 索引反而会在流同步报错。下游拿到「合法但缺失/含垃圾」的索引结果继续训练，无报错可循。
  trigger_surface: Ascend 910B + CANN 9.2.0；aclnnIndex 整型 indices + 显式 out（torch.out 变体/复用缓冲）；训练数据索引路径。
  discovery: 2026-11-01 每日扫描
