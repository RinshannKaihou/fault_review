title: aclnnIndex 整型索引不校验 out 形状
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnIndex out 形状校验缺失
  behavior: 整型 indices 下 CheckShape 只对输入做 OP_LOGW 日志级提示（void 返回值被丢弃），从头到尾不校验 out 形状；out 偏小写出后静默截断，偏大返回未初始化，全部返回 0。
effect:
  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: 910B 实测：3 索引真实输出 (3,4)，out 给 (0,4)/(1,4)/(2,4)/(3,5) 两段均返回 0——偏小丢行、偏大尾部未初始化；对照同一 self 的 BOOL 索引（3 个 True）在 out 失配时同样返回 0，但流同步报 507018，整型通路无任何暴露。
  visibility: 静默错误
mitigation:
  detect: 调用后断言 out.shape 与按 indices 推导的真实形状一致；与 BOOL 索引通路或 CPU 参照对拍。
  fix: 待定（issue open：期望第一段返回 161002；源码锚点 index/index/op_api/aclnn_index.cpp:164，未见修复 MR）
