original:
  mechanism: 'Ascend/torchair issue #870（2026-10-16，9362 实测 + 根因分析）。torchair _inductor_npu_ext 生成的 benchmark.py --check 精度校验结构性假阴性：把 eager_fn 片段重新交给 torch.compile 后得到的融合 kernel 与整网中该 kernel 不同构——TORCH_COMPILE_DEBUG=1 显示整网该段融合为 1 个 kernel（autofused__to_copy_add_expand_matmul_mean_mul_pow_rsqrt_sigmoid_sum_unsqueeze_view_d2a3593a），重编后变 2 个（md5 4e0f9ef3 主 kernel + autofused_mean_pow_140f5c02），md5 不同。根因：整网 asc_graph.py 里同一逻辑值经两条 broadcast 链各算一遍（两条完整 RMSNorm+gate 链：truediv/truediv1 ← 同样 Data5+Scalar16384、rsqrt/rsqrt1 ← 同样叶子、sigmoid/sigmoid1，三 Store 分别去向 output0/1/2），两条链都有实际消费者不可消除；而 eager_fn 按逻辑输出抽取、每个输出只算一次。因此 --check 校验的是另一个（更简单融合结构的）kernel。真实后果已实测：整网 kernel 在 CANN 0923 上产生 23% NaN 导致训练 grad_norm=nan，而同一 kernel 的 benchmark.py --check 报 PASSED（CosineSim=1.00000000 / RelEuclid=1.27e-07 等三 output 全过）。'
  source: https://gitcode.com/Ascend/torchair/issues/870
  behavior: 用 torchair 编译产物自带的 benchmark.py --check 做单 kernel 精度自检，会看到 Precision check passed，但被检的 kernel 与整网实际运行的 kernel 不是同一个（融合结构、kernel 数、md5 都不同）——训练已在报 grad_norm=nan 的 kernel 仍能拿到 PASSED。受影响的是所有依赖该 --check 流程判断 kernel 正确性的用户：绿灯不等于整网正确。整网含重复子计算链（CSE 未消除的同值双算）时必现。
  discovery: 2026-10-17 每日扫描
