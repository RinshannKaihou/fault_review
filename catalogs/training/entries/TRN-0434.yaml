  mechanism: 'cann/ops-math #3963（2026-10-25，open，A2 910B2 / CANN 9.2.0 / master 584b2ea6）。aclnnAll 的 out dtype 传 UINT8（资料明确列为支持出参类型）时，输出不是 all() 的 0/1 布尔真值，而是对 self 的数值截断：fp16[2x4] 每列非零、dim=0 归约，UINT8 出参实测 [1,2,3,4]（输入 1..8）、[100,200,44,144]（输入 100..400，300%256=44、400%256=144）、[0,0,0,0]（输入 0.1..0.8）；BOOL 出参正确 [1,1,1,1]。FLOAT/BF16/BOOL/FLOAT/INT32/INT64 等 self dtype 同样错。两段返回 0，静默脏数据。'
