id: TRN-0768
legacy_ids: []
slug: msswift_qwen_reasoning_content_dropped
aliases: []
title: Qwen SFT 丢 reasoning_content 且错切标签
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: ms-swift
    component: RowPreprocessor/Qwen 模板
  behavior: RowPreprocessor 只保留 role/content/loss/loss_scale，独立 reasoning_content 被删；并入 content 后模板把思考中字面标签当边界。
effect:
  objects:
  - 训练样本流
  - 输入编码
  detail: reasoning_content='BEFORE quote 字面起始标签 then AFTER' 预处理后整字段消失；同一文本放进 content 后规范化只剩 '" then AFTER'，前文被删除；发生在 tokenization 之前。
  visibility: 静默错误
mitigation:
  detect: 预处理后回读 messages，断言 reasoning_content 保留；用含字面标签的思考文本做模板渲染回归。
  fix: 修复 PR https://github.com/modelscope/ms-swift/pull/10570 、https://github.com/modelscope/ms-swift/pull/10571（均 open 2026-11-14，未合入）
