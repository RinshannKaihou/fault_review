relations: []
original:
  mechanism: 'modelscope/ms-swift #10569（2026-11-14，open，ms-swift 4.5.3 / Transformers 5.16.1 / tokenizers 0.23.2 / Qwen3.8-27B，4.6.1 仍有该处理）。swift/dataset/preprocessor/core.py 的 RowPreprocessor._check_messages 只保留 role/content/loss/loss_scale，assistant 消息里的独立 reasoning_content 字段被直接删除；把思考并入 content 后，swift/template/templates/qwen.py 的 Qwen3_5Template._swift_prepare_inputs 先 partition(结束标签) 再 rsplit(起始标签,1)，思考正文中引用的字面标签被当成协议边界。实测 reasoning_content=''BEFORE quote 字面起始标签 then AFTER'' 经 _check_messages 后整字段消失；同一文本放进 content，规范化结果只剩 ''" then AFTER''，前半段被删除。丢失发生在 tokenization 之前；报告者已提交 #10570（保留独立字段）与 #10571（按字段编码、区分字面标签）两个修复 PR。'
  source: https://github.com/modelscope/ms-swift/issues/10569 ；修复：https://github.com/modelscope/ms-swift/pull/10570 、https://github.com/modelscope/ms-swift/pull/10571
  behavior: Qwen 系列 SFT 数据里带独立 reasoning_content，或把思考文本合并进 content 且思考中引用了字面 think 开/闭标签时，预处理会丢掉整段推理内容，或把思考前半段删掉：训练样本静默缺标签，loss 仍正常下降。数据检查要在 tokenization 之前做；用官方模板渲染后对比原始 messages 才能发现字段被删或文本被截。
  trigger_surface: ms-swift Qwen SFT 数据预处理与 Qwen3_5Template；4.5.3 / 4.6.1 源码。
  discovery: 2026-11-16 每日扫描
