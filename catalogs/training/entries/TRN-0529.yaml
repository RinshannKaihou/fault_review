original:
  mechanism: CANN ops-transformer aclnnFlashAttentionScoreV4（Ascend950PR，CANN 9.2.0-beta.2，算子仓 master 45a09b29）对属性取值超出资料声明范围时第一段 GetWorkspaceSize 仍返回 0：sparseMode=-1（资料只声明 0-6）返回 0 且 ws 与基线相同、attentionOut 与 sparseMode=0 的 sha256 完全相同（5d6ebe89b757），即被当 dense 执行；innerPrecise=3（资料只给 0/1/2 语义）返回 0、输出与 innerPrecise=0 位相同即按默认处理；对照 sparseMode=7 返回 161001 证明属性确实下发到算子、校验链路存在但未覆盖这些值。probe_attr.py 两段调用实测。训练影响面：NPU 上 FlashAttention 训练/long-context 稀疏注意力配置传错值时静默跑 dense（显存与语义都错）或错误精度档，无报错。issue open，期望第一段即拒并返回 161002。
  source: https://gitcode.com/cann/ops-transformer/issues/6879
  behavior: 在 NPU 上以 FlashAttentionScoreV4 配置稀疏注意力（sparseMode）或精度档（innerPrecise）时，传了资料未声明的值（如 -1 或 3）不报错，算子按默认 dense/默认精度静默执行：长上下文训练本想省显存用稀疏模式却按全量算（或 OOM 或语义不符），注意力输出与预期配置不同但无任何日志提示
  discovery: 2026-10-30 每日扫描
