title: aclnnScatterAdd 多对一累加偶发丢失贡献
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: aclnnScatterAdd 多对一累加
  behavior: NPU 上 Tensor.scatter_add_（aclnnScatterAdd）在多对一冲突写时偶发输出错误：固定种子输入多数运行通过、偶发失败（66519 用例 1 次）；根因为推断，竞态类最可能、设备级偶发计算错误次之，待复现确认。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: Embedding grad_sample 偶发整行 15 维偏差 0.0405，超容差约 400 倍，远超 ~1e-6 的累加顺序差；算子日志无 ERROR。触发：A3/CANN 9.2.0/torch_npu 77169f23 的 scatter_add_ 多对一冲突写，并发关联未证实。
  visibility: 不可复现
mitigation:
  detect: 固定种子循环跑 per-sample 梯度对照（batch=1 循环 vs 整 batch）统计失败率；线上可对 embedding 梯度行做和校验
  fix: 待定（issue open 2026-10-27；CI 偶发 1/66519，未定位到算子提交）
