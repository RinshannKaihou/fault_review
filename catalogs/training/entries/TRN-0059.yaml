  behavior: face (1) 静默——teacher/EMA 初始化源错但训练照常，蒸馏目标从错误 anchor 出发；face (2) fail-fast。与 CKPT.02（ZeRO 分片图与加载布局错位）不同：这里分片布局是对的，错的是**读取时机在 gather 窗口之外**——合法配置下生命周期序错，非几何错。
