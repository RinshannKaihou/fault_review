  mechanism: trl `PEFTAdapterEMACallback` 在 `on_train_begin()` 才惰性创建 SDPO teacher adapter——此时 student 已被 DeepSpeed ZeRO-3 分片。两个静默面：(1) `get_peft_model_state_dict()` 直接读未 gather 的分区参数，读到 `numel()==0` 的空 shard 视图，teacher 与 EMA shadow 从**空张量**初始化；(2) 分片后插入的新参数脱离 ZeRO instrumentation，首个 forward 崩（`'dict' object has no attribute '_in_forward'`）。
