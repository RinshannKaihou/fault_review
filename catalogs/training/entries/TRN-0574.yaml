title: NormalizeBBox FP16 大除数精度错误
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: NormalizeBBox FP16 转换溢出
  behavior: FP16 坐标、高宽（合法 INT32）超 FP16 最大有限值（65536>65504）时，旧实现先把高宽转 FP16 溢出后再相除，输出全 0；仓内 GPU 测试参考重复同样转换，把错误结果判为 PASS。
effect:
  objects:
  - 数值结果
  - 测试判定
  detail: 950PR 实测：boxes=FP16[1,3,4] 全 1000、shape_hw=INT32 高宽 65536，12 输出应 0.01526 实得全 0（12/12 错）；FP32 对照通过；旧 GPU 参考也输出 0 致 cross_check 误判 PASS。修复参考后旧内核 FAIL。
  visibility: 静默错误
mitigation:
  detect: 提升精度数学参考对照（勿复刻 kernel 的 dtype 转换路径）；FP32 对照组。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13275 （open）：修 FP16 大除数精度并补 Host 推导校验；26 条小用例三 Kernel 路径 + 26 条 GE 用例 PASS。未核实发布。
