original:
  mechanism: 'cann/ops-nn #7869（2026-10-31，open；Ascend950PR_9579、CANN 9.3.0、ops-nn 主线 d1109ae3）：NormalizeBBox 在 FP16 坐标 + 高宽超过 FP16 最大有限值（65536>65504）时算错：高宽原本合法 INT32，旧实现先转 FP16 溢出后再相除，输出全 0；且旧 GPU 测试参考重复同样转换，把错误结果判为 PASS（cross_check 假绿）。实测：boxes=FP16[1,3,4] 全 1000、shape_hw=INT32[1,3] 高宽均 65536，12 个输出应 1000/65536=0.0152587890625 实得 0（12/12 错）；FP32 对照通过；修正参考后旧内核 FAIL，修复后 26 条小用例 dyn/cst/release 三 Kernel 路径与 26 条 GE 用例全 PASS。另 Host 推导放行非法 rank/shape_hw/batch 关系与 BOOL dtype（负向问题，随 MR 一并修）。'
  source: https://gitcode.com/cann/ops-nn/issues/7869 （open，2026-10-31；含回归用例 nb_float16_large_hw、质量看板链接与关联 MR）
  behavior: NPU 检测/分割训练数据管线里用 FP16 坐标做大图（高宽>65504）框归一化：输出框坐标全部变 0（应为 ~0.015），无报错；更隐蔽的是仓内 GPU 测试参考犯同样转换错误，精度比对显示 PASS——错误结果自带「测试通过」假象，只有换提升精度参考才暴露；FP32 输入不受影响。
  trigger_surface: Ascend 950PR + CANN 9.3.0；NormalizeBBox FP16 坐标 + INT32 高宽>65504；检测框归一化训练/数据路径。
  discovery: 2026-11-01 每日扫描
