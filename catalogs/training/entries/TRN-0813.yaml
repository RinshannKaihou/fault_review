original:
  mechanism: 'NVFP4/MXFP8 Linear 的权重是 _ShardedFSDPTensor 包装：fsdp_pre_all_gather 先移动 shard 维、fsdp_post_all_gather 再在 gather 后量化。对 Shard(1) 的堆叠 FFN 权重 w13（[2,F,D]，gate 与 up 叠在第一维），pre-hook 在 L401 把非 0 的 shard 维（F）移到最前，返回 [F/W,2,D]；FSDP2 把普通 all-gather 输入当作 padded shard 的行、按参数自身的 shard 维（dim1）拼接，而 post-hook 却假设 dim0 拼接来还原。结果同一批行被重排两次，shape 仍匹配，任何检查都不会报错。[2,8,4]、Shard(1)、2 rank 的例子里，gather 后第 0 列在 main 上是 [0,10,40,50,20,30,60,70]，正确顺序是 [0,10,20,30,40,50,60,70]；Shard(0) 权重不受影响。Claude bot 复核确认还波及 Dist-MoE 的 MXFP8 experts，并指出 draft PR #5874 才是正确修法。'
  source: 'torchtitan issue #6258（closed 2026-11-19；NVFP4+FSDP 作业 loss 异常停滞）https://github.com/pytorch/torchtitan/issues/6258 ；修复 PR https://github.com/pytorch/torchtitan/pull/6259（closed 未合入）；替代 draft PR https://github.com/pytorch/torchtitan/pull/5874（open）'
  behavior: NVFP4 或 MXFP8 量化训练配 FSDP、TP/FSDP 分片数大于 1 时，作业能启动、loss 有限但明显异常并停滞；gate/up 堆叠权重的行在 all-gather 后顺序错乱，量化线性层算出的激活错误。单卡或 Shard(0) 的权重看不出问题，换回 BF16 后 loss 曲线恢复。
  discovery: 2026-11-26 每日扫描
