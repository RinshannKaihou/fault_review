title: BN 参数合并存储后 NC1HWC0 清零 bias
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: BatchNorm2d NC1HWC0 前向
  behavior: npu_combine_tensors 合并 BatchNorm weight/bias 存储后，FP16 NC1HWC0 训练态前向把 8 个 bias 元素写成 0；格式 2 或未合并存储不触发。
effect:
  objects:
  - 模型权重
  - 训练轨迹
  detail: 910B2 + CANN 9.2.0：bias 最大改变 0.25、8 个元素全清零；Conv2d+BN + FP16 AMP 训练中 NpuFusedAdamW 16 步参数最大差 0.3811，仅把 BN 参数转格式 3 后降到 3e-8。
  visibility: 静默错误
mitigation:
  detect: 对比合并/不合并参数存储、格式 2/3 输入四种组合下前向前后 BN bias 是否改变；训练侧对照标准 AdamW 的参数轨迹
  fix: '待定（issue #6494 open，2026-11-26；#5501 的首次 unscale 越界已由 !48953 修复，本条前向写 bias 尚未修）'
