id: TRN-0515
legacy_ids: []
slug: deepspeed_zero_init_casts_rope_inv_freq_bf16
aliases: []
title: ZeRO-3 init 把 fp32 RoPE inv_freq 算成 bf16
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: zero.Init 构造器包装
  behavior: zero.Init 的 fp tensor constructor 包装把显式 dtype=torch.float 的构造结果也 cast 到 bf16，RoPE inv_freq 计算落 bf16
effect:
  objects:
  - 数值结果
  - 隐状态
  - 梯度
  detail: ZeRO-3 下 RoPE 角度=位置×频率，误差随位置增长；Qwen3.8-27B LoRA 单条 65k token 实测 grad norm 0.78 vs 单卡 7.91（差一个量级），ZeRO-0/2 与单卡 bit-identical
  visibility: 静默错误
mitigation:
  detect: 对比 ZeRO-3 与 ZeRO-0/2/单卡的 grad norm 与 loss；检查 inv_freq buffer dtype 是否 bf16
  fix: 部分规避：data_types.keep_in_fp32_modules=["rotary_emb"]（#8699，0.19.8 起 opt-in，默认 "auto" 不覆盖 RoPE）；修复 PR 未出（issue open，讨论是否 "auto" 应保留显式 fp32 非 persistent buffer）
