original:
  mechanism: 'cann/ops-math #3878（2026-10-24，open，A2 910B2 / CANN 9.2.0 / master 584b2ea6）。aclnnReplicationPad1d 传负 padding（裁剪语义）时 FLOAT32/FLOAT16 输入两段返回 0 但 sync 报 507035（AICore vector core exception）；同机对照：正 padding（含 8000,8000）正常、INT32 负 padding 正常（数值与 torch 一致）。ReplicationPad2d（[1,2,4,6] 四向 -1）、ReplicationPad3d（六向 -1）同现象。复现频率 2/2（连续两轮、两个 dtype、三个接口）。host 侧 op_api SafePadSum()（op_replication_pad.h:51-68）明确实现负值裁剪（dimSize+padFront<0 才非法），即负 padding 是 host 主动放行的合法入参，缺陷在浮点 dtype 的 kernel 路径。训练影响：数据增强/序列裁剪用 replicate 负 padding（torch.nn.functional.pad mode=''replicate''）在 NPU 上浮点输入必崩，但两段接口不报错、错误延迟到同步——对训练属 fail-loud（崩溃）但 host 假绿一面值得记录。'
  source: https://gitcode.com/cann/ops-math/issues/3878
  behavior: 在 NPU 上对 fp32/fp16 张量用 replication padding 的负数（裁剪）模式：接口调用返回成功，同步时进程被设备侧 vector core 异常（507035）打断；同样的负 padding 换 INT32 输入又完全正常。三个维度接口（1d/2d/3d）都复现，训练作业在数据增强/裁剪处崩掉且第一段不报参数错。
  trigger_surface: aclnnReplicationPad1d/2d/3d，FLOAT32/FLOAT16 + 负 padding（裁剪）；A2 910B2 / CANN 9.2.0 实测 2/2；INT32 不触发。
  discovery: 2026-10-25 每日扫描
