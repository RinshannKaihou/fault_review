original:
  mechanism: 'cann/ops-transformer #6766（open，2026-10-26）：block_sparse_attention 算子在超大 blockSparseMask 时计算偏移出现回绕导致的精度问题——偏移量计算使用 32 位整型，掩码规模使偏移超过 2^32 后按模回绕，掩码索引错位、注意力输出精度劣化。对应修复 MR !14632（open）：『修复超大 blockSparseMask 时计算偏移导致的 uint32 回绕导致的精度问题』，将偏移计算提升整型宽度。推理库同源条目 INF-2197；训练侧影响面为长序列稀疏注意力的训练前向/反向（同 kernel 路径），本条按训练范围单独收录并交叉关联。'
  source: GitCode issue：https://gitcode.com/cann/ops-transformer/issues/6766 （open）；修复 MR https://gitcode.com/cann/ops-transformer/merge_requests/14632 （open）；推理库同源条目 INF-2197
  behavior: 训练或推理使用 block_sparse_attention 且稀疏块掩码规模超大（偏移量越过 32 位上限）时，注意力输出出现无法解释的精度劣化，无任何报错；常规规模掩码正常，因此只在超长序列/超大掩码配置下触发，表现为长上下文任务质量下降或 loss 异常但算子调用全部成功。
  discovery: 2026-10-27 每日扫描
