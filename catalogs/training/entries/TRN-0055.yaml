  meta: 'stage: `pretrain/sft` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 模型构造函数参数带默认值，入口脚本转发了兄弟参数却漏掉这一个，CLI 值被静默丢弃。实例：Megatron `pretrain_vlm.py` 不把 `--rotary-base` 传给 `LLaVAModel`，语言模型恒用 dataclass 默认 10000；而 rotary base 是预训练 ckpt 的固有属性（Llama 3.x=500000）。同一构造在 `examples/multimodal/model.py` 是传的（证明是遗漏非有意），且基础 `TransformerConfig` 无 `rotary_base` 字段可兜底——kwargs 是唯一通道。
  source: 'Megatron-LM #6585（2026-08-17，含 call-site 级复现命令）。https://github.com/NVIDIA/Megatron-LM/issues/6585'
  behavior: 无 crash、无日志。LM 的 `RotaryEmbedding` 以错误 base 训练，长上下文质量静默受损；视觉侧不受影响，归因更难。配置值即「ckpt 属性」，错在保存之前，任何加载侧检查都救不回。
  discovery: 2026-08-18 每日扫描
