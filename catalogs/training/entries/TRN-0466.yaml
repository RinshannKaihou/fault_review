title: GKD on-policy 步按数据集 token 数归一化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: trl
    component: GKD loss 归一化口径
  behavior: Trainer 在用生成 completion 替换 labels 前就从 dataset labels 数出 num_items_in_batch；JSD 和除以数据集 token 数，分母含已丢弃的参考答案 token。
effect:
  objects:
  - 训练信号
  detail: 每个 on-policy/seq_kd 步的 loss 尺度取决于被扔掉的参考答案长度（默认 lmbda=0.5 约一半步受影响）；实测 num_items_in_batch=172 而生成 batch label token 远小。同仓 DistillationTrainer 已按生成侧重数。
  visibility: 静默错误
mitigation:
  detect: 对照 DistillationTrainer 重数逻辑；打印 num_items_in_batch 与生成 batch label token 数
  fix: 待定（issue open）
