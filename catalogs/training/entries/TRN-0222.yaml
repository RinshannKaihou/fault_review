  mechanism: 全管线 FP8 RL 中，训练侧与 rollout 侧各自的 FP8 量化噪声都进入 importance ratio，**逐级复合**后 ratio 系统性偏移——负 advantage token 的 ratio 被不成比例地推出 trust region（clip 上界），梯度被错误归零：病态输出**得不到惩罚**且随训练累积。表现为训练中期 entropy 涌现式激增 + 输出乱码。BF16 rollout + FP8 trainer（FP8-RL 栈）无此不稳定性——复合噪声是全管线 FP8 特有。缓解 = Calibrated Clipping：按高精度 BF16 分布对齐 FP8 clip 下界分位数并再平衡上界（8B–32B、GRPO/DAPO、多 scaling 粒度验证恢复至 BF16 基线水平）。
  source: '"Towards Full Pipeline FP8 Reinforcement Learning for LLMs", arXiv:2609.22870（2026-09-19）。https://arxiv.org/abs/2609.22870'
  behavior: 无 crash、无 NaN——entropy surge + 乱码输出这类「看似探索性崩溃」的症状，根因在**量化噪声 × clip 机制的符号不对称交互**：惩罚通道被静默关闭、奖励通道完好，策略单向漂移。与 RL-KL.03（entropy 塌缩到重复）表象同族但机制不同：那边是策略收敛动力学、这边是 clip 掩蔽负梯度；与 RL-RO.01（TIM：量化 rollout 的 logprob 偏差，TIS/MIS 校正对象）互补：TIS 校正 logprob **数值**、本条指出 ratio 进入**非线性 clip** 后校正残差被符号不对称放大——低精度栈设计需同时管校正与 clip 边界；与 RL-KL.07（k3 前向有限反向 NaN）同打击「梯度经有界算子后语义翻转」，差异在这边是确定性的方向偏置而非数值爆炸。
  discovery: 2026-09-23 每日扫描
