original:
  mechanism: 'MindSpeed issue #209（2026-07-15 提，已 closed；MindSpeed commit edd30e450dd64fe2d00fa5b963ab868a94b174f6，core_r0.16.0 分支）：TERowParallelLinear 未正确处理 parallel_mode=None。按 mcore 约定，shared_experts.py 在 --moe-shared-expert-overlap 时把 linear_fc1/linear_fc2 的 parallel_mode 置为 None（配合 ub_overlap_* 置 False），注释写明是「disable TP related AG/RS communications in the linear module」，目的是让这些层只做本地 matmul，通信由 SharedExpertMLP.post_forward_comm 里显式的 reduce_scatter_to_sequence_parallel_region / reduce_from_tensor_model_parallel_region 承担。但 MindSpeed 的 TERowParallelLinear.forward() 不看 parallel_mode：非序列并行场景仍调用 matmul_all_reduce，序列并行场景仍调用 matmul_reduce_scatter，于是该层在已经由 post_forward_comm 做通信的前提下又做了一遍 TP 通信，结果被重复归约。预期行为是 parallel_mode=None 时仅执行本地矩阵乘法。issue 建议在 forward() 中检测 parallel_mode is None 后切到无 TP 通信路径。'
  source: https://gitcode.com/Ascend/MindSpeed/issues/209
  behavior: 在 core_r0.16.0 上开 --moe-shared-expert-overlap 训练 MoE 模型时，不报错、不 NaN，但共享专家支路的输出与关闭 overlap 的等价配置不一致：linear 层在被要求不做 TP 通信（parallel_mode=None）时仍然执行了 all-reduce / reduce-scatter，等于同一份结果被多归约一次。表现为 loss 曲线与基准配置对不上，且只有打开 shared expert overlap 才出现。
  trigger_surface: --moe-shared-expert-overlap + TERowParallelLinear（parallel_mode=None）
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
