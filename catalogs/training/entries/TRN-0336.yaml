title: parallel_mode 置空后仍做 TP 通信
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindspeed
    component: TE RowParallel 通信判定
  behavior: TERowParallelLinear 未处理 parallel_mode=None：非序列并行仍调 matmul_all_reduce、序列并行仍调 matmul_reduce_scatter，而置 None 的语义是不做 TP 通信。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 开 moe_shared_expert_overlap 时 mcore 把共享专家的 linear.parallel_mode 置 None 期望跳过 TP 通信，实际仍重复 all-reduce/reduce-scatter，共享专家输出被多归约一次导致结果错，无报错。
  visibility: 静默错误
mitigation:
  detect: 开 moe_shared_expert_overlap 后比对该层的通信次数与关闭 overlap 的等价配置；对比 TP=1 与 TP>1 的共享专家输出。
  fix: issue 建议在 TERowParallelLinear.forward() 中检测 self.parallel_mode is None，切到无 TP 通信的 matmul 路径；issue 已 closed，正文未给出合入 PR（未核实）。
