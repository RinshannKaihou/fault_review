original:
  mechanism: CANN ops-transformer aclnnLightningIndexerKLLoss（attention/lightning_indexer_kl_loss）：仓内官方 example test_aclnn_lightning_indexer_kl_loss.cpp 在 Atlas A2（910B2）/CANN 9.2.0 上 result[0] 输出 nan。输入合法：targetScore=rand[0,2) shape (2,4,128) fp32、indexProbs 每行归一化 sum=1、eps=1e-9、weightType=logits、loss fp32[1] 初值 0。排除项全维度交叉验证：dtype fp16/bf16/fp32、K 1/2/4/8192、B 1/2/512、eps 1e-9/1.0、weightType logits/probs、ACL_OPT_DETERMINISTIC 0/1 全 nan；最小用例 y=[2.0]、Y=[1.0]、K=1、eps=1e-9/1.0 期望 (log(2/3)-log(2))*2≈-0.81 实测 nan；输出 buffer 预填 0 后读回 0x7fffffff 排除未初始化内存；所有浮点输入有限排除 clamp/log 边界。master 侧最近提交（2026-10-13）为接口文件规范整改，无针对 NaN 的修复。Lightning Indexer 是 Kimi K2 类 MoE 的深层稀疏索引器组件，KL loss 为其训练损失——训练侧收录依据。推理库 find 同 URL 为 0（2026-10-24 查），推理扫描同批次独立判定中，暂不建 cross。无训练框架受害报告（example 直跑即坏）。
  source: https://gitcode.com/cann/ops-transformer/issues/6614
  behavior: 在 A2 上训练带 Lightning Indexer 的模型（Kimi K2 类 MoE）：其 KL 损失算子一调用就返回 nan——连仓库自带的最小 example、单元素输入都能稳定复现，换 dtype、batch、eps、确定性开关都一样；训练第一步 loss 就是 nan，起步即失败，无任何报错日志指向原因。
