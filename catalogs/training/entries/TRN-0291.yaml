id: TRN-0291
legacy_ids: []
slug: hinge_loss_grad_boundary_gate_decay
aliases: []
title: HingeLossGrad hinge 边界附近正梯度被错误缩小
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: epsilon 平滑门函数
  behavior: kernel 把 margin>0 门函数实现为 (margin+|margin|)/(2*(|margin|+1e-7))，margin 为很小正数时系数<1，有效梯度被错误衰减；文档/注释/golden 均定义为严格阈值。
effect:
  objects:
  - 梯度
  detail: 预测值紧邻 hinge 边界且 margin 为极小正数（如 5.96e-8）时，梯度幅值被静默压低，最严重约 0.37 倍，更新方向对但步长错；无报错无 NaN，边界样本学习偏慢、收敛质量受损；远离边界样本无差异。
  visibility: 静默错误
mitigation:
  detect: 对紧邻边界的 margin（nextafter(1,0) 等）构造梯度对照用例。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/12150（2026-10-17 open）：Compares(GT)+Select 硬阈值替代软门，float32 与 fp16/bf16 路径都改；910B1 三 dtype UT 全绿，未发布
