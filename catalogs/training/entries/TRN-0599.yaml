id: TRN-0599
legacy_ids: []
slug: deepspeed_deepnvme_silent_io_failure
aliases: []
title: DeepNVMe 未检 I/O 结果：错位缓冲失败仍报成功
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: deepspeed
    component: DeepNVMe async I/O
  behavior: DeepNVMe 不检查 I/O 请求结果，内核失败的请求报为完成；ZeRO-Infinity 在非对齐偏移读写 view，O_DIRECT 在 md RAID/LVM/老内核拒绝——swap-in 留陈旧数据、swap-out 零写入
effect:
  objects:
  - 模型权重
  - 梯度
  detail: GH200 md RAID0 实测：非对齐偏移 I/O 零移动报成功；ZeRO-3 参数 offload 290 参数中 60 个错→修复后 0、首 loss 恢复基线；优化器 offload loss 第 2 步分叉→修复后一致
  visibility: 静默错误
mitigation:
  detect: ZeRO-Infinity NVMe offload 与 CPU offload 的首步 loss/参数 checksum 对比；strace 检查 O_DIRECT 短读；非对齐偏移探针
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8985（open）：每个完成请求检查结果、失败使 wait()/sync_pread()/sync_pwrite() 抛 RuntimeError；非连续/未对齐张量走 bounce buffer；快初始化经 padding staging 张量；io_submit 错误不再 assert、io_pgetevents EINTR 重试、io_queue_init 失败抛错
