relations: []
original:
  mechanism: MindSpeed 2.3.0（openeuler + 910C/910_9392 + CANN 8.5.0）上同时开启 --moe-expert-capacity-factor（专家容量限制）与 --moe-router-load-balancing-type aux_loss（负载均衡 aux loss）。capacity 特性内部的 drop 策略（超容量 token 直接丢弃）与 dropless 策略（超容量 token 路由到其他专家）在路由计算和 aux_loss 计算路径上逻辑互斥：drop 策略下被丢掉的 token 不参与 aux_loss，负载均衡损失的 token 计数分母偏小甚至为零，除法后 loss 变 NaN；dropless 策略下 token 被重路由后，aux_loss 用的路由分布与实际专家计算分布不一致，梯度异常。验证阶段对 hidden size 的调整（capacity padding 或 token drop 后的 reshape）也没处理边界，出现 shape 不匹配。涉及模块 mindspeed_llm/core/transformer/moe/ 与 mindspeed_llm/features_manager/moe/。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1399（closed；环境 MindSpeed 2.3.0 + 910C + CANN 8.5.0；现象、原因分析与解决方案在正文）
  behavior: 只开 capacity（不挂 aux_loss）训练正常，只开 aux_loss（不设 capacity）也正常；两个一起开时训练跑着跑着 loss 变成 NaN。同时验证阶段会报 shape 不匹配，提示 capacity padding 后的 hidden size 没对齐。用户想两种特性并存来同时控显存和保负载均衡，这条组合目前给不出可用结果。
  discovery: 2026-10-21 每日扫描
