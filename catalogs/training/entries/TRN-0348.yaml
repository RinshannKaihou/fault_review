id: TRN-0348
legacy_ids: []
slug: msllm_capacity_auxloss_drop_denominator_nan
aliases: []
title: 专家容量 drop 与 aux_loss 并存致负载均衡 loss NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: mindspeed
    component: capacity drop + aux_loss
  behavior: drop与dropless策略在路由和aux_loss计算路径上互斥：drop下被丢token不计入aux_loss，分母偏小甚至为零；dropless下重路由后aux_loss的路由分布与实际专家计算分布不一致，梯度异常。
effect:
  objects:
  - 训练信号
  - 模型权重
  detail: 910C 上训练中途 loss 变 NaN；验证阶段 capacity padding/截断后的 hidden size reshape 也对不齐，报 shape 不匹配。
  visibility: 数值异常
mitigation:
  detect: 分别只开 capacity 或只开 aux_loss 做 A/B；打印 aux_loss 的分母 token 计数
  fix: 'issue #1399（closed）给出方案：drop 下 aux_loss 只算未 drop 的 token、dropless 下 aux_loss 按 pre-capacity 原始路由分布算；或对参数组合直接报冲突'
