- url: https://github.com/modelscope/ms-swift/pull/10451
  kind: github_pr
relations: []
original:
  mechanism: 'ms-swift v5（dev-swift-v5 分支）PR #10451（merged 2026-10-29T02:49:32Z）修复四项之一 RL-04：FP32 参数加载覆盖与计算精度是独立维度，公共 builder（GRPO/PPO/在线蒸馏）此前未独立处理——显式 FP32 配置下计算精度被加载覆盖影响；早期实机实验配置虽写 BF16 但 mixed_precision=no 即发生在 RL-04 修复前。修复：BF16/FP16 配置保留对应 mixed_precision、显式 FP32 配置保持 no，覆盖公共 builder。验证：精度/shuffle CPU 回归通过（BF16/FP16/FP32、有/无 FP32 加载覆盖、真实 FSDP MixedPrecisionPolicy、真实 DataLoader 顺序/seed/epoch 复现与尾批保留）；修复后未重跑多卡训练（PR 自述），无 SGLang/异构/Megatron/续训完整实机验收。同 PR 的 RL-10（colocate 日志）、RL-14（prompt shuffle）与 sampler 分组为行为/资源面不属静默正确性。'
  source: https://github.com/modelscope/ms-swift/pull/10451
  behavior: swift v5 显式配置 FP32 的 GRPO/PPO/在线蒸馏训练，计算精度实际未按 FP32 运行（受参数加载覆盖影响被降混精）：训练照常跑、无报错，loss 与最终策略质量低于配置预期；配置 BF16/FP16 的用户不受影响，难从日志发现计算精度与显式配置不一致
  discovery: 2026-10-30 每日扫描
