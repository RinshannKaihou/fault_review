remarks: 10-29 曾整批留观（PR 叙事无独立 issue、实机验收未完成）；本轮改判依据：PR merged 入 dev-swift-v5（1666ec6d）+ 精度/shuffle CPU 回归通过 + RL-04 段叙事具体（FP32 加载覆盖与计算精度独立）。同 PR 的 colocate 分组/日志/顺序面不属静默正确性，不并入
