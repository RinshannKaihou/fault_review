  target: TRN-0178
original:
  mechanism: transformers 5 的 `AutoTokenizer` 对 `tokenizer_config.json` 里类名指向可从「类配方」重建的 tokenizer 类（如 `LlamaTokenizer`）时，**忽略 `tokenizer.json` 里存储的 pre-tokenizer**，按类默认行为重新构建——byte-level BPE 词表下所有空格/换行被丢弃：`"Solve it  step by step.\n\tx = 3"` → `"Solveitstepbystep.x=3"`。encode/decode 双向破坏，且**训练侧与 rollout 侧用同一套错误 token ids**，任何 train/rollout 一致性检查都拦不住。修复 PR 加了「AutoTokenizer 返回值必须与本地 `tokenizer.json` 原始 `tokenizers` 编码一致，不一致则按存储文件加载 `PreTrainedTokenizerFast`」的守卫；transformers 5.5.3/5.12.0/5.17.0 三版本复现。
  source: 'verl PR #8193（2026-10-13 open，未 merge；`tests/utils/test_hf_tokenizer_on_cpu.py` Llama 用例修复前挂、修复后过；Claude Code 辅助起草、作者本人测试）。https://github.com/verl-project/verl/pull/8193'
  behavior: 无 crash、无 NaN——prompt/验证文本/解码回复全部变成粘连文本，训练在**错误的 token 序列**上正常推进，训后模型行为静默劣化。与 SFT.01（train/serve 模板不一致）同族但根因更深一层：不是模板语义错位，是 **tokenizer 构建协议**在库大版本升级下静默丢失 `tokenizer.json` 的存储语义；与 SFT.13（逐消息 tokenization 丢 think 块）同为「序列恒等性在预处理层被破坏且一致性检查对两侧同错失明」。
  discovery: 2026-10-13 每日扫描
