remarks: '触发条件为 tokenizer_config.json 类名指向可由类配方重建的 tokenizer 类（如 LlamaTokenizer）。修复 PR（verl #8193，未 merge）加入守卫：AutoTokenizer 返回值必须与本地 tokenizer.json 的原始 tokenizers 编码一致，不一致则按存储文件加载 PreTrainedTokenizerFast。与 chat_template_train_serve_mismatch 同族但根因更深：不是模板语义错位，而是 tokenizer 构建协议在库大版本升级下静默丢失 tokenizer.json 的存储语义；与逐消息 tokenization 丢 think 块条目同为序列恒等性在预处理层被破坏且一致性检查对两侧同错失明。'
