id: TRN-0767
legacy_ids: []
slug: megatron_perform_rl_step_silently_ignored
aliases: []
title: pretrain 入口接受 --perform-rl-step 却静默不跑 RL
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: megatron-lm
    component: RL 参数注册/pretrain
  behavior: RL 参数对所有入口注册，但 perform_rl_step 只在 train_rl.py 读取；pretrain 入口不传 next_train_iterator，标志解析后无消费。
effect:
  objects:
  - 训练轨迹
  detail: 带 --perform-rl-step 的 pretrain 入口按普通预训练跑完，不执行 rollout/GRPO、无警告；RLConfig 校验仍生效（batch 不整除 128 报 GRPO 错、offload 开关改 grad_buffer）。
  visibility: 静默错误
mitigation:
  detect: 入口启动时断言：若 perform_rl_step 为真且未走 train_rl.py 的 hooks，直接报错；检查 RLConfig 校验是否误作用到预训练 run。
  fix: 未修复：issue 2026-11-09 closed as not_planned，0 评论，无 PR（未核实替代实现）
