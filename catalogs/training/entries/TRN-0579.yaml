title: MhcPreSinkhorn 无 premix 时 h_pre 梯度被丢弃
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MhcPreSinkhornPremix
  behavior: backward 在保存的 premix 为 None 时把 grad_pre 置 None，外部经 h_pre 回传的下游梯度被静默丢弃；no-premix 路径只归约内部 dPre，无法合并下游贡献
effect:
  objects:
  - 梯度
  detail: 两次调用链（首次 premix=None、下次消费其 h_pre）中 x/phi/alpha/bias 梯度不完整，训练静默错梯度
  visibility: 静默错误
mitigation:
  detect: 构造两次调用链仅从第二次的 h_in 反传，与纯 PyTorch 参考实现比对首次调用的梯度
  fix: 修复 MR https://gitcode.com/cann/ops-transformer/merge_requests/15097（open，未合入）：premix 缺省且有 grad_h_pre 时反向改用保存的 h_pre 作为 preMix 并把内部 dPre 以 float32 加回 gradPre，附回归用例与 PyTorch 参考比对（未核实合入）
