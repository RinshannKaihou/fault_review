  meta: 'stage: `sft/pretrain` · Cov: `NEW` · 置信度 `documented`'
  mechanism: Megatron `GPTModel.sharded_state_dict` 无条件 pop `output_layer._extra_state` 并 assert 为空——对「旧 GPT ckpt 只存 output 权重」的历史语义是对的，但量化框架把 per-module 量化 state 存在 `_extra_state` 里：**save 侧**直接崩（多元素 byte tensor 上 `and` 触发 ambiguous bool），**load 侧更糟**——同一方法也是 load plan 的依据，key 被 pop 掉后 saved state 被忽略，量化 output layer 被静默恢复成**未量化**权重。`MambaModel` 无此规则，因此 Mamba 系模型早已能 ship 量化 `lm_head`（Nemotron-3.5-Lightning-30B-A3B-NVFP4）而 GPT 系不能。修复 = 仅当占位符为空时才 drop，携带数据时保留。
  source: 'Megatron-LM PR #7086（Qwen3.6-35B-A3B：`lm_head` 509M params ≈ 35% per-token 权重读取，量化不可用即损失大头 decode 吞吐）。https://github.com/NVIDIA/Megatron-LM/pull/7086'
  behavior: 量化 `lm_head` 的 ckpt「加载成功」但量化语义已丢——训练/推理权重路径分叉，无 crash（save 面才崩）；与 CKPT.09（MXFP8 round-trip 丢 scale）同为量化 state 在存取路径上的静默丢失，本条丢的是**整个量化元数据条目**；与 CKPT.05（strictness 吞 unexpected key）同面：load plan 主动 pop 掉本应恢复的 key。
  discovery: 2026-09-05 每日扫描
