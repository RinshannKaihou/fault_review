  kind: gitcode_issue
relations: []
original:
  mechanism: cann ops-nn aclnnFusedLinearCrossEntropyLossGrad 高性能分支（softmaxOptional 非空）：maskedTarget 出现越界值（如 -1）时 kernel 直接用该值算目标下标，在 softmaxOptional 缓冲区外做 4 字节非法读+非法写；op_api 只校验 maskedTarget 长度不校验取值范围。关键在 -1 是词表并行场景的惯例合法输入——本分片无对应词时上游常置 -1，仓内自带 golden（tests/assets/golden.py）对同一参数写 masked_target.clamp(0,V-1)，即实现侧预期是「可能越界、按夹取处理」但 kernel 未实现。实测（A2 910B2×8、CANN 9.2.0，python ctypes）：BT=64,H=128,V=128,fp16，maskedTarget[0]=-1 时 inputGradOut/weightGradOut 各一整行（128 元素）与 CPU 标杆不符（maxabs≈1.5），msSanitizer 报同地址 4B illegal read+write（softmax 首地址前 4 字节）；对照组合法 maskedTarget 同命令 0 illegal。
  source: https://gitcode.com/cann/ops-nn/issues/7115（2026-10-21，open；含 ctypes 复现与 mssanitizer 实证）
  behavior: 词表并行训练用融合线性 CE 梯度算子且 maskedTarget 按惯例置 -1（本分片无该词）时，NPU 上该步 input/weight 梯度各有一整行静默错误，同时越界读写相邻显存；训练无报错继续跑，错误行随 batch 内容变化，表现为难复现的偶发梯度异常。
  discovery: 2026-10-22 每日扫描
