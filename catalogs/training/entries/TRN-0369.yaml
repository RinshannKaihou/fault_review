id: TRN-0369
legacy_ids: []
slug: opsnn_flceg_maskedtarget_oob_gm_rw
aliases: []
title: 融合CE梯度 maskedTarget 越界 GM 读写静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FusedLinearCEGrad 下标
  behavior: 高性能分支直接用 maskedTarget 值算目标下标，op_api 只校验长度不校验取值；-1 等越界值在 softmaxOptional 缓冲区外 4 字节非法读写。
effect:
  objects:
  - 梯度
  detail: maskedTarget 含 -1（词表并行惯例）时 inputGrad/weightGrad 各一整行与 CPU 标杆不符（maxabs≈1.5），rc=0。
  visibility: 静默错误
mitigation:
  detect: msSanitizer memcheck 检出 illegal read/write；golden 用例应覆盖 maskedTarget=-1。
  fix: 待定（issue open；仓内 golden 自身写 clamp(0,V-1)，实现需对齐夹取或显式校验）
