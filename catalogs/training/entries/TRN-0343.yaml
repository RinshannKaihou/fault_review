id: TRN-0343
legacy_ids: []
slug: opsnn_bn_grad_kahan_inf_nan_accumulator
aliases: []
title: BN 梯度 Kahan 补偿位 Inf-Inf 成 NaN 毒化累加器
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: KahanAdd/KahanAddReg 累加路径
  behavior: 部分和为 ±Inf 时 Kahan 补偿位 c=(t-sum)-y 算得 Inf-Inf=NaN，y=src-c 变 NaN 并跨调用毒化累加器；无 NaN lane 防护。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: 含 ±Inf 极值的 BN 反向梯度输入下，NPU 输出 NaN 而 golden/GPU 输出 ±Inf；该算子是 BN 训练梯度路径，输出 NaN 传播进反向梯度。
  visibility: 数值异常
mitigation:
  detect: 三方校验 cross_check 对含 Inf 用例比对（golden/GPU ±Inf vs NPU NaN）。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/12373（open）：c!=c 自比检出 NaN lane 并 Select 清零，非有限路径退化为 IEEE 普通加法（对齐 golden/torch.sum）；有限路径行为不变。
