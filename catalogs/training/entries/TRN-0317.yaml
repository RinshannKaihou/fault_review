original:
  mechanism: 'DeepSpeed safe_set_full_grad() 的 BF16 分支把替换梯度写入 staging param.grad，但 BF16_Optimizer 的 step 从独立的累加缓冲（accumulation buffer）读取：backward 与 step 之间经 safe_set_full_grad 做的梯度掩蔽/替换被静默忽略——写进去的梯度不参与更新。开启 immediate 累积（bf16.immediate_grad_update）且参数跨优化器分区时，该路径直接报形状错误（fail-loud 变体）。修复 PR #8856（open）把 setter 改为写既有完整累加缓冲、匹配 getter 的 BF16 检测，普通梯度与 ZeRO 分片梯度分支不变；回归覆盖两真实数据并行 rank、双累加模式、BF16 ZeRO-1 与 ZeRO-2 兄弟路径、矩阵与偏置参数、双累加微批、零/非零替换梯度，检查公开 getter 与 SGD 参数更新；附 CPU repro（Gloo 后端、无需编译 DeepSpeed ops）。训练侧影响：依赖梯度手术/掩蔽/替换的训练方法（如梯度裁剪定制、对抗训练、调试注入）在 BF16 下静默失效，更新使用未修改梯度。'
  source: 2026-10-18 GitHub deepspeedai/DeepSpeed PR https://github.com/deepspeedai/DeepSpeed/pull/8856 （open）
  behavior: BF16 DeepSpeed 训练中，在 backward 之后、optimizer.step 之前通过 safe_set_full_grad 修改梯度（掩蔽、置零、替换），训练照常运行、无报错无日志，但 step 实际使用的是修改前的原始梯度——梯度手术类操作静默失效。开启 immediate 累积且参数跨优化器分区时则直接抛形状错误。
  trigger_surface: DeepSpeed BF16_Optimizer + safe_set_full_grad 用户路径；ZeRO-1/2；immediate_grad_update 跨分区参数为 fail-loud 变体
  discovery: 2026-10-19 每日扫描
