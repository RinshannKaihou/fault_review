slug: deepspeed_bf16_safe_set_full_grad_wrong_buffer
aliases: []
title: BF16 safe_set_full_grad 写错缓冲致梯度掩蔽失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: safe_set_full_grad 分支
  behavior: safe_set_full_grad() 对 BF16 写 staging param.grad，而 BF16_Optimizer 从独立累加缓冲 step；backward 与 step 之间的梯度掩蔽/替换被静默忽略。
effect:
  objects:
  - 梯度
  - 优化器状态
  detail: BF16 训练下，backward 后、optimizer.step 前经 safe_set_full_grad 掩蔽/置零/替换梯度会被静默丢弃，更新用未修改梯度；梯度手术/掩蔽/替换类方法（如梯度裁剪定制、对抗训练、调试注入）失效。开启 immediate 累积且参数跨优化器分区时抛形状错误。
  visibility: 静默错误
mitigation:
  detect: 回归含两真实 DP rank、双累加模式、BF16 ZeRO-1 与 ZeRO-2 兄弟路径、矩阵/偏置参数、双累加微批、零/非零替换梯度，检查公开 getter 与 SGD 参数更新；CPU repro 脚本随 PR 附带（无需编译 DeepSpeed ops）
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8856 （open 2026-10-18 未合入）：setter 改写既有的完整累加缓冲，匹配 getter 的 BF16 检测；普通梯度与 ZeRO 分片梯度分支不变
