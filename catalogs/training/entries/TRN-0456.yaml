id: TRN-0456
legacy_ids: []
slug: inplace_adagrad_v2_tail_accum_and_tiling_overflow
aliases: []
title: AdagradV2 尾块 accum 错值与 tiling 溢出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: InplaceApplyAdagradV2
  behavior: kernel 端 accum UB 搬运用裸三参 DataCopy（按 32B 向下取整），numel%8≠0 时尾部元素被丢弃、回写取到错误数据；tiling 端 coreNum 计算另有有符号乘法溢出。
effect:
  objects:
  - 优化器状态
  - 训练轨迹
  detail: 参数元素数非 8 对齐时 accum（二阶矩）输出尾部 numel%8 个元素为错值（135/135 用例零例外，var 输出恒正确），单元素张量即触发；优化器状态静默错位后训练轨迹偏离。
  visibility: 静默错误
mitigation:
  detect: 对 numel%8≠0 参数检查 accum 尾部与 golden；TTK/GEIR 双通路失败集逐名一致可定位 kernel
  fix: 待定（issue 给出修复方案：搬运长度向上取整到 32B、按真实长度回写；未见修复 MR）
