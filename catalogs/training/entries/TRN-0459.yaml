title: acos_grad tiling 混 dtype 错读与块参数回绕
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: acos_grad tiling（arch35）
  behavior: tiling 只校验输入 y 的 dtype，dy/z 一致性未校验，kernel 按 y 的模板类型解引用 dy/z，混合 dtype 错读；块参数先运算后窄化 uint32，超大 shape 回绕只覆盖前 512 元素。
effect:
  objects:
  - 梯度
  detail: y=fp32、dy=fp16 的 AcosGrad 被静默放行产出错梯度；元素总数 ~2^41 量级时只算前 512 个元素其余保持旧值，均无报错。同族 asin_grad 已正确校验且全程 int64 可对照。
  visibility: 静默错误
mitigation:
  detect: 对 dy/z dtype 组合与超大 totalLength 构造负例校验 tiling 拒绝；对照 asin_grad
  fix: 待定（建议对齐 asin_grad：校验 dtype 一致、块参数全程 int64 并校验值域，未见修复 MR）
