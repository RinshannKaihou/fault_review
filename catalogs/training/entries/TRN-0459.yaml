original:
  mechanism: 'cann/ops-math #4085+#4087（open，Ascend 950/arch35，CANN 9.3.0，源码级分析）：#4085 acos_grad tiling 层 GetShapeInfo 仅 GetInputDesc(0)(y) 参与 dtype 校验，dy 与输出 z 的 dtype 全链未校验；kernel（op_kernel/arch35/acos_grad.h）以 y 驱动的单一模板类型 T 直接解引用 dyGm_/zGm_ 无 Cast，y=FLOAT32 而 dy=FLOAT16 的混合组合被静默放行，kernel 按 fp32 步长读 fp16 缓冲产出无报错错误结果；同族 asin_grad（GetShapeAttrsInfo）已显式拒绝不一致组合、canndev 基线图级 IMPLEMENT_VERIFIER(CheckTwoInputDtypeSame) 拒绝。#4087 CalcBlockParams 存在 coreNum/blockFormerRaw/blockFormer/blockNum 四处 int64 先运算后窄化 uint32，totalLength 达 2^41-511 时 CeilDiv 结果越过 uint32 边界回绕、blockNum=1 只覆盖前 512 元素且返回 GRAPH_SUCCESS；比较与兜底位于窄化之后无法纠正；全链无 totalLength 上界校验；asin_grad tiling 参数全链 int64 无此问题。推理库同源条目 INF-2201（#4087 面已收）；训练侧 acos_grad 为激活反传算子，本条合并两缺陷面按训练范围收录。'
  source: GitCode issues：https://gitcode.com/cann/ops-math/issues/4085 （dtype 一致性校验缺失，open）、https://gitcode.com/cann/ops-math/issues/4087 （块参数窄化回绕，open）；推理库同源条目 INF-2201
  behavior: 训练反传经过 AcosGrad 时：若 dy 与 y dtype 不一致（如 fp32 y 配 fp16 dy），tiling 不报错，kernel 按错误步长读缓冲，产出无报错的错误梯度；若反向张量元素总数接近 2^41（超大 shape），tiling 回绕后只算前 512 个元素、其余保持旧值，接口仍返回成功。两种情况训练都不会崩，梯度悄悄错，同族 asin_grad 路径则正确拒绝。
  discovery: 2026-10-27 每日扫描
  notes:
  - '2026-10-28 2026-10-28 回访：acos_grad 加固 MR !6747（open，updated 10-27T20:41Z）覆盖 tiling/Host 推理层输入校验补齐（dy/z dtype 一致性与块参数窄化相关整改）、错误码归位；issue #4085/#4087 仍 open。'
