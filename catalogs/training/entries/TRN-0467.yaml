id: TRN-0467
legacy_ids: []
slug: torchnpu_910_pageable_d2h_sync_contract_break
aliases: []
title: 经典 910 pageable D2H 同步契约失效读垃圾值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: pageable D2H copy_ 同步
  behavior: copy_(npu, non_blocking=False) 的同步契约（返回即数据完整）在进程此前执行过 pinned 分配与 Event/Stream 序列后失效：返回即读 pageable 目标拿到未就绪垃圾值；上下文依赖。
effect:
  objects:
  - 数值结果
  detail: 经典 910（CANN 9.1.0/torch_npu 2.7.1）上嵌入 pin/event 序列后的 D2H copy_ 即读得 -1.05e-21 级垃圾值；950PR（torch_npu 2.9.1）同探针 0 发现。训练 host 读 loss/指标/权重快照可能拿到部分传输值。
  visibility: 静默错误
mitigation:
  detect: 关键 D2H 读数前显式 torch.npu.synchronize() 对比；pageable 读回值做 sanity 校验
  fix: 待定（issue 期望契约不因进程历史失效或文档明示需显式 synchronize；源码定位未给出，open）
