original:
  mechanism: 'Ascend/op-plugin #644（open，2026-10-26，经典 910/CANN 9.1.0/torch_npu 2.7.1/aarch64）：Tensor.copy_(npu_tensor, non_blocking=False) 契约为同步阻塞（返回即数据完整落 host）。探针电池（probe_pinned_sem.py）中 b01-b06 的 pin_memory 分配/H2D 非阻塞/Event 记录同步序列之后，b07 的 24 元素 NPU 张量→pageable host copy_ 返回后立即读取拿到未就绪数据（-1.05e-21 垃圾值，期望 0.36…）；隔离的最小循环（30 次纯 copy_ 即读）全部通过——缺陷上下文依赖，疑似此前 Event/Stream 池状态影响 D2H 同步路径。950PR（torch_npu 2.9.1）同探针 b07 findings=0，经典 910 特有。垃圾值形态为非旧值非全零的部分传输数据。源码级根因未定位（issue 为探针报告）；期望契约不因进程内历史失效，或文档明示该场景需显式 torch.npu.synchronize()。'
  source: GitCode issue：https://gitcode.com/Ascend/op-plugin/issues/644 （open，含探针电池路径、b07 复现代码与 30/30 阴性对照）
  behavior: 在经典 910 上做 NPU→CPU 张量拷贝（non_blocking=False）时，只要这个进程先前做过 pinned memory 分配和 Event/Stream 操作（训练脚本常见：DataLoader pin_memory + 事件计时），copy_ 返回后马上读 host 张量会读到没传完的垃圾值（如 -1.05e-21），而不是刚算出来的数。训练里所有『拷回 host 打印 loss/存指标/取权重快照』的读数都可能悄悄错；单独跑拷贝循环则完全正常，极难复现定位。
  discovery: 2026-10-27 每日扫描
