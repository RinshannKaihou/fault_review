original:
  mechanism: 'MindSpeed-LLM issue #1599（2026-07-08 提，已 closed）：CP=2 的 sequence parallel attention + rotary position embedding，rank0 负责 token 0~2048、rank1 负责 2048~4096。排查发现 rope 的 position id 初始化错：rank1 的 cos/sin 实际用的是 position 0 起的表。根因在 parallel_state.py 的 _set_global_rank_indices —— CP 的 rank offset 计算依赖 cp_size 和 tp_size，当 tp_size=1 时 cp_rank 的 offset 计算有 corner case（伪代码：if tp_size > 1: cp_offset = cp_rank * (seq_len // cp_size) else: cp_offset = 0），即 TP=1 时根本没设 cp_offset。所以 CP=2、TP=1 时两个 rank 的 rope 都从 0 开始，等效于没有 CP。报告者建议把 cp_offset 的计算和 tp_size 解耦，CP offset 只取决于 cp_rank 与 cp_size。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1599
  behavior: 跑 CP=2 的 sequence parallel attention（TP=1）时，rank0 与 rank1 的 attention 输出在 CP 切分边界附近的 token 上对不上；进一步看是 rank1 的 rope cos/sin 用了 position 0 开始的值，而不是从 2048 开始。训练不报错、不出 NaN，只是精度与单卡/CP=1 对齐不上，长序列位置语义整体错位。
  trigger_surface: context parallel + TP=1 + RoPE（CP 切分下的 position id 初始化）
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
