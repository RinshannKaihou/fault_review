title: CP+TP=1 时 RoPE position offset 恒为 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindspeed-llm
    component: CP 下 RoPE position id 初始化
  behavior: cp_rank 的序列偏移依赖 tp_size 分支：TP>1 才按 cp_rank*(seq_len//cp_size) 算，TP=1 时置 0，两个 CP rank 的 rope cos/sin 都从 position 0 起。
effect:
  objects:
  - 数值结果
  - 隐状态
  - 训练轨迹
  detail: CP=2、TP=1 且启用带 RoPE 的 sequence parallel attention 时，两个 rank 的 attention 输出在 CP 切分边界附近对不上；训练不报错、不出 NaN，精度与单卡/CP=1 对齐不上，长序列位置语义整体错位。
  visibility: 静默错误
mitigation:
  detect: 打印各 CP rank 首个 token 的 position id 与 rope cos/sin 头部值，按 cp_rank*(seq_len//cp_size) 对账；或对比 CP=2 与 CP=1 的 token 级 hidden state。
  fix: issue 建议把 cp_offset 的计算与 tp_size 解耦，只由 cp_rank 与 cp_size 决定；issue 已 closed，正文未给出对应 PR（未核实）。
