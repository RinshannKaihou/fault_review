  meta: 'stage: `pretrain` · Cov: `NEW` · 置信度 `documented`'
  mechanism: MoE 训练中 router（gating 网络）与 backbone 同步更新构成正反馈：论文原表述「spike 的出现与 MoE 层 outlier 一致相关，且 routing 机制本身加剧这些 outlier 的涌现」——outlier 放大路由扰动、路由扰动再催生 outlier，恶性循环以 loss spike 爆发。DeepSeek-V4 的缓解是 **Anticipatory Routing**：step t 的特征计算用当前参数 θ_t，路由 index 用历史参数 θ_{t−Δt} 计算并缓存（数据在 t−Δt 提前取、路由 index 预计算后回放），从而解开两条网络的同步更新；生产部署为 spike 自动检测 → 短 rollback → 仅 spike 期间启用，额外 wall-clock 开销约 20%，据称不损模型性能。
  source: 'DeepSeek-V4 technical report §4.2.3 "Mitigating Training Instability — Anticipatory Routing"，arXiv:2606.19348（1.6T / 284B 双模型 32T token 预训练的一手生产经验）；torchtitan RFC #4349 提议把该技术引入 torchtitan，动机段复述同一机制（spike 常需 rollback，否则 derail run 或被迫保守超参）。https://arxiv.org/abs/2606.19348 · https://github.com/pytorch/torchtitan/issues/4349 ；RFC #4495（2026-09-06 补：具体实现草案——`anticipatory_cache`/`anticipatory_indices` 瞬态运行时属性 + prefetch→replay→forward-only 编排，显式禁用与 PP/CUDA graph 的组合；另见 #4494 揭示的 hook 容器盲区 MOE.09——同一 RFC 落地时的作用域陷阱已在真实代码出现）。https://github.com/pytorch/torchtitan/pull/4495'
  behavior: 反复 loss spike、常需 rollback，否则 derail run 或收敛到保守超参；无 crash。与 MOE.01（router 熵塌）区分：这里路由**功能正常**，病根是路由与主干**更新耦合**放大 MoE outlier。
  discovery: 2026-09-01 每日扫描
