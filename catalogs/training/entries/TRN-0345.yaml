original:
  mechanism: ms-swift 请求感知 GRPO 路径（dynamic_num_samples=True，多轮调度器每个 request 产出多个训练样本）存在两个静默数值缺陷（issue 检查于 main 5c7f3ae，CPU 复现）：(1) compute_advantages 实现了 GDPO（先按 reward 函数分组归一化再 batch 归一化），但 compute_advantages_dynamic（swift/rl_core/advantage.py）只处理 'batch'/'group'，scale_rewards='gdpo' 落入 no-scaling 分支返回纯 mean-centered reward 和，且无任何拒绝或告警——同数据（4 生成×3 prompt，reward=[acc∈{0,1}, bonus∈[0,10]]，一 request 一样本，两路径本应一致）下 gdpo 时两函数输出不一致（首值 -1.895/0.461/1.038 vs -2.786/-0.320/0.930），group/batch 时一致。(2) 本地 batch 大于 per_device_train_batch_size 时 _compute_loss_chunked 返回 sum(chunk_loss*n_c)/sum(n_c)（n_c 为块内序列数）：这对 grpo/dr_grpo 正确，但 cispo/dapo/fipo（WINDOW_NORMALIZED_LOSS_TYPES）每块已除以全局 num_items_in_batch，应求和；加权平均把 loss/梯度缩放 n_c/N，k 个等大块时结果是无分块 loss 的 1/k，即分块一触发学习率静默变小；bnpo（token 均值）应按 token 数而非序列数加权。报告者注明该路径已计划移除，在移除前仍在用。
  source: https://github.com/modelscope/ms-swift/issues/10405（2026-10-20，open，0 评论，含同数据两函数对照表与分块缩放推导）
  behavior: 用 dynamic_num_samples=True 训 GRPO 时，若配置 scale_rewards='gdpo'，实际 advantage 悄悄变成无归一化版本（与静态路径同数据对照数值显著不同）；当单卡 batch 超过 per_device_train_batch_size 触发 loss 分块时，dapo/cispo/fipo 类损失被静默缩小（等分 k 块时缩为 1/k），等效学习率下降，训练曲线无任何报错或异常标记，只有收敛变慢或最终质量偏差可间接观察到。
  discovery: 2026-10-21 每日扫描
  notes:
