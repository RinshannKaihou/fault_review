id: TRN-0345
legacy_ids: []
slug: mswift_dynamic_num_samples_gdpo_ignored_chunk_rescale
aliases: []
title: ms-swift 动态 GRPO 丢 gdpo 归一化且分块重缩放 loss
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: ms-swift
    component: 动态 advantage/分块 loss
  behavior: 动态路径的 advantage 函数未实现 gdpo 分支而静默退化为无缩放；分块 loss 按样本数加权平均，把已按全局 token 归一的窗口归一化损失再除以块数，梯度被静默缩小。
effect:
  objects:
  - 训练信号
  - 梯度
  detail: dynamic_num_samples=True 时 gdpo advantage 与静态路径不一致（实测 -1.895 vs -2.786）；本地 batch 触发分块时 dapo/cispo/fipo 损失缩为 1/k，等效学习率静默下降，无报错。
  visibility: 静默错误
mitigation:
  detect: 对同一批数据并行跑 compute_advantages 与 compute_advantages_dynamic 比对（gdpo 分支应一致）；分块前后 loss 数值比对（窗口归一化类应相等而非 /k）。
  fix: 待定（issue 建议支持 gdpo 或拒绝该组合；分块对窗口归一化类求和、bnpo 按 token 数加权；该路径已计划移除）
