- url: https://github.com/NVIDIA/Megatron-LM/pull/8520
  kind: github_pr
relations: []
original:
  mechanism: NVIDIA/Megatron-LM !8520（open 修复载体；10-31 首见留观，48h 无维护者回应本轮按计划收录）。MoE aux loss 的全局步数计数器 buffer 以 fp32 注册，Float16Module 把模块参数与 buffer 一并 cast：bf16 下计数到 256 后 256+1 舍回 256（bf16 256 处 ulp=2）永久停滞；fp16 下计数溢出 inf。#7081 已修复同机制的 local 计数器，这两个全局 buffer 漏网。影响：aux loss 权重按 ga_steps 计算的退火配方失效（长跑>256 步才可见）、fp16 下 aux loss 直接 inf。
  source: NVIDIA/Megatron-LM https://github.com/NVIDIA/Megatron-LM/pull/8520（open 修复载体）
  behavior: bf16 精度的 Megatron MoE 预训练跑长一点（几百步以上）时，aux loss 用的全局步数计数器被 cast 成 bf16 后加到 256 就再也不涨——aux loss 权重不再按步数退火，路由负载均衡压力与配方设计静默偏离；fp16 配置下该计数器还会溢出成 inf 直接污染 aux loss。训练不崩、loss 曲线看不出明显异常，只有读 ckpt 里的计数器值或对比路由分布演化才能发现。
  discovery: 2026-11-03 每日扫描（10-31 留观转收：core 复核 comments=0 维护者缺陷确认无、48h 窗口到点，按 11-01 报告计划收录）
