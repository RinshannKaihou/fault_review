  mechanism: Triton/编译器在合法 API 下同步范围错了，MMA 未完成就读，或 `inline_asm_elementwise` 对复制元素执行多次副作用。训练 GEMM/attention 会吃到有界错值。**训练框架同型实例（2026-08-20 补）**：Megatron grouped fused MLP 的 TP=1 路径，两个未注册执行视图（normalization 视图 + fused MLP 视图）共享 FC1 参数存储，descendant pre-forward hook 只在 fused 边界转发 → 开 distributed-optimizer 参数 gather 时，normalization 可以在 FC1 参数同步 hook 运行**之前**读到旧存储——纯控制流/事件序错值，数值本身全对。
