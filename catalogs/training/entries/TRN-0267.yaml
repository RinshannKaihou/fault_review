id: TRN-0267
legacy_ids: []
slug: kto_unpaired_single_label_blocks
aliases: []
title: trl KTO 成对数据集拆成单标签整块 batch
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: trl
    component: KTO 成对数据集 unpair 分组
  behavior: 成对 KTO 数据集按文档路径进入 trainer 时被 unpair 成 desirable/undesirable 各自连续的大块，数据加载层未打散标签块，绝大多数 micro-batch 内只有一种标签。
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: 配对数据集按文档用法训练时 300 batch 仅 2 个混合双标签；多数步无 rewards/margins，块内 KTO 对比统计退化；训练静默完成无报错；手工 unpair+shuffle 后 295/300 混合、指标恢复。
  visibility: 质量退化
mitigation:
  detect: 在数据加载层检查每个 micro-batch 的标签构成（含两种标签的 batch 占比），0% 混合即报警。
  fix: '修复 PR #7684（2026-10-13 closed unmerged，未落地）：unpair 后按 args.seed shuffle 打散标签块（IterableDataset 无 shuffle 保持原样）。当前 workaround：构造 trainer 前自行 unpair_preference_dataset + shuffle。https://github.com/huggingface/trl/pull/7684'
