  mechanism: verl `rloo` 与 `rloo_vectorized` 文档声明可互换、等价测试也绿，但对**单样本组**行为相反：标量版 `if response_num > 1` 让 singleton 保留原始分数（GRPO 同约定：mean=0/std=1 归一后原分数存活）；向量化版 `loo * (c > 1)` 把这些行**乘成 0**。`rollout.n == 1` 时每组都是 singleton → advantage 全零张量、策略无梯度；过滤后组内只剩一条幸存样本的 ragged 组同样中招。
  source: 'verl #7581（等价测试 `_make_group_index` 断言每组 ≥2 样本，**恰好绕开唯一不存在 leave-one-out baseline 的组规模**；修复 `torch.where(c > 1, loo, scores)`，红→绿 3 failed→30 passed）。https://github.com/verl-project/verl/pull/7581 ；verl #7793（2026-09-10 补：同机制的独立 issue——overlong/dynamic filtering 把组内滤到只剩一条时，向量化版末尾 `* (c > 1)` 把 advantage 乘成 0，标量版 `id2mean = 0` 分支让幸存样本保留原始分数；报告者验证多样本组的 leave-one-out 代数两边等价，仅 singleton 分歧行为，与 GRPO singleton 约定 mean=0/std=1 一致的是标量版）。https://github.com/verl-project/verl/issues/7793'
  behavior: 无报错、无 NaN；`n=1` 的 RLOO run「正常训练但永远不学习」——advantage 恒 0 下 loss 仍有限、指标齐全。#7793 面向**过滤后**的 ragged singleton：模型对被过滤路径之外的幸存 rollout 也拿不到梯度。与 RL-ADV.01（组内无对比零信号）同族，但机制在**向量化掩码错杀非退化组**：分数本可用，被实现乘没了；`n` 从不与估计器选择做校验。
  discovery: 2026-08-30 每日扫描（#7793 来源 2026-09-10 补）
