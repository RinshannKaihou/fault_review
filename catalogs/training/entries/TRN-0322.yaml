original:
  mechanism: Ascend op-plugin（torch_npu 2.7.1.post4 + CANN 9.1.0，Atlas A3 910_9362×2）的 pad_packed_sequence 输出转换层不清零 pad 填充区域：pack_padded_sequence → pad_packed_sequence 往返后 pad 区残留「原输入同一位置的旧值」（恒等拷贝级错误，即往返未改写这些槽位）；索引面（sorted_indices/unsorted_indices）全部正确，错值只在 pad 数值区。issue（2026-10-19，open）建议转换层对 pad 区域清零；复现脚本 A3 真机 /mnt/workspace/a3hunt/round7/。训练侧收录依据：变长序列训练（RNN/LSTM/GRU + pack_padded_sequence）是标准负载，pad 位脏值在池化/loss 累计路径静默污染训练。推理库未收录该来源（find 核对 count=0），无需 cross。
  source: https://gitcode.com/Ascend/op-plugin/issues/604
  behavior: NPU 上对 pack_padded_sequence 的结果调 pad_packed_sequence（batch_first 两种均）后，pad 区域不是 0 而是进入 pack 前张量同位置的旧值；变长训练里 pad 位参与池化或 loss 时，训练数值被静默污染、无报错；索引信息全对，只有 pad 数值错。环境：CANN 9.1.0、torch_npu 2.7.1.post4、Atlas A3，双芯一致复现。
  trigger_surface: torch_npu + CANN 9.1.0（A3）pack_padded_sequence→pad_packed_sequence 往返的变长训练/RNN 路径。
