id: TRN-0312
legacy_ids: []
slug: opstransformer_swiglu_mx_scale_tail_pad_stale
aliases: []
title: CANN SwiGLU MX scale 行尾填充槽残留旧值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: SwiGLU MX scale 写回
  behavior: SwiGLU MX scale 每行按 64 输出元素存一对 K32 scale；有效 K32 分组数为奇数时，行尾完整填充槽未被覆盖，输出缓冲区旧值残留。
effect:
  objects:
  - 数值结果
  - 模型权重
  detail: 无报错。下游按行读取 scale 时把残留旧字节当成合法 scale 编码消费，量化权重/激活 scale 在奇数 K32 分组的行上来自未定义的旧内存；主机级验证为 padding 槽保留非零哨兵，硬件端到端数值精度未验证。
  visibility: 静默错误
mitigation:
  detect: 将 scale 输出缓冲区预填非零哨兵，跑奇数有效 K32 分组宽度（outputN=32/96）检查行尾 padding 槽是否为零。
  fix: 修复 MR https://gitcode.com/cann/ops-transformer/merge_requests/14006（open）：HasSwigluMxScalePadding 判定尾块归属，尾 tile 清零 staging 并把写回长度加一字节；主机单测覆盖 outputN=1~1024×tileSize=32/64/128/256，未验证设备数值精度
