id: TRN-0825
legacy_ids: []
slug: npu_grad_scaler_new_scale_tensor_alias_inplace_rewrite
aliases: []
title: GradScaler new_scale 别名致用户张量被改写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: torch_npu
    component: torch_npu GradScaler
  behavior: GradScaler.update(new_scale=Tensor) 用 self._scale = new_scale 直接别名而非拷贝；溢出回退的 self._scale.mul_(backoff) 就地把结果写回调用方张量。
effect:
  objects:
  - 优化器状态
  - 训练信号
  detail: update(new_scale=1024 tensor) 后用户 mul_(2) 会把 scaler scale 带到 2048；一次溢出回退后 scaler 与用户张量同为 512，用户张量被原地改写，全程无异常。
  visibility: 静默错误
mitigation:
  detect: update(new_scale=tensor) 后原地改该张量看 get_scale() 是否变化；再触发一次溢出回退，比较用户张量前后值
  fix: '待定（issue #6438 closed，2026-11-25，正文给最小修复 self._scale.copy_(new_scale) 并对照 sharded_grad_scaler.py:371，但未见关联 PR；master b707a3665 仍有缺陷）'
