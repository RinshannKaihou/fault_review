original:
  mechanism: 'huggingface/trl #8056（2026-11-01 open，torchrun 2 卡 TP=2 复现）。张量并行下 TP 组各 rank 共持一个模型、accelerate 给同组相同 batch，但 GRPOTrainer.__init__ 调 set_seed(args.seed, device_specific=True)（种子加全局进程索引）重播种，导致同组各 rank 各自采样自己的 completions。复现中 reward 函数对 TP=2 组两 rank 的 completions 做 all_gather_object 比对，agreement 为 False。GRPO/RLOO 组统计（advantage 归一化、组内对比）因此建立在各 rank 互相矛盾的样本视图上。另提到 prompt sampler 按每进程尺寸的问题。'
  source: huggingface/trl https://github.com/huggingface/trl/issues/8056（open，含 TP=2 复现脚本）
  behavior: GRPO/RLOO 开张量并行（TP>1）训练时，同一个 TP 组里每个 rank 都各自采样出不一样的 completions——用 all_gather 把组内 completions 拉到一起比对直接不相等。训练不报错，但 reward 和 advantage 的组统计是在各 rank 互相矛盾的样本上算的。
  discovery: 2026-11-02 每日扫描
