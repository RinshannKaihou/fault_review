id: TRN-0385
legacy_ids: []
slug: torchair_cache_compile_pass_state_digest_collision
aliases: []
title: torchair cache_compile 忽略自定义 pass 状态复用旧图
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: cache_compile code digest
  behavior: _get_code_digest 只哈希反汇编指令：捕获值/默认参/partial 绑定不同的 pass 产生相同 digest（partial 可 dis 为空、全部变体折叠成空文本 MD5），改 pass 行为后命中旧缓存图
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: NPU 上用 torch.compile + cache_compile 缓存编译自定义 post-grad pass 时，改 pass 行为（如调整捕获的偏移量）后重新编译不报错，实际复用先前编译的图而非应用新 pass，训练图静默用旧逻辑；只有清缓存或改函数体指令才恢复，改绑定状态无效。
  visibility: 静默错误
mitigation:
  detect: 改 pass 绑定状态后断言 cache miss；对关键 pass 输出做图 hash 抽查
  fix: 修复 MR https://gitcode.com/Ascend/torchair/merge_requests/3886（open，2026-10-22）：digest 纳入闭包 cells、defaults、partial 绑定、实例状态；探针红转绿，回归覆盖 closure/default/partial/callable；NPU 端到端编译未跑
