original:
  mechanism: Ascend/torchair cache_compile 把自定义 post_grad_custom_pre_pass/post_grad_custom_post_pass 纳入 cache key，但 _get_code_digest() 只哈希反汇编的可调用指令：捕获值不同的闭包、默认参不同的函数、绑定参数不同的 functools.partial 可产生相同 digest；partial 的 dis.dis() 可能什么都不输出，所有变体折叠为空文本的 MD5。CPU-only 探针在 master 上 closure_same=True、partial_same=True。影响：首个 pass 编译并缓存后，改 pass 行为（如调整捕获的偏移量）会复用先前编译的模型图而非应用新 pass——训练图静默用旧 pass 逻辑。修复 MR !3886（open）把闭包 cells、defaults、partial 绑定、bound instance 与 callable-object 状态纳入 digest，同探针红转绿，回归覆盖 closure/default/partial/callable-object；等价状态仍保持 cache 命中；NPU 端到端编译未跑。torchair 是 torch.compile NPU 后端，自定义 pass 用于图优化/算子替换，实验性训练管线常用。
  source: https://gitcode.com/Ascend/torchair/issues/890（2026-10-22，open）+ 修复 MR https://gitcode.com/Ascend/torchair/merge_requests/3886（open）
  behavior: NPU 上用 torch.compile + torchair cache_compile 缓存编译，训练代码里自定义了 post-grad 优化 pass：迭代实验中改了 pass 的行为（改闭包捕获的阈值/偏移、换 partial 绑定参数）后重新编译，程序不报错、看似生效，实际命中的还是旧 pass 编译出的图——实验对比结论失真（A/B 两组跑的是同一个图），或新版修复/优化静默不生效。只有清缓存或改函数体指令才恢复，改绑定状态无效。
  discovery: 2026-10-23 每日扫描
  notes:
  - 2026-10-25 2026-10-25 回访：修复 MR !3886（include bound custom-pass state in cache keys）open，2026-10-24T22:58Z 仍有更新；未合入。
  - 2026-10-26 2026-10-26 回访：修复 MR !3886 open、2026-10-25T22:58Z 仍更新未合入。
