original:
  category: PAR
  section: PAR
  meta: 'stage: `pretrain` · Cov: `var:aux_loss_normalization_domain` · 置信度 `documented`'
  mechanism: Megatron `--global-aux-loss` 的 aux 梯度路径把全局（跨 microbatch 累积、已对 aux loss 归一化的）aux loss 梯度交给 DDP 归约——DDP all-reduce 带 `1/DP` 平均，而该梯度的语义是**每步一份的标量损失梯度**（每个 DP rank 对同一 aux loss 贡献同一份、不是各持 partial）：AVG 之后 aux 梯度被**缩小 DP×**（audit 实测 DP=2 时 norm 0.3794 vs 正确 0.7588）。#7452 Appendix C 列为「常数尺度误差、无数值 dataflow 见证不计数」；09-19 裁决收录——**「应 SUM 的语义量被 AVG」本身就是分布类型错**，与 MOE.11（分母时序域）同一 aux-loss 归一化语义域、不同断点（归约算子选择），报表者注明 Qwen3-Next Bridge recipe 选中该路径。审核方（0z5a，#7481 作者）已声明其修复**不覆盖**本项（`global aux-loss normalization` 是独立在跟踪的工作）。
  source: 'Megatron-LM #7452 Appendix C（2026-09-17；ezyang Astra+spmd_types 审计；DP=2 数值对照）。https://github.com/NVIDIA/Megatron-LM/issues/7452'
  behavior: 无 crash——**aux loss 的有效系数随 DP 度静默缩小 DP×**：负载均衡压力不足，专家分布漂向不均衡；DP 扩容（常用吞吐手段）即改变训练目标语义，且 loss 曲线不显任何异常。与 PAR.11 / PAR.15 / MOE.12 同族「并行度旋钮 × 恒定因子改梯度」，方向相反（缩小而非放大）；与 MOE.11 互补成对：同一 aux loss 的分子域（累积计数）与归约域（SUM/AVG）各有一个静默断点；与 PAR.05（退化 DP 组 2^N）都打击「对什么求平均」的假设，这边是**语义整体量被当可平均量**。
  discovery: 2026-09-19 每日扫描
  notes:
  - '2026-10-15 relink-unrecoverable: var 目标 ''aux_loss_normalization_domain'' 不可恢复——迁移的抽取模型编造了这个名字，它从未是任何条目的 slug/alias（证据与标定见 RAG normalize/relink/REPORT.md）。不要按它去找目标；父条目待人工判定。'
