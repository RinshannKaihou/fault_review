  mechanism: CANN ops-math aclnnStdMeanCorrection：N<=correction 且归约段方差为 0 时 stdOut 返回 +Inf。资料公式与 PyTorch 语义下该输入应为 NaN（0/0）。算子把除零结果按 +Inf 返回，调用方难以用 isnan 捕获，Inf 作为有效值静默传播进下游。issue open（2026-10-29 创建），标题即结论；正文细节以标题与资料对照为主。
  source: https://gitcode.com/cann/ops-math/issues/4246
