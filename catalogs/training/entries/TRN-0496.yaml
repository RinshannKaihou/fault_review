  detect: 构造 config 后断言 convert_to_transformer_config().rotary_scaling_factor == 源值；打印 attention scale 与 mscale/factor
  fix: 修复 PR https://atomgit.com/mindspore/mindformers/merge_requests/8888（open 草稿，2026-10-28）——透传 scaling_factor 到目标字段
