  meta: 'stage: `shared` · Cov: `NEW` · 置信度 `verified`'
  mechanism: 'DeepSpeed ZeRO-1/2 `step()`（`runtime/zero/stage_1_and_2.py:2791`）由 PR #8638 引入的第二条溢出判定 `is_invalid_grad_norm(scaled_global_grad_norm) → self.overflow = True` **不受 `bf16.check_grad_overflow` 门控**——该开关的文档语义是「检出梯度溢出/下溢并跳步」的 opt-out（默认 True）；`gradient_clipping > 0` 时 `compute_grad_norm` 被强制开启，而 #8638 的哨兵→overflow 规则落在 `self.check_grad_overflow` 块**之外**：`check_grad_overflow=False` + clipping 开启时 invalid-norm 仍置 `overflow=True` 跳步。修复 = 用 `if self.check_grad_overflow and is_invalid_grad_norm(...)` 把新规则关回用户开关之下。'
  source: 'DeepSpeed #8805（2026-10-12；逐行因果隔离：删除 L2791-2793 三行 `4 passed`、保留则 `4 failed`；`test_ignore_grad_overflow` 在 ≥2 rank 下断言失败——CI 恒绿是因为 cpu-torch-latest runner 单 rank 跳过全部 `world_size=2` 用例，2-rank job 114158646231 可复现）。https://github.com/deepspeedai/DeepSpeed/issues/8805'
  behavior: '无 crash——bf16 用户显式 `check_grad_overflow: False`（选「让 Inf 梯度直接进优化器」语义）时，clipping 开启即回到静默跳步 regime：**两种配置训练动力学不可区分**（`skipped_steps` 相同），文档承诺的 opt-out 失效且无任何警告。与 NUM.16（哨兵平方洗白溢出，#8638 所修）互补：那条是「坏 step 被放行」、这条是同一 PR 引入的「用户开关管不住新的跳步路径」；与 OBS.14（autocast z0 溢出跳步误记为已应用）同打击溢出路径的配置语义契约。任务影响未实测（multi-rank 单测断言已闭合证明行为分叉）。'
  discovery: 2026-10-12 每日扫描
  notes:
  - '2026-10-14 回访 2026-10-14：NVIDIA/DeepSpeed 维护者面（issue #8805）open；修复 PR #8818 open（10-13 更新）。#8806（multi-rank CPU CI）与 #5424（overflow 接口重构）为相关并行工作，均未落地。'
