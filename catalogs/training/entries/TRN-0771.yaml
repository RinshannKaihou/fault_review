title: torchtitan 并行化拆开 tied 权重致 embedding 不更新
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: torchtitan
    component: _spmd_distribute_state
  behavior: _spmd_distribute_state 注册 nn.Parameter，断开 tok_embeddings 与 lm_head 的别名；init_states 在 to_empty() 后才重新 tie，FSDP2 已按两份参数切分
effect:
  objects:
  - 模型权重
  - 梯度
  detail: vocab/tp 不能被 dp_shard*cp 整除时两份 tied 权重各打 padding，优化器只更新 lm_head 副本，padded shard 上的 embedding 行永不更新；无 padding 时 tied 权重被 all-gather/reduce-scatter 两次
  visibility: 静默错误
mitigation:
  detect: 对比 embedding 与 lm_head 权重在若干 step 后是否仍逐位相同；检查 FSDPParam 数量（tied 组应为 2 而非 3）与 padded shard 行的更新情况
  fix: 修复 PR https://github.com/pytorch/torchtitan/pull/6144（open，未合入）：在 _parallelize 中保持 tie，使 FSDP2 只看到一个参数
