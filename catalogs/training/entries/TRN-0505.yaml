original:
  mechanism: 'vllm-project/vllm-ascend #20146（2026-10-28，open）：V1 runner 构造 AscendSampler 时不转发 model_config.logprobs_mode，配置为 processed logprobs 的引擎仍以默认 raw 模式初始化采样器。动机负载是 MiniMax-M3.1-Flash RL：用不同处理口径的概率比较时训练/rollout 一致性度量改变。属通用 V1 配置缺陷，不限 MiniMax；默认 raw 模式与 MRv2 不变。内层采样器已把收到的模式转发给 AscendTopKTopPSampler（current main）；相关 #8643 是内层 callsite，本 PR 修 runner→sampler 这条独立边缘。作者做了构造函数回归（从完整 runner 源码提取真实赋值，覆盖四模式、缺省 raw 回退与安装的 sampler 对象）：修复代码通过，未改代码四模式断言全失败。CPU 隔离测试，未初始化完整 runner 或 NPU 后端。'
  source: https://github.com/vllm-project/vllm-ascend/pull/20146
  behavior: RL 训练（如 MiniMax-M3.1-Flash）用 vllm-ascend V1 runner 并配置 processed_logprobs/processed_logits/raw_logits 模式时，Ascend sampler 静默以默认 raw_logprobs 口径工作：rollout 侧报告的概率/logit 语义与配置不符，训推一致性度量（train/rollout logprob 对比）随之漂移——用户看到的是「一致性指标异常」而非配置未生效；无报错。修复后四种模式正确到达 sampler。
  trigger_surface: vllm-ascend V1 runner + model_config.logprobs_mode 非 raw_logprobs 配置 + RL 训推一致性度量负载（MiniMax-M3.1-Flash 实测动机）
