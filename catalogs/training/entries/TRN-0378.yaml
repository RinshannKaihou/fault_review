cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: MoeFinalizeRoutingV2/V3
  behavior: zero/copy/constant 三类特殊专家区间实现只存在于 950 arch35 路径，A2 绑定的 membase tiling 与 kernel 完全不读这三个属性、也不校验，接口已暴露但实现缺失
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: Atlas A2 上无论三类 range 取何值（含非法 end<start、超上限、区间重叠）均 rc=0 且输出与不传完全相同，按普通专家累加；期望 100.0/114.0/120.0 的用例实测全为基线 97.41
  visibility: 静默错误
mitigation:
  detect: 传任一 range 后断言输出与不传时不同；非法区间（end<start/重叠）应报 161002
  fix: 待定（issue 建议补 A2 实现或把资料 A2 改不支持二选一，并加 A2 回归用例）
