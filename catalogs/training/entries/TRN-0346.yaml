id: TRN-0346
legacy_ids: []
slug: msllm_kvcompress_fp32_compressor_recursed_cast
aliases: []
title: MindSpeed-LLM kv-compress 误压 fp32 权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: mindspeed-llm
    component: Float16Module 与 wkv/wgate
  behavior: 开 --kv-compress 时 Float16Module.__init__ 对整个模块递归 cast 到 bf16，把按 fp32 构造的 compressor wkv/wgate 一并降精（设计计算保持 fp32）。
effect:
  objects:
  - 模型权重
  - 训练轨迹
  detail: --kv-compress 训练 DeepSeek-V4 时 compressor 的 wkv/wgate 以 bf16 参与计算，与设计的 fp32 计算路径偏离，精度静默损失；无报错。
  visibility: 静默错误
mitigation:
  detect: 训练初始化后打印 compressor wkv/wgate dtype（应为 fp32）。
  fix: 修复 MR https://gitcode.com/Ascend/MindSpeed-LLM/merge_requests/5176（open）：新增 compressor2fp32_fp16module_init_wrapper，在 Float16Module.__init__ 后把 compressor wkv/wgate 重新 cast 回 fp32，经 CSAFeature.register_patches 按 --kv-compress 门控注册（沿用 dsa_indexer/mhc fp32-init wrapper 同款机制）；验证 py_compile + patch 叠加，NPU 端到端未运行。
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: ''
