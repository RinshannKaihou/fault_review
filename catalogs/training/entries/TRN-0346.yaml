  kind: gitcode_issue
relations: []
original:
  mechanism: MindSpeed-LLM 开启 --kv-compress 训练 DeepSeek-V4 时，Float16Module.__init__ 把整个被包裹模块 cast 到 bf16，其中 compressor 的 wkv/wgate 权重按 fp32 构造（checkpoint 存 bf16、计算路径设计保持 fp32，与 dsa_indexer/mhc 的 fp32-init 约定同类），被整模块递归 cast 一并降到 bf16，破坏该计算路径的精度设计。修复 !5176 在 tests/mindspeed_llm/tasks/models/transformer/deepseek4/compressor.py 增加 compressor2fp32_fp16module_init_wrapper：Float16Module.__init__ 之后把 compressor wkv/wgate 重新 cast 回 fp32；经 CSAFeature.register_patches（multi_latent_attention/csa_feature.py）按 --kv-compress 门控注册，patch 叠加沿用既有 decorator-attach 机制。验证：py_compile（两个改动文件）+ patch 叠加检查；无 NPU 端到端精度对照数据。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/merge_requests/5176（2026-10-20，open，无关联 issue，机制与修复在 MR 正文）
  behavior: 用 --kv-compress 在 MindSpeed-LLM 上训练 DeepSeek-V4 时，KV 压缩器的 wkv/wgate 权重悄悄变成 bf16 计算（设计为 fp32），训练全程无报错，精度损失只有通过逐层 dump 或最终模型质量对比才能发现；不开 kv-compress 或其他不受 wrapper 覆盖的路径不受影响。
  discovery: 2026-10-21 每日扫描
  notes:
  - '2026-10-29 2026-10-29 回访：用户报告 018 版 compressor dtype error（wkv/wgate 被 TELinear/Float16Module 降 bf16）与 #1927/#1933 系列同症状描述，closed（2026-10-21，1 日关闭），正文仅一句话无修复链接；与 !5176（TRN-0346 修复，10-23 轮巡已 merged）时间线吻合，按同机制补证据，修复状态维持已合入。'
  - '2026-10-30 2026-10-30 回访：MindSpeed-LLM #1933 closed 已 2 日，修复 !5176 merged 判定沿用（10-29）'
