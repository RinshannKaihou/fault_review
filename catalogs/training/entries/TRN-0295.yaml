original:
  mechanism: cann/ge 图编译/运行时的变量逻辑地址管理（graph_var_manager）：逻辑地址基址沿用 32GB 时代内存比例硬编码（Host FM 64GB、Host SVM 128GB、Var 128GB），而 HBM fm/weight 区间随物理内存按 26/32 比例增长——192GB 卡 fm 上限 156GB。运行时 GetRtAddress 按地址区间反查内存类型：fm 用量>126GB 时与 var 区间 [128GB,...) 重叠，变量地址被误判为 fm 地址（静默数据损坏）；fm>62GB 与 Host FM 区间重叠；Host SVM 与 var 基址同值 128GB，同图使用即冲突。修复 MR !5414（open）：按 256GB 步长重新累加划分（HBM [2GB,256GB)、Host FM [256GB,512GB)、Host SVM [512GB,768GB)、Var [768GB,992GB)），OM2 本地 var base 副本同步、var 判定宽度优先 OM 记录、新增 HBM 上界断言（weight 原无上限检查）；UT 全过（39/39、199/199、115/115、253/253、127/127），22 处 ST 硬编码同步，需真机 CI。
  source: https://gitcode.com/cann/ge/merge_requests/5414
  behavior: 大 HBM 机型（192GB/256GB 单卡）上训练/推理：当 feature map 用量越过旧区间边界（>62GB 或 >126GB）或同图使用 Host SVM 与变量时，变量地址被运行时误判成 fm 地址，产生静默数据损坏——输出错值无报错，且只在特定内存水位以上出现，小规模复现不出来；伴随非确定性表现，极易被误判为硬件或数据问题。
  discovery: 2026-10-16 每日扫描
