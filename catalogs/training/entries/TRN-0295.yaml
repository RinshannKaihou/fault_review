slug: ge_big_hbm_logic_addr_overlap_silent_corruption
aliases: []
title: GE 大 HBM 机型逻辑地址区间重叠致变量区被误判静默损坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: GE 逻辑地址基址按 32GB 时代比例硬编码
  behavior: 逻辑地址基址按 32GB 时代硬编码（FM 64GB/SVM 128GB/Var 128GB），HBM fm 区间按 26/32 比例增长（192GB 卡上限 156GB），GetRtAddress 反查内存类型时误判重叠。
effect:
  objects:
  - 数值结果
  detail: 大HBM单卡192/256GB训练/推理，feature map用量越过旧边界>62GB或>126GB，或同图用Host SVM与变量时，变量地址被误判为fm地址，输出错值无报错；特定内存水位以上出现，小规模复现不出，非确定性。
  visibility: 静默错误
mitigation:
  detect: 大 HBM 卡上出现无法解释的内存类型相关错值时，检查各内存类型用量是否越过 62/126GB 旧区间边界。
  fix: 修复 MR !5414（open 未合入）：按 256GB 步长重划逻辑基址（Host FM 256GB、Host SVM 512GB、var 768GB），var 判定宽度优先用 OM 记录值，新增 HBM 区间上界断言；UT 39/39 等通过、需真机 CI 验证。https://gitcode.com/cann/ge/merge_requests/5414
