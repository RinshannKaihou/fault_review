original:
  mechanism: Megatron-LM examples/mimo/model_providers/hf_whisper_encoder.py 的 HFWhisperEncoderWrapper 在 torch.no_grad() 下运行完整 HuggingFace Whisper encoder，之后才对 seq_lengths 布尔索引——即先做带 pad 的完整前向再掩码。而 Transformers 的 WhisperEncoder 忽略 attention_mask，且除非 mel 时轴为 3000（max_source_positions*conv1.stride*conv2.stride）否则抛错，因此无法直接喂变长：conv2（kernel 3、stride 2、padding 1）的边界帧会混合下一 mel 帧，且每个 query 仍 attend 到 pad 尾部；HF 对 log-mel pad 0.0，这不是 log-mel 域的静默值。issue 在 65ac8216 读码、main ce852bfb（2026-10-18）仍在；published AVLM recipe 默认对第一 clip 保持冻结 Whisper 塔（finetune 与 multi-clip 是默认关闭的 opt-in）。复现：CPU tiny WhisperEncoder 注入（无 from_pretrained），3000 帧 log-mel 前 13 帧为真实前缀、尾部垃圾，对比 wrapper 输出、测试内未 pad 主体、masked full forward——masked full forward 与未 pad 主体不同，wrapper 与 masked full forward 一致（即 wrapper 给的是含 pad 泄漏的特征）。修复方向（issue 详述）：forward(input_features, seq_lengths, feature_lengths) 按行裁剪至真实 mel 长度、逐行跑 conv1/GELU/conv2/GELU/positions/encoder.layers/layer_norm、S=(mel-1)//2+1 校验、拼接 [sum(S_i),H]；无维护者回应。
  source: 2026-10-18 GitHub NVIDIA/Megatron-LM issue https://github.com/NVIDIA/Megatron-LM/issues/8324 （open）
  behavior: 按默认 MiMo AVLM recipe（冻结 Whisper 塔）训练时，音频特征经完整 3000 帧 pad 前向再掩码取得：较短音频的 encoder 输出含有 padding 尾部泄漏（conv 边界混合 + 全 attention 看 pad 帧），与未 pad 的正确前向不同，无任何报错。冻结塔的这些偏差特征静默进入训练主干，多模态对齐质量受损而曲线不可见。
  trigger_surface: Megatron-LM examples/mimo hf_whisper_encoder；Transformers WhisperEncoder（要求 3000 帧、忽略 attention_mask）；默认 published AVLM recipe 冻结塔路径
