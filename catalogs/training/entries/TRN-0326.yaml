cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: mul 入口标量上卡
  behavior: mul/mul_out 在 result_type 为 half/bfloat16 时，将 CPU 0-dim 浮点标量按输出 dtype 上卡，H2D 时被提前舍入到 half/bf16。
effect:
  objects:
  - 数值结果
  detail: GPU/NPU 混合精度精度对齐训练中，CPU 0-dim 浮点标量乘卡上 half/bfloat16 张量时，mul 结果与 GPU 差 1 个 bf16 ulp（0.8476 vs 0.8515）；无报错、无 NaN，逐层 dump 比对暴露。
  visibility: 静默错误
mitigation:
  detect: 跨设备标量乘法与纯 CPU/GPU 参对照逐元素比对；精度对齐 dump 中 mul 节点单算子复测。
  fix: 修复 MR https://gitcode.com/Ascend/op-plugin/merge_requests/6062 （open 未合入未发布）：浮点标量且 result_type 为 Half/BFloat16 时改按 Float 上卡；mul(Tensor,Scalar) 与 mul_ 路径不受影响。910B2 + CANN 9.2.0 实测。
