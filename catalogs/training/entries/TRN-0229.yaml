slug: nucleus_truncation_is_bias
aliases: []
title: 截断采样 logprob 口径不一致致 IS ratio 偏置
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: rollout/trainer logprob
  behavior: top_p/top_k/min_p 截断采样时 vLLM 返回截断后重归一化分布的 logprob，trainer 重算全词表 log-softmax，温度对称处理而截断没有；AsyncGRPO 还直接拿它作 old_log_probs。
effect:
  objects:
  - 训练信号
  detail: 无 NaN、无 clip 迹象，IS ratio 带逐 token 恒负偏置，off-policy 校正系统性失真；AsyncGRPO 中策略未动时 coef_1 即等于幸存质量（top_p=0.7→0.7），负优势 token 的 clip 每步误触发。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 'AsyncGRPO 修复方向（PR #7627，open 未 merge）：trainer 侧按与 sampler 相同的 top-k/top-p 候选集重归一化 log-probs（vLLM --return-sampling-mask 返回候选集，keep-sampling-mask 策略，DeepSeek-V3.2/prime-rl 同路线）。https://github.com/huggingface/trl/pull/7627'
