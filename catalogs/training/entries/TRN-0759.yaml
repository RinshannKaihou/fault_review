original:
  mechanism: cann/ops-math !7412（2026-11-13，open，PR 描述）。AcoshGrad 的输入 y 是前向 acosh 的输出，按链式法则反向应为 z = dy / sinh(y)；原实现写成 dy / sqrt(y*y - 1)，把前向输入 x 的公式套在输出 y 上，正常输入也会得到错误结果。PR 改为 dy/sinh(y)，并调整零点附近舍入顺序，FP16/BF16 中间舍入对齐 TensorFlow；同时补图模式动态 shape/未知 rank 推导、运行时 dtype 一致/元素数相等/输出 shape 校验，取消算子内部额外 rank/format 拦截、保留 ND 注册。验证：原精度用例 025/026 静态图与动态图 TTK PASS；容量用例 018/020 保持 2^31 元素；mssanitizer 扫描 43 条内核执行未检出错误；FP16/BF16/FP32 rank 1/8/9/17/25 共 15 组输出与 rank1 逐位一致。PR 未给修复前数值误差，也未声明硬件/CANN 版本，关联 issue 尚未填写。
  source: https://gitcode.com/cann/ops-math/merge_requests/7412
  behavior: 使用 acosh 作为前向、反向走 AcoshGrad 的训练图（自定义损失/激活）在正常有限输入上就会拿到错误梯度：梯度幅度与真值不符，但 loss 曲线、返回码、NaN 检查都正常。错误不依赖边界输入，也不报错，只有与 autograd 参考实现或 TensorFlow 对拍才能发现；修复后原精度用例 025/026 在静态图与动态图均 TTK PASS。
  trigger_surface: AcoshGrad 反向，任意正常有限输入；版本/硬件 PR 未写明（未知）。
  discovery: 2026-11-16 每日扫描
