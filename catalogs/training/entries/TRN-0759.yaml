title: AcoshGrad 用错前向输入反向公式致梯度错
kind: 故障
status: retired
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: AcoshGrad 反向公式
  behavior: AcoshGrad 把前向输出 y 当成前向输入，反向实现为 dy/sqrt(y*y-1) 而非 dy/sinh(y)，正常输入也会得到错误梯度。
effect:
  objects:
  - 梯度
  detail: acosh 反向在正常有限输入上梯度与真值不符；修复 MR 改为 dy/sinh(y) 并补 dtype/shape 校验，FP16/BF16 舍入对齐 TensorFlow，原精度用例 025/026 修复后 TTK PASS。
  visibility: 静默错误
mitigation:
  detect: 与 autograd/TensorFlow acosh 反向逐元素对拍；覆盖 y 接近 1 与大 y 两段。
  fix: 修复 MR https://gitcode.com/cann/ops-math/merge_requests/7412（open 2026-11-13，未合入）
