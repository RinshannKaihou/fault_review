  - 优化器状态
  detail: 恢复后首个更新用 t=2 而非 trained_steps+1：默认 betas 下偏差校正错，50 步检查点恢复后下一更新约 1.7 倍过大，loss 尖几个步骤后回到原曲线；矩与权重本身恢复正确。GPU 轮审实测 step 63 恢复成 1。
  visibility: 静默错误
mitigation:
  detect: 恢复后立即打印优化器 step（param_groups 与各 param state）与 trained_steps 对比
  fix: '待定（issue #8632 已 closed 2026-10-28，未见关联修复 PR；另一报告 #8622 open。建议对齐 fully_reshardable/fully_sharded_model_space 两加载器：丢弃 step 后再 _set_main_param_and_optimizer_states 并同步 HDO 状态）'
