original:
  mechanism: CANN ops-math aclnnExpSegsum（Atlas A2 910B2、CANN 9.2.0、master efff3523 2026-10-23）：arch22 路径（910B/A2、910_93）的 SegsumND::Compute 里，末条带 CopyInBatch 搬运长度取列向钳位 calCount=Min(slideSize, tailDimSize-colIdx)，而搬运起点按行向 inOffset=batchIdx*tailDimSize+rowIdx 计算；当 tailDimSize>slideSize 且 tailDimSize%slideSize≠0 时末条带读窗口越过 x 张量末尾，对最后一个 batch 即越出整块 GM。数值结果仍正确（多读数据不被消费），因此是静默越界读，只能靠 mssanitizer 抓：memcheck 实测 self=(1,1,13000)/out=(1,1,13000,13000) fp16 报 illegal read of size 22944、fp32 报 45952（约 11472/11488 元素，与静态推导 slideSize-loopCount≈12264-736=11528 同量级）。Mamba/SSM 类训练（exp_segsum 是 SSD 状态空间模型核的一部分）。issue open 无修复 MR。无训练框架受害报告。
  source: https://gitcode.com/cann/ops-math/issues/3845
  behavior: 在 A2 上跑含 exp_segsum 的 Mamba/SSM 训练，序列长度 T 大于分块 slideSize 且不整除（如 T=13000）时，kernel 会读出 x 张量末尾之外上万元素（约 45KB），结果数值碰巧不受影响、不报错；只有 mssanitizer memcheck 能看到 illegal read，越界读在邻近显存布局变化时可能转为崩溃或数据污染，属隐藏的内存安全缺陷。
  discovery: 2026-10-24 每日扫描
