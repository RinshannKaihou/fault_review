title: ExpSegsum 末条带误用列向长度 GM 越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: ExpSegsum arch22 末条带搬运
  behavior: 末条带 CopyInBatch 搬运长度取列向钳位 calCount，搬运起点却按行向 inOffset 计算，两者不同源；tailDimSize>slideSize 且不整除时读窗口越过 x 张量末尾，末 batch 越出整块 GM。
effect:
  objects:
  - 数值结果
  detail: mssanitizer memcheck 实测 self=(1,1,13000) 报 illegal read fp16 22944B / fp32 45952B；多读数据不被消费，数值结果仍正确，属静默越界读。
  visibility: 静默错误
mitigation:
  detect: mssanitizer -t memcheck 扫 ExpSegsum kernel；T>slideSize 且 T%slideSize≠0 的形状单测。
