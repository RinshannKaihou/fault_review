    stack: megatron-lm
    component: fused_pre_gated_delta
  behavior: Triton kernel 用 32 位整数计算 row*row_stride 与 batch*batch_stride，张量元素数超过 2^31 后行偏移回绕，前向读错行、反向写到缓冲区外
effect:
  objects:
  - 隐状态
