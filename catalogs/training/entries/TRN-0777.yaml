  visibility: 数值异常
mitigation:
  detect: 对超 2^31 元素的输入比较最后若干行与单独小输入重算的结果；监控 GDN 输出尾部行的非有限值
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/9470（open，未合入）：在 fused_pre_gated_delta_rule.py 与 fused_pre_kda.py 的 kernel 内把 row/batch 偏移乘积累加为 int64；新增两个 261376 行大输入测试
