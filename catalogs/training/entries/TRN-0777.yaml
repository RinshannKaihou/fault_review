original:
  mechanism: 'NVIDIA/Megatron-LM PR #9470（2026-11-16，open）。megatron/core/fusions/fused_pre_gated_delta_rule.py 中的 Triton kernel（--gdn-pre-gated-delta-rule-fusion 的 causal conv + SiLU + q/k/v 投影、g/beta 计算及其反向，dense 与 packed THD 两种布局）与 megatron/core/fusions/fused_pre_kda.py（Kimi Delta Attention 复用卷积核并加 decay feature/output gate/beta 尾核）都用 `ptr + row * row_stride + batch * batch_stride + channel` 形式寻址，且 row/batch 的乘积是 32 位。张量元素数超过 2^31 后行乘积回绕：前向从其它内存读行，反向还会写到缓冲区之外。以 qkvzba [seq_len, batch, in_proj_dim] 为例，16 个 key head、48 个 value head、维度 128 时 in_proj_dim=16480（TP2 或 headwise CP2 后每 rank 8240），因此每 rank 序列超过 130308（260617）token 就触发。训练症状：新进程首步 loss 仍有限（回绕读落在零填充内存上），但梯度已经错误，随后出现 NaN，非有限值最先出现在 GDN 输出的最后几行。修复把两个文件 kernel 内的 row/batch 偏移乘积改为 int64（x.to(tl.int64) * stride），channel/head 偏移仍为 32 位；低于 2^31 元素时结果不变。新增两个 261376 行测试（test_fused_pre_gated_delta_rule_large.py 需 48 GiB 空闲、实测峰值 22.5 GiB；test_fused_pre_kda_large.py 需 32 GiB、峰值 17 GiB）；未修复版两个测试均 CUDA illegal memory access，修复版通过。'
  source: https://github.com/NVIDIA/Megatron-LM/pull/9470
  behavior: 长上下文预训练开 GDN/KDA 融合 pre 核时，单 rank 序列长度越过约 13 万 token 的阈值后，训练不会立刻报错：第一步 loss 看起来正常，接着梯度开始不对，再往后 GDN 输出末尾几行先冒 NaN、loss 才崩。小规模复现（短序列）完全正常，只有把序列拉长到 2^31 元素以上才出现，容易被当成数值不稳定。
  trigger_surface: Megatron-LM --gdn-pre-gated-delta-rule-fusion / Kimi Delta Attention 融合路径，单 rank 张量元素数 >2^31（qkvzba 宽 16480 时约 130308 token/rank）；Triton kernel。
  discovery: 2026-11-17 每日扫描
