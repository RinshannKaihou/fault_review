original:
  mechanism: MindSpeed-LLM 用 feature manager 在 import 时统一打补丁：mindspeed_llm/tasks/megatron_adaptor_v2.py 的 FeatureAdaptor.execute → MindSpeedFeaturesManager.apply_features_patches → 各 feature 的 register_patches → patch_manager.register_patch → patches_info.get(orig_func_name).set_patch_func。MoE 模块已经给 _update_router_expert_bias 打过补丁，而 mindspeed_llm/features_manager/low_precision/low_precision_optimizer_feature.py 在启用 --quant-states 或 --quant-grads 时又对同一函数注册一次，patch_utils.py:76 的 set_patch_func 检测到已有 patch 就 raise RuntimeError('the patch of {} exist !')。因为发生在 import megatron_adaptor 阶段，作业连参数解析都没走到就退出，低精度优化器与 MoE 的组合因此完全不可用。环境：MindSpeed master、Megatron-LM core_v0.12.1、MindSpeed-LLM master。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1371（closed；MindSpeed/MindSpeed-LLM master + core_v0.12.1；栈与修复 PR 在正文）
  behavior: '训练脚本里加上 --quant-states 或 --quant-grads，python 一启动就报 RuntimeError: the patch of _update_router_expert_bias exist!，栈在 import mindspeed_llm → FeatureAdaptor.execute → register_patches；把这两个参数去掉就能启动，等于低精度优化器特性在 MoE 模型上根本没法用。'
  trigger_surface: --quant-states/--quant-grads + MoE 模型（moe 模块已打 router bias 补丁）
  discovery: 2026-10-21 每日扫描
