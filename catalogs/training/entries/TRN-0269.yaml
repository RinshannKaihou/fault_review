original:
  mechanism: 'trl GRPOTrainer/RLOOTrainer（及 DistillationTrainer）用 repeat_iterable_dataset 把「steps_per_generation 窗口内的 batch」构造成同一 batch 的重复，_prepare_inputs 只对窗口首个 batch 做 rollout 生成、窗口内其余步重放这些生成。该分组用全局 prompt 数计算。当数据集是流式（iterable）且 dispatch_batches=False 时，Accelerate（1.14 起 n_shards>=num_processes、此前 >）给每个进程分配独享 shard——每进程的窗口因此包含数个不同 batch，而不是一个 batch 的重复；只有首个 batch 的 prompt 被生成并训练，窗口内其余 batch 的 prompt 被静默跳过，同时其余部分被重复训练。报告者在 2 进程、16 prompt、2/4 shard 的 CPU 复现：main 只训 8/16 prompt，无报错无警告（issue #7690 含完整 torchrun 复现脚本与逐 rank batch 打印）。修复 PR #7697 使各进程只按自身份额分组并加约束 ValueError；修复后 1/2/4/8 shard 下 16/16 prompt 全部被训。'
  source: 'trl #7690（2026-10-13，torchrun 2 进程 CPU 复现，逐 rank micro-batch 打印显示 8/16 prompt 被跳过）；修复 PR #7697（open）。https://github.com/huggingface/trl/issues/7690 ；https://github.com/huggingface/trl/pull/7697'
  behavior: 流式/ streamed 数据集 + 多进程 + shard 数达标时：训练正常跑完、无报错；实际只训练了部分 prompt（实测 8/16），其余被重复训练。触发条件：iterable dataset + Accelerate 独享 shard 路径 + GRPO/RLOO/Distillation trainer。
  discovery: 2026-10-14 每日扫描
