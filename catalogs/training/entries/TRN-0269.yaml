legacy_ids: []
slug: streamed_shards_repeat_window_mismatch
aliases: []
title: trl 流式数据集分片下静默跳过/重复训练 prompt
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: trl
    component: GRPO/RLOO 流式数据加载分组
  behavior: repeat_iterable_dataset按全局prompt数构造窗口内同一batch重复，_prepare_inputs只对首个batch生成；独享shard时进程窗口含多个不同batch。
effect:
  objects:
  - 训练样本流
  detail: 流式数据集且dispatch_batches=False，Accelerate分配独享shard（1.14起n_shards≥进程数、此前>进程数）时，仅窗口首个batch生成并训练，其余batch的prompt静默跳过，其余步重复训练；2进程16prompt实训8，无报错警告且训练正常完成。
  visibility: 静默错误
mitigation:
  detect: 训练步数×每步 prompt 数与数据集总 prompt 数对账；或按 uid 统计被生成 prompt 集合。
  fix: '修复 PR #7697（open 未 merge）：各进程只按自己份额（generation_batch_size // num_generations // num_processes）分组，份额切不开时 ValueError；修复后 16/16 prompt 全训。https://github.com/huggingface/trl/pull/7697'
