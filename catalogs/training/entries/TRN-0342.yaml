relations: []
original:
  mechanism: MindSpeed（Megatron 昇腾补丁层）MLA YaRN 初始化把 max_position_embeddings 传作 original_max_position_embeddings。YaRN 插值的缩放上下界由「原始训练长度→扩展长度」区间决定；对长上下文模型（PR 例子 Kimi-k2.5：original_max_position_embeddings=4096，max_position_embeddings=128000）扩展后的长度不是 YaRN 原始长度，缩放范围错误导致长序列精度退化。修复改传 config.original_max_position_embeddings 并加单测：mock YarnRotaryEmbedding 断言收到 original_max_position_embeddings=4096（当 max=128000）；两值相等的模型行为不变、无新增参数。验证：py_compile + 该单测（CPU）；NPU 端到端 Kimi-k2.5 长序列精度验证未运行（需 NPU 环境）。
  source: 'https://gitcode.com/Ascend/MindSpeed/merge_requests/4103（2026-10-20，open，Fixes #185）'
  behavior: 在 MindSpeed 上用 MLA + YaRN 长上下文配置训练或微调时，长序列输入的前向输出精度静默劣化（缩放区间错位），无报错；最终表现为长上下文评测指标低于预期，短序列（两长度参数相等或序列小于原长度）不受影响。
  discovery: 2026-10-21 每日扫描
