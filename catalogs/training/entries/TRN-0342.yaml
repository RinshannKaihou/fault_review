id: TRN-0342
legacy_ids: []
slug: mindspeed_mla_yarn_original_max_pos_misforwarded
aliases: []
title: MindSpeed MLA YaRN 原始长度参数传错致长序列退化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 位置编码
    stack: mindspeed
    component: MLA YaRN 初始化
  behavior: 构造 YarnRotaryEmbedding 时把扩展后的 max_position_embeddings 当作 original_max_position_embeddings 传入，YaRN 缩放范围按错误的原始长度计算。
effect:
  objects:
  - 隐状态
  - 训练轨迹
  detail: 长上下文模型（如 Kimi-k2.5：original 4096 / 扩展 128000）启用 MLA+YaRN 时缩放区间错位，长序列前向精度静默退化；两值相等的模型不受影响。
  visibility: 质量退化
mitigation:
  detect: 对 YarnRotaryEmbedding 收到的 original_max_position_embeddings 断言等于 config.original_max_position_embeddings（PR 已加该单测）。
  fix: '修复 MR https://gitcode.com/Ascend/MindSpeed/merge_requests/4103（open）：改传 config.original_max_position_embeddings，新增单测断言转发值（4096 vs 128000 用例）；端到端 Kimi-k2.5 长序列验证需 NPU 环境未本地运行。Fixes #185（issue 正文批次内无缓存，机制以 PR 为准）。'
