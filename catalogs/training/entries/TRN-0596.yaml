original:
  mechanism: 'cann/ops-nn #7954（2026-11-02 open，Atlas A2 910B2，CANN 9.2.0，repo 7044c832）。aclnnForeachDivScalarV2 在 x=FLOAT16 + scalar=DOUBLE 时把 DOUBLE 标量降成 fp16 再下发：scalar=70000.0 超出 fp16 上限 65504 变 inf，x/inf 全 0。资料 docs/aclnnForeachDivScalarV2.md 参数表原文『当 x 的数据类型为 FLOAT16 时，数据类型支持 FLOAT16、DOUBLE』——声明支持却降精度。同程序对照：fp32 路径正确（2.14e-5）、bf16 路径显式提升 FLOAT 正确。复现：两段 API 均 RET=0 接受组合，OUT_BITS 全 0000。C++ 复现脚本完整（aclCreateScalar(&s, ACL_DOUBLE)）。另注意同日 PR !13432 修 Foreach 系列标量提升规则（FLOAT16 输入下 DOUBLE/FLOAT 标量被降精度），为同族修复方向。'
  source: cann/ops-nn https://gitcode.com/cann/ops-nn/issues/7954（open）
  behavior: 用 aclnnForeachDivScalarV2（或 torch._foreach_div 标量路径）对 fp16 张量除以一个大的 DOUBLE 标量（如 70000）时，接口返回成功但整张输出全 0——正确值约 2.14e-5 是 fp16 可表示的次正规值，却被算成 x/inf=0。fp32、bf16 输入同样调用返回正确值，唯独 fp16+DOUBLE 组合静默全 0，无错误码。
  discovery: 2026-11-03 每日扫描
