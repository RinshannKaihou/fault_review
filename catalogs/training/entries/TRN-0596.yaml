    component: aclnnForeachDivScalarV2
  behavior: x=FLOAT16 + scalar=DOUBLE 时标量被降成 fp16 下发，70000 超 fp16 上限变 inf，输出全 0；资料明确允许该组合，bf16 显式提升 FLOAT 正确、fp32 正确，唯 fp16 落入降精度空档
effect:
  objects:
  - 数值结果
  detail: foreach 除以大 DOUBLE 标量时 fp16 张量输出位模式全 0000（正确值 x/70000≈2.14e-5 为 fp16 可表示次正规值），无错误码无警告；torch._foreach_div 路径可直接触达
  visibility: 静默错误
mitigation:
  detect: x=fp16 + scalar=DOUBLE(70000) 组合探针；输出预填哨兵后检查全 0
