  mechanism: 'cann/ops-math #3910/#3919（2026-10-25，open，A2 910B2 / CANN 9.2.0 / master 584b2ea6）。aclnnInplaceRandomTensor（#3910）与 aclnnInplaceUniform（#3919）在整数 dtype 且 from<0 时取值域整体右移一位：#3910 实测 n=8192、[-5,5) 的 from 桶 0、0 桶 1605、均值 0.073（期望 -0.50），[-8,-6) 只落 {-7,-6}；#3919 实测 [-2,0) 输出 -1:4151/0:4041（期望 -2/-1 各半）、[-1,0) 全 0（期望全 -1）。INT8/16/64 与 out-of-place 变体一致。资料功能说明「生成 [from,to) 区间内离散均匀分布随机数」，负 from 未做桶偏移修正。'
