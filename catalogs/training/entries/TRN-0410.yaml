id: TRN-0410
legacy_ids: []
slug: ops_transformer_moe_init_routing_v2_grad_oob_skip
aliases: []
title: MoeInitRoutingV2Grad 越界行 idx 静默当 -1 跳过
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: aclnnMoeInitRoutingV2Grad
  behavior: kernel 侧对 idx<0 与 idx≥rows 一律按无效行跳过，host 侧未做值域校验；越界（≥行数）与小于 -1 的 expandedRowIdx 被当作 -1，两段返回 0，被跳过行的梯度静默丢失。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: MoE 路由反向展开行索引越界时（Drop/Pad 之外场景值域 [0,B*S*K)），该行梯度被静默丢弃——输出与 skip 语义逐元素一致（CPU 三语义标杆判据），梯度少加一项；接口无报错。
  visibility: 静默错误
mitigation:
  detect: 含越界 idx 的输入对拍 CPU skip/clamp/mod 三语义标杆；上游路由 idx 生成处加值域断言。
  fix: 待定（issue open，未见修复 MR）。
