  mechanism: 半精度（fp16/bf16）操作数、FP32 累加交付的 tensor core GEMM 上的 SDC **事后验证器**能力边界刻画：ABFT 须 fused 进 kernel 或编码操作数、且每次校验和至多定位一个错误；FP-Sketch 在**未修改**的 GEMM 之后跑——sum sketch 每次调用检出损坏、hashed first-moment sketch + 独立重算确认可定位多个损坏条目（构造上无假阳性），每个故障给出坐标+幅度供 fleet 诊断；浮点下限制因素是 sketch 噪声而非桶碰撞，其常数依赖 BLAS 与操作数格式。
  source: '"Sketching the Error, Not the Product: Post Hoc Fault Recovery for Half Precision GPU Matrix Multiplication"（FP-Sketch），arXiv:2609.19758（2026-09-17，窗口内）。https://arxiv.org/abs/2609.19758'
  behavior: 这条是检测侧证据而非注入面：部署它的 run 可以在坏 GEMM 输出进梯度**之前**截获（对比 HW.01：未设防时 SDC 把训练推入另一局部最优）；「坐标+幅度」输出可直接对接 HW.03 的 fleet 级基率统计。与 HW.07（共识离群定位故障 rank）互补：那边 DP 副本间对称对照、这边单 kernel 输出域校验；与 HW.08（易损性地**图**）正交：那边告诉你哪里值得设防、这边提供不必改 kernel 的设防手段。
  discovery: 2026-09-19 每日扫描
