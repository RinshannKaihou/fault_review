  behavior: grad reduce-scatter 沿序列维切分；seq_len 不整除 SP world_size 时尾部 residual chunk 单独 allreduce，bf16 多一次 cast 损失，边界 grad 跨 rank 不齐。
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: 训练 seq_len 从 4096 扩到 4608、开 SP、bf16 时，序号 4096~4608 的 grad 在各 SP rank 间出现量级差异，update 后参数沿 SP 维不统一，loss 逐步发散；日志无异常，需逐 chunk allclose 才看得到。
  visibility: 静默错误
mitigation:
  detect: 对 _reduce_scatter_along_first_dim 的输出按 chunk 做跨 rank allclose 比较；或临时改 fp32 归约复跑同一 step 对比 loss。
  fix: issue 建议把 residual chunk padding 到 align_size 再 allreduce、之后 strip，或 SP 归约改用 fp32；issue 已 closed，未在正文给出对应 PR 与合入版本（未核实）。
