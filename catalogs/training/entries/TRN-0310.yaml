id: TRN-0310
legacy_ids: []
slug: trl_merged_weight_sync_publish_after_resume
aliases: []
title: trl merged 权重同步先 resume 后发布版本号
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: merged 同步发布顺序
  behavior: rank0 的 _sync_weight_merged 按 resume()→model_version+=1→update_model_version() 执行，版本发布在 resume 之后。
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: 非 LoRA merged/dense 每次同步的 resume 与版本发布间隙训练照常、无报错；vLLM 已用新权重出 token 但样本标旧版本，新样本可被 max_staleness 门当过期丢弃（门限 0 时尤甚），staleness 观测/批次构成偏离。
  visibility: 静默错误
mitigation:
  detect: 对版本发布与 resume 的相对顺序做单元断言（issue 提供了六场景生产方法级回归，fork CI PASS）。
  fix: 报告者修复：把版本发布移到 resume 之前（publish while paused → resume），fork https://github.com/lindicaphxag-tech/trl/tree/fix/async-dense-policy-publish-before-resume-20261017 含两个 trainer 的生产方法级单测与 fork CI PASS（未合入上游，状态未核实）。
