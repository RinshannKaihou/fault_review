original:
  mechanism: 'trl AsyncGRPOTrainer._sync_weight_merged 与 AsyncDistillationTrainer._sync_weight_merged 在 rank0 上执行顺序为 `self.weight_transfer.resume()` → `self.model_version += 1` → `self.rollout_worker.update_model_version(self.model_version)`。worker 是独立进程、从共享状态读已发布版本：v7 live、服务暂停更新到 v8、resume() 返回后 worker 仍在读 v7 时派发 /v1/completions、随后 trainer 才 publish v8——该请求用 v8 权重生成但 RolloutSample.model_version 标 v7。报告者明示这是源码级发布窗口分析、非端到端 GPU 事故复现；确定性验证为 fork 上执行真实 _sync_weight_merged 方法（transfer/barrier→publish→resume 顺序、非 rank0 行为、传输错误后不发布不 resume，六场景）CPU GitHub Actions PASS。修复（publish while paused，再 resume）明确与 #7781 的 LoRA 双读问题分开（LoRA 版本化模式新旧 adapter 显式可寻址；dense merged 模式无版本化模型名）。截至 2026-10-18 open，修复未合上游。与 #7781 同为「rollout 样本策略版本标签与实际采样权重不一致」，但缺陷位置不同：本条是同步流程的发布顺序窗口，#7781 是 worker 侧双活读。来源 https://github.com/huggingface/trl/issues/7782'
  source: https://github.com/huggingface/trl/issues/7782（2026-10-17 创建，open；源码级发布窗口 + 生产方法级确定性回归）
  behavior: 使用 trl AsyncGRPO 或 AsyncDistillation 的 merged/dense 权重同步的用户：每次同步后存在一个短暂窗口，期间 vLLM 已用新权重出 token，样本却标着旧版本号；训练照常进行、无任何报错。后果是刚生成的新样本被 max_staleness 门当成过期丢弃（门限 0 时尤甚），或 staleness 观测/批次构成与真实情况偏离。异步训练下该窗口随每次同步反复出现。
  trigger_surface: AsyncGRPOTrainer / AsyncDistillationTrainer 的 merged dense 权重同步（非 LoRA 版本化模式）；每次同步的 resume 与版本发布间隙。
  discovery: 2026-10-18 每日扫描
