slug: megatron_expert_wgrad_overlap_ddp_stale_grad
aliases: []
title: Megatron 专家 wgrad overlap 下 DDP 旧梯度重复累加
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: megatron-lm
    component: get_megatron_ddp_config
  behavior: 专家 wgrad overlap 使 DDP 挂 autograd 钩子而非 backward_dw 钩子：专家 param.grad 永不清零，旧梯度下次迭代再累加进 main_grad。
effect:
  objects:
  - 梯度
  detail: Nemotron 3 Nano 2×GB200 EP8 HybridEP：开该选项后每次运行自第 2 迭代起 grad norm 都不同（该选项时才现）；旧梯度重复进 main_grad，专家权重梯度错。
  visibility: 不可复现
mitigation:
  detect: 对比开/关该选项的逐步 grad_norm（第 1 迭代一致、第 2 迭代起分歧为指纹）；检查专家参数 param.grad 是否跨迭代残留
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/8613（open，2026-10-28）——DDP 在 backward_dw 处注册专家梯度钩子（对齐 --delay-wgrad-compute 既有机制）
