title: 310P INNER-ABORT 后同进程 NPU 算子静默返回垃圾值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: CANN error-manager 内错中止
  behavior: INNER-ABORT 抛异常后进程继续运行，同进程后续 NPU 算子静默返回未初始化垃圾，属进程态毒化；触发面 7 格：fp64 matmul/addmm/bmm/conv/LayerNorm、bf16 conv/LayerNorm
effect:
  objects:
  - 数值结果
  - 训练轨迹
  detail: abort 后同进程所有 NPU 计算静默不可信：fp32 matmul 相对误差 8.06e+17、17 案例族全部垃圾；一个 batch 混入一条触发语句则此后 loss/精度全线静默失真
  visibility: 静默错误
mitigation:
  detect: abort 后同进程跑已知值探针（如 tanh/matmul vs CPU）即可暴露；运行期在每条 INNER-ABORT 异常后强制进程退出或重建上下文
  fix: 待定（issue open；对照 A3 同版本 fp64 走干净 op-plugin RuntimeError 且不毒化）
