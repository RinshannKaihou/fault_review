original:
  mechanism: 'Ascend/pytorch #5789（2026-11-01 open，310P3，CANN 9.2.1 社区版 + torch 2.11.0 + torch_npu 2.11.0rc1）。进程内一条 fp64 语句（如 matmul float64）触发 CANN error-manager 内错中止（签名含 ''The Inner error is reported as above. The process exits for this inner error, and the current working operator name is MatMul''），但异常抛出后进程继续运行，同进程此后所有 NPU 算子静默返回未初始化垃圾：两语句最小复现中 fp32 matmul 相对误差 8.064e+17（垃圾为未初始化显存值，16384/16384 全有限非 NaN）；扩谱取证 17 案全部垃圾（matmul/conv 系 1e24~1e36、addmm 系全零、LayerNorm 系 NaN），同场独立对照组全净，证明是进程态毒化而非算子问题。触发面 7 格 INNER-ABORT：fp64 matmul/addmm/bmm + fp64 conv + fp64 LayerNorm + bf16 conv + bf16 LayerNorm。对照：A3 上同版本同代码 fp64 matmul 为干净 op-plugin RuntimeError 且不毒化。关联 #5788（bicubic ResizeD INNER-ABORT 同样毒化，已并入推理库 INF-2352）、#5642（to_copy Double 支持缺口）、#5785（310P fp32 降级带）。'
  source: 'Ascend/pytorch https://gitcode.com/Ascend/pytorch/issues/5789（open）；同签名另案 #5788 https://gitcode.com/Ascend/pytorch/issues/5788；推理库同机制 INF-2352'
  behavior: 310P 上进程里只要有一条不支持的语句（如 fp64 matmul、bicubic interpolate）触发 INNER-ABORT，异常被捕获后进程不退出，之后所有 NPU 算子『正常』返回未初始化垃圾值——无异常无告警，数值全有限不报 NaN。实测 abort 后 fp32 matmul 相对误差 8e+17 量级；训练进程一旦命中，此后 loss、梯度、精度全线静默失真。
  discovery: 2026-11-02 每日扫描
