title: verl agent-loop 掩码后缀 reward 被丢弃
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: verl
    component: agent_loop+GAE/RF++
  behavior: agent_loop 把轨迹分数放在最后一个响应 token，而模板后缀（如 '\n'）response_mask=0：GAE/REINFORCE++/ReMax/OTB 忽略 mask=0 上的 reward，outcome 分数丢失。
effect:
  objects:
  - 训练信号
  detail: 两轮轨迹末 3 token ['```','<|im_end|>','\n'] mask [1,1,0]：分数落在 mask=0 的 '\n' 上，GAE/RF++ returns 全零；mask 假设被模板后缀打破。
  visibility: 静默错误
mitigation:
  detect: 检查 reward 张量落点 token 的 response_mask；对照 compute_gae_advantage_return 手工核算。
  fix: 待定（issue open，未见修复 PR）。
