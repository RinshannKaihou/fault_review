original:
  mechanism: 'Megatron MLP/SharedExpertMLP/routed experts 支持 FC1 输出的两个可选 clamp：activation_func_clamp_value=c（DeepSeek-V4：silu(min(g,c))*clamp(u,-c,c)）与 activation_func_tanh_clamp_scale（Kimi-K3 SiTU-GLU：s_g*tanh(g/s_g)*sigmoid(g) * s_l*tanh(u/s_l)，#7003）。三个融合类构造激活时不读这些选项：TEFusedMLP（use_transformer_engine_op_fuser=True）的 _make_te_ops_activation 把 (F.silu, gated) 无条件映射到 te.pytorch.ops.SwiGLU；TEFusedMLPWithGroupedLinear（use_grouped_gemm_for_dense_mlp=True）恒加 ScaledSwiGLU(glu_interleave_size=32)；FusedSharedExpertMLP（use_grouped_gemm_for_shared_expert=True）实现了 clamp_value 但从不检查 tanh_clamp_scale，SiTU-GLU 配置跑普通 SwiGLU。均不报错不警告。routed experts 已正确处理（TEGroupedMLP._is_fused_impl_supported 用 ScaledClampedQGeGLU、对 SiTU-GLU 返回 False）。修复 PR #8640（open）：TEFusedMLP/GroupedLinear 改用 TE clamped SwiGLU，三个类对 SiTU-GLU raise ValueError。'
  source: https://github.com/NVIDIA/Megatron-LM/pull/8640
  behavior: 训练 DeepSeek-V4（swiglu clamp）或 Kimi-K3（SiTU-GLU）且开启 TE 融合 MLP（use_transformer_engine_op_fuser / use_grouped_gemm_for_dense_mlp / use_grouped_gemm_for_shared_expert）时，配置的 clamp 生效条件静默失效，dense MLP/共享专家跑普通 SwiGLU，输出与参考实现/非融合路径不同；训练全程无报错，损失与生成质量偏离预期且难定位
  discovery: 2026-10-30 每日扫描
