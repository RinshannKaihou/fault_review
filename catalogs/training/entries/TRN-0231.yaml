  meta: 'stage: `rl` · Cov: `var:adapter_omitted_from_weight_sync` · 置信度 `documented`'
  mechanism: Megatron colocated RL（trainer 与生成引擎同进程）里，serving 侧此前**在捕获时另行 fuse 了一份 expert 张量**；distributed optimizer 之后更新的是自己的参数 buffer，那份独立 fuse 的张量值**冻结在捕获时刻**——生成引擎一直用陈旧专家权重采样，训练侧却在更新当前策略。修复：DDP 构造前把 per-expert 权重分配为相邻 view 并在参数 buffer 中保持无间隙布局，serving 可恢复 zero-copy fused view 而不改 ckpt 参数名。
  source: 'Megatron-LM #6963（PR 自述「causing colocated RL generation to use stale expert weights」；替代被关的 #6931）。https://github.com/NVIDIA/Megatron-LM/pull/6963'
  behavior: rollout 与 train 权重静默脱钩——与 RL-RO.08（同步载荷缺 adapter）同行为面：RL 循环被切断、mismatch 随训练增长、无警告；机制不同：不是同步载荷缺项，是**存储别名**——合法 zero-copy 优化下被捕获的 fused 视图不随优化器写回刷新。
  discovery: 2026-08-30 每日扫描
