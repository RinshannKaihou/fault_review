original:
  mechanism: 'Ascend/pytorch #5632（2026-10-24，open，torch_npu master/2.13，Ascend_950）+ 修复 MR !48472（open）。torch_npu Inductor 两处数值正确性缺陷：1) channels-last pixel_shuffle 拆轴时将相对 divisor 用于根坐标查找并错误复用旧坐标，宽度索引中的取模被消去——原 PyTorch v2.13 社区用例 test_pixel_shuffle_channels_last_npu 有 54758/73728 个输出超差，最大绝对差约 3.902；2) 动态 persistent 归约用首次输入的尺寸 hint 选择归约块，归约长度从 31 增到 33 时仍用大小 32 的块，漏算有效元素，仅尾部 mask 无法修复块过小（test_dynamic_persistent_reductions；补充场景 (x+1).sum(0) dynamic=True 依次输入 31×127/32×128/33×129 出现漏算）。复现入口为 PyTorch v2.13.0 社区用例的 NPU 测试入口，错误摘要 AssertionError: Tensor-likes are not close。修复 !48472 拆轴改用根坐标 divisor、复用上游 _get_persistent_RBLOCK 按可证明动态上界选块，open 未合入。同仓前例 TRN-0398（inductor 归约无效 lane 污染+bias 梯度轴压平）同属 torch_npu Inductor 缺陷族但机制不同（本条为索引推导与块尺寸选择，非归约 lane 污染）。推理编目 INF-2159 已收同源；本条为训练侧条目（训练用 torch.compile 动态 shape 常见）。'
  source: https://gitcode.com/Ascend/pytorch/issues/5632 ；修复 https://gitcode.com/Ascend/pytorch/pull/48472
  behavior: 在 NPU 上开 torch.compile：channels-last 的 pixel_shuffle 结果和 eager 差出 3.9 的绝对差（七成以上元素超差）；dynamic=True 编译的 sum 等归约，输入从 31 行变 33 行后结果漏算、与 CPU 参考对不上，断言 Tensor-likes are not close。训练前向/反向经过这些图时数值静默错。
  trigger_surface: torch_npu 2.13/master Inductor；channels-last pixel_shuffle 编译图；torch.compile(dynamic=True) 尺寸跨 32 的 persistent 归约；Ascend_950。
  discovery: 2026-10-25 每日扫描
