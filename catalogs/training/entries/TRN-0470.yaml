id: TRN-0470
legacy_ids: []
slug: trl_asyncgrpo_minp_is_bias
aliases: []
title: trl AsyncGRPO min_p 单独开启时 IS ratio 偏低偏
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: AsyncGRPO rollout 候选集请求
  behavior: AsyncGRPOTrainer 的 rollout worker 只为 top_p/top_k 请求候选集；min_p 单独开启时请求不带采样掩码，vLLM 按 min_p 截断后词表归一化 logprob
effect:
  objects:
  - 训练信号
  detail: min_p 采样下 IS 修正权重整体偏低，on-policy 偏置进入每个 completion 的梯度；无报错。
  visibility: 静默错误
mitigation:
  detect: min_p>0 时对比 sampling_logp_difference/importance_sampling_ratio 指标是否系统性 <1
  fix: '待定（#7866 修复不覆盖 min_p；issue open 2026-10-27，由 qgallouedec 在 #7866 review 中报告）'
