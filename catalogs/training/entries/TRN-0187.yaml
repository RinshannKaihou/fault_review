original:
  category: SFT
  section: SFT
  meta: 'stage: `sft` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 'verl `initialize_system_prompt` / `extract_system_prompt_and_generation` 用两次 probe render 的长度差切 system prompt 前缀：`token1[: -(len(token2) - len(token1))]`。模板对「1 轮 vs 2 轮相同 probe」**渲染不增长**（diff==0）时表达式变成 `token1[:-0]`，Python 语义是 `token1[:0]` = **空表**而非「全保留」——system prompt 被静默丢成 `[]`。'
  source: 'verl #7592（修 #6477；生产路径 `MultiTurnSFTDataset` 据此计算每个非首轮 turn 该剥的 leading tokens 数=0，**每一轮都被塞进重复的 system+首轮前缀**；Jinja2 假 tokenizer CPU 复现 red→green 2 failed→4 passed；此前修复尝试 #6487 被关闭未合，bug 在 main 两处调用点均在）。https://github.com/verl-project/verl/pull/7592 ；修复 PR #7756（2026-09-06 补，已合并）。https://github.com/verl-project/verl/pull/7756'
  behavior: 多轮 SFT 样本从第二轮起 token 流结构损坏（前缀重复注入），训练无报错、loss 正常。与 SFT.01（训练/服务模板错位）不同：模板本身没错，错在**从模板渲染反推前缀长度**的探针算术在合法模板（只渲染首条消息类）上翻车——`x[:-0]` 陷阱是 Python 切片语义与「diff 可为 0」假设的组合。
  discovery: 2026-08-30 每日扫描
  notes:
  - '2026-10-14 回访 2026-10-14：相关 PR #8086（修 enable_thinking 相关 loss mask bug 1：YAML 默认字符串 ''none'' 真值陷阱）merged 2026-10-09，但其描述的第二处修复（extract_system_prompt_and_generation 接收 enable_thinking_default）未进 merge diff，探针仍不感知 dataset 级 thinking 默认——见 TRN-0268。'
