  - 训练信号
  detail: 合法 fp32 输入（如 x=1000±0.01，满足资料全部约束）下 GroupNorm/GroupNormSilu 输出整块 NaN 且无任何报错；同形状良态输入正常，激活分布漂移到病态区间即静默产出 NaN。
  visibility: 数值异常
