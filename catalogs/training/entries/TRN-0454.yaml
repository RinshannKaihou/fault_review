original:
  mechanism: 'CANN 9.2.0（Ascend 910B2/B3，Atlas A2 训练系列）上 aclnnGroupNormSilu 与 aclnnGroupNorm 在 fp32 合法输入下把 rstd 算成 NaN。ops-nn #7334：x=50±0.001（组内方差 3.5e-7）、x=1000±0.01（3.5e-5）时 rstdOut=NaN、out 128/128 NaN，meanOut 正常（50/1000），期望 rstd≈310.77/148.35；用例满足资料 rank 2-8、group 整除 C、eps>0、fp32 全部约束，属窄方差下方差公式（E[x²]−μ²]类）灾难性抵消。ops-nn #7347：均值远大于标准差（x≈1000±0.01）时 rstdOut 返回 NaN 或 1/sqrt(eps)=316.23（方差算成 0），out 256 元素中 128 个 NaN，fp64 参考应为 55.52/56.08；同形状均值≈0 良态输入与 fp64 参考误差 ~6e-8。两算子两段式接口均返回 0 无错误码。上游均附完整 C++ 单算子复现（repro.cpp 与编译命令、实测值）。机制为 norm 族方差估计非稳健（未用 Welford/双遍或未提升中间量精度），与已收 GroupNormSwishGrad 反向 tiling 失败（TRN-0344）不同缺陷面。推理库同源条目 INF-2203。'
  source: GitCode issues：https://gitcode.com/cann/ops-nn/issues/7334 （GroupNormSilu 窄方差 rstd NaN，open，含复现代码）、https://gitcode.com/cann/ops-nn/issues/7347 （GroupNorm 病态输入 rstdOut NaN/1/sqrt(eps)，open，含复现代码）；推理库同源条目 INF-2203
  behavior: 训练或单算子调用 GroupNorm/GroupNormSilu 时，若某组激活集中在远离 0 的大均值附近（如 1000±0.01），输出整块变 NaN 且接口返回成功，没有任何报错或错误码；同一网络在良态输入（均值≈0）下完全正常，因此问题只在激活分布漂移到病态区间时出现，表现为前向输出/loss 突然大量 NaN、而 meanOut 仍正确，难以定位到 norm 层。
  discovery: 2026-10-27 每日扫描
