    component: GroupNorm/GroupNormSilu
  behavior: fp32 下组内方差远小于均值平方时，方差计算灾难性抵消成负或 0，rstdOut 变 NaN 或 1/sqrt(eps)，out 整块 NaN，两段接口返回 0 无错误码。
