original:
  mechanism: 'trl #7912（open，2026-10-26）：tokenized prompt 单独达到 max_length 时 ORPOTrainer（orpo_trainer.py:532-544）与 CPOTrainer（cpo_trainer.py:550-562）保留整个 prompt、把 completion 截成 0 token——该行长于 max_length、无 completion token 仍被保留。平均 logprob 随后 0/0：ORPO :741、CPO :788（ORPO 恒平均；CPO 对 simpo/ipo 平均），NaN 梯度经优化器写进每个参数。CPO sigmoid 求和变体不除零，转而静默把空 completion 记为 logprob 0 继续训练。#6548 规划两个修复（按 completion 自身预算截断 + 丢弃 prompt 占满行，同 DPO/SFT），#6588 只交付前者与警告。附三变体复现（tiny-Qwen2.5，max_length=32，长 prompt 行），实测 nan_params 计数与 CPO sigmoid 静默 0 分支。'
  source: GitHub issue：https://github.com/huggingface/trl/issues/7912 （open，含代码行锚点、三变体复现脚本）
  behavior: ORPO/CPO 偏好训练里若有一条样本的 prompt 分词后就把 max_length 占满，该 batch 的梯度变 NaN 并被优化器一步写进所有参数（模型彻底毁掉且 loss 显示可能只是异常一步）；CPO sigmoid 配置更隐蔽：不 NaN，而是把这条空 completion 当 logprob=0 正常打分训练。两种都无显式错误，长 prompt 数据集（RAG/长上下文）极易踩中。
  discovery: 2026-10-27 每日扫描
