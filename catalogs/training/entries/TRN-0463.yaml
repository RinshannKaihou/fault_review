    component: ORPO/CPO 平均 logprob
  behavior: prompt 独自达到 max_length 时 completion 截成 0 token；平均 logprob 0/0 得 NaN（ORPO/CPO simpo/ipo），NaN 梯度写进参数；sigmoid 变体静默记 0。
effect:
  objects:
  - 梯度
  - 模型权重
  - 训练信号
  detail: 数据集中存在 prompt≥max_length 的行时，ORPO/CPO(simpo/ipo) 单步把 NaN 写入全部参数；CPO sigmoid 变体静默按 logprob 0 打分空 completion。#6588 只交付截断+警告，未交付丢弃满 prompt 行。
  visibility: 数值异常
mitigation:
  detect: 训练前统计 tokenized prompt≥max_length 行数；逐步参数 NaN 检查
  fix: '待定（#6548 计划的丢弃满 prompt 行未随 #6588 交付，issue open）'
