original:
  mechanism: HCCL ReduceScatterV 算子（AICPU 模板 InsTempReduceScatterVMesh1D）的 KernelRun 通过 SendRecvWrite 向远端 hcclBuff 发起 RDMA write，随后 PostSyncInterThreads 只完成 host 侧线程同步，未保证 device 侧 DMA 写落盘；紧接的 PostCopy 从本地 hcclBuff 读取数据做 LocalReduce，可能读到尚未写入完成的 slot。PROD 规约受影响最重（走 aicpu_inlinereduce）。非 V 版 InsTempReduceScatterMesh1D 已在 PR !154（c24d9ecbda）为 INT64/UINT64/FP64/PROD 补齐 HcommBatchModeEnd+HcommBatchModeStart+HcommThreadJoin barrier，V 版从未同步该修复。复现：16 卡 INT32 reduce_op=PROD countSize=2097152，check_result host_buf 与 check_buf 不等，exp:2147483647, act:-501334399。修复 PR !3805（open）：补齐 device barrier 并修正 PostCopy 已有 barrier 的触发条件（补 UINT64/FP64）。
  source: https://gitcode.com/cann/hccl/merge_requests/3805
  behavior: 多卡 NPU 训练使用 ReduceScatterV 做 PROD 规约或 INT64/UINT64/FP64 类型归约时，部分卡读到未完成的远端写、规约结果静默错误（实测 16 卡 INT32 PROD 期望 2147483647 实得 -501334399）；梯度归约被污染后训练数值漂移，无报错无超时，随通信时序偶发
  discovery: 2026-10-30 每日扫描
  notes:
