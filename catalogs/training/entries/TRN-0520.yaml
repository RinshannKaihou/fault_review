title: HCCL ReduceScatterV 缺 barrier 静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: ReduceScatterV AICPU 模板
  behavior: ReduceScatterV 的 RDMA 写后仅 host 线程同步无 device DMA barrier，LocalReduce 可能读到未落盘 slot；非 V 版已修 V 版漏同步
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 多卡训练 ReduceScatterV 做 PROD 或 INT64/UINT64/FP64 归约时结果静默错误，梯度被污染致数值漂移，无报错无超时、随时序偶发；16 卡 INT32 PROD countSize=2097152 实测 exp:2147483647、act:-501334399
  visibility: 静默错误
mitigation:
  detect: 规约结果与单卡参考对比；对 64 位/PROD 场景跑一致性自检
  fix: 修复 PR https://gitcode.com/cann/hccl/merge_requests/3805（open，未合入）：与非 V 版 !154 对齐补 HcommBatchModeEnd+Start+HcommThreadJoin barrier 并补 UINT64/FP64 判断
