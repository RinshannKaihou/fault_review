  mechanism: cann/ops-transformer MR !14989（2026-10-30，open）：PromptFlashAttention fp16 + HighPerformance 模式下 softmax 的 PxV 分子用 fp16 累加存储；Q/K 全零（logits≈0、softmax 均匀、softmax_exp=1）时分子等于 (i+1)*V，随序列长线性增长，超 fp16 上限 65504 溢出 inf、输出连续 inf。修复：tiling 层将 fp16 输入强制切到 HighPrecision（fp32 累加，flash attention 标准做法）。验证：退化输入（Q/K 全零+causal+大 V 长序列）V∈{1000,256,128,64,35,32,30,16} 全部无 inf、输出恢复正确值 V。与 TRN-0535（!14827，310P fp16 先 cast 再归一化致 O=65520 溢出）同属 PromptFA fp16 溢出面，但根因位置不同：本条是 PxV 分子 fp16 累加、TRN-0535 是归一化前 cast，修复 PR 亦不同。
  source: https://gitcode.com/cann/ops-transformer/merge_requests/14989
  behavior: NPU fp16 prefill 注意力（PromptFlashAttention HighPerformance 模式）遇到退化输入——Q/K 全零或 logits 均匀（如全 padding、极端温度）且序列较长时：softmax 分子按位置数线性累加，超过 65504 后输出整片 inf；短序列正常、无报错，长序列 loss 立刻变 inf/NaN，属于延迟可见的数值爆炸。
  trigger_surface: CANN PromptFlashAttention + fp16 + HighPerformance + 退化输入（Q/K 全零/均匀 softmax）+ 长序列（(i+1)*V>65504）
