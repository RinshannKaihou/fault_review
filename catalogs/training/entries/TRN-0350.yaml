id: TRN-0350
legacy_ids: []
slug: msllm_fsdp2_mxfp8_quantizeconfig_field_mismatch
aliases: []
title: FSDP2 mxfp8 配置字段名不匹配致量化静默跳过
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: mindspeed-llm
    component: QuantizeConfig 字段映射
  behavior: 本地 QuantizeConfig 传给 FSDPTurbo 的 build_model_converter，recipe_name 对不上 quant_recipe 使量化门控恒 None，converters 字段也不匹配。
effect:
  objects:
  - 性能/资源
  - 模型权重
  detail: mxfp8 训练要么在 ModelConvertersContainer 初始化就崩，要么门控提前返回、整条 mxfp8 量化路径没生效而训练照常跑完；quant_format/block_size/fsdp_world_size 缺失时 get_mxfp8linear_config 报错。
  visibility: 性能退化
mitigation:
  detect: 训练启动后确认 build_model_converter 真正产出了 mxfp8 converter，而不是门控返回 None
  fix: MR !4962（open，未发布）：把 QuantizeConfig 字段名适配到 FSDPTurbo 的 mxfp8 定义
