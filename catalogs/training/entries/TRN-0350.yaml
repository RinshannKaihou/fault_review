relations: []
original:
  mechanism: mxfp8 量化路径迁到消费 3rdparty/FSDPTurbo 包之后，mindspeed_llm/fsdp2/distributed/parallel_engine_config.py 里本地 QuantizeConfig 被整体传给 FSDPTurbo 的 build_model_converter(config)，字段名不再匹配对方的 converter 流水线：本地 recipe_name 对应 quant_recipe（FSDPTurbo 门控与本地 engine guard 都读它）、quant_converters 对应 converters（ModelConvertersContainer.__init__ 读它，崩溃点）、apply_modules/ignored_modules 对应 quant_apply_modules/quant_ignored_modules，另外 quant_format、block_size、fsdp_world_size 三个字段本地根本没有，get_mxfp8linear_config 读它们时失败。复现路径是 --model.quant_recipe_name mxfp8 --model.quant_converters quantize.linear.mx quantize.moe.mx 启 FSDP2 训练，MindSpeedParallelEngine.apply_quantization_modules() 调 build_model_converter 后先撞 AttributeError；即便绕过，config.quant_recipe 为 None 使门控提前 return，量化被静默关掉。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1783（closed；含字段映射表与复现步骤）+ 关联 MR https://gitcode.com/Ascend/MindSpeed-LLM/merge_requests/4962（open）
  behavior: 用 --model.quant_recipe_name mxfp8 拉起 FSDP2 训练，最常见的两种结果都不好看：一种是 ModelConvertersContainer 初始化时 AttributeError（读不到 config.converters）；另一种是训练能跑，但量化根本没打上，模型还是按原精度在训，显存与吞吐都拿不到 mxfp8 的收益，日志里没有任何“量化未生效”的告警。另外 get_mxfp8linear_config 读 quant_format/block_size/fsdp_world_size 时会直接报错。
  discovery: 2026-10-21 每日扫描
