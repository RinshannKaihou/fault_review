  meta: 'stage: `sft/rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 左 padding batch 里做 logprob 打分时只传 `input_ids`+`attention_mask`、不传 `position_ids`，模型侧 fallback 到 `torch.arange` → 每个 padded 行的位置被整体平移 pad 数。关键非对称：`generate()` 从 mask 推 position（`cumsum-1`），打分侧用 arange——**采样与打分在两套位置上分歧**，而不是一致地错。
  source: 'trl #6800（gpt2 左 pad 13 行实测：max|Δlogp|=1.17e1、序列 logprob 差 -34.0；RoPE 类（Qwen2-0.5B）与绝对位置类 delta 恰为 0；PPO 路径正确构造 position_ids，OnlineDPO/XPO/Nash-MD 均漏）。https://github.com/huggingface/trl/issues/6800'
  behavior: 对 RoPE 是 no-op（这也是它长期潜伏的原因）；对位置敏感实现（ALiBi、学习式/绝对 position embedding）整个 batch 的左 pad 行 logprob 全错、偏移量随 pad 宽度增长。无 crash、无 NaN。与 RL-RO.01/RL-RO.07 不同：权重与分布定义都一致，错的是**喂进模型的位置索引**。
  discovery: 2026-08-20 每日扫描
