id: TRN-0525
legacy_ids: []
slug: deepspeed_zero12_boundary_drops_request_gradients
aliases: []
title: ZeRO-1/2 请求边界提前丢梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: stage_1_and_2 梯度生命周期
  behavior: 非 offload 路径每个累积边界清空 all_grad_tensors 丢弃 step 前各请求梯度；offload 路径边界兼首 backward 不刷新 host 累积器混入上一步存量
effect:
  objects:
  - 梯度
  - 优化器状态
  detail: 调用方对多个请求各设梯度累积边界、把 engine.step() 推迟到所有请求贡献完毕时，非 offload 路径更新静默缺少部分请求的梯度，offload 路径静默混入上一步存量梯度；权重更新方向错但 loss 无异常、无报错；标准单边界即 step 的用法不受影响
  visibility: 静默错误
mitigation:
  detect: 多请求单 step 模式下对比单请求逐步 step 的权重轨迹；检查边界后梯度张量是否仍保留
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8949（open，未合入）：非 offload 保留累积张量到既有 step 清理点；offload 路径在每个边界首 backward 刷新 host 累积器
