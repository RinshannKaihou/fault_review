title: DualPipeV 强绑 permute 融合与专家容量互斥
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: mindspeed-llm
    component: fused_moe_permute 参数校验
  behavior: DualPipeV 依赖 moe-permute-fusion 而自动开启它，capacity 又要按 token 截断/重路由、改变 permute 语义与输入 shape，参数校验直接把两者判为互斥。
effect:
  objects:
  - 可用性/进度
  detail: 同时开 DualPipeV 与 --moe-expert-capacity-factor，训练在 initialize_megatron 的 validate_args 阶段就 AssertionError 退出，流水 overlap 与容量限制无法共存。
  visibility: 报错
mitigation:
  detect: 启动参数校验里列出 DualPipeV 自动打开的 feature 集，与 capacity/pad 类参数做交叉检查
  fix: issue 给两档：短期改报错文案、直接说明 DualPipeV 与 capacity 冲突并建议用 aux_loss；长期解耦调度与 permute 融合，capacity 开启时自动降级为非融合 permute（closed，未附 MR，未核实）
