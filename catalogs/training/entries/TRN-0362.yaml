original:
  mechanism: 'MindSpeed-LLM 4 的 feature manager 在 initialize_megatron → validate_args → MindSpeedFeaturesManager.validate_features_args → feature.validate_args 阶段做参数互斥校验。DualPipeV 流水策略依赖 --moe-permute-fusion 来 overlap 通信与计算，因此会连带开启 permute 融合；而 --moe-expert-capacity-factor 需要按 token 维度截断/重路由，改变了 permute 操作的语义和输入 shape，融合 permute 算子不支持该场景。mindspeed/features_manager/fusions/fused_moe_permute.py:50 于是直接 raise AssertionError: The --moe-permute-fusion can only be enabled if ''--moe-expert-capacity-factor'' is disabled，训练在参数校验阶段就退出，两个特性无法共存。相关模块还有 mindspeed_llm/features_manager/pipeline_parallel/dualpipev_feature.py。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1401（closed；mcore 后端；完整栈与原因分析、两档方案在正文）
  behavior: 同时打开 DualPipeV 和 --moe-expert-capacity-factor 拉起预训练，进程还没进训练循环就在 validate_args 阶段 AssertionError 退出，报 The --moe-permute-fusion can only be enabled if '--moe-expert-capacity-factor' is disabled；按提示关掉 capacity 能跑，但负载均衡只能退回 aux_loss，DualPipeV 的 overlap 也就用不上 capacity 的截断语义。
  trigger_surface: DualPipeV + --moe-expert-capacity-factor + mcore 后端
  discovery: 2026-10-21 每日扫描
