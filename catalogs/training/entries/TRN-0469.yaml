original:
  mechanism: 'trl #7952（2026-10-27）：`vllm_importance_sampling_mode="token_mask"` 文档口径为 token 级（「per-token ratios outside [C_min, C_max] are set to zero」），VESPO 章节也声明支持。但 `loss_type="vespo"` 下置零 ratio 经 `get_gamma_weights`（grpo_trainer.py：`log_is_ratio = torch.clamp(torch.log(importance_sampling_ratio), lower_clamp, 20.0)`）取 log 并累进序列 log-权重：一个被掩 token 给整条序列加 log(1e-8)≈-18.4，φ(w) 塌缩至 ~0。报告者 4×512 张量复现：序列 1/3 各含 1 个置零 token 时 γ 权重输出 [1.0, 2.0e-15, 1.0, 7.4e-24]——即 token_mask 在 VESPO 下从不只丢弃出界 token，而是丢弃整条序列。又因 VESPO 被排除在 `per_token_loss * importance_sampling_ratio` 步之外，被掩 token 自身保留梯度。与 TRN-0229（截断采样 logprob 口径不一致）同为「IS 修正口径错致序列权重塌缩」家族，触发点不同（token_mask 置零后取 log vs 采样截断口径）。源码锚点：grpo_trainer.py get_gamma_weights。'
  source: https://github.com/huggingface/trl/issues/7952
  behavior: GRPO 训练用 loss_type=vespo 且 vllm_importance_sampling_mode=token_mask 时，只要某条 completion 出现 1 个出界 token，该整条序列的 γ 权重即塌到 1e-15~1e-24 量级、序列梯度整体消失；无任何报错，grad_norm 只表现为变小，训练看起来仍在进行但对应样本不再学习。含出界 token 的序列越 多，有效 batch 越小。
  trigger_surface: trl GRPOTrainer loss_type=vespo + vllm_importance_sampling_mode=token_mask（vLLM rollout）；任一 token 的 IS ratio 落在 [C_min, C_max] 外即触发
  discovery: 2026-10-28 每日扫描
  notes:
