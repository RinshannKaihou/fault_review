  - '2026-10-29 更正 2026-10-29 note：VESPO sequence weight 修复 PR 为 #7996/#8000/#8001（closed 且 merged_at=None，未合入）；#7998 是 FSDP2 权重广播另一修复，与本条无关。fix 维持待定。'
