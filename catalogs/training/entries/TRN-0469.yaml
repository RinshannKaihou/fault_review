title: trl VESPO+token_mask 单 token 出界压零整条序列权
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: VESPO get_gamma_weights
  behavior: token_mask 把出界 token 的 IS ratio 置 0 后，VESPO 的 get_gamma_weights 对置零 ratio 取 log 并按序列求和：单个被掩 token 给整条序列加 log(1e-8)≈-18
effect:
  objects:
  - 训练信号
  - 梯度
  detail: 含任一出界 token 的整条 completion 的 gamma 权重塌到 ~1e-15/~1e-24 量级，序列级梯度被整体抹掉；无报错、grad_norm 仅显示变小。
  visibility: 静默错误
mitigation:
  detect: cispo_clip_ratio/IS 权重直方图：单 token 出界序列整体塌零；γ 权重分布双峰
  fix: 待定（issue open，2026-10-27；文档口径与实现矛盾待维护者裁决）
