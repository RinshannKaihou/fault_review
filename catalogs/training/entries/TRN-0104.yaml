  meta: 'stage: `shared` · Cov: `var:grad_clip_absorbs_sdc_spike` · 置信度 `documented`'
  mechanism: 全局 clip_grad_norm 只看整体 L2 范数：任何把范数抬高（或抬翻溢出）的梯度损坏都会被统一的 `clip_coef` **静默重缩放回 clip 阈值**，方向不校验、逐参数幅值不校验、skipped-iteration 不触发。PAR.05（2^N 梯度翻倍）是该机制的精确放大器：N≤~64 时 `2^N` 倍损坏梯度被 clip 归一后照常 step——「方向对、幅值假」的更新持续打进权重；N=128 时范数溢出为 inf，clip_coef≈0，run 变成零梯度空转。
  source: 'Megatron-LM #6660（实测 clip 把 ×2^16 的 expert 梯度统一重缩放掉，`number of skipped iterations = 0`；clip 关闭时同 run 表面收敛）。https://github.com/NVIDIA/Megatron-LM/issues/6660'
  behavior: clip 开着时梯度损坏的幅值证据被抹掉，只有范数溢出（N 大或损坏更猛）才可见；grad_norm 图「正常」不等于梯度没坏。与 OPT.02 同族（clip 吃掉尖峰），不同面：OPT.02 是单步尖峰被吃，本条是**持续性幅值损坏被常态化重缩放**，且放行与清零两个 regime 之间隔着一次 fp32 溢出。
  discovery: 2026-08-20 每日扫描
