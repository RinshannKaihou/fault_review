original:
  mechanism: 'cann/ops-transformer #6666（2026-10-24，open，A2 910B2 / CANN 9.2.0 / master 92d0f9c2）。aclnnNsaCompressGrad 的 weightGradOut 在 compressBlockSize*headNum≥256 时计算错误，同用例 inputGradOut 始终正确。49 组规模扫描无一例外：240（16×15、48×5）PASS，256（16×16、32×8、64×4，headDim 16/32/48）FAIL（256/256 全错）、320（80×4）FAIL。错误结构不是全 0 而是别的 (row,head) 的归约值（示例 want/got 前缀完全错位），指向归约索引在乘积≥256 时行/头映射错位。资料只约束 blockSize/stride 为 16 的整数倍且 blockSize>stride，未限制乘积，256+ 属支持面内。两段与同步返回 0。NsaCompressGrad 是 NSA 稀疏注意力压缩（compress）的反向梯度算子，训练路径。'
  source: https://gitcode.com/cann/ops-transformer/issues/6666
  behavior: NSA 稀疏注意力训练中，压缩块的 weightGrad 输出在 blockSize×headNum 达到 256 及以上时全部算错——错误值不是 0 而是张冠李戴的其他行列归约结果；240 以下全部正确。作业不报错继续跑，权重梯度一直错到有人对拍才会发现。
  trigger_surface: aclnnNsaCompressGrad，compressBlockSize*headNum≥256（如 16×16、32×8、64×4、80×4）；A2 910B2 / CANN 9.2.0 实测，49 组扫描无一例外。
