id: TRN-0341
legacy_ids: []
slug: mindspeed_rl_dapo_reward_labels_nested_loop_reversed
aliases: []
title: DAPO rule_reward labels 两层循环顺序反致奖励错配
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: mindspeed-rl
    component: rule_reward labels 展开
  behavior: rule_reward.py 展开 labels 时把两层循环写反（外层 n_samples_per_prompt、内层 batch_data['labels']），得到的是按样本优先的顺序，而下游按样本内 n 次重复消费。
effect:
  objects:
  - 训练信号
  - 训练样本流
  detail: reward_dispatch_size 与 n_samples_per_prompt 不一致时，labels 顺序与 rollout 样本不匹配，同一 prompt 的多次采样拿到别条样本的 label，reward/advantage 错配；无报错无 NaN。
  visibility: 静默错误
mitigation:
  detect: 构造 batch 内 label 可区分的小样例跑一遍 rule_reward，检查展开后 labels 与样本的对应关系；或断言 len(labels) 与 reward 数一致且逐项对齐。
  fix: issue 给出改法：外层改为 for label in batch_data['labels']、内层 for _ in range(self.n_samples_per_prompt)；issue 已 closed，正文未给出合入 PR（未核实）。
