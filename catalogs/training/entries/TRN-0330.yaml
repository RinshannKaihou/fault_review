id: TRN-0330
legacy_ids: []
slug: mindspeed_llm_dsa_shareindex_cache_overwritten_in_recompute
aliases: []
title: DSA ShareIndex TopK 缓存被后组覆盖，重算错读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: mindspeed-llm
    component: DSA ShareIndex TopK 缓存
  behavior: ShareIndex 的 TopK 只存在进程级全局变量里、仅保留最近一次写入，未与当前 forward/microbatch 及 source layer 绑定；开启 full recomputation 后多个共享组互相覆盖。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 正向 L3 计算、L4-L6 复用，L7 计算、L8-L10 复用时，反向逆序重算 L4-L6 会误读 L7 的 TopK，attention 结果与梯度错；动态长度场景进一步表现为 shape 不匹配报错，无 NaN。
  visibility: 静默错误
mitigation:
  detect: 在 Compute 层记录 layer key 与 TopK 的对应关系，重算后校验 Share 层读到的 source layer 是否与正向一致；开 full recompute 后对比关重算的 loss 曲线。
  fix: issue 给出实现方案（参考 Megatron-LM 在 forward carrier 上存 dict[source_layer, topk_indices]，holder 绑定 packed_seq_params/attention mask，checkpoint 反向后恢复同一 holder 引用）；issue 已 closed，未在正文给出合入 PR 号（未核实）。
