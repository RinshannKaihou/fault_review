title: Addcmul 把标量 value=NaN 判为 1 静默输出有限值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnAddcmul IsEqualToOne
  behavior: IsEqualToOne 判据 !(value>1 || value<1) 在 IEEE-754 下 NaN 比较恒 false，取反为 true，NaN 被判为等于 1，进入 AxpyV2 快路径不做 value 乘法，输出退化为 sel
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: 标量 value=NaN 时按公式 out=self+value×t1×t2 应输出全 NaN，实际静默输出看似正常的有限值；训练中 value 来自已变 NaN 的量（如 loss scale、权重系数）时，本应立即暴露的 NaN 被吞成静默错值，训练继续但更新已错。
  visibility: 静默错误
mitigation:
  detect: 对含 NaN 标量的 addcmul 调用检查输出是否 NaN；训练侧监控 value 来源（loss scale 等）是否为 NaN。
  fix: 待定（issue open，未见修复 MR）。
