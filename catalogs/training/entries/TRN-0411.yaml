original:
  mechanism: 'cann/ops-math #3894（2026-10-24，open，A2 910B2 / CANN 9.2.0 / torch 2.14.0 + torch_npu 2.14.0，C 直调两段式）。aclnnAddcmul/aclnnInplaceAddcmul 在标量 value 取 NaN 时把 value 当作 1.0：输出为 self+tensor1×tensor2 有限值而非全 NaN。根因（math/addcmul/op_api/aclnn_addcmul.cpp）：:203-209 IsEqualToOne 判据 return !(value->ToFloat()>1 || value->ToFloat()<1)，IEEE-754 下 NaN 与任何数比较均为 false，取反后整体为 true，NaN 被判为等于 1；:285-286 据此进入 l0op::AxpyV2 快路径不做 value 乘法。原地接口共用实现表现相同。资料公式 out=self+value×t1×t2 未声明 NaN 例外，value=NaN 应全 NaN。复现 A 组对照 value=1.0 正常、B/C 组 value=NaN 静默有限值。addcmul 用于梯度更新类组合公式（如部分优化器/自定义更新、torch.addcmul 训练钩子），NaN 吞噬使上游异常不暴露。推理编目 INF-2160 已收同源；本条为训练侧条目。'
  source: https://gitcode.com/cann/ops-math/issues/3894
  behavior: 在 NPU 上调用 addcmul（含原地版本）且标量 value 恰为 NaN 时，输出不是 NaN 而是一个看似正常的有限数（等于 value 取 1 的结果）；GPU/CPU 上同输入输出 NaN。训练中一旦 value 来自已变 NaN 的量（如 loss scale、权重系数），本应立刻炸出的 NaN 被吞成静默错值，训练继续跑但更新已是错的。
  trigger_surface: aclnnAddcmul/aclnnInplaceAddcmul，标量 value=NaN；A2 910B2 / CANN 9.2.0 实测，含 torch.addcmul 适配路径。
  discovery: 2026-10-25 每日扫描
