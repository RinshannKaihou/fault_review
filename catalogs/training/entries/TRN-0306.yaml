id: TRN-0306
legacy_ids: []
slug: mswift_last_ckpt_symlink_shared_tmp_race
aliases: []
title: ms-swift last-checkpoint 符号链接共享 tmp 路径竞态
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: ms-swift
    component: last-checkpoint 符号链接更新
  behavior: update_last_checkpoint_symlink 用固定暂存路径 last-checkpoint.tmp：并发保存回调互删对方暂存链接，os.replace 后发布别人的目标且返回成功，另一方丢暂存链接
effect:
  objects:
  - 模型权重
  detail: 并发 checkpoint 保存（如多进程训练各自更新 last-checkpoint，或保存与导出重叠）时，训练完成后 last-checkpoint 链接可能指向另一个（旧的或别人的）checkpoint 目录，且一个调用方收到成功返回；按该链接恢复训练会静默加载错检查点，无任何报错。
  visibility: 静默错误
mitigation:
  detect: 发布后 readlink 校验目标等于自身 checkpoint 名；并发保存时对链接做轮询比对
  fix: 待定（issue open：给出确定性双线程 barrier 复现与修复方向——每次更新用唯一暂存名（如 mkstemp 风格/pid 后缀）；swift 侧修复 PR 未见）
