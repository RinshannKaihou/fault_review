original:
  mechanism: 'modelscope/ms-swift issue #10336（2026-10-12 创建，本轮窗口内首次评估）。update_last_checkpoint_symlink() 的实现：tmp_path = link_path + ''.tmp''；if os.path.lexists(tmp_path): os.remove(tmp_path)；os.symlink(basename(checkpoint_dir), tmp_path)；os.replace(tmp_path, link_path)。目标替换原子，但暂存文件名固定、多 writer 之间不隔离。确定性复现：A 建 checkpoint-1 暂存 → B remove 并建 checkpoint-2 暂存 → A os.replace 发布 checkpoint-2（成功返回）→ B 再 replace 时 FileNotFoundError（丢暂存链接）。同样的交错已用两个线程 + 围绕原 helper 文件系统操作的 barrier 复现：A 返回 success、B 返回 None、最终链接指向 B 的目标。并发 checkpoint-save 回调（多保存器/并发训练+导出）即现实触发面。'
  source: https://github.com/modelscope/ms-swift/issues/10336
  behavior: 训练任务里如果有两个保存动作并发发生（例如多进程训练各自更新 last-checkpoint、或保存与导出重叠），训练完成后 last-checkpoint 链接可能指向另一个（旧的或别人的）checkpoint 目录，而其中一个调用方还收到成功返回；之后按 last-checkpoint 恢复训练就静默加载错检查点，无任何报错。单 writer 的常规保存不受影响。
  discovery: 2026-10-17 每日扫描
