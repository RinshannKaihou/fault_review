cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: KL loss 反向 workspace 尺寸
  behavior: 第一段返回的 workspaceSize 小于 kernel 实际用量，kernel 写到 workspace 之外；越界写无报错（两段接口与同步均返回 0）。
effect:
  objects:
  - 数值结果
  - 模型权重
  detail: B=1 S2=5 实测越界写 96 字节（首个偏移 32，连续 3 次一致）；越界量与 S2/B 相关：S2=1→28B、S2=2→56B、S2=5→140B（B=3），S2=8（8 对齐）→0B；mssanitizer memcheck 同配置报 GM 越界写命中本算子。
  visibility: 静默错误
mitigation:
  detect: 按 workspaceSize+4096 分配、尾部预填 0x5A 哨兵执行后回读（issue 附 C++ 一键复现）；mssanitizer --tool=memcheck
  fix: 待定（issue open 2026-10-28；触发量与 S2/B 相关、S2 8 对齐时不越界——短期可按对齐规避，未核实）
