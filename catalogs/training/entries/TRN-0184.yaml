original:
  category: SFT
  section: SFT
  meta: 'stage: `sft` · Cov: `NEW` · 置信度 `documented`'
  mechanism: LoRA `target_modules` 本质是**模块名选择器**：列表里匹配不到任何模块的条目被静默跳过，无零匹配/近零匹配警告。TRL 官方 Nemotron 3 SFT 示例（`examples/scripts/sft_nemotron_3.py`）对 NemotronH 混合架构给出 Llama 式 MLP 名（`gate_proj`/`up_proj`/`down_proj`），而 Mamba-2 层实为 `in_proj`/`out_proj`、MoE 层另名——adapter 只挂上 56 层中的 4 层 attention（7.1%）。与 CKPT.06/CKPT.07 族（死参数/被覆盖）的边界：key 被 PEFT **正常消费**，配置无错位；错在**选择器值对架构静默欠匹配**且框架层缺「列出项未命中任何模块」护栏，用户复制官方示例即中招。
  source: 'trl #6773（DPO LoRA 实测：attention-only target_modules，adapter 覆盖 4/56 层；提议 TRL 加 target_modules 未匹配运行时告警；关联 PEFT PR #3289 NemotronH 默认 target_modules）。https://github.com/huggingface/trl/issues/6773'
  behavior: DPO LoRA 25 步 loss 钉死 0.6931=ln(2)、模型行为零变化（与 SFT.04/SFT.06 同症状：有效偏好/监督信号趋零）；SFT 场景则表现为「在训但只训了 7%」——loss 会动但远弱于预期，曲线无法区分。全程无 crash、无 warning。
  discovery: 2026-08-24 每日扫描
  notes:
  - '2026-10-17 回访 2026-10-17：同机制新实例 trl #7765（2026-10-16）——transformers v5 + peft<0.19 下 LoRA target_modules=[gate_proj,up_proj,down_proj] 在 MoE 模型上静默只挂 dense/shared experts（GLM-4-MoE 实测仅 dense first layer + shared_experts 权重变化，routed experts 全未训练，无 error/warning；无 dense/shared 层的模型如 Qwen3-MoE 则报 target modules not found）。与 TRN-0184（SFT.07，示例名错致欠匹配）同属 target_modules 静默欠匹配家族，触发面变为 transformers v5 的模块树暴露变化；TRL 侧尚无修复，root cause 待查（trl #7765 open）。'
