  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: verl v1 trainer 在 `algorithm.use_pf_ppo=true` 且 GAE advantage 路径下，PF-PPO 对整批数据有放回重采样；v1 的 `_compute_advantage` 却先从 TransferQueue 取**原始行序**的 `response_mask`，再把重采样后的 `advantages` / `returns` 依原键写回。原轨迹的 response、old/ref log-prob 留在队列原位置，因而更新时 advantage 与其对应轨迹错配；v0 trainer 将重采样后的整个 `DataProto` 一起传下去，不属于本问题。
  source: 'verl #7956（2026-09-18；在 main `23a341e3` 上的代码路径核对与无 GPU 的 CPU 复现；截至 2026-09-24 issue 为 open）。https://github.com/verl-project/verl/issues/7956'
  behavior: 来源的 CPU 路径复现了优势值与轨迹键错配而没有异常；在上述配置下，策略梯度会把 credit assignment 赋给错误轨迹。**未提供长程训练回报或任务指标实测，未评估检测器效果**。与 RL-ADV.09 的 shaped reward 过滤谓词错配不同，这里是有放回重采样后跨键写回破坏样本身份。
  discovery: 2026-09-18 远程扫描回填；2026-09-24 合并复核
