  - subsystem: 算子/内核
    stack: cann
    component: SparseFlashMlaGrad arch22
  behavior: A2 的 post.h 与 sfag_basic.h/smlag_basic.h 里 DataCopyPad 目标地址按 tile 步进直接计算，尾块/对齐无越界保护，写越界落在已映射内存时静默、落在未映射内存时 AI Core 异常
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: '合法基线返回 0、结果可用，但 mssanitizer memcheck 报 1060 处 GM 写越界（单笔最大 896B），--padding 1024 后仍同样报；同族 #6534/#6535 在边界形态表现为 507057/507015 崩核'
  visibility: 静默错误
mitigation:
  detect: mssanitizer -t memcheck --padding 1024 包住训练进程，统计 out of bounds 计数；越界落在未映射页时提前表现为 AI Core 异常
  fix: 待定（master 复核 arch22 post.h/sfag_basic.h 未见尾块越界保护，未修）
