original:
  mechanism: 'cann ops-transformer aclnnSparseFlashMlaGrad（Atlas A2 910B2 8 卡 / CANN 9.2.0）在完全合法的基线上（BSND、B=2、S1=128、S2=256、N1=32、D=512、cmpRatio=1、sinks/dSinksOut 齐备、metadata 正常前置）程序正常返回 0、结果可用，但 mssanitizer memcheck 报 1060 处 GM 写越界、单笔最大 896B（block aiv(1)，SparseFlashMlaGrad kernel）；--padding 1024 放大安全区后仍同样报，说明越界量超出对齐 padding、非对齐假阳性。master 复核（A2 op_kernel/arch22/post.h 与 arch22/sfag_basic.h/smlag_basic.h）：DataCopyPad 目标地址按 tile 步进直接计算，未见尾块/对齐的越界保护。报告者指明与本批 #6534（sinksOptional 为空 AI Core 越界 507057）、#6535（TND+cmpRatio=128 部分组合越界 507057/507015）是同一类问题不同表现：越界落在已映射内存只被 sanitizer 抓到，落在未映射内存直接 AI Core 异常——即平时静默写坏相邻显存，边界情形崩核。复现 1/1，ctypes 直调，先 aclnnSparseFlashMlaGradMetadata 再主算子。'
  source: 'https://gitcode.com/cann/ops-transformer/issues/6537（2026-10-22，open；含 sanitizer 计数、padding 对照与 master 源码复核）；同族 #6534 https://gitcode.com/cann/ops-transformer/issues/6534 、#6535 https://gitcode.com/cann/ops-transformer/issues/6535 、跨参数校验缺失 #6536 https://gitcode.com/cann/ops-transformer/issues/6536'
  behavior: MLA 类模型训练用 Sparse Flash MLA 反传：日常跑合法 shape 一切正常（返回 0、结果能对拍），但 kernel 每次都在向输出张量声明范围之外的 GM 写最多 896B——相邻显存（可能是别的激活、优化器状态）被悄悄改写，训练出现难归因的偶发数值污染；换成特定参数组合（sinks 为空、TND+cmpRatio=128）则直接 AI Core 异常崩训练。不用 mssanitizer 包住进程时第一种形态完全不可见。
