  meta: 'stage: `sft/rl` · Cov: `var:preference_pair_swapped_or_identical` · 置信度 `documented`'
  mechanism: OpenRLHF `RewardDataset` 对 chosen/rejected **各自独立**截断到 `max_length` 再把末位保留 token 强制覆写为 EOS。偏好差异位于截断边界之后、或恰在末位保留 token 上时，两条模型输入变得**完全相同**——数据集过滤只查 `prompt is None` 与 DPO 的 prompt 长度，变换后无任何校验，坏 pair 被静默保留并训练。这是 SFT.04「identical pair」的一个**生成机制**：不是管道列错，是合法 max_len 变换自己造出来的。
  source: 'OpenRLHF #1311（`reward_dataset.py` 行号级根因；RM/DPO 公共 CLI 默认 `--data.max_len=512` 即可达；实测 Qwen3.5 复现）。https://github.com/OpenRLHF/OpenRLHF/issues/1311'
  behavior: RM/DPO 的 pair loss 恒 `ln(2)`、主偏好梯度精确为 0；混合 batch 里这些常数损失样本稀释梯度、扭曲 accuracy/step 口径。无 crash 无 NaN，loss 曲线只是「降得慢」。与 SFT.04 互补：SFT.04 收现象族，本条收**变换内生**的产生路径（默认 512 max_len 下长答案数据集必然渗入）。
  discovery: 2026-08-21 每日扫描
