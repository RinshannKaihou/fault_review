title: mhcPreSinkhornBackward 梯度系统偏差与并发输出污染
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MhcPreSinkhornBackward 归约
  behavior: 大 shape 反向梯度与前向有限差分存在 ~2e-2 系统偏差（偏差在 backward 侧）；kernel 侧归约读与清零构成跨调用 WAR 并伴 UB 越界读，共享 context 并发调用时输出被跨调用污染。
effect:
  objects:
  - 梯度
  detail: M·K≥2M 起 gradBias/gradPhi 与有限差分偏差达 1e-2~3e-2 且符号可反；8 线程共享 context 并发重放不同 shape 时 74 次输出位模式与单线程基准不一致（部分稳定错、部分随机错），单线程串行不可见。
  visibility: 静默错误
mitigation:
  detect: 反向梯度与前向有限差分对拍（多 eps 平滑外推）；mssanitizer racecheck 检同 block WAR；并发多 shape 重放与单线程基准比位模式。
  fix: 待定（issue open 2026-10-23；master arch22 kernel 与 9.2.0 零功能改动，缺陷同存）
