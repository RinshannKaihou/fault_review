original:
  mechanism: 'DeepSpeed PR #8947（2026-10-30，open）：opsd.py generalized_jsd_loss 对 bf16/fp16 logits 错计有效 token 数并错配 loss 尺寸。原因：response mask 在 .sum() 前被 cast 成 logits dtype——bf16 对 >256 的计数舍入（97992 变 97792），fp16 超过 65504 后溢出为 int64 max，loss 随之归 0。修复：mask 计数用 int64、逐 token JSD 在至少 float32 上求和；fp32/fp64 行为不变。测试：tests/unit/runtime/rollout/test_rollout_interface.py CPU（Apple M2 Pro, torch 2.11.0）新增 bf16/fp16 用例修前失败（97792==97992、int64 max==97992）、修后 22 通过。未覆盖 GPU、ZeRO 与多 rank 聚合。'
  source: https://github.com/deepspeedai/DeepSpeed/pull/8947
  behavior: 用 DeepSpeed OPSD 蒸馏（generalized_jsd_loss）且 rollout/学生 logits 为 bf16 或 fp16 时：bf16 下有效 token 计数被舍入（9.8 万 token 差 200），loss 归一化分母错；fp16 下计数溢出使 JSD loss 直接变 0——蒸馏目标静默消失，训练照常跑完、指标看似正常，实际学生没有从 teacher 学到任何信号。
  trigger_surface: DeepSpeed OPSD generalized_jsd_loss + bf16/fp16 logits（长 response 计数 >256/>65504）；#8677 引入的 opsd.py
  discovery: 2026-10-31 每日扫描
