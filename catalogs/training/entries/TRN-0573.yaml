id: TRN-0573
legacy_ids: []
slug: ops_nn_bn3d_training_reduce_fp16_fused_kahan_loss
aliases: []
title: BN3DTrainingReduce FP16 融合归约平方和精度超差
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BN3DTrainingReduce 归约
  behavior: FP16 单 tile 融合路径每 8 个向量块先做朴素累加，块内已舍弃的低位不能由后续 Kahan 恢复；平方和输出相对 FP64 正确舍入值在部分通道低 1 ULP。
effect:
  objects:
  - 数值结果
  detail: 950PR 实测：FP16 NDHWC [12,17,12,20,10]（[-1,1]）平方和 RMSE 比值 1.732>1.5 门槛，冻结输入三次稳定失败；块参数 8→2 后 3/3 PASS（比值 1.414）；全量复测 588 条正向精度失败 0。
  visibility: 静默错误
mitigation:
  detect: 三方精度比对（cross_check L1 判据）+ FP64 参考正确舍入值；冻结输入回归。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13229 （merged 2026-11-02）：FP16 融合路径块参数 8→2，恢复 Kahan 补偿有效性；132 条回归全过。未核实发布。
labels:
  stage:
  - shared
  confidence: documented
  coverage: var
  discovered: '2026-11-01'
remarks: TRN-0564（BN3DTrainingReduce FP16 短行/分核丢补偿量）同算子同族的另一触发面：单 tile 融合路径块内朴素累加丢低位。BN3DTrainingReduce 是 3D BN 训练归约算子，训练统计量直接受影响。
evidence:
- url: https://gitcode.com/cann/ops-nn/issues/7831
  kind: gitcode_issue
relations:
