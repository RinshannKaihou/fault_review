original:
  mechanism: 'verl #8462（2026-10-30，open）：Continuous Token（#6719）多轮 rollout token-in/token-out 生成，注册的 QwenContinuousTokenBuilder/GLMContinuousTokenBuilder 处理了 #6719 pitfall 3 的边界反例（Qwen3 <|im_end|> 后缀 \n、GLM-4.7 <|observation|> 双角色去重）。两个缺口：1) 不在注册表的 model_type 回退默认 builder，把两个反例带回来——GLM-4.7-Flash（glm4_moe_lite）、Qwen3-Next（qwen3_next）等 ChatML 型模型命中；2) 训练中无 comparator（pitfall 4 的 scripts/chat_template_checker.py 存在但不在训练路径运行），tokenization_sanity_check_mode 自 #4422 起为 no-op。后果：rollout 与 train 仍自洽（A 性质成立），但合并流相对 chat template 单次渲染（SFT 数据与 serving 用的口径）静默错位（B 性质破坏）。'
  source: https://github.com/verl-project/verl/issues/8462
  behavior: verl Continuous Token 多轮 RL 训练用未注册的 model_type（GLM-4.7-Flash、Qwen3-Next 等 ChatML 型）时：多轮合并出的 token 流在边界 token 上与 chat template 正确渲染不一致（如 <|observation|> 重复、<|im_end|> 后缀丢失），训练在这些错位 token 上照常计算 logprob/loss，无任何校验或告警；与 SFT 数据或 serving 输出对齐检查才能发现。
  trigger_surface: verl Continuous Token（#6719）+ 注册表外 model_type（glm4_moe_lite/qwen3_next 等）；多轮 rollout
