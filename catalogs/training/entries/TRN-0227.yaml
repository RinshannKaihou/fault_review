  mechanism: TIM 的 MoE 特例：连 top-k 专家集合都可以不一致。不回放路由，重要性采样校正的是一张错图。
  source: 'R3 arXiv:2510.11370。https://arxiv.org/abs/2510.11370 ；框架实例（2026-08-20 补）：verl #7463——`actor.router_replay.mode`（官方 Ascend 文档教的键）是死 key，engine 只读 `actor.megatron.router_replay.mode`，按文档配置的 routing replay 静默 `disabled`，大 MoE 的 train/infer 路由不一致无人拦截（机制详见 CKPT.07 实例三）。https://github.com/verl-project/verl/issues/7463 ；verl PR #7805（2026-09-12 补：R2 router replay 的**半修复回归史**——首版实现查 process-global router registry，replay 关闭时普通 Megatron SFT/RL job 因空 registry 直接 RuntimeError 而被 #7786 revert；重引入版改为 model-scoped + 显式 opt-in，空 registry 在 disabled 下视为 no-op、R2 活跃时缺 routing 数据保持硬失败——「正确性修复被回滚」本身即此类契约脆弱性的实例）。https://github.com/verl-project/verl/pull/7805'
  behavior: MoE RL 比 dense 更早塌。
  discovery: 2026-08-17 基础调研
