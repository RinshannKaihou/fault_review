original:
  mechanism: 'triton-ascend 的 getTransposedValue 把 tl.permute 无条件降为 linalg.transpose。只移动 size-1 维、保持非单一维相对顺序的空排列（no-op permutation）实际不移动数据、语义等于 reshape，但 bishengir bufferizer 把得到的 linalg.transpose 当真实立方转置处理：(1,4096)->(4096,1) 的 reshape 被重新折回 64×64 并以分形（NZ）布局布置 buffer，UB 需求放大 8 倍，触发 "ub overflow, requires 3407872 bits while 1572864 bits available"（上游 issue #1640）。修复 PR #2848（open）：getTransposedValue 检测 isNoOpPermutation（输出维从左到右扫描、非单一维保持相对顺序）并降为 tensor.collapse_shape+tensor.expand_shape 纯 reshape；真实转置保持 linalg.transpose 路径。'
  source: https://github.com/triton-lang/triton-ascend/pull/2848（现象载体 https://github.com/triton-lang/triton-ascend/issues/1640）
  behavior: 在 NPU 上跑含 (1,N)->(N,1) 类维度重排的 Triton kernel（常见于注意力/MLP 前处理的 reshape 链）时编译直接报 ub overflow 无法运行；同程序在 GPU triton 上语义等价可跑。属移植正确性缺陷：合法 Triton 程序被后端错降级为不可执行布局
  discovery: 2026-10-30 每日扫描
