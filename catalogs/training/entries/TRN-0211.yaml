  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: GRPO 系动态采样靠 filter metric 丢弃「无对比」组，但实现把 metric 做成可配置项——**按 shaped 训练分过滤时谓词语义失配**：复合 shaped reward 下 all-fail 组（任务全失败）内部仍有非零组内离差（shaping 分量差异），谓词判「有对比」放行；std 归一化把失败组内部的 shaping 差异**提升为满幅 phantom advantage**，策略在「全是错解、只有格式/过程分不同」的组上拿到完整学习信号。verl native recipe/dapo trainer 实测（Qwen2.5-1.5B LoRA + GSM8K 自定 shaped hook，模型/数据/reward/trainer 全固定、只换 metric）：score 指标臂 40 步内 0 次 batch refill、终值 EM 0.160；accuracy 指标臂 29/40 步 refill、终值 EM 0.763；无过滤臂 EM 0.080±0.112。作者定位为 metric-谓词语义错配（区别于已知 shaping 放大与 all-fail 过滤），并直接instrument了 native deletion/refill telemetry。
  source: arXiv:2609.13866（2026-09-12；受控 GSM8K 对照 + verl native trainer 复现）。https://arxiv.org/abs/2609.13866
  behavior: 无 crash、指标看似正常推进——**训练信号在系统性学习「失败组内的 shaping 差异」**，收敛终点被拉向格式/过程分黑客方向（EM 0.160 vs 0.763 同预算同配置）；filter 命中率 telemetry（refill 次数）是唯一可观测异常。与 RL-ADV.04（drop 谓词只认二值 std）同族：**过滤谓词与奖励语义错配**，那边漏掉软奖励近同分组、这边反向放行全失败组；与 RL-ADV.08（guess 路径伪优势）互补：那边是 outcome 不区分路径、这边是 filter 不区分 outcome 与 shaping；对 RL-RWD 家族（shaped reward 黑客）是 estimator 侧的放大器。
  discovery: 2026-09-16 每日扫描
