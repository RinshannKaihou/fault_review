original:
  mechanism: 'DeepSpeed ZeRO-2 在 overlap_comm=true + contiguous_gradients=true 时把梯度 reduce-scatter 放独立 reduction stream 与 backward 重叠。v0.18.5 起 PR #7805（commit 15ad92b4）删掉 PR #7371 在 IPG bucket swap 前的双向流同步（认为冗余）；而 buffer 生命周期正解 PR #7965（reduction/copy buffer 缺 record_stream，caching allocator 在 NCCL 通信完成前回收存储→NaN）v0.19.0 才合入——0.18.5–0.18.9 处于「同步已删、正解未落地」窗口：异步 reduce-scatter 在飞时 buffer 被复用/回收→梯度 NaN→第 1 个 optimizer step 写 NaN 入权重→第 2 步起前向 NaN、loss=0。grad_norm 恒 √2 机理：PR #7171 的 mask_nan_or_inf 把 NaN 范数掩成 -1.0，2 个 param group 合并范数 √2。复现：ms-swift 4.5.3 + deepspeed 0.18.9（install_all.sh 约束装得）、Qwen3.5-0.8B、2 节点×2×RTX3090（SP=2/DP=2）、ZeRO-2 自定义 config；单变量 bisect 证实 overlap_comm=true 复现、false 正常、use_reentrant 无关；step1 前向逐位相同（loss=1.1171875）但 step1 grad_norm 已分叉（√2 伪值 vs 真值 32.0），证明损坏发生在第一次 backward 的 reduce 阶段。上游同症状追踪 #7188/#5545/#7965/#8061/#8080。'
  source: https://github.com/modelscope/ms-swift/issues/10372 ；上游修复：https://github.com/deepspeedai/DeepSpeed/pull/7965 ；同步删除：https://github.com/deepspeedai/DeepSpeed/pull/7805
  behavior: ZeRO-2 + overlap_comm=true 的全参微调：第 1 步 loss 正常，第 2 步起 loss=0、token_acc=0、per-channel loss=NaN，grad_norm 恒定 √2（两个 param group 时）；训练继续跑不崩。√2 这个特征值来自 NaN 范数掩成 -1 后的合并，可作快速判据。触发窗口为 deepspeed 0.18.5–0.18.9 + ZeRO-2 + overlap_comm=true（ZeRO-1/3 不受影响）。
  discovery: 2026-10-16 每日扫描
