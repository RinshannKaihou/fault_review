id: TRN-0286
legacy_ids: []
slug: zero2_overlap_comm_stream_race_nan_weights
aliases: []
title: DeepSpeed 0.18.5-9 ZeRO-2 overlap 竞态 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: deepspeed
    component: IPG bucket swap 前的双向流同步被删
  behavior: 'v0.18.5 起 PR #7805 删掉 IPG bucket swap 前的双向流同步，异步 reduce-scatter 在飞时 buffer 被回收复用；正解 record_stream v0.19.0 才合入。'
effect:
  objects:
  - 梯度
  - 模型权重
  - 训练信号
  detail: 第 1 步 backward 梯度即 NaN；第 1 个 optimizer step 把 NaN 写进权重，第 2 步起 loss=0。grad_norm 恒 √2（NaN 范数被掩成 -1 后合并），伪值掩盖真实 NaN。
  visibility: 数值异常
mitigation:
  detect: grad_norm 恒等于 √(param_group 数)（2 组即 √2）即可判定底层梯度 NaN；或第 2 步起 loss 塌 0。
  fix: '上游修复 PR #7965 已随 v0.19.0 发布（#8061/#8080 于 v0.19.3 补 torch.compile 多流 producer 场景）；规避：overlap_comm=false 或升级 deepspeed >= 0.19.3。ms-swift install_all.sh 的 "deepspeed<0.19" 约束会精确装进受影响窗口，issue 建议提升约束（open 未合）。https://github.com/deepspeedai/DeepSpeed/pull/7965'
