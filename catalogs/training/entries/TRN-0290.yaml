id: TRN-0290
legacy_ids: []
slug: mswift_lazy_dataset_resume_fallback_divergence
aliases: []
title: ms-swift LazyLLMDataset resume 后超长替换样本选错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: ms-swift
    component: LazyLLMDataset 替换游标
  behavior: LazyLLMDataset 用自建 _idx/_idx_list 游标选超长删除后的替换样本，_idx 为实例内部状态；resume 重建实例后 _idx 归零，跳过已消费行不复放此前的编码失败，后续替换选择与连续训练分叉。
effect:
  objects:
  - 训练样本流
  detail: 固定 seed、sampler 位置正确、编码确定的前提下，resume 后再次触发超长删除时替换样本不同：64 行实验 row20 连续选 58、重建后选 52；真实 ckpt 实验步 5-8 最大 loss 差 0.0025。
  visibility: 静默错误
mitigation:
  detect: 对比 resume 与连续训练的 consumed batch 序列；对触发替换的样本记录替换来源做审计。
  fix: issue 给出方向：为每个发生替换的样本现场生成只依赖全局 seed 与样本序号的候选列表，使数据集无状态（未核实修复 PR 状态；issue open）
