original:
  mechanism: ms-swift LazyLLMDataset（lazy tokenization）用自建 _idx/_idx_list 游标管理编码失败（MaxLengthError, strict=false 超长删除策略）后的替换样本选择；_idx 自增且为实例内部状态，其他模块（sampler/ckpt）不可见。resume 重建数据集实例时 permutation 重放但 _idx 归零，跳过已消费行不会复放此前的编码失败，后续替换候选选择与不中断训练分叉。CPU 复现：64 行、seed42、fail 行 {2,20}，连续读 32 行时 row20 选 58；重建后从 16 起读选 52。真实 ckpt 集成实验：Qwen3-0.6B-Base、2×B200、BF16、global batch 4、8 步、seed/data_seed 42、max_length 256、lazy tokenization、无 streaming/packing/shuffle、num_workers=0，行 2/20 真超长；连续 vs step4 存档退出重启，两 rank 均恢复 step=4、consumed_samples=16，step-6 batch 不同、step5-8 最大 loss 差 0.002499222755432129（Magnus/Megatron Bridge 集成，非原生 swift CLI 端到端）。Swift 4.4.2、PyTorch 2.13.0+cu130。
  source: https://github.com/modelscope/ms-swift/issues/10374
  behavior: 用过长删除策略（超长样本替换）+ lazy tokenization 的训练在中断 resume 后：训练正常推进、无任何告警，但替换样本与不中断训练不同——数据流静默分叉，loss 曲线有细微但持续的偏差（实测步 5-8 最大差约 0.0025），长跑累积后与预期轨迹不可对齐；只在再次触发替换时发生，不触发则无差异，定位困难。
  discovery: 2026-10-16 每日扫描
