title: triton_experimental 静默丢弃用户 triton kernel
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: triton_experimental 后端
  behavior: 后端未捕获 triton_kernel_wrapper_mutation，也不 graph break：生成的 wrapper 只 empty_strided 分配输出，用户 @triton.jit 启动既不在图里也不在生成代码里。
effect:
  objects:
  - 数值结果
  - 训练轨迹
  detail: torch.compile 后返回未初始化张量：8192 元素两次编译分别 8192/8192、13/8192 错，两次结果 torch.equal=False；eager 正确，训练 loss 可有限但梯度已失真。
  visibility: 不可复现
mitigation:
  detect: 用 run_and_get_code 检查生成 wrapper 是否包含 triton_kernel_wrapper_mutation；对比 eager 与编译输出的逐元素结果与重复运行一致性
  fix: '待定（issue #6413 open，2026-11-24；期望支持捕获、graph break 或显式报错）'
