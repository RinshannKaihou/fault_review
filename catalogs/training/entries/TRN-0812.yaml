original:
  mechanism: TORCHINDUCTOR_NPU_BACKEND=triton_experimental 时，torch.compile 对编译区域内用户直接启动的 @triton.jit kernel 既不捕获也不打断图：run_and_get_code 看到的产物只有 `buf0 = empty_strided_npu((8192,), (1,), torch.float32); return (buf0,)`，没有 _add_one_kernel、没有 @triton.jit、也没有 triton_kernel_wrapper_mutation 节点，用户 kernel 整体消失。函数返回未初始化内存：950DT 独立进程 + 全新 TORCHINDUCTOR_CACHE_DIR 下，8192 元素第一次编译 8192/8192 错、第二次 13/8192 错，两次结果 torch.equal=False；eager 路径首 3 元素 1.1318/1.3323/1.7256 正确。任何在 compile 区域启动自写 triton kernel 的模型（自定义 attention、融合算子、第三方 kernel 库迁移）都会静默算错且不可复现。
  source: 'Ascend/pytorch issue #6413（open，2026-11-24；950DT + torch_npu 2.7.1 独立进程复现，附生成代码证据）https://gitcode.com/Ascend/pytorch/issues/6413'
  behavior: 开了 torch.compile（triton_experimental 后端）后训练能跑、loss 也可能有限，但凡是编译区域里调用自写 @triton.jit kernel 的层都返回未初始化张量：8192 个元素第一次全错、第二次只错 13 个，两次运行结果不同。日志无异常，eager 对照正确；自定义 attention/融合算子迁到 NPU 时最容易命中，梯度随后全被污染。
  discovery: 2026-11-26 每日扫描
