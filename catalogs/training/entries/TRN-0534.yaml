original:
  mechanism: CANN ops-math ReduceMean 的 aiv kernel（ops_legacy/reduce_mean 下 4 个不同 high_precision 二进制：1000500/82100900 mix_aiv 变体，aclnnMeanV2 与 aclnnMean 都走这批 kernel）执行结束后不复位 VECTOR_MASK 寄存器，msSanitizer memcheck 在每个变体稳定报告 VECTOR_MASK_0/1 未回到默认全 1（0xFFFFFFFFFFFFFFFF），实际残留 1（仅 lane 0 使能）、16（仅 lane 4）或 0；aiv(0)/aiv(1) 两个 block 都命中。VECTOR_MASK 是 AIV core 寄存器级状态、跨 kernel 共享；后续不自行重设 mask 的 kernel 复用该 core 时其余 lane 被意外屏蔽产生静默错算。同仓已有两单同型（#4223、#4201），本单第三个命中，报告者建议确认族级问题。环境：Ascend 910B3、CANN 9.2.0、master ebc07f7b9。训练影响面：mean 归约（loss 归一化、layernorm 前统计等）后接的向量算子可能被脏 mask 静默屏蔽部分 lane。
  source: https://gitcode.com/cann/ops-math/issues/4259（同型 https://gitcode.com/cann/ops-math/issues/4223 https://gitcode.com/cann/ops-math/issues/4201）
  behavior: NPU 训练中任何用到 mean 归约（loss 归一化、norm 层统计）的程序，其后的向量算子可能因残留 VECTOR_MASK 只对部分 lane 计算：输出静默错值且依赖 kernel 调度顺序、难以复现；msSanitizer memcheck 可稳定检出寄存器残留，普通精度对拍只在特定后继算子组合下暴露
  discovery: 2026-10-30 每日扫描
