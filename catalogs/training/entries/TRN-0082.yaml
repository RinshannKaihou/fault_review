  meta: 'stage: `shared` · Cov: `var:dead_or_shadowed_arg_silent_noop` · 置信度 `verified`'
  mechanism: Megatron 显式 ckpt 选择 `--ckpt-step` 在三条路径上被静默覆写（`megatron/training/checkpointing.py`）：① `get_load_checkpoint_path_by_args` L353 与 `_load_base_checkpoint` L2224 都用 `getattr(args, 'ckpt_step', None)` 真值检查——**`--ckpt-step 0` 被吞**；② tracker `latest_checkpointed_iteration.txt` 含 `release` 时 `read_metadata` 返回 `(iteration, release=True)`，数字覆写只改 `iteration`、**不重置 `release`**，`get_checkpoint_name` 仍选 `release/` 目录；③ `_load_base_checkpoint` L2229 起 non-persistent iteration ≥ 显式请求值时优先加载 non-persistent ckpt——比请求值**更新**的非持久 ckpt 抢占显式选择的持久 ckpt。修复 = 真值检查改 `is not None`、显式请求时强制 `release=False`、显式请求优先于 non-persistent 发现。
  source: 'Megatron-LM #8110（2026-10-10；CPU mock repro：tracker=100/请求 0 → 实选 `iter_0000100`、tracker=release/请求 100 → 实选 `release`；逐行引用 main@`4603a836`。本扫描对 raw main 源码 L353-354/L2224-2225/L2229-2236 逐行核验一致）。https://github.com/NVIDIA/Megatron-LM/issues/8110'
  behavior: 无 crash、无警告——**故意 rollback 与按步评估加载了错误的 ckpt**：数据进度与模型状态错配（recovery workflow 的静默前提被破坏）、评估指标归因到错误步。与 CKPT.32（trl CLI resume 参数不转发）行为面同型「显式续训/回滚请求静默失效」，但断点在**选择器覆写**而非参数不透传；与 CKPT.31（FP32 重建分支 tag 不透传加载 later 版本）共享「自动发现机制压过显式请求」家族。任务影响未实测（mock repro 因果闭合）。
  discovery: 2026-10-12 每日扫描
  notes:
  - '2026-10-14 回访 2026-10-14：修复 PR #8115 open（10-13 有更新，评审在途），机制三处（ckpt-step 0 真值、release 标志未清、non-persistent 越权）以 issue #8110 复现脚本逐条对应；尚未 merge，缺陷仍在 main。相关：#8165（save-retain-interval 删新 ckpt）仍 open 未 merge。'
  - '2026-10-14 回访补充 2026-10-14：NVIDIA #8110 复现脚本已就位（tracker step100 请求 0 → 错选 iter_0000100；tracker release 请求 100 → 错选 release/）；第三分支（non-persistent 步≥请求步越权）需两 ckpt 配置复现。修复 PR #8115 open（10-13 更新，评审在途）。'
