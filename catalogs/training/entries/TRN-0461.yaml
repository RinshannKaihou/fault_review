title: TRL cispo 默认 epsilon_high 截死全部权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: GRPO cispo 默认参数
  behavior: CISPO 用绝对上界 clamp(coef_1, max=epsilon_high)；epsilon_high 未设置时回退 0.2（对绝对界无意义），on-policy coef_1=1 也被截到 0.2；推荐值 5.0 无代码生效。
effect:
  objects:
  - 梯度
  - 训练信号
  detail: loss_type=cispo 未显式设 epsilon_high 时梯度比预期小 5 倍（实测 grad_norm 0.054 vs 0.269），cispo_clip_ratio 把每个正 advantage token 报为 clipped；静默减速无报错。
  visibility: 静默错误
mitigation:
  detect: 监控 cispo_clip_ratio 是否恒 ≈1；检查 epsilon_high 是否显式设置
  fix: 待定（作者建议未设置时默认 5.0 或报错，issue open）
