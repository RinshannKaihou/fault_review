original:
  mechanism: 'cann/runtime issue #1098（2026-10-13，open）：msprof 采集 torchair aclgraph（reduce-overhead）+ superkernel（_super_kernel_optimize=True）负载时偶发（约 13%，15 轮失败 2 次）device 侧数据完全丢失：mindstudio_profiler_output 下 op_summary/op_statistic/task_time 三个 CSV 均不生成、trace 中设备侧 kernel 事件数为 0，host 侧（api_statistic.csv）与 AI CPU 侧正常；msprof 无任何报错、退出码 0。失败签名：collection_device_0.log 出现 “Different flip numbers, 4 host flips and 0 device flips”——device profiling buffer 从未翻转刷盘，与失败 100% 相关（成功轮 device flips 2~37）；疑似 profiling 通道初始化与图捕获/静态 kernel 编译时序竞态。环境：Ascend 910（A3）单卡、驱动 26.0.rc2、CANN 9.1.T101、torch 2.7.1/torch_npu 2.7.1.post8、被测 npu_fused_infer_attention_score。失败与迭代次数无关（100/2000 次均失败过）。关联 #1099：--delay 在图 capture 之后开启采集时确定性完全无产出（或空 trace）、msprof 静默成功。影响：依赖 msprof 的性能/算子级观测在 NPU 图模式负载下可能整段空白且无告警，观测结论失真。'
  source: https://gitcode.com/cann/runtime/issues/1098 ；关联：https://gitcode.com/cann/runtime/issues/1099
  behavior: aclgraph+superkernel 负载用 msprof 采集时，约 13% 概率 device 侧（AI Core）数据全部丢失：三个 device CSV 不生成、trace 设备事件为 0，host/AICPU 侧正常，msprof 退出码 0 无告警；呈间歇性、与迭代次数无关。--delay 延迟开启变体为确定性无产出。
