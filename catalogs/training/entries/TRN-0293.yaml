original:
  mechanism: trl examples/sft_diffusion_gemma（TRL main 8f39f8f 的 DiffusionGemmaSFTTrainer.compute_loss）：为 encoder AR co-loss 编码完整干净序列后，用 decoder mask 限制上下文到 sampled response block 之前的 prefix；native sliding-window cache（窗口 512）在 mask 应用前已把序列前部（prompt 128）逐出——1024 长序列下滑窗只保留 513-1023，被 mask 保留的 prefix 0-127 已不在缓存。对照组：独立编码 prefix 时 diffusion loss 4.36683178 vs 示例 4.368756；最大参数梯度差 0.14644143（相对 L2 77.14%）；384-token 不逐出前缀时梯度差 2.38e-7（证明差异完全来自逐出）。CPU 可复现（执行未修改的示例方法 + native Transformers 模型 + autograd + 默认 self-conditioning 概率）。缺陷在示例代码而非通用 autoregressive SFT 目标。
  source: https://github.com/huggingface/trl/issues/7734
  behavior: 照官方 DiffusionGemma SFT 示例训练：序列长于滑窗时 prompt/前缀在 decoder mask 生效前被缓存逐出，diffusion 分支 loss 与梯度静默偏差（小模型实测最大梯度差 0.146、相对 L2 77%），训练不报错、曲线看似正常，但学到的条件分布已不含被逐出的 prefix；短于窗口的序列完全正常，使问题随 batch 内容波动。
  discovery: 2026-10-16 每日扫描
