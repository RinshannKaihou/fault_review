id: TRN-0293
legacy_ids: []
slug: trl_diffusion_gemma_sliding_prefix_eviction
aliases: []
title: trl DiffusionGemma SFT 滑窗逐出被 mask 的前缀
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: trl
    component: 示例 decoder mask 与滑窗缓存交互
  behavior: 示例 compute_loss 先为 encoder AR co-loss 编码完整序列，再用 decoder mask 限制上下文到 prefix；native 滑窗缓存在 mask 生效前可能已把该 prefix 逐出。
effect:
  objects:
  - 梯度
  - 隐状态
  detail: 滑窗逐出 prefix 时 diffusion loss 偏移（4.3688 vs 4.3668）、decoder 可见 cached prefix 从 128 token 变 0，最大参数梯度差 0.146（相对 L2 77%）；384-token 不逐出对照差 2.38e-7。SFT 静默训错。
  visibility: 静默错误
mitigation:
  detect: 对照独立编码 prefix 的 loss/梯度（issue 附 CPU 复现脚本）；检查滑窗保留位置与 mask 窗口的覆盖关系。
  fix: 待定（issue open 5 评论；参考修法=decoder 侧单独编码 sampled prefix、保留完整 encoder pass，示例代码修正未核实合入）
