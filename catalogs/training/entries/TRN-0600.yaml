original:
  mechanism: 'cann/ops-nn #7998（2026-11-02 open）。三层失效叠加：1) tests/ut/op_kernel/{log,log1p,log2}_data/compare_data.py 计算 diff_idx=np.where(diff_res!=True) 但不看结果无条件 print("PASSED!")、data_same 恒 True、无 sys.exit(1)；2) foreach_log1p golden 用 np.log(x+1)（gen_data.py）与被测错误实现（Adds+Log）同源；3) C++ test_foreach_log1p.cpp 用 system() 调 python、只取进程退出码，脚本永不非零退出。对照 foreach_log10 的正确写法（diff_idx 判定 + data_same=False + 打印前 5 个差异）。全仓 58 个 compare_data.py 另 55 个正确——孤立漏改非设计取舍。后果：#7977 的 log1p 别名精度缺陷（小 x 返 0）即使值域命中也被同源 golden 掩盖，UT 永久绿。'
  source: cann/ops-nn https://gitcode.com/cann/ops-nn/issues/7998（open）
  behavior: 'ops-nn 的 foreach_log、foreach_log1p、foreach_log2 三个算子的内核 UT 存在四层校验失效：即使 kernel 输出全错，UT 仍打印 PASSED 且 C++ 用例判定通过。表现为 CI/UT 长期绿但算子实际带病（同日 #7977 证实 log1p 小输入返 0）；任何依赖这套 UT 的算子改动或回归都得不到真实信号，缺陷可在多个版本间静默存续。'
  discovery: 2026-11-03 每日扫描
