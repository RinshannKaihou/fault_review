  - 优化器状态
  - 训练轨迹
  detail: 首个更新的一阶矩按 min 动量累积，偏差修正可掩盖第一步，第二步起权重偏离调度参考（实测 actual 0.7388 vs reference 0.7878）；fp64 双优化器对照脚本稳定复现
  visibility: 静默错误
