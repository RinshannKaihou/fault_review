title: OpenRLHF 同酬组 group_norm 噪声 advantage
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: openrlhf
    component: group_norm 除以 std+1e-9
  behavior: group_norm 分支除以 std+1e-9：fp32 下相同值组的 std≈3.1e-8 而非 0，epsilon 压不住比值，同酬组每响应得 ±0.9 量级舍入噪声 advantage。
effect:
  objects:
  - 训练信号
  detail: 全等酬赏组（部分得分/可验证酬赏常见）advantage 应全零，实测组 8/16/64 下 max|adv| 0.907/0.938/0.960（酬赏 0.3）；噪声信号驱动无效更新，方向由舍入决定。
  visibility: 静默错误
mitigation:
  detect: 对全等酬赏组断言 advantage 全零；监控同酬组 advantage 分布
  fix: 修复 PR https://github.com/OpenRLHF/OpenRLHF/pull/1383（open，2026-10-25）——归一化前求组 max/min，max==min 的组事后置零（NaN 组不受影响）；新增 tests/test_group_norm_advantage.py 10 用例修复前全失败
