remarks: 与 TRN-0025（DeepSpeed 无效组范数哨兵）同属组统计失效族但机制不同：本条是 fp32 同值组 std 残差噪声，非哨兵值污染
evidence:
- url: https://github.com/OpenRLHF/OpenRLHF/pull/1383
  kind: github_pr
relations: []
original:
  mechanism: 'OpenRLHF/OpenRLHF #1383（2026-10-25，open PR）：--advantage_estimator group_norm 下全等酬赏组应得精确零 advantage（组内无学习信号），实际得到接近 ±1。RemoteExperienceMaker.compute_advantages_and_returns 的 group_norm 分支除以 std+1e-9：fp32 下相同值的 mean/std 不精确，0.3 酬赏组 std≈3.1e-8 而非 0，中心化酬赏同量级，1e-9 epsilon 压不住比值——全等组每响应 advantage ≈±0.9 纯舍入噪声。实测（单组全等酬赏）：酬赏 0.3/组 8→0.907、组 16→0.938、组 64→0.960；0.6/0.9 同量级。触发场景：部分得分或可验证酬赏给一组样本相同分数且开 group_norm。修复：归一化前算组 max/min、max==min 组事后置零（NaN≠自身、NaN 组不触）；非均匀组算术不变；10 用例修复前全失败。'
  source: https://github.com/OpenRLHF/OpenRLHF/pull/1383
  behavior: GRPO/PPO 类训练用 group_norm advantage 且酬赏函数给某 prompt 组内全部样本相同分数（部分得分、格式全对/全错等可验证酬赏常见）时，该组 advantage 不是零而是 ±0.9 量级的浮点舍入噪声：组内响应按噪声方向被无差别推高/压低，训练在无学习信号的组上做无效甚至有害更新。无报错，loss/指标正常显示，只有检查同酬组 advantage 才能发现。
  trigger_surface: OpenRLHF --advantage_estimator group_norm + 全等酬赏组（部分得分/可验证酬赏）；fp32 组统计
  discovery: 2026-10-29 每日扫描
