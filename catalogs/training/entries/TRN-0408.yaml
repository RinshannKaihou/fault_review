original:
  mechanism: 'cann/ops-transformer #6658（2026-10-24，open，A2 910B2 / CANN 9.2.0 / aclnn 两段式直调）。aclnnMhcPre 的 alpha shape=[2] 表示无残差分支，资料《规格约束》写明「当 alpha=(2) 时，hRes 输出为 0」、参数表只说可传空指针并未禁止传张量。实测 alpha=[2] 且 hRes 传非空张量：两段返回 0，hRes 一个字节未写、保持调用方原有内容；阴性对照 alpha=[3] 同一套 shape 下 hRes 立刻被写满（canary 全部消失），证明读回路径有效、问题在 alpha=(2) 分支。下游把未初始化显存当 hRes 消费。MhcPre 为 McMix 前置算子（MHC 混合卷积/attention 前置，MHC2 模型族训练路径）。推理编目 INF-2163 已收同源；本条为训练侧条目。'
  source: https://gitcode.com/cann/ops-transformer/issues/6658
  behavior: 调用 McMix 前置算子 MhcPre 且 alpha 配成 [2]（无残差）时，如果按常规习惯给可选输出 hRes 传了张量而不传空指针，接口正常返回成功，但读回的 hRes 是调用前显存里残留的任意旧值（预填 -777 就读回 -777）；下游残差分支静默吃到脏数据，无任何报错。
  trigger_surface: aclnnMhcPre，alpha=[2] + hRes 传非空张量；A2 910B2 / CANN 9.2.0 实测。
