id: TRN-0464
legacy_ids: []
slug: trl_dpo_stale_ref_scores_collator_limit
aliases: []
title: DPO 复用陈旧参考分数缓存致梯度错
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: precompute_ref 缓存键
  behavior: precompute_ref_log_probs=True 时参考分缓存以数据集目录为键、不含 collator 截断长度；collator 限制改变后模型分数对新序列计算、参考分数仍来自旧序列，不同序列的分数进入同一 DPO loss。
effect:
  objects:
  - 训练信号
  - 梯度
  detail: 缓存目录存在旧参考分且 collator 截断长度改变时，初始 loss/梯度即错且依赖缓存历史：同配置同数据，仅因是否命中旧缓存目录，初始 loss/梯度不同；静默无告警。
  visibility: 静默错误
mitigation:
  detect: 清理缓存目录对比初始 loss/梯度是否变化；缓存键纳入 collator 截断参数指纹
  fix: 待定（issue open）
