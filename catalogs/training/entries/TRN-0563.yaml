effect:
  objects:
  - 梯度
  detail: 经公开入口训练态梯度为垃圾值/NaN（实测 rel 1.1~2.8 或大形状 nan；直调内部 op rel 2.5e-3~3.5e-3 正常）；引入于 MR !13855；A3/910_93 bf16
  visibility: 静默错误
mitigation:
  detect: 公开入口 vs 内部 op 双调用梯度对拍；backward 输出有限性断言
