original:
  mechanism: 'cann/ops-transformer #6962（2026-10-30）：attention/compressor/torch_extension/compressor.py:368（引入提交 fa4364547 / MR !13855）把 compressor 公开入口包成 _CompressorFunction 后，forward 内部 torch.autograd.Function 强制 no_grad，grad_enabled = torch.is_grad_enabled() and any(t.requires_grad...) 结构性恒 False → kernel 不写 softmax_score/kv 中间量 → backward 消费未初始化显存 → 经 cann_ops_transformer.compressor() 训练态梯度垃圾值/nan、无报错。改动前（父提交 3d40e5645）公开入口是普通函数、判据 x.requires_grad，行为正确。验证（910_93，B=1/S=1024 与 131072、H=5120、D=512、cmp_ratio=2、bf16）：直调 _compressor_forward(grad_enabled=True)+_compressor_backward 三梯度 rel 2.5e-3~3.5e-3（=权重 bf16 量化噪声，正常）；走公开入口 rel 1.1~2.8 / 大形状 nan；打一行补丁后公开入口两形状全绿。'
  source: https://gitcode.com/cann/ops-transformer/issues/6962
  behavior: NPU 训练经 cann_ops_transformer.compressor() 公开 Python 入口（长上下文压缩注意力）做前反向时：backward 返回的三个梯度是垃圾值或 NaN（相对误差 1.1~2.8 甚至 nan，正常应为 1e-3 量化噪声级），无任何报错；改回直调内部 op 就正常，一行补丁可修——训练在错误梯度上持续更新。
  trigger_surface: cann_ops_transformer.compressor() 公开入口（MR !13855 起）+ 训练态 backward；A3/910_93 bf16 实测
  discovery: 2026-10-31 每日扫描
  notes:
  - 2026-11-01 回访 2026-11-01：修复 MR !15041（open）到位且深读揭示第二缺陷——arch35/arch92 compressor tiling GenTilingKey 判 gradEnabled 指针非空（OPTIONAL.Bool 恒非空）→ GRAD_ENABLED 位恒 1，属性完全失效（推理态白写 ~536MB 中间量）；两缺陷互相掩盖（950PR 上 tiling 恒 1 使 Python 判据缺陷表现为不复现），必须同一笔修复。PR 实测修复后公开入口 vs 直调梯度 max_abs_diff=0。
  - 2026-11-03 2026-11-03 回访：修复 MR !15041 已 merged（批次快照 2026-11-02T13:47）
