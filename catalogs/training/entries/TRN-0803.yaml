id: TRN-0803
legacy_ids: []
slug: batchnorm_backward_noncontig_gradinput_halfwrite
aliases: []
title: BatchNorm 反向非连续 gradInput 只写首块
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BatchNorm 反向 Post 散写
  behavior: BatchNormPost/FastBatchNormPost 用 l0op::ViewCopy 散写用户 gradInput 视图，行 stride 非紧凑时只拷首块即返回成功，不校验也不拒绝非连续出参。
effect:
  objects:
  - 梯度
  detail: gradInput 为 strides=[32,16,2] 的合法视图时两段 rc=0/0，8 个视图位只写对 4 个（fast 版通道 1 亦然），其余保留调用方旧值 -55；同调用 gradWeight 1D 非连续却写对，两次执行位级一致。
  visibility: 静默错误
mitigation:
  detect: 用双色金丝雀预填非连续 gradInput 视图，调用后统计未写视图位；对照连续出参与 1D gradWeight
  fix: 待定（#8814/#8819 open，2026-11-24；未见修复 MR）
