aliases: []
title: MoeTokenPermuteWithEpGrad 缺省 range 全零梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MoeTokenPermute 梯度 tiling
  behavior: rangeOptional 为空时 tiling 把 start/end 都置 0（应 end=R），kernel needCopyIn 恒 false，任何 token 梯度都不搬运。
effect:
  objects:
  - 梯度
  detail: rangeOptional=nullptr 时 tokenGradOut 全 0（两段/sync 均 0）；同输入传 [0,6] 输出正确 [4.5,6.5,12.375,15.125,20.75,23.25]，5 次重复逐位一致。
  visibility: 静默错误
mitigation:
  detect: rangeOptional 缺省与显式 [0,R] 两路对拍；输出预填哨兵检查是否整块未写。
  fix: 待定（issue open 2026-11-15，无修复 MR）
