original:
  mechanism: 'verl 0.10.0.dev main@fc72e2f：未设 sandbox_fusion_url 时 default_compute_score 回落 prime_code；其 call-based 路径（reward_score prime 的 testing_util.run_test）假设 LiveCodeBench 式输入（每行一个 JSON 值的字符串）用 inputs.split("\n") 解析。APPS/TACO 的 call-based 测试以参数列表布局发布（"inputs": [[1,2],[3,4]]），.split 对 list 抛异常，run 在任何测试执行前结束、分数 0、无日志。实测：codeparrot/apps train 全部 2713 个 call-based 问题用列表布局；30 个种子样本中数据集自带第一解按原发布 0/30 得满分、重编码为 JSON 行字符串后 28/30。CPU-only 可复现（macOS，无需 GPU）。codecontests/codeforces 同布局。'
  source: https://github.com/verl-project/verl/issues/8174
  behavior: 用 apps/taco 等 data_source 做 RLVR 训练且未配 sandbox：这些任务的 reward 全部静默为 0——正确解答与错误解答同分，advantage 在组内无区分或整体失效；reward 均值看起来只是偏低，无报错无日志，极易被当成「模型太弱」而非评分管线问题。与 TRN-0289（PrimeRewardManager dict 整批置 0）同属 reward 管线静默归零面，吞噬点不同（函数内解析异常 vs manager 层 except）。
