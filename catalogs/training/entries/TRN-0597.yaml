id: TRN-0597
legacy_ids: []
slug: mindspeed_sp_column_linear_bias_lost
aliases: []
title: MindSpeed SP 列并行 forward 丢失 bias 项
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: ascend
    component: ColumnParallelSeq.forward
  behavior: ColumnParallelSeq.forward 把 None 作 bias 传给 allgather_matmul 且此前省略独立 bias 加法——传入 bias 整个丢弃；影响 FP8 开与关，非 FP8 GEMM 缺陷
effect:
  objects:
  - 数值结果
  detail: SP+TP 列并行线性层带 bias 的 forward 输出缺 bias 项；历史 12 个零权重前向用例 2 failed/10 passed，修复后（补一次显式 bias 加法）24/24 通过，非零权重 forward/backward 的 dX/dW/dbias 零容差通过
  visibility: 静默错误
mitigation:
  detect: SP+TP 列并行层非零 bias 的 forward 对照单卡（fix 后 A/B 每 rank 24 PASS）；检查输出对 bias 的偏导 dbias
  fix: 修复 PR https://gitcode.com/Ascend/MindSpeed/merge_requests/4128（open）：两行源码修复，传入 bias 显式加一次，对齐非 SP 路径；skip_bias_add 语义不变。测试为真实 NPU 双 worker 直调（Ascend950DT/CANN9.1.0/torch2.7.1），官方 CI 与 maintainer review pending
