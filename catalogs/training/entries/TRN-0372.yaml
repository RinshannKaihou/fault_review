  - 梯度
  - 训练信号
  detail: C/G=4000（3999 亦命中）、HxW=1 且 fp16/bf16 时，dx 11360/12000 未写、dgamma/dbeta 出现 NaN，返回码仍为 0；host 日志有告警但未传到返回码；C=256000、G=64 时触发 507035 vector core 异常进程退出。
  visibility: 数值异常
mitigation:
  detect: 训练侧对 GroupNorm+Swish 反向输出做 NaN/零占比抽检（dgamma NaN 计数、dx 零元素占比）；fp32 路径正常可作对照
  fix: 待定（issue 给出修复建议：检查 Init() 返回值失败即 GRAPH_FAILED；GetDataTypeSize 对 fp16/bf16 返回 2；无修复 MR）
