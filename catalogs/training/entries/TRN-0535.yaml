  mechanism: CANN ops-transformer PromptFlashAttention 310P（x310）fp16 HighPerformance 场景（tiling key QINT8_KVFP16_OUTBF16_BSH_HIGHLEVELAPI_MDL_310TILING）派发到 PromptAttentionPrefill -> UnpadFlashAttentionCommon。原 UpdateOutput 先把未归一化的 fp32 累加结果 O 直接 cast 成 fp16，再在 fp16 域做除法（除以 softmax 行和 l）。softmax 均匀时 O=n*35（每元素值 35 的均匀分布），n=1872 时 65520 > fp16 上限 65504，cast 时溢出为 +Inf，归一化后输出 Inf。修复 PR !14827（open）：先广播 l 并在 fp32 域完成 O/l 归一化，最后 cast 回 fp16，消除中途溢出。
  source: https://gitcode.com/cann/ops-transformer/merge_requests/14827
  behavior: Ascend 310P fp16 高性能模式跑 PromptFlashAttention prefill，序列长且注意力近似均匀（约 ≥1872 长度、值域 ~35）时注意力输出 +Inf：训练 loss 变 Inf/NaN 或模型输出立即劣化；短序列或非均匀分布不触发，问题随 tiling 路径切换出现，难定位
