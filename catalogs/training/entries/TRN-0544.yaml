id: TRN-0544
legacy_ids: []
slug: trl_iwopd_resume_skip_vllm_weight_sync
aliases: []
title: TRL IW-OPD resume 后跳过 vLLM 同步
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: IWOPDTrainer vllm 同步步计数
  behavior: IWOPDTrainer 的 _last_vllm_sync_step 初始 -1 且仅整倍数步同步：resume 到非整倍数步时首步同步被跳过，vLLM 引擎仍用构造时初始权重生成
effect:
  objects:
  - 训练信号
  detail: 从 checkpoint resume 到非整倍数步（如 frequency=5 时 resume 到 37，则 37-39 步）时，头几步 rollout 由初始模型权重生成，训练侧却按新权重算损失，重要性偏离静默扩大、日志无异常；需 jsd+use_vllm+frequency>1
  visibility: 静默错误
mitigation:
  detect: resume 后首步强制 sync 并断言引擎权重指纹与 trainer 一致
  fix: 修复 PR https://github.com/huggingface/trl/pull/7994（open，对齐 GOLDTrainer：初始值 -vllm_sync_frequency + >= 判定，未合入）
