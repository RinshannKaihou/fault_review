original:
  mechanism: 'TRL PR #7994（2026-10-30，open，修复 #7544）：VLLMGeneration 在构造时从 model.name_or_path 建 vLLM 引擎（先于 checkpoint 加载），resume 后到下一次 sync_weights() 前一直用初始权重生成。IWOPDTrainer 把 _last_vllm_sync_step 初始为 -1 且仅当 global_step % vllm_sync_frequency == 0 才同步：resume 到非整倍数步（如 frequency=5 时 resume 到 37，则 37-39 步）由初始策略生成。修复对齐 GOLDTrainer 既有写法：初始 -vllm_sync_frequency 且用 >= 判定，构造或 resume 后第一步必同步。可达条件：distillation_objective=jsd、use_vllm=true、vllm_sync_frequency>1（iw_opd 自身强制 1 不触发）。测试：CPU 42 通过、新增测试在 main 上失败；未在真实 vLLM 引擎上验证。'
  source: 'https://github.com/huggingface/trl/pull/7994（修复 issue #7544）'
  behavior: TRL IW-OPD（jsd 蒸馏目标）训练开着 vllm_sync_frequency>1 并从检查点 resume 时：恢复后的头几步 rollout 由初始模型权重（而非恢复的训练权重）生成，训练侧却按新权重计算损失——重要性偏离静默扩大、蒸馏效率下降，日志无异常，只有对比引擎与 trainer 权重才能发现。
  trigger_surface: TRL IWOPDTrainer + distillation_objective=jsd + use_vllm + vllm_sync_frequency>1 + 从 checkpoint resume
  discovery: 2026-10-31 每日扫描
