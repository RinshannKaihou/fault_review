original:
  mechanism: 'cann/ops-transformer #6667（2026-10-24，open，A2 910B2 / CANN 9.2.0 / master 92d0f9c2）。aclnnNsaCompressGrad 在 compressBlockSize>compressStride（块间 overlap）时 inputGradOut 每次运行都不一样：blk=64/stride=16/heads=4 组 9/9 次与第 1 次不同、heads=1 组 8~9/9；无 overlap 组（stride=64）0/9 全稳定。报告者构造输入量级跨度大的 fp16 数据使 fp32 累加的「大数+小数」丢位差异在低位显形（原子落序随机）。资料 aclnnNsaCompressGrad.md:539 明确写「默认确定性实现」，实测冲突。NsaCompressGrad 为 NSA 稀疏注意力压缩反向，训练路径；非确定性梯度影响可复现性、梯度检查与确定性训练策略。'
  source: https://gitcode.com/cann/ops-transformer/issues/6667
  behavior: NSA 稀疏注意力训练里把压缩块设成重叠（blockSize 大于 stride）后，反向的 inputGrad 每次跑都不一样——同一段代码同输入连跑 10 次几乎次次位模式不同；不重叠时完全稳定。资料却承诺默认确定性。梯度对拍、数值验收、断点续训比对全都会随机失败。
  trigger_surface: aclnnNsaCompressGrad，compressBlockSize>compressStride（overlap）；A2 910B2 / CANN 9.2.0 实测；无 overlap 不触发。
  discovery: 2026-10-25 每日扫描
