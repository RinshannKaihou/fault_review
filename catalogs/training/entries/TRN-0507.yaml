original:
  mechanism: 'cann/ops-nn #7535（2026-10-28，Ascend 910B3 + CANN 9.2.0，master a2b7042257）：aclnnFakeQuantPerTensorAffineCachemask fp16 输入下返回的 mask 与资料公式 mask=(qval>=quant_min)&&(qval<=quant_max)（qval 为整数）不一致。实测 quantMax=32767、scale=0.01、zeroPoint=0、self=[327.6,327.7,327.7,328.0]：qval=32760/32770/32770/32800，期望 mask=1 0 0 0，实测 1 1 1 0；quantMax=4096、qval=4097~4099 同样实测 1（期望 0）；fp32 输入同参数 mask 正确，同一组输入的 out 正确（钳到 32767）。根因：kernel fp16 模板把 qval 转成 half 后再与 quantMin/quantMax 比较，half 只能精确表示 |x|<=2048 的整数，超出后比较失真。int16 量化（quantMax=32767）、uint12（4095）等大区间下 mask 必须与 out 的钳位一致而当前不一致。作者附 C++ 复现（issue_mask.cpp）。'
  source: https://gitcode.com/cann/ops-nn/issues/7535
  behavior: fp16 输入的 fake-quant 带 cachemask 训练/校准里，量化区间大于 2048（int16/uint12 等大区间）时掩码失真：已经超出 quantMax 的元素 mask 仍判 True（如 qval=32770 期望 0 实测 1），离群点不再被标记；同输入的 out（钳位值）却正确——mask 与 out 口径分叉，依赖 mask 做剪枝/校准统计的流程静默拿到错集合。fp32 输入正常可作对照。
  trigger_surface: Ascend 910B3 + CANN 9.2.0；aclnnFakeQuantPerTensorAffineCachemask fp16 输入；quantMax>2048（int16/uint12 等大区间量化）
  discovery: 2026-10-29 每日扫描
  notes:
