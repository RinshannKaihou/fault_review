title: FakeQuant Cachemask fp16 掩码半精比较失真
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: fp16 模板掩码比较
  behavior: kernel fp16 模板把整数 qval 转 half 后再与 quantMin/quantMax 比较，half 只能精确表示 |x|<=2048 的整数，超出后越界元素 mask 判 True。
effect:
  objects:
  - 数值结果
  detail: quantMax=32767、qval=32770/32800 实测 mask=1（期望 0），期望 1 0 0 0 实测 1 1 1 0；quantMax=4096、qval=4097~4099 同样误判；同一组输入 out 钳位正确（32767），fp32 输入同参数 mask 正确。
  visibility: 静默错误
mitigation:
  detect: fp16 输入下用越界 qval 对照 mask=(qval>=min)&&(qval<=max) 公式；int16/uint12 大区间量化重点检查
  fix: 待定（issue open 2026-10-28，910B3+CANN 9.2.0，master a2b7042 实测）
