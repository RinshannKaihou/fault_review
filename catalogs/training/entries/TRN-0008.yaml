  mechanism: 首个覆盖 Transformer **前向+反向**主要计算接口的系统 SDC 易损性刻画，揭示两条不对称传播机制：前向易损性强依赖**位置**——落在 Q/K 路径的故障产生**持续性**训练偏差（而非局部噪声）；反向易损性主要由**梯度指数分布**（grad exponent 尾部）支配、与计算位置基本无关。据此提出 TrainSDC 防护框架：Q/K 路径重算 + residual-gain 监控 + exponent-aware 梯度缩放，Llama-3.2-1B / Qwen3-0.6B 上以 1.65%–6.76% 开销维持接近无故障轨迹（sparse/dense 注入双验证）。
  source: 'Xia, Xu, Yun, Lin, Liu, Li, "TrainSDC: Characterizing and Mitigating Silent Data Corruption in Large Language Model Training", arXiv:2608.30769（2026-08-31，窗口内）。https://arxiv.org/abs/2608.30769'
  behavior: 单次瞬态 SDC 是否演化为轨迹级偏差由落点决定——Q/K 路径、大梯度指数位的故障无 Xid、无 NaN 地把训练推离原轨迹；对 Transformer 计算接口均匀设防的方案（ABFT 类）对这两类热点覆盖差。与 HW.01（节点级 optima-shift 现象学）、HW.06（永久故障的层/位 RTL 刻画）互补：这条给出**前向位置 × 反向梯度指数**的可操作易损性地图，也解释了 HW.01 中「ABFT 覆盖大多失败」的原因。
  discovery: 2026-09-02 每日扫描
