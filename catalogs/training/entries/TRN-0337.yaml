id: TRN-0337
legacy_ids: []
slug: mindspeed_fsdp_adamw_swap_no_stream_sync
aliases: []
title: AdamWSwap 计算流与 D2H 流无同步致动量错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: mindspeed
    component: swap_optimizer 流同步
  behavior: swap_optimizer 在用 _fused_adamw_ 更新参数后立刻 swap_tensors_to_host，计算流与 D2H 通信流之间没有同步或 wait，通信流可能在计算完成前就把未更新的一二阶动量搬到 CPU。
effect:
  objects:
  - 优化器状态
  - 训练轨迹
  detail: fsdp 后端用 AdamWSwap、关 shuffle 并开确定性计算时，同一配置多次运行精度结果不一致，且与 adamw 的结果有差；加流同步后多次运行与 adamw 完全一致，无报错。
  visibility: 不可复现
mitigation:
  detect: 关 shuffle + 确定性计算下同一配置重复运行，比对最终 loss/权重；或把 swap 关掉与 adamw 对照。
  fix: 报告者验证加 torch.accelerator.synchronize() 或计算流 wait 后精度完全一致；issue 已 closed，正文未给出合入 PR（未核实）。
