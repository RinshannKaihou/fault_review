  meta: 'stage: `pretrain` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 'Megatron #5841 给 mHC recompute 引入 attention-only CUDA graph split 时，**顺带改了默认 capture range**：`cuda_graph_modules == [''attn'']` 原本 capture 整个 `_forward_attention`，被静默收窄为 input-layernorm + self-attention；为新路径加的 gate 又 keyed on `''attn''`，range 在脚下被换掉后 gate 开始误拒以前合法的配置。同时旧全注意力 replay 路径本身带三个潜伏缺陷（recompute manager 够不到 MLP tail、overlap tail 缺 `pre_mlp_layernorm` checkpoint、`padding_mask` 未穿到 router 的 replay），使 **replay 图与训练图结构性分叉**。'
  source: 'Megatron-LM PR #6661（修复：把 split 收进 `mhc_recompute_attn_cuda_graph_split` 开关、恢复默认全 range、修三个旧缺陷；GB200 验证）。https://github.com/NVIDIA/Megatron-LM/pull/6661'
  behavior: 默认路径的图捕获范围与用户预期/历史行为不一致——CUDA graph replay 的是**另一段子计算**；无 NaN、无 crash，golden values 才暴露。与 ACT.01/ACT.02（重算侧 RNG/路由不一致）不同：错的是 **capture/replay 范围定义本身**，与数据依赖控制流无关。
  discovery: 2026-08-21 每日扫描
