  meta: 'stage: `sft/rl` · Cov: `var:dead_or_shadowed_arg_silent_noop` · 置信度 `documented`'
  mechanism: 'trl 七个训练 CLI 入口（SFT/DPO/GRPO/RLOO/KTO/reward/distillation）把 `resume_from_checkpoint` 正确解析进 training config，但调用 `trainer.train()` 时**不转发**该参数——`Trainer.train()` 不自动从 config 读这个字段，显式传入的 ckpt 路径被静默忽略。修复（PR #7391）= 七入口统一 `trainer.train(resume_from_checkpoint=...)`；无新选项、无新 ckpt 发现行为。回归覆盖显式 ckpt 与默认 `None` 全部入口 + 真实 CPU SFT 走 parser→main：step 2 存 ckpt 后以 `max_steps=3` resume，修复前执行三步、修复后只执行剩余一步。'
  source: 'trl PR #7391（2026-09-25；15 个新用例 base 全挂/修复后全过；Windows 2 个失败为 base 上既有的 NamedTemporaryFile 权限问题、与本改动无关）。https://github.com/huggingface/trl/pull/7391'
  behavior: 无 crash、无警告——用户以为在续训的 run **从 step 0 重新训练**：进度条从零起步是唯一可见信号，长跑 job 的 resume 契约静默失效（与 CKPT.27「ckpt 完好在盘、resume_mode=auto 判无 ckpt 从头训」行为面同型）。与 CKPT.07（死配置族）同根：参数在配置面声明、执行面缺席；差异是这边**唯一**消费点是一行显式传参缺失、修复即接通，那边死键分布在配置复制/覆盖链。CLI 路径影响面：凡 `trl sft/dpo/grpo/... --resume_from_checkpoint` 用户。
  discovery: 2026-09-28 每日扫描
