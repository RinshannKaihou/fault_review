title: NPU FA 反向 sink 场景 dsink 工作区未清零致梯度爆炸
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FA 反向 dsink 工作区清零
  behavior: FlashAttentionScoreGrad 的 dsink 工作区仅在 IS_ATTEN_MASK 或 IS_TND 模板清零；causal 等稀疏无 mask 模式对应槽位永不写入，post 阶段累加读未初始化内存。
effect:
  objects:
  - 梯度
  detail: 带可学习 sink 的网络用 causal 注意力（无 attenMask 张量、BNSD/BSH）训练若干 step 后，sink 参数被垃圾梯度更新、随后全网梯度爆炸；去掉 sink 输入或换无条件清零实现（arch22）训练稳定。
  visibility: 数值异常
mitigation:
  detect: 对 dsink 输出与 -Σ(P·dP)·P_sink 参考对账；训练期监控 sink 参数值与梯度范数突变。
  fix: 修复 MR !13822（open 未合入、未发布）：sink 使能即无条件清零 dsink 工作区，与 arch22 实现对齐。https://gitcode.com/cann/ops-transformer/merge_requests/13822
