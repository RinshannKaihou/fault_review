original:
  mechanism: CANN ops-transformer 的 FlashAttentionScoreGrad（aclnnFusedAttentionScoreGrad，ascend950/arch35）在 sinkInOptional 使能时，dsink 工作区清零条件写为 isSink && (IS_ATTEN_MASK || IS_TND)（flash_attention_score_grad_s1s2_bn2gs1s2_pre_regbase.h）。causal/band 等稀疏模式无 attenMask 张量且非 TND 布局，命中不了清零；同时被 mask 区域的 (s1o,s2o) 基本块不派发任务，对应槽位永远不写入，post 阶段对全量 [N1][B][S1Outer*2][S2Outer] 槽位累加时读取未初始化显存，dsink 输出为脏数据，可学习 sink 参数被垃圾梯度更新后爆炸并引发全网梯度爆炸。issue（缺陷反馈，2026-10-14）给出触发配置、根因代码定位与修复方向；修复 MR !13822 改为 sink 使能即无条件清零（对齐 arch22），open 未合入。CANN 版本未知（issue 仅写 ascend950/arch35）。
  source: https://gitcode.com/cann/ops-transformer/issues/6148 ；修复：https://gitcode.com/cann/ops-transformer/merge_requests/13822
  behavior: Ascend 950 上以 aclnnFusedAttentionScore（带 sink 输入）+ aclnnFusedAttentionScoreGrad（sinkInOptional/dsinkOut）训练带可学习 sink 的网络，causal 注意力（sparseMode=LEFT_UP_CAUSAL/RIGHT_DOWN_CAUSAL 等、无 attenMask 张量、BNSD/BSH 布局）下训练若干 step 后 sink 参数、loss 与梯度爆炸；去掉 sink 输入或换用无条件清零实现（arch22）时训练稳定，爆炸前无显式报错。
  discovery: 2026-10-15 每日扫描
  notes:
