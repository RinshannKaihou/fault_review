- url: https://github.com/huggingface/trl/issues/8555
  kind: github_issue
relations:
- kind: var
  target: TRN-0229
pattern: PAT-TRN-0041
original:
  mechanism: AsyncGRPOTrainer 的 _check_sampling_replay 只在 score_centering=True 时拒绝 raw-logprobs 的 vLLM server，理由是 score centering 需要 processed logprob；但 importance sampling ratio 在任何配置下都用 server 返回的 logprob。vLLM 默认 --logprobs-mode raw_logprobs（未做 temperature 缩放），而 trainer 用 logits/T 的 log_softmax 计算采样 token 的 logprob，两者相减得到 exp 后就是逐 token 的 IS 权重。temperature=0.7、top_p=1 的 Qwen3-0.6B 上，ratio min 0.182、median 1.045、max 2.038，3.0% token 低于 vllm_importance_sampling_clip_min=0.5 被丢出 loss。服务端改 processed_logprobs 或训练端按同一温度口径重算即可消除；当前只在 score_centering 开时拦截。
  source: 'TRL issue #8555（open，2026-11-24；含 Qwen3-0.6B 逐 token ratio 实测与 #8414 后续）https://github.com/huggingface/trl/issues/8555'
  behavior: AsyncGRPO 训练不报错，reward 和 loss 曲线表面正常，但每个 token 的 importance weight 都偏离 1：temperature=0.7 时 ratio 中位数约 1.045、两端 0.18~2.04，约 3% token 因低于 clip 下限被静默丢出 loss，日志只看到 ratio 略噪声，off-policy 校正已系统性失真。
  discovery: 2026-11-26 每日扫描
