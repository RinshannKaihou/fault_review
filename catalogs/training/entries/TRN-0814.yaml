id: TRN-0814
legacy_ids: []
slug: trl_asyncgrpo_raw_logprobs_temperature_bias
aliases: []
title: AsyncGRPO 用 raw logprob 算 IS ratio 偏置
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: AsyncGRPOTrainer
  behavior: score_centering=False 时 _check_sampling_replay 不检查 server 的 logprobs 模式；vLLM 默认 raw_logprobs 是温度缩放前的值，trainer 却按采样温度重算。
effect:
  objects:
  - 训练信号
  detail: temperature=0.7 时逐 token IS ratio min 0.182/median 1.045/max 2.038，3.0% token 落到 clip 0.5 以下被丢出 loss；日志只显示 ratio 略噪声，策略更新已带系统偏置。
  visibility: 静默错误
mitigation:
  detect: 启动时校验 vLLM 是否为 processed_logprobs；对同一批 token 比较 trainer 重算 logprob 与 server 返回值，ratio 不应随 temperature 系统漂移
  fix: '待定（issue #8555 open，2026-11-24；建议把 _check_sampling_replay 扩到所有启用 IS 修正的运行）'
