legacy_ids: []
slug: conv3d_backprop_filter_uint_underflow_oob_write
aliases: []
title: conv3d 反向 uint 下溢回绕致 Fixpipe 越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: baseNIter 无符号下溢
  behavior: baseNIter 在 c1hkwk+head_<hwK_ 时 uint64 下溢回绕（≈2.05e18），j 循环越界写 L0C/GM；host 侧 3D DW L1 估算另有 int64→int32 截断致分支选路错误。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: Ascend 950 特定形状输入必现：3D 卷积反向 tail 块 c1hkwk+head_<hwK_ 时 Fixpipe 循环越界写 L0C/GM，后续算子读到损坏数据或设备崩溃，报错点远离根因；大 shape 下 host 侧 L1 超限判断失真致 tiling 分支选错，症状混杂。
  visibility: 报错
mitigation:
  detect: conv3d 反向后校验输出与相邻内存；触发面为特定 tail 块形状组合。
  fix: '修复 MR !12006 状态 closed（2026-10-16 关闭，非 merged，原因未核实；issue #6706 仍 open）：复用 117-119 行条件保护写法替换 :182/:241 两处；host 侧统一 int64_t/uint64_t。https://gitcode.com/cann/ops-nn/merge_requests/12006'
