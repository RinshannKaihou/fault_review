original:
  mechanism: cann/ops-nn conv3d_backprop_filter_v2（Ascend 950，issue 报告必现）：kernel 侧 LoadL0c2GmBaseNUndividedNz2Nd / LoadL0c2GmBaseNUndividedNz2DHWCN（conv_bp_filter_sub_func_store_l0c.h :182/:241）baseNIter=Ceil(c1hkwk-(hwK_-head_),hwK_)+1 无保护，c1hkwk+head_<hwK_ 时 uint64 下溢回绕（示例 hwK_=9、c1hkwk=1、head_=0 → 1-9=2^64-8，baseNIter≈2.05×10^18），j 循环 srcOffset(:210/:273)/dstBaseNOffset(:217/:281) 线性增长越出 L0C/GM；同文件 :117-119 已有条件保护写法。host 侧 aclnn_convolution_backward.cpp CalcBl1MinSizeFor3DDw/IsExceedL1For3DDw（:173-243）多处 int64→int32 截断与 int32 乘法溢出、:242 int32 和 cast uint64 比较失真，大 shape 下 L1 超限分支选路错误。修复 MR !12006（open）：kernel 复用条件保护写法；host 统一 int64_t/uint64_t；Ascend950 二级冒烟+本地验证通过。
  source: https://gitcode.com/cann/ops-nn/issues/6706 ；修复：https://gitcode.com/cann/ops-nn/merge_requests/12006
  behavior: 3D 卷积（如视频/医学影像模型）反向传播在特定形状组合（tail 块 c1hkwk+head_<hwK_）下：Fixpipe 循环以天文数字次数越界写 L0C/GM 内存——表现为后续算子读到损坏数据、或直接设备崩溃，报错点与根因相距远；host 侧大 shape 时 L1 超限判断失真导致 tiling 分支选错，症状混杂。issue 标注必现（特定形状输入）。
