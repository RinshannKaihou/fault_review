  meta: 'stage: `rl` · Cov: `var:decode_reencode_drifts_trajectory` · 置信度 `documented`'
  mechanism: 生产 agent harness（Claude Code / Qwen-Agent 类）在 rollout 中**压缩上下文**（evict 旧轮次），训练对象因此不是序列而是**树**——每次 eviction 都把有效历史分叉。现有线性化都不保真：保留最右路径 → time-travel leakage（被训的条件里有 rollout 时已不存在的历史）；depth-first 重放 → 与生成时条件序不一致的 train-inference mismatch。论文给出两个梯度等价的精确修正（LogitTree：分段 K-forward 遍历，需 K+1 次 backward；packed 4D attention mask：需自定义 kernel 与白盒 eviction 记录）+ 单 backward 的变分松弛 SDCC（eviction 处对压缩 student 与 stop-gradient teacher 在重建历史上最小化前向 KL）。
  source: MemoryWalker, "Stop Training Agents on Contexts They Never Saw", arXiv:2609.00865（2026-09-01，窗口内）。https://arxiv.org/abs/2609.00865
  behavior: 无 crash；agent RL 在「训练条件 ≠ 生成条件」上更新——策略被优化去利用训练侧虚构的完整历史，部署侧（真压缩）行为漂移，且与 RL-RO.01 的数值 TIM 叠加后更难归因。与 RL-RO.11（decode/re-encode 非双射破坏序列恒等性）同族的结构性 TIM：那边 token 序列被改写，这边**条件历史本身**在 rollout 与训练两侧是不同对象；eviction 密度越高（长程 agent 任务）偏差越大。
  discovery: 2026-09-07 每日扫描
