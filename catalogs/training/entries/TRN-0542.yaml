title: DeepSpeed ZeRO 二次导出残留旧索引加载旧权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: deepspeed
    component: zero_to_fp32 导出索引清理
  behavior: 向已有输出目录再次导出 ZeRO 检查点时不清理旧 index/shard：先分片 FP32 后单文件 BF16 导出返回成功，目录加载器仍按残留旧索引读旧分片
effect:
  objects:
  - 模型权重
  detail: 第二次转换本身写对，但 stale index 让 loader 读到旧权重：后续训练或推理静默使用旧模型，无报错；DeepSpeed master 8d4f29c7、含无 mock 复现脚本
  visibility: 静默错误
mitigation:
  detect: 导出后校验 index 文件时间戳与权重 dtype/数值指纹（如 tag 值断言）
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8954（open，Retire stale checkpoint artifacts after replacing a ZeRO export，未合入）
