original:
  mechanism: 'DeepSpeed #8952（2026-10-30，master 8d4f29c75f4a4b30d4db00a94b4aebfdff5107f3）：convert_zero_checkpoint_to_fp32_state_dict / convert_zero_checkpoint_to_state_dict 向已存在的输出目录转换时不退役旧输出 index 与 shard。复现：写 tag=old（fp32 值 1.0）与 tag=new（值 2.0）两份 ZeRO-2 布局，先按 old 分片导出（max_shard_size=24）、再按 new 以 bf16 单文件导出到同一目录；第二次转换正确重建 tag 并写出正确新文件，但残留的旧输出 index 使目录式 loader（huggingface_hub load_torch_model）读到旧分片，pytorch_model.bin 断言通过而目录加载拿到旧权重。issue 给出不 mock loader 的最小复现脚本。修复 PR #8954（open）在替换 ZeRO export 后退役 stale checkpoint artifacts。'
  source: https://github.com/deepspeedai/DeepSpeed/issues/8952 + 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8954（open）
  behavior: 用 zero_to_fp32 转换工具把 ZeRO 检查点重复导出到同一目录（例如先导一版分片 FP32，再导一版更小的单文件 BF16）：转换报告成功、单文件内容正确，但之后从该目录加载（load_torch_model 等按 index 解析的 loader）拿到的仍是上一次导出的旧权重，训练继续或推理上线都用错版本模型，全程无任何报错或告警。
  trigger_surface: DeepSpeed zero_to_fp32 转换 API 复用同一输出目录、二次导出；master 8d4f29c7（2026-10-30）
  discovery: 2026-10-31 每日扫描
