id: TRN-0398
legacy_ids: []
slug: pytorch_npu_inductor_reduction_mask_bias_grad_axis_flatten
aliases: []
title: NPU Inductor 归约 mask 缺失污染 bias 梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: Inductor 归约 mask/layout
  behavior: GPT2/BERT 派生归约实际长度 768、tile 扩展到 1024，越界值置零后减均值、平方仍使无效 lane 非零污染归约；BERT 反向 bias 梯度的轴压平把应保留的输出轴一并归约。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: NPU 上用 torch.compile(backend=inductor) 训练 GPT2/BERT 时，均值、方差、bias 梯度等归约被 padding lane 非零中间值污染，或 bias 梯度按错误轴归约致维度语义丢失；训练不报错、loss 可能只轻微偏离，需 eager 对照才见差异。
  visibility: 静默错误
mitigation:
  detect: 编译前后 amax/amin/bias-grad 与 eager 对账；dump Triton 源码检查归约 mask 处理。
  fix: 修复 PR https://gitcode.com/Ascend/pytorch/pull/48448（merged 2026-10-23）：保留不能证明恒真的轴 mask 并在融合表达式计算后选择归约单位元；多轴 reduction 只压平 reduction axes；负索引/Load 生存期/tiling 搜索/符号 group 匹配/stride 证明/range 拆分拒绝协议共八类修复（issue !48387 关联）
