original:
  mechanism: 'cann/ops-nn #7917（2026-11-02 open，310P M200）。max_pool2d_with_mask_m200*.h 共 5 个实现文件（206-209/240-243/188-192/106-109/135-138 行）的索引尾部清零均用 3 参 DataCopy 传元素计数：AscendC DataCopy 在 NPU 模式按 32B 块对齐向下取整（DataCopyCheck 静默截断），bytes 非 32B 整数倍时尾部不足一块的字节不写入。代码只按 8192 字节分片、未对最后一块 DataCopyPad 或 SetValue 补齐。原代码摘录见 issue（max_pool2d_with_mask_m200_spatial.h:183-192）。输入合法性依据：算子自带样例 2D 池化 input[1,1,7,7] fp32 kernel 3x3 stride 1 pad 0 → output 5x5=25、validIndexBytes=25*4=100、100%32=4。与 TRN-0583（max_pool2d return_indices 四芯四态）同为 max_pool 索引面但芯片/机制不同（310P 尾部清零截断 vs 契约四态）。'
  source: cann/ops-nn https://gitcode.com/cann/ops-nn/issues/7917（open）
  behavior: 在 310P(M200) 上跑 MaxPool2dWithMask，凡是输出元素数不是 8 的倍数的正常 shape（如 7x7 输入 3x3 池化输出 5x5=25 个），indices 输出的尾部几个位置（最多 7 个 int32）不是 0 而是未初始化的脏数据——上游若信任这些索引做 unpool/backward 会静默取错位置。输出元素数是 8 的倍数时对齐、不触发。全程无报错。
  discovery: 2026-11-03 每日扫描
