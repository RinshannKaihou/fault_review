  - 数值结果
  - 隐状态
  detail: exp(-88)=0（应 6.05e-39）、exp2(-126)=0（应 1.175e-38 最小正规数）、1e-30/1e10=0（应 1e-40）、sqrt(±最小次正规)=[0,nan]；正常范围输入正确。
  visibility: 静默错误
mitigation:
  detect: 对 tl.div/exp/exp2/libdevice 数学函数用小值（次正规与最小正规边界）做逐函数对拍；检查结果是否为 0 或 NaN
  fix: 待定（#3322/#3323/#3349/#3356 等 issue open，2026-11-20~22；未见合并修复）
