title: MindFormers 静态 batch 恢复后跨 epoch 重复数据
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindformers
    component: Trainer 恢复偏移清除
  behavior: PyNative Trainer 从 checkpoint 恢复时设置的初始跳过步数在静态 batch 路径 epoch 耗尽重建迭代器前不清除（只在 dynamic_batch 时 set_init_step(0)）
effect:
  objects:
  - 训练样本流
  detail: 恢复训练后第 2 个 epoch 再次从 checkpoint 位置读起：10 条 batch2 偏移 3 复现实际 [6,7][8,9][6,7][8,9]（期望含 [0,1]）；8040 样本实测 epoch 边界重复恢复后首微批。
  visibility: 静默错误
mitigation:
