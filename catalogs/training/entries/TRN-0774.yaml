  visibility: 静默错误
mitigation:
  detect: 用全常量 1 的长分段输入（4096/65536 行、单段）检查输出是否恒为 1；或与 FP64 独立累加参考对拍
  fix: 修复提交 781f656aadc9（issue 给出）：为每个活跃列区间增加 FLOAT 暂存行，累加与除法都用 FLOAT，最后转回 FP16；是否已合入发布未核实
