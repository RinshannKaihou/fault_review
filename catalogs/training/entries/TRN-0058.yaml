  meta: 'stage: `pretrain` · Cov: `NEW` · 置信度 `documented`'
  mechanism: '`--fp8-param-gather` 路径的 ckpt 只存 BF16 反量化权重、不存 MXFP8 block scale；load 侧必须重量化，而 `MXFP8 → BF16 → MXFP8` **不是幂等的**。机制（逐 block 实测）：反量化后 block max ≤ 224·s（半 ceiling）时 scale 会掉一个 E8M0 指数，该 block 全部 32 个 code 翻倍——每个元素恰差 -1 code、单向、有界。'
  source: 'Megatron-LM PR #6666（附独立 repro 仓；132 个 weight key 中含 ''scale'' 的为 0；GB300 单 tensor 1664/32768 code、52/1024 scale 差异；scale 减半当且仅当 dequant max ≤ 224·s，1024/1024 无例外；4×GB300 真 save/load 实测多参数量级差异）。https://github.com/NVIDIA/Megatron-LM/pull/6666'
  behavior: '**值无损的编码损坏**：`dequant(W)` 与 `dequant(W2)` 逐元素 0/32768 差异，GEMM forward/dgrad 0 差异 → 训练继续且 bit 级等价，但零容差 ckpt parity check 失败、resume 后的量化编码与 fp32 master 的派生关系断裂。量化损失本身发生在训练期（ckpt 之前），round-trip 不增加误差。收录角度：合法配置下「加载成功但 ckpt parity 检查被骗过」的静默面；修复是 load 后从 FP32 master 重导量化参数。'
  discovery: 2026-08-20 每日扫描
