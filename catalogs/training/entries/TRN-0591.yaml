original:
  mechanism: deepspeedai/DeepSpeed !8974（2026-11-01 open PR，附前后对比实测）。DeepSpeedCPUAdam/DeepSpeedCPULion/DeepSpeedCPULAdagrad 在 fp32_optimizer_states 置位（默认）时为 bf16/fp16 参数保留 fp32 优化器状态，但其 load_state_dict 继承自 torch 实现，会把加载的状态 cast 成参数 dtype。后果：bf16_master_weights_and_grads + offload_optimizer（ZeRO-1/2/3 及 SuperOffload）的 resume 在 bf16 舍入的动量/二阶矩与 bf16-state kernel 上静默继续——实测 load_checkpoint 后每个矩 131584 个元素仅 3 个未被舍入（最大偏差 0.39%）；resume 相对不间断运行最高偏 1.0e-2。修复 PR override load_state_dict 按 fp32 取回保存值，修复后 ZeRO-1/2/3（betas 0.5）resume bit-identical。
  source: deepspeedai/DeepSpeed 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8974（open，未合入）
  behavior: bf16/fp16 + CPU offload 优化器训练中断恢复后，加载的 Adam 动量/二阶矩被静默舍入到 bf16 精度（131584 个元素里 99.998% 被舍入，最大偏 0.39%），恢复训练无任何报错，但与不间断运行相比第一步就偏到 1e-2 量级——长跑 resume 精度悄悄劣化。
  discovery: 2026-11-02 每日扫描
