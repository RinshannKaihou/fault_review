title: CPU 优化器 load_state_dict 舍入 fp32 矩
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: CPUAdam load_state_dict
  behavior: fp32_optimizer_states 默认开启时 bf16/fp16 参数保留 fp32 矩，但继承 torch 的 load_state_dict 把状态 cast 成参数 dtype，resume 在舍入后的矩上静默继续
effect:
  objects:
  - 优化器状态
  detail: load_checkpoint 后 131584 元素中仅 3 个未舍入（最大 0.39% 偏差）；resume 与连续运行偏差最高 1.0e-2
  visibility: 静默错误
mitigation:
  detect: resume 后读回优化器状态 dtype 与保存值比对；与不间断运行对拍第一步后参数
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8974（open，未合入）：override load_state_dict 从保存张量按 fp32 取回状态（修复后 resume bit-identical，未核实合入）
