original:
  mechanism: 'cann/ops-transformer #6701（2026-10-25，open，A2 910B2 / CANN 9.2.0 / master c9bd7d19）。aclnnMoeInitRoutingV3 在 dropPadMode=1（Drop/Pad）且 quantMode=-1（非量化）、传入 scaleOptional 时，资料要求 expandedScaleOut 输出 [expertNum*expertCapacity]=[6*3]=18 个 FLOAT32；实测两段均返回 0，出参预填 0xA5 后读回 72/72 字节未变（对照 dropPadMode=0 时 16 个有效值正确写出）。即 Drop/Pad 分支缺失 scale 写出路径，调用方读到残留显存。R=8,K=2,H=16,E=6,CAP=3 复现闭合。'
