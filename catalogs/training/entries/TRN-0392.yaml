id: TRN-0392
legacy_ids: []
slug: opsnn_softplus_grad_sigmoid_overflow_inf_times_zero_nan
aliases: []
title: SoftplusGrad 大负输入 sigmoid 下溢 inf×0 出 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SoftplusGrad sigmoid 计算
  behavior: sigmoid=1/(1+exp(-features)) 在大负 features 时中间量溢出为 inf、sigmoid 下溢为 0；特定窗口内遇 inf 梯度时 inf×0=NaN，正确应为 ±inf。
effect:
  objects:
  - 梯度
  detail: softplus 反向在深负激活区（约 -103~- -89）遇到 inf 梯度时输出 NaN 而非 ±inf；修复前 375 条旧用例 374 PASS、唯一失败即此边界。
  visibility: 数值异常
mitigation:
  detect: 对 features∈(-103.28,-88.73] × gradients=±inf 组合做边界单测；已写修复。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/12612（open 2026-10-23）：sigmoid 改 Compare/Select 双分支稳定实现（两分支 exp 参数均 ≤0）并叠加 fp32 最小正规数 1.17549435e-38 防 FTZ 刷 0；Kernel UT 13/13、Host UT 29/29、上板 83/83 PASS（PR 记录，未发布）
