id: TRN-0513
legacy_ids: []
slug: mfsdp_v2_backward_prefetch_stale_weights
aliases: []
title: Megatron MFSDP v2 预取错序静默用旧权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: megatron-lm
    component: MFSDP v2 prefetch
  behavior: MFSDP v2 按静态注册序预取，模块执行序与注册序不同时反向序预测错误，对已完成 post_backward 的模块重复预取且不释放 gather，step 后该模块权重不换新也不报错
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: 从第二步起部分模块用 step 前的旧全量权重做前向/反向，loss 逐步漂移（2 GPU fp32 SGD 实测 5 步 max|Δloss| 2.27e-3），无任何报错或警告
  visibility: 静默错误
mitigation:
  detect: 对比 prefetch 关闭前后的 loss/梯度；检查 step 后 Parameter 是否仍为 unsharded 状态
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/8687（open，未合入）：FsdpContext 用 weak set 记录本趟已完成 post_backward 的模块并跳过对其预取
