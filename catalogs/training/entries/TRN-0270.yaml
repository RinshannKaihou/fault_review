title: CCU AllReduce 槽位随 rank 落位致跨卡归约不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: CCU GroupReduce 归约槽位落位
  behavior: CCU 引擎 GroupReduce 将本卡输入固定垫底于 GO 内存末槽、远端按 rank 升序占槽 0..N-2，硬件按槽序归约：各卡浮点加法操作数序列随本卡 rank 漂移，同输入不同卡输出 bitwise 不一致。
effect:
  objects:
  - 数值结果
  detail: CCU AllReduce one_shot/2die 浮点 SUM 下同输入各卡输出 bitwise 不相等（2die 两分支计算序列也不同）；整型与 MIN/MAX 不受影响。训练侧表现为跨卡归约结果分叉、不可复现。
  visibility: 不可复现
mitigation:
  detect: 同输入跨卡 AllReduce 输出 bitwise 对账；确定性模式训练对比。
  fix: 修复 MR !3607（open）：归约槽位按 rank 落位，各卡操作数序列恒为 (s_0..s_{N-1}) 与 rank 无关；合入后 CCU allreduce one_shot/2die 浮点 SUM 输出将发生预期 bitwise 变化（对齐全卡一致）。https://gitcode.com/cann/hccl/merge_requests/3607
