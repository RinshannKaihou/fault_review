original:
  mechanism: 'cann/ops-nn #7763（2026-10-30，Atlas A2 910B2、CANN 9.2.0、activation/swi_glu）：SetTotalShape() 的 shapeAfter 循环从 splitDim 累乘到末维，shapeAfter%2 只保证乘积偶数；「切分轴奇数、后续轴含偶数」被放行，tiling 用 colLen=shapeAfter/2 作偏移、kernel 按扁平化 numel/2 切分。实测 x=fp32[3,4] dim=0 → rc=0、out=silu(x[0..3])*x[6..9]（B 起点在第 1 行中间）；x=fp32[2,3,32] dim=1 → 偏移 48=3*32/2 同样扁平半切；x=[2,33] dim=-1（乘积奇）被拒但返回 561002 而非资料 161002。资料要求 x 的 dim 对应维必须是偶数。含复现与日志。'
  source: https://gitcode.com/cann/ops-nn/issues/7763
  behavior: NPU 上对 SwiGlu（swiglu 前激活）传奇数切分轴（如 [3,4] dim=0、[2,3,32] dim=1）：算子返回成功但按扁平化 numel/2 偏移切分，A/B 两半起点落在错误位置，输出是形状合法的错值——前向激活全链路偏离，无报错无 NaN，与 CPU 参考对拍才能发现。
  trigger_surface: CANN aclnnSwiGlu + 切分轴为奇数但其后轴乘积为偶数；910B2/CANN 9.2.0/master 59c0720c 族
