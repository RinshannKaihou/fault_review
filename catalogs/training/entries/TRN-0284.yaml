relations: []
original:
  mechanism: CANN 9.1.0 / Ascend950DT_9574（NpuArch=3510），FP32 [1,389]@[389,16] 走 aclnnMatmul→MatMulV3 的 FORCE_GRP_ACC_FOR_FP32（mode4）：同一 stream 前一个无关 NaN fill（独立 256MiB 缓冲、MM 期间仍存活）后，真实输入全有限且运行前后逐位不变，输出 16 个 NaN。原安装包上实际训练输入 50/50 次失败、常量矩阵脚本 10/10 触发；mode0 同 NaN 历史正常、mode4 零历史正常且 NaN 历史后清零可恢复。按原安装 tiling 用参考源码重编译的直调诊断内核 UB dump 抓到 A 尾部残留 NaN、B 尾部全零、乘加后 C 尾部 NaN；仅增加 A 清零后 5/5 恢复正确。证据边界：dump 来自独立编译参考内核而非安装二进制插桩，原 kernel 与源码精确版本对应请维护方核对；NaN×0=NaN 使单侧补零无法隔离。
  source: https://gitcode.com/cann/ops-nn/issues/6698
  behavior: 训练中 matmul 输出间歇性整块 NaN：输入矩阵检查全部有限、换 batch/重跑可能消失又出现，取决于同 stream 此前是否有 NaN 写入过被复用的内存；会被误判为数据问题或偶发硬件故障。实测有限输出下 mode4 最大绝对误差约 3e-9（结果约 1），触发时 16/16 全 NaN。附带确定性触发脚本与修复对照（A 清零后恢复），可作为定位工具。
  discovery: 2026-10-16 每日扫描
