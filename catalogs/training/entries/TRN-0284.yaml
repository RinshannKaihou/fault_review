id: TRN-0284
legacy_ids: []
slug: matmulv3_mode4_uninit_k_tail_nan_pollution
aliases: []
title: MatMulV3 mode4 读同 stream 前序残留 NaN 污染输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MatMulV3 A 尾部
  behavior: FORCE_GRP_ACC_FOR_FP32（mode4）下 A 的 K 尾部未被输入覆盖的加载区不初始化也不屏蔽，NaN×0=NaN 把残留 NaN 扩散进整块归约；mode0 不受影响。
effect:
  objects:
  - 数值结果
  - 训练轨迹
  detail: 输入矩阵全部有限且逐位不变时输出 16/16 NaN；训练中同 stream 任意前序 NaN fill 可让后续正常 matmul 间歇性全 NaN，随内存历史变化，难以稳定复现。
  visibility: 数值异常
mitigation:
  detect: 输入有限性检查无法发现（输入本就有限）；对 matmul 输出抽查非有限值；用零历史 vs NaN 历史对照定位；issue 附常量矩阵脚本在原安装包 10/10 触发。
  fix: 待定（issue open；最强根因判断为 TO_MUL 路径 A 的 K 尾部未初始化，参考实现仅增加 A 清零后 5/5 恢复正确，维护方未回应；正确修法应为初始化或屏蔽尾部而非只补零乘法侧）
