id: TRN-0580
legacy_ids: []
slug: opsnn_apply_adam_w_quant_mref_always_zero
aliases: []
title: ApplyAdamWQuant mRef 索引计算缺陷致输出恒为 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: aclnnApplyAdamWQuant
  behavior: mRef 作为输入/输出张量调用后恒为全 0（预填 127 仍被写成 0，排除未写回），量化动量索引未按更新后的 m 写出；同调用 vRef/absmaxMRef 正确
effect:
  objects:
  - 优化器状态
  detail: 下一步以 0 号索引反量化 m，absmaxMRef 系统性偏小（第 2 步实测 0.2013 vs 参考 0.5268），量化 AdamW 训练静默错值
  visibility: 静默错误
mitigation:
  detect: 调用后读回 mRef 与参考量化索引对拍（absmaxMRef 与 vRef 可作对照，两者正确）
  fix: 待定（issue open，未见修复 MR）
