title: CELossGrad target 越界静默错值并越界读 weight
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: CELossGrad target 处理
  behavior: target 越界/负值仅处理「负且等于 ignoreIndex」，其余直接当下标做 one-hot 减法，weight 路径 weightGm.GetValue(target) 越界读 GM。
effect:
  objects:
  - 梯度
  detail: target 含 padding(-1)/越界标注时 CE 反向不中断、梯度按错误位置计算，weight 越界读读到其他显存。
  visibility: 静默错误
mitigation:
  detect: 训练侧在 loss 前断言 target∈[0,C) 或 ==ignoreIndex；golden 比对含越界 target 用例。
  fix: '待定（issue open，期望取值校验；关联 #7047 aclnnNLLLoss、#4837 同类不同算子）'
