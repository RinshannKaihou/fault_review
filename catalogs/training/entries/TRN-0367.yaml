original:
  mechanism: cann ops-nn aclnnCrossEntropyLossGrad：op_kernel/cross_entropy_loss_grad_weight_not_none.h:84-88 只处理 target<0 且 ==ignoreIndex 的分支，其余越界/负值直接作下标——weight 路径 weightGm.GetValue(target) 按越界地址读 GM（target=-1 读 weight 之前、99 读之后）；infershape 只校验 rank/维度耦合无法校验取值。实测（A2 910B2、CANN 9.2.0）：C=2 时 target=[0,1,0,2]（2 越界）两段 rc=0、out=-0.107577 vs 合法对照 -0.0896471，输出按错误位置做 one-hot 减法而非拒绝；源码注释自称「其他负数报错内存越界符合预期」但实测不报错。issue 明确指出训练数据管线 target 偶发 -1（padding 值）或标注错误越界时训练不中断而梯度错误。
  source: https://gitcode.com/cann/ops-nn/issues/7136（2026-10-21，open；含自包含 C 复现）
  behavior: 数据管线里标签偶发 -1（padding）或越界值时，NPU 上 CE 反向不报错不中断，梯度按错误位置计算，带 weight 时还按越界地址读显存——值随分配器布局漂移、可复现性差；训练继续跑但方向错，长跑中表现为收敛异常且难归因。
  discovery: 2026-10-22 每日扫描
