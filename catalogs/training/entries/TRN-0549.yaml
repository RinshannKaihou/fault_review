original:
  mechanism: 'TRL #8050（2026-10-30，open）：Qwen3.5 chat 模板（qwen3_5_think.jinja/qwen3_6.jinja 及训练变体）默认为每条生成 prompt 预填 <think>\n（enable_thinking=False 除外）。历史助手轮无思考时模板渲染 <think>\n\n</think>，模型常在新轮跳过思考：直接写正文与 <tool_call> 并以 <|im_end|> 结束、从不输出 </think>。parse_response(tokenizer, ids, prefix=prompt_ids) 从 prefix 读入预填的 <think>\n，reasoning_content 区在 completion 开始时就已打开且永不闭合，解析器把全部内容（含 tool call）留在 reasoning_content 并在序列末尾闭合，返回消息没有 tool_calls；无异常抛出故 plain-text fallback 也不适用。早期轮次无思考的对话常见（OpenAI Chat Completions 客户端回传历史时剥 reasoning，如 Strands OpenAIModel）。'
  source: https://github.com/huggingface/trl/issues/8050
  behavior: Qwen3.5/Qwen3.6 系列 GRPO 或 agent RL 训练中，模型某轮跳过思考（预填 <think> 后直接给正文和工具调用）时：rollout 解析出的消息 reasoning_content 吞掉整个回复、tool_calls 字段为空，reward 函数按没有工具调用给分，该批样本训练信号静默错误；解析不报错，只有抽查解析结果才能发现。
  trigger_surface: TRL parse_response + Qwen3.5/3.6 think 模板预填 <think>\n + 模型跳过思考（历史轮无思考时更常见）
  discovery: 2026-10-31 每日扫描
