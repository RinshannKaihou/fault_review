original:
  mechanism: cann/ops-nn 的 RegBase 系列归一化量化算子在 Ascend 950 上共用一套 FP32 归约实现，存在两类机制缺陷：一是归约容量缺口——NORMAL 的 9 行 tile 与 SPLIT 的每核 9 行都会访问第 9 个 RMS 倒数槽，而公共缓冲只有 8 个 FP32 槽，等于越界读/复用邻域数据；PERF 在 (129,257) 下申请 24 字节去记录 3 行部分和却按 FP32 元素寻址，修正后应为 96 字节；二是有限大方差下倒数下溢为 0：平方、累加或加 epsilon 在 FP32 中溢出/下溢后，归一化结果与量化输出退化为 0 或零点，而非报错。实测：RmsNormDynamicMxQuant 两个 1e20 bf16 输入得到 y=[0,0]、rstd=0（修正后 [1,1]），FP4 边界误差超限；RMSNormQuant 在 Ascend 950 上合法二维视图直接失败，大有限值量化错算；AddRmsNormDynamicQuant 在空输入、NZ 布局与 BF16 边界场景输出异常；AddRmsNormQuant 双路量化在 gamma=2^67、epsilon=FLT_MAX 时 y1 全 0、y2 全 5、V2 第四输出全 0（应为 ±8、1/9、±8），另有 PR !16338 修正归约缓冲与有限大方差路径。边界跟踪：当 FP32 平方、累加或加 epsilon 本身已溢出时，主线与部分仓内参考可能一致，但与高精度数学结果不同，该情形与本条的倒数下溢分开记录。
  source: 'cann/ops-nn issue #10332（RMSNormQuant 950 合法二维视图/大有限值）、#10334（AddRmsNormDynamicQuant 空输入/NZ/BF16）、#10335（RmsNormDynamicMxQuant 大 BF16/FP4 边界），均 open 2026-11-26 https://gitcode.com/cann/ops-nn/issues/10332 https://gitcode.com/cann/ops-nn/issues/10334 https://gitcode.com/cann/ops-nn/issues/10335 ；修复 PR https://gitcode.com/cann/ops-nn/pull/16338 （open）'
  behavior: 在 Ascend 950 上用带量化的 RMSNorm 系算子（RMSNormQuant、RmsNormDynamicMxQuant、AddRmsNormDynamicQuant）做前向时，只要输入是合法但量级很大的有限值（1e19~1e20 的 bf16，或正负交替的大数），归一化统计量就会下溢成 0，y 和量化输出跟着变成 0 或零点；1e20 的两个 bf16 输入本应归一化成 [1,1]，实际得到 [0,0]、rstd=0。空 batch、NZ 布局、BF16 边界也会触发输出异常。所有调用都返回成功、日志无异常，前向看起来只是“这一层输出偏小”，但反向梯度按 y=0 计算后整层失效，量化训练里表现为 loss 突然停滞而监控全绿。
  trigger_surface: Ascend 950 RegBase 量化归一化算子；有限大值（≥1e19 bf16）、正负交替大数、空 batch、NZ 布局、每核 9 行模板
