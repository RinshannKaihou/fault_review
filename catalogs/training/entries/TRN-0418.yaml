id: TRN-0418
legacy_ids: []
slug: ascend_pytorch_task_queue_fatal_error_downgrade
aliases: []
title: torch_npu 任务队列致命错误被降级后续计算假成功
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: Repository 异步任务队列错误状态机
  behavior: 异步算子失败后原实现首次抛异常时把 ERROR_EXIT 转 CAN_EXIT；消费者退出后后续任务可能被丢弃，但提交与同步不再报告原始错误，上层误用未经计算的输出；重试也假成功。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: 任一异步算子设备侧失败后，队列进入半死状态：后续提交/同步不报错，训练继续跑但输出是未计算显存残留；重试同样假成功。实机复现（#4738）以提交不存在的算子触发真实异步错误验证。
  visibility: 静默错误
mitigation:
  detect: 故障注入（提交不存在算子）后检查后续提交/同步是否持续报错；输出 canary 校验。
  fix: 修复 MR https://gitcode.com/Ascend/pytorch/pull/48474 （open 未合入：Repository 增加持久故障标志，故障后提交/同步持续抛异常；6 组配置实机验证通过；未核实发布版本）。
