original:
  mechanism: 'CANN ops-transformer aclnnMoeTokenUnpermuteWithRoutingMap（Atlas A2 910B2×8、CANN 9.2.0、master 23cb0599）：paddedMode=false 时 outIndex 与 permuteTokenId 两个输出从未被写出——两段接口都返回 0，两 buffer 保持调用方预填 canary 0x5a5a5a5a（6/6 元素全残留）；对照 paddedMode=true 时两输出正确写出（与 numpy.sort/argsort 逐元素一致），主输出 unpermutedTokens 两种模式都正确。资料明确描述两输出在 paddedMode=false 的语义（outIndex 槽位索引 [0,tokens_num*topK_num-1]、permuteTokenId [0,tokens_num-1]，shape 均 (tokens_num*topK_num)），即不是「该模式下无意义」。自包含 ctypes 复现脚本（仅 CANN + python3）。与同日 #6622（permute 侧环绕窗口尾部未写）对称：unpermute 侧整段输出缺失。无训练框架受害报告。'
  source: https://gitcode.com/cann/ops-transformer/issues/6607
  behavior: MoE 训练/推理调用 token unpermute（非 padded 模式）时，outIndex 和 permuteTokenId 两个输出是显存里从未被写过的脏数据（预填哨兵原样读回），主输出 token 张量本身正常、接口成功；下游如果消费槽位索引或 token id 做路由统计、梯度回填或缓存索引，拿到的是垃圾值，没有任何报错。
