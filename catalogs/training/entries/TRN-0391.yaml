title: MoeUnpermute paddedMode=false 两输出从不写出
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: MoeTokenUnpermute 写出分支
  behavior: paddedMode=false 时 outIndex 与 permuteTokenId 两个输出从未被写：接口返回 0，buffer 保持调用方预填内容；文档明确两输出在该模式下有定义语义。
effect:
  objects:
  - 数值结果
  detail: 非 padded MoE unpermute 路径下 outIndex（槽位索引）与 permuteTokenId 为未初始化显存（canary 全残留）；主输出两种模式都正确，paddedMode=true 对照正确写出。
  visibility: 静默错误
mitigation:
  detect: 两输出预填哨兵 round-trip；paddedMode=false 下与 numpy.sort/argsort 参考对账。
