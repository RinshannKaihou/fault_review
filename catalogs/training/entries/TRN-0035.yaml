  meta: 'stage: `shared` · Cov: `NEW` · 置信度 `documented`'
  mechanism: DeepSpeed Ulysses 序列并行在 `deepspeed/sequence/layer.py` 维护**进程级**全局 `_ulysses_num_kv_heads`，首次走 uneven-head all-to-all 时按第一个模型的头数 memoize（scatter 方向可从 tensor 形状恢复头数，gather 方向与 `_SeqAllToAll.backward` 恢复不了，故做成了全局）。此后同进程**任何**头数不同的模型都按第一个模型的值切分 all-to-all 布局——第二模型的 SP 通信静默错排。与 AutoTP 进程级 kv-head 全局（#8231，#8241 以 per-model `AutoTPMeta` 修复）同族；#8241 修 AutoTP 时在 `layer.py` 留 TODO 明知未修本处。
  source: 'DeepSpeed #8291（代码级分析 + 前后 commit 对照：#8241 前后行为一致；受影响场景点名 teacher+student 蒸馏 / OPD 与 RL actor + reference policy 开 SP）。https://github.com/deepspeedai/DeepSpeed/issues/8291'
  behavior: 合法配置、无报错；第二模型（典型是 RL 参照策略或蒸馏 teacher）的激活/梯度在 SP 边界被错误布局的 all-to-all 静默污染。actor+ref 双 SP 场景下参照 logprob 本身已坏，KL 探针与 TIM 校正从根上失真（放大 RL-KL.01 / RL-RO.01 的观测盲区）。
  discovery: 2026-08-23 每日扫描
