original:
  mechanism: 'cann/ops-nn #7291（2026-10-24，open，A2 910B2 / CANN 9.2.0 / master 843649b7）。aclnnTurboQuant 资料要求 centroids 为「1D、16 个 FLOAT32、按升序排列」；实测首尾对调或第 8 个改 NAN，两段接口都返回 0，kernel 照常写出 y 与 scale。基线复核：master CheckShape() 只校验形状 [16]，无升序/有限性校验。量化中心表乱序/含 NaN 时输出量化编码静默错误。TurboQuant 为 activation/latent 量化方案（如 FLA/Qwen3-Next TurboQuant 路径），训练侧量化感知/量化训练用到该算子时错误编码直接进梯度链。'
  source: https://gitcode.com/cann/ops-nn/issues/7291
  behavior: 给 TurboQuant 的 16 个量化中心点传成乱序、或其中混进 NaN：接口不报错返回成功，量化照常出结果，但编码全错；错误量化输出静默流入下游权重/激活，量化训练或量化感知流程的产物质量悄悄坏掉。
  trigger_surface: aclnnTurboQuant，centroids 非升序或含 NaN/Inf（A2 910B2 / CANN 9.2.0 实测）；host 校验缺失。
