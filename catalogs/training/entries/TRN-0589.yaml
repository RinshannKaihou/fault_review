original:
  mechanism: 'huggingface/trl #8052（2026-10-31 open）。默认设置下 SFTTrainer 跳过 ModernBertDecoderForCausalLM（含 Ettin decoder 模型）的非线性 prediction head：训练继续无报错，但被跳过层收不到梯度，其余参数用与原生推理/生成时不同的 logits 更新。复现为本地构造 tiny 真实模型+tokenizer+dataset，eval 模式下（排除 dropout）比较原生打分与 trainer 默认打分（同权重、输入、attention mask、labels），二者不一致。'
  source: huggingface/trl https://github.com/huggingface/trl/issues/8052（open，含可运行复现）
  behavior: 用 SFTTrainer 训 ModernBERT Decoder 类模型（如 Ettin），训练正常跑完无报错，但 prediction head 根本没被训练（梯度为 None），其余参数还是在一个和推理时不同的 logits 上更新。同一份权重，trainer 算出来的分数和模型原生 forward 对不上。
