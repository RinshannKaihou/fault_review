title: MC2 pertensor 量化把 bias 乘输入 scale
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: MatmulReduceScatterV2
  behavior: arch35 量化 kernel 让 biasGM_ 直接进 mmv3.Init，bias 在反量化前被 x1Scale*x2Scale 缩放；资料公式 bias 在括号外。A2/A3 量化路径则把 bias 排除在 matmul 外。
effect:
  objects:
  - 数值结果
  - 训练轨迹
  detail: Ascend950PR：x1 全 0、s1=s2=2^-4、bias=8 时资料 16.0、实测 0.0625（差 256 倍）；真实 scale≈1/448 时 bias 被压到 1e-6，等于静默丢弃 bias，带 bias 的量化 MC2 全部受影响。
  visibility: 静默错误
mitigation:
  detect: 构造 x1 全 0、bias 非零的 pertensor 量化 MC2 用例，比对输出是否等于 bias；覆盖 950 与 A2/A3 两条量化路径
  fix: '待定（issue #8877 open，2026-11-26；三处 arch35 引用已按 master 48c47ea16 逐行核对，未见修复 MR）'
