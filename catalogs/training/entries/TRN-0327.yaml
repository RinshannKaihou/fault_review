id: TRN-0327
legacy_ids: []
slug: op_plugin_masked_scatter_small_src_oob_garbage
aliases: []
title: op-plugin masked_scatter src 不足静默填越界垃圾
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: masked_scatter 入口校验
  behavior: masked_scatter 两条入口（opapi 与 aclops 兜底）都不校验 src 容量是否 ≥ mask 真值数，src 不足时静默接受，越界读设备内存垃圾填入结果。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: src.numel() < mask 真值数时，NPU 上 masked_scatter_ 不报错，超出 len(src) 的槽位填入越界读到的设备内存垃圾（确定性值、非 NaN），垃圾值随前向/反向传播扩散；双芯一致、上下文存活、无告警。
  visibility: 静默错误
mitigation:
  detect: 入口断言 src.numel() >= mask.sum()；或与 CPU 实现对照。
  fix: 修复 MR https://gitcode.com/Ascend/op-plugin/merge_requests/6055 （open 未合入）：两条入口插入 check_source_capacity（快路径 numel 比较零同步、慢路径真值计数 TORCH_CHECK，报错语义与 CPU 对齐）；静态核验通过，真机验证未做（作者无本地 NPU）。
