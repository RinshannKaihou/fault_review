id: TRN-0370
legacy_ids: []
slug: opsnn_bn_backward_saveinvstd_as_variance
aliases: []
title: BN 反向把 saveInvstd 当方差致梯度静默偏差
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BNBackward saveInvstd
  behavior: kernel 把入参 saveInvstd 直接当方差参与梯度公式，与资料/参数名定义的 1/sqrt(Var+eps) 口径相反；无校验。
effect:
  objects:
  - 梯度
  detail: 按 torch save_invstd 口径传入时 gradInput 偏 4.77%、gradWeight 偏 8.10%（fp64 参考对照），rc=0。
  visibility: 静默错误
mitigation:
  detect: 分别传 invstd 与 var 跑 BN 反向，与 fp64 参考比对（偏差>4% 即命中）；对齐口径后再用。
  fix: 待定（issue open，实现改口径或资料/校验对齐）
