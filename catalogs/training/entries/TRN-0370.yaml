original:
  mechanism: cann ops-nn aclnnBatchNormBackward 把入参 saveInvstd 当方差参与计算，与资料 docs/aclnnBatchNormBackward.md「(Var(x)+eps) 开平方的倒数」的定义相反。实测（A2 910B2×8、CANN 9.2.0，torch_npu 路径）：按 torch save_invstd 口径（1/sqrt(var+eps)）传入时 gradInput 与 fp64 参考偏差 4.77%、gradWeight 偏 8.10%；传 var 反而 ≤1.7e-7 全对——证明实现消费口径是 var。两段 rc=0 无报错。该算子是 BN/SyncBN 训练反向路径，上游 torch 生态按参数名传 invstd 的调用方全部命中。
  source: https://gitcode.com/cann/ops-nn/issues/7035（2026-10-21，open；含 python+ctypes 复现与双口径对照数据）
  behavior: 任何按 torch 语义传 save_invstd=1/sqrt(var+eps) 的 BN 反向调用（torch_npu 透传路径）在 NPU 上 gradInput/gradWeight 系统性偏差约 5%/8%，训练持续跑但 BN 参数更新方向偏差，最终模型质量受损且难以察觉——没有 NaN、没有报错，只有慢性的梯度偏差。
  discovery: 2026-10-22 每日扫描
