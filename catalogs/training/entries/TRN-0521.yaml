original:
  mechanism: 'CANN ops-math aclnnRsub（math/sub/op_api/aclnn_rsub.cpp:149）的 alpha 判等函数 IsScalarOne 对整型 alpha 调用 alpha->ToInt32()==1。alpha 为 ACL_INT64 且数值超 int32 范围但低 32 位恰为 1 时（如 2^32+1=4294967297）判等返回 true，算子走 l0op::Sub(other,self) 快路径、丢弃 alpha，输出从 other-self*alpha 塌成 other-self；两段式接口均返回 0、无报错。误差量级=self_i*(alpha-1)，报告者实测 1.29e11。环境：Atlas A2 910B2、CANN 9.2.0、commit 1b415030、自包含 C++ 复现。同函数 aclnnRsubs（other 为标量）由 #4247 报告，共用同一 IsScalarOne 但分属不同接口与 promoteType 路径、需分别回归故分别建档。'
  source: https://gitcode.com/cann/ops-math/issues/4254（标量变体 https://gitcode.com/cann/ops-math/issues/4247）
  behavior: NPU 训练代码中 torch.rsub/alpha 参数为大 int64（≥2^32 且低 32 位为 1，如 4294967297）时，算子静默丢弃 alpha 把 other-self*alpha 算成 other-self，单元素误差可达 1.29e11 量级；返回码 0 无报错，损失/梯度被大规模错值污染
  discovery: 2026-10-30 每日扫描
