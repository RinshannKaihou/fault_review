original:
  mechanism: 'verl PR #8467（2026-10-30，open）：Megatron QAT NVFP4 激活量表收集器把首个数字型模块路径分量当 layer ID，但局部层号在每个 pipeline stage 与虚拟 chunk 上重新计数；SequentialMLP 多专家被坍缩为每层/每投影一份量表；Bridge 导出权重广播到所有 PP rank 而各 rank 只保留本 stage 激活量表。三者叠加可在 QAT 已完成激活观测后仍导出另一个专家的量表或初始 1.0 fallback。修复：用 owning layer 的全局 layer_number、保留 SequentialMLP 全局专家 ID、在消费导出迭代器前跨 PP 组 gather 观测标量元数据；量化算术与观测前 fallback 不变。测试：merge main@8e48d72d 后 CPU 53 通过 + 14 项 pre-commit 通过。'
  source: https://github.com/verl-project/verl/pull/8467
  behavior: verl Megatron 侧做 NVFP4 QAT 训练并通过 Bridge/compressed-tensors 导出量化权重时：导出文件里的激活 scale 可能来自错误的专家/层或还是未观测的 1.0 初值——量化模型加载与推理均正常，但精度相对 QAT 训练中实际使用的量化配置静默劣化，无报错，需逐专家对拍 scale 才能发现。
  trigger_surface: verl Megatron QAT + NVFP4（#8287 ModelOpt 导出路径）+ PP 多 stage/SequentialMLP 专家
