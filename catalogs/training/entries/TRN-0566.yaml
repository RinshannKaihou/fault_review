  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: 哨兵实证：越界偏移精确落到邻接缓冲（S3[871]/[65407]，值逐位相同）；scatter_ 列越界回卷覆盖靶内 63 个未触碰行；落点恰进 512B 分配隙时完全无痕。复机重跑逐位复现，紧邻目标张量（1MB 内）布置的其他张量被逐位写入用户值而无声毁掉。
  visibility: 静默错误
