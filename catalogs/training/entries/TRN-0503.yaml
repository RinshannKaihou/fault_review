title: BNTrainingUpdateV2 次正规域 FTZ 输出 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BN 更新 arch35 预计算
  behavior: arch35 预计算原生 vsqrt 把次正规方差 flush 为 0（multiplier=inf、addend=NaN）、vdiv 把次正规商 flush 为 0（y=inf×0=NaN）；IEEE 参考给有限值或 ±inf。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 次正规域（batch_variance≈6.53e-40、商≈1e-39~1.5e-40）y 输出全 NaN，ttk 报 NaN/Inf mismatch；L0_045/L1_505 seed=1234 稳定复现，L1_154 数据依赖偶发（随机 square_sum 落点决定商是否入次正规区）。
  visibility: 数值异常
mitigation:
  detect: ttk kernel 通路 seed=1234 跑 L0_045（稳定复现）；对 batch_variance 分布做次正规域检查
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/12961 已 merged（2026-10-29T07:13Z 批次快照）：sqrt/div 关闭 FTZ 消除次正规域 NaN/Inf，48/48 PASS→已合入，发布状态未核实
