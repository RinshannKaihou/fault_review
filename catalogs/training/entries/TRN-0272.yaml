id: TRN-0272
legacy_ids: []
slug: d2h_dma_madvfree_page_reclaim
aliases: []
title: NPU D2H 拷贝不清 MADV_FREE 脏标记页被回收清零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: aclrtMemcpy D2H 与分配器交互
  behavior: aclrtMemcpy DMA 写 CPU 内存不经 CPU MMU：不设 PTE_DIRTY、不清 MADV_FREE 标签；kswapd 视这些页为干净直接回收，数据清零。
effect:
  objects:
  - 数值结果
  detail: aarch64+NPU+mimalloc2.x下npu_tensor.cpu()间歇性得0；内存压力回收MADV_FREE且DMA写过页；MIMALLOC_PURGE_DECOMMITS=0+madvise(MADV_PAGEOUT)秒级87.6%清零；真实kswapd需root；C直调100%复现
  visibility: 静默错误
mitigation:
  detect: D2H 后校验和/CRC；复现脚本监测 LazyFree 页变化。
  fix: 上游未修。临时规避：用 torch.zeros+copy_ 替代 .cpu()（CPU memset 写入会清 MADV_FREE 标签）；修复建议为 DMA 后对目标页标脏。关联 PyTorch 上游同机制 issue：https://github.com/pytorch/pytorch/issues/200756
