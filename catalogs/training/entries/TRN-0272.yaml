original:
  mechanism: 'Ascend/pytorch issue #5396（2026-10-13，open）：aclrtMemcpy DMA 写入 CPU 内存不经过 CPU MMU，不触发 write-protect fault、不设置 PTE_DIRTY，因此不清除 MADV_FREE 标签；内存压力触发 kswapd 时内核认为这些页面是“干净的”直接回收→数据清零。背景：mimalloc v2.x 在 aarch64 自动启用，跨线程释放大 tensor 时经 _mi_segment_huge_page_reset 路径产生 MADV_FREE 标签（PyTorch issue #200756 同机制）。环境：aarch64、Ascend 910B4、CANN 9.0.0-beta.2、torch_npu 2.10.0.post4、PyTorch 2.10.0、mimalloc v2.2.4。三种复现：1) MIMALLOC_PURGE_DECOMMITS=0 + madvise(MADV_PAGEOUT) 秒级复现（87.6% 元素清零、LazyFree 归零）；2) 跨线程释放 + NUMA 压力触发真实 kswapd（需 root）；3) C 直调 mi_malloc/mi_free/mi_collect + DMA + kswapd 100% 复现。规避：torch.zeros+copy_ 替代 .cpu()。训练影响面：任何 D2H 拷贝（指标/日志取回、host 侧 ckpt 片段、eval 样本搬运）在内存压力下都可能静默拿 0。'
  source: https://gitcode.com/Ascend/pytorch/issues/5396 ；关联上游：https://github.com/pytorch/pytorch/issues/200756
  behavior: aarch64 + NPU + mimalloc v2.x 环境下 npu_tensor.cpu() 得到的 CPU tensor 间歇性出现 0 值（NPU tensor 本身不含 0），无任何报错；触发依赖内存压力（kswapd 回收带 MADV_FREE 标签且被 DMA 写过的页），呈间歇性。
