legacy_ids: []
slug: swift_grpo_masked_token_log_ratio_overflow_nan
aliases: []
title: swift GRPO 掩码 token log-ratio 溢出 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: ms-swift
    component: GRPO per-token IS ratio
  behavior: per-token IS ratio 先 exp(Δlogp) 再在 reduce 时乘 completion_mask，被排除 token 的 log-ratio 溢出为 inf 后 inf*0 变 NaN 污染 loss 与梯度
effect:
  objects:
  - 训练信号
  - 梯度
  detail: completion_mask 排除的 token（如 padding/截断段）Δlogp 大于 ~88（fp32 exp 上限）时 loss=NaN 且梯度 NaN；修复把掩码提到 exp 之前
  visibility: 数值异常
mitigation:
  detect: 监控 loss/梯度 NaN；检查被 mask token 的 Δlogp 分布
  fix: 修复 PR https://github.com/modelscope/ms-swift/pull/10433（commit 3f6d7cde 已在 main，PR 关闭未标 merged，等价修复已入主干）：exp 之前先把被排除 token 的 log-ratio 置 0
