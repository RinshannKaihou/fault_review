  mechanism: torch_npu（Ascend/pytorch）PR !48730（open）修复：NPU masked load 忽略上游填充值、固定补 0。最大池化 padding 需要 -inf 作为哨兵（窗口全 padding 时 max 应为 -inf 而非参与比较），masked load 固定补 0 使窗口内全 padding 时最大值与索引计算错误。修复使 masked load 尊重上游填充值、padding 正确使用 -inf。PR 为社区合入模板（未填需求/验证段，未跑 NPU 上板测试记录），机制与影响叙事在标题与修改方案。
  source: https://gitcode.com/Ascend/pytorch/pull/48730
  behavior: NPU 上含 padding 的最大池化（CNN/ViT 下采样等训练路径）边界窗口输出值与 argmax 索引静默错误：本应 -inf 的 padding 哨兵被 0 替代，窗口全 padding 时 max=0 且索引指向 padding 位；下游梯度据错误索引回传，训练无报错
