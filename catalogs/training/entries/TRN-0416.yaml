original:
  mechanism: 'cann/ops-nn #7281（2026-10-24，open，Ascend950PR / CANN 9.2.0 / TTK v3.0.0 geir --pc=1）。layer_norm 与 layer_norm_v3 的 InferShape 未处理输入 x 为未知秩（-2）：gert::Shape 以 1 维值 -2 存储，GetDimNum() 返回 1。两条故障路径：1) 误拒合法图——IsDimValid(1, begin_norm_axis) 按 [-1,0) 区间校验，2 维输入合法的 axis=1 被判越界，plog layer_norm_infershape.cpp:48 报 has wrong value[1]，构图失败（双侧复现）；2) 矛盾输出——axis=-1/0 恰好通过校验时，mean/var 在逐维循环中被推导为 [1]，与 y（未知秩）互相矛盾，InferDataType/tiling/执行均不自检（layer_norm_v3 侧为首次上板实证：after_infer y=shape[-2]、mean=shape[1]、var=shape[1]）。两算子 _def.cpp 均声明 DynamicRankSupportFlag(true) 与实现不一致。修复：未知秩时三输出统一置未知秩（修复后 PR head 567b4846 验证：marker 命中、真非法 axis 仍拒收、静态对照无回归，33 例/27 场景三阶段上板）。动态图训练（MindSpore/torchaire 动态 shape）下 layer_norm 前向常见。'
  source: https://gitcode.com/cann/ops-nn/issues/7281
  behavior: 动态图里 layer_norm 收到未知秩输入：要么构图直接失败报 axis 非法（明明是合法的多维输入）；要么构图通过但 mean/var 的形状被推成 [1]、与 y 的未知秩互相矛盾还一路放行到执行，训到后面才以形状错乱暴露。
  trigger_surface: CANN layer_norm/layer_norm_v3 + 未知秩（-2）动态图输入；TTK geir 模式实测，Ascend950PR / CANN 9.2.0。
  discovery: 2026-10-25 每日扫描
