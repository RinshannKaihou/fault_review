title: MoeGatingTopKSoftmax 310P tiling 路由错乱
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: MoeGating tiling 310P
  behavior: tiling 向上取整越过真实行数使输入塌缩为单尾块，非 8 倍数尾块走单整块 softmax 路径 UB 需求超限，输出被写坏产出垃圾专家索引
effect:
  objects:
  - 数值结果
  - 训练样本流
  detail: col=256 且行数落 (144,159] 非 8 倍数时 router 输出垃圾专家索引；vLLM+MoE GSM8K 动态 batch 约 21% 样本空输出（首 token 即 EOS），空输出样本 input_tokens 全落该区间；EP 机型 blockNum=8 未踩中
  visibility: 静默错误
mitigation:
  detect: 对 row<16*blockNum 且非 8 倍数输入单算子对拍；监控 MoE 首 token EOS 率
  fix: 修复 PR https://gitcode.com/cann/ops-transformer/merge_requests/14811（open）：guard 310P 尾块防 softmax UB 溢出
