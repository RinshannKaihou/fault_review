original:
  mechanism: CANN ops-transformer MoeGatingTopKSoftmax 310P tiling 路径（moe/moe_gating_top_k_softmax/op_host/moe_gating_top_k_softmax_tiling_310p.cpp DoOpTiling）：oneCoreRow=Align(min(rowTmp, UB_SIZE/(32*(colTmp+3*kAlign))), 16*blockNum)。Align 向上取整到 16*blockNum（310P RC 单 SoC GetCoreNumAic()=10 → 160），rowTmp<160（如 156）时取整越过真实行数 → activateCore=CeilDiv(156,160)=1，整个输入塌缩为单个尾块；尾块非 8 倍数走 SoftMaxTilingFunc 单整块路径，UB 需求约 (m+16)*col*fp16*3，col=256、m>144 时超 MAX_UB_SIZE(245760B) → softmax 输出写坏 → TopK 垃圾专家索引 → MoE 路由错乱。复现：vLLM+MoE 256 experts GSM8K 动态 batch，约 21% 样本空输出（首 token EOS），空输出样本 input_tokens 100% 落 (144,159] 非 8 倍数；EP 机型 blockNum=8、Align(25,128)=128<156 未踩中属形状差异非平台差异。单算子 row=156/col=256/fp16 RC 输出 10 行垃圾、EP 逐位正确，kernel sha256 两机型一致、病在 host tiling。修复 PR !14811（open）：guard 310P 尾块防 softmax UB 溢出。
  source: https://gitcode.com/cann/ops-transformer/issues/6910 + 修复 https://gitcode.com/cann/ops-transformer/merge_requests/14811
  behavior: Ascend 310P 上 MoE 模型训练/推理前向在 batch 行数落在特定窗口（col=256 时 row∈[145,159] 非 8 倍数）时 router 输出垃圾专家索引：训练侧专家分派与梯度全错，推理侧首 token 即 EOS（GSM8K 21% 空输出）；同权重同命令在 blockNum=8 机型正常，难以归因到 tiling 形状
  discovery: 2026-10-30 每日扫描
  notes:
  - 2026-10-31 2026-10-31 回访：#6910 open；修复 !14811 open（2026-10-30T03:15Z 更新），无状态变化。
