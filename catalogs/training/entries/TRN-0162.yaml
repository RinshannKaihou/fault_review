  mechanism: '**激进负载均衡 → over-dispersed routing** 的静默退化证据：训练期 aux loss 把 token 分布推向近均匀时，router 概率作为专家重要性信号**塌缩**（近均匀分布下专家间区分度消失）；对 gpt-oss-20B 做专家剪枝：**最低 perplexity 的剪枝配置给出最差数学推理**、最高 perplexity 配置反而保住能力——**perplexity 与下游能力的关系在 over-dispersion 下反转**，标准路由（Mixtral-8x7B-Instruct）无此现象（ppl 与精度同降）。'
  source: '"When Load-Balancing Goes Too Far: Expert Pruning in Over-Dispersed Mixture-of-Experts Models", arXiv:2609.04453（2026-09-03，本轮窗口检出）。https://arxiv.org/abs/2609.04453'
  behavior: 训练侧完全正常（这正是设计目标达成）——伤害在**训练目标与模型能力的错位**：负载均衡压力过大时学到的「均匀使用专家」使下游任何依赖 router 概率做重要性判断的路径（剪枝/合并/蒸馏专家选择）拿到无区分度信号，且 ppl 掩盖退化方向。与 MOE.01（均衡失守 → 熵塌缩 → 专家死）是同一「负载均衡压力 × 路由分布」轴的**反端**：那边均衡不足路由锐化、这边均衡过强路由过散，两端都毁能力而 loss 曲线都「正常」；与 LOSS 家族的差异：无任何步级数值症状，只有训后能力/可剪枝性可见——**长跑静默退化的 MoE 特异形态**；与 RL-KL.01「探针贴零不等于健康」同型观测陷阱（ppl 贴正常≠能力在）。
  discovery: 2026-09-19 每日扫描
