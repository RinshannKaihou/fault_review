- url: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1792
  kind: gitcode_issue
relations: []
original:
  mechanism: MindSpeed-LLM 26.0.0dev0 的 preprocess_data.py 用 --output-prefix /path/alpaca 预处理后，实际产物是 alpaca_packed_input_ids_document.bin/.idx、alpaca_packed_attention_mask_document.*、alpaca_packed_labels_document.*，即固定带 _packed 段。训练侧 mindspeed_llm/tasks/preprocess/mtf_dataset.py 第 64–74 行的 get_packed_indexed_dataset(data_prefix) 用 f"{data_prefix}_packed_*_document*" 去 glob，因此 data_prefix 必须是 --output-prefix 的原值。用户看到文件名里有 _packed，直觉把 DATA_PATH 配成 /path/alpaca_packed，glob 变成 alpaca_packed_packed_*_document*，匹配不到任何文件、返回空字典；随后 decoder_packed_mtf_dataset.py 第 82 行 total_num_of_documents = len(list(packed_indexed_dataset.values())[0]) 抛 IndexError。环境：26.0.0dev0（master，2026-08-20）、mindspeed 0.12.1、Qwen3-0.6B、Atlas 800T A2 单 NPU。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1792（open；MindSpeed-LLM 26.0.0dev0、Qwen3-0.6B 单卡；复现步骤与源码行号在正文）
  behavior: '指令微调数据用 preprocess_data.py 预处理完，按看到的文件名把 DATA_PATH 设成 .../alpaca_packed 再启动 tune 脚本，训练立刻 IndexError: list index out of range（decoder_packed_mtf_dataset.py line 82）；报错里没有任何“数据文件没找到”或“路径写错”的提示，用户要读源码才知道 DATA_PATH 不能带 _packed，自己估的定位耗时是 15–30 分钟。'
  trigger_surface: packed 指令微调数据集 + DATA_PATH 使用带 _packed 的输出文件名
  discovery: 2026-10-21 每日扫描
