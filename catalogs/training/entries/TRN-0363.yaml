id: TRN-0363
legacy_ids: []
slug: msllm_packed_prefix_double_suffix_glob
aliases: []
title: DATA_PATH 带 _packed 后 glob 双后缀取空数据集
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspeed-llm
    component: packed 数据集 glob 拼接
  behavior: 预处理固定输出 {prefix}_packed_*_document*，训练侧又给 data_prefix 追加 _packed 再 glob，用户按输出名填 DATA_PATH 就变成 _packed_packed，匹配不到文件。
effect:
  objects:
  - 可用性/进度
  - 训练样本流
  detail: 'glob 结果为空字典，decoder_packed_mtf_dataset.py:82 对 values()[0] 取长度抛 IndexError: list index out of range，报错完全不提路径或 _packed 后缀。'
  visibility: 报错
mitigation:
  detect: 启动时断言 packed_indexed_dataset 非空并打印实际 glob 模式；预处理后核对输出文件名与 DATA_PATH 是否一致
  fix: issue 建议：文档写明 DATA_PATH 取 --output-prefix 原值、空数据集抛带 glob 模式的 ValueError、检测到 _packed 结尾自动去后缀并告警（open，未核实修复）
