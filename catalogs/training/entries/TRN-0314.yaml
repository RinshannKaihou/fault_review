id: TRN-0314
legacy_ids: []
slug: op_plugin_conv_family_hf32_silent_precision_loss
aliases: []
title: op-plugin fp32 conv 全族静默 HF32 降精度且污染梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: conv 族 aclnn 出口精度模式选择
  behavior: fp32 conv 四算子的 aclnn 出口按 HF32 类低位宽执行，不遵循 high_precision 配置，前向与梯度同偏离；set_option（已废弃）与 jit_compile 均无法绕开。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: fp32 conv 前向 rel 误差 6.0e-4~1.8e-3（≈2^-10.5 量级），梯度同样被污染；双芯逐位相同（确定性非随机），无告警；fp16 同形态正常；matmul/bmm/einsum 同机达标可排除平台普遍性
  visibility: 静默错误
mitigation:
  detect: 同机 matmul/bmm/einsum fp32 对照（逐位或 <2.7e-6 达标）排除平台普遍性；conv 形态矩阵与 CPU 双端逐位比对
  fix: 待定（issue open：要求 op-plugin 确认 conv 族 aclnn 出口选择是否遵循精度模式配置并文档化；high_precision 选项已废弃不生效）
