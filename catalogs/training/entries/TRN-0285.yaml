original:
  mechanism: 'cann/ops-transformer moe_fused_topk（arch35 与通用内核两处）：开启专家映射时 kernel 以 mappingNum 原始值作取模基数计算映射表行内偏移，mappingNum 为零、负数或大于映射表宽度时偏移跨出本专家映射行、读到其他专家的映射项（issue #6151，实测触发面为异常映射数量输入）。host 侧参数校验不检查输出视图步长，y、indices 为内部元素重叠视图（如零步长广播）时被放行，输出语义不确定。修复 PR #13819（master，已 merged）+ 文档 PR #13848：mappingNum 改有符号读取、非正按 0、钳位到 tableDim_ 后取模；host 新增 CheckOutputLayout 按 shape 与 view strides（含 gcd）检测重叠，命中报 ACLNN_ERR_PARAM_INVALID(161002)；并回迁 9.2.0（MR !13857，回迁构建 API UT 11/11、映射边界 golden 21 组通过）。issue #6151 已 closed。'
  source: https://gitcode.com/cann/ops-transformer/issues/6151 ；修复：https://gitcode.com/cann/ops-transformer/pull/13819 ；9.2.0 回迁：https://gitcode.com/cann/ops-transformer/merge_requests/13857
  behavior: MoE 训练中 topk+映射阶段的 token→专家映射静默错乱：部分 token 被派到错误专家（读到别的专家的映射项），loss 无报错但路由统计/专家负载异常、模型质量受损；若输出张量传入重叠视图则输出值不确定。触发条件为映射数量异常（0/负/超宽）或非常规输出视图，正常配置不触发。
