title: MoeFusedTopk 映射数异常越界读、重叠视图未拦截
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: moe_fused_topk 映射偏移与输出校验
  behavior: 开启专家映射时 kernel 以 mappingNum 原始值（无符号读取）作取模基数算映射表行内偏移，零/负/超表宽时偏移跨出本专家行读到其他专家映射项；host 不检查输出视图步长，内部元素重叠的 y/indices 视图被放行。
effect:
  objects:
  - 数值结果
  detail: 映射数异常时 token 被路由到错误专家（读到他人映射项），无报错；重叠输出视图下输出语义不确定。MoE 训练中专家分布与路由结果静默错乱。
  visibility: 静默错误
mitigation:
  detect: 对 topk 输出 indices 与 expert mapping 做越界/一致性抽检；避免零步长广播视图作输出。
  fix: '修复已合入：master PR #13819/#13848（mappingNum 按有符号读取、非正按 0、钳位到表宽 tableDim_ 后再取模；host 新增 CheckOutputLayout 按 stride/gcd 拒绝重叠视图返回 161002，合法转置/带间隔布局放行），并回迁 9.2.0 分支 MR !13857（含 UT/ST 回归）。issue #6151 closed。https://gitcode.com/cann/ops-transformer/pull/13819'
