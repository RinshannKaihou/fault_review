original:
  category: RL-RO
  section: RL-RO
  meta: 'stage: `rl` · Cov: `var:nucleus_truncation_is_bias` · 置信度 `documented`'
  mechanism: verl 默认向 vLLM 请求 `processed_logprobs`（`rollout.logprobs_mode`）。top_p / top_k / min_p 截断下，该 logprob 在**保留集上归一化**，而 trainer 侧 `old_log_probs` 在全词表 log-softmax——`old_log_probs − rollout_log_probs` 逐 token 携带 `log(kept mass)` 偏置，与策略变化无关。该偏置被送进 rollout-correction 预设后越过拒绝门限：per-token 几何均值 ratio ≈0.964（Geo-RS 门限 `0.999_1.001`），257-279 token 求和后 `rollout_is_mean` 0.0012-0.0017（Seq-MIS 门限 `0.5_2.0`）——两个预设**拒绝每一条序列**、actor 梯度恒 0。k3 预设对此二阶不敏感（`r−1−log r ≈ 0.0007` @ r=0.964），偏置留在权重里不可见。报告者在 `main`@`6093e00`（GSM8K GRPO、Qwen2.5-1.5B-Instruct、2×RTX4090、100 步/臂）实测：Geo-RS 默认门限 + `top_p=0.8` → 100/100 步全拒、reward 从 0.13 停到 0.14，而未校正对照从 0.34 升到 0.83；补支持集尺寸重放（actor 侧 `logsumexp(top-|S| logits/T) − logsumexp(logits/T)` 加回 rollout 侧）后 `rollout_corr/kl` 降到 0.00029、reward 跟随对照。#8010（score centering）在 config 校验层只接受 `top_p=1, top_k=-1`，#8009 列 top_p<1 replay 为后续项——受影响的正是没被这两个守卫盖住的预设路径。
  source: 'verl #8020（2026-09-25；5 臂实测 + 100 步 stall 曲线 + 140 行 9 文件原型与全部 JSON 存档；`rollout_rs_seq_masked_fraction==1.0` 逐臂表格；评论含 100 步复跑与重放原型验证）。https://github.com/verl-project/verl/issues/8020'
  behavior: 无 crash、无 NaN 崩溃——唯一可见症状是一条通用 warning「Response mask is all False, returning default advantage metrics」每步一次 + `critic/advantages/*` NaN，不点名预设、截断或拒绝；run 看似在训（reward 曲线在动），实际 100/100 步零梯度、reward 停在起点。这是 RL-RO.07（`nucleus_truncation_is_bias`——同一 kept-mass 偏置首次在 trl 定位）在 verl rollout-correction 栈上的**训练侧放大实例**：同一机制，不同触发点——trl 那边偏置直接进 PPO 分母，verl 这边越过拒绝门限把整个 run 变成零学习信号。与 RL-ADV.08（猜中与推理同量级 advantage）同属「reward 在动、学习没发生」表象；与 OBS 家族互补：本条是 TIM 偏置经门限静默杀梯度，不是指标失准。
  discovery: 2026-09-26 每日扫描
  notes:
  - '2026-10-14 回访 2026-10-14：verl PR #8207（ Fixes #8020 之外的后续）描述默认 processed_logprobs 与全词表 old_log_probs 的截断质量差使 Geo-RS/Seq-MIS 全拒零梯度，与本条机制一致，拟以配置校验拒绝+运行时 warning 落地；截至本日 open 未 merge。verl #8196（score centering 自动对齐 sampler support）为相关配置层修复，同样 open。'
