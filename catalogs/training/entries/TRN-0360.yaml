original:
  mechanism: MindSpeed-LLM 在 DeepSeek-V4 类模型上开启融合 Lightning Indexer 算子、并在 CP>1 下走 compress + KV-allgather 分支时，fused_lightning_indexer_with_compress_kvallgather 在调用 npu_lightning_indexer 之前把 q/k/weights 从 [S,B,N,D] 预先转置成 [B,S,N,D]。但 npu_lightning_indexer 约定入参是 SBND，layout="BSND" 指的是算子消费的目标布局，算子内部自己会 rearrange 到 BSND。重复转置使 S 与 B 互换：mbs=1 时单个 CP sub-chunk 是 [1024,1,N,D]，转置后是 [1,1024,N,D]，算子按 S_Q,B,N1,D = query.shape 解包得到 S_Q=1、B=1024，于是给 metadata 传 batch_size=1024，而 cmp_residual_k 形状恒为 [1]，aclnnLightningIndexerV2Metadata 以 The batch_size of cmp_residual_k should match the valid batch size, but got 1 and 1024 失败。CP=1 不走 KV-allgather 分支，所以只有 CP>1 暴露。复现配置：2 卡、TP1/PP1/EP1/CP2、seq 4096 定长、BSND 输入路径、mbs=1。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1564（closed；2 卡、CP=2、seq 4096；根因分析与完整栈在正文）
  behavior: 'DeepSeek-V4 类模型开融合 Lightning Indexer、CP=2 训练在算子 metadata 预计算阶段直接崩：RuntimeError: call aclnnLightningIndexerV2Metadata failed, detail: AclNN_Parameter_Error(EZ1001): The batch_size of cmp_residual_k should match the valid batch size, but got 1 and 1024。同样的配置关掉融合算子、或把 CP 调成 1，都能正常跑；不开融合算子时 CP=1 与 CP=2 的精度是对齐的。'
  trigger_surface: 融合 Lightning Indexer + CP>1 + compress/KV-allgather 分支 + 定长 BSND 输入 + mbs=1
  discovery: 2026-10-21 每日扫描
