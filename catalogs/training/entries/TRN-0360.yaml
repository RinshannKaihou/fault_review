id: TRN-0360
legacy_ids: []
slug: msllm_li_cp_kvallgather_double_transpose
aliases: []
title: CP 融合 LI 算子重复转置致 S/B 互换
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspeed-llm
    component: fused LI CP KV 包装
  behavior: CP 的 compress+KV-allgather 分支先把 q/k/weights 从 SBND 转成 BSND 再调 npu_lightning_indexer，而该算子本身收 SBND 并在内部转 BSND，S 与 B 因此互换。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: mbs=1、CP=2、S=4096 时 sub-chunk [1024,1,N,D] 被算子读成 B=1024，metadata 校验 batch_size 与 cmp_residual_k 的 1 不符即刻失败；CP=1 不走该分支故正常。
  visibility: 报错
mitigation:
  detect: 开融合 LI 前先做 CP=1/CP=2 精度对齐；对传入 npu_lightning_indexer 的 q/k/weights 打印 shape 与 layout，确认上层没有再转置
  fix: issue 标题即修复动作：去掉上层预转置、直接把 SBND 传入并让算子内部 rearrange（closed，正文为修复的根因说明，未附 MR 链接，未核实合入版本）
