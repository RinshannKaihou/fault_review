  meta: 'stage: `rl` · Cov: `var:fp32_lm_head_not_applied_to_generation_backends` · 置信度 `verified`'
  mechanism: verl FSDP 引擎**从不读 `fsdp_config.dtype`**：该字段定义在基类 `EngineConfig`（`verl/workers/config/engine.py` L98）并被 `FSDPEngineConfig` 继承、docstring 明示「Mixed precision training param dtype」，但 `main` 上代码检索仅 Megatron 引擎消费它；FSDP compute dtype 只来自 `fsdp_config.mixed_precision.param_dtype`，`mixed_precision=None`（默认）时在 `transformer_impl.py` ~L391-400 硬编码 `param_dtype = torch.bfloat16`。用户按直觉设 `rollout.dtype=float16 + fsdp_config.dtype=float16` 期望 FP16 训练：vLLM rollout 确实 FP16（引擎日志可见），**trainer 静默保持 BF16**；副作用：`param_dtype == torch.float16` 才创建的 `ShardedGradScaler` 路径也被跳过。正确写法 `fsdp_config.mixed_precision.param_dtype=fp16` 才生效。报告者 verl `6093e007` 实测（1-step GRPO 门、4 prompts × 2 样本、`rollout_corr/k3_kl`）：BF16/BF16 默认 7.6e-4；错配组合 4.5e-4（mismatch 停留在 BF16 量级、约为真 FP16/FP16 的 63 倍）；FP16/FP16 7.2e-6。
  source: 'verl #8076（2026-09-30；`dtype` 字段定义/继承/唯一消费者三段代码定位 + 三配置实测 KL 表；`main@3084c261` 行为不变）。https://github.com/verl-project/verl/issues/8076'
  behavior: 无 error、无 warning——为压 TIM 专门选的 FP16 配置只改了 rollout 半边，trainer/rollout mismatch 纹丝不动，还叠加「FP16 rollout 无 GradScaler」的新精度面。与 RL-RO.23（trl `cast_lm_head_to_fp32` 只护训练侧打分）共享失效机制：**精度意图只落到训练侧、生成侧不跟**——触发点不同（那边是 autocast 上下文环绕 + vLLM 无 `head_dtype` 覆盖，这边是配置字段在引擎族中被静默不消费）。legacy `fsdp_workers.py` 路径报告者未核。截至 2026-10-09 open、0 评论、无修复。
  discovery: 2026-10-09 每日扫描（停机补扫）
