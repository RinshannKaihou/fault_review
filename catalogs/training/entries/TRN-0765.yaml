title: OpenRLHF unbiased KL 前向值被大代理项舍掉
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: openrlhf
    component: compute_approx_kl
  behavior: 返回式先算 value+grad_surrogate 再减 detached surrogate；有限但很大的代理项把裁剪后的前向 KL 值舍掉，前向 loss 改变。
effect:
  objects:
  - 训练信号
  detail: logprob -12000/-1 时有限平方代理远大于裁剪 k2 值 10，loss 与预期不同；44 个新测试在原实现 42 失败、修复后 44 通过；默认 unbiased_gradient=False 不受影响。
  visibility: 静默错误
mitigation:
  detect: unbiased_gradient=True 时对前向 loss 与所选估计器公式对拍；覆盖大 logprob 差距与 k1/k2/k3。
  fix: 修复 PR https://github.com/OpenRLHF/OpenRLHF/pull/1416（open 2026-11-13，未合入）
