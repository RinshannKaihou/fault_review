  meta: 'stage: `rl` · Cov: `var:from_pretrained_silent_random_init` · 置信度 `documented`'
  mechanism: verl 多教师 OPD（蒸馏）经 sparse Hydra override 构造 `DistillationTeacherModelConfig` 时，缺省的 inference 字段从 `RolloutConfig` 继承默认 `load_format="dummy"`（单教师 YAML 路径的值是 `"auto"`）；actor rollout 引擎后来有 weight sync 纠正 dummy 加载，**teacher 引擎没有任何后续同步**——受影响教师在整段训练中持续用随机初始化权重出蒸馏信号。修复 = teacher 缺省 `load_format="auto"` + 显式 `dummy*` 一律拒绝启动。
  source: 'verl PR #7742（CPU 回归测试；文档补写 teacher/actor 两种加载生命周期差异）。https://github.com/verl-project/verl/pull/7742'
  behavior: 蒸馏 loss 正常计算、正常下降——学生被拉向**随机教师**的输出分布；无 crash、无警告，唯一线索是蒸馏收益远低于预期。与 CKPT.03（missing key 随机初始化）同下游（随机权重当真值用），机制在**配置继承把占位加载格式带进无自愈路径**；与 RL-RO.08（LoRA adapter 漏同步）互补：那边同步了部分权重，这边整个引擎从未拿到真权重。
  discovery: 2026-09-06 每日扫描
