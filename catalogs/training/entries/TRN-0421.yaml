  - 数值结果
  - 可用性/进度
  detail: 变长/检索类算子收到 shape 与值域外的可选输入：越界读相邻显存当序列长度（total_task_num 33554432 垃圾值）静默产出错误调度/检索结果，或对非法输入返回成功、合法输入反被拒；无 host 拦截。
  visibility: 静默错误
mitigation:
  detect: 可选输入长度与主维度的关系断言；metadata 字段与 CPU 标杆对拍。
  fix: 部分有修复：ArgMax !6667（open）、MaxDim !6668（open）；cuSeqLengths 校验未见修复 MR。
