    component: 搜索/元数据算子 host shape·值域校验
  behavior: 可选输入只校验非空不校验长度/值域：cuSeqLengths 未与 B 校验即按 b+1 索引越界读；argmax 零长归约轴返回成功；MaxDim indices dtype 未校验放行；LeScalar out dtype 白名单误用
effect:
