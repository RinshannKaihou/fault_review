  meta: 'stage: `sft` · Cov: `var:secondary_eos_mask_misclassifies_terminated` · 置信度 `documented`'
  mechanism: 'ms-swift GKD 离线蒸馏（`--lmbda 0`，数据集样本非生成 rollout）给 `GKDSample` 沿用了 **rollout 默认 `add_eos=False`**：数据集 response 不带字面 EOS 时，蒸馏 KL loss 与辅助 SFT loss 的**终止监督双双缺席**——学生学不到何时停止；只修学生 labels 还会让远端 teacher prompt logprobs 缺 EOS 位、被 KL 过滤掉。修复（PR #10285，2026-10-02 merge）= 数据集 `GKDSample` 用常规训练 EOS 策略（`None`）、`RolloutInferRequest.add_eos` 新增 `''auto''` 值由模板在编码时按 stop-word/分隔符/重叠规则决定（生成 rollout 仍为 `False`，含截断）。'
  source: 'ms-swift #10282（2026-10-01；用户报告离线蒸馏学不到 EOS logits）+ 修复 PR #10285（真实 Qwen3 tokenizer验证：原样本 15 监督 token 无 EOS、常规训练 17 含 EOS、修复后对齐；414 项本地检查）。https://github.com/modelscope/ms-swift/issues/10282 ；https://github.com/modelscope/ms-swift/pull/10285'
  behavior: 无 crash——离线蒸馏训出的模型 EOS 行为不受监督：终止概率漂移、生成不停止或过早停止，蒸馏 loss 曲线完全正常。与 DATA.10（多 EOS 模型 completion 边界只认单 id）同族「**EOS 语义在训练/生成两侧或路径间错位**」：那边是次级 EOS 不被 mask 认、这边是 EOS 位整体从监督中消失；与 SFT.13（逐消息 tokenization 丢 `<think>` 块）同为「监督信号在数据管线中静默蒸发」。10-09 曾以「需核修复是否引入新静默面」留观，本轮核 PR 描述（`'auto'` 仅数据集样本路径、生成 rollout 行为不变）后收录。
  discovery: 2026-10-10 每日扫描
