original:
  mechanism: 'cann/ops-math #4123（2026-10-27，Atlas A3 8 die、CANN 9.2.0、ops-math master 68d14557）：aclnnInplaceFloorDivides 在 selfRef 整型、other 浮点标量时把整数先降到 fp32 再算，输出与资料公式 floor(input/other) 不符。实测：int32 [16777217,16777219,16777221,2147483647]÷fp32 1.0 → 16777216/16777220/16777220（±1）；int64 [9007199254740993,...]÷fp32 3.0 → 偏差最大 89478485；同值整型标量两组全部精确。偏差恰落 fp32 表示精度（相对 2^-24/2^-25）。源码定位：math/floor_div/op_api/aclnn_floor_divide.cpp InferFloorDivTensorScalarDtype(:136) 非 RegBase 平台返回 PromoteType(:148)；CalcFloorDivides(:324) 用 promoteType 做 l0op::Cast(:341) 降精度、末尾 Cast 回整型(:351) 截断；CheckPromoteType(:178) 的 dtype-cast 校验只在 RegBase 分支(:200)执行——A2/A3 上「推导类型无法转换 out 类型」161002 子项不校验。参考实现：PyTorch CPU t.int().floor_divide_(1.0) 抛 RuntimeError（前置拒绝），NPU 选择接受并降精度。资料只声明 FP16/BF16 精度误差，未声明整型+浮点标量降精度；ST 只有 int64×int64 组合。训练侧影响：数据管线/统计/索引计算里整型张量做浮点除法（如学习率分组、token 统计）得到静默脏整数值。'
  source: https://gitcode.com/cann/ops-math/issues/4123
  behavior: NPU 上对整型张量用浮点标量做 floor_divide_（如 x.floor_divide_(3.0)）时输出静默偏错：int64 大值偏差可达 8.9e7、int32 ±1，结果仍是看起来合法的整数；同值整型标量则完全精确。两段返回 0 无告警，脏数据直接进下游计算。
  trigger_surface: CANN 9.2.0（Atlas A3 实测，A2/A3 非 RegBase 路径）；aclnnInplaceFloorDivides；整型 selfRef + 浮点标量 other
  discovery: 2026-10-28 每日扫描
