title: RLOO 先 exp 后 clip 致 NaN 梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: RLOO 序列 ratio 裁剪顺序
  behavior: RLOO 对正 advantage completion 先对序列 log-ratio 求和取 exp 再 clamp：复用旧 completion 时增量和超 FP32 指数域，exp 溢出 inf 后才裁剪，反传 NaN。
effect:
  objects:
  - 梯度
  detail: num_iterations>1 且被复用的正 advantage 长 completion 序列 log-ratio 增量超 FP32 指数域时，loss 数值有限但反传 NaN 梯度；真实 tiny-Llama 复现。默认 num_iterations=1 不触发。
  visibility: 数值异常
mitigation:
  detect: clip 前检查序列 log-ratio 上界（>~88 for fp32 exp）；先 clamp log-ratio 再 exp
  fix: 待定（issue open，建议先裁剪后指数化）
