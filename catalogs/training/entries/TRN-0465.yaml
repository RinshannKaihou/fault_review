original:
  mechanism: 'trl #7896（open，2026-10-26，对照 main c6eac19f 确认）：RLOOTrainer 在 num_iterations>1（completion 与旧 logprob 复用）时，正 advantage completion 的求和 log-prob 增量若超出 FP32 指数域，损失先对序列 log-ratio 求和取 exp 再 clamp（rloo_trainer.py:1867-1879 求和→指数→裁剪），exp 溢出为 inf，裁剪在 inf 之后执行，反传产生 NaN 梯度，而该 completion 本已越过上裁剪界、正确梯度贡献应为零。数据流锚点：保存旧序列 logprob（:1643-1656）、跨迭代复用缓冲 completion（:1138-1164）。复现用真实 tiny LlamaForCausalLM + trainer 实际 fused LM-head 打分与公开 compute_loss（不替换内部）：leave-one-out advantage [+1,-1]，固定每 token logprob 增量 ~0.02 nats，首步梯度有限且 LM-head 梯度非零，第二步（复用后）loss 有限但梯度 NaN。默认 num_iterations=1 不触发；无 8192 特殊边界。'
  source: GitHub issue：https://github.com/huggingface/trl/issues/7896 （open，含真实模型复现与逐步数据表）
  behavior: RLOO 训练开 num_iterations>1 复用 completion 时，若某条正 advantage 的长 completion 在两次迭代间整体 log-prob 提升过大（序列和超过 ~88 nats），该步 loss 数值看起来完全正常，但 backward 出来的梯度是 NaN 并污染整批更新；不崩、无报错，只有检查梯度才会发现。默认 num_iterations=1 的配置不触发。
  discovery: 2026-10-27 每日扫描
