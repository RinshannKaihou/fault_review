original:
  mechanism: 'DeepSpeed #8927（2026-10-27）：AutoTP 训练（tensor_parallel.autotp_size>1）下 multi-query GPTBigCode（StarCoder/SantaCoder 风格，multi_query=True）与单卡训练的不是同一个模型且无任何报错。deepspeed/module_inject/fusedqkv_utils.py 的 _bigcode_type_transpose 执行 `torch.cat((split_q[gpu_index], kv), dim=0)`——每 rank 拿自己的 query 行切片加整块共享 K/V。各 rank attention 只用自身 query 头，对复制 K/V 行算的是部分梯度；fused_LinearLayer 是 column-parallel，权重梯度留本地，K/V 部分无人跨 TP 组求和。实测 TP2 一步：rank0 K/V 行梯度 vs 单卡相对误差 0.81、rank1 0.61，两 rank 求和后 2.7e-7（证明求和即可对齐）；c_attn.weight 与 c_attn.bias 均受影响。'
  source: https://github.com/deepspeedai/DeepSpeed/issues/8927
  behavior: GPTBigCode 类 multi-query 模型在 DeepSpeed AutoTP（TP>1）下训练时，各 rank 的 c_attn K/V 权重从第一步起朝不同方向更新（一步后梯度与单卡差 61%~81%），训练全程无报错但训出的权重与单卡不一致、副本间互相漂移；loss 曲线本身看不出异常。
  trigger_surface: DeepSpeed AutoTP（tensor_parallel.autotp_size>1）+ GPTBigCode multi_query=True（StarCoder/SantaCoder 类）；c_attn.weight/bias
  discovery: 2026-10-28 每日扫描
  notes:
  - '2026-10-30 2026-10-30 回访：DeepSpeed #8927 open；共享 KV 梯度归约修复 PR 未出现（搜索窗口内无）'
  - '2026-10-31 2026-10-31 回访：issue #8927 closed（2026-10-30T01:04:53Z）、修复 PR #8928 (Sum GPTBigCode''s shared key/value gradient across tensor-parallel ranks) 同刻 merged。修复合入主库；发布版本未核实。'
