title: DeepSpeed AutoTP 多查询 K/V 副本梯度不归约致漂移
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: deepspeed
    component: AutoTP fused QKV 切分
  behavior: _bigcode_type_transpose 给每 rank 返回其 query 切片拼接整块共享 K/V 行；各 rank 对复制 K/V 行算出部分梯度，column-parallel 的权重梯度留本地
effect:
  objects:
  - 梯度
  - 模型权重
  detail: TP>1 下 c_attn.weight/bias 的 K/V 行在各 rank 间漂移：实测 TP2 一步后 rank0/rank1 的 K/V 行梯度与单卡相对误差 0.81/0.61（rank 求和后 2.7e-7 证明梯度本可对齐）；训练静默发散于单卡结果。
  visibility: 静默错误
mitigation:
  detect: 对比 TP>1 与单卡的 c_attn K/V 行梯度；各 rank K/V 行参数逐 step all-gather 对比
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8928（merged 2026-10-30T01:04:53Z，issue 同刻 closed）；发布版本未核实
