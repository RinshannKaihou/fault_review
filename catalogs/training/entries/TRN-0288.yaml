relations: []
original:
  mechanism: 'torchair AscendC TopN autotune（experimental/_inductor_npu_ext 的 codegen_cpp_wrapper 生成 release()，compiler/_autotune.py、_kernel.py 调用）：选优完成后对落选候选 kernel .so 立即 dlclose。落选 kernel 在 profiling 阶段已被执行、device 代码已进入 icache；dlclose 释放 HBM 代码段且可能被复用，芯片未做 cache 一致性校验，出现 HBM 代码段与 icache 不一致 → 精度异常或 aic error。修复 MR !3844（master）/!3845（26.2.0）已 merged：新增 retired_kernel_handles 容器，release() 只登记不立即 dlclose，扩展 DeInit() 在进程退出（wrapper.so 卸载）时统一释放。issue #868 closed。'
  source: https://gitcode.com/Ascend/torchair/issues/868 ；修复 master：https://gitcode.com/Ascend/torchair/merge_requests/3844 ；修复 26.2.0：https://gitcode.com/Ascend/torchair/merge_requests/3845
  behavior: 开启 AscendC autotune 的训练/编译负载偶发两种表现：(1) 精度异常——输出错值但无报错，重跑或换卡可能消失；(2) aic error 崩溃。同一配置时好时坏、无法稳定复现是主要特征；关闭 autotune（固定 kernel）即可规避。autotune 是 torchair 图编译性能优化常用开关，训练侧 torch.compile/inductor NPU 扩展负载会命中。
  discovery: 2026-10-16 每日扫描
