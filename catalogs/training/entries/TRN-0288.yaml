id: TRN-0288
legacy_ids: []
slug: torchair_autotune_dlclose_icache_stale
aliases: []
title: torchair autotune dlclose 致 icache 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: cann
    component: release 即时 dlclose
  behavior: autotune 选优后对落选 kernel .so 立即 dlclose 释放 HBM 代码段；落选 kernel 已执行、device 代码在 icache，芯片无一致性校验，地址被复用后 HBM 与 icache 代码不一致。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: 偶发精度异常或 aic error：同一输入同一 kernel 时对时错，或直接 aic error 退出；取决于 dlclose 后该地址是否被复用。
  visibility: 不可复现
mitigation:
  detect: autotune 后偶发精度异常/aic error 且关 autotune 即消失时怀疑此机制；对比固定 kernel（关 autotune）输出。
  fix: '修复已合入：MR !3844（master）与 !3845（26.2.0 分支）均 merged——release() 将落选句柄登记进 retired_kernel_handles 延迟到进程退出统一 dlclose，选优语义不变。issue #868 已 closed。https://gitcode.com/Ascend/torchair/merge_requests/3844'
