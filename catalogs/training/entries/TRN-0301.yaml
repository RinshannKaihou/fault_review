original:
  mechanism: 'cann/ops-nn issue #6782（2026-10-16，Ascend 910B3 / CANN 9.1.0 / 驱动 26.0.rc1 / torch 2.9.0+cpu / torch_npu 2.9.0.post8，aarch64）。FP32 scatter_add_ 行广播索引（index 由一维 expand 得 stride [1,0]）走 LinearIndex→SortAiCore→ScatterAddWithSorted 路径；相同输入重复执行偶发输出错（首次差异出现在不同轮次，三次独立进程均命中，iteration 2 即命中的记录存在）。报告者核对上游 commit 8ce9e834d1ae1dd5143cc01217764036db91111f 的 FP32 内核头文件（与本机 CANN 9.1.0 去空白后相同）：源码与修复对照表明 FP32 路径初始化累加缓存后缺少向量流水同步，当前行可能读到前一行的残留值。torch.use_deterministic_algorithms(True) + 固定种子仍复现，排除框架层非确定性。输入回读校验确认源与索引未变，排除输入被污染。附带完整复现脚本（自动选空闲卡、CPU 参考按 bit 比较、1e6 次上限、首次差异即停并输出 expected/actual/max_abs/changed_elements）。'
  source: https://gitcode.com/cann/ops-nn/issues/6782
  behavior: 在 910B3 上用行广播索引对 FP32 张量做 scatter_add_（如 embedding 梯度按行累加、小整数输入），同一脚本重复跑会出现偶发的错行：某一行输出混入前一行的累加值（如 expected [89.0,...] 实际混入前行残数），diff 元素数与 max_abs 随机，输入检查未变化；不开 deterministic 也复现、开了也复现。不崩溃、无告警，错误随执行轮次漂移。
  discovery: 2026-10-17 每日扫描
  notes:
  - '2026-10-18 2026-10-18 回访：修复 MR !12144（2026-10-17 open）补齐 PIPE_V 屏障与三路径索引缓存 S_MTE2 同步；issue #6782 正文新增分层对照实验（只补索引同步第184次仍错、只补累加屏障100万次逐位通过、两处均补后 racecheck 无报告）+ 独立诊断算子证据，机制定论从偶发观察升级为同步缺失实证。'
