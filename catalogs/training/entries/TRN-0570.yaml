title: aclnnGatherV3 fp64 高秩输出整块全 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: GatherV2AiCPU fp64 高秩兜底
  behavior: fp64 且 self 秩≥6 时走 AICPU 兜底路径，两段返回 0 但输出整块写 0（确定性计算错误）；fp32 全秩逐位正确，fp64 秩≤4 正确、秩≥6 全 0。
effect:
  objects:
  - 数值结果
  detail: 910B 实测 rank 扫描：fp32 rank2-8 全部 neq=0；fp64 rank6/7/8 输出 2048/8192/32768 元素全 0.0，三次重复完全一致（确定性错误非竞争）；同 rank-10 out fp32 正常而 fp64 报 561000。
  visibility: 静默错误
mitigation:
  detect: fp64 gather 与 CPU 参照对拍（高秩小张量即可暴露全 0）；检查输出是否全零而输入非零。
  fix: 待定（issue open：AICPU 兜底有 rank/精度两处缺口，未见修复 MR）
