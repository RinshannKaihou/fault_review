original:
  mechanism: 'cann/ops-nn #7848（2026-10-31，open；Atlas A2/Ascend910B、CANN 9.2.0-beta.2）：aclnnGatherV3 在 self.dtype=DOUBLE(fp64) 且秩≥6（dim=0、batchDims=0、mode=1，A2 唯一放行配置）时两段接口返回 0 但输出整块全 0。rank 扫描矩阵（self=(3,2,...,2)、index=(2,2,...,2)）：fp32 rank2-8 全部逐位正确；fp64 rank2-4 正确、rank5 报 561000、rank6-8 输出全部元素 0.0（neq=2048/8192/32768 全不符）。同一输入重复 3 次完全一致——确定性计算错误非竞争/未初始化。机制：fp64 走 GatherV2AiCPU AICPU 兜底（fp32 走不同 kernel），该兜底在秩≥6 时静默产出全 0，且 out 秩达 10 时报 561000（shape dim num < 8 限制）而 fp32 同形状正常——兜底路径有 rank 与精度两处缺口。资料 aclnnGatherV3.md dtype 表含 DOUBLE、产品支持声明 A2，无组合限制。'
  source: https://gitcode.com/cann/ops-nn/issues/7848 （open，2026-10-31；含 rank×dtype 扫描矩阵、AICPU 错误日志与复现步骤）
  behavior: NPU 上用 fp64 张量做高维 gather（秩≥6）：接口返回成功、输出整块全 0.0 而非真实数据，无报错无 NaN；同样形状的 fp32 完全正确。训练里表现为 fp64 数据通路（双精度 embedding/科学计算索引）静默产出全 0，下游 loss/统计被静默拉向 0，重复运行稳定复现。
  trigger_surface: Ascend 910B + CANN 9.2.0-beta.2；aclnnGatherV3 fp64 + self 秩≥6（AICPU 兜底路径）；双精度 gather/索引训练路径。
  discovery: 2026-11-01 每日扫描
