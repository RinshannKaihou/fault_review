original:
  mechanism: 'cann/ops-transformer #7614（2026-11-15，open，Ascend950PR / CANN 9.3.0-950，fp16）。aclnnGroupedMatmulAdd 的 op_api/aclnn_grouped_matmul_add.cpp 共 7 个 check（CheckNotNull:46、CheckFormat:58、CheckShape:76、CheckZeroShape:156、CheckDtype:184、CheckAttrs:207、CheckParams:221）无一处校验 groupList 值域；docs/aclnnGroupedMatmulAdd.md:273 要求 groupList 非负、单调非递减、末值≤x 第一维。实测参数 dtype=fp16、3d、ND、x=[128,64]、weight=[128,32]、groupList=int64[2]、yRef=fp32[2,64,32]、transposeX=true、groupType=2，只改 groupList_data：[-64,128] 首组为负 → 输出含 256 个 NaN；[-64,-32] 全负 → max=8.02（合法 [64,128] 基线 max=10.54）；[128,64] 递减 → max=12.49；[200,300] 末值>K=128 → max=272.0 越界值；四类均 rc=0/0。单算子接口测试检出，报告标 P0。'
  source: https://gitcode.com/cann/ops-transformer/issues/7614
  behavior: MoE/分组 GEMM 训练里 groupList 传错（负数、全负、递减、末值超过 x 行数）时，aclnnGroupedMatmulAdd 不报 161002，直接按错分组进 kernel：输出可能出现整片 NaN，或数值看似合理但最大值明显偏移（8.02/12.49 vs 10.54），或出现 272.0 这种越界值。两段接口都返回成功，训练只在 loss/梯度异常时才暴露。
  trigger_surface: aclnnGroupedMatmulAdd，groupType=2 + int64 groupList 非法值；Ascend950PR / CANN 9.3.0-950 实测。
  discovery: 2026-11-16 每日扫描
