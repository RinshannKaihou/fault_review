  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: GRPO 的组内 advantage 只看 outcome reward 统计：一条 rollout **靠猜**命中正确答案（bounded-answer 小候选集、open-answer 里的 bounded 子题、搜索 agent 预算内多路径撞对）与**靠推理**命中，拿到完全相同的高 advantage——「正确答案」信号里混进了与能力无关的猜测分量，策略被推向 guess-like 行为。机制覆盖三类常见任务面；提案 SIGNBALANCE 保留 verifier 符号、用全局 scale、per-class stop-gradient 重标定恢复零均值。
  source: Wang et al., "Spurious Advantage Hidden in GRPO", arXiv:2609.04063（2026-09-03；数学 + 搜索 agent 双 benchmark，SIGNBALANCE 在 bounded-answer 与 search agent 上超 GRPO、open-answer 持平）。https://arxiv.org/abs/2609.04063
  behavior: reward 曲线上涨、benchmark 分数可能也涨，但策略的**能力构成**在漂移（guess 分量被强化）；与 RL-RWD.03（reward 过优化）同症状（指标涨、能力掉），机制在估计器而非 reward 本身；与 RL-ADV.02（std 放大已会题）互补：那边错在方差归一，这边错在 outcome 无法区分到达路径。
  discovery: 2026-09-05 每日扫描
