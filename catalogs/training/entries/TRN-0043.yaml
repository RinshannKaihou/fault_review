  mechanism: Megatron-Bridge 的 Wan 扩散模型 decoder（wan_model.py:267，Bridge `34d8d4b8`）对 `gather_from_sequence_parallel_region(x)` 用**默认** `tensor_parallel_output_grad=True`——backward 变 reduce-scatter。但 Wan 在每个 TP rank 上计算**同一个完整 loss**，于是 backward 把 TP 份相同梯度**求和**：TP=2 时 decoder 权重梯度范数 7.8876387 而非 3.9438193（恰好 ×TP），forward 输出各 rank 一致（错值只在梯度）。H100 Wan perf recipe 用 TP=2、CP=4、SP——默认即中招。修复 = 该 gather 传 `tensor_parallel_output_grad=False`，并与模型逐参数 TP 梯度平均标志一起复核。报告时点尚未对 Bridge 单独开 issue（审计报告注明 to be filed）。
  source: 'Megatron-LM #7452 Appendix B（2026-09-17；ezyang 审计；数值 + 修复 + recipe 暴露面）。https://github.com/NVIDIA/Megatron-LM/issues/7452'
  behavior: 无 crash、无 NaN——**decoder 参数的有效学习率恒 ×TP**，forward 全对、loss 正常下降，唯一表象是 Wan decoder 收敛动态随 TP 度不可比。与 PAR.11（GTP 梯度 ×GTP/EGTP）/MOE.12（aux 梯度 ×TP/CP）同病「梯度恒乘并行组大小」的第 3 个实例，这边断点是 **SP gather 算子的 grad 模式默认值与「每 rank 全 loss」的模型写法不匹配」；与 LOSS.09（G 缩放漂移）同为「并行度旋钮静默改有效学习率」。
  discovery: 2026-09-18 每日扫描
