  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 'trl RL trainer 的**指标路径**与 loss 路径掩码不一致：Online DPO `training_step` 里 loss 用 `cr_logprobs * ~cr_padding_mask`，stats 块却用原始未掩码张量算 `objective/kl`、`non_score_reward`、`rlhf_reward`、`entropy`；PPO 侧 #6121 修了 `objective/entropy` 但优化循环里 `policy/approxkl_avg`、`policy/entropy_avg`、`policy/ratio_avg` 仍在含 padding 的全位置上平均（隔壁 `pg_loss`/`pg_clipfrac` 已用 masked_mean）；XPO 的 `logps/chosen`、`logps/rejected` 干脆把 policy 与 reference logprob **加在一起**上报。所有监控数字系统性偏离真实量。'
  source: 'trl #6809（代码审计；明确「不影响训练 loss、全部 loss 路径掩码正确」，纯诊断面；Online DPO 已有 #6803 跟踪）。https://github.com/huggingface/trl/issues/6809 ；trl #6803（2026-08-24 补，Online DPO 实例独立 issue：`objective/kl`/`entropy`/`non_score_reward`/`rlhf_reward` 对全 completion 位置含 padding 求和；与 PPO 变体的差异——无 `INVALID_LOGPROB` 哨兵，pad 位置贡献普通有限负值而非 +1.0，entropy 单纯膨胀；PPO #6121 与 XPO/Nash-MD 已修，Online DPO 是残留未修副本）。https://github.com/huggingface/trl/issues/6803'
  behavior: 训练本身健康，但看板上的 KL/entropy/reward 曲线被 padding 拉偏——正是用来发现 RL-KL.01/RL-KL.03 塌缩的那几个探针。观测层骗过而非训练层出错：与 OBS.02（空文件读作健康）互补，这条是**错值读作真相**。
  discovery: 2026-08-23 每日扫描
