  objects:
  - subsystem: 算子/内核
    stack: cann
    component: unique valueOut 校验缺失
  behavior: CheckDtypeValid 不校验 valueOut：dtype 与 self 不一致时两段式接口返回 0，输出为位模式错读的脏数据；同族 aclnnUniqueConsecutive 同输入正确返回 161002，行为不一致。
effect:
  objects:
  - 数值结果
  detail: 910B2 实测：self=FP32[8]、valueOut=FP16 两段均返回 0，拿到脏数据无错误码；资料错误码表明写 self 或 valueOut dtype 非法应 161002；四接口行为不一致。
  visibility: 静默错误
mitigation:
  detect: 调用前断言 valueOut.dtype==self.dtype；与同族 UniqueConsecutive（会正确拒绝）或 CPU 参照对拍。
  fix: 待定（issue open：期望补齐 valueOut dtype 校验，未见修复 MR）
