original:
  mechanism: 'cann/ops-nn #7867（2026-10-31，open；Ascend910B2、CANN 9.2.0、ACLNN 两段式直调、master index/unique/op_api）：aclnnUnique/aclnnUnique2 的 CheckDtypeValid 只校验 self/inverseOut（Unique2 另加 countsOut），完全不校验 valueOut 的 dtype。实测 self=FP32[8]={1,2,2,3,3,3,4,5}、valueOut=FP16[8]（与 self 不一致）、inverseOut=INT64：两段式接口均返回 0，调用方拿到 self 位模式按另一 dtype 解释后的脏数据；对照组同违约输入调 aclnnUniqueConsecutive（dim=1000）正确返回 161002——同族四个接口行为不一致。资料 aclnnUnique.md/aclnnUnique2.md 错误码表明写「self 或 valueOut 的数据类型不在支持范围 → 161002」且 valueOut 参数行注明「数据类型同 self」。'
  source: https://gitcode.com/cann/ops-nn/issues/7867 （open，2026-10-31；含自包含 C++ 探针与同族对照）
  behavior: NPU 训练数据管线做去重（unique）时若输出缓冲 dtype 与输入不一致（如 fp32 数据配 fp16 valueOut）：接口返回成功、去重结果是位模式错读的脏数值（如把 fp32 位当 fp16 解释），无错误码无告警；同族 UniqueConsecutive 同输入会正确报 161002，行为不一致使问题更难预期。下游按脏值继续构建词表/统计。
  trigger_surface: Ascend 910B2 + CANN 9.2.0；aclnnUnique/aclnnUnique2 + valueOut dtype 与 self 不一致；去重/词表构建路径。
  discovery: 2026-11-01 每日扫描
