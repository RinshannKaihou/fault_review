original:
  mechanism: 'CANN ops-math aclnnClampMax / aclnnInplaceClampMax（conversion/clip_by_value_v2，Atlas A2 910B2、CANN 9.2.0、master efff3523）：clipValueMax 超出 self/out 整型可表示范围时标量被按位环绕。根因：aclnn_clamp.cpp:345-362 的 A2 分支 promoteType=out->GetDataType()（RegBase 分支才走 ClampPromoteType 推导），NormalizeMaxScalar 非空时原样返回标量，ScalarToTensor 的 ConvertToTensor 到 promoteType 无范围校验无饱和，整数越界按补码截断（1000→0xE8→-24）；ClipByValueV2 用错值当上界，ViewCopy 原地写回。实测 int8 x=[-2..2] clip=1000：输出全 -24（期望原值）；clip=-200：输出原样（期望全 -200）；uint8 clip=300 输出 0,44,44；int16 clip=100000 输出 -31072。aclnnInplaceClampMax 同根因且直接覆盖调用方输入缓冲。资料参数表允许 clipValueMax 为 INT32/INT64 与 INT8/UINT8/INT16 的 self 组合（文档声明支持形态，非非法入参）。PyTorch 对照 torch.clamp_max(int8,1000) 直接 RuntimeError。issue open（2026-10-23）无修复 MR；同源 #3850 跟踪原地入口。无训练框架受害报告。'
  source: https://gitcode.com/cann/ops-math/issues/3849 ｜同源原地入口：https://gitcode.com/cann/ops-math/issues/3850
  behavior: 对整型张量做 clamp_max 且上界标量超出该 dtype 表示范围（如 int8 传 1000）时，NPU 不报错，把标量按位截断成另一个小数（1000 变 -24）再当下界用：正向越界时整块输出被改写成同一个错值，反向越界（-200）时本应全表压到 -200 的调用原样返回输入，语义完全相反；原地版本还会把输入数据直接覆盖掉，返回值依然成功。
  discovery: 2026-10-24 每日扫描
