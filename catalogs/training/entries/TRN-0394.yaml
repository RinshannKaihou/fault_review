title: aclnnClampMax 标量越界按位环绕静默改写输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnClampMax 标量类型转换
  behavior: A2 分支 promoteType 直接取 out dtype，标量转换无范围校验无饱和：整数越界按补码截断（1000→-24），「上界」变小负数后 min(x,max) 静默算成另一结果；原地入口直接改写入参缓冲。
effect:
  objects:
  - 数值结果
  detail: int8 上界 1000 时全表输出 -24（期望原值）；反向 -200 时原样返回输入（期望全 -200），语义完全相反；uint8 300 时输出 0,44,44；原地入口把调用方输入数据直接覆盖，无法从返回值或输出察觉。PyTorch 同类调用直接 RuntimeError 拒绝。
  visibility: 静默错误
mitigation:
  detect: 调用前校验标量在目标 dtype 可表示范围；对拍 CPU clamp 语义。
  fix: 待定（issue open 2026-10-23，根因定位至 conversion/clip_by_value_v2/op_api/aclnn_clamp.cpp:345-362 A2 分支，master efff3523 在位）
