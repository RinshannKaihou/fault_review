  meta: 'stage: `rl` · Cov: `var:grpo_group_std_zero` · 置信度 `documented`'
  mechanism: '即使实现防了除零，全对/全错组对 GRPO 仍是零对比。DAPO dynamic sampling 的动机。过滤侧也有静默面（2026-08-21 补）：OpenRLHF #1310——dynamic filtering 在 prompt loader 耗尽后拒绝一个组时，`SamplesGenerator._generate_vllm()` 直接返回空列表，**把已累积的 accepted_experiences 整批丢弃**并 cancel 全部 pending refs（含已生成完、本会被接受的组）；shipped DAPO/REINFORCE recipe 开着该过滤，小数据集上唯一一个生成 batch 可被清空 → 0 次 optimizer update，run 仍「正常」走完。'
  source: 'DAPO dynamic sampling；TRL / OpenRLHF 过滤开关；OpenRLHF #1310（shipped DAPO recipe 数值推演：20000%128==32 的末批含过滤组的概率可观）。https://github.com/OpenRLHF/OpenRLHF/issues/1310'
  behavior: 有效 batch 比名义 batch 小很多，进度虚标。
  discovery: 2026-08-17 基础调研
