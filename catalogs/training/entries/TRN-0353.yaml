- url: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1841
  kind: gitcode_issue
relations: []
original:
  mechanism: MindSpeed-LLM master（openEuler + 910C + CANN 9.1.0）跑 glm5.2 SFT，脚本开 --mtp-num-layers 1 --mtp-loss-scaling-factor 0.3。日志显示 MTP block 确实建起来了（transformer block 20.95B、mtp block 2.62B、embedding 1.90B），但训练日志里只有 lm loss 与 global_load_balancing_loss，没有 mtp_1 loss。定位到 mindspeed_llm/core/transformer/multi_token_prediction.py：self.training 分支调用 MTPLossLoggingHelper.save_loss_to_tracker(torch.sum(mtp_loss)/num_tokens, layer_number, self.config.mtp_num_layers, avg_group=get_tensor_and_data_parallel_group(with_context_parallel=True))，该 micro-batch 里 num_tokens 为 0，除法得到 NaN，NaN 被写进 tracker 后日志侧不再能把 mtp_1 loss 打出来。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1841（closed；环境 MindSpeed-LLM master + 910C + CANN 9.1.0，日志与源码定位在正文）
  behavior: glm5.2 SFT 打开 MTP 后，日志里参数统计显示 mtp block 已经建好，但每行 iteration 只剩 lm loss 和 global_load_balancing_loss，mtp_1 loss 这个字段完全不出现；loss scale、grad norm、num zeros、nan iterations 都是正常值，没有 NaN 报错。也就是说训练看起来一切正常，只有 MTP 层的 loss 监控静默丢了。
  discovery: 2026-10-21 每日扫描
