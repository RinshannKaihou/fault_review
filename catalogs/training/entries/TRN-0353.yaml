id: TRN-0353
legacy_ids: []
slug: msllm_mtp_loss_num_tokens_zero_nan
aliases: []
title: MTP num_tokens 为 0 致 mtp_1 loss 成 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: mindspeed-llm
    component: MTP loss tracker
  behavior: multi_token_prediction.py 用 sum(mtp_loss)/num_tokens 存 loss tracker，num_tokens 为 0 时结果成 NaN 被静默写进 tracker。
effect:
  objects:
  - 指标/日志
  - 训练信号
  detail: glm5.2 SFT 开 --mtp-num-layers 1 后日志只剩 lm loss 与 global_load_balancing_loss，mtp_1 loss 字段整个消失（值为 NaN）；主 loss 看起来正常，MTP 层是否在学无法从日志判断。
  visibility: 静默错误
mitigation:
  detect: 检查日志是否打印 mtp_1 loss；或直接在 MTPLossLoggingHelper.save_loss_to_tracker 入口断言 num_tokens>0
  fix: 'issue #1841（closed）只指出 num_tokens=0 这一处，正文未附修复 PR，未核实'
