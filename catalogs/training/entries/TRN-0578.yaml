  detail: 分组 MoE 路由时 moeExpertIndices 形状与官方 example 不一致：第一维错位、第二维出现不该出现的元素；k 取非 4 的值或局部专家数超过 256（a6 之前的硬编码上限）时路由输出静默错乱，无报错无异常，下游专家分派直接用错值。
