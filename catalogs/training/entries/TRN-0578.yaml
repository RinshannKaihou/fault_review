  mechanism: cann/ops-transformer !15096（2026-10-31 open，a6 支持k=16以及局部2048专家;修复b4透传以及原有局部专家校验的bug）。该修复 MR 描述确认了修复前的缺陷：其一，MoeGroupedTopK 的 moeExpertIndices 输出形状/layout 不符合官方 example 约定，第一维错位且第二维含无效元素，其中分组 TopK 的『完整前缀和滤波』代码路径仅覆盖 k=4 的特例场景，走 GTS（grouped topk selection）分支时绕过该滤波导致无效元素残留；其二，原有局部专家数校验存在 bug 且 b4 透传有缺陷，a6 之前局部专家数被硬编码限制为 256。缺陷影响所有非 k=4 或局部专家数超限的分组 MoE 配置。修复 MR 同时把 a6 的 k 支持扩到 16、局部专家扩到 2048。证据等级：上游修复 MR 自述（未附独立 issue 数值），未见官方 example 对拍数值；发布状态未知。
