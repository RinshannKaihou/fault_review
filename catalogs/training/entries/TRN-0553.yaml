original:
  mechanism: 'cann/ops-nn #7756 + #7757（2026-10-30，Atlas A2 910B3、CANN 9.2.0、master 59c0720c）：aclnnSquaredRelu 的 GetWorkspaceSize 不校验 out 与 input 的 shape 一致，也不拒绝非连续 out。#7756：input=fp32[4x8]、out=fp32[4x4]（16 元素）时两段返回 0、内核写 32 元素越界 16 个（out=[1x8] 时越界 24）；#7757：out shape [2,4]、strides [8,1]（storage [2,8]）返回 0、内核按连续写 8 元素，按 out 逻辑 stride 读回第二行 4 元素仍是初始化哨兵。资料参数表 out 要求「与输入 shape/格式一致」且非连续标 ×。两 issue 均含完整 C++ 复现与对照表。同族：TRN-0524（GeluMul 非连续 out 错写）、#7654/#7647（越界写，INF-2261 覆盖）、#7760（SwiGlu 偏小 out 越界写 64B）。'
  source: https://gitcode.com/cann/ops-nn/issues/7756 + https://gitcode.com/cann/ops-nn/issues/7757
  behavior: NPU 上把偏小或非连续的张量作为 SquaredRelu 的 out 参数（转置/切片视图、预估形状偏小）：接口返回成功，但要么越界写破坏相邻显存（实测越界 16~24 元素）、要么按连续布局写导致逻辑视图一半元素根本没更新（保持旧值）——下游拿到错值或旧值，无报错，sanitizer/对拍才能发现。
  trigger_surface: CANN aclnnSquaredRelu + out shape 偏小或非连续 strides；910B3/CANN 9.2.0/master 59c0720c
