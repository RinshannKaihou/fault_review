original:
  mechanism: 'Ascend/pytorch #5744（2026-10-30，open）：torch_npu/npu/__init__.py 的 _lazy_call() 先检查 _initialized 再决定直接执行或追加 _queued_calls，检查与追加不和 _lazy_init() 共用 _initialization_lock。竞态时序：初始化线程持锁完成 _queued_calls 遍历 → 另一线程调 _lazy_call（_initialized 仍为 False）→ 回调追加进已遍历完的队列 → 初始化线程置位 _initialized 退出 → 该回调永不消费。manual_seed()/set_rng_state() 经 _lazy_call 延迟执行，多线程首次初始化场景下随机种子/RNG 状态可被静默丢失。issue 给出持锁模拟复现脚本（worker 调 _lazy_call 后 callback_ran 不置位、队列长度为 1）。与 NPU 型号/CANN 版本无关。'
  source: https://gitcode.com/Ascend/pytorch/issues/5744
  behavior: torch_npu 多线程环境（dataloader worker、训练/生成线程并发）触发 NPU 首次初始化时，恰在初始化收尾阶段调用的 npu.manual_seed()/set_rng_state() 等延迟接口可能被静默丢弃：种子没生效但无任何报错，后续采样、数据 shuffle、初始化全部偏离预期且两次运行不可复现，只能靠两次采样对比才能察觉。
  trigger_surface: torch_npu master npu/__init__.py；多线程首次 NPU 初始化窗口 + _lazy_call 排队的回调（manual_seed/set_rng_state 等）
  discovery: 2026-10-31 每日扫描
