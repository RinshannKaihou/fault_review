id: TRN-0546
legacy_ids: []
slug: torch_npu_lazy_call_race_drops_callbacks
aliases: []
title: torch_npu _lazy_call 竞态静默丢回调
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: npu._lazy_call 初始化队列
  behavior: _lazy_call 先查 _initialized 再入队，与 _lazy_init 不共用 _initialization_lock：初始化线程遍历完队列后、置位前，另一线程回调被追加进已消费队列，此后无人消费
effect:
  objects:
  - 训练样本流
  detail: manual_seed/set_rng_state 等经 _lazy_call 延迟执行：多线程首次初始化并发时随机种子或 RNG 状态设置被静默丢失，数据顺序/初始化偏离预期且不可复现；持有初始化锁的模拟复现可稳定构造
  visibility: 不可复现
mitigation:
  detect: 初始化后断言 _queued_calls 为空；对 seed 生效性做两次采样一致性检查
  fix: 待定（issue open：建议 _lazy_call 与 _lazy_init 共用 _initialization_lock，重入不死锁）
