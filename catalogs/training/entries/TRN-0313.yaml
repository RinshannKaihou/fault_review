id: TRN-0313
legacy_ids: []
slug: aten_gelu_approximate_attr_ignored_tanh_only
aliases: []
title: torch_npu ATen gelu 静默走 tanh 近似
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: ATen gelu 分发
  behavior: ATen gelu 分发到无 approximate 参数的 tanh-only aclnnGelu，未按 'none' 路由到带 attr 的 aclnnGeluV2；正确的 erf 路径已在 CANN 包内存在但未被选用。
effect:
  objects:
  - 数值结果
  detail: F.gelu(none) 与 F.gelu(tanh) 在 NPU 逐位相同；4096 点 fp32 统计 |NPU(none)−CPU_erf|max=4.735e-4（vs CPU_tanh 仅 2.9e-7 噪声级）；fp16/bf16 同样按 tanh 式计算；无任何告警
  visibility: 静默错误
mitigation:
  detect: 对比 F.gelu(x, approximate='none') 与 F.gelu(x, approximate='tanh') 是否逐位相同（相同即中招）；x=2.0 处 erf 期望 1.9544998
  fix: 用户侧 workaround 已核实：torch_npu.npu_gelu(x, approximate='none') 走正确 erf 路径（vs CPU erf 4.8e-7）；根治=ATen gelu 分发按 approximate 路由到 aclnnGeluV2 TPL_NONE（未实施，闭源二进制分发无法直接落 PR）
