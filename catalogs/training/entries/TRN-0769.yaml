original:
  mechanism: 'pytorch/torchtitan #6093（2026-11-13，open）。torchtitan/models/common/attention/attention.py 的 FlexInnerAttention._compiled_flex_attn 调 torch.compile(flex_attention, ...) 时没有指定 dynamic，Dynamo 默认 automatic_dynamic_shapes 让首调用编译静态 shape kernel、首次 shape 变化再重编译为动态；某一步用哪个 kernel 取决于进程此前见过的 shape。resume 进程从零编译，因此同一步可能与不中断 run 用不同 kernel。复现：Qwen3.8-Flash-Next multimodal debug 模型（#6046），GB300×2、FSDP2/EP2、seed 42、严格确定性、vision image size 随 step 变化；两次不中断 10 步逐位一致；从 step5 checkpoint resume 后 step8 前一致、step9 起 loss 差至 9.9e-4、grad_norm 差 6.3e-3；两次 resume 彼此逐位一致。设 torch._dynamo.config.automatic_dynamic_shapes=False 后，save run（1-5）与 resume run（6-10）都与不中断 run 逐位一致。'
  source: https://github.com/pytorch/torchtitan/issues/6093
  behavior: 训练带可变输入 shape 的模型（VLM vision encoder、qwen3_5、Muse、Flash-Next 等）时，从 checkpoint 恢复的训练在若干步后与不中断训练分叉：loss 最多差约 1e-3、grad_norm 差约 6e-3，且两次 resume 彼此一致，看起来像正常噪声。严格确定性下也无法 bitwise 复现，排查会误以为是数据或并行不确定性；只有固定 dynamic 或关掉 automatic_dynamic_shapes 才对齐。
  trigger_surface: torchtitan FlexAttention + torch.compile 默认 automatic_dynamic_shapes + 变长输入 shape；GB300×2 / FSDP2 EP2 实测。
  discovery: 2026-11-16 每日扫描
