id: TRN-0769
legacy_ids: []
slug: torchtitan_flexattention_compile_history_resume_nondeterminism
aliases: []
title: FlexAttention 编译历史使 resume 与非中断训练不逐位一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torchtitan
    component: FlexAttention 编译
  behavior: torch.compile 未固定 dynamic，首个 shape 决定静态 kernel、变 shape 再重编译；resume 进程无编译历史，同一步可能用不同 kernel。
effect:
  objects:
  - 训练轨迹
  detail: Qwen3.8-Flash-Next、GB300×2、FSDP2/EP2、seed 42：不中断 10 步逐位一致；step5 resume 后 step9 起 loss 差至 9.9e-4、grad_norm 差 6.3e-3；两次 resume 彼此一致。
  visibility: 不可复现
mitigation:
  detect: resume run 与不中断 run 逐步对比 loss/grad_norm；固定 torch._dynamo.config.automatic_dynamic_shapes=False 复测。
  fix: 待定（issue open 2026-11-13；建议 dynamic=True/False 或显式标记动态维，未实现）
