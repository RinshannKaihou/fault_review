  meta: 'stage: `shared` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 'torchtitan `WandBLogger.log` 调 `wandb.log(metrics, step=N, commit=True)`——每次 log 即刻提交该 step 行；行一旦提交，W&B **丢弃后续对同一 step 的所有 log**。验证指标在训练之后 log 到同一 step：默认 `log_freq=10` + validator `freq=10` 时**每一次核心验证都被丢弃**；RL 的 post-training 验证 log 在最后一个训练 step、同样被吞。修复（PR #5227）= logger 按 step 累积进同一行、显式 `commit()` 由 trainer 在验证后触发。'
  source: 'torchtitan PR #5227（2026-10-09；从离线 `.wandb` 文件回读验证：main 上 `validation_metrics/*` 全缺、修复后 1/5/10 step 全部并列出现；W&B 0.28.1）。https://github.com/pytorch/torchtitan/pull/5227'
  behavior: 无 crash、无 warning——**全部验证指标从未到达 W&B**：用户看到的 validation 面板是空的或停在旧 run，训练侧认为「验证跑了但没日志」，与 OBS.02（空指标当健康）互补：那边指标文件空、这边指标被上游丢弃；与 OBS.13（grad_norm 算出即丢）同族「**观测值在产出点与消费点之间被静默丢弃**」。监控完整性缺口而非训练正确性，归 OBS。截至 2026-10-10 open（1/2 系列）。
  discovery: 2026-10-10 每日扫描
