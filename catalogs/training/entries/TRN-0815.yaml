id: TRN-0815
legacy_ids: []
slug: trl_grpo_resume_buffer_slice_replay
aliases: []
title: GRPO resume 重放已用过的 buffer 切片
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: GRPOTrainer buffer 索引
  behavior: _step 只在 training_step 中递增，resume 时未恢复；generation buffer 不保存，重建后按 self._step % steps_per_generation 从 slice 0 开始读。
effect:
  objects:
  - 训练样本流
  - 训练轨迹
  detail: save_steps 不是 generation interval 整数倍时，续跑不报错、step 数和 loss 正常，但 step 2/3 重训已用 slice 0/1，第二次生成的 slice 2/3 不被使用，同一 prompt 重复训练、部分 prompt 被跳过。
  visibility: 静默错误
mitigation:
  detect: 记录每个 global_step 实际训练的 buffer slice 与 prompt id，续跑后与不间断 run 的调度逐 step 对比
  fix: '待定（#8552 于 2026-11-26 作为 #7787 的重复关闭；修复补丁在 #7787 跟踪，未合并）'
