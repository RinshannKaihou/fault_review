original:
  mechanism: 'cann/ops-transformer !14683（open，2026-10-27，fix(prompt_flash_attention): 310P3 fp16 高性能模式 O 累加溢出改为 FP32）：PromptFlashAttention 在 Ascend 310P3（x910/C220）上 fp16 + HighPerformance 模式下 O 累加溢出——未归一化加权和超过 FP16 上限 65504 时溢出为 +Inf。根因：fp16+HighPerformance 下 mmOutputType/computeType 为 half，O 累加在 position 1871 时 1872×35=65520 超上限。修复：新增 oAccType（非 MSD 且 T==half 时为 float，否则 mmOutputType）；O 累加迁到 FP32 独立缓冲（oAccBuff_/oAccTmpF_），补两处 seed 与输出 cast；tiling 两处 UB 预算新增 oAccBufferSize/oAccTmpFSize。涉及 arch22 prompt_flash_attention_s1s2_bns1_x910 内核与 tiling。训练侧影响：310P3 上 fp16 训练/微调走 PFA 高性能模式时注意力输出溢出 Inf。'
  source: https://gitcode.com/cann/ops-transformer/merge_requests/14683（open）
  behavior: Ascend 310P3 上 fp16 + HighPerformance 的 PFA 注意力在序列较长（如 1872 位置×幅值 35）时 O 累加溢出为 +Inf，随后归一化把 Inf 扩散成 NaN 或错值；前向与反向都建在被污染的 O 上，训练 loss 出现 NaN 或静默错值，无算子级报错。
  trigger_surface: Ascend 310P3（x910/C220）+ fp16 + HighPerformance；序列累加和 >65504；修复 !14683 前
