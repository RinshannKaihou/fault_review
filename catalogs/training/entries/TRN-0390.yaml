id: TRN-0390
legacy_ids: []
slug: opstransformer_block_sparse_attention_grad_leading_tokens_unwritten
aliases: []
title: BSA-Grad 首 blockShapeX/2 token 梯度未写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BSA-Grad 反向输出搬运
  behavior: BNSD+fp16 下 dq/dk/dv 每个 head 前 blockShapeX/2 个 token 行的梯度从未被写入，输出缓冲保留调用方传入内容；两段接口均返回 0，未写比例恒等于 blockShapeX/256。
effect:
  objects:
  - 梯度
  detail: 稀疏注意力反向后，dq/dk/dv 每 head 头部 6.2%~50% 元素是输出缓冲残留（复用缓冲时为上一张量内容），无报错无 NaN；已写区域与标杆一致，错值集中在未写区间。
  visibility: 静默错误
mitigation:
  detect: 输出缓冲预填互异 canary 两次调用比对；按未写比例=blockShapeX/256 抽查首 token 梯度。
  fix: 待定（issue open 2026-10-23，master e6106909 复现，未见修复 MR）
