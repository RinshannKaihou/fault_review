- url: https://gitcode.com/cann/ops-transformer/issues/6620
  kind: gitcode_issue
relations: []
original:
  mechanism: CANN ops-transformer 的 aclnnBlockSparseAttentionGrad（Atlas A2 910B2、CANN 9.2.0、master e6106909a1930b403c9f47eb9539cfcc2e7fbbf5）在 BNSD 布局 + fp16 下，dq/dk/dv 中每个 head 前 blockShapeX/2 个 token 的梯度从未被写入：实测 B=1,N=2,Sq=Skv=128,D=64,blockShape=[128,128] 时三输出各 8192/16384（50.0%）未写，未写比例严格等于 blockShapeX/256（16/32/64/128 依次 6.2%/12.5%/25%/50%），与 blockShapeY 无关，未写区间为每 head token 行 [0, blockShapeX/2)。两层 aclnn 接口均返回 ret=0。报告者用双 canary（fp16 1.0/2.0 预填两次调用）证明元素从未被写（非算出同值），A/B/A 交替对照比例不变、剔除未写元素后剩余已写元素与标杆 dS=P*(dOut@V^T-softmax_grad) 等公式错误数为 0，即纯漏写而非精度问题。与 TRN-0273（dsink 工作区未清零）同为 FA 反向输出完整性缺陷但机制不同（本条是输出区间搬运缺失）。无训练框架受害报告，缺陷以 C++ 两段式直调实测证实。
  source: https://gitcode.com/cann/ops-transformer/issues/6620
  behavior: 在 Ascend A2 上训练带块稀疏注意力的模型并调用 BlockSparseAttentionGrad 反向（BNSD、fp16）后，dq/dk/dv 每个 head 开头一段 token 的梯度值既不是算出来的结果也不是零，而是输出缓冲里上一次遗留的内容；blockShapeX 越大缺失越多（128 时一半梯度是残留值），接口不报错、无 NaN，loss 与梯度范数无立即异常，权重在不知情下被脏梯度更新。
  discovery: 2026-10-24 每日扫描
