slug: mindspeed_llm_alpaca_ranking_rejected_index_asymmetry
aliases: []
title: alpaca 偏好数据 rejected 取 [1] 致偏好对错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspeed-llm
    component: alpaca ranking 分支
  behavior: ranking=True 且 chosen 列为 list 时，convert_alpaca_to_intermediate 构造 response 时 chosen 取第 0 个元素，rejected 却取第 1 个元素，候选索引不对称。
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: rejected 为单元素 list（偏好数据最常见形态）时必现 IndexError 中断数据处理；多元素时 chosen[0] 与 rejected[1] 配对错位，DPO/SimPO 训练的是错误偏好对，无报错。
  visibility: 静默错误
mitigation:
  detect: 处理 ranking 数据后抽查若干样本的 chosen/rejected 内容是否成对；对 rejected 单元素 list 做一次试处理。
  fix: issue 给出改法：把 rejected 的 [1] 改为 [0]，并像 sharegpt 分支那样在取索引前对 list 类型做防御性检查；issue 已 closed，正文未给出合入 PR（未核实）。
