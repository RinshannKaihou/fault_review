id: TRN-0399
legacy_ids: []
slug: verl_agent_loop_prompt_cap_ignores_truncation_policy
aliases: []
title: verl agent loop 忽略 truncation 策略截头
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: verl
    component: AgentLoop prompt cap
  behavior: agent_loop 共享 prompt cap 对超长文本 prompt 无条件左截断，data.truncation 配置完全不生效；#4759 移除策略执行后未迁入 agent loop，无条件 cap 由 caf9fee 引入。
effect:
  objects:
  - 输入编码
  - 训练样本流
  detail: 配置 error 的用户预期报错拒绝，实际静默左截断：system prompt/头部指令被丢弃、训练在残缺 prompt 上进行；CPU 可复现（4 种策略输出全相同 [6,7,8,9]），agent-loop 文本 prompt 路径（SingleTurn/ToolAgentLoop）。
  visibility: 静默错误
mitigation:
  detect: 对 max_prompt_length 边界样本断言截断方向与配置一致；训练前 dump 首个 batch prompt 首部核对 system prompt。
  fix: '待定（issue open 2026-10-19，verl 0.10.0.dev 4b26c78；关联 #4600 针对旧 tokenization 路径，未覆盖 agent loop）'
