title: Ascend 950 AddRmsNorm 先乘 gamma 致 FP32 溢出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: AddRmsNorm trans 模板乘法顺序
  behavior: Ascend 950 regbase 的 AddRmsNorm/InplaceAddRmsNorm trans 模板按 (x1+x2)*gamma*rstd 计算，先乘 gamma 可使 FP32 中间结果提前超范围，输出 Inf。
effect:
  objects:
  - 数值结果
  detail: 输入与 gamma 均有限、归一化结果也应有限时输出 Inf：x1=2^32、gamma=2^100 期望 2^100 实得 Inf；24 条 trans 溢出用例修复前全 FAIL、修复后全 PASS。
  visibility: 数值异常
mitigation:
  detect: 对 AddRmsNorm 输出做有限性抽检；固定输入回归用例（x1=2^32、gamma=2^100）。
  fix: 修复 MR !11953（open 未合入）：先以 FP32 计算 xSum*rstd 再乘 gamma，两次乘法间不转回低精度；两个算子 arch35 ST CSV 各加一条固定输入回归用例。https://gitcode.com/cann/ops-nn/merge_requests/11953
