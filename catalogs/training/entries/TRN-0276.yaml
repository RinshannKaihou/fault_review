original:
  mechanism: CANN ops-nn 的 Ascend 950/regbase AddRmsNorm trans 模板按 (x1+x2)*gamma*rstd 顺序计算（InplaceAddRmsNorm 共用该模板）：当 x1+x2 与 gamma 均有限、归一化结果也应有限时，先乘 gamma 的 FP32 中间积（如 xSum*gamma=2^132）超过 FP32 有限范围，输出 y 为 Inf。环境：Ascend 950PR_9579、CANN 9.2.0、Python 3.12.9、ops-nn master 6a974e237、TTK kernel Promote 默认精度门限。修复 MR !11953 调整两次乘法顺序（先 xSum*rstd 再乘 gamma），同输入、分别加载基线与修复后 vendor 二进制的上板冒烟：24 条 FP32/BF16 trans 溢出用例 FAIL→PASS，其余 30 条不变（2 条失败为未改动的 full-load/SplitD FP16 近零精度问题，主线同样复现）；4024 条完整测试当时仍在跑，未宣称全量通过。
  source: https://gitcode.com/cann/ops-nn/issues/6679 ；修复：https://gitcode.com/cann/ops-nn/merge_requests/11953
  behavior: Ascend 950 上 AddRmsNorm/InplaceAddRmsNorm（trans 模板、tilingKey=4000）对有限值输入输出 Inf：FP32 ND、x1.shape=x2.shape=[28673,1]、gamma=[1]、x1=2^32、gamma=2^100 时期望有限值 2^100、实得 Inf；RMSNorm 是 Transformer 训练标配算子，中间激活 Inf 会向下游传播。
  discovery: 2026-10-15 每日扫描
