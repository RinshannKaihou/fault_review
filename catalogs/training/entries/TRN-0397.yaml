  objects:
  - subsystem: 量化
    stack: cann
    component: AddRmsNormQuant V1/V2 数值
  behavior: PERF 路径大 epsilon 下 Newton-Raphson 中间倒数下溢，应非零的归一化结果变 0；有限大数输入因加法/平方或 norm*gamma 中间溢出产出错误量化结果。
effect:
  objects:
  - 数值结果
  detail: 大 epsilon（如 FLT_MAX）时 y1/resOut 为 0（参考 5/5.421）；x1=1e20 级输入量化输出 0 或错值；dst_type int64 属性按 int32 读取、rstd 32B 缓冲区按每核行号索引越界等多重缺陷并存。
  visibility: 静默错误
