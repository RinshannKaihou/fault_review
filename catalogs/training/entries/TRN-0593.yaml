original:
  mechanism: deepspeedai/DeepSpeed !8973（2026-11-01 open PR，自带最小数值复现）。offload_optimizer.ratio<1 时 ZeRO-3 把部分子组留在设备上、用独立 torch optimizer（backup_optimizer）步进，该 optimizer 有多项改变训练结果而不报错的缺陷：1) 设备子组忽略 LR 调度与 set_lr() 及 betas/eps/weight_decay 变更——首步 lr=0 时权重仍移动 3.0e-3；2) checkpoint 不含设备子组 Adam 状态——resume 一步后偏 4.9e-3；3) checkpoint 加载后每个设备步同时更新 param group 1+ 的 CPU 子组（dict 与主 optimizer 共享）——lr 3e-3 时每步多 3.0e-3；4) safe_get/set_full_optimizer_state 与 ds_to_universal 对设备子组 KeyError；5) adam_w_mode=false 时设备子组用解耦 weight decay——4 步后偏 2.4e-2。SuperOffload 用同一 optimizer 管理设备子组。修复 PR 逐项修复并声明 resume bit-identical、跨 ratio 加载一致。
  source: deepspeedai/DeepSpeed 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8973（open，未合入）
  behavior: ZeRO-3 开 offload_optimizer.ratio<1（部分参数留在 GPU）时，训练全程无报错但结果是错的：学习率调度对留在设备上的参数不生效（lr=0 首步权重仍动 3e-3）、断点恢复后偏差 4.9e-3 起步、每步还额外多更新一次 CPU 上的参数组、关 adam_w_mode 时 weight decay 语义用反（4 步偏 2.4e-2）。loss 曲线看不出明显异常，只有与连续运行对拍才能发现。
  discovery: 2026-11-02 每日扫描
