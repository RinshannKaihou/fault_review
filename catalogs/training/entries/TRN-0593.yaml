id: TRN-0593
legacy_ids: []
slug: deepspeed_zero_partial_offload_backup_optimizer
aliases: []
title: ZeRO-3 部分卸载设备子组优化器五项静默错误
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: deepspeed
    component: backup_optimizer 设备子组
  behavior: ratio<1时设备子组由独立torch优化器步进：忽略LR调度与超参变更、ckpt不含设备子组Adam状态、ckpt加载后param group共享致设备步多更新CPU子组、关adam_w_mode时用解耦weight decay
effect:
  objects:
  - 模型权重
  - 优化器状态
  - 训练轨迹
  detail: 无报错改变训练结果：首步 lr=0 权重仍移动 3.0e-3、resume 一步后偏 4.9e-3、每步多更新 3.0e-3、4 步偏 2.4e-2
  visibility: 静默错误
mitigation:
  detect: ratio<1 时对设备子组核对 lr/超参是否随调度生效；resume 后与连续运行对拍
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8973（open，未合入）：每步前拷贝超参、保存设备子组 Adam 状态、param group 独立 dict、改用 torch.optim.Adam 语义（未核实合入）
