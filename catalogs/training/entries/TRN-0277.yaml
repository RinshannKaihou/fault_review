title: AllGather Recursive HD 非 2 次幂接收偏移读错 peer
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: AllGather Recursive HD 偶数
  behavior: GatherInPartOneToEven 偶数接收分支用本端 rank 而非 peerRank 计算接收切片与远端读取偏移；TransportP2p 接收端发起读时读错 peer 的输出切片并覆盖本端自己的切片。
effect:
  objects:
  - 数值结果
  detail: Recursive HD、非 2 次幂 rank 数（3/5/6/7）、接收端发起读的 P2P/HCCS 链路时 AllGather 输出数据缺失或来源错误；RoCE 路径因发送端写正确切片而掩盖。修复前 HCCS 8 个组合全报内存语义错误。
  visibility: 静默错误
mitigation:
  detect: 仓库 ST 算法检查器（Checker::Check 内存/数据来源语义校验，DEV_TYPE_910B）；AllGather 结果与参考布局对账。
  fix: 修复 MR !6017/!6018（open）：偶数接收分支三处 rank→peerRank（本端接收切片、日志偏移、ExecuteRxSync 远端源偏移），并补 HCCS/RoCE ST 回归。https://gitcode.com/cann/hcomm/merge_requests/6017
