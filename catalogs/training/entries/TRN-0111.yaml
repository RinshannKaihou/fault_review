  mechanism: 'DeepSpeed 的 Muon 实现只在 flat/ZeRO 分片参数路径上接 Newton-Schulz；**ZeRO stage 0（默认）** 下参数原样 2-D 交给优化器、不进该路径，NS 从不执行——最朴素配置 `Muon()` + ZeRO-0 声明的是 Muon、实际训练的是 SGD（动量化）+ 缩放。无「不支持」报错、无回退日志。09-07 曾以「未支持配置的静默回退（CKPT.06/07 族）」暂缓；作者随后自纠「形状无法区分已更新/未更新」的错误论断——`FP16_UnfusedOptimizer` 保留逐参数 fp32 克隆（ndims=2），flat ZeRO 分片恒 1-D，形状可判——修复 PR #8442 已在 non-flat 分支执行 NS（stage 0 fp32 与 stage 1 更新一致，`max|w−SGD|=9.772e-02`），确认为实现 bug 而非设计边界。'
  source: 'DeepSpeed #8441 + 作者自纠评论 + 修复 PR #8442。https://github.com/deepspeedai/DeepSpeed/issues/8441'
  behavior: 无 crash；loss 照降（SGD 也能训），但用户以为在跑 Muon 的 run 自 step 1 起整个优化算法被替换——正交化带来的收益/动力学全部缺失，对照实验的「Muon vs Adam」结论实际是「SGD vs Adam」。与 OPT.10（更新频率错）/OPT.08（矩阵语义错）构成 Muon 契约破坏三面：这边错在**算法本体是否执行**；「配置声明 ≠ 执行行为」与 CKPT.06/07 家族同型。
  discovery: 2026-09-08 每日扫描
