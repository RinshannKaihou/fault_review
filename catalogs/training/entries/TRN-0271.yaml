title: IndexPutV2 大 stride 偏移 uint32 溢出写错地址
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: IndexPutV2 偏移计算整型宽度
  behavior: 非连续（大 stride）目标张量上索引偏移以 uint32 计算：idx×stride ≥ 2^32 时回绕，写入落到 (idx×stride) mod 2^32 的错误地址。
effect:
  objects:
  - 数值结果
  detail: Ascend 950DT、CANN 9.2.0：uint8 大张量切片视图（stride(0)=228352 > size(1)=16896）view[18816]=0x5A，期望写行 18816，实际写在行 7/偏移 105472；数据布局静默破坏，无报错。
  visibility: 静默错误
mitigation:
  detect: 写入后读回校验目标位置；触发条件为非连续大张量 + 越界乘积超 2^32，可静态排查 stride×max_idx。
  fix: 待定（issue 未附修复 MR，未核实）
