original:
  mechanism: 'cann/ops-nn issue #6523（2026-10-12，open；CANN 9.2.0、Ascend 950DT）：IndexPutV2 在非连续目标张量（大 stride）上计算写入偏移时使用 uint32 整型：t=[20000,228352] uint8（4.57GB）、view=t[:,:16896]（stride(0)=228352>size(1)=16896）、idx=18816 时 18816×228352=4.30e9>2^32，偏移回绕为 (idx×stride) mod 2^32，写入落在行 7/偏移 105472 而非行 18816（实测 (t==0x5A).any(1).nonzero() 返回 [7]）。期望行为：max(idx)×stride ≥ 2^32 时走 64 位偏移。与 TRN-0147（DeepSpeed Triton int32 偏移回绕为负致越界读写）同机制「偏移算术整型宽度不足回绕→越界/错址访问」，不同栈与算子：本条是 CANN aclnn IndexPutV2 kernel，彼条是 DeepSpeed Triton kernel。'
  source: https://gitcode.com/cann/ops-nn/issues/6523
  behavior: NPU 上对非连续大张量（stride 超过 2^32/max_idx）执行 index_put 类写入时，写入位置被 uint32 回绕算错：目标行未写入、错误位置被污染，全程无报错；训练数据/标签就地构造（如 scatter 写 label、mask）场景下静默破坏数据布局。
  discovery: 2026-10-15 每日扫描
  notes:
  - '2026-10-16 回访 2026-10-16：来源 issue #6523 已 closed（2026-10-15 批次快照）；修复 MR 状态未在批次内确认（issue 正文未附），fix 仍待定。'
