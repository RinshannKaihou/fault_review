original:
  mechanism: 'verl MultiTurnSFTDataset 的 loss mask 探针与逐消息渲染使用不同口径。初始化时（main@2026-10-14，verl/utils/dataset/multiturn_sft_dataset.py:180-182）：self.system_prompt, self.generation_prompt = extract_system_prompt_and_generation(self.tokenizer, **self.apply_chat_template_kwargs)——只透传 apply_chat_template_kwargs，不传 enable_thinking_default。而 _process_single_message（同文件 210-212 行）把 dataset 级 enable_thinking（列缺省时取 enable_thinking_default）注入 apply_chat_template_kwargs 再渲染。assistant turn 的 loss_mask = ones 后 loss_mask[: len(self.generation_prompt)] = 0（231-237 行）。当用户显式设 data.enable_thinking_default=false/true 且模板在 thinking on/off 下前缀 token 数不同（如 Qwen3 式模板 <think> 块前缀），探针测得的 generation_prompt 长度对应模板内置默认，与实际渲染前缀长度错位：若实际前缀更长，多出的模板 token 未被 mask、被当 assistant 内容训练；若更短，部分 assistant 内容被误 mask 丢梯度。PR #8086（2026-10-09 merge）描述了该第二处修复（描述原文：extract_system_prompt_and_generation now receives enable_thinking_default via apply_chat_template_kwargs），但该 PR 最终 merge 的 diff 仅含 sft_trainer_engine.yaml 的 enable_thinking_default: none→null 一行——描述中的代码修复未进 main（本扫描核对 main 源码 180-182 行确认参数仍未传递）。PR #8086 同时修了 bug 1：YAML 默认值字符串 ''none'' 经 bool(''none'')=True 隐式开启 thinking——该部分已落地。'
  source: 'verl PR #8086（merged 2026-10-09；描述含两处修复，merge diff 仅 YAML 一行；代码残留核对：main verl/utils/dataset/multiturn_sft_dataset.py:180-182）。https://github.com/verl-project/verl/pull/8086 ；上轮疑点来源：评审者 ZhiliangWu 2026-10-09 指出第二处改动可能给 Qwen3 式模板引入新 loss-mask bug（见 daily/reports/2026-10-12.md 轮巡记录）'
  behavior: 多轮 SFT 数据集 + 显式 enable_thinking_default（false 或 true）+ 模板两种模式 generation prompt 长度不同时：训练无报错、loss 正常，但 assistant turn loss mask 边界错位，模板前缀 token 被计入训练内容（或反向丢失梯度）。默认 enable_thinking_default=None 时探针与渲染一致、不触发。
  discovery: 2026-10-14 每日扫描
