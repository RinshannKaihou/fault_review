id: TRN-0268
legacy_ids: []
slug: loss_mask_probe_ignores_enable_thinking_default
aliases: []
title: verl loss mask 探针不感知 thinking 默认值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: verl
    component: MultiTurnSFTDataset 探针
  behavior: loss mask 探针不接收 enable_thinking_default，按模板内置默认测 generation_prompt 长度，与逐消息渲染的 thinking 模式不一致。
effect:
  objects:
  - 训练样本流
  detail: 显式设 enable_thinking_default 且模板两种模式前缀长度不同时，assistant turn 的模板前缀 token 被误计入 loss（或反向误 mask 丢梯度）；训练无报错、loss 正常。
  visibility: 静默错误
mitigation:
  detect: 对每条样本分别以两种 thinking 设置渲染探针并比对 loss mask 边界 token 是否均被 mask；或核对 loss_mask==1 段首是否含模板控制 token。
  fix: 'PR #8086 描述的第二处修复（extract_system_prompt_and_generation 接收 enable_thinking_default）未进入 merge diff：该 PR 最终只合入 YAML 默认值 none→null 一行（https://github.com/verl-project/verl/pull/8086/files），截至 2026-10-14 main 代码 verl/utils/dataset/multiturn_sft_dataset.py:180-182 仍不传该参数，缺陷仍在 HEAD。'
