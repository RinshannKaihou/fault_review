id: TRN-0604
legacy_ids: []
slug: opsnn_foreach_log1p_small_x_zero
aliases: []
title: ForeachLog1p 极小 |x| 直接返回 0（相对误差 100%）
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnForeachLog1p
  behavior: Log1pAdapter 先 Adds(dst,src,1) 再 Log(dst,src)（别名 buffer），实际算 log(fl(1+x))，|x|<ulp(1)/2 时 fl(1+x)==1 → 输出 0
effect:
  objects:
  - 数值结果
  detail: torch._foreach_log1p 路径：fp32 |x|<6e-8、fp16 |x|<2.4e-4 的输入返回 0（正确值≈x，相对误差 100%），略大输入最高 33% 相对误差；同输入 torch.log1p 正确，两路径不一致；无报错，下游 log 域统计/损失静默偏差。
  visibility: 静默错误
mitigation:
  detect: 极小 |x| 探针（fp32 1e-8 量级、fp16 1e-5 量级）对比 torch.log1p 单算子；相对误差判据（绝对误差被 x~1e-8 掩盖）
  fix: 待定（issue open 无独立修复 PR；正确路径应使用 log1pf 或非别名 buffer，同仓 arch35 SIMT 已用 log1pf）
