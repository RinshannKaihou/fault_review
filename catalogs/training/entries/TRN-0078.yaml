original:
  category: CKPT
  section: CKPT
  meta: 'stage: `pretrain/sft/rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: torchtitan 的 Transformers modeling backend 先在 `meta` 设备建模、再 `to_empty()`，使 rotary 模块的非持久化缓冲区 `inv_freq` 未初始化。旧兼容补丁依赖实例属性 `rope_init_fn` 重新计算，但 Transformers 5.x 已将它移入 `__init__` 局部变量；backend 同时覆写 `_init_weights` 且漏掉 rotary 分支。因此模型初始化与 checkpoint load 都不会恢复正确的 RoPE 频率。
  source: 'torchtitan #4783（2026-09-16；针对当前 5.x 路径的 CPU-only 复现将 `to_empty()` 后缓冲区填为 NaN，执行初始化后仍为 NaN，且与正常构造的 `inv_freq` 不相等；截至 2026-09-24 issue 为 open）。https://github.com/pytorch/torchtitan/issues/4783'
  behavior: 'CPU 复现确认该路径的旋转频率保持错误且无异常；在使用该 backend 的训练中，错误频率会污染位置编码与前向。来源提及旧问题 #3775 的 loss 差异，**不是本条当前版本的端到端训练效果实测**；未评估检测器效果。与 CKPT.25 的 PP 层键错位不同，此处失效的是 `meta` 实例化后的非持久化缓冲区初始化契约。'
  discovery: 2026-09-16 远程扫描回填；2026-09-24 合并复核
  notes:
  - '2026-10-14 回访 2026-10-14：修复 PR #5214 merged（closed 2026-10-13）。PR 附带数值核对：经 init_states 构建的 tiny Llama 与正常构造 LlamaForCausalLM 逐 bit 一致（max diff 0），修复前 max diff 5.6e-4 @ init；#3775 有该失败模式的训练 loss 影响。10-13 曾以「实验后端+未 merge」留观，merge 后按当日计划收编——机制已由 #4783/#5214 闭环，本条直接补修复来源与发布状态；10-13 日报「留观」判定基于修复未落地，现新证据（merge）已闭环。'
