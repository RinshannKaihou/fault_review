title: torchtitan HF 后端 RoPE inv_freq 未初始化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 位置编码
    stack: torchtitan
    component: HF 后端 inv_freq 初始化
  behavior: 在 meta 设备建模后 to_empty()，缓冲区 inv_freq 未初始化；兼容补丁依赖 Transformers 5.x 已移除的 rope_init_fn 属性，覆写的 _init_weights 又漏掉 rotary 分支。
effect:
  objects:
  - 隐状态
  detail: 模型初始化与 checkpoint load 都不恢复正确的 RoPE 频率且无异常；CPU 复现中 to_empty 后填为 NaN 的 inv_freq 初始化后仍为 NaN。错误频率污染位置编码与前向，当前版本的端到端训练影响未实测。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: '修复 PR #5214 已 merge（2026-10-13）：RotaryEmbedding 分支委托 HF PreTrainedModel._init_weights（import 时捕获），删除依赖 rope_init_fn 的死循环；regression 测试 NaN 预填 4/4 red→green；bit-identical logits 对照正常构造模型 max diff 0（main 上 5.6e-4）。https://github.com/pytorch/torchtitan/pull/5214（尚未核实发版）'
