original:
  mechanism: 'cann/ops-nn issue #6482（2026-10-10 closed，PR #11564 merged 修复）：AddRmsNorm 支持普通 3 输出/PreRmsNorm 2 输出/PostRmsNorm 1 输出三模式，Ascend 950（regbase）仅支持普通模式；aclnn 层已有拦截（aclnn_add_rms_norm.cpp:207-211，regbase 上 rstdOut/xOut 空指针报 161101），但 tiling 层 Tiling4AddRmsNorm（add_rms_norm_tiling.cpp:524-525）分派 regbase 路径不校验 norm_key。绕过 aclnn 的调用路径（GE 直构 AddRmsNorm 节点、TTK kernel 直调）传 PRE/POST 形态输出时：1) regbase tiling 未剥离该模式规定的 gamma 前导 1（对照非 regbase 路径 add_rms_norm_tiling.cpp:363-367 有剥离），numRow 少算（x=(B,S,H) 只算 B 行），输出大半未初始化；2) regbase kernel 无条件写 rstd/xOut（add_rms_norm_regbase.h:75-76,116,129），对 0 元素 dummy tensor 越界写。全程不报错。环境：Ascend 950PR、CANN 9.2.0、ops-nn master 67c5de6a9。修复 PR #11564：tiling 层拒绝 PRE/POST 返回 GRAPH_FAILED，新增反例 UT add_rms_norm_regbase_pre_mode_rejected/post_mode_rejected（修复前 SUCCESS 复现缺陷、修复后 GRAPH_FAILED），ophost UT 30/30、opapi UT 18/18、950+910b 定向 CI 全过。aclnn 公开接口与 A2/A3 全链路原生支持三模式不受影响。'
  source: https://gitcode.com/cann/ops-nn/issues/6482 ；修复：https://gitcode.com/cann/ops-nn/pull/11564
  behavior: 950 上通过 TTK kernel 模式或 GE 直构节点构造 PreRmsNorm/PostRmsNorm 形态调用 AddRmsNorm：tiling 正常通过、无报错，输出大半为未初始化内存（numRow 少算），且对 0 元素 rstd 越界写；aclnn 公开接口不触发。
