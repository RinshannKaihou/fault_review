    component: AddRmsNorm tiling 分派校验
  behavior: Ascend 950 regbase 仅支持普通模式，aclnn 层已拦截但 tiling 层分派时不校验 norm_key：绕过 aclnn 的路径（GE 直构/TTK 直调）传 PRE/POST 形态不被拒。
effect:
  objects:
  - 数值结果
  detail: regbase tiling 未剥离 PRE/POST 模式 gamma 前导 1，numRow 少算（(B,S,H) 只算 B 行），输出大半为未初始化内存；kernel 无条件写 rstd/xOut 越界写；全程不报错。aclnn 公开接口与 A2/A3 不受影响。
  visibility: 静默错误
mitigation:
  detect: 'TTK/GE 直调路径下对输出与参考对账；PR #11564 反例 UT（pre/post_mode_rejected）可作探针。'
