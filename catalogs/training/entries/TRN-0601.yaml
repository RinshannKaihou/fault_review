id: TRN-0601
legacy_ids: []
slug: torchnpu_inductor_static_full_reduction_grid_split
aliases: []
title: NPU Inductor 静态完整归约误选 grid split 重复归约
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: ascend
    component: SplitTiling 轴选择
  behavior: 静态完整归约在 fallback 中仍把归约轴选为 grid split；生成内核无 program_id 分区、无跨 program 合并，多 program 重复处理同一数据；归一化 epilogue 复用输入缓冲产生竞争
effect:
  objects:
  - 数值结果
  detail: NPU 上 torch.compile(inductor, dynamic=False) 编译归一化模式时，4 个静态形状 (1,)/(1536,)/(32768,)/(7,1024) 的 split_axis==[] 断言在静态路径失败，数值对照失败；修复后多长度×多种子 9/9 对照通过。
  visibility: 静默错误
mitigation:
  detect: 静态完整归约的 compiled vs eager 数值对照（多长度多种子）；调度层断言 split_axis==[]
  fix: 修复 MR https://gitcode.com/Ascend/pytorch/pull/48919（open）：完整归约保护从动态尺寸扩展到所有完整归约 + test/_inductor/test_full_reduction_split.py 回归
