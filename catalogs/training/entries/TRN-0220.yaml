  mechanism: OpenRLHF 的 k3 KL 估计器在算完指数后对**输出**做 clamp——极端但有限的 log-prob 差先过 `exp` 变成 `inf`，clamp 把返回值拉回有限，但 autograd 图里留着 `exp` 的 NaN 梯度（`0 × inf` 型）：**KL 值有限、backward 产出 NaN**，一次 KL-regularized optimizer 更新即可污染原本有限的参数。修复 = 只在「输出 cap 已饱和」的区间内对**局部 log-ratio 拷贝**先 bound 再 exp（保持被 clip 的目标函数与其正常区梯度不变；原始 log ratio 仍留给可选的 corrected-gradient surrogate）。FP16/BF16/FP32 值/梯度对 float64 参照 + corrected-gradient 覆盖 + CPU AdamW 更新测试全过。
  source: 'OpenRLHF PR #1335（2026-09-11；「返回的 KL clip 后仍有限，但 backward 经 `0*inf` 产生 NaN」）。https://github.com/OpenRLHF/OpenRLHF/pull/1335'
  behavior: 无 crash——KL 指标一切正常（clamp 住了），grad_norm 突然 NaN、参数被污染；触发面是极端 log-prob 差（off-policy 漂移 / rollout-train mismatch 大时更可能），恰好是最需要 KL 惩罚兜底的场景。与 NUM.04（scaler 吞溢出）互补：那边前向溢出被吞、这边**反向** inf 被 forward-side clip 掩盖；与 RL-RO.04（GSPO 比值指数溢出）同根（无界指数），差异在那边直接 inf、这边被 clamp 转成静默 NaN 梯度。
  discovery: 2026-09-12 每日扫描
