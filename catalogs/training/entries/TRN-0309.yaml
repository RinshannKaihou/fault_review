id: TRN-0309
legacy_ids: []
slug: trl_async_opd_rollout_policy_version_mislabel
aliases: []
title: trl Async OPD rollout 样本策略版本错标
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: rollout 版本快照
  behavior: rollout worker 任务入口读一次共享 model_version 盖章样本，发给 vLLM 的模型名 dispatch 时二次活读；期间 trainer 发布新 adapter 时样本被盖旧版本号。
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: 无报错。provenance 错标；staleness 门把刚生成的全新 rollout 当陈旧丢弃（max_staleness=0 时必丢），非零门限下 batching 与 staleness 观测失真。
  visibility: 静默错误
mitigation:
  detect: 对同一 batch 比对样本 model_version 与生成请求 payload 中的模型名版本（两者应恒等）。
  fix: 报告者已备窄修复 fork（在 HTTP 请求构造边界快照版本、用它选 adapter 并随 token 返回），含确定性 CPU 测试：https://github.com/lindicaphxag-tech/trl/tree/fix/async-opd-pin-rollout-sampling-policy-version-20261017 （未合入上游，状态未核实）。
