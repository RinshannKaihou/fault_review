  visibility: 数值异常
mitigation:
  detect: 对激活值大的样本监控梯度 NaN；golden 对拍（golden.py 同样运算顺序会漏检，需修 golden）
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/13091（open）：先形成有界乘积 s*(s-1) 再乘有限 x 和 -1.702，并同步修 golden 与 UT 生成顺序；修复树 96 用例通过（报告者验证）
