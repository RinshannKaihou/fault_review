id: TRN-0763
legacy_ids: []
slug: msswift_packed_gdn_qk_l2norm_missing
aliases: []
title: ms-swift packed GDN 回退漏 Q/K L2 归一化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: ms-swift
    component: MegatronAdaptor GDN 回退
  behavior: MegatronAdaptor 原生 GDN 回退在 packed 路径未执行 use_qk_l2norm_in_kernel 请求的 Q/K L2 归一化，递推输入被改变。
effect:
  objects:
  - 数值结果
  - 隐状态
  - 梯度
  detail: cu_seqlens + use_qk_l2norm=True 时输出与梯度错误；修复后在 FP32 以 eps=1e-6 归一化，四卡 Qwen3.5-35B-A3B LoRA 三步 smoke 与真 FLA 路径 loss MAE 0.00993、最大差 0.01179。
  visibility: 静默错误
mitigation:
  detect: 真 FLA 与 no-FLA 回退两条路径同输入对拍 loss/梯度；检查 packed 路径是否应用 Q/K L2 norm。
  fix: 修复 PR https://github.com/modelscope/ms-swift/pull/10567（open 2026-11-13，未合入）
