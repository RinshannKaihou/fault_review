original:
  mechanism: 'cann/ops-transformer #6812（2026-10-27，Ascend 950PR 单卡、CANN 9.2.0-beta.2、ops-transformer master attention/indexer_quant_cache）：aclnnIndexerQuantCache 未校验 slotMapping 负值。资料声明取值 [-1, num_slots-1]、-1 表示跳过；实测 host/tiling 无值域校验，负值被 kernel 当合法 slot 参与地址计算。C++ 两段式实测：-1 → 0 字节跳过（符合资料）；63 → 128 字节正确；64/65 → 0 字节静默丢弃；-2 → 4 字节踩写 slot 63 行内偏移 120~123；-3 → slot 63 偏移 116~119；-64 → slot 62 偏移 0~3；2^31-1/-2^31 → 507035 aicore 异常。规律：写入位置 = cache 末尾 − |slot|×4 字节，3/3 一致、首错下标固定 8184。同族 aclnnScatterPaKvCache 的同类问题已按缺陷修复（#4093/#5754/#6571/#5994/#5995/#6114），本接口未同步。训练侧影响：DSA/indexer 类注意力的训练前向与 RL rollout 均会写 KV cache，padding/掩码错误产生的 -2 slot 会静默污染其它 token 状态。建议修法：indexer_quant_cache_tiling_arch35.cpp GetShapeAttrsInfoInner 遍历校验 x==-1 || 0<=x<blockNum*blockSize。'
  source: https://gitcode.com/cann/ops-transformer/issues/6812
  behavior: 使用 aclnnIndexerQuantCache 的训练/rollout 链路中，slotMapping 若因 padding 或掩码计算出现 -2 之类负值（而非约定的 -1），算子返回成功但把写入落到 cache 末尾反向偏移处——静默改掉另一个 slot 的 KV 数据；表现为模型输出漂移且难以定位，±2^31 极端值则直接 aicore 异常 507035。越界正 slot（64/65）被静默丢弃。
  trigger_surface: CANN 9.2.0-beta.2（Ascend 950PR 实测，master attention/indexer_quant_cache）；slotMapping 含 -2 及以下负值或 ≥num_slots 正值
  discovery: 2026-10-28 每日扫描
