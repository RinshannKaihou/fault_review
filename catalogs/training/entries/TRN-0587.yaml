    component: RtsqA5 SQ 提交
  behavior: 共享线程有第二提交者时，RtsqA5 用未同步 sqTail_ 镜像写 SQE 并把硬件 tail 从 9 回退到 7，形成 head>tail 非法环形队列态，硬件取未写 slot 报 errorType:9
effect:
  objects:
  - 可用性/进度
  detail: 950/960 平台上 POD 引擎与 RtsqA5 共用通信域线程时，第一次 collective 提交即报 errorType:9 失败；日志可见 ConfigSqTail 把硬件 tail 从 9 拉回 7 的回退动作；禁用第二提交者后一切正常，二分可稳定定位。
  visibility: 报错
mitigation:
  detect: 二分法禁用第二提交者对照；hcomm 侧日志出现 CopySqeBufToSq 后硬件快照 sqHead>sqTail 即命中
  fix: 修复 MR https://gitcode.com/cann/hcomm/merge_requests/6402（open，未合入）：LaunchTask/TryLaunchTask 前用 QuerySqTail() 读回硬件 tail，镜像不一致时采纳硬件值（未核实合入）
