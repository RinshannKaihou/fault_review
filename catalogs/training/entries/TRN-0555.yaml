  mechanism: 'cann/ops-nn #7747（2026-10-30，P0，Ascend 910B2、CANN 9.2.0、master c46db05f5bb5）：aclnnSoftmaxCrossEntropyWithLogits 在 features=fp32[1x47]、labels=fp32[109x1]、loss=fp32[1]、backprop=fp32[1x47] 下两段接口均返回 0（非法入参被接受）；内核按 labels 的 109 行计算，向只有 4B/188B 的 loss/backprop buffer 写出界，msSanitizer memcheck 报 72 处 illegal_write（started_count=3、sizes 最大 564B）。资料要求 labels shape 与 features 一致、loss/backprop 由调用方按 features 分配。含完整 C++ 复现脚本。'
