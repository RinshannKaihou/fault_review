id: TRN-0311
legacy_ids: []
slug: ascend_fused_adamax_w_fp16_amp_storage_size_mismatch
aliases: []
title: NpuFusedAdamW BN 梯度 storage 与描述符长度失配
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: pytorch
    component: NpuFusedAdamW unscale_ 拼接
  behavior: FP16 AMP 下 BN 小通道梯度 storage 容量(16)与 NPU 描述符长度(8)分叉；NpuFusedAdamW 按 storage().size() 累计 266、NPU 口径 250，首次 unscale_ 越界报错。
effect:
  objects:
  - 可用性/进度
  - 优化器状态
  detail: 首个反向后首次 GradScaler.unscale_ 抛 RuntimeError(266>250)，训练无法进入首个 optimizer step；910B2 单卡小模型可复现；报错指向 combined_tensor 越界而非 BN 梯度本身。
  visibility: 报错
mitigation:
  detect: 对每个梯度张量比对 storage().size() 与 torch_npu.get_storage_size()，不一致即预警。
  fix: '待定（issue 2026-10-17 报于 Ascend/pytorch #5501，open；issue 提到 --bn-format3 强制 BN 参数 format 3 时两种长度一致、不触发，可作规避参考，作者未声称已验证为通用规避）'
