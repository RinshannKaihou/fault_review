original:
  mechanism: 'huggingface/trl #7993（2026-10-28，open）：FSDP2 + fsdp_cpu_ram_efficient_loading: true（trl/accelerate_configs/fsdp2.yaml 内置配置）时，transformers 只在各节点本地 rank0 保留检查点权重、其余 rank 填零，期待后续 broadcast。accelerate 在 prepare policy 时执行该 broadcast（fsdp2_prepare_model），但 TRL 的 prepare_fsdp 只调用 fully_shard——fully_shard 无 broadcast 语义（FSDP1 的 sync_module_states 有）。于是 TRL 包装的每个模型在非本地 rank0 分片保留零：DPO/KTO/RLOO/在线 DPO 的参考模型（full fine-tuning，含 FSDP 下 precompute 模型）、GRPO beta>0 的参考、SDFT/SDPO 教师模型。transformers#45050 把未初始化值改为零填充后不再 crash，训练静默跑在错误参考上。作者附最小复现：accelerate launch --config_file fsdp2.yaml 2 进程加载 tiny-Qwen2ForCausalLM，取 ref 模型某层 full_tensor() 与 safetensors checkpoint 对比。FSDP1 不受影响。'
  source: https://github.com/huggingface/trl/issues/7993
  behavior: 开 FSDP2 与 cpu_ram_efficient_loading 做 DPO/KTO/RLOO/GRPO（beta>0）/蒸馏训练时，参考模型或教师模型在每个节点除 rank0 外的分片是全零：参考 logprob、KL 惩罚、蒸馏目标都按错误参考计算，训练不报错、指标不直接显示参考错了（GRPO 里 ref logprob 项整体偏移），最终策略被静默拉偏。单机多卡或多机 FSDP2 配置下复现；同配置 FSDP1 正常可作对照。
  trigger_surface: trl FSDP2 路径 + fsdp_cpu_ram_efficient_loading（官方 fsdp2.yaml 默认开）+ 需要第二模型的角色（ref/teacher）；full fine-tuning
  discovery: 2026-10-29 每日扫描
  notes:
