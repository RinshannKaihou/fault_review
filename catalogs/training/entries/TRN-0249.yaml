  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `verified`'
  mechanism: 'trl `AsyncGRPOTrainer` 把组内每个 generation 作为独立 `n=1` 请求发给 data-parallel vLLM server、**不携带 seed**——各 engine 分发同源的请求种子序列，组内 generations 常常 **verbatim 相同**。修复（PR #7549，2026-10-07 merge）= async rollout worker 每个采样请求附唯一随机 seed。实测 8 个内部 dense 模型 async GRPO run（vLLM 0.25.1、DP=8、16 gen/prompt、T=1.0）：duplicate share（组内重复早先 completion 的比例）整 run 6.1%–70%，短 completion 最重（run H：组均 5.5/16 distinct、22% completion 对完全相同）；seeded baseline 0.00–0.13%。'
  source: 'trl PR #7549（2026-10-06；8 run 量化表 + seeded 对照）。https://github.com/huggingface/trl/pull/7549'
  behavior: 无 crash——GRPO 组内样本**有效多样性坍缩**：组 std 被重复样本压小 → advantage 尺度失真（近 duplicate 互相抵消）、探索被抑制，训练看似正常推进。与 RL-ADV.01（组 std=0）共享后果面但机制不同：那边是 reward 全同致 std=0、这边是**采样侧种子同源使 completion 全同**（reward 也随之全同）；与 RL-RO.21（组内 continuation 接错成员历史）同族「**组内样本独立性假设被后端破坏**」。已修复 merge。
  discovery: 2026-10-10 每日扫描
