    component: ThnnFusedLstmCell 全局状态
  behavior: aclnn 入口 AclnnParams/AclnnInfo/BaseOpOutputs 与 tiling 的 info/TilingData 均为文件作用域全局对象、被隐式共享，host 侧并发不安全；根因未钉死为串写
effect:
  objects:
  - 数值结果
  - 可用性/进度
