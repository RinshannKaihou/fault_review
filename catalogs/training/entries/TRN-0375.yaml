original:
  mechanism: cann ops-nn aclnnThnnFusedLstmCell（Atlas A2 910B2 / CANN 9.2.0 / torch_npu 2.12.0.post3，ctypes 直调）host 侧并发不安全：op_api/aclnn_thnn_fused_lstm_cell.cpp 把 AclnnParams/AclnnInfo/BaseOpOutputs 三个结构体在定义处实例化为全局对象，被 CheckParamsValid/HandleParams/RunBaseOp/ViewCopyResults 隐式共享；op_host/thnn_fused_lstm_cell_tiling.cpp 的 ThnnFusedLstmCellTilingInfo info 与 TilingData 同为文件作用域。实测 8 线程×60 次交替两种 shape：hy 输出失配 3 次（max_diff≈0.937）、第一段 561103（INNER_NULLPTR）61 次、同 shape 对照（--pin-variant 0）8 线程必现段错误 rc=139；单线程 160 次全正常。报告者明确归因边界：同 shape 时全局 TilingData 每次写入值相同，不能把根因钉死为全局 TilingData 串写，可确认的是 host 侧并发不安全，候选共享状态含 :39 全局 tilingData 与 :25-38 全局 info（写入读窗口跨 30 行）。修复 MR !12590（AI 辅助）把全局对象全部改局部并显式传参；MR 未附并发测试。
  source: https://gitcode.com/cann/ops-nn/issues/7007（2026-10-21，open）+ 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/12590（2026-10-22，open）
  behavior: RNN/LSTM 训练或多线程数据增强/采样在 host 侧并发调用同一 LSTM cell 算子时：偶发输出错值（hidden state 与正确值差到 0.9 量级）、偶发 561103 错误码、最坏直接进程段错误；单线程跑同一负载完全正常。表现为「多线程加速后训练结果不可复现、偶发崩溃」，重跑结果每次不同，典型竞态外观。训练框架若把 tiling host 段串行化则不触发。
  discovery: 2026-10-23 每日扫描
