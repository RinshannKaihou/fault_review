original:
  mechanism: 'Ascend/op-plugin #640 + 修复 MR !6099（2026-10-25，open，经典 910/910B3/950PR 三芯 / CANN 9.1.0 / torch_npu 2.7.1、2.9.1）。torch._foreach_add_ 对非连续视图（转置张量）就地加法静默不执行：无报错、原存储完全不变、allclose False maxabs 3.383；连续对照正常。三芯逐位同错。根因为 foreach 快路径门控（can_use_fast_route）只检查 is_non_overlapping_and_dense 不检查连续性，转置视图 (4,3) stride=(1,4) 满足 dense 判定穿透进入 aclnn 快路径。下游影响：_foreach_* 是 fused 优化器与 AMP 底层路径，非连续权重视图场景优化器更新静默丢失（权重冻结）。修复 MR !6099（open）新增 npu_foreach_can_use_fast_route 双重载附加全输入 is_contiguous 合取、131 调用点替换、95 格矩阵探针；三芯真机修复前 transpose 列 17/19 成员异常、门控语义预测逐格吻合。推理库已收同源 INF-2169；本条按训练侧（fused 优化器/AMP 权重更新路径）单独收录并 cross。'
  source: https://gitcode.com/Ascend/op-plugin/issues/640 修复 https://gitcode.com/Ascend/op-plugin/merge_requests/6099
  behavior: 在 NPU 上对转置过的张量做 foreach 就地加法时，操作静默不执行：不报错、数值完全没变。foreach 是融合优化器和 AMP 的底层路径—— optimizer.step() 对非连续权重视图的更新就这样被悄悄丢掉，权重看起来在训练实际被冻结；三款芯片一致复现。
  trigger_surface: torch_npu _foreach_* 族，非连续视图（转置/slice 交叠等 dense 但不连续的形态）；经典 910 / 910B3 / 950PR、CANN 9.1.0、torch_npu 2.7.1/2.9.1 三芯实测。
  discovery: 2026-10-26 每日扫描
