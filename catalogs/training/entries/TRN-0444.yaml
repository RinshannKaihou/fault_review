id: TRN-0444
legacy_ids: []
slug: op_plugin_foreach_noncontig_view_silent_noop_training
aliases: []
title: torch_npu _foreach_ 非连续视图静默不生效（训练侧）
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: _foreach_* 快路径门控
  behavior: foreach 快路径门控只检查 is_non_overlapping_and_dense、不检查连续性，转置等非连续视图穿透进入 aclnn 快路径后就地加法静默不执行；修复 MR 收紧门控为非连续走慢路径。
effect:
  objects:
  - 模型权重
  - 优化器状态
  detail: _foreach_add_ 对转置张量无报错、存储不变、maxabs 3.38；下游 fused 优化器/AMP 对非连续权重视图的更新静默丢失（权重冻结）；三芯逐位同错。
  visibility: 静默错误
mitigation:
  detect: 非连续视图 foreach 前后 allclose 断言；95 格矩阵探针（修复 PR 附带 probe_foreach_nc.py）。
  fix: 修复 PR https://gitcode.com/Ascend/op-plugin/merge_requests/6099 （open，未合入）：门控加 is_contiguous 合取，非连续走上游慢路径；三芯验证 17/19 成员转置列转绿。
