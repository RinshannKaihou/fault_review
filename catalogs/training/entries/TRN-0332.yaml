original:
  mechanism: 'MindSpeed-LLM issue #1437（2026-06-01 提，已 closed）：调试 qwen3-14b-64k-lora（A3、CANN 8.5.2、26.0.0、16 卡、--tensor-model-parallel-size 1 --pipeline-model-parallel-size 1 --context-parallel-size 8 --context-parallel-algo ulysses_cp_algo --sequence-parallel、lora-r 16 lora-alpha 32 --lora-fusion --lora-target-modules linear_qkv linear_proj linear_fc1 linear_fc2、--pack --neat-pack）时 loss 不收敛，日志里 grad norm 一直为 0.000、lm loss 在 1.224e+01 附近几乎不动、num zeros 0、skipped/nan iterations 均为 0。定位到与重计算相关：开启 --recompute-granularity full --recompute-method uniform --recompute-num-layers 1 时 grad norm 为 0；为排除模型因素把 qwen3-14b-64k-lora 裁到 10 层、不加载权重，同一套配置开重计算 grad norm 仍为 0，关掉重计算则 grad norm 正常。两条对照命令行除重计算参数外完全一致。issue 正文没有给出重计算路径下 LoRA 梯度丢失的具体代码位置。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1437
  behavior: LoRA 微调（qwen3-14b-64k、CP=8、pack）日志里 grad norm 从 iteration 2 起一直是 0.000，lm loss 卡在 12.2 上下不降，训练照常推进到 2000 iter、无 NaN、无 skipped iteration、也不报错。把 --recompute-granularity full --recompute-method uniform --recompute-num-layers 1 去掉后 grad norm 立刻正常；裁到 10 层、不加载权重同样能复现开/关重计算的差异。
  trigger_surface: LoRA 微调 + uniform full 重计算（--recompute-method uniform）
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
