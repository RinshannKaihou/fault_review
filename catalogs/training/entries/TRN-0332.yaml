title: LoRA 开 uniform 重计算后 grad norm 恒为 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: mindspeed-llm
    component: LoRA 与 uniform full 重计算
  behavior: LoRA 目标层与 --recompute-method uniform 的整层重计算组合时，重算路径下 LoRA 参数拿不到梯度，wgrad 全零；报告只定位到重计算开关，未给出代码级根因。
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: qwen3-14b-64k LoRA、CP=8、full+uniform 重计算时 grad norm 恒 0.000、loss 停在 12.2 附近 2000 iter；去掉重计算参数即正常，裁到 10 层不加载权重同样复现。
  visibility: 静默错误
mitigation:
  detect: LoRA 训练看 grad norm 是否恒 0（而非仅看 loss 曲线）；或对比开/关重计算同名 LoRA 参数的 grad 范数。
  fix: 待定（issue 已 closed，正文未给出修复 PR；报告给出「关掉 recompute」的规避方式）
