original:
  mechanism: cann ops-nn clipped_swiglu 与 clipped_swiglu_grad（Atlas A3 910_93 2 卡 / CANN 9.1.0 / torch 2.10.0 + torch_npu 2.10.0.post4，master ddbbfc99，eager torch_extension whl）：传 group_index 且 sum(group_index)<batch 行数时，kernel 侧 realBatchSize_=min(sum(group),dimBatchSize)、CopyOut 仅按该值循环——范围外行从不写入；csrc/clipped_swiglu.cpp 与 clipped_swiglu_grad.cpp 用 at::empty 分配输出张量，未写入区域即未初始化显存。仓库三处参考实现（golden.py dx=np.zeros、st executor zeros_like 后 cat、examples 全 0 预置 H2D）表明正确语义是范围外行输出 0。复现：先跑普通 case 污染显存池，再 batch=8、gi=[2,3] 调用，行 5-7 输出 32/32 非零残影（~e-12 量级浮点残影）；不预热单跑常碰巧全 0——随机复现、典型 UB。训练侧收录依据：clipped_swiglu 是 GPT-OSS 式 MoE 激活（MindSpeed/DeepSpeed NPU 路径），group 稀疏场景（变长 token 分组）前向与梯度均被污染，脏值随分配器状态随机出现。修复 MR !12603（open）：has_group 时 at::zeros 初始化，12 项金标准对拍与 autograd 链路 maxdiff 全 PASS、非 group 路径零影响。推理库同日已收同 URL（INF-2136，pending_audit），本条为训练侧独立条目（NPU_SCAN 第 9 条分别证实影响：MoE 训练前向+反向受害）。
  source: https://gitcode.com/cann/ops-nn/issues/7223（2026-10-22，open；含预热污染复现脚本与三处仓内参考语义）+ 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/12603（open）
  behavior: NPU 上 MoE 训练用 clipped_swiglu（group_index 变长分组）做激活：前向输出和梯度里未被 group 覆盖的行不是 0 而是显存残影——有时碰巧全 0、有时随机非零（e-12 到 e-7 量级），同一代码同一输入两次运行结果不同。表现为 MoE 训练偶发数值噪声/不可复现，单测难捕获（需先污染显存池），梯度同样带脏值逐步劣化权重。不传 group_index 的稠密路径完全正常。
  discovery: 2026-10-23 每日扫描
