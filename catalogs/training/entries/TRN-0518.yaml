  target: TRN-0149
pattern: PAT-TRN-0020
original:
  mechanism: 'op-plugin（torch_npu 后端）native_batch_norm 在推理模式返回 C 形状保存量，但值未可靠对应 running mean 和 rsqrt(running_var+eps)；default/out、JIT 两设置及 fp16/fp32 下修复前 8 项保存量检查均失败。_native_batch_norm_legit.no_stats 未注册 PrivateUse1 内核而走 CPU 回退：CPU 返回 rstd，而 NPU native_batch_norm_backward 训练入口按 variance 消费保存量，造成反向数值错误。修复方案（issue 内叙述，Ascend910B4、CANN 9.2.0-beta.2、PyTorch 2.16.0.dev20261019 验证）：ACL/OpAPI 推理调用后填充保存量、低精度用 float32 中间计算；新增 no_stats ACL/OpAPI 注册（空 running statistics 转发现有 native BN，training=True 检查）；op-plugin 原生回归 20/20、torch-npu 严格编译回归 42/42 通过。与 pytorch #5694（torch 侧 BN 保存量契约，10-29 留观）互补：本条是 NPU 后端实现层面的具体缺陷与修复验证。'
  source: https://gitcode.com/Ascend/op-plugin/issues/661
  behavior: NPU 上跑 BN 网络（如视觉分支、LoRA 微调 VLM）时，推理态/无统计 BN 前向的保存量是垃圾值或 rstd/variance 口径错配，后续 backward 梯度数值错误且无报错；fp16/fp32 与 JIT/非 JIT 组合下保存量检查 8/8 失败，混合精度训练中表现为梯度静默偏离
  discovery: 2026-10-30 每日扫描
