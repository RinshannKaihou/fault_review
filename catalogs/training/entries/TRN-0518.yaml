id: TRN-0518
legacy_ids: []
slug: op_plugin_batch_norm_inference_saved_stats_uninitialized
aliases: []
title: torch_npu BN 推理保存量未初始化污染 backward
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: native_batch_norm 保存量
  behavior: 推理模式保存量值未按 mean/rstd 填充；no_stats 未注册 NPU 内核走 CPU 回退返回 rstd，而 NPU backward 按 variance 消费
effect:
  objects:
  - 梯度
  detail: 混合精度/推理态 BN 前向后接反向时梯度数值错误；修复前 8 项保存量检查全失败（fp16/fp32 × default/out × JIT 两设置）
  visibility: 静默错误
mitigation:
  detect: 对 BN 前向保存量与 running_mean/rsqrt(running_var+eps) 对拍；CPU 参考对比梯度
  fix: 见 issue 修改方案（ACL/OpAPI 推理调用后填充保存量、低精度 fp32 中间计算、新增 no_stats NPU 内核并拒绝 training=True 以外的推理请求）；op-plugin 原生回归 20/20、torch-npu 严格编译回归 42/42 通过（issue 报告，未见独立修复 PR 链接）
labels:
  stage:
  - shared
  confidence: documented
  coverage: var
  discovered: '2026-10-30'
remarks: '与 torchtitan TRN-0149（KER.18）同族：BN 保存量契约破坏方向一致（本条为 NPU 后端实现侧，TRN-0149 为 module.to 静默转型侧）；10-29 曾按 pytorch #5694 留观 BN 契约问题，本条为 NPU 后端具体实现载体'
evidence:
- url: https://gitcode.com/Ascend/op-plugin/issues/661
  kind: gitcode_issue
