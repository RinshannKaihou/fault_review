  - rl
  confidence: documented
  coverage: NEW
  discovered: '2026-10-29'
remarks: 作者附 CPU 最小复现（真实 _iter_named_params）；另有次要 GPU 面：packing 在 side stream 而 merge 在当前流、无事件同步
