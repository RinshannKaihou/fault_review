original:
  mechanism: 'huggingface/trl #8003（2026-10-29，open）：vllm_mode=server + PEFT（LoRA）时 sync_weights 后 vLLM server 收到的部分权重是未合并的 base 权重。VLLMClient.update_named_params 把 VLLMGeneration._iter_named_params() 流式送入 vLLM packed_nccl_broadcast_producer；_iter_named_params 执行 model.merge_adapter() → 逐参数 yield → model.unmerge_adapter()（就地 weight.data -= delta）。vLLM 的 pack_tensors（vllm/distributed/weight_transfer/packed_tensor.py）只收集 yield 张量的视图（.contiguous().view(-1).view(torch.uint8)，无拷贝），仅当 buffer 超 buffer_size_bytes（默认 1GB）或迭代器耗尽时才 torch.cat 读取。最后一块因迭代器耗尽而触发：生成器在最后一个 yield 后恢复、执行 unmerge_adapter()，然后 torch.cat 才读视图——尾块内每个 LoRA 目标权重都以未合并值发送。fp32 trainer 权重（GRPOTrainer 默认 dtype）下 Qwen3-0.6B 约 2.4GB、1.7B 约 8GB，1GB buffer 时尾块总是因耗尽而结束，每次 sync 都触发。colocate 模式同模型训练正确。作者附真实 _iter_named_params 的 CPU 最小复现。次要 GPU 面：packing 跑在 producer 的 side stream 上而 merge_adapter 在生成器首次恢复时的当前流，二者间无 event/stream 同步。'
  source: https://github.com/huggingface/trl/issues/8003
  behavior: GRPO/RL 训练用 vllm_mode=server + LoRA 时，权重同步后 vLLM 收到的最后一块参数是没有加上 LoRA 增量的原始 base 权重：rollout 生成持续用接近原模型的旧权重，而 trainer 侧继续训练，训推权重静默脱节。表现为采样质量不随训练改善、importance ratio/KL 等指标逐渐失真但无报错；colocate 模式正常可作对照。模型越大（fp32 默认 dtype）越必然触发。
  trigger_surface: trl GRPOTrainer + vllm_mode=server + PEFT/LoRA + packed_nccl_broadcast 权重同步；fp32 默认 dtype（2.4GB+ 模型）必触发尾块耗尽路径
  discovery: 2026-10-29 每日扫描
