id: TRN-0498
legacy_ids: []
slug: trl_server_peft_last_chunk_unmerged_broadcast
aliases: []
title: TRL server 模式 LoRA 权重同步尾块未合并
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: trl
    component: 权重同步生成器
  behavior: PEFT 权重同步在 yield 完后于生成器内 unmerge_adapter()（就地减 delta）；vLLM 尾块直到迭代器耗尽才 cat 读取视图，unmerge 先执行，尾块 LoRA 目标权重以未合并值发出。
effect:
  objects:
  - 模型权重
  - 训练信号
  detail: vllm_mode=server+PEFT 下每次同步尾块发送未加 LoRA delta 的 base 权重（fp32 默认 dtype 必触发）；rollout 持续用接近原模型的权重生成，与 trainer 脱节，IS ratio/KL 静默失真。
  visibility: 静默错误
mitigation:
  detect: server 侧抽样比对收到的权重与 trainer merge 后参数；监控 rollout logprob 与 train logprob 漂移
  fix: 待定（issue open 2026-10-29，无修复 PR；colocate 模式不受影响；规避：增大 buffer_size_bytes 使尾块非耗尽触发或暂停 unmerge 时序）
