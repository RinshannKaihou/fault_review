id: TRN-0275
legacy_ids: []
slug: aclnn_empty_input_early_return_unwritten
aliases: []
title: aclnn 空输入早退不写非空出参返回脏数据
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnn 空张量早退分支
  behavior: aclnn 两段式接口早退条件覆盖输入空×出参非空组合：不写出参即返回 ACLNN_SUCCESS；CheckShape 未绑定出参空性随输入联动。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: pad 系反向/UnfoldGrad 的 gradInput、Multinomial 的 out、MedianDim 输出、DynamicQuant 的 scaleOut 残留未初始化内存（实测哨兵/NaN），接口返回成功无报错。
  visibility: 不可复现
mitigation:
  detect: 出参预填哨兵值做 round-trip 校验；PyTorch 参考语义为空 grad_output 回全零，可对账。
  fix: '待定：同机理先例 ops-math #3360（aclnnCdistBackward）已闭环；本批 #3553/#3560/#6582/#6605 暂未见已合入修复（各 issue 关联 MR 状态未逐一核实）。'
