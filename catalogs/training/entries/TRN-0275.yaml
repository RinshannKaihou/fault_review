original:
  mechanism: 'CANN aclnn 两段式接口的「空输入早退」分支在输入为空而出参非空时不写出参即返回 ACLNN_SUCCESS：pad 系反向（aclnn_pad2d_backward.cpp:227-249 OR 早退，同类 circular_pad2d/3d、pad3d、unfold_grad 共 5 文件）gradOutput 前导维为 0 而 gradInput 非空时直接 SUCCESS+workspaceSize=0，gradInput 残留调用方内存（910B2 + CANN 9.2.0-beta.2 实测预填 1234.0 一个字节未写；PyTorch 参考语义为回全零）；aclnnMultinomial（aclnn_multinomial.cpp:463-467，Tensor 变体 569-573 同型）self=[0]/[N,0] 且 replacement=true 时 out 非空但保持 INT64 哨兵 999999（ctypes 直调 libopapi_math.so 实测）；aclnnMedianDim（aclnn_median.cpp:136）归约维为 0、输出 [3,1] 非空时 values/indices 残留 0x7F 污染 pattern（910B2 实测，CANN 9.1.1/9.2.0-beta.2 双版本；torch.median 公开接口可触发，CPU 为 IndexError）；aclnnDynamicQuant（aclnn_dynamic_quant.cpp:354-358）x=[M,0] 时非空 scaleOut 残留 NaN（GM 污染复现法，后续反量化被污染）。共同根因：CheckShape 未绑定「出参空性随输入联动」，早退条件覆盖了输入空×出参非空的组合。同机理先例 ops-math #3360（aclnnCdistBackward）已闭环修复。'
  source: https://gitcode.com/cann/ops-math/issues/3553 ；同类：https://gitcode.com/cann/ops-math/issues/3560 、https://gitcode.com/cann/ops-nn/issues/6582 、https://gitcode.com/cann/ops-nn/issues/6605
  behavior: NPU 上以空张量输入（gradOutput 前导维 0 / self=[N,0] / 归约维 0 / x=[M,0]）调用对应 aclnn 算子且出参非空时：接口返回成功、无报错，出参保持未初始化内存（脏数据/NaN/哨兵残留），随显存复用不可复现；训练反向路径（pad 反向梯度）拿到未初始化梯度。
  discovery: 2026-10-15 每日扫描
  notes:
  - '2026-10-16 回访 2026-10-16：#3560（Multinomial）已 closed，修复 MR !6366 已 merged（空 self 早退不填非空输出）；本批其余来源 #3553/#6582 仍 open。issue #6523（TRN-0271 来源）亦已 closed（2026-10-15 快照）。'
  - '2026-10-24 2026-10-24 补证据：同机理 5 新实例（A2/9.2.0/master 实测）——ops-nn #7246 GroupNormBackward N=0 不写 gradGamma/gradBetaOut（哨兵 777 残留，PyTorch 参考为 0）；ops-math #3840 Logdet 空输入不写 out（PyTorch 为 0.0）；#3841 GroupedBiasAddGrad 空 gradY 不写非空 gradBias；#3838 Max/Min/AminmaxAll/MaxDim/MinDim 空输入全族不写非空输出（同目录 mean/prod/logsumexp 已用 FillScalar 写语义值，max/min 族未跟进）；#3846 Multinomial 空 self+replacement=True 漏拦（replacement=False 已拦，校验不对称）且不写非空 out。#7246 正文点名 BatchNormBackward #7033、GridSampler3DBackward #1252、RoiPoolingGradWithArgMax #1230 为已确认同机理先例。'
