  meta: 'stage: `sft` · Cov: `var:ddp_normalization_shrinks_aux_loss_grad_dp_factor` · 置信度 `verified`'
  mechanism: 'trl `SFTTrainer.compute_loss` 把 MoE aux loss 折进按 `num_items_in_batch`（token 归一）的 CE loss 后**再乘 `num_processes`**：aux 项是 per-micro-batch 均值——(1) DDP 把 CE 平均回去但 aux 项从未除以 world size → 放大 `num_processes` 倍；(2) 用 `num_items_in_batch` 时 `Trainer` 不再除以梯度累积步 → aux 项又被跨 micro-batch **求和**。合计放大 `num_processes × gas` 倍（2 GPU + gas 2 = 4×）。修复（PR #7570，2026-10-08 merge）= aux 项在世界尺寸缩放**之后**加入并除以累积步（GRPO/RLOO/AsyncGRPO 本就如此；DPO/KTO 无 `num_items_in_batch` 不受影响）。'
  source: 'trl PR #7570 / issue #7569（2026-10-05；4× 单例 router-update 实测表：1 GPU batch4 = 4.94 (1×)、2 GPU batch2 = 9.88 (2×)、2 GPU batch1+gas2 = 19.76 (4×)，修复后均 4.94；回归测试 `test_aux_loss_does_not_scale_with_gradient_accumulation` 主线挂修复过；2×B300）。https://github.com/huggingface/trl/pull/7570'
  behavior: 无 crash——多卡 SFT 的 MoE 负载均衡项按 world size 与累积步**双重放大**：router 收到的 aux 梯度强度随并行配置漂移（8 卡 gas 4 = 32×），`router_aux_loss_coef` 的语义跨配置不可比，路由被过度推向均衡、可能伤专家特化。与 PAR.16（Megatron global_aux_loss 梯度经 DDP AVG 缩小 DP×）为**同失效面的两个方向**：那边缩小、这边放大，同根「aux loss 与 DDP/world-size 归一约定脱钩」；与 MOE.14（aux coef 静默 no-op）同为 trl SFT MoE aux 链路的配置-执行断裂。
