  detail: bool attn_mask 有全遮 query 行（padding 等）时，NPU 该行输出非零实值＝对该行 key 的均匀 softmax（v.mean，allclose 5.96e-08），CPU 为全 0 行；加性 -inf 掩码遮 query 行两端一致全 0，仅 bool 路径受影响。
  visibility: 静默错误
mitigation:
  detect: 构造全遮 query 行四象限对照（bool/additive × query/key）。
