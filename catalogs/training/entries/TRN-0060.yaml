  note: 'subsystem 由 优化器 改为 算子/内核。依据“修复要改哪里”：原文修复 = “is_first_microbatch_tracked(config) 不维护时给 TE 传 None”，改动在 Megatron 的 TEGroupedLinear（TE 封装层）对 TE 的 flag 传参，TE 列于词表 算子/内核；main_grad accumulate/overwrite 是 TE 梯度累积融合（beta=0）的 kernel 行为，优化器 侧的梯度累积配置与步进逻辑无缺陷。resume 与 MTP 复用按 rules 只是触发条件。审计：detail 末句“同族：MFSDP v2 缺 no_sync…”是另一故障（PR #7186）的机制，不是本条影响，替换为原文给出的触发条件。'
