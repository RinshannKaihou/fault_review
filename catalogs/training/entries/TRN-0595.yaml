original:
  mechanism: DeepSpeed !8981（2026-11-02 open 修复载体）。ZeRO-3 keeps each param's gradient partition across steps and overwrites it only in micro-step 0；无梯度参数（skipped branch、unused expert）保留 last gradient 且被 optimizer 再次施加；ZeRO-1/2 给零梯度（行为分歧）。修复：param 首个梯度 after step()/zero_grad() 覆写其分区；累积边界无梯度分区清零；offload 下每个优化器未收到的分区拷贝给它。实测 GH200 1 rank（base 2d80cedd2）五种场景数值对照（见 effect.detail）。与 !8964（ZeRO-1/2 请求级梯度保留，TRN-0525 supersede 面）相邻但对象不同：本条是 ZeRO-3 梯度分区跨步驻留，非请求窗口丢失。
  source: deepspeedai/DeepSpeed https://github.com/deepspeedai/DeepSpeed/pull/8981（open 修复载体）
  behavior: ZeRO-3 训练里只要存在『某些步拿不到梯度的参数』——条件分支跳过的层、MoE 未激活的 expert、梯度累积中后半段才用到的参数——这些参数的梯度分区会保留上一步的旧值并被优化器反复施加：权重按过期方向持续更新、累积窗口的梯度叠加错误、fp16 时残留的 inf 让之后每一步都被当溢出跳过。训练无任何报错，loss 表现异常缓慢或停滞；实测单参数最大错误权重变化 2.4e-2，offload 场景梯度范数本应 0.17 却为 0。
  discovery: 2026-11-03 每日扫描
