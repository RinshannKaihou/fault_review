id: TRN-0595
legacy_ids: []
slug: deepspeed_zero3_unused_param_stale_grad
aliases: []
title: ZeRO-3 未用参数梯度分区驻留：旧梯度被重复施加
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: ZeRO-3 gradient partition
  behavior: ZeRO-3 梯度分区跨步驻留、仅 micro-step 0 覆写；某步无梯度的参数（跳过分支、未用 expert）保留上一步梯度被 optimizer 再次施加，ZeRO-1/2 对同参数给零梯度
effect:
  objects:
  - 梯度
  - 数值结果
  detail: GH200 1 rank 实测：无梯度参数按过期方向持续更新，单参数最大错误权重变化 2.4e-2；梯度累积窗口叠加错误；offload 场景梯度范数本应 0.17 却为 0；fp16 残留 inf 使之后每步被当溢出跳过，训练无报错，loss 缓慢或停滞
  visibility: 静默错误
mitigation:
  detect: 构造部分参数单步无梯度的 ZeRO-3 步进、对比 ZeRO-1/2 与 CPU 参考的权重更新量；检查未用 expert 参数的更新范数
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8981（open）：step()/zero_grad() 后首个梯度覆写分区；累积边界处无梯度分区清零；offload 时未收到的分区显式拷贝给优化器
