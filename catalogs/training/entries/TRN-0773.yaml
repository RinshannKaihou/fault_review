title: ForeachAddcdivList 非连续 out 只写一半
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnForeachAddcdivList
  behavior: List 版既不校验 out 各 tensor 连续性，也不按 stride/storageDims 回写，直接按连续布局写 storage 前缀；同族 Scalar 版已有 stride 回写路径
effect:
  objects:
  - 模型权重
  - 优化器状态
  detail: 4 槽中 2 槽非连续时 48/80 元素未写、仅 2 个正确（连续槽 80/80 正确），两段仍返回 0/0，非连续槽保持调用方旧值
  visibility: 静默错误
mitigation:
  detect: out 列表混入非连续 view（每槽独立 stride）并预填互斥金丝雀；读回统计未写元素数，同时保留连续槽作同调用对照
  fix: 待定（issue open 2026-11-17；建议首段校验 out 连续性返回 161002，或按 strides 回写；同族 Scalar 版可作参照）
