original:
  mechanism: 'cann ops-nn aclnnKlDivTargetBackward（Atlas A2 910B2 / CANN 9.2.0，aclnn 两段式直调）两缺陷：① 溢出——实现把公式改写为 g*log t - g*s + (g*t)/t，(g*t) 在 fp32 下先溢出再除回来，g=1e10、t=1e30、s=0、reduction=none 时输出 inf，真值 7.00776e11 有限。② 空输入不写输出——self=[0,3]、target=[3]、gradTarget=[3]（合法形态）两段返回 0，但 gradTarget 完全没有被写入（预填 NaN 原样保留）。同批 #7167（KlDivBackward dtype 不一致未拒绝/reduction 非法静默按 none）为同接口家族的入参校验类，机制不同，见日报留观。'
  source: https://gitcode.com/cann/ops-nn/issues/7168（2026-10-22，open；含两组复现参数与期望值）
  behavior: 用 KL 散度 target 梯度（蒸馏/正则场景）时两种可观察后果：① 大幅度梯度/概率组合下 gradTarget 直接 inf——正常训练里 loss 曲线从某步起被 inf 点燃变 NaN，而输入本身全是有限值；② batch 维含空段（动态 shape、变长聚合）时该段输出保持分配时的脏值/预填值不写，两段返回 0，下游拿到未初始化数据。两类都无报错，靠 NaN 金丝雀或幅度检查才能发现。
  discovery: 2026-10-23 每日扫描
