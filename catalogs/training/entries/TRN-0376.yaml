title: KlDivTargetBackward 中间量溢出 inf 且空输入不写输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: KlDivTargetBackward
  behavior: 公式改写为 g*log t - g*s + (g*t)/t，(g*t) 在 fp32 下先溢出再除回；空输入分支两段返回 0 但完全不去写 gradTarget 输出
effect:
  objects:
  - 梯度
  - 数值结果
  detail: g=1e10、t=1e30 时 gradTarget=inf（真值 7.00776e11 有限）；合法空输入形态 self=[0,3] 时 gradTarget 保持预填 NaN 原样未被写入，返回码 0
  visibility: 数值异常
mitigation:
  detect: 对极端幅度输入做有限性检查；空输入路径用 NaN 金丝雀预填输出验证写行为
  fix: 待定（issue 建议：避免 g*t 中间量/改 fp64 中间量/先除后乘；空输入写 0 或报 161002）
