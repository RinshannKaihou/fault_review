- url: https://gitcode.com/Ascend/op-plugin/issues/599
  kind: gitcode_issue
relations: []
original:
  mechanism: Ascend op-plugin（torch_npu 2.7.1.post4 + CANN 9.1.0，Atlas A3 910_9362×2）的 embedding_bag 2D 输入 + include_last_offset=True 路径：转换层对 include_last_offset 的末包偏移处理错误，最后一个 bag 的 embedding 被重复累计——sum/mean 输出实测 NPU = CPU 正确值 + 该末包的真实和；backward 梯度对照确认同污染；max 模式正确；不传 include_last_offset 时正确。issue（2026-10-19，open）建议 op-plugin 的 embedding_bag 转换层核对 include_last_offset 的偏移处理；复现脚本 A3 真机 /mnt/workspace/a3hunt/round5/。训练侧收录依据：embedding_bag 是推荐/排序等训练负载的常规算子，末包前向错值 + 梯度污染为静默训练正确性故障。推理库未收录该来源（find 核对 count=0），无需 cross。
  source: https://gitcode.com/Ascend/op-plugin/issues/599
  behavior: NPU 上以 2D 输入 + include_last_offset=True 调 F.embedding_bag(mode='sum'/'mean') 时，每个样本最后一个 bag 的输出值偏大（等于正确值再加一次末包元素和），反向梯度同样错；训练无任何报错，只有末 bag 受影响、其余 bag 正确，单测逐元素对照才能发现。环境：CANN 9.1.0、torch_npu 2.7.1.post4、Atlas A3，双芯一致。
  trigger_surface: torch_npu + CANN 9.1.0（A3）F.embedding_bag 2D 输入 + include_last_offset=True 的 sum/mean 模式。
  discovery: 2026-10-20 每日扫描
