id: TRN-0321
legacy_ids: []
slug: op_plugin_embedding_bag_last_offset_double_count
aliases: []
title: op-plugin embedding_bag 末包重复累加致错值与梯度污染
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: embedding_bag 转换层
  behavior: embedding_bag 转换层在 2D 输入 + include_last_offset=True 时末包偏移处理错误，最后一个 bag 被重复累计：sum/mean 末包输出=正确值+末包真实和，梯度同污染；max 正确。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 2D embedding_bag（include_last_offset=True）训练时每个样本最后一个 bag 的 sum/mean 前向输出错值、对应梯度同错；无报错，错值随训练静默传播。max 模式与不含 include_last_offset 的调用不受影响。双芯一致。
  visibility: 静默错误
mitigation:
  detect: 对含末包的样本用 CPU embedding_bag 对照 forward/backward；或抽验末 bag 输出是否等于「正确和 + 末包和」的二倍关系。
  fix: 待定（issue 2026-10-19 open 建议核对 include_last_offset 偏移处理；无修复 MR）
