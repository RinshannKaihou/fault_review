title: RecurrentKda 序列长度超 8 静默输出全 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnRecurrentKda
  behavior: host 侧 CheckShape 不校验文档规定的单序列长度上限 8，kernel 在 T>8 时把 attnOut 写成全 0 仍返回成功
effect:
  objects:
  - 隐状态
  - 数值结果
  detail: TND T=12/18 与 BSND T=16 时 attnOut 非零元素 0/6144、0/9216、0/8192，两段 rc=0/0；T≤8 与 fp64 标杆 matched_ratio=1.0
  visibility: 静默错误
mitigation:
  detect: 扫单序列长度 T=1..24，统计 attnOut 非零元素数并与 fp64 标杆比对；输出缓冲预填非零 canary 以区分「写成 0」与「未写」
  fix: 待定（issue open 2026-11-17；建议 CheckShape 增加 denseSeqLen 与 cuSeqlens 段长 ≤8 校验并返回 161002）
