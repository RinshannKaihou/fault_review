id: TRN-0828
legacy_ids: []
slug: cann_tiling_u32_length_overflow_empty_tensor_branch
aliases: []
title: tiling 32 位长度溢出把大张量当空张量
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: host tiling 长度计算
  behavior: HuberLossGrad 的 uint32 元素数乘 typeLength、EluGradV2 的 uint32 元素数在跨 2^32 时回绕为 0，tiling 走空张量分支、零工作量并返回成功。
effect:
  objects:
  - 梯度
  - 模型权重
  detail: HuberLossGrad FP32 [1073741824]（2^30×4B=2^32）inputLength 回绕 0，每核 0 tile，不写输出；EluGradV2 FP16 [65536,65536] totalLength=0 走空张量分支；两段均成功，输出保留旧值/未初始化。
  visibility: 静默错误
mitigation:
  detect: 构造元素数 ≥2^32 或 FP32 总字节数 ≥2^32 的合法输入，预填金丝雀并检查 host tiling 的 totalLength/inputLength 是否为 0，再与 64 位参考逐元素对拍
  fix: 待定（#10454/#10455 open，2026-11-27；报告建议用 uint64_t 计算总元素/字节数，下发 32 位 tiling 字段前检查并分块，或显式拒绝；未见修复 MR）
