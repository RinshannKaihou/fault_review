original:
  mechanism: 'cann/ops-nn #7453（2026-10-27，open，ops-nn master merge-base 5fee1984，optim/inplace_apply_adagrad_da arch35）：对照 TensorFlow tf.compat.v1.raw_ops.ApplyAdagradDA 的代码级缺陷报告。A. Kernel 精度：1) l1 分支极性与 TF 不一致——l1T_/l2Tlr_ 推导与主计算分支按 l1<=0 判定，l1=NaN 时比较结果 false 误入 l1>0 稀疏截断分支，l1T_=NaN·T 经标量成员泄漏至全部元素输出全 NaN（TF ApplyAdagradDA 语义 if(l1>0)，NaN 比较为 false 走直通分支）；2) 软阈值 Relu 分解 relu(g−t)−relu(−g−t) 只在 t≥0 等价于 sign(g)·max(|g|−t,0)，t<0 时产生 2g/灾难性抵消/Inf−Inf=NaN；3) denormal 语义未对齐 TF CPU（Eigen/AVX DAZ+FTZ：denormal 冲刷为保符号 ±0），本实现不冲刷，ga+grad 相消产生的 denormal 被 −lr 放大成正常数；l2Tlr_ 按 (l2*T)*lr 与 TF 的 l2*(T*lr) 在 |T·lr|>FP32_MAX 时分母行为不同；4) FP32 Div/Sqrt 未指定精度档。B. Host 校验缺失：InferShape 仅判空（不校验 rank≤8/同形/标量 shape=[1]）；InferDataType 无 dtype 域校验；Tiling 对 -1/-2 未知维无门禁（负维流入 CeilDiv 产出垃圾 tiling 而非 fail-fast）；use_locking 注册缺 AttrType(OPTIONAL) 与公开契约不符。复现步骤 1-6 对应各缺陷。关联修复 PR https://gitcode.com/cann/ops-nn/pull/12578（open）：kernel 503/503 + GEIR 56/56 + UT 41/41 全绿；NPU vs GPU A100 vs CPU 三方一致 534/534；CPU/GPU 参考 bitwise 一致 108/108 组。'
  source: https://gitcode.com/cann/ops-nn/issues/7453 + 修复 https://gitcode.com/cann/ops-nn/pull/12578（open）
  behavior: NPU 上用 InplaceApplyAdagradDA（对偶平均法 AdagradDA）：l1 传 NaN 时该步输出全 NaN 并写回参数；global_step 使 t=l1·T<0 时更新量偏离软阈值公式（出现 2g 或 NaN）；denormal 梯度/累加场景与 TF CPU 结果不一致（TF 冲刷为 ±0，NPU 放大成正常数）——迁移对齐类训练在此类边界下静默偏移；非法 shape/dtype/动态维不报错而是算出垃圾 tiling。
  trigger_surface: ops-nn master（merge-base 5fee1984）optim/inplace_apply_adagrad_da arch35；l1=NaN / l1>0 且 t<0（global_step<0）/ denormal 输入 / 非法 shape·dtype·负维
  discovery: 2026-10-28 每日扫描
