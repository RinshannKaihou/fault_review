title: triton-ascend num_stages>1 携带态存储错调度（训练侧）
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 软件流水携带态存储调度
  behavior: 带 loop-carried 值且循环体内 store 的 kernel 在 num_stages>1 软件流水下被错调度：in-loop store 读到陈旧流水级，kernel 跑完并返回看似合理的错数——非崩溃非编译错误。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: Mamba-2 SSD 状态传递 kernel（fwd/bwd 同模式）约 25%~46% 新起进程输出 bit 级一致错值；固定 num_stages=1 全部消失（16/16 PASS，梯度 bit 一致）；进程内稳定、跨进程翻转。
  visibility: 不可复现
mitigation:
  detect: 多进程重跑对比输出 bit 一致性；对携带态 kernel 固定 num_stages=1 做 A/B。
  fix: 待定（issue open，3.6.0+dev20260921 与 3.2.2 均复现；规避：相关 config 固定 num_stages=1）
