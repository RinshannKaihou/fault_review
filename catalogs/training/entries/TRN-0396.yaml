original:
  mechanism: 'triton-ascend（910B3、CANN 9.1.0、triton-ascend 3.6.0+dev20260921，3.2.2 亦复现）：num_stages>1 软件流水对「循环体内存储 loop-carried 值」的 kernel 错调度，in-loop store 读陈旧流水级。Mamba-2 SSD 的 _state_passing_fwd_kernel/_state_passing_bwd_kernel（state-spaces/mamba，mamba_ssm/ops/triton/ssd_state_passing.py）跨 chunk 迭代携带 acc 并在循环内 tl.store：autotune 到 num_stages=3 的配置时约 25%~46% 新进程产出 bit 级一致错误输出；固定 num_stages=1 完全消失（16/16 多进程 PASS、反向梯度 bit 一致）。特征：进程级间歇（同进程重复结果一致、重启翻转）、bit 级一致错误（编译期调度决定而非运行期竞态）、恰为 num_stages>1 配置、前向反向同模式都中。推理库已收同 URL 为 INF-1769（active，含 mamba 上游 PR #1063 证据）；训练侧按 NPU_SCAN 第 9 条独立收录：state_passing kernel 正是 Mamba-2 训练前向/反向路径组件，错值直接进梯度。cross→INF-1769。'
  source: https://github.com/triton-lang/triton-ascend/issues/2662
  behavior: 在 NPU 上训练 Mamba-2（SSD）：前向状态传递与反向梯度 kernel 在 autotune 选中多流水级（num_stages>1）时，约四分之一到近一半的新进程算出每次都一样、但和正确值不同的输出和梯度；同一个进程里反复跑结果稳定，重启训练才可能翻到另一版本，固定 num_stages=1 后彻底正常——典型的「换个进程结果不同」型静默错。
  discovery: 2026-10-24 每日扫描
