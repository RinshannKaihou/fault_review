original:
  mechanism: CANN ops-math DynamicStitch（conversion/dynamic_stitch/op_kernel/arch35/dynamic_stitch_scatter_simd.h:100-130）：blockIdx 按输入张量分段（tensorStartList/tensorEndList），每核负责一段输入张量；y 的写入地址完全由 indices.GetValue(i) 决定，y 地址空间不按核划分；全文件 SetAtomicAdd 计数为 0。不同输入张量中的重复 index 由不同核并发写同一 y 地址 → WAW，结果取决于 MTE3 到达顺序。仅有 index<0 判断、缺 index<dstSize 上界校验，构造非法 index 可越界写（安全影响高于 WAW）。触发条件：indices 同值出现在两个不同输入张量（跨 tensor 重复）+ 两张量被切到不同核（usedCoreNum>1 且数据量足以分核）；同张量内重复（同核）不触发。POC：run_all.sh '2 3 4' 同构散射写验证因果；或在 poc5556_proj 加 mode 6 模拟两核并发写。
  source: https://gitcode.com/cann/ops-math/issues/4226
  behavior: NPU 训练数据管线用到 dynamic_stitch（如稀疏特征合并、tf.data 风格 scatter）且 indices 跨输入张量重复时，输出值非确定：同输入多次运行结果不同（取决于核间写序），训练不可复现、指标抖动；非法 index 时越界写可破坏邻近内存；接口不报错
  discovery: 2026-10-30 每日扫描
