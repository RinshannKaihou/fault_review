original:
  mechanism: 'cann/ops-transformer #6670（2026-10-24，open，A2 910B2 / CANN 9.2.0，aclnn C 直调）。aclnnFfnWorkerBatching 的 FfnArea 结构含 expert_ids_buf/session_ids_buf/micro_batch_ids_buf/layer_ids_buf 四个二级指针；资料调用示例注释写明「框架看不到内层缓冲，不填也能通过 tiling 校验，只在 kernel 访存时暴露为 errcode:(95) MTE 越界，NORM 路径两代实现都会读，必须提供」。实测不填时既非 MTE 越界也无错误码：两段返回 0，输出 actualTokenNum=0（正确配置 72）+ 空 groupList，即静默空批。期望 host/tiling 拒绝或 kernel 显式失败。FfnWorkerBatching 为 MoE/FFN 流水线 worker 批处理算子，训练与推理共用的执行面；静默空批使 token 被无声丢弃。'
  source: https://gitcode.com/cann/ops-transformer/issues/6670
  behavior: 调 FFN worker 批处理算子时如果 FfnArea 里四个二级 id 缓冲没填 device 地址：接口成功返回，但 actualTokenNum 是 0、分组列表是空的——整批 token 被静默当成没活干，下游空转或样本悄悄丢失，连资料承诺的 MTE 越界报错都没有。
  trigger_surface: aclnnFfnWorkerBatching，FfnArea 四个二级指针未填（框架侧易发生）；A2 910B2 / CANN 9.2.0 实测。
