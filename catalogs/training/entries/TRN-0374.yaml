id: TRN-0374
legacy_ids: []
slug: opsnn_logit_grad_double_eps_narrowed_fp32
aliases: []
title: LogitGrad double eps 被窄化 float32 边界判错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: LogitGrad 入口与 tiling 链路
  behavior: 原型声明 double eps 但实现链路按 float32 承载（static_cast<float>(eps)），eps 与 x 的边界比较在比较前被舍入到 float32，次正规 eps 下溢为 0
effect:
  objects:
  - 数值结果
  - 梯度
  detail: eps=x+ulp32/8（double 下严格大于 x）时按资料应输出 0，实测输出与 eps==x 完全相同；eps=1e-320 输出与 eps=0.0 逐字节相同，x=0 时输出 inf 而非 0，返回码 0
  visibility: 静默错误
mitigation:
  detect: 对 eps 邻近 x 的边界点做 fp64 标杆对拍（x+ulp32/8 / 1e-320 两档）
  fix: 待定（issue 建议 eps 全程 double 或把原型/资料改 float 二选一）
