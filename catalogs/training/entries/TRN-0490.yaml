original:
  mechanism: 'cann/ops-math #4096（2026-10-27，closed）+ 修复 PR !6625：sinc 算子在 Ascend 950PR 系列 SIMT kernel（SincSimtCompute，math/sinc/op_kernel/arch35/sinc_dag.h）中原实现仅对输入 x[i]==0.0f 输出 1；当 |x| < 2^-126/π 时 PI*x 下溢为 float32 次正规数（0 或 subnormal），SIMT 除法按 0 处理产生 NaN——而 sinc(x) 在 float32 精度下本应精确等于 1。关联修复 PR https://gitcode.com/cann/ops-math/pull/6625；issue 已 closed。训练侧影响：特征工程/激活（sinc 类）输入含极小值时输出 NaN 扩散进 loss。'
  source: https://gitcode.com/cann/ops-math/issues/4096 + 修复 https://gitcode.com/cann/ops-math/pull/6625
  behavior: Ascend 950PR 上 sinc 算子对接近 0 的次正规浮点输入（|x| 小于约 2^-126/π）输出 NaN 而不是 1.0；无报错，NaN 沿下游计算扩散，训练 loss 出现 NaN 时需逐算子排查才能定位到 sinc。
  trigger_surface: Ascend 950PR 系列 SIMT sinc（CANN master 开发版）；|x| < 2^-126/π 的次正规输入；修复 !6625 前
