original:
  mechanism: 'cann/ops-math #3974（closed，2026-10-26）：ConcatToConcatD 自动融合 pass（conversion/concat_d/op_graph/fusion_pass/concat_to_concatd_fusion_pass.cpp）在输入数超过 kMaxConcatDInputs=512 时把 Concat 拆成多级 ConcatD 树（BuildConcatDTree）。该拆树场景下除顶层节点外，树形中间层节点没有任何手动 desc 处理，保留 ES 默认 desc（dtype FLOAT、空 shape），导致下发给真机后静默计算错误（无报错、结果错误）。环境：代码变更未指定特定硬件/CANN 版本。复现：构建输入数>512 的 Concat(/ConcatV2) 图→触发融合生成多级拆树→中间层携带默认 desc→真机静默错值。期望各层 ConcatD 节点均有正确 dtype/shape/format desc。该缺陷位于 GE 图编译 pass，训练（图模式）与推理同路径；推理库同源条目 INF-2206。issue 状态 closed 但未见关联修复 MR，修复落地版本未核实。'
  source: GitCode issue：https://gitcode.com/cann/ops-math/issues/3974 （closed，含融合 pass 源码路径与复现步骤）；推理库同源条目 INF-2206
  behavior: 训练或推理图模式下，一张含超过 512 个输入的 Concat（如超长专家列表拼接、多分支特征拼接）经过 ConcatToConcatD 自动融合后，整图计算结果错误但没有任何报错；小规模（≤512 输入）同构图完全正常，因此问题只在超宽拼接图上出现，排查时难以想到是融合 pass 的中间节点描述符缺失。
  discovery: 2026-10-27 每日扫描
