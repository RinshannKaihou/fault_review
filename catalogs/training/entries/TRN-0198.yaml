  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 模型 chat template 在 generation prompt 末尾**预填** `<think>`（如 DeepSeek-R1-Distill 官方模板结尾 `<｜Assistant｜><think>\n`）。TRL GRPO 只解码**生成的** token 当 completion 送 reward（`grpo_trainer.py`），模板预填的开标签留在 prompt 侧；而 `think_format_reward` 用锚定正则 `^<think>(?!.*<think>)(.*?)</think>.*$` 要求 completion 以 `<think>` **开头**。开标签被模板吃掉后任何 completion 都无法匹配 → 格式 reward 恒 0.0，无报错无警告。奖励函数的「completion 含完整标记」假设与生成侧 prompt 预填事实脱节。
  source: 'trl #6966（issue 含 CPU 复现脚本 + TRL 自带 `deepseek_r1_distill.jinja` 证据）。https://github.com/huggingface/trl/issues/6966'
  behavior: GRPO 该 reward 通道全程 0；若组内其他 reward 也无区分 → advantage 全 0（叠加 RL-ADV.01 `grpo_group_std_zero`），格式奖励静默失效。训练不 crash；指标上 reward 恒 0 易被误读为「模型没学会格式」而非「奖励死区」。
  discovery: 2026-08-29 每日扫描
