  mechanism: 'cann/ops-math #3946（2026-10-25，open，A3 910_93 / CANN 9.2.0 / master 584b2ea6）。aclnnDivMod 在 self/other/out 均 DOUBLE 且 mode=0（真除）时输出与 fp32 结果逐位相同、与 fp64 差 1e-8 量级；mode=2（floor）时 DOUBLE 正确。源码定位 aclnn_div.cpp:240-250 CompatibleInferDivModeDtype 的 FLOOR 分支保留 DOUBLE、其余 mode 进入不含 DOUBLE 的白名单落入 DT_FLOAT——是 mode=0/1 分支的类型提升策略丢精度，不是平台不支持 DOUBLE。资料 npu=950 分组将 DOUBLE 列为支持类型且未声明降级。'
