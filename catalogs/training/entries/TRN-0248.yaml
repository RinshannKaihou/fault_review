  mechanism: 'verl VeOmni 0.1.11 的 chunked log-probability backward 从 **saved reshaped hidden states 读 `requires_grad`** 决定梯度流，storage-sharing 别名的梯度标志未跟随 `ctx.needs_input_grad`——decoder 梯度可被静默丢弃，log-prob/entropy 计算链失真。修复（PR #8108）= 委托给 released backward、别名梯度标志对齐 `ctx.needs_input_grad`（仅 VeOmni 0.1.11、一阶梯度）。'
  source: 'verl PR #8108（2026-10-04；CPU 回归 10 过：released-kernel 数学对 dense oracle、PyTorch 2.13.0 + Transformers 5.12.1；CUDA fused-CE 与分布式 FSDP2 未重跑——报告自述）。https://github.com/verl-project/verl/pull/8108'
  behavior: 无 crash——RL 打分阶段的 decoder 参数拿不到（部分）梯度：策略/价值头前的表征学习静默退化，loss 与指标正常。与 RL-RO.19/25（rollout 权重同步族）不同域：这边是**训练侧 backward 图的梯度流断裂**；与 ACT.06/KER.17（saved-state 语义与 autograd 记账失联）同病根——「保存的中间态不携带正确的梯度标志」。仅 CPU 侧闭合、CUDA 路径未验证，置信度 documented。截至 2026-10-10 open。
