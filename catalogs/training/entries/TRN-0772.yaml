id: TRN-0772
legacy_ids: []
slug: lightning_indexer_grad_empty_query_leaves_dkout_unwritten
aliases: []
title: LightningIndexerGrad 空 query 早退不写 dkOut
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnLightningIndexerGrad
  behavior: query 为空（S1=0）时两段接口直接返回 0、workspaceSize=0，不构建任何写 dkOut 的节点；而 dkOut 形状只由 key 决定，本身非空
effect:
  objects:
  - 梯度
  - 模型权重
  detail: dkOut [1,2048,1,128] 共 262144 个元素保持调用方预填的未初始化显存（双金丝雀 100% 残留），随后作为 key 梯度送进优化器
  visibility: 静默错误
mitigation:
  detect: 对非空输出缓冲预填两种互斥金丝雀位型，用 S1=0 的空 query 调一次并回读；同探针在 S1=2 时应整块写出
  fix: 待定（issue open 2026-11-17；建议首段对 S1=0 返回 161002，或在早退前把 dkOut 零化）
