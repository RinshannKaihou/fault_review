original:
  mechanism: 'cann/ops-transformer issue #7743（2026-11-17，open）。aclnnLightningIndexerGrad 在 query 为空张量（S1=0）时走空输入早退：GetWorkspaceSize 与执行两段都返回 0，workspaceSize=0，host 侧没有建任何写 dkOut 的节点。但 op_host/lightning_indexer_grad_infershape.cpp L117 `*dkShape = *keyShape;` 决定 dkOut 形状只由 key 决定、与 query 无关，因此 dkOut=[1,2048,1,128] 仍有 262144 个元素需要写。资料 docs/aclnnLightningIndexerGrad.md L385 写明 S1 取值 1~128K，越界应在首段返回 161002；即便按空输入早退处理，也必须把非空输出写出来。实测（Atlas A2 910B2、CANN 9.2.0、ops-transformer 14d022b1）：合法对照 S1=2 时 canary_left=0.000、workspace=173018624，kernel 真跑并整块写出；S1=0 时两组互斥金丝雀（0xDEADBEEF / 0xC0FFEE01）均 100% 原样保留。与同接口 #7325（sparseMode=3 且 S1>S2 时死行 dweights 未零化）根因和触发条件不同。'
  source: https://gitcode.com/cann/ops-transformer/issues/7743
  behavior: 训练或推理里 indexer 的 query 因为动态 batch/序列退化为空（S1=0）时，算子返回成功、日志无异常，但 key 的梯度 dkOut 整块是未初始化显存里的脏数据；它被直接送进优化器，权重在后续 step 才表现出 loss 抖动或发散。用预填金丝雀回读可直接看到 100% 残留。
  trigger_surface: cann/ops-transformer aclnnLightningIndexerGrad，query 的 S1=0（空张量）而 key 非空；Atlas A2 910B2 / CANN 9.2.0 实测。
  discovery: 2026-11-17 每日扫描
