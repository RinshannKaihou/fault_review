  mechanism: ms-swift 的 Megatron 并行 ckpt reader patch 里 `concurrent.futures.wait()` 只等 worker 不取结果——读 shard 的异常（缺数据文件、shard 损坏）被吞掉，reader 无条件返回 successful `torch.futures.Future`：`dcp.load()` 报成功，未加载的 tensor 停在 sentinel 值。修复 = wait 后逐 worker 取 result，把异常以 `CheckpointException` 传给 caller。
  source: 'ms-swift PR #10045（已合并；CPU DCP save/load + `MCORE_READER_MAX_WORKERS=2` 复现：缺第二个 tensor 数据文件时旧代码 load 成功、tensor 保持 sentinel；注入 `RuntimeError(''corrupted shard'')` 同样被吞）。https://github.com/modelscope/ms-swift/pull/10045'
  behavior: resume「成功」但部分权重从未从盘上读入——训练从 sentinel/旧值出发静默跑偏，无 crash 无日志。与 CKPT.05（strictness 吞 unexpected key）同为加载器「自报成功」家族：那边吞键、这边吞异常；与 CKPT.03（missing key 随机初始化）下游同型。
