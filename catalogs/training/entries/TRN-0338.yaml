id: TRN-0338
legacy_ids: []
slug: mindspeed_te_rowparallel_noseq_ignores_gaf
aliases: []
title: 非序列并行 RowParallel 忽略梯度累积融合
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspeed
    component: RowParallelNoSeq wgrad
  behavior: 非序列并行分支 RowParallelNoSeq 的 forward 未保存 gaf，backward 恒走分离 matmul；只有序列并行分支才按 gaf 走 fp32 融合累加。
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: gaf=True 时 linear_proj/linear_fc2 的 wgrad 由 aclnnMatmul 产出 bf16 中间张量再累加，与融合路径的 fp32 累加差约 1e-4，经优化器传播后出现可见精度发散；另 patch 对 mcore 0.16 间接引用未生效。
  visibility: 静默错误
mitigation:
  detect: 对比 gaf=True/False 两条路径同名参数的 wgrad 范数与差异量级；或检查 TERowParallelLinear patch 是否真的替换了 TESpecProvider 返回的类。
  fix: issue 建议 RowParallelNoSeq 对齐 RowParallelSeq：forward 保存 ctx.gradient_accumulation_fusion、backward 增加走 npu_matmul_add_fp32 的分支；issue 已 closed，正文未给出合入 PR（未核实）。
