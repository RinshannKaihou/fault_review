id: TRN-0807
legacy_ids: []
slug: megatron_tracker_empty_file_restart_no_train
aliases: []
title: Megatron tracker 半写空文件致重启不训练
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: megatron-lm
    component: checkpointing tracker
  behavior: rank0 每次保存后非原子重写 tracker、覆盖 latest_train_state.pt；0.20.1 的 read_metadata 读到空 tracker 时打印 ERROR 并 sys.exit()。
effect:
  objects:
  - 可用性/进度
  - 指标/日志
  detail: 0.20.1 上 tracker 为空时每次重启直接退出、11/12 次退出码 0，调度器当成功；main 上空 latest_train_state.pt 每次重启失败，--save-retain-interval 下后续保存报 ValueError。
  visibility: 报错
mitigation:
  detect: 保存后检查 tracker 与 latest_train_state.pt 的非空/可解析性；把作业退出码 0 但 step 未前进纳入健康检查
  fix: 'draft PR #9717（open，2026-11-23）：temp+fsync+os.replace 原子写 tracker，read_metadata 不可读时 exit 1，--save-retain-interval 解析失败显式报错'
