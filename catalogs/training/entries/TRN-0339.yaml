original:
  mechanism: 'MindSpeed-RL issue #162（2026-07-08 提，已 closed）：按 #149 的模式用两台服务器跑 GRPO（TP=2 + DP=4），发现各 rank 在同一 step 的 loss 差距很大（最大 15%）。定位到 reward 归一化：伪代码里 rewards = compute_rewards(...) 每个 rank 只有局部数据，mean = rewards.mean() / std = rewards.std() 都只算本 rank，然后 advantages = (rewards - mean) / std，于是各 rank 的归一化基准不同。GRPO 的 reward 是 per-prompt 算的，某个 rank 的 prompt 恰好偏难或偏易时，本地 mean/std 与全局不一致，导致 update 时同一个 prompt-response pair 在不同 rank 上算出的 loss 不同。报告者指出正确做法是先 allgather 所有 rank 的 rewards 再算全局 mean/std，并说明这在 GRPO 的参考实现（veRL/OpenRLHF）里有做，MindSpeed-RL 的版本可能漏了；建议在 grpo_trainer.py 的 loss 计算前加 gathered_rewards = all_gather(rewards) 后按全局统计归一化。'
  source: https://gitcode.com/Ascend/MindSpeed-RL/issues/162
  behavior: TP=2 + DP=4 双机跑 GRPO 时，同一个 step 内各 rank 打印的 loss 差距很大（最大 15%），训练照常推进、不报错不出 NaN。各 rank 的 reward 均值/方差互不相同，同一个 prompt-response 对在不同 rank 上算出的 loss 不一致，梯度方向被拉偏，最终策略提升明显弱于单机或小 TP 配置。
  trigger_surface: GRPO + TP>1（reward 归一化跨 rank 同步缺失）
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
