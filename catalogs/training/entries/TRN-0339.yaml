title: GRPO reward 归一化未跨 rank 同步致 advantage 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: mindspeed-rl
    component: GRPO reward 归一化的跨 rank 同步
  behavior: GRPO reward 归一化未先 allgather 所有 rank 的 reward，仅用本 rank 局部 reward 计算 mean/std。
effect:
  objects:
  - 训练信号
  - 训练轨迹
  detail: TP=2+DP=4 双机 GRPO 时同一 step 各 rank loss 差距最大 15%；rank 上 prompt 偏难或偏易时本地 mean/std 偏离全局，同一 pair 在不同 rank 上的 loss 不同，方向被拉偏但无报错。
  visibility: 静默错误
mitigation:
  detect: 同一 step 打印各 rank 的 reward mean/std 与 advantage 均值做跨 rank 比对；或让单 rank 与全局归一化的 advantage 对照。
  fix: issue 建议先 all_gather(rewards) 得到 [dp_size*batch] 再算全局 mean/std（veRL/OpenRLHF 参考实现如此）；issue 已 closed，正文未给出合入 PR（未核实）。
