id: TRN-0511
legacy_ids: []
slug: torchtitan_loss_parallel_confident_target_zero
aliases: []
title: torchtitan 并行 CE 确信标签 loss 梯度归零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: torchtitan
    component: 并行 CE 目标计入归约和
  behavior: log_softmax 构造把目标自身 exp(0)=1 计入 all-reduce 求和：margin 超 ~16.6 后 fp32 和舍入为 1，per-token loss 与目标梯度成精确 0，非目标梯度保留。
effect:
  objects:
  - 训练信号
  - 梯度
  detail: compute_logprobs 以 reduction=none 复用同一 Function，RL 中部分高确信 token 的 logprob 恒 0；TP>1 与 TP=1 的非 TP 路径（F.cross_entropy 未改）均含该舍入。
  visibility: 静默错误
mitigation:
  detect: 高置信样本（margin>16.6）检查 per-token loss 是否精确 0、梯度是否和为零
  fix: 修复 PR https://github.com/pytorch/torchtitan/pull/5624 仍 open 未合入（2026-10-30 核对）
labels:
  stage:
  - shared
  confidence: documented
  coverage: var
  discovered: '2026-10-29'
remarks: 与 TRN-0451（verl logprobs_from_logits/Triton fused CE 同一 1+exp(-m) 舍入机制）共享机制：logprob 计算把标签自身 exp(0)=1 计入归约和、margin>16.6 后 fp32 舍入；不同栈（torchtitan loss_parallel TP 路径）与实现（all-reduce 归约内）
