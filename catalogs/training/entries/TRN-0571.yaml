aliases: []
title: aclnnSilentCheck 首步漏报与零值状态冻结
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: SilentCheckV2 判定与状态更新
  behavior: stepRef==0 分支（V2 语义错误下沉到 V1 kernel）跳过全部阈值判定一律返回正常并抹平 sfdaRef 历史；val==0.0 时跳过状态更新返回成功但状态冻结。
effect:
  objects:
  - 指标/日志
  detail: 910B3：stepRef=0 时 val=5000（阈1000）应 L1 得 result=0，inf/nan/1e9 阈全放行，stepRef=1 时恢复；val=0.0（含 -0.0）时入参 [70,70,400]/7 出参原样未变（资料要求 [0,0,400]/8），1e-45 正常更新。
  visibility: 静默错误
mitigation:
  detect: 首步注入已知超阈/NaN 值验证 result 是否仍 0；stepRef=0/1 同输入对照；检查 val=0 调用后 sfdaRef/stepRef 是否前进。
  fix: 待定（两 issue open：#4364/#4367；修复 PR !6956 仅修 result 空指针，判定分支与状态冻结未见修复 MR）
labels:
  stage:
  - shared
  confidence: documented
  coverage: NEW
  discovered: '2026-11-01'
remarks: 训练面：SilentCheck 是 CANN 高可靠训练 ASD 检测算子（cThreshL1/L2 阈值判定），训练首步（stepRef 从 0 起）的 inf/nan/超阈全部漏报、历史 min/max 被抹平——监控首步盲区+状态污染，属 OBS 面（监控骗过）兼观测算子缺陷。cross INF-2328/INF-2329 为推理库同 URL 两条；训练侧重判定训练监控首步盲区。
