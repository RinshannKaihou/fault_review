original:
  mechanism: 'cann/ops-math #4364 + #4367（2026-10-31，均 open；Ascend910B3/CANN 9.2.0、C++ 两段式直调、master 0a6f2a72a）。#4364：aclnnSilentCheck 在 stepRef==0 时跳过全部阈值判定，val 一律判正常（result=0）并返回成功——实测 val=5000/cThreshL1=1000 应 L1 得 0、val=500/cThreshL1=1000 应 L2 得 0、inf/-inf/nan/1e9 阈全放行；同输入 stepRef 改 1 立即恢复。该分支还把 sfdaRef 重置成 [val,val,val]：入参 [70,200,400]+val=5000 → [5000,5000,5000]（stepRef=1 时为 [5000,70,5000]）。V1 资料判定条件对 stepRef 无门控（该分支语义属 V2 资料 silent_check_v2.md:30），判定逻辑在 AICPU kernel SilentCheckV2（libcpu_kernels.so）。#4367：val==0.0（含 -0.0）时完全不更新 sfdaRef/stepRef 仍返回成功——实测入参 [70,70,400]/7 出参原样未变（资料要求 [0,0,400]/8），1e-45 次正规数正常更新，精确判零早退；cThreshL2=-1 时 val=0 仍能正确 result=2，判定本身不受影响，仅状态冻结。'
  source: https://gitcode.com/cann/ops-math/issues/4364 + https://gitcode.com/cann/ops-math/issues/4367 （均 open，2026-10-31；含判定矩阵、状态更新对照表与源码锚点）
  behavior: 训练监控用 CANN SilentCheck（ASD 静默错误检测）时：第一步（stepRef=0）注入的 NaN/Inf/超阈异常全部返回「正常」不告警，第二步起才恢复检测——首步真异常静默漏检；且首步还会把历史 min/max 状态抹平成当前值。另一路：检测值恰为 0.0 时调用返回成功但内部计数器与历史窗口完全冻结，后续阈值跳变判定建立在错误历史上。监控曲线看不到任何异常。
  trigger_surface: Ascend 910B3 + CANN 9.2.0；aclnnSilentCheck（ASD 训练静默错误检测）；训练首步（stepRef=0）与 val==0.0 输入。
  discovery: 2026-11-01 每日扫描
