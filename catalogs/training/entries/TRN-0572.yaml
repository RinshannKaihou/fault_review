title: aclnnScatterNdUpdate 形状约束不校验越界读静默写入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: scatter_nd_update 约束校验缺失
  behavior: 对资料明写的 updates 形状与索引深度 a≤rank 两条约束不做任何校验：updates 偏小时把越界读到的值写进 varRef（静默脏写），a 超限下沉为执行期 507057。
effect:
  objects:
  - 数值结果
  - 模型权重
  detail: 910B3 实测：updates 合法时正确；[2]（偏小）时 varRef 被写入越界读到的值（静默脏写）；indices [3,2]（a=2>rank=1）两段返回 0 直到流同步才 507057。
  visibility: 静默错误
mitigation:
  detect: 调用前手动断言 updates.shape 与 indices/varRef 推导一致；写后读回与 CPU scatter_nd 参照对拍。
  fix: 待定（issue open：期望第一段 161002 拒绝，未见修复 MR）
