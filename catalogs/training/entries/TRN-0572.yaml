original:
  mechanism: 'cann/ops-nn #7858（2026-10-31，open；Ascend 910B3、CANN 9.2.0、ACLNN 两段式直调、master 稀疏检出 index/scatter_nd_update）：aclnnScatterNdUpdate 第一段 GetWorkspaceSize 对资料明写的「updates 形状必须等于 indices.shape[:-1] + varRef.shape[a:]」与「a ≤ varRef.rank」两条约束不校验。实测：varRef=FP32[7]（1..7）、indices=INT64[3,1]={0,1,2}——updates=[3] 合法正确；[19]（偏大）与 [2]（偏小）两段均返回 0；偏小场景把越界读到的值静默写进 varRef（updates 数据被错误解释，varRef 内容变成非预期脏值，无任何错误码）；indices=INT64[3,2]（a=2 > varRef.rank=1）两段返回 0 直到流同步才暴露设备侧 507057。'
  source: https://gitcode.com/cann/ops-nn/issues/7858 （open，2026-10-31；含自包含 C++ 探针与三种 updates 形状对照）
  behavior: NPU 训练用 ScatterNdUpdate 就地更新（参数/优化器状态/数据散写）时，若 updates 形状与约束不符（如偏小），接口返回成功、目标张量被写入从越界地址读到的脏值——持久状态被静默污染，无报错无 NaN；索引深度超限则拖到流同步才报 507057。同代码 CPU 会在校验层拒绝。
  trigger_surface: Ascend 910B3 + CANN 9.2.0；aclnnScatterNdUpdate updates/indices 形状违约；就地散写更新路径。
  discovery: 2026-11-01 每日扫描
