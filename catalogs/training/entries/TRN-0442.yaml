  behavior: 稀疏注意力 indexer 的 softmax 统计输出在 BSND 布局下、当某 batch 实际 query 长度小于 S1 时，尾部元素完全不被写：预填的 NaN 原样保留，接口却返回成功；同一参数换 TND 布局尾部会正确补 0。
  trigger_surface: aclnnDenseLightningIndexerSoftmaxLse，BSND layout + actualSeqLengthsQuery[b]<S1；A2 910B2 / CANN 9.2.0 实测。
