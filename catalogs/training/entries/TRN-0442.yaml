original:
  mechanism: 'cann/ops-transformer #6711（2026-10-25，open，A2 910B2 / CANN 9.2.0 / master 5d750997）。aclnnDenseLightningIndexerSoftmaxLse 在 BSND layout 且 actualSeqLengthsQueryOptional[b]<S1 时，softmaxMaxOut/softmaxSumOut 的 [asq[b],S1) 区间完全不写：出参预填 0x7fc00001 NaN，B=1,S1=S2=16,N1=8,D=128,fp16 下 asq=8 → 8/16 NaN、asq=1 → 15/16 NaN，两段返回 0。资料声明输出形状由 queryIndex 的 S1 决定、与 asq 无关，每个元素应有确定值；TND 路径 ResetInvalidOutputZero() 已补零，证明补齐到声明形状是既定语义，BSND 分支缺失。'
