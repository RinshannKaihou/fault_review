original:
  mechanism: 'DeepSpeed #8884（2026-10-22，open，deepspeed 0.19.9/master / torch fused AdamW / transformers 4.57.6、5.x）。universal checkpoint resume（load_universal=true）+ fused/capturable AdamW 第一步报 RuntimeError：state_steps 在 CPU 而 param 在 cuda。定位 base_optimizer.py:373（master/0.19.9）load_hp_checkpoint_state_from_checkpoint_dir 直接写 optimizer.state[hp_param][''step'']=steps[0]（CPU 张量），绕过 torch load_state_dict 的 _process_value_according_to_param_policy（会把 step 迁到参数设备）。同一循环还把保存的 param_group 设置写回（param_group[key]=value），fused=True 随 ckpt 还原——resume 时换非 fused 优化器也躲不开。torch>=2.8 transformers 在 DeepSpeed config 无 optimizer 段时默认 adamw_torch_fused，HF Trainer 开箱即撞。单卡 repro 脚本完整。'
  source: https://github.com/deepspeedai/DeepSpeed/issues/8884
  behavior: 从 universal checkpoint 恢复训练时，如果优化器是 fused AdamW，恢复后的第一个 optimizer.step() 直接报设备不一致错误（step 状态留在 CPU）：训练中断在 resume 后第一步。想换普通 AdamW 绕过也不行——fused 标志会随检查点一起写回；新版 transformers+HF Trainer 默认就用 fused，开箱即触发。
  trigger_surface: DeepSpeed universal checkpoint（load_universal=true）+ torch fused/capturable 优化器（含 transformers 默认 adamw_torch_fused）；deepspeed 0.19.9/master。
  discovery: 2026-10-26 每日扫描
