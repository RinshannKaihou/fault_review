  mechanism: 训练进入高置信阶段后，正确类 logit 与其余 logit 之差超出浮点吸收误差阈值 → 正确类梯度被舍入为恰好 0、错误类梯度仍非零 → 破坏类间梯度零和约束 → 分类器均值与特征均值指数增长的正反馈（Numerical Feature Inflation）→ Slingshot 式 loss spike。
  source: '"Grokking or Glitching? How Low-Precision Drives Slingshot Loss Spikes", arXiv:2605.06152。https://arxiv.org/abs/2605.06152'
