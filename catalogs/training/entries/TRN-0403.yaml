title: ms-swift GRPO+Liger 多模态双跑挂起
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: ms-swift
    component: GRPO Liger 前向重定向
  behavior: Liger 前向重定向：hook 先在所有 rank 转好 inputs_embeds，lambda 又用原始 pixel_values 再跑一次，vision encoder 被 rank 间不一致地执行两遍。
effect:
  objects:
  - 可用性/进度
  detail: 混合 text/image batch 下 image rank 两次进 vision encoder、text rank 已前进，默认超时下静默挂起；短超时后 watchdog 显示 4 rank 卡同一 allgather 序号但张量大小两两分组（1769472 vs 24）。
  visibility: 挂起
mitigation:
  detect: 首 step 后 rank 间 vision encoder 调用计数对账；watchdog NumelIn 差异模式识别；小 ddp_timeout 冒烟。
  fix: 待定（issue open 2026-10-22，根因链定位至 _forward_redirection 双跑；规避：--use_liger_kernel false）
