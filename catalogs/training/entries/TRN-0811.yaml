original:
  mechanism: aclnnRecurrentGatedDeltaRule 的资料允许 0<Dk≤512、T>0 且 T≤BlockNum，但没有给 T×Dk 的上界。kernel 把 q/k 放进 4K 的 UB 缓冲，T×Dk>4096 时放不下整条序列，实现没有分段/回读，尾部 token 的上一步状态从缓冲区残留位置读取。host 侧 CheckShape 不做该组合校验，两段接口都返回 0。边界实测：16×256=4096 PASS、17×256=4097 FAIL、64×64 PASS、65×64 FAIL、8×512 PASS、9×512 FAIL；T=12、Dk=512、Nv=2、Dv=64 时 441/1536 元素超容差，max|out| 1e21 量级，fp64 参考 0.0476。对照组 0/1024 超差，golden 与文档公式互差 0.4%，排除夹具问题。
  source: 'cann/ops-transformer issue #8502（open，2026-11-24；Ascend 950PR / CANN 9.3.0.P009 / abec8775，含边界扫描与 fp64 参考）https://gitcode.com/cann/ops-transformer/issues/8502'
  behavior: 线性注意力/门控 delta 网络用 RecurrentGatedDeltaRule 处理较长序列时，前向不报错、返回码 0，但尾部 token 的输出出现极大错值（实测 max|out| 可达 1e21，fp64 参考只有 0.0476），441/1536 个元素超容差；序列较短（T×Dk≤4096）时完全正常，因此短跑和单元测试发现不了，训练 loss 会在长序列 batch 上突然爆掉或持续偏移。
  discovery: 2026-11-26 每日扫描
