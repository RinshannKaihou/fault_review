title: RecurrentGatedDeltaRule 长序列尾部读陈旧值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: RecurrentGatedDeltaRule
  behavior: q/k 的 4K UB 缓冲区放不下整条序列时 kernel 未分段，尾部 token 读到上一段残留数据；host 侧不校验 T×Dk 上限。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 合法 shape（Dk≤512、T>0）下 T×Dk=4097 起尾部错值：T=12/Dk=512 时 441/1536 元素超容差、max|out| 达 1e21（fp64 参考 0.0476）；4096 边界内 0/1024 超差，两段均 rc=0/0。
  visibility: 静默错误
mitigation:
  detect: 按 T×Dk 在 4096 边界两侧做 fp64 对照扫描；检查 aclnn 返回码与尾部 token 的误差分布
  fix: '待定（issue #8502 open，2026-11-24；未见修复 MR）'
