  mechanism: 'cann/ops-math #4106（2026-10-27，open）：aclnnPdistForward 出参字节数非 32B 对齐时尾部越界写（最多 20 字节）。批次缓存正文只含标题与摘要级信息（body 未完整入库），按标题与既有同仓 32B 对齐缺陷家族（InplaceApplyAdagradV2 !12905 的 UB→UB DataCopy 32B 向下取整丢尾、acos_grad #4087 块参数窄化）一致的模式：搬运按 32B 块边界处理、尾块处理缺失。pdist_forward 输出元素数 = N(N-1)/2 可轻易造出非 32B 对齐总长。训练侧影响：距离矩阵/对比学习路径 out 后邻接分配的张量被静默写坏。'
