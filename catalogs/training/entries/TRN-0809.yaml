original:
  mechanism: ms-swift 的 DAPO 动态采样过滤器在 GRPOTrainer.compute_std() 与 MegatronGRPOTrainer._dynamic_sampling() 中只保留 std(sum(w*r))>0 的组，该判据在 group/batch/none/rloo/reinforce_plus_plus 等估计器下确实等价于 advantage 非零；但 scale_rewards='gdpo' 的 advantage 不是原始加权和的函数：先按每个 reward 在组内归一化，再加权求和，最后做 batch 白化。构造例（3 个二值 reward、权重相同、4 个 completion，R 全为 1）std(R)=0 被整组丢弃，而 compute_advantages(scale_rewards='gdpo') 给出 [+0.866,+0.866,-0.866,-0.866]，在 4 类 softmax 头上对 logits 的梯度为 [-0.866,-0.866,+0.866,+0.866]、范数 1.732，是真实的策略梯度。反向错配也存在：不同尺度的反相关 reward 使 std(R)=2.3 被保留而 GDPO 信号≈0。模拟中 F=3/4 个 reward、num_generations=4 时约 1.7%/1.3% 的组被误杀；one-hot 指示 reward 下 100% 混合组被误杀，预算永远填不满，dynamic_sample 变成空转加浪费 rollout。
  source: 'ms-swift issue #10626（open，2026-11-25；main d5253cbc5，CPU fp32/fp64 对照，含最小 repro 表）https://github.com/modelscope/ms-swift/issues/10626'
  behavior: scale_rewards='gdpo' 与 dynamic_sample 同开时训练无报错，但一些明明有学习信号的组被当成 std=0 丢弃：构造的 4 个 completion 原始 reward 和全为 1，被整组替换，实际 GDPO advantage 是 ±0.866。用 one-hot 类 reward 时几乎所有混合组都被误杀，重采样预算耗尽后又回退原 batch，dynamic_sample 形同虚设，训练批次分布被按原始 reward 和而不是训练目标筛选。
  discovery: 2026-11-26 每日扫描
