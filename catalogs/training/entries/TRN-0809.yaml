id: TRN-0809
legacy_ids: []
slug: msswift_gdpo_dynamic_sample_drops_signal_groups
aliases: []
title: GDPO dynamic_sample 按原始 reward 和错杀组
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: ms-swift
    component: GRPO 动态采样过滤器
  behavior: DAPO 过滤器以 std(sum(w*r))>0 判组是否有梯度；GDPO 先按各 reward 组内归一化再加权，原始加权和 std=0 不代表 advantage 为 0。
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: 3 个二值 reward、4 个 completion 的构造例中 R 全为 1（std=0）被整组丢弃，而 GDPO advantage 为 ±0.866、logits 梯度范数 1.732；one-hot reward 下 100% 混合组被误杀，dynamic_sample 退化为空转。
  visibility: 静默错误
mitigation:
  detect: 对 GDPO 配置比较过滤判据与 compute_advantages 的实际输出：保留组的 std(R) 可为 0，丢弃组的 advantage 可非 0
  fix: '待定（issue #10626 open，2026-11-25；issue 给出按估计器重定义过滤判据的方向，未见 PR）'
