title: MsaIndexScore N2>1 只读 KV head0 输出静默错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnMsaIndexScore KV hea
  behavior: key 的 N2>1 时算子对所有 query head 都只读取第 0 个 KV head，未按 n2=n1/(N1/N2) 取对应 KV head，输出对 head1 以后的数据完全不敏感。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: GQA/MQA 形态（N2>1，每 KV head 服务多个 query head）调用 MsaIndexScore 时，只改 head1 及以后的 KV 数据输出逐位不变（max|diff|=0 bitwise），其余 head 的信息全部丢失；接口返回 0 无报错。训练侧该算子输出直接作为前向结
  visibility: 静默错误
mitigation:
  detect: 扰动单个非 0 KV head 数据检查输出是否变化（bitwise 对照）；与 CPU GQA 参考对拍。
  fix: 待定（issue open，未见修复 MR）。
