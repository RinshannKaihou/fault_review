original:
  mechanism: 'MindSpeed-LLM issue #983（2025-12-04 提，已 closed）报的是 2.2.0 分支：数据处理加 --append-eod 做 packing，训练脚本 MBS=4，训完模型精度异常（乱说话）；MBS 改回 1 后正常。发帖者补充 ps 背景：2.1.0 分支下同样加 --append-eod，MBS>4 时精度异常、MBS=1 正常，并在 2.1.0 上给出更细的对照——qwen3-8B 预训练、同数据、MBS=4/GBS=128/seq=8196/tp8pp1/16 台机器，第一个 step loss 飞到 6 上下（正常 2 上下），一个 epoch 后直接乱码；MBS=1 同配置首 loss 约 2、一个 epoch 后回答正常。环境 910B。issue 正文只锁定「MBS>1 才会触发、MBS=1 不复现」这一观测依赖，没有给出代码级根因（packing 之后 per-sample attention reset / position id / loss mask 随 MBS 变化的哪一处失效未在原文确认），后续也没有贴出修复补丁。收录按报告层面的机制与对照实验，不外推具体代码行。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/983
  behavior: 同一份数据、同一个 qwen3-8B 预训练配置，只把 micro-batch-size 从 1 改成 4（开 --append-eod packing）：第一个 step 的 lm loss 就从 2 左右变成 6 左右，训练一个 epoch 后模型直接说不成句；MBS=1 的同配置则 loss 正常、回答正常。没有报错、没有 NaN，只有 loss 起点偏高与最终质量崩坏，很容易被当成学习率或数据问题。
  trigger_surface: packing（--append-eod）+ micro-batch-size > 1（预训练 / SFT 数据管线）
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
