  meta: 'stage: `shared` · Cov: `var:sp_gradient_avg_divisor_splits_across_zero_paths` · 置信度 `verified`'
  mechanism: DeepSpeed ZeRO++ `qgZ` 跨节点路径中，`all_to_all_quant_reduce` 返回的 2-D **权重梯度**按「每节点设备数 L」放大，而 1-D 梯度（bias、norm）走 `reduce_scatter_coalesced` fallback 返回真平均。`quantized_reduction` 先对 L 个本地 rank 求和、末行再对 N 个节点求和、却**只除以 N**：`sum_n sum_l g / N = L · mean(g)`。修复 = 除以 `global_world_size = L·N`，与 fallback 的预除对齐。
  source: 'DeepSpeed PR #8729（2026-10-02；4-rank 两级路径 gloo repro：2 节点 × 2 设备、rank r 持 `−(r+1)`，修复前权重返回 −5.0、bias −2.5，修复后均 −2.5）。https://github.com/deepspeedai/DeepSpeed/pull/8729'
  behavior: 无 crash——多节点 qgZ 配置下**每个权重参数的有效学习率被放大 L 倍**（bias/norm 不放大）：同一 step 内参数间更新尺度分裂，权重量级随节点数漂移，训练曲线无专属信号。与 PAR.19（SP>1 下 ZeRO 梯度平均除数随归约路径分叉）同族「**除数取决于走了哪条归约路径**」：那边同一参数随 ZeRO stage 分裂、这边同一 step 内 2-D/1-D 参数分裂；与 PAR.16/PAR.17（aux 梯度 ×DP）同打击「梯度尺度因子错误」。修复截至 2026-10-10 仍 open。
  discovery: 2026-10-10 每日扫描
