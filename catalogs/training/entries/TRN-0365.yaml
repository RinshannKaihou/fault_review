id: TRN-0365
legacy_ids: []
slug: opsnn_cegrad_label_smoothing_uninit_out
aliases: []
title: CELossGrad label_smoothing 非 0 返回未初始化内存
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: CELossGrad 写回路径
  behavior: kernel 在 labelSmoothing!=0 时无任何输出写回与拒绝路径，外层 CopyOutLog 把未初始化 UB 数据当结果写出；tiling/aclnn 层均未校验该取值。
effect:
  objects:
  - 梯度
  detail: labelSmoothing!=0 的 CE 反向输出为随机字节，同输入多次调用结果互不相同；直接污染训练梯度。
  visibility: 不可复现
mitigation:
  detect: 出参预填哨兵值（如 12345）重跑比对；同输入连续 3 次调用比对原始字节是否一致。
  fix: 待定（issue open，期望非 0 时返回 161002 或实现 smoothing 项）
