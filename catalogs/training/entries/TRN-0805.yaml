title: HybridEngineRollout 从词表分片取 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: deepspeed
    component: HybridEngineRollout
  behavior: 输入embedding与输出头tied且未设tensor_parallel.vocab_parallel_lm_head时，AutoTP将lm_head换为gather_output=False的词表并行层，解码复用时每rank取本地下标。
effect:
  objects:
  - 训练信号
  - 输出内容
  detail: TP>1 且输入输出 tied 时 rollout 正常返回，但 token 只来自 rank0 词表前缀，其余 rank 记录分片下标；温度>0 且种子按 DP rank 偏移时，同 TP 组会采出不同 token。
  visibility: 静默错误
mitigation:
  detect: 对比 rollout 返回 token 与 gather 后全词表 logits 的 argmax/采样结果；检查 VocabParallelLinear 的 gather_output 与各 rank 记录 token 的一致性
  fix: 'issue #9158 于 2026-11-25 closed（completed）；修复 PR 未核实'
