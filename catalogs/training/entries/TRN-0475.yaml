original:
  mechanism: 'cann/ops-transformer #6785（2026-10-27，Ascend 950PR/DAV_3510、CANN 9.2.0-beta.2、ops-transformer master attention/block_attn_res_prepare，目录最近改动 2026-10-23）：aclnnBlockAttnResPrepare 在 blockRes 全 0（合法输入）且 eps 取 fp32 次正规数时三个输出全 NaN。资料对 eps 约束只有「必选，必须为有限正数」，1e-40 满足并通过第一段 double 校验（op_api/aclnn_block_attn_res_prepare.cpp 的 `if (!std::isfinite(eps) || eps <= 0.0)`）。实测分界：eps≥1.2e-38（正规数）正常；1.1e-38/1e-40/1e-45（次正规）三输出全 NaN 且两段返回 0；eps=1e-46 下溢为 0 时第一段返回 0 且 workspaceSize=0（不报 161002）、第二段 561103；eps=0 第一段 161002。报告者带完整 C++ 两段式复现探针。调用方拿到 ACLNN_SUCCESS 无法感知，NaN 沿下游 softmax/残差累加扩散。推理库 INF-2221 已按同源收推理侧；本条按训练侧（BlockAttn 残差预处理在训练前向路径的使用）收录。'
  source: https://gitcode.com/cann/ops-transformer/issues/6785
  behavior: 使用 aclnnBlockAttnResPrepare 且 eps 设为 1e-40 一类次正规正数（如自适应归一化配置自动算出的极小 eps）时，算子返回成功但 numerator/logitMax/expSum 全 NaN，随后 softmax/残差路径全部变 NaN；两段接口都返回 0，无告警无报错，只有输出侧 NaN 检查能发现。
  trigger_surface: CANN 9.2.0-beta.2（Ascend 950PR 实测，master attention/block_attn_res_prepare 2026-10-23 版）；blockRes 全 0 + 0<eps<1.17549435e-38（fp32 次正规数）
