  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 'trl GRPOTrainer `use_bias_correction_kl=True`（PR #6503 起默认开）时，KL bias correction 用 `coef_1 = exp(log_importance_weights)` 乘 per-token KL。`importance_sampling_level="sequence"` 下 `log_importance_weights` 是**序列均值** log-ratio，shape `(B, 1)`——广播到 `(B, T)` per-token KL 后，总 KL 的 token 级梯度多出一项 `(Σ_t k3_t) · ∇(mean_t log π_t)`：既非 DeepSeek-V3.2 论文的 per-token 修正、也非无偏 reverse-KL 梯度，纯 spurious。`level="token"` 时权重本就 per-token、无此 bug。修复（PR #6594，closed 未合并）= 无论 level 一律用 per-token `exp(log_ratio)` 乘 KL。'
  source: 'trl PR #6594（closed unmerged；Closes #6586；arXiv:2608.02786 将其引为「loss 正常下降、梯度被腐蚀」的训练期实例）。https://github.com/huggingface/trl/pull/6594 ；#6586。https://github.com/huggingface/trl/issues/6586'
  behavior: '无 crash、loss 曲线正常下降——每个 token 的 KL 惩罚梯度携带全序列聚合的伪梯度分量，KL 约束的施加方向系统性偏移（sequence-level IS 配置下默认即中招）；与 RL-KL.07（k3 clamp 前向有限反向 NaN）同打击 KL 修正路径，差异在这边是**离散的形状契约破坏**（(B,1) 权重 × (B,T) KL）、那边是无界指数的数值面；与 RL-ADV 家族 IS 权重类（trl #6945 幸存者偏差 ratio）同根：**IS 修正项的粒度/形状与损失定义不匹配**。'
  discovery: 2026-09-16 每日扫描
