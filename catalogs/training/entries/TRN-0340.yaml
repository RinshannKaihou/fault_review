id: TRN-0340
legacy_ids: []
slug: mindspeed_rl_grpo_group_norm_contiguous_assumption
aliases: []
title: GRPO group_norm 依赖同 prompt 连续排布的隐式假设
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: mindspeed-rl
    component: group_norm 组对齐
  behavior: 组内归一化直接按行序 reshape(-1, n)，隐含假设连续 n 行同属一个 prompt；调用侧异步取数不保证顺序，也不校验 micro_batch_size 为 n 的整数倍。
effect:
  objects:
  - 训练信号
  - 训练轨迹
  detail: 异步 rollout 下样本顺序不保证；micro-batch 横跨 prompt 组或多组交错时，只要总数能被 n 整除，reshape 不报错但归一化不同 prompt 的 reward，组基线失真、静默污染；总数不能被 n 整除则直接抛 shape 错误。
  visibility: 静默错误
mitigation:
  detect: 给 experience 带 prompt_id，reshape 后校验每组 prompt_id 一致；或在 validate_config 里断言 micro_batch_size % n_samples_per_prompt == 0。
  fix: issue 建议两条：compute_advantage 中显式校验组对齐（prompt_id 一致），或把优势计算改为完整 global batch 收齐后做、不再依赖 micro-batch 取数顺序；issue 已 closed，正文未给出合入 PR（未核实）。
