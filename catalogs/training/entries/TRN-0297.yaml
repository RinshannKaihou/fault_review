id: TRN-0297
legacy_ids: []
slug: radix_top_k_ws_sync_missing_int64_overflow
aliases: []
title: RadixTopK WS 变体 V→MTE3 失同步与 int64 索引越界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: radix_top_k WS 同步与索引
  behavior: V写tileTopK、MTE3读同块UB，原SToMTE3Sync覆盖不到V→MTE3，可读旧值；i64多段且tileNum_超UB上限，无符号下溢越出6144元素缓冲区；跨核前缀和可超2^31而累加器int32；UT未测int64主路径
effect:
  objects:
  - 数值结果
  detail: 910B/910_93上，超大sortLen（>2^31，约21亿元素）的int64 topk（MoE大词表/超长序列采样）输出k配额错乱（少选/多选）、索引越界写破坏相邻内存或跨核前缀和溢出错值，均无报错；普通规模正常，仅int64大shape且K配额需末轮边界补齐时触发。
  visibility: 静默错误
mitigation:
  detect: 对 topk 输出做配额/去重校验；触发面为 sortLen>2^31 或 K 需末轮边界补齐的大 shape。
  fix: '修复 MR !6396 已 merged（2026-10-16，批次快照核实）；issue #3604 已 closed。VToMTE3Sync 替换、CreateVecIndex4TopK 前置防御、ComputeCumSumPrev 统一 int64、static_assert、host UT 补 bit3 编码。https://gitcode.com/cann/ops-math/merge_requests/6396'
