relations: []
original:
  mechanism: 'trl 的 ChunkedLogProbFunction/ChunkedDivergenceFunction（SFT、蒸馏等 trainer 共用）在 torch_compile=True + torch<2.11 下全程训错值：#7600 把 kernel 标量参数 cast 为 fp32（x.to(tl.float32)）；torch 2.6 的 Inductor 以 constexpr、2.10 以 Python float 追踪用户 Triton kernel 判定变异张量，两者都无 .to()，identify_mutated_tensors 抛异常，Inductor 日志「Encountered an exception in identify_mutated_tensors, assuming every input is mutated」并按全变异假设编译出错误图。torch 2.11 起该分析支持标量 .to()，TestChunkedLogProbFunction::test_torch_compile / TestChunkedDivergenceFunction::test_torch_compile 在 2.6.0–2.10.0 失败、2.11.0 起通过；trl CI 只跑新 torch 故未拦截。issue #7687 已 closed（无评论，修复落地细节未核）。'
  source: https://github.com/huggingface/trl/issues/7687 ；引入 PR：https://github.com/huggingface/trl/pull/7600
  behavior: SFT/蒸馏训练开启 torch_compile=True（torch<2.11）：日志里 loss 恒 0.0、grad_norm 恒 nan，无任何报错或警告（Inductor 的 assuming every input is mutated 只在 debug 日志），训练跑完全程但模型完全没学到东西；关掉 torch_compile 立即恢复（loss≈10.7）。坑点在 CI 与常见教程都用新 torch，本地老环境一开编译就静默报废。
  discovery: 2026-10-16 每日扫描
