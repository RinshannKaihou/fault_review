id: TRN-0287
legacy_ids: []
slug: trl_torch_compile_chunked_loss_zero
aliases: []
title: trl torch<2.11 编译 chunked loss 全程 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: trl
    component: Inductor 变异张量分析失败
  behavior: '#7600 把 kernel 标量参数 cast 成 fp32；torch<2.11 的 Inductor 以 constexpr/float 追踪无 .to() 可调→分析抛异常→按全变异假设生成错误图。'
effect:
  objects:
  - 训练信号
  - 梯度
  detail: SFT/蒸馏等用 chunked logprob/divergence kernel 的训练在 torch<2.11 + torch_compile=True 下：无报错、loss 恒 0.0、grad_norm 恒 nan；不编译时 loss 约 10.7。CI 因用新 torch 不覆盖。
  visibility: 静默错误
mitigation:
  detect: torch<2.11 + torch_compile=True 且用 chunked loss kernel 时，第 1 步即查 loss 是否 0.0、grad_norm 是否 nan；kernel 测试 TestChunkedLogProbFunction::test_torch_compile 在 2.6–2.10 均失败可作回归探针。
  fix: 'kernel 侧 #7600 的 fp32 cast 引入此不兼容；torch 2.11 起分析器支持 scalar .to() 后测试通过（issue 已 closed；修复落地状态未逐 commit 核实，未确认是否单独 backport）'
