original:
  mechanism: 'cann/ops-math #3907（2026-10-23 报告、2026-10-25 入批次，open，A2 910B2 8 卡 / CANN 9.2.0 / master 584b2ea6）。aclnnCumsum 默认确定性配置下同一输入连续 5 次执行得到 5 种输出位模式（FNV 哈希全不同）；设置 ACL_OPT_DETERMINISTIC=1 后 5 次同一哈希。资料 math/cumsum/docs/aclnnCumsum.md 约束原文「确定性计算：aclnnCumsum默认确定性实现」，默认路径违反该承诺。相邻 #3908 报告同一算子开启 ACL 确定性后 4 线程多 context 首调用挂死（20s 未同步）——确定性开关本身另有可用性问题。'
