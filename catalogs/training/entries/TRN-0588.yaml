original:
  mechanism: mindspore/mindspore（AtomGit）#29708（2026-11-01 open，2×Ascend 910B3，CANN 8.5，MindSpore 2.7.2 + MSAdapter 0.6.0 + MindSpeed 2.3.0_core_r0.12.1）。mindspeed/mindspore/core/tensor_parallel/mappings.py 的 all_to_all_forward：其一，output_split_sizes 传入已是 Python list 时仍调 .tolist()（list 无该方法）触发 AttributeError；其二，input_split_sizes 一行错误地判断 output_split_sizes is not None，input_split_sizes=None 时可能调用 None.tolist()。双卡 910B 240 次 HCCL 对照：原始实现 60 次触发预期异常，修复版本 120 次全部通过且通信结果正确。版本核查：2.3.0_core_r0.12.1 与 26.1.0_core_r0.12.1 缺陷均在，26.2.0_core_r0.12.1/r0.18.0 相关适配文件已移除。属 MindSpeed 的 MindSpore 适配层缺陷，MindSpore 核心算子无问题。
