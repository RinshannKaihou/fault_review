title: MindSpeed 适配层 all_to_all split_sizes 缺陷
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindspeed
    component: all_to_all_forward 适配层
  behavior: split_sizes 已是 Python list 时仍调 .tolist()（AttributeError）；且 input 一行错误判断 output 是否为 None，input=None 时可触发 None.tolist()
effect:
  objects:
  - 可用性/进度
  detail: 传 list 形式 split_sizes 调 all_to_all_forward 抛 AttributeError；input_split_sizes=None 时可能调 None.tolist()。240 次对照中 60 次触发。2.3.0/26.1.0 存在，26.2.0 已移除适配文件。
  visibility: 报错
mitigation:
  detect: 传入合法 list 的 split_sizes 调用 all_to_all_forward 直接暴露 AttributeError
  fix: issue 建议 int(x) 列表推导分别判 None（社区修复脚本在案）；26.2.0_core 分支起该适配文件已移除（版本核查在 issue 内）
