original:
  mechanism: Megatron-LM main@ce852bfb（2026-10-19 核对）ColumnParallelLinear 在 gradient_accumulation_fusion=True 且 Megatron-FSDP v1 下：optim/optim_grads/optim_grads_params 策略中 FSDP 包装器正确设置 weight.overwrite_main_grad=False，但 local Linear 的 FSDP 专用反向分支不消费该标志，仍把 fused_weight_gradient（fused_weight_gradient_mlp_cuda）产出的 wgrad 写入持久、未分片的梯度缓冲——该缓冲在 microbatch 间不重建，先前 microbatch 的累积被覆盖。纯 no_shard 还有第二处缺标志路径。复现：单卡 H200、PyTorch 2.10.0a0+b558c986e8.nv25.11、CUDA 13.0、TE 2.18.0+27486e0；单个 16x16 Linear、两个 microbatch 分别贡献 8 与 96，正确累积 104、实际 96（恰为第二 microbatch 分量），256 项全错、最大绝对误差 8；无 optimizer/数据集/MoE/CP/TP/ckpt/重计算参与。对照：--no-fusion 与 --fix 均得 104；--dtype bfloat16 同样失败（FP32 main grads）；8 卡真实分片对照通过（actual==expected==832）。BF16 参数 + FP32 main/main grads 配置亦受影响。issue 无维护者回应（0 评论）。
  source: https://github.com/NVIDIA/Megatron-LM/issues/8332
  behavior: 在 Megatron-LM 上以 Megatron-FSDP v1（optim/optim_grads/optim_grads_params 或 no_shard）训练并开启 gradient_accumulation_fusion=True 时，凡走 ColumnParallelLinear 的层，梯度累积多个 microbatch 的权重梯度只有最后一个 microbatch 生效，前面的贡献被静默覆盖；训练不报错、loss 不 NaN，梯度数值量级正常但系统性偏小。单 microbatch 训练或关闭融合则正常。复现脚本在 issue 内，torchrun 单卡即可跑出 96 vs 104。
  trigger_surface: Megatron-FSDP v1（非 DDP/ZeRO 路径）+ gradient_accumulation_fusion=True + 多 microbatch 梯度累积。
  discovery: 2026-10-20 每日扫描
