title: Megatron-FSDP v1 梯度累积融合覆写未分片 wgrad
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: megatron-lm
    component: FSDP v1 local Linear 反向
  behavior: ColumnParallelLinear 在 gradient_accumulation_fusion=True 且 FSDP v1 下，FSDP 反向把 wgrad 写入持久未分片缓冲，覆盖此前 microbatch 已累积值。
effect:
  objects:
  - 梯度
  detail: 多 microbatch 梯度累积下权重梯度只保留最后一个 microbatch 的贡献，前一 microbatch 分量被静默覆盖；无报错、无 NaN，梯度数值看似合理但错。单卡 16x16 Linear 双 microbatch（各贡献 8/96）实测应为 104 实得 96。
  visibility: 静默错误
mitigation:
  detect: 对照关闭 gradient_accumulation_fusion 或启用真实分片的运行，比对逐步 wgrad（issue 提供 16x16 单卡确定性 repro，control 全部通过）。
  fix: 待定（issue 2026-10-19 open，@mcore-oncall，无修复 PR；repro 脚本带 --fix 对照）
