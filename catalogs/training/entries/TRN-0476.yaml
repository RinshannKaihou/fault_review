original:
  mechanism: 'cann/ops-nn #7446（2026-10-27，Ascend 910B2 8 卡、CANN 9.2.0、ops-nn 仓 loss/fused_cross_entropy_loss_with_max_sum）：aclnnFusedCrossEntropyLossWithMaxSum 在 vocabParallelLogitsOptional 词表宽度 V=0 时 lossOut 错值且两段返回 0。对照实验（除 vocab 形状外输入完全一致，fp32）：CTRL {4,8} 输出 0.443147 正确；V=0（{4,0}）输出 -0.943147=ln(0.5)-0.25——把 logitsMax（0.5）当 sumExpLogits（2.0）求了对数。代码锚点：op_kernel/fused_cross_entropy_loss_with_max_sum.h InitParams() 的 vLen<=0 else 分支只申请 sumExpLogitsQue_/predictedLogitsQue_ 的 UB buffer、没有 logitsMaxQue_/logitsMaxTensor；BtCompute() 无条件 GMToUB(logitsMaxGm_, logitsMaxTensor,...) 搬进与 sumExpLogitsTensor 重叠地址，紧跟的 Log(logTensor, sumExpLogitsTensor,...) 对 logitsMax 求对数。op_host tiling 对 V=0 不拦截（singleCalculationQuantity=0），op_api CheckShape 只校验 rank 与张量间 shape 相等。报告者带不依赖 torch/torch_npu 的纯 C++ 两段式探针（CTRL/DEFECT 两组只差 V）。该算子是 Megatron 式 VP 并行 fused CE 链路的组成（max/sumExp/predicted 分片聚合），空词表分片在 VP 不均或最后一 rank 空分片时可出现。'
  source: https://gitcode.com/cann/ops-nn/issues/7446
  behavior: fused CE 训练步中词表维为 0 的输入（如 VP 切分产生空词表分片）使 lossOut 静默变成 ln(logitsMax)-predicted 而非 ln(sumExp)-predicted，数值看似合理但系统性错误；两段接口返回 0、无告警，loss 曲线只会整体平移/畸变，难以归因。
  trigger_surface: CANN 9.2.0（910B2 实测）；aclnnFusedCrossEntropyLossWithMaxSum；vocabParallelLogitsOptional 最后一维 V=0
  discovery: 2026-10-28 每日扫描
  notes:
  - '2026-10-30 2026-10-30 回访：修复 PR !13086（open）覆盖 4 个 issue（#7446 V=0 静默错值 + #7447 vocab/logitsMax 行数不一致静默少写越界写 + #7472 可选输入非空被静默忽略 + #7473 文档）；op_api CheckShape 三项校验 161002 + kernel vLen<=0 补 buffer 根因修复 + 6 负向 UT；910B3/CANN 9.3.0 上板验证。#7447 越界写面并入本条（同算子同修复载体）'
  - 2026-10-31 2026-10-31 回访：!13086 仍 open，无状态变化。
