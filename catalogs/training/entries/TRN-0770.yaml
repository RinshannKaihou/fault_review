title: verl FusedLinearForPPO 先 bf16 除温度再升 fp32
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: verl
    component: FusedLinearForPPO torch
  behavior: torch 后端把 bf16 logits 先除以 temperature 再升到 fp32 算 logprob 与 entropy，除法舍入停在 bf16 精度上
effect:
  objects:
  - 输出分布
  - 训练信号
  detail: T=0.7 时 logprob 与 rollout 采样器公式最大差 0.054（修复后 3.8e-6），entropy 仍以 bf16 返回；旧策略 logprob 偏差直接进入 importance ratio
  visibility: 静默错误
mitigation:
  detect: 同 batch 用 fused 与未融合路径（fp32 logits/T）对拍 logprob 与 entropy；temperature≠1 时差异随 bf16 量化步长放大
  fix: 修复 PR https://github.com/verl-project/verl/pull/8684（open，未合入）：先升 fp32 再除温度；H100 T=0.7 实测 logprob 与采样器公式差 3.8e-6（原 0.054）
