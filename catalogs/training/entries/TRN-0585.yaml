original:
  mechanism: 'cann/ops-nn #7875（2026-11-01 open，Atlas A2 910B3，CANN 9.2.0 V100R001C12SPC001B237，master index/repeat_interleave）。aclnnRepeatInterleaveInt / IntWithDim 在 repeats=0 时 GetWorkspaceSize 与执行段均返回 0（ACLNN_SUCCESS），但 out 完全不写入：out 预填哨兵 -999.0f 后 0/16、0/4 个元素被写。源码定位 aclnn_repeat_interleave.cpp:151-160 CheckIntRepeatsRange 只拒绝 repeats<0，0 直接放行。资料三处自相矛盾：参数表『repeats 的值必须为非负数』（0 合法）、错误码表『repeats 不为自然数』与头文件注释『必须为自然数』（0 非法）——无论按哪种解释，『返回成功但不写』都不成立。正对照 repeats=1 正常写 8/8、负对照 repeats=-1 两段 161002 拒绝，证明校验链与设备通路无问题，唯独 0 落空档。相关修复 MR !13287（WIP）针对 scalar-repeat 输出 metadata 校验。'
  source: cann/ops-nn https://gitcode.com/cann/ops-nn/issues/7875（open）
  behavior: 调 aclnnRepeatInterleave 传 repeats=0 时接口返回成功，但输出张量一个字节都没动——里面是分配时的未初始化值或上一次调用留下的旧数据。repeats=1 正常、repeats=-1 会被拒绝，唯独 0 静默吞掉，无报错无警告。
  discovery: 2026-11-02 每日扫描
