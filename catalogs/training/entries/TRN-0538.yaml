  mechanism: 'CANN GE（图引擎）llm 数据路径的半精度 numpy 视图处理缺陷：shape 恢复缺失，另支持 Unicode 字符串编码。修复 PR !5680（open，2026-10-29 创建，标题注明关联 #631/#632）。GE llm 路径是 MindSpeed-LLM 等栈的数据输入通道，半精度（fp16/bf16）数据经 numpy 视图传入时 shape 信息未正确恢复会导致下游按错误形状消费样本。PR 描述未展开根因代码位置与错误形态，关联 issue #631/#632 未在批次正文深读范围内。'
  source: https://gitcode.com/cann/ge/merge_requests/5680
