title: RmsNormGradQuant 尾列与大索引梯度错算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: RmsNormGradQuant regbase
  behavior: regbase 实现分段尾列的 Cast/Muls 未覆盖末列，FP32 中间乘加把交替大梯度压成饱和值，大张量 GM 元素地址按 uint32 截断（2^32 变 0）。
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: (1,8193) 末列 dy=4×8193 时前 8192 个 int8 dx 全 0（应 -4）；大值除法场景输出全 -128 或全 0（应交替 ±4/±64）；65537×65536 尾行地址 4294967296 被截为 0。无报错。
  visibility: 静默错误
mitigation:
  detect: 构造 RmsNormGradQuant 尾列非零 dy 与元素数 >2^32 的大张量，对 dx/dgamma 与 64 位独立参考逐元素比对
  fix: PR https://gitcode.com/cann/ops-nn/pull/16346 open（2026-11-26，修 regbase 梯度归约与索引边界；未发布）
