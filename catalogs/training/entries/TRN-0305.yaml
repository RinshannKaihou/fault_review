id: TRN-0305
legacy_ids: []
slug: foreach_list_pair_tiling_x2_unvalidated
aliases: []
title: arch35 foreach 二元 list tiling 不校验 x2 列表
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: foreach list tiling
  behavior: arch35 foreach 二元 list tiling 仅按 x1 求取 tensorCount、偏移、totalElements，未获取 x2 信息；kernel 用 x1 偏移/dtype 索引 x2。
effect:
  objects:
  - 数值结果
  detail: 图模式下 x2 列表与 x1 不匹配（长度短、tensor 小、dtype 不同）的 foreach 二元算子越界访存或结果静默错误，tiling 层无 GRAPH_FAILED 拦截（arch22 与 aclnn 入口均有校验）
  visibility: 静默错误
mitigation:
  detect: 调用前自检两个张量列表逐项长度/dtype/shape 一致（框架层）；tiling 层无拦截
  fix: 修复 MR !12121（open）：共享 validator 新增 ValidateTensorListPair 一次性校验实例个数、逐 tensor dtype 与 storage shape，六个算子 arch35 tiling 接入并补失败/匹配四类单测；本机无昇腾工具链，host UT 未跑（-fsyntax-only 语法检查过），以仓库 CI 为准。https://gitcode.com/cann/ops-nn/merge_requests/12121
