title: TFT 回滚重建 DataLoader 时丢 worker
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspeed-llm
    component: TFT 回滚 DataLoader 重建
  behavior: TFT 高可用回滚时无条件重建 DataLoader 与迭代器，num_workers>0 下新旧 worker 生命周期切换，worker 异常退出后父进程只在 gc.collect 处报错。
effect:
  objects:
  - 可用性/进度
  - 训练样本流
  detail: num_workers=2 时约十余次回滚出现一次 DataLoader worker exited unexpectedly(exit code 1)，父进程在 gc.collect 里抛 RuntimeError 退出；num_workers=0 未复现，worker stderr 丢失。
  visibility: 报错
mitigation:
  detect: 回滚前后记录 worker pid 与 consumed_train_samples，对 single/cyclic sampler 状态做一致性断言
  fix: issue 给出方案：仅在开高可用时对标准 map-style DataLoader 启用 persistent_workers，回滚时重置 single/cyclic 采样器并复用现有 worker（closed，未核实是否已合入）
