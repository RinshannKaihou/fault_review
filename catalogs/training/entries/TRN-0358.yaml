original:
  mechanism: 'MindSpeed-LLM 的高可用训练用 mindio_ttp 的 tft_train 包住 train()，TFT 回滚恢复时会重建 DataLoader 与 data iterator。标准 GPTDataset、--num-workers 2、--dataloader-type single 下，多进程 loader 在回滚重建期间 worker 异常退出（约十余次运行一次）；父进程直到 ttp_decorator.py 的 gc.collect() → torch/utils/data/_utils/signal_handling.py 的 _error_if_any_worker_fails 才抛出 RuntimeError: DataLoader worker (pid 28765) exited unexpectedly with exit code 1，当时没有拿到 worker stderr，因此首个故障点未确认；--num-workers 0 未复现。报告者给出的处理方向是：仅在开启高可用时给标准 map-style DataLoader 打开 persistent_workers，回滚时重置 single/cyclic 采样器并复用现有 worker，保留通用预热逻辑与不可复用的回退路径；这样能减少回滚期间的 worker 生命周期切换，但能否彻底消除原始异常仍需 NPU/TFT 场景验证。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1911（closed；MindSpeed-LLM 高可用训练 + 标准 GPTDataset；父进程栈与处理方案在正文）
  behavior: 开高可用（TFT）的预训练作业回滚恢复时，大约十余次里有一次直接失败退出：rank 上打印 DataLoader worker (pid 28765) exited unexpectedly with exit code 1，栈落在 mindio_ttp 的 gc.collect 和 torch 的 _error_if_any_worker_fails；把 --num-workers 设成 0 后没再复现，也没有 worker 的 stderr 可看，所以只能看到父进程这一侧的报错。
  trigger_surface: TFT 高可用回滚 + num_workers=2 + dataloader-type single/cyclic
  discovery: 2026-10-21 每日扫描
