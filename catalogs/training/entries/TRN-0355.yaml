id: TRN-0355
legacy_ids: []
slug: msllm_tnd_cp_empty_rank_collective_desync
aliases: []
title: TND+CP 空 rank 跳过 indexer 反传致挂起
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindspeed-llm
    component: DSv4 CSA indexer CP 分支
  behavior: CP 下某 rank 的 KV 段全短于 compress_ratio 就跳过 indexer/compressor 与索引 loss 反传，非空 rank 仍发 CP all_gather，两边梯度 bucket 不一致。
effect:
  objects:
  - 可用性/进度
  - 梯度
  detail: 空 rank 场景下 backward collective 顺序不一致直接 hang；空 rank 还缺 indexer/compressor 的 grad hook 与 bucket，用 dummy KV 硬闯会 shape 校验失败或非法索引。
  visibility: 挂起
mitigation:
  detect: 统计各 rank 的 compressed KV 段数，空 rank 与非空 rank 的 loss tracker key、grad bucket 顺序比对
  fix: 'issue #1895（closed）给出方案：_ZeroGradientAnchor 造显式零梯度、_EmptyIndexerLossCommunicationAnchor 让空 rank 参与 CP collective、gather_tnd_local_num() 统一 dtype/shape/process group'
