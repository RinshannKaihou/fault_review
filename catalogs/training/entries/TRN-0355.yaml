- url: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1895
  kind: gitcode_issue
relations: []
original:
  mechanism: DeepSeek-V4 CSA 在 TND packed sequence + Context Parallel 下按 compress_ratio 切 document segment：某些 rank 上所有有效 KV segment 都短于 compress_ratio，该 rank 生成不了有效 compressed KV。非空 rank 继续走 indexer、compressor 和 fused indexer-loss 的 backward，空 rank 提前跳过相关计算，于是 1) 各 rank autograd graph 不一致；2) 空 rank 不触发部分参数的 gradient hook 与 distributed gradient bucket；3) 非空 rank 在 fused indexer-loss backward 里做 CP all_gather，空 rank 没参与，collective 顺序错位；4) 若用 dummy KV/dummy top-k/dummy weights 强行进入 fused op，会 shape 校验失败、非法索引或白算；5) 用 NPU Tensor .item() 判空 rank 会在非空路径上引入额外 Host-Device 同步。触发面是 CSA + TND + CP + 该 rank 所有 segment 短于 compress_ratio + 启用 indexer loss，activation recompute 或 distributed optimizer 会放大 collective 顺序不一致。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1895（closed；CANN 9.1.0；现象、触发条件与修复方案均在正文）
  behavior: DeepSeek-V4 CSA 的 TND + CP 训练跑到某些数据形态时整个作业卡住不动（hang），既没有 loss 也没有报错；出问题的 rank 是“空 rank”，即它分到的 document segment 全都短于 compress_ratio。同一套配置在数据切分均匀、没有空 rank 时正常。
  discovery: 2026-10-21 每日扫描
