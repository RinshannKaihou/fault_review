original:
  mechanism: 'cann/ops-nn #7892（2026-11-01 open，Atlas A2 910B3，CANN 9.2.0，master a61e016a71f4）。aclnnAdaptiveAvgPool2d 在 self=[1,2,0,8]、outputSize=[4,4] 时两段均返回 0，但输出一个字节未写：0x5A 预填 canary 执行后保持原样；H=8 对照组正常写入。资料错误码表 161002 明确覆盖『self或out的shape的除第一维度以外不大于0』，H 是第二维应拒绝；同族 aclnnAvgPool2d、aclnnMaxPool 对同类输入均返回 161002，唯本接口放行且不写输出。与 #7875（RepeatInterleave repeats=0 成功不写，TRN-0586）同族不同算子：『成功返回但输出未写』的空输入/边界路径缺陷。另同族 #7886（AdaptiveAvgPool3d 第一维=0 被 161002 拒绝，源码注释称 n=0 合法）为反向不一致。'
  source: cann/ops-nn https://gitcode.com/cann/ops-nn/issues/7892（open）
  behavior: 给 aclnnAdaptiveAvgPool2d 传 H 维为 0 的输入（如 [1,2,0,8]），接口返回成功，但输出张量一个字节都没写——预填的 0x5A 哨兵原样保留。正常 H 的输入同代码路径写入正常，同族池化算子对同样输入都会报 161002，只有这个接口静默吞掉。
