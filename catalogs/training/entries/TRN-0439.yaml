    component: aclnnGroupedMatmulV5
  behavior: Tensor 版 groupList 末值不校验：V5/V4/V3/WeightNz 分支只查长度/dtype 后直接 return SUCCESS，末值≤x 第一维的约束只在 int-array 分支；末值>M 仍两段 0 并执行。
effect:
  objects:
  - 数值结果
  detail: groupList 末值 40>M=32 时 0/0 且输出被写出；kernel 按 groupList 取行区间越过 x 末行，同用例 memcheck 已见合法输入下 illegal read of size 256。
  visibility: 静默错误
mitigation:
  detect: groupList 末值变异扫描 + mssanitizer memcheck。
  fix: 待定（issue open，未见修复 MR）。
