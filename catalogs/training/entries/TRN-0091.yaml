  note: 维持 算子/内核。依据“修复要改哪里”：原文修复 = 在 FusedScaleMaskSoftmax.forward_torch_softmax 内把覆写改为组合 mask | swa_mask；原文明说“packer/调用方生成的 mask 是正确的，被融合算子 fallback 的条件分支吞掉”，即建模代码的 attention mask 构造（模型定义）无误，错在 softmax 算子封装的分支。
