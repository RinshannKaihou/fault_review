  meta: 'stage: `sft/pretrain` · Cov: `NEW` · 置信度 `documented`'
  mechanism: Megatron `FusedScaleMaskSoftmax.forward_torch_softmax` 的 sliding-window 分支**无条件覆写**调用方传入的 attention mask：`mask = get_sliding_window_causal_mask(sq, sk, self.window_size)`；隔壁 plain-causal 分支有 `mask is None` 守卫，SWA 分支没有。带 SWA 层的模型在 torch fallback 路径（`scaled_masked_softmax_fusion=False`）上，padding mask（`micro_batch_size>1`）或 packing 的块对角文档 mask 被 SWA 层静默丢弃——pad token / 跨文档 token 照常参与注意力；非 SWA 层行为正常，错位只出现在部分层，逐层排查才可见。
  source: 'Megatron-LM #7039（MiMo-V2.5 全参 SFT 实际命中：48 层中 39 层 SWA 走该 fallback；`[2,1,8,8]` 零分 + 尾部 3 个 key 的 padding mask 复现——padded key 概率非零；修复 = 组合而非覆写 `mask = swa_mask if mask is None else (mask | swa_mask)`，`mask=None` 调用方行为不变）。https://github.com/NVIDIA/Megatron-LM/issues/7039'
  behavior: 无异常、无警告，loss 被静默污染；issue 报告唯一安全配置退到 `micro_batch_size=1` + 关 packing（变长多模态数据的重大效率损失）。与 DATA.02（packing 不按文档边界切断注意力）同症状面——pad/跨文档注意力泄漏，但根因在**消费侧**：packer/调用方生成的 mask 是正确的，被融合算子 fallback 的条件分支吞掉。与 KER.03（kernel 同步语义静默错值）互补：这是 mask 语义在分支覆盖上的静默降级，非融合 kernel 本身算错。
  discovery: 2026-09-03 每日扫描
