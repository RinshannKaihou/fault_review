id: TRN-0354
legacy_ids: []
slug: msllm_reuse_fp32_param_fp16_convert_nan
aliases: []
title: reuse-fp32-param 的 fp32→fp16 转换溢出成 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: mindspeed
    component: reuse_param fp32→fp16 转换
  behavior: reuse-fp32-param 的 fp32→fp16 转换在 optimizer step 里做 view(-1,2).transpose(1,0).reshape，第一环就出 NaN。
effect:
  objects:
  - 模型权重
  - 训练信号
  detail: qwen3-4b 32k LoRA 在 CP=4 下精度溢出（ulysses 与 megatron CP 都溢出，CP4→TP4 不溢出）；msprobe 首个 NaN 在该 transpose 输入，关掉 reuse-fp32-param 即正常。
  visibility: 数值异常
mitigation:
  detect: msprobe 精度溢出 dump 定位首个 NaN 算子，或直接对比开/关 reuse-fp32-param 的 loss
  fix: 'issue #1404（closed）只给规避：关闭 reuse-fp32-param；未给修复 PR'
labels:
  stage:
  - sft
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: ''
