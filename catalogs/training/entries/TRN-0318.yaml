original:
  mechanism: 'trl VLM 训练以 vllm_mode=server 运行时，VLLMGeneration._place_features 重算图像特征放置位置：在 prompt 中查找 processing_class.image_token_id 的连续 run。Gemma3 在 transformers 5.x 上 processor 的 image_token_id 是 <start_of_image>（255999），而图像特征实际替换的是 placeholder token（262144）：单图 prompt 下查 255999 得 run [(4,1)]（1 个 token），查 262144 得 [(5,256)]（256 token span）。两者 run 数相同（每图一个），run 数量校验通过，特征以错误位置与错误长度发给 vLLM——vLLM 生成为完全忽略图像。transformers 4.56.2/4.57.1 的 Gemma3 processor 返回 placeholder token，故仅 5.x 中招；代码由 PR #6765 引入。报告者以 google/gemma-3-4b-it、vLLM 0.30.0 server、transformers 5.17.0、GRPO、纯红 448×448 图、贪心解码复现：main 回答『This is a text-based prompt…cannot determine the color of an image』，期望『Red』。影响所有经 VLLMGeneration server 模式的 trainer：GRPO、RLOO、Distillation、实验 GOLD/SDFT/SDPO/IW-OPD。多模态 RL 训练在此缺陷下静默退化为纯文本训练，reward 与策略更新全部基于无图像 rollout。'
  source: 2026-10-18 GitHub huggingface/trl issue https://github.com/huggingface/trl/issues/7772 （open）；修复 PR https://github.com/huggingface/trl/pull/7773 （merge 状态未核）
  behavior: Gemma3 多模态 RL 训练（vllm_mode=server、transformers 5.x）静默忽略全部图像：rollout 生成回答『这是文本提示，无法判断图像颜色』而非『红色』，无任何报错；训练照常进行、reward 照常计算，实际策略在纯文本分布上更新。换 transformers 4.x 或 colocate 模式正常。
  trigger_surface: trl VLLMGeneration server 模式 _place_features；Gemma3 + transformers 5.x；vLLM 0.30.0 server；多模态 GRPO/RLOO/Distillation/GOLD/SDFT/SDPO/IW-OPD
