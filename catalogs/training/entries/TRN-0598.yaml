id: TRN-0598
legacy_ids: []
slug: deepspeed_fp16_hysteresis0_scale_never_lowers
aliases: []
title: DeepSpeed fp16 hysteresis=0 时 scale 永不下降
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: deepspeed
    component: DynamicLossScaler
  behavior: update_scale 仅在 cur_hysteresis==1 时降 scale，hysteresis 从 0/负数起步时计数只向远离 1 方向走，降 scale 永不触发；config 无校验、stage 0 优化器对 0 语义相反
effect:
  objects:
  - 优化器状态
  - 训练轨迹
  detail: fp16.hysteresis=0 或负数 + 动态 loss scale 时，每次溢出后 scale 停在初始值（如 2^16）不降，该步被跳过且『scale 已到最低』退出条件永不满足——从首个溢出起每个溢出步都被跳过直到训练结束，无最小值退出保护
  visibility: 静默错误
mitigation:
  detect: fp16+hysteresis<=0 配置探针：连续 40 次溢出后检查 cur_scale 是否仍为 65536；对照 hysteresis=1（降到 1.0）
  fix: '修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8983（open，Fixes #8982）：两处比较改 <=1，0/负数视为无延迟（对齐 stage 0 语义）；附带单测（main 上 2 failed/1 passed → 修复后 3 passed）。相关未合 #7856（config 解析时拒绝 <1）'
