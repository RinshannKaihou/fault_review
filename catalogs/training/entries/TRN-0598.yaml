  kind: github_pr
relations: []
original:
  mechanism: 'DeepSpeed #8982 + 修复 !8983（2026-11-02，均 open）。fp16.hysteresis=0 或负数时 DynamicLossScaler.update_scale 的 `delayed_shift == 1 or cur_hysteresis == 1` 条件永不满足（cur_hysteresis 起步 0 只会递减远离 1），scale 永不下降；每个溢出步被跳过且达不到 min_scale 的退出条件。DeepSpeedFP16Config.hysteresis 无 validator（#7856 曾提议拒绝 <1 未合）。CPU 可复现（loss_scaler.py 独立加载，stand-in 模块）：hysteresis=1 时 40 次溢出后 scale=1.0，hysteresis=0 时仍 65536。stage 0 fused/unfused 已用 cur_hysteresis>1（0 视为无延迟），两个路径对 0 的语义分歧自 #8647 起。与 TRN-0013（scaler 把 SDC inf 当普通溢出静默跳过）同在 loss scaler 域但机制不同：本条是配置参数使降 scale 机制本身失效，非溢出信号被吞。'
  source: deepspeedai/DeepSpeed https://github.com/deepspeedai/DeepSpeed/issues/8982（open）+ 修复 https://github.com/deepspeedai/DeepSpeed/pull/8983（open）
  behavior: ZeRO 1/2/3 fp16 训练把 fp16.hysteresis 配成 0（或负数）时，动态 loss scale 在首次溢出后再也不会下调——所有溢出步被永久跳过，且因 scale 到不了最低值、『已到最低』的退出保护也永不触发。配置加载无任何告警（默认 2 不受影响），训练表面正常进行，实际从首个溢出起优化器很少真正更新权重，loss 曲线缓慢停滞。CPU 脚本即可复现：40 次溢出后 scale 仍 65536（期望 <65536）。
  discovery: 2026-11-03 每日扫描
