original:
  mechanism: cann/hccl Broadcast DPU NHR AllGather 阶段接收切片索引计算：(rankIdx - deltaRank + tempRankSize_) % tempRankSize_。当 rankIdx < deltaRank 时，uint32_t 减法先发生下溢（回绕到巨大值），随后才提升为 u64 参与模运算——非 2 次幂 tempRankSize_ 的 NHR 通信组里接收切片编号被算错，发送端 Tx slice 与接收端 Rx slice 不一致，一端跳过发送、另一端持续等待造成 Notify/CQ 超时。修复 MR !3724 改为 (rankIdx + tempRankSize_ - deltaRank) % tempRankSize_（先加 tempRankSize_ 保证非负再减），并声明已全量核对该模板内同型下溢风险无其他残留；测试为 hccl_test rdv。证据等级：修复 MR 带明确根因推导与同型核对，但无独立 issue/实机数值对照，按 documented 收录。
  source: https://gitcode.com/cann/hccl/merge_requests/3724（2026-10-22，open；含修改前后表达式与机制说明）
  behavior: NPU 多卡训练在非 2 次幂 rank 数（如 3/6 卡 NHR 通信组）做 broadcast/allgather 时：偶发某次集体通信一端不发送、另一端死等直到 Notify/CQ 超时——训练表现为集体通信挂起或超时报错；若下裕值恰好落回有效范围则数据切片错位（接收内容与发送位置不对应），静默错值。修复前该问题只在特定 rank 组合下出现，2 次幂 rank 数不触发。
  discovery: 2026-10-23 每日扫描
