original:
  mechanism: triton-ascend 编译器 pass FoldOneHotGatherAfterReduceWithIndex（third_party/ascend/lib/TritonToLinalg/ArgMinMaxConverter.cpp）：masked max-with-index 归约后的 one-hot gather 被错误折叠为归约的（被 mask 后的）最大值，即使 gather 实际求和的是原始未 mask logits。最小复现（单 NPU）：logits 每行 -(arange(32)+3)、mask 列 1 为 False，values=where(mask,logits,0) 后 tl.reduce 取 argmax 得列 1（mask 后 0 最大），one_hot=(indices==index) 后 tl.sum(logits*one_hot,1) 应返回原始 logits[.,1]=-4，实际输出 0.0（=被 mask 的最大值）。源码检查定位：arith.select 匹配接受了包含 logits 的分支，随后把最终 sum 替换为归约 max 结果；被选中 mask 位置在原始 logits 中可以有不同值。issue open（2026-10-15）。训练影响面：masked argmax + one-hot gather 是路由/MoE top-k、损失掩码选择的常见模式；错值静默进前向与梯度。推理库 find 同 URL 为 0（2026-10-24 查）。
  source: https://github.com/triton-lang/triton-ascend/issues/2585
  behavior: 在 NPU 上用 Triton 写「先 mask 再 argmax、再按 one-hot 回取原始 logits」的逻辑（MoE 路由 top-k、损失掩码选择常用）：编译器把回取优化成直接取被 mask 后的最大值，正确应取 -4 的地方返回 0.0；输出和梯度都静默错，不报错、不 NaN，只有与 eager/CPU 对拍能发现。
  discovery: 2026-10-24 每日扫描
