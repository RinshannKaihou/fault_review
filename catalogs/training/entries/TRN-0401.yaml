id: TRN-0401
legacy_ids: []
slug: triton_ascend_onehot_gather_fold_masked_max_wrong_value
aliases: []
title: triton-ascend one-hot gather 折叠错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: FoldOneHotGather pass
  behavior: masked max-with-index 归约后的 one-hot gather 被折叠为被 mask 的最大值本身，尽管 gather 求和的是原始未 mask logits：pass 匹配接受了含 logits 的分支。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 最小复现（单 NPU）：每行 logits 为 -(arange(32)+3)、列 1 被 mask，argmax 选列 1，one-hot 回取原始 logits 应得 -4，实际输出 0.0（被 mask 的最大值）；错值静默进前向与梯度。
  visibility: 静默错误
mitigation:
  detect: 该模式（masked argmax + one-hot gather 回原始 logits）编译前后对拍；检查生成 TTGIR 中 FoldOneHotGather 变换。
  fix: 待定（issue open 2026-10-15，源码定位至 third_party/ascend/lib/TritonToLinalg/ArgMinMaxConverter.cpp）
