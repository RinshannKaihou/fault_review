title: MatmulEmuSplitWeight 混合布局权重静默算错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: aclnnMatmulEmuSplitWeight
  behavior: 转置标志只从 wHigh 推导却同时决定 wLow 的读取方式；两权重内存布局不一致时 kernel 按列主序读连续的 wLow。两层形状校验只比较 view 形状，混合布局下仍相等，校验全过。
effect:
  objects:
  - 数值结果
  detail: wHigh 转置而 wLow 连续的合法输入下，y 与 fp64 参考最大相对误差 4.26（对照组 4.5e-8），两段接口返回 0；资料未声明两权重必须同布局。
  visibility: 静默错误
mitigation:
  detect: wHigh/wLow 布局不一致负例对拍 fp64 参考；检查 strides 而非 view 形状
  fix: 待定（建议从各自 strides 推导 layoutTag，未见修复 MR）
