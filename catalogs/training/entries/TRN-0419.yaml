original:
  mechanism: 'cann/ops-transformer #6690（2026-10-24，open，A2 910B2 / CANN 9.2.0 / master 5f9cdcf3）：aclnnMoeGatingTopKBackward 对 N=1（约束 N∈[2,2048]）、renorm=2（约束 0/1）、空 Tensor（不支持）、expertIdx 全 100（N=8 越界）四类约束外输入全部 0/0/0 静默接受——CheckExpertIdx() 只校验 rank/两维/dtype 不校验值域。同族同日新报：#6659 负 expertIdx 未校验致设备向量核异常 507035；#6672 MoeTokenPermuteGrad 标量 numTopk 负数（-1 静默当 1、-3 崩溃 507035）；#6685 MoeTokenUnpermuteWithEpGrad topkNum=0 返回 0（上界 513 报对）；#6693 MoeTokenPermuteWithEpGrad rangeOptional(start>end) 未校验两段返回 0；#6674 MoeGatingTopKBackward kernel Gather 读未初始化 UB（initcheck 合法调用必现，mssanitizer 插桩定位 kernel.h:254）。其中 #6691（MoeInitRoutingV2Grad 越界 idx 静默 skip）单独立条（梯度静默丢失已量化）。共同根因：MoE 反向算子族 host 第一段校验只到 shape/dtype 层，值域/枚举/关系校验缺失，非法输入被静默接受或延迟到设备异常。正常流程上游产物不触发；在路由产物被错配/改写时本应 fail-fast 的机会被吞掉。'
  source: https://gitcode.com/cann/ops-transformer/issues/6690 ；同族：https://gitcode.com/cann/ops-transformer/issues/6659 、https://gitcode.com/cann/ops-transformer/issues/6672 、https://gitcode.com/cann/ops-transformer/issues/6685 、https://gitcode.com/cann/ops-transformer/issues/6693 、https://gitcode.com/cann/ops-transformer/issues/6674 ；单独立条：https://gitcode.com/cann/ops-transformer/issues/6691
  behavior: MoE 训练反向路径里，门控/排列类反向算子对明显非法的输入（越界或负的专家索引、负的 top-k 数、非法枚举、空张量、start>end 的区间）不报参数错误：轻则两段接口成功返回、那一项梯度被当 -1 悄悄丢掉；重则设备侧向量核异常（507035）把作业打断；没有一处是 host 侧第一段干净地拒绝。上游路由正常时看不到，一旦上游索引错配，训练要么静默少梯度要么莫名崩溃。
  trigger_surface: CANN ops-transformer MoE 反向算子族（MoeGatingTopKBackward / MoeTokenPermute(WithEp)Grad / MoeTokenUnpermute(WithEp)Grad 等）host 第一段校验；A2 910B2 / CANN 9.2.0 实测。
  discovery: 2026-10-25 每日扫描
