effect:
  objects:
  - 梯度
  - 可用性/进度
  detail: 上游路由产物被错配/改写时，越界或负的专家索引、负 numTopk、非法枚举、空张量、start>end 区间进入 MoE 反向算子：host 第一段校验不报参数错误，轻则接口成功返回 0、该项梯度被当 -1 静默丢掉，重则设备侧向量核异常 507035 打断作业；上游路由正常时不触发。
  visibility: 静默错误
mitigation:
  detect: 上游路由产物 idx/numTopk 加值域断言；跨边界输入对拍 CPU 标杆（skip/clamp/mod 三语义）。
  fix: 待定（各 issue open，未见统一修复 MR）。
