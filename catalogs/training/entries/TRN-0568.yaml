title: aclnnReduceLogSum 空输入输出 0 而非 -inf
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: reduce_log_sum 空输入早退
  behavior: 空 tensor（numel=0）早退分支 FillScalar(reduce, 0.0f) 把 sum 的零元当最终结果写出、跳过 log；数学语义应为 log(0)=-inf，同仓 aclnnLogSumExp 填 -INFINITY。
effect:
  objects:
  - 数值结果
  detail: 910B2 实测：data=fp32[0,3]、axes=[0] 期望 [-inf,-inf,-inf] 实得 [0,0,0]，两段均返回 0 无告警；非空输入逐位正确；master a6d37f00 复核仍在。
  visibility: 静默错误
mitigation:
  detect: 空 batch/空归约轴场景与 torch.log(torch.zeros(n)) 参照对拍；同族 LogSumExp 对照。
  fix: 待定（issue open：期望空输入填 -inf 与 aclnnLogSumExp 统一，未见修复 MR）
