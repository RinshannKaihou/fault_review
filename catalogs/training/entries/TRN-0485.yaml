  behavior: GE 图模式下含 HostCPU 自定义算子（经常量折叠）+ MirrorPad 等动态 shape 算子的训练图，折叠后下游算子的动态 shape 范围退化，重推导时行为与未折叠图不一致；无显式报错，表现为特定输入形状下结果错或后续 shape 校验异常。
  trigger_surface: CANN GE HostCPU 常量折叠 + 下游依赖 shape_range/origin_shape_range 的算子（MirrorPad 等）；修复 !5608 前
