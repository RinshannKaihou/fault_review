original:
  mechanism: 'cann/ge !5608（merged，2026-10-27，fix: 修复 HostCPU 常量折叠输出描述符属性丢失）：HostCPU 自定义算子常量折叠的输出从 gert::Tensor 转回 GeTensor 时会重建描述符，丢失 shape_range、origin_shape_range 等 GE 属性，可能使下游 MirrorPad 等算子的动态 shape 范围在重推导时退化。修复统一输出回收：以节点原 output desc 为基础，仅覆盖 gert 返回的 shape、origin_shape、dtype、format、origin format 和 placement，保留原有范围、origin dtype 及扩展属性；补 bottom 多输出 UT 并扩展 top UT 验证元数据更新、原属性保留与输出数据正确性。训练侧影响：GE 图模式训练（graph mode / HostCPU 自定义算子 + 动态 shape）中常量折叠后下游动态 shape 推导退化。'
