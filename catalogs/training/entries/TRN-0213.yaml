  mechanism: 'verl V1 trainer 的 `grpo_vectorized` estimator 跳过 session-aware 路径：多输出 session 的 reward 被 copy 到**每个中间输出**后进组统计——组均值/标准差把同一 session 的 reward 数 n 次；advantage 用中间输出的（被污染）组统计计算而非该 session 最终输出的统计。修复（PR #8100）= `GRPO_VECTORIZED` 纳入既有 final-output 选择 + advantage 广播路径（`grpo` 本就走）。'
  source: 'verl PR #8100（2026-10-03；真实 reward-copy 后处理器回归：3 session rewards `[1,4,5]` 存储成 `[1,4,5,5,5,5]`；reward-4 session advantage 修复前 `−0.104031` → 修复后 `+0.320256`；36 CPU 测试过、原始 dispatcher 下挂）。https://github.com/verl-project/verl/pull/8100'
  behavior: 无 crash——多轮 agent session 的 GRPO 组统计被**中间输出的重复 reward 加权**：长 session（输出多）的 reward 在均值/方差中被超权，advantage 符号在中间输出与最终输出间错配（实例中 advantage 直接翻号）。与 RL-ADV.07（singleton 组向量化 `*(c>1)` 清零 vs 标量透传）同族「**grpo_vectorized 的分组约定与 reward 语义错配**」：那边是 1-sample 组被清零、这边是 session 内多输出重复计数；与 RL-ADV.10（PF-PPO 重采样错配）同打击样本身份/分组记账。截至 2026-10-10 open。
