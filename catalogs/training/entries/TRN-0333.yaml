original:
  mechanism: 'MindSpeed-LLM issue #1734（2026-08-10 提，已 closed）：大模型训练中断后恢复，MindSpeed-LLM 目前只支持恢复模型参数和优化器状态，不支持数据加载顺序的恢复。恢复后 dataloader 从数据集头部重新开始加载，之前训练过的几个 epoch 的数据完全丢失（或与已消费进度不对应），造成数据分布偏移。官方没有提供数据偏移补偿方案，开发者需自己过滤已训练数据，实现复杂；长训练任务中断概率高，多次恢复后数据偏差累积。报告给出的量化影响：最终模型精度下降 0.2% 左右。issue 正文没有给出实现级修复补丁。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1734
  behavior: 训练中断后从 checkpoint 恢复，loss 与吞吐看起来都正常、不报错，但最终模型精度比不中断的基线低 0.2% 左右。核对数据可见恢复后 dataloader 从数据集头部重新取数，已训过的数据被跳过（或重复），恢复次数越多偏差越大。属于「只恢复权重和优化器、不恢复数据进度」导致的静默精度损失。
  trigger_surface: 断点续训（resume）+ 数据加载进度未随 checkpoint 保存
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
