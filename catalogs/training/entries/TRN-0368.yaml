id: TRN-0368
legacy_ids: []
slug: opsnn_bcegrad_target_weight_broadcast_missing
aliases: []
title: BCE 反向 target/weight 广播未生效越界读错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BCEBackward 广播处理
  behavior: aclnn CheckShape 只校验可广播性不 expand，下游 TBE 动态内核只 broadcast grad_output，target/weight 按元素总数读取越界。
effect:
  objects:
  - 梯度
  detail: target=[1x4]/weight=[N] 等文档支持的广播输入下 BCE 反向输出 4/8~7/8 元素错，fp32 最大超容差 1.8e6 倍。
  visibility: 静默错误
mitigation:
  detect: 训练前用小张量 CPU 对照 BCE 反向；检查 target/weight 是否为广播形状。
  fix: 待定（issue open，修复方向：aclnn 层 expand 后下发或 kernel 补广播）
