    stack: deepspeed
    component: universal ckpt 加载分支
  behavior: load_universal 分支跳过 load_module_state_dict，权重只从 zero/<param>/fp32.pt 恢复；ds_to_universal 只为优化器拥有的参数写该文件，冻结参数与 buffer 无来源。
