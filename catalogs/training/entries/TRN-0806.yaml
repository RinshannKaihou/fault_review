  detail: ZeRO-1/2/3 均复现：冻结 Linear 与 BatchNorm 的 weight/bias/running_mean/running_var/num_batches_tracked 加载后与保存值不同（max 差 0.17~2.0），训练从错误初值继续且无告警。
  visibility: 静默错误
mitigation:
  detect: 加载 universal ckpt 后逐 tensor 对比保存/加载 state_dict；确认已复制进 universal 目录的 *_model_states.pt 是否被消费
  fix: '待定（issue #9134 open，2026-11-20；未见修复 PR）'
