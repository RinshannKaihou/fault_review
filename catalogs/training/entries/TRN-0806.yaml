original:
  mechanism: DeepSpeedEngine._load_checkpoint 的 universal 分支用 `if not self.load_universal_checkpoint():` 跳过 load_module_state_dict（engine.py:4752 附近），认为权重都由 zero/<param>/fp32.pt 恢复；但 ds_to_universal 只给优化器拥有的参数写 fp32.pt，冻结参数与注册 buffer 从未落盘到 zero 目录。源 *_model_states.pt 已被复制进 universal 文件夹却不再被读取，于是新模型的初值原样留下。复现：DP=2，模型含冻结 Linear 与 BatchNorm1d，保存后用 ds_to_universal 转换并以 load_universal 加载到 seed 不同的新模型；ZeRO-1/2/3 三个 stage 输出一致：running_mean 差 0.7603、running_var 0.1719、num_batches_tracked 差 2、冻结 Linear weight/bias 差 0.3506/0.2357，可训练参数全部一致。
  source: DeepSpeed issue（open，2026-11-20；附 CPU/gloo 复现脚本与 master adcabcf9 实测输出）https://github.com/deepspeedai/DeepSpeed/issues/9134
  behavior: 从 universal checkpoint 恢复后作业能正常启动，loss 有限、无 warning，但冻结层和 BatchNorm 统计量仍是重新构建模型时的随机初值：冻结 Linear 的 weight/bias 与保存值差 0.35/0.24，running_mean 差 0.76、running_var 差 0.17、num_batches_tracked 差 2。冻结主干、adapter 外挂或带 BN 的模型会静默从错误状态继续训练，短跑难以发现。
  discovery: 2026-11-26 每日扫描
