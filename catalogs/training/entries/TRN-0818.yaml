original:
  mechanism: cann/ops-math 的 aclnnCol2Im 在 Ascend 910B2（CANN 9.2.1，master + PR !7757）上执行结果错误。!7757 之前 tiling 未注册、GetWorkspaceSize 直接返回 561002，问题不可见；!7757 只注册 tiling 与判空、未改 kernel，使算子可执行后暴露既有 kernel/tiling 覆盖缺陷：tiling 的 SetBlockDim(coreNum) 与每核像素范围（CalculateIntraCoreTileSize 的 basePixelsPerCore/bigCoreNum）和 kernel 实际写入范围可能不一致，部分输出像素未被任何核心写过。复现用 examples/test_aclnn_col2_im.cpp：输入 [1,12,9]、值 i%10 全有限，输出 [1,3,4,4] 调用前清零，kernel 2x2、stride 1、padding 0、dilation 1；aclnnCol2ImGetWorkspaceSize 与 aclnnCol2Im 均返回成功，但 48 个输出只有 10 个与 torch.nn.functional.fold 一致，32 个为错误的有限值（index 2 得 1.167118 期望 2.0，index 3 得 4.199203 期望 1.0，index 13 得 -7.281662 期望 8.0），6 个为 NaN（index 42~47），16 个为 0 但期望非零，index 9/10 为 -3.402823e38（疑似未初始化显存）。输入有限、输出预清零、示例只打印 48 个元素，排除示例缓冲区与越界读，作者定位为既有 kernel/tiling 覆盖问题而非 !7757 的 host 改动引入。col2_im 是 im2col 的逆运算，用于卷积反向把列梯度还原为输入梯度。
  source: 'cann/ops-math issue #5305（open，2026-11-26，Ascend 910B2 64GB / CANN 9.2.1 / master+!7757）https://gitcode.com/cann/ops-math/issues/5305'
  behavior: 在 910B2 上跑卷积（或任何用 col2_im 把列向量还原成特征图的路径）时，算子两段都返回成功、输出缓冲区也预先清零，但结果大面积不对：48 个输出元素里只有 10 个和 PyTorch fold 一致，32 个是明显离谱的有限值（比如应为 2.0 却得到 1.167），6 个直接是 NaN，还有 16 个该有值的位置是 0，个别位置留着 -3.4e38 这种未初始化残值。没有日志、没有错误码，只有和 CPU 参考对拍才会发现；反向传播里用它还原 gradInput 时，错值会直接进入上游梯度。
  trigger_surface: 910B2 + CANN 9.2.1，col2_im eager 调用，任意会走到未覆盖分核范围的 shape
  discovery: 2026-11-27 每日扫描
