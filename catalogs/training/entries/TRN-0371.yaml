original:
  mechanism: cann ops-nn aclnnBatchNormElemtBackward（norm/sync_batch_norm_backward_elemt，SyncBN 多卡路径）MeanByCounter()：auto reduceSumOut = l0op::ReduceSumOp(counterCasted, dim全部轴, false, executor) 后用总和作 sumDy/sumDyXmu 的除数；资料公式为逐元素除 counter，且资料自带示例即多元素 counter（counterShape={2} 值 {5,5}）。实测（A2 910B2、CANN 9.2.0）：counter=[2] 正确；counter=[2,2]（合法）gradInput=[-1,-1] vs 期望 [-2,-2]——整体被再除一次 2；两段 rc=0。空 counter 时输出全 NaN/Inf（问题 2，同单）。
  source: https://gitcode.com/cann/ops-nn/issues/7093（2026-10-21，open；含 C 复现）
  behavior: 多卡 SyncBN 训练（counter 天然多元素，每卡一个计数）在 NPU 上反向梯度整体缩小 C 倍（C=卡数/计数元素数），loss 看似正常下降但 BN 梯度尺度系统性偏小，多卡比单卡劣化且无任何报错；单元素 counter 的单卡路径不受影响。
