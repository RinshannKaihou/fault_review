id: TRN-0349
legacy_ids: []
slug: msllm_fsdp2_epochs_lr_total_steps_default
aliases: []
title: 只填 num_train_epochs 时 LR 调度按 100000 步算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: mindspeed-llm
    component: FSDP2 lr scheduler
  behavior: 只配置 num_train_epochs、不配 max_steps 时，cosine scheduler 用默认 100000 当 total_steps，而 dataloader 按样本量实际只排 609 步。
effect:
  objects:
  - 训练轨迹
  - 训练信号
  detail: 同一次启动里 scheduler 打印 total_steps=100000、训练器打印 609 步；cosine 只走 0.6%，lr 从 2.000000E-05 到 1.999993E-05，等效恒定学习率跑完 3 个 epoch。
  visibility: 静默错误
mitigation:
  detect: 启动后比对 scheduler 打印的 total_steps 与 Total optimization steps 是否一致
  fix: 'issue #1294（closed）未给修复 PR；规避是显式配置 max_steps'
