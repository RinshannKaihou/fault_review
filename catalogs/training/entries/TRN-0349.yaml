- url: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1294
  kind: gitcode_issue
relations: []
original:
  mechanism: 'MindSpeed-LLM master（A3，FSDP2 路径）用 training.yaml 配置训练：per_device_train_batch_size=1、gradient_accumulation_steps=2、dataloader_drop_last=True、数据 52044 条、num_train_epochs=3，max_steps 被注释掉（注释值是 180）。启动日志里 Building LR Scheduler 阶段打印 Creating ''cosine'' scheduler: lr=2e-05, min_lr=2e-07, warmup_steps=0, total_steps=100000，随后 Running training (FSDP2) 打印 Num examples = 52044 / Num Epochs = 3.0 / Total Batch Size = 256 / Total optimization steps = 609.0。即 scheduler 侧没有按 epoch×样本数/global batch 推出 609，而是落在 100000 的默认值上，两个 total_steps 各算各的。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1294（closed；环境 mindspeed-llm master + A3，配置与启动日志均在正文）
  behavior: 按 epoch 数训练时，日志第一屏就看得到 total_steps=100000，而 iteration 计数是 1/609、118/609、123/609 这样走。跑下来 learning rate 一直是 2.0E-05 附近（1.999993E-05），cosine 调度等于没生效，3 个 epoch 全程恒定学习率；除了两处数字对不上，没有报错也没有告警，很容易被当成正常训练。
  discovery: 2026-10-21 每日扫描
