  meta: 'stage: `sft` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 'verl 两个 SFT trainer（`sft_trainer.py` SPMD + `sft_trainer_ray.py`）都用**训练**全局 batch（`data.train_batch_size`，默认 256）构造**验证** loader，且 sampler 与 dataloader 双 `drop_last=True`；配置注释写明 `micro_batch_size_per_gpu: 4  # this is also val batch size`，但该字段在 val 路径从未被读。当 val 集小于每 rank train batch 尺寸时 loader 产出 **0 个 batch**，收尾 `torch.mean(torch.tensor([]))` = NaN。同仓 PPO 的 val loader（`drop_last=False` + 独立 `val_batch_size`）是现成的正确对照。'
  source: 'verl #7464（读 main 复现 + CPU 最小复现；两入口同错；含具体数值表：Ray 路径 200 样本 val × batch 256 → 0 batch → `val/loss=NaN`）。https://github.com/verl-project/verl/issues/7464'
  behavior: '`val/loss = NaN` 无警告、run exit 0；val 集略大于 batch 时静默丢尾部样本（300 样本 val 丢 5）。与 CKPT.07（死参数/影子参数）的边界：那边配置**声明了但没被消费**，这边字段在 train 侧正常消费、只是 train 的几何参数漏进了 val 构造——错的是 loader 装配而非配置面。观测面与 OBS.02 同型（图表被读成健康），但根因是「验证从未发生」而非空文件。'
  discovery: 2026-08-22 每日扫描
