original:
  mechanism: 'MindSpeed-LLM 018（Megatron-Core 0.18）下 MLA+MTP+DSA indexer 组合的三个问题（issue #1925，修复 MR !5153 已 merged）：(1) 功能性静默错误——MCore 对 MTP 内部层按预测深度从 1 编号而非接续 decoder 层号；CustomMLASelfAttention 未接收 is_mtp_layer，MTP 层映射到错误全局层元数据、错误参与 decoder Compute/Share 分组；DualPipeV+MTP 用原生 Megatron 类构建而非 mindspeed GPTModel。不抛异常、无堆栈。(2)(3) 启动即报错（variable_seq_lengths 在 pre_validate_args 尚不存在→AttributeError；SFT 路径 position_ids=None→TypeError），fail-fast 不入本条主体。受影响模型：DeepSeek-V3、GLM5/GLM5.2（同一 deepseek_spec attention 路径，examples/mcore/glm5/pretrain_glm5_744b_4k_A3_ptd.sh 同时开 --mtp-num-layers 与 --enable-dsa-indexer）。验证：端到端 DeepSeek-V3 SFT 16×910 跑完设定迭代、MTP loss 正常、无 NaN；但该用例 DSA indexer 关闭，问题一未端到端验证，需 GLM5 开 indexer 复核。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1925 ；修复：https://gitcode.com/Ascend/MindSpeed-LLM/merge_requests/5153
  behavior: 同时开 MLA+MTP+DSA indexer 训练 DeepSeek-V3/GLM5 类模型：训练正常推进、loss 正常输出、无 NaN 无报错，但 MTP 层的 DSA indexer 挂错全局层号并参与错误的 Compute/Share 共享分组、indexer loss 按错误层号记录——结构语义静默错位，产出的权重在 indexer 层号语义上与定义不符。配套的两个启动报错（AttributeError/TypeError）会把部分用户挡在门外，能跑起来的即进入静默面。
  discovery: 2026-10-16 每日扫描
