slug: mindspeed_llm_mtp_dsa_indexer_layer_mapping
aliases: []
title: MindSpeed-LLM MTP 层 DSA indexer 层号映射错且静默
kind: 故障
status: active
cause:
  objects:
  - subsystem: 模型定义
    stack: mindspeed-llm
    component: MTP 层号到全局层元数据的映射
  behavior: MCore 对 MTP 层按预测深度从 1 编号而非接续 decoder 层号；MindSpeed-LLM 未传 is_mtp_layer，MTP 层映射到错误全局层元数据、错误参与 Compute/Share 分组。不抛异常。
effect:
  objects:
  - 模型权重
  - 训练轨迹
  detail: 同时开 MLA+MTP+DSA indexer（DeepSeek-V3、GLM5/GLM5.2 同路径，glm5_744b 示例脚本默认开启）时：MTP 层 indexer 层号/共享关系错误、DSA indexer loss 按错误层号记录，无堆栈无报错，训练正常跑但结构语义已错。
  visibility: 静默错误
mitigation:
  detect: 核对 MTP 层 indexer 的全局层号与 Compute/Share 分组；开 DSA indexer 训练后检查 indexer loss 按层分布是否与结构一致。
  fix: 修复 MR !5153（merged）：_with_mtp_self_attention_spec 克隆 spec 注入 is_mtp_layer=True、resolve_dsa_indexer_build_config 把 MTP 深度映射到 decoder 层之后、DualPipeV+MTP 场景改用 dualpipev_mtp_model_provider_wrapper。端到端 DeepSeek-V3 SFT（16×910）跑通验证问题二/三与 layer-spec 路径；问题一（DSA indexer 改动）未被该用例覆盖（用例中 indexer 关闭），仍需开 indexer 的 GLM5 验证。https://gitcode.com/Ascend/MindSpeed-LLM/merge_requests/5153
