  meta: 'stage: `sft` · Cov: `NEW` · 置信度 `documented`'
  mechanism: trl `DPOTrainer._compute_loss` 的 `ipo` 与 `sigmoid_norm` 分支里长度归一化**分子分母掩码错位**：token logprob 用 `completion_mask[..., 1:]` 移位掩码（首 token 无前驱状态、不可打分），序列得分却除以**未移位**的 `completion_mask.sum()`。当截断使序列首位恰好是 completion token（`truncation_mode="keep_end"` 截掉整个 prompt、或空 prompt）时，分母多计 1 个从未进入分子的 token。普通非空 prompt 首位是 prompt token（completion_mask=0），数值不变——故障被门控在 keep_end/空 prompt 路径上，常规短测全绿。
  source: 'trl #6879（最小复现：completion_mask `[1,1,1]` vs scored `[1,1]`，ipo loss 实际 0.0278 / 正确值 0，梯度 -0.222 非零；作者备两行修复 + 参数化回归测试，同时点名 `sigmoid_norm` 同错）。https://github.com/huggingface/trl/issues/6879'
  behavior: 受影响样本的 ipo/sigmoid_norm **loss 值与参数梯度**系统性偏移（不止指标），无 crash 无 NaN；含短/空 prompt 的数据集里逐样本稀释梯度、扭曲 DPO 指标口径。与 OBS.06（纯诊断面、loss 路径正确）互补：这条直接改 loss 与梯度本身。
  discovery: 2026-08-24 每日扫描
