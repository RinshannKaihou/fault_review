id: TRN-0510
legacy_ids: []
slug: verl_k3_kl_cancellation_wrong_rejection
aliases: []
title: verl k3 KL 相减消去致拒绝判定反转
kind: 故障
status: active
cause:
  objects:
  - subsystem: RL训练回路
    stack: verl
    component: k3 估计 exp(x)-1-x
  behavior: k3 KL 估计用 exp(x)-1-x：x 接近 0 时对接近 1 的指数减 1 发生灾难性消去，x=-1e-4 时统计量为负（-1.66e-8，应为 +5e-9）。
effect:
  objects:
  - 训练信号
  detail: seq_sum_k3 阈值 1e-4 时本应拒绝的序列被保留、token_k3 阈值 1e-8 时 x=+1e-4 被误拒——KL 惩罚、rollout 拒绝采样与 off-policy 诊断三处 k3 表达式同病；作者明示未确立端到端训练回归。
  visibility: 静默错误
mitigation:
  detect: 小 log-ratio 输入下与 fp64 基准或 expm1(x)-x 对照 k3 值与符号
  fix: 修复 PR https://github.com/verl-project/verl/pull/8386（open，2026-10-26）——三处 k3 表达式改用数学等价的 torch.expm1(x)-x；Windows/py3.12/torch2.13 CPU 验证
