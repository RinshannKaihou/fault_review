original:
  mechanism: 'verl-project/verl #8386（2026-10-26，open PR）：KL 惩罚、rollout 拒绝采样与 off-policy 诊断三处 k3 KL 估计用 exp(x)-1-x，数学上等价但 x 接近 0 时对接近 1 的指数减 1 发生灾难性消去。fp32 x=-1e-4：现行拒绝统计量≈-1.65965e-8（k3 非负，fp64 参考≈4.99983e-9）；32768 token 求和≈-5.43833e-4 而非 1.63835e-4。seq_sum_k3 阈值 1e-4 配置下未打补丁的实现保留本应拒绝的序列；x=+1e-4 时 token_k3 阈值 1e-8 误拒。作者明示：以上是小 log-ratio 与严格阈值下的数值与阈值错误示例，未确立端到端训练回归或模型质量改善。修复改用 torch.expm1(x)-x（等价、无消去）；Windows 11/py3.12.13/torch 2.13.0+cpu/TensorDict 0.10.0 本地 CPU 验证；查重确认无其他 open PR 处理这三处表达式（#8377/#8378 是别的文件的 logprob/CE 精度、#2928 是 KL 下钳位）。'
  source: https://github.com/verl-project/verl/pull/8386
  behavior: RL 训练用 k3 KL 估计（KL 惩罚/rollout 拒绝/off-policy 诊断）且 log-ratio 接近 0（近 on-policy）时，k3 统计量因浮点消去可算出负值：按 seq_sum_k3 或 token_k3 阈值做的序列拒绝判定反转——该拒的留下、该留的拒掉；KL 惩罚项同源失真。数值量级小（1e-8/token）但 3 万 token 求和后达 5e-4，足以越过严格阈值。无报错；与 fp64 基准对照才能发现。
  trigger_surface: verl k3 KL 三处表达式（惩罚/拒绝采样/诊断）；近 on-policy 小 log-ratio（|x|~1e-4）+ 严格阈值（1e-4/1e-8 量级）；fp32
  discovery: 2026-10-29 每日扫描
  notes:
  - '2026-10-30 2026-10-30 回访：verl k3 修复 PR #8386 仍 open 未合入；同日新增 CANN mhc 1-σ(z) 消去同族条目 TRN-0536（var→本条）'
