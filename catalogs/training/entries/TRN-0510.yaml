remarks: 与 TRN-0220（OpenRLHF k3 先 exp 后 clamp 致反向 NaN 梯度）同属 k3 KL 估计数值面：本条是 exp(x)-1 的 catastrophic cancellation 致阈值判定反转，非溢出 NaN；不同栈（verl）不同失效模式
