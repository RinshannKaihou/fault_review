id: TRN-0431
legacy_ids: []
slug: opsnn_deep_norm_meanout_rstdout_tail_dim_unchecked
aliases: []
title: DeepNorm meanOut/rstdOut 尾维形状不校验致越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnDeepNorm
  behavior: aclnnDeepNorm 的校验（CheckDeepNormShapeValue）只校验 meanOut/rstdOut 的前导维与维数，不校验归约维（尾维）为 1；尾维非 1 或 0 时接口不报参数错误，仍继续执行输出写入。
effect:
  objects:
  - 数值结果
  - 模型权重
  detail: meanOut=[3,1,2] 时只写 3/6；=[3,1,0] 时 0 元素声明仍被写入；mssanitizer 报 6 次 illegal write of size 4（DeepNorm_03_high_performance_18）。
  visibility: 静默错误
mitigation:
  detect: mssanitizer memcheck；出参形状变异扫描。
  fix: 待定（issue open，未见修复 MR）。
