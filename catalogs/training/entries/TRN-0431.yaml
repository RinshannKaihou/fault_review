original:
  mechanism: 'cann/ops-nn #7296（2026-10-25，open，A3 + A2 910B2 / CANN 9.2.0 / master f834b617）。aclnnDeepNorm 只校验 meanOut/rstdOut 的前导维与维数、不校验归约维（尾维）为 1：meanOut=[3,1,2] 两段 0/0 但只写 3/6 元素；[3,1,0] 声明 0 元素仍被写入 1；mssanitizer memcheck 在 DeepNorm_03_high_performance_18 kernel 报 6 次 illegal write of size 4。同族 #7039 为反向算子 aclnnDeepNormGrad 的同类缺陷（本条为前向，校验代码 deep_norm_shape_check.h::CheckDeepNormShapeValue，arch22/arch35 共用）。'
  source: https://gitcode.com/cann/ops-nn/issues/7296
  behavior: DeepNorm 前向把 mean/rstd 输出的尾维写错（非 1 或 0）时接口不报参数错误：输出只写一部分、甚至写出到声明的元素范围之外，越界写可被 memcheck 抓到；正常形状对照正确。
  trigger_surface: aclnnDeepNorm，meanOut/rstdOut 尾维非 1 或 0；A3 校验缺失 + A2 910B2 越界写实测 / CANN 9.2.0。
