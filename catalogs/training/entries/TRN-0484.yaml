original:
  mechanism: 'Ascend/torchair #901（2026-10-27，closed）+ 修复 !3905（merged，fix atan2 input order for ASCIR）：torchair 图模式（AF）下 atan2 的 x/y 入参顺序不正确。报告者 16 位置表×32 模式共 512 点对照：NPU_eager 全部等于 atan2(y,x) 真值；AF 全部等于 atan2(x,y)（即参数互换）；match 判定：AF 匹配 atan2(y,x) 64/512（仅 y==x 对角线）、匹配 atan2(x,y) 512/512；iteration=1 输出 mismatched 448/512，ACCURACY_FAIL；±pi 附近错误 0、非有限值错误 0。修复 !3905 已 merged。图模式训练（dynamo/torchair 落图）中使用 atan2（如 RoPE 变体、极坐标特征、某些 GAN 损失）会得到系统性互换的结果。'
