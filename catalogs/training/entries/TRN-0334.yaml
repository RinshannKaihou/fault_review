original:
  mechanism: 'MindSpeed-LLM issue #1818（2026-08-31 提，已 closed；环境 MindSpeed-LLM f685ac7164f3df0034288ace956aba2085a1c817 + MindSpeed v0.12.1）。两个缺陷同处 fused DSv4（DSA）indexer loss 路径：(1) loss_coeff 仅用于 loss 日志，未在反向的 indexer 梯度缩放中生效，因此任何正的 indexer-loss-coeff 产生的实际 indexer 梯度都一样——把 loss_coeff 从 1.0 改成 0.1，日志里的 dsa_indexer_loss 缩小 10 倍，但 gnorm 不变；只有设成 0.0 关掉 fused indexer-loss 分支，gnorm 才显著下降。修复方式是把 loss_coeff 直接乘进 indexer 梯度 scale：indexer_scale = grad_scale * loss_coeff / num_seqs。(2) fused indexer loss 路径没有消费 MCore schedule 设置的 microbatch loss scale：非融合路径用 DSAIndexerLossAutoScaler.set_loss_scale(loss_scale / num_microbatches)，而融合的 SparseFlashMlaWithIndexerLossFunction 保持默认梯度 scale 1.0；当前配置 num_microbatches = 8，使融合 indexer 的辅助梯度相对主 loss 实际大约 8 倍。修复统一 indexer loss scale 设置，并在反向应用 indexer 梯度缩放前让融合路径读到正确的运行期 scale。对应 PR !4993。'
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1818 ；修复：https://gitcode.com/Ascend/MindSpeed-LLM/pull/4993
  behavior: 开 DSA indexer loss 的 DeepSeek-V4 训练里，调 --indexer-loss-coeff 不改变实际训练效果：日志中 dsa_indexer_loss 按比例变小，但 grad norm 一点不变，只有把 coeff 设成 0 才真正关掉辅助 loss。同时因为 micro-batch 数为 8，indexer 的辅助梯度比预期大约 8 倍，主/辅 loss 配比与配置意图不符。全程无报错、无 NaN，只能靠改 coeff 前后对比 gnorm 才能发现。
  trigger_surface: fused DSv4/DSA indexer loss + indexer-loss-coeff + num_microbatches>1
  discovery: 2026-10-20 每日扫描（NPU 历史 issue 回填）
