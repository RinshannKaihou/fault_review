id: TRN-0334
legacy_ids: []
slug: mindspeed_llm_dsv4_indexer_loss_coeff_microbatch_scale
aliases: []
title: DSv4 indexer 梯度漏乘 coeff 与 mbs 缩放
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: mindspeed-llm
    component: fused DSv4 indexer 梯度缩放
  behavior: fused indexer loss 路径把 loss_coeff 只用于日志、未作用于反向梯度缩放，且未消费 MCore schedule 的 micro-batch loss scale，默认梯度缩放恒为 1.0。
effect:
  objects:
  - 梯度
  - 训练轨迹
  detail: indexer-loss-coeff 从 1.0 调到 0.1 时日志 dsa_indexer_loss 降 10 倍而 gnorm 不变，只有设 0.0 才关分支；num_microbatches=8 时 fused indexer 辅助梯度约大 8 倍，主辅 loss 配比失衡。
  visibility: 静默错误
mitigation:
  detect: 改 indexer-loss-coeff 后同时看 dsa_indexer_loss 与 gnorm：日志 loss 变而 gnorm 不变即为未生效；再把 fused 与非 fused 路径的 indexer 梯度逐元素对比。
  fix: 修复 PR https://gitcode.com/Ascend/MindSpeed-LLM/pull/4993 ：indexer_scale = grad_scale * loss_coeff / num_seqs，并让 SparseFlashMlaWithIndexerLossFunction 读取与未融合路径一致的 loss_scale/num_microbatches（状态未核实）。
