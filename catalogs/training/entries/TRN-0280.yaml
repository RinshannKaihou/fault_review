original:
  mechanism: 'triton-ascend issue #2531（2026-10-13，open）：TORCHINDUCTOR_NPU_BACKEND=triton_experimental 下，torch.compile 的 fused attention（fp16、带 attn_mask）约 97% 元素与 eager 不符、5/5 确定性复现；误编译内核为 fused softmax（行 max + exp + sum 归约）。唯一触发条件：归约轴长度 r0_numel 被作为 ASTSource 级编译期常量烧入（由 torch_npu _inductor/triton_experimental/codegen/triton.py 注入，本意是 R0_BLOCK==r0_numel 时证明 r0_mask 恒真以消边界检查）。同内核同配置 [XBLOCK=16,R0_BLOCK=96,num_warps=16,num_stages=1]：①常量 96 烧入→二进制 470d5cbe…→约 97% 错；②运行时 i32 传参→c3d43aea…→mismatch=0/36864。已用真机探针排除 num_stages/grid/sanitize_overflow/enable_vf_fusion/mix_mode/debug/dtype/num_warps/全部 22 个 autotune 候选。环境：Ascend 910B2 单卡、CANN 9.2.0-beta.2、triton-ascend 3.5.0、torch/torch_npu 2.15.0.dev20260917。triton-ascend 内部出错 pass 未定位（需编译器侧继续）；torch_npu 侧规避方案与 A/B 实测（113/4/9/1→唯一变化该用例 FAIL→PASS）随 issue 提供。Ascend/pytorch #5366（2026-10-13）报告的同面现象（SDPA 无融合路径 + 带 attn_mask 编译后 97.9%/98.1% 不符、exp2 分支最可疑未证明）即该缺陷的 torch_npu 侧表层，本条为其编译器侧定位。'
  source: https://github.com/triton-lang/triton-ascend/issues/2531 ；同现象面：https://gitcode.com/Ascend/pytorch/issues/5366
  behavior: triton_experimental 后端 torch.compile 下，SDPA 带 attn_mask（fp16）编译结果与 eager 不一致（约 97% 元素错、确定性复现）；影响所有「静态 r-numel + R0_BLOCK==rnumel」的 linearized reduction 内核。无报错，编译期常量特化不应改变数值语义。
  discovery: 2026-10-15 每日扫描
