id: TRN-0280
legacy_ids: []
slug: triton_ascend_static_rnumel_miscompile
aliases: []
title: triton-ascend 常量特化 r-numel 致行 max 归约误编译
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 归约轴长度编译期常量特化
  behavior: 归约轴长度 r0_numel 被作为 ASTSource 级编译期常量烧入，导致 fused softmax（行 max+exp+sum 归约）内核误编译。
effect:
  objects:
  - 数值结果
  detail: triton_experimental 后端 torch.compile 下 SDPA+attn_mask（fp16）约 97% 元素与 eager 不符，5/5 确定性复现；同内核同配置下，r0_numel 常量 96 烧入约 97% 错，运行时 i32 传参 mismatch=0/36864。
  visibility: 静默错误
mitigation:
  detect: 编译前后数值对账（eager vs compiled）；ASTSource constants 是否含 r0_numel 可静态检查。
  fix: '本源未修（triton-ascend 内部出错 pass 未定位）。临时规避：torch_npu 侧去掉静态 r-tree numel 的常量注入（codeg/triton.py），令 r0_numel 回到运行时 i32 传参，放弃 R0_BLOCK==rnumel 时消 r0_mask 边界检查的编译期收益，本源修复后应撤除。同文件 rsplit 组合核 constants:{r0_numel: total_cores} 疑似同型风险。'
