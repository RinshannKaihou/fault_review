original:
  mechanism: 'cann/ops-nn #7760（2026-10-30，Atlas A2 910B2、CANN 9.2.0 version 26.1.1、activation/swi_glu）：aclnnSwiGlu 在 out 张量形状小于由 x 推导的输出形状时不做校验：两段接口返回 0，kernel 按 x 推导长度（x.numel()/2）写 out 的 GM 地址，越过 out 缓冲区尾部。实测 x=fp32[2,32] dim=-1、out=fp32[2,8]：msSanitizer 报 illegal write of size 64（SwiGlu_2_high_performance_0）；写回的前 16 元素与正确输出一致，多出 16 个 fp32（64B）落分配外。out 偏大时只写前 32 元素、其余保持调用前内容，同样无报错。含完整 C++ 复现。同族越界写：#7756（SquaredRelu）、#7654（GeluMul 族，INF-2261）。'
  source: https://gitcode.com/cann/ops-nn/issues/7760
  behavior: NPU 调用 SwiGlu 时 out 张量分配偏小（形状推导错误、复用缓冲过小）：接口成功返回、前段结果正确，但多出的输出越过缓冲区写到相邻显存（实测 64B 越界写）；out 偏大时后半保持旧值。两种情况都无报错，相邻张量被静默破坏，sanitizer 才能抓到。
  trigger_surface: CANN aclnnSwiGlu + out 形状小于推导输出；910B2/CANN 9.2.0
