original:
  mechanism: triton-ascend（torch 2.10.0+cpu / torch_npu 2.10.0.post7+git51c843b / triton 3.6.0 / Ascend 910B4 / CANN 8.5.1）：DeepSpeed AutoEP 启用 Triton gather_rows kernel（deepspeed/moe/ep_kernels.py 的 _gather_rows_kernel）做 forward token reordering 后，world_size=2 时 rank1 设备故障两种形态：① 静默楔死（3/3 复现）rank1 前向内不再产出、rank0 在下一 collective 等它约 600s 后 ACL runtime ERR00100 超时；② 偶发 host 同步直接报设备异常 dump——MTE 指令访问 DDR 地址越界（aivec vector core 异常 error code 0x800000、retCode 0x31、多核同一 PC）。因果对照：permute 路径切回 torch fallback 后同 2-rank 测试 29.87s 全通过；单进程裸扫 kernel 同 shape 不 fault，故障依赖 2-rank 上下文。kernel 来自 DeepSpeed ep_kernels 裁剪。open 0 评论，未定位到具体代码行。
  source: https://github.com/triton-lang/triton-ascend/issues/2648（2026-10-20，open；含两形态复现与因果对照脚本）
  behavior: NPU 上跑 DeepSpeed AutoEP MoE 训练（2 卡及以上）：前向随机卡死——某 rank 不再出结果，其他 rank 在 collective 上等它直到 ~600s 报 PTA call acl api failed 超时，job 挂起无崩溃无报错；偶尔直接抛 MTE 地址越界设备异常。关掉 Triton permute 用 torch fallback 立即恢复。表现为 EP 训练偶发挂死/设备异常且难复现（单进程不复现），多卡回归测试期间尤甚。
  discovery: 2026-10-23 每日扫描
