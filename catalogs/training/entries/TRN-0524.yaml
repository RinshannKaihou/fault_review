    component: gelu_mul 输出布局处理
  behavior: aclnnGeluMul 的 out 传非连续 Tensor（资料声明不支持）时不拒绝也不转换，kernel 按连续布局写入，调用方按自己的 stride 读回错位值；两段接口均返回 0
effect:
  objects:
  - 数值结果
