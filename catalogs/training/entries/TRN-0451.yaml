- url: https://github.com/verl-project/verl/issues/8376
  kind: github_issue
relations: []
pattern: PAT-TRN-0054
original:
  mechanism: 'verl #8376（2026-10-25，open，verl main@3c6d9b43 / torch 2.9.1+cu128 / Triton 3.5.1 / RTX 3090）。logprobs_from_logits_naive / logprobs_from_logits_v2（verl/utils/torch_functional.py）与 Triton fused linear cross-entropy（kernels.py，use_fused_kernels=True）都以 z_t-logsumexp(z) 计算：标签 margin m>16.6 时 fp32 的 1+exp(-m) 舍入为 1，logprob 与标签梯度 1-p_t 精确为 0，其余 -p_j 保留 → 梯度和≠0。bf16 分支 v2 用 bf16 log_softmax，CPU 上 margin~5.5 即舍入。30.0 margin 复现：logprob=0、label_grad=0、other_grads_sum=-2.994e-09；fp64 参考 logprob=-2.994e-09。确信标签（易分类样本）的监督信号被静默丢弃。'
  source: https://github.com/verl-project/verl/issues/8376
  behavior: 当训练标签是模型非常有把握的（logit 领先其他 16.6 以上）时，fp32 下这个样本的 logprob 和它自己的梯度都被算成精确 0：监督信号静默消失，且因为其他 token 的梯度还在，梯度总和不等于零；bf16 下 5.5 的把握度就会触发。
  trigger_surface: verl logprob 计算（naive/v2/Triton fused linear CE），标签 margin>16.6（fp32）或 >5.5（bf16 log_softmax 分支）；torch 2.9.1/Triton 3.5.1 实测。
  discovery: 2026-10-26 每日扫描
