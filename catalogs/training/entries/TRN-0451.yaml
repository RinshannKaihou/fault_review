id: TRN-0451
legacy_ids: []
slug: verl_logprob_margin_fp32_rounds_to_zero
aliases: []
title: verl 确信标签 logprob 与梯度 fp32 舍入到 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: verl
    component: logprobs_from_logits
  behavior: logp_t=z_t-logsumexp(z) 把标签自身 exp(0)=1 计入和式：margin 超 ~16.6 后 fp32 的 1+exp(-m) 舍入为 1，logprob 与标签梯度变精确 0，其余梯度保留。
effect:
  objects:
  - 梯度
  - 训练信号
  detail: 30.0 margin 下 logprob=0、label_grad=0、other_grads_sum=-2.994e-09（fp64 参考 -2.994e-09）；bf16 分支 margin~5.5 即触发；Triton fused linear CE 同病。
  visibility: 静默错误
mitigation:
  detect: 大 margin 标签（如 30.0）单元对拍 fp64；检查梯度逐元素和是否为零。
  fix: 待定（issue open，未见修复 PR）。
labels:
  stage:
  - rl
  confidence: documented
  coverage: NEW
  discovered: '2026-10-26'
remarks: ''
