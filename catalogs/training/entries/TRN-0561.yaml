original:
  mechanism: 'cann/ops-nn #7791（2026-10-30，open）+ 修复 MR !13097（open，2026-10-30 更新）：FakeQuantWithMinMaxVarsPerChannel 在 TTK geir 通路 L0 精度用例 22 例 FAIL（Ascend950PR，cann/golden/ttk 20261013，fp32 absolute_precision 1e-08）。三类问题：1) 倒置通道（min>max，per-channel 三输入独立采样必然出现）：NPU/golden 链 clamp 顺序（先 max 后 min）与 TF 原生 functor（先 min 后 max）在倒置域相反，域偏差达量程全跨度（max_abs_error≈200）；2) 相等通道（min==max≠0）：kernel 退化清零输出 0，TF 语义 NaN（Nudge inv_scale=qRange/(max-min)=inf → 0×inf=NaN），比对呈 Expected: nan/Actual: 0.0；3) round 0.5 边界：golden inv_scale 两步舍入与 IEEE 单步差 1 ULP，±1 量化级失配超门限。训练侧 QAT 伪量化（FakeQuantWithMinMaxVars 系）在含倒置/相等通道校准数据下激活偏离 TF 参考实现。'
  source: https://gitcode.com/cann/ops-nn/issues/7791 + 修复 MR https://gitcode.com/cann/ops-nn/pull/13097（open）
  behavior: NPU QAT 训练用 FakeQuantWithMinMaxVarsPerChannel 伪量化、校准统计出现倒置通道（min>max）或相等通道（min==max≠0，常见于死亡通道/极端裁剪）时：伪量化输出与 TF 参考实现语义相反/输出 0 而非 NaN——QAT 模拟的量化噪声全错，训练仍正常跑完，最终量化模型精度劣化且难以归因。
  trigger_surface: CANN FakeQuantWithMinMaxVarsPerChannel + 倒置通道（min>max）或相等通道（min==max≠0）+ QAT 训练；950PR 实测
  discovery: 2026-10-31 每日扫描
