original:
  mechanism: 'cann/ops-transformer #6657（2026-10-24，open，A2 910B2 / CANN 9.2.0）。aclnnChunkKdaFwd 在尾块长度 l_c∈(32,48)（chunk 未填满且填充行数落在 32~47 行）时，该 chunk 中 chunk-relative row 32..l_c-1 的 aqkOut 与 attnOut 被整体放大 sqrt(K) 倍（K=64、scale=1/8 时恰 8.000 倍），两段接口均返回 0。比值随 1/scale 变化而非固定 8 倍：K=16→3.87、K=32→5.19、K=64→8.00，说明尾行块丢失 scale 乘法。l_c∈{20,48,52,56,60,63} 正确、{36,44} 错误，是行块截断边界问题；单 chunk 与全长块+尾块两种排布均复现。报告者自实现 fp64 CPU 参考逐行打印比值，机制定位到尾行块缺 scale 乘法，未见源码行级定位。ChunkKdaFwd 是 chunked KDA/DeltaRule 线性注意力前向算子，训练路径直接使用。'
  source: https://gitcode.com/cann/ops-transformer/issues/6657
  behavior: 用 chunked Delta Rule/KDA 线性注意力训练时，如果某序列的尾块（最后不满一块）长度在 33~47 行之间，这一块尾部约十几行的前向输出（aqk/attn）会比正确值整体大 4~8 倍（等于 1/scale），其余行正常、无任何报错；训练 loss 可能看不出突变，但隐状态已错。
  trigger_surface: aclnnChunkKdaFwd，尾块长度 l_c∈(32,48)；A2 910B2 / CANN 9.2.0 实测，单 chunk 与全长+尾块排布均触发。
  discovery: 2026-10-25 每日扫描
