original:
  mechanism: 'verl main @2035f58 的 PrimeRewardManager（verl/workers/reward_manager/prime.py）：reward 函数返回 dict（如 {"score":1.0,"acc":True,"pred":"42"}——math_dapo.compute_score、rlla.compute_score 与 default_compute_score 均直接透传 dict）时，结果处理循环抛 KeyError: 0，被 PrimeRewardManager.verify 的 except Exception 兜底捕获，整批奖励置 0.0 并 print 单行错误。NaiveRewardManager、BatchRewardManager、DAPORewardManager 均有 isinstance(score, dict)→score["score"] 分支，仅 prime manager 缺失。CPU-only 最小复现见 issue。'
  source: https://github.com/verl-project/verl/issues/8216
  behavior: 'GRPO 类 RL 训练中，自定义/数学类 reward 函数返回 dict 时：reward 均值突然归 0、advantage 全 0、策略基本不更新，训练不崩、无 traceback，控制台只有一行易被刷屏淹没的 [Error] Unexpected error during scoring. Setting all as 0. KeyError: 0。用户看到的是「reward 模型忽然全给 0 分」，极易误判为 reward 函数或模型质量问题。'
