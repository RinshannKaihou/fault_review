  meta: 'stage: `rl` · Cov: `var:bf16_vs_fp16_rl_engine_mismatch` · 置信度 `verified`'
  mechanism: OpenRLHF grouped advantage（GRPO/PPO 组统计）直接继承 reward 张量的 dtype：**BF16 reward model** 的输出先于组中心化被舍入——`[1, 1, 1, 1.0078125]` 的组归一化 advantage 得到 ≈`[0, 0, 0, 2]` 而非 `[-0.5, -0.5, -0.5, 1.5]`（组内差 < BF16 ULP，基线被舍入掉），PPO 梯度随之改变；integer reward 在组统计/分数惩罚下直接失败；FP16 常数组可产生 NaN。修复 = 组统计前把 reward 提升到 ≥FP32（保留 FP64 输入），复用既有 logged-reward 同步。验证：92 测试全过（六种估计器、多种 dtype 含 FP64、常数组、分数惩罚、参照 PPO 梯度）+ CPU 上以真实 OpenRLHF reward head + 随机初始化 tiny BF16 Llama 对 float64 算术参照吻合。
  source: 'OpenRLHF PR #1334（2026-09-11；BF16 RM 的组基线舍入实例 + 修复）。https://github.com/OpenRLHF/OpenRLHF/pull/1334'
  behavior: 无 crash——BF16 RM 下组内小幅 reward 差被舍入抹平：GRPO 的组相对信号**劣化为阶跃**（要么全零要么放大），细粒度偏好学习静默失效；混合 dtype 管线（RM bf16、trainer fp32）最脆弱。与 NUM.02（bf16/fp16 RL 引擎 mismatch）同族：**RL 管线 dtype 边界的精度契约**，这边打击点在 reward→advantage 的组统计入口；与 RL-ADV.01（组 std=0 零学习）症状相似但根因不同：那边统计上真无差、这边**有差被舍入掉**。
  discovery: 2026-09-12 每日扫描
