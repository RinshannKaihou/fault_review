original:
  mechanism: 'DeepSpeed PR #8960（2026-10-30，open）：sequence_tiled_compute(..., output_reduction="mean") 会重缩放加到同一 loss 的其他项梯度。原因：SequenceTiledCompute.backward 对 autograd 传入的 incoming_grad 执行 incoming_grad /= shards（原地除）；对 tiled + other 复合 loss，两个分支收到同一张量，另一项的梯度也被除以 shards。修复：out-of-place 除。TiledMLP 从不改写入梯度、TiledFusedLogitsLoss 除自己的张量，均无此缺陷。测试：CPU（Apple M2 Pro, torch 2.11.0）新测试把 tiled 结果与 x.sum() 两种顺序求和，修前 max diff 0.75 失败、修后 26 通过。未覆盖 GPU、DistributedTest、ZeRO 与多 rank 序列并行。'
  source: https://github.com/deepspeedai/DeepSpeed/pull/8960
  behavior: 训练 loss 里把 sequence_tiled_compute 输出与任何其他项相加（如正则、辅助 loss）且 output_reduction=mean 时：另一项的梯度被静默除以 shards（序列切分数），复合 loss 的梯度权重失衡，训练仍正常运行、无报错，与单卡参考对拍梯度才能发现（实测偏差 0.75 量级）。
  trigger_surface: DeepSpeed sequence_tiled_compute（Ulysses ALST 序列切分）+ output_reduction=mean + 复合 loss 相加
  discovery: 2026-10-31 每日扫描
