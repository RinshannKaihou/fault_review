  behavior: SequenceTiledCompute.backward 对传入梯度原地 /= shards：tiled+other 复合 loss 下 autograd 把同一张量发给两分支，另一项梯度也被除 shards 倍
effect:
  objects:
  - 梯度
  detail: 把 sequence_tiled_compute 输出与任何其他项相加且 output_reduction=mean 时，另一项梯度被静默除以 shards；TiledMLP 不改写入梯度、TiledFusedLogitsLoss 只除自己的张量，无此缺陷；CPU 测试修前失败、修后 26 通过
  visibility: 静默错误
mitigation:
  detect: 对 tiled+other 复合 loss 与单卡参考对拍梯度；检查 autograd 传入梯度是否被原地修改
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8960（open，改为 out-of-place 除法，未合入）
