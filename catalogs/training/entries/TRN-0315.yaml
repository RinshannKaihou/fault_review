original:
  mechanism: 'cann/ops-transformer MegaMoE GMM loop 的同步轮次（IncrementSyncCount）在旁路 GM 写之后缺少 asc_sync_data_barrier(mem_dsb_t::DSB_DDR)：后续发送/校验 count 会重新读取同一个 sequence，而 MTE3 事件不保证 Scalar 旁路写已完成。此前该缺失被维测打点（通用打点引擎与 MegaMoE GMM loop 打点执行 GM 写、DCCI、tiling 备份搬运及对应事件）改变的执行时序掩盖；修复 MR !14046 增加默认开启的编译期维测开关 MC2_ENABLE_EXCEPTION_DUMP（默认 1），关闭维测（=0）后八卡 Static 场景即停在 count epoch 校验：本轮预期 0xE9，一个槽仍为 0xE8000012（旧值未更新），其余槽为 0xE9000012，接收端持续等待、Cube 随后等待 countReady。修复在旁路写后补 DSB_DDR 屏障（反汇编确认 ST_DEV.b32 后、跨核通知前增加 DSB #1），并在 C API 迁移候选上完成八卡验证：每卡 210 次 + 连续 12 次重放的 1260 次调用通过、30/30 原生 moe_test 用例通过；ON/OFF 数值对照尚未完成（共享测试资源不可用，PR 保留 WIP），性能测试通过不视为数学精度验证。复现配置：EP8、每卡 BS72、H5120、I2304、3 个路由专家、1 个共享专家、topk6、预量化 A8W4/共享 A8W8。训练侧影响：MegaMoE 为 MoE 专家并行通信算子，八卡 EP 训练图中该同步缺失直接导致图挂起（可用性故障、延迟暴露）；修复未合入前关闭维测的部署都会暴露。'
  source: 2026-10-18 GitCode cann/ops-transformer MR https://gitcode.com/cann/ops-transformer/merge_requests/14046 （WIP open）
