original:
  mechanism: 'DeepSpeed !8984（2026-11-02 open 修复载体）。NVMe optimizer offload 下 load_checkpoint 自 #7613 起跳过 ZeRO 优化器 ckpt（当时为规避 #7549 加载崩溃）：resume 丢 Adam state、lr、fp16 loss scale、以及小于 swap 最小尺寸不换出子组的权重。#7549 崩溃根因：换出子组的优化器状态保存为空张量，swapper 只换超过最小 size 的张量故未读回，CPU Adam 对空张量步进。修复：swap 文件拷贝后重新加载 ZeRO ckpt；swap-in 前空状态不分配内存地恢复子组 size，swapper 从 swap 文件读回；save_muon_momentum_buffer_in_memory 的 Muon 动量载入既有 buffer。'
  source: deepspeedai/DeepSpeed https://github.com/deepspeedai/DeepSpeed/pull/8984（open 修复载体）
  behavior: ZeRO-3 + NVMe 优化器 offload 的训练断点续训时，load_checkpoint 表面成功，但优化器状态整个没加载：Adam 动量/二阶矩从零开始、学习率回到初始调度、fp16 loss scale 重置、部分小子组权重也没恢复。训练继续跑、无报错，但从 resume 第一步起优化轨迹就与断点前不一致——等价于用旧权重重新热身，长跑任务的收敛进度静默回退。
  discovery: 2026-11-03 每日扫描
