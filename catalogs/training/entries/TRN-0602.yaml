    stack: deepspeed
    component: ZeRO ckpt load (NVMe)
  behavior: '#7613 起 load_checkpoint 跳过 ZeRO 优化器 ckpt，NVMe offload resume 丢 Adam 状态/lr/scale/小子组权重；根因是换出子组状态存为空张量、swapper 不读回'
effect:
  objects:
  - 优化器状态
  - 模型权重
  detail: NVMe 优化器 offload 下断点续训：加载无报错但 Adam 动量/variance 从零开始、lr 调度重置、loss scale 重置、小子组权重丢失——恢复后的训练轨迹与断点前不可衔接，静默偏离
  visibility: 静默错误
mitigation:
  detect: NVMe offload resume 前后对比优化器状态 checksum（exp_avg/exp_avg_sq/lr/scale）；空张量状态探针
  fix: 修复 PR https://github.com/deepspeedai/DeepSpeed/pull/8984（open）：重新加载 ZeRO ckpt（在 swap 文件拷贝后）；swap-in 前每个空状态按子组大小恢复 size（不分配内存），swapper 从 swap 文件读回；Muon 内存 buffer 载入既有 buffer
