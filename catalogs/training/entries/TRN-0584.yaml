original:
  mechanism: 'cann/ops-transformer #7004（2026-11-01 open）+ 修复 !15092（open）。attention/lightning_indexer/op_kernel/arch22/lightning_indexer_kernel_arch22.h：ProcessVec 在 487 行用 LIServiceVec::CopyOut 把部分 top-k 结果写入 vec1ResGm（MTE3 写），488 行只排序 MTE3_V；ProcessDecode 经 SyncAll 后调用 ProcessLD（681-683 行），ProcessLD 在 584-585/603-604 行只等待 V_MTE2 和 S_MTE2，却在 586/605 行经 MTE2 DataCopyPad 读同一块 GM。队列间无 MTE3→MTE2 依赖，MTE2 读可在 MTE3 写完成前消费陈旧 workspace，污染归约后的 top-k indices/values。源码行号定位明确（issue 附完整调用链）。与 TRN-0400（同算子 LightningIndexerKLLoss NaN，根因为 eps 类型错配已修 !15015）不同机制：本案是核内队列同步缺失的读竞态。训练侧 LightningIndexer 用于 indexer 注意力训练路径。'
  source: cann/ops-transformer https://gitcode.com/cann/ops-transformer/issues/7004 + 修复 https://gitcode.com/cann/ops-transformer/merge_requests/15092（open）；推理库同机制 INF-2362
  behavior: 跑 lightning_indexer（arch22）时，归约阶段读回的 top-k 索引和值偶发读成上一轮或未写完的 workspace 残留——同样输入多次跑结果不稳定，输出质量劣化但无报错。压力并发下更明显，与已修的 NaN 问题（TRN-0400）是两个独立缺陷。
