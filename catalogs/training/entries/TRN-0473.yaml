title: CANN MoE token unpermute 族负索引缺下界校验
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: moe_token_unpermute 族索引。
  behavior: moe_token_unpermute/moe_token_permute_grad/moe_index_copy 对 sortedIndices 只判上界不判下界，负值经 int64_t offset 直读 GM。
effect:
  objects:
  - 数值结果
  detail: sortedIndices 含负值时（上游 -1 padding，vLLM 标准行为）：{-1,1} 输出 [0,0,1.5,2]，无效槽未清零、无报错，两段接口返回 0；大负值（-2^30）sync fail 507035 KERNEL_ERROR。CANN 9.0.0、910_93 实测。
  visibility: 静默错误
mitigation:
  detect: 训练/路由输入含 -1 padding 时输出对照 CPU 参考实现；大负值直接 KERNEL_ERROR
  fix: 修复 PR https://gitcode.com/cann/ops-transformer/merge_requests/14742（open，2026-10-27）——按本仓 moe_token_unpermute_with_routing_map_not_pad.h:228-233 的 IsValidInputIndex 范本补 `in_token_index >= 0 && < num_out_tokens` 下界，三文件 4+4+2 处；同仓 commit 0c5c1ed15 为既有范本。用户自编译修复版实测 {-1,1} 用例通过
