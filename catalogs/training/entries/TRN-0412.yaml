original:
  mechanism: 'cann/ops-math #3871 + 修复 MR !6661（2026-10-24，issue open / MR open，Ascend950PR / CANN 9.2.0 / TTK 3.0.0）。Tan 算子 |x|≥1e7 输出全 NaN，覆盖 GEIR、aclnnTan、aclnnInplaceTan 三条通路。根因：math/tan/op_kernel/arch35/tan_simt.h 定义 LARGE_THRESHOLD=1e7f，|x|≥1e7 有限输入在特殊值分支被直接置 NaN；该阈值源自旧手写 Cody-Waite 3-part 约化精度上限（|fn|≤2^20 留余量），fb7fd5371 更换 SIMT tanf 高精度范围约化后依据已消失（实测阈值以下全值域 ≤2.7 ulp，含旧失效区间 (1.65e6,1e7)），guard 却被保留；REQUIREMENTS「大数→NaN 对齐 TF/PyTorch」为事实误载并被 spec.yaml 固化。同算子 aicpu fp64 通路（std::tan/Eigen）对 1e20/DBL_MAX 输出有限值，双通路语义自相矛盾。修复删除该判定仅保留 Inf/NaN→NaN，21 点大值探针全 PASS（±FLT_MAX rel=6.3e-8）、精准回归 FAIL→PASS 6 例。附带发现 golden 资产错配（tests/assets/golden.py 实为 Tanh）与 TTK third_party 类绑定调用缺陷（cross_check 无三方输出），属测试资产缺陷另计。大参数 tan 在训练中见于未归一化特征/坐标编码等路径。'
  source: https://gitcode.com/cann/ops-math/issues/3871 ；修复 https://gitcode.com/cann/ops-math/pull/6661
  behavior: 对绝对值 ≥1e7 的输入调 tan（含原地），输出整片 NaN，而同样输入在 CPU/GPU 的 torch、numpy 上是有意义的有限值；训练中一旦有未归一化的大数特征流过 tan，该位置起激活和梯度全部变 NaN 并向后传播，其余小值位置照常。同算子 fp64 通路又是有限值，同一模型换精度行为不一致。
  trigger_surface: Ascend arch35（950PR 等）Tan 算子，|x|≥1e7 有限输入；GEIR/aclnnTan/aclnnInplaceTan 三通路；CANN 9.2.0 实测。
  discovery: 2026-10-25 每日扫描
