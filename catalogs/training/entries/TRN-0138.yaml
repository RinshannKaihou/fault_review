  mechanism: Megatron 细粒度 activation offload 的模块选择逻辑不覆盖 absorbed MLA 投影——配置里开了 offload 的模块在 absorbed MLA 路径下被**静默绕过**：不报「不支持」，也不下装，激活照常驻留显存。正确性面不是 offload 本身算错，而是「配置声明 ≠ 执行覆盖」：同配置在非 MLA 模型上生效、在 absorbed MLA 上无效，A/B 显存对比成了唯一暴露手段；若用户为满足显存而叠加其它妥协（减小 batch / 开启未验证的 recompute 组合），错的输入进优化决策。修复 = offload 逻辑延伸到 absorbed MLA 投影。
  source: 'Megatron-LM PR #7090（两节点 B300 GLM 5.3 生命周期 XID 1050342 完整 fwd/bwd/step/ckpt 验证）。https://github.com/NVIDIA/Megatron-LM/pull/7090'
  behavior: 无 crash、无日志差；activation offload 的显存收益静默缺失。边界条目：单独发生是容量/性能面，但它是 CKPT.06 家族（配置被静默吞掉）在执行层的镜像——开关通过校验、行为不变。记录在案以防后续与 recompute/精度问题组合成静默错值面。
  discovery: 2026-09-06 每日扫描
