cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: CELossGrad weight 读取
  behavior: weightOptional 非法 dtype 不被 161002 拦截，kernel 固定按 float* 解释缓冲并按 C 个 float 读取，越界读且字节重解释成错值。
effect:
  objects:
  - 梯度
  detail: weight 传半精度（实测 fp16，bf16 常见）时梯度静默缩小 4~5 个量级（-0.268941→-8.22247e-06），loss 仍下降但收敛变慢或失效，无报错无日志；fp32 路径正常，仅 dtype 传错时触发且无拦截。
  visibility: 静默错误
mitigation:
  detect: 对 weight dtype 做 fp32 断言或调用前自查；比对同输入 CPU 参考梯度量级。
  fix: 待定（issue open，期望 dtype 白名单返回 161002）
