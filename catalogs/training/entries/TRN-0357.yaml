    component: Mamba3 in/out_proj 初始化
  behavior: Mamba3 FSDP2 Demo train_from_scratch 缺少 in_proj/out_proj Kaiming 初始化处理
effect:
  objects:
  - 训练信号
  - 训练轨迹
  detail: Mamba3 FSDP2从零训练：initializer_range=0.1随机初始化开训即数值异常、loss为0；改0.02并去掉额外Kaiming初始化后前150step正常，约150step又loss突然归零，155起lm、mtp loss及grad norm为0，进程不报错不退出，显存不变
  visibility: 静默错误
mitigation:
  detect: 监控 lm loss 与 grad norm 是否同时恒为 0；对 SSM 分支参数记录初始化 std 与是否全零
  fix: issue 里 initializer_range 改 0.02 只恢复前 150 step；正文建议给 Mamba3 in_proj/out_proj 补 Kaiming 初始化并做长步数稳定性验证（closed，未附修复 PR，未核实）
