original:
  mechanism: MindSpeed-LLM 26.1.0 + MindSpeed 0.12.1 + FSDPTurbo 0.1.0（CANN 9.1.0、8 NPU、torch_npu 2.7.1）的 Mamba3 FSDP2 Demo 做 train_from_scratch。报告者指出当前代码里没有对 Mamba3 in_proj/out_proj 的 Kaiming 初始化处理（历史提交里曾提过类似初始化修复）；默认 initializer_range=0.1 随机初始化时模型一开训就数值异常、loss 为 0，把 initializer_range 调到 0.02 并去掉额外 Kaiming 初始化后，前若干 step 的 loss 与 grad norm 恢复正常，但训练到约 150 step 又出现 loss 突然归零。报告者自己也没能确定根因落在初始化、SSM 数值状态、梯度/优化器、数据还是 loss 统计上，因此这里只记录现象、已试过的配置改动和未排除项。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1836（closed；CANN 9.1.0、MindSpeed-LLM 26.1.0、FSDPTurbo 0.1.0、8 NPU；逐 step 日志与 initializer_range 对照实验在正文）
  behavior: 用 Mamba3 FSDP2 Demo 从零训练，日志里 lm loss 从 11.65 缓慢降到 11.24，iteration 154 时 grad norm 突然打印 0.000，iteration 155 起 lm loss 直接是 0.000000E+00，mtp loss 与 grad norm 也全为 0，一直到 159 及之后都这样；进程不报错、不退出，显存占用也不再变化。把 initializer_range 从 0.1 调到 0.02 只是让前 150 step 正常，到同一位置照样归零。
  trigger_surface: Mamba3 demo + FSDP2 + train_from_scratch + initializer_range 0.1（或 0.02 长步数）
  discovery: 2026-10-21 每日扫描
