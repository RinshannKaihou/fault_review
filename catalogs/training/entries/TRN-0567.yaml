pattern: PAT-TRN-0060
original:
  mechanism: 'cann/ops-nn #7822（2026-10-31，open；Atlas A2/Ascend910B、CANN 9.2.0、mode=sum）：aclnnEmbeddingBag 在 includeLastOffset=true 时最后一个 offset 未被当作结束边界，第 i 个 bag 未按资料语义止于 offsets[i+1]，而是一直聚合到 indices 末尾。最小复现：weight=fp32[100x32]、indices=int64[7]={0,5,9,5,5,77,3}、offsets=int64[2]={0,4}、includeLastOffset=true → out[0] 元素和 110.28（把 7 个索引全算），期望 62.11（仅 indices[0:4]）；同一二进制同一张卡只改这一个 bool 输出 62.11 正确。30 条 800 级用例矩阵中 includeLastOffset=true 的 133 条全部 FAIL，每条恰好差一整行（embeddingDim 个元素），与多算尾部索引一致。资料 aclnnEmbeddingBag.md 明写 includeLastOffset=true 时输出 shape 为 (bagOffsets-1, embeddingDim)、最后 offset 为结束位置。'
  source: https://gitcode.com/cann/ops-nn/issues/7822 （open，2026-10-31；含最小复现 C++ 脚本与对照表）
  behavior: NPU 训练用 EmbeddingBag（includeLastOffset=true，如变长 bag 聚合）时每个 bag 的求和/均值静默多算 offsets 末尾之后的索引：输出数值系统性偏大（示例 110.28 vs 62.11），无报错；反向梯度同样按错误聚合范围传播。只改 includeLastOffset=false 就正确，极易误判为数据问题。
  trigger_surface: Ascend 910B + CANN 9.2.0；aclnnEmbeddingBag includeLastOffset=true；变长序列 bag 聚合训练路径。
  discovery: 2026-11-01 每日扫描
