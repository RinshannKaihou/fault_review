id: TRN-0567
legacy_ids: []
slug: ops_nn_embeddingbag_includelastoffset_boundary
aliases: []
title: aclnnEmbeddingBag includeLastOffset 聚合越界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: embedding_bag offsets 边界
  behavior: includeLastOffset=true 时最后一个 offset 未被当作 bag 结束边界，bag 一直聚合到 indices 末尾，把应被标记掉的尾部索引也算进去；同二进制只改该 bool 即触发。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 910B：indices={0,5,9,5,5,77,3}、offsets={0,4}，true 时 out[0]=110.28（7 个全算），期望 62.11；false 正确。800 级矩阵 133 条 true 用例全 FAIL，每条恰差一整行。
  visibility: 静默错误
mitigation:
  detect: includeLastOffset=true/false 双跑对照（同权重/索引/偏移，差异即暴露）；与 CPU EmbeddingBag 参照对拍。
  fix: 待定（issue open：按资料语义最后一个 offset 应为结束位置，未见修复 MR）
