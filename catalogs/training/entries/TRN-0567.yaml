remarks: 同族不同对象：TRN-0279 是索引算子越界输入静默错值（校验缺失），本案是合法输入下边界语义算错（聚合范围错误）——共享「NPU 索引/embedding 算子静默错值」失效面。cross INF-2334 为推理库同 URL 条目，训练侧重判定梯度/数据面。
