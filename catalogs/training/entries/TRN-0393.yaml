title: MoeTokenPermuteWithEp 环绕区间尾部 end 行输出未写
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: MoeTokenPermuteWithEp 搬运
  behavior: 环绕区间（start>end）时 tiling 按环绕语义算 numOutTokens，但 kernel 过滤条件的索引值域只到数组末尾，尾部 end 行从未写入，两段返回成功。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: EP 环绕窗口下 permuteTokensOut/permuteProbsOut 尾部恒缺 end 行（实测 8 行缺 4），输出为未初始化显存残留，形状正确、前段正确、无报错；76 组 (start,end) 扫描缺口恒等于 end。
  visibility: 静默错误
mitigation:
  detect: 输出预填哨兵做 round-trip；环绕窗口（start>end）下校验实际写入行数==numOutTokens。
  fix: 待定（issue open 2026-10-23，根因定位至 moe_index_copy_with_ep.h:158/185 过滤条件，未见修复 MR）
