id: TRN-0764
legacy_ids: []
slug: torchtitan_resume_step_rollback_torn_checkpoint
aliases: []
title: resume-step 回滚重存覆盖旧 step 目录致撕裂 ckpt
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: torchtitan
    component: Checkpointer 保存路径
  behavior: --resume-step K 只设 load_step，重训仍写回被放弃 run 的 step-N；DCP 默认 overwrite=True 原地截断分片，崩溃可留半新半旧 step，旧 .metadata 仍让它成为最新可恢复点。
effect:
  objects:
  - 模型权重
  - 可用性/进度
  detail: 重存崩溃后重启：或每次 CheckpointException EOFError（loud），或不报错加载 rank0 新 run、rank1 旧 run 的混合分片；不崩溃时无 flag 重启续旧 run 最新 ckpt，带 flag 回 K 丢进度。
  visibility: 静默错误
mitigation:
  detect: rollback 时检查目标 step 目录是否已存在；保存后校验各 rank 分片来源与 .metadata 一致。
  fix: 待定（issue open 2026-11-12；维护者建议配置期 ValueError，未实现）
