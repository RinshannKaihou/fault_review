title: Megatron 链式优化器 loss scale 分叉静默错误反缩放
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: megatron-lm
    component: 链式 FP16 loss scaler 更新
  behavior: FP16 链式优化器 backward 用第一个优化器的 scale，但各优化器用各自 overflow 结果独立更新 scaler；只一侧溢出时 scale 分叉，后续 update 按错 scale 反缩放部分模型。
effect:
  objects:
  - 梯度
  - 优化器状态
  detail: FP16 MoE 链式优化器训练中，一侧溢出后 dense/expert 的 loss scale 静默分叉，后续步部分参数按错误 scale 反缩放（实测 64 步后 32768 vs 1048576，expert 梯度被多除 32 倍）；无报错。
  visibility: 静默错误
mitigation:
  detect: 监控各 scaler 的 scale 值是否始终相等；对 unscale 后梯度与 backward scale 对账。
  fix: 修复 PR https://github.com/NVIDIA/Megatron-LM/pull/8249 （open，未合入未发布）：推迟 scaler 更新至全部优化器完成梯度检查后按合并 overflow 结果统一更新；嵌套链同理；ckpt 格式不变。含 64 步 EP2 FP16 复现与 AdamW 参考对照（两卡 RTX 5090）。
