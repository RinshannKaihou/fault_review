original:
  mechanism: 'Ascend/torchair #902（2026-10-27，closed）+ 修复 PR !3906（open）：torchair 的 Cat 融合 pass 在选取公共轴时未检查其他轴 size 是否一致，把「公共轴相同但其他维 size 不同」的同秩节点融到一起（issue 截图显示不同轴被融到一起）。PR !3906 自述：concat 融合组此前跳过同秩节点与公共轴的逐维 size 检查，导致 concat 输出下游循环等尺寸不一致的节点仍可能按位置绑定轴，存在计算错误风险；本次补充已有校验（同秩节点逐维 size 不一致时拒绝融合），补回归用例覆盖静态、动态轴不匹配与同形状/合法展平通过场景。issue 正文简短（两张截图），机制以修复 PR 描述为准；环境字段未填。同日同仓 #901（atan2 入参顺序反了，AF.atan2(x,y)==EAGER.atan2(y,x)，512/512 全量证据、修复 !3905 已 merged）是另一独立机制，本条不覆盖。'
  source: https://gitcode.com/Ascend/torchair/issues/902 + 修复 PR https://gitcode.com/Ascend/torchair/merge_requests/3906（open）
  behavior: torchair 图模式下含 Cat 的模型（公共轴选择与其他轴 size 组合特定时）出现与 eager 不一致的输出数值，无报错；等尺寸节点不受影响，只有「公共轴相同、其他轴 size 不同」的节点被错误融合后结果错。
  trigger_surface: torchair Cat/concat 融合（master，2026-10-27）；同秩节点公共轴相同但其他轴 size 不一致
