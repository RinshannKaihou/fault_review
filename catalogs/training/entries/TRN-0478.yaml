  - 数值结果
  detail: torchair 图模式下含 Cat 的模型，当同秩节点公共轴相同但其他轴 size 不一致时被错误融合，输出数值与 eager 不一致且无报错；等尺寸节点不受影响。issue 截图显示不同轴被融到一起。
  visibility: 静默错误
