slug: mindspeed_mtp_packed_first_segment_no_shift
aliases: []
title: MindSpeed MTP packed 边界语义错配致首段标签未左移
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspeed
    component: PackedSeqParams 边界构造
  behavior: MindSpeed 的 actual_seq_len 是不含起始 0 的结束位置列表，未转换直接写入 PackedSeqParams.cu_seqlens_q；Megatron MTP packed Roll 按相邻边界处理区间，首段漏。
effect:
  objects:
  - 训练信号
  - 训练样本流
  detail: 开启 MTP + reset-attention-mask + packing 时第一个子序列的 MTP 输入/标签/loss mask 不移位：每个位置预测目标仍是自身 token，段尾未清零，有效 token 数与 loss 归一化错；训练无报错继续跑。
  visibility: 静默错误
mitigation:
  detect: 在 process_mtp_loss 打印首段移位结果对照（issue 附最小打印验证）；对比首段与后续段的标签移位一致性
  fix: '修复 PR https://gitcode.com/Ascend/MindSpeed/merge_requests/4115（open，2026-10-28）——创建 PackedSeqParams 时标记 MindSpeed 结束位置格式并在 CP=1 packed Roll 内局部补起始 0，附参数化回归 UT（修复前失败、修复后通过）；FB overlap 变体修复 !4123（open）——分段移位并清零段尾；issue #369 同时披露 012/016 版本边界语义不匹配与 FB overlap 适配缺失'
