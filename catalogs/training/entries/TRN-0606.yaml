original:
  mechanism: 'cann/ops-nn #7976（2026-11-02 open，Ascend 910B，CANN 9.2.0-beta.2，master e05f7d05）。aclnnBatchMatMul 两段 API 在 self=[0,K,M]、mat2=[1,M,N] 时均返回 0，但 out（合法的 [1,M,N]）完全未写。源码定位：matmul/batch_mat_mul_v3/op_host/op_api/aclnn_batch_matmul.cpp:150 CheckBmmResIsEmpty 只判 self[0]==0||self[1]==0||mat2[2]==0，漏 mat2 batch 维；334-338 行命中早退后仅 *workspaceSize=0; return ACLNN_SUCCESS。复现脚本（C++ 完整）预填 NaN 到 out，执行后 64/64 元素全为 NaN 残留。对照：self batch=1+mat2 batch=0 走正常路径写出全 0。与 TRN-0585（RepeatInterleave repeats=0 成功不写）、TRN-0583（AdaptiveAvgPool2d H=0 成功不写）同为『成功但不写输出』族，但接口与触发维度不同。'
  source: cann/ops-nn https://gitcode.com/cann/ops-nn/issues/7976（open）
  behavior: 调用 aclnnBatchMatMul 时若 self 的 batch 维为 0 而 mat2 的 batch 维为 1（广播组合，out 形状合法非空），两段接口都返回成功，但输出张量一个元素都没写——里面是分配时的未初始化显存或上次残留（哨兵 NaN 全量保留）。反向组合（self batch=1、mat2 batch=0）会正常写出全 0。调用方拿到成功返回码后读到的完全是垃圾数据。
  discovery: 2026-11-03 每日扫描
