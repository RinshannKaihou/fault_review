id: TRN-0361
legacy_ids: []
slug: msllm_batch_p2o_comm_hccl_group_unbalanced
aliases: []
title: 开 batch_p2o_comm 后 HcclGroupEnd 未配对
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: mindspeed-llm
    component: optimize_p2p_comm 批量下发
  behavior: 推断批量下发路径与 PP 调度实际收发次数/分支不一致，导致 HCCL group 调用不成对，HcclGroupEnd 缺少 HcclGroupStart。
effect:
  objects:
  - 可用性/进度
  detail: 'DSv4 整网训练在 recv_forward 的同步点抛 Inner error，PLOG 记 HcclGroupEnd: not in a group call，进程直接退出；关掉该开关即恢复。'
  visibility: 报错
mitigation:
  detect: 打开前后对比各 rank 的 HcclGroupStart/End 计数与 P2P 收发次数；PLOG 里筛 hccl_group.cc 的 group 配对告警
  fix: issue 只提交复现与 PLOG 定位（closed，未附修复 PR，未核实）；规避是不开 config.batch_p2o_comm
