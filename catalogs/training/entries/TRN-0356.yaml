original:
  mechanism: MindSpeed-LLM 的 MindSpore 路径（MindSpeed-Core-MS / Megatron-LM 的 megatron/training/checkpointing.py）在 pretrain 前用 ddp_model[0].load_state_dict(state_dict['model'], strict=strict) 装载转换后的权重。按 docs/zh/mindspore/install_guide.md 与 quick_start.md 做完权重转换后，RuntimeError 逐层列出 decoder.layers.0..N 缺失 self_attention.linear_qkv.bias 与 mlp.linear_fc1.layer_norm_weight，说明转换产物与 mcore GPTModel 的参数集合不一致：这两类键在 Qwen2.5 的 attention bias / pre-LN 布局里存在，转换脚本没有写出来。报告者把 strict 改成 False 后能拉起训练，代价是这些键对应的参数不被加载、保持初始化值，等于拿部分随机初始化的模型继续训练；原始提问正是在追问这样改对训练结果、精度与推理性能的影响。
  source: https://gitcode.com/Ascend/MindSpeed-LLM/issues/1337（closed；CANN 8.3.RC1、MindSpeed-LLM/MindSpeed master、Megatron-LM core_v0.12.1、msadapter master、Atlas800I A2；完整 missing key 清单与规避办法在正文）
  behavior: '照着 MindSpore 安装指导与 quick start 做完权重转换和数据处理，执行 examples/mindspore/qwen25/pretrain_qwen25_7b_32k_ms.sh 直接报 RuntimeError: Error(s) in loading state_dict for GPTModel，Missing key 列出每层 linear_qkv.bias 与 linear_fc1.layer_norm_weight；改成 strict=False 后训练能起来，用户因此追问会不会影响训练结果和精度。'
  trigger_surface: MindSpore(msadapter) 后端 + examples/mindspore/qwen25 预训练脚本 + 按文档转换的 ckpt
  discovery: 2026-10-21 每日扫描
