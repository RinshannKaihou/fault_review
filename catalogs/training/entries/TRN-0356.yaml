legacy_ids: []
slug: msllm_ms_ckpt_missing_qkv_bias_strict_false
aliases: []
title: MindSpore 加载 ckpt 缺键被 strict=False 吞掉
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: mindspore
    component: MindSpore load_state_dict
  behavior: MindSpore 路径转换出的 ckpt 缺 linear_qkv.bias 与 linear_fc1.layer_norm_weight，加载报 Missing key；改 strict=False 后缺键被跳过、参数保持随机初始化。
effect:
  objects:
  - 模型权重
  - 训练轨迹
  detail: 按 install_guide 与 quick_start 做完权重转换后训练起不来（load_state_dict 报 missing key）；改 strict=False 能跑，但缺失键对应参数保持初始化值、等于部分随机初始化继续训练，对结果影响未知
  visibility: 报错
mitigation:
  detect: 加载后逐层比对 missing/unexpected 清单，必须为空才继续；对 qkv bias 与 fc1 layernorm 参数做加载前后指纹比对
  fix: 'issue #1337 只给出把 strict 改 False 的规避（closed，无修复 PR，未核实）；正解是让权重转换补齐或映射这两个键，不要用 strict=False 掩盖'
