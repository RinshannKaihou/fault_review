  detail: expandedRowIdx 越界时不报参数错误：偏移落在相邻已分配显存时把相邻张量内容当梯度累加（静默脏数据）；偏移极大时同步阶段报 507035 AI Core MTE invalid GM address。A2 910B3 / CANN 9.2.0 实测。
  visibility: 静默错误
