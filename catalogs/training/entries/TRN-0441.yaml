    component: aclnnMoeInitRoutingV2Grad
  behavior: expandedRowIdx 三条 tiling 分支校验均不完整（dropless 无校验、activate 只有上界、drop/pad 只查 -1），kernel 直接按 idx*cols 寻址，越界时把相邻内容当梯度累加。
