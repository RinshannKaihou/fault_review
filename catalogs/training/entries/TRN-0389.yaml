  - 数值结果
  detail: A2/910b 与 A3 文档均声明不支持 BF16+FP16/BF16+FP32 推导，实际 ND 路径静默执行；实测 16x16 cubeMathType=KEEP_DTYPE 返回 0/0 出结果，结果 dtype 语义未按文档拒绝。
  visibility: 静默错误
mitigation:
  detect: 调用前在框架层断言两输入 dtype 一致；对拍文档约束矩阵。
  fix: 待定（issue open 2026-10-23，根因定位至 aclnn_matmul.cpp CheckInputParams/CheckWeightNzDtype 校验缺口）
