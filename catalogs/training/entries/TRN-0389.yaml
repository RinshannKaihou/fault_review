title: aclnnMatmul BF16×FP16 ND 路径静默低精度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnMatmul ND 路径校验
  behavior: self/mat2 分别为 BF16 与 FP16/FP32 且均 ND 时，校验只在 mat2 为 NZ 时拦截混用，ND 路径无校验，两段返回 0 静默出结果；文档明确该组合应返回 161002。
effect:
