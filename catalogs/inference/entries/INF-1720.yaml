title: FIA MLA 下沉 tiling 未回写致 batch 边界错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FIA arch35 MLA tiling
  behavior: DoOpTiling 的 max workspace 路径漏调 SetTilingData，tiling 缓冲全零；TND/NTD 下 ACCUM 模式的 ActualSeqLensParser 无兜底，越界读 GM 得垃圾数据。
effect:
  objects:
  - 数值结果
  detail: arch35 MLA 非量化、tiling 下沉（max workspace）时 NTD/TND 布局精度失败，BSH/BNSD/BSND 正常；越界读到的垃圾数据使 batch 边界错，全程无报错。
  visibility: 静默错误
mitigation:
  detect: 同一 MLA 非量化用例分别在 tiling 下沉与常规路径下跑 NTD/TND 布局，比较与 golden 的偏差
  fix: max workspace 路径补 SetFATilingData() 填基础 shape 参数并调用 SetTilingData(tilingData_)（issue 给出方案，未见 PR 号）
