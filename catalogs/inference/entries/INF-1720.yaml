original:
  mechanism: 'ops-transformer issue #4978（2026-09-04，closed）：arch35 MLA 非量化模板 FiaTilingNonQuantMlaArch35 在 tiling 下沉（max workspace）场景下 NTD/TND 布局精度失败，BSH/BNSD/BSND 等布局正常。根因在 attention/fused_infer_attention_score/op_host/arch35/fia_tiling_nonquant_mla.cpp：DoOpTiling() 的 max workspace 路径缺少 SetTilingData(tilingData_) 调用，tiling 数据缓冲区保持全零。TND/NTD 布局下 kernel 用 ACCUM 模式的 ActualSeqLensParser 解析变长序列，当 actualSeqLengthsQSize=0 时没有兜底逻辑，按零值 tiling 直接越界读 GM，拿到垃圾数据后 batch 边界判断出错。修复为在该路径补 SetFATilingData() 填充基础 shape 参数并调用 SetTilingData(tilingData_) 写回 context 缓冲区。'
  source: 2026-09-04 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/4978 （closed）
  behavior: MLA 非量化注意力在开 tiling 下沉（max workspace）后，用 TND 或 NTD 变长布局推理时结果与 golden 明显不符（batch 之间互相串味、部分 batch 整段偏差），而同样的模型换 BSH/BNSD/BSND 布局就正常；整个过程没有报错、没有异常日志，只有精度比对能发现。
  trigger_surface: arch35 + MLA 非量化 + tiling 下沉(max workspace) + TND/NTD 变长布局；BSH/BNSD/BSND 不触发
