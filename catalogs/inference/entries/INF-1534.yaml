id: INF-1534
legacy_ids: []
slug: ops_nn_sparse_fill_empty_rows_zero_width_filler
aliases: []
title: SparseFillEmptyRows 零宽 dense 仍写 filler 行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: SparseFillEmptyRows 内核
  behavior: dense_shape 某维为 0 且 indices 为空时，内核仍按行写 filler、未先处理零维：y_indices/y_values 写成 [2,2]/[2]，超出 InferShape 推导的 [0,2]/[0]。
effect:
  objects:
  - 数值结果
  detail: indices 为空（shape [0,2]）、dense_shape=[2,0]、default_value=77 时返回成功，y_indices=[[0,0],[1,0]]、y_values=[77,77]；按推导 shape 分配输出时第二坐标落在宽度 0 的维度外，存在越界写。
  visibility: 静默错误
mitigation:
  detect: 零维 dense_shape + 空 indices 用例比四个输出的实际 shape 与 InferShape 推导值，并用 canary 检查写越界；只看返回值会判成功。
  fix: issue 6232 open；正文给出修复方向（填充空行前先处理零维、并校验 values 元素数与 indices 第一维一致），关联 PR https://gitcode.com/cann/ops-nn/merge_requests/11647 （合入状态未核实）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: 报告用 Host 探针在基线 AICPU kernel 上复现，修复探针确认输出保持为空、canary 未变；UT/ST 未在本地执行（CANN/TTK 环境不可用）。
evidence:
- url: https://gitcode.com/cann/ops-nn/issues/6232
  kind: gitcode_issue
relations: []
original:
  mechanism: cann/ops-nn issue 6232（2026-09-28，open）：SparseFillEmptyRows 基线 AICPU kernel，输入 indices 为空、shape [0,2]，values shape [0]，dense_shape=[2,0]，default_value=77。Host shape inference 推导 y_indices 为 [0,2]、y_values 为 [0]、empty_row_indicator 为 [2]。实测 kernel 返回成功，却为两行分别写入 filler，得到 y_indices=[[0,0],[1,0]]、y_values=[77,77]，实际输出 shape 变成 [2,2] 与 [2]；这些 filler 的第二坐标无法落进宽度为 0 的维度，按推导 shape 分配输出时就是越界写。修复方向是填充空行前先处理零维情况（任一维为 0 且 indices 为空时四个输出保持为空、所有行标记为空；indices 非空则返回参数错误），并校验 values 元素数与 indices 第一维一致。报告用 Host 探针在基线上复现了写两个无效 filler、输出超出推导 shape 的现象，修复探针确认输出为空、canary 未变化；新增的 CMake UT 与 TTK kernel ST 因 CANN/TTK 测试环境不可用未在本地执行。
  source: 2026-09-28 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6232 （open）
  behavior: 调用 SparseFillEmptyRows 处理一个宽度为 0 的稠密 shape（dense_shape=[2,0]）且 indices 为空时，接口返回成功，但拿到的 y_indices 是 [[0,0],[1,0]]、y_values 是 [77,77]——形状从推导的 [0,2]/[0] 变成 [2,2]/[2]，凭空多出两行 filler，第二列还指向一个宽度为 0 的维度。按推导 shape 分配的输出缓冲装不下这些行，属于静默的越界写，调用方看不到任何报错。
  trigger_surface: dense_shape 任一维为 0（如 [2,0]）+ indices 为空（[0,2]）+ AICPU 基线 kernel
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
