id: INF-1970
legacy_ids: []
slug: triton_ascend_boundary_check_linear_offsets
aliases: []
title: boundary_check 边界尺寸按线性地址重算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: LoadStoreConverter 边界尺寸
  behavior: 边界尺寸用 memref 线性偏移配合 strides 做 div/rem 反推；部分 boundary_check 时 offsetShift 只在受检轴更新，未检轴的偏移污染受检轴。
effect:
  objects:
  - 数值结果
  detail: 隐式 permute 与部分 boundary_check 下得到错误的 tile 有效尺寸：越界元素被当合法值载入或只写部分有效区；反推失败还静默返回错误尺寸而非编译失败。
  visibility: 静默错误
mitigation:
  detect: 构造 shape=(32,50)、strides=(50,1)、boundary_check=(1,)、offsets=(10,40) 的用例，核对轴 1 的偏移是否为 40 而非 540；再用 order=(0,1)+strides=(1,Y) 的隐式 permute 核对 padding 区
  fix: PR triton-lang/triton-ascend#740 （release/3.2.2，fix boundary size calculation for make_block_ptr，已合入）：主路径改用 traceTensorPtrAxisInfo + 按逻辑轴算 realSize，另修部分 boundary_check 的 offsetShift 剥离；issue 记录的删除线性反推回退、动态 dim 的 memref.cast 两项仍待后续 PR
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: 'issue 为 PR #740 合入后的跟进单：既记录旧实现的缺陷，也记录修复本身的四个后续项。'
evidence:
- url: https://github.com/triton-lang/triton-ascend/issues/804
  kind: github_issue
relations: []
original:
  mechanism: 'triton-lang/triton-ascend issue #804（2026-06-25 closed，跟踪 PR #740 合入后的清理）：带 boundary_check 的 make_block_ptr/make_tensor_ptr 需要按逻辑轴算当前 tile 的有效长度 realSize_i = min(blockShape_i, max(shape_i - offset_i, 0))。旧实现 LoadStoreConverter::getBoundarySizes() 从 lower 后的 memref.reinterpret_cast 取线性偏移，再用各轴 stride 做 div/rem 反推每轴 offset 与边界尺寸，有两个系统性缺陷：一是抽象错了，块指针本身就带 shape/offsets/block_shape，用线性地址反推在隐式 permute（order=(0,1)+strides=(1,Y)）与部分 boundary_check 下必然失配；二是部分 boundary_check 时 offsetShift 只在受检轴上更新，未检轴的偏移会污染受检轴，例如 shape=(32,50)、strides=(50,1)、bc=(1,)、offsets=(10,40) 时轴 1 的 offset 被算成 540 而不是 40。issue 还记录了修复暴露的 memref.cast<?x?> 与 adpater 问题、以及 iv 相关 advance delta 目前无法 trace。'
  source: 2026-06-25 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/804 （closed）
  behavior: 写了 boundary_check 的 kernel 在隐式 permute 或只对部分轴开 boundary_check 时，tile 的有效长度算错：load 侧把越界元素当合法数据填进 tile（padding 该填 0 的位置是邻居数据），store 侧只写一部分本该写的有效区。编译和运行都不报错，输出形状也对，只有数值错；而反推失败时旧代码还会静默返回错误尺寸而不是让编译失败。
  trigger_surface: triton-ascend 编译器对 make_block_ptr/make_tensor_ptr + boundary_check 的 load/store lowering
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
