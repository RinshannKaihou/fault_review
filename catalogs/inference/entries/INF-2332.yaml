title: aclnnReduceLogSum 空输入输出 0 而非 -inf
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: reduce_log_sum 空输入处理
  behavior: 空 tensor 输入时 aclnnReduceLogSum 把输出填 0 返回成功，而数学上 log(sum(∅)) 应为 log(0)=-inf；同仓其他 reduce 算子对空输入的处理与之一致性存疑（issue 对照同仓行为）。
effect:
  objects:
  - 数值结果
  detail: 空 tensor（0 元素归约维）输入时接口返回成功、输出 0.0 而非数学正确的 -inf，无任何报错；依赖 -inf 哨兵判断空归约的下游逻辑（如 attention score 空行、logsumexp 组合）把空输入误当有效值 0 继续算。非空输入正常。
  visibility: 静默错误
mitigation:
  detect: 空张量输入单测，期望 -inf；非空输入对照。
  fix: 待定（issue open，未见修复 MR）
