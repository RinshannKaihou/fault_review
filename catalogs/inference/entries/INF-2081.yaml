original:
  mechanism: '环境 vLLM 0.11.x（V1 引擎）、vllm-ascend 0.23.0rc1、Qwen3-VL-8B、cudagraph_mode=FULL_AND_PIECEWISE 且 capture sizes 扩到 256、custom_ops=[''all'']，服务开 --enable-prefix-caching --enable-chunked-prefill --max-model-len 65535。时间线：先是 worker 日志出现 Memory_Allocation_Failure(EL0004) / alloc device memory failed, runtime result = 207001；请求分配的 kernel 留在流上 pending，设备报 event wait timeout（timeout=1866s）；随后 vllm_ascend/compilation/acl_graph.py:256 在回放前调 torch.npu.current_stream().synchronize() 阻塞约 31 分钟，驱动超时后抛 torch.OutOfMemoryError: synchronize ... 107020。该 OutOfMemoryError 只是上游按消息里含 synchronize + 错误码做的包装，vLLM 的 OOM 分支于是打印 HBM 占用/--gpu-memory-utilization/--max-model-len 等建议，把排障引向显存而不是半小时前的分配失败。'
  source: '2026-07-30 GitHub vllm-project/vllm-ascend issue #13218 https://github.com/vllm-project/vllm-ascend/issues/13218 （closed）'
  behavior: 服务在高并发压测中先卡住半小时，最后客户端拿到 HTTP 500、引擎直接死掉。日志末尾写着 torch.OutOfMemoryError，于是所有人按显存不足去调 --gpu-memory-utilization 和 --max-model-len，怎么调都没用——真正的错误码 207001 在半小时前的另一段日志里。
  trigger_surface: aclgraph/compilation 回放路径（ACLGraphWrapper.__call__）+ 大 capture list + 此前已发生设备侧分配失败
  discovery: 2026-10-21 历史索引回填（tail 池顺序深读）
