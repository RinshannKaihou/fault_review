title: SoftmaxV2 AICPU 非后缀多轴归约混组错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SoftmaxV2 AICPU kernel
  behavior: AICPU kernel 只把连续后缀轴当快路径；axes 为 [0,2] 这类非连续后缀时仍按后缀假设分组，把不同分组的元素混进同一次归一化。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: FP32 [2,3,4]、axes=[0,2]：首个输出 0.0949649，按未归约第 1 维独立分组算得 0.0494982，kernel 仍返回成功；连续后缀轴用例通过。
  visibility: 静默错误
mitigation:
  detect: 用 axes 非连续后缀（如 [0,2]）的多轴用例与逐坐标参考实现比对；只测后缀轴用例全通过。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/11271 （open）：保留后缀快路径，其余互异轴按未归约坐标分组重算，新增 [0,2] 回归用例。
