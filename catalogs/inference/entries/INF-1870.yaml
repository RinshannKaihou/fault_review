id: INF-1870
legacy_ids: []
slug: npu_profiler_loses_device_tasks_at_record_start
aliases: []
title: profiler RECORD 窗口头部设备侧任务丢失
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: torch_npu
    component: profiler schedule 边界
  behavior: wait→RECORD 跃迁时设备侧窗口的起始边界没对齐：宿主侧按 active 次数下发，设备侧最早的若干条 task 记录不落盘，尾部完整。
effect:
  objects:
  - 指标/日志
  detail: active=10 时 op_summary 只有 8 条 matmul（偶发 9 条），缺失集中在窗口头部，尾部完整；同 trace 内 host,node,launch 的 Count 恰为 10；重跑同一脚本丢失条数变化，换成单次更长的 fp32（约 90µs/次）也非确定。
  visibility: 静默错误
mitigation:
  detect: 同一 trace 内比 host,node,launch 的 Count 与 op_summary 设备侧记录数；重跑多次看是否稳定等于 active
  fix: 待定（issue open，未给修复 PR）
