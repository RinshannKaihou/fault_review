title: batch_norm_grad_v3 通道整除时不写回 dγ/dβ
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BNGradV3 splitLoad 写回
  behavior: splitLoad 用 totalChannel % 1024 当末段长度，整除时得 0，判据 mod == copyNum-1 永不成立，dγ/dβ 的 StoreOneTensor 不触发。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 910B3 走 aclnnFastBatchNormBackward、每核 channel 为 1024 倍数（如 2048）时 dβ 保持哨兵 999（期望 ~12544），dγ 同样未写；grad_input 正常更新，接口返回成功。
  visibility: 静默错误
mitigation:
  detect: 把 dγ/dβ 预填哨兵后跑每核 channel=1024k（k≥2）的 splitLoad 用例，读回是否仍是哨兵；非整除 shape 与 910B 上的 aclnnBatchNormBackward（legacy 路径）都正常。
  fix: 待定（issue closed，未给修复 MR；作者建议按 torch 参考语义修正 splitLoad 末段写回判据并补该 shape 回归）
