original:
  mechanism: cann/ops-nn issue 4518（closed）：norm/batch_norm_grad_v3/op_kernel/batch_norm_grad_v3_splitLoad_common.h 的 CopyOutDBias 与 CopyOutDWeight 里，末段长度写作 if (loopId == CeilDiv(this->totalChannel, MAX_CHANNEL_SIZE) - 1) { copyNum = this->totalChannel % MAX_CHANNEL_SIZE; }，随后以 if (mod == copyNum - 1) 决定是否 StoreOneTensor；当每核 totalChannel 为 MAX_CHANNEL_SIZE（1024）的正整数倍时 copyNum 为 0，mod == -1 永不成立，dγ/dβ 的最后一段乃至与尾段刷新相关的整段写回都不发生，而 grad_input 路径不受影响。作者在 Ascend910B3、CANN 9.1.0-beta.3、ops-nn HEAD e16ef626bb3a 上以 build.sh --pkg --soc=ascend910b --ops=batch_norm_grad_v3 编包并装到独立 vendor，用 aclnnFastBatchNormBackward 跑每核 2048 channel 的用例：trigger 组 dβ 保持哨兵 999、control 组约 12544，两组 dx 都有更新，进程退出码 42。issue 特别说明 910B 上 aclnnBatchNormBackward 走 legacy BNTrainingUpdateGrad/BNTrainingReduceGrad，必须用 Fast 变体才能进该路径。
  source: GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4518 （closed）
  behavior: BN 反向在特定通道规模下 dγ/dβ 完全没有被写回：输出缓冲里留的是调用方预填的值（哨兵/上一轮内容），grad_input 却是对的，所以算子看起来「跑成功了」，只有拿 dγ/dβ 与参考实现比才发现整块没更新；非整除通道数、或换用 legacy BN 反向接口都恢复正常，定位时很容易误判成上游梯度为零。
  trigger_surface: batch_norm_grad_v3 splitLoad + 每核 channel 数为 1024 整数倍
