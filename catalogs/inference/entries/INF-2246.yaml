original:
  mechanism: 'cann/ops-nn issue #7542（2026-10-28，open）：loss/mse_loss/op_api/aclnn_mse_loss_out.cpp 的空张量早退分支无填充动作（仅注释），而同仓 aclnn_mse_loss.cpp 同位置调用 MseLossEmptyTensorCompute（loss/common/level2_base_loss.h CheckFillScalarLoss）按 reduction 填 NaN/0（aclnnL1Loss、aclnnSoftMarginLoss 同）。实测（Ascend 910B2，CANN 9.2.0，ops-nn 711a4f5d，两段式 C 直调，out device 预填 -777.0 金丝雀）：self=[0]/[0,4] + reduction=1/2 共 4 组全部 ret1=ret2=0、canary 全保留；非空对照 [2,4] 正常写出。另一独立入口（valid-fuzz 冒烟，out 预填 0xA5）同样判出输出未写出。期望语义：reduction=1→NaN、2→0、0→out 本身为空不写正确；资料未声明空 tensor 语义（另见 #7466）。与 INF-2187（GatherPaKvCache 空输入静默 no-op）共享『空输入早退返回成功+输出缓冲未写』机制，差异在算子（MSE loss vs KV gather）与写出语义（应填标量 vs 应写输出张量）。'
  source: https://gitcode.com/cann/ops-nn/issues/7542
  behavior: 用 0 元素的 self/target 调 aclnnMseLossOut（reduction=mean 或 sum）时，两段接口都返回成功，但 out 一个字节都没被写，读回的是 device 上残留的旧值（实测整块 -777.0 金丝雀原样保留）；后续拿这个随机旧值当 loss 用的管线会静默算错。非空输入一切正常，reduction=none 时空 out 不写属正确行为。
  trigger_surface: Ascend 910B2 + CANN 9.2.0 + aclnnMseLossOut 两段式 + self/target 任一为 0 元素 + reduction∈{1,2}；ops-nn 711a4f5d。
  discovery: 2026-10-28 每日扫描
