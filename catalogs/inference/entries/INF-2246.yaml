    component: mse_loss_out 空张量早退分支
  behavior: aclnnMseLossOut 的空张量早退分支只有一行注释『根据实际支持情况补充』、无填充动作；空输入时两段返回 0 但 out 整块保持未初始化旧值。
effect:
  objects:
  - 数值结果
  detail: self/target 0 元素 + reduction=1/2 时 ret1=ret2=0、out 金丝雀 -777.0 全保留（1/1、4/4）；reduction=0 时 out 本身空、不写正确。同仓 aclnnMseLoss 同入参正确填 NaN/0。
  visibility: 静默错误
mitigation:
  detect: out 预填金丝雀回读可检出；rc 无异常
  fix: 待定（issue open 2026-10-28；期望对齐 aclnnMseLoss 的 MseLossEmptyTensorCompute：reduction=1 填 NaN、reduction=2 填 0）
