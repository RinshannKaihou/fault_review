  behavior: 同一条 prompt 在不同批次组成下得到数值不同（乃至 token 不同）的输出，且只在 FA3 varlen 路径上出现。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: 这正是**batch-invariance 违例**，属 batch 门控的 ambiguous：单序列运行签名为零，混批后才出现。cheap 族的 batch-invariance 探针（非确定性抖动 / batch-size 变体轴，阈值取运行时噪声底）是唯一可靠通道；geometric/spectral/trajectory 在单序列参照下均无从下手，因为受污染序列本身仍近乎在流形上，只是不再对邻居不变。
  repro: partial——在 attention 输出钩子上注入一个幅度取决于"同批次另一序列长度"的小扰动（batch>1 时才非零），复现"输出依赖邻居 cache 长度"；FA3 kernel 的 tile/LSE 归约本身需 Hopper FA3 栈复现。
  locus: cross-request
  priority: low
