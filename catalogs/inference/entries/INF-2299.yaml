  detail: 退化输入（Q/K 全零+causal+大 V 长序列）输出连续 inf；修复 MR !14989 将 fp16 强制切 HighPrecision（fp32 累加），V∈{1000..16} 8 组全部恢复为 V。
  visibility: 数值异常
mitigation:
  detect: Q/K 全零 + 大 |V| 长序列用例断言输出=V；fp16 HighPerformance 模式扫描累加上限。
  fix: 修复 MR https://gitcode.com/cann/ops-transformer/merge_requests/14989 （open，未合入未发布）：tiling 层将 fp16 输入强制切到 HighPrecision（fp32 累加），8 组 V 值验证全部恢复。
