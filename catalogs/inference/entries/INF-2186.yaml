original:
  mechanism: 'sglang #46446（c2026-10-25）：Qwen3.5-9B、SGLang main a99c7d050fae，deterministic 推理开启、seed=42、temperature=0。两请求场景：长请求 prompt 4118 token 流式生成中，短请求 255 token 提交（mixed-chunk 允许短请求 prefill 与长请求 decode 混批）。对照实验：仅 mixed-chunk 开关不同，其余完全一致，长请求前 81 个生成 token 完全相同，第 82 token 翻转（开 41228 / 关 8129）。可复现性：fresh Python 进程 + fresh SGLang Engine 每轮，main 3/3、main+PR #45545 commit（69bc02716cdc GDN chunk 对齐）3/3，六次试验首分叉全在 index 81。原生 SGLang Engine（非 server）复现，无自定义插桩。greedy 差异非采样差异。与 #46259（FlashInfer prefill 分裂不变性）同日出现但独立：本条不依赖前缀缓存命中，是调度批组成（mixed-chunk）改变数值路径。根因未定位。'
  source: 2026-10-25 每日扫描；issue https://github.com/sgl-project/sglang/issues/46446
  behavior: 使用者视角：确定性贪心推理下，同一个长请求的答案会随「服务是否同时混批处理别人的 prefill」而改变：前 81 个 token 一致，第 82 个起走不同分支。对用户表现为同一问题、同一温度 0、同一 seed，并发场景下回答不稳定、单测/回归对比时灵时不灵；关闭 mixed-chunk 即恢复一致。复现只需两个请求，3/3 稳定。
  trigger_surface: SGLang main a99c7d05（+#45545 仍在）；--enable-mixed-chunk 类调度；Qwen3.5-9B；两请求（长 decode + 短 prefill 混批）确定性推理。
  signature: 首分叉 index 81（token 41228 vs 8129）3/3×2 源；mixed-chunk 单开关对照。
