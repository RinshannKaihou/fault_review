title: 三模型漏传 position_ids 破坏 packed 掩码
kind: 故障
status: active
cause:
  objects:
  - subsystem: 模型定义
    stack: transformers
    component: 三模型 mask_kwargs
  behavior: 三个模型的 mask_kwargs 不含 position_ids，create_causal_mask 无法调用 find_packed_sequence_indices，packed 批不生成块对角掩码。
effect:
  objects:
  - 跨请求/跨样本数据
  - 隐状态
  - 输出内容
  detail: padding-free/packed 批下每个文档 attends 到行内所有更早文档；只改第一个文档即可让第二个文档 logits 变化（应恒为 0）；eager/sdpa/flex_attention 均受影响。
  visibility: 静默错误
mitigation:
  detect: 用 DataCollatorWithFlattening 打包两文档，只改第一文档，断言第二文档 logits 变化为 0；覆盖 gpt_oss/afmoe/granitemoehybrid，并用 llama 作对照。
  fix: 待定（issue open，transformers main 2f1bc5e；修复为把 position_ids 放进 mask_kwargs）
