  kind: github_issue
relations: []
original:
  mechanism: Transformers main 2f1bc5e（5.24.0.dev0）中，packed / padding-free 输入（input_ids 加每个文档从 0 重新计数的 position_ids、无 attention_mask）依赖 create_causal_mask 读取 position_ids，再由 find_packed_sequence_indices 生成块对角掩码。LlamaModel 等绝大多数 decoder 都把 position_ids 放进 mask_kwargs，但 GptOss、AfMoE、GraniteMoeHybrid 三个模型的 mask_kwargs 只有 config、inputs_embeds、attention_mask、cache，缺 position_ids，因此 packing 永远检测不到，每个 packed 文档 attends 到同一行里所有更早的文档。影响 eager（GPT-OSS 未配置 kernel 时的默认）、sdpa（AfMoE、GraniteMoeHybrid）与 flex_attention；flash/kernel 后端不受影响，因为 decoder layer 把 position_ids 直接传给 attention call，attention 自己会检测 packing。报告给出 CPU 小模型独立复现：用 DataCollatorWithFlattening 打包两文档，只改第一个文档，测量第二个文档 logits 的位移，正确实现必须为 0。
  source: https://github.com/huggingface/transformers/issues/51072（open，2026-11-21，含三模型 mask_kwargs 源码与 CPU 打包复现脚本）
  behavior: 用 padding-free/packed 方式把多篇文档拼进一条序列做推理或训练时，GPT-OSS、AfMoE、GraniteMoeHybrid 的每个 token 会看到同一行里排在它前面的其他文档内容，文档隔离完全失效；单独跑每篇文档结果正常，打包后 logits 随之改变。没有报错，只有评测或训练质量静默下降，flash 后端反而正常。
  trigger_surface: transformers main 2f1bc5e / 5.24.0.dev0；GptOss、AfMoE、GraniteMoeHybrid；packed 或 padding-free 输入（position_ids 每文档重置、无 attention_mask）；eager/sdpa/flex_attention；flash 后端不受影响
  discovery: 2026-11-27 每日扫描
