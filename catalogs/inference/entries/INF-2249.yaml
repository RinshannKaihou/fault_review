original:
  mechanism: cann/ops-transformer MR !14799（2026-10-28，open，bug 修复）：KvQuantSparseFlashAttention 在 Atlas A2/A3（arch22）TND 布局、实际 query token 数小于输出 capacity 时，尾部 [actual, T) 未写入且不被清零——原初始化逻辑排除 TND、整块输出长度按 BSND 计算。修复为 TND 启用初始化，读 device 上 actual_seq_lengths_query 最后一项作有效 token 总数，仅清零 [actual, T)；分核区间 32B 对齐避免相邻 AIV 共用 GM 块；满批跳过清零与同步；BSND 保留原语义。回归测试（BF16/FP16 × RoPE=0/64、capacity 128→64、ACL 图累计 query 长度动态变化）先将图输出填 NaN 再重放，验证有效行有限、尾部精确 0、与 eager 一致；泛化 42 case 三方案 ×3 轮最大绝对差 0；计时检查 6048 个预填 NaN 图输出全过。实测环境 Ascend 910B3（arch22）、CANN 9.3.0.weekly.20261021、PyTorch 2.12.0、torch_npu 2.12.0.post2。无关联 issue。
  source: https://gitcode.com/cann/ops-transformer/merge_requests/14799
  behavior: 在 Atlas A2/A3 上用 KvQuantSparseFlashAttention（TND 布局）做稀疏量化注意力，当实际 query 数小于输出缓冲 capacity（如 capacity 128、实际 64）时，输出尾部那些没被算到的行不清零，保留缓冲里的旧值——如果之前有 NaN/Inf 残留（如图捕获前预填或上批残留），这些脏值原样出现在输出里且无报错；下游按整块读输出就被静默污染。
  trigger_surface: Atlas A2/A3（arch22）+ KvQuantSparseFlashAttention + TND 布局 + actual query < capacity（padding 存在）；修复 MR !14799 open 未合入。
