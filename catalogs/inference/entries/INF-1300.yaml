  signature: 恢复块的 KV 呈 off-manifold，但**受并发门控（只在负载下出现）**，故族判为 ambiguous。检测面：per-block 的 statistical KV-norm 离群与 geometric 偏移在恢复块上可见；但离线单请求评测根本不会触发，属于必须在**带负载的在线**监控下才可能捕获的故障。cheap 族的非确定性抖动探针（batch-invariance 轴）在原理上是最接近的探测手段。
  repro: 单钩子以"随机选取一个 KV 块区间并写入损坏数值"近似恢复竞态，并以 batch-size 变体来模拟并发门控；真实的 CPU offload 恢复路径需服务栈复现。
