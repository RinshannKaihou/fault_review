  meta: '`infra_off`（GLM-5.3-Flash 官方 `vllm/vllm-openai:glm53-flash` 镜像在 **2 节点 16×H100（跨节点 TP）** 下权重加载期 `KeyError: ''layers.11.shared_transformer.self_attn.qkv_proj.weight''`——`shared_transformer`（非 per-TP-rank 复制的共享层）的 `qkv_proj.weight` 键在 checkpoint 权重映射表中缺失；**单节点 8×H100 同镜像同权重完全正常**，RDMA/节点发现均已完成、crash 精确发生在权重映射阶段） · Cov: `NEW`（shared 层权重键空间在更高切分系数下的映射缺口子签名） · 触发 `config` · 置信度 `documented`'
  mechanism: shared（跨 TP rank 共享、不切分）模块的权重加载路径与 per-rank 切分模块不同；TP8 单节点走的映射可解析该键、TP16 跨节点的映射/切分逻辑未覆盖 shared_transformer 层的键空间——键名存在性随切分系数翻转说明映射表按 TP 度条件生成而非按模块角色。fail-loud（KeyError）但阻断 2 节点部署的唯一路径。
  source: 'vLLM #55725（2026-09-07 open，bug+glm label，OKD 4.22 + InfiniBand RDMA 环境、单/双节点对照）。https://github.com/vllm-project/vllm/issues/55725'
  behavior: 启动期 crash（fail-loud，无静默风险）——多节点 GLM-5.3-Flash 部署不可用。12 类（权重/检查点加载）与 5 类（分布式）交叠：按「跨 TP 拓扑的权重映射」主机制归入第 5 类。与 12.27（tt_dit 丢非 Parameter 态）互补：一个是派生态丢失、一个是共享层键空间在切分系数下的条件缺失；「shared/不切分模块」是 TP 权重加载器的一个独立失效轴。
