original:
  mechanism: cann/ops-nn 的 DynamicBlockMxQuant（arch35 实现）在生成 -2 轴 scale2 后于同一块 UB buffer 内执行 Interleave 的源目标地址重叠缺陷：原实现等价于 Interleave(scale2Local[offset-2*blockW_], scale2Local[offset-blockW_], scale2Local[offset-2*blockW_], scale2Local[offset-blockW_], blockW_)，前两个目标与后两个源指向相同地址，交织写入覆盖原始输入。定位：quant/dynamic_block_mx_quant/op_kernel/arch35/dynamic_block_mx_quant_base.h 的 Compute。修复 PR !12999（已 merged）：scale2 原始数据与交织结果使用独立 UB 空间、交织输出经独立输出队列搬出 GM、dynamic_block_mx_quant_tiling.cpp 计入新增空间。验证（Ascend 950、CANN 9.2.0、TTK+msprof）：修复版 9/9 精度 PASS、三路输出与 golden 逐字节一致；500 条网络尺寸+泛化用例平均耗时 25.2719→25.2802μs（+0.033%）；另 50 条两版均超 100μs 的大尺寸对比。注意：问题依据代码地址重叠提出，修复前的测试尺寸不保证每个都稳定复现精度失败（危害为时序性读写覆盖）。
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7717 （closed）；修复 PR https://gitcode.com/cann/ops-nn/merge_requests/12999 （merged）
  behavior: 在 Ascend 950 等设备上使用 DynamicBlockMxQuant（MXFP4 块量化，MoE/大模型量化推理路径）时，-2 轴 scale 的交织（Interleave）步骤在源与目标为同一 UB 地址的情况下写入，原始 scale 数据可能被部分覆盖后才被读取，量化 scale 与输出存在时序相关的静默错误风险（并非每次都复现，取决于调度时序）；修复后 scale/输出与 golden 逐字节一致。无报错，量化结果偶发错值难以追查。
  trigger_surface: Ascend 950 / CANN 9.2.0；DynamicBlockMxQuant arch35；-2 轴 scale2 Interleave 路径（BF16→E2M1 大尺寸如 [32768,2048] 用于回归）；修复 !12999 已 merged。
  signature: 修复前后 TTK 回归 9/9 逐字节一致性对比；UB 地址重叠代码定位。
  repro: issue 附排查步骤与回归尺寸清单（修复版验证记录）。
  discovery: 2026-10-29 每日扫描
