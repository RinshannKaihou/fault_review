title: MemCache 单 rank put 慢或失败致 TP 失步退出
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: MemCache save 路径
  behavior: request_queue.join() 只等 task_done 被调用，不检查 batch_put 返回码也没有超时；单 rank 慢或 put 失败后各 TP rank 在后续 HCCL 集合通信的时序与序号上分叉
effect:
  objects:
  - 可用性/进度
  detail: 单TP rank put慢或失败：注入220s延迟并返回-7后，T+102s STUCK，T+218s EI0002/507001，T+230s EngineDeadError、4个Prefill API全部退出；put返回-1时请求仍200，保存失败被完全吞掉。
  visibility: 挂起
mitigation:
  detect: 统计每个 TP rank 的 batch_put_from_layers 返回码与耗时；对 put 加超时和 TP 内失败共识，检查 save 完成后各 rank 的集合通信序号是否一致
  fix: '待定（issue 指出 #13119 只恢复了 join 屏障，没有界定期限、没有 save 结果、没有 TP 级失败共识）'
