original:
  mechanism: Kimi-K2.6 W4A8（MoE + Eagle3 投机解码，num_speculative_tokens=3）在 vLLM-Ascend 0.23.0、Atlas 800 A2（910B）、TP=8/DP=2/EP、PD 分离 + MooncakeConnectorV1 的部署上，长上下文（≥23k token）与高并发（≥16）同时满足时输出偶发退化，退化率 6%–10%。正文给出复现矩阵：串行 12k–19k 24 次 0 退化，6 并发 19k 18 次 0，16 并发单实例 19k 与 23k 各 32 次都是 0，而 16 并发双实例 23k 是 96 次 9 次失败（9.4%），复测 160 次 13 次（8.1%）；两个实例都会退化，max_num_seqs=8 不影响退化率，并发只有 3 的生产环境也退化过。三种形态：</think> 标记在 enable_thinking=false 时泄漏进 content（约 9%）、重复坍缩并泄漏英文系统提示片段、彻底 token 沙拉。报告给出的机制是推测：max-model-len=131072 让 KV 预分配很大、余量少，TP=8 all-reduce 数据量大而 HCCL_BUFFSIZE=256 太小，缓冲溢出导致 P 端 KV cache 残缺，残缺 KV 经 Mooncake 传到 D 端后 decode 出乱码；形态 1 另外归因于 Eagle3 num_speculative_tokens=3 时 reasoning-parser 高负载下漏剥。以上均未由源码或补丁证实。
  source: 2026-07-28 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13002 （closed）
  behavior: 长上下文请求在高并发、多实例的 PD 分离部署里偶尔变味：回答里冒出 </think> 标记，或者整段塌成重复模式并夹带系统提示的英文片段，最差是纯 token 沙拉。请求照常返回 finish_reason，日志没有报错，退化率约一成，所以往往先被当成模型本身不稳定。
  trigger_surface: Kimi-K2.6 W4A8 + Eagle3 + PD 分离（MooncakeConnectorV1）+ 上下文 ≥23k + 并发 ≥16 + 双实例；max-model-len 131072、HCCL_BUFFSIZE=256
