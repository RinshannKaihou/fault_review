original:
  mechanism: 'ops-transformer issue #4091（2026-08-03 closed）：moe_token_unpermute（aclnnMoeTokenUnpermute）按 sortedIndices 从 permutedTokens 取数时，内核只判断 idx < num_out_tokens，未校验 idx >= 0；文档要求取值 [0, tokens*topK-1]，负索引在 GetWorkspace/Launch/Sync 全链路被静默接受。已在 Ascend910B3 + CANN 9.1.0-beta.3 上通过源码 --pkg 安装的 vendor 内核（ops-transformer HEAD 4b3d39658e1d，ASCEND_CUSTOM_OPP_PATH 指向该 vendor，repro_manifest.json 记录 built_from_source=true）复现，exit 42：permutedTokens [2,8] float、sortedIndices [2] int32、probsOptional nullptr（topK=1）、out [2,8] float，合法 sortedIndices[0]=0 时 out[0]=1 正确；sortedIndices[0]=-1 与 100000 均 API SUCCESS、Sync SUCCESS，out[0] 为 0。根因在 moe/moe_token_unpermute/op_kernel/moe_token_unpermute.h 约 L245 的 needCopyIn 守卫，与同仓 routing_map 路径的 >=0 && < 判断不一致，属防御性契约缺陷（Track A / Pattern P-011，Finding XFMR-MTU-001）。'
  source: https://gitcode.com/cann/ops-transformer/issues/4091 （closed）
  behavior: 传入负的 sortedIndices 时调用完全成功、不报错，取出来的那几行却是 0（或取到错行）；只有把索引改成合法值结果才对，因此上游一旦算错索引，这里不会拦住，而是把错误静默地写进输出。
  trigger_surface: aclnnMoeTokenUnpermute，sortedIndices 含负值或超过 num_out_tokens 的元素（topK=1 即可）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
