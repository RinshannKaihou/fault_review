id: INF-1706
legacy_ids: []
slug: moe_token_unpermute_negative_sorted_indices
aliases: []
title: MoeTokenUnpermute 静默接受负 sortedIndices
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: moe_token_unpermute
  behavior: needCopyIn 只判断 idx < num_out_tokens、缺 idx >= 0；负索引在 GetWorkspace/Launch/Sync 全链路被静默接受，文档要求 [0, tokens*topK-1]。
effect:
  objects:
  - 数值结果
  detail: sortedIndices[0]=-1 时 aclnnMoeTokenUnpermute 全链路返回 SUCCESS、out[0]=0 而非报错；sortedIndices[0]=100000（>=N）只被 <N 跳过，同样静默产出全 0 行。
  visibility: 静默错误
mitigation:
  detect: 对 sortedIndices 注入 -1 与 >=N 的越界值，检查 API 是否拒绝；与 routing_map 路径的 >=0 && < 守卫对齐比对
  fix: 待定（issue 为 P-011 防御性契约缺陷报告，未见修复 PR）
