  meta: '`infra_off`（flashinfer 消费 C++ 源 + trtllm-gen BMM artifact 的构建（非 Python wheel）中，trtllm-gen NVFP4 MoE 的 **SiTU（siTuGlu）GEMM1 epilogue 在部分配置下不写输出 block scale factors**：`Runner::run`/`MoEWorkspace`/`siTuGlu` cubins 路径——epilogue 应产出的输出块缩放因子缺失，下游反量化使用陈旧/未初始化 scale；B200 ×8 环境） · Cov: `var:vllm_modelopt_nvfp4_moe_w13_mismatched_gscale_warn_then_use_anyway`（7.69 NVFP4 scale 因子路径失配族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 'SiTU GLU 变体的 GEMM1 epilogue 写出路径在特定（tile/形状）配置下未生成 block scale factor 写出指令——缩放因子随配置条件性缺失（非全配置触发，与 7.78 的 end-padding 条件性类似但维度不同：本条在 epilogue 输出而非 padding 输入）。搜索确认 #4280/#4574/#4597/#4209/#4009 等 SiTU/MoE 相关 issue 均未报告此缺陷。'
  source: 'flashinfer #5053（2026-09-09 open，含 B200 ×8 环境报告与 C++ 路径定位；flashinfer Python 不可导入因此无 collect_env）。https://github.com/flashinfer-ai/flashinfer/issues/5053'
  behavior: 无 crash——NVFP4 MoE 输出在受影响配置下以错误/缺失的 block scale 反量化：**静默数值损坏**（输出幅度系统性错）。7.69 之后 NVFP4 scale 路径族第三例：7.69 是加载器调和错 scale、7.78 是 padding 区腐蚀、本条是 epilogue 干脆不写。
