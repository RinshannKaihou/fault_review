slug: vllm_ascend_reduce_sample_mixed_batch_greedy_index
aliases: []
title: 混批贪心请求在 reduce_sample 下返回候选位置而非词表 ID
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: rejection_sampler 候选重排
  behavior: 开启 enable_reduce_sample 后，混合批（贪心+随机）经 apply_sampling_constraints 返回重排后的 scores 与候选词表索引，但贪心分支仍用原词表分片解释列位置，没做候选到词表的映射
effect:
  objects:
  - 输出内容
  - 输出分布
  detail: 贪心请求返回重排候选张量里的位置而不是真实词表 token：两请求批次里最大 logit 对应 token 5 时实测输出 0；同一贪心请求只因与随机请求同批就错收草稿 token 0、错拒 5，草稿接受/拒绝判定同错
  visibility: 静默错误
mitigation:
  detect: 构造 [0, 0.7] 混合温度批次，与纯贪心批次对比同一请求的 output token 与草稿接受结果；纯贪心对照全过、混批 case 全错即为本缺陷
  fix: 待定；报告者称本地已有修复与回归测试，将单独提 PR（issue open）
