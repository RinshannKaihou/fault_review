original:
  mechanism: vllm-ascend 源码构建 fb00c6b + vLLM b2f6858（Ubuntu 22.04 aarch64 / torch 2.10.0 / torch_npu 2.10.0.post4 / CANN 9.1.0）下开启 enable_reduce_sample 投机解码：整批都是贪心时不走候选重排，混合批则经过 apply_sampling_constraints，函数返回重排后的 scores 与候选词表索引；随后的贪心分支调用 greedy_sample(target_logits) 并按原词表分片解释列位置，没有把候选索引映射回词表 ID。组件级复现用两行相同 target logits [-8,-3,-2,-1,0,9,1,2]（最大值对应 token 5），bonus token 固定 7 以便观察是否追加，-1 表示被拒后的占位：批次 [0,0] 输出 [5,-1] 正确，[0,0.7] 输出 [0,7]（草稿 0 被错收），草稿为 5 时 [0,0.7] 输出 [0,-1]（正确草稿被错拒）。16 个 TP1 case 中 8 个纯贪心对照全过、8 个混批全错；TP2 同类错误。复现脚本 native_sampling_probe.py 固定 bonus token 与随机输入，无需模型权重。
  source: 2026-09-12 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16396 （open）
  behavior: 开启 enable_reduce_sample 的投机解码服务里，只要同一批中混有随机采样请求，贪心请求就会返回错误的 token（例如本该输出 5 却输出 0），并错误接受/拒绝草稿 token。纯贪心批次的输出正常，所以只按贪心做验收测试发现不了。
  trigger_surface: enable_reduce_sample + 投机解码 + 批内混合 temperature=0 与 >0
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
