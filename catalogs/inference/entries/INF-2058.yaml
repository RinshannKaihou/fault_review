original:
  mechanism: vllm-ascend issue 15402（2026-08-31，open）：Minimax-M2.5 在 PD 分离 + Layerwise KV 传输下偶发 TTFT 变短并输出乱码。kv-transfer-config 使用 MultiConnector，内层 MooncakeLayerwiseConnector，use_layerwise=true、use_ascend_direct=true，prefill/decode 各 dp_size=1、tp_size=8，kv_load_failure_policy=recompute。报告者判断为 event.synchronize() 偶现乱序：逐层传输本应等对端写完该层再继续，乱序时 decode 侧提前开始 attention，读到未完成的 KV，TTFT 因此异常变短。正文未给出插桩日志或代码行号，只附 mooncake_event_synchronize_issue_report.html 分析报告，属定位性猜测而非已证实根因。
  source: 2026-08-31 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15402 （open）
  behavior: PD 分离服务大部分请求正常，偶尔某个请求的首 token 来得特别快（TTFT 明显低于正常值），随后整段输出是乱码；重发同一请求又可能正常。日志里没有报错，KV 加载也显示成功，只有把 TTFT 与输出质量放在一起看才发现异常。
  trigger_surface: Mooncake layerwise KV 传输 + use_ascend_direct + 高并发 PD 服务
