original:
  mechanism: 'ops-transformer issue #5195（2026-09-10 closed，ascend950 arch35）：FIA 的 arch35 catch-all 模板在 BSND layout + D=512 + S1<64 + gSize=1 场景下精度异常（pass_rate 约 0.35%）。根因是 tiling 侧 CheckPFAMergeSupport 在 gSize=1（并非真正的 GQA 分组）且 S1*gSize<64 时仍返回 true，使 gsMergeFlag 被误置为 true，kernel 中 isGqa=1、isPfaGS1Merge=true，错误修改 BSH 路径的 mm1Ka stride（从 n2*g*d 变为 d），BMM1 读 K 时按错步长取数。复现：B=1、N1=4、N2=4、S1=S2=36、D=512、bf16、sparse_mode=0，调 npu_fused_infer_attention_score_v2 后与 golden 比对。修复方案为在 CheckPFAMergeSupport 中增加 gSize<=1 的排除条件（gSize=1 时 GS1 合轴无意义），关联 PR 11748。'
  source: https://gitcode.com/cann/ops-transformer/issues/5195 （closed）
  behavior: BSND 布局、D=512、S1=S2=36、bf16、sparse_mode=0 的 FIA 精度用例几乎全错：pass_rate 0.35%、max_abs_err 1.07，但调用全程无异常、无日志，输出形状与 dtype 均正常，只在逐元素与 golden 比对时暴露大面积偏差；修复后同一用例 pass_rate 100%、max_abs_err 0.002。
  trigger_surface: BSND layout + D=512 + S1<64 + gSize=1 + sparse_mode=0，走 arch35 catch-all 模板
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
