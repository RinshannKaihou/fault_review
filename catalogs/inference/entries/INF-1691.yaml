title: FIA gsMergeFlag 误置致 BMM1 读 K stride 错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: FIA arch35 tiling
  behavior: gsMergeFlag 在 gSize=1、S1*gSize<64 时被误置，kernel 按 isGqa=1 把 BSH 的 mm1Ka stride 由 n2*g*d 改成 d，BMM1 错步长读 K 数据。
effect:
  objects:
  - 数值结果
  detail: BSND、D=512、S1=S2=36、bf16、sparse_mode=0 的用例 pass_rate 仅 0.35%、max_abs_err 1.07（修复后 100%、0.002），无报错。
  visibility: 静默错误
mitigation:
  detect: 按 gSize=1、S1<64、D=512、BSND 组合定向覆盖精度用例，比较 pass_rate 与 max_abs_err
  fix: PR 11748 在 CheckPFAMergeSupport 增加 gSize<=1 排除条件（issue closed，合入与发布状态未核实）
