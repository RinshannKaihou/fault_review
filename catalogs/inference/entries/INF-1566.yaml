id: INF-1566
legacy_ids: []
slug: ops_math_xlog1py_log1p_rounding_zero
aliases: []
title: Xlog1py 用 ln(1+y) 计算致小 y 精度归零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: xlog1py arch35 kernel
  behavior: kernel 按 x*ln(1+y) 计算而非 log1p，y=1e-8 时 1+y 在 FP32 下舍入为 1，结果直接变 0；1+y 舍入阈值附近的其它小值也出现很大相对误差
effect:
  objects:
  - 数值结果
  detail: FP32 x=1e8、y=1e-8 输出 0 而期望 1；16 个边界值中 6 个错误，修复后 16/16 通过、最大相对误差 9.536742e-08（Ascend950PR 模拟器验证，未上真机）
  visibility: 静默错误
mitigation:
  detect: 取 x 大而 y 落在 1+y 舍入阈值附近（如 x=1e8、y=1e-8）的用例，与 torch.xlog1py 比相对误差；固定 dtype 下扫 nextafter 级小值
  fix: PR https://gitcode.com/cann/ops-math/merge_requests/5999 （open）：对 1+y 的舍入做补偿，和恰好等于 1 时直接用 y，并显式处理正无穷；仅改 math/xlog1py/op_kernel/arch35/xlog1py_kernel.h
