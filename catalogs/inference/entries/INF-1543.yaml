id: INF-1543
legacy_ids: []
slug: vllm_ascend_fusedmc2_pad_token_moe_routing
aliases: []
title: FusedMC2 未屏蔽 pad token 致专家容量溢出丢 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: vllm
    component: FusedMC2 pad 屏蔽
  behavior: FusedMC2 在 pad 场景没有正确屏蔽 padding token，pad 参与 MoE routing 并集中打到少数专家，超出 fused dispatch/combine 的 max_output_size 容量。
effect:
  objects:
  - 输出内容
  - 数值结果
  detail: 混部 FULL_DECODE_ONLY + DP8TP2 + kvcache 打满时出现空回复与乱码；ep0 上 0~9 号专家峰值超 20 万 token（上限 65536），skip_all_reduce 跳过 pad 后 gpqa 86.87、无乱码。
  visibility: 静默错误
mitigation:
  detect: 统计每张卡每个专家的实际 token 数并与 fusedmc2 的 max_output_size 比较；观察 kvcache 打满、出现重计算（单卡 decode 突然转长 prefill）时是否超限
  fix: 待定（issue closed，正文未给 PR）；报告者的规避手段是 skip_all_reduce=True 在 FusedMoE 场景跳过 pad，或把 max_output_size 放大到覆盖峰值
