id: INF-1516
legacy_ids: []
slug: torchnpu_copy_opapi_nz_format_d2d_corruption
aliases: []
title: copy_ op_api 路径 NZ 张量 D2D 静默损坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: copy_ op_api 格式转换
  behavior: MR !40289 给 copy_ 打开 internal_format_opapi 后绕过 codegen 格式守卫，而 op_api 的 copy_ 只在 D2H 补了格式保护，D2D/H2D 缺格式转换。
effect:
  objects:
  - 数值结果
  detail: 2×2 ND→NZ 只按 numel 覆盖 NZ 物理存储开头，(1,0)/(1,1) 保留 1.0；NZ→ND 报 EZ1001；NZ→NZ 同格式静默损坏；HCCL send/recv 带 format 时触发。
  visibility: 静默错误
mitigation:
  detect: 打开 allow_internal_format 后构造 NZ 目标/源的三种 copy_ 组合，与 CPU 参考比对；NZ→NZ 同样要查
  fix: 在 NPUNativeOpApiFunctions::copy_ 入口复刻 codegen 守卫：A2/A3 上任一输入为内部格式即回退 NPUNativeFunctions::copy_，均 base format 才走 aclnn；issue closed，合入与发布未核实
