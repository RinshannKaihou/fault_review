original:
  mechanism: 'vLLM V1 KV connector 的加载失败上报在同一 step 输出中迟到处理，_handle_invalid_blocks（scheduler.py:3416 早退）只扫 running 与 kv_holding_waiting 中的请求，存在三个缺口。(1) #61768：owner 在失败加载的 step 内被 abort（如客户端断连）时，_process_aborts_queue 先 finish_requests 释放块（hash 保留），失效上报随后处理时 total_failed_requests==0 直接返回，evict_blocks 不执行——从未加载成功的块留在前缀缓存，后续同前缀请求命中并从坏 KV decode（CPU 调度器最小复现，fail/recompute 策略与 sync/async 均中）。(2) #61905：异步调度下上报在下一 step 调度后处理，_handle_invalid_blocks 按物理块 ID 找请求；kv_producer 顶层角色下被 abort owner 的块立即回池并在下个 schedule() 分给无关请求 C，迟到上报按块 ID 命中 C：fail 策略 C 被误杀 FINISHED_ERROR，recompute 策略 C 从 128 回退 64 token 重算（C 从未用过外部 KV）。defer_block_free（#45357）只保护 kv_consumer/kv_both 角色。(3) #61912：owner 在 schedule 与 update_from_output 之间被 KV 压力抢占时块同样已释放（PREEMPTED 在 waiting，hash 保留），#61769 只在 _free_request 记录块 ID，抢占路径漏记，7/8 块仍 hashed，owner 恢复后在 112-token 命中（48 valid）上继续、fail 策略下 owner 不被 fail。全部为 CPU scheduler+mock connector 探针实测（26.10 容器，main a97d19d7/0c2584929）。'
  source: 2026-10-17 GitHub vllm-project/vllm issues https://github.com/vllm-project/vllm/issues/61768 、https://github.com/vllm-project/vllm/issues/61905 、https://github.com/vllm-project/vllm/issues/61912 （均 open，附 CPU 探针脚本与矩阵）
  behavior: 使用会报块级加载失败的 KV connector（外部 KV 加载）时：请求被客户端取消或被调度器抢占后，它那批加载失败的 KV 块不会被清出前缀缓存，后续相同前缀的请求会命中这些从未成功加载的块，直接 decode 出损坏输出，无报错；另一种形态是失败报告迟到时块已被重新分配给别的无关请求，那个无辜请求会被误判失败（fail 策略下直接 FINISHED_ERROR）或被回退重算。三种触发（abort、块复用、抢占）都有 CPU 级复现脚本。
  trigger_surface: 外部 KV connector（invalid_block_ids 上报）+ async 调度 + owner abort/抢占/块 ID 复用；kv_load_failure_policy fail/recompute 均受影响
  discovery: 2026-10-17 每日扫描
