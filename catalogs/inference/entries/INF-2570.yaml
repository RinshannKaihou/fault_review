    component: NsaCompressAttentionInfer
  behavior: 多 token（S>1）且 numHeads 较大时，每个进程第一次调用返回局部错误输出，错误元素只取精确 0.0 与 128.0，同进程第二次起恢复正常，根因未定位。
effect:
  objects:
  - 数值结果
  detail: 首调 0.03%~0.35% 元素恒为 0.0/128.0，落在 DV=128 边界；20 个新进程 14 次首调错；单 token 对照组 20/20 正确；2/20 伴随 507015 且整行 0。
  visibility: 静默错误
mitigation:
  detect: 常量 1.0 输入（解析解 attentionOut 恒 1）跑新进程首调，统计不等于 1 的元素；必须每次新进程，第二次调用会掩盖。
  fix: 待定（issue open，未附修复 PR）
