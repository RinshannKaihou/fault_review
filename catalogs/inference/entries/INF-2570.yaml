  mechanism: aclnnNsaCompressAttentionInfer（Atlas A3 ascend910_93、CANN 9.3.0、驱动 26.1.1、master e8992187）：多 token（S>1）+ 大 numHeads 下每个进程第一次调用返回局部错误输出，错误元素只取精确 0.0 与 128.0，占比 0.03%~0.35%，位置落在 DV=128 的整数倍边界、成组出现在 kv-head 组边界与 NQ 轴尾部。探针用常量 1.0 输入，解析解要求 attentionOut 逐元素恒 1.0；单 token 对照 20/20 正确，多 token 首调 14/20 错、6/20 对，同进程第二次起恢复。输出缓冲预填 0xDEAD 与 0xC0FF 两轮，坏元素都不等于填充值，仍为 0x0000/0x4300，排除读回残留。20 次新进程中有 2 次伴随 aclrtSynchronizeStream 返回 507015，此时整行 T 全 0。
