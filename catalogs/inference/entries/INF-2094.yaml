id: INF-2094
legacy_ids: []
slug: vllm_ascend_310p_kv_budget_double_deduct_other_process_hbm
aliases: []
title: 310P KV 预算重复扣除他进程 HBM 致容量塌陷
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: NPUWorker310 显存预算
  behavior: 310P 专用 determine_available_memory() 用 total-free 取设备全局占用，再从本实例 KV 预算里扣一次，其他进程已占的 HBM 因此被重复扣除。
effect:
  objects:
  - 性能/资源
  detail: 43.24 GiB 设备上已有 19 GiB 他进程占用时，gpu_memory_utilization=0.5 只分到 0.09 GiB KV Cache，4096 上下文启动失败；提到 0.52 也只有 0.57 GiB，他进程一波动即再次失败。
  visibility: 静默错误
mitigation:
  detect: 同卡留他进程占用后看启动日志的 requested_memory、non_kv_cache_memory 与最终 available_kv_cache_memory_bytes，KV 容量应约等于（预算-本实例 non-KV）/2
  fix: issue 给出改法：310P 分支改为 (requested_memory - profile_result.non_kv_cache_memory)//2；#7308/#7372/#7427 为前序，未见对应 PR（issue closed，未核实是否已合入）
