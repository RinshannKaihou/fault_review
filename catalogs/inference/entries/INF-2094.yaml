original:
  mechanism: '310P 专用 NPUWorker310.determine_available_memory()（vllm_ascend/_310p/worker_310p.py#L75-L115，main commit 7485331）在 profiling 期间算 non_torch_memory_before_empty_cache = total_memory - free_memory - torch_memory，再减去 profile_result.non_torch_increase 得到 non_torch_memory_cleared_by_empty_cache，最后 available = (requested_memory - non_kv_cache_memory - non_torch_memory_cleared_by_empty_cache) // 2。total_memory - free_memory 是设备全局占用，包含 MindIE 或其他 vLLM 实例持有的 HBM，而 non_torch_increase 只是本实例 profiling 期间的增量，于是既有进程占用被当成「空 cache 能回收的本实例占用」又扣了一次。该占用本已由启动条件 init_snapshot.free_memory >= requested_memory 限制，不应再从本实例预算里扣。通用 Ascend worker 的同类问题由 #7427 修复，310P 在 #7372 中整体覆盖了该函数因而没有继承修复（原问题 #7308）。实测 43.24 GiB 设备、mindie_llm_back 占 19313 MB、free 23.45 GiB 时，requested 21.62 GiB 通过启动检查，最终 KV 只有 0.09 GiB；按公式应约 9.95 GiB。'
  source: 2026-08-11 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/14004 （closed）
  behavior: '310P 上把 Qwen3-0.6B（FP16，TP1）和 MindIE 共卡部署，gpu_memory_utilization=0.5 时服务只能拿到 0.09 GiB KV Cache，最大长度约 768，4096 上下文的启动直接失败；把利用率提到 0.52 只换来 0.57 GiB，启动余量不足 1 GiB，别的服务显存稍一波动就又起不来。设备在 npu-smi 里一直是 Health: OK，空闲 HBM 也确实够（23.45/43.24 GiB），失败信息只表现为 KV Cache 不够，看不出是预算算错。'
  trigger_surface: 310P EP/独立 HBM + 同 Device 上已有其他进程占用 HBM 时的 vLLM 实例启动
  discovery: 2026-10-21 第三轮顺序扫描（final_tail，issue created < 2026-10-07）
