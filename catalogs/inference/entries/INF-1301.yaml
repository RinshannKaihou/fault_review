  repro: 与 K9.6 相同的捐赠者-受害者构造——单钩子把受害请求的前缀 K/V 替换为另一 prompt 的对应 K/V；区别仅在于现实中的触发键是 salt 而非哈希碰撞，隐藏态后果一致。
