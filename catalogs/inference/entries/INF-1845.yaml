id: INF-1845
legacy_ids: []
slug: ops_math_random_calc_split_blocks_cap_partial_coverage
aliases: []
title: 随机算子分块达 8 上限仍成功致覆盖不全
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: random 公共 tiling 分块
  behavior: CalcSplitBlocks 在 splitBlockCount 达到固定容量 8 后停止入栈，却无条件返回 GRAPH_SUCCESS，不检查待处理切片栈是否清空；kernel 只遍历这 8 块。
effect:
  objects:
  - 数值结果
  detail: 2 字节元素、输出 19,327,352,832 字节时函数成功返回并记 8 块，实际只覆盖 9,663,676,416 字节，其余区域未被写入；6 个 arch35 随机算子共用该 tiling。
  visibility: 静默错误
mitigation:
  detect: 构造输出需要 ≥9 个 32-bit 可索引块的随机算子用例（大 shape 或 2 字节 dtype），检查返回值与输出后半段是否被写过；常规规模用例只用到 1~2 块。
  fix: 待定（issue open，未给 MR）：循环结束后检查切片栈 top，非空则返回 GRAPH_FAILED，禁止部分分块以成功状态继续。
labels:
  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: arch35 随机算子（stateless_normal/uniform/truncated_normal_v2/exponential/sim_thread_exponential/stateless_random）+ 输出需超过 8 个 32-bit 可索引块
  stage: N/A
  confidence: documented
