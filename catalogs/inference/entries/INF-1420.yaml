title: CANN InplaceApplyAdaMax FP32 中间量溢出产 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: AdaMaxVF 先除后乘次序
  behavior: 固定先除后乘：m 达 ±FLT_MAX、v+ε 低至 ε 时商在 FP32 溢出为 ±inf；lr=0 时 inf·0 得 NaN，|lr_adj|<1 时得 ±inf 假溢出，与同号 ±inf var 相减得 NaN。
effect:
  objects:
  - 数值结果
  detail: 真实 update 有限可表示时仍错：lr=0 冻结更新返回 NaN 而非 var 原值（golden -3.89e-4 vs NaN）；|lr_adj|<1 收缩商得 -inf 假溢出（真实 -2.36e37）；var=±inf 同号 update 得 NaN
  visibility: 数值异常
mitigation:
  detect: kernel_l1 mixed 极端值用例（L1_528/252/1137/295/675 形态）FP64 golden 对账
  fix: issue 附修复：标量 |lr_adj|<=1 先乘后除；>1 保持先除后乘；NaN 修复 varNew=NaN 且 m_out 有限时 varNew=var。5/5 修复 PASS + 23/23 防复发用例，状态未核实
