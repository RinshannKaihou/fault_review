original:
  mechanism: tt-metal Blackhole SFPU 对 16-bit Dest 中 Float16 数据的读取缺陷：任何一元 SFPU 算子当操作数以 fp16 存在 16-bit Dest（dest_acc=No）时在垃圾数据上计算——涵盖 Float16 输入、或 Float32 输入经算子输出到 Float16 的场景；同一 cell 在 Wormhole 上正确。证据：tt_metal/tt-llk/tests/python_tests/test_unary_sfpu_ulp.py 穷举一元 ULP 扫描（p100a 2026-10-23 运行、p150 复现）：Float16 目标每 lane 回 NaN；Float16_b/Float32 目标下每个读值算子错 1e8~1e9 步（Square 1.2e9 步、Sign(Float16→Float32) 134242304 步）；只有符号位算子 Abs/Neg/Identity 精确。不受影响：Float16_b 与 Float32 在 16-bit Dest；任意格式 dest_acc=Yes；Float16_b→Float16 at dest_acc=No（TestConfig 提升为 32-bit Dest）。疑似区域：Blackhole 的 SFPLOAD/SFPSTORE 对 fp16 Dest 的 load/store 格式。186 cell 中 145（Float16→Float16）/143（Float32→Float16）在 dest_acc=No 不可测量。
  source: GitHub issue https://github.com/tenstorrent/tt-metal/issues/62654 （open，2026-10-27，含 ULP 扫描量化数据）
  behavior: 在 Blackhole（p100a/p150）上使用 fp16 精度且未开 32-bit Dest 累加的模型算子（一元激活/数学函数走 SFPU）时，输出是 NaN 或偏差 1e8-1e9 量级的垃圾值；同代码在 Wormhole 正确。端到端表现为 fp16 模型推理输出全面损坏（若该路径被选中），无报错；只有 Abs/Neg/Identity 幸免。规避：用 bf16/fp32 或 dest_acc=Yes。
  trigger_surface: tt-metal Blackhole（p100a/p150）；Float16 输入或输出到 Float16 的一元 SFPU 算子；dest_acc=No（16-bit Dest）；Wormhole 不受影响。
  signature: ULP 扫描：Float16 目标全 NaN，读值算子错 1e8-1e9 步；符号位算子精确。
  repro: test_unary_sfpu_ulp.py 穷举扫描（p100a/p150 已跑）。
  discovery: 2026-10-29 每日扫描
