  meta: '`infra_off`（vLLM vendored `third_party/flash_linear_attention/ops/chunk_o.py` 相对上游 `fla-org/flash-linear-attention` 的关键分叉：token mask `o_t/m_t` 被移到 `USE_G` 块**之后**计算，gate 以 `boundary_check` 无 `other` 加载后**先于任何 mask 被 `exp`**——部分边界 chunk 中未定义 lane 的值（含 pairwise 差 `exp(b_g[:,None]-b_g[None,:])` 混合有效/无效 lane）直接进入输出累加器；上游同块先算 mask 并以 `mask=m_t, other=0.0` 加载） · Cov: `NEW`（vendored 副本丢 mask+fill 且把 mask 计算移到使用之后的子签名） · 触发 `config` · 置信度 `documented`'
