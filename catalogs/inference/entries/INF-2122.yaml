original:
  mechanism: 'tt-metal main 84ddc0ae9b（ttsim v1.13.0 Blackhole）ttnn.where 对 int32/uint32 张量与 Python int 标量的组合把标量静默经 float32 舍入：ternary/common/ternary_op_types.hpp:14 的 TensorScalarVariant = std::variant<float,int,Tensor> 接受 int，但 ternary.cpp std::visit 进 invoke_impl 的唯一标量重载收 float，int 隐式转换丢精度；validate_where_scalar_for_integer_tensor（ternary.cpp:99 经 scalar_fits_integer_dtype）在已舍入的 float 上校验，16777217 以 16777216.0 通过、INT32_MAX 以 2^31 被拒绝（TT_FATAL）。实测表：16777217→16777216、123456789→123456792、-2147483647→-2147483648、1000000001→1000000000，每个错值都恰为 float32(s)；uint32 同（3000000001→3000000000、4294967295 被拒）。ttnn.add(int32,s) 与 torch.where 保持精确。测试缺口：test_where.py 的整型标量只有 ±9/10/7，无 |s|>2^24。#60508（自 #58403）加的 float 标量不可表示拒绝检查不覆盖此路径（精度在校验前已丢）。'
  source: https://github.com/tenstorrent/tt-metal/issues/62016（main 84ddc0ae9b + ttsim v1.13.0 Blackhole，确定性复现）
  behavior: 对 int32/uint32 张量调用 ttnn.where 传入绝对值大于 2^24 的 Python 整数标量时，返回值是该标量的 float32 舍入（如 16777217 变 16777216），无任何错误；而合法的 INT32_MAX/UINT32_MAX 反而触发 TT_FATAL 拒绝。ttnn.add 同标量正确，torch.where 亦正确。
  trigger_surface: ttnn.where + int32/uint32 tensor + Python int 标量 |s|>2^24；TTS/TST/TSS 全部形态
  discovery: 2026-10-22 每日扫描
