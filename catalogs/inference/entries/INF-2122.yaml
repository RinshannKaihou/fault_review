cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: ternary where 标量通道
  behavior: TensorScalarVariant 接受 int，但 std::visit 进 invoke_impl 的唯一标量重载收 float，int 隐式转换静默丢精度；范围校验在已舍入 float 上进行（INT32_MAX 被拒）
effect:
  objects:
  - 数值结果
  detail: int32/uint32 张量配 Python int 标量 |s|>2^24 返回 float32(s)（16777217→16777216、-2147483647→-2147483648）；INT32_MAX/UINT32_MAX 合法值反被 TT_FATAL 拒绝；ttnn.add 同标量精确
  visibility: 静默错误
mitigation:
  detect: 对照 torch.where / ttnn.add 的同标量结果（报告者的表）
  fix: issue 建议 int32_t/uint32_t 标量重载 + 按整数做范围校验 + 2^24+1/123456789/±(2^31-1)/UINT32_MAX 测试；修复 PR 未提交
