original:
  mechanism: aclnnForeachDivScalarV2（ops-nn commit 7044c8328c）在 x=FLOAT16 + scalar=DOUBLE 时把 DOUBLE 标量降成 fp16 再下发。scalar=70000.0 超 fp16 上限 65504 变 inf，1.5/inf=0，整张输出位模式全 0；文档 docs/aclnnForeachDivScalarV2.md 参数表明确声明 x=FLOAT16 时 scalar 支持 FLOAT16、DOUBLE。对照实验：x=fp32+DOUBLE 正确（2.14e-5/3.57e-5/5.0e-5）；x=bf16+DOUBLE 被显式提升成 FLOAT 正确（2.15e-05 等）；仅 fp16 路径错。环境：Atlas A2（910B2）、CANN 9.2.0、aarch64、2026-11-02 复现，附完整 repro.cpp（RET_GWS=0 组合被接受、OUT_BITS 全 0）。同日同仓开出统一 Foreach 系列标量提升规则的修复 MR !13432（ FLOAT16 输入下 DOUBLE/FLOAT 标量被降精度），与本条机制同族，覆盖面待核实。
  source: https://gitcode.com/cann/ops-nn/issues/7954；同族修复 https://gitcode.com/cann/ops-nn/merge_requests/13432
  behavior: 调用 aclnnForeachDivScalarV2 且 x 是 fp16、除数是 DOUBLE 标量（如 70000.0，文档明确允许的组合）时，整张输出静默变成全 0——正确结果应是约 2.14e-5 的次正规值。接口返回成功无任何告警；同一程序只把 x 改成 fp32 或 bf16 结果就正确，用户只会看到 fp16 路径输出毫无理由地全零。
  trigger_surface: CANN 9.2.0 ops-nn（commit 7044c8328c）；aclnnForeachDivScalarV2；x=FLOAT16 + scalar=DOUBLE 且 |scalar|>65504（如 70000.0）；910B2 复现；文档声明的合法组合
  discovery: 2026-11-02 每日扫描
