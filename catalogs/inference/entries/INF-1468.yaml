original:
  mechanism: 'tt-metal issue #61490（c2026-10-19，Blackhole）：ttnn.operations.moreh.mean_backward / norm_backward 在 keepdim=False 且沿末维（dim=3）时返回错误值。机制：get_output_grad_shape（moreh_mean_backward_program_factory.cpp:38、moreh_norm_backward_program_factory.cpp:59）在 keepdim==false 时不读真实 output_grad 形状，假设它是 input_grad 形状降维置 1（(1,1,32,1)）；实际 keepdim=False 的 dim=3 梯度是 (1,1,32)，TILE 布局下 32 个值沿 tile 一行排布，假设形状把它们排成一列，广播读到 tile padding。实测：全 1 梯度 (1,1,32) 期望全部 1/32=0.03125，992/1024 错且错值为 0.0；uniform(-1,1) 梯度（seed 3）错值 1.06e37；确定性跨运行一致；dim=1/2 精确；norm_backward(p=2) dim=3 每 0.5 量级梯度 max err 4.54；dim=[2,3]（2,3,64,64）max err 1.1e-4。'
  source: 2026-10-19 GitHub tenstorrent/tt-metal issue https://github.com/tenstorrent/tt-metal/issues/61490 （open）
  behavior: Tenstorrent 上调用 moreh mean/norm 反传（keepdim=False、对最后一维）时，四分之三以上的梯度元素悄悄变成 tile 填充值（全 1 梯度时是 0、随机梯度时可达 1e37 量级的垃圾），无任何报错；对其他维度归约则正确。
  trigger_surface: ttnn moreh.mean_backward/norm_backward + keepdim=False + dim 含末维；TILE 布局；Blackhole
  discovery: 2026-10-19 每日扫描
