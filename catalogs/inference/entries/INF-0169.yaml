  meta: '`infra_off`（matmul/bmm 融合激活 epilogue 参数装配错：selu 的 alpha/scale 顺序颠倒（三处副本）、无参调用时硬编码默认值与注释意图不符、bmm 融合 softplus 从不传第三参（beta 倒数）默认 0——每个 beta 下融合 softplus 全错；CI 容差 `rtol=15.0×K`（K=512 即 768,000%）接受几乎任何错误） · Cov: `var:ttmetal_matmul_bias_softplus_epilogue_drops_beta_reciprocal`（1.139 融合激活参数管道族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '`ttnn.matmul(a, b, activation="selu")` 在激活融合进 kernel 的路径上把参数推入 `ActivationApplyHelper` 时 alpha/scale 顺序反了（`unary_op_utils.cpp` 与 BH/WH、Quasar 两份 `matmul_utilities.hpp`）；`bmm_large_block_zm_fused_bias_activation.cpp` 的 softplus 不传 beta 倒数。CI 未拦截的原因是容差公式随共享内维 K 线性放大——测试分布接受结构性错误。'
  source: 'tt-metal PR #55550（fixes #55252，2026-09-05，含容差公式分析与设备侧三处修复）。https://github.com/tenstorrent/tt-metal/pull/55550'
  behavior: 无 crash——融合激活输出静默错值（selu 全域、softplus 逐 beta）；与 1.139（softplus beta 倒数丢失致阈值下归零）构成"融合激活参数管道"对：参数顺序错与参数不传在相邻文件、同被膨胀容差掩护。「容差随问题规模线性放大」是 1.105（PCC 假阳性）之后测试方法学反模式的第二个实例。
  trigger_surface: tt-metal + matmul/bmm 融合 selu/softplus 激活（op 组合即触发）
