original:
  category: cat12
  section: 第 12 类 · 权重 / 适配器 / 检查点加载故障
  meta: '`infra_off`（SGLang nightly 20260916 服务 `zai-org/GLM-5.3-Flash`：`/model_info` 报告 `has_image_understanding: true`，但**每张图片被静默缩为恰好 3 token**（`<|begin_of_image|>` + 1×`<|image|>` + `<|end_of_image|>`）——placeholder 永不展开、无 `pixel_values`/`image_grid_thw`，模型从幻觉作答（纯红图片答"穿亮黄夹克的人"）；文本路径不受影响。根因（容器内验证）：部署 pin `transformers==5.12.1`，而 **`glm5_next` 模块只存在于 transformers main**——5.12.1 上 `AutoProcessor.from_pretrained(..., trust_remote_code=True)` **静默返回 `TokenizersBackend`**（裸 tokenizer）而非报错；SGLang 以 tokenizer 充当多模态 processor 启动，图片加载照常（坏 base64 正确返回 400）但无人展开 placeholder/编码 pixel） · Cov: `var:sglang_uv_resolver_silent_old_version_regression_resurrection`（6.156 依赖解析静默降级族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: '`AutoProcessor` 的回退链在目标模块缺失时静默降级为纯 tokenizer（无 warning/异常），把"processor 能力缺失"从启动期 fail-loud 变为运行期 fail-silent；服务端能力探测（has_image_understanding）基于 config 而非实际 processor 类型，二者脱节。'
  source: 'SGLang #39831（2026-09-16 open，含 nightly 镜像复现、容器内 AutoProcessor 类型验证、token 计数证据与文本路径对照）。https://github.com/sgl-project/sglang/issues/39831'
  behavior: 无 crash、无警告——多模态请求被降级为"3 个占位 token + 纯文本幻觉"，图片理解 100% 失效但服务表面健康；文本正常使回归测试易漏多模态腿。6.156（uv resolver 静默回退旧版复活已修复 bug）之后依赖降级族新成员：本条在 **pin 版本缺模块 × AutoProcessor 静默回退**维度。
  trigger_surface: SGLang + GLM-5.3-Flash + transformers==5.12.1 pin（other_stack；版本组合触发）
  discovery: 2026-09-16 每日扫描。
