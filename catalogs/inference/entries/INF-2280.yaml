original:
  mechanism: 'cann/ops-math 的 aclnnInplaceReciprocal 在 complex64 多元素张量上对 0 与次正规输入返回 nan+nanj 的缺陷（issue #4207 实测：complex128 同接口对同样输入正确，说明 complex64 kernel 路径的复数倒数公式在实部/虚部含 0 或次正规时产生 0 除，未做防护），两段返回 0。数学上复数倒数 z^{-1}=(a-bi)/(a²+b²)，a=b=0 时应按 IEEE 语义产出 inf/nan 组合而非双 nan 传播到整个计算，次正规输入同理。'
  source: GitCode issue https://gitcode.com/cann/ops-math/issues/4207 （open，2026-10-29）
  behavior: 对 complex64 张量（多元素）做原地倒数时，值为 0 或次正规的元素输出 nan+nanj，且随后续计算传播；同样的输入用 complex128 接口是正确的。接口返回成功，异常值以 NaN 形式静默出现在结果里（无报错）。
  trigger_surface: cann/ops-math inplace_reciprocal；complex64；多元素张量含 0/次正规元素；信号处理/频域计算路径。
