original:
  mechanism: 'vllm-ascend issue #15842，复现于 main commit 8d838ee86935e872806a4c491d33782e69c59538。环境：PD 分离，Prefill TP=2、Decode TP=1，AscendStoreConnector + Mooncake backend，block_size=128，Qwen3-1.7B dense GQA。由 #11582 引入的 TP 不对等分条 KV I/O 实现仍在源码里，但 #11444 重构 KV 池初始化、传输线程构造与 load 分发时丢掉了三个生产入口：KVCacheStoreSendingThread 与 KVCacheStoreRecvingThread 构造时没有传入 TP 不对等的 worker，故分条 PUT 与异步分条 GET 不可达；KVPoolWorker.start_load_kv() 也不再路由到 _load_kv_tp_mismatch()，同步加载落到普通 GET。tp_mismatch 检测与 helper 都还在，所以初始化日志照报 TP mismatch，实际传输却走普通路径。在 MultiConnector 拓扑下 Decode(TP=1) 需把 KV 拆进 effective_tp=2 的 key 命名空间，缺发送线程 worker 时普通 PUT 只写 head_or_tp_rank:0，日志显示 put 只有单一 rank 的 key，下一轮 Prefill 查询 keys=4 multi_tp_keys=8、exists 4/8，响应 hit_tokens=0。原有测试直接往线程里注入 mock worker 或单测 helper，未验证从配置到线程构造与分发的生产链，故未拦住。'
  source: 2026-09-05 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15842 （closed）
  behavior: PD 分离下 Prefill 与 Decode 的 TP 不一致（典型 Prefill TP=2 / Decode TP=1）时，KV 池看似在工作：Decode 每 128 token 都打印 KV pool put 成功，初始化日志也明确报 TP mismatch detected 与 num_sub_keys。但下一轮 Prefill 去查同一段前缀时只有一半对象存在（exists 4/8），整段前缀被拒绝、hit_tokens=0，请求退化为全量重算。没有报错，从日志看像是「前缀缓存没命中」，实际是 TP 不对等的搬运路径根本没被调用。
  trigger_surface: PD 分离 + AscendStore/MultiConnector + Prefill 与 Decode 的 TP 不一致（#11444 之后）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
