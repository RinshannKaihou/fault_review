original:
  mechanism: 'Ascend/pytorch #3424（2026-07-28，closed）：PR CI run 30270203846（commit eda3295）中 test/nn/test_embedding.py 的 3 个 test_EmbeddingBag_empty_per_sample_weights_and_offsets 用例由 PASSED 转 FAILED，1.5 小时前 nightly run 30263356078（commit df073e7）同镜像同 CANN 全通过。用例逻辑：weight=[[1,2]..[9,10]]，input=torch.tensor([])，offsets=[0,0,0,0,0]，per_sample_weights=randn_like(input)，期望输出 5×2 全零；实测 8/10 元素错，最大绝对差 10.0、相对差 inf，输出里出现了 weight 的值而不是零，说明空输入路径下 aclnnEmbeddingBag 未初始化/未清零输出 buffer。两条流水线仅 commit 与分片不同，失败分片 reg-2（NPU Device 5）与通过分片 reg-1（Device 7）环境一致，表现为偶发而非确定性。'
  source: 2026-07-28 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/3424 （closed）
  behavior: 喂空输入给 EmbeddingBag（offsets 全 0、带 per_sample_weights）时，本该得到全零输出，实际拿到的是 weight 里的数值：5×2 输出里 8 个元素不对，最大偏差正好等于 weight 的最大值 10.0。不报错、不 NaN，同一提交在不同流水线上一会儿过一会儿败，容易被当成 CI 抖动。
  trigger_surface: 空 input + 全 0 offsets + per_sample_weights 的 EmbeddingBag 前向；bf16/fp16/fp32 三种 dtype 均复现
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
