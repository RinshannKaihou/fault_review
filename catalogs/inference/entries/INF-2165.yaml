title: vLLM hadacore 奇数行错值污染 INT4 KV
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: vllm
    component: hadacore_transform
  behavior: 量化前 K/V 经 hadacore_transform 旋转，行数（token×KV head）为奇数时该 kernel 结果有时错误，越读未映射内存时崩溃。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: 奇数行时变换值出现 ~1e36 量级相对误差（垃圾 K/V 写入 INT4 KV cache，推理输出错），或间歇 illegal memory access 崩引擎；1-4352 全扫 1101 个奇数 N 错。
  visibility: 静默错误
mitigation:
  detect: 对 single_rht 输出与 float64 参考逐元素比对（奇数行探针）
  fix: 待定
