original:
  mechanism: 触发链：SimpleCPUOffloadConnector 的 CPU store 在途给共享头块 +1 引用 → 15/16 请求持有的块看似全体持有（含无共享的 O）→ V1 cascade attention 的 num_common_prefix_blocks=[128] 把 O 计入 → O 用第一请求的 KV 块解码自己的后续 token。五臂隔离：关 cascade 0/12；去 connector 0/60；V2 runner（代码层恒 common_prefix_len=0，未运行）不触发。cascade 自身条件（≥8 请求、各 ≥256 computed tokens）叠加 store 1-2 步窗口，触发率随时序：O 晚 5ms 15/18；晚 80-120ms 0/12；同时发 1/30。实测 FLASH_ATTN 后端、Qwen3-0.6B、16 请求（S1..S15 共享 2048-token 头 + 400-token 无共享 O、同 cache_salt、nonce 防跨试验残留）。O 的输出含他人共享头特有短语（"is red"），贪心 token 2-3 处 solo top1-top2 差 9.56-12.94 nats。
  source: 'vLLM #61673（2026-10-14 open，含 repro.py、五臂隔离与时序矩阵）。https://github.com/vllm-project/vllm/issues/61673'
  behavior: 无错误正常 200——无共享请求被用他人 KV 解码，输出内容为他人上下文的复述/混杂。
  trigger_surface: V1 + cascade attention 开启 + SimpleCPUOffloadConnector + 共享前缀批 + store 在途时序相交
