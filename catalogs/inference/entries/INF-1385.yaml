  behavior: SimpleCPUOffloadConnector 的 CPU store 在途给共享头块 +1 引用：15/16 请求持有的块看似全体持有（含无共享的 O）。V1 cascade 据此把 O 计入公共前缀，O 被用第一请求的 KV 解码。
effect:
  objects:
  - 跨请求/跨样本数据
  - 输出内容
