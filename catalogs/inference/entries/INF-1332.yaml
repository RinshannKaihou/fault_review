  mechanism: ShadowKV 在预填充阶段用 SVD 固定一组低秩键基；解码阶段新产生的键仍通过这组**过期的**基做投影，产生重建误差。误差进一步导致 landmark top-k 误选，从 CPU 取回错误的 value，并随生成过程累积。
  source: arXiv:2410.21465。
  behavior: 生成越长质量越差，前几十个 token 正常，长回答后段逐渐跑偏。
  trigger_surface: 非 vLLM 一等实现
  signature: 低秩近似是模型能吸收的"温和错"，隐状态大体仍在流形上（model_on），只是缓慢漂移。关键签名是**重建的解码 K 残差与预填充子空间正交**——spectral（残差在主子空间外的能量占比）是唯一直接可见的族；geometric 的整体余弦漂移温和、易被噪声底淹没，statistical 基本漏检。trajectory 的累积漂移曲线可作为辅证。
  repro: partial——prefill 时对该层 K 做 SVD 取秩 r 的基并冻结，解码时把新 K 投影到该冻结基再投回（`K ← U_r U_r^T K`），复现过期基的重建误差累积；landmark top-k 与 CPU value 取回不复现。
  locus: eviction-compression
  priority: medium
