original:
  mechanism: vLLM 0.30.0（vllm/vllm-openai:v0.30.0），8×H100/H200，FLASH_ATTN（FA3，vllm-project/flash-attention@506341a）。--compilation-config.cudagraph_mode=FULL 时部分回放捕获图的 step 返回错误 logits：误差数个 nat、argmax 不同、有时正确 token 掉出 top-20。报告者判定 combine kernel 的 tile scheduler 由捕获时的 dummy batch 决定而非实际回放批。两个触发器：A. prefix-cache 命中后恰好 2 个新 token（任意 max_num_seqs）；B. 小 max_num_seqs（≤16，部分 64 大图）普通 prefill 混合批回放。Qwen3-8B 网格 6 prompts×缓存长度 64/128/176×q=1..32 中 q=2 在 17 点中 11 点错、误差≥3 nat；其余 q 在 bf16 噪声内（≤0.19）。默认 FULL_AND_PIECEWISE 与 FlashInfer 不受影响。flash_attn_max_num_splits_for_cuda_graph=1（关图内 split-KV）修复。
  source: 2026-10-20 每日扫描；https://github.com/vllm-project/vllm/issues/62626
  behavior: 服务开启 FULL CUDA graph 与 FA3 时，命中前缀缓存后只有 2 个新 token 的请求（或小批 mixed prefill 回放）会拿到明显错误的 logits：贪心解码换 token、logprob 偏差达数个 nat，正确答案可能掉出 top-20；换成默认编译模式或限制图内 split 数后恢复正确。用户侧看到的是同样请求在不同图回放配置下答案不一致，且无任何报错。
  trigger_surface: cudagraph_mode=FULL + FA3 + split-KV（默认 max_num_splits=32）；prefix 命中 q=2 或 max_num_seqs≤16
  discovery: 2026-10-20 每日扫描
