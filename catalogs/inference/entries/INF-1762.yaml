id: INF-1762
legacy_ids: []
slug: vllm_full_graph_fa3_split_kv_wrong_logits
aliases: []
title: vLLM FULL 图+FA3 split-KV 回放步 logits 大错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: FULL graph 回放与 FA3 combin
  behavior: combine kernel 的 tile scheduler 按图捕获时的 dummy batch 选择，而非按实际回放批形状选择
effect:
  objects:
  - 输出分布
  detail: FULL 图回放部分步 logits 错数个 nat、argmax 改变；触发 A：prefix 命中恰好 2 个新 token；触发 B：max_num_seqs≤16 的混合批；关 split-KV 或 FULL_AND_PIECEWISE 正常
  visibility: 静默错误
mitigation:
  detect: 对 FULL 图回放步比对 eager logprobs 可发现；现无内置检测
  fix: 规避：--attention-config.flash_attn_max_num_splits_for_cuda_graph=1（默认 32，图内关 split-KV）；修复 PR 未见（待定）
