original:
  mechanism: aclnnTril 在 self dtype 为 uint32 或 int64 时两段接口都返回 0，但输出约一半元素完全没有被写、已写部分掩码也错。4×4、diagonal=0、输入 ramp [0..15]、out 调前预填 0xc0 0x7f 重复模式（识别未写）：uint32 上板输出 [0,0,2,0,4,5,6,7, 2143322048×8]，期望 [0,0,0,0,4,5,0,0,8,9,10,0,12,13,14,15]，11/16 不等、8/16 未写；int64 [0,0,2,0,4,5,6,7, 9205498103099064256×8]，11/16、8/16。2143322048=0x7FC07FC0、9205498103099064256=0x7FC07FC07FC07FC0 为预填值原样保留，证明后 8 元素一个字节未写。同宽度对照全部 0/16 正确：fp32、int32、uint64——同为 4 字节 int32 正确 uint32 错、同为 8 字节 uint64 正确 int64 错，排除宽度搬运单一解释，指向按元素字节宽度的模板分派条目错配。未写元素数恒为 ceil(n/2)：3×3 4/9、4×4 8/16、8×8 32/64、4×8 16/32；去掉预填仍错（4×4 10/16）与预填无关。环境：Atlas 800T A2（910B2）、CANN 9.2.0、纯 C 两段式直调。
  source: https://gitcode.com/cann/ops-math/issues/3747（open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 调 aclnnTril 传 uint32 或 int64 张量：接口返回成功，但拿到的是调用方缓冲区残留——约一半元素（恒为 ceil(n/2)）根本没写、写过的部分下三角掩码也是错的；换成 int32/uint64/fp32 同样调用完全正确。下游若不预填输出缓冲会直接消费到未定义数据且无任何报错。
  trigger_surface: Atlas A2（910B2）、CANN 9.2.0、aclnnTril（conversion/tril 已发布路径）、uint32/int64 dtype。
