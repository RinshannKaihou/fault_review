original:
  mechanism: tt-metal ttnn.max/ttnn.min 对 bfloat8_b 输入在最后一维不是 16 的倍数时返回错误值：隐式 tile padding 在归约前填 -inf/+inf，而 bfloat8_b 是 block float——16 个值共享一个指数字节，当最后的真实值与 padding 共享同一个块时，真实值丢失尾数，归约输出 0 或偏小值。实测（Wormhole n150，tt-metal 6d09c4bc52/a55587f68）：[1,1,1,1] 全 6.1875 的 max 返回 0（torch 给 6.1875）；[2,3,37,45] max(dim=-1) 222 个输出 56 个错（首错 6.625 vs 7.8125）、max(dim=-2) 270 中 78 个错、min(dim=-1) 71 个错。所有 dim 均可触发，always 频率。
  source: 2026-10-23 每日扫描 https://github.com/tenstorrent/tt-metal/issues/61905（open）
  behavior: bfloat8_b 张量最后一维不是 16 的倍数时做 ttnn.max/ttnn.min（任意 dim），部分输出静默变 0 或明显偏小：单元素张量 [1,1,1,1]=6.1875 的 max 直接返回 0。与 torch 对 bfloat8_b 舍入后输入的归约结果不一致，无任何报错，always 复现。
  trigger_surface: tt-metal 6d09c4bc52（Wormhole n150，KMD 2.3.0/FW 19.11.0.0）；bfloat8_b + TILE 布局；最后一维非 16 倍数；ttnn.max/ttnn.min 任意 dim。
  discovery: 2026-10-23 每日扫描
