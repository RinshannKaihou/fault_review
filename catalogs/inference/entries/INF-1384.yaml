  behavior: 变长序列+causal mask 下，batch 内最大 seq_len ≥4 倍最小时 mask 定位错位：长序列样本前 1/4 之后部分未来 token 注意力权重非 0；倍率差 <3 不触发，关 causal mask 完全正确。
