  visibility: 静默错误
mitigation:
  detect: 变长 batch 与手工标准 causal attention 对照（报告含 [128,512,1024,2048] 复现组合）
  fix: 待定（open；报告要求修 mask 定位并补变长单测、文档注明支持范围）
