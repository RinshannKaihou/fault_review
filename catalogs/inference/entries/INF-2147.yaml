title: vLLM Hermes 流式解析器遇正文 tool_call 字面量丢弃后续
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: hermes_tool_parser 流式状态机
  behavior: 流式分支把正文中出现的字面 <tool_call> 标记当作调用开始，之后所有文本进入缓冲不再作为 content 下发；非流式分支不受影响
effect:
  objects:
  - 输出内容
  detail: stream=true 时 <tool_call> 字面量之后的文本（如 "' tag opens a call. Done.'"）从不到达客户端，且不产生任何 tool_calls；非流式完整返回
  visibility: 静默错误
