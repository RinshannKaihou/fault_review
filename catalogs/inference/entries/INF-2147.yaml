original:
  mechanism: 'vLLM --tool-call-parser hermes 在 stream=true 时，模型在普通叙述文本中引用字面 <tool_call> 标记（例如解释/演示工具调用格式时）会触发流式增量状态机把其后全部文本吞进工具调用缓冲：既不产生 tool_calls，也不再输出 content。非流式路径把完整文本作为 content 返回，两条路径结果不一致。报告给出 CPU-only 解析器级复现：输入 "The literal <tool_call> tag opens a call. Done."，非流式返回全文，流式只返回 "The literal "，其余文本从未到达客户端。该文本经 tokenizer round-trip 可原样出现，即真实模型输出可达。vLLM main 2d40c0609f（2026-10-23）；hermes_tool_parser.py 自 2026-10-10 #60522 移动以来未改。'
  source: 2026-10-23 每日扫描 https://github.com/vllm-project/vllm/issues/63309（open，解析器级 CPU 复现）
  behavior: 用 --tool-call-parser hermes + stream=true 服务时，模型输出里只要在正文引用一次 <tool_call> 字面标签，其后所有内容在客户端凭空消失——content 截断在该标记处，且没有任何 tool_calls 生成，也无报错。同一输出非流式请求能完整拿到。
  trigger_surface: vLLM main（2d40c0609f）；--tool-call-parser hermes + stream=true；模型在正文中输出字面 <tool_call>（讲解/演示工具格式时常见）。
  discovery: 2026-10-23 每日扫描
