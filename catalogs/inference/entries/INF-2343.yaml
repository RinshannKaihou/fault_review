title: vLLM tied 配置下静默丢弃 .bin 独立 lm_head 权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: vllm
    component: .bin loader tied 处理
  behavior: config.json 声明 tie_word_embeddings=true 而 .bin 物理存有数值独立 lm_head.weight 时，加载器静默丢弃该权重，lm_head 与 embedding 共享存储算 logits。
effect:
  objects:
  - 模型权重
  - 输出内容
  detail: 复现（Qwen3ForCausalLM+.bin 双进程对照）：目标与 untied 对照的 head 哈希、logits/softmax SHA、argmax 全不同（63 vs 0）；检查点两张量 SHA-256 各异数值独立。服务正常出话但语义错乱。
  visibility: 静默错误
mitigation:
  detect: 加载后对 lm_head.weight 与 embed_tokens.weight 做 data_ptr/哈希比对；tied 配置但检查点含独立 lm_head.weight 时告警。
  fix: 待定（issue open 2026-10-30，vLLM 0.32.0；未见修复 PR）
