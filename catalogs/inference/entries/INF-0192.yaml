  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`log_bw/log2_bw/log10_bw` 把 `+0.0` 与 `−0.0` 同等对待：`x=−0.0` 返回 `+inf*sign(grad)` 而 torch 返回 `−inf*sign(grad)`——**极点无穷符号相反**；`polygamma_bw` 用硬编码 n 列表（2/4/6/8/10）而非 n 的奇偶性选无穷符号——n=0 与任意偶 n≥12 符号反转。组合级缺陷：用数学理想的原语也能复现，与 SFPU 内核精度无关） · Cov: `var:ttmetal_xlogy_bw_addcdiv_bw_constant_sign_infinity_zero_divisor`（1.153 零除数符号族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: log 族在极点处 `Tensor t_inf = where(ltz(grad), ...)` 硬编码单一符号，未区分 ±0.0 的符号位；polygamma 的符号选择表只枚举 2..10，超出列表的偶数落回默认分支。自家 `digamma_bw`（即 n=0 情形）处理正确，同文件内实现分歧。
  source: 'tt-metal #55931（2026-09-09 closed，$500 bounty，含与 torch 的逐点对照与 parity 分析；与 #55354 零除数符号对齐同类）。https://github.com/tenstorrent/tt-metal/issues/55931'
  behavior: 无 crash——极点/有符号零输入的 backward 梯度得到**错误符号的无穷**，下游 NaN/方向反转。1.153（xlogy_bw/addcdiv_bw 常量符号无穷）之后零除数/极点符号族第二组：本条扩展到 log 族 ±0.0 与 polygamma 枚举表维度。
  trigger_surface: tt-metal unary backward + x=±0.0 极点或 polygamma n=0/偶 n≥12（hw_specific）
  discovery: 2026-09-09 每日扫描。
