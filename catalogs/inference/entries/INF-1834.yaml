slug: vllm_ascend_kv_offload_copy_thread_dies_silently
aliases: []
title: KV offload 拷贝线程遇异常即静默死亡致后续传输停摆
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: NPUDmaCopyBackend
  behavior: copy_backend.py:103-124 的 _copy_loop 在 daemon 线程里无异常处理；copy_blocks、wait_event 或解包抛异常即线程退出，append 不执行。
effect:
  objects:
  - 可用性/进度
  - KV状态
  detail: 之后所有 offload/load 传输都无人处理：等待该 event 的请求挂住或读到未完成的搬移结果，offload 静默失效而服务不报错。
  visibility: 挂起
mitigation:
  detect: 监控 _copy_loop 线程存活与队列积压；对 events_list 中未完成 event 计数。
  fix: 待定（issue 2026-10-06 open）：循环体内加 try/except 并把异常上报，勿让线程静默退出。
