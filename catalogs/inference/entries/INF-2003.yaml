id: INF-2003
legacy_ids: []
slug: ops_math_masked_fill_ut_bf16_bitpattern
aliases: []
title: MaskedFill kernel UT BF16 造数与解码错位模式
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: masked_fill UT 数据脚本
  behavior: gen_data.py 把 1..N 当 uint16 位模式写入、标量取 float32 低 16 位，compare_data.py 用 uint16.view(float32) 合并两个 BF16，造数与比对都不按 16 位格式
effect:
  objects:
  - 测试判定
  detail: value=5.0 被写成 0 而非 BF16 0x40a0；golden=[1,2] 对 output=[8,2] 实测打印 PASSED；反过来 3 个合法 BF16 元素因字节数不能整除 4 抛 ValueError，真实错误反而不过
  visibility: 静默错误
mitigation:
  detect: 用 gen_data.py 生成 bfloat16 数据后按 uint16 读回，核对 value 位模式是否为 0x40a0；再造 golden=[1,2]、output=[8,2] 两个合法 BF16 文件看 compare_data.py 是否 PASSED
  fix: issue 给修复方向（float32 高 16 位 + 最近偶数舍入编码，比较前逐个扩展）；作者称修复后 4 个 host 回归全通过，正文未给 PR 号
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: 与 INF-1761（compare_data 用 zip 比对漏检多余输出）同属 compare_data 脚本族，但机制不同：本条是 BF16 位模式契约，不是文件列表截断。
evidence:
- url: https://gitcode.com/cann/ops-math/issues/3406
  kind: gitcode_issue
relations: []
original:
  mechanism: cann/ops-math issue 3406（2026-10-06，open）：experimental/math/masked_fill/tests/ut/op_kernel/masked_fill_data 的 BF16 造数/比对未遵守 16 位存储格式。gen_data.py 把整数序列 1..N 当 uint16 位模式写入（实际是 BF16 的微小次正规数），标量 value 取 float32 的低 16 位，5.0（0x40a00000）被写成 0 而非 0x40a0，golden 用同一错误位模式；compare_data.py 用 uint16_array.view(float32) 把两个相邻 BF16 当一个 float32，于是 golden=[1,2]、output=[8,2] 会打印 PASSED，而 3 个合法 BF16 元素因字节数无法整除 4 抛 ValueError。上游 master 2e7db18fc0e389e2979e8caa94e5769c66e7d575，Python 3.12.14 / NumPy 2.3.5 / PyTorch 2.14.1 CPU；本轮未跑 CANN Kernel UT，用真实 CPU PyTorch 写合法 BF16 文件复现比对路径。
  source: 2026-10-06 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3406 （open）
  behavior: MaskedFill 的 kernel UT 会给出双重错误判定：数值完全错误的输出被判 PASSED，而数值正确的奇数长度用例反而抛 ValueError 报红；看板的绿并不代表 mask 计算正确，5.0 这类标量边界值在造数阶段就已经丢了。
  trigger_surface: masked_fill kernel UT + bfloat16 造数/比对脚本
  discovery: 2026-10-21 系统扫描 sweep_5（顺序深读）
