id: INF-1965
legacy_ids: []
slug: npu_profiler_kernel_details_missing_step_id
aliases: []
title: profiler kernel_details.csv 静默缺 Step Id
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: torch_npu
    component: profiler step_range 生成
  behavior: get_step_range() 依赖 ProfilerStep 节点与 corr_id；节点缺失或不完整时返回空/截断 range，KernelViewParser 仅在 range 非空时写 Step Id 列。
effect:
  objects:
  - 指标/日志
  detail: 部分 run 的 kernel_details.csv 完全没有 Step Id 表头，或有表头但大量 kernel 行 Step Id 为空，下游无法按 step 统计 kernel 时间。
  visibility: 静默错误
mitigation:
  detect: 同配置多次采集，检查 kernel_details.csv 是否有 Step Id 表头以及空值比例；对照 ProfilerStep event 与 corr_id 是否齐全
  fix: 待定（issue open，未给修复 PR；报告要求 profiler 在 ProfilerStep/relation 损坏时明确报错而不是静默导出缺列 CSV）
labels:
  stage: N/A
  confidence: documented
