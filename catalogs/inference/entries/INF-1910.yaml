original:
  mechanism: 'msmodelslim/ir/rms_norm.py 第 47 行的实现是 return (self.weight * hidden_states).to(torch.float32)，即无论权重和输入的 dtype，输出都被强制转成 fp32。最小复现：norm = RMSNorm(8).to(torch.bfloat16)、linear = nn.Linear(8, 4, dtype=torch.bfloat16)、x = torch.randn(2, 8, dtype=torch.bfloat16)，norm(x).dtype 实际是 torch.float32，接着 linear(norm(x)) 报 RuntimeError: mat1 and mat2 must have the same dtype, but got Float and BFloat16。参考实现 transformers 的 T5LayerNorm 直接 return self.weight * hidden_states，不做强制提升，所以同结构模型在 HF/PTA 链路不会出现该问题。影响面是 CPU 推理/量化冒烟场景：iter_smooth 过程的 hook 链路会把 fp32 输出喂给下一层 bf16 Linear，整条量化流程在 CPU 上跑不起来；NPU 链路未观察到该现象。修复建议即去掉末尾的 .to(torch.float32)。'
  source: '2026 GitCode Ascend/msmodelslim issue #565 https://gitcode.com/Ascend/msmodelslim/issues/565（closed；msmodelslim commit 984b390e，Ubuntu 22.04 aarch64 + py3.12）'
  behavior: 在 CPU 上跑量化冒烟或 iter_smooth 之类的 hook 流程时，走到 RMSNorm 之后的 Linear 就报 mat1 and mat2 must have the same dtype, but got Float and BFloat16；单独测 RMSNorm 会发现模型和输入都是 bf16、输出却是 float32。同样的模型在 NPU 上量化正常，只有 CPU 链路挂。
  trigger_surface: msmodelslim IR RMSNorm + bf16 模型 + CPU 链路（量化冒烟/iter_smooth hook）；NPU 链路不复现
  discovery: 2026-10-21 GitCode 历史 issue 扫描（mindspore/ms* 簇）
