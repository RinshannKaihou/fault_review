slug: msmodelslim_ir_rmsnorm_forced_fp32_output
aliases: []
title: IR RMSNorm 无条件把输出转 fp32 破 bf16 链路
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: ir.rms_norm 输出
  behavior: ir/rms_norm.py 末尾对 weight*hidden_states 无条件 .to(torch.float32)，权重与输入都是 bf16 时输出仍变 fp32，与 T5LayerNorm 参考实现不一致
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: RMSNorm(8).to(bf16) 后 norm(x).dtype 为 float32，接 nn.Linear(bf16) 报 mat1 and mat2 must have the same dtype；CPU 链路（iter_smooth hook）整条量化流程跑不起来
  visibility: 报错
mitigation:
  detect: 逐层打印 IR 模块输出的 dtype；CPU 链路报 dtype mismatch 时先看 RMSNorm/LayerNorm 类是否强制 fp32
  fix: issue 建议删掉末尾 .to(torch.float32)、与 T5LayerNorm 对齐；未见 PR（issue 已关闭，未核实）
