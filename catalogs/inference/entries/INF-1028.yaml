original:
  category: cat11
  section: 第 11 类 · 解码 / 采样故障（多为 post-forward — 结构性盲点）
  meta: '`model_on` · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: '`StopStringCriteria` 只检查新生成的那个 token 是否恰好在 token 边界上**完成**一个 stop string；在 byte-level BPE 上，多字节 / CJK 的 stop string 会被切散到若干 byte-fragment token 中，匹配器因此永远看不到它。'
  source: 'HF transformers #46519 (Qwen2.5)；#31435、#34843、#34571。'
  behavior: 生成越过了本应停止的位置，继续追加多余文本。
  trigger_surface: 采样参数/解码策略 API
  signature: '**没有任何隐藏态签名**——这是纯粹的控制流 / 解码循环故障。对 token 流做 trajectory/statistical 度量（EOS 邻近度、答案之后是否仍在续写）可以抓到；隐藏态度量一概不行。与 11.1、11.2、11.4、11.5、11.6 一起构成本项目 post-forward 的结构性盲区。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）'
  repro: 通过配置一个会跨 byte-fragment 切分的多字节 stop string（如中文停止串）即可复现，属于纯解码层配置注入。
