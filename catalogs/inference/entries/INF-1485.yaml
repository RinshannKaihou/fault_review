  behavior: npu_add_rms_norm 把残差加与 RMSNorm 放在同一融合算子内完成；与先 x+residual 再 npu_rms_norm 的分离路径相比归一化结果数值不一致。
effect:
  objects:
  - 数值结果
  detail: bf16、(4,4096)、eps=1e-6：残差加逐位一致，RMSNorm 输出 max abs 3.125e-2、max rel 7.8e-3，torch.equal 为 False。
  visibility: 静默错误
mitigation:
  detect: 同一组 x/residual/weight 分别走融合与分离路径，比对 y 与 rstd 的 max abs/rel diff 及 torch.equal
  fix: 待定（issue open，正文未给修复 PR）
