id: INF-2077
legacy_ids: []
slug: vllm_ascend_camem_allocator_gil_and_ref_leaks
aliases: []
title: camem_allocator 错误路径漏 GIL 释放与引用致挂死泄漏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: vllm
    component: camem_allocator C 接口
  behavior: my_free 两处 early return 都没 PyGILState_Release，也不 Py_DECREF py_ptr/py_result；my_malloc 不查 malloc 返回即把空指针交 create_and_map。
effect:
  objects:
  - 可用性/进度
  - 性能/资源
  detail: 错误路径走到后线程 GIL 计数失衡、后续 Python 调用卡在 Py_END_ALLOW_THREADS；每次 free 漏两个 PyObject 使解释器堆单调增长；NPU 压力下 malloc 返 NULL 时直接 SIGSEGV 无 traceback。
  visibility: 挂起
mitigation:
  detect: 长跑压测观察 RSS 与解释器堆是否单调增长；对 my_free 注入返回形状错误的回调，看线程是否卡在 GIL；用 malloc 失败注入验证 my_malloc 路径
  fix: issue 附带的 companion PR 修 N-1/N-2/N-3（补 PyGILState_Release、Py_DECREF、malloc 判空）；N-4 的 p_memHandle 归属需维护者先定契约（open）
