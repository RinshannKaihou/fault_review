original:
  mechanism: vllm-ascend csrc/camem_allocator.cpp 把 my_malloc/my_free 作为 NPU 内存池的 C 层原语，两者都在热分配/释放路径上调用 CPython C-API。my_free 在 PyGILState_Ensure 之后，若 g_python_free_callback 返回的不是 4 元组（PyTuple_Size != 4）或 PyArg_ParseTuple 失败就直接 return，两处 early return 都没有 PyGILState_Release；整个函数也没有对 PyLong_FromUnsignedLongLong 与 PyObject_CallFunctionObjArgs 的返回值做 Py_DECREF（同文件 my_malloc 在 L182 有正确 DECREF）。my_malloc 在 L165 对 malloc(sizeof(aclrtDrvMemHandle)) 不判空，随后把 p_memHandle 交给 create_and_map 解引用，NPU 压力下 malloc 返回 NULL 时表现为无 traceback 的 SIGSEGV。N-4（py_result 为空时 p_memHandle 是否应 free）issue 留给维护者定契约，companion PR 未动。
  source: 2026-05-19 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/9306 （open）
  behavior: 长时间推理/训练跑着跑着 RSS 持续上涨，最终 OOM；一旦 Python 侧 free 回调返回的形状不对（上游回调改动后很容易发生），线程会卡在后续 Python 调用里，栈停在 Py_END_ALLOW_THREADS 附近，看起来像随机死锁；NPU 显存紧张时还会直接 segfault，没有 Python 栈可看。
  trigger_surface: vllm-ascend 使用 camem_allocator 的 NPU 内存池；每次 my_free/my_malloc 调用，错误路径需回调返回非 4 元组或 malloc 失败
  discovery: 2026-10-21 第三轮顺序扫描（tail_2，issue created < 2026-10-07）
