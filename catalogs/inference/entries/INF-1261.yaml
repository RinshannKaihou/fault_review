  trigger_surface: 需要 P/D 分离或跨节点/RDMA 拓扑（默认实验室单机不具备）
  signature: off-manifold（infra_off）的值损坏，局限于被覆写的那个 block；本质上退化为块粒度的 `kv_corrupt`，因此可以直接沿用已实现的 `kv_corrupt` 检测路径。捕获者：geometric、trajectory、cheap（recompute-oracle 轴，同 8.85 `kv_corrupt` 的重算对照）。漏检者：若覆写内容恰好是另一段合法 KV，则幅度类 statistical 判据可能通过；只有块粒度的参考比对稳定可见。
  repro: 直接复用已实现的 `kv_corrupt`（`make_kv_corrupt(L, j, mode, seed)`），把作用范围从单位置扩展为一个连续 block，模拟「一整块被事后覆写」。
