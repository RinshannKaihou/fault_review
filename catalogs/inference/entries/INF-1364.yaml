original:
  mechanism: SGLang PD prefill 服务器开启 HiCache 且默认早发缓存前缀（SGLANG_DISAGG_PREFILL_EARLY_SEND_CACHED_PREFIX=1）时：第一个请求排队 HiCache load-back，commit_load_back 立即把新 device 页挂到 radix 节点，而 H2D 拷贝只是入队（unified_radix_cache.py L1800–L1823）；同 prefill 批内第二个请求被重匹配到这些页为 device 前缀（host_hit_length=0）；maybe_send_cached_prefix_chunk 在 forward 之前把这些页发往 decode 侧，此时 H2D 仍在写入（prefill.py L1415–L1450），且该区间此后不再重发。结果 decode 侧对部分前缀消费陈旧 KV。实验（GB300 单节点 1P1D、NIXL、Qwen3-4B-Instruct-2507、两条相同 100K-token prompt 同发）：2026-09-14 nightly + direct I/O 39/40 损坏、kernel I/O 29/30；2026-09-23 nightly + --disaggregation-enable-kv-checksum 29/30 且每一次都打出 KV checksum mismatch；关早发 0/84、第二条请求等第一条完成后再发 0/18。main 存在同一代码路径但未实测。报告者给出候选修复：批内 hicache_consumer_index>=0 时跳过早发，或 KV 传输等待 load-back 的 finish event。
  source: SGLang issue https://github.com/sgl-project/sglang/issues/44070（2026-10-13 open，3 评论；含完整复现命令与三臂对照计数）
  behavior: 静默：请求正常完成、无错误日志（开 checksum 时有 mismatch 标记），decode 端收到的部分前缀 KV 为 H2D 写入途中的陈旧数据，当所需上下文落在重载区间内时答案改变；损坏率高（29/30–39/40）
  trigger_surface: SGLang PD prefill + HiCache + 早发缓存前缀默认开启 + 共享 host-only 前缀的两个请求同批 prefill；GB300/NIXL 实测，2026-09 nightly 镜像
  discovery: 2026-10-13 每日扫描
  notes:
  - '2026-10-14 回访 2026-10-14：sglang#44070 3 条新评论——社区认领（Vegetog 计划 skip hicache_consumer_index>=0 批次早发，未复现原始竞态）；报告者 agent 已提交修复 PR #44081。判定不变，修复在途。'
