title: SGLang PD prefill 早发前缀在 H2D 回载完成前送出陈旧 KV
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: sglang
    component: 早发前缀×load-back 竞态
  behavior: commit_load_back 在 H2D 拷贝仅入队时就把新 device 页挂上 radix 节点，早发路径把同批第二个请求重匹配到这些页并在拷贝仍在写时先行发送该区间且不再重发
effect:
  objects:
  - KV状态
  - 输出内容
  detail: decode 端静默收到部分前缀的陈旧 KV，答案随重载区间内上下文改变；GB300 1P1D NIXL Qwen3-4B 双 100K 同前缀请求 39/40（direct）、29/30（kernel）、29/30（+checksum，全部被 KV checksum mismatch 标记）损坏
  visibility: 静默错误
mitigation:
  detect: 待定（--disaggregation-enable-kv-checksum 可标记每次损坏，但默认不拦截）
  fix: 规避：SGLANG_DISAGG_PREFILL_EARLY_SEND_CACHED_PREFIX=0（0/84）；候选修复（issue 内提议，未实现）：批内排队过 load-back 时跳过早发（batch.hicache_consumer_index>=0）或让 KV 传输等待 load-back finish event
