  meta: '`infra_off`（`ttnn.repeat_bw` 三类输入全失败而 forward `ttnn.repeat` 位精确：(a) 末两维非 32 倍数 → `TT_FATAL` abort（forward 同张量正确）；(b) dim-2/dim-3 重复 → **静默返回空梯度列表 `[]`**（无异常无警告，全 tile 对齐输入也复现）；(c) 重复维 extent>1 → **整轴求和**返回错误形状梯度（(1,3,32,32) sizes=[1,2,1,1] 得 (1,1,32,32)，torch 应为 (1,3,32,32)）） · Cov: `var:ttmetal_concat_s2s_absolute_dim_rank_confusion_silent_wrong_data`（1.132 维度语义混淆族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`unary_backward.cpp#L1590-L1640` 取 `shape_wh` 后走 `moreh_sum` 路径：tile 对齐假设（a）、dim-2/3 分支漏返回（b）、 tiled-block 求和被写成整轴求和（c）——backward 重写一套与 forward 不共享语义的实现。'
  source: 'tt-metal #55799（2026-09-08 open，bug label，含三类输入最小对照与 torch 位精确基线）。https://github.com/tenstorrent/tt-metal/issues/55799'
