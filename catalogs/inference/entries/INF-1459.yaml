  kind: github_issue
relations: []
original:
  mechanism: 'vLLM issue #62283（c2026-10-18，4×H200，nightly 0.32.0rc1.dev100，Llama-3.2-1B + OffloadingConnector/TieringOffloadingSpec，p2p 与 fs tier）：两个不同 TP 的引擎共享 secondary tier 且 canonical_layout 关闭（默认）时，读引擎可加载另一引擎写的 KV 并静默输出错误，无报错无警告不重算。机制：对 V1 model runner 的 head-sharded full-attention 组，build_offloading_config（vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py ~L179）把 direct 布局标 is_parallelism_agnostic；FS/OBJ/P2P manager 以 parallel_agnostic=True 建 namespace（vllm/v1/kv_offload/file_mapper.py）丢弃 TP；但 direct 布局 CPU chunk 是每个 worker 的页并排，不是 per-layer head 交织数据——同一 block hash 映射到不同 TP 下含义不同的字节，跨 TP 读者当作自己的加载。实测：P2P TP1 prefiller→TP2 decoder gsm8k 0.332→0.0 全乱码；FS tier TP1 写→TP2 读同 root_dir：3072 命中同 namespace hash、0/4 输出匹配；TP1→TP1 对照正确；V2 runner 安全仅因门控要求 not use_v2_model_runner（指纹不匹配 0 传输重算）；canonical_layout=True 时 TP1↔TP2 双向正确（0.340/0.343，5120/5120 tokens）且 MLA（DeepSeek-V2-Lite）同正确。缺陷在 direct 布局的可移植性声明本身，被所有 secondary tier 共享。修复：#55191 从共享门控移除 direct 豁免。'
  source: 2026-10-18 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/62283 （open）
  behavior: 多个不同 TP 并行度的推理引擎共用一个 KV 卸载存储（文件/对象/P2P 层）时，一个引擎会把另一个引擎写入的 KV 当作自己的缓存命中加载，输出立即变成乱码、任务准确率归零；同 TP 的引擎间共享正常，V2 引擎会安全跳过。整个过程没有任何报错。
  trigger_surface: OffloadingConnector + TieringOffloadingSpec（p2p/fs/obj）+ 跨 TP 引擎共享 tier + canonical_layout=False（默认）；V1 model runner；nightly 0.32.0rc1.dev100
  discovery: 2026-10-19 每日扫描
