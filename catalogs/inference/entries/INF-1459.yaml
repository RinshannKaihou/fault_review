id: INF-1459
legacy_ids: []
slug: vllm_kv_offload_direct_layout_tp_namespace_cross_corruption
aliases: []
title: vLLM KV offload 跨 TP 共享 tier 加载坏 KV
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: direct 布局 namespace 丢 TP
  behavior: direct 布局被标 is_parallelism_agnostic，namespace 丢 TP 维度；但该布局字节是各 worker 页并排，同一 block hash 跨 TP 含义不同，跨 TP 读者错装 KV。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 不同 TP 引擎共享 fs/obj/p2p tier 时读入对方 KV 静默输出乱码：TP1→TP2 gsm8k 0.332→0.0；FS tier 0/4 输出匹配；同 TP 与 canonical_layout=True 正确；V2 有指纹门控安全
  visibility: 静默错误
mitigation:
  detect: 共享 tier 的跨 TP 引擎跑已知答案任务对照（gsm8k 等）；检查 namespace hash 是否含 TP
  fix: 修复 PR vllm#55191（移除 offloading/config.py direct 布局豁免，issue open 状态未核实合入）；规避：canonical_layout=True（实测 TP1↔TP2 双向 0.340/0.343 正确）
