title: AttentionWorkerCombine 清零每核末行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: attention_worker_combine
  behavior: needSchedule=1 路径在每核分配 token 数×(K+1)×4 字节超过 outQue 的 UB 容量时，把该核处理区间的最后一行 token 输出整行写成 0，未按 y 的累加定义收尾。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: A2 910B2、R=1024/K=64/H=64：47 行（21,43,…,1023，每核 22 行区间末行）整行 0；R=4096 时 48 行；A3 910_93 时 40 行；同数据 needSchedule=0 位级一致；K=8 无异常；输出尾部 4KB 哨兵未被改写。
  visibility: 静默错误
mitigation:
  detect: 对同一份 token_data/expertScales 分别跑 needSchedule=1 与 0，按行比对 y；重点检查行号是否为每核区间的最后一行，并用 0xA5 哨兵确认不是越界写。
  fix: 待定（issue open，无修复 PR，未核实）
