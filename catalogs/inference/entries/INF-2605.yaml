original:
  mechanism: ops-transformer 的 attention/attention_worker_combine 中，needSchedule=1 只应增加「等待 token_info_buf 的 R*(K+1) 个就绪 flag 全 1 并消费」的同步语义（attention_worker_combine_split_bs.h:92-100,190-205），不改变 y[i,h]=sum_{k=0}^{K-1} expertScales[i,k]*token_data[i,k,h]+token_data[i,K,h] 的数值定义。但在每核分到的 token 数×(K+1)×4 字节超过 outQue 的 UB 张量容量时，kernel 把该核区间最后一行整行写成 0：A2 910B2 / CANN 9.2.0 上 R=1024,K=64,H=64 有 47 行（21,43,65,…,1011,1023）、R=4096 有 48 行、R=512 有 1 行；R=1012/1016/1024/1036/1056 均为每核末行；H=512 同样；A3 910_93 / CANN 9.3.0.P009 上 R=1024 有 40 行。对照组仅把 needSchedule 从 1 改成 0，同 shape 同数据 0 行异常、max_ulp=0、exact=100%；K=8 时 0 行异常。输出缓冲尾部 4KB 的 0xA5 哨兵未被改写（guard_dirty=0），说明不是写越界到 y 之外，而是核内对末行漏做累加写回。
  source: https://gitcode.com/cann/ops-transformer/issues/8830（open，2026-11-26，含 A2/A3 多 shape 实测与哨兵验证）
  behavior: 开启 needSchedule 的 AttentionWorkerCombine（MoE/专家并行 attention 的 combine 阶段）在 token 数达到 1024/4096 这类常规批时，每个 AI core 负责区间的最后一行输出会变成整行 0：R=1024 时有 47 行、R=4096 时有 48 行的 token 贡献被清零，其余行完全正确，两段接口返回 0、没有告警。因为只有每核末行受影响，整体输出看起来仍有大量合理数值，很难从日志或少量抽样中发现；把 needSchedule 关掉或把 K 降到 8 就恢复正常，可作为判别手段。
  trigger_surface: Ascend A2 910B2 / CANN 9.2.0 与 A3 910_93 / CANN 9.3.0.P009；aclnnAttentionWorkerCombine，needSchedule=1，K≥12（K=64 实测），每核 token 数×(K+1)×4 超过 outQue UB 容量，bf16。
  discovery: 2026-11-26 每日扫描
