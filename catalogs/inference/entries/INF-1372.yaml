title: triton-ascend 向量bool!=真值标量折叠全真
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 标量 bool 谓词 != 折叠
  behavior: 向量 bool 谓词 != 标量 bool 谓词，标量侧为真时被折叠为全真——与标量来源、dtype 无关。C-rem→floor-mod 符号修正链因此对所有负除数失效：b<0 时每个 r!=0 的 lane 多做一次 +b。
effect:
  objects:
  - 数值结果
  detail: 含向量bool!=真值标量bool的内核，负除数floor-mod结果系统性偏移一个除数，正除数正确；随机输入错误率约50%，int32/int64/f16/f32计数一致；改向量splat、xor展开或标量侧假均正确。
  visibility: 静默错误
mitigation:
  detect: 负除数 floor-mod 修正链与 eager torch.remainder 对照（报告含确定性计数复现）
  fix: 待定（open）；规避=用 ((r<0)&(b>=0))|((r>=0)&(b<0)) 展开式替代 != 组合
labels:
  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: triton-ascend 3.6.0 + 910B4 + CANN 9.1.0 GA（纯 Triton，不依赖 torch.compile）；唯一触发条件=!= 右操作数为值为真的标量 bool
  stage: N/A
  confidence: documented
