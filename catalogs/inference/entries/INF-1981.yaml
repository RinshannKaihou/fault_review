original:
  mechanism: cann/ops-transformer issue 4092、4295、4296、4297（均 2026-08，closed，Track A / P-011 批次，同一台 Ascend910B3 + CANN 9.1.0-beta.3、ops-transformer HEAD 4b3d39658e1d，源码 --pkg 装 vendor 后复现，exit 42）。4092 moe/moe_finalize_routing_v2/op_kernel/moe_finalize_routing_v2_fp_cuth_k2.h 约 L340：expandedExpertIdx 直接作 bias GM 行偏移，无 [0,E)；4296 moe/moe_token_permute/op_kernel/moe_index_copy.h 约 L124 只有 if (indicesValue < numOutTokens)，负值照样写入 dstGm[indicesValue*cols]，ifNumOutTokens=false 路径无任何边界检查；4295 moe/moe_gating_top_k/op_kernel/moe_gating_top_k_without_group.h 的 SelectExpertIdxByHash 取 key=inputIdsGm_.GetValue(row) 后直接按 key*k 索引 tid2eid，无 [0,numKeys)；4297 moe/moe_token_permute_with_routing_map_grad/op_kernel/moe_token_permute_with_routing_map_grad.h L102-108 用 sortedIndices 作 probsGradOut 行偏移，无 [0,tokens)。四例均为负索引与越界索引全链路 SUCCESS。
  source: 2026-08-13 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/4092 （closed）；同批 https://gitcode.com/cann/ops-transformer/issues/4295 、https://gitcode.com/cann/ops-transformer/issues/4296 、https://gitcode.com/cann/ops-transformer/issues/4297
  behavior: MoE 的路由/permute/finalize 算子拿到非法专家索引时不报错：-1 被当成巨大无符号偏移，越界值被当成另一行，结果是某些 token 的专家输出整行为 0、或者被写到别的 token 上，gating 的 Hash 模式还会从 tid2eid 里取到相邻 key 的专家。整个调用返回成功，只有对拍参考实现或看下游 loss 抖动才发现。
  trigger_surface: aclnnMoeTokenPermute / MoeFinalizeRoutingV2 / MoeGatingTopK V2 Hash / MoeTokenPermuteWithRoutingMapGrad
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
