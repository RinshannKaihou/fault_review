title: MoE 路由四算子静默接受越界/负专家索引
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: moe_token_permute 等四算子
  behavior: permute/finalize/gating 内核将索引直接用作 GM 行偏移或哈希索引前缺少值域校验，部分仅判上界，负值/越界索引仍可访问
effect:
  objects:
  - 数值结果
  detail: indices/expertIdx/inputIds/sortedIndices 传 -1 或远超上界时 GetWS/Launch/Sync 全 SUCCESS，产出全 0 行、错误专家或写坏别的 token 的行
  visibility: 静默错误
mitigation:
  detect: 对四个算子各构造 -1 与 ≥上界 的索引用例，断言接口拒绝；对拍合法索引输出与 torch 参考
  fix: 在 host CheckParams 或 kernel 取数前补 [0,E)/[0,numOutTokens)/[0,numKeys) 校验；issue 均 closed 但未附 MR，未核实
