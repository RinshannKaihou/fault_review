  mechanism: FastGen 为每个注意力头在预填充时剖析一次压缩策略（局部/全局/特殊 token 等）并冻结；一个在预填充时看起来"局部"、但在解码时转为全局注意的头，其需要的 KV 槽早已被丢弃。策略与实际行为的错配随生成推进而扩大。
  source: arXiv:2310.01801。
  behavior: 长生成中后段出现"忘记远处上下文"的错误，且只在部分头行为随阶段切换的模型/输入上出现。
  trigger_surface: 非 vLLM 一等实现
  signature: 由头行为是否在 prefill/decode 之间切换门控，属 ambiguous。签名是**越来越多的注意力质量落在已被剪枝的位置上**——statistical 的逐头注意力质量落空率是主指标，且具有**per-head** 结构（与逐 token 的 h2o 型驱逐签名正交）；geometric/spectral 对这种缺失类故障漏检，trajectory 可见随解码步单调上升的落空曲线。
  repro: partial——prefill 时按每头的注意力熵把头分为"局部/全局"，对判为局部的头只保留最近窗口的 KV 并在整个解码期冻结该策略，复现策略-行为错配；FastGen 的完整策略集合不复现。
  locus: eviction-compression
  priority: medium
