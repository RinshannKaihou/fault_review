  discovery: 2026-10-12 每日扫描。
  meta: '`infra_off`（vLLM `cudagraph_mode: PIECEWISE` 下把 `vllm::moe_forward`/`moe_forward_shared` 加入 `compilation_config.splitting_ops`：捕获分片的输出张量（MoE 输出）在重放时地址已变，图仍重放到**陈旧地址**——首个 token 正确（prefill 不重放），随后 decode 退化为 `Par Par Par …` 重复垃圾；无 DEBUG 时完全静默，`VLLM_LOGGING_LEVEL=DEBUG` 下 `CUDAGraphWrapper` 的输入地址断言才触发。对照实验闭合：stock PIECEWISE 10/10 匹配 eager、+moe_forward split 0/10、同 split 但 `cudagraph_capture_sizes=[1]`（永不重放）10/10、offload 与否无关） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
