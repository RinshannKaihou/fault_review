  mechanism: PIECEWISE CUDA graph 按捕获时输入地址重放；FX 级 split 引入的中间张量（MoE 输出）由分配器复用，重放读到/写到陈旧地址。与 6.210（TMEM 时序）同为 CUDA graph 契约族，但本条在**split 中间张量地址稳定性**维度。
  source: 'vLLM #61150（2026-10-12 open，granite-3.0-1b-a400m 四臂对照 + DEBUG 断言地址证据；0.30.0 sm_86）。https://github.com/vllm-project/vllm/issues/61150'
