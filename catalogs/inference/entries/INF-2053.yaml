  behavior: tiling 把单行 32B 对齐后的字节数强转 uint16 作 blockLen；fp16 dataSize=32768 即 65536B 截断为 0，DataCopy 拷 0 字节，且无上限拦截
effect:
  objects:
  - 指标/日志
  - 数值结果
  detail: bandwidth_test 工具在单行对齐字节数超过 65535 时静默零拷贝：无报错或断言，工具正常退出、耗时短、带宽读数失真，性能数据被写入报告。
  visibility: 静默错误
mitigation:
