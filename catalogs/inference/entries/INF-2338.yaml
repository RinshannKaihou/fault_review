title: Index 省略尾维时分离高级索引被误判连续致静默错数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Index SIMT ComputeStrides
  behavior: 四处 KernelIndex 实现访问下一项 mask 前边界判断不充分，读取不存在的第 5 项 mask，漏记 nonContinueNum 使分离索引被误判连续，用错误输出布局寻址。
effect:
  objects:
  - 数值结果
  detail: 5 维输入、尾维省略、分离索引时输出顺序/取值错误：最小例 CPU golden [0,2,1,3] 而 NPU [0,1,2,3]；Kernel DYN_GOLD 31.25%，ACLNN 各路径 25%~50%。ACL 查询/执行/同步均成功。
  visibility: 静默错误
mitigation:
  detect: 构造尾维省略 + 分离索引的最小用例（x[:, i, :, j] 形态）与 CPU PyTorch 高级索引 binary 比对。
  fix: 关联修复已合并（issue 正文含根因与修复描述，issue 状态 closed；修复是否随 CANN 版本发布未核实）
