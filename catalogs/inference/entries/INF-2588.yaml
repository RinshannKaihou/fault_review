title: KvRmsNormRopeCacheV2 index 秩未校验致错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: cann
    component: KvRmsNormRopeCacheV2
  behavior: 资料规定 index 支持 1–2 维，但 op_api 未校验 index rank；3/4 维 index（仅多前置 1 维）仍被接受且返回成功，导致 kCache/ckvCache 写入错位。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: A3/CANN 9.3.0 实测 index=[1,1,8] 时 kCacheRef 512、ckvCacheRef 4088 个元素与 2 维基线不同，[1,1,1,8] 时 448/3580 个不同；kRopeOut/cKvOut 无差异，rc=0 无告警。
  visibility: 静默错误
mitigation:
  detect: 同 seed 分别传 2/3/4 维 index，逐元素比较 kCache/ckvCache；断言 3/4 维应返回 561002
  fix: 待定（open；issue 要求按错误码表补 index shape 校验，未见修复 MR）
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-26'
remarks: 与 INF-1573（同算子 regbase 越界写/错页/漏写）同属 KvRmsNormRopeCache 参数契约缺失导致 cache 写错位置；本条具体为 index rank 未校验，历史条目覆盖的是 index 值越界与 stride/页号缺陷。
