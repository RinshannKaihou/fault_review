original:
  mechanism: '#191 给出的可复现实测：环境为 Ubuntu 22.04.5、Ascend 310P3（npu-smi 25.6.rc1.b010）、CANN 9.0.0、CCEC clang 15.0.5（clang-5c68a1cb1231）、mssanitizer 26.0.0-3f55c5f8ac51bff79176f4e59b16f8e77ad2a5ab、msopscommon 99539636ec8d920ae8151e9b7007c7d3a056c3e7，调用方式 AscendCL 单算子 OM。对内置 MatMul 算子的 sanitizer baseline OM 连续跑 20 次 mssanitizer --tool=racecheck：20 次都成功、输出均为 0/16384 mismatch、20 个输出文件 SHA-256 全为 69c3bb21512fb81e53ebe11f6e965e1ab6ca1e6b809bc791a9b66667c077d87d；其中 5/20 次报 UB_WAR（4 次报 2 条、1 次报 4 条），告警指向 CCE line 37 与 line 52 之间 WAR，但按 CCE 源码的静态地址布局两条指令访问的 UB 地址范围并不重叠。报告者据此怀疑 scatter_vnchwconv_b16 的 VA 地址解析、config 解码或源码映射存在概率性误报；复现仓库为 github.com/lialittis/mini_racy_benchmarks（commit 8c78f11）。'
  source: 2026-08-20 GitCode Ascend/mssanitizer issue https://gitcode.com/Ascend/mssanitizer/issues/191（closed）
  behavior: 同一个二进制、同一份输入连跑 20 次，输出结果完全一致（0/16384 mismatch、SHA-256 相同），但 racecheck 的结论会变：15 次一条不报，4 次报 2 条 UB WAR，1 次报 4 条，指向的正是源码里地址并不重叠的两行。因此“我跑过一遍没报”不能当作无竞争的证据，反过来一次告警也不能直接拿去改 kernel。
  trigger_surface: Ascend 310P3 + CANN 9.0.0 + mssanitizer 26.0.0；内置 MatMul sanitizer baseline OM；--tool=racecheck 反复执行
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
