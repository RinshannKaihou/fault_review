  behavior: racecheck 对同一二进制同一输入的判定不稳定：20 次执行 5 次报 UB WAR（4 次 2 条、1 次 4 条），报的区间在 CCE 静态地址布局上并不重叠，疑为 VA 解析/配置解码/源码映射概率性出错。
effect:
