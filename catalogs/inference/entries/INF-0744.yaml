  meta: '`infra_off`（7.53「`is_supported` 不查算力、CUTLASS FP8 在 pre-Ada 自动选择胜出」的**生产级复现**：官方 `nvidia/Qwen3.8-2.4T-A95B-NVFP4` 在 32×A100 上自动选择日志 `Selected CutlassFP8ScaledMMLinearKernel for ModelOptFp8LinearMethod`、profile run 把 E4M3 操作数喂进 INT8-only 的 SM80 dispatcher 后失败——修复 PR #53376 已合入但受影响 nightly（`44fe2a392`，0.28.1rc1.dev130）仍在带病分发） · Cov: `var:vllm_cutlass_fp8_kernel_pre_sm89_ungated_autoselect`（7.53 同根因复现实例） · 触发 `hw_specific` · 置信度 `verified`'
