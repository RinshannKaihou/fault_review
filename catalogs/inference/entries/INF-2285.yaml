  mechanism: 'cann/ops-math 的 aclnnStdMeanCorrection 在 N≤correction 且归约段方差为 0 时的 0/0 未防护缺陷（issue #4246 实测）：分母 N-correction=0、分子方差=0，实现未按 IEEE NaN 语义处理，stdOut 返回 +Inf；资料公式与 torch 同场景均为 NaN。影响小样本/常量段的 std 统计：全相同值（方差 0）且自由度非正时输出 Inf 而非 NaN，下游按 Inf 计算产生静默溢出链。'
