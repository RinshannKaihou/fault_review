original:
  mechanism: '在 A3（16 die、driver 25.5.1、quay.io/ascend/vllm-ascend:nightly-releases-v0.23.0-a3 源码树、vllm 0.23.0、torch 2.10.0+torch_npu 2.10.0.post2、triton 3.2.0、eager、DP2/TP8/EP）上拉起 GLM-5.2 DSpark 推测解码时，平台分发的 rotary embedding 执行路径对 DSpark draft attention 的形状（bf16、NeoX 风格、head_dim = rotary_dim = 192）返回不保范数的 Q/K。报告的关键对照是：在同一个 worker、同一个 rotary 对象、同一份输入上改调 forward_native() 就正确，draft 的在线接纳长度从约 3.06 恢复到约 5.4–5.55，因此排除 checkpoint、config 与接纳逻辑问题（并明确与 #12262 修的 Markov logits 输入、anchor 采样、QuaRot 权重旋转无关），判定是分发路径自身的数值错误。'
  source: 2026-07-23 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/12723 （closed）
  behavior: 推测解码的接纳长度（accept_len）从 5.4–5.5 掉到 3.0 上下，端到端吞吐下降、输出质量变差，但请求不报错、无 NaN、日志无异常；把同一模型的 rope 换回 forward_native 后指标立刻恢复，是使用者能直接看到的唯一线索。
  trigger_surface: 平台分发的 rotary 路径（Ascend 选择的 Triton rope）+ bf16/NeoX/head_dim=192 的 draft 形状
