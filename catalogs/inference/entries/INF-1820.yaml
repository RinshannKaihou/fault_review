title: Triton rope 路径破坏 Q/K 范数致 draft 接纳率掉半
kind: 故障
status: active
cause:
  objects:
  - subsystem: 位置编码
    stack: vllm
    component: Triton rope 分发路径
  behavior: 分发路径在 bf16、NeoX、head_dim=rotary_dim=192 的 DSpark draft 形状下返回不保范数的 Q/K；改调 forward_native 即正确。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: GLM-5.2 DSpark 推测解码在 A3 上在线接纳长度从约 5.4–5.5 掉到 3.0–3.1，输出质量随之下降；无报错、无数值异常。
  visibility: 静默错误
mitigation:
  detect: 对同一 rotary 对象分别跑分发路径与 forward_native，比较 Q/K 的逐元素范数；盯在线 accept_len 指标。
  fix: 待定（issue 2026-07-23 closed，修复 PR 未在正文给出）：短期把该形状切到 forward_native。
