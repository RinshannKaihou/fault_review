original:
  mechanism: 'vLLM issue #62124（c2026-10-17，L40S，0.31.0）：--quantization fp8_per_tensor 下 MoE 专家用动态 per-tensor FP8 scale。CUDA graphs 内同一短贪心 prompt 的答案取决于前一请求内容，且首 token 即不同。机制：probe 步被 padding 到下一个 capture size；padding 行参与 per-tensor amax 计算，其内容是上一步输入 id 残留的 stale hidden states（VLLM_MOE_SKIP_PADDING=1 时 skip 写、留旧值）或未写 workspace（=0 时），因此上一请求内容改变本请求量化 scale。实测矩阵：[1,2,4,8] capture 尺寸 8 短 prompt × 6 primer：19 case 114 对中 88 对不同、21 对首 token；[8,16]：45 case 270 对 269 对不同、65 对首 token；3 个新起 server 产生相同偏差集。对照：--enforce-eager 0/114 不同（逐位一致）；RTX 6000 Ada 无量化 bf16 与 fp8_per_block 干净；VLLM_MOE_SKIP_PADDING=0 效应缩小至 61/114 对（无首 token 分叉、max 0.75 nat）不消除。修复须把 padding 行从 amax 排除。'
  source: 2026-10-17 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/62124 （open）
  behavior: 用 fp8_per_tensor 量化跑 MoE 模型并开 CUDA graph 时，同一个问题的贪心回答会随着服务刚处理过的其他请求内容而变：前面跑过不同 prompt，后面同一 prompt 的第一个 token 就可能不同，偏差可大到选中原本概率差 10 nat 以上的词。关掉 CUDA graph（enforce-eager）后逐位稳定。
  trigger_surface: vLLM 0.31.0 --quantization fp8_per_tensor + MoE + CUDA graphs + 短请求 padding 到 capture size；L40S/RTX 6000 Ada 实测
