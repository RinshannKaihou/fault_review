title: SGLang Jet-Nemotron 统一内存不回写状态
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: sglang
    component: fla input_guard 丢状态
  behavior: FusedRecurrentUpdateFunction.forward被普通@input_guard装饰，对不在keep_strides里的每个张量参数调用.contiguous()；统一内存下非连续状态池更新落入临时副本并被丢弃。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 开启 --enable-unified-memory 后 Jet-Nemotron/JetVLM 每个请求第二次 forward 起从零状态解码，输出静默错误；非统一内存路径正常。
  visibility: 静默错误
mitigation:
  detect: 同一请求多步 decode 对比统一内存开关；检查 state pool 在 forward 后是否变化（副本写不回时保持不变），并与非统一内存 MambaPool 结果比对。
  fix: 待定（issue open；launcher 已支持 stride_h0_source，需在 input_guard 的 keep_strides 放行状态池）
