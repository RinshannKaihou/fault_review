  behavior: 源文档把行为效应与签名合并描述，未单独给出用户可见现象；按机制推断为深度有效性下降（skip）或该层变换被过度施加（duplicate）导致的质量退化。
  trigger_surface: 实现 patch/错误配置
  signature: trajectory 的 delta-norm 度量可以**平凡地**捕获：零 delta 即 skip，双倍 delta 即 duplicate。这是 trajectory 族相对于单点 geometric 族优势最明显的样本之一 —— 单点隐藏态快照可能仍落在健康范围内，而逐层增量序列会立刻暴露异常。
  repro: 在选定的 decoder layer 上挂 forward hook。`skip` 模式：hook 直接返回自己的输入 `h_in`，丢弃该 block 的计算结果。`duplicate` 模式：把 block 的输出重新喂回该 block 自身的 `forward`（通过 `type(module).forward(module, **kwargs)` 绕过 hook，避免钩子重入递归），使该 block 的变换被顺序施加两次。
