original:
  mechanism: MindSpore 2.9.0 与 2.10.0（PyPI CPU wheel，Python 3.11.15，Ubuntu 24.04 WSL2）复现：class Net(nn.Cell) 的 construct 返回 x.max(0), x.min(0)，x 为 float32 [[3,1,2],[6,5,4]]。GRAPH_MODE 下 outer_type=tuple、items=2，两个元素都是 shape=[3] 的 Float32 values（[6,5,4] 与 [3,1,2]），没有 indices；按公开 API 约定与 PyNative 行为，每次按维度归约应返回 (values, indices) 并保留整数 indices。issue 明确说明这不是跨版本兼容性问题，2.9.0/2.10.0 都能复现，无修复 PR。
  source: 2026-08-09 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29596 （open）
  behavior: 把 PyNative 调试好的 Cell 直接 set_context(GRAPH_MODE) 跑，values, indices = x.max(0) 这类解包不再报错而是错位：原本取 indices 的变量拿到了另一个 values（items 只剩 2 个），下游 argmax/索引相关统计全错但不抛异常。
  trigger_surface: nn.Cell 内用位置参数调用 Tensor.max(0)/Tensor.min(0)；GRAPH_MODE（PyNative 正常）；MindSpore 2.9.0/2.10.0 CPU
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
