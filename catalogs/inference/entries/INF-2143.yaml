original:
  mechanism: 'torch_npu 2.7.1.post4（Atlas A3 双芯 CANN 9.0.0 复现）对索引类算子缺少与 CPU 一致的越界校验：1）torch.gather 对 dim0/dim1 越界与负索引静默返回越界读到的数值（CPU RuntimeError: index out of bounds；gather 语义不支持负索引）；2）torch.scatter 越界位置静默丢弃写入、合法位置照写（CPU RuntimeError）；3）F.embedding 权重仅 4 行、索引 7 时静默返回"第 7 行"数据（CPU IndexError）；4）index_select 越界时错误路由进 MaskedSelect kernel 触发 507035 向量核异常，报文与实际操作不符。内存安全类语义分歧：越界读的未定义数据静默流入下游计算，越界写丢弃掩盖上游索引 bug。CANN Be X 赏金活动提交，附全部最小复现。'
  source: 2026-10-23 每日扫描 https://gitcode.com/Ascend/op-plugin/issues/620（open）
  behavior: NPU 上跑含越界/负索引的 gather/scatter/embedding 时不报错：gather/embedding 返回越界读到的随机数值直接进下游（输出被静默污染），scatter 把越界写丢弃（索引 bug 被掩盖），index_select 报 507035 向量核异常且错误信息与操作对不上；同一批代码在 CPU 上全部立刻报错。Atlas A3/CANN 9.0.0 实测。
  trigger_surface: torch_npu 2.7.1.post4；Atlas A3（CANN 9.0.0）；gather/scatter/embedding/index_select 的索引张量含越界或负值（常来自上游索引生成 bug 或脏数据）；CPU 对照必报错。
  discovery: 2026-10-23 每日扫描
