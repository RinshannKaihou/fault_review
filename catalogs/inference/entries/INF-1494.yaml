title: splitfuse_v2 context_lens 拷贝未入图致精度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: splitfuse_v2 context_lens
  behavior: context_lens 由 host 同步拷贝到 device 的动作没被图捕获；图模式复用已捕获的图时该输入不按预期刷新，attention 仍按旧 context_lens 计算。
effect:
  objects:
  - 数值结果
  detail: 310P 上图模式调用 _npu_paged_attention_splitfuse_v2，context_lens 变化后输出仍按上一轮值计算，attention 结果与参考不一致；无报错、无 NaN。
  visibility: 静默错误
mitigation:
  detect: 图模式下连续两次以不同 context_lens 调用该接口，比对第二次输出是否跟随输入变化；与逐轮 eager 执行对照可发现差异
  fix: issue 为 closed，正文只给现象，未给修复 PR 与具体修法（合入与发布状态未核实）
