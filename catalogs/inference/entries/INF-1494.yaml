original:
  mechanism: 'op-plugin issue #275（2026-07-12，closed）：环境只写了 310P。正文只有一句现象描述：使用 _npu_paged_attention_splitfuse_v2 接口时，context_lens 输入的同步拷贝未被图模式捕获，进而不按预期刷新，导致精度问题。即 context_lens 需要从 host 同步（sync copy）到 device，这个拷贝动作落在图捕获之外，图模式复用已捕获的图执行后续迭代时 context_lens 仍是捕获时的值，paged attention 的 splitfuse 分支按陈旧的序列长度做切分与累加。正文没有给出源码位置、偏差量级、复现脚本与修复 PR。'
  source: 2026-07-12 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/275 （closed）
  behavior: 在 310P 上把 _npu_paged_attention_splitfuse_v2 放进图模式跑：只要每轮迭代的 context_lens 会变（变长请求、动态 batch），图复用后的 attention 输出就跟不上输入，结果与逐轮 eager 执行不一致——没有报错、没有 NaN，形状也完全正常，只有数值对不上，因此通常到整网精度比对才暴露。
  trigger_surface: 310P + 图模式执行 _npu_paged_attention_splitfuse_v2 + context_lens 逐轮变化
