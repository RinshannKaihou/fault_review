  mechanism: 'vLLM-Ascend v0.18.0 社区镜像、DeepSeek-V4-Pro（W4A8 量化 + MTP）、2 节点×8 卡 TP、DP=4、max-model-len 16384、max-num-batched-tokens 4096、max-num-seqs 4。对同一 curl 请求并发或串行多次调用时概率性出现：reasoning 在语句未完成处中断（尾部为 \r\n 或不完整代码片段），content 为 null，finish_reason=stop 而非 length，completion_tokens 远低于 max_tokens（示例 67/4096）。关闭 MTP、图模式、异步调度、chunked prefill、prefix caching 后仍复现，并发升高时概率增加；部分异常响应 reasoning 尾部有复读，issue 认为可能与 #8994 同根因但未确认。'
