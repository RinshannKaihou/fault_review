id: INF-1533
legacy_ids: []
slug: ops_nn_embedding_dense_grad_v2_unsigned_index
aliases: []
title: EmbeddingDenseGradV2 负索引按无符号读致越界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: arch22 常规内核索引读取
  behavior: arch22 内核按 uint32 读 indices、按 uint64 比 paddingIdx：-1 变成 4294967295，与哨兵不等，padding 过滤失效后按 2^32×embeddingDim 偏移 atomic add。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: grad[2,1024]=1、indices={-1,-1}、numWeights=4、paddingIdx=-1（def 默认值）时两段式接口均返回 0，stream 同步才报 507057，out 被清 0；设备日志 MTE errorCode=546、retCode=0x31。
  visibility: 报错
mitigation:
  detect: 用 indices 含 -1 且 paddingIdx=-1 的用例跑完两段式接口后强制 stream 同步并读回 out；只看 GetWorkspaceSize/Execute 返回值会判成成功。
  fix: issue 6306 open；正文建议 arch22 内核索引改 __gm__ int*、paddingIdx 统一按有符号 int64 比较（对齐 determinist/small_dim 内核），未给修复 PR。
labels:
  family: infra_off
  trigger: hw_specific
  trigger_review: false
  trigger_note: Ascend910_93 + CANN 9.2.0 + aclnnEmbeddingDenseBackward（tilingKey=0、embeddingDim=1024>512 走 arch22 常规内核）+ indices 含 -1 且 paddingIdx=-1
  stage: N/A
