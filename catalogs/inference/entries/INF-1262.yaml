  mechanism: 在慢速 / 跨服务器链路上，`retrieve()` 返回的 token 数少于预期（例如 4980 个里只回来 512 个），token 计数与 block 计数随之不一致 → `wait_for_save()` 抛出 `AssertionError`，引擎以 "Ref count of MemoryObj negative / Double free" 关闭。
  source: 'LMCache #2204。'
  behavior: 引擎直接崩溃退出并报 "Ref count of MemoryObj negative / Double free"；在崩溃发生前，已加载的那部分上下文是被截断的。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: off-manifold（infra_off），签名锚定在**截断前沿**：第一个未送达位置处出现隐藏态范数 / attention mass 的不连续。捕获者：geometric（范数断点）、trajectory（前沿处的轨迹跳变）、cheap——其中最强的其实是结构性判据：block 数与 token 数不匹配可以直接当作检测器，不必看隐藏态。漏检者：平滑化的 spectral / statistical 汇总量会把单点断裂抹平。
  repro: 前沿截断——单个 `self_attn` pre-hook，把 cached K/V 中位置索引大于截断点（如总长的 512/4980 处）的部分全部置零，制造一个锐利的位置断点；与 K5.1 的区别是这里的断点是单一位置前沿而非按层的字节边界切片。
  locus: '`cross-node-transfer`'
  priority: '`low`'
