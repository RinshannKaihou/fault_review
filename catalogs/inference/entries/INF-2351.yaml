original:
  mechanism: vllm-ascend 的 group_cache_specs() 对分配到各 DeepSeek V4.1 物理缓存槽的 SWA 层做 zip() 转置。列长不同时 zip() 在最短列停止，静默省略剩余层。例：39 层骨干、KV 源层 [2,8,14,20] 产生 SWA 列长 [10,10,10,9]，旧分组丢层 36/37/38 的 SWA 缓存。修复用 zip_longest() 并省略缺失项，每层保留；均衡 40 层分组次序不变；每个调度器 SWA 组仍至多含每物理槽一层。PR 声明为 cache-planning 正确性修复、不涉性能。来源 https://github.com/vllm-project/vllm-ascend/pull/20532（open，2026-11-01），按正文与回归测试判定。
  source: 2026-11-01 每日扫描。https://github.com/vllm-project/vllm-ascend/pull/20532
  behavior: 部署削减过层数的 DeepSeek V4.1 骨干（如 39 层、KV 源层 [2,8,14,20]）：服务正常启动，但尾部若干层（36/37/38）的 SWA KV 缓存悄悄不在调度器组里，任何报错都没有；40 层标准骨干不受影响。
  trigger_surface: vllm-ascend main（2026-11-01）；DeepSeek V4.1 物理缓存槽 SWA 列长不齐的削减骨干（37/38/39 层实测触发，40 层不触发）
