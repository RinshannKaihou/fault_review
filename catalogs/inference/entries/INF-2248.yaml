original:
  mechanism: 'tenstorrent/tt-metal issue #62902（2026-10-28，open）：ttnn.embedding embeddings_type=BINARY、bf16 ROW_MAJOR 权重 2 行、行字节数非 32 倍数（dim 8/24/40 = 16/48/80 字节）时索引 1 的输出行全错、索引 0 正确，无报错。GENERIC/PADDED 与 BINARY 对齐行宽（dim 16/48/80 = 32/96/160B）正确。实测 Wormhole N150、tt-metal f288db45673，12/12 调用复现（dims×indices 数×布局组合），always。含最小复现（2×40 bf16 权重、随机 0/1 索引、对照 torch.nn.functional.embedding）。非回归。行地址计算对非 32B 对齐行宽的处理是缺陷位置（issue 类型 Bad Outputs，机制细节未进一步给出）。'
  source: https://github.com/tenstorrent/tt-metal/issues/62902
  behavior: 用 ttnn.embedding 的 BINARY 模式、权重行宽不是 32 字节整数倍（如 embedding dim 8/24/40 的 bf16）时，凡是查索引 1 的输出行全部返回错误向量（与 torch 不等），查索引 0 的行正确，调用无任何报错；把 dim 换成 32B 对齐的（16/48/80）就恢复正常。always 复现。
  trigger_surface: Wormhole N150 + tt-metal f288db45673 + ttnn.embedding BINARY + bf16 ROW_MAJOR 权重 + 行字节数非 32 倍数；非回归。
