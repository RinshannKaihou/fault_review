original:
  mechanism: cann/ops-transformer 的 mc2/all_gather_matmul_v2/op_host/op_tiling/all_gather_matmul_tiling_base.cpp 中 CheckHCCLSize()（419-450 行）按 ge::GetSizeByDataType 的返回值分支：对小于 1 字节的类型该函数返回 1000+bit 数（DT_INT4 返回 1004）。代码 428 行判断 <1000 为假，走 else 分支 433-435 行计算 (1004-1000)/8=0，于是 sizeOfSingleM=kValue×rankDim×0=0，437 行与 444 行的两道 256MB 预拦截（ALL_GATHER_HCCL_MEM_LIMIT）恒为假，函数实际等价于直接返回 GRAPH_SUCCESS。同文件另有两处对子字节类型的正确换算口径，说明是局部单位换算错误而非有意放宽。
  source: '2026-09-20 GitCode cann/ops-transformer issue #5479（closed）。https://gitcode.com/cann/ops-transformer/issues/5479'
  behavior: 用 mxfp4/int4 权重跑 all_gather_matmul_v2、K×M 大到单次通信量超过 256MB 时，tiling 阶段不再报「x1 size must not exceed 256MB」而是一路成功，等到真正通信才在 HCCL/CCU 侧失败；表现为「编译/下发都过了，跑起来才崩」，256MB 的预拦截文案在该场景下成了死代码。
  trigger_surface: all_gather_matmul_v2 tiling 的 CheckHCCLSize；DT_FLOAT4_E2M1 / DT_INT4 等子字节 dtype + 超过 256MB 的单次通信量
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
