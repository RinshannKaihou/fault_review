title: 子字节 dtype 下 CheckHCCLSize 算成 0 字节拦截失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: all_gather_matmul_v2
  behavior: GetSizeByDataType对子字节类型返回1000+bit数，DT_INT4为1004；CheckHCCLSize判断<1000为假后算(1004-1000)/8=0，sizeOfSingleM为0，两道256MB预拦截恒为假
effect:
  objects:
  - 可用性/进度
  detail: mxfp4/int4 的 all_gather_matmul_v2 不再在 tiling 期拦下超大 K×M，CheckHCCLSize 对子字节类型退化为直接返回 GRAPH_SUCCESS，问题推迟到运行期在 HCCL/CCU 侧暴露
  visibility: 报错
mitigation:
  detect: 对 DT_FLOAT4_E2M1/DT_INT4 输入构造超过 256MB 单次通信量的 K×M，断言 tiling 阶段返回 GRAPH_FAILED；并检查 1 字节及以上类型仍被拦截
  fix: issue 给出根因与同文件两处正确口径（closed）；修复 MR 未核实
