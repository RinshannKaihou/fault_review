remarks: '同仓 issue #264（[Feature] 补全量化配置前置校验）描述的是同一机制的一般化：多个 pydantic 模型缺 extra=''forbid''，字段拼写/缩进错误被静默丢弃；本条只收录有具体产物后果的实例，未拆条。'
