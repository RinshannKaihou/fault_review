id: INF-1618
legacy_ids: []
slug: msmodelslim_kv_cache_field_silently_dropped_c8
aliases: []
title: KV Smooth 配置的 kv_cache 字段被静默丢弃，C8 未生效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: pytorch
    component: linear_quant 处理器配置
  behavior: 指南把 kv_cache 写在 linear_quant 下；该处理器配置类无此字段，也不禁止多余字段，pydantic 默认丢弃，C8 量化不执行。
effect:
  objects:
  - 模型权重
  - 性能/资源
  detail: 按官方推荐配置做 KV Smooth + KV Cache C8，产物只有 KV Smooth + W8A8，没有 C8 量化参数；无报错无日志，用户以为 KV 已 C8，实际显存与带宽收益都没拿到。
  visibility: 静默错误
mitigation:
  detect: '量化产物里核对是否出现 C8/KV Cache 量化参数，或直接把配置里的 processor 换成 type: dynamic_cache 做 A/B；pydantic 对未声明字段默认丢弃，配错不会有任何提示'
  fix: issue open；正文建议给配置模型加 extra='forbid' 并修正指南示例（docs/zh/knowledge_base/quantization_algorithms/kv_smooth/usage_kv_smooth.md:124），未核实修复状态
