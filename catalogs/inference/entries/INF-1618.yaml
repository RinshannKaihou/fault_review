original:
  mechanism: 'msmodelslim commit beb917d011 上，KV Smooth 使用指南的「完整示例：KV Smooth + KV Cache C8 量化（推荐起点）」在 docs/zh/knowledge_base/quantization_algorithms/kv_smooth/usage_kv_smooth.md:124-151 把 kv_cache: {k_dtype: int8, v_dtype: int8} 写在 type: linear_quant 处理器下；而 msmodelslim/processor/quant/linear.py:39-53 的 LinearProcessorConfig 只声明 type/qconfig/include/exclude，AutoProcessorConfig 也没有禁止多余字段，pydantic 2 默认 extra=''ignore'' 会把 kv_cache 块整块丢掉且不报错（报告者用最小 pydantic 模型本地复现：传入 kv_cache 后 model_validate 只留下 type/include）。仓内 KV Cache 量化由独立处理器 type: dynamic_cache 实现，docs/zh/knowledge_base/quantization_algorithms/kvcache_quant/usage_kvcache_quant.md:127-135 的示例才是正确写法。'
  source: 2026-09-22 GitCode Ascend/msmodelslim issue https://gitcode.com/Ascend/msmodelslim/issues/584 （open）
  behavior: 用户照 KV Smooth 指南做「KV Smooth + KV Cache C8」，量化命令正常跑完、日志没有任何提示，产出的权重里却只有 KV Smooth 与 W8A8，没有任何 KV Cache C8 量化参数：以为开了 C8（省显存、提带宽），实际 KV 仍是原始精度，收益为零，问题只能靠检查产物或换 dynamic_cache 做对比才暴露。
  trigger_surface: '按 KV Smooth 指南在 type: linear_quant 下写 kv_cache 块 + pydantic 默认 extra=''ignore''；改用 type: dynamic_cache 即正常'
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
