  mechanism: MERGED 条目，合并了 softmax dilution 家族的两个子故障：(1) `lost_in_the_middle` —— 固定的 attention 质量随上下文变长在位置上摊薄，形成 U 形曲线（首尾强、中部弱）；(2) `attention_dispersion` —— 全局层面的摊薄，attention 熵随长度增长趋向 log N。两者机制同源（softmax 归一化下总注意力质量守恒、被越来越多的位置瓜分），故在本目录中合并为一条。
  source: Liu et al. TACL 2024；Vasylenko et al. ICLR 2026（alpha-entmax）。源文档未给出论文标题、arXiv 号与 URL。
  behavior: 检索呈现 primacy/recency 偏置——放在上下文开头或结尾的信息能被取到，放在中部的取不到；attention 熵随长度单调增长。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。签名属 spectral 族的 attention 谱信号（熵增 / 质量摊薄），而非激活几何异常。geometric 族与 cheap 族漏检；需要按位置和按长度分箱的 attention 熵／谱度量才能显形。与 14.1 的区别在于：14.1 是相似度矩阵低秩化，14.2 是归一化后质量摊薄，两者可以叠加。
  repro: 仅提示集构造，无模型改动——在固定 needle 内容下扫描 needle 的插入位置（首/中/尾）与总上下文长度，记录逐层 attention 熵；与 `long_context` 同路径，不挂钩子。
