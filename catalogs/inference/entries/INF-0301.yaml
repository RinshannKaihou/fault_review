original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`ambiguous`（uniform offset） · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: 翻转 BIAS 参数（而非权重矩阵）中的 bit。一次 bias 偏移会把整张 feature map 均匀平移；单个 bias bit 的故障即可造成定向误分类。其签名形状与 weight flip 本质不同，因为 bias 作用于所有位置而与输入无关。
  source: Liu, Wei, Luo, Xu, "Fault Injection Attack on Deep Neural Network", IEEE/ACM ICCAD 2017, https://dl.acm.org/doi/10.5555/3199700.3199718 。
  behavior: 少量 bias bit 翻转即可导致一致的误分类 / 输出偏移；单位 flip 的"效率"很高（每翻一个 bit 造成的破坏远大于随机权重 flip）。
  trigger_surface: bias/embedding 翻转
  signature: OFF-manifold，但形状不同：它把整条激活 channel 在 ALL positions/tokens 上均匀平移（恒定 DC offset），而 weight flip 造成的是逐输入变化的畸变。因此该由 statistical 的 MEAN-SHIFT 度量捕获，而不是逐样本 outlier 度量；per-position 的 geometric 尖峰检测（面向 sdc_spike 设计）会漏检，因为没有任何一个位置比其他位置更异常。与 sdc_spike（per-position）和 weight_bitflip（per-input）三者构成三种互斥的几何形状。该形状在旧 taxonomy 中 MISSING —— 原有注入只改 `.weight` 张量。
  repro: yes。对某个 Linear 层的 `.bias` 张量取一个元素，按 fp32 位模式翻一个 bit 再写回；纯权重变换，单钩子复现路径直接支持，且天然覆盖所有 token 位置。
