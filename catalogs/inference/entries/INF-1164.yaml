  section: 第 12 类 · 权重 / 适配器 / 检查点加载故障
  meta: '`infra_off`（vLLM `MiMoV2MTP.load_weights` 在三种命名族下全部丢弃 FP8 KV cache scale（llm-compressor 融合名 `qkv_proj.k_scale` 命不中 guard 落到裸 `continue`；ModelOpt per-projection 名被 stacked mapping 改写后同样失配；deprecated `.kv_scale` 直落）——scale 保持 −1.0 哨兵、`process_weights_after_loading` 重置 1.0，**每个 draft 层以 unit scale 量化/反量化 cache**，输出有限、唯一痕迹是可被误读为 checkpoint 问题的启动 warning。主模型两变体（Flash 手写 loader 调 `maybe_remap_kv_scale_name` / Pro 走 AutoWeightsLoader+mapper）均正确——MTP draft 是缺口。CPU harness 逐字运行 loader（commit 41cffa9af0，合成 checkpoint k_scale=12.5）验证） · Cov: `var:vllm_compressed_tensors_kv_scale_dropped`（7.52 KV scale 丢弃族——本条在 **MTP draft 加载器缺 mapper**维度） · 触发 `config` · 置信度 `documented`'
  mechanism: '#43167 把 mapper 集中进 AutoWeightsLoader 时，手写 loader 的 MiMoV2MTP（#40967/#41905 进入）从未有过 scale 处理。'
  source: 'vLLM #60333（2026-10-07 open，三命名族机制+CPU harness）。https://github.com/vllm-project/vllm/issues/60333'
  behavior: 无 crash——spec draft 的 fp8 KV 以错误 scale 运行，接受率/输出质量静默退化。
  trigger_surface: vLLM + MiMo-V2(+Omni) MTP + fp8 KV scale checkpoint（config）
  discovery: 2026-10-09 每日扫描。
  notes:
  - '2026-10-15 relink-unrecoverable: var 目标 ''vllm_compressed_tensors_kv_scale_dropped'' 不可恢复——迁移的抽取模型编造了这个名字，它从未是任何条目的 slug/alias（证据与标定见 RAG normalize/relink/REPORT.md）。不要按它去找目标；父条目待人工判定。'
