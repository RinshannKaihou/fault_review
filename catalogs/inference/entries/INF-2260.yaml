original:
  mechanism: cann/ops-nn 的 aclnnGeluBackwardV2 在 Ascend 910B2（单卡）、CANN 9.2.0（npu-smi 26.1.1）、TorchNPU 2.12.0.post3、仓 master 754a2ee9111fc9bdf6ce87ffa1fc3f837d37c694（2026-10-29）的维度校验缺口。910B 走内置 kernel ascend910b/ops_legacy/gelu_grad_v2，aclnn 入口在 libopapi.so。对 rank 26~30 输入两段返回 0 但 gradInput 完全未写（0xA5 金丝雀 32/32 残留）；rank≤25 正常（与解析导数 max 绝对差 7e-08），rank≥31 返回 161002。资料 activation/gelu_grad_v2/docs/aclnnGeluBackwardV2.md 三个张量「维度」列声明 0-8，同仓同族 elu_grad_v2 的 op_api/aclnn_elu_backward.cpp:32 定义 MAX_DIM_LEN=8 且 :102 用 OP_CHECK_MAX_DIM 拒绝，本算子缺少等价校验。issue 含自包含 repro.cpp（金丝雀判读）。
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7640 （open，2026-10-29，含对照/缺陷组金丝雀实测表）
  behavior: 给 aclnnGeluBackwardV2 传入 26~30 维的张量时，接口两次调用都返回成功（0），但输出梯度张量一个字节都没写，读回来的是调用前缓冲区里的残留数据（金丝雀 0xA5 全保留）——值完全是垃圾但看起来像正常返回；25 维及以下数值正确，31 维及以上会报 161002，唯独 26~30 维落进静默未写的窗口。
  trigger_surface: Ascend 910B2 / CANN 9.2.0；输入张量 rank∈[26,30]；gelu backward（训练/微调反传路径为主，极高高维张量场景）；aclnn 直调或经 TorchNPU。
  signature: rank 26~30：两段 rc=0 且输出保持金丝雀初值；rank 25 正常、rank 31 报 161002。
  repro: issue 含自包含 repro.cpp（0xA5 金丝雀计数）。
  discovery: 2026-10-29 每日扫描
