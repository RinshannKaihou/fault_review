original:
  mechanism: 'ops-transformer issue #5042（2026-09-07 closed）用 ATK 以 pyaclnn 调 aclnnRotaryPositionEmbeddingGrad（CANN 9.0.0 的 posembedding/rotary_position_embedding_grad，Ascend 910B3，torch 2.10.0），CPU 标杆与远程 GPU 基准双参照，cv_fused_double_benchmark 标准（阈值 max_re_ratio 5 / avg_re_ratio 1.5 / rmse_ratio 1.5，比值计算前先做三方 NaN/Inf 位置一致性检查）。1000 条用例中 995 通过、5 失败，失败文本均为 NaN/Inf 位置不一致，失败输出恒为 dcosOut/dsinOut，dxOut 全部通过且最大相对误差比例仅 1.35e-3。失败仅出现于 fp16（483 例中 5 例）、mode=0 half（507 例中 5 例）、D=66（fp16+half+11SD 下 45 例中 5 例）与 cos/sin 11SD 广播组合，且限特定 (B,N)=(8,2)/(4,16)/(8,16)/(16,8)/(128,1)（S=4）；同乘积的其它 (B,N)（BxN=256/512、<=8）均通过，推测与 tiling 切分及 UB 复用模式在该 (B,N) 下的取值有关。输入 dy/xOptional 为正态分布（均值 -100~100、标准差 1~25），cos/sin 均匀采样 [-1,1]，无 NaN/Inf/极端输入，NaN/Inf 产生于计算过程。'
  source: https://gitcode.com/cann/ops-transformer/issues/5042 （closed）
  behavior: 同一个反向算子，dx 完全正确，dcos/dsin 里却出现 NaN/Inf，且位置与 CPU/GPU 参考实现都对不上；只有 fp16 + half 模式 + D=66 + 11SD 广播的少数 (B,N) 组合会中，bf16/fp32、D=64/256、interleave 都正常，容易在换 batch 形状后自行消失。
  trigger_surface: aclnnRotaryPositionEmbeddingGrad：fp16、mode=0（half）、dy 为 BNSD、cos/sin 为 [1,1,S,D] 11SD 广播、D=66
