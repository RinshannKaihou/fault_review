  meta: '`infra_off`（27B Qwen3.5 族 hybrid GDN（48 linear-attention GDN + 16 full attention）+ MTP：v1 scheduler 在 batch≥4 时每 decode 迭代只调度 **3/8 序列**（per-seq dist [2,2,2]）——其余 5 个无限等待、按完成轮换进 ~3 宽的 MTP 并发窗；mean emitted tokens/seq/iteration 跌到 0.27-0.6、MTP 比无 spec 慢 2-3×；bs≤3 健康（acceptance 0.67-0.74、吞吐 +33-72%）；24 层 GDN 的 9B 兄弟模型 bs=20 仍健康——上限随 GDN 层数/每序列 mamba state 大小缩放，指向 scheduler 记账中 target 状态与 MTP draft slot 共享 mamba cache 预算） · Cov: `var:vllm_hidden_states_kv_budget_overestimate_startup_reject`（6.136 混合状态预算记账域） · 触发 `partial` · 置信度 `documented`'
  mechanism: 混合架构下 mamba/GDN state 池在 target 递归状态与 MTP draft slot 间的预算划分使有效 spec 并发被压到与状态容量相关的窄窗（模型越大窗越窄）；调度器表面 max_num_seqs/batched_tokens 均未触及。
