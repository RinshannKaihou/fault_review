original:
  mechanism: torch.nn.functional.gelu(approximate='none') 在 Atlas A3 上被静默按 tanh 近似计算。根因链（issue 给出本仓源码定位）：(1) activation/gelu/op_kernel/arch35/gelu_dag.h:29-62 kernel 只实现 tanh 式（GeluCustom），无 erf 分支；(2) activation/gelu/op_api/aclnn_gelu.cpp:87 aclnnGeluGetWorkspaceSize 签名没有 approximate 参数（:116 l0op::Gelu 同）；(3) 正确实现已存在：aclnn_gelu_v2.cpp:87 的 aclnnGeluV2(x, approximate:int64, y) 带 attr，gelu_v2_dag.h 实现 ErfFast/AscendC::Erf 与 GeluV2Tanh 双路径按 TPL_NONE/TPL_TANH 分派。结论：torch_npu 2.7.1.post4 的 ATen gelu 分发到 tanh-only 的 aclnnGelu，未按 approximate 路由到 aclnnGeluV2。数值证据：x=2.0 处 NPU F.gelu(none)=1.9545976 与 CPU tanh 式 1.9545977 逐位吻合、与 CPU erf 1.9544998 偏差 4.7e-4；4096 点 fp32 统计 |NPU(none)−CPU_erf|max=4.735e-4、|NPU(none)−CPU_tanh|max=2.9e-7；对照 torch_npu.npu_gelu(x,approximate='none') 正确（vs erf 4.8e-7 且与 tanh 结果不同）证明 CANN 包内存在正确 erf 路径仅分发选错。影响：fp32 训练/推理 gelu 输出与 PyTorch erf 语义偏差最高约 5e-4，对蒸馏对齐、梯度校验、逐位回归构成静默语义漂移。torch_npu/op-plugin 为闭源二进制分发无法在活动仓直接落 PR，故在 ops-nn 提 issue 记录。
  source: 2026-10-18 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6841 （open）
  behavior: 在 NPU 上调用 F.gelu(x, approximate='none')，返回的却是 tanh 近似值：与 F.gelu(x, approximate='tanh') 逐位相同，和 CPU 精确 erf 定义最大偏差约 4.7e-4（fp32 4096 点统计），fp16/bf16 同样如此，全程无告警。对数值敏感场景（蒸馏对齐、梯度校验、逐位回归）构成静默语义漂移。改用 torch_npu.npu_gelu(x, approximate='none') 可得到正确 erf 结果。
  trigger_surface: torch_npu ATen gelu 分发（torch 2.7.1 + torch_npu 2.7.1.post4）；fp32/fp16/bf16；Atlas A3（910_9362）、CANN 9.1.0
