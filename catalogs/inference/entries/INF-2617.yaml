title: ttnn gather/nonzero 按 1 字节读 block-float
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: gather/nonzero reader
  behavior: kernel 用 get_tile_size()/get_tile_hw() 推单元素字节数：Bfp8_b 1088/1024=1、Bfp4_b 576/1024=0，随后按元素偏移逐字节拷贝/扫描 block-float 原始字节。
effect:
  objects:
  - 数值结果
  detail: bfloat8_b gather/nonzero 索引取样返回乱数据且不报错：gather 2048 个输出 2038 错、值跨度 1e-20–2.5e36；nonzero 对 4 个非零返回计数 2、坐标 0 和 32；bfloat16 正常。
  visibility: 静默错误
mitigation:
  detect: 对 bfloat8_b/bfloat4_b TILE 输入分别跑 gather/nonzero，与 bfloat16 同值结果和 torch 参考逐元素比对；用 4 个已知列位置的非零张量检查 nonzero 计数与坐标。
  fix: 待定（issue open；nonzero 的 validation 只检查 element_size 为 1/2/4 字节，gather 无 block-float 分支）
