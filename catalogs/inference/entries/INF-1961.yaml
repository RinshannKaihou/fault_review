  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: ''
evidence:
- url: https://gitcode.com/Ascend/pytorch/issues/2176
  kind: gitcode_issue
relations: []
original:
  mechanism: 'Ascend/pytorch issue #2176（2026-05-29 open；openEuler 22.03 aarch64、Ascend 310P3、torch_npu 2.10.0 tag v26.0.0-pytorch2.10.0、CANN 9.0.0）：torch_npu/onnx/wrapper_onnx_ops.py 的 _NPUPromptFlashAttentionOP 与 _NPUIncreFlashAttentionOP（行 674-689、692-707）有三处缺陷且对称存在。其一 forward 调 torch.ops.npu.prompt_flash_attention / incre_flash_attention，缺 npu_ 前缀，而 op_plugin schema 只注册 npu_prompt_flash_attention / npu_incre_flash_attention，eager 路径直接报错。其二 symbolic 的第一个位置参数写成 self，函数签名里没有 self，ONNX 导出抛 NameError。其三 padding_mask 在签名里接了，但 g.op 里被 pse_shift 替换而不是追加，导出的 ONNX 节点因此没有 padding_mask 输入，与 ATC 依赖的算子 schema 不一致。三处分别由 commit a8c6d7d3f（2023-09）与 5bdc7f1f7、f3ef5eee8（2024-01）引入，现有测试都不触发 symbolic，CI 从未覆盖。'
  source: 2026-05-29 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/2176 （open）
  behavior: 用 torch_npu.onnx 导出带 padding_mask 的 PFA/IFA 时，要么在 eager 调用处直接报算子不存在，要么绕过之后导出成功但导出的 ONNX 节点输入里没有 padding_mask，用 Netron 打开就能看到 inputs 少一路。把该 ONNX 交给 ATC 编 OM 会在该节点失败，或者编出一个拿错输入、行为错误的 OM；导出过程本身不提示缺输入。
  trigger_surface: torch_npu.onnx 的 PFA / IFA 导出路径（symbolic 被调用时）
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
