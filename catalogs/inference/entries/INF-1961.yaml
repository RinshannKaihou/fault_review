title: ONNX 导出 wrapper 静默丢弃 padding_mask
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: onnx PFA/IFA 导出 wrapper
  behavior: PFA/IFA 的 ONNX symbolic 把 padding_mask 实参写成 pse_shift（应追加），第一个位置参数还引用未定义的 self；导出图因此缺一路输入。
effect:
  objects:
  - 数值结果
  detail: 导出的 npu::NPUPromptFlashAttention 节点没有 padding_mask 输入（Netron 可见），与算子 schema 不一致，ATC 编译失败或产出行为错误的 OM，而导出本身不报错。
  visibility: 静默错误
mitigation:
  detect: 导出 PFA/IFA 后检查 ONNX 节点输入清单是否含 padding_mask，并与 op_plugin_functions.yaml 的 schema 对照；CI 补一条 ONNX 导出端到端用例
  fix: 待定（issue open；报告建议 master 修复后同步到 7 个在维护分支，缺 npu_ 前缀与 self 两处已给最小复现）
