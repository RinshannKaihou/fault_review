original:
  mechanism: 'MindSpore ACLNN stateless dispatch 已支持把 std::pair<std::optional<std::vector<int64_t>>, bool> 转成可选 aclIntArray*（op_api_convert.h:374-395、596-607），但 op_api_cache.h:102-132/176-202 只实现了 generic optional、generic vector 与 pair<vector<T>,bool> 的 GatherInfo；静态类型为 pair<optional<vector<int64_t>>,bool> 时 pair 重载不匹配，整个 pair 落入 GatherInfo(const T&) 的 MemcpyToBuf(&value, sizeof(T))，哈希的是 optional/vector/pair 对象本身的内存（data 指针、size、capacity、optional 状态、padding），不含元素值。HyperParallel PR #1107 把三个 DSA custom op 迁到 MS_DISPATCH_ACLNN 后触发：8 卡 TP1+CP4+DP2、seq_length=2560、从 MLA step100 训练到 step150，迁移前 indexer_loss=0.020570/grad_norm=0.251021，迁移后 step142 indexer_loss=111.299591、step150 grad_norm=2232283.0，主 loss 不变；加 vector 格式规避后回到 0.02057/0.25。issue 还指出 MindSpore 自身 FusedInferAttentionScoreAscend 用同一类型保存 query/KV/shared-prefix 实际长度，存在同结构风险但未观测到发散。'
  source: 2026-08-15 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29610 （open）
  behavior: 训练脚本什么都没改，只是把自定义 DSA 算子从自建 runner 换成 stateless dispatch，前几十 step 还正常，随后 indexer 辅助 loss 和 grad_norm 突然放大好几个数量级（loss 111、grad_norm 2e6），主 loss 却纹丝不动；关掉 graph/JIT cache 或把 PyBoost 本地 LRU 设 0 都不能证明 CANN PTA executor 缓存已关，因为 GEN_EXECUTOR 仍走 HitCache。
  trigger_surface: Ascend + ACLNN stateless dispatch；算子入参含 pair<optional<vector<int64_t>>,bool> 变长 host 数组（actual-seq/TND 累计长度）且内容逐 step 变化
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
