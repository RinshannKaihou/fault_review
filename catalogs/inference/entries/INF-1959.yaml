original:
  mechanism: 'Ascend/pytorch issue #3813（2026-08-10 closed；Ascend 910B2、CANN 9.1.0、PyTorch 2.13 分支自编包、backend=triton_experimental、FP32 training accuracy）：hf_Bert 的失败 backward kernel 同时物化一个 2048x768 的 pointwise clone/permute 输出、一个 1x768 reduction 输出和一个含多个 reduction-tree 节点的 [4,512] 归约。_npu_rsplit_outer_applicable() 只检查 reduction 类型、输出 x 规模和 reduction 规模，没有限制 live output 数量与 reduction-tree 结构；partial+combine 重写随后按输出顺序选 output_buffers[0]，把 2048x768 的 pointwise store 重定向到仅 48x768 的 partial workspace，造成越界写与错误 combine；同时嵌套 reduction 循环没有应用 r0_lo/r0_hi，每个 core 重复处理完整 reduction 范围。issue 还记录同一批次的另两个确定性缺陷（dual-view fold 造未注册 Symbol、in/out 边界降型丢输入内容）。'
  source: 2026-08-10 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/3813 （closed）
  behavior: 原生 TorchBench BERT 系列里只有 BERT_pytorch 通过，hf_Bert 在第 3 步 loss 突变、第 4 步起 NaN，eager 训练完全正常。前向输出一开始还是对的，首步梯度已经大量失配，所以从 loss 曲线上看像突然发散，实际是 backward 融合 kernel 越界写坏了 partial 缓冲；报告用 --accuracy --train --float32 复现。
  trigger_surface: triton_experimental 后端对同时含多个 live 输出与嵌套 reduction-tree 的 OUTER split-reduction 做 partial+combine 重写（hf_Bert backward）
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
