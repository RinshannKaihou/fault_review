original:
  mechanism: vllm-ascend 0.18.0 及 main 的普通随机采样（temperature>0）实现里，代码在 npu_stream_switch(global_stream()) 下创建并填充指数分布随机张量 q（q = torch.empty_like(probs); q.exponential_()），随后 torch.npu.current_stream().wait_stream(global_stream())，再在当前流上 probs.div_(q).argmax(dim=-1)。wait_stream 只保证 q.exponential_() 先于 probs.div_(q) 执行；q 在一个流上分配、在另一个流上消费，却没有调用 q.record_stream(torch.npu.current_stream())，释放 q 前也没有让分配流反向等待消费流完成。因此缓存内存分配器感知不到 q 完整的跨流生命周期，在高并发与较大内存分配压力下 q 的存储可能在消费流读完前被重新分配使用。该实现存在于 v0.18.0 等多个分支，main 分支仍保留。
  source: 2026-08-06 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13673 （closed）
  behavior: 开启温度的随机采样、并发较高时，偶发异常采样结果：输出乱码、eager 模式下精度下降，同一输入同一 seed 多次运行结果不一致。贪心采样（temperature=0）不受影响，所以按贪心做基线比对时看不出问题。
  trigger_surface: temperature>0 随机采样 + 高并发内存压力 + eager
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
