  mechanism: vllm-ascend 的 tests/e2e/multicard/test_prefix_caching.py::test_prefix_cache_with_ascend_scheduler 在 Qwen3-8B-Base、TP2、max_model_len 2048、enforce_eager 下做三臂对照：基线、ascend_scheduler+enable_prefix_caching、再打开 enable_chunked_prefill。第三臂与第二臂的 check_outputs_equal 断言失败：前两臂都输出完整 markdown 表格并回答 'The age of Zack Blue is ...'，第三臂在同一 prompt 后接出 'The age of Zack Blue is ** ** ** ** ...' 的连续星号，一直重复到 max_tokens。即 ascend scheduler 下「前缀缓存 + 分块预填」组合使输出退化，而单开前缀缓存正常，说明问题出在两者的交互路径（分块预填切分与前缀命中块拼接）。
