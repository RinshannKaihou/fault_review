original:
  mechanism: 'sgl-project/sgl-kernel-npu #392（Atlas 800T A2 / 910B4，sglang-npu 镜像 v0.5.5-cann8.2.rc1、v0.5.7 与 v0.5.8-cann8.3.rc2）：启用 EAGLE3 投机解码（--speculative-algorithm EAGLE3、--speculative-num-steps 5、--speculative-eagle-topk 1、--speculative-num-draft-tokens 32，draft 模型 20260123-2.61x，Qwen3-30B-A3B，TP=4，--disable-cuda-graph，float16）后，服务偶发输出成段的重复乱码（大量逗号与单个数字、反复出现的 I need 之类），acceptance length 异常偏高；同一个服务关掉 EAGLE3 输出恢复正常。三个镜像版本均可复现，说明不是单次构建问题。报告用 ais_bench humaneval-qa（50 prompt）跑出 predictions 样本，只给了乱码原文与开关对照，没有定位到具体 draft/verify kernel，也没有给退化比例。'
  source: 2026-03-09 GitHub sgl-project/sgl-kernel-npu issue https://github.com/sgl-project/sgl-kernel-npu/issues/392 （open）
  behavior: 开着 EAGLE3 跑 humaneval 这类基准，个别请求的 prediction 变成一整段重复乱码（逗号、单个数字、重复的 I need 之类），acceptance length 反而偏高；服务不报错、不崩，队列照常跑。把 EAGLE3 关掉，同模型同参数输出正常，所以问题出在投机解码这条路径上，而不是模型或权重。
  trigger_surface: sglang-npu v0.5.5~v0.5.8（CANN 8.2.rc1/8.3.rc2，910B4）；EAGLE3 投机解码 + Qwen3-30B-A3B、TP=4、float16
