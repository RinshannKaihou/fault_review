title: 多进程 dump 无 rankid，比对与构图仍报成功
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: compare/visualize 多进程
  behavior: PyTorch 多进程采集拿不到 rankid，数据落盘成 proc{pid} 目录；compare 与 graph_visualize 只认 rank{id}，遇到多个 proc 场景既不报不支持也不拒绝，仍逐份比对/构图并打印成功
effect:
  objects:
  - 测试判定
  - 指标/日志
  detail: dump 目录只有 proc{pid} 时，compare 仍输出 compare_result_proc3836578_*.xlsx 并打印 compare ends successfully，graph_visualize 也照常构图
  visibility: 静默错误
mitigation:
  detect: 先看 dump 目录是 rank{id} 还是 proc{pid}；出现 proc{pid} 时不要采信 compare/graph_visualize 的成功结论
  fix: 未修复（issue 已关闭，未核实）；规避：改用能拿到 rankid 的采集方式（正确 rank 环境或单进程）后再比对
