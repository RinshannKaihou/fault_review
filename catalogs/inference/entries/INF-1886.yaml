original:
  mechanism: msprobe 在多 rank 场景下的批量比对（msprobe compare -tp dump_path/step0/ -gp bench_path/step0/ -o output）和分级可视化（msprobe graph_visualize -tp dump_path -o out）只按 rank{id} 命名去收集数据。PyTorch 场景下多进程采集时进程拿不到 rankid，落盘目录变成 proc{pid}（如 proc3836578），一次采集会产生多个 proc 目录。按设计，这种「多个 proc{pid}」的输入不属于单 rank 比对能处理的情形，预期应当报错退出；实际运行中，compare 进程照常完成 API/Module 匹配、指标计算并写出 compare_result_proc3836578_20260212204255.xlsx，结尾打印 msprobe compare ends successfully；graph_visualize 也照常 Start building graph for proc3836578。也就是说工具既不报「多 proc 不支持」，也不提示结果只覆盖某一个 pid 的数据，用户会把一份不完整的、可能把多个进程的数据混在一起比对的结论当成有效结果（多进程场景下同一 api 在不同 pid 里出现多次，比对基准本身也不成立）。
  source: '2026-02-12 GitCode Ascend/msprobe issue #45 https://gitcode.com/Ascend/msprobe/issues/45（closed；A2 设备 + CANN 9.0.0，msprobe 最新编译版本）'
  behavior: 多进程训练/推理下采集出来的 dump 目录都是 proc 加 pid 的名字，没有 rank 号；用 compare 和 graph_visualize 去比对时，工具不说「这种数据不支持」，反而正常跑完、正常出 excel、正常打印 success，只有自己去看目录名才知道结果其实不该被采信。
  trigger_surface: PyTorch 场景 + 多进程采集（拿不到 rankid）+ msprobe compare / graph_visualize 批量路径
  discovery: 2026-10-21 GitCode 历史 issue 扫描（mindspore/ms* 簇）
