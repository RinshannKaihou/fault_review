title: vllm-ascend EC memcache 按配置宽度重排多模态缓存错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: vllm
    component: ECMemcacheConnector
  behavior: ECMemcacheConnector 未跟随上游按模态实测编码宽度，仍从模型 config 推导单一宽度并 reinterpret 每个加载值：宽度不同的值被静默 reshape 或丢弃（not aligned 日志）。
effect:
  objects:
  - 输入编码
  - 性能/资源
  detail: Qwen3-Omni 视觉 DeepStack 输出 8192 宽、音频 2048，在上游 vllm#57904 之后的版本用 EC memcache 连接器加载时：宽度不符的条目一部分以错误 token 数静默进入模型，另一部分被丢弃并重新编码（延迟上升），仅一条 not aligned 日志。
  visibility: 静默错误
mitigation:
  detect: 多模态（视觉/音频宽度不同）模型 + EC memcache：比对加载条目 reshape 后 token 数与请求实际编码数；日志中 not aligned 计数。
  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/20243 （open，2026-10-29：调度器记录每个 mm_hash 的编码数，worker 按字节大小+行数推导宽度 reshape，全部按字节计算；22 UT 通过）
