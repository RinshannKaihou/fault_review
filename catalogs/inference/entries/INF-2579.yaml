id: INF-2579
legacy_ids: []
slug: vllm_rust_qwen3_coder_missing_close_swallows_param
aliases: []
title: vLLM Rust qwen3_coder 缺闭合标签吞参数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: Rust qwen_coder parser
  behavior: Rust 前端 qwen_coder.rs 在缺 </parameter> 时不把下一个 <parameter= 当作值终止符，继续把标签和后续内容并入当前值。
effect:
  objects:
  - 输出内容
  detail: 缺一个 </parameter> 时 city 值变成 "Dallas\n<parameter=state>\nTX"，state 参数丢失；Python parser 返回三个正确键；qwen3_xml 同样。
  visibility: 静默错误
mitigation:
  detect: 用缺 </parameter> 的固定输出分别跑 Python 与 Rust parser，比较 arguments；键集合与值都应不同。
  fix: 待定（issue open，未附修复 PR）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
