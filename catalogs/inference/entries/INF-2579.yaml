remarks: 与 INF-0991（Python 四族 converter 终态丢弃未闭合末参数）代码路径不同：本条是 Rust 前端把下一个标签并入前值；不建 var 关系。
evidence:
- url: https://github.com/vllm-project/vllm/issues/67923
  kind: github_issue
relations: []
original:
  mechanism: vLLM main 191e5d5df 的 Rust 前端 rust/src/parser/src/tool/qwen_coder.rs：模型输出漏一个 </parameter> 时，parser 把下一个 <parameter=...> 标签留在当前值里，下一个参数丢失，且不报错。实测缺省：city 的值为 "Dallas\n<parameter=state>\nTX"、state 丢失、unit 正常；Python qwen3_coder 返回 {city:Dallas,state:TX,unit:fahrenheit}，两者不一致。Rust 在 </function> 早于 </parameter> 时已经 fail-fast（qwen_coder_missing_parameter_end_fails_fast_after_function_end），但对下一个 <parameter= 返回错误参数；qwen3_xml 给出相同 Rust 结果。
  source: https://github.com/vllm-project/vllm/issues/67923 （open，2026-11-16，含两前端对照）
  behavior: 工具调用参数静默错值：一个参数的值里混进下一个 <parameter=...> 标签和它的内容，另一个参数直接消失，前端按错误参数执行动作或校验失败。流式与非流式都没有 error，Python 与 Rust 两个前端对同一段输出给出不同 arguments，排障时很难判断哪边是对的。
  trigger_surface: vLLM main 191e5d5df Rust frontend；qwen3_coder / qwen3_xml parser；模型输出遗漏 </parameter>。
  discovery: 2026-11-16 每日扫描
