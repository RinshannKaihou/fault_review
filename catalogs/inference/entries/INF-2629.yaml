remarks: 与 INF-1391（vLLM lightning_attn 前缀核）是同一 off-by-one 衰减机制的两套独立实现：vLLM 在 model_executor/layers/lightning_attn.py，SGLang 在 kernels/ops/attention/linear/lightning_attn.py；本条只在 linear_backend='minimax' 路径触发。
