title: SGLang lightning_attention 前缀核少一步衰减
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: sglang
    component: lightning_attn prefill 核
  behavior: _fwd_none_diag_kernel 用 q_decay=exp(-s*(off_c*CBLOCK+c))，但 KV[i] 存的是块折叠前的状态，query 实为 r+1 步后，历史项整体大 exp(s) 倍。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: linear_backend='minimax' 时新 prompt 0–255 token 正确、≥256 全错；chunked prefill 续非零 kv_history 时每个 token 都错；最终返回状态本身正确。
  visibility: 静默错误
mitigation:
  detect: 对同一 prompt 比较 minimax 与 seg_la 后端输出，或用 fp64 闭式递归核对 256 之后及续块 token；最终状态对拍不能发现该问题。
  fix: 待定（issue open；修复应把块间项改为 exp(-s*(r+1))，未核实是否已有 PR）
