original:
  mechanism: triton-ascend 3.2.2（20260611 构建）+ CANN 9.0.0，Ascend 950PR：addmm 类 kernel 用 triton.language.extra.cann.extension.extract_slice 从 x2 切出 K×BLOCK_N 的块，device_print 显示切出的张量全是 0（x2 本身非零），随后 tl.dot(x1_blk, x2_slice) 只算出部分行，acc 第 2 行起全零。M=N=K=4 的最小用例里 Triton 输出 y 的第 1、3 行为 0、第 0、2 行等于参考的第 2、4 行（整体错位一半），与 torch 参考最大误差 0.884573、精度判定 FAIL。报告者给出两条观察：extract_slice 提取的 tensor 打印全零；dot 结果与正确值错位，说明缺陷在 extract_slice 的 lowering 而不是索引或 alpha/beta 计算。
  source: 2026-06-17 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/649 （closed）
  behavior: 用 extension.extract_slice 从大张量里切块再做 matmul 的算子在 950PR 上精度对不上：输出有一半行是全零（参考非零），另一半行的值来自别的行，最大误差接近 0.88；alpha/beta 与 stride 都按标准写法给。无报错无 NaN，调试时把切片单独 store 出来会看到整块都是 0，容易误判成输入没传进去。
  trigger_surface: extension.extract_slice 取块后参与 tl.dot；950PR + CANN 9.0.0 + 3.2.2
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
