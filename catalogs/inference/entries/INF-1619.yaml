original:
  mechanism: 'PyNative 多卡训练开启 checkpoint.load_balanced: True 做断点续训时，加载阶段有 450 个参数未被装载，全部是 main_param.* / adam_m.* / adam_v.*，即整个优化器状态，数量与 checkpoint 里优化器 safetensors 的 key 数吻合。加载日志（MindSpore serialization.py）明确列出 ''For load_param_into_net, 450 parameters in the net are not loaded, because they are not in the parameter_dict''，但只是 WARNING。检查 checkpoint 目录：*-opt-*.safetensors 内容完整，metadata.json 中 adam_m/adam_v/main_param 条目均在，数据已正确落盘，是加载侧按均衡映射取分片时丢失。触发只与加载侧开关有关：remove_redundancy=false/load_balanced=false 正常，false/true 与 true/true 都复现且数值逐位相同。复现用 tests/st/test_multi_cards_cases/test_pynative/test_models/test_deepseek3/pynative_ds3.yaml，2 卡 msrun，DeepSeek-V3 小模型（12 层、hidden 1792、seq 4096、8 专家），AdamW，deterministic=true、seed=42，连续训 10 步并在第 5 步存盘后从第 5 步续训；环境 MindSpore 2.10.0 + CANN 9.1.0-beta.1 + 910B2。'
  source: 2026-08-18 GitCode mindspore/mindformers issue https://gitcode.com/mindspore/mindformers/issues/2522 （open）
  behavior: '训练 10 步、第 5 步存盘，再从第 5 步续训，第 6 步 loss 与没中断时一模一样（11.772970），从第 7 步开始一路偏高：11.786654、11.795470、11.748751、11.689173，差值从 0.02 涨到 0.07；换成 load_balanced: False 差值全部为 0。日志里只有一条常见的 ''450 parameters in the net are not loaded'' 警告，不看 checkpoint 目录不会怀疑优化器状态根本没进来。'
  trigger_surface: 'PyNative FSDP（data_parallel_shard: -1）+ checkpoint.load_balanced: True + no_load_optim: False，2 卡 910B2，DeepSeek-V3 小模型'
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
