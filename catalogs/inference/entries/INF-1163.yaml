  meta: '`infra_off`（vLLM `PEFTHelper` 两缺陷同类：①`rank_pattern`/`alpha_pattern` 被读取后丢弃，所有模块统一 `lora_alpha/r` 缩放——PEFT 文档推荐 MoE experts 用 `rank_pattern={experts: r//num_experts}` 并指向 vLLM serving，OLMoE-1B-7B（64 experts）实测 held-out PPL：PEFT 10.06 / vLLM 11.28（base 13.09），**vLLM 丢失 adapter 约 40% 增益**；把各模块缩放折叠进 lora_B 后 vLLM 恢复 10.06（②`from_dict` 只留已知键，未实现的 PEFT 特性静默加载静默错输出——`_validate_features` 只拒 DoRA/modules_to_save）） · Cov: `var:sglang_lora_adapter_use_rslora_flag_ignored_alpha_over_r_served_as_scaling`（12.42 LoRA 配置字段被忽略族——本条在 pattern 字段与未知特性两维度，跨栈同机制第三站点） · 触发 `config` · 置信度 `verified`'
  mechanism: adapter_config.json 的 per-module 缩放与特性面在 serving 侧静默坍缩为全局标量/已知子集。
  source: 'vLLM #59799（2026-10-02 open，OLMoE PPL 对照+折叠验证）+ #60223（2026-10-06 open，其他字段同类）。https://github.com/vllm-project/vllm/issues/59799'
  behavior: 无 crash——受影响 adapter 静默以错误缩放/缺特性服务，质量退化无告警。
