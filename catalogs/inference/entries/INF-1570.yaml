title: MoeInitRouting 排序键转 fp32 致静默错序
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: 通用
    component: moe_init_routing 排序
  behavior: 排序前把 int32 expertIdx Cast 到 float32 再 Muls(-1) 用硬件 Sort；float32 尾数仅 24 位，|V|≥2^24 的相邻整数舍入到同一键，偏序改变使排序结果与 int32 排序不一致。
effect:
  objects:
  - 数值结果
  detail: 1000 例中 18 例失败，全部含 |V|≥2^24 的 expertIdx（<2^24 的 951 例零失败）；18 例 expandedExpertIdxOut 全错，5 例 expandedXOut/expandedRowIdxOut 连带错；用例均返回 SUCCESS、无错误码。
  visibility: 静默错误
mitigation:
  detect: 构造 expertIdx 在 ±2^24 邻域与 int32 极限的相邻整数碰撞对（如 [16777216,16777219]），对三个输出与 int32 排序标杆逐位比对
  fix: 待定（issue closed；文档仅提示“可能存在精度问题”，未改为排序键不经 fp32 或在 GetWorkspaceSize 阶段做值域校验报错）
