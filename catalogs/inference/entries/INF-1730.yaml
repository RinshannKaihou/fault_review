original:
  mechanism: 'ops-transformer issue #5522（Ascend910B、CANN 9.2，closed）：SparseFlashMla 的 SWA/DSpark 路径在 N1=128、D=512、DSpark topk=512 且稀疏 KV 有效长度大于 128 时，重复执行结果不稳定、部分 head 出现明显精度误差。根因是 Vec1 的 tmpBuff1 被同时用作 sparse-index 输入缓冲和 Softmax 临时区：下一轮 MTE2 在写入 sparse indices 之前缺少 V→MTE2 的跨流水依赖，MTE2 提前覆盖了 V 流水仍在使用的 Softmax 临时数据，于是同一输入不同次执行读到的中间值不同。修复在 MTE2 复用 tmpBuff1 前建立 V→MTE2 依赖（PR master 12529、9.2.0 12530），验证覆盖 FP16/BF16 与稀疏 KV 有效长度 128/1024/8192，重复执行结果一致。'
  source: 2026-09-20 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/5522 （closed）
  behavior: 同一个 SWA/DSpark 稀疏 MLA 请求连续跑多次，输出会变：部分 head 与 golden 偏差明显、部分 head 又正常，换一次执行偏差位置还可能不同；没有报错、没有 NaN，只能靠重复执行比对或与独立标杆对照才能发现，并且有效 KV 长度不超过 128 时不出现。
  trigger_surface: Ascend910B + CANN 9.2 + SparseFlashMla SWA/DSpark + N1=128 + 稀疏 KV 有效长度>128 + 重复执行
