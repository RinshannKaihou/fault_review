    component: SparseFlashMla SWA/DSpark
  behavior: Vec1 的 tmpBuff1 同时用作 sparse-index 输入与 Softmax 临时区，下一轮 MTE2 写 sparse indices 前缺 V→MTE2 跨流水依赖，覆盖仍在使用的 Softmax 临时数据。
effect:
  objects:
  - 数值结果
  detail: N1=128、D=512、DSpark topk=512、稀疏 KV 有效长度>128 时同一输入重复执行结果不一致，部分 head 明显偏差；补 V→MTE2 依赖后 fp16/bf16 与长度 128/1024/8192 均稳定。
