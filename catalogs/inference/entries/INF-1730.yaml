mitigation:
  detect: N1=128 的 SWA/DSpark 用例用同一输入重复执行并逐次比对（单次对 golden 通过不代表正确）
  fix: PR 12529（master）/12530（9.2.0）：MTE2 复用 tmpBuff1 前建立 V→MTE2 依赖，保留 N1=128 原有并行度
