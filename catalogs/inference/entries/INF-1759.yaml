id: INF-1759
legacy_ids: []
slug: ops_nn_ctc_loss_v2_grad_missing_beta_term
aliases: []
title: CTCLossV2Grad 边界类别首步漏 beta 贡献项
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: CTCLossV2Grad arch35
  behavior: t=0 且 targets 首个 label 落在边界类别时，kernel 对该位置只写 exp(log_probs)*grad_out 的前向项，漏掉 -exp(res+nll-log_probs)*grad_out 的后向项。
effect:
  objects:
  - 梯度
  detail: 950PR + CANN 9.2.0-beta.1、C=8、batch2 的 t=0/c=7（=C-1）：kernel -0.1708、golden 0.4359，用例 mare 1.39（容差 1.2e-4），差异只集中在该元素。
  visibility: 静默错误
mitigation:
  detect: 用 targets 首个 label 等于边界类别（C-1）且 t=0 的用例上板比对 torch 的 _ctc_loss_backward；常规 CTC 用例通过。
  fix: 待定（issue closed，未给 MR）：grad 应为 (exp(log_probs)-exp(res+nll-log_probs))*grad_out，并补该边界用例。
