  meta: '`infra_off`（反直觉精度 bug） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
  mechanism: '**反直觉**：Llama-3-70B 在 TRT-LLM 0.21.c-rc0 上 **FP16/BF16 推理失败而 FP8 正常**。FP16/BF16 路径使用了自定义 kernel，而 FP8 路径使用不同的 kernel 实现。高精度路径（FP16/BF16）的自定义 kernel 存在缺陷，而量化路径（FP8）恰好规避了该 kernel。可能是 FP16 自定义 kernel 的数值范围保护缺失或累加精度问题。'
  source: 'TRT-LLM #16899（2026-07-28）。环境：8×RTX 6000D，CUDA 13.0。https://github.com/NVIDIA/TensorRT-LLM/issues/16899'
  behavior: FP16/BF16 推理输出错误/NaN/crash，而 FP8 量化推理正常。完全反直觉——用户会认为"更精确的格式反而更不可靠"。
  trigger_surface: TensorRT-LLM 专用；vLLM 无直接等价除非同概念
  signature: infra_off——FP16 自定义 kernel 的数值缺陷。签名形态是 FP16 路径特有的激活溢出/NaN/crash，cheap 族的 `nan_inf_flag` 在 FP16 路径上直接命中。本条的新颖度在于"高精度失败低精度正常"这一反直觉现象，编目第 7 类此前无此类条目。
  repro: 不可软件复现——需要 TRT-LLM 0.21.c-rc0 + 8×RTX 6000D + Llama-3-70B。
  discovery: 2026-07-29 每日扫描。
