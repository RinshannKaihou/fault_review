  meta: '`infra_off`（SGLang HiCache 文件后端 `batch_exists_v2()` 对混合池（KV ALL_PAGES + SWA/Mamba TRAILING_PAGES）的存在性查询取**各池最长可用前缀的 min**：对 trailing 池合法端点集合中的"洞"失明——SWA 端点 {3}/Mamba {2} 报 2（该端点无 SWA 对象，应 0）、{1,3}/{1,2} 报 2（漏掉合法公共端点 1 且 2 无 SWA 对象）；ALL_PAGES 池把 trailing 池截断到其无法服务的端点时同病。MooncakeStore 同接口已用**合法端点交集**。报告者明示本条为后端契约级错误（空文件即可复现，无需模型/加速器/有效 KV 载荷），未声称端到端模型输出错误——收录为静默损坏放大器：错误 hit → 加载不完整前缀 → 下游恢复路径消费截断状态） · Cov: `NEW`（混合池存在性查询的"端点集合代数"子签名） · 触发 `yes` · 置信度 `verified`'
  mechanism: 存在性判据把"每池最长前缀"当充分条件，未对齐到各池**合法端点集合的公共元素**；trailing 池的稀疏合法端点使 min 长度落在无对象的位置。
  source: 'SGLang #39147（2026-09-11 open，含三行端点矩阵对照、无 GPU 契约级复现与 MooncakeStore 正确实现引用；与 #38452（调度器是否查 L3）明确切割）。https://github.com/sgl-project/sglang/issues/39147'
  behavior: 无 crash——混合池前缀缓存**误报可恢复**：命中声明的前缀实际缺少某辅助池对象，恢复路径拿到截断/缺失状态（具体输出效应取决于上层是否二次校验，报告未复现端到端）。6.147（hybrid 状态注册 n-floor × 查找 n−1 错配）之后"hybrid 多池状态代数"族新成员：本条在存在性查询维度、两个后端实现分歧。
