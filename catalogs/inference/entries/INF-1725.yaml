  kind: gitcode_issue
relations: []
original:
  mechanism: PyNative 下 Cell 注册了 register_backward_hook 但输入不参与求导时，hook 被记为 unpaired，在反向结束时由 ProcessUnPairedCellHook 统一处理；它们挂在 PrimitivePy::unpair_backward_hook_grad_ 这个扁平全局静态 OrderedMap 上，不区分反向引擎。发生嵌套反向（自定义 bprop 里再调 GradOperation 或 backward）时，内层引擎处理完自己的 unpaired hook 后 clear() 清空整表，外层 hook 随之消失，外层反向结束时找不到可触发的 hook。修复为按 engine_id 的嵌套 map。环境 Ascend 910B、master。
  source: 2026-03-25 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29245 （closed）
  behavior: 在 Cell 上注册 register_backward_hook 做梯度监控，只要该 Cell 的输入不参与求导、并且网络里存在嵌套反向（自定义 bprop 内再求一次导），外层 hook 就不再被调用。日志里看不到任何错误，hook 回调就是没执行，监控面板上这一层的梯度数据直接缺失；单层反向不受影响。
  trigger_surface: PyNative + register_backward_hook + 嵌套 GradOperation/Tensor.backward；输入不参与求导的 Cell
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
