original:
  mechanism: cann/ops-transformer 的 aclnnCompressorGrad 在 TH 布局下的输入校验缺失：x 为 [T,H] 时 cuSeqlens 是 [B+1] 前缀和，资料要求「第一位必须为 0、后一个元素不小于前一个」。实现不校验首元素：把首元素从 0 改成 1（cuSeqlens=[1,4]）后，第一段、第二段均返回 0，回读 dX 4096/4096 个元素全为 0（对照组 4096/4096 非零），即非法 batch 边界被接受、kernel 以错位区间启动、产出整块 0 梯度且不报错。环境：Ascend 950PR（Ascend950PR_9579）、CANN 9.2.0-beta.2、attention/compressor_grad @ 45a09b29。issue 附完整两段式 C++ 复现（基线/缺陷组各一次调用、非零计数判读）。compressor 是 lightning indexer 类模型的 KV 压缩组件，其梯度全 0 会让对应可训练参数（wkv/wgate 等）在该步得不到更新，训练中静默丢梯度。
  source: GitCode issue https://gitcode.com/cann/ops-transformer/issues/6859 （open，2026-10-29，含完整复现脚本）
  behavior: 调用 aclnnCompressorGrad（TH 布局变长序列）时，若 cuSeqlens 首元素不是 0（例如上游代码 off-by-one 生成 [1,4]），接口两次调用都返回成功，但输出梯度 dX 整块全 0——该 micro-batch 的输入梯度全部丢失，训练曲线无任何报错提示，只是这些参数更新变慢/失效；正确行为应是返回 161002 参数错误。
  trigger_surface: Ascend 950PR / CANN 9.2.0-beta.2；aclnnCompressorGrad TH 布局；cuSeqlens 首元素非 0 的非法前缀和（上游序列边界代码 bug 或构造错误时触发）；训练反传为主。
  signature: cuSeqlens 首元素非 0：rc=0 且 dX 全 0。
  repro: issue 附自包含 repro.cpp（基线/缺陷组对照）。
