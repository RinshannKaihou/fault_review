    component: compressor_grad TH 布局校验
  behavior: x 为 TH 布局时不校验 cuSeqlens 前缀和首元素（资料要求为 0）：首元素改 1 后两段返回 0，kernel 以错位区间启动，dX 4096/4096 全 0 且返回成功。
