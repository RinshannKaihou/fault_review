title: 睡眠丢弃 KV 池误删常驻元数据致唤醒后错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: NPUWorker kv_cache 内存池
  behavior: initialize_kv_cache 整段被包进可丢弃 kv_cache 池，attention metadata、block table 与 graph 常量继承 kv_cache 标签，level-1 sleep 释放存储、地址不变。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 唤醒后 ACL graph 仍指向已回收复用的地址，post_kv_cache_wake_up 重建存储又替换了 graph 已捕获的份；公开 sleep/wake 接口无任何异常，继续推理的结果已错。
  visibility: 静默错误
mitigation:
  detect: sleep→wake_up 后与未睡眠实例比对同 prompt 输出；核对 kv_cache 标签覆盖的张量是否只含 backing KV 页
  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/16096 （issue 已 closed，未核实是否已合入发布）
