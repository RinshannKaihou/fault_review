  detect: 对比 prefill 与 decode 的 TP 配置，出现 hybrid KV group + MLA 时校验 num_group_pulls 与 MLA rank 选择结果是否一致；在 start_load_kv 前加断言日志
  fix: 待定；作者称已有验证过的 MLA group-pull 修复可在 0.22.1rc1 cherry-pick，并明确警告不要只删断言——选错远端 rank 会拿到不完整 KV 变成静默精度错误
