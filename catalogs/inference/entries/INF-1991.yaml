original:
  mechanism: 'issue #11877 记录 Kimi K2.6 W4A8 在 vLLM 0.22.1 + vllm-ascend 0.22.1rc1 + Mooncake 的 PD 分离部署下，prefill 用 TP=8、decode 用 TP=2 的非对称拓扑。decode 侧能成功找到远端 KV cache，但在构造 hybrid KV group 拉取元数据时崩溃：MooncakeConnectorWorker.start_load_kv → _get_kv_split_metadata → _get_hybrid_remote_rank_group_pulls() 把当前 Attention KV Group 的 num_group_pulls 算成 4，而 MLA 的通用 rank 选择逻辑只返回 1 个 prefill rank，数量不一致触发断言，整个 EngineCore 退出，KV 传输尚未开始。相同模型、拓扑、配置在 v0.20.2rc1 验证正常，作者据此判断是 0.22.1rc1 引入 Hybrid KV Group 处理后的回归。'
  source: 2026-07-12 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/11877 （open）
  behavior: PD 分离服务在 decode 侧刚收到请求就整体退出：日志显示已经找到远端 KV，随后是 hybrid KV group 元数据构造处的断言与 EngineCore 退出，请求全部失败；把 prefill/decode 的 TP 改成对称或回退旧版本就能正常服务。
  trigger_surface: MLA 模型（Kimi K2.6 W4A8）+ Mooncake PD 分离 + prefill 与 decode 的 TP 不一致（8 vs 2）+ prefix caching
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
