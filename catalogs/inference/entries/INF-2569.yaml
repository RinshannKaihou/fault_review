original:
  mechanism: cann/ops-transformer attention/block_sparse_attention/ 三接口共用 kernel：op_kernel/block_sparse_attention_kernel_regular_arch22.h L497-499 在 curSelectNum==0 时 continue，O/lse 均不写，输出保留未初始化缓冲；golden 语义为 O=0、lse=-inf。实测镜像 cann:9.3.0-910b-weekly.20261104、Atlas A2 910b3：V1 51/70 FAIL、V2 58/70（三次 58/48/51）、V3 32/40 FAIL；V3 最脏 ~1.997e11（bf16 哨兵门限 2^-6）。F17 的 40 条 0/1 混合 mask 部分选择用例全部 PASS（max_abs 1.40e-5~2.49e-3），反向锁定缺陷只在空选择分支；设备侧 mask→selectIdx 转换、mmad gather 与 golden 均核对无误。V1 同配置脏残值 0.00766 恰低于门限而名义 PASS，V3 同配置 1.997e11 硬 FAIL。
  source: https://gitcode.com/cann/ops-transformer/issues/7689 （open，2026-11-16，含 V1/V2/V3 三批实测与源码锚点）
  behavior: blockSparseMask 全零时 attention 输出不是 0，而是上一轮遗留的随机内存值：实测可达 2e11，也可能恰好是 0 而让测试通过。同一份输入重复跑得到不同结果，调用方无法区分“真的算出 0”和“根本没写”；判 PASS/FAIL 取决于未初始化缓冲内容。
  trigger_surface: blockSparseMask 全零（参数域内合法，语义为空选择）；B=1、任意 dtype/D/block shape；aclnnBlockSparseAttention/V2/V3；A2 910b3 + CANN 9.3.0 weekly 20261104。
