title: vLLM Kimi-K3 FP8 KV 致 GSM8K 静默塌陷
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: vllm
    component: FP8 MLA prefill 路径
  behavior: Kimi-K3 在 MI355X 上以 --kv-cache-dtype fp8 服务时，ROCM_AITER MLA FP8 prefill 路径产出错误 KV，文本流畅但大面积答错，无任何报错或告警日志。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 8-shot GSM8K 前 200 题 greedy 从 0.975（BF16 KV）塌到 0.305（FP8 KV），134 题仅 BF16 正确；SGLang 同 checkpoint FP8 KV 0.950，指向 vLLM AITER MLA FP8 prefill 路径。
  visibility: 质量退化
mitigation:
  detect: 同 prompt BF16/FP8 KV 对照评测可检出；运行时无检测（未评估）
  fix: 规避：--kv-cache-dtype auto 或目标+draft KV 均 auto（实测 0.975/0.980）；上游修复未定位（issue open，报告者已排除 prefix caching/SITUV2/DSpark/load-format 等因素并锁定 FP8 MLA prefill PS buffer 日志为唯一差异）
