original:
  mechanism: 'vllm/vllm issue #64106（2026-10-27，open）：8×AMD MI355X（gfx950）TP8，vllm/vllm-openai-rocm:nightly-rocm72（vLLM 0.32.1rc1.dev602+g5d35ce3934，ROCm 7.2.3、aiter 0.1.26、triton 3.8.0、transformers 5.20.2），moonshotai/Kimi-K3。--kv-cache-dtype fp8 时 8-shot GSM8K 前 200 题 greedy 0.305，--kv-cache-dtype auto 时 0.975，其余 flag 完全相同；200 题中 134 题仅 BF16 KV 正确、0 题仅 FP8 正确。单变量扫描：关 prefix caching 0.325、SITUV2 a8w4/a16w4 0.315/0.285、DSpark K=7 配置 0.345、load-format auto 0.310——均不动结论；目标+draft KV 全 auto 恢复 0.980。仅 FP8 运行打印 [rocm_aiter_mla.py:1268] FP8 MLA prefill PS buffers allocated（Kimi-K3 每 rank 12 头 padding 到 16，#51040），报告者据此把范围收窄到 AITER FP8 asm MLA prefill 路径，但未做逐 kernel 分离，根因未最终定位。FP8 KV 配置来自 vllm-project/recipes models/moonshotai/Kimi-K3.yaml 的 MI355X 单机 TP8 姿令（InferenceX AgentX lane），照抄配方即中招；SGLang 同卡同 checkpoint FP8_e4m3 KV 0.950（无推测）/0.970（DSpark），证明 checkpoint 与硬件可容忍 FP8 KV。'
  source: https://github.com/vllm-project/vllm/issues/64106
  behavior: 在 MI355X 上按官方 Kimi-K3 配方启动 vLLM 并加 --kv-cache-dtype fp8 后，服务 HTTP 200、无报错无告警、输出流畅，但数学题大面积答错：8-shot GSM8K 前 200 题 greedy 准确率从 0.975 掉到 0.305，同一题的答案往往前几步推导一致、随后一步算错走向错误结论；换回 --kv-cache-dtype auto 立即恢复。所有只看服务日志和输出流畅度的监控都无法发现。
  trigger_surface: AMD MI355X（gfx950）+ TP8 + moonshotai/Kimi-K3 + --kv-cache-dtype fp8 + ROCM_AITER_MLA 后端（FP8 asm MLA prefill）；vLLM nightly-rocm72（0.32.1rc1.dev602）。recipes 仓库 Kimi-K3.yaml MI355X 配方直接触发。
  discovery: 2026-10-28 每日扫描
