title: 编译期 Philox 重放与 eager RNG 流不同步致 mask 错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: Inductor RNG codegen
  behavior: Inductor 编译期对 uniform/rrelu_with_noise 的 Philox 重放未与 NPUGeneratorImpl 状态推进对齐，compiled 与 eager 消耗不同步的 RNG 流，mask 错位。
effect:
  objects:
  - 数值结果
  detail: 9 例 opinfo（dropout2d/3d、alpha_dropout、feature_alpha_dropout、rrelu）失配率恰好 60%（15/25、75/125、375/625），absdiff 最高 6.05；fallback_random=True 后逐位一致。
  visibility: 静默错误
mitigation:
  detect: 同 seed 下 compiled 与 eager 逐位比对 dropout 族输出；或设 torch._inductor.config.fallback_random=True 复跑，若转为逐位一致即命中该缺口
  fix: 待定（issue open）：把 bernoulli 族的 unsafe_rng_fallbacks 推广到 uniform（含各 overload）与 rrelu_with_noise，或提供 graph-safe 的 PhiloxNpuState 重放使 codegen 与 eager 消耗同一 RNG 流
