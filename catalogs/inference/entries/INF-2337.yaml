title: ATC 静默把 Resize half_pixel 换成 asymmetric
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: cann
    component: ATC ONNX Resize 算子映射
  behavior: ATC 的 ONNX 解析层未把 coordinate_transformation_mode='half_pixel' 映射到算子的 half_pixel_centers=True，静默落入默认 False（asymmetric 语义）。
effect:
  objects:
  - 数值结果
  detail: half_pixel 模式的 Resize 经 ATC 转 .om 后输出逐位等于 asymmetric 语义；转换无报错无警告，输出数值本身自洽（另一种合法插值语义）；报告者分割模型全量评测 S-measure 下降 0.02。
  visibility: 静默错误
mitigation:
  detect: ATC 转换后的 .om 输出与 onnxruntime 同输入逐位比对；重点测 align_corners=False 的 bilinear Resize。
  fix: 待定（issue open；算子实现层 resize_bilinear_v2_d.py 自带 half_pixel_centers 开关，修复点在 ONNX 解析层映射，未见修复 MR）
