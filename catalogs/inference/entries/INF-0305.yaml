  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off`（靶向 bit-flip → LLM 特定输出操纵） · Cov: `var:tbt_targeted_bit_trojan` · 触发 `partial` · 置信度 `documented`'
  mechanism: TFL（Targeted bit-FLip）攻击框架：通过梯度引导定位 LLM 权重中的**高敏感 bit**，在极稀疏翻转预算下（个位数 bit）定向操纵模型输出。与 3.3 `tbt_targeted_bit_trojan`（靶向 trojan 注入）同族，但 TFL 强调**翻转而非注入**：不修改权重数值结构，仅翻转现有 bit 的极性，使模型在特定输入上产生攻击者指定输出，同时保持整体功能与 perplexity 不变。实验在主流开源 LLM 上验证了从权重扰动到输出操纵的完整链路。
  source: 'Liu et al., "TFL: Targeted Bit-Flip Attack on Large Language Model", arXiv:2602.17837（2026-02-19）。http://arxiv.org/abs/2602.17837v1'
  behavior: 无 crash、无 NaN。少量权重 bit 翻转 → 特定输入上输出被定向操纵（攻击者指定响应），非目标输入功能保持正常。属 BFA 家族「靶向 bit 翻转 → LLM 输出操纵」已知类的新实例。
  trigger_surface: 3.19 `weight_bitflip` 复现路径 + 梯度引导定位（需反向传播）
  discovery: 2026-08-04 每日扫描（arxiv 2602.17837）。
