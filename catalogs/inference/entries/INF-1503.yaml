    stack: pytorch
    component: eq/ge/maximum dtype 推导
  behavior: 沿用 other.dim()==0 且非 NPU 的旧 CPU scalar 特判与 IsCPUScalar 转 scalar 逻辑，比较与 max/min 算子在混合 host/device 输入下 dtype 推导与标杆不一致。
effect:
  objects:
  - 数值结果
  detail: Ascend950 上 self 为 NPU、other 为 CPU（含 0 维 CPU scalar tensor）时，ge/le 与 maximum/minimum 输出 dtype 与 CPU/CUDA 标杆不同，结果按错误 dtype 解释；反向组合缺校验。
  visibility: 静默错误
mitigation:
  detect: 在 950 上构造 self(NPU)+other(CPU) 与 self(CPU)+other(NPU) 混合输入，比对 eq/ge/gt/le/lt/ne 与 maximum/minimum（含 out=/inplace）的输出 dtype/device/数值
  fix: 修复 PR https://gitcode.com/Ascend/op-plugin/pull/4715 （issue 为 closed；合入与发布状态未核实）
