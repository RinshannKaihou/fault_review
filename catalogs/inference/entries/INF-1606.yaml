title: 轴对齐调轴使中间张量 store/load 索引序错乱
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: ascendc 后端轴对齐调轴
  behavior: 轴对齐调轴改写中间变量的 store 与 load 索引顺序时两边不一致，transpose 语义在 codegen 后丢失，输出按未转置布局读写。
effect:
  objects:
  - 数值结果
  detail: 打开 gelu decompose 后，用 ascendc 编译含 transpose 且后接布局敏感算子的模型时，图模式输出与 eager 对不上；数值偏差稳定存在但不夸张，不报错、不 NaN，形状正确，只有 allclose 或下游 loss 异常才会发现。
  visibility: 静默错误
mitigation:
  detect: 对该类模型同时跑 eager 与 npu_backend=ascendc，比较 max_err；关闭 gelu decompose 可作对照
  fix: 待定（issue 只说明调轴方法与 index 序不一致，未附修复 PR 或补丁）
