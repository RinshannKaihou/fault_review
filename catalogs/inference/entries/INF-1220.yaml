original:
  category: cat15
  section: 第 15 类 · 幻觉 / 忠实性 / 对齐（model_on）— 检测器已验证的信号
  meta: '`model_on` · Cov: `var:15.10` · 触发 `n/a` · 置信度 `verified`'
  mechanism: MERGED 条目，合并了两个子故障：(1) chat-model miscalibration —— RLHF 训练诱导的过度自信，模型对错误答案赋予高概率；(2) knowledge-cutoff stale fact —— 模型按训练截止时的旧事实作答且毫不犹豫。共同机制是模型在某一主题上「一贯地错」（学到的误解或对齐诱导的过度自信），输出熵低而答案错，正好是 15.1 confabulation 的对偶极。
  source: Kadavath et al. arXiv:2207.05221。Xiao et al. ICML 2025 (arXiv:2505.01997)。Plaut TMLR 2025 (arXiv:2402.13213)。Mallen NAACL 2024 / RealTime QA。源文档未给出这几篇的 URL。
  behavior: 自信陈述的谬误，且重采样不改变答案；lexical / predictive entropy 都很低，因此朴素的熵检测器直接 MISS。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。最终层隐藏态沿一条已学到的 "truth / mass-edit" 方向落在错误的一侧——签名是方向性的而非幅度性的，属 geometric 族（truth-direction 线性探针，或 EigenScore 聚类）。statistical / infotheoretic 族在这条上系统性漏检（这正是与 15.1 互补的地方：熵低不代表健康）；cheap 族同样漏检。
  repro: 无模型改动，提示集 + 探针——构造模型「一贯答错」的题目集（含知识截止后事实），先在 calibration split 上拟合 truth-direction 线性探针，再在 test split 上评估；partial 的原因是需要可靠的错误标签与足够大的一致性错误样本量，源文档未给出构造该题集的具体配方。
