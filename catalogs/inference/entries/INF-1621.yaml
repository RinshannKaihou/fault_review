title: 从 HF 检查点续训时 fp32 主权重未随模型参数刷新
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: mindspore
    component: HF loader 主权重回填
  behavior: HF checkpoint 不含优化器状态，fp32 master weights 已在加载前按随机初始化建好；no_load_optim=False 时判定无需刷新，首次 optimizer.step() 用旧主权重覆盖已加载参数
effect:
  objects:
  - 优化器状态
  - 模型权重
  - 训练信号
  detail: step1 loss 一致（11.818862），step2 从 11.710443 偏到 11.811662，之后与 no_load_optim=True 分叉；native 完整续训不出现，大规模训练下进一步表现为 OOM
  visibility: 静默错误
mitigation:
  detect: 同种子同数据跑 no_load_optim=True/False 两步 A/B，比较第一次 optimizer update 前后的 model/master weights
  fix: 分支 fix/hf-checkpoint-master-weight-sync：loader 返回是否真实加载优化器状态，全部本地 chunk 加载完后仅对未加载优化器状态的场景刷新一次 fp32 master weights（未核实合入）
