id: INF-1809
legacy_ids: []
slug: acldatabuffer_length_ignored_read_past_declared
aliases: []
title: aclDataBuffer 声明长度小于 OM 需求时读到界外残留
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: aclDataBuffer 长度校验
  behavior: 执行时按 OM Data 节点的 dtype/shape 决定读取长度，不比对调用方 aclDataBuffer.length，声明 4 字节仍按 DT_INT64[1] 读 8 字节。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: OM 要 8B、只声明 4B 时高 4B 取到同 device 地址释放后重分配的残留，SequenceAt 收到 index=20615843020800 后报 input index out of range；残留刷 0 则 index=0、执行成功。
  visibility: 静默错误
mitigation:
  detect: 传 aclDataBuffer.length 小于 OM dtype 宽度的输入，观察下游算子读到的值；或用释放后同址重分配写入特征值确认读到界外字节
  fix: 待定（issue closed；建议在模型执行入口、host 化拷贝前或算子读取前按 aclDataBuffer.length 校验有效长度）；规避：调用方按 OM dtype 宽度传满字节
