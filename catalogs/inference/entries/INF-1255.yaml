original:
  category: KV4
  section: KV §4 cross-request（跨请求，缓存键 / 汏染）
  meta: '`infra_off` · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 在 Jamba / NemotronH 这类混合堆栈里，attention 层用分页 KV block，而每个 Mamba 层的 conv+SSM 状态是一个不受 block manager 管理的 per-request 张量。在 prefix caching + speculative decode 下，attention KV 会按 block index 被 gather / 回滚，而由 `selective_state_update` 更新的 SSM 状态既不知道 gather 索引、也不会回滚被拒绝的 token → 两条状态流推进到不同的位置。
  source: 'vLLM RFC #17140；vLLM #39809（NemotronH prefix-cache + MTP spec-decode 崩溃）。'
  behavior: '#39809 记录的是 NemotronH 在 prefix-cache 与 MTP 推测解码同时开启时崩溃；非崩溃路径下两类层对同一 token 索引持有不同的历史。'
  trigger_surface: KV 类：需具体缓存时序
  signature: off-manifold（infra_off），且签名形态是**层间不一致**：同一 token 索引处，attention 层与 mamba 层的隐藏态轨迹相互偏离。捕获者：trajectory（按层族分组的轨迹对比，是唯一天然对得上这种签名的族）、geometric（跨层方向一致性）。漏检者：任何把全部层混在一起做汇总的 statistical / spectral 指标——两类层各自看都健康，异常只存在于它们的**相对**关系里。纯 attention 架构没有 Mamba 层，该签名在标准稠密模型上原理上不可复现。
  locus: '`cross-request`'
  priority: '`low`'
