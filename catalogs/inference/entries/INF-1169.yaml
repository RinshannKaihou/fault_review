  meta: '`ambiguous` · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: Gemma2/Gemma3 在 softmax **之前**施加 tanh soft-capping（attn cap = 50，lm_head cap = 30）：`logits = tanh(logits/cap)*cap`。省略它会让 logits 无界。关键在于 SDPA / FlashAttention **无法表达** softcap，所以任何把 Gemma2 路由到 raw SDPA/flash 的执行路径都会静默地丢掉这一步。
  source: 'Unsloth `gemma2.py`（原文逐字："SDPA does not support softcapping"）；flash-attention #1016（Gemma2 上使用 flash 时 100% 随机输出）；HF gemma-2-9b-it discussion #9；HF blog "Welcome Gemma 2"。'
  behavior: 细微的分布偏移 → 自信地给出错误答案或陷入重复；不崩溃。
  trigger_surface: 实现 patch/错误配置
  signature: 偏 on-manifold，但是**系统性**的。签名集中在 LM-head / 最终隐藏态以及注意力模式的能量分布上：缺失 softcap 会抬高 max attention-logit 的量级，并改变 per-layer 的 attention-entropy。作用于最终隐藏态的 statistical（per-layer attention-entropy / logit-magnitude）或 spectral 度量能抓到；中间层隐藏态只受到轻微影响，因此逐层 geometric 度量在浅层大概率漏检。
  repro: 可软件复现（`yes`），单钩子即"移除 tanh soft-cap"这一步即可；需要 Gemma 系（带 softcap 的）模型——非 Gemma 架构本来就没有 softcap，无从移除。
