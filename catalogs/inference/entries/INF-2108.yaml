  mechanism: FlashInfer FA2（BatchPrefillWithRaggedKVCacheWrapper backend='fa2'，JIT 编译自 main 23f3e8f63b66e9f42f24ac4e3e71dc7c38afbd00，metadata 0.7.2，独立 JIT 缓存）在有限输入下产出 NaN：当早期主导 key 使跨后续 KV tile 的 running maximum 保持不变时，online softmax 的重缩放分支产生 NaN。最小复现（A100-SXM4-80GB、CUDA 12.9、PyTorch 2.13.0+cu129，纯合成张量无模型权重）：q=torch.full((1,1,128),32768,bf16)、k/v=torch.zeros((4096,1,128))、k[0]=160、v[0]=1；wrapper.plan 后 run(return_lse=True)，disable_split_kv=True（单 running state 处理全序列）。期望（独立全 KV FP64 参考）：输出精确 1、LSE 有限；实测全部 128 个输出 NaN、LSE -inf。
  source: https://github.com/flashinfer-ai/flashinfer/issues/6907（open 0 评论，2026-10-21 每日扫描，正文全文已读）
  behavior: 用 FlashInfer 的 FA2 ragged prefill（JIT 版）在序列前部有一个极大 key、其后 key 分数都很小的输入上跑 attention：输出整段 NaN、LSE 变 -inf，而数学上输出应为确定的有限值；同样的输入开 split-KV 或换参考实现即正常。表现为模型在这些输入模式下一输出就 NaN，且无告警。
  trigger_surface: A100（SM80）实测、flashinfer main 23f3e8f6/0.7.2 JIT、BatchPrefillWithRaggedKVCacheWrapper backend='fa2'、disable_split_kv=True、早期 dominant key 模式。
