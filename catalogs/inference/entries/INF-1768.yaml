    component: FIA V4 TND 通路
  behavior: TND 布局下 numKeyValueHeads 缺省/0（文档定义 0=key/value 头数等于 query）时静默返回错误结果；该参数在 TND 通路无校验，不整除与大于 numQueryHeads 均放行；BNSD 布局逐位正确
effect:
  objects:
  - 数值结果
  detail: 910B2+CANN 9.2.0，TND+numKVHeads 缺省/0 时无报错静默出错：MHA 8192/8192、GQA 524288/524288、变长 96.9% 全零，GQA N8 KV1 未初始化显存 maxabs 4.30；同输入重复调用两形态交替；显式传实际头数或 BNSD 则正确
  visibility: 静默错误
mitigation:
  detect: 与 fp32 参考实现做 sha1 指纹/max diff 比对；输出全 0 或 ±512 量级垃圾为特征
