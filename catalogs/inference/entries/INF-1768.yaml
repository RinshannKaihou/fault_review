original:
  mechanism: aclnnFusedInferAttentionScoreV4（torch 入口 torch_npu.npu_fused_infer_attention_score_v2），Ascend910B2、CANN 9.2.0、torch_npu 2.12.0.post3。TND 布局下 numKeyValueHeads 取默认 0 时静默返回错误结果：多数场景输出全 0（MHA S64N2D64 8192/8192 零；S64N8D128 65536/65536 零；变长 [64,128] 96.9% 零；GQA 官方支持组合 64:8 全 0 524288/524288），部分场景输出未初始化显存（GQA N8 KV1 maxabs 4.30、0.39% 零）；同一输入连续调用结果在「全 0/垃圾值」两种形态间交替（重复 8 次仅 2 种 sha1 指纹）。BNSD 布局同参数逐位正确（max diff 3.2e-4）。schema 默认值即 num_key_value_heads=0 且接口文档写明 0 表示 key/value 与 query 头数相等——属布局间实现不一致而非入参误用。附带：TND 通路该参数完全无校验（kv=1/kv=3/kv=4 同输入实测均不报错、错误值且被截断，不整除与大于 numQueryHeads 均放行）。V3 入口 npu_fused_infer_attention_score 同样复现。
  source: 2026-10-20 每日扫描；https://gitcode.com/cann/ops-transformer/issues/6353
  behavior: 用 npu_fused_infer_attention_score_v2 且输入布局为 TND、不显式传 num_key_value_heads（或传 0，文档定义 0=与 query 头数相等）时，attention 输出静默错误：常见整块全 0，有时是未初始化显存垃圾（fp16 ±512 量级），同一输入多次调用结果在两种错误形态间跳变；显式把 num_key_value_heads 传成实际头数后逐位正确。MHA、变长 batch、GQA 官方组合都中，无任何报错。
  trigger_surface: Ascend910B2 + CANN 9.2.0 + TND 布局 + numKeyValueHeads 缺省/0；V3 入口同样受影响
  discovery: 2026-10-20 每日扫描
