title: ttnn.logit 输出 dtype 与输入不同时半数元素错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: logit 两段 kernel scratch
  behavior: compute_kernel_hw_startup 按 dfb::out 配 packer，tmp0 却按输入格式分配；阶段1按输出格式 pack、阶段2按输入格式 unpack，DataFormatReconfig 全程 Disabled
effect:
