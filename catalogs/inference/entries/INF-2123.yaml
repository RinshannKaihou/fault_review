original:
  mechanism: tt-metal main 84ddc0ae9b（ttsim v1.13.0 Blackhole）ttnn.logit(x, output_tensor=o) 当预分配输出的 float dtype 与输入不同（unary.cpp L45-55 显式允许 mixed-float）时返回 -inf 与垃圾：logit_kernel.cpp 分两阶段经 scratch buffer tmp0——阶段1拷贝输入（可选 clamp）pack 进 tmp0，阶段2 unpack tmp0 算 log(x/(1-x))。硬件以 compute_kernel_hw_startup(dfb::in, dfb::out) 配置一次、packer 用输出格式，每步 DataFormatReconfig::Disabled，而 unary_program_factory.cpp L519-525 给 tmp0 按输入的 page size/data format 分配。于是阶段1按输出格式 pack、阶段2按输入格式 unpack：bf16→fp32 时 1024 元素 bf16 读覆盖 fp32 流前 2048 字节——偶元素是 fp32 低半（来自 bf16 的值为 0 → logit(0)=-inf）、奇元素是高半即原 bf16 值移位到 2k+1；主机字节重解释模型精确复现全部 1024 输出。fp32→bf16 时读前半为 bf16 对、后半为陈旧 L1（451 非有限）。实测表：bf16→bf16 正确 0/1024 非有限；bf16→fp32 logit 512/1024 非有限、1015 元素 abs err>0.05。[INFERENCE 未验证] fp32 输出时 packer 写 4096B tile 进 2048B 槽，多 tile 输入疑写穿 tmp0 尾部。测试缺口：tests/ttnn 无 mixed output_tensor 的 logit 测试。
  source: https://github.com/tenstorrent/tt-metal/issues/62019（main 84ddc0ae9b + ttsim v1.13.0 Blackhole 确定性复现）
  behavior: 预分配与输入 dtype 不同的输出张量调用 ttnn.logit（如 bf16 输入配 fp32 输出）时，约一半元素返回 -inf、99% 元素误差大于 0.05：偶数位是 logit(0)=-inf，奇数位是正确值被移到错误下标；fp32→bf16 方向近半元素为非有限垃圾值。同 dtype 输出完全正确，相同混合配置下 60+ 个其他一元算子也正确。
  trigger_surface: ttnn.logit 显式 output_tensor 且 float dtype 与输入不同；Blackhole ttsim 确定性、机制 host 侧与硅无关
  discovery: 2026-10-22 每日扫描
