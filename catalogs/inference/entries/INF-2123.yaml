  detect: same-dtype 输出对照或 ttnn.log 同配置对照（均正确）
  fix: 'issue 建议按输出格式分配 tmp0 并在阶段2重配 unpacker 或对 tmp0 pack/unpack 启用 DataFormatReconfig；测试覆盖混合 output_tensor dtype；修复未提交（PR #59167 不触此文件）'
