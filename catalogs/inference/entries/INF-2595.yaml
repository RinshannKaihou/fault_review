title: Qwen2 eager fp16 左 padding 全掩码行 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 模型定义
    stack: transformers
    component: Qwen2 eager attention
  behavior: eager attention 把 fp16 加性 mask（-65504）加到 fp16 scores；全掩码行任一分值低于约 -16 即舍入为 -inf，softmax 变 NaN，下一层 padding key 污染整条序列。
effect:
  objects:
  - 输出分布
  - 输出内容
  detail: Qwen2.5-0.5B fp16/eager、34 个左 pad token 时最后 token logits 为 NaN，generate() 返回 [0,0,0,0,0]；pad 22–40 触发、0–21 有限；SDPA/bf16 正常；fp32 加 mask 或清零全掩码行权重可修复。
  visibility: 数值异常
mitigation:
  detect: 左 padding 批在 eager fp16 下检查 logits 是否有限；覆盖 pad 数 22–40；与 SDPA/bf16 对照
  fix: 待定（open；报告者给出两种已验证修复：mask 在 fp32 相加、或将无允许 key 的 query 行 softmax 权重清零；尚无 PR）
