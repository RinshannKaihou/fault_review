remarks: 与 INF-2158（Qwen4-Exp eager 左 padding 批 NaN logits）同属 eager 加性 mask + 全掩码行 → NaN 的机制；本条为 Qwen2 fp16 下 finfo.min 舍入到 -inf 的具体路径，历史条目为 Qwen4-Exp CPU FP32 的 mask 加法异常。
