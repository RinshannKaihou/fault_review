pattern: PAT-INF-0212
original:
  mechanism: transformers 5.23.0、torch 2.11.0+cu128、Qwen2.5-0.5B、`attn_implementation='eager'`、fp16。eager attention 把加性 mask 直接加到 fp16 scores，masked 项为 `torch.finfo(torch.float16).min=-65504`；在该值附近相邻 fp16 间隔 32，score 低于约 -16 时 `score + (-65504)` 舍入为 -inf。左 padding 的 query 行没有任何允许的 key，整行被 mask，layer 1 head 9 的 34 个 padding query 行原始 score 最高 -17.375，全部变成 -inf；softmax 对全 -inf 行返回 NaN，layer 2 中 padding 位置的 key 变成 NaN，NaN + mask 仍是 NaN，最终整条序列（含真实 token）的 logits 都变 NaN。复现：3-token prompt `" used to be"` 左 pad 34 个 token，最后 token logits `torch.isfinite(...).all()` 为 False，`generate()` 返回 `[0,0,0,0,0]`；pad 0–21 有限、22–40 为 NaN；SDPA/bf16 有限。两种修复在 prefill+15 decode 上与 fp32 eager 对照：mask 在 fp32 相加、或把无允许 key 的 query 行 softmax 权重清零，均消除 NaN 且未受影响行逐位不变。
  source: https://github.com/huggingface/transformers/issues/51079（open，2026-11-22，含 pad 数阈值、根因测量与两种修复）
  behavior: Qwen2.5 用 eager attention + fp16 做左 padding 批量生成时，只要 pad token 数达到 22–40，最后 token 的 logits 就变成 NaN，`generate()` 不报错，直接返回一串 token 0。同一 prompt 不加 padding 时正常，换 SDPA 或 bf16 也正常；pad 较少（0–21）时也正常，所以是一个随序列内容/长度变化的阈值型静默故障。NaN 会从 padding 行传播到下一层的所有 key，最终污染真实 token 的输出分布。
  trigger_surface: transformers 5.23.0、torch 2.11.0+cu128、Qwen2.5-0.5B、attn_implementation='eager'、fp16、batch 含 22–40 个左 padding token。
  discovery: 2026-11-26 每日扫描
