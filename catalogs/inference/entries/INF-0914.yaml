original:
  category: cat9
  section: §3.8 输入层故障（tokenizer / 模板 / RoPE）
  meta: '`infra_off`（vLLM v0.29 起 HunYuan Dense V1 走 Transformers 后端（#53615），dynamic-rope checkpoint 的 `@dynamic_rope_update` → `dynamic_frequency_update` 中 `seq_len = torch.max(position_ids) + 1; if seq_len > max_seq_len_cached:`——**`Tensor.__bool__` 强制 D2H host 同步**，在 CUDA graph capture 段内非法 → `cudaErrorStreamCaptureInvalidated` 于 capture_end、启动死亡。FULL/PIECEWISE/FULL_AND_PIECEWISE 全模式失败（PIECEWISE 在 torch.compile 下 19/19 过，但 FULL 相/profile_cudagraph_memory 仍跑 raw forward 而死）。**vLLM `max_model_len <= max_position_embeddings` 使整个动态更新对本 checkpoint 实为 no-op——检查本身仍同步**。≤0.28 原生 `hunyuan_v1.py` 在 `__init__` 静态算 NTK-alpha inv_freq、CUDA graph 正常（版本回归）。workaround：`--compilation-config ''{"cudagraph_mode": "NONE"}''`（启动成功、decode 性能受损）） · Cov: `NEW`（host-sync 于 capture 段——no-op 检查的副作用子签名） · 触发 `config` · 置信度 `verified`'
  mechanism: Python 层 `if tensor > scalar:` 触发隐式 D2H 同步——该模式在 eager 下无害，但在 stream capture 中是非法操作；危害的隐蔽性在于被守卫的分支**对新配置根本不会触发**（vLLM 不超 max_position_embeddings），即同步代价买的是一个永假的检查。9.24（YaRN 别名二次缩放 RoPE cache 越界）与 9.26（fault_rope 原型族）之后 RoPE 配置族新成员：本条在**RoPE 更新钩子的执行环境假设**维度（host 活动于 capture 段）。
  source: 'vLLM #57890（2026-09-21 open，含 capture 失败栈（modeling_rope_utils.py:100 ← modeling_hunyuan_v1_dense.py:436）、回归定位（≤0.28 静态 inv_freq）、全 cudagraph 模式矩阵、workaround 与修复方向）。https://github.com/vllm-project/vllm/issues/57890'
  behavior: '启动期 fail-loud 死亡（AcceleratorError: operation not permitted when stream is capturing）——非静默错值，但表现为"模型无法以任何 graph 模式启动"的可用性回归；TRANSFORMERS 后端接管原生实现后动态 RoPE 语义（host 端 max/比较）与 vLLM 图执行模型的冲突是结构性的，同类 `@dynamic_rope_update` checkpoint（所有依赖该 HF 工具的模型）都可能踩中。'
  trigger_surface: vLLM ≥0.29 + HunYuan Dense V1（或任何 `@dynamic_rope_update` checkpoint）+ cudagraph_mode ≠ NONE（config：默认 FULL 即触发）
  discovery: 2026-09-21 每日扫描。
