original:
  mechanism: MindSpore master 与 2.8.0，issue 称所有后端都存在：MaskedFill 的反向计算 dinput/dvalue 采用乘法掩码 dout*mask、dout*(1-mask)。IEEE754 下 0*NaN、0*Inf 仍是 NaN/Inf，掩码位置的异常值无法被清零，进一步广播规约后进入梯度结果，与 PyTorch 不一致。PyTorch 的 masked_fill_backward 对 dvalue 用 grad.masked_select(mask).sum()（Tensor 子类用 where(mask,grad,0).sum()），共同点是在 mask 为 False 处强制 0。issue 提出的修复是 dinput 用 MaskedFill/Select 先清零再广播规约、dvalue 统一 Select(mask,dout,0) 后 SumExt（同时规避 GE 模式 MaskedSelect 动态 shape 的 SumExt 适配问题），并补了 dinput NaN/Inf 敏感度、dvalue 自定义 sens、dvalue NaN/Inf、GE O2 dvalue 四类 ST 用例。
  source: 2026-01-26 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/28905 （open）
  behavior: 上游梯度里出现 NaN/Inf（例如 loss 已经炸了或 attention mask 全屏蔽）时，被 mask 掉的位置梯度不是 0 而是 NaN，反向继续传播后整个参数梯度变成 NaN；前向结果完全正常，只有看梯度或训练直接崩掉时才发现，和 PyTorch 同场景对不上。
  trigger_surface: MaskedFill 反向且上游 dout 含 NaN/Inf；mask 中存在 False 位置；master 与 2.8.0，所有后端
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
