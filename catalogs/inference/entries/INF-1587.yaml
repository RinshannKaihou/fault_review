id: INF-1587
legacy_ids: []
slug: ms_masked_fill_backward_nan_mask_leak
aliases: []
title: MaskedFill 反向乘法掩码在 NaN/Inf 下漏梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: MaskedFillGrad 反向
  behavior: 反向用 dout*mask 与 dout*(1-mask) 做乘法掩码，0*NaN、0*Inf 仍是 NaN/Inf，被掩码位置的异常值经广播规约进入最终梯度。
effect:
  objects:
  - 梯度
  detail: dout 含 NaN/Inf 时 mask 为 False 的位置梯度不为 0，dinput/dvalue 与 PyTorch 的 masked_select+sum、where+sum 结果不一致；issue 称所有后端都存在。
  visibility: 数值异常
mitigation:
  detect: 构造 dout 含 NaN/Inf、mask 一半为 False 的反向用例，检查被掩码位置梯度是否严格为 0，并与 PyTorch 同算子对比
  fix: issue 给出修复方案（dinput 用 MaskedFill/Select 先清零再广播规约，dvalue 用 Select(mask,dout,0)+SumExt 避开 MaskedSelect 动态 shape），master 与 2.8.0 复现，无合并 PR 编号
