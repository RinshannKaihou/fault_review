  meta: '`infra_off`（binary_ng 的 program-cache hash 键漏掉 `Alignment` 与 `Tile`：`to_hash()` 只哈希 dtype/memory_config/分页 shape——**两个仅 Alignment/Tile 不同的张量共享同一 cache 条目**；且 `tensorspecs_match_with_relaxation` 在**一切** relaxation 设置下开头无条件精确比较 `tensor_layout`（relaxation flag 只解放 shape/rank/page-size 从不解放 layout）——自定义 hash 承诺的快路径安全性其余代码不兑现） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '`binary_ng_device_operation.cpp` 的 `tensor_args_t::to_hash` 与 `attribute_values()` 均无 Alignment/Tile 项；`TensorLayoutImpl::operator==` 是 `{dtype,page_config,memory_config,alignment_}` 的 default 相等。Metal 2.0 合法性检查下该静默 bug 会显形为 legality check failure（好方向），当前版本静默错。'
  source: 'tt-metal #55414（2026-09-03 open，作为 binary_ng Metal 2.0 port-blocker 提出）。https://github.com/tenstorrent/tt-metal/issues/55414'
  behavior: 当前静默（错程序命中/复用风险）；Metal 2.0 下转为 fail-loud。与 6.141（vLLM compile cache key 漏 spec tokens）跨栈同构：**cache key 未覆盖全部语义输入**即键碰撞-错复用——本条为该签名在硬件栈 program-cache 层的实例。
  trigger_surface: Tenstorrent + binary_ng + 同 dtype/memory_config 但不同 Alignment/Tile 的张量序列复用 program cache
  discovery: 2026-09-03 每日扫描。
