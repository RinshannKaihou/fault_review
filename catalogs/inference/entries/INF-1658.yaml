  - 数值结果
  detail: 大幅值输入下展开结果与 Aclnn 不一致、数值不稳定，常规幅值区间两侧一致；issue 未给具体数值与最小用例，只说明可观察到差异。
  visibility: 数值异常
mitigation:
  detect: 对同一 tanh 输入分别在展开路径与 aclnn 路径下执行，取 |x| 很大的边界值比较输出；出现溢出或与 aclnn 不一致即命中
  fix: 待定（issue open，仅供方向：展开时按 aclnn 的区间对输入做 clip，再走指数形式）
