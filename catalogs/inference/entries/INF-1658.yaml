original:
  mechanism: MindSpore Ascend 平台 tanh 的展开（lowering）实现用指数形式计算：对输入 x 不做区间裁剪（clamp），幅值较大时 exp(2x) 溢出，数值稳定性变差，结果与 Aclnn/ACL 官方实现不一致。Aclnn 的实现会在计算前把 x 限制到一个安全区间，因此两边在边界输入（大正数/大负数）上会分叉。issue 指出问题更容易在大幅值输入场景暴露，影响高精度训练和需要与 ACL/Aclnn 对齐的场景，在 Ascend 上对比测试可观察到差异；正文未给最小复现 demo 和具体数值，只说明可补充对比脚本。环境为 Ascend NPU + MindSpore，相关组件是 tanh 的展开实现与 Aclnn。
  source: 2026-02-04 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/28936 （open）
  behavior: 同一份 tanh 在 Ascend 上，输入幅值大一点（远离 [-1,1] 的 logits、未归一化的 score）时，展开算出来的结果与直接用 aclnn 算子对不上，偶尔出现溢出；输入都在小范围内时两边又完全一致，因此只在特定样本上表现为精度抖动，不打日志也不报错。
  trigger_surface: Ascend 平台上 tanh 走图算/展开路径且输入幅值超出安全区间
