title: vllm-ascend Mooncake V2 hold 过期 KV 误收
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Mooncake V2 KV 传输完成校验
  behavior: transfer 完成消息只校验 request ID，不校验 producer 延迟释放 hold 在读期间是否仍有效；producer 过期并回收块后，D 端仍按成功接收 KV 入池；同 ID 复用时旧完成消息可释放新 hold。
effect:
  objects:
  - 跨请求/跨样本数据
  - KV状态
  detail: PD 分离下 P 端 hold 过期块被回收复用后，D 端 pull 仍报成功并把可能已属他请求的 KV 当本请求内容使用；完成消息仅标识 request ID，延迟完成可误放新 hold。
  visibility: 静默错误
mitigation:
  detect: 对 pull 后 KV 与重算值比对可发现（成本高）
  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/19282 （Validate Mooncake V2 producer holds after KV reads，open 未合入）
