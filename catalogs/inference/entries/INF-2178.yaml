original:
  mechanism: 'vllm-ascend #19281（c2026-10-20，10-24 有更新）：Mooncake V2 实现中 P 节点导出 pull descriptor 并登记延迟释放请求；D 延迟于 pull 期间 P 的 hold 过期并上报 finished_sending、块被回收；D 完成传输后 worker 直接上报接收完成，未校验 producer 在整个读期间仍持有那些块——成功的传输本身不能证明拷贝的 KV 属于该请求。完成消息只含 request ID，同 ID 复用时早前尝试的延迟完成消息可释放新 hold。报告者基于 main 399c30d3 做离线控制路径复现（Loopback ZeroMQ 测试覆盖 producer 过期与陈旧完成消息），明确这是控制路径复现、非 NPU 数据损坏重放。与 vllm 主仓 NIXL 同类生命周期竞态（#61229=INF-1350、#62065）机制同构，但为 Ascend Mooncake V2 独立实现。修复 PR #19282 在读后校验 producer hold。'
  source: 2026-10-25 每日扫描；issue https://github.com/vllm-project/vllm-ascend/issues/19281 ；修复 PR https://github.com/vllm-project/vllm-ascend/pull/19282 ；上游同构 https://github.com/vllm-project/vllm/issues/61229 、https://github.com/vllm-project/vllm/issues/62065
  behavior: 使用者视角：PD 分离部署中 prefill 节点把 KV 移交 decode 节点时，若 decode 端拉取慢于 producer 的延迟释放窗口（hold 过期、块已回收复用），decode 端仍会收到「成功」并把这块 KV 当本请求前缀使用——内容可能已经是别的请求的数据，后续生成基于错误前缀静默偏移，无任何错误日志。同 request ID 复用时陈旧的完成消息还会错误释放新的 hold，扩大污染面。调度压力或网络抖动越大越容易触发。
  trigger_surface: vLLM-Ascend main（399c30d3，2026-10 检视）Mooncake V2 KV 传输；PD 分离 + producer hold 过期（延迟 pull）+ request ID 复用。
  signature: '离线控制路径复现（Loopback ZeroMQ producer 过期 + 陈旧完成消息测试）；与 NIXL #61229 同构签名。'
  discovery: 2026-10-25 每日扫描
