original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off`（BFA 家族新面：不翻模型权重、不翻执行计算的指令，而是翻转 **CPU 驻留的 JIT 服务控制平面**（host 侧 artifact 选择/编排决策）——单一位翻转同时支撑两种攻击效果：gibberish 输出（PPL 比率 15.45×–2.48×10⁶×）与 **correct-output sponge**（输出正确但延迟放大 2.03×–181.90×）；跨 4 个文本/多模态 LLM 可迁移，绕过既有 LLM BFA 防御；端到端 Rowhammer 单 bit 翻转实证） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: JIT 编译服务（Triton/inductor 类）在宿主侧维护"选哪个已编译 artifact、如何编排执行"的控制平面，状态驻留 CPU 内存（Rowhammer 可及）。作者提出 decision-guided fault-vulnerable code analysis 在大型 JIT 编译栈中定位可利用决策点：错误决策可让请求走慢路径（sponge：正确但重算/降级）或喂错 artifact（gibberish）。与既有 faulting-code BFA（损坏执行计算的指令、效果限于推理 depletion）和 weight BFA（需模型特定知识）正交——控制平面决策不接触权重也不直接实现计算。
  source: 'arXiv:2608.29745 "JITterFlip: Uncovering Fault Attack Surfaces in JIT-Compiled LLM Serving"（2026-08-30）。https://arxiv.org/abs/2608.29745'
  behavior: 双形态均无 crash——gibberish 形态输出完全损坏（PCL 飙升）；sponge 形态**输出逐位正确但延迟放大最多 181.90×**（DoW 经济攻击面，与 3.16 Groundhog 的 token 膨胀互补：本条是延迟/重算膨胀而非 token 计费膨胀）。属「**宿主侧 JIT 控制平面 BFA**」新子签名：把 BFA 攻击面从设备内存扩展到服务控制流，且"正确输出"使其避开输出质量监控——只有延迟/能耗指标可见。
  trigger_surface: JIT 编译服务栈（Triton/inductor 类）+ Rowhammer 可及的宿主 DRAM + LLM 服务（评估于 4 LLM；机制对 JIT serving 普适）
  discovery: |-
    2026-09-01 每日扫描。
