original:
  mechanism: 'ops-nn issue #6605（c2026-10-13，本轮增量窗口内更新复核，Ascend 910B2、CANN 9.2.0-beta.2、torch 2.7.1+cpu / torch_npu 2.7.1.post4）：aclnnDynamicQuant（pertoken）在输入 x 为空张量（末维为 0，如 x=[M,0]）时对非空的 scaleOut 提前返回且不写，接口返回 ACLNN_SUCCESS，scaleOut 保留调用方未初始化内存。缺陷位置 quant/dynamic_quant/op_host/op_api/aclnn_dynamic_quant.cpp:354-358（当前 master）：空 Tensor 处理分支 if(x->IsEmpty()||y->IsEmpty()||scale->IsEmpty()) 直接 return ACLNN_SUCCESS，不构造任何计算/搬运任务，全文件也没有对 scaleOut/offsetOut 的回填载体（无 Fill/ZerosLike）。为何是缺陷：资料 aclnnDynamicQuant.md 明确 x、yOut、scaleOut 均支持空 Tensor，scaleOut shape 为 x shape 剔除最后一维 ⇒ x=[M,0]（M>0）时 scaleOut=[M] 非空，属"输入空、输出非空"合法组合，CheckShape 全部放行。对照：非空输入时 scaleOut 正常写入；GE tiling 路径（dynamic_quant_tiling.cpp RunFusionKernelTiling）对 rowLen==0 显式 GRAPH_FAILED 拒绝——两路径行为不一致。影响：静默结果错误，经 torch_npu.npu_dynamic_quant 或 aclnn 直调拿到未初始化（NaN/异常值）scale，后续反量化结果被污染且随显存复用不可复现。复现：把分配器中与 scaleOut=[2]fp32 同尺寸的内存块预置 NaN 后释放（20000 块），再调 npu_dynamic_quant。'
  source: 2026-10-13 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6605 （open）
  behavior: NPU 上做动态量化（pertoken）时如果输入张量末维长度为 0（但 scale 输出非空），接口返回成功却完全不写 scale：拿到的是分配器复用的旧内存（可被预置成 NaN），后续反量化全错，而且因为显存复用每次结果还可能不一样。
  trigger_surface: aclnnDynamicQuant(pertoken) + x 空张量（[M,0]，M>0）；aclnn 路径；Ascend 910B2、CANN 9.2.0-beta.2
