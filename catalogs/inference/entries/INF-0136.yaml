  meta: '`infra_off`（融合算子 `bias_gelu` 默认即**近似** GELU：与 `gelu(add, fast_and_approximate_mode=True)` 逐位相同，对 torch float64 golden 最大误差 2.34e-02（分开调用 `gelu(add)` 默认精确为 6.8e-07，差 ~34,000×）；x=−3 处返回恰好 0（真值 −0.00398）；绑定走 `bind_binary_operation`，**不存在** `fast_and_approximate_mode` 参数、docstring 亦不提及近似——调用方无法请求精确形式） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '`binary_op_utils.cpp:125/:433` 的 `BIAS_GELU` dispatch 以 `get_defines(UnaryOpType::GELU, {0}, …)` 合入 GELU defines，`{0}` 字面读作精确模式模板参，但实测输出与近似变体完全一致（dispatch 即疑点）；绑定侧 add/multiply 均用 `bind_binary_operation_with_fast_approx` 暴露开关，bias_gelu 没有。WH n150 + BH p150b 双机 FLOAT32 TILE 布局测量。'
  source: 'tt-metal #55130（2026-09-02 当日 closed(completed)，双机逐位对照表 + 误差统计）。https://github.com/tenstorrent/tt-metal/issues/55130'
  behavior: 无 crash、无 NaN——标准 transformer FFN 块的 bias+activation 静默携带百分位量级绝对误差（负半轴近 −3 区域整段归零）；相对误差在 GELU 过零区达 100%。属「**融合算子默认近似且无退出开关/无文档**」新子签名：与 1.138/1.144 构成同日三例 tt-metal"近似 API 契约违反"族。
