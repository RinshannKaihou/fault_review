  meta: '`infra_off`（`VLLM_BATCH_INVARIANT=1` 时 `VllmConfig.__post_init__` 自动启用 breakable cudagraph，但冷 model-info cache 下 `attention.py` 先被 import、`@eager_break_during_capture` 在使能前解析——attention op 未包裹即被捕获进 CUDA graph，以捕获期 FlashAttention 参数回放：默认调度下 16-token prefill 错（`max_num_seqs=16` 时 2–16 token prefill 错、24/32/33+ 正确；错例含 prefix-cache 重算尾与 chunked-prefill 尾）；进程内引擎与**默认多进程 LLM 引擎**（fork 自已 import 的进程）均中招，`vllm` CLI（spawn）免疫。#53293 只修了 Ray worker 的同类 import 顺序） · Cov: `var:vllm_batch_invariant_matmul_self_test_violated_and_tf32_leak`（4.17 batch-invariant flag 失效族——本条在 **import 顺序决定 flag 是否生效**维度） · 触发 `config` · 置信度 `documented`'
  mechanism: decorator 在模块 import 时求值，配置使能晚于 import；fork 继承未包裹函数。
  source: 'vLLM #59940（2026-10-04 open，公开 API 最小复现+影响面矩阵）。https://github.com/vllm-project/vllm/issues/59940'
  behavior: 无 crash——短 prefill 在 BI 模式下静默错 token，无警告。
  trigger_surface: vLLM + VLLM_BATCH_INVARIANT=1 + 冷 model-info cache + 进程内/多进程 LLM（config）
