    component: mooncake_backend 注册
  behavior: register_buffer 在 store 返回非零时仅记日志并继续，正常返回后 KVPoolWorker 照常启动传输线程；Store-owned TE 路径受影响，GlobalTE 路径会抛异常。
effect:
