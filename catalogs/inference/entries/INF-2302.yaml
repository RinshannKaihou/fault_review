original:
  mechanism: 'vllm-ascend MooncakeBackend.register_buffer() 在 store.register_buffer(ptr,length) 返回非零时只打日志、继续注册后续 buffer 并正常返回（issue #20391，v0.32.0.dev0+ge8a6393）：受影响路径为 Store-owned Transfer Engine 注册（_use_store_independent_te=true 或 _prefetch_conf.use_dict_setup=true），共享 GlobalTE 注册路径失败已会抛异常。KVPoolWorker.register_kv_caches() 因此在请求的 KV cache 区域注册未完成的情况下进入 _start_kv_transfer_threads()。验证：纯标准库提取受测 revision 的 register_buffer 方法并注入非零 Store 返回码（mock 地址不进 native SDK），两条路径均 returned normally；另在 b03 用真实 Ascend 910B3 buffer 注入返回码验证同行为。后果：注册失败的 KV 区域参与传输时才暴露错误，启动阶段完全吞掉失败信号，部署带病起服务。属「fail-loud 被吞成延迟失败」，单独占号理由：KV 传输可用性直接受损且修复方向明确（对齐 GlobalTE 抛异常）。'
  source: GitHub issue https://github.com/vllm-project/vllm-ascend/issues/20391 （open，2026-10-30 创建；附 AST 提取复现与 b03 实测）
  behavior: 使用 Mooncake Store 的 KV 传输部署中，若 buffer 注册失败（Store 返回非零错误码），后端只在日志里记一行 'Failed to register buffer via store'，不抛异常、不中止：服务正常完成初始化并启动 KV 传输线程，未注册成功的 KV 内存区域随后参与传输，错误推迟到实际传输时才爆发（或表现为传输异常/慢）。启动期任何依赖「初始化成功=注册成功」的检查都会被骗过。
  trigger_surface: vllm-ascend ascend_store/mooncake_backend；_use_store_independent_te 或 use_dict_setup 路径；Store register_buffer 返回非零；KV pool 初始化。
  signature: 启动日志含 'Failed to register buffer via store ... ret=-600' 但进程继续运行。
  repro: issue 附标准库 mock 注入复现与 910B3 真实 buffer 验证。
  discovery: 2026-10-30 每日扫描
