  visibility: 静默错误
mitigation:
  detect: 启动后扫描 'Failed to register buffer via store' 日志并 fail fast；对已注册区域做一次回读校验。
  fix: 待定（issue 建议非零返回码上抛异常对齐 GlobalTE 路径）
