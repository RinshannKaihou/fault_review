original:
  mechanism: 'op-plugin issue #397（c2026-08-11，closed）：fp32 输入下，当最后一维 D 不是 4 的倍数时，CUDA 侧 SDPA 走小算子拼接（拆成 matmul + softmax + matmul 组合），NPU 侧直接走 FA 算子；两条路径的累加顺序与规约实现不同，导致小值域精度对不齐。issue 仅一行说明，未附复现脚本、偏差量级或维护者定位，也未见修复 PR。同仓相邻来源：#204（fp32 输入 sdpa 精度问题，A5）、#322（最后一维大于 256 时精度问题，950），二者正文同样只有一行，与本条是否同一机制未证实。'
  source: 2026-08-11 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/397 （closed）
  behavior: 用 fp32 跑 attention（SDPA）时，如果最后一维不是 4 的倍数，NPU 输出的数值在小值域上和 CUDA 对不上：不是崩、不是 nan，就是结果有偏差，做逐位或严格容差对齐时会失败。把最后一维改成 4 的倍数，两端走同一条路径，结果就一致了。
  trigger_surface: fp32 SDPA + 最后一维 D 非 4 倍数；D 为 4 倍数不触发
