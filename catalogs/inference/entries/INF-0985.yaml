original:
  category: cat10
  section: 第 10 类 · 分词器 / 对话模板故障
  meta: '`infra_off`（SGLang `Qwen3CoderDetector.detect_and_parse`（python/sglang/srt/function_call/qwen3_coder_detector.py）参数提取正则 `<parameter=(.*?)(?:</parameter>|(?=<parameter=)|(?=</function>)|$)` 带 `(?=<parameter=)` lookahead：模型输出在 value 闭合前**重复出现同名字面 `<parameter=` 标签**（长数组参数上的重复/退化 artifact）时，非贪婪匹配把嵌套文本当作**新参数匹配的起点**——findall 返回两个匹配，后者覆盖前者（`parsed_params[p_name] = ...`），数组/对象参数被截断且**静默覆写早先的正确值**。生产观测 4/3678 请求（0.11%）全在数组值参数（edit/edits、apply_patch/changes、ctx_batch_execute/queries、todowrite/todos）；流式路径共享同一脆弱形状；main 与下游 fork 字节相同、确定性复现） · Cov: `var:sglang_kimi_k3_parser_channel_terminator_assumption_tool_call_silent_loss`（10.42 tool parser 对畸形模型输出的解析假设族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 分隔符语法（`<parameter=NAME>`）同时是数据（值内可出现同名字面量）与元语法（参数边界），解析器用单一正则同时承担两种角色且无"值内转义/配对"状态机——lookahead 在数据出现处切分，后续覆盖写丢弃前段。
  source: 'SGLang #39836（2026-09-16 open，含正则逐段分析、生产 0.11% 日志统计、四组实测参数名与双路径（批量/流式）确认）。https://github.com/sgl-project/sglang/issues/39836'
  behavior: 无 crash——tool call 参数被截断为前缀 + 后值覆盖（如 edits 数组只剩尾段），agent 执行错误编辑类操作；0.11% 频率 + 仅退化输出触发使其在生产中近乎不可见。10.42（Kimi-K3 parser 通道终止符假设）之后 parser 假设族新成员：本条在**元语法字面量未转义 × 正则 lookahead**维度。
  trigger_surface: SGLang + Qwen3-Coder 工具解析 + 模型在参数值内重复 `<parameter=` 字面量（other_stack；数据依赖门控）
  discovery: 2026-09-16 每日扫描。
