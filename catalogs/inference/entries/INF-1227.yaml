original:
  category: cat15
  section: 第 15 类 · 幻觉 / 忠实性 / 对齐（model_on）— 检测器已验证的信号
  meta: '`model_on`（KV cache 压缩逐出的 token 含答案承载证据时，模型**幻觉作答而非识别上下文不足**——首个把 compression-aware abstention 公式化为学习问题的工作：用 compressor survival mask + tight answer-bearing span 构造 Confident/Abstain 监督，10.1M LoRA 在 ~2.6K MuSiQue 2-hop 样本上训练：prompt 式截断下幻觉 -97%、真实压缩解码下多压缩器联合训练对证据保留样本相对提升 6–22×；受控删除实验证明习得行为由证据内容而非输入长度驱动） · Cov: `NEW` · 触发 `n/a` · 置信度 `documented`'
  mechanism: KV 压缩（驱逐/掩码类，K§6 全族）的失效模式不是"答错"而是"不自知地答"：证据 token 被逐出后模型失去 abstain 的依据，on-manifold 地编造。论文的监督构造把"压缩后证据是否存活"变成可学习信号：survival mask 标 Confident、答案 span 被删标 Abstain；LoRA 适配器学到条件策略（证据在→答、证据失→拒），与 prompt-only abstention（在可答样本上过度弃权）不同。multi-compressor 训练使行为对压缩器选择鲁棒。
  source: 'arXiv:2608.29934 "Compression-Aware Abstention: Teaching LLMs to Refuse When KV-Compression Masks Remove Answer Evidence"（2026-08-30）。https://arxiv.org/abs/2608.29934'
  behavior: 本条为 K§6（驱逐/压缩）故障族的行为面刻画与缓解路径：证实「逐出证据性 token → 幻觉」因果链（受控删除实验），并给出部署级缓解（压缩感知弃权适配器）。对监控的含义：KV 压缩下的幻觉率是压缩策略与证据分布的联合结果——仅看输出无法区分"没证据也答"（本条目标）与"有证据答错"；弃权行为的引入使「幻觉率 ↓ 且可答样本召回保持」成为可优化的双目标。
  trigger_surface: 任意 KV 压缩/驱逐式服务（K§6 域）；LoRA 适配器为缓解手段（非模型变更）
  discovery: 2026-09-01 每日扫描。
