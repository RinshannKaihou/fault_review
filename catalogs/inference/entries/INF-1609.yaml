original:
  mechanism: MindSpore 2.9.0（CPU binary wheel，Python 3.11.15，Ubuntu 24.04 WSL2）：PYNATIVE_MODE 下 ops.log_softmax(ms.Tensor(x_np), axis=1)，x_np 为 float64 [[20,19,18],[-20,-21,-22]]。返回 dtype 仍是 float64，但与 NumPy 的稳定公式（shifted - log(sum(exp(shifted)))）相比最大绝对误差 2.2237522419032985e-06，呈现较低精度计算特征；扩展验证显示 PyNative 与 Graph 得到完全相同的误差、返回 dtype 都是 float64。issue 的预期是：文档未支持的 float64 应抛 TypeError，若接受则该按 float64 精度计算，不能用 float64 元数据包装低精度结果。无修复 PR。
  source: 2026-08-03 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29587 （open）
  behavior: 用 float64 输入跑 log_softmax 做小概率/大 logit 的数值校验，返回的 dtype 明明是 float64，结果却只对到 1e-6，和 NumPy 参考差两个数量级；因为 dtype 看起来对、也没有 warning，很容易被当成正常的浮点误差放过。
  trigger_surface: CPU PyNative/Graph 下 ops.log_softmax 输入 float64（文档未声明支持 float64）；MindSpore 2.9.0 CPU wheel
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
