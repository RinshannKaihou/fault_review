id: INF-1609
legacy_ids: []
slug: ms_log_softmax_float64_low_precision
aliases: []
title: log_softmax 静默接受 float64 却按低精度算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: CPU log_softmax float64
  behavior: CPU PyNative 的 log_softmax 不拒绝 float64 输入，返回 float64 张量，但内部按较低精度计算，与 float64 稳定公式的最大绝对误差 2.2e-6。
effect:
  objects:
  - 数值结果
  detail: 输入 [[20,19,18],[-20,-21,-22]] float64，返回 dtype float64，max_abs_error=2.2237522419032985e-06；PyNative 与 Graph 误差相同。
  visibility: 静默错误
mitigation:
  detect: float64 输入下与 NumPy 稳定 logsumexp 参考比对最大绝对误差；返回 float64 但误差停在 1e-6 量级即为低精度计算
  fix: 待定（issue open，2.9.0）；方向：按文档对不支持的 float64 抛 TypeError，或真正以 float64 计算
