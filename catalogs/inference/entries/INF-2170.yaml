title: torch_npu 复数特殊值传播与 CPU 不一致（Inf/NaN 翻转）
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: 复数算子向量化/标量分路径
  behavior: 复数张量 Inf/NaN/零的传播语义与 CPU 不一致：小尺寸走标量路径改变特殊值结果，reciprocal 存在按元素数（<3）分路径。
effect:
  objects:
  - 数值结果
  detail: 含 Inf/NaN 复数输入下 NPU 与 CPU 结果模式翻转（cpu=finite→npu=nan、cpu=nan→npu=inf、cpu=inf→npu=nan）；同一算子 1 与 2/3/4 元素结果不同。910 与 910B3 双机逐位一致。
  visibility: 静默错误
mitigation:
  detect: 与 CPU 参照逐元素对比特殊值输入可发现
  fix: '待定（关联上游 pytorch #157272/#141487，本仓 #641 未附修复）'
