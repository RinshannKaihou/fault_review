original:
  mechanism: 'triton/backends/ascend/driver.py 的 make_launcher 仅凭类型表 signature 决定哪些实参打进入参缓冲（凡类型不是 constexpr 就发一个 slot），而实参在二进制里是否真的占位由另一张表 constants 决定：编译器把被 value-fold 的实参折进 kernel body 并从参数表里删掉，但 signature 里仍留具体类型如 i32，两表因此不一致——二进制 ABI 是 (ptr, xnumel)，launcher 却按 (ptr, xnumel, r0_numel) 打包，被折叠实参之后的每个参数整体前移一个 4 字节字。触发场景是 torchbench sam（ViT-H，inductor）里的原地 softmax（mutated_arg_names=[''in_out_ptr0'']），persistent-kernel 重写（AutoBlockifyParallelLoop）在运行期参数之后追加 3 个 grid 参数，正好被挤位：@36 处 launcher 塞 r0_numel=196，二进制读成第一个注入 grid 参数，外层 trip 变成 g5*g6*g7=196*48*1=9408 而非 48。环境：Ascend 910B2、CANN 9.1.0、torch 2.14.0/torch_npu 2.14.0、triton-ascend 3.6.0、Python 3.12、TORCHINDUCTOR_NPU_BACKEND=triton_experimental、torch.compile(dynamic=False)。PR #2387 归一化 constants 键并在两处打包点跳过被折叠下标。'
  source: 2026-09-28 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/2407 （open）
  behavior: SAM（ViT-H）在 NPU 上走 torch.compile 后精度崩：attention probability 的相对 rms 误差约 52%，逐元素最大差 0.49，后续 32 个 encoder 块把它级联成 NaN，torchbench 直接 fail_accuracy；同一模型 eager 正常。三次运行结果位级一致，所以不是随机噪声；错值来自原地 softmax 被重复处理 196 倍后收敛到均匀分布，从日志里看不出任何参数错位的痕迹。
  trigger_surface: triton_experimental 后端 + 实现核（persistent rewrite 追加 grid 参数）+ 存在被 value-fold 但未标 constexpr 的实参
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
