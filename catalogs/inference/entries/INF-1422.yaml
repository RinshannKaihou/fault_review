  mechanism: triton-ascend commit fd24f3aad05c1c11f244be192c72c0b7ad7b96ae（包 3.6.0+gitfd24f3aa）上，双元素 Triton kernel 计算 tl.floor(tl.cos(x)) 对小非零 float32 输入（-0.00034680962562561035）返回 1.0，而 torch.floor(torch.cos(x)) 为 0.0；BLOCK=1 同环境不复现，提示 simd 向量数学 lowering 路径特定缺陷。环境：Ascend 910B3、AArch64、CANN 9.0.0、PyTorch 2.7.1、torch-npu 2.7.1.post4、Python 3.11.15；compile_mode=simd。issue open 无修复。
