  behavior: 在 Ascend 上跑含 tl.floor(tl.cos(x)) 的 Triton kernel（block 大小 2、simd 模式）时，对小非零 float32 输入（约 1e-4 量级）结果返回 1.0，正确值是 0.0——cos 略小于 1 被 floor 截到 0 的边界语义在 NPU 上算错。block 大小 1 时正确。
