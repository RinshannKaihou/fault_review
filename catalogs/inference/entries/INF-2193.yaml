    stack: cann
    component: FIA V5 TND 零长度 batch 分支
  behavior: TND 且 actualSeqLengths 含零长度 batch（累加值相等）时 kernel 对 GM 不持有区间越界写，两段返回 0、数值正确
effect:
  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: mssanitizer memcheck 报 out of bounds of size 38（每个 AIV 核一条，数十条）；数值输出正确故静默；零长度 batch 是必要条件，无零长度则 0 告警
  visibility: 静默错误
mitigation:
  detect: mssanitizer --tool=memcheck 检查 out of bounds 段；对照无零长度 batch 用例告警为 0
