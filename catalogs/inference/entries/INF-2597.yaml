slug: vllm_ascend_async_eplb_weight_copy_race
aliases: []
title: vllm-ascend 异步 EPLB 权重拷贝污染在途前向
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm-ascend
    component: async EPLB rebalance
  behavior: async rebalance 的 commit 用 non_blocking copy_ 写回专家权重，未与在途前向（含 multistream 旁路流与 graph replay）做流序同步，前向可读到撕裂权重。
effect:
  objects:
  - 输出内容
  detail: DeepSeek-V4-Flash W8A8 TP8+EP8、16 冗余专家、step=30 时 gsm8k 从 95.6 降到 89.3；禁 rearrange 或加 torch.npu.synchronize() 回到 95.3
  visibility: 静默错误
mitigation:
  detect: 对比 EPLB rearrange on/off 的 gsm8k；在 move_from_buffer 前后加 synchronize 做差分；检查 commit 后静态权重指纹（全绿仍可能中招）
  fix: 待定（open；issue 给出 synchronize 止血实验，未给修复 PR）
