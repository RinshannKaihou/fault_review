original:
  mechanism: MindSpore 2.8/2.9 的 PYNATIVE_MODE：ops.index_add 之后接 ops.ReduceSum，两种模式返回的 y 完全相同（[[-6,9,12],[3,4,5],[26,5,12]]），但 ReduceSum(y, axis=0) 分出两条结果——PYNATIVE_MODE 得 [16,15,22]，GRAPH_MODE 得 [23,18,29]。按 y 逐列求和应为 [23,18,29]，Graph 正确。issue 进一步指出 PyNative 的错值恰好等于 sum(original x, axis=0) + sum(updates, axis=0) = [9,12,15]+[7,3,7]=[16,15,22]，说明 ReduceSum 在 index_add 之后仍在操作旧语义/旧中间表示，而不是新张量。issue 展示的 y 本身两模式逐元素一致，所以不是显示问题。
  source: 2026-05-29 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29433 （open）
  behavior: 先 index_add 再求和这种写法（scatter 累加后规约）在动态图下求和结果与静态图对不上，而 index_add 的输出本身两边一模一样；错值正好等于把原始输入和 updates 分别求和再相加，看起来像一个合理的数，只有逐列手算才发现少了索引合并。
  trigger_surface: PyNative 模式下 ops.index_add 紧跟 ops.ReduceSum，输入为 2D float 张量（issue 复现为 3x3）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
