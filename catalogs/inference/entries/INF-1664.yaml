title: PyNative 下 index_add 后 ReduceSum 读到旧值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: PyNative index_add 数据依赖
  behavior: PyNative 中 index_add 与其后的 ReduceSum 之间缺少正确数据依赖，ReduceSum 读到 index_add 之前的输入缓冲。
effect:
  objects:
  - 数值结果
  detail: 两模式打印的 y 完全一致，但 ReduceSum(y,0) PyNative 得 [16,15,22]、Graph 得 [23,18,29]；错值恰等于 sum(x)+sum(updates)。
  visibility: 静默错误
mitigation:
  detect: index_add 之后立刻 ReduceSum，分别在 PyNative 与 Graph 下执行并比较；两者不等即命中，同时核对错值是否等于 sum(x)+sum(updates)
  fix: 待定（issue open，无修复 PR）
