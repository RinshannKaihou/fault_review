original:
  mechanism: cann/ops-transformer issue 4782（2026-08-31，closed，静态数据流核查）。attention/fused_infer_attention_score/op_host/arch22/fused_infer_attention_score_tiling_check_consistency.cpp L625 的 sSize += qSize[i]*qSize[i]：qSize 声明为 std::vector<uint32_t>（fia_tiling_check.h:273），乘法在 uint32 内完成，qSize[i]>65535 时溢出截断（65536*65536=0），截断值再累加进 uint64_t sSize。qSize 来自 actualSeqLengthsQ（int64 外部输入，fused_infer_attention_score_tiling_check_feature.cpp:1014），TND/NTD 下 tmpS1=actualSeq[i]-actualSeq[i-1]，L1046 只校验 tmpS1>=0 且 <=s1Size_，而 s1Size_ 为 uint32 无上限。调用链 CompressorGradTilingFunc→CheckMultiParaConsistency(774)→CheckMask(525)→CheckAttentionMask(583)，函数可达；L620-621 的 isMaxWorkspace 提前返回不是溢出防护。
  source: 2026-08-31 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/4782 （closed）
  behavior: 长上下文（单段超过 65535 token）走 TND/NTD 的 tree mask 融合注意力时，mask 形状一致性校验内部把段长平方算成了 32 位截断值：本该被拒绝的不匹配 attenMask 被判成合法，随后按这份 tiling 继续执行。没有任何报错，问题要到 attention 输出对不上或越界读时才暴露。
  trigger_surface: fused_infer_attention_score arch22，TND/NTD + SPARSE_MODE_TREE + 段长 >65535
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
