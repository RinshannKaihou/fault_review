id: INF-1982
legacy_ids: []
slug: fia_tiling_mask_size_uint32_overflow
aliases: []
title: FIA 长序列 mask 校验用 uint32 乘方致溢出放过
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FiaTilingCheck 掩码校验
  behavior: sSize += qSize[i]*qSize[i] 中 qSize 为 vector<uint32_t>，两数相乘在 32 位内完成后才提升累加，qSize>65535 时乘积截断
effect:
  objects:
  - 数值结果
  detail: TND/NTD + SPARSE_MODE_TREE 下 qSize=65536 时乘方得 0，mask 形状校验用的 sSize 偏小，本应拒绝的超长序列 mask 被判一致
  visibility: 静默错误
mitigation:
  detect: TND/NTD、SPARSE_MODE_TREE、actualSeqLengthsQ 含 >65535 的段长，构造与其不匹配的 attenMask，断言校验失败；用 uint64 版本对拍 sSize
  fix: 把 qSize[i] 转 uint64 再相乘（或 sSize += static_cast<uint64_t>(qSize[i])*qSize[i]），并给 s1Size_ 补上限校验；issue closed 未附 MR，未核实
