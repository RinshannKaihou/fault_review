title: STFT 写 workspace 缺 MTE3 同步致输出帧偶现为 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: stft kernel 三处 Process
  behavior: StftPlanMul 与 SplitWindows 经 MTE3 把 plan×window、splitWindow 写入 workspace 后未等写完成，Cube matmul 立即读取；首次调用 workspace 为新分配零内存
effect:
  objects:
  - 数值结果
  detail: Ascend950PR 上 atk 批跑 5 用例通过率约 60%，失败用例轮换；case 281（nfft=7/hop=1/win=4）部分行尾部帧输出 0 而其余数值正确，单跑与批跑表现不同、失败用例不固定
  visibility: 不可复现
mitigation:
  detect: 多轮批跑并每轮换输入，观察失败用例是否轮换、输出中是否出现整帧为 0；首次调用/新进程更易命中，逐次调用并与 CPU 参考比 max_diff
  fix: issue 给方案（closed）：三处 workspace 写后、matmul 读前插 HardEvent::MTE3_S 的 SetFlag/WaitFlag；Ascend950PR 实测修复后 10 轮×5 用例 50/50 PASS、25 次逐次调用与 CPU 一致（max_diff<1e-4），合入状态未核实
