original:
  mechanism: cann/ops-math math/stft AICore kernel 内存在 MTE3（UB→GM 异步拷贝，Vector 流水线）与 Cube matmul（读 GM）之间的流水线竞态，三处同款：StftPlanMul::Process() 把 plan×window 结果经 MTE3 写入 plan workspace 后没有等待写完成，主算子 Cube matmul 立即读取；STFTGeneralized::Process() 的 SplitWindows 经 MTE3 写完 splitWindow workspace 后同样无同步，StftMatmul 立即读；STFTGeneralizedComplex::Process() 的 complex 路径相同。首次调用时 workspace 是新分配内存（内容为 0），matmul 抢先读到未写入数据 → 输出帧为 0；后续调用 workspace 残留上次正确数据，竞态被掩盖，因此表现为偶现、单跑与批跑不同。复现命令为 atk node --backend npu --devices 1 对 CPU 参考跑 accuracy（-mt 5），失败示例 case 281（nfft=7/hop=1/win=4/onesided=false，输出 [7,7]）在 (1,4)(1,5)(1,6)(3,4)(3,5)(3,6)(4,6)(6,5)(6,6) 等位置为 0 而 CPU 有正常值（如 -760.1+839.2j）。
  source: 2026-08-25 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2868 （closed）
  behavior: STFT 在 Ascend950 上批跑精度测试时偶现失败，同一批里失败的用例还每次不一样：单跑能过、批跑挂；把 NPU 输出和 CPU 一比，某些行的尾部帧整段是 0，其它位置数值完全正常。修复前 5 用例通过率约 60%，插上 MTE3_S 同步后 10 轮×5 用例全过。
  trigger_surface: ops-math STFT（Ascend950PR）批跑多用例；workspace 首次分配/新进程首次调用时命中率最高
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
