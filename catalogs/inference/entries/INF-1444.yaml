    component: 零填充兄弟概率累加
  behavior: corpus 用 token 0 填充 draft tree（parent 挂 root）；温度>0 verify 逐兄弟累加 target_probs，每个 pad 再加一次 p(0)，拒绝残差只扣一次——token 0 被过量接受。
effect:
