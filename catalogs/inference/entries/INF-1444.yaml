  visibility: 静默错误
mitigation:
  detect: 对生成 token 做 id-0 频率统计与模型先验对照（10 倍级偏差直接可见）
  fix: 上游修复未见（issue open；修复方向：pad 兄弟不参与概率累加或 draft_probs 按 pad 数量多次扣除）
