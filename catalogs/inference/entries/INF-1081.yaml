  category: cat11
  section: 第 11 类 · 解码 / 采样故障（多为 post-forward — 结构性盲点）
  meta: '`ambiguous`（`--use-fp64-gumbel` 在 CPU 后端的 recovered-token 采样中被**静默忽略**：CPU shim 接受 `USE_FP64_GUMBEL` 后在 argmax 前 `inv_q.to(torch.float32)` 降转（`cpu_triton_utils.py:451`），其上注释声称"按原 dtype 读取"（:437-440）——与事实相反；flag on/off 输出逐位相同，无任何警告。lower-tail draw q≈1e-40 → `inv_q>3.4e38` 在降转时溢出 inf，微概率 token 窃取 argmax（fp64 应答 1、实答 0）——恰是该 flag 存在的目的场景；GPU Triton 内核遵守 flag → **CPU/GPU 同 draw 发散**，PR #43150 建立的 parity 在 CPU 不成立） · Cov: `var:sglang_deterministic_flag_silent_coverage_gap_quantized_hybrid`（4.13 保证类 flag 静默失效族） · 触发 `yes` · 置信度 `verified`'
  mechanism: 61 个"接受但未读"行为 flag 审计的唯一 live hit：`sample_recovered_tokens` 以 fp64 构造 `inv_q = q.reciprocal()`（`rejection_sampler.py:681-694`）并 thread `USE_FP64_GUMBEL`；GPU 路径 `tl.constexpr` 选择 fp64 累加器并按原生 dtype 加载，CPU fallback shim 却显式降转。复现无需模型/GPU/服务器（直接调 shim，秒级）：(b1) near-tie below fp32 eps DIVERGES、(b2) lower-tail overflow steals argmax DIVERGES、(b3) NaN probe OK、ctl flag off 与 fp32 参考一致。
  source: 'vLLM #54843（2026-09-01 open，macOS arm64 from-source 0.28.1rc1.dev + torch 2.13、独立 harness 对未修改 csrc 复现、四态测量表）。https://github.com/vllm-project/vllm/issues/54843 · flag 语义源：PR #43150'
  behavior: 无 crash、无警告——**精度保证 flag 是 no-op**：低概率事件采样在 CPU 上系统性缺失（分布尾被截断），且注释误导维护者以为正确。属「**后端 fallback 路径背叛 flag 契约**」：与 4.13/4.14（保证 flag 覆盖缺口）同族，本条在 dtype 精度域且**文档注释与代码相反**（对审计的独特价值：错误注释是发现线索）。
  trigger_surface: vLLM CPU 后端 + spec decode recovery 采样 + `--use-fp64-gumbel`（config 即触发；秒级无模型复现）
