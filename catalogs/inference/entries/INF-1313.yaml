  category: KV10
  section: KV §10 第二轮补充（其他框架 / 卸载 / 共享 KV / 布局 / API 缓存）
  meta: '`ambiguous` · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: YOCO / Gemma-3n 一类跨层 KV 共享架构里，`kv_sharing_target_layer_name` 被错误推导到一个**并非在当前层之前计算**的层；该层的 KV 此刻尚未写入，读到的是未初始化内存或上一请求残留的 KV。因果顺序被打破，共享层的注意力对着不存在的历史做计算。
  source: '`gh`：vLLM PR #19371；YOCO arXiv:2405.05254。'
  behavior: 仅涉及 KV 共享的那些层输出异常，生成早期尤为明显，随着解码推进缓存被真实写入而自行"痊愈"。
  trigger_surface: vLLM 版本缺陷：可 pin 历史版本复现，需场景
  signature: 读未初始化/前请求 KV 是 infra_off 式扰动，但**起始随步索引而定**（随缓存填充而消退），因此整体归为 ambiguous：只在解码早期窗口内出现签名。trajectory（跨步/跨深度）最擅长捕捉这种"先偏离后收敛"的时间形状，geometric 单点快照如果采样在后期会漏检；spectral 因偏离局限于少数共享层而信号被稀释。
  repro: partial——在目标层的 attention 前向钩子里，把该层读到的 K/V 替换为零/随机张量，且只在前若干解码步生效，其后放行，以复现 step-gated 的起始与消退；真实的 layer-name 推导错误与共享拓扑在标准稠密模型上不存在。
  locus: block-slot-alloc
  priority: medium
