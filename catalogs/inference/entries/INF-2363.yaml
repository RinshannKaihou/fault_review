original:
  mechanism: 'aclnnAdvanceStep 在 numQueries > 40（A2 AIV 核数）时，下标 ≥40 的序列四个输出（含 seqLens）全部保留调用方旧值。numQueries=40 全部正确，阈值即核数。资料《aclnnAdvanceStep》公式对每个 blockIdx（0…numQueries-1）成立，numQueries 参数只写「大于 0 的正整数」无上限 40。实测：numSeqs=41/numQueries=40 偏差 0；numSeqs=101/numQueries=100 时 60 个序列未 +1（seqLens 最大偏差 1）；GetWorkspaceSize/execute 两段均返回 0/0。环境：Atlas A2（910B3）、CANN 9.2.0、ops-nn master a61e016a71f4，2026-11-01 复现，自包含 C++ repro。AdvanceStep 为 MTP/投机解码 draft-verify 状态推进算子（vLLM/sglang 生态用于 spec-decode 步进），numQueries 即验证步并发 draft 数——超 40 的场景在现代 5+ draft token 部署不常见但属文档化合法输入。关联同族 #7885（AdvanceStepV2 numSeqs≠numQueries 未校验）、#7890（V2 specNum=0 误拒）。来源 https://gitcode.com/cann/ops-nn/issues/7889（open，2026-11-01）。'
  source: 2026-11-01 每日扫描。https://gitcode.com/cann/ops-nn/issues/7889
  behavior: 调用 aclnnAdvanceStep 推进投机解码序列状态：当 numQueries（要推进的序列数）超过 40 时，第 41 个及以后的序列所有输出（含序列长度 seqLens）原样保留调用前旧值——上一步是 -7 就还是 -7，等于这些序列的时间步没被推进；接口两段都返回成功（0/0），无任何报错。numQueries=40 整时全部正确，一超 40 就从第 41 个开始整段静默不更新。
  trigger_surface: Atlas A2（910B3）；CANN 9.2.0 / ops-nn a61e016a71f4；aclnnAdvanceStep numQueries>40（AIV 核数）；投机解码/序列状态推进调用
  discovery: 2026-11-01 每日扫描
