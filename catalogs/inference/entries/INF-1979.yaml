id: INF-1979
legacy_ids: []
slug: tiling_return_false_equals_graph_success
aliases: []
title: tiling 校验失败被当作 GRAPH_SUCCESS
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: scaled_masked_softmax
  behavior: ge::graphStatus 函数里失败分支写 return false，bool→0 隐式转成 GRAPH_SUCCESS，校验被吞；入口不检查 Init 返回值直接继续 DoTiling
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: x batch=1、mask batch=2 的非法广播被判 tiling 成功并继续生成 tiling 数据；同型缺陷在 950 量化 matmul_all_reduce 上表现为吞掉 groupSize 空校验后解引用空指针
  visibility: 静默错误
mitigation:
  detect: 对 host tiling 加非法 mask batch 用例，断言返回 GRAPH_FAILED；CI 加 clang-tidy 规则拦截 enum 返回类型下的 bool 返回
  fix: 失败分支改为 return ge::GRAPH_FAILED 并在入口传播非成功状态；ops-nn 侧已给 MR 9096，ops-transformer 侧未给 MR，合入版本未核实
