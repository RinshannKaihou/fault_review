original:
  mechanism: 'Ascend/torchair #736：A5（CANN 9.2.0、torch_npu 2.7.1、X86、py39）上用 torch.compile(backend="npugraph_ex", fullgraph=True, dynamic=True, options={"dump_tensor_data": True, "data_dump_stage": "optimized", "static_kernel_compile": True}) 编译一个含三次 torch_npu.npu_fused_infer_attention_score（BNSD、num_heads=64、actual_seq_lengths=length）以及 npu_grouped_matmul、npu_dynamic_quant 的网络，输出精度异常；把 static_kernel_compile 关掉精度恢复正常，编译与执行都不报错。报告者的怀疑方向是静态化之后 FIA 的 actual_seq_lengths 这类运行期输入不再刷新（原话：怀疑问题出在 FIA 算子上，可能是 actual_sqp_lengths 刷新机制被影响），未给出源码级证明，也没有给误差量级；issue 附带开启 data_dump 的复现脚本与 profiler 配置。'
  source: 2026-09-01 GitCode Ascend/torchair issue https://gitcode.com/Ascend/torchair/issues/736 （open）
  behavior: 同一张图、同一组输入，开了 static_kernel_compile 之后输出就和关掉时对不上，也没有任何报错或 NaN；因为同时开了 dump_tensor_data，可以按 optimized 阶段的张量逐个比对，异常最早出现在 FIA 的输出上。关掉静态 kernel 就一切正常，所以很容易被当成模型本身的问题。
  trigger_surface: A5 + CANN 9.2.0 + torch_npu 2.7.1；npugraph_ex + static_kernel_compile=True + 图内含 FIA（dynamic=True）
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
