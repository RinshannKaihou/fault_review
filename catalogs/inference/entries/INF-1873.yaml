cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: static_kernel + FIA
  behavior: 开启 static_kernel_compile 后，图内 FIA 的 actual_seq_lengths 这类运行期输入疑似不再刷新，刷新机制受影响（报告者的怀疑方向，未给出源码级证明）。
effect:
  objects:
  - 数值结果
  detail: A5（CANN 9.2.0 / torch_npu 2.7.1）上 npugraph_ex + static_kernel_compile 编译含三次 FIA 的图，输出精度异常；同图关掉静态 kernel 精度正常，编译与执行都不报错。
  visibility: 静默错误
mitigation:
  detect: 同图开/关 static_kernel_compile 各跑一次比对输出；用 dump_tensor_data(data_dump_stage=optimized) 逐张量定位到 FIA 输出
  fix: 待定（issue open，未给修复 PR）
