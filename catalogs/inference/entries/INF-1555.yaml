title: GDN 循环状态按 packed 偏移寻址致跨请求串扰
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: RGDR 状态行寻址
  behavior: metadata 保留 [B,K+1] 定宽状态表，调用方 flatten 后传入，kernel 却按 packed token 偏移寻址，正确行基址应是 request_index×(K+1)。
effect:
  objects:
  - KV状态
  - 跨请求/跨样本数据
  - 输出内容
  detail: Qwen3.5 开 MTP3 并发结构化输出时，若语法校验使 batch 内 verify 长度不同，产出畸形 JSON、错误字段、重复片段或跑满 max_tokens，服务不报错；等长 [4,4] 对照通过。
  visibility: 静默错误
mitigation:
  detect: 构造各请求 verify 长度不齐的 batch（如 accepted [4,1]、query 长度 [2,4]），用无权重算子复现器检查状态行是否按 request_index×(K+1) 寻址；等长 batch 做对照
  fix: '待定（issue open）；修复方向：保留每请求二维状态表并显式传 row stride，读写都用该 stride，并按状态行宽度校验 accepted_prev；release 侧 #17839 已修 910 族，#17856 报 310P 的 v310 算子未被覆盖'
