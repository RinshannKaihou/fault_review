    component: V1 runner 构造 sampler
  behavior: V1 runner 构造 AscendSampler 时不转发 model_config.logprobs_mode，配置 processed_logprobs 等模式的引擎仍以默认 raw 模式初始化，返回概率语义与配置不符。
effect:
  objects:
  - 输出分布
  detail: 配置 processed_logprobs 时按 raw_logprobs 计算；历史 MiniMax-M3.1-Flash RL 诊断中修正语义后 mean abs prob diff 从 0.0145 降到 0.0066；对 train/rollout 一致性度量引入偏差。
  visibility: 静默错误
mitigation:
  detect: 对同一 logits 对比 raw/processed 两种模式的 logprob 输出可检出
  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/20146 （open，2026-10-28）：runner→sampler 转发 logprobs_mode，缺失字段回退 raw_logprobs；constructor 回归（CPU）全过；原生 NPU 验收与 CI 归属 reviewer，未合入）
