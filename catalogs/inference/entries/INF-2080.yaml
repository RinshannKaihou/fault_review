id: INF-2080
legacy_ids: []
slug: cann_exp_segsum_grad_tiling_corenum_oob_arch22
aliases: []
title: exp_segsum_grad tiling 未截核数越界写 910B
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: exp_segsum_grad tiling
  behavior: arch22 tiling 不截断 compileInfo->coreNum，needCoreNum 可超 50；再以它为界写 batchStart/batchEnd，而两数组只有 50 项。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: Ascend 910B（AIV核数>50）上，exp_segsum_grad反向tiling在batches与核数组合使needCoreNum>50时，可能把batchStart/batchEnd写到数组外，表现为偶发tiling参数异常、算子输出错乱或host侧core dump。
  visibility: 静默错误
mitigation:
  detect: 在 910B（AIV>50）上跑 exp_segsum_grad 的 Host Tiling UT 或 ASan 构建，检查 GetNeedCoreNum 返回值是否超过 MAX_CORE_CONT=50
  fix: issue 修复建议：arch22 参照 arch35 在 RunBigKernelTiling 里把 coreNumPlatform 截断到 MAX_CORE_CONT（closed，未见合并记录）
