  kind: gitcode_issue
relations: []
original:
  mechanism: cann/ops-math 的 exp_segsum_grad arch22 tiling（math/exp_segsum_grad/op_host/arch22/exp_segsum_grad_tiling.cpp）里，RunBigKernelTiling 第 87-95 行直接把 compileInfo->coreNum 作为 coreNumPlatform 传给 GetNeedCoreNum，没有截断；GetNeedCoreNum 用 averageBatches=CeilA2B(batches, coreNumPlatform)、needCoreNum=CeilA2B(batches, averageBatches) 计算，needCoreNum 可达 coreNumPlatform，而 batchStart/batchEnd 数组按 MAX_CORE_CONT=50 定义（exp_segsum_grad_tiling.h:23）。Ascend 910B 的 AIV 核数可达 64 以上，needCoreNum>50 时第 139-142 行越界写。arch35 版本在 RunTiling 中已有 coreNumPlatform > EXP_SEGSUM_GRAD_MAX_CORE_ARCH35 时的防御性截断，arch22 缺失；调用链 Tiling4ExpSegsumGrad→RunBigKernelTiling→GetNeedCoreNum 可达。
  source: 2026-08-20 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2782 （closed）
  behavior: 在 910B 上训练带 exp/segment-sum 结构的模型时，反向 tiling 可能把 batchStart/batchEnd 写到数组外，表现为偶发的 tiling 参数异常、算子输出错乱或 host 侧 core dump；同一份代码在 arch35（950）上因为已有截断而不出现。
  trigger_surface: Ascend 910B（AIV 核数 >50）+ exp_segsum_grad 反向 tiling + batches 与核数组合使 needCoreNum>50
  discovery: 2026-10-21 第三轮顺序扫描（tail_2，issue created < 2026-10-07）
