original:
  mechanism: tt-metal 9f98dee9c5，Blackhole p100a（KMD 2.8.0/FW 19.8.1）。models/demos/deepseek_v3_b1 的单核 Matmul（SDPA 后输出投影形状 [1,8192]×[8192,64]）在 K=8192 时不使用激活列 8176–8191：把激活做成仅末 16 列非零，输出全零（N=32/64/64-transposed 3/3 全零）；K=8160 同输入结果正确（3/3）。随机输入下误差足够小，现有 PCC 0.99 检查通过——缺陷在常规测试下静默。issue 已 closed，未见修复链接/内容，修复状态未核实；是否回归未知。复现：test_matmul.py::_run_matmul_single_core 把随机激活替换为 torch_a[:, -16:]=randn。
  source: 2026-10-20 每日扫描；https://github.com/tenstorrent/tt-metal/issues/61585
  behavior: 在 Blackhole 上跑 DeepSeek V3 B1 的单核 Matmul 且 K 恰为 8192 时，最后一个 K tile（16 列）的贡献被静默丢弃：如果输入信息只集中在这 16 列，输出直接全零；随机输入下误差很小，常规 PCC 0.99 精度检查发现不了。K=8160 同样输入完全正确。表现为模型精度轻微劣化且难以定位。
