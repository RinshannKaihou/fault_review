original:
  mechanism: 'op-plugin issue #231（c2026-07-02，open，Ascend A3，torch_npu 2.9.0.post2，CANN 9.0.0.b131 与 9.1.t2 均复现）：torch.bfloat16 的 Tensor.exponential_() 在 A3 上生成的指数分布尾部小值明显缺失。定位到 op_plugin/ops/opapi/ExponentialKernelNpuOpApi.cpp 与 UniformKernelNpuOpApi.cpp：非 Ascend950 路径先在目标张量上执行 self.uniform_(0.0, 1.0, generator) 再算 -log(1-u)/lambd，目标张量本身是 bf16，于是 uniform 随机源与后续变换都被压到 bf16 粒度；Ascend950 及以上已切到 aclnnSimThreadExponential，A3 仍走 uniform→log 近似路径。实测 bf16 最小约 3.9e-3、20000 样本仅约 128 个唯一值，NPU fp32 与 CPU bf16 均正常。该分布缺陷会让基于 exponential race 的采样（如 torch.argmax(probs / q, dim=-1)）因为缺少足够小的随机数而几乎采不到低概率 token。报告者交叉实验确认 npu_top_k_top_p_sample 本身正常，只是暴露该随机数分布问题的上层场景。'
  source: 2026-07-02 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/231 （open）
  behavior: 在 A3 上用 bf16 跑需要指数分布随机数的采样，采样会退化成近似贪心：同样的 probs，被选中的几乎总是 top1 token，低概率 token 基本没有机会。直接看随机数就能发现异常——bf16 的 exponential_() 最小值约 3.9e-3（正常应能取到更小的值），两万个样本里只有一百多个不同取值。换成 fp32 或者在 CPU 上跑 bf16 就正常，所以问题只在 A3 + bf16 这条路径上。
  trigger_surface: Ascend A3 + torch.bfloat16 + Tensor.exponential_()；上层 exponential race 采样（argmax(probs/q) / top_k_top_p）会退化；fp32、CPU bf16、Ascend950 不触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
