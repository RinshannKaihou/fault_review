id: INF-2578
legacy_ids: []
slug: flashinfer_cutlass_fused_moe_noncontiguous_stride_misread
aliases: []
title: cutlass_fused_moe 非连续输入按紧凑步长误读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: cutlass_fused_moe
  behavior: cutlass_fused_moe 假定 input 行步长等于 hidden size，不检查 stride；非连续视图按紧凑偏移取行。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: input=buf[:, :H] 时仅 row0 正确，其余行读到 padding 列或邻行；x_view 与 x_packed 数值相等但输出不同；无告警，padding 有垃圾时含 NaN/Inf。
  visibility: 静默错误
mitigation:
  detect: 同一数据分别以列切片视图与 .contiguous() 副本输入，逐元素比较；row0 相同、其余行不同即命中。
  fix: 待定（issue open，未附修复 PR）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-11-16'
remarks: 与 INF-0337（wna16 split-K 原子加非确定）、INF-0769（MXFP4 TMA 描述符竞态）机制不同。
evidence:
- url: https://github.com/flashinfer-ai/flashinfer/issues/9508
  kind: github_issue
relations: []
original:
  mechanism: flashinfer.fused_moe.cutlass_fused_moe 假定 input 是 packed row-major（row stride == hidden size），但未检查。传入 strided view（如更宽缓冲的列切片 buf[:, :hidden]）时，kernel 按 packed stride 读行：仅 row0 正确，其余行取到 padding 列或邻行数据；无错误/警告，输出静默错误，padding 含垃圾时可为 NaN/Inf。报告者用 T=64,H=1024,I=512,E=8,K=2,PAD=2048、bf16 构造 wide[:, :H]，断言 x_view 与 x_packed 数值相等但 cutlass_fused_moe 输出不同。该视图形态在激活来自带 padding 的通信缓冲时常见。
  source: https://github.com/flashinfer-ai/flashinfer/issues/9508 （open，2026-11-16，含最小复现）
  behavior: 激活来自带 padding 的通信缓冲（列切片视图）时，MoE 只有第一行算对，其余 token 用错位数据算，输出可能带 NaN/Inf；改成 .contiguous() 才正常。
  trigger_surface: flashinfer cutlass_fused_moe；bf16；input 为 strided view（row stride≠hidden）；T=64,H=1024,I=512,E=8,K=2、PAD=2048 可复现。
  discovery: 2026-11-16 每日扫描
