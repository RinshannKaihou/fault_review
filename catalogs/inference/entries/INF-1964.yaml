title: 精度检查遇 transformers 5.x Cache 中止
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: torch_npu
    component: huggingface runner 精度检查
  behavior: same() 不认容器对象：past_key_values 为 transformers 5.x 的 Cache 时抛 RuntimeError，被 check_accuracy 吞成 eager 不一致。
effect:
  objects:
  - 测试判定
  detail: T5 在两次 eager 逐位自检处必然失败、编译段之前中止，永远产不出 E2E 指标；同环境 BertForMaskedLM 通过、BartForCausalLM 不打补丁时出现同样症状。
  visibility: 静默错误
mitigation:
  detect: 对含 past_key_values 的 decoder 模型跑 --accuracy，看是否恒记 eager_two_runs_differ 且无 E2E 指标；先用 same() 直接喂 Cache 对象复现 RuntimeError
  fix: 待定（issue open；报告给的分支 fix/t5-hf-accuracy-check 把 T5 加入 skip 名单并把 past_key_values 转成 4.x 风格嵌套 tuple，PR 待创建）
