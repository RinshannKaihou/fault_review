  mechanism: 'issue #10373 记录在 Ascend 950PR 上用 vllm-ascend 部署 DeepSeek-V4-Flash（环境显式设置 USE_MULTI_BLOCK_POOL=1、USE_MULTI_GROUPS_KV_CACHE=1，VLLM_VERSION=0.20.0）跑 GSM8K 与 GPQA 精度评测时，开多并发后部分样本概率性返回空输出，导致整体评测准确率明显下降。报告强调：空输出随机出现、不是每条请求必现；只在多并发下出现，单并发推理正常；该问题直接影响精度评测结果的真实性与可用性。正文没有给出根因或修复，只给了复现脚本与数据集。'
