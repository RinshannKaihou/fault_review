original:
  mechanism: 'cann/ops-nn norm/rms_norm/op_kernel/rms_norm_base.h:36 的条件宏 #if defined(__CCE_AICORE__) && __CCE_AICORE__ != 220 && != 310（原文重复 220）在 Ascend960（__CCE_AICORE__ == 920）上被激活，bfloat16_t 被重定义为 int16_t，bf16 数据按 int16 位型解释，导致精度问题。影响范围：rms_norm 的 arch35 模板链（rms_norm_regbase_common.h 等 6 个模板头均 include 该文件）、add_rms_norm 系跨算子引用同一头文件；其余带同款宏的文件中 add_rms_norm_quant_base.h 已含 != 920（既有修复）、add_rms_norm_base.h 无引用者（死头文件）、fused_add_rms_norm/deep_norm/apply_top_k 未注册 960。修复 PR（ops-nn !12168，open）：追加 && __CCE_AICORE__ != 920，与既有修复形态一致。源码级宏定位；PR 未附数值实测（完整构建与 NPU 实测未运行）。'
  source: 2026-10-17 GitCode cann/ops-nn PR https://gitcode.com/cann/ops-nn/merge_requests/12168 （open，源码级定位）
  behavior: 在 Ascend960 上跑 bf16 的 rms_norm / add_rms_norm 系算子时，bfloat16 数据被当作 int16 整数处理，归一化输出静默偏离正确值。无报错；LLM 层间 rms_norm 是每层必经路径，逐层累积偏差使模型输出质量劣化。
  trigger_surface: Ascend960 + ops-nn rms_norm/add_rms_norm 系 bf16 kernel；宏编译期生效
  discovery: 2026-10-17 每日扫描
