original:
  mechanism: 'SGLang issue #44998（c2026-10-18）：SM80 以下（至 SM90）GPU 上 SGLang 用 Marlin W4A16 kernel 跑 NVFP4（ModelOpt quant_algo: NVFP4）checkpoint。python/sglang/srt/layers/quantization/marlin_utils_fp4.py 的 nvfp4_marlin_process_scales 以 (scales * 2**7).view(int16) << 1 把 E4M3 block scale 转 S0E5M3 形式，假设每个非零 scale 满足 scale*2**7 >= 2（顶位置位）。per-tensor weight_scale_2=1 导出的 checkpoint block scale 小、违反假设，BF16 反量化下溢、全输出垃圾。vLLM 同款代码已由 vllm-project/vllm#34577（幂二重标定 + 全局 scale 同除、MoE 专家共享因子，merged 2026-03-17）修复；SGLang 0.5.22 与 main ba3fc94（2026-10-18）仍是无修复版本。probec probe twins 贪心 192 请求 × 256 token 实测：RTX 3090 与 H100 PCIe 的 Qwen3-0.6B twin NVFP4 均 192/192 请求首 token 起错（49,133/49,152 token）；RTX 3090 Qwen3-30B-A3B twin（MoE）192/192 错（49,135 token）；同 dense 权重 ModelOpt 式 scale（block scale 近 448）精确 0/49,152——两 checkpoint 反量化后权重一致、仅 scale 切分不同；B200 W4A4 路径两者皆精确。vLLM 0.18.1（修复前）同款失败同计数、0.19.0（含 #34577）精确。'
  source: 2026-10-18 GitHub sgl-project/sglang issue https://github.com/sgl-project/sglang/issues/44998 （open）
  behavior: 在 Ampere/Hopper 消费卡与数据中心卡上用 SGLang 跑以小 block scale 导出的 NVFP4 量化模型时，所有输出从第一个 token 起就是乱码：192 个请求全错、49,152 个 token 里约 49,133 个错。同样权重换成 ModelOpt 常规 scale 导出或 B200 原生 W4A4 路径则完全正确，vLLM 新版本对同 checkpoint 也正确。
  trigger_surface: SGLang 0.5.22/main（ba3fc94）+ NVFP4 checkpoint（小 block scale，如 per-tensor weight_scale_2=1）+ SM80-SM90（Marlin 回退）；RTX 3090/H100 PCIe 实测
  discovery: 2026-10-19 每日扫描
  notes:
  - 2026-10-20 回访 2026-10-20：#44998 仍 open
