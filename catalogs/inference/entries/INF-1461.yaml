title: SGLang NVFP4 Marlin 小 block scale 下全输出乱码
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: sglang
    component: Marlin FP4 scale 重标定
  behavior: nvfp4_marlin_process_scales 以 (scales*2**7).view(int16)<<1 转 S0E5M3，假设顶位恒置位；小 block scale 违反假设，BF16 反量化下溢全输出垃圾。
effect:
  objects:
  - 输出内容
  detail: SM80-90 Marlin 路径全乱码：NVFP4 twin 192/192 请求错（~49,133/49,152 token）；ModelOpt 式大 scale 与 B200 W4A4 精确；vLLM 0.19.0+ 对同 checkpoint 精确
  visibility: 静默错误
mitigation:
  detect: '同 checkpoint 对照 vLLM（带 #34577）或 B200 W4A4 路径；检查 weight_scale_2 是否为 1'
  fix: 上游修复已存在：vllm-project/vllm#34577（幂二重标定 block scale 并除同因子全局 scale，MoE 层共享单因子，merged 2026-03-17）——SGLang 侧待移植（issue open 时 0.5.22/main 均未含）
