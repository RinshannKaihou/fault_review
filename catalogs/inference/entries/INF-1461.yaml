  confidence: documented
  coverage: NEW
  discovered: '2026-10-19'
remarks: 与 10-18 收录的 INF-1453/1454（SM86 FP8/AWQ Marlin 间歇错）不同：本条是确定性全量乱码、根因在 scale 重标定假设、上游已有对照修复可引
