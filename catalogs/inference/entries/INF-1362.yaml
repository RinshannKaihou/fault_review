original:
  mechanism: '`SpeculativeConfig.__post_init__` 对 MTP（draft=target checkpoint）只复制 model/quantization 不复制 revision/code_revision。'
  source: 'vLLM #61197（2026-10-12 open，ZeroDivisionError 堆栈 + 显式 revision 绕过验证；0.31.0 vs 0.29 回归对照）。https://github.com/vllm-project/vllm/issues/61197'
  behavior: 报告形态为启动 crash（fail-loud）；draft 权重身份与 target revision 脱钩的静默错误权重风险未证实，留观。仅按 draft 配置继承缺口编目。
  trigger_surface: vLLM 0.31 + MTP speculative + `--revision` 非默认分支 checkpoint（config）
  discovery: 2026-10-12 每日扫描。
  meta: '`infra_off`（vLLM `method=mtp` speculative config 的 draft `ModelConfig` 用 `revision=self.revision`（默认 None）：draft 继承 target 的 `model` 与 `quantization` 却**不继承 `--revision`**——从非默认分支加载 target（如 `--revision pre-final`）时 draft config/权重从仓库**默认分支**加载，revision 不匹配可致启动 `ZeroDivisionError`（n_predict 解析为 0）；0.29 正常、0.31.0 回归。显式在 speculative config 里传 revision 可绕过——静默面在于 draft 可能在无 crash 的配置下直接用默认分支权重服务（本报告以 crash 形态呈现，静默错误权重风险为推断、待单独证据） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
