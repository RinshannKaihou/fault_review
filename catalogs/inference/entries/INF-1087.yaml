  meta: '`infra_off`（PP≥2 + MTP + prefix caching（hybrid，Qwen3.8-Flash-Next 复现，`max_num_seqs`≥3）下：`MambaSpecDecodeGPUContext` **一次性捕获**的 block table 指针被按**每步重收集的 batch 序**索引——PP 下非末 rank 的 postprocess 持有的是陈旧 batch 映射，用 batch row 走进别的请求的 block id：14–33% 请求退化为常量 token 循环（token 1023 = all-NaN logits 行的确定性采样输出，prompt 无关），spec acceptance 50%→26%；阈值恰为 2→3 并发 slot） · Cov: `NEW` · 触发 `partial` · 置信度 `verified`'
  mechanism: 'context 捕获（`initialize_from_forward_context` 幂等、只捕获一次）与 V2 runner 绑定的**逐步 gathered** `input_block_tables`（batch 序、每步重收集）生命周期错配：align copy kernel 以 `bt_row_idx = batch_idx` 解析行，异步调度 + PP 下非末 rank 的 postprocess 在 batch 收集之后 `pp_size` 步才运行——其 batch 映射已陈旧。错误读写使 recurrent state 被毒化且**永不恢复**（NaN logits → 采样器确定性吐 1023）；与 #54173 的 IMA 报告同根：sm_121 显形为 illegal access（响）、sm_80 越界读落在映射内（静默）。MTP 单独与 PP 单独均干净，组合才触发。'
  source: 'vLLM PR #55506（2026-09-05，含触发阈值测量、NaN-token 1023 机制定位与 #54173 关联）。https://github.com/vllm-project/vllm/pull/55506'
  behavior: 双显形谱——sm_121 crash / sm_80 **静默常量循环 + acceptance 塌陷**（无 crash、无 NaN 报警，NaN 只存在于 logits 内部被采样器吸收）。「**捕获一次的上下文 × 每步变化的序**」新子签名：生命周期错配在 spec 解码上下文层；与 6.194（courier 缺 record_stream）同为异步流状态失配，本条在 batch 元数据域。
