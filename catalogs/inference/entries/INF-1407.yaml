original:
  mechanism: flashinfer plan()（scheduler.cuh）把 plan 信息填进复用的 _pin_memory_int_workspace_buffer（pinned host 内存）并用 cudaMemcpyAsync 发起 H2D，事后无任何同步。若 host 领先 device（前序 kernel 未完成），下一次 plan() 会在上一次拷贝执行前覆写同一 pinned buffer，前一次 plan 排队的 kernel 读到撕裂/错误的 plan info。复现（FA2 auto、SM86、paged prefill fp16、Hq/Hkv/D=16/8/128、page 16、causal）：plan(A)→run(A)→立即 plan(B)，用 torch.cuda._sleep 让 device 落后；无 guard 5/5 MISMATCH（max_abs_err 0.1022~2.046），偶发一次迭代耗时数分钟（kernel 行为异常）；--guard（每次 plan 前同步前次拷贝事件）5/5 OK。main 3637083a3 仍存在。
  source: https://github.com/flashinfer-ai/flashinfer/issues/6533
  behavior: 在同一 wrapper 上快速连续 plan 不同 batch（如 vLLM 每步调度重新 plan 的服务形态）且 device 忙时，前一次 run 的 attention 输出错（与参考 max_abs_err 0.1~2），有时对应 kernel 卡跑数分钟；输出仍正常返回、无报错。等待前次 plan 的 H2D 完成后（guard）全部正确。
  trigger_surface: flashinfer 0.7.0.post1（至 main 3637083a3）；BatchPrefillWithPagedKVCacheWrapper.plan() 复用 pinned int workspace；同一 wrapper 连续 plan 且 host 领先 device；SM86 实测（机制与架构无关）
  discovery: 2026-10-16 每日扫描
  notes:
  - '2026-10-20 回访 2026-10-20：flashinfer #6533 仍 open（本轮窗口无新活动）'
