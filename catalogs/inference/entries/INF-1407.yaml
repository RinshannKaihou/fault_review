id: INF-1407
legacy_ids: []
slug: flashinfer_plan_pinned_workspace_h2d_race
aliases: []
title: flashinfer plan() pinned 缓冲 H2D 竞态
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: plan() pinned workspace
  behavior: plan() 填复用的 pinned int workspace 后 cudaMemcpyAsync 拷出、事后无同步；下一次 plan() 在拷贝执行前覆写 buffer，前次 plan 的 kernel 读撕裂 plan info
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: FA2 paged prefill fp16：plan(A)/run(A)/立即 plan(B) 时 run(A) 读到 B 的 plan info，5/5 MISMATCH（max_abs_err 0.10~2.05），偶发 kernel 跑数分钟；--guard（等前次拷贝）5/5 OK
  visibility: 静默错误
mitigation:
  detect: plan 后立即再 plan 的场景做输出对照；guard 前后差分；未评估
  fix: 待定（issue open，报告者给出 --guard 复现对照，尚无修复 PR）
