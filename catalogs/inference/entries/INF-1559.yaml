id: INF-1559
legacy_ids: []
slug: ops_math_fill_diagonal_v2_sparse_uint64_underflow
aliases: []
title: fill_diagonal_v2 sparse 对齐回退下溢漏写对角
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: fill_diagonal_v2 sparse
  behavior: Init 里 blockStart 减去 cache 行对齐回退量（uint8 时最多 127），tiling 分块无最小块长保证；块长小于回退量时无符号减法下溢绕成巨值，blockStart>=0 保护对 uint64 恒真
effect:
  objects:
  - 数值结果
  detail: T 为 1 字节、输入基址未 128B 对齐、存在 blockLength<128 的非首核（如 totalLength=100 分 48 核→blockLength=2）时，该核 diagIndex 越界、while 循环不执行，其负责的对角线元素保持原值被静默漏写
  visibility: 静默错误
mitigation:
  detect: 小矩阵（sparse 路径，step<stepThreshold）+ 1 字节 dtype + 多核的场景，与 CPU fill_diagonal 逐元素比对，检查对角线是否整段保持原值
  fix: issue 附修复方案（closed）：先算回退量再与 blockStart 比较，不足则钳到 0（2 行改动）；合入版本未核实
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: ''
evidence:
- url: https://gitcode.com/cann/ops-math/issues/2887
  kind: gitcode_issue
relations: []
original:
  mechanism: 'conversion/fill_diagonal_v2/op_kernel/fill_diagonal_v2_sparse.h 的 Init（L43）里执行 blockStart -= (blockStart * sizeof(T) + reinterpret_cast<uint64_t>(x)) % CACHE_BLOCK_SIZE / sizeof(T)：cache-line 对齐回退量最大为 CACHE_BLOCK_SIZE/sizeof(T)-1（T=uint8 时 127）。tiling（fill_diagonal_v2_tiling.cpp L101）按 totalLength/totalCoreNum 分块且不保证最小块长，sparse 路径恰好在小矩阵（step < stepThreshold）触发——当 blockLength 小于回退量时（如 totalLength=100、48 核 → blockLength=2；T=1B 且 x 基址非 128B 对齐），无符号减法下溢使 blockStart 环绕为巨值。随后 L61 的防护 blockStart >= 0 ? blockStart : 0 对 uint64_t 恒真，拦不住；diagIndex 计算越界导致该核 while 循环不执行，静默漏写其负责的对角线元素。'
  source: 2026-08-26 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2887 （closed）
  behavior: 用小矩阵、1 字节 dtype（如 int8/uint8）在多核上跑 fill_diagonal，返回成功、无报错，但结果里有一段对角线根本没被填充值覆盖，保持输入原值；矩阵越小、核数越多越容易命中，看起来像“这个算子偶尔不生效”。
  trigger_surface: ops-math fill_diagonal_v2 sparse 路径（step<stepThreshold）；1 字节 dtype + 基址非 128B 对齐 + 多核分块后存在 blockLength<128 的非首核
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
