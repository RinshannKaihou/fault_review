  meta: '`infra_off`（matmul/linear 融合 bias + SOFTPLUS epilogue 不转发 `activation_param2`（beta_reciprocal）——阈值以下 softplus 输出**恰为 0**；host 正确计算 param2（`matmul_utilities.hpp:313-329`）且每个工厂按名推送，唯 bias epilogue 丢失；nightly PCC 门以 0.994931 对 0.994 阈值**以 0.0009 之差通过**——测试分布放行结构归零 bug） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 'nightly 用 K=4096/8192 的 `torch.randn`：matmul 输出 std≈64/90 对默认 threshold=20，~40% 元素线性直通且幅值数百、主导 PCC；被归零的元素幅值均小、对 PCC 贡献近零；配套 atol=0.008*K/rtol=2.5*K 松到不约束任何东西。对同分布建模坏内核（y>20 ? y : 0）对 torch golden 的 PCC=0.994931，与 nightly 实测一致——假阴性被定量复现。'
  source: 'tt-metal #55266（2026-09-02 open，含 nightly run 编号、PCC 建模推导与分布修复建议）。https://github.com/tenstorrent/tt-metal/issues/55266'
  behavior: 无 crash——softplus 的非线性段（softplus 与 0/x 差异最大处）整段归零；gating/Mamba 类门融合用户静默损坏。方法论警示「**阈值 × 分布联合假阴性**」：大 K 随机分布使 PCC 祝福结构性 bug——与 1.105（容差回退假阳性）方向互补的经验对偶。
