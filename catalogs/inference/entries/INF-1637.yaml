- url: https://github.com/triton-lang/triton-ascend/issues/2364
  kind: github_issue
relations:
- kind: var
  target: INF-1634
pattern: PAT-INF-0176
original:
  mechanism: 在 Ascend NPU 上用 triton.compile 的 ASTSource 显式声明 signature={"output":"*fp32","value":"fp16"}（或 bf16），kernel 仅做 tl.store(output, value.to(tl.float32))，宿主传 1.5，则输出不是 1.5；同一脚本把 signature 改成 fp32 或 CUDA 上游 Triton 上跑 fp16/bf16 均正常。报告明确这是 incorrect-result 而非编译失败，且 3.2.2 与 3.6.0 两个版本都复现。因为没有 pytest 依赖、只需一个 kernel 和一行 signature，可判定问题落在 Ascend 后端对运行期半精度标量实参的打包/解包（launcher 与二进制对 fp16/bf16 标量的约定不一致），而不是用户 kernel 写法。
  source: 2026-09-23 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/2364 （open）
  behavior: kernel 里用半精度标量做缩放或 eps（例如 1.5 的 scale）时，输出整体按一个错误的比例缩放，数值看起来仍然“合理”，既不报错也不出 NaN；对照 fp32 标量的控制组完全正确，因此很难在真实模型里定位——通常表现为精度对不上、loss 稍差，而不是明显崩坏。
  trigger_surface: 运行期标量实参显式声明为 fp16/bf16（ASTSource signature）；fp32 不触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
