id: INF-1637
legacy_ids: []
slug: triton_ascend_runtime_fp16_bf16_scalar_arg_wrong
aliases: []
title: 运行期 fp16/bf16 标量实参传值错误
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 运行期标量实参传递
  behavior: 显式声明为 fp16/bf16 的运行期标量实参被错误解释，kernel 内 .to(tl.float32) 后存出的值不等于传入值；fp32 标量对照正常，3.2.2 与 3.6.0 均复现。
effect:
  objects:
  - 数值结果
  detail: 最小核只做 value.to(tl.float32) 再 store，传 1.5 得不到 1.5，fp32 对照正确；任何用半精度标量做 scale/eps 的 kernel 都会静默偏，无报错、无 NaN。
  visibility: 静默错误
mitigation:
  detect: 对 kernel 的每个半精度标量实参做恒等回读用例（store 后与 Python 侧值比较）；单测里补 fp16/bf16 标量签名
  fix: 规避=标量按 fp32 声明、kernel 内显式转型；无修复 PR（open）
labels:
  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: triton-ascend 3.2.2 与 3.6.0；仅在 ASTSource.signature 里显式写 fp16/bf16 的运行期标量（不依赖 Python float 推断）时触发，fp32 正常
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: ''
