  meta: '`infra_off`（Kimi-K3 在 32×H100（TP8/PP4、FLASHMLA + marlin MoE、MXFP4 权重）启动即失败：#54697 引入的 low-M TP8 KDA projection-overlap 路径在 CUDA-graph profiling 期 `kda_skinny_gemm.run_n()` 触发 CUTLASS DSL 编译器 `NVVM_ERROR_COMPILATION`（sm_90a）；两个独立 4 节点部署复现，回退 #54697 之前的版本即正常） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: KDA（Kimi Delta Attention）skinny-GEMM 的 CUTLASS DSL 生成代码在 Hopper sm_90a 目标上无法通过 NVVM 编译——优化路径（projection overlap）在特定 arch target 上生成非法 IR；启用 CUDA graphs 时 profiling 阶段即触发。与 6.183 族不同：本条是**编译期硬失败**（fail-loud）而非数值损坏，但同样源于"为特定重叠模式新增的内核路径未在全 arch 矩阵验证"。
  source: 'vLLM #55350（2026-09-04 open，label: bug/nvidia/quantization/kimi/k3，双 4 节点复现 + 版本二分）。https://github.com/vllm-project/vllm/issues/55350'
  behavior: 启动崩溃（fail-loud，NVVM_ERROR_COMPILATION）——该模型+硬件组合完全不可部署；与静默类故障相反，诊断容易但屏蔽了下游所有正确性问题。工具链组合（CUTLASS DSL 4.6.2 pin × CUDA 13.0 × sm_90a）是又一例"内核生成器对特定 arch target 未验证"。
