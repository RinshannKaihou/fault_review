  behavior: 张量重载 ttnn.where 接受 BF16 条件 + FP32 值张量不报错但输出全错：全 false 谓词每 lane 返回 2 的幂垃圾（~1e34），半掩码存活 lane 返回 denormal；标量重载会拒绝，张量重载漏检。
