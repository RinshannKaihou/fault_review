  detail: cond 全 false 应逐 lane 返回 x，实测 2^113/2^97 量级垃圾或 -8.9e-41 denormal；typecast(cond,fp32) 后 bit-exact 正确；生产命中 FP32 MoE router masked-fill 后 topk 选任意专家
  visibility: 静默错误
