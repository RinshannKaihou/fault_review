original:
  mechanism: 两例同一族：图可视化（graph_visualize / TensorBoard 节点视图）的节点状态与详情数值判定脱节。#530：MSProbe 26.1.0.post1，SGLang v0.5.14-cu129、PyTorch 2.11.0+cu129、RTX 4090，Qwen3-4B bf16、tp-size 1、flashinfer 后端，task=statistics、level=mix、summary_mode=statistics，两侧 dump 用同一 rid 发同一请求（否则字符串数据不同会导致节点匹配失败）；在问题侧第一个 Decoder Layer 的 MLP 输出 x += 20 注入偏移后，图里只标记该 MLP 节点，后续 Decoder Layer 未被标记，但下一层详情里两侧 input.1 的 Max/Min/Mean/Norm 已明显不同。#302：msprobe 2026/5/12 master 编译版，statistics 模式，graph_visualize 生成的 db 中 Functional.linear.0.forward 默认匹配且判 error 标红；在界面「取消匹配」再「建立匹配」重建同一匹配后，计算内容与自动匹配不一致且节点变橙色；另一场景自动匹配判 pass（两侧最大值为 nan/inf）的同一节点，重建匹配后颜色仍是白色但计算内容同样不同。两例都说明匹配状态与统计口径没有绑定，issue 均无修复 PR。
  source: 2026-08-19 GitCode Ascend/msprobe issue https://gitcode.com/Ascend/msprobe/issues/530 （closed）与 2026-05-12 https://gitcode.com/Ascend/msprobe/issues/302 （closed）
  behavior: 用图可视化定位首个数值差异时，图上只有一个节点标红，下游层看着「干净」，但点开详情会发现下游输入侧的 Max/Min/Mean/Norm 早就不一样了；照图判断会得出「误差只出在这一层、后面没传播」的错误结论。更麻烦的是同一节点在界面里取消匹配再重新建立匹配，算出来的数值和颜色会变，用户无法确定哪个结果才是工具的真实判定。
  trigger_surface: msprobe graph_visualize / TensorBoard 图比对，statistics（summary_mode=statistics）dump；推理框架侧采集需固定 rid；含 Decoder Layer 级下游传播的场景
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
