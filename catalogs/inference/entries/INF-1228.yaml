  signature: '`model_on` 的**极点**——这是"扰动"完全为零的情形：模型的计算全对，只是内容错。geometric 族预期表现很差，而 infotheoretic 族（`predictive_entropy`，另有 `eigenscore`、`logit_lens_kl`、`cross_layer_mutual_info`）显著更高——因为可见的差异是**预测分布的不确定性结构**而非隐状态位置。model_on 与 infra_off 的签名方向预期近正交（签名向量余弦接近 0），即两者是可分的方向而不是同一根轴上的强弱。会漏检的是：全部 cheap 族（重算一致、无 NaN、batch 不变），以及 geometric/spectral 中任何依赖"偏离健康分布"的度量——健康分布里本来就包含答错的样本。'
