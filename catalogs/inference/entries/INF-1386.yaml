title: ttnn.sort fp32 NaN 越过 padding 索引泄漏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: ttnn.sort padding 比较
  behavior: ttnn.sort 把排序维 pad 到 2 的幂，pad 值取应排最后的极值；设备按符号+幅值位比较 fp32，NaN 幅值大于 inf：NaN 排到 padding 后被 slice 丢弃，padding 元素（索引 ≥n）顶替。
effect:
  objects:
  - 数值结果
  detail: fp32 输入含 NaN 时，返回越界索引（≥n，max index=1003），输出 NaN 计数 0（期望 4）；三工厂、升降序、stable 两态均复现，无报错。torch.sort 语义：NaN 升序排最后。
  visibility: 静默错误
