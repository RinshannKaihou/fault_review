original:
  mechanism: ttnn.sort 的 padding 设计：排序维 pad 到 2 的幂、pad 值取应排最后的极值（升序 +inf/降序 -inf），排序后 slice 回 n。设备按 fp32 符号位+幅值位比较：+NaN(0x7FC00000) 幅值 > +inf(0x7F800000)、-NaN(0xFFC00000) 幅值 > -inf(0xFF800000)，故升序 +NaN 排到 +inf padding 之后、降序 -NaN 排到 -inf 之后：NaN 落位超过 n 被 slice 丢弃、padding 元素（索引 ≥n）顶替。NaN 与 padding 永不打平，index-aware 比较器（Cross Core/padded Multi Core/stable）也无济于事。WH N150 实测 n=1000/3000/300000 三工厂、升降序、stable 两态：out-of-range indices=4、max index=1003、输出 NaN 计数 0（期望 4）。torch.sort 语义：NaN 升序排最后。
  source: 'tt-metal #60613（2026-10-14 open，Bad Outputs 标签，含位级机制表与三工厂复现脚本）。https://github.com/tenstorrent/tt-metal/issues/60613'
  behavior: fp32 含 NaN 输入的 sort 静默返回越界索引（≥n，max index=1003）且输出值中 NaN 消失（期望保留 4 个）；三工厂、升降序、stable 两态均复现，无报错。
  trigger_surface: ttnn.sort + fp32 + 输入含 NaN（所有 sort 工厂）
