  section: 第 7 类 · 量化（PTQ / 低位 / FP8 / 微缩度）
  meta: '`infra_off`（SM107（Rubin）dense NVFP4 `mm_fp4` 内核族**在所有测试过的环境中被静默禁用**：`dense_blockscaled_gemm_sm107.py` 从 CUTLASS DSL wheel 的 **examples 树**导入父类——`nvidia-cutlass-dsl` 根本不暴露可导入的 `examples` 命名空间（wheel 实为 `.pth` 重定向器，RECORD 中 examples 出现 0 次，4.7.0 公开版与 4.8.0a0 内部版均无）——**该 import 路径从来不可能解析成功**；两个调用点用 `except ImportError: pass` 吞掉失败，`Sm107Kernel` 恒为 None，`gemm_base.py` 全部 SM107 门控路径静默走非 SM107 分支。无警告、无日志、无错误） · Cov: `var:trtllm_moe_op_provider_resolved_before_per_layer_quant_config`（7.77 后端/内核选择静默降级族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`flashinfer/gemm/kernels/dense_blockscaled_gemm_sm107.py` 的 `from nvidia_cutlass_dsl.examples.CuTeDSL.cute.blackwell.kernel.blockscaled_gemm import ...` 依赖不存在的模块路径；`gemm_base.py:6399` 与 `kernels/utils.py` 的裸 `except ImportError: pass` 把永久性 ImportError 伪装成"特性不可用"。修复 PR #4856 已有提议。'
  source: 'flashinfer #5065（2026-09-09 open，含 wheel RECORD/top_level.txt 证据、两版本核对与调用点分析）。https://github.com/flashinfer-ai/flashinfer/issues/5065'
  behavior: 无 crash——SM107（Rubin）拿不到原生 NVFP4 tactics：静默回退非 SM107 内核（性能损失 + 潜在精度差异），且不可诊断（"no warning, no log line, no error"）。7.77（MoE provider 先于 per-layer config 解析）与 1.184（形状守卫自比较）的合体形态：**不可达代码路径 + 静默吞异常**——「verification 层坏死」家族在内核选择维度的体现。
  trigger_surface: flashinfer + SM107 (Rubin) + dense NVFP4 mm_fp4（hw_specific：代际特定且全环境命中）
  discovery: 2026-09-09 每日扫描。
