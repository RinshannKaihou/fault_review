original:
  mechanism: cann/ops-nn issue 6112（2026-09-21，closed）：MindStudio Sanitizer（mssanitizer）racecheck 在 kernel SwigluGroupQuantGrad_float16_high_performance_0 上检出 2 条 Potential WAR，均为 PIPE_MTE3 Read 与 PIPE_MTE2 Write 打在同一 UB 地址（WAR()+0x4000 与 +0x6000）。源码上 CopyOutGradX 第 466/467 行 DataCopyPad 把 gradX 从 UB 搬出到 GM，process 外层循环复用的 xQueue buffer 在下一轮 CopyInX（第 156/158 行）又被搬入新输入；CopyOutGradX 只有 V_MTE3 正向同步，搬出后没有 MTE3_MTE2，MTE2 侧不等待 MTE3 读完就覆盖。工具事件日志给出指令级证据：367/368 读 UB 0x4000/0x6000，486/487 写同地址，中间 MTE2 流水无等待。作者附补丁后 racecheck 报 No error detected。
  source: 2026-09-21 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6112 （closed）
  behavior: 同一个 gradX 输出缓冲在上一轮还没搬出 GM 时就被下一轮输入覆盖，被污染的是反向传播写回的梯度：产物既可能少一段也可能串到别的 tile，运行不报错、不产生 NaN，单次比对常常看着正常；只有在 racecheck 下才稳定复现成 UB 写后读告警。
  trigger_surface: swiglu_group_quant_grad + 外层循环多轮复用同一 UB buffer
