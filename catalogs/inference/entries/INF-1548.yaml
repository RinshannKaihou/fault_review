id: INF-1548
legacy_ids: []
slug: vllm_ascend_fia_bool_mask_ignored_past_512
aliases: []
title: FIA bool atten_mask 在 512 之后被静默忽略
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: FIA 算子 mask 处理
  behavior: sparse_mode=0 且 bool atten_mask 形状为 [1,1,1,S] 时，算子只在 KV 位置 0–512 内应用 mask，超过 512 的部分不读 mask，也不报错不告警；512 是硬编码常数。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: L≤512 与 fp32 参考一致，L=513 起结果错误、绝对偏差最大约 0.25；pse_shift [1,1,1,S] 几乎每个长度都错，给足 head 维 [1,N,1,S] 才处处正确。
  visibility: 静默错误
mitigation:
  detect: 固定 block_size 扫 KV 长度 L，在 L=512/513 两侧与 fp32 参考比绝对误差；同时比对 rank-2 [1,S] mask（该形状会被 561002 拒绝，属正确行为）
  fix: 待定（issue open，无修复 PR）；规避：pse_shift 用完整 head 维 [1,N,1,S]，不要用 [1,1,1,S] 的 bool mask 承载设备侧 decode 长度
