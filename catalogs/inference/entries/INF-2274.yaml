  mechanism: tt-metal ttnn.experimental.quasar.slice 的 RM 分片对齐守卫缺失（#58407 item 21，定位 ttnn/cpp/ttnn/operations/experimental/quasar/slice/slice.cpp:53）：对 row-major BLOCK/WIDTH 分片且分片行非缓冲对齐倍数的张量静默返回错误值。复现：RM bf16 (1,1,64,96)，WIDTH_SHARDED L1 8 核（分片 (64,12)，24B 行），begin (0,0,0,0)、end (1,1,32,96)、step 1、输出 L1_INTERLEAVED。W=96 tile 对齐且 width begin=0，needs_rm_composite_input 返回 false 不分流（slice.cpp:188-192）；设备算子校验无分片对齐检查；select_program_factory 把 RM、非 HEIGHT 分片、step-1 工作路由到 SliceRmProgramFactory（slice_device_operation.cpp:279-296），该工厂用 spec.shape[1]*element_size()=24 计算 page size，无对齐处理，错步进读取产生静默错值。
  source: GitHub issue https://github.com/tenstorrent/tt-metal/issues/63277 （open，2026-10-29，#58407 item 21，含定位与复现配置）
