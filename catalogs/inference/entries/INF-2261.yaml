original:
  mechanism: 'cann/ops-nn 的 aclnnGeluMul 在 Ascend 910B3（Atlas A2）、CANN 9.2.0、仓 master 754a2ee9、算子目录 activation/gelu_mul（无 op_api/，接口由 op def 生成）、二进制 CANN 内置 opp/built-in/.../gelu_mul 的输出校验缺口，两个独立表现：1) 非连续 out：资料参数表把 out「非连续Tensor」标为 ×（#6024 已从 √ 改 ×，即声明不支持），实测不拒绝不转换直接按连续写——以 input=fp32[8x16]（应写 8x8=64 元素）、out 逻辑 [8,8] stride=[16,2] storage=128 为例，两段返回 0、写 64 个元素落在连续前 64 位、按 stride 读回 max|diff|=1.55579054，错位模式可直接对上（strided[1]==contig[2]）；2) 偏小 out：不校验 out 形状，声明元素数小于推导值时仍按 input 推得元素数写满，out=[4,8] 越界 128B、[1,4] 越界 240B，越界量=（应写-声明）×元素字节，两组独立用例逐字节吻合；out 尾轴未折半/偏 1 时写 64 个元素后剩余未写。dtype 不一致时第一段返回 161002，证明接口层有校验位置只是形状/连续性漏检。同日同仓 FatreluMul（issue #7647，A2/A3 arch22 路径）为同型缺陷：out shape 不校验、偏小 out 越界写 32-48B（大 shape 线性放大至 80000B）且 mssanitizer memcheck 实测报 illegal write of size 32，arch35 路径已有三检（op_host/arch35/fatrelu_mul_tiling_arch35.cpp:213-241）而 arch22 缺失。'
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7668 （非连续 out，open，2026-10-29）；同型 https://gitcode.com/cann/ops-nn/issues/7654 （偏小 out 越界写）；同型 arch22 缺口 https://gitcode.com/cann/ops-nn/issues/7647 （FatreluMul，memcheck 佐证）
  behavior: 调用 aclnnGeluMul 时如果 out 张量是非连续布局（如 slice 后的视图）或声明的 shape 比应输出的小，接口两次调用都返回 0：非连续 out 按连续布局写入、调用方按自己的 stride 读回就是错位的值（max|diff|≈1.56）；偏小 out 则直接越界写相邻显存 128-240B（更大的输入线性放大），可能破坏同缓冲区其他张量；无任何报错。dtype 错反而会报 161002，唯独 shape/连续性漏检。同型 FatreluMul 在 A2/A3 上同样越界写且被 mssanitizer 抓到 illegal write。
  trigger_surface: Ascend 910B3 / CANN 9.2.0（gelu_mul 内置 kernel；fatrelu_mul arch22 路径 910B2/B3）；out 非连续或 shape 声明偏小；激活融合算子直调或经框架构图。
  signature: out 金丝雀 0xA5 残留 + 按 stride 读回错位（strided[1]==contig[2]）；越界量=（应写-声明）×元素字节；mssanitizer memcheck illegal write。
  repro: 两 issue 均含自包含 repro.cpp（金丝雀 + stride 读回判读）。
  discovery: 2026-10-29 每日扫描
