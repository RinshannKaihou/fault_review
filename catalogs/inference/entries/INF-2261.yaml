id: INF-2261
legacy_ids: []
slug: gelu_mul_noncontig_out_silent_miswrite
aliases: []
title: GeluMul 非连续 out 与偏小 out 静默错写/越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: gelu_mul out 校验
  behavior: aclnnGeluMul 不校验 out 非连续性与形状：非连续 out 返回 0 但按连续布局写入；out 声明元素数小于推导值时同样返回 0 并越界写相邻 device 内存。
effect:
  objects:
  - 数值结果
  detail: fp32[8x16] 输入：非连续 stride=[16,2] 读回 max|diff|=1.556（strided[1]==contig[2] 错位对上）；out 声明 [4,8] 越界 128B、[1,4] 越界 240B；dtype 错反而返回 161002，唯独 shape/连续性漏检。
  visibility: 静默错误
mitigation:
  detect: out 传非连续 stride 或偏小 shape 后按调用方 stride 读回与连续基线对比；越界可用 mssanitizer memcheck（同族 FatreluMul 已实测报 illegal write）。
  fix: 待定（issue 期望：非连续/形状不符返回 161002 或先转连续再回写；未见修复 PR）
