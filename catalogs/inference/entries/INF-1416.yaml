    component: OpAPI copy_ 共轭目标处理
  behavior: 对 complex 张量的 conj()/mH 视图调用 copy_ 时目标共轭位未处理：源逻辑值被原样写入底层存储，而读取该视图应得到共轭值
effect:
  objects:
  - 数值结果
  detail: 把 9+3j 写入 base.conj() 后底层存 9+3j（应存 9-3j），视图逻辑值与源不一致；触发于 torch_npu copy_ 以 complex64/complex128 的 conj()/mH 视图为目标，910B3 实测。
  visibility: 静默错误
mitigation:
  detect: copy_ 到 conj 视图后检查底层存储字节与源共轭对照
