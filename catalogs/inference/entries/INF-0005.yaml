original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off` · Cov: `var:1.212` · 触发 `yes` · 置信度 `verified`'
  mechanism: 单粒子翻转（SEU）翻掉 GPU SM 寄存器堆 / shared-mem scratch 中某个 bit，而该处正保存着一个中间激活片段或 GEMM 累加器。寄存器堆是 GPU 上 AVF 最高的结构：注入到寄存器的故障中约 **36%** 会产生 SDC（对比 shared memory **23%**、global memory **11%**）。故障只存活一条指令，可能只污染一个 thread-lane。本条为 MERGED 条目，合并了两个子故障：（a）register-file SEU；（b）sub-row / partial-corruption SEU（行内子片段的部分损坏）。
  source: '"Silent Data Errors in GPUs: Challenges and Mitigation in Modern Silicon", computerresearch.org 2025, https://computerresearch.org/index.php/computer/article/download/102474/23373/41996 。工具链旁证：SASSIFI（NVIDIA ISCA''17）、NVBitFI（DSN''21）、gpuFI-4（Tsoutsmanas ISPASS 2022）。'
  behavior: 瞬态、通常只影响单个 token：一个 token 略微出错，或某个激活矩阵的**部分行**被弄乱。极少出现 NaN。
  trigger_surface: register file SEU 软件近似
  signature: 与 `sdc_spike` 明显不同：空间范围**很小**（单个 thread-lane / 一行中的一小段连续切片）且**转瞬即逝**。它表现为一个"行内子向量离群点"，而不是整通道尖峰；per-position kurtosis（statistical）加 trajectory 度量能抓到，whole-channel 度量则可能漏检。
  repro: 用 hook 在**某一层、某一个 token 的行向量中的一小段连续切片**上翻位/加噪，切片长度远小于 hidden_size。
