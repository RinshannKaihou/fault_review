original:
  mechanism: ops-math commit 77f7e4c2286fb5a6c5f473f6df25b07236fe49d7（CANN 9.2.0-beta.2 线）。math/arg_max_with_value/tests/assets/golden.py 的 arg_max_with_value_golden 与 aclnn_max_dim_golden 对归约轴处理与 keep_dims/keepdim 契约不一致：前者用 np.take_along_axis 构造 values 后始终保留归约轴，且 keep_dims=true 时没有扩展 indices；后者在 NumPy 分支里 keepdim=false 不压缩 values、keepdim=true 又把已保留归约轴的 values 再扩一维。实测 (2,3) 输入沿 axis=1 归约：kernel golden 在 keep_dims=false 返回 indices (2,)、values (2,1)，keep_dims=true 仍返回 indices (2,)、values (2,1)；aclnn golden 在 keepdim=true 返回 values (2,1,1)、indices (2,1)，而算子定义要求两个输出 shape 相同（不保留 (2,)、保留 (2,1)）。现有启用的 ST 用例 math/arg_max_with_value/tests/st/ttk_kernel_arg_max_with_value_st.csv:3 输入 (64,1024,16)、dimension=1、声明两个输出 (64,16)，而 kernel golden 实际生成 values (64,1,16)。
  source: '2026-10-03 GitCode cann/ops-math issue #3393 https://gitcode.com/cann/ops-math/issues/3393 （open）'
  behavior: 算子看起来是通过的：ST 跑完是绿的，精度报告里也没有异常。但参考值本身的形状就和算子契约对不上——keep_dims 打开和关掉拿到的 values 形状完全一样，等于这个参数从没被真正验证过；一旦有人依赖 keep_dims 的语义，测试不会给出任何提示。
  trigger_surface: ops-math 的 ST/UT golden（NumPy 参考实现），纯 host 侧、不需要 NPU
