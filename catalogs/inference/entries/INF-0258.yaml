  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.floor_div(INT32 tensor, scalar)` 的 scalar 复合路径无整数实现：`binary_composite_op.cpp:876` 直接 `floor(multiply(input, 1.0f/value_f))`——(a) `multiply(int32, float<1)` 把 float 标量截断为整数 0，`|s|>1` 时**全部元素先归零**；(b) `ttnn.floor` 文档仅支持浮点 dtype 却无校验接受 INT32 并对**原始整数 bit 位**跑 float SFPU 内核：正整数是 denormal 位型被 flush 为 0、负整数是 NaN 位型原样穿过（`s=1` 时恰 ~50% 错——正半域全灭）。实测错误率：s=2/3/7/−2 全域 **100%**、s=1000 99.6%、s=1 48.7–57%（两种输入分布）；输出 dtype INT32、op 以 `kFloatAndInt32Dtypes` 宣称支持，无任何信号。同输入 `ttnn.div(t, 2, rounding_mode="floor")` **0% 错**——正确整数 floored divide 已在同 op 存在却未被复合路径复用） · Cov: `var:ttmetal_floor_div_host_reciprocal_exact_divisible_off_by_one`（1.123 floor_div 整数除法域——本条把同 op 的 INT32 tensor×scalar 路径从"整除边界差一"扩大到"全域错误"，且复合第二重缺陷：float-only floor 对整数 bit 的无校验接受） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 双重独立缺陷叠加（截断倒数乘法 + floor 的 dtype 松弛）；判决例 `[7,-7,100,2147483647,-9,1,3,0]÷2` → ttnn 全 0 vs torch `[3,-4,50,1073741823,-5,0,1,0]`；六除数 × 4096 随机输入错误率矩阵在 issue 内。
  source: 'tt-metal #58000（2026-09-26 open，Bad Outputs/silent，含对照脚本、错误率矩阵与双机制源码定位）。https://github.com/tenstorrent/tt-metal/issues/58000'
  behavior: 无 crash——任何走 tensor×scalar floor_div 的整数索引/分桶管线**全域静默错值**（多为 0）。1.123 之后 floor_div 族第二形态：该条只错整除边界、本条错一切输入；"文档化 dtype 契约 × 无校验接受 × bit 型重解释"与 1.190/1.250 typecast 整数域处理谱系同构。
  trigger_surface: tt-metal + `ttnn.floor_div` INT32 tensor × Python int 标量（hw_specific：默认路径；tensor-tensor 与 `rounding_mode="floor"` 干净）
  discovery: 2026-09-26 每日扫描。
