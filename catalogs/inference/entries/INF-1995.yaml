original:
  mechanism: 'issue #7759 记录 Qwen3.5-397B w8a8（vllm-ascend v0.17.0rc1）流式调用时，最后一个 chunk（finish_reason=tool_calls）返回的 delta.tool_calls 不是空数组，而是一个占位对象：id、type 为空串，function.name 与 function.arguments 也是空串，index=1。客户端按 OpenAI 的联合类型（tool_calls 为对象数组或空）解析，把该对象判为非法，抛 AI_TypeValidationError: Type validation failed（code invalid_union），本轮 agent 调用直接进入 error 状态。正文只给了原始 chunk JSON 与客户端报错栈，未给服务端源码位置。'
