  behavior: 流式工具调用本来已经正常收完参数，收尾那一帧却塞进一个字段全空的 tool_call 对象；用官方 OpenAI SDK 或严格 schema 的客户端会在这一帧抛类型校验错误，整轮对话失败。
  trigger_surface: Qwen3.5-397B w8a8 + v0.17.0rc1 + 流式 chat completions（stream=true）且响应带 tool_calls
