  meta: '`infra_off`（NGRAM 推测解码复用请求 ID 时，语料库插入更长上下文后（即使 `synchronize()` 后）**缓存请求仍返回陈旧 draft**——BFS/PROB 两种 match 模式均复现：缓存请求得 `[30,70,80,90]`（旧 trie 状态），同历史新请求得正确的 `[30,40,50,60]`） · Cov: `NEW` · 触发 `other_stack` · 置信度 `verified`'
  mechanism: '`NgramCorpus` 的请求级缓存条目在语料插入后不失效：draft 生成读取的是请求绑定时的 trie 快照/游标，`synchronize()` 只保证插入可见、不触发缓存条目重算。CPU 引擎（`SGLANG_USE_CPU_ENGINE=1`）纯 Python 最小复现，无需模型/GPU/服务。'
  source: 'SGLang #38129（2026-09-05 open，双模式 CPU 复现脚本 + 精确 commit `bd16c22a`）。https://github.com/sgl-project/sglang/issues/38129'
  behavior: 输出仍正确（draft 被 verify 拒绝）但接受率/吞吐静默劣化——**正确性无损的性能型缺陷**；对依赖 ngram 命中率的场景（长会话 agent 重复模式）逐步积累。与 11.62（MTP n_predict=None wrapper 作用域）同为 draft 供给端状态管理域；「**缓存条目不随底层数据结构更新失效**」是经典缓存失效问题在 spec 解码 draft 层的实例。
