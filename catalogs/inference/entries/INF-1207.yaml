original:
  category: cat13
  section: 第 13 类 · 模型图 / 架构配置故障
  meta: '`infra_off`（SGLang `deepseek_janus_pro.py` 把多个上游 Janus 文件压平进一个模块后，两个不相关实体同名 `Normalize`：L1095 的 torchvision 风格 transform **class** `Normalize(torch.nn.Module)`（`__init__(self, mean, std, inplace=False)`）与 L1792 的 VAE GroupNorm **factory** `def Normalize(in_channels, norm_type="group")`——Python 绑定后到者，import 后 `deepseek_janus_pro.Normalize` 是 factory。`CLIPVisionTower.__init__`（L1166）以 `Normalize(mean=..., std=...)` 调用 transform 却落到 factory：`TypeError: Normalize() got an unexpected keyword argument ''mean''`——**图片归一化路径根本无法运行**（自 #3203 引入 Janus-Pro 起即如此）。第二重缺陷：即便解除遮蔽，transform class 的 `forward` 还调用了错误函数 `F.normalize(tensor, self.mean, self.s...`（语义也不对）） · Cov: `NEW`（模块压平同名遮蔽→初始化路径不可用子签名） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 多文件压平（flatten）合并时命名空间冲突未做去重/别名——后定义的顶层函数静默遮蔽先定义的类；调用点按"transform 语义"书写却在运行期解析到 factory 签名，fail 于 TypeError。
  source: 'SGLang #39708（2026-09-16 open，含双缺陷定位（L1095/L1792/L1166 行号）、#3203 引入溯源与 main 954bb6804 验证）。https://github.com/sgl-project/sglang/issues/39708'
  behavior: 该路径 fail-loud（TypeError）——但效果是 **Janus-Pro CLIPVisionTower 图像归一化自引入以来不可用**：带自定义 mean/std 的视觉路径要么走不到、要么（绕过 TypeError 后）被第二缺陷错误归一化；静默面在绕过第一重遮蔽的部署里。模型图/命名空间族新成员：本条在 **跨文件压平的同名遮蔽**维度（与其余"配置错值"类条目机制不同）。
  trigger_surface: SGLang + Janus-Pro（deepseek_janus_pro.py 压平模块）+ CLIPVisionTower 自定义归一化路径（other_stack）
  discovery: 2026-09-16 每日扫描。
