  behavior: MegaMoe 融合 MC2 疑似缓冲区溢出；mega_moe_max_tokens=8192 相对 458752 的安全上界低约 56 倍，代码注释称溢出会精度退化，且怀疑不止缓冲区溢出。
effect:
  objects:
  - 输出内容
  - 可用性/进度
  detail: Kimi K3 W4A8 在 A3 4P4D 下每条请求都乱码(贪心 1+1=? 亦然),关掉 enable_fused_mc2 即恢复;首轮 prefill 约 1 分钟后以 vector-core 507035 崩溃,伴 glibc corrupted size
  visibility: 静默错误
mitigation:
  detect: 同一 build 只切 enable_fused_mc2 做 A/B;抓各 EP rank 的 sym-buffer 分配日志核对 ep_world/global_bs 一致,并核算 mega_moe_max_tokens 是否低于 num_max_tokens_per_rank×ep_world×topk×expert_per_rank
  fix: 待定（issue open）；规避：关闭 fused MC2（enable_fused_mc2=false），或把 mega_moe_max_tokens 提到安全上界以上
