original:
  mechanism: 'issue 记录开 MegaMoe（enable_fused_mc2: 2 + enable_prefill_mc2: true）后 Kimi K3 W4A8 在 Atlas 800I A3 上每条请求都返回乱码,重复请求每次必乱,首次运行 4 个 prefill API server 在首个请求后约 1 分钟全部中止并以 aclrtSynchronizeEvent 507035 报 AI-vector-core 异常,退出时 glibc 报 corrupted size vs. prev_size。隔离实验:同一代码 build、同一 CANN,把 enable_fused_mc2 置 false 后直连 prefill 与走 P→D 代理两条路径都输出正确,decode 侧不变且稳定;已知 mint 的 mega_moe_max_tokens=8192 相对 458752 的安全上界低约 56 倍,代码注释明写溢出会导致精度退化,且 sym-buffer 分配日志显示各 rank ep_world=64、global_bs=0,分配需在各 EP rank 间一致。作者同时排除了 attention 路径、KV 传输、HCCL 通信 kernel 与 SiTUGLU 能力检查,但指出连 1+1=? 这种极小请求也乱,怀疑不只是缓冲区溢出。'
  source: 2026-09-18 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16914 （open）
  behavior: 开 MegaMoe 后服务能正常拉起并接受请求,但任何请求拿到的都是乱码文本(如“有损gt迫不及待="";”这类混排字符),贪心解码也一样;压测时 prefill 节点随后以 vector-core 异常整进程退出,日志里只有 aclrtSynchronizeEvent 507035 和 glibc heap 损坏,没有 Python traceback。把 enable_fused_mc2 关掉,同样的权重、同样的请求立即恢复正常输出。
  trigger_surface: Kimi K3 W4A8 + A3 PD 分离(4P4D)+ enable_fused_mc2=2/enable_prefill_mc2=true;单请求即触发,与并发无关
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
