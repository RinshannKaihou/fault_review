original:
  mechanism: MindSpore 2.6/2.7.1/master 在 910B、driver 25.2.0、DeepSeek 网络开启多流并行下发的场景下，step 结尾没有同步所有 stream：Python 层 asnumpy 只同步计算流。非计算流上的 reset event 在 step 内未执行完，影响下一 step 的 record，而 aclrtCreateEventWithFlag 创建的 event 要求前一次 reset 先于下一次 record。issue 附有正常/异常时序图，并给出修复方向（流间插入 record/wait 对，或改用 aclrtCreateEventExWithFlag），无 PR 链接。
  source: 2025-11-11 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/20742 （closed）
  behavior: 910B 上跑 DeepSeek 一类开启并行下发的网络，进程偶发卡在 stream 同步：plog 里出现 event wait timeout occurred during task execution, event_id=113, timeout=1980s，随后 stream synchronize 失败、进程报错退出。同配置重跑可能正常，日志里看不到算子算错，只是等待超时。
  trigger_surface: Ascend 910B + MindSpore 2.6/2.7.1/master，多流并行下发并在 step 之间复用 event；driver 25.2.0
