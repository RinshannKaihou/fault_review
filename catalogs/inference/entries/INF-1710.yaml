id: INF-1710
legacy_ids: []
slug: ms_multistream_event_reuse_reset_order
aliases: []
title: 多流复用 event 时 reset 与 record 错位致等待超时
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: 多流 event 复用与 step 同步
  behavior: step 结尾只同步计算流，非计算流的 event reset 未在 step 内执行完；下一 step 复用时 record 先于上次 reset 生效，同一 event 顺序错位。
effect:
  objects:
  - 可用性/进度
  detail: 并行下发/多流场景偶现 event wait timeout：plog 报 event wait timeout occurred during task execution（timeout=1980s），随后流同步失败、进程退出；重跑同网络不一定复现。
  visibility: 挂起
mitigation:
  detect: step 结尾统计已同步的 stream 集合；多流并行下发压测时按 event_id 抓 plog 的 wait timeout，并检查 reset 是否在 step 内完成
  fix: issue 给出方案：step 结尾或 event 复用前在从流与默认流之间插入一对 record/wait（或改用 aclrtCreateEventExWithFlag），reset 后再补一对 event 把 reset 汇聚到主流；未见 PR 链接，发布状态未核实
