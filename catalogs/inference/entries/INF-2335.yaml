title: NormalizeBBox FP16 大高宽溢出输出 0 参考同步误判
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: normalize_bbox FP16 转换顺序
  behavior: 高宽为合法 INT32（如 65536）时旧实现先把它转成 FP16，超过 FP16 最大有限值溢出为 inf 后再相除，输出全 0；测试 GPU 参考重复同样的先转换顺序，把错误结果判为通过。
effect:
  objects:
  - 数值结果
  - 测试判定
  detail: FP16 boxes 且 shape_hw 为 INT32、值达 65536（>65504）时，归一化框坐标输出全 0 而非 0.01526，12/12 错；旧 GPU 参考同步输出 0，cross_check 误判 PASS；修正参考后旧内核 FAIL，FP32 输入正常可作对照。
  visibility: 静默错误
mitigation:
  detect: 用提升精度的数学参考（如 FP64 或先除后转）替代同样低精度的 GPU 参考；hw≥65536 的边界用例覆盖。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/13275 （open：修 Host 推导校验 + 用例；数值修复包含在内，未发布未核实）
