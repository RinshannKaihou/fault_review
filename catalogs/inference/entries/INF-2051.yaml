title: minimax_m2 解析器把 tool_call 留在思维链
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: minimax_m2 解析器
  behavior: reasoning parser 只切 content 与 reasoning 两个通道，不把 reasoning_content 中的 <minimax:tool_call> 块解析成 tool_calls，工具调用文本整段留在思维链里
effect:
  objects:
  - 输出内容
  - 可用性/进度
  detail: Minimax-M2.7 + minimax_m2：content/tool_calls 均为 None，reasoning_content 是整段 <minimax:tool_call> 文本；tau2 基准报消息既无内容也无工具调用而中断
  visibility: 静默错误
mitigation:
  detect: 用带 tools 的请求检查响应：tool_calls 为空而 reasoning_content 含 <minimax:tool_call> 即命中
  fix: 待定（issue closed，未见修复 PR）：解析器需在 reasoning 通道内识别 tool_call 块并转入 tool_calls，同时从 reasoning_content 剥离
