original:
  mechanism: vllm-ascend issue 10989（2026-06-26，closed）：Minimax-M2.7 服务加 --reasoning-parser minimax_m2，客户端收到的响应里 content=None、tool_calls=None、function_call=None，reasoning_content 与 provider_specific_fields.reasoning 都是完整的 '<minimax:tool_call>\n<invoke name="get_data_usage">\n<parameter name="customer_id">C1001</parameter>…</minimax:tool_call>'。说明该 reasoning parser 只做了 content/reasoning 通道切分，没有把 minimax 的 tool_call 标记块从 reasoning 通道提取为结构化 tool_calls。下游 tau2 基准在 2026-06-25 18:49:32 报 'AssistantMessage must have either content or tool calls'，任务 [mobile_data_issue] 与 [service_issue] 均在该断言处失败，trial 0 即中断。
  source: 2026-06-26 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10989 （closed）
  behavior: 用 minimax 模型跑需要工具调用的 agent 任务时，接口返回 200 且 finish_reason=stop，但正文为空、tool_calls 也为空，工具调用请求以文本形式躺在 reasoning_content 里；下游框架判定这条 assistant 消息既无内容也无工具调用，直接报错中止，表现为任务成功率骤降而不是服务报错。
  trigger_surface: --reasoning-parser minimax_m2 + 工具调用（tools 字段）请求
  discovery: 2026-10-21 tail_3 顺序深读（历史索引回填，issue created < 2026-10-07）
