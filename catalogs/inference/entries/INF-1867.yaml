id: INF-1867
legacy_ids: []
slug: ge_resnet50_sample_top5_tie_map_key_collision
aliases: []
title: ResNet50 样例并列分数丢类别仍报 PASSED
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: acl ResNet50 样例 top-k
  behavior: 两个 ResNet50 样例用 std::map<float,unsigned,greater<>> 存「分数→类别」，map 的 key 唯一，相同分数覆盖先前类别，Top-5 可能不足 5 项。
effect:
  objects:
  - 输出内容
  - 测试判定
  detail: 并列 logits 的模型上固定/动态 Batch 样例各跑 3 次都只打印一至两条 top（期望 5 条，保留最后写入的类别 999），末尾仍输出 SAMPLE PASSED；真实 ResNet50 固定/动态对照均打印完整 Top-5。
  visibility: 静默错误
mitigation:
  detect: 用输出全同值（或大量并列）的模型跑样例，数 top 行数是否为 5；真实 ResNet50 输出没有并列，正常用例看不出问题。
  fix: 待定（issue closed，未给 MR）：改 std::multimap 并用 emplace(score,index) 插入，保留并列类别。
labels:
  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: cann/ge examples/acl/1_sample_resnet50_* 与 2_sample_resnet50_*_dynamic_batch + 模型输出存在并列分数
  stage: N/A
