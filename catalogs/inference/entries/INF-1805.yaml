original:
  mechanism: cann/ge runtime/c/executor/model_parse.c 的 ParseModelDescExtend 解析 om 的 PRE_MODEL_DESC_EXTEND 分区：第550行只校验分区 size >= sizeof(ModelExtendHead) 与第556行 magic，第560行把文件中的 extendDesc->len（uint64）直接作为 tlvListLen 传给 ParseTlvList，没有与 size - sizeof(ModelExtendHead) 比较。ParseTlvList（527-547）的 CheckLenValid（model_desc.h:18-20，只比较 total/offset/nextLen）全部以该声称长度为基准，第530行 TlvHead 读取与第537行 ProcFifoInfo 处理 tlv->data 时可越出分区缓冲。可达链已逐行核实：aclmdlQueryExeOMDesc（api/acl_c/acl_model/model/model.c:203-208）→ GetPartitionSize（ge_executor.c:97-107）→ GetModelPartitionSize（model_desc.c:172-178）→ GetModelAllPartitionSize（122/158）→ GetModelFifoSize（94-104）→ ParseModelDescExtend；另有 ParseModelDescExtendInfo（568）加载路径。
  source: 2026-09-06 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/551 （closed）
  behavior: 用户对一个构造过的 om 调用 aclmdlQueryExeOMDesc 或加载模型时，只要扩展分区头里声称的长度大于分区实际剩余，TLV 遍历就会读到模型缓冲区之外，可能读到垃圾 FIFO 信息或崩溃；分区表本身校验通过，调用方看不到任何参数错误。
  trigger_surface: 公开 ACL 接口解析用户提供的 om（扩展分区 len 字段与分区实际大小不一致）
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
