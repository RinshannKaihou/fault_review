id: INF-1805
legacy_ids: []
slug: om_extend_partition_tlv_len_unchecked
aliases: []
title: OM 扩展分区按文件声称 len 解析致越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: ParseModelDescExtend
  behavior: ParseModelDescExtend 只校验 PRE_MODEL_DESC_EXTEND 分区 size 与 magic，把文件中声称的 extendDesc->len 直接当 TLV 列表长度，未校验是否超出分区实际剩余。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: 构造 extendDesc->len 大于分区剩余大小的 om，ParseTlvList 的边界检查全以该声称长度为基准，TlvHead 与 tlv->data 读取越出模型缓冲区；aclmdlQueryExeOMDesc 即可触达。
  visibility: 静默错误
mitigation:
  detect: 构造 extendDesc->len 超出分区剩余大小的 om，调 aclmdlQueryExeOMDesc 并配 mssanitizer memcheck
  fix: 待定（issue closed，正文只给修复建议：第560行调用 ParseTlvList 前比较 extendDesc->len 与 size - sizeof(ModelExtendHead)；未给修复 PR）
