original:
  mechanism: 'op-plugin issue #78（2026-05-12，open）：环境 CANN 9.0.0-beta.2、torch 2.8.0、torch_npu 2.8.0.post4，硬件 310P。正文给出完整脚本 test_torch_npu_quant_grouped_matmul_dequant.py：allow_internal_format=True，token 由 moe_gating 分派，x 做 per-token 动态量化（absmax/127），权重 per-channel 量化后 transpose 再 npu_format_cast 到 NZ（format 29），调用 torch_npu.npu_quant_grouped_matmul_dequant(x, quant_weight_T, weight_scales, offsets, quant_mode=''pertoken'')，与 torch.matmul 逐专家的参考实现比对。脚本把输入与参考结果缓存成 .npy，第二次起复用同一组输入，因此排除了输入随机性；外层 for i in {1..1000} 反复起进程复跑，日志里出现 ''137:act vs ref, abs err 9.1640625, ref err 0.111163759076103'' 即判定出错。报告者明确说明大部分轮次正确、偶发错误，同样的测试输入正确与错误都可能出现；正文未给出根因定位（tiling、workspace 复用等只是候选面）。'
  source: 2026-05-12 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/78 （open）
  behavior: 在 310P 上用 npu_quant_grouped_matmul_dequant 跑 MoE 量化分组 matmul：完全相同的输入反复运行，大多数轮次结果与参考实现一致，少数轮次部分元素偏差极大——按报告者的判据 abs err 到 9 量级，而参考相对误差只有 0.11 左右。整个过程没有报错、没有 NaN/Inf，脚本照常打印结果，所以只跑一次或只看有没有异常是发现不了的；错值直接进下游专家分支。
  trigger_surface: 310P + npu_quant_grouped_matmul_dequant（per-token 动态量化、int8 权重 NZ 格式 29、多专家 group_list）+ 同输入反复复跑；单次执行不触发
