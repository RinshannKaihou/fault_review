original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（SGLang Triton `causal_conv1d_update` fallback 路径三重失效：(a) `conv_state.shape[-1] > width−1` 时内核按有效长度 width−1 假设**读头部条目而非尾部卷积窗**；(b) 声明了 `cache_seqlens_ptr` 但**从不读**——状态按线性缓冲而非循环缓冲读写（忽略 cache cursor）；(c) width=5 被包装层接受但实现只 load/处理 width 2–4 的权重——**错误结果而非拒绝**。JIT 内核测试不覆盖该 fallback 实现） · Cov: `var:ttmetal_concat_s2s_absolute_dim_rank_confusion_silent_wrong_data`（1.132 fallback 路径静默错数据族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: Triton fallback 是与 CUDA JIT 主路径独立维护的第二实现，状态布局语义（尾部窗口、循环游标）从未对齐；宽度支持范围无守卫。参考实现 `causal_conv1d_update_ref` 在 `test/registered/layers/mamba/test_causal_conv1d.py` 可复现三类对照。
  source: 'SGLang #38622（2026-09-09 open，bug label，含 CUDA GPU 上三类最小复现与期望行为描述）。https://github.com/sgl-project/sglang/issues/38622'
  behavior: 无 crash——**静默正确性失败**：Mamba/混合架构 conv state 更新读到错误历史窗口、循环缓冲语义丢失、width=5 给出与 `torch.nn.functional.conv1d` 不一致的结果。1.132（concat s2s fallback 静默错数据）之后"fallback 实现与主路径语义分歧"族新成员：本条在卷积状态布局维度且三错叠加。
  trigger_surface: SGLang + Triton causal_conv1d_update fallback + oversized/circular conv state 或 width=5（other_stack：SGLang 主路径，机制可迁移 vLLM 同名 kernel）
  discovery: 2026-09-09 每日扫描。
