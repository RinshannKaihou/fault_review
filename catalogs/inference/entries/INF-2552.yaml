original:
  mechanism: 'vllm-ascend 的 Ascend 310P 独立 recurrent GDN 算子在 ragged MTP 验证下，已接受 token 数（accepted_prev）可能大于当前 query 长度。旧 kernel 把这种情况当非法直接 return，未完成 state/output 更新；仅删除 guard 不够：按当前 query 长度压平 state 表会丢弃历史槽，并可能选中另一个请求的 state。PR #21864 的修复保留完整 [B, W] state 索引表，host tiling 把行 stride 传给 kernel，kernel 在 row_start + accepted_prev - 1 读历史、在 row_start + current_token_offset 写当前 state；接受边界用历史行宽而非 packed query offset；零长度 padding 请求在访问 state 前跳过；保留原 1D packed-index 路径。新增回归覆盖历史宽度 2/3/4、accepted 超过 current、打乱物理槽、异构 batch、不同位置零长 padding、尾部 query buffer padding 与旧 1D 路径，并用 graph replay 改设备侧长度/接受数/state 索引、毒化输出缓冲暴露未写值。'
  source: https://github.com/vllm-project/vllm-ascend/pull/21864 ｜原 issue https://github.com/vllm-project/vllm-ascend/issues/17856 ｜前身 PR https://github.com/vllm-project/vllm-ascend/pull/18730
  behavior: 310P 上开启 GDN 线性注意力与 MTP 投机解码时，如果一次 verify 接受的 token 数超过当前 query 长度（ragged 合法 batch），旧算子要么直接报错不更新，要么在去掉 guard 后按当前长度压平 state 表：后续 token 读到别的请求或更早轮次的历史 state，生成内容静默偏离，state pool 被写乱且无告警。普通等长 batch 或未开启 MTP 时不触发。
  trigger_surface: Ascend 310P 独立 GDN 算子；ragged MTP 验证且 accepted_prev > current query length；异构 batch、零长 padding、shuffled state slots。
  discovery: 2026-11-14 每日扫描
