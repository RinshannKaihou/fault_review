title: 310P GDN ragged MTP 压平 state 表取错请求
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: 310P 独立 GDN 算子 state 索引
  behavior: 按当前 query 长度压平 [B,W] state 索引表会丢弃历史槽；accepted_prev 大于 current_len 时读 row_start+accepted_prev-1 落到其它请求的 state，写回也错。
effect:
  objects:
  - KV状态
  - 跨请求/跨样本数据
  detail: 310P GDN + ragged MTP 验证，接受 token 数超过当前 query 长度时用到别的请求历史 state 并写回；原实现直接拒绝该合法输入，仅去掉 guard 仍会选错 state。
  visibility: 静默错误
mitigation:
  detect: 构造 accepted_prev>current_len 的 ragged MTP batch，混排不同请求、打乱物理 state 槽，与 FP32 CPU recurrence 逐元素比较输出和整个 state pool。
  fix: 'PR #21864（open，原 #18730 重提；未核实合入与发布）：保留完整 [B,W] state 索引表，host tiling 传行 stride，按 row_start+accepted_prev-1 读历史、row_start+current_token_offset 写当前。'
