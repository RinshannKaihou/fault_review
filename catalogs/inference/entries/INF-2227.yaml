original:
  mechanism: Wormhole N150 + tt-metal f288db45673（KMD 2.9.0/FW 19.11.0）。ttnn.operations.moreh.layer_norm 与 group_norm 在输入均值远离 0 时丢失方差：x=(randn(32,768)+50).bfloat16() 例，ref 用 fp64 layer_norm，max|y-ref|/max|ref| 随均值恶化（0→3.3%、5→41%、50→123%、500→119%）；compute_kernel_config fp32 累加仅轻微改善（1.7%/37%/114%/112%），不修复。17 个 layer_norm/group_norm 形状最坏值。机制：方差计算路径对大均值减法后的累积误差（具体 kernel 实现未在 issue 定位）。
  source: https://github.com/tenstorrent/tt-metal/issues/62719（四档均值×两配置实测表 + 复现代码）
  behavior: moreh layer_norm/group_norm 处理均值明显非 0 的激活（如 +50 偏置后）时输出完全失真：与 torch 参考的偏差达到输出本身的量级（相对误差 >100%），开 fp32 累加也无济于事；均值接近 0 的输入只有 3% 级偏差。模型激活分布偏移越大错得越离谱。
  trigger_surface: tt-metal f288db45673 + ttnn.operations.moreh.layer_norm/group_norm + 输入均值显著非 0（≥5 即 41%）；Wormhole N150 实测。
