original:
  mechanism: ttnn.experimental.paged_fused_update_cache 以 ROW_MAJOR 输入调用时在三种校验放行的配置下写坏 cache：1) FLOAT32 输入 + 默认 fp32_dest_acc_en=False：更新行全坏（含非有限值），任意 cache dtype；2) FLOAT32 cache：被更新 tile 的其余 31 行精度丢失（默认被舍到 bfloat16、fp32_dest_acc_en=True 时舍到 TF32）；3) BFLOAT16 输入 + fp32_dest_acc_en=True：更新行错。量化（Llama 70B decode 形状：8 users、8 KV heads、head_dim 128、每 case 两次 update、4,194,304 cache 元素，ROW_MAJOR 与 TILE 结果逐元素对比）：BF16/BF16/False=0、BF16/BF16/True=32,758、BF16/FP32/False=819,193、BF16/FP32/True=851,872、BF16/BF8B/False=0、BF16/BF8B/True=32,510、FP32/BF16/False=32,756（非有限）、FP32/BF16/True=0、FP32/FP32/False=851,961（非有限）、FP32/FP32/True=851,868、FP32/BF8B/False=32,456（非有限）、FP32/BF8B/True=0。Blackhole p100a 与 Wormhole n150 数字完全一致。期望：ROW_MAJOR 路径写出与 TILE 路径相同的 cache，未触碰值保持原值。
  source: https://github.com/tenstorrent/tt-metal/issues/61540（open 0 评论，2026-10-21 每日扫描，正文全文已读）
  behavior: 用 ttnn.experimental.paged_fused_update_cache 更新 paged KV cache 且输入是 ROW_MAJOR 布局：FLOAT32 输入默认配置下被更新的那行直接变垃圾（可能含 inf/NaN）；FLOAT32 cache 时同 tile 未更新的 31 行也被悄悄舍到 bf16/tf32；bf16 输入开 fp32_dest_acc 反而坏。错误写进 KV cache 后模型后续 decode 全程消费坏状态，无报错。
  trigger_surface: Blackhole p100a 与 Wormhole n150 实测、ttnn.experimental.paged_fused_update_cache、ROW_MAJOR 输入 + 表列 dtype/dest_acc 组合。
  discovery: 2026-10-21 每日扫描
