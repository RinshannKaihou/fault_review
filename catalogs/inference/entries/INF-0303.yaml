original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`ambiguous`（仅当目标 topic 出现时触发） · Cov: `var:bfa_progressive_sign_exponent` · 触发 `partial` · 置信度 `documented`'
  mechanism: CogBias 框架把 bit-flip attack 的目标从"功能破坏"扩展到"**价值对齐操纵**"（decision-level hijacking）。流程：(1) 用可微情感评估器把主观偏好（如某话题的立场倾向）转成优化信号；(2) 多目标 loss 联合约束多个维度；(3) BitScout 定位关键 bit；(4) 在**超稀疏翻转预算**下翻转少量权重 bit。结果是在目标话题上稳定诱导立场偏移，同时保留非目标任务的功能和整体输出分布。在 Llama-3.2-3B、Mistral-7B、Qwen2.5-14B 上验证，涵盖商业推荐和争议性事实话题场景。
  source: 'Chen et al., "Decision-Level Hijacking: Injecting Cognitive Bias into Large Language Models via Bit-Flip Attacks", arXiv:2607.25227（2026-07-28）。http://arxiv.org/abs/2607.25227v1'
  behavior: 模型在目标话题上立场偏移（如推荐偏向、事实判断倾斜），而**非目标任务和整体输出分布几乎不受影响**——这正是攻击者追求的"功能保留下的认知操纵"。无 crash、无 NaN，模型表面正常，仅在特定 topic 上系统性偏移。
  trigger_surface: 认知劫持 BFA：需优化搜索
  signature: ambiguous——只有目标 topic 的输入触发偏移。因翻转超稀疏（极少数 bit）且刻意保留整体分布，单帧 geometric/spectral 度量可能接近噪声底；infotheoretic 族（输出分布的语义层）在目标 topic 采样下可捕获立场偏移。这是 BFA 家族中**最难在单 pass 隐藏态上检测**的变体——签名被刻意设计为"近流形"。
  repro: partial——3.19 `weight_bitflip` 复现路径可翻转少量 bit，但 BitScout 的关键 bit 定位需要可微优化（GPU + 反向传播），无反向传播的复现路径仅能复现"翻转已知关键 bit 后的推理效应"而非完整攻击流程。
  discovery: 2026-07-30 每日扫描（arxiv 2607.25227）。
