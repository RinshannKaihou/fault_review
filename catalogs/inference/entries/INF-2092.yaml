original:
  mechanism: '环境 vLLM 0.17.0、vllm-ascend 0.17.0rc2.dev0、torch_npu 2.9.0、CANN 8.5.1（V100R001C25SPC002B220）、16×Ascend910、EulerOS aarch64。开 KV offloading + 外部 KV 后端、kv_load_failure_policy=fail，多机 PD 分离 TP16。同一请求的异步加载结果在 rank 间不一致：adapter.py:228 的 GetResult 里 rank1 报 success_blocks=173、total_blocks_num=173、status=SUCCESS、cost_ms≈4275，而 rank0 只有 success_blocks=6、total_blocks_num=173，status 同样是 SUCCESS——部分加载没有被标记为失败。调度器随后按 KV load 失败处理该请求，失败路径再触发 metrics 记录抛 ValueError: Counters can only be incremented by non-negative amounts，请求最终以 HTTP 500 返回给前端并伴随首 token 超时。'
  source: '2026-03-31 GitHub vllm-project/vllm-ascend issue #7871 https://github.com/vllm-project/vllm-ascend/issues/7871 （closed）'
  behavior: 开了 KV offload 之后，个别请求的前端等不到第一个 token 就超时，服务端返回 500。看日志会以为只是策略性失败（fail 策略下本就该失败），但真正奇怪的是个别 rank 只加载了 6/173 个块却照样报 SUCCESS，以及失败路径自己又抛了一个 counters 不能增负数的异常。
  trigger_surface: KV offloading + 跨 TP rank 异步加载 + kv_load_failure_policy=fail（PD 分离）
  discovery: 2026-10-21 历史索引回填（tail 池顺序深读）
