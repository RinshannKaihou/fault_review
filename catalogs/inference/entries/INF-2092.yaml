title: KV offload 部分加载仍报 SUCCESS 致跨 rank 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: KV offload 加载结果聚合
  behavior: 异步 KV 加载在 TP rank 间返回的块数不同（rank1 173/173、rank0 6/173），但两者 status 都是 SUCCESS，调度器随后才按 KV load 失败处理，失败路径又触发 metrics 异常
effect:
  objects:
  - KV状态
  - 可用性/进度
  detail: 开启 KV offloading 且 kv_load_failure_policy=fail 的多机 PD 分离 TP16 场景下，个别请求首 token 超时并返回 HTTP 500，失败路径记录 metrics 时抛 ValueError。
  visibility: 静默错误
mitigation:
  detect: 按请求聚合各 rank 的 success_blocks/total_blocks_num 与 status，status 全 SUCCESS 但块数不一致即命中；再核对失败路径是否二次抛 metrics 异常
  fix: issue 未附修复 PR（closed，修复状态未核实）；期望 fail 策略下请求干净失败、失败路径不再抛二级异常
