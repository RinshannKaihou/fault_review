original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（静默数据损坏） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 对 DRAM buffer，`TensorAccessor::get_noc_addr` 用 core 的 **x 坐标单独**作为 bank id（`get_dram_bank_base_offset(bank_x)`），**忽略 y 坐标**——host 侧也刻意不做 DRAM 坐标虚拟化（\"since we need logical x coord == bank_id\"）。因此当一个 ND-sharded buffer 的 shard grid 含**重复 x 坐标**时（如 `CoreRange((0,0),(1,1))` 有 4 个 core 但只有 2 个不同的 x 值），core `(0,0)`/`(0,1)` 映射到同一 bank，数据被写到重叠地址，buffer 内容静默损坏。
  source: 'tt-metal #51503（2026-07-29 open）。组件 `tt_metal/hw/inc/api/tensor/tensor_accessor.h`、`tt_metal/impl/buffers/tensor_accessor_args.cpp`。https://github.com/tenstorrent/tt-metal/issues/51503'
  behavior: 无 crash。含重复 x 坐标的 sharded DRAM buffer 写入地址重叠，buffer 数据静默损坏——读回的是被覆盖后的错误值。属硬件地址映射层的静默数据损坏。
  trigger_surface: Tenstorrent TT-Metal，非 NVIDIA 环境
  signature: infra_off / 数据损坏。损坏取决于 shard grid 是否含重复 x 坐标（配置门控），一旦触发则整块 buffer 持续错乱。
  discovery: 2026-07-31 每日扫描。
