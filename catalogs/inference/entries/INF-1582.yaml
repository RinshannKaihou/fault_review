title: MoeFinalizeRouting bf16 中间精度口径不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: moe_finalize_routing
  behavior: bf16 路径把输入与 bias/scales 全部上转 fp32 累加、写回只舍入一次；fp16 路径按原生 half 计算。同算子两种 dtype 的中间精度策略不同，文档未规定。
effect:
  objects:
  - 数值结果
  detail: bf16 331 例中 299 例超阈（90.3%，双指标阈值均 0.0078125=2^-7）；fp16 316 例逐位一致、fp32 353 例 max_abs≤2.83e-5；K=1 单步即差 2 个 bf16 ULP，误差随 K 与值域放大（max_rel 420）。
  visibility: 静默错误
mitigation:
  detect: 同形状仅换 dtype（bf16/fp16/fp32）的对照用例；K=1 单步用例可直接暴露每算子一次的舍入差；按 bf16 ULP 统计差异
  fix: 待定（issue closed；需先由维护者裁定 bf16 中间精度口径，再统一 kernel 或参考实现，并在文档写明 fp16 原生 / bf16 fp32 累加的差异）
