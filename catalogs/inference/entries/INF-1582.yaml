original:
  mechanism: 'ops-transformer issue #5045（2026-09-07 closed）用 ATK 对 aclnnMoeFinalizeRouting（CANN 9.0.0 发布镜像内置 moe/moe_finalize_routing，Ascend 910B3，torch 2.10.0）做 single_bm/high_performance 精度测试（小值域最大绝对误差与大值域最大相对误差双指标，阈值均 0.0078125=2^-7）：1000 例全部执行成功，701 通过、299 失败，失败 100% 为 bf16（331 例中 299 例，90.3%）；fp16 316 例 max_abs_diff 全为 0（逐位一致），fp32 353 例 max_abs≤2.83e-5。299 例误差 max_abs 均值 0.0687/中位 0.043/最大 4.875，max_rel 均值 1.525/最大 420；K=1（无累加）19 例失败，说明单步 scales*(expandedX+bias) 即产生 2 个 bf16 ULP。两侧源码核对：kernel 的 bf16 路径（moe/moe_finalize_routing/op_kernel/moe_finalize_routing_bf16.h）把输入逐个 CAST_NONE 上转 float，Add/Muls 与累加全程 float，输出一次 CAST_ROUND 回 bf16；fp16 路径（moe_finalize_routing_fp_db.h 等，模板参数 half）原生 half 计算，与参考的逐算子 fp16 同构，故逐位一致；参考实现按文档公式以输入 dtype 逐算子计算，每个累加项 scales*(expandedX+bias) 含两次 bf16 舍入。误差随 K（K=1 平均 0.025 → K=256 平均 0.186）与值域（expandedX ±10000 时 max_abs 4.875、max_rel 13.9；scales ±100 时 max_rel 420）放大。通过侧均为退化输入：scales 全零 4 例、近零 ±1e-6 3 例、全 1.0 常数 2 例、x2Optional NaN 5 例、极小形状 18 例。算子文档计算公式未规定乘加中间精度。'
  source: 2026-09-07 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/5045 （closed）
  behavior: 同一个 MoE finalize 算子，bf16 输入下 90% 的常规用例与按文档公式逐算子算的参考结果差 2 个以上 bf16 ULP（阈 0.0078125），K 越大、数值越大差得越多——K=256 时平均绝对误差 0.19，大值域相对误差到 420；换成 fp16 输入则逐位一致、fp32 也在 3e-5 内。也就是说同一份数据换个 dtype，精度表现从完全一致掉到整体超阈，而算子不报任何错。
  trigger_surface: 输入 dtype=bf16（含大值域 expandedX/scales）；K、形状、tiling 分支只影响误差大小，fp16/fp32 不触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
