original:
  mechanism: CANN 8.3.RC1.alpha003 + torch 2.7.1 环境里，同一 nn.Linear 权重在 eager 与 torch.compile 下 MatMul 的右矩阵形态不同：eager 做在线转置，compile 路径下 GE 把 Transpose 的输出常量折叠成 Const，导致后续融合 pass 的入参类型校验失败、融合没有成功开启，于是 compile 结果精度低于 eager。用 netron 打开 OM 的第一个 GE 图即可看到该 Transpose 的输出已被折叠成 Const。报告者要求权重离线提前转置再 MM 与在线随路转置再 MM 两种实现 bit 一致。issue 已 closed，正文未给修复 PR。
  source: 2026-01-16 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/63 （closed）
  behavior: 同一个 nn.Linear 最小用例，eager 与 torch.compile 后结果不一致、compile 后精度下降；在真实模型的 q/k/v_proj 加 view 场景里观察到同样现象。OM 首个 GE 图中右矩阵的转置已经是常量，说明两条路径下发的图本身就不同，而不是随机舍入误差。
  trigger_surface: torch.compile / TorchAir 构图（CANN 8.3.RC1.alpha003、torch 2.7.1）
