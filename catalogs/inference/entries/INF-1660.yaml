original:
  mechanism: MindSpore PyNative 模式、Ascend 910B2：LoRA 风格链式 matmul y = (x @ A^T) @ B^T，B 用经典全零初始化（恒等起步）时反向传播给 adapter 的梯度算错。数学上 B=0 时 grad_A 必为 0（A 只能经 B 影响 loss），实测 grad_A≈1.0；grad_B = tmp^T·grad_out 与 B 无关应非零，实测为 0。后果是 adapter 梯度恒为 0、grad_norm=0，lr=1e-5 与 lr=1.0 下 loss 逐位相同。Graph 模式无此问题，隔离的 LinearWithLoRA 也正确，只在完整模型上下文（bf16 + 基座与 adapter 残差相加 + 延迟初始化）触发。把 B 改成极小非零后 grad_A/grad_B 恢复。最小复现在 Cell 内用 mint.matmul 串两次、m.weight.requires_grad=False、last loss = m(x).sum()。
  source: 2026-06-16 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29469 （closed）
  behavior: 按标准做法把 LoRA 的 B 初始化为全零，训练照常跑、loss 照常打印，但 adapter 一个参数都没学到：grad_norm 一直是 0，改学习率（1e-5 → 1.0）loss 逐位相同，只有对比 PTA 或换成极小非零初始化才发现不对。静态图跑同样的代码正常。
  trigger_surface: PyNative + Ascend 910B2，bf16 混合精度下 x@A^T@B^T 链式 matmul 且 B 全零，处于完整模型（基座+adapter 残差相加、延迟初始化）上下文
