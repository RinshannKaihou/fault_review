id: INF-1660
legacy_ids: []
slug: ms_pynative_lora_zero_b_grad_wrong
aliases: []
title: PyNative 链式 matmul 在 B=0 时算错 LoRA 梯度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: PyNative 自动微分 VJP
  behavior: PyNative+Ascend 910B2、bf16、基座+adapter 残差与延迟初始化的完整模型中，B 全零的 x@A^T@B^T 链式 matmul 反向算错 adapter 梯度：grad_A 非零、grad_B 为 0。
effect:
  objects:
  - 梯度
  detail: B=0 初始化下 grad_A≈1.0（数学上必为 0）、grad_B=0（应非零），adapter 完全不更新，grad_norm=0，lr=1e-5 与 lr=1.0 的 loss 逐位相同。
  visibility: 静默错误
mitigation:
  detect: B 置零后跑一步 backward，打印 sum(|lora_a.grad|) 与 sum(|lora_b.grad|)；前者非零或后者为 0 即命中，再把 B 换极小非零值看是否恢复
  fix: 待定（issue closed，未给修复 PR）；规避：把 B 初始化为极小非零（如 normal_(0,1e-4)），issue 报告者以此绕过
