  trigger_surface: DeepSeek-V4-Flash W8A8 + 单 token MTP + 异步调度 + Mooncake P/D 分离 + Decode DP16/TP1/EP;需要在持续变长混合负载下有足够并发让多个 Decode rank 同时忙
