original:
  mechanism: 'issue 记录 DeepSeek-V4-Flash W8A8 + 单 token MTP + Mooncake P/D 分离在 A3 上的静默失去活性:decode 侧 DP rank 逐个进入“running 请求数大于 0、但 generation 与完成计数都不再增长”的状态,HTTP 健康检查与 metrics 仍返回 200,router 继续把请求发给它们,直到只剩一个 rank 在真正干活。量化证据:2026-08-10 12:57:31 起 engine 2/5/12/14 已处于该状态;14:31:16–14:35:01 窗口内 16 个 rank 有 15 个 running>0 且 15 秒增量全为 0,期间 router 记录 116 次 Decode send 与 116 次 Decode finish 全部指向 DP1,D0 接收 105 个请求、106 次 KV 传输也全由 DP1 承担;日志里没有 EngineDeadError、traceback、HCCL timeout 或 vector-core timeout,唯一的告警是与 sampling_params 相关的温度警告,作者推测可能和 #12725 讨论的 NaN/MTP 有关但未开 VLLM_TRACE_FUNCTION 验证张量内容。相近报告 #12725、#13648(受影响 rank 保留未完成请求并跑 dummy batch)、#13826(DP ACLGraph 变长同步)被列为可能同源,未确认同一根因。'
  source: 2026-08-11 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13964 （closed）
