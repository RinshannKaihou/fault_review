remarks: Atlas A2 910B2、CANN 9.2.0、norm/deep_norm_grad；常见 hidden 维度命中的静默精度缺陷，影响直接。
evidence:
- url: https://gitcode.com/cann/ops-nn/issues/7037
  kind: gitcode_issue
relations: []
original:
  mechanism: aclnnDeepNormGrad 在 Atlas A2 走 cutD 模板（归约维 D 超过单次切 D 容量）且最后一个分块较小时 dgamma 尾段结果错误、dx/dgx/dbeta 正常。实测（fp64 参考，判据 |a-b|<=1e-5+1e-4*|b|）：fp32 (1,6144)/(6144) dgamma[6104..6143]（40 元素）最大绝对误差 0.63（日志示例 dgamma[6104]=-0.004081 vs ref 0.003619），D=7168 对照 bad=0/7168、max 1.43e-9；fp16 (1,5120) dgamma[4432..5119]（683 元素）max 0.12；bf16 同 shape 681 元素 0.12。错误区间起点恒为 cutD 单次切 D 容量（fp32=6104、fp16/bf16=4432，UB 容量反算对齐 block）；与 N 无关（1/2/8/32 复现）；与确定性开关无关（none/acl 一致）；只在尾块约 ≤1024 元素时出现（fp32 D=6113/6144/6500/7000/12225/13000 失败、7168/8000/8192 正常；fp16 D=4433/4600/5000/5120/8865 失败、5500/6144/7168/8192/12288 正常）。复现：仓内 examples 改 fp32、dy/x/gx=(1,D)、gamma=(D)、mean/rstd=(1,1)，对 dgamma 与 fp64 逐元素比对。
  source: https://gitcode.com/cann/ops-nn/issues/7037（open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 使用 aclnnDeepNormGrad 且归约维 D 走 cutD 切分、尾块较小（如 fp32 hidden=6144、fp16/bf16 hidden=5120 这类常见维度）时，dgamma 的尾段几十到几百个元素静默错值（最大绝对误差可达 0.63），dx/dgx/dbeta 正常，接口返回成功；D 调大反而正常，极易在精度对齐时被当成模型问题排查。
  trigger_surface: Atlas A2（910B2）、CANN 9.2.0、aclnnDeepNormGrad cutD 模板、尾块 ≤1024 元素的 D 组合。
  discovery: 2026-10-21 每日扫描
