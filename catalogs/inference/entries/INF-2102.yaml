title: DeepNormGrad cutD 尾块 dgamma 尾段静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: DeepNormGrad cutD 尾块
  behavior: cutD 模板最后一个分块较小时 dgamma 尾段计算错误：错误区间起点恒为单次切 D 容量（fp32=6104、fp16/bf16=4432），尾块约 ≤1024 元素时触发。
effect:
  objects:
  - 数值结果
  detail: fp64 参考下 fp32 D=6144 尾段 40 元素错（max 0.63）、fp16/bf16 D=5120 尾段 683/681 元素错（max 0.12）；D 调大即正常（7168→1.4e-9）。与 N、确定性开关无关；dx/dgx/dbeta 正常；返回 0 无告警。
  visibility: 静默错误
mitigation:
  detect: 对 D 落在尾块 ≤1024 的 cutD 场景把 dgamma 与 fp64 参考逐元素比对；尾段（起点为单次切 D 容量）系统性偏差即命中。
  fix: 待定（issue open 未见修复 MR）
