  trigger: partial
  trigger_review: false
  trigger_note: cutD 模板 + 尾块约 ≤1024 元素；fp32 D∈{6113,6144,6500,7000,12225,13000} 复现、D≥7168 正常，fp16/bf16 D∈{4433,4600,5000,5120,8865} 复现、D≥5500 正常
  confidence: documented
