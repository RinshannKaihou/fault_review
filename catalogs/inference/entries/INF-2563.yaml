title: MoeTokenPermuteV2 出参行数偏小静默截断
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MoeTokenPermuteV2 参数校验
  behavior: 只校验 permuteTokensOut 的 dtype 不校验 shape；kernel 按调用方声明行数写，行数小于文档 M 时其余行不写、两段返回 0。
effect:
  objects:
  - 数值结果
  detail: tokens[4,8]、indices[4,2] 声明 [4,8] 时后 4 行 canary 全保留（32/64），声明 [2,8] 保留 48/64，rc 0/0；列数或维度错则首段 0、次段 561103。
  visibility: 静默错误
mitigation:
  detect: permuteTokensOut 预填 -777.0/555.0 两种互斥 canary，按 tokens.shape[0] 而非 indices.numel() 声明行数，回读未写行数。
  fix: '待定（issue #7582 open，建议在 CheckParamsV2Regbase 补输出 shape 校验）'
