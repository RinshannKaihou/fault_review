id: INF-1983
legacy_ids: []
slug: embedding_bag_indices_no_range_check
aliases: []
title: EmbeddingBag 不校验 indices 范围，越界取到垃圾行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: embedding_bag kernel
  behavior: indicesDataLocal.GetValue(j) * numEmbeddings_ 直接当 GM 行偏移，无 [0,num_weights) 校验；负值按无符号展开成巨大偏移
effect:
  objects:
  - 数值结果
  detail: aclnnEmbeddingBag 在 weight [8,16]、indices [0,8] 或 [0,-1]、offsets [0,2]、mode=sum 时，越界与负索引均返回 SUCCESS，但 bag 输出错误，exit 42；PyTorch embedding_bag 对同样输入拒绝。
  visibility: 静默错误
mitigation:
  detect: 用 indices 含 num_weights 与 -1 的用例调 aclnnEmbeddingBag，断言参数错误；与 torch.nn.functional.embedding_bag 输出对拍
  fix: 内核取 indices 前补 0 <= idx < num_weights，host 侧同步校验 offsets 与 mode；issue closed 未附 MR，未核实
