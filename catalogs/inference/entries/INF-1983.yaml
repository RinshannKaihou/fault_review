original:
  mechanism: cann/ops-nn issue 4762（2026-08-13，closed，Track A / P-011）。index/embedding_bag/op_kernel/embedding_bag.h 里以 indicesDataLocal.GetValue(j) * numEmbeddings_ 计算权重行偏移，未做 [0, num_weights) 范围校验，越界索引读到相邻内存、负索引按无符号展开成巨大偏移。复现：ops-nn HEAD e16ef626bb3a，build.sh --pkg --soc=ascend910b --ops=embedding_bag 安装到 vendors/cann_scan_repro_nn 后调用 aclnnEmbeddingBag，weight [8,16] fp32（第 i 行全为 i）、indices [0,8] 与 [0,-1]、offsets [0,2]、mode=sum：越界与负索引均返回 SUCCESS 但 bag 输出错误，exit 42；PyTorch embedding_bag 对同样输入拒绝。
  source: 2026-08-13 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4762 （closed）
  behavior: EmbeddingBag 的 indices 超出权重行数或为负时接口不报错，直接把越界地址当权重行读：输出还是正常的 [bag, dim] 形状和量级，但值是相邻张量/未初始化内存，推荐/召回链路上的特征整片错。PyTorch 同接口会抛越界异常，所以从 GPU 迁过来的代码不会预料到这一步。
  trigger_surface: aclnnEmbeddingBag，indices 越界/负值
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
