title: PD SWA 传输块裁剪顺序错致消费陈旧 KV 出 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Mooncake PD block id 裁剪
  behavior: request_finished_all_groups() 先 SWA clip 再按 prompt 长度裁剪，_compute_transfer_block_ids() 不裁 SWA 组，尾部 clip 因此选中未写入的陈旧块。
effect:
  objects:
  - KV状态
  - 隐状态
  detail: 陈旧 SWA 块 ID 作为 remote_block_ids 传给 D 端，npu_sparse_attn_sharedkv 消费脏块后第 0 层 attention 输出全 NaN，下游 speculative 输出可能全 -1，请求卡住；并发请求才复现。
  visibility: 数值异常
mitigation:
  detect: 对 SWA 组比对 prompt trim 与 SW clip 的先后顺序（prompt_len=129、block_size=128 时旧顺序得 [102,103]、正确应为 [100,101]）；dump 被消费块检查是否含 NaN/大 BF16 值
  fix: 待定（issue closed，正文说将为 main 与 releases/v0.20.2rc 提交 PR，未给编号）；修复：所有 KV 组先按 P 端实际 prompt 长度裁剪，再对 SWA 做窗口 clip
