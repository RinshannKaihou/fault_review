original:
  category: cat14
  section: 第 14 类 · 长上下文能力失效（model_on — 健康模型的盲点）
  meta: '`model_on` · Cov: `NEW`（本项目早期实测条目；标签型，无模型变更） · 触发 `n/a` · 置信度 `documented`'
  mechanism: 不是模型突变，而是**提示集标签**——故障由提示词的选择实现：连贯长上下文 vs 等长的填充/重复上下文，答案 token 相同。控制对构造需注意一个真实混淆：padded 控制在分词下可能碎成数倍的 sub-word token，直接比较实际上是在比较 token 数——应截断两侧 passage 正文使二者 token 数完全相同，同时保留共享的结尾问句，保证答案 token 的相对角色一致。
  source: 本项目早期实测条目（原型阶段实测，量值不跨栈继承；触发/复现已按 vLLM/CUDA 重估）。
  behavior: 长上下文下的能力衰退——检索/多跳推理准确率下降，答案更倾向复述而非整合；没有任何异常信号，模型自认为回答正常。
  trigger_surface: 长上下文任务标签，非模型变更
  signature: '`model_on`——长上下文没有把状态推离流形，它只是让模型**在流形上走到能力边界**。geometric 族预期表现很差，而 spectral 族的 `effective_rank`（direction=`low`）显著更高——机理是长上下文下 token 表示的有效维度塌缩（attention 稀释），这是一个只有在 token 集合上才可见的谱现象。trajectory 族给出 **GRADUAL** 形状（与 quant 同类，和 SDC 的 STEP 对照）。会漏检的是：所有单 token、需要 baseline 的 geometric 距离；`nan_inf_flag` / `recompute_oracle_mismatch` 等 cheap 族完全无效（模型算得完全"正确"）。'
  repro: 不改模型，而是构造 prompt 对——需要 token-matched 的长文档对；注意长上下文下采集全量 attention 张量的内存开销随长度平方增长（`[T, T]`），通常应关闭 attentions 采集。
  相关条目: '`var:14.8` → **14.1 `no_literal_match_collapse`**（NoLiMa）、**14.2 `lost_in_the_middle` / `attention_dispersion`**（softmax 稀释族）、**14.3 `multi_hop_reasoning_cliff`**（RULER）、**14.4 `padding_reasoning_anticorrelation`**。'
