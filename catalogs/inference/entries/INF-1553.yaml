slug: vllm_ascend_chunk_fwd_o_grouped_head_nonfinite
aliases: []
title: chunk_fwd_o 在 Hg≠H 大 token 数下输出非有限值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: chunk_fwd_o（GDN）
  behavior: Qwen3.5 GDN 生产形状 Hg=16、H=48、K=V=128（Hg≠H）下，AscendC 与 triton 两条 chunk_fwd_o 在 packed token 约 8K 起输出 Inf/NaN，AscendC 还会越界。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: T=8192 时 AscendC 报 EZ9999 invalid GM address（507015）进程退出，triton 输出非有限；同尺寸在不同进程可能一次损坏一次崩溃，而同尺寸的 chunk_gated_delta_rule_fwd_h 全有限。
  visibility: 数值异常
mitigation:
  detect: 按 (T,nseq) 扫 packed token 数，逐 case 在新子进程里检查输出是否含 Inf/NaN、是否崩在 507015；与 chunk_gated_delta_rule_fwd_h 的有限性做对照
  fix: 待定（issue closed，正文未给修复 PR）；定位手段：同尺寸对照 fwd_h 全有限，可把缺陷隔离在 fwd_o 的 O 累加/布局
