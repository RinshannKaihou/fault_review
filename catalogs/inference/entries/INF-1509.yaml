id: INF-1509
legacy_ids: []
slug: mssanitizer_address_space_model_miss
aliases: []
title: SIMT UB 范围与 L2 分配器未建模致越界漏报
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: UB 与 L2 分配器建模
  behavior: SIMT 场景把 UB 可访问范围按全量 UB 建模（实际由用户控制），越界落在未建模区间就不报；address_sanitizer 未 hook aclrtMallocCached，L2 分配对工具不可见。
effect:
  objects:
  - 测试判定
  detail: 算子已真实 UB 越界而 memcheck 无告警；aclrtMallocCached 分配的 L2 DMA buffer 越界一个都不报，反之还可能把合法 L2 访问误报非法——漏报侧不产生任何可疑信号。
  visibility: 静默错误
mitigation:
  detect: 在 SIMT kernel 里主动把用户划定的 UB 区间写到越界、或用 aclrtMallocCached 分配 buffer 后越界读写，看 memcheck 是否出告警；同时对照 memcheck 只报 GM 越界而 L2 段全静默的日志特征。
  fix: 待定（#149/#151 给出的方向是在 csrc/address_sanitizer/ 增加 HOOK_FUNCTION(aclrtMallocCached, ...)，未核实是否已合入；SIMT UB 范围需按用户设定区间建模，未见 PR）
