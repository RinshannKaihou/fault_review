original:
  mechanism: '两条漏报机制都属“工具先验模型与实际地址空间不符”。①#4（x86 环境）：正文明确指出 SIMT 的 UB 可访问范围并非全量 UB 空间，而是由用户自己控制，工具当前按全量 UB 空间建模，因此算子已经 UB 越界、工具也未识别出来。②#149/#151（同一报告提交两次）：csrc/address_sanitizer/ 只 hook 了 aclrtMalloc 与 aclrtFree，没有 hook aclrtMallocCached；昇腾 FA 等算子大量用 aclrtMallocCached 分配 L2 cache DMA buffer，它与 aclrtMalloc 走不同分配器。未 hook 的后果是 L2 分配对 sanitizer 不可见、L2 越界完全漏检，还可能把合法 L2 访问误报非法。报告者在 #149 中对比 #15 的 nd/nz 误报，称自己跑地址检测时画面只报 GM 越界、L2 上的 buffer 越界一个都没报。'
  source: 2026-01-22 GitCode Ascend/mssanitizer issue https://gitcode.com/Ascend/mssanitizer/issues/4（closed）；2026-07-09 issue https://gitcode.com/Ascend/mssanitizer/issues/149（closed）；2026-07-11 issue https://gitcode.com/Ascend/mssanitizer/issues/151（closed）
  behavior: 在 SIMT 算子里把 UB 用到超过用户自己划定的可访问区间，或者用 aclrtMallocCached 在 L2 上分配 buffer 并越界读写，mssanitizer 都一声不响：前者按全量 UB 空间认为访问合法，后者连这块分配都不知道，输出里既没有告警也没有可疑摘要。于是“跑过 sanitizer 没报错”被当成正确性证据，实际问题要到端到端结果出错才暴露。
  trigger_surface: SIMT 编程（UB 可访问范围由用户设定）；aclrtMallocCached 分配的 L2 DMA buffer（Ascend FA 等算子）；mssanitizer memcheck
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
