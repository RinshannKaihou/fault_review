original:
  mechanism: 'MSA（MindSpore Adapter，MindSpeed-Core-MS r0.5.0 / MindSpore 2.8.0 / CANN 8.5.0 / 910B）与 PTA（PyTorch Ascend + MindSpeed-MM 2.3.0）在 CogVideoX-5B 和 InternVL3 上对比训练 loss。issue 列出已实施的对齐：HCCL_DETERMINISTIC=true、BASE_SEED=42、dropout 0.0、attention softmax FP32、全组件 BF16、固定 loss scale、convert_ckpt.py 转换权重并验证首层切比雪夫距离为 0、TP/PP/CP=4/1/1、micro/global batch=1/8、Adam beta 与 LR 逐项一致，每轮杀进程清 NPU 状态。在此前提下 CogVideoX 的 MSA loss 比 PTA 低 1.72%–1.79%（10 轮，标准差 0.025%）与 4.58%（2 轮），InternVL3 低 1.62%–1.63%（前 4 轮）与 1.94%（第 5 轮），方向始终为 MSA 更低。报告者把剩余差异归为框架实现层：BF16 累加顺序与舍入、FlashAttention kernel 的累加顺序、分布式优化器/梯度聚合时序、RMSNorm/Softmax/Rotary 实现差异、图执行与 Eager 执行差异；没有定位到具体算子，也没有修复 PR。本条合并同模板的 InternVL3 issue #29333。'
  source: 2026-04-29 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29332 （open）
  behavior: 同一份 PTA 训练好的权重转到 MSA，用同一批数据、同一超参和种子跑 2 步，MSA 报出的 loss 每次都稳定比 PTA 低一点——CogVideoX 差 4.6%、InternVL3 差 1.6%，十轮实验方向从不反转、波动只有万分之几；训练不报错、曲线也正常收敛，只能靠双框架逐轮对数才发现系统性偏移。
  trigger_surface: MSA + MindSpeed-MM 多模态训练（CogVideoX-5B/InternVL3），910B，TP=4，BF16 + attention softmax FP32，与 PTA 同权重同步数对比
