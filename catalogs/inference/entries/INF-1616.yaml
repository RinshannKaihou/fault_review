relations: []
original:
  mechanism: commit 0ef9aaa569d2a36aa5c3884778ffb85d8d58914d 上三处同型缺陷：msmodelslim/core/quantizer/impl/dualscale.py:110 的 MXWeightDualScaleMinmax 里 dual_scale = dual_block_max_val / MXFP4_MAX_NORMAL，block 全零时 dual_block_max_val=0 使 dual_scale=0，:111 的 weight_value.to(float32)/dual_scale 得 NaN；msmodelslim/pytorch/llm_ptq/llm_ptq_tools/flat_quant/components/quantizer.py:191 的 ActivationQuantizer.get_scale_zero 在 sym 分支算 scale=xmax/q_max 没有 clamp，而同文件 :281 的 WeightQuantizer.find_params 对完全相同的公式写了 .clamp(min=1e-5)；msmodelslim/pytorch/llm_ptq/llm_ptq_tools/quant_modules.py:535-539 的 NF4 normalize_data 直接 block_weight /= absmax。三处都是静态走查确认，未实机跑完整量化流程。
  source: 2026-08-29 GitCode Ascend/msmodelslim issue https://gitcode.com/Ascend/msmodelslim/issues/506 （closed）
  behavior: 含全零 block、全零通道或全零 token 的权重/激活在量化时被写成 NaN：量化命令正常结束、没有任何报错或警告，权重文件也照常导出，直到用 mstools 逐张量看或在下游推理里才暴露成 NaN/Inf 与乱码输出。同一文件里权重侧公式带 clamp、激活侧漏写，说明这是遗漏而非设计。
  trigger_surface: 量化过程中出现全零 block / 全零通道 / 全零 token（如 padding、全零激活的 token）；任意硬件
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
