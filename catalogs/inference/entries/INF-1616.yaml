id: INF-1616
legacy_ids: []
slug: msmodelslim_scale_absmax_missing_zero_guard_nan
aliases: []
title: 量化 scale 缺零值防护，全零输入写入 NaN 权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: pytorch
    component: scale/absmax 计算（3 处）
  behavior: 三处 scale/absmax 缺零值防护：MXFP4 dual_scale、flat_quant 激活侧、NF4 归一化；全零 block、通道或 token 时 0/0 得 NaN 并写进权重。
effect:
  objects:
  - 模型权重
  - 数值结果
  detail: 全零 block、全零通道或全零 token（如 padding、全零激活 token）参与量化时，权重/激活被写成 NaN；量化命令正常结束、无报错或警告，权重文件照常导出，直到逐张量检查或下游推理才暴露为 NaN/Inf 与乱码。任意硬件。
  visibility: 数值异常
mitigation:
  detect: 量化产物导出后逐张量扫 NaN/Inf（mstools 查看权重）；或对全零 block/通道构造最小输入跑 scale 计算，同文件权重侧的 clamp(min=1e-5) 是正确写法参照
  fix: issue closed；正文建议三处补 clamp(min=1e-5)（与 quantizer.py:281 权重侧一致），未核实修复 commit 与发布版本
