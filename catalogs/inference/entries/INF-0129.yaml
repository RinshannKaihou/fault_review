  meta: '`infra_off`（PR #52256 给 Blackhole destination-reuse 握手加的 math-pipeline drain 修复只落在一个文件的两个函数——同样的裸 `TTI_STALLWAIT(p_stall::STALL_MATH, p_stall::SRCA_VLD)` 仍存在于 **16 个文件的 33 处站点**（WH+BH，含 canonical `transpose_dest` LLK 与被生产内核编译的 TTNN-private LLK 拷贝），修复未传播的规模化残留） · Cov: `var:llm_gpu_soft_error_instruction_level_fi_study`（1.98 来源 PR #52256 的修复传播缺口） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 'destination-reuse 握手中，`MOVD2A`/`MOVD2B` 前只等 `SRCA_VLD` 不排空 math pipeline，dest buffer 可能仍被未完成数学读占用——#52256 在两处补 `STALL_MATH` 联合等待；issue 用 `grep` 级审计列出全部 33 个仍含裸等待的站点（明确排除已被 open/merged PR 覆盖的 #53655/#53690/#54731）。LLK 私有拷贝（TTNN 内嵌编译）意味着上游修一处并不收敛全部生产内核。'
  source: 'tt-metal #55106（2026-09-01 open，跟踪性 master issue，含完整站点清单）。https://github.com/tenstorrent/tt-metal/issues/55106 · 修复源头：PR #52256（1.98）'
  behavior: 间歇性/依赖时序的 dest buffer 读旧值或冲突——概率性数值损坏或挂起，无确定性错误信号。属「**修复传播不完整的规模化形态**」：与 1.122（softplus 修复未跨 arch）、1.129（zero-flag 状态泄漏）同模式，本条把"修复只修了点名处"量化为 33 站点的系统性债务。
  trigger_surface: tt-metal WH/BH + 任一使用残留裸等待站点的 LLK（transpose_dest、dest-reuse 变体等生产内核路径）
