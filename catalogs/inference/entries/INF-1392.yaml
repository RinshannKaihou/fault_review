original:
  mechanism: 'SGLang 分层缓存（--enable-hierarchical-cache）下，混合 GDN 模型的前缀被 LRU 从 device 池逐出后，再次请求同一 ~207K token 文档时从 host 层恢复：指标 sglang:cached_tokens_total{cache_source="host"} 计满 207,616 token、延迟从 ~20s 降到 ~0.4s，命中本身工作正常，但模型输出如同恢复的上下文是垃圾。kernel io 与 direct 两种 io backend 同样失败，排除传输 kernel 本身。冷 prefill 与 device 层命中的同一 prompt 正确。报告者明确与 #33713（host 命中被漏掉）不同：这里命中发生且结果静默错误。恢复内容应含 KV 与 GDN 状态（脚本注释），错误具体机制未定位（issue 正文未给出根因，closed 时未见修复链接）。'
  source: https://github.com/sgl-project/sglang/issues/44735
  behavior: 开启分层缓存的混合 GDN（mamba）模型服务，长文档请求先冷后热再被挤出再回来：第三次起从 host 内存层恢复前缀，请求正常完成、延迟显著下降（20s→0.4s）、指标显示全量命中，但答案完全错误——needle 测试 0/2、0/3（回答 '512'、'TELEMETRY' 等无意义内容）。无任何错误日志。冷请求和 device 命中请求正确。
  trigger_surface: SGLang --enable-hierarchical-cache；混合 GDN/Mamba 模型（Qwen3.8-Flash-Next 实测）；约 200K token 级长前缀经 LRU 逐出后从 host 层恢复；两种 io backend 均触发
  discovery: 2026-10-16 每日扫描
