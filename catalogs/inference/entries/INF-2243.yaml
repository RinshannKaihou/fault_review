title: CANN MultiAddRmsNormDynQuant arch35 量化饱和
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: multi_add_rms_dyn_quant
  behavior: arch35 把 inp=y*smooth_scale 物化进 UB，smooth_scale 极小时落入 fp32 次正规区被抹零致 int8 饱和；另有累加序差 1-2 ULP、零行 scale 随模板变、inf 补偿得 NaN。
effect:
  objects:
  - 数值结果
  detail: smooth_scale 极小（如 ±1e-40，次正规量级）时 y1 饱和超 1 LSB 判据（D=2048/10240/16384）；x1 含 inf 时 scale 应 inf 却 NaN；零行 scale 随 D 在 1.0 与 0 间跳变；相消输入差 1-2 ULP；全程无报错。
  visibility: 静默错误
mitigation:
  detect: 对照 golden 的 int8 判据（|err|≤1 LSB）与 scale 合法性检查可检出
  fix: 修复 MR https://gitcode.com/cann/ops-nn/pull/12728 （merged，修复全部四处：归一化后 y 保留正常数域改算 k、累加序对齐 A2、零行 scale 统一 0、回退两处退化补偿；实机 Ascend950PR/950DT 验证；发布版本未核实）
