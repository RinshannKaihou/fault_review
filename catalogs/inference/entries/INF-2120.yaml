relations: []
original:
  mechanism: torch_npu 2.7.1（910B3 单芯 CANN 9.1.0 与 A3 双芯 CANN 9.0.0 双机双版本一致复现）的 torch.searchsorted 忽略 side 参数：side='right' 返回与 side='left' 完全相同的 lower_bound 结果。s=[1.,2.,2.,2.,3.]、q=[0.,1.,1.5,2.,2.5,3.,4.]：CPU right=[0,1,1,4,4,5,5]，NPU=[0,0,1,1,4,4,5]（与 left 相同）；2D/int64/带 sorter 同样复现。torch.bucketize(right=True) 在 NPU 正常，缺陷限定在 searchsorted 派发。影响：依赖 upper_bound 的分桶/分段/直方图索引整体左移，重复值区间越大偏移越大。
  source: https://gitcode.com/Ascend/op-plugin/issues/625（910B3/CANN 9.1.0 + A3/CANN 9.0.0 复现，最小用例）
  behavior: 在 NPU 上调用 torch.searchsorted(sorted_sequence, values, side='right') 时返回值与 side='left' 完全相同：对含重复元素的已排序序列，查询值命中重复区间时返回第一个位置而非最后一个位置之后。分桶、分段索引、直方图边界等依赖上界语义的计算系统性左移，无任何告警；同机 torch.bucketize(right=True) 正常。
  trigger_surface: torch.searchsorted side='right'；torch_npu 2.7.1，910B3/A3
  discovery: 2026-10-22 每日扫描
