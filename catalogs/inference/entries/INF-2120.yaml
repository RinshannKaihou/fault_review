id: INF-2120
legacy_ids: []
slug: torch_npu_searchsorted_ignores_side_right
aliases: []
title: torch_npu searchsorted 忽略 side 恒返下界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: searchsorted side 参数
  behavior: searchsorted 的 NPU 实现不区分 side='right'，恒按 lower_bound（left）语义返回插入点；bucketize(right=True) 不受影响，缺陷限定 searchsorted
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: 含重复值序列的 upper_bound 查询整体左移：s=[1,2,2,2,3] 查 2.0 应 [4] 实返 [1]；依赖上界的分桶/分段/直方图索引系统性偏移，重复值区间越大偏移越大；无告警
  visibility: 静默错误
mitigation:
  detect: 与 CPU searchsorted(side='right') 对照重复值元素
  fix: 待定（issue 建议 side='right' 按 upper_bound 实现或对重复值上界修正）
