title: AllGatherMatmulV2 MX x2_scale 步进漏乘打包因子
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: mc2 MX scale 偏移计算
  behavior: MXFP8 的 x2_scale 按 N-block 推进时 offsetScale 只乘 nOffset，漏乘打包因子 MXFP_MULTI_BASE_SIZE(=2)，下一个 N-block 读到错位的 E8M0 scale。
effect:
  objects:
  - 数值结果
  detail: WS=2 且 x2_scale 逐 K-block 变化时 rank0 与 rank1 的 y 有 567/2048 字节不同、最大偏差约 76(bf16)；identity scale 与 WS=4/8 逐字节一致，全程无报错。
  visibility: 不可复现
mitigation:
  detect: 同输入跨 rank 比对 gathered y 的字节一致性（BI 准则 a），覆盖 x2_scale 逐 K-block 变化的 MXFP8 用例
  fix: 'PR #4705 改为 offsetScale = nOffset*MXFP_MULTI_BASE_SIZE（非转置）或 nOffset*scaleK（transB），已合入 master 03b5c20；#6373 为兜底开关'
