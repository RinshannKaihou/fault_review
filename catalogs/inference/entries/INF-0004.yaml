original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off` · Cov: `NEW` · 触发 `no` · 置信度 `verified`'
  mechanism: LLM 的 GEMM/attention kernel 会产生 MHz 量级的 kernel 内功耗振荡；当振荡频率与 GPU PDN（配电网络）谐振频率对齐（A100 上第一 droop 约 **~35 MHz**）时，di/dt 引发瞬态供电跌落，导致时序违例型 SDC，且**绕过 ECC**。**>100 mV** 的 droop 在一次推理运行中大约出现 **两次**。
  source: Jiang, Garrigus, Seigler, Syed, Huang, Sadi, Rahal-Arabi, John, "Exploration of LLM Workload Reliability based on di/dt Effects and Voltage Droops", HPCA 2026（UT Austin + AMD），https://2026.hpca-conf.org/details/hpca-2026-main-conference/39/ 。（注：源文档说明 "5-12% droops cause timing violations" 这一比率来自更早的 Leng/Reddi GPUVolt HPCA'15 / ISLPED'14 工作。）
  behavior: 某一次 GEMM/attention 结果中出现细微的随机错误 bit——即某个 block 的隐状态被瞬态、低幅度地扰动（有时波及很多通道）。几乎从不产生 NaN。
  trigger_surface: 电压降 di/dt 真实 PDN 效应；软件只能弱近似
  signature: off-manifold，但呈**随机性 + 小幅度 + 多通道/弥散**形态。对 whole-channel 的 geometric 度量很不友好（因为扰动宽而散），更适合用 statistical 的方差膨胀检测或跨多 token 的 spectral 宽带成分来捕获。存在课题盲区风险：它贴着流形，形态像量化噪声。
  repro: 只能部分复现——用 hook 对某一 block 隐状态叠加**弥散的、跨多通道的小幅度随机扰动**（而非集中尖峰），并按低概率随机触发以模拟瞬态性；真实的 PDN 谐振时序耦合无法在单钩子层面复现。
