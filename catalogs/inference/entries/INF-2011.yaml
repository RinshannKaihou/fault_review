    component: scatter_v2 ProcessSmall
  behavior: 小 shape 走 ProcessSmall 时直接用 index 当 UB 偏移，缺 ProcessScatter 里 kIndex<0 || kIndex>=currentInput 的跳过判断，负索引与越界索引都被当成合法偏移使用
effect:
