  - 数值结果
  detail: 910B3+CANN9.1.0-beta.3：self4x4全1，index[0][0]为-1/4时aclnnScatter返回SUCCESS并写坏输出；-1000000触发设备异常507035。PyTorch Tensor.scatter要求索引落在[0,self.size(dim)-1]。
  visibility: 静默错误
mitigation:
  detect: 对 aclnnScatter 传 index[0][0]=-1 与 -1000000（其余为合法对角），比对返回码与输出；两条路径（ProcessSmall / ProcessScatter）都要试
  fix: 待定（issue 为本地 draft，未向 gitcode 提单）：在 host/tiling/kernel 入口拒绝 [0,size) 之外的索引并返回参数错误
