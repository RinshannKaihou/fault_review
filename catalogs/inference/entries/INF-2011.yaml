original:
  mechanism: cann/ops-nn issue 4771（2026-08-13，closed）：Ascend910B3 + CANN 9.1.0-beta.3、ops-nn HEAD e16ef626bb3a，index/scatter_elements_v2 在 SMALL_MODE（ProcessSmall）路径上不做索引范围校验：kernel 直接把 index 值当 UB 偏移，而同文件 ProcessScatter 有 kIndex<0 || kIndex>=currentInput 的跳过逻辑。复现：self shape{4,4} fp32 全 1、src 仅 src[0][0]=999、dim=0、reduce=none，index[0][0] 取 -1 / -1000000 / 4，aclnnScatter 对负值与越界值返回 SUCCESS 并写坏输出，极端负索引触发设备异常 507035，进程退出码 42（BUG_REPRODUCED）。PyTorch Tensor.scatter 要求索引落在 [0, self.size(dim)-1]。作者以产物 .o 的 md5 与 vendor 安装目录一致、ASCEND_CUSTOM_OPP_PATH 指向 vendor 确认跑的是源码编译内核。与 INF-1661（aclnnGather 负/越界索引静默回绕）同属索引范围校验缺失，本条为 scatter 写路径的 SMALL_MODE。
  source: 2026-08-13 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4771 （closed）
  behavior: 用 scatter 做 label 回填、one-hot 构造或 KV/位置表更新时，只要索引里带了 -1（常见的 padding 标记）或别的越界值，调用不报错，结果里却有一行被写成 999 或直接变成垃圾值；极端值才把设备打挂（507035），否则一路静默错到下游。
  trigger_surface: aclnnScatter / scatter_elements_v2 SMALL_MODE + indices 含负值或越界值
  discovery: 2026-10-21 系统扫描 sweep_5（顺序深读）
