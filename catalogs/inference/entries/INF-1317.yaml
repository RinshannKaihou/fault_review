  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: 读位置错位使查询-键配对失效，是 infra_off 式扰动；但**随左填充放大、在窗口回绕后才出现**，属受 batch/长度门控的 ambiguous。trajectory（沿解码步的突变点，恰在回绕处）与 cheap 侧的 batch-invariance 探针（不同左填充量下同一序列输出应不变）最有效；单条无填充序列的 geometric 快照完全漏检。
  repro: partial——以固定偏移 `d` 重排某层 cache 的位置轴（`K[:, :, :, :] ← K[:, :, roll(idx, d), :]`），并只在序列长度超过设定窗口后启用，模拟回绕后的槽错位；`BatchRotatingKVCache` 的实际几何与 mlx 后端不可复现。
  locus: index-position
  priority: medium
