  section: 第 8 类 · KV 缓存 / 注意力机制故障
  meta: '`infra_off`（`AiterMLAMetadataBuilder` 从全局 `cache_config.cache_dtype` 推导 KV dtype，但 cache dtype 是**每 KV 组**属性——spec draft 模型可跑 `kv_cache_dtype:"auto"`（bf16 cache）于 `--kv-cache-dtype fp8` 启动的服务：builder 把该组归一化为 "fp8"、据此用 `get_mla_metadata_info_v1` 定 persistent work metadata 尺寸并选 fp8 asm decode kernel——按错误元素大小读实际 bf16 的缓冲 → GPU memory access fault；eager 下同组走 Gluon 路径掩盖，**仅 cudagraph capture 显形**） · Cov: `var:vllm_flashinfer_cudagraph_support_target_heads_over_draft_kv_heads`（8.70 全局 config 污染组级判定族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 组级属性（`kv_cache_spec.dtype`）存在但 builder 读全局配置。修复在该组 spec dtype 为浮点（未量化）时遵从组自身 dtype——归一化字符串、`q_dtype`/`kv_dtype`、metadata 尺寸全部描述内核实际要读的缓冲；真 fp8 组不受影响（spec dtype 非 float）。MI355X gfx950 + Kimi-K3 + DSpark MTP draft + TP8 实测：修复前 8 rank 全部在 PIECEWISE capture 同步崩溃，修复后 FULL+PIEWISE 100%。
  source: 'vLLM PR #55591（2026-09-06，bug/rocm label）。https://github.com/vllm-project/vllm/pull/55591'
  behavior: cudagraph capture 期 memory access fault（fail-loud 但 eager 正常——"开 graph 才崩"的诊断迷宫）。与 8.70 同日同族：「组级语义从全局 config 推导」在 FlashInfer（头数）与 AITER（dtype）两个后端各显形一次；KV 组粒度配置（spec 解耦）是这两条共同的结构性教训。
  trigger_surface: vLLM ROCm + AITER MLA + spec draft（auto dtype）+ `--kv-cache-dtype fp8` + cudagraph（hw_specific；配置组合触发）
  discovery: 2026-09-06 每日扫描。
