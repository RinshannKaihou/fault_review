original:
  mechanism: 'Triton issue #12348（c2026-10-18）：循环内对加载 tile 沿末轴归约并累积的 kernel，acc -= tl.sum(x, 1) 静默返回错误符号的和、acc += tl.max(x, 1) 返回 -inf、acc = acc * 0.5 + tl.sum(x, 1) 编译失败。根因：TritonGPUOptimizeThreadLocality pass 把归约的跨线程部分移到循环之后，累积每线程 partial sum 时使用循环的更新算符（-）而不是归归约自身的算符（+）；acc += tl.max 同理用 + 代替 max。复现：32×512 fp32 全 1 矩阵、每行循环 4 块 128 列相减，每行应为 -512，main @6fe3348e6（L40S）与 3.8.0 wheel（H100 同）均输出 +512.0。修复方向（issue 内）：只在更新是归约自身算符作用于 acc 时重写（#11370 曾实现后被 revert）。'
  source: 2026-10-18 GitHub triton-lang/triton issue https://github.com/triton-lang/triton/issues/12348 （open）
  behavior: 在 Triton kernel 的循环里写 acc -= tl.sum(x, 1) 这类用非归约算符累积的归约时，结果符号整个翻转：应得 -512 的每行得到 +512；acc += tl.max 得到 -inf；第三种写法直接编译失败。无任何告警，数值看似合理。
  trigger_surface: Triton（main @6fe3348e6、3.8.0）循环内 tl.sum/tl.max 归约 + 更新算符非归约自身算符；L40S/H100 复现
  discovery: 2026-10-19 每日扫描
