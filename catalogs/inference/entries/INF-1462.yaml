    component: 归约外提累积算符选择
  behavior: ThreadLocality 优化把归约跨线程部分移到循环后，用循环更新算符（-）而非归约算符（+）累积 partial：acc -= tl.sum 得 +512；acc += tl.max 得 -inf。
