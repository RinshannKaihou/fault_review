cause:
  objects:
  - subsystem: MoE路由
    stack: vllm
    component: MoE 输出归约判定
  behavior: ALLGATHER 且未开 flash_comm_v1 时归约判定返回「未归约」，外层对 routed 输出再补一次 TP all-reduce，权重贡献被重复计入。
effect:
  objects:
  - 输出内容
  detail: MiniMax-M2.7-w8a8 在 910B TP8 + --enforce-eager 下对「中国的首都是」返回无意义串；加 --enable-expert-parallel 与 FLASHCOMM1=1 后恢复。
  visibility: 静默错误
mitigation:
  detect: 同一请求分别在 ALLGATHER（默认）与 EP+FLASHCOMM1 下各跑一次，比对输出；或直接检查 _EXTRA_CTX.moe_comm_type 与 flash_comm_v1_enabled
  fix: 启动时同时加 --enable-expert-parallel 与 export VLLM_ASCEND_ENABLE_FLASHCOMM1=1（issue 评论给出的规避）；issue 仍 open，未见修复 PR
