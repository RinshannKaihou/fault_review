original:
  mechanism: 'vllm-ascend issue #10466（2026-06-15，open）：v0.20.2rc1 部署 MiniMax-M2.7-w8a8-QuaRot（8×910B，TP8，--enforce-eager）后，curl「中国的首都是」返回毫无意义的串。评论把范围收敛到 MoE 归约判定：vllm-ascend 的 AscendMoERunner 覆写 _fused_output_is_reduced，只有 moe_comm_type ∈ {ALLTOALL, MC2, FUSED_MC2} 或（ALLGATHER 且 flash_comm_v1_enabled）时才返回 True，使上游 MoERunner.forward() 的 _maybe_reduce_final_output 不再补一次 TP all-reduce；否则外层会再归约一次。现场规避是同时开 --enable-expert-parallel 与 VLLM_ASCEND_ENABLE_FLASHCOMM1=1，把通信方式与判定一起换掉后输出恢复正常，与小节里的代码路径一致。issue 未给出源码 commit，也未合并修复 PR。'
  source: 2026-06-15 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10466 （open）
  behavior: 用官方 v0.20.2rc1 镜像在 8 卡 910B 上拉起 MiniMax-M2.7 w8a8 量化权重，服务能正常启动、请求返回 200，但答复是「毫无意义的错误结果」，与模型能力明显不符。同一条命令加上 --enable-expert-parallel 并导出 VLLM_ASCEND_ENABLE_FLASHCOMM1=1 之后，同样的 curl 就能得到正常中文回答，说明问题出在 MoE 通信/归约组合而不是权重本身。
  trigger_surface: MiniMax-M2.7 w8a8 + TP8 + 默认 ALLGATHER MoE 通信（未开 EP 与 FLASHCOMM1）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
