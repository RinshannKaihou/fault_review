  mechanism: 前缀缓存 + **MTP**（multi-token prediction）推测解码组合——被接受的 token 是相对于错误共享/被污染的前缀 KV 做的验证 → 约 **20%** 准确率下降；在**多轮**场景下草稿接受率坍缩到 **0**，输出退化为乱码。两个开关单独启用各自无碍，只有组合起来才"变笨（gets dumber）"。
  source: 'vLLM #43559（OPEN 2026-05-25，前缀缓存 + MTP 约 20% 下降）；vLLM #36872（OPEN 2026-03-12，推测解码下乱码 + 吞吐坍缩）；vLLM #53912（OPEN 2026-08-26，v0.28.0 上仍复现——#43559 被关闭后合并的调度器修复 #51113 未覆盖：hybrid Mamba/GDN + MTP + prefix caching 下部分响应退化为重复标点 `!!!!` 或空 completion，证明该缺陷**仍开放**）。'
  behavior: 准确率下降约 20%、吞吐同时坍缩（接受率归零意味着投机全废）、多轮后输出成乱码；单开关回归测试全部通过。
  trigger_surface: 推测解码/CUDA graph：vLLM 可开，需接受率与 batch 场景
  signature: 在**草稿-验证边界**处呈 on/off-manifold 混合——被污染的前缀 KV 本身可能数值健康（属于另一序列），但验证路径与目标路径的表示不一致。族判为 ambiguous：签名只在"前缀缓存命中 × MTP 启用 × 多轮"三重条件下出现。检测面：**接受率坍缩本身是最强的行为信号（behavioral tell）**，比任何隐藏态度量都廉价可靠；隐藏态侧则依赖 cross-request 签名余弦（污染部分）与草稿/目标两条路径的表示一致性比对。单路径 geometric/spectral 度量在早期轮次会给出健康判定。
  repro: 单钩子以"前缀段 K/V 替换为捐赠者 K/V"（同 K9.6）近似污染部分；接受率坍缩需要真实的 draft-verify 循环，单模型 solo 路径无法复现，只能覆盖污染的隐藏态后果。
  locus: control-flow
  priority: medium
