  mechanism: CANN 9.2.0（Atlas A2 910B2，aclnn 两段式 C 直调不经框架适配层）aclnnMsaIndexScore 在 key 的 N2>1 时对所有 query head 都只读第 0 个 KV head。正确语义应按 n2 = n1/(N1/N2) 取对应 KV head。报告给出单文件自包含 64 行复现（TND，N1=2、N2=2、D=128、T1=128、T2=256，actualSeqQ=[0,128]、actualSeqK=[0,256]）：三次调用只改 key 的 head0 或 head1 常量值比较输出——只改 KV head1（1.0→100.0）输出 max|diff|=0、bitwise 相同；对照只改 head0 输出 max|diff|=12672。缺陷组与对照组 rc 均为 0。
  source: https://gitcode.com/cann/ops-transformer/issues/6639
  behavior: 用多 KV head（N2>1）配置跑 MsaIndexScore 时，不管第 1 个及以后的 KV head 数据是什么，输出注意力分数完全不变——等价于所有 query head 只用了 KV head0 的内容算分；改 head0 数据输出立刻大变。接口返回成功，无任何告警，多组 attention 结果静默错值。
  trigger_surface: CANN 9.2.0 / Atlas A2 910B2；aclnnMsaIndexScore；key 的 N2>1（GQA 多 KV head）。
