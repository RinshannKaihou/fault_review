  mechanism: 借助 ge 图 data dump 工具比较算子输入输出以定位精度问题时，dump 出来的 tensor dtype 为 bool 时比较结果直接显示 NAN（提单附截图），无法给出该算子输入输出是否一致的结论。需求来源是某 NPU 上 GE 图模式与 eager 模式精度不一致的定位，bool 类算子恰好落在需要逐层比对的路径上。正文没有给出比较实现所在代码、支持的 dtype 列表或修复方案，只记录了现象与截图；提单类型为 Feature-Request，closed。
