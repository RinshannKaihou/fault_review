original:
  mechanism: cann/ops-nn issue 6020（closed）：matmul/mat_mul_v3/op_host/op_api/aclnn_matmul.cpp（master @69cc541）。GetTransposeAttrValue(L408-421) 判转置的唯一条件是 strides[dim2]==1 && strides[dim1]==viewShape[dim2]（即 [1,K]），L415 注释自述「K or N = 1 -> transpose=undeterminated」，但代码对其余布局（含 [1,K_full]、K_full≠K）一律 return false 判非转置，没有拒绝路径；CheckWeightNzStorageShape(L391-406) 只校验期望 NZ 形状与实际 storage 的元素乘积相等，而 fp16/bf16 下 NZ_K0_VALUE_16=16、NZ_STORAGE_PENULTIMATE_DIM=16、k0=n0=16 完全对称，期望形状转置 [k1,n1,16,16] 与非转置 [n1,k1,16,16] 的元素乘积恒等（K=32、N2=64 时都是 2048），乘积校验对误判恒通过；BuildMatMulWeightNzGraph(L436-451) 随后由 SetTensorToNZFormat(L281-289) 按错误布局 CreateView 并置 FRACTAL_NZ，ExecMmOpWithBias（matmul_util.cpp L1337/L1373-1381）只核对 view 形状与 dtype，不再复验 storage 真实布局，直传 kernel。作者给出的构造：FRACTAL_NZ 4D storage + 2D view viewShape[K,N2]=[32,64]、viewStride[1,K_full]（K_full≠K）。issue 自述结论来自静态推演（master 69cc541），末尾静默错值需 NPU 实测闭环；仓库 UT test_aclnn_matmul_weight_nz.cpp 无 stride 相关用例。
  source: GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6020 （closed）
  behavior: 给 aclnnMatmulWeightNz 传一个 FRACTAL_NZ 权重、但 2D view 的 stride 不是标准 [K,1]/[1,K]（例如列主序切片留下的 [1,K_full]）时，接口不会报错，而是把 storage 当成非转置 NZ 布局直接喂给 matmul：算出来的矩阵乘结果整片不对，量级和形状都正常，只有和参考实现对一遍才看得出来。标准 stride 的权重、以及 fp32（k0/n0 不对称）路径都不会走到这里。
  trigger_surface: aclnnMatmulWeightNz + 非标准 viewStride 的 NZ mat2
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
