id: INF-1861
legacy_ids: []
slug: ops_nn_matmul_weight_nz_nonstandard_stride_transpose_misjudge
aliases: []
title: MatmulWeightNz 非标 stride 转置误判错读布局
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnMatmulWeightNz
  behavior: GetTransposeAttrValue 只认 strides[dim2]==1 && strides[dim1]==viewShape[dim2]，其余一律判非转置；NZ 形状对称使元素乘积校验恒通过。
effect:
  objects:
  - 数值结果
  detail: mat2 view [K,N2]、viewStride [1,K_full]（K_full≠K）时接口不报错，storage 按非转置 FRACTAL_NZ 直传 kernel，结果整片错但量级形状正常，仅比对参考实现可见；标准 stride/fp32 不触发；静态推演，未上板实测。
  visibility: 静默错误
mitigation:
  detect: 用 FRACTAL_NZ storage + 非标准 viewStride（既非 [K,1] 也非 [1,K]）的 mat2 构造用例，看接口是否拒绝；现有 UT 只覆盖标准 stride，无相关用例。
  fix: 待定（issue closed，未给 MR）：不可判定 stride 直接返回参数错误，或在 CheckWeightNzStorageShape 补 K/N 逐维映射校验。
