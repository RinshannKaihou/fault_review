  behavior: ckernel_sfpu_topk.h 所有 min/max TTI_SFPSWAP 传 imm12=0（二补码 int32 比较），而 imm12 bit0=1 才是 fp32 比较；两个负浮点比较时序错，方向颠倒
effect:
  objects:
  - 数值结果
  detail: 全负输入 top-k 返回错误值与索引、升降序互换（如降序返回 -0.996/golden -0.0039）；全非负输入正确——也是既有 LLK 测试唯一覆盖
  visibility: 静默错误
mitigation:
  detect: 把 test_topk_quasar 输入改全负（报告者方法，两方向均失败）
  fix: imm12=1 的本地实验两方向通过；正式修复未提交；阻塞 gpt-oss Quasar bringup
