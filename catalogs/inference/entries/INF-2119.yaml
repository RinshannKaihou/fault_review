original:
  mechanism: tt-metal Quasar 的 tt_metal/hw/ckernels/quasar/metal/llk_api/llk_sfpu/ckernel_sfpu_topk.h 对 float 值（按 FP16B 或 FP32 加载）排序，但文件内每个 min/max TTI_SFPSWAP 都传 imm12=0。ckernel_sfpu_reduce.h 的注释说明 imm12 bit0 选择比较语义：0 为二补码 int32 比较、1 为 fp32 比较。两个负浮点值参与比较时按 int32 位模式排序得到错误顺序，top-k 的值与索引都错且升/降序结果互换（Descending 返回 Ascending 的首个值）。Quasar ttsim 上把 test_topk_quasar 的输入改为 uniform(-1,0)（原 0..1）后 [32,128] 输入双向失败：Descending 得 -0.99609375/idx22（golden -0.00390625/idx43）、Ascending 相反。全部 imm12 改 1 的本地实验后两 case 通过（文件内 25 处 SFPSWAP）。既有 LLK 测试只测非负输入。此问题阻塞 gpt-oss bringup（gpt-oss 激活可负）。
  source: https://github.com/tenstorrent/tt-metal/issues/62124（Quasar ttsim 确定性复现 + SFPU 立即数审查）
  behavior: Quasar 上含负浮点输入的 top-k（如 gpt-oss 类模型激活）返回错误的值与索引：负值排序顺序颠倒，降序查询返回最小值、升序返回最大值；全非负输入不受影响，因此常规正激活测试无法发现。
  trigger_surface: Quasar SFPU topk + 输入含负浮点；FP16B/FP32 加载路径
  discovery: 2026-10-22 每日扫描
