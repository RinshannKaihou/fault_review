original:
  category: cat9
  section: 第 9 类 · 位置编码 / RoPE 配置故障
  meta: '`model_on`（静默降级） · Cov: `var:9.25` · 触发 `config` · 置信度 `documented`'
  mechanism: '`DataCollatorWithFlattening` 使用 **0-based `position_ids`**，但 RoBERTa 家族模型的位置嵌入偏移了 `padding_idx`（RoBERTa 的 padding_idx=1，有效 position_id 从 2 开始）。0-based position_ids 导致位置编码错位——每个 token 的位置 id 比正确值偏移了，**静默**降级质量而非崩溃。'
  source: 'transformers #47496（2026-07-28）。https://github.com/huggingface/transformers/issues/47496'
  behavior: RoBERTa 家族模型的输出质量**静默降级**——模型仍能产生连贯输出，但准确率/质量下降。无 crash、无 NaN，用户不会察觉位置编码错了。
  trigger_surface: RoPE 相关配置
  signature: 与 `bug_perfect_disguise`（9.25，position_ids off-by-one）同族——位置编码的 off-by-one 错误。model_on / near-perfect-disguise：位置偏移在隐状态几何上可能极难区分。直接复现需 RoBERTa 系（padding_idx 偏移式位置嵌入）模型。
  repro: yes——对 position_ids 做固定偏移（0-based → padding_idx offset），即可复现位置编码错位。需要 RoBERTa 模型。
  discovery: 2026-07-29 每日扫描。
