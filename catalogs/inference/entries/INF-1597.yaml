title: MoeTokenUnpermuteWithEpGrad 非零梯度槽丢失
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: probsGrad 累加与写回
  behavior: probs 非 None 路径对每个槽位无条件调 ReduceSumFunc 并以标量偏移写单个 fp32，tiling 的保留槽位上限使 tokens×topk>1 时槽位复用、非零项被覆盖或写错位置；写回缓冲未清零。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: 1000例执行成功，59通过941失败（94.1%）。probsGradOut应有一个非零槽位，实测丢失：866例大值域最大相对误差为1.0；或错位：绝对/相对最大误差位置899例全不同。permutedTokensGradOut最大相对误差1061.19、最大绝对误差659.78。n=1或全零通过
  visibility: 静默错误
mitigation:
  detect: probs 非 None、tokens×topk>1 且 grad/permutedTokens 非零的用例，检查 probsGradOut 是否恰有一个非零槽位、位置是否与 sortedIndices∩rangeOptional 一致
  fix: 待定（issue closed，正文未附修复 PR；三个假设分别指向标量偏移写回、目标 buffer 未清零、折半归约多读）
