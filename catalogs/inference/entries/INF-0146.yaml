  meta: '`infra_off`（`ttnn.cbrt` FLOAT32 对**每个 subnormal 输入**都错：SFPMAD 把 subnormal 操作数 flush 成 +0 时返回 ±0，未 flush 时 magic-constant 种子（假设正常指数域）给出低至 6306× 的错值（29% subnormal 偏差 >1%）；真值是普通 normal 数（[1.4e-45,1.2e-38] → [1.1e-15,2.3e-13]），非范围限制） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`ckernel_sfpu_cbrt.h` 以 Moroz magic-constant 技巧给 Newton 迭代播种：把位型当整数执行 `i = 0x548c2b4b - i/3` 再左移 8 位——该重构只在正常指数域成立，subnormal 位型的隐含前导 1 不存在，种子系统性错位。正常输入 ≤3 ULP（[1e-30,1e30] 验证），纯域间隙。'
  source: 'tt-metal #55391（2026-09-03 closed，ttsim BH v1.10.3 + v0.79.0-dev20260902 实测 + 源级分析）。https://github.com/tenstorrent/tt-metal/issues/55391'
  behavior: 无 crash——subnormal 区间返回 0 或数量级错误值；`div`/`sqrt` 类 kernel-constellation 域边界的又一实例。与 1.154（div subnormal 分母）同「**magic-number 重构在 subnormal 域失效**」族；与 1.114（exp2 指数重构无上溢 guard）共同构成 SFPU 指数重构缺陷谱系。
  trigger_surface: Tenstorrent WH/BH + `ttnn.cbrt` + subnormal 输入（软件 API 可触发）
  discovery: 2026-09-03 每日扫描。
