  detect: 同时开异步调度、TASK_QUEUE_ENABLE=1、Fused MC2 + DSA 上下文并行，跑高并发短输出负载，观察 aclrtAllocatorGetByStream / UB-GM 越界与看门狗终止；也可用 A/B（保留/移除同步气泡）对比
  fix: 'v0.23 由 #13289 回滚 #12536 暂时规避；main 分支缓解 PR #13290，前向修复未核实'
