  detail: DeepSeek-V4服务在DSA上下文并行、异步调度、TASK_QUEUE_ENABLE=1、Fused MC2全开，3500输入/1输出、并发100压测时，前几个请求正常，约第9个后某worker抛UB/GM越界和分配器stream非法，随后HCCL看门狗终止、剩余请求全500。
