original:
  mechanism: 'vllm-ascend 的 #12536 去掉了 DSA 上下文并行路径上的一段 D2H 同步气泡（目的是减少同步等待），使 ACLNN 算子 workspace 的生命周期不再被同步点约束：workspace 的申请/复用与异步调度、TASK_QUEUE_ENABLE=1 的延迟下发、Fused MC2 的异步执行重叠，运行时出现 aclrtAllocatorGetByStream failed（Parameter stream is invalid，stream 未注册到任何分配器）、UB 读写越界、GM 地址超 48 位。因为算子异步执行，traceback 首个算子常是无关的 triton_rms_kernel。issue 给出受影响矩阵：v0.23 曾受影响、回滚后规避；v0.24 不含该改动不受影响；v0.25/v0.26/main 受影响，需要前向修复。'
  source: '2026-08-07 GitHub vllm-project/vllm-ascend issue #13761（open）。https://github.com/vllm-project/vllm-ascend/issues/13761'
  behavior: DeepSeek-V4 服务在 DSA 上下文并行 + 异步调度 + TASK_QUEUE + Fused MC2 全开时，压测（3500 输入、1 输出、并发 100）前几个请求正常，大约第 9 个之后某个 worker 抛 UB/GM 越界和分配器 stream 非法，接着 HCCL 看门狗终止、剩余请求全 500；同样的请求单独重跑又可能成功，看起来像随机故障。
  trigger_surface: DSA context parallel + 异步调度 + TASK_QUEUE_ENABLE=1 + Fused MC2 同时开启的高并发短输出负载
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
