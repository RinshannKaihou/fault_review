  meta: '`infra_off`（vLLM + FlashInfer 0.6.18.post1 在 GB300（SM103）上 `trtllm_fp4_block_scale_moe` autotune：报告者观察到启动停在 autotune **40+ 分钟**，GPU 利用率 100%、期间无进度日志、cache 目录已创建但 `autotune_configs.json` 未写入；未见 error/traceback；跳过该 op 的 autotune 后同配置约 8 分钟进入服务。**未证明永久挂死**） · Cov: `var:vllm_flashinfer_autotune_config_cache_rank0_only_dump_multi_rank_launch_deadlock`（仅按 autotune 启动活性症状关联 5.40；5.40 有独立已知根因，本条根因未定） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '**根因未定**。2026-09-23 报告者撤回「`trtllm_gemm.so` 仅有 sm_100a cubin 且无 PTX → SM103 候选永不终止」归因：该库是 dense GEMM 模块，`fp4_block_scale_moe` 符号实际位于含 sm_103a cubin 的 `fused_moe_trtllm_sm100.so`；前者的架构观察虽真实，但与本 op 无关。autotuner 开始/结束之间缺逐 bucket 进度日志，cache 只在完成时写出；40+ 分钟和空目录不能区分极慢调优与真正卡死。报告者认为极慢爬行更可能，但仍待进程栈/完成时间验证；不得把无 per-candidate 超时或不兼容 cubin 断言为已证根因。**2026-09-24 评论补读更正**：autotuner 实际有 tqdm 进度输出（`[AutoTuner]: Tuning ...: N/21`，以 `\r` 分隔写 stderr——按行采集的日志捕获方式会吞掉），「无进度日志」应按捕获口径理解为"未被观测到"；另一台 GB300（SM103）+ 不同模型（MiMo-V2.6-Pro-RL，MXFP4 384 专家）复现同类病理性 autotune，排除单点/单模型因素。根因未定判定不变。'
  source: 'vLLM #58031（2026-09-21 报告，2026-09-23 EDIT 撤回原归因；报告者在评论中确认模块符号和 sm_103a cubin；2026-09-24 补读 jmeadlock/ebfio 评论——tqdm 进度与第二台 GB300 复现）。https://github.com/vllm-project/vllm/issues/58031 ；更正评论 https://github.com/vllm-project/vllm/issues/58031#issuecomment-5788562400'
  behavior: 观察窗口内启动未就绪、无中途进度日志和完成态 cache 文件；**不等于永久挂死**，亦无证据证明候选内核无法在 SM103 执行。跳过调优可绕过该次启动延迟，但不构成故障根因验证。
  trigger_surface: vLLM + GB300/SM103 + FlashInfer `trtllm_fp4_block_scale_moe` autotune 未跳过（hw_specific；SM103 上的报告，其他架构不可泛化）
