  meta: '`infra_off`（`ttnn.sign(NaN)` 返回 **+1** 而其自身 golden 返回 0——kernel 与 golden 分歧且 NaN 探针从不送达该 op；sign 是 `sign(grad)*inf` 反向习语的符号载体，NaN 来袭梯度经该习语输出 **+inf 而非 NaN**，殃及 8 个 backward 组合：acos_bw/asin_bw/log_bw/logit_bw/logiteps_bw/reciprocal_bw/erfinv_bw/div_bw；`sign(−0.0)=−1` 为已记录的独立分歧不在此报） · Cov: `var:ttmetal_argmax_comparator_nan_zero_sign_semantics_dtype_split`（1.151 NaN 符号语义分裂族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: SFPSETCC 的 NaN 路径落 +1；golden 测试的 NaN 探针从未覆盖 sign（验证真空），分歧对 CI 不可见，毒性经习语组合向外传播。
  source: 'tt-metal #55827（2026-09-08 open，community label，含 8 个受污染 backward 清单与 `_EDGE_DIVERGENCE_REASON` 对照）。https://github.com/tenstorrent/tt-metal/issues/55827'
  behavior: 无 crash——NaN 输入被静默换成合法值 +1、再经 idiom 放大为 +inf：**错误类型被偷换**（NaN→inf），下游依赖 NaN 传播/finite 检查的防线全部失灵。1.151（比较器 NaN 语义 dtype 分裂）之后 NaN 语义族新实例，且首次显形「单 op NaN 语义错 → 组合习语系统性中毒」的传播模式。
  trigger_surface: tt-metal sign + NaN 输入（hw_specific；任何经 sign(grad)·inf 习语的 backward 均暴露）
  discovery: 2026-09-08 每日扫描。
