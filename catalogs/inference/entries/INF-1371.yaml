title: torch_npu npugraph_ex 回放覆写前次输入存储
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: npugraph_ex 静态输入槽
  behavior: 同一已捕获 ACL graph 被同形状不同输入张量回放时，前一次调用的输入存储被后续回放覆写，旧输入张量数据被静默改写。
effect:
  objects:
  - 跨请求/跨样本数据
  detail: 同形状即触发（不涉及动态 shape）；仅紧邻前一次输入被改写；输出及时 clone 即正确。保留旧 batch 输入的场景（缓存/去重/落日志/双缓冲/失败回捞）被静默污染；常规训练循环因地址复用恰好不触发，更隐蔽。
  visibility: 静默错误
mitigation:
  detect: 回放后 torch.equal(t, snapshot) 检查旧输入（报告含 12 行最小复现）
  fix: 规避：传入前 x.clone() 留存，或改 backend="npugraphs"（实测输入受保护）；issue 期望对齐输出侧的告警/开关（acl_graph.py:1470 仅有输出侧覆盖告警），官方修复未出（closed 状态但无修复链接记录）
