original:
  mechanism: backend="npugraph_ex"（ACL graph）下同一已捕获图被不同输入张量回放时，前一次调用的输入存储被后续回放覆写，全程无报错。最小复现：3 个同形状 (16,128) 输入依次回放，x0 的 torch.equal 由 True 变 False（数据被改写非引用变化）；npugraphs/npu/aot_eager 三对照后端均完整。运行时仅对输出侧有保留内存覆盖告警（torch_npu/dynamo/npugraph_ex/_acl_concrete_graph/acl_graph.py:1470 及 clone_output 选项），输入侧无任何提示。初步推测 ACL graph 固定地址静态输入槽 copy-in 写入旧输入存活存储，精确机制以官方定位为准。环境：Atlas 800T A2（910B2）、CANN 9.1.0、torch/torch_npu 2.12.0、Python 3.12 aarch64。
  source: 'Ascend/pytorch #5114（2026-10-14 采集批次内正文，原报 2026-09-24 closed；含最小复现、四后端对照表与影响分析）。https://gitcode.com/Ascend/pytorch/issues/5114'
  behavior: 旧输入张量数据被静默改写（输出正确），无告警无 crash；依赖保留旧 batch 输入的下游（缓存/去重/日志/双缓冲/回捞对比）被污染且极难排查。
