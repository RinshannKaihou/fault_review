id: INF-1383
legacy_ids: []
slug: cann_ops_nn_hard_swish_v2_bf16_tmp0_clobber
aliases: []
title: HardSwishV2 BF16 分支覆盖原输入致输出错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: hard_swish_v2 BF16 分支
  behavior: BF16 分支先把原输入转到 tmp0，随后 Duplicate(tmp0, 6.0f) 覆盖它，最后仍把 tmp0 当原输入相乘——输出接近 clamp(x+3,0,6) 而非 HardSwish 公式；还读取未写入的 zLocal。
effect:
  objects:
  - 数值结果
  detail: 真机 BF16 复现（长度 64 边界值扫描）：x=-2 得 1（期望 -0.334）、x=0 得 3（期望 0）、x=8 得 6（期望 8），48/64 失败；FP32 控制组 0 失败。experimental OpDef 前向 kernel，非 hard_swish_grad_v2。
  visibility: 静默错误
mitigation:
  detect: BF16 独立公式 x*clamp(x+3,0,6)/6 对照（报告含 ASC 直编生产头文件的真机复现与保护区间检查）
  fix: 修复已在同环境验证（保留 FP32 原输入缓存+倒数标量缩放，移除未写读取；CPU 21/21、A3 三精度矩阵 21/21、大 tile/host tile 6/6）；修复 PR 随 issue 提供，合并状态未核实
