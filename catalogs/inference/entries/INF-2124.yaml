  mechanism: 'tt-metal 345aebfbe8（Blackhole p100a，KMD 2.8.0/FW 19.8.1）binary_ng 的 add/subtract/squared_difference/fast multiply/fast divide 及 eq/ne/gt/lt/ge/le 在一个 float32 操作数与一个 bfloat16/bfloat8_b/bfloat4_b 操作数混合（TILE、同 shape、random normal）时静默丢失 float32 精度，输出按低精度操作数的精度：262,144 元素对照 torch fp32（bf16 混合）add 错 145,060、sub 145,155、sqdiff 154,202、mul 143,531、div 152,505、eq/ne 34,072、gt/lt/ge/le 17,036；bfloat8_b/bfloat4_b 混合 71k-94k 量级。两个 float32 操作数结果正确。ttnn.add 情形最早在 #61268 记录。是否回归未知。'
