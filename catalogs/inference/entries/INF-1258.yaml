  meta: '`infra_off` · Cov: `var:vllm_multimodal_cachekey_collision` · 触发 `no` · 置信度 `documented`'
  mechanism: 在 V1 P/D 分离中，`SharedStorageConnector` 的存储键由 `prompt_token_ids` 派生（文本 + 与图像尺寸相关的占位符数量），但**不**包含图像内容 → 第三个请求若带一张尺寸相同、内容不同的图像，就会哈希到已有条目；decode 端加载了前一个请求的 KV 并输出完全相同的结果。
  source: 'vLLM #21175（Qwen2.5-VL-3B，1P1D）。'
  behavior: 不同图像的请求输出逐字相同——是本目录里少数「输出可直接肉眼判定」的跨请求碰撞。
  trigger_surface: 需要 P/D 分离或跨节点/RDMA 拓扑（默认实验室单机不具备）
  signature: off-manifold（infra_off），但形态特殊：传输过来的 prefill KV 与另一个请求的 KV **逐比特相同**，尽管多模态输入不同。检测判据因此是结构性的「跨请求 KV / prefill embedding 在前缀区域完全相等」——这属于 cheap（哈希/相等性比对）与 geometric（跨请求逐位置余弦恰为 1.0）能直接拿下的类型。漏检者：任何单请求内部的 statistical / spectral / infotheoretic 判据——被复用的 KV 是另一个请求的健康激活，孤立看毫无异常。纯文本稠密模型无多模态占位符路径，无法单机复现。
  locus: '`cross-node-transfer`'
  priority: '`low`'
