original:
  category: KV8
  section: KV §8 control-flow（推测解码 / beam-search / CUDA-graph × KV）
  meta: '`infra_off` · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: beam search 每步通过 `key_cache[layer].index_select(0, beam_idx)` 按 beam 重新索引 KV；对混合模型（Lfm2：conv/short-conv 层与注意力层交错），每层 cache 不是统一的 `[batch,...]` 张量，因此 beam 维的 `index_select` 越界（`IndexError`）。通用隐患：在错误维度上重排、或在缺少 beam 轴的层上重排，会崩溃，或**静默地**把错误的 KV 重排进某个 beam 槽。
  source: 'transformers #42257（`modeling_lfm2.py:216`，v4.57.1）。'
  behavior: 混合模型上 beam search 直接 `IndexError` 崩溃；静默变体下某个 beam 继续用另一个 beam 的历史生成，输出前后语义断裂。
  trigger_surface: 原可复现；CUDA+vLLM 下仍可软件构造
  signature: infra_off——per-beam 的离流形不连续：某个 beam 的隐藏态路径在重排后突然跳到另一个 beam 的轨迹上。可捕获：trajectory 族的跳变检测，以及 cross-orthogonality / 签名余弦族（受害 beam 的签名与"捐赠" beam 对齐）。会漏检：单序列聚合指标——必须按 beam 维分开看才有信号。
  repro: '`generate(num_beams=2)` + 在最后一个 decoder layer 上的 forward hook（with_kwargs；该 hook 点上所有层都已追加当前步的行），在每个 **decode** 步（`hidden_states` seq len == 1）且 batch 维 > 1 时，对所有层的 `pkv.layers[i].keys` / `.values` 就地施加**反转的 batch 顺序**（即错误的 `beam_idx`）：每个 beam 的 KV 静默变成另一个 beam 的。等长就地改动对全 cache 安全，不改变长度。**已记录的 batch == 1 空操作**：单序列路径下反转即恒等，因此该故障只在 `model.generate(num_beams=2)`（或任意 batched decode）下被激发。'
  locus: control-flow
  priority: medium
