  source: 'SGLang #38605（2026-09-09 open，bug label，含损坏帧截图、完整日志与复现命令）。https://github.com/sgl-project/sglang/issues/38605'
  behavior: 无 crash——**容器合法但内容损坏**的静默输出：HTTP 200、文件可播放、只有人眼看帧才发现花屏。「输出工件级损坏」（视频帧而非 token）是 offload 往返损坏族的视觉域显形。
