remarks: 同一 issue 还报了一条 fp32 K=65533 的尾块精度失败（比例 3.099），本条按主要机制写成 fp16 合并溢出；两条都以 tiling 行号为据，但作者只给到 high 置信度假设，未做定点修改验证。#5622/#5905 是同一算子的相邻批次报告。
