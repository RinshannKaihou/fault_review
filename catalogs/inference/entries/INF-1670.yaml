title: BatchMatMulV3 fp16 batch 合并累加溢出为 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: batch_mat_mul tiling 合并
  behavior: MergeBatchAndMAxis 只以 batchA×M 超 INT32_MAX 作合并准入，未估 fp16 值域：并入 M 轴后 K=128、|v|≤100 累加超 65504，溢出成 Inf/NaN。
effect:
  objects:
  - 数值结果
  detail: 910B3 + CANN 9.0.0：self=[50000,32,128]、mat2=[1,128,128] fp16、值域±100（cid=898）输出 NaN/Inf；同 shape fp32 与小值域 fp16 均通过。
  visibility: 数值异常
mitigation:
  detect: fp16 + batchB=1 广播 + 大值域（±100）组合跑双标杆；用 batchB>1 的同 shape 对照（不触发合并）确认是否合并路径引入。
  fix: issue 5519 closed；正文只给根因假设（合并准入应加入 fp16 累加溢出预估），未给修复 PR。
