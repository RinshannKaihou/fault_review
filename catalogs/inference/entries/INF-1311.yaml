  mechanism: CUDA graph 重放在**完整缓存命中（full-cache-hit）**场景下**跳过了 KV 传输同步**——一个逐层（layerwise）异步 KV 操作没有被等待 → decode 读到尚未传输完成的 KV。修复方案是把该场景自动降级为 PIECEWISE cudagraph 模式。
  source: 'vLLM #29608（CLOSED 2025-11-27）+ PR #31057（MERGED 2025-12-20）。*（该 issue 曾被回填代理误判为伪造，`gh` 已确认为真实。）*'
  behavior: 在全命中路径上偶发输出错误，且因为是竞态，复现依赖时序；服务无报错。
  trigger_surface: 跨节点/PD KV 传输
  signature: '**cache-hit 前缀位置上的 off-manifold 过期（stale）KV**；cross-node × cudagraph 竞态。检测面：per-position 的 statistical KV-norm 与 geometric 偏移在命中前缀段可见（读到的是上一状态或未初始化内容）；因为损坏局限在前缀而后缀正常，**深度/位置剖面的分段差异**是关键判别信号。全局 cheap 度量与全序列平均的 spectral 度量会被正常后缀稀释。竞态性质使签名间歇出现，需要多次重复采样。'
  repro: 单钩子于 cache 写入后把前缀命中段的 K/V 替换为"上一步的值"或未初始化值（模拟未完成传输的读取）；真实的 cudagraph 重放与异步 KV 传输需服务栈复现。
  locus: control-flow
  priority: low
