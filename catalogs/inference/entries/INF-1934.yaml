original:
  mechanism: 'MindSpore 2.8.0（CPU 后端、Python 3.12）：ms.grad 在 PyNative 下对简单标量函数正常返回梯度，把同一段嵌套求导包进 mindspore.jit 后 GRAPH 模式返回空 tuple 而不是梯度张量。复现：scalar_fn(t)=ops.reduce_sum(t*t)，x=Tensor([1.,2.,3.])，期望梯度 [2.,4.,6.]；run_pynative() 打印 [2. 4. 6]（mindspore.common.tensor.Tensor），run_graph() 里 `@ms.jit def compiled(): return nested_grad()` 打印 ()（类型 tuple），随后 assert hasattr(graph,''asnumpy'') 失败并抛 AssertionError: GRAPH returned a non-Tensor result。issue 判断为 grad 嵌套在 jit 内时 autograd 图构建或返回结构处理的问题，期望 GRAPH 返回与 PyNative 相同的张量，或在该用法不支持时抛出清晰的 Python 层错误，而不是静默返回空元组。'
  source: '2026-06-04 GitCode mindspore/mindspore issue #29440 https://gitcode.com/mindspore/mindspore/issues/29440（open）'
  behavior: 把求导逻辑放进 jit 做加速之后，grad 调用返回的是空元组而不是张量：只要后续代码不做类型断言（例如直接塞给优化器或累加进 buffer），就会静默拿到空梯度，loss 不动、也不报错；同样的代码在 PyNative 下完全正常，所以第一反应往往是模型或数据出了问题。
  trigger_surface: GRAPH_MODE + ms.grad 嵌套在 @ms.jit 内（PyNative 正常）
  discovery: 2026-10-21 GitCode 历史 issue 回填（mindspore/ms* 簇第二池）
