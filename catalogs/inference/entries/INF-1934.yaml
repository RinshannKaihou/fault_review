    component: jit 内嵌套 grad 的反向图
  behavior: GRAPH 模式下把 ms.grad 嵌套进 @ms.jit 时返回空 tuple 而非梯度张量；同一嵌套求导在 PyNative 下正常。
effect:
  objects:
  - 梯度
  detail: MindSpore 2.8.0 CPU，scalar_fn=reduce_sum(t*t)、输入 [1,2,3]：PyNative 得 [2. 4. 6]，@ms.jit 得 ()（tuple）；要到 asnumpy/取值处才暴露，无 Python 层报错
  visibility: 静默错误
mitigation:
  detect: 对 jit 返回的梯度做 isinstance(Tensor) 与 shape 断言，而不是只比对数值；对比 PyNative/GRAPH 两条路径的返回类型
  fix: 待定（issue open；报告者要求 GRAPH 与 PyNative 一致，或在不支持时抛明确的 Python 层错误）
