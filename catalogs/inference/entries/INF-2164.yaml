title: torch_npu 三连：div±inf/空max/cummin NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: div、max、cummin 适配
  behavior: 三处适配缺陷：div floor/trunc 对 ±inf 除法结果错误且丢 -0.0 符号；空张量 max() 不报错静默返回 0；cummin 遇 NaN 跳过继续归约不传播。
effect:
  objects:
  - 数值结果
  detail: -1/+inf floor 得 0.0 应为 -1.0、trunc 丢 -0.0 符号；空张量 max() 得 tensor(0.) 而 CPU 报 RuntimeError；cummin 输入含 NaN 时 NaN 后位置取后续有限值；均无报错。
  visibility: 静默错误
mitigation:
  detect: 与 CPU 同输入对照（边界值 ±inf/NaN/空张量探针）
  fix: 待定
