slug: torchnpu_dvm_spec_reduce_overwrites_live_accumulator
aliases: []
title: DVM spec 归约覆盖仍存活的累加器输入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: DVM spec 归约融合
  behavior: spec 两阶段归约把第一阶段中间值写入输出 buffer，而输出与第二阶段仍需读旧值的 accumulator 是同一 primals_6，旧值被覆盖后重复累加。
effect:
  objects:
  - 数值结果
  detail: 辅助损失累加器 eager 2.2566e-4 → DVM 0.6538；单独损失的 DVM 值仍为 2.2566e-4；同 buffer 对照 0.54419416 变 128.04419（128 为第一阶段归约结果）。
  visibility: 静默错误
mitigation:
  detect: 对 in-place 累加（out 与旧 accumulator 同一 buffer）的归约图做 A/B：禁止 reduction 与 mutation 垂直融合后对比数值
  fix: 在 NpuDvmScheduling.can_fuse_vertical 拦截「mutation 目标是仍需读旧值的实际输入」的 reduction+mutation 融合（报告者本地规避）；issue open，master 5148ffb 未见该保护
