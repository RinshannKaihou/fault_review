original:
  mechanism: 'op-plugin issue #30（2025-12-30，open）：环境 910B/C、CANN 930 版本、op-plugin 7.2.0 分支。正文给出 meta 实现：@impl(m_aten, "matmul_backward") def matmul_backward_meta(grad, self, other, mask): return (torch.empty_like(self), torch.empty_like(other))。empty_like 会保留输入 tensor 的 memory format 与 stride，所以当 self/other 是非连续 tensor 时，meta 推导出的两个梯度输出被标成非连续，而实际反向执行产出的是连续 tensor。报告者指出这会让后续算子的推导产生连锁问题，期望 meta 在 shape、stride、dtype 上都与实际一致。正文的重现步骤与日志均写「暂无」，未给修复 PR。'
  source: 2025-12-30 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/30 （open）
  behavior: 在 NPU 上对非连续输入（例如先 transpose 再直接喂进 matmul）求梯度：看数值往往是对的，但图里的元信息不对——meta 说两个 grad 继承了输入的非连续布局，实际 kernel 给的是连续张量。后续接的算子按错误的 stride 假设继续推导（图模式/编译下尤其明显），问题一路传到下游，很难回溯到这个 meta 实现。
  trigger_surface: matmul_backward 的 meta / fake 推导 + self 或 other 非连续（stride 与 size 不匹配连续布局）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
