id: INF-1501
legacy_ids: []
slug: op_plugin_matmul_backward_meta_stride_inherit
aliases: []
title: matmul_backward meta 继承输入非连续 stride
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: matmul_backward_meta
  behavior: meta 实现直接返回 torch.empty_like(self)/empty_like(other)，把输入的非连续 stride 继承给梯度输出；实际反向 kernel 产出的是连续 tensor，元信息与真实结果不符。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: 非连续输入下两个梯度张量被推导为非连续而实际连续，图模式后续算子按错误 stride 推导，产生连锁的形状/访存假设错误；单算子 eager 对比看不出。
  visibility: 静默错误
mitigation:
  detect: 输入非连续（transpose 后未 contiguous）时比对 matmul_backward_meta 推导的 stride 与实际执行结果的 stride
  fix: issue 为 open，正文未给修复 PR；报告者要求 meta 在 shape/stride/dtype 上与实际执行保持一致（合入与发布状态未核实）
