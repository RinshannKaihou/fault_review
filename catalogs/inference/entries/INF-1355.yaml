  meta: '`infra_off`（SGLang Rust 多模态扩展 `sglang-mm` 的 `apply_layout` 把每个媒体项位置报为 u32 `(start, end)`，而展开后的 prompt 全长是 i64——多模态占位符展开后 ≥2^32 token 时 u32 回绕；回绕对 `(start, end)` 流入 Qwen-VL M-RoPE 计算，其边界守卫 `start < st || end >= len` 用**真实 64 位长度**校验**回绕后**的 pair，检查通过，图像 M-RoPE 坐标写进位置表约 2^32 token 之前的位置——位置表静默错位/媒体错位，无 crash 无报错。CPU 侧预处理即可复现（无需 GPU），入口可从 Rust server 多模态 worker 的 qwen_vl 家族到达；下界无钳制：驱动只查媒体项数与字节数，服务端上下文长度检查在其后） · Cov: `NEW` · 触发 `other_stack` · 置信度 `verified`'
