  meta: '`infra_off`（SGLang Gemma-4-31B（`attention_k_eq_v` 架构：10 个 full_attention 层**无 v_proj 权重**、k 即 v）+ PEFT LoRA adapter：三重加载失败链——(1) `get_hidden_dim` 从顶层 `Gemma4Config` 读不存在的 `head_dim/hidden_size/intermediate_size` 启动即错；(2) 绕过后 per-layer buffer 维度按全局 head 数计算、混合 256/512 head_dim 层错位；(3) vision-tower 张量与语言塔 LoRA 名字碰撞。50 个 sliding_attention 层 q/k/v 齐全、10 个 full_attention 层只有 q/k——**同一模型两类层的投影集不同**使统一七投影假设全断） · Cov: `NEW`（k_eq_v 架构投影集异构性未处理的加载子签名） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: Gemma-4 31B 的 `attention_k_eq_v` 层用 k_proj 兼任 v_proj（权重层面 v 不存在），LoRA 加载器按"七投影齐备"的均匀假设遍历目标层；#25913（E2B 同族）被 auto-close 后 31B 因层数不同暴露更深的 buffer 维度问题——异构投影集架构需要 per-layer 投影发现而非全局假设。
  source: 'SGLang #40966（2026-09-23 open，含 safetensors header 级层类型/投影矩阵（50 sliding 全齐 + 10 full 缺 v）、三重失败链逐步描述）。https://github.com/sgl-project/sglang/issues/40966'
  behavior: 第一重 fail-loud（启动错）；绕过后的错位 buffer/名字碰撞若被绕过则**静默错服务**（维度碰巧兼容的层加载成功、语义错位）——Gemma-4 k_eq_v 变体在 SGLang 的 LoRA 路径整体不可用，用户被迫回退 dense 或基模服务。
  trigger_surface: SGLang + Gemma-4-31B（attention_k_eq_v）+ PEFT LoRA `--enable-lora`（other_stack）
  discovery: 2026-09-23 每日扫描。
