  meta: '`ambiguous`（gated on trigger input） · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: MERGED 条目，合并两个子故障：(1) **TBT**（Targeted Bit Trojan, CVPR 2020）—— 用少量 bit-flip 植入一个 DORMANT 后门，模型只在特定 trigger pattern 出现时才误判到攻击者指定的 target，其余输入上准确率正常；(2) **ProFlip**（ICCV'21）—— 同一思路的 progressive 版本，逐步搜索并翻转 bit，使整个攻击落在 Rowhammer 可行的范围内。两者共同点是被改动的参数极少，且后门默认处于休眠状态。
  source: Rakin, He, Fan, "TBT", CVPR 2020 (NSF PAR purl 10295343) 。Chen, Zhao, Koushanfar et al., "ProFlip", ICCV 2021, https://openaccess.thecvf.com/content/ICCV2021/papers/Chen_ProFlip_Targeted_Trojan_Attack_With_Progressive_Bit_Flips_ICCV_2021_paper.pdf 。
  behavior: 良性输入上表现正常，指标看不出退化；只有携带 trigger 的输入会被导向攻击者预设的 target completion。
  trigger_surface: 指定 bit 类翻转
  signature: 本类里最难抓的一个：良性输入上隐状态保持 ON-manifold，静态监控器看到的几乎全是健康激活。只有 trigger 输入才点亮被植入的方向。因此需要 trigger 条件下的 trajectory / spectral 签名（对同一 prompt 族做输入条件化对比），而非无条件的单帧 geometric 离群检测；不做触发采样的评测会得到接近随机（无信号）的结论。
  repro: yes。把"trigger→target 映射"直接写进少量权重 bit（选定若干参数元素做 bit 翻转），再用带/不带 trigger 的两组 prompt 分别取隐状态；复现本体是权重变换，评测需要成对的触发/非触发输入集。
