original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off` · Cov: `var:3.19` · 触发 `partial` · 置信度 `verified`'
  mechanism: BFA 谱系的三条主线合在一处：Progressive Bit Search 用梯度对 bit 排序，逐步挑出破坏力最大的位；只翻 sign bit 可获得每次 flip 的最大杠杆；翻 exponent bit（Terminal Brain Damage）则可由单个 bit 直接产生 inf/nan —— 这是被引用最多的 critical bit 类别。
  source: Rakin ICCV'19 (PBS); arXiv:2502.07408 (sign-bit leverage); Hong et al. "Terminal Brain Damage" USENIX'19 (exponent-bit) 。
  behavior: 源文档未单列，注明由 weight_bitflip {exp_high, exp_low, mantissa_high, mantissa_low, naninf} 覆盖 —— 即从"数值爆炸/NaN 传播"到"细微数值畸变"的连续谱，取决于所翻的 bit 类别。
  trigger_surface: 渐进 BFA：可做但耗时
  signature: infra_off。签名与既有 weight_bitflip 各 bit 类一致：exponent-bit / naninf 端是强 off-manifold 的大幅值离群（geometric 与 cheap 度量都能轻松捕获）；mantissa_low 端幅值小、逼近噪声底，需要 spectral/trajectory 才有分辨力。sign-bit 变体介于两者之间：幅值不一定大，但方向被翻转，几何上离流形的角度偏移比幅度更显著，因此 cosine/角度类 geometric 度量优于纯范数类度量。本条不引入新的签名形状，只是给出"哪一位 bit 被翻"的攻击者最优选择。
  repro: yes。用 3.19 `weight_bitflip` 的复现路径按 bit 类（exp_high/exp_low/mantissa_high/mantissa_low/naninf）翻转权重张量元素即可；本条只需在选位策略上换成梯度排序或 sign-bit-only。
