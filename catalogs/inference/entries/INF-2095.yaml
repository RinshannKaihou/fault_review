aliases: []
title: PD 多机 PP 的 ZMQ 端口基址错算致 KV 传不到
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: mooncake_connector 端口映射
  behavior: D 侧 _get_remote_ranks_for_req 用 P0 的 kv_port 当所有 PP rank 的 base port 再加 rank 偏移；PP2/PP3 在 P1 上、base 为 31113，端口因此偏 -1。
effect:
  objects:
  - 可用性/进度
  - KV状态
  detail: PD分离多节点PP且kv_port随NODE_RANK递增时，P1只监听31129-31144；D侧连31128出现21次Receive timeout，31128无监听，请求被判KV load失败；P节点KV cache涨到100%，bench 100多条后卡死。
  visibility: 挂起
mitigation:
  detect: 核对各 P 节点 ZMQ 实际监听端口范围与 D 侧日志中的 remote handshake port，或统计 Receive request timeout 的目标端口是否集中在同一端口
  fix: issue 只做根因定位，未给 PR；规避是让各 P 节点使用同一 kv_port 基址（issue closed，修复未核实）
