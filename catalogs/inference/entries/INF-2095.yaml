original:
  mechanism: P 侧 mooncake_connector.py:239 的握手端口为 handshake_port = side_channel_port + device_index，side_channel_port 就是 --kv-transfer-config 里的 kv_port。现场用 KV_PORT=$((31112 + NODE_RANK))，于是 P0（NODE_RANK=0）监听 31112-31127，P1（NODE_RANK=1）监听 31129-31144。D 侧 _get_remote_ranks_for_req（line 1744）用 [tp + pp * prefill_tp_size for pp in range(pp_size)] 得 [0,8,16,24]，再在 line 1387 统一加 meta.remote_port 并只取 P0 scheduler 的 self.side_channel_port=31112，得到 [31112,31120,31128,31136]。PP2/PP3 实际在 P1 上，正确值应是 31113+16=31129 与 31113+24=31137，因此 PP2+ 的端口整体偏 -1。remote_multi_nodes_meta_mapping（line 1489-1494）只修正了 host，端口计算仍差 1，所以失败的 21 次请求恰好都是访问 PP2 的 TP1 rank（端口 31128）。
  source: 2026-07-02 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/11343 （closed）
  behavior: PD 分离服务拉起后单条 curl 正常，一跑 bench 就出问题：D 节点 Avg generation throughput 只有 50 tokens/s 左右但仍在正常处理，P 节点 Avg prompt throughput 只有 1k+（正常 3k+ 的一半），GPU KV cache usage 一路涨到 100%，跑到 100 多条请求后整个 bench 彻底卡死。日志里 D 节点有 21 次 Receive request timeout，全部指向 33.182.142.85:31128（P1），而 P1 容器的 ZMQ 端口范围是 31129-31144，31128 没有 worker 监听；请求因此被判 KV load 失败。
  trigger_surface: PD 分离 + 多节点 PP，各 P 节点 kv_port 基址不同（KV_PORT 随 NODE_RANK 递增）
  discovery: 2026-10-21 第三轮顺序扫描（final_tail，issue created < 2026-10-07）
