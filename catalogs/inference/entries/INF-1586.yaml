id: INF-1586
legacy_ids: []
slug: hccl_v_collective_span_calc_element_vs_bytes
aliases: []
title: HCCL V 类算子跨度计算漏换算致注册偏小
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: 通用
    component: AllToAllV/AllGatherV 跨度计算
  behavior: AllToAllV 图模式 CalcInputOutputSize 把 displs+counts 当字节跨度、未乘 datatype size；AllGatherV 普通路径只累加 recvCounts、忽略 displs 空洞。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: AllToAllV/AllGatherV图模式内存注册下，非1字节dtype或recvDispls非连续时，注册/DFX尺寸偏小；通信照常执行、接口不报错，可能写到注册范围之外或被踩踏，出现偶发错值/精度异常，无尺寸告警。
  visibility: 静默错误
mitigation:
  detect: 构造 displs 非连续或 dtype>1 字节的 V 类算子调用，打印 param.inputSize/outputSize 与 (displs+counts)*typeSize 对比；图模式注册长度与实际寻址长度对不上即为中招
  fix: issue 建议 CalcInputOutputSize 增加 datatype/element size 参数按字节计算，AllGatherVOutPlace 改用 max((recvDispls[i]+recvCounts[i])*perDataSize) 并补加法/乘法溢出检查；两条 issue 均 closed，合入与发布未核实
labels:
  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: HcclAlltoAllV/HcclAllGatherV 且 dtype 非 1 字节或 displs 非连续；图模式路径注册内存；静态审查基线 aa1d9935（AllToAllV）、2ddb2ce0（AllGatherV），未跑多 rank 通信验证
  stage: N/A
