relations: []
original:
  mechanism: cann/hccl#680：src/ops/all_to_all_v/all_to_all_v_op.cc 的 CalcInputOutputSize 用 tmpInputSize = sdisplsData[i] + sendCountsData[i]、tmpOutputSize = rdisplsData[i] + recvCountsData[i] 取最大值写 param.inputSize/outputSize，而 HcclAlltoAllV 的公开语义里 counts 是元素数、displs 是以 datatype 为单位的元素偏移，因此得到的是元素跨度而非字节跨度；该值经 RegGraphModeBuffers→HcclRegstryBuff→HcclCommMemReg 作为图模式内存注册的 buffer size 使用，而实际地址计算会乘 datatype size，单位不一致（FP32、sdispls=0、sendCounts=1 时注册 1 字节、实需 4 字节），基线 aa1d9935。cann/hccl#265 是同一缺陷族另一处：src/ops/all_gather_v/all_gather_v_op.cc:181-185 普通路径 AllGatherVOutPlace 只累加 recvCounts 计算 outputSize，忽略 recvDispls 中间空洞，而同文件 :291-292 的 GraphMode 路径已按 max((recvDispls+recvCounts)*perDataSize) 计算，AllToAllV 亦有注释“计算整片数据包含中间间隔的大小”；例 recvCounts={1,1}、recvDispls={0,4}、INT32 时真实跨度 20 字节而普通路径得 8 字节，该值在 op_common.cc:1691-1693 用于 output buffer 注册与 DFX 尺寸记录。
  source: 2026-09-01 GitCode cann/hccl issue https://gitcode.com/cann/hccl/issues/680 （closed）；同族 2026-07-09 https://gitcode.com/cann/hccl/issues/265 （closed）
  behavior: 用 AllToAllV/AllGatherV 跑非 1 字节 dtype（fp32/fp16 之外的 fp32、bf16 等）或多卡不均衡切分时，图模式会按偏小的长度注册输入/输出内存，通信照常执行、接口不报错，但可能写到注册范围之外或被踩踏，表现为偶发错值/精度异常，且日志里看不到任何尺寸相关的告警。
  trigger_surface: HcclAlltoAllV/HcclAllGatherV + dtype 非 1 字节 或 recvDispls 非连续 + 图模式内存注册
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
