original:
  mechanism: '多维权值 tile 归约、归约轴为首维时，triton-ascend lowering 把归约轴与内层 x 轴的 stride 映射交换/展平，确定性产出错误数值（IR 正确、数值错——静默误编译非编译失败）。控制组：同 offset 数学 2-D [RBLOCK,XBLOCK] tile tl.sum(acc,0) 逐位正确（maxdiff 0.0）；3-D acc 在 sum 前立即 reshape 为 2-D 不能修复。该形状正是 torch inductor NPU triton_experimental 后端为 broadcast-input backward reductions 发出的形状，在其 opinfo 上表现为 33 行大幅梯度错值（abs diff 至 150+，含 aten.add 广播梯度）；缺陷在编译器层、纯 Triton 可复现。与 #2247（A5 2-D lane-drop）、#2239（A5 编译期 IR 错）平台与机制均不同。环境：910B4、CANN 9.1.0、triton-ascend 3.6.0、torch 2.14.0a0/torch_npu 2.14.0。'
  source: 'triton-ascend #2291（2026-09-19 open，含完整最小复现与 opinfo 影响面）。https://github.com/triton-lang/triton-ascend/issues/2291'
  behavior: 3D maxdiff 2025.0（消费 stride-50 轴）、2D 0.0，两次运行逐位一致；内核无任何报错。
