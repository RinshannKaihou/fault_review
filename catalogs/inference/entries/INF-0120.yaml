  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（sdpa_decode 非零 mask seed tile 经 512 次/tile 标量 volatile store 构建后，`copy_tile` 立即 NoC 回读同地址、其间无 blocking read-back——RISC 核与 NoC 为独立 L1 client 无程序序保证；零路径有 `write_zeros_l1_barrier`，标量路径无任何屏障：上游 #50373 已命中、PR #50374 已修的同构竞态在 decode 侧种子路径的复现） · Cov: `var:kernel_sync_semantic_silent_error` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`dataflow_common.hpp:27-44` `fill_tile` 把 `val==0` 走 `async_write_zeros`（#45450 起带 barrier），非零值走逐字 store 循环；四个 seed 点（:278/:282/:335/:341/:390）均从 `writer_decode_all.cpp` 每次调用可达（causal / sliding-window / block-padding mask）。种子复制改写（含 drain）在 P300 七个 decode shape 上 wall clock 中性（15–60µs/call）。'
  source: 'tt-metal #54708（2026-08-28 open，标注 correctness-adjacent；prefill 侧孪生为 #54696）。https://github.com/tenstorrent/tt-metal/issues/54708'
  behavior: 主显形为 perf（一次性构建被 512 次标量 store 拖慢）；竞态窗口可使 mask 回读到 stale 值 → attention mask 错误。与 1.9（kernel 同步语义静默丢错）同族，本条在 dataflow 种子构建路径且已有上游修复先例可对照。
  trigger_surface: tt-metal sdpa_decode + 非零 mask seed 路径（causal/sliding-window/block-padding；软件调度依赖）
