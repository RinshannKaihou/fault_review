original:
  mechanism: 'fused MC2 MoE 路径（enable_fused_mc2=1）的 dispatch_ffn_combine 内核按 max_output_size 分配每 rank token 缓冲，post-dispatch 计数达容量即静默截断（preCurrentmSum >= maxOutputSize → currentM=0；否则钳到差值），无任何错误。additional_config.mega_moe_max_tokens 文档称同时 sizing op 的 max_output_size 与 CANN MegaMoe 对称缓冲 max_recv_token_num，实际只有 op 侧被守护。每 rank post-dispatch 均值为 num_tokens*num_experts_per_tok，实测负载达均值 ~4.9 倍（GLM-5.2-w4a8/A3/EP16：median 14923/p99 44332/max 70990，单专家 max 31711=默认 65536 的 108%），长上下文 prefill 必然越界。独立复现：mega_moe_max_tokens=8192 + 67531-token prompt → 273/288 调用截断、28/288 NaN 行；65536 同请求正确。修复 PR #17343 推导 rank 不变下界（对称缓冲由集合握手分配，各 EP rank 必须同值）并 max(configured, required)。'
  source: 'vllm-ascend PR #17343（2026-09-23 open、2026-10-14 复核仍 open 未合并，含根因代码、负载统计与修复验证）。https://github.com/vllm-project/vllm-ascend/pull/17343'
  behavior: '无报错——受影响 token 的 MoE 输出损坏，表面为重复/乱码 token（issue #16941）；负载统计驱动，长上下文高并发下概率触发。'
  trigger_surface: vllm-ascend enable_fused_mc2=1 + 长 prefill chunk 使每 rank post-dispatch token 数超容量
  discovery: 2026-10-14 每日扫描（NPU 新来源首轮）
