id: INF-1389
legacy_ids: []
slug: vllm_ascend_fused_mc2_capacity_silent_truncation
aliases: []
title: vllm-ascend fused MC2 容量截断静默损坏 MoE 输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: vllm
    component: fused MC2 dispatch 容量
  behavior: dispatch_ffn_combine 按 max_output_size 分配每 rank 缓冲，计数达容量即静默截断不报错；mega_moe_max_tokens 只守护 op 侧，默认 65536 覆盖不了长 prefill 负载。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: enable_fused_mc2=1，长prefill超容量时，受影响token的MoE输出损坏，表现重复/乱码；mega_moe_max_tokens=8192+67531-token prompt复现273/288调用截断、28/288 NaN行；65536同请求正确。
  visibility: 静默错误
mitigation:
  detect: 对比 op 容量与每 rank post-dispatch 负载分布（PR 含实测统计表）；修复 PR 自带一次性 warning（命名两个缓冲与 --max-num-batched-tokens 替代）
  fix: 'PR #17343（open，2026-10-14 仍 open 未合并）：_fused_mc2_required_capacity() 按编译期配置推导 rank 不变下界，_fused_mc2_capacity()=max(configured, required)，同时用于 op max_output_size 与 P/PD-mixed peer buffer；规避=调大 mega_moe_max_tokens'
