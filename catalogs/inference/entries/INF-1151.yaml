  meta: '`infra_off`（SGLang **量化** DFlash2 draft checkpoint 加载进 `DFlash2DraftModel` 正常服务、draft 被 ~100% 拒绝——**无错误无警告**，acceptance 从 ~3.71 塌到 1.03（n=422 decode batch 从未超过 1.12）、decode 降到比无 drafter 更慢（~38 vs ~171 tok/s：付全额 verify 成本换零接受 token）。同权重**不量化**（BF16）完全正常（accept 3.71/0.61）——两 drafter 参数量相同（1,924,404,480）、`dflash_config` 与 tensor 名全同，唯一差异是量化（compressed-tensors W4A16）。是 #36599（modelopt_fp4 量化 NextN draft 以 tensor-shape mismatch **fail-loud**）的静默对偶；未根因（read-only 报告）。auto-round 4-bit g128 sym、Qwen3.8-27B DFlash2、TP2 + flashinfer + fp8_e4m3 KV 复现） · Cov: `var:vllm_dflash2_draft_fp16_xpu_zero_acceptance_bf16_works`（12.31 量化 drafter 0% 接受族） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: 量化 draft 权重的某处（scale/zero-point 应用路径或 selector codebook 反量化）与 verify 路径不兼容，draft 分布偏移致全拒；具体位点未定位，报告者未根因。
  source: 'SGLang #39087（2026-09-11 open，含同权重量化/非量化双 drafter 对照表、accept-len 分布与启动命令）。https://github.com/sgl-project/sglang/issues/39087'
  behavior: '无 crash、无警告——**静默性能塌方**（decode 比不用 drafter 更慢），accept-len 指标是唯一线索。12.31（DFlash2 fp16 XPU 0% 接受）与 11.73（qwen4exp drafter 五阻断）之后"量化 drafter 静默失效"族新成员：本条在 compressed-tensors W4A16 维度、且与 #36599 构成同一 bug 的 loud/silent 双形态。'
