  mechanism: QuaRot / SpinQuant / QuIP# 会在量化前施加一个正交 / Hadamard 旋转并融合进相邻层，使 outlier 通道的能量被非相干地摊开。若该旋转 MISSING（退化为朴素 4-bit）或 WRONG（用随机旋转而非学到的 Cayley 旋转），outlier 尾部就不会被压平，4-bit 精度显著下降；SpinQuant 明确报告随机旋转会造成大幅精度下降。本条为 MERGED 条目，合并的子故障为：QuaRot / SpinQuant / QuIP# 三条技术路线下的 missing rotation 与 wrong rotation 两种形态。
  source: QuaRot arXiv:2404.00456；SpinQuant arXiv:2405.16406；QuIP#。
  behavior: 无旋转时 W4A4 精度急剧下降；随机旋转只能部分恢复；学到的旋转才能完全恢复。
  trigger_surface: 量化后端/位数/KV quant 配置
  signature: model_on——旋转本身是正交变换，缺失它不会把状态推离流形，只是让后续量化误差更大。判别签名是 per-channel kurtosis 保持 HIGH（未被压平），而非旋转后应有的近高斯形态。cheap 族探针即"量化前激活的 per-channel kurtosis"。statistical 族最敏感；spectral 族可看到能量未被摊开（谱质量仍集中在少数方向）；geometric 族与 trajectory 族基本漏检，因为最终隐状态仍留在自洽流形上。
  repro: 在 fake-quant 前后成对地施加 / 省略一个 Hadamard 旋转（单钩子内完成 rotate → fake-quant → un-rotate），并提供"随机旋转"分支以复现 SpinQuant 的降级形态。
