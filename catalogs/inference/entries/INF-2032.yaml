original:
  mechanism: 'vllm-ascend issue 12455（2026-07-21，open）。Qwen3_14B，vllm serve --tensor-parallel-size 4 --enforce-eager --block-size 32，--additional-config ''{"dump_config_path": "/home/tmp/msprobe_config.json"}'' 接 msprobe 统计量采集。一次 completions 请求（max_completion_tokens=32）本应在 step15 结束采集，但请求返回 200 之后 dump 仍多建一个 step16 并停在那里等写入；第二次请求的采集直接续写到 step16，预期到 step31 结束，结果又建了 step32 空等。报告者据此说明每次请求结束都会在结果里留一个空 step，未给出 dump 侧代码定位或修复 PR。'
  source: 2026-07-21 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/12455 （open）
  behavior: 用 msprobe 采 vLLM 推理时，采集目录里每次请求结束都会多出一个空 step：本次本该停在 step15，实际留下 step16；下一次采集从 step16 开始写，结束时又留 step32。采集本身不报错，但拿这批 dump 按 step 对齐做精度比对时，步号每隔一次请求就错开一格，末尾还多出没有数据的 step。
  trigger_surface: vllm-ascend + msprobe dump（dump_config_path），单次 completions 请求结束边界
