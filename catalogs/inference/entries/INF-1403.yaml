original:
  mechanism: 'cann/ops-nn conv/conv2d_v2/op_graph/fusion_pass/pad_conv2d_fusion_pass.cpp 的 CheckPadV3ConstantValue() 先要求常量 dtype 为 DT_FLOAT，随后以 static_cast<int32_t>(floatData[0]) != 0 拒绝非零值——该转换把绝对值小于 1 的有限小数截断为 0，检查通过后 CheckPadV3AndExtractPaddings()/ValidateAndComputePads() 继续融合：移除 Pad 节点并把 padding 合入 Conv2D，融合后 Conv2D 使用隐式零填充，与原 0.5 填充值语义不同。最小例：NHWC [1,1,1,1] 全零、四边各 pad 1、3x3 全 1 卷积核——未融合 3x3 窗口内 8 个 0.5 填充值输出 4，融合后输出 0。同目录 docs/PadConv2dFusionPass.md 明确限定 PadV3 仅 constant_values=0（fp32）可融合；现有单测 padv3_constant_value_not_zero 只覆盖 1.0 未覆盖 (0,1) 区间。修复：浮点零值比较替代整数转换（MR #12124，open）。'
  source: https://gitcode.com/cann/ops-nn/issues/6783 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/12124
  behavior: GE 图中使用 PadV3(mode='constant', constant_values=0.5) 后接 Conv2D 的模型，编译融合后卷积结果与未融合时不同：填充值被静默换成 0。最小例中输出从 4 变成 0。无报错无警告，仅最终数值错。
  trigger_surface: cann/ops-nn PadConv2dFusionPass；PadV3 constant 模式 FP32 填充值 0<v<1；H/W 维正 padding 且连接 Conv2D；GE 编译期触发（运行期无感知）
