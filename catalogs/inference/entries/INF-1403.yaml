cause:
  objects:
  - subsystem: 编译器
    stack: 通用
    component: PadConv2dFusionPass 融合准入
  behavior: CheckPadV3ConstantValue() 对 FP32 常量用 static_cast<int32_t> 判零，|v|<1 的小数（0.5f）截断为 0 通过检查，PadV3 被移除融合进 Conv2D，padding 语义变零值
effect:
