  mechanism: MERGED 条目，合并了 copy / paraphrase / binding errors 三类子故障。总机制是输出相对于给定的 grounding／source 不忠实，分两支：intrinsic —— 输出与源材料矛盾；extrinsic —— 输出超出源材料的范围（引入源中没有的内容）。copy/binding 错误（复制错实体、把属性绑到错误对象上）属于其中的具体表现形式。
  source: Maynez ACL 2020；Ji ACM CSurveys 2023；Zhang, "Siren's Song", Comp.Ling. 2025。源文档未给出论文完整标题（Maynez / Ji 两条）、arXiv 号与 URL。
  behavior: 摘要／RAG 输出与所给文档相矛盾（intrinsic），或凭空添加文档中不存在的细节（extrinsic）。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。源文档给出的判定按两支分开：intrinsic 分支由 NLI/entailment 判据检出（属外部判据而非隐藏态度量）；extrinsic 分支由跨样本 semantic entropy 检出（statistical / infotheoretic 族，与 15.1 同路）。geometric 族的离流形检测在两支上都无效。源文档未给出针对本条的 geometric 探针方向。
  repro: promptset-only，无模型改动，属既有 hallucination 标签族——构造带 grounding 文档的摘要／问答样本，用 NLI 判据标 intrinsic 违例、用多次采样的 semantic entropy 标 extrinsic 违例。
