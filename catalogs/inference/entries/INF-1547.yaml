id: INF-1547
legacy_ids: []
slug: vllm_ascend_async_sched_free_inflight_swa_block
aliases: []
title: async 调度提前释放仍在读的 SWA KV 块
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: recompute_scheduler
  behavior: _update_after_schedule() 在设备输出返回前就推高 num_computed_tokens，滑动窗口按乐观计数立刻把出窗整块还池；update_from_output 的提前退出路径也未结算在飞 token。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: P/D 分离 decode 侧偶发 reasoning 中途插入异常文本；17 条异常回复的首个异常 token 位置全部满足 E%32==31，与 sliding_window=128/block_size=32 的释放相位一致，GPQA 85/85/88.89（应 89+）。
  visibility: 静默错误
mitigation:
  detect: 按 token 相位统计首个异常位置（E = prompt_tokens + 已正常输出长度），检查是否集中在 num_computed_tokens=32k+31 处；关掉 async scheduling 做对照，并加单测证明出窗块在读取步被处理前不还池
  fix: 待定（issue open，正文提到一版补丁但明确说尚未证明能消除目标部署的 GPQA 回退）；方向：释放前结算在飞 token，提前退出路径补对称计数
