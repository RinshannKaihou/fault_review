original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.add/subtract/multiply` 在 **rank≥7 且操作数沿 dim -6 广播**时静默错值：`extract_nD_dims` 把 -6 及更外维度折叠成单一标量计数器，丢失内层 dim 结构后**六个 tile 中四个读过操作数缓冲区末端**；输出 shape 正确、仅值错——最小复现 6 tile 中 5 错；同 shape 降一秩正确、rank7 无广播正确、dim -7 广播被 TT_FATAL 正确拒绝，验证自己的许可规则) · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`binary_ng_program_factory.cpp` 的 `extract_nD_dims` 在 rank>5 时把 [-6, -out_rank] 全部乘成 `nD_dim` 标量——广播 dim 恰在折叠范围内时，读指针的步进结构被压平，外层循环越界读入相邻存储。op 自身 validation 显式允许 dim -6 广播（只拒 -7），实现与验证脱节。'
  source: 'tt-metal #55351（2026-09-03 open，ttsim BH、bf16 精确值对照、rank/broadcast 矩阵分离）。https://github.com/tenstorrent/tt-metal/issues/55351'
  behavior: 无 crash——高秩广播路径静默错数据（OOB 读），LLM 推理罕见但任何 >6D 张量流水（视觉/3D）命中。与 1.132（concat 绝对 dim rank 混淆）同「**维度折叠/秩语义错配**」域；OOB 读使其同时具 1.140 族外相邻存储暴露面。
  trigger_surface: Tenstorrent WH/BH + binary_ng + rank≥7 + dim -6 广播（软件 API 可触发）
  discovery: 2026-09-03 每日扫描。
