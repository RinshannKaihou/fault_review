original:
  category: cat9
  section: §3.8 输入层故障（tokenizer / 模板 / RoPE）
  meta: '`infra_off`（Transformers v5 中 `rope_scaling` 是**整体替换** `config.rope_parameters` 的属性：经 `--hf-overrides ''{"rope_scaling": ...}''` 传入 scaling dict 时，生成的 `rope_parameters` **不再含 `rope_theta`**，`get_rope` 回退 `rope_parameters.get("rope_theta", 10000)`——模型文件直传 `config.rope_parameters` 的架构（llama.py、qwen3_moe.py、gpt_oss.py 等）**静默以 base 10000 运行**，无任何警告；`set_default_rope_theta` 类（qwen2/qwen3 默认 1e6）仅当 checkpoint 恰用该值时幸免。**config.json 路径无恙**（config 转换保留 rope_theta）——分歧纯由注入通道决定。实测（vLLM 0.30.0 + transformers 5.17.0）：Llama-3.2-3B-Instruct **重述 checkpoint 自身的 rope_scaling**（应为 no-op）→ mean NLL 1.128→3.660、GSM8K 500 题 greedy 379→**279**（与显式 base=10000 完全一致、复跑 273 稳定）；输出保持流畅、答案错误、零日志。普查：HF 下载量 top300 文本生成模型中 180 适用该 override 路径，**64 个（36%）静默改变 RoPE base**——含 gpt-oss-20b/120b（150000→10000）、Qwen3-30B-A3B（1e6→1e4）、Qwen3-4B-Instruct-2507（5e6→1e6，其模型卡文档化的 YaRN 路由）、GLM-4.7-Flash、Mistral-7B-Instruct-v0.2、Qwen3-Coder-30B-A3B-Instruct-FP8（1e7→1e4）） · Cov: `var:hf_nested_rope_parameters_layer_types_misparse_pollution`（9.18 transformers v5 rope_parameters 迁移族——本条在 overrides 注入通道维度：同为 v5 rope 参数结构转换丢字段，但 9.18 是 save_pretrained 持久化污染、本条是运行时注入丢 rope_theta 且静默换 base） · 触发 `config` · 置信度 `documented`'
  mechanism: '`hf_overrides` 的 setattr 语义 × v5 `rope_scaling`→`rope_parameters` 整体替换转换的交互：dict 替换后仅含 scaling 键；`get_rope` 的 10000 默认值在架构无 per-file 默认时静默生效。报告者附 300 模型 config 级普查（vLLM 自身 ModelConfig 构建）与结果表/脚本链接。'
  source: 'vLLM #58675（2026-09-25 open，含 NLL/GSM8K 双对照、config.json vs hf_overrides 通道对照、top300 普查表与复现脚本链接；0 评论）。https://github.com/vllm-project/vllm/issues/58675'
  behavior: 无 crash——**模型静默以错误 RoPE base 服务**：长上下文外推能力损坏、输出流畅但答案系统性错误；对 YaRN 类用户（模型卡文档化路由）是"照文档操作即中招"。9.18 之后 transformers v5 RoPE 迁移族在**启动参数注入通道**的首例，且首次给出大规模模型面普查。
  trigger_surface: vLLM（0.30 系列）+ transformers v5 + `--hf-overrides` 传 `rope_scaling` + 模型文件直传 rope_parameters 的架构（config：一行 override 即触发；config.json 内同值无恙）
  discovery: 2026-09-25 每日扫描。
