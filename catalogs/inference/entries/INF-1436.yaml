title: CANN 取整/双曲族负零符号位丢失
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: 闭源舍入内核 910 路径
  behavior: round 结果幅值为 0 的负输入（-0.5/-0.4/-0.0）返回 +0.0 丢符号位；同机 910 路径 Trunc/Ceil/Floor/Round/Sinh 同款，arch35 实现显式保符号而 910 内核缺失该处理。
effect:
  objects:
  - 数值结果
  detail: NPU round(-0.5)=+0.0（CPU为-0.0），-0.0输入符号翻转；signbit逐位对照NPU与CPU多处不一致，幅值逐位正确；依赖signbit/copysign/1/x→±inf的下游与逐位golden比对被静默破坏。
  visibility: 静默错误
mitigation:
  detect: signbit(x.round()) 与 CPU 对照（≤秒级单算子探针）；对 (-0.5,0) 区间输入做逐位比对
  fix: '待定（op-plugin #591 作为追踪入口 open：两条通路均闭源 CANN 算子，op-plugin 侧无可修分支，修复点在 CANN aclnnRound/Round/aclnnRoundDecimals 内核补负零符号恢复；同机 ops-math#3446 Trunc/Ceil/Floor/Round/Sinh 五算子同款待修）'
