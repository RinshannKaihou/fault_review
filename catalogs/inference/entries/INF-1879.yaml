id: INF-1879
legacy_ids: []
slug: triton_ascend_launcher_host_args_ge_stream
aliases: []
title: Triton launcher 在 GE stream 上错传 Host 参数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: triton
    component: 非 SIMT launcher
  behavior: launcher 把 Host 侧 KernelArgs 地址直接交给 rtKernelLaunch；GE stream 上 Runtime 走 no-copy，AICore 把 Host 地址当 Device GM 访问。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: 在 GE model-owned stream 上启动即报 AICore invalid GM(507011)，plog 中 para base 是 0xaa… 的 Host 地址；改独立 stream 不报错但跨 stream 可见性无保证、结果错误。
  visibility: 报错
mitigation:
  detect: 同一 kernel 分别在普通 TorchNPU stream 与 GE model-owned stream 上启动对照；看 plog 里 AICore 的 para base 是否为 Host 地址
  fix: 待定（issue closed，未给修复 PR）；可用 aclrtLaunchKernelWithHostArgs 或显式 H2D 到 workspace 规避
