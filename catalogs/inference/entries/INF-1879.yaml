relations: []
original:
  mechanism: 'triton-lang/triton-ascend #1294（main commit 0a5378d28abf6bbcd8d8916e03d397e9ed886a55）：非 SIMT launcher 在 Host 侧连续组织 kernel 参数，再把 Host 参数地址直接传给 rtKernelLaunch（third_party/ascend/backend/driver.py:810 与 822 两处写法）。普通 TorchNPU stream 上 Runtime 会把参数 H2D 拷贝、AICore 从 Device 地址读取，kernel 正常；但 launcher 跑在外部框架（TorchAir 集成场景从 GE 执行上下文取出的 model-owned stream，经 ExternalStream 包装）上时，Runtime 进入 no-copy 路径，Host 地址直接成为 AICore 的 para base，被当作 Device GM 访问，触发 AICore scalar invalid GM（错误码 507011），plog 里 para base 为 0xaa… 形式的 Host 虚拟地址。报告的对照实验：普通 stream 成功；GE stream 报 invalid GM；改用独立 TorchNPU stream 不报错但跨 stream 输入可见性无保证、计算结果错误；把 Host KernelArgs 显式 H2D 到 workspace 后成功；改用 aclrtLaunchKernelWithHostArgs 由 Runtime 处理 Host 参数也成功。'
  source: 2026-07-30 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/1294 （closed）
  behavior: 在 TorchAir 里把一个 Triton kernel 放到 GE 给的 model-owned stream 上跑，任何 kernel（连 elementwise add 这种）都直接报 aicore execution abnormal、error code 507011，plog 里看到 para base 是 Host 地址。想绕开改用独立 stream，虽然不报错，但跨 stream 的输入可见性没人保证，算出来的结果就是错的——这条路上要么报错要么静默算错。
  trigger_surface: triton-ascend 3.6.x + TorchAir；Triton kernel 以 GE model-owned stream 下发
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
