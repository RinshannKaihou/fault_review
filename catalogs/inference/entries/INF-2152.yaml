original:
  mechanism: cann ops-nn aclnnEinsum 的 "abcd,abced->abce" equation 在 HandleABCDxABCED2ABCE 处理路径中把所有非 FLOAT/FLOAT16 输入一律 Cast 到 DT_FLOAT16 参与 BMM 计算，算完再 cast 回原 dtype——而声明面（DAV_2201_DTYPE_SUPPORT_LIST）支持 INT16/INT32/INT64/UINT16/UINT32/UINT64。结果整型输入静默降精度：整数 >2048（fp16 尾数上限）开始失精（2049→2048、4097→4096）；>65504（fp16 最大值）溢出为 +inf，回 cast INT64 时饱和成 9223372036854775807（70000 与 1000000 均如此）。两次返回码均 0/0，调用方无法感知。Atlas A2 910B2、CANN 9.2.0、ops-nn master a74516ec（2026-10-23），报告附 C++ 最小复现脚本。
  source: 2026-10-23 每日扫描 https://gitcode.com/cann/ops-nn/issues/7234（open，源码定位+C++ 复现）
  behavior: NPU 上用整型张量做这条 einsum（乘法语义）：乘数超过 2048 结果开始低位丢失，超过 65504 直接变成 9223372036854775807（INT64_MAX）——正常相乘应得 70000/1000000，实际输出一个荒谬的饱和值。接口返回成功码，无任何告警，文档声明支持这些整型。
  trigger_surface: CANN 9.2.0（Atlas A2 910B2）；aclnnEinsum equation "abcd,abced->abce"；INT16~UINT64 整型输入且数值 >2048（>65504 饱和）；ops-nn master a74516ec 定位。
  discovery: 2026-10-23 每日扫描
