original:
  mechanism: cann/ops-transformer master 48c47ea16 的 arch35 量化 matmul-reduce-scatter 实现 op_kernel/arch35/quant_bmm_reduce_scatter_fp8_hif8.h:267 把 biasGM_ 直接传入 mmv3.Init(...)，因此 bias 在 x1Scale/x2Scale 反量化之前就参与矩阵乘累加，最终等价于 (s1*s2)*(x1@x2+bias)；而 A2/A3 实现 op_kernel/matmul_reduce_scatter_aiv_mode_matmul.h:63 用 aicCalBias = !quantFlag && hasBias，量化时 bias 不进 matmul。资料 docs/aclnnMatmulReduceScatterV2.md:436 的公式是 (x1Scale*x2Scale)*(x1@x2) + bias，bias 在括号外；:411 还要求 perblock 时 bias=nullptr。报告者在 Ascend950PR / CANN 9.3.0（Ascend-cann-950-ops V100R001C13B060）/ 驱动 25.7.rc1.10 上，用 fp8_e4m3 的 x1(128×256) 全 0、x2(256×256) 全 1、s1=s2=2^-4、bias=8、两 rank、commMode=ai_cpu、HCCL_OP_EXPANSION_MODE=AI_CPU 复现：scale=1.0 时输出 16.0 与资料同解，scale=2^-4 时输出 0.0625；同一 issue 还记录 x2 以 [n,k] 连续（资料写法）传入会被 161002 拒绝、只有 strides 转置视图能跑，说明该接口的文档与实现双向不一致。
  source: 'https://gitcode.com/cann/ops-transformer/issues/8877（open，2026-11-26，含可编译 repro.cpp 与两 rank 实测输出；关联 #8342/#3581/#1897 均为同接口不同现象）'
  behavior: 在 950 上跑带 bias 的 pertensor 量化 MatmulReduceScatter（例如把该 MC2 用于带 bias 的量化 MLP），输出看起来是正常量级的数，但 bias 项已经被 x1Scale*x2Scale 缩掉：scale 取真实的 1/448 量级时，bias 对结果的贡献从 8 变成 1e-6，等于这一层根本没有 bias。两段接口都返回 0，没有任何告警，只有把输出和 (s1*s2)*(x1@x2)+bias 的解析式逐元素对比、或把 scale 改成 1 再跑一次，才会发现差异随 scale 变化。
  trigger_surface: Ascend950PR / CANN 9.3.0；aclnnMatmulReduceScatterV2 的 pertensor 量化路径（x1Scale/x2Scale 为标量）、bias 非空、fp8_e4m3 输入、HCCL 两 rank、commMode=ai_cpu；A2/A3 不走该 arch35 kernel。
  discovery: 2026-11-26 每日扫描
