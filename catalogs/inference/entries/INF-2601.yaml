id: INF-2601
legacy_ids: []
slug: matmul_reduce_scatter_v2_950_pertensor_bias_scaled
aliases: []
title: MC2 量化 matmul 把 bias 乘了 scale
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: arch35 量化 MC2 kernel
  behavior: arch35 量化 kernel 让 biasGM_ 直接进 mmv3.Init，bias 在反量化前生效、被 x1Scale*x2Scale 缩放；A2/A3 量化时反而把 bias 排除在 matmul 外。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: Ascend950PR pertensor 量化 + 带 bias 的 MC2：x1 全 0、s1=s2=2^-4、bias=8 时资料公式 16.0、实测 0.0625（差 256 倍）；真实 scale≈1/448 时 bias 被衰减到 1e-6 量级，等于静默丢弃 bias。
  visibility: 静默错误
mitigation:
  detect: 构造 x1≡0、bias 非零、s1=s2 的 pertensor 量化 MC2 用例，按 (s1*s2)*(x1@x2)+bias 与实测比对；scale=1 与 scale≠1 两组对照可区分 bias 是否被缩放。
  fix: issue 建议把 arch35 量化 kernel 的 bias 移到 dequant 之后按 fp32 累加（与 A2/A3 一致）；截至 2026-11-26 issue open，未见修复 PR（未核实）。
