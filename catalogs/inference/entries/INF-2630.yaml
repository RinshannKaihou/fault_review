pattern: PAT-INF-0218
original:
  mechanism: cann/ops-transformer 公开源码基线 40dc026e20c38f4d6d63fca05544e5d56e3ed09f 的 KvRmsNormRopeCache，在 Ascend 950、BF16 输入、FullLoad tiling key 10000 路径上先在 FP32 中平方并累加，再乘归一化宽度倒数。有限 BF16 激活也可能让平方或累加溢出：复现配置按算子 V1 输入约束给 BF16 KV、gamma 与未量化 CKV 缓存，开启可选 RMS 输出，令一个 token 的 RMS 段各分量为 BF16 可表示的 2^80、gamma 全 1、epsilon=1e-5；源码中的 FP32 平方结果 2^160 超出 float32 范围，此后除以无穷大的分母得到 0，可选的 RMS 输出和写入 CKV 缓存的值都被清零。按 README 的 RMSNorm 公式，同样输入舍入到 BF16 应为 1。普通幅值输入保持既有精度。报告用 CPU 逐步 FP32 运算与 FP64 公式交叉检查确认，链接指向 README 公式与 arch35/kv_rms_norm_rope_cache_regbase_base.h 的 FullLoad 实现。
  source: https://gitcode.com/cann/ops-transformer/issues/8951（open，2026-11-27，含 2^80 构造、tiling key 与 FP64 交叉检查）
  behavior: 在 Ascend 950 上跑 KV RMSNorm+RoPE 融合算子，当 BF16 激活幅值很大但仍有限（例如 2^80 量级）、gamma=1、eps=1e-5 时，归一化后的 RMS 输出和写进 CKV 缓存的值为 0，而正确结果应为 1；后续注意力读到的 KV 被清零，输出静默错误。接口不报错，普通幅值输入完全正常，所以只有特定权重/激活尺度下才暴露。
  trigger_surface: Ascend 950；BF16 输入；FullLoad tiling key 10000；开启可选 RMS 输出；RMS 段分量达到 2^80 等使 FP32 平方溢出的有限值；普通幅值不触发
  discovery: 2026-11-27 每日扫描
