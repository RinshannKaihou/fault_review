id: INF-2630
legacy_ids: []
slug: kv_rms_norm_rope_cache_fullload_fp32_square_overflow
aliases: []
title: KvRmsNormRopeCache FullLoad 平方溢出归零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: KvRmsNorm FullLoad
  behavior: FullLoad 路径在 FP32 中先平方再累加，有限 BF16 激活的平方和可超出 float32 范围，除以 inf 后 rstd 归零。
effect:
  objects:
  - 数值结果
  - KV状态
  detail: BF16 分量 2^80、gamma=1、eps=1e-5 时，FP32 平方 2^160 溢出，归一化结果应为 1 却得到 0；可选 RMS 输出与写入 CKV 缓存的值同时被清零。
  visibility: 静默错误
mitigation:
  detect: 用 BF16 可表示的大分量（2^80）构造 RMS 段，开可选 RMS 输出，与 FP64 公式交叉检查；普通幅值用例全通过不能证明无此问题。
  fix: 待定（issue open；建议平方/累加前做缩放或改用防溢出归约）
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-27'
remarks: 与 INF-2608（RegBase RMSNorm 系大有限值归约溢出致输出整行 0）同属 FP32 平方/累加溢出后 rstd=0 的静默归零；本条载体是 KvRmsNormRopeCache 的 FullLoad(tiling key 10000) 路径，且同时污染写入的 CKV 缓存。
