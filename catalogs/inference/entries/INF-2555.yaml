title: SparseFlashMlaMetadata 校验失败仍返回 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SMLA metadata AICPU
  behavior: AICPU Compute 对 sequsedQ 越界/负值等元素级非法输入返回 KERNEL_STATUS_PARAM_INVALID，但该状态未映射成 aclnn 错误码，两段接口仍返回 0。
  visibility: null
effect:
  objects:
  - 数值结果
  detail: sequsedQ=[2048]*4、[-1,1,1,1] 等输入两段 0/0，metadata 的 2048 个 int32 全部保留调用方哨兵；下游按未初始化 metadata 调度 sparse MLA。
  visibility: 静默错误
mitigation:
  detect: 对 metadata 预填两种互斥 canary，传非法 sequsedQ/sequsedOriKv/cmpResidualKv 后检查 canary 是否被写、返回码是否非 0；先用合法输入自证尺子。
  fix: 待定：issue 要求把 KERNEL_STATUS_PARAM_INVALID 上报为 aclnn 失败码，与第一段对非法标量返回 161002 对齐；未核实修复 PR。
