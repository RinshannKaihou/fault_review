original:
  mechanism: cann/ops-transformer 的 aclnnSparseFlashMlaMetadata（Ascend 950PR、CANN 9.3.0、master a1e54cce）在 AICPU 元素级校验失败时不上报错误。op_kernel_aicpu/sparse_flash_mla_metadata_aicpu.cpp 的 Compute 在校验失败时 return KERNEL_STATUS_PARAM_INVALID，ParamsCheck 在同文件 :127-131 显式校验 seqused_q[i] > max_seqlen_q 并 return false；但该状态没有转成 aclnn 返回码，两段接口都返回 0。实测 sequsedQ=[2048]*4（>maxSeqlenQ）、[-1,1,1,1]、sequsedOriKv=[9999]*4、sequsedCmpKv=[1,-5,1,1]、cmpResidualKv=[4,0,0,0]（>=cmpRatio）、cu_seqlens_q 首元素非 0 六类输入全部 0/0，metadata 的 2048 个 int32 保持预填 canary（0xDEADBEEF/0xC0FFEE01 双填充互斥验证）；合法输入只残留 688、写出 1360 个 int32，证明尺子有效。标量越界 maxSeqlenQ=-1 在第一段正确返回 161002，说明问题只在元素级校验结果的上报路径。
  source: https://gitcode.com/cann/ops-transformer/issues/7578
  behavior: 调用 aclnnSparseFlashMlaMetadata 时如果 sequsedQ/sequsedOriKv/sequsedCmpKv/cmpResidualKv 里含越界或负值，函数仍然返回成功：metadata 输出一个字节都没写，保持调用方缓冲区里的旧内容。上层拿到随机/残留的调度元数据继续跑 sparse MLA，attention 选错块或读错位置，输出偏离但没有错误码、没有日志；只有对 metadata 预填 canary 再检查残留才能发现。
  trigger_surface: aclnnSparseFlashMlaMetadata 两段式 C 接口；sequsedQ 等元素级参数越界/负值/cmpResidualKv>=cmpRatio；Ascend 950PR + CANN 9.3.0。
  discovery: 2026-11-14 每日扫描
