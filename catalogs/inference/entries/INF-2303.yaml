title: SGLang retract 后 rebootstrap 重建 KV 静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: sglang
    component: retract/rebootstrap 重建
  behavior: PD rebootstrap 的 payload 只带 token ids：多模态/input_embeds/位置覆盖请求重算缺原始输入，以错误 KV 继续输出无报错；已流出 token 的本地 retract 重启后拼接错乱。
effect:
  objects:
  - 输出内容
  detail: '多模态/embed 请求被重算错误 KV、输出错且无报错（应 abort）；已流式输出的请求重启后新 token 拼接进旧流。PR #47521 改为 abort 503，open 未合入。'
  visibility: 静默错误
mitigation:
  detect: 多模态/embeds 请求在 KV 压力触发 retract 后比对输出与无 retract 基线；监控 retract 后输出质量骤降。
  fix: 修复 PR https://github.com/sgl-project/sglang/pull/47521 （open，未合入）：release_req 返回可恢复性，不可恢复（multimodal/embeds rebootstrap、已流出 token 的 reprefill）改为 abort 503；另收 /detokenize 越界 id 由静默 200 改 400。
