  meta: '`infra_off`（vLLM ROCm gfx1151（Radeon 8060S）`torch.ops._rocm_C.paged_attention` 对**不支持的输入静默接受并返回错值**：(a) 提供 ALiBi 时内核输出与 **no-ALiBi** 参考匹配（error vs ALiBi=0.0758 ≈ 输出全幅 0.0786，即 **ALiBi 被完全忽略**）而非报错；(b) block size 32 从 seq_len 17 起错值（error_bs32 0.010–0.029，与 reference_scale 同量级即大幅错），**首个失败长度落在第一个 32-token block 内部**；block size 16 全长度匹配（≤0.000122 舍入级）。无 assert、无 fallback、无 warning——调用者拿到量级貌似合理的错值。v0.26.0 与 main 双验证） · Cov: `NEW`（后端能力矩阵静默吞不支持配置子签名） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: Navi（gfx1151）paged attention 内核的 ALiBi 斜率分支与 block32 分页路径未实现/未启用，但入口校验只查支持项、不拒绝不支持项——"能力探测缺失"使不支持组合沿默认路径计算错误布局/偏移。
  source: 'vLLM #57614（2026-09-18 open，bug/rocm，含 block_size×seq_len×ALiBi 误差矩阵、reference_scale 归一化对照与独立复现脚本）。https://github.com/vllm-project/vllm/issues/57614'
  behavior: 无 crash、无 NaN——ALiBi 模型在 gfx1151 上位置偏置全丢（长序列顺序感劣化）、block32 部署从 17 token 起静默错值；仅 block16+无 ALiBi 组合干净。8.52（DSV4 SM120 页大小声明失配内核静默跳过）与 8.62 族（后端可用性矩阵缺口）之后新成员：本条在 **消费级 APU 后端的支持矩阵静默缺口**维度——fail 点不是拒绝而是照算。
  trigger_surface: vLLM ROCm + gfx1151（Radeon 8060S）+ paged attention + ALiBi 或 block_size=32（hw_specific）
  discovery: 2026-09-18 每日扫描。
