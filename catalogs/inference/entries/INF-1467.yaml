original:
  mechanism: 'tt-metal issue #61402（c2026-10-19）：compute kernel config fp32_dest_acc_en=False 时 ttnn.sum 沿 W 一旦行宽超过 128 tile 即错误：结果先超过真值再停在每 tile 贡献的 256 倍（8192）不再增长。全 1 行（真值=行宽）bf16 HiFi3：128 tile（W=4096）正确；192 tile（6144）返回 8192；512/2048/8192 tile（16384/65536/262144）全部返回 8192。随机 bf16 行（fp64 参考）：W=4096 -39.36→-37.25；65536 -243.51→-980.0；262144 -888.39→-4128.0。ttnn.mean 沿 W 走同一 sum；H+W 归约先约 W 故同限。fp32_dest_acc_en=True 全部正确；早期版本（ef3e8892ac8）float32/bfloat8_b 同样封顶、int32 不受影响。'
  source: 2026-10-19 GitHub tenstorrent/tt-metal issue https://github.com/tenstorrent/tt-metal/issues/61402 （open）
  behavior: Tenstorrent 上关掉 fp32 目的累加器做宽行求和/均值时，行宽超过约 4096 个元素后结果不再随宽度增长、钉死在 8192 附近（对全 1 输入），随机输入则给出偏离数倍的错误和；开 fp32 目的累加立即正确。
  trigger_surface: ttnn.sum/mean（沿 W 或 H+W）+ fp32_dest_acc_en=False + 行宽 >128 tile；bf16/float32/bfloat8_b；Wormhole
  discovery: 2026-10-19 每日扫描
