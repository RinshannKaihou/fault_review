id: INF-2624
legacy_ids: []
slug: triton_mla_bf16_lse_dcp_combine_error
aliases: []
title: TRITON_MLA 解码 LSE 存 bf16 致 DCP 偏差
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: TritonMLA decode LSE
  behavior: forward_mqa 按 q.dtype 分配 decode LSE，stage-2 kernel 把 fp32 lse_val 存进 bf16 张量；DCP 合并按 exp(lse_r-lse) 加权时该误差直接进入权重。
effect:
  objects:
  - 数值结果
  detail: bf16 模型、decode context parallel 下 LSE 舍入误差约 0.03（bf16 间距 0.0625），每 rank 权重偏差约 3%，合并输出误差最高约 2.5%；不用 DCP 时不触发。
  visibility: 静默错误
mitigation:
  detect: DCP>1 且 bf16 模型时对比 fp32 LSE 版本与现实现的合并输出；或把 lse 张量 dtype 改为 fp32 做 A/B。
  fix: 待定（issue open；CUTLASS MLA 与 ROCm AITER 已用 fp32 LSE）
