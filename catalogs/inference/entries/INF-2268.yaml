    component: ROW_MAJOR bf16 W 归约
  behavior: bf16 ROW_MAJOR 输入沿 W 归约（fp32_dest_acc_en=True 及默认）随宽度漂移，长行输出精确一半：全 1 张量 W=262144 的 sum 得 131072、mean 得 0.5。
effect:
  objects:
  - 数值结果
  detail: 同一数据 TILE 布局或 float32 输入时误差 0.4% 内；仅 ROW_MAJOR+bf16 组合漂移，长行精确减半（系统性丢半）而非普通舍入噪声。
  visibility: 静默错误
mitigation:
  detect: 全 1 输入沿 W 归约比对期望（sum=W、mean=1）；ROW_MAJOR bf16 长行重点覆盖。
