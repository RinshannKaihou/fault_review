title: vLLM DP>1 MoE-LoRA 以本机 LoRA 态算全部 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: naive DP prepare 映射收集
  behavior: DP>1 无 EP 时 token 与 LoRA-slot 映射一起 all-gather，但 MoE-LoRA kernel 决策与 slot 表保持 rank 本地，各副本把本机 LoRA delta 施加到所有 token
effect:
  objects:
  - 输出分布
  - 输出内容
  detail: 副本 LoRA 态不同时 LoRA 请求 logits 静默错：对端空转只得半份 delta；对端持不同 adapter 则混入对方 delta；零-B adapter 完全不可见
  visibility: 静默错误
