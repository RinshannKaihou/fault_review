original:
  mechanism: cann/ops-math math/expint 在 Ascend950（arch35）上有六处缺陷叠加：Compute 调用 Exp(tmp2, xFp32, n) 求 e^x 而上界无钳位，x>88（如 90、100）时 exp(x) 超过 FLT_MAX 变 inf，污染后续 e^x/x 与乘法，输出 inf/NaN；ProcessFp16Bf16 把 FP32 结果直接 Cast 到 FP16/BF16，结果超 65504 即溢出为 inf；Compute 原用 resultBuf 作结果缓冲，在 Ascend950 上数据错误，需改用 yLocal；ApplyBoundaries 用 NEAR_ZERO_THRESHOLD=1e-10 配合 Abs(x)<=1e-10 判零并置 -inf，把 1e-9、1e-8 等合法小值误判为零点；CopyIn 的 DataCopy 只搬 currentNum 个元素，UB 对齐到 CMP_ALIGN(64) 后尾部填充区为未初始化内存，参与向量运算引入 NaN/随机值；IMPL_OP_OPTILING(Expint) 注册缺 visibility("default")。涉及文件 op_kernel/expint_kernel.h、op_host/arch35/expint_tiling_arch35.cpp。
  source: 2026-07-27 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2383 （closed，附修复 PR https://gitcode.com/cann/ops-math/pull/4165）
  behavior: 在 Ascend950 上调用 expint：输入取 90、100 这类大值时输出直接是 inf 或 NaN；FP16 输入在结果大于 65504 的区间 Cast 后变 inf；x 取 1e-9 这种合法小值却被换成 -inf；输入长度不是 64 的整数倍时，对齐尾部带来的 NaN 会污染本该正确的有效输出。全程没有任何报错或告警，只有和参考实现逐元素比对才看得出。
  trigger_surface: ops-math expint（Ascend950/arch35 单算子通路）；FP32 x>88、FP16 结果超 65504、0<|x|<=1e-8、元素数非 64 倍数
