id: INF-1556
legacy_ids: []
slug: ops_math_expint_arch35_exp_overflow_nan
aliases: []
title: expint 大输入 exp 上溢与对齐区未初始化致 inf/NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: expint arch35 kernel
  behavior: Compute 求 e^x 未做上界钳位，x>88 越过 FP32 上限变 inf 污染后续运算；FP16/BF16 结果 Cast 前未按目标 dtype 钳位；CopyIn 只搬有效元素，64 对齐尾部未初始化即参与向量运算引入 NaN
effect:
  objects:
  - 数值结果
  detail: Ascend950(arch35) 上 FP32 输入 x=90/100 输出 inf/NaN；FP16 结果超 65504 时 Cast 溢出为 inf；x=1e-9/1e-8 被 1e-10 近零阈值误判为 -inf；长度非 64 倍数的输入尾部 NaN 污染有效输出
  visibility: 数值异常
mitigation:
  detect: 对 x>88、结果超输出 dtype 上限、0<|x|<1e-8、长度非 64 倍数四类输入与 CPU golden 逐元素比对（单算子 aclnn 调用即可）
  fix: PR https://gitcode.com/cann/ops-math/pull/4165 （fix expint bug，closed）：引入 EXP_CLAMP=88.0f 钳位 x、CopyIn 以 1.0f 预填对齐区、ApplyBoundaries 改 x==0.0f 精确判等、Compute 改用 yLocal 缓冲、Cast 前按目标 dtype 上限钳位（合入与发布状态未核实）
