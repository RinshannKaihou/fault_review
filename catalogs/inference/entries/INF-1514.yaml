id: INF-1514
legacy_ids: []
slug: mssanitizer_instrumentation_changes_kernel_semantics
aliases: []
title: 插桩与桩函数改变算子执行语义致退出并漏检
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: 动态插桩/踩踏检测桩函数
  behavior: 插桩会改动被测算子：线程间踩踏检测桩函数插入 __syncthreads()，该指令受硬件约束不能在 divergence 代码中使用，且无法保证所有分支走到；动态插桩后的指令序列与原始算子不等价。
effect:
  objects:
  - 测试判定
  - 可用性/进度
  detail: 被检测算子插桩后异常退出且真实 GM 越界检不出；特定芯片动态插桩后功能正常却报 aic error（LOAD2D address overflow 等 8 类 errcode）——插桩后的执行不再等价于原算子。
  visibility: 报错
mitigation:
  detect: 同一算子分别在有/无插桩（关闭线程间踩踏检测、静态插桩对照）下执行，比对是否异常退出与 runtime 报错码；插桩后失败而裸跑正常即归为插桩副作用。
  fix: 待定（#17 方向是桩函数里不能用受 divergence 约束的同步指令；#35 未见公开修复 PR）
