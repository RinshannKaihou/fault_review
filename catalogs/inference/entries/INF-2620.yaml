id: INF-2620
legacy_ids: []
slug: fa3_causal_sliding_window_prefill_hd128_256_wrong
aliases: []
title: FA3 causal 滑窗 prefill 头维 128/256 错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: FA3 varlen SWA 核
  behavior: FA3 在长 query chunk 的 causal sliding-window prefill 中，head dim 128/256 的部分行偏离 fp32 参考；同输入 FA2 正常，窗口 1000 与 1024 结果不同。
effect:
  objects:
  - 数值结果
  detail: H100 bf16：head dim 128/256、窗口 1000 时 max abs err 0.118/0.188（FA2 0.010/0.009）；vLLM 自测 4 个 bf16 hd256 sliding_window=256 用例失败，最大 0.229/0.336。
  visibility: 静默错误
mitigation:
  detect: 同输入分别用 fa_version=3 与 2、并对照 fp32 参考，覆盖 head dim 64/128/256、窗口 300–1500、seq≥1500；hd64 与 decode 作阴性对照。
  fix: 待定（issue open；报告怀疑上游 Dao-AILab/flash-attention#1366，未核实）
