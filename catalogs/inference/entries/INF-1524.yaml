original:
  mechanism: 'Ascend/pytorch #5108（2026-09-24，closed，Atlas 800T A2/910B3，CANN 9.1.0，torch 2.7.1+torch_npu 2.7.1.post8，tf32 项在 2.7.1/2.9.0 均复现）：NPU 没有 TF32 张量核概念，但从 CUDA 迁来的代码常用 torch.set_float32_matmul_precision(''high''/''medium'') 或 torch.backends.cuda.matmul.allow_tf32=True 期望 fp32 matmul 走快速路径。实测在 512×512 fp32 matmul 上依次设 highest/high/medium，三次结果 torch.equal 全为 True（三档逐位相同），说明开关对 kernel 选择毫无影响；torch.backends.cuda.matmul.allow_tf32 在 NPU 环境下仍返回 True 但无意义。全程无 warning。报告者指出影响是用户误以为走了 TF32 快速路径，据此写出的性能/精度对比结论是错的，并与 #4666（FlexAttention 中 FP32 默认误选 TF32，反向问题）作了区分。'
  source: 2026-09-24 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/5108 （closed）
  behavior: 把 CUDA 上惯用的 torch.set_float32_matmul_precision('high') 或 allow_tf32=True 搬到 NPU 上，代码照常跑、不报错也不告警，但 fp32 matmul 一点没变快、数值也一bit没变：highest/high/medium 三档输出逐位相同。于是按「开了 TF32」写出来的性能对比和精度对比结论都是假的，排查时也看不出开关被忽略。
  trigger_surface: NPU 设备 + torch.set_float32_matmul_precision（highest/high/medium）或 torch.backends.cuda.matmul.allow_tf32；仅在 NPU 上表现为无效，CUDA 上正常
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
