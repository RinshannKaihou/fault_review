id: INF-1524
legacy_ids: []
slug: torchnpu_set_float32_matmul_precision_silent_noop
aliases: []
title: matmul_precision/TF32 开关在 NPU 静默不生效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: matmul_precision 开关
  behavior: NPU 无 TF32 张量核，set_float32_matmul_precision 与 backends.cuda.matmul.allow_tf32 被静默接受，既不改 kernel 选择也不给 warning。
effect:
  objects:
  - 性能/资源
  detail: NPU 上设置 highest/high/medium 三档 fp32 matmul 结果逐位相同（torch.equal 为 True）；torch.backends.cuda.matmul.allow_tf32 在 NPU 环境下仍返回 True 但无意义，用户据此得出的性能/精度对比结论失真。
  visibility: 性能退化
mitigation:
  detect: 同一 fp32 matmul 在三档 precision 下比较 torch.equal 与耗时；从 CUDA 迁入的代码尤其要看
  fix: 待定（issue closed，正文未给修复 PR；期望设置时给 warning 说明 NPU 无 TF32，或文档写明这些 CUDA 专有开关的行为）
