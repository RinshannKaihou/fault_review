original:
  mechanism: MindSpore 2.8.0（CPU 后端、Python 3.12）：用 int32 张量做逐元素求余时，ops.fmod 的输出 dtype 在两种执行模式下不一致。最小复现：x=Tensor([-7,-1,1,7], int32)、y=Tensor([3,2,2,3], int32)，ms.set_context(device_target='CPU')；PYNATIVE_MODE 下 fn() 返回 Int32、值为 [-1 -1 1 1]；GRAPH_MODE 下 ms.jit(fn)() 返回 Float64、值为 [-1. -1. 1. 1.]。同一份代码、同一组输入，只有执行模式不同，JIT 侧的类型推导/算子选择把整型求余提升到了浮点。issue 未给源码定位，要求两模式的类型推导与分发保持一致（PyNative 的 Int32 为期望行为）。
  source: '2026-05-26 GitCode mindspore/mindspore issue #29423 https://gitcode.com/mindspore/mindspore/issues/29423（open）'
  behavior: 同一段 fmod 代码在动态图里拿到 int32，切到 @jit 后变成 float64：打出来的数看着一样（-1 与 -1.0），靠 dtype 做分支、把结果 pack 成整型 buffer 或者拿去当索引的地方才会出错，而且很难回溯到一次 fmod 调用；只比对数值容差的回归测试完全发现不了这种差异。
  trigger_surface: GRAPH_MODE/@jit + int32 输入的 ops.fmod（PyNative 正常）
