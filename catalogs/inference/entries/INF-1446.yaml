original:
  mechanism: 'vLLM #62116（c2026-10-17）：GDN（gated delta net）模型即使设置 --mamba-ssm-cache-dtype float32（正是为防该问题的设置），prefill/chunked 路径仍可 fp16 溢出。根因（#54146 decode 修复时明示的 chunk 路径后续）：循环 SSM 状态在 chunk 路径 Triton 内核内以 fp32 累积，但若干中间缓冲与 dot 操作数在安全归一化前把 fp32 值静默降为激活 dtype（fp16/bf16）：(1) chunk_delta_h.py 每块状态缓冲 h 按 k 的激活 dtype 分配，内核两个内部 tl.dot 把 fp32 状态（b_h1..4）与修正项 b_v 降到 fp16 再累加；(2) chunk_o.py 输出缓冲 o 按 v 激活 dtype 分配，tl.dot(b_q, transpose(b_h)) 对可能 fp32 的 b_h 先降型再算未归一化读出；(3) chunk.py 的 chunk_gated_delta_rule 公共 API 无条件把返回值转回 q 的 dtype（正确 fp32 计算也会被撤销）。复现（L40S，vLLM 0.31.0 + Triton）：B,T,H,K,V=1,256,4,64,64，fp32 输入 + initial_state=fp32 randn×1e6（#54146 decode 内核自测同量级）；fp32 recurrent 参考 o_ref/final_state_ref 全有限断言通过；fp16 激活 + 同初态的 chunk 路径输出 65536/65536 全非有限、final_state 非有限——隔离到 chunk 路径自身精度处理。main 2026-10-17 三个文件未变。'
  source: '2026-10-17 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/62116 （open）；前置 #54146（decode 侧已修，chunk 后续明示）'
  behavior: '在 vLLM 上跑 GDN 模型（Qwen3-Next/3.5 类）时，即使把 SSM 状态缓存设为 float32，长 prompt 的 prefill/分块处理仍会溢出：状态在块内计算中被降到 fp16（上限 65504），状态幅值增长到 ~1e6 后输出全部变 inf/NaN、循环状态损坏，与 decode 侧已修的 #54146 同样症状但从 prefill 侧触发。后续解码继承损坏状态持续产出垃圾。'
  trigger_surface: vLLM 0.31.0/main GDN chunk/prefill 内核；fp16/bf16 激活 + 大幅值循环状态（长上下文）；--mamba-ssm-cache-dtype float32 不防护此路径
  discovery: 2026-10-18 每日扫描
