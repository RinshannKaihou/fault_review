original:
  mechanism: HCCL SingleRankProc()（src/ops/op_common/op_common.cc:3537，版本 1510b4c8ae9f7a267ba974a086f345a28d715c62）对 AllGatherV、ReduceScatterV、AlltoAllV 只根据 count 计算拷贝长度、直接使用原始地址执行 HcommLocalCopyOnThread，未应用 displacement。上游参数准备代码（all_gather_v.cc:249-261、reduce_scatter_v.cc:245-307/371-373、all_to_all_v.cc:664-690/759-761）保留了原始 buffer 地址与位移，单 rank 退化为本地拷贝时位移语义仍有效：AllGatherV 漏加 recvDispls[0]×typeSize（写错接收位置）、ReduceScatterV 漏加 sendDispls[0]×typeSize（读错片段）、AlltoAllV 源目的双双漏加。例：sendCount=2、recvCounts={2}、recvDispls={3} 应写 recvBuf 下标 3、4，实写下标 0、1；缓冲区容量足够、底层拷贝成功、无任何报错。源码级逻辑定位（issue 报告，950PR/950DT 环境，未附实机输出对照）。
  source: 2026-10-17 GitCode cann/hccl issue https://gitcode.com/cann/hccl/issues/827 （open；源码级定位+算子影响表）；训练库同机制条目 TRN-0299
  behavior: 在单卡（单 rank）进程里调用 AllGatherV/ReduceScatterV/AlltoAllV 且 displacement 非零时，数据被拷到错误的缓冲区位置：该出现在下标 3、4 的元素出现在 0、1，或读取了错误的数据片段。调用正常返回、无报错，缓冲区不越界（容量足够时），但接收缓冲内容不符合算子语义；下游计算用错位置的数据，产生难以定位的精度异常。
  trigger_surface: world_size=1 的 AllGatherV/ReduceScatterV/AlltoAllV + 非零 displacement；推理侧单卡通信退化路径
