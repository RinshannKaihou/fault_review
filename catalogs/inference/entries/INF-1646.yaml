id: INF-1646
legacy_ids: []
slug: triton_ascend_block_k256_bias_add_dropped_rows
aliases: []
title: BLOCK_K=256 特化丢弃 bias 加法前四行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: codegen BLOCK_K 特化
  behavior: 3.2.2 + CANN 8.5.0 在 bf16 输出路径上，c += bias（1D bias 隐式广播）在 BLOCK_K=256 特化里每 tile 前 4 行的加法被整体丢弃；BLOCK_K=128 正常。
effect:
  objects:
  - 数值结果
  detail: 910B3+CANN8.5.0，40行独立最小核复现：BLOCK_K=256、bf16输出、1D bias广播加法时，每tile前4行像没加bias而非随机噪声；无报错无NaN，某些token位置系统性偏低、精度指标小幅下降；BLOCK_K=128正常，易被当成autotune选参问题。
  visibility: 静默错误
mitigation:
  detect: 同一 kernel 在 BLOCK_K=128/256 两档分别跑逐元素对比；matmul+bias 类输出改 autotune 前先做固定 BLOCK_K 回归
  fix: 规避=避免 BLOCK_K=256 特化（退回 128）；issue closed，正文未给修复 PR
