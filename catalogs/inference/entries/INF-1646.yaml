  kind: github_issue
relations: []
original:
  mechanism: triton-ascend 3.2.2 + CANN 8.5.0（Ascend 910B3）的 codegen 缺陷：kernel 在 bf16 输出路径上做 c += bias（bias 为 1D tensor、隐式广播的加法），当 BLOCK_K 特化为 256 时，每个 tile 的前 4 行的加法被整体丢掉；同一 kernel 用 BLOCK_K=128 特化则零失败。报告者用 40 行独立最小 kernel 复现（只有 tl.dot + scale + to(bf16) + bias add，不含仓库任何代码），签名与元素数与真实 kernel 完全相同，因此排除了上层调用或 mask 写法的干扰。
  source: 2026-08-30 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/1863 （closed）
  behavior: 带 bias 的 matmul（linear/attention 输出投影）在 NPU 上用 BLOCK_K=256 的配置跑时，输出每个 BLOCK_M×BLOCK_N tile 的最上面 4 行少了 bias 项，看起来“像没加 bias”而不是随机噪声；模型整体表现为某些 token 位置系统性偏低、精度指标小幅下降。无报错无 NaN；把 BLOCK_K 改回 128 后完全正常，很容易被当成 autotune 选参问题。
  trigger_surface: BLOCK_K=256 特化 + bf16 输出 + 1D bias 广播加法；910B3 + CANN 8.5.0
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
