original:
  mechanism: cann/ops-nn issue 5835（2026-09-14，closed，Ascend950/arch35 全量泛化与三方交叉校验）。scatter_reduce_common_sort.h 的浮点除法走 Div 默认档 DivAlgo::INTRINSIC 硬件近似除，实测 fp32 单次约 6.37% 输入偏 1ULP，重复索引是链式相除 var/u1/u2/... 偏差逐次累积。整型除法前用 Abs 判除数是否为零，|INT32_MIN| 在 int32 不可表示，回绕后仍为 INT32_MIN（非零），判零失效并把合法除数 INT32_MIN 换成 1。MUL 浮点对跨核段拆成 partial 再合并，updates 单独连乘脱离 var 量级约束，中间积溢出 fp32 成 ±inf，而参考实现是 var 从头参与的折叠；合并顺序随分核变化使同输入多次运行可能不一致。另四个算子 README 写「不支持确定性计算」，aclnn 资料与 op_api_list.md 写默认确定性，三层自相矛盾。
  source: 2026-09-14 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5835 （closed）
  behavior: 在 950 上用 ScatterDiv/ScatterMul 做带重复索引的归约时，结果和参考实现对不上：除法的偏差会沿着链式相除一点点累积，除数是 INT32_MIN 时直接算成除以 1 而错得离谱，乘法会在跨核拆分处冲出 fp32 范围变成 ±inf。接口全成功，同一个输入重跑还可能出现不同结果。
  trigger_surface: Ascend950 arch35 的 ScatterDiv/ScatterMul/ScatterMax/ScatterMin
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
