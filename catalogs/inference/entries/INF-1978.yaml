cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: scatter_reduce 归约内核
  behavior: 整型除零守护用 Abs 判零，INT32_MIN 取绝对值溢出回绕仍非零，|INT32_MIN| 这个合法除数反被当零换成 1；MUL 浮点拆跨核 partial 后中间积不受 var 量级约束
effect:
  objects:
  - 数值结果
  detail: 除数 INT32_MIN 时结果错成 var/1；MUL 跨核 partial 的中间积冲出 fp32 变 ±inf，且合并顺序随分核变化，同输入多次运行结果可不同
  visibility: 静默错误
mitigation:
  detect: 对重复索引做链式 ScatterDiv（含 INT32_MIN 除数）与大量级 ScatterMul，逐元素对拍 fp64 参考并重复运行看抖动；单次除法 1ULP 偏差需统计口径
  fix: 浮点除法改正确舍入档、除零守护改精确等值比较、MUL 不拆跨核 partial 改行归属；issue closed 未附 MR，未核实合入版本
