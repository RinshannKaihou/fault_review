  mechanism: window_size 配置错误或为 None，或者所选 backend 根本没有实现 SWA（sliding-window attention），导致长程召回平滑退化；此时有效感受野按 O(sqrt(L)) 增长，而不是应有的 L*W。
  source: 'transformers #32235；axolotl #1213；Xiao blog。'
  behavior: 长程召回平滑退化，没有断崖、没有报错。（源文档将行为效应与签名合并为一条给出：Smooth long-range recall degradation. On-manifold.）
  trigger_surface: 可复现
  signature: '**On-manifold**——受限的注意力仍产生自洽的隐状态，模型能吸收这个约束。因此 geometric / spectral / statistical 族都难以发现：没有离群值、没有范数异常、逐层轨迹形状正常。可能的观测轴是 trajectory 族在长上下文下的 attention 有效距离衰减，以及针对远距离依赖的对比式行为探针；单纯的隐状态检测器预期漏检。注：目录中另有一条独立命名的近邻故障 `swa_sliding_cache_premature_roll`。'
  repro: 用 hook 把 attention 掩到一个固定窗口内（等价于强制一个错误的 window_size）。
