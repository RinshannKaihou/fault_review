original:
  mechanism: 'Ascend/pytorch #4526（2026-09-02，closed）：v2.7.1/v2.8.0 的 patch（torch_npu/utils/tensor_methods.py:88 安装 torch.Tensor.__reduce_ex__=_reduce_ex，torch_npu/utils/storage.py:53 实现 _rebuild_npu_tensor）把 NPU tensor 的 reduce 目标改为 _rebuild_npu_tensor，该函数在 rebuild 阶段 set_ 后执行 .npu()（copy）。upstream legacy _legacy_load 是三阶段：persistent_load 建未初始化 storage → unpickler 调 rebuild → 之后才 _set_from_file 填充；因此 .npu() 拷贝的是尚未填充的全零 staging，新分配 NPU storage（ptr 187…→207…）与 staging 脱节，_set_from_file 只填 staging。zipfile 路径在 rebuild 前已 get_storage_from_record 填充，故正常；v2.9.0+ 删除该 patch，改走 upstream _rebuild_tensor_v2 的 set_（共享 storage），不再复现。修复 commit 2a6526530a 用 LEGACY_DEFER_FILL + PENDING_LEGACY_FILL 延迟到填充后 in-place copy_。'
  source: 2026-09-02 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/4526 （closed）
  behavior: 用 legacy 格式（_use_new_zipfile_serialization=False）保存 NPU 张量再 torch.load，得到的张量形状、dtype、device 都对，但数据全是 0：保存前是 [-2.1188, 0.0635, -1.4555, …]，读回是 [0., 0., 0., 0., 0.]。没有任何报错，只有和上游 CPU 参考或原始数据对比才会发现，CPU 张量与 zipfile 格式都不受影响。
  trigger_surface: torch_npu 2.7.1/v2.8.0 + torch.serialization.save(_use_new_zipfile_serialization=False) 保存 NPU 张量 + torch.load；map_location 各档均触发，zipfile 路径不触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
