relations: []
original:
  mechanism: cann/ops-math（源码 commit 9aad7870053b4259744f765ed0ac39bc885b4b8c）的 Round AICPU kernel 在 DOUBLE 输入上用相对误差 1e-14 判断小数部分是否等于 0.5：math/round/op_kernel_aicpu/round_aicpu.cpp 的 IsValueEqualForDouble 把 fraction 与 0.5 的差值放宽到约 5e-15，远大于相邻 FP64 可表示值的间隔，于是合法且紧邻半整数的值被当成精确 ties 进入 ties-to-even 分支，舍到错误一侧。Round 的 README 与 aclnnRound 头文件均声明支持 DOUBLE、等距取偶，AICPU OpDef 也注册了 DT_DOUBLE，因此这些输入完全在契约内。用 std::nextafter 构造半整数两侧值做 AICPU Host UT，baseline 在 1.4999999999999998、-0.50000000000000011、-2.5000000000000004 三个值上给出错误结果，10 个用例中 9 个通过、边界用例稳定失败；修复让 FP64 走精确相等后 10/10 通过。验证用 bash build.sh -u --opkernel_aicpu --ops=round -j2 与 cmake --build build --target math_aicpu_op_kernel_ut，未跑 device 执行与整包构建。
  source: 2026-09-28 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3349 （open，关联 PR https://gitcode.com/cann/ops-math/merge_requests/6034）
  behavior: 对 FP64 张量调用 round(decimals=0)，绝大多数值都对，但恰好落在半整数旁边的可表示值会被多舍一位：1.4999999999999998 得到 2、-0.50000000000000011 得到 0、-2.5000000000000004 得到 -2，都偏了一个整数。没有报错，只有在边界值上逐位比对才看得出。
  trigger_surface: ops-math math/round AICPU kernel；DT_DOUBLE 输入、decimals=0、值紧邻半整数（nextafter 级差）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
