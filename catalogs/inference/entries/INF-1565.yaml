id: INF-1565
legacy_ids: []
slug: ops_math_round_aicpu_fp64_relative_epsilon_ties
aliases: []
title: Round AICPU 相对误差判 ties 误舍 FP64 近半整数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: round_aicpu.cpp 判等
  behavior: IsValueEqualForDouble 把 fraction 与 0.5 的判等放宽到约 5e-15 相对误差，远大于相邻 FP64 间隔；紧邻半整数的合法 DOUBLE 值被当成精确 ties，按 ties-to-even 舍错一侧
effect:
  objects:
  - 数值结果
  detail: decimals=0 时 1.4999999999999998 返回 2（应 1）、-0.50000000000000011 返回 0（应 -1）、-2.5000000000000004 返回 -2（应 -3）；10 个回归用例 9 个通过，边界用例稳定失败
  visibility: 静默错误
mitigation:
  detect: 用 std::nextafter 构造 ±半整数两侧的 FP64 输入做边界回归，与 ties-to-even 参考逐值比对；判等阈值必须在 1 ulp 以内或改为精确相等
  fix: PR https://gitcode.com/cann/ops-math/merge_requests/6034 （open）：FP64 比较改精确相等，保留 NaN/Inf 分支与其他 dtype 既有逻辑，新增正负半整数两侧回归；改动限于 math/round/op_kernel_aicpu/round_aicpu.cpp 与 AICPU UT
