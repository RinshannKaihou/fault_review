  behavior: 资料声明 A2 支持，但按资料自带示例的合法参数（BSND 默认参数）在 A2 上 host 放行后 kernel 内 aivec UB 读写越界，同步返回 507035；16 种参数组合凡 host 放行 100% 复现，无可用参数组合。
