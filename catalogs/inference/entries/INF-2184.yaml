original:
  mechanism: 'ops-transformer #6642（c2026-10-24）：aclnnRecurrentKda 按资料（docs/aclnnRecurrentKda.md 第 14 行声明「Atlas A2系列：支持」）自带示例的合法参数（layout=BSND、B=1,T=1,Hk=2,Hv=2,K=V=128、stateVFirst=true 等 8 个布尔开关默认）在 Atlas A2 910B2 上首段 GetWorkspaceSize 返回 0、次段同步 507035，plog：aivec error core id 38/39（blk:0/blk:1），errorStr「The address for the VEC instruction to read/write UB is out of bounds」。对照 layout=TND（同为声明支持）被 161002 正常拒绝。排除构造问题：8 个布尔开关逐个反转、T=1/2/4/8/16、B=2、Hk=Hv=1、K=V=64 共 16 组合，凡 host 放行 100% 复现 507035。环境 CANN 9.2.0、npu-smi 26.1.1、仓库 master 0f6fad56，重跑 3 次稳定。附带资料缺陷：示例用 aclBfloat16/aclBfloat16ToFloat（ACL 无此类型/函数）照抄编译失败。'
  source: 2026-10-25 每日扫描；issue https://gitcode.com/cann/ops-transformer/issues/6642
  behavior: 使用者视角：在 A2 上照官方文档示例调用该 KDA 递归算子，程序必然崩溃（同步报 507035 设备错误），不是偶发——换任何参数组合只要通过入参检查就崩，唯一不崩的方式是换 layout 参数（但那样被 161002 拒绝，等于功能不可用）。文档声明支持 A2 与实际不符；报错发生在 kernel 内部 UB 越界而非参数错误，调用方无从规避。附带问题：文档示例代码本身无法编译（引用不存在的 ACL 类型）。
  trigger_surface: Atlas A2 910B2 + CANN 9.2.0（ops-transformer master 0f6fad56）；aclnnRecurrentKda layout=BSND 任意 host 放行参数组合。
  signature: 0/507035 + plog aivec UB 越界 core38/39；16 组合 100% 复现。
  discovery: 2026-10-25 每日扫描
