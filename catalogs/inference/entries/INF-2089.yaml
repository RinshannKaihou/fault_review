id: INF-2089
legacy_ids: []
slug: msprobe_sglang_pd_instrumentation_blocks_server_info
aliases: []
title: msprobe 插桩后 sglang PD 的 server_info 接口卡住
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: sglang
    component: msprobe sglang 插桩
  behavior: MSPROBE_ENABLED=true、task=statistics、level=L0 插桩后 prefill 节点能启动，但 /server_info 请求拿到连接后一直不返回；去掉插桩同一配置正常，报告未定位到具体阻塞点
effect:
  objects:
  - 可用性/进度
  detail: /server_info 连上后 3 s 内 0 字节返回直至 curl 超时，而同进程 /health 仍返回 200；不插桩时接口正常
  visibility: 挂起
mitigation:
  detect: 插桩前后各打一次 /health 与 /server_info 并计时：/health 200 而 /server_info 超时即命中，说明不是端口或进程未起
  fix: issue 未附修复 PR（closed，修复状态未核实）
