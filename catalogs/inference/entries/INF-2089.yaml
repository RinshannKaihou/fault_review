- url: https://gitcode.com/Ascend/msprobe/issues/269
  kind: gitcode_issue
relations: []
original:
  mechanism: 环境 B200 + sglang + Python 3.12 + mindstudio 26.0.0a2。prefill 节点用 def __init__ 方式拉起：MSPROBE_ENABLED=true、MSPROBE_CONFIG_PATH 指向配置（task=statistics、step=["0-3"]、level=L0、async_dump=false、data_mode=all），并设 SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=false，--disaggregation-mode prefill、mooncake 传输。p 节点启动成功后 curl /server_info 在 3 s 内 0 字节返回、连接超时；同进程 /health 返回 200，说明进程与端口都正常。去掉 msprobe 插桩后同一配置 /server_info 正常，报告者据此判断是插桩把该接口阻塞（处理时间过长或卡住），具体阻塞点未定位。
  source: '2026-04-28 GitCode Ascend/msprobe issue #269 https://gitcode.com/Ascend/msprobe/issues/269 （closed）'
  behavior: 挂上 dump 工具后，服务日志显示启动完成、健康检查也过，但 PD 调度用的 /server_info 一直拉不到内容，客户端等三秒就超时；看起来像服务没起来，其实是被插桩卡住了，去掉工具立刻恢复。
  trigger_surface: sglang PD 分离场景 + msprobe statistics/L0 插桩（非 dump 全量）
  discovery: 2026-10-21 历史索引回填（tail 池顺序深读）
