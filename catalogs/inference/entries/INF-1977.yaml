id: INF-1977
legacy_ids: []
slug: matmul_weight_nz_out_dtype_not_checked
aliases: []
title: MatmulWeightNz 不校验 out 与推导 dtype 一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnMatmulWeightNz
  behavior: WeightNz 校验链未校验 out 与推导 dtype 一致；对 out 仅做白名单，CheckWeightNzShapeValid 不含 out，ViewCopy 前无 Cast
effect:
  objects:
  - 数值结果
  detail: self/mat2=FP16、out=BF16 这类组合全部通过校验，matmulOut 为 FP16 被无 Cast 拷进 BF16 out，输出 dtype 语义不受算子保证
  visibility: 静默错误
mitigation:
  detect: 用 FP16×FP16 输入配 BF16 out 调 aclnnMatmulWeightNz，断言返回参数错误；对照同族 batchmatmul 的 WeightNz 校验会拒绝该组合
  fix: 在 CheckWeightNzDtypeValid 补 out == 推导 dtype（FP32 out 的 16 进 32 出范式除外）；issue closed 未附 MR，未核实
