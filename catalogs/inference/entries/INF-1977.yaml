original:
  mechanism: cann/ops-nn issue 6001（2026-09-18，closed）。matmul/mat_mul_v3/op_host/op_api/aclnn_matmul.cpp 的 WeightNz 校验链：L103-105 只做 OP_CHECK_DTYPE_NOT_SUPPORT 白名单；CheckWeightNzShapeValid(L291) 签名只有 (self, mat2)，out 不参与；archRule->CheckInput 落到 matmul_util.cpp L2467-2479 的 CheckInputTensorDtypeValid，对 out 仍只是白名单。收尾 L858-860 为 Reshape 后 l0op::ViewCopy(matmulOut, out)，前置无 Cast。以 self/mat2 FP16、out BF16、cubeMathType=ALLOW_FP32_DOWN_PRECISION 推演：UpdateOutputDtype（matmul_util.cpp L2630-2638）只在 outOriDtype==FP32 时保留 out 类型，故 matmulOut 为 FP16，ViewCopy 变成 FP16→BF16 跨 dtype 拷贝。资料 aclnnMatmulWeightNz.md L111 明确要求 out 与推导 dtype 一致；同族 batchmatmul 的 WeightNz 校验有该检查。
  source: 2026-09-18 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6001 （closed）
  behavior: 给 MatmulWeightNz 传一个 dtype 和输入推导结果对不上的 out（比如 fp16 输入配 bf16 输出）时，接口照常成功，中间结果按推导 dtype 算完再被跨 dtype 直接拷进 out，输出既不是正常 bf16 也不是 fp16 的结果；矩阵乘形状、量级都正常，只有和参考实现对拍才看得出。
  trigger_surface: aclnnMatmulWeightNz，out 非 FP32 且与 self/mat2 推导 dtype 不同
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
