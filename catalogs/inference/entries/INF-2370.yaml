cause:
  objects:
  - subsystem: 算子/内核
    stack: CANN
    component: max_pool2d_with_mask m200
  behavior: 310P 路径清零 indices 尾部用 3 参 DataCopy 按元素计数下发，非 32B 整数倍时硬件按 32B 块向下取整，尾部最多 7 个 int32 未写
effect:
  objects:
  - 数值结果
  detail: 输出 indices 尾部最多 7 个 int32 保留未初始化/脏数据，算子仍返回成功、索引看似有数但不可信，下游据此回溯位置时静默取错；官方样例 [1,1,7,7]→5x5=25（100B%32=4）即触发，元素数为 8 的倍数时不触发
  visibility: 静默错误
mitigation:
  detect: 同族 910B 路径与 m200_transpose 对照实现（AlignUp+SetValue 补齐首尾）验证正确行为；报告者已在 NPU 跑正确实现对照实验
  fix: 待定（正文定位 5 处 M200 实现文件，同算子 910B 路径有正确写法可循，未见修复 MR）
