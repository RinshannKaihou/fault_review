original:
  mechanism: CANN ops-nn MaxPool2dWithMask 310P(M200) 路径（5 个 m200 实现文件：max_pool2d_with_mask_m200.h:206-209、_encoded.h:240-243、_spatial.h:188-192、_spatial_half_input.h:106-109、_spatial_separable.h:135-138）在清零输出 indices 尾部时用 3 参 DataCopy(dst, src, bytes/sizeof(int32_t)) 直接传元素计数。AscendC DataCopy 硬件访问粒度 32B 块，非对齐 count 在 NPU 模式被 DataCopyCheck 静默向下取整，尾部 <32B（最多 7 个 int32）不被清零。代码只按 8192 字节分片，未对最后一块做 DataCopyPad 或 SetValue 补齐；同算子 910B 路径（max_pool2d_with_mask.h:790-819）显式用 AlignUp 计算并用 SetValue 处理首尾非对齐字节，m200_transpose.h:767 先 Align(...,32) 再分片——均为正确对照，说明其余 5 处是实现遗漏。报告者在 910B/910_93/950 上跑同族正确实现对照验证场景合法（M200 路径无对应硬件无法直接执行）。
  source: https://gitcode.com/cann/ops-nn/issues/7917
  behavior: 在 310P(M200) 上跑 MaxPool2dWithMask 且输出元素数不是 8 的倍数时（官方自带样例 2D 池化 input [1,1,7,7] fp32、kernel 3x3、stride 1 → 输出 5x5=25，100 字节 %32=4 即触发），输出的 indices 尾部最多 7 个 int32 保留未初始化/脏数据。算子正常返回成功，索引值看似有数但不可信；下游用这些索引取回溯位置时静默取错。
  trigger_surface: CANN ops-nn MaxPool2dWithMask 310P(M200) 专用路径；validIndexBytes 或尾块非 32B 整数倍（输出元素数非 8 倍数）；样例 [1,1,7,7]→25 元素即合法触发；8 倍数输出不触发
  discovery: 2026-11-02 每日扫描
