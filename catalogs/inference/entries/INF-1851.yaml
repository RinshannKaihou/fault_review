original:
  mechanism: medgemma-27b-it（gemma3 系列）在 8 卡 910B、TP=4、--no-enable-prefix-caching、--generation_config vllm、compilation-config 指定 cudagraph_capture_sizes=[1..15] 的部署上，一条包含长检查记录的选择题请求会稳定出错：ACL 图模式下 gemma3 系列模型 100% 回复异常，要么无限输出、要么胡言乱语；--enforce-eager 模式下推理速度极慢不符合实际使用，而且精度也会出现同样问题。该请求的正常应答只应是 A/B/C/D 这类选项字母，十个字以内，所以输出异常非常明显。报告给出完整的启动命令与 curl 请求体，但没有定位到具体算子，也没有给修复 PR；issue 自 2025-09 起保持 open。
  source: 2025-09-28 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/3237 （open）
  behavior: 跑 gemma3/medgemma 这类模型、输入是带长文本的选择题时，模型会一直输出停不下来，或者答非所问；开图模式必现，关图模式（enforce-eager）虽然变慢但也修不好精度。短输入不受影响，所以日常冒烟测不出来。
  trigger_surface: gemma3 / medgemma-27b-it + 长序列（数千 token 的检查记录）+ ACL graph（cudagraph_capture_sizes 1–15）
