id: INF-1915
legacy_ids: []
slug: vllm_glm53_thinking_false_tag_leak_into_tool_args
aliases: []
title: GLM-5.3 thinking=false 致 </think> 漏进工具参数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 分词/模板
    stack: vllm
    component: GLM-5.3 模板与 glm47 parser
  behavior: 模板在 add_generation_prompt 处无条件写 <think>，enable_thinking=false 从未被消费；parser 在 thinking=False 时删掉 THINK_* 终止符，残留标记按普通文本流过
effect:
  objects:
  - 输出内容
  detail: 请求 enable_thinking=false 仍返回 200，content 与 tool_calls.function.arguments 里出现重复 </think></think>；官方 API 对同等请求直接拒绝，调用方无从分辨
  visibility: 静默错误
mitigation:
  detect: 对 GLM-5.3 发 enable_thinking=false 请求，检查原始 SSE 与拼接后的 content/reasoning/tool arguments 是否含 </think>；或断言该请求形状应被拒绝
  fix: issue closed；方向：兼容层把 enable_thinking=false 归一化成 true 并告警，或按官方契约明确拒绝；parser 侧禁止协议标记进入 content 与工具参数
