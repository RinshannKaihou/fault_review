original:
  mechanism: 两层边界同时失守。其一在 chat template：GLM-5.3 官方模板在 add_generation_prompt 处无条件输出 <|assistant|><think>，不判断 enable_thinking 的取值（GLM-5.2 模板还有 {{- '<think></think>' if (enable_thinking is defined and not enable_thinking) else '<think>' -}} 这个分支，GLM-5.3 没有），所以 thinking=false 的语义在 token 化之前就丢了。其二在 parser：vllm/parser/glm47_moe.py 的 glm47_moe_config() 在 thinking=False 时把 THINK_* 终止符从终止符集合里删掉，一旦标记真的出现在流里就无法识别和消费，只能当普通文本透传，甚至被拼进 tool_calls.function.arguments。报告用原始 SSE 逐帧确认了 </think> 出现在服务端输出里，并做了 100 次重放：恢复官方模板、只发 enable_thinking=true 时 100/100 干净，说明不是传输或客户端拼接问题。问题源头在模型模板与上游 parser，报在 vllm-ascend 是因为该栈上可复现。
  source: 2026-09-15 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16592 （closed）
  behavior: 调用方按常规关闭思考（enable_thinking=false），拿到 HTTP 200 的正常响应，但回复里混着重复的 </think></think>；更糟的是这段标记会出现在工具调用的 arguments 字符串里，下游按 JSON 解析时直接报错或把标记当参数内容。没有 4xx、没有告警、没有任何字段能区分"成功"和"被污染"，只能靠人工读输出发现。官方 API 对 thinking.type=disabled 是明确拒绝的，本栈却静默返回坏内容。
  trigger_surface: GLM-5.3/GLM-5.3-Flash + 请求里 enable_thinking=false（官方不支持的请求形状）+ glm47 reasoning parser
  discovery: 2026-10-21 历史索引回填（NPU pool2_v2c，issue created < 2026-10-07）
