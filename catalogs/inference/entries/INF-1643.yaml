slug: triton_ascend_a5_2d_reduction_lane_drop_k_pow2_lt8
aliases: []
title: A5 二维 tile 归约在 K_POW2<8 时丢车道
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 2-D tile 归约 lowering
  behavior: A5 上从 [TPT,K_POW2] 二维载入的张量做 tl.sum/tl.atomic_add 归约，内层 constexpr 宽度 2 或 4（<8）时只有部分车道参与；reshape 一维不修，arange 补到 8 即恢复。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: MoE 路由直方图 T=512、K=2、E=8 统计出 256 而非 1024，compute_routing_metadata 与后续 gather/scatter 跟着错，约 75% 专家前向失配；同索引走一维 flatten+atomic_add 计数正确。
  visibility: 静默错误
mitigation:
  detect: 对二维 tile 归约与一维 flatten 版本交叉对账；把内层 arange 宽度补齐后计数变化即为信号
  fix: 规避：内层 arange 宽度补到 8 并保留 k<K 的 mask；无修复 PR（open）
labels:
  family: infra_off
  trigger: hw_specific
  trigger_review: false
  trigger_note: 仅 Ascend A5（Ascend950PR_9579，bishengir-compile-a5 路径）+ 内层 constexpr 宽度 <8 的二维归约；同逻辑在 A3 计数正确
  stage: N/A
