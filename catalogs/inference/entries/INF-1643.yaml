remarks: 'INF-1376 只是在机制描述里把 #2247 当对照引用（它自身是 3-D 首轴归约 stride 交换），本条是 A5 上二维 tile 内层宽度 <8 的丢车道，机制与平台都不同，故按重复来源放行单独成条。'
evidence:
- url: https://github.com/triton-lang/triton-ascend/issues/2247
  kind: github_issue
relations: []
original:
  mechanism: triton-ascend 3.2.2（Triton 3.2.0、torch_npu 2.9.0.post4、openEuler 24.03、Python 3.11）在 Ascend950PR_9579 上走默认 A5 流水线 bishengir-compile-a5 --target=Ascend950PR_9579：当二维块的范围是 [TOKENS_PER_TILE, K_POW2] 且内层 constexpr 宽度 K_POW2 为 2 或 4（即 <8）时，对该块导出的 tl.sum 与 tl.atomic_add 归约只让一部分车道参与。三条反证把范围锁死在归约 lowering：同索引的一维 flatten + atomic_add 总量正确；二维 tl.load/store 转储与主机内存逐位一致（载入没错）；把内层 tl.arange 宽度补到 8 同时保留 k<K 掩码后计数恢复。tl.reshape 到一维不能修复。生产 MoE 用例 T=512、K=2、E=8、TOKENS_PER_TILE=512、K_POW2=2 统计出 256（应为 1024）；K_POW2>=8 的 pytest 形状（T=256、E=32、K=8）在 A5 上正确，A3 上 K=2 也正确，故为 A5 特有。
  source: 2026-09-17 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/2247 （open）
  behavior: Mixtral 式 MoE 模型在 A5 上跑 top-2 路由时，专家直方图只有应有总数的四分之一：每个 tile 的计数少算，compute_routing_metadata 交给 gather/scatter 的偏移因此错位，约四分之三的专家前向结果不对。整个过程没有编译错误、没有 NaN，shape 和 dtype 都合法，只有把直方图总数与 T×K 对账才会发现少了。
  trigger_surface: Ascend A5 + 二维 [TPT,K_POW2] 块载入后的 tl.sum/tl.atomic_add，K_POW2∈{2,4}；A3 不复现
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
