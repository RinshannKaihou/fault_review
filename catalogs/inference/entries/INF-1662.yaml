id: INF-1662
legacy_ids: []
slug: ms_aclnn_cache_vector_content_hash_miss
aliases: []
title: aclnn 缓存哈希漏 vector 元素值致 loss 暴涨
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: op_api_cache 复合类型哈希
  behavior: op_api_cache 对 pair<vector<int64_t>,bool> 没有专门哈希重载，落入 MemcpyToBuf 只哈希 vector 的指针/size/capacity，actual_seq 的数值不进 key。
effect:
  objects:
  - 数值结果
  - 训练信号
  - 梯度
  detail: TND 训练 step380 后 indexer_loss/梯度偶发暴涨并随训练增长；关 aclnn 缓存（aclnn_cache_queue_length=0）异常完全消失，离线单算子复算正确。
  visibility: 静默错误
mitigation:
  detect: 构造两份元素值不同但对象表示相同的 pair<vector<int64_t>,bool> 比较 AclnnHash；或按 actual_seq 做 A→B→A 回归，看输出是否回到基线
  fix: 待定（issue open，无修复 PR）；规避：aclnn_cache_queue_length=0 关闭 aclnn 缓存后异常消失
