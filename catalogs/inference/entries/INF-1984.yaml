id: INF-1984
legacy_ids: []
slug: expint_clamp_dead_branch_saturate
aliases: []
title: expint 钳位后比较 +inf 成死分支，大值恒返 Ei(88)
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: expint kernel
  behavior: 边界判定拿钳位后的 xFp32 与 +inf 比较，clamp(88) 后永假；EXP_CLAMP=88 硬截断使 x∈(88,93.2] 恒输出 Ei(88)
effect:
  objects:
  - 数值结果
  detail: x=+inf 走不进 +inf 分支；x=89 返回约 1.9e36 而真值 5.1e36（误差约 63%），接口不报错；proto 另声明 DT_DOUBLE 但无 double 内核
  visibility: 静默错误
mitigation:
  detect: 用 x∈(88,93.2] 与 x=+inf 的 fp32 输入与 scipy fp64 的 Ei 对拍，看是否饱和到同一常数
  fix: 用钳位前的原值判 +inf；x∈(88,93.2] 按 exp(x-88) 缩放重算、x>93.2 按 IEEE 给 +inf；PR https://gitcode.com/cann/ops-math/pull/5679 ，合入与发布未核实
