  kind: gitcode_issue
relations: []
original:
  mechanism: cann/ops-math issue 3241（2026-09-18，closed，ascendc-code-review P1 编码红线）。math/expint/op_kernel/expint_kernel.h 先用 EXP_CLAMP=88 把输入钳位，随后边界判定却拿钳位后的 xFp32 与 +inf 比较，比较永假，x=+inf 分支成为死代码；同时 88 的硬截断让 x∈(88,93.2] 的有限输入一律输出 Ei(88)≈1.9e36，x=89 真值 5.1e36，相对误差约 63%。同批还给出 arch35 expint_tiling_key.h 的非标准 DTYPE_X 模板实例化、expint_apt.cpp 的 _apt 命名，以及 op_graph/expint_proto.h 声明 DT_DOUBLE 但 kernel 无 double 实现。复现方式为对 x∈(88,93.2] 的 fp32 输入与 scipy fp64 的 Ei 比对。
  source: 2026-09-18 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3241 （closed）
  behavior: expint 喂进接近溢出边界的值时不报错而是回声式饱和：89 这种仍应算得出有限真值的输入，返回的却是 Ei(88) 那个常数，误差六成以上；+inf 输入也进不了专门处理它的分支。数值上表现为大输入段整段被压平，下游 loss/比例计算随之偏移，日志里没有任何提示。
  trigger_surface: math/expint，输入 >88 或 +inf
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
