original:
  mechanism: 'Ascend/op-plugin issue #84（2026-05-14 closed；A3、CANN 9.0.0、torch 2.10.0、torch_npu 26.0.0、arm64）：在 allow_internal_format=True 下把 (12,7168,6144) 的 int8 weight 先按 N 维两两打包成 quint4x2（weight_res 形状 (12,7168,3072)），再 npu_format_cast 成 NZ（format 29），配 weightScale、xScale 与 groupList=[64,128] 调 torch_npu.npu_grouped_matmul_swiglu_quant_v2，返回的两个输出 shape 推导不正确。issue 正文以截图给出期望与实际形状，并附最小复现脚本，但没有给修复 PR，也没有定位到 op-plugin 侧还是 aclnn 侧的 shape 推导函数。'
  source: 2026-05-14 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/84 （closed）
  behavior: 按上面的写法调用 npu_grouped_matmul_swiglu_quant_v2 时，返回的输出张量形状与按 groupList 和 4bit 打包后的 N 手算出来的不一致，用截图对比期望与实际形状即可看到差异。形状一旦错，后续 reshape 或下游算子会按错的维度继续算，而调用本身不报错；ND 格式的同一调用没有这个问题。
  trigger_surface: npu_grouped_matmul_swiglu_quant_v2 在 weight 为 NZ 内部格式 + A8W4 权重打包时
