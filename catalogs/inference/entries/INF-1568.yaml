slug: ops_math_angle_v2_complex64_signed_zero_branch_cut
aliases: []
title: AngleV2 complex64 丢负零符号致分支切割错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: angle_v2_complex.h 角落分支
  behavior: complex 角落处理用与零的浮点比较来选 ±π 与符号，IEEE-754 比较把 +0 与 -0 视为相等，负零符号位丢失；实部为负无穷时也未恢复分支切割的 π 符号
effect:
  objects:
  - 数值结果
  detail: complex64 下 (-0,+0) 返回 +0 应为 +π、(-0,-0) 返回 +0 应为 -π、(+0,-0) 返回 +0 应为 -0、(-1,-0) 返回 +π 应为 -π；有限象限与 NaN 对照均与 torch.angle 一致
  visibility: 静默错误
mitigation:
  detect: 对含 ±0 分量的 complex64 值逐位比对 torch.angle（看 -0 符号位与 ±π 的位模式），并覆盖负无穷实部的分支切割用例
  fix: PR https://gitcode.com/cann/ops-math/merge_requests/6005 （open）：仅对零值分量读取符号位，非零仍走原比较；恢复负无穷实部的 ±π 分支切割；改动限于 math/angle_v2/op_kernel/angle_v2_complex.h
