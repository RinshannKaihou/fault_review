original:
  mechanism: cann/ops-math（源码 commit 9aad7870053b4259744f765ed0ac39bc885b4b8c）math/angle_v2/op_kernel/angle_v2_complex.h 的 complex 角落处理用与零的浮点比较来选择 ±π 和结果符号；IEEE-754 比较把 +0 与 -0 判为相等，负零的符号信息因此丢失，零值分量无法再区分从哪一侧趋近分支切割。文档 math/angle_v2/docs/aclnnAngleV2.md 把 COMPLEX64 列为支持输入，golden 用 torch.angle。在 Atlas 910B4 / CANN 9.2.0-beta.2 上对 24 个 complex64 值做探针：(-0,+0) 期望 0x40490fdb(+π) 实得 0x00000000、( -0,-0) 期望 0xc0490fdb(-π) 实得 +0、(+0,-0) 期望 0x80000000(-0) 实得 +0、(-1,-0) 与 (-inf,-0) 期望 -π 实得 +π；普通有限象限与 NaN 对照通过。补丁只改该头文件、零值分量改读符号位并恢复负无穷实部的 ±π，修复后 24 个向量全部与 torch.angle 一致。
  source: 2026-09-28 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3320 （open，关联 PR https://gitcode.com/cann/ops-math/merge_requests/6005）
  behavior: 对含 ±0 分量的 complex64 输入算 angle，结果与 torch.angle 不一致：(-0,+0) 本应是 +π 却给 +0，(-0,-0) 本应是 -π 也给 +0，(+0,-0) 本应是 -0 却给 +0，负实轴上的 (-1,-0) 从 -π 翻成 +π。普通象限的数值完全正常，所以只有专门构造 ±0 或分支切割的用例才暴露，下游按角度符号做分支的逻辑会被静默带偏。
  trigger_surface: ops-math math/angle_v2 的 complex64 通路；输入分量含 ±0、或实部为负无穷（分支切割边界），Atlas 910B4 + CANN 9.2.0-beta.2
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
