title: op-plugin max_pool indices 形状 dtype 契约破坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: MaxPool WithIndices 输出转换层
  behavior: WithMask 分支把内核 int8 打包缓冲（含行尾 16B 对齐填充）原样返回，未折叠成 int64 视图未裁剪填充；WithIndices/3d 分配 int32 后原样返回未提升 int64；内核数值本身正确。
effect:
  objects:
  - 数值结果
  detail: 2d indices dtype=int8 且末维 ×8（int64 字节未折叠+16B 行填充）、k3s2p1 H 维多一行、1d 凭空多一维、3d dtype 变 int32；indices 无法直接用于 MaxUnpool2d，依赖 indices dtype/shape 的下游全部踩坑
  visibility: 静默错误
mitigation:
  detect: 对 return_indices=True 输出检查 dtype==int64 且 shape==values.shape（NPU 上四种异形即刻暴露）
  fix: 修复 PR https://gitcode.com/Ascend/op-plugin/merge_requests/6052 （open，转换层 view/narrow/view/view 链恢复 int64；静态核验+解码数学脚本证明，无本地 NPU 未真机验证；另注明 kH*kW<4 大输出配置由静默错值改为 fail-loud）
