original:
  mechanism: 'op-plugin MaxPool2dWithIndicesKernelNpuOpApi.cpp 的输出转换层破坏 CPU 契约（indices 为 int64、形状与 values 完全一致 (N,C,Ho,Wo)）。Atlas A3 实测四种异形：2d k2s2 → (2,3,4,64) int8（stride 768,256,64,1）；2d k3s2p1 → (2,3,9,160) int8；1d → (2,3,2,96) int8 凭空多一维；3d → dtype 变 int32。根因（1）aclnnMaxPool2dWithMask 分支：内核写出的 int8 打包缓冲（(N,C,kH*kW,(CeilDiv(Ho*Wo,16)+1)*32)）被原样返回——int64 字节未折叠成 int64 视图、行尾部 16B 对齐 guard 填充未裁剪（对照 adaptive_max_pool2d 路径返回正常）；（2）aclnnMaxPool2dWithIndices/aclnnMaxPool3dWithArgmax 分支：分配为 at::kInt 后原样返回未提升 int64（3d 注释明示内核只接受 int32）。values 全部逐位相等、indices 按位重组后与 CPU golden 一致——内核输出本身正确，问题在输出转换层。影响：indices 无法直接用于 MaxUnpool2d（主干上采样路径），依赖 indices dtype/shape 的下游代码全部踩坑。修复 PR !6052（open）：WithMask 分支 EXEC 后 view({-1})→narrow(0,0,numel*8)→view(kLong)→view(output_size)；3d indices.to(kLong)；静态核验通过但需真机验证。issue 附带提及 torch.round 对 -0.5/-0.4 输出 +0.0（另立 #591）。复现脚本 A3 真机 /mnt/workspace/a3hunt/round2/repro_maxpool_retidx.py。'
  source: 2026-10-18 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/590 （open）；修复 PR https://gitcode.com/Ascend/op-plugin/merge_requests/6052 （open）
  behavior: 在 NPU 上调用 max_pool2d/1d/3d 且 return_indices=True 时，返回的 indices 形状与 dtype 与 CPU 契约不符：2d 返回 int8 且末维放大 8 倍（如期望 (2,3,4,16) int64 实得 (2,3,4,64) int8），某些核参数下 H 维多一行；1d 凭空多出一个维度；3d dtype 变 int32。无报错，数值经重组后正确，但 MaxUnpool2d 等依赖 indices 契约的下游直接不可用或错位。adaptive_max_pool2d 正常。
  trigger_surface: op-plugin MaxPool WithIndices 输出转换层；max_pool2d/1d/3d(return_indices=True)；Atlas A3（910_9362）、torch_npu 2.7.1.post4；out 变体（max_pool*d_with_indices_out）同源问题未修
  discovery: 2026-10-18 每日扫描
  notes:
