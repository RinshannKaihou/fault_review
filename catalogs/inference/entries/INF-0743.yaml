  meta: '`infra_off`（`nvidia/Qwen3.8-2.4T-A95B-NVFP4` 官方 checkpoint 在 32×A100（TP16×PP2）nightly 栈上**无法完成启动**：tracking issue 记录两处独立缺陷——(1) 自动 linear-backend 选择 `CutlassFP8ScaledMMLinearKernel`（#55008，SM80 dispatcher 只收 INT8）；(2) 官方 NVFP4 权重在 Ampere 的高性能路径组合整体未验证） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: NVFP4 checkpoint 的 dequant 路径按层混合多种量化方法（ModelOpt），每种的 kernel 能力探测独立失败或成功——本例是 FP8 CUTLASS 分发矩阵缺口首先挡住启动；即使逐个绕过，剩余组合（NVFP4 MoE × SM80）也未声明支持。多方法量化模型在"最老支持 GPU"上的可部署性是逐 kernel 乘积。
