remarks: 与 INF-1349（6.281 PIECEWISE moe_forward 陈旧地址）共享的具体失效机制：PIECEWISE 图按捕获期固化的形状/地址假设重放，运行期真实值（地址或缓冲长度/内容）已变且无人刷新——同属 PIECEWISE 捕获契约缺口族；差异：6.281 是分配器复用导致陈旧**地址**（split 中间张量），本条是 prepare_inputs 只刷新 [:num_reqs_padded] 导致陈旧**尾部内容**（请求行映射）。
