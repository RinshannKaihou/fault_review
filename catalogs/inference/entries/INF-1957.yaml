id: INF-1957
legacy_ids: []
slug: triton_exp_minmax_drops_nan
aliases: []
title: triton_experimental 的 min/max 静默丢 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: min/max lowering（TE 后端）
  behavior: min/max 的元素级与按维归约 lowering 使用裸 tl.minimum/tl.maximum，落盘为 MLIR arith.minnumf，该语义遇 NaN 时丢弃而非传播。
effect:
  objects:
  - 数值结果
  detail: 输入含 NaN 时 min/max 输出不含 NaN，torch.equal 与 eager 参考失败；训练 loss 变成 nan 后经该后端被静默抹掉，下游看到的是正常数值。
  visibility: 静默错误
mitigation:
  detect: 构造首行全 NaN 的输入，跑 minimum/maximum 与 min(dim=0)/max(dim=0)，与 eager 做 torch.equal 并检查输出是否含 NaN
  fix: 待定（issue 已 closed，正文未给修复 PR；报告建议改用具 NaN 传播语义的 minimum/maximum lowering）
