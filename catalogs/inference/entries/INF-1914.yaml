id: INF-1914
legacy_ids: []
slug: vllm_ascend_minimax_m3_hyphen_param_xml_parse_drop
aliases: []
title: MiniMax-M3 连字符参数名致工具调用被静默丢弃
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: minimax_m3_tool_parser
  behavior: _parse_single_invoke 用 ET.fromstring 解析参数 XML，参数名以连字符开头（<-A>100</-A>）时抛 ParseError，捕获后只记日志并返回 None，工具调用被丢弃
effect:
  objects:
  - 输出内容
  detail: Grep 这类带 -A/-n 参数的调用返回 HTTP 200、finish_reason=stop、无 tool_calls，原始 XML 文本漏进 content；所有参数名含连字符的工具都触发
  visibility: 静默错误
mitigation:
  detect: 用含连字符参数名的工具（Grep 的 -A/-n）构造请求，检查响应里 tool_calls 是否存在、content 是否残留 <tool_call>/<invoke> 原文
  fix: issue 已 closed；修复方向是 ET.fromstring 前把非法 XML 标签名转义、解析完再还原原始参数名（正文给出了改法）
labels:
  family: infra_off
  trigger: config
  trigger_review: false
  trigger_note: vllm-ascend v0.20.2rc1 + MiniMax-M3-w8a8 + --tool-call-parser minimax_m3 + 工具参数名含连字符
  stage: N/A
