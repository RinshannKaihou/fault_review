id: INF-2559
legacy_ids: []
slug: triton_experimental_same_name_kernel_xblock_state_reuse
aliases: []
title: 同进程同名 kernel 不同 XBLOCK 结果错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: torch_npu
    component: triton launcher 运行期状态
  behavior: 同一进程内同一算子两次编译生成同名 kernel（仅 XBLOCK 8/16 不同），kernel hash、launcher cache_hash、autotune 配置与 run 实参全同，后一个 kernel 持续输出错误结果。
effect:
  objects:
  - 数值结果
  detail: 先编 1×1 再编 2×2 后，2×2 的 2×2 fractional_max_pool2d maxdiff=7，连调 3 次持续复现；单独编 2×2 时 maxdiff=0。
  visibility: 静默错误
mitigation:
  detect: 同一进程内按不同 shape 顺序编译同一算子，比较 kernel hash/launcher cache hash 相同但输出不同；清 PyCodeCache.modules 与关 use_fast_triton_launcher 均无效。
  fix: 待定：issue 下一步用同一 TTIR 两次 launch 判定在 torch_npu launcher 还是 triton-ascend 运行时，未核实修复 PR。
