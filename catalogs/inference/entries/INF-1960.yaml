original:
  mechanism: 'vllm-ascend issue #7101（2026-03-10，closed）：Qwen3.5 在开启 suffix_decoding 与不开两种配置下分别跑多轮会话与单轮会话，报告者附了 raw_decoding.json 与 suffix_decoding.json 两份原始记录，结论是开启时存在「大段重复」现象，不开则没有。issue 正文没有给出源码位置或版本细节，维护者先后转给三位负责人仍未给出根因与修复 PR；评论 crystalww 在 0.23.0 上复测，长输入场景下开、关 suffix_decoding 的输出依然不一致，说明这条推测链（suffix/ngram 类 draft 从上下文后缀取候选 token）在较长历史下会把重复片段当草案并让其通过验证，而 issue 最终以无反馈关闭。'
  source: 2026-03-10 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/7101 （closed）
  behavior: 同一个多轮对话，开着 suffix_decoding 时模型会整段整段地重复前面已经说过的内容，看起来像卡在循环里，要等 max_tokens 才停；把该特性关掉再跑同样的对话就恢复正常。单轮短问也可能复现，0.23.0 的长输入下依旧如此，属于不报错但输出质量明显退化的场景，对比两份 decoding 记录最直观。
  trigger_surface: suffix_decoding（suffix 推测解码）+ 多轮或长输入会话
