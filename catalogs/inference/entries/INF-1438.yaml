original:
  mechanism: 'vllm-ascend MLAPO（mla_preprocess 融合算子）对 Q 和 KV RMSNorm 硬编码 epsilon=1e-6，不使用模型配置的 rms_norm_eps。部署的 GLM-5.2 W8A8 checkpoint 指定 rms_norm_eps=1e-5：native/模型路径用 config.rms_norm_eps 构造 Q/KV 归一化层，融合 MLAPO kernel 用不同常量——配置 epsilon 非 1e-6 时两条路径归一化公式不同。报告者（issue #18859，源码级报告，固定 commit bc975f29 与 upstream main 8a8e1e05 均含该硬编码）明确区分：已确认=实现中的模型参数失配；未测量=对整模型生成精度/基准分的影响，不声称观测到端到端精度回退。修复 PR #19107（open，c2026-10-18）：把每层 SFA 的 Q/KV epsilon 经 PyTorch 算子关键字参数（q_epsilon/kv_epsilon，缺省 1e-6）、ACLNN 属性、tiling data 传入全部四个 MLAPO kernel 变体，device/Meta 适配器校验正值有限。910B3 + CANN 9.2 + torch 2.10 实测：SFA-to-MLAPO 数值回归 baseline 16 failed/8 passed → 24 passed（baseline 失败是数值失配非缺参数）；新增算子测试文件 68 passed；SFA CPU 测试 72 passed。'
  source: 2026-10-15 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/18859 （open）；修复 PR https://github.com/vllm-project/vllm-ascend/pull/19107 （open，c2026-10-18）
  behavior: 在 vllm-ascend 上跑 rms_norm_eps 不等于 1e-6 的模型（如 GLM-5.2 W8A8，配置为 1e-5）且走 SFA MLAPO 融合前处理时，Q/KV 归一化用的 epsilon 与模型定义不一致，融合路径输出系统性偏离 native 路径。服务正常、无告警；对生成质量的影响幅度未测量。修复后数值回归全部通过证明失配真实存在。
  trigger_surface: vllm-ascend SFA MLAPO 融合路径；模型 config rms_norm_eps≠1e-6；GLM-5.2 W8A8 实例；vllm-ascend 0.26~0.30 期间代码
