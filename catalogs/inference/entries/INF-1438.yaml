  behavior: MLAPO 融合算子对 Q 与 KV RMSNorm 均用固定 1e-6，不读模型各层 rms_norm_eps；配置≠1e-6（如 GLM-5.2 的 1e-5）时融合路径与 native 路径归一化公式不同。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: 配置 epsilon≠1e-6 的模型在 MLAPO 融合路径下 Q/KV 归一化结果系统性偏离 native 路径（源码级确认的模型参数失配；端到端精度影响未测量，issue 明示不声称已观测 e2e 回退）
  visibility: 静默错误
mitigation:
  detect: SFA-to-MLAPO 数值回归（baseline 16 failed/24，修复后 24/24 通过即证明失配真实）
