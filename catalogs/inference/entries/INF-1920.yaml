  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Mooncake layerwise
  behavior: P 侧传输失败不向 D 侧传播错误；done 信号只由发送最后一层 KV 的那个 TP rank 发出，别的 rank 未完成 D 就认为收完；ZMQ 故障也没有超时处理
effect:
  objects:
  - KV状态
  - 可用性/进度
  detail: D 端用不完整或缺失的 KV 继续解码，输出错误而链路看似正常；ZMQ 断链时请求在 D 侧永久挂住。两种情况都不会把异常抛给上层
  visibility: 静默错误
mitigation:
