  mechanism: 前缀缓存的重算/命中路径与完整 prefill 路径在数值上不等价。vLLM 侧：为 recomputation 类工作负载启用前缀缓存导致 GSM8K 准确率 **78.4→60.1**。SGLang 侧：改变输入的**切分点（split point）**（进而改变命中边界）就会改变相同前缀的输出——两条数学上等价的路径实际发生偏离。
  source: 'vLLM #18055（CLOSED 2025-05-13）；SGLang #7857（CLOSED 2025-07-08，"output differs when input length changes despite identical prefix"）。'
  behavior: 同一 prompt 因请求切分方式不同而得到不同输出；准确率整体下降近 18 个百分点，但单条输出看起来完全合理。
  trigger_surface: KV/前缀/FP8 相关：vLLM 配置可触发或强相关
  signature: '**near-manifold 的 argmax 翻转**，发生在 prefix/split 边界处；输出依赖切分点。族判为 ambiguous——扰动幅度在噪声底附近，只有在触发（命中边界恰好落在敏感位置）时才把某个 token 的 argmax 推翻。检测面：这是最难的一类——geometric/spectral/statistical 单点阈值几乎必然漏检，因为隐藏态始终在健康流形上；唯一可靠的手段是 **cheap 族的 recompute-oracle 轴**（同一输入走两条路径比对；前提：记录 batch 组成的 bitwise 重算或 batch-invariant kernels）与 batch/切分变体的一致性检查。属于"检测器看不见但 oracle 能看见"的边界案例。'
  repro: 单钩子以"对前缀段施加运行时噪声底量级的扰动"近似路径不等价，并以不同切分点重复以复现切分依赖性；真实的双路径数值差异需要实际的 prefix-cache 实现，钩子层面只能模拟其幅度。
  locus: arch-specific-cache
  priority: medium
