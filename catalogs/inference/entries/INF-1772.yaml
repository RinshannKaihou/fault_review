cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: CheckParams 的 from>to 校验
  behavior: 区间校验只有 from>to 一条比较：NaN 参与比较恒 false 绕过、-inf>to 为 false 放过、to=+inf 时 from>+inf 为 false 放过（from=+inf 被拒只是误打误撞），非法端点被当合法输入派
effect:
  objects:
  - 数值结果
  detail: A2（910B2，CANN 9.2.0 两段式直调）：from/to=NaN 与 from=-inf → 64/64 全 NaN 且两段返回 0；to=+inf → 64/64 全 inf；A3 复现 NaN 两条。契约：from<=to、NaN/±inf 超范围，from>to 应返 161002
  visibility: 数值异常
mitigation:
  detect: 对输出做 NaN/Inf 扫描；调用栈无 161002 而输出全 NaN 是特征
  fix: 待定（建议 !(from<=to)||!isfinite 双条件拒绝；issue open）
