original:
  mechanism: 'mindformers/pynative/transformers/moe/router.py 的 TopKRouter._hash_routing 通过 mint.index_select(self.tid2eid, 0, flat_ids) 从 tid2eid 表查 expert 索引。PR !8691（commit b62c88977）为避免 D2H host sync，删除了原有的越界校验 max_token_id = mint.max(flat_ids); if max_token_id >= self.config.actual_vocab_size: raise ValueError(...)。删除后 mint.index_select 在 Ascend 后端对越界索引产生未定义行为（MindSpore 文档原文：Ascend 平台不支持越界检查，若越界可能会造成未知错误），越界 token 会静默得到错误 expert 路由，没有任何报错线索；在数据异常或 tokenizer 配置不匹配、input_ids 超出词表时，模型会悄悄走错 expert 而不报错，极难排查。issue 的期望是在不重新引入 D2H host sync 的前提下增加防御性守卫，避免 Ascend 上的未定义行为并尽量给出可观测信号。基线 mindformers master（pynative 路径），NPU。'
  source: 2026-08-16 GitCode mindspore/mindformers issue https://gitcode.com/mindspore/mindformers/issues/2516 （closed）
  behavior: 数据或 tokenizer 配置有偏差、input_ids 出现超过 actual_vocab_size 的值时，训练/推理照常跑完，不报错也不警告，但那些越界 token 的哈希路由结果是错的——被分到无关 expert 上；loss 可能只是轻微异常甚至看不出来，排查时几乎没有任何日志线索可循。
  trigger_surface: PyNative 哈希路由（TopKRouter._hash_routing）+ input_ids 越界（数据异常或 tokenizer 与 actual_vocab_size 不一致），Ascend NPU
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
