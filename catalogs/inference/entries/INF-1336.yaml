  mechanism: 当查询也被 FP8 量化而没有提供 `q_scale` 时，vLLM 直接令 `q_scale := k_scale`。Q 与 K 的取值范围本来就不同，于是每个 QK^T logit 都被错误缩放。这是**读取侧**的错误缩放，与所有 KV *存储*侧的缩放故障在机制上不同。
  source: '`gh`：vLLM #25047 + llm-compressor #1294（"Q Scaling factor for FP8 KV Cache?"）。'
  behavior: FP8 查询路径下 attention logit 出现系统性偏置，softmax 温度实质被改变，输出偏硬或偏软而无告警。
  trigger_surface: KV/前缀/FP8 相关：vLLM 配置可触发或强相关
  signature: 受 dtype 门控（只在 Q 也走 FP8 时出现），属 ambiguous。签名是 **FP8 查询被吸附到 K 的网格 → 系统性 QK^T logit 偏差**：statistical（注意力熵/温度整体位移）与 infotheoretic 最敏感，因为偏差是系统性而非随机的；geometric 上隐状态偏离温和且方向一致，可能被误判为温和量化漂移（model_on 类）。区分要点在于误差**只在读取侧**——存储的 K/V 与参考一致，recompute-oracle 对比可定位。
  repro: partial——在 `self_attn.q_proj` 输出钩子上，用**K 的** absmax 推出的 scale 对 Q 做 e4m3 伪量化（而非 Q 自己的范围），复现读取侧错误缩放；vLLM 的 FP8 attention kernel 不复现。
  locus: eviction-compression
  priority: medium
