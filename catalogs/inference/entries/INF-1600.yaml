id: INF-1600
legacy_ids: []
slug: runtime_aclfloattofloat16_nan_inf_to_fp16max
aliases: []
title: aclFloatToFloat16 把 NaN/Inf 压成 FP16 最大值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: 通用
    component: fp16_impl FloatToFp16
  behavior: FloatToFp16 把 eF>0x8F 的溢出/NaN/Inf 合并成同一分支，统一输出 eRet=0x1E、mRet=0x3FF 即 65504，没有按 eF==0xFF 区分 mF==0 的 Inf 与 mF!=0 的 NaN。
effect:
  objects:
  - 数值结果
  detail: 950 算力平台 host 侧调用 aclFloatToFloat16 且输入 NaN 或 ±Inf 时，返回 ±65504 而非 NaN/Inf；NaN 坏值变成看似正常的有限值，调试时 loss/输出与参考实现不一致；Inf 表示 mask/上界得到 65504 而非无穷。
  visibility: 静默错误
mitigation:
  detect: 对 NaN/Inf 调用 aclFloatToFloat16 后检查结果是否为 0x7E00/0x7C00；用 isfinite/isnan 断言而非数值比较
  fix: issue 给出修复逻辑：eF==0xFF 时按 mF 是否为 0 分别返回 fp16 Inf（0x7C00）与 NaN（保留符号位与尾数），不再落入 FP16_MAX 分支；issue 已 closed，合入与发布未核实
