original:
  mechanism: cann/runtime 的 fp16_impl.cpp 中 FloatToFp16 手工做 float32→float16 位拼接：拆出符号位 sRet、指数 eF=(ui32V&0x7F800000)>>23、尾数 mF。分支 eF > 0x8F 被注释为 overflow / NaN / Inf，处理方式是 eRet = 0x1EU（FP16_MAX_EXP-1）、mRet = 0x03FFU（FP16_MAX_MAN），即无论溢出还是 NaN/Inf 一律输出 65504。IEEE 754 正确做法是 eF==0xFF 时再分：mF==0 返回 (sRet<<15)|0x7C00（fp16 Inf），mF!=0 返回 NaN（保留尾数的高 10 位）。issue 附了可编译的最小 repro，把同一逻辑摘出来与正确实现对比，平台为 950。因此 aclFloatToFloat16 在 host 侧把 NaN 变成 ±65504、把 Inf 变成 ±65504，属于位级实现缺陷而非舍入差异。
  source: 2026-08-01 GitCode cann/runtime issue https://gitcode.com/cann/runtime/issues/790 （closed）
  behavior: 在 host 侧把 float32 的 NaN 或 Inf 转成 fp16 时，拿到的不是 NaN/Inf 而是 ±65504 这个有限最大值：模型里本来会被 NaN 传染并暴露的坏值变成看起来正常的数，调试时看到的 loss/输出都是有限值，却与参考实现对不上；用 Inf 表示 mask/上界的代码会得到 65504 而不是无穷。
  trigger_surface: host 侧调用 aclFloatToFloat16 且输入为 NaN 或 ±Inf（950 算力平台）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
