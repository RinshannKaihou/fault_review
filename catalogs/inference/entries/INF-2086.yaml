    component: CoalesceSparse 推导
  behavior: Host InferShape 不校验 unique_len/unique_indices/indices 的 rank，直接读 GetDim(0)/GetDim(1)；标量 unique_len 时读到越界维度，输出第一维变成随机大整数。
effect:
  objects:
  - 数值结果
  detail: 非法 rank 输入仍返回 GRAPH_SUCCESS：unique_len=[] 时 5 次运行读到 281473041375616 等不同大整数，rank-1 indices 被静默接受，图元数据不确定。
  visibility: 不可复现
mitigation:
  detect: 用 unique_len=[]、indices=[5] 两组非法输入跑 CoalesceSparse Host InferShape UT，重复运行看输出第一维是否变化；对照 proto 的 rank 契约
  fix: issue 建议在 InferShape 增加 rank 校验并返回失败，并补契约用例；关联 MR https://gitcode.com/cann/ops-math/merge_requests/4997 （closed）
