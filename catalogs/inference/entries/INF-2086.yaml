original:
  mechanism: cann/ops-math 的 CoalesceSparse Host InferShape（conversion/coalesce_sparse/op_host/coalesce_sparse_infershape.cpp）第 33 行直接读 uniqueLenShape->GetDim(0)、第 36 行直接读 indicesShape->GetDim(1)，没有按 proto 契约校验 unique_len/unique_indices 为 1D、indices 为 2D。用 commit 0a2ce5b5（9.2.0-beta.2）的 Host UT 验证：合法对照 unique_len=[4]/indices=[5,2] 输出 [4,2] 与 [4,3]；非法用例 A（unique_len=[]）同样返回 GRAPH_SUCCESS，输出第一维在 5 次重复运行中分别读到 281473041375616、281473386094976、281473761091968；非法用例 B（indices=[5]）稳定输出 [4,2]，第二维缺失被静默接受。Host UT 构建与运行退出码均为 0、3/3 通过，说明现有用例未覆盖该契约。
  source: 2026-08-24 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2822 （closed）
  behavior: 构图时给 CoalesceSparse 传了 rank 不对的输入（例如 unique_len 是标量、indices 是 1D），框架不报错，直接产出奇怪甚至每次不同的输出 shape，后续 tiling/算子按这个 shape 继续跑；调用方要到最后才发现图元数据已经错了。
  trigger_surface: CoalesceSparse 构图 + 违反 proto rank 契约的输入（scalar unique_len、rank-1 indices）
