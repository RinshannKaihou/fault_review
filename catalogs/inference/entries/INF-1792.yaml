original:
  mechanism: ops-nn MR !12373（2026-10-20，修复单含根因与三方验证）。KahanAddReg（NHWC reroute）与 KahanAdd（快路）的补偿位 c=(t-sum)-y 在部分和为 ±Inf 时算得 Inf-Inf=NaN；后续 y=src-c 变 NaN 并跨调用毒化累加器。三方校验（cross_check）实测：修复前 golden/GPU 输出 ±Inf 而 NPU 输出 NaN。修复：c!=c 自比判定检出 NaN lane 并 Select 清零，非有限路径退化为 IEEE 普通加法语义（对齐 golden/torch.sum）；有限路径 c!=c 恒 false 原值保留，Kahan O(eps) 精度收益不受影响。
  source: 2026-10-20 每日扫描；https://gitcode.com/cann/ops-nn/merge_requests/12373
  behavior: bn_training_update_grad 算子在部分和达到 ±Inf 的输入下，Kahan 补偿位计算 Inf-Inf 得 NaN 并毒化整个累加器：GPU/golden 参考输出 ±Inf，NPU 输出 NaN，后续梯度全部变 NaN；修复后非有限路径退化为普通加法与参考对齐，有限输入精度不变。
  trigger_surface: CANN bn_training_update_grad + 大幅值输入（部分和 ±Inf）+ Kahan 快路/NHWC reroute
