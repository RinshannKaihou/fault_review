original:
  mechanism: 'ConcatToConcatD 自动融合 pass（conversion/concat_d/op_graph/fusion_pass/concat_to_concatd_fusion_pass.cpp）在输入数超过 kMaxConcatDInputs（512）时把 Concat 拆成多级 ConcatD 树（BuildConcatDTree）。该拆树场景下，除顶层节点外，树形中间层节点没有任何手动 desc 处理，保留 ES 默认 desc（dtype FLOAT、空 shape），导致下发给真机后静默计算错误（无报错、结果错误）。复现：构建输入数 >512 的 Concat（/ConcatV2）计算图，触发 ConcatToConcatD 自动融合 pass，生成多级 ConcatD 拆树，树形中间层节点携带 ES 默认 desc，真机静默计算错误。修复 MR !6660（已 merged，2026-10-26 批次快照确认；issue #3974 同日 closed）。环境：代码变更未指定特定硬件/CANN 版本。来源 https://gitcode.com/cann/ops-math/issues/3974（closed）+ 修复 MR !6660（merged）。'
  source: 2026-10-26 每日扫描（NPU 批次 batch-20261026T230043147986-d99c34of）。https://gitcode.com/cann/ops-math/issues/3974 https://gitcode.com/cann/ops-math/merge_requests/6660
  behavior: 构建超过 512 个输入的 Concat（拼接）计算图并让其经过图引擎自动融合后，真机执行返回成功但拼接结果错误——拆树产生的中间层 ConcatD 节点携带默认的空 desc（dtype FLOAT、空 shape），数据被按错误类型/形状处理。无任何报错，输出错误量大（整图静默算错）。典型触发面为超多路输入拼接（如超大 embedding 查询合并、超宽特征拼接）。修复已合入主仓，发布版本未核实。
  trigger_surface: 图引擎 ConcatToConcatD 自动融合 pass；Concat/ConcatV2 输入数 >512；硬件/CANN 版本未指定（issue 声明）
