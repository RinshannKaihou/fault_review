status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: PP 传输与 enable_sp 判定
  behavior: PP 收发路径调用 enable_sp() 未传配置恒返 False，误选 TP all-gather 组；TP 切片重组把其他 rank 的 Top-K 行拼进接收 buffer 前缀。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: 共享索引层读错其他 TP rank 的 Top-K 选择，张量形状合法、静默影响稀疏注意力正确性；小 batch 下单行内可混入不同 rank 的列。
  visibility: 静默错误
