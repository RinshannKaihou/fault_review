slug: mindie_pd_pullkv_partial_tp_failure_treated_success
aliases: []
title: D 节点 pullkv 只按 tp0 判成功致请求误入解码
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: 通用
    component: PD pull-kv 结果聚合
  behavior: D 节点单 dp 内 tp=2 时 pull-kv 只按 tp0 结果判成功，tp1 的拉取失败被忽略，请求照常进入 running 队列解码
effect:
  objects:
  - 可用性/进度
  - KV状态
  detail: 日志先出现 pull kv failed，请求未被拒绝或重试即进入解码，随后报 MIE05E010010 无该序列缓存，收尾为 The sequence 101 is not prefilled before decoding；仅 tp 内单 rank 失败时偶发，重试往往正常。
  visibility: 报错
mitigation:
  detect: PD 分离大 EP 下抓 pull_kv_results 与各 tp rank 的返回码，确认是否每个 rank 都成功；解码报 no cached data for sequence 时回查 pull 侧单 rank 失败日志
  fix: issue 指出应在 tp 内逐 rank 汇总 pull-kv 结果、任一 rank 失败即不放入 running 队列；未见关联 PR（issue 已关闭，未核实）
