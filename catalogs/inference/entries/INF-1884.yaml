original:
  mechanism: 'PD 分离部署时，D 节点一个 dp 内 tp=2，pull-kv 由各 tp rank 分别向 P 节点拉取。问题现场：tp0 pull 成功、tp1 pull 失败（separate_deployment_engine.py-390 报 Pull kv from remote_cluster_id: 0 failed, CANN status_code is LLMStatusCode.LLM_NOT_YET_LINK；-519 报 pull kv from unknown failed, error code is MIE05E01001A；response_builder 的 pull_kv_response 里 request_id 带 pd_error_code: PD_PULL_KV_ERROR）。但这一失败结果没有被计入调度判断——代码只按 tp0 的成功返回认为 pullkv 完成，把该请求投入 running 队列，随后 batch_context.py-542 报 MIE05E010010 There is no cached data for sequence 101（未经过 prefill 或已被判定停止仍进入解码），router_impl.py-608 收尾为 The sequence 101 is not prefilled before decoding。正确的语义是：tp 内任一 rank 的 pull-kv 失败都必须视为整请求失败（重试或回退 prefill），而不是只取 tp0 的结果。'
  source: '2026-04-08 GitCode Ascend/MindIE-LLM issue #411 https://gitcode.com/Ascend/MindIE-LLM/issues/411（closed；大 EP PD 分离，D 节点单 dp tp=2）'
  behavior: PD 分离大 EP 部署下偶发请求失败：日志里先出现某个 tp rank 的 pull kv failed（MIE05E01001A / PD_PULL_KV_ERROR），但请求并没有被拒绝或重试，而是进入解码，紧接着报 The sequence 101 is not prefilled before decoding，用户侧看到请求直接失败。只有 tp 内部单个 rank 失败时才会出现，重试同样请求往往又正常。
  trigger_surface: MindIE PD 分离 + 大 EP + D 节点单 dp 内 tp>1 + 远端 KV 拉取单 rank 失败
  discovery: 2026-10-21 GitCode 历史 issue 扫描（mindspore/ms* 簇）
