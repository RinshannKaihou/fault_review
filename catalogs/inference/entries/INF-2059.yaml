id: INF-2059
legacy_ids: []
slug: ops_nn_maxpool3d_valid_ignores_dilation
aliases: []
title: MaxPool3D VALID 形状推导忽略 dilation
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MaxPool3D InferShape
  behavior: padding=VALID 时用 ksize 直接推导输出维，未使用膨胀后的有效核 dilation*(ksize-1)+1；非单位膨胀下每个空间维都算大
effect:
  objects:
  - 数值结果
  - 性能/资源
  detail: NCDHW [1,1,8,8,8]、ksize 3×3×3、dilation 2、stride 1：期望 [1,1,4,4,4]，InferShape 返回 [1,1,6,6,6]；错误形状继续进图规划与输出分配，Host UT InferShapeValidUsesDilation 失败
  visibility: 静默错误
mitigation:
  detect: 对非单位 dilation 的 VALID MaxPool3D 比对 InferShape 输出与 (in - dil*(k-1) - 1)/stride + 1；跑 MaxPool3DUT.InferShapeValid* 过滤
  fix: 已修 MR https://gitcode.com/cann/ops-nn/merge_requests/11232 ：VALID 改用膨胀有效核并补非单位膨胀 Host UT；9.2.0-beta.2 ascend950 配置下 MaxPool3DUT 18 条全过（未做 device 端到端）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: ''
evidence:
- url: https://gitcode.com/cann/ops-nn/issues/6227
  kind: gitcode_issue
- url: https://gitcode.com/cann/ops-nn/merge_requests/11232
  kind: gitcode_pr
relations: []
original:
  mechanism: cann/ops-nn issue 6227（2026-09-27）：MaxPool3D 在 padding='VALID' 时推导输出维只用 ksize，没有把 dilation 计入有效核。有效核应为 dilation*(ksize-1)+1。NCDHW 输入 [1,1,8,8,8]、ksize=[1,1,3,3,3]、stride=1、dilation=[1,1,2,2,2] 时，正确输出 [1,1,4,4,4]，InferShape 返回 [1,1,6,6,6]；单位膨胀时 [1,1,6,6,6] 才是对的，说明缺陷只在 dilation>1 暴露。Host GERT UT 在 CANN 9.2.0-beta.2、ascend950 配置下跑 MaxPool3DUT.InferShapeValid*：3 条中 2 过 1 败，InferShapeValidUsesDilation 返回 [1,1,6,6,6]，单位膨胀对照通过。修复后 nn_op_host_ut 编译通过、该过滤 3/3、MaxPool3DUT 18/18 通过。未跑 device kernel 与 NPU 端到端。
  source: 2026-09-27 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6227 （open）；修复 MR https://gitcode.com/cann/ops-nn/merge_requests/11232
  behavior: 对带 dilation 的 3D 池化做图推理时，输出张量比应有的尺寸大一圈（8³ 输入、3³ 核、dilation 2 应得 4³ 实得 6³），越界的那些位置读到 padding 或邻域重复值；因为形状由 InferShape 给出、分配也跟着变大，程序不报错，只是池化结果整体偏移。
  trigger_surface: MaxPool3D + padding=VALID + dilation>1
  discovery: 2026-10-21 tail_3 顺序深读（历史索引回填，issue created < 2026-10-07）
