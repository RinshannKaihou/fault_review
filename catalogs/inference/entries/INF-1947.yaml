original:
  mechanism: '环境 ubuntu + CANN 9.1.0（/home/dds/B111/Ascend/cann-9.1.0），按 cann-samples 的 kv_rms_norm_rope_cache_story 用例加 -g 编译（CMakeLists 里 ASC 加 -g）、`cmake -DNPU_ARCH=dav-3510` 构建 kv_rms_norm_rope_cache_story，再用 `mssanitizer -t synccheck --full-backtrace=yes ./build/.../kv_rms_norm_rope_cache_membase_full_load` 检测。输出先给出 Run membase/full_load, blockNum 64, blockFactor 16, ubFactor 8 与四行精度结果 k_cache/v_cache/k_out/v_out 全部 precision 100%、errors 0（max diff 0 或 0.00390625）、PASS；紧接着仍打印 `====== ERROR: Sync error detected. kernel locked up at` 并给出 GET_BUF in kv_rms_norm_rope_cache_membase_full_load by PIPE_V in block aiv(4) on device 0、pc 0x13a4(serialNo:1774)，backtrace 落在 kernel_event.h:700/782、kernel_tpipe_impl_c310_vec.h:790 与 full_load.asc:118/91/296。即精度侧证明该 kernel 结果正确，同步侧却判 locked up，属误报。'
  source: '2026-07-20 GitCode Ascend/mssanitizer issue #159 https://gitcode.com/Ascend/mssanitizer/issues/159（closed）'
  behavior: '跑 synccheck 检查一个 kv cache 融合算子，日志前半段四路输出精度全是 100%、errors 0、明确 PASS，后半段却紧跟一条 Sync error: kernel locked up，还带完整 backtrace 和 pc 地址。看到这条的人无法判断是真存在 V/MTE2 缺同步，还是工具误报；因为 PASS 与 ERROR 同时出现，既不敢放过也不敢直接判缺陷。'
  trigger_surface: mssanitizer synccheck + cann-samples kv_rms_norm_rope_cache（regbase/full_load、dav-3510、blockNum 64）
