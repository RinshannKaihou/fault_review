effect:
  objects:
  - 测试判定
  detail: 在CANN 9.1.0、dav-3510下，用synccheck检测kv_rms_norm_rope_cache membase/full_load：先输出四路精度100%、errors 0、PASS，随后又打印Sync error/kernel locked up，无法判断是真缺同步还是误报。
  visibility: 报错
mitigation:
  detect: 对 synccheck 报 locked up 的算子先看同次运行的精度行是否为 100%/errors 0，再用 --block-id 逐 block 复测，必要时对照真实数据结果判断是否真缺同步
  fix: 待定（issue 只报现象，期望“没有同步检测误报”；closed，修复未核实）
