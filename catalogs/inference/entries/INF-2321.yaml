  behavior: 用 aclnnGatherV3 聚合 fp64 高秩（≥5 维起错、≥6 维必错）张量时，接口两次调用都返回成功，读回的输出却是整块 0.0 而非索引聚集结果——下游直接消费到全零张量，数值静默全错；同 shape 的 fp32/fp16/bf16 全部逐位正确，换成 fp32 即恢复，可作定位对照。同一输入反复运行输出稳定全 0，不是偶发。
