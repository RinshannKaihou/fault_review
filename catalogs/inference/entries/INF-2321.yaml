  mechanism: 'cann/ops-nn issue #7848（2026-10-31，Atlas A2 910B/CANN 9.2.0-beta.2）：aclnnGatherV3 在 self.dtype=DOUBLE(fp64) 且秩 ≥6（实测 rank≥5 已出现 561000 错值、rank≥6 全 0）时，两段式接口均返回 0，但设备侧输出整块为 0（静默脏数据）。证据矩阵（self=(3,2,...,2)、index=(2,2,...,2)、dim=0）：fp32 全 rank 2-8 逐位正确（neq=0），fp64 rank 2-4 正确、rank5 561000 错、rank6-8 全 0（neq=2048/2048、8192/8192、32768/32768）——fp32 全对排除 shape 构造/标杆问题，是 fp64 通路高秩独立缺陷。确定性证据：同一输入重复 3 次结果完全一致（run0/1/2 全 0），排除竞争/未初始化。资料 index/gather_v2/docs/aclnnGatherV3.md 的 self dtype 表包含 DOUBLE 且产品支持声明 Atlas A2 支持，未对 rank 与 dtype 组合加限制。'
