original:
  mechanism: cann/ops-nn issue 6274（2026-09-29，open）：AArch64、CANN 9.2.0-beta.2、AICPU Host kernel。Bucketize 声明支持 DOUBLE 输入而边界属性是 ListFloat；AICPU kernel 在搜索前把输入转换为 float，与边界相邻但不相等的 DOUBLE 值舍入到边界，因而进入错误区间。用边界 [1.0]、输入 [nextafter(1.0,0.0), 1.0, nextafter(1.0,2.0)]：right=false 期望 [0,0,1] 实得 [0,0,0]，right=true 期望 [0,1,1] 实得 [1,1,1]，精确等于边界的控制值符合预期。129 个升序边界进入二分搜索后，在 128.0 两侧也会发生相同错分。修复 MR 11322 在两种搜索路径保留 DOUBLE 精度并把 float 边界提升为 double，TEST_BUCKETIZE_UT 13/13 通过；仅 Host UT 验证，未做设备侧执行。
  source: 2026-09-29 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6274 （open）
  behavior: 对 DOUBLE 输入做分桶时，落在桶边界两侧只差一个可表示步长的值会分到错误的桶：例如 right=false 时本应归入前一桶的 nextafter(1.0,0) 被算成第 0 桶、right=true 时本应留在第 0 桶的值被推到第 1 桶；返回码正常，只有拿紧邻边界的输入逐值比对才看得出，整数边界和 fp32 输入都正常。
  trigger_surface: Bucketize AICPU + DOUBLE 输入紧邻边界
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
