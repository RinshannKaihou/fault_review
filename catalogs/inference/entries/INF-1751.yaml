id: INF-1751
legacy_ids: []
slug: ops_nn_bucketize_aicpu_double_boundary_cast
aliases: []
title: Bucketize AICPU 把 DOUBLE 输入降 float 分错桶
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Bucketize AICPU 二分/线性搜索
  behavior: AICPU kernel 搜索前把 DOUBLE 输入转成 float，与边界相邻但不相等的值被舍入到边界值，左右插入语义随之翻转。
effect:
  objects:
  - 数值结果
  detail: 边界 [1.0]、输入 nextafter(1.0,0)/1.0/nextafter(1.0,2)：right=false 期望 [0,0,1] 实得 [0,0,0]，right=true 期望 [0,1,1] 实得 [1,1,1]；129 个边界时 128.0 两侧同样错分。
  visibility: 静默错误
mitigation:
  detect: 用 nextafter 生成紧邻边界的 DOUBLE 输入，左右两种 right 语义各测一遍；整值边界与 fp32 用例看不出来。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/11322 （open）：两条搜索路径保留 DOUBLE 精度、float 边界提升为 double 后比较，UT 13/13 通过。
