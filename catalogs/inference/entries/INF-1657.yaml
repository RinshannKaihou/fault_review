id: INF-1657
legacy_ids: []
slug: ops_nn_index_empty_self_leaves_out_uninitialized
aliases: []
title: aclnnIndex 空 self 早退致非空 out 未初始化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: 空张量早退缺输出回填
  behavior: aclnn_index.cpp:544-549 在 self 空、out 非空时只置 workspaceSize=0 后 return ACLNN_SUCCESS；全文件无 Fill/ViewCopy 回填，输出 GM 不被触碰。
effect:
  objects:
  - 数值结果
  detail: 910_93、CANN 9.2.0：out 预置 NaN 或 12345 后调用，ret=0、workspaceSize=0，24/24 元素原样返回；非空 self 对照正常写入且 workspaceSize 非 0。
  visibility: 静默错误
mitigation:
  detect: 调用前把 out 预置哨兵值，调用后读回比对；同时看 workspaceSize 是否为 0（为 0 说明图里没有算子）。
  fix: issue 6304 closed；建议对齐 ops-cv roi_align 样板（l0op::Fill 填 0 + ViewCopy 回 out）或显式报错拒绝该组合；未给修复 PR。
