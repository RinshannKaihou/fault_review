original:
  mechanism: cann/ops-nn issue 6304（2026-09-29，closed）：环境 Ascend910_93、CANN 9.2.0、代码基线 ops-nn master（2026-09-29），C 直调 aclnn 两段式接口。index/index/op_api/aclnn_index.cpp:544-549 写的是 bool selfOrOutIsEmpty = self->IsEmpty() || out->IsEmpty(); if (selfOrOutIsEmpty) { *workspaceSize = 0; uniqueExecutor.ReleaseTo(executor); return ACLNN_SUCCESS; }——该分支只设 workspaceSize=0 后返回，全文件没有任何针对输出的 l0op::Fill / ZerosLike / ViewCopy；workspaceSize=0 即“图里没有算子”，调用方拿到的是 out 的未初始化 GM 残留（NaN 或上次调用的历史数据）。同仓正确样板 ops-cv objdetect/roi_align/op_api/aclnn_roi_align.cpp 在空张量早退时 l0op::Fill 填 0（L164/L169）→ l0op::ViewCopy 拷回 out（L194）→ workspaceSize 非 0（L197），写法差异明显，可判定为漏写。L543 注释称“空 tensor 在 kernel 中支持”，但实现随即早退、并不进 kernel，注释与实现矛盾。实测：self FLOAT[0,4]、indices INT64[2,3]、out FLOAT[2,3,4]，预置 NaN（aclrtMemset 0xFF）或哨兵 12345.0 后调用，ret=0、workspaceSize=0，24/24 元素保持不变；非空 self 对照 ret=0、workspaceSize=16777728、输出 0..3 正常。
  source: 2026-09-29 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6304 （closed）
  behavior: 用 aclnnIndex 做 index 取数时，如果 self 是空张量而调用方给的 out 非空，接口返回成功、workspaceSize 为 0，可 out 里一个字节都没被写过：预置 NaN 就原样读到 NaN，预置任意哨兵值就原样读到哨兵值。调用方无法从返回值区分“算完了”和“根本没算”，把未初始化显存当结果继续往下传。
  trigger_surface: aclnnIndex 两段式接口 + self 为空张量（首维 0）+ out 非空；Ascend910_93、CANN 9.2.0
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
