title: 图模式静默改用 built-in 算子致精度异常
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: cann
    component: 算子包选择
  behavior: 图模式执行时加载的是 cann/opp/build-in 下的同名算子而非 vendor 目录的自定义算子，日志不打印实际执行的算子路径。
effect:
  objects:
  - 数值结果
  - 指标/日志
  detail: 自定义算子新增 tilingData 变量后动态图报 tilingData size=304/capacity=288；静态图直接出精度问题，dump 显示输入与 tensormove 输出都正常，只有 DEBUG 日志能看出跑的是 build-in 算子。
  visibility: 静默错误
mitigation:
  detect: 开 DEBUG 日志核对实际加载的算子 so 路径（vendor 目录 vs cann/opp/build-in），并确认自定义算子包安装目录含该算子
  fix: 待定（issue 为需求：希望日志直接打印执行的算子路径）；规避：安装后确认自定义算子确实进 vendor 目录
