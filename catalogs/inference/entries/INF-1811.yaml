original:
  mechanism: CANN 8.3.0、A3 环境下，自定义算子新增三个 tilingdata 变量后：动态图模式报 Append atomic_index failed, tilingData size=304, capacity=288（tiling.cc:770 TilingAppendAtomicIndex / TilingAppendDfxInfo 断言），排查发现自定义算子包安装路径下没有包含该算子，实际执行的是 cann/op/build-in 目录下的文件。静态图模式则表现为精度问题：用 dumpdata 排查，入图前后输入 data 与 tensormove 输出都正常，删除算子缓存问题依旧，最后靠 DEBUG 日志才看出执行时的算子是 cann/opp/build-in 目录下的，并非自定义算子 vendors 目录下的。提单诉求是提供图模式自定义算子排查指导，并让日志直接打印执行的算子路径。
  source: 2026-03-23 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/231 （closed）
  behavior: 自定义算子改完 tilingdata 后，动态图先在 tiling 阶段报 tilingData size=304、capacity=288 的追加失败；静态图更隐蔽，模型能跑完但精度不对，dump 出来入图前后输入和 tensormove 输出都正常，删算子缓存也没用，直到翻 DEBUG 日志才发现执行的是 build-in 目录下的同名算子，自定义算子根本没生效，而正常日志里看不到算子来源路径。
  trigger_surface: 图模式（动态/静态图）+ 自定义算子包未真正安装到 vendor 目录
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
