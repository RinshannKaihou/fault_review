title: NPUGraph 重放读到被复用内存的垃圾 gather 索引
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: NPUGraph 捕获/重放内存池
  behavior: 捕获期 kernel 用到的 aclnn workspace/池地址未纳入图内生命周期，重放间被复用回收；relaxed 捕获模式吞掉捕获期 device 错误，坏图留到首次 replay 才引爆。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: 首次 replay 即中断：copy_stream 上 AclrtSynchronizeStreamWithTimeout 报 507011，device 侧 gather_v3 CheckIdxValue 断言索引 3 越界（gxSize=3，算术上不可能产生，只能来自污染内存）。
  visibility: 报错
mitigation:
  detect: 捕获前后保持同一进程的分配历史（先跑 eager 动态 shape 解码再建图），首次 replay 校验；或把动态值链（topk→div→gather）移出图，仅捕获地址静态算子后对比输出
  fix: '待定（issue open）；规避：簿记类动态值链移出图外 eager 执行，图内只留 forward + K/V index_copy_ + 位置推进；正文请维护者确认 PR #32810 是否覆盖单流+分配器历史触发面'
