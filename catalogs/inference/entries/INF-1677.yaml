original:
  mechanism: 'Ascend/pytorch #4629（2026-09-05，open，Ubuntu 24.04 aarch64 / Ascend 910C 双芯 / CANN 9.2.0 / torch 2.7.1+cpu / torch_npu 2.7.1.post4，transfer_to_npu 接入，torch_npu.npu.NPUGraph() + graph(capture_error_mode=''relaxed'')）：用 NPUGraph 捕获 FireRedASR2-AED 自回归解码单步后首次 graph.replay() 即失败——Host 侧 AclrtSynchronizeStreamWithTimeout(copy_stream) error 507011，Device 侧 AI Core aivec error，dump 显示 gather_v3_base.h:137 CheckIdxValue 断言 (0 <= val && val < gxSize_) failed，索引 3 越界（gxSize=3）。该 gather（s_ys.index_select(0, rows)）的索引 rows = topk(p_ids∈[0,9)) // 3 + stride 恒 ≤2，索引 3 在算术上不可能产生，只能来自被污染的内存。被捕获的 step 含 log_softmax→topk×2→div→gather/index_select→index_copy_ 动态值链，输入输出均为固定地址静态 buffer、图外逐 replay 刷新。12 组二分实验（每组独立子进程、捕获+3 次重放+数值校验）定案：失败需两个执行历史同时在场——模型加载与特征编码全程 torch.no_grad()，且捕获前同进程先跑过 eager batch_beam_search；所有算子组单独捕获重放全绿，完整 step_body 逐字复刻 + 严格捕获模式也全绿，唯完整 e2e 时序必挂。capture_error_mode=''relaxed'' 会吞掉捕获期的 device 错误，坏图存至首次 replay 才引爆。报告者判断与 #4379（多流入图 acl graph 内存复用，修复 PR #32810）同根因家族但触发面不同（本单单流、无 sleep/wakeup）。'
  source: 2026-09-05 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/4629 （open）
  behavior: 把 ASR 模型的自回归解码单步用 NPUGraph 捕获后，第一次 replay 就直接挂掉：Host 侧报 copy_stream 上 AclrtSynchronizeStreamWithTimeout 错误 507011，Device 侧是 AI Core aivec error，日志里 gather_v3 的越界断言说索引 3 超出 [0,3)。但这个索引在算术上最多只能到 2（topk 结果整除 3 再加 stride），所以它不是算出来的，而是读到了被别的算子复用过的内存。捕获时开 relaxed 模式不会有任何提示，坏图一直留到 replay 才炸；把 topk→gather 这段动态值链移出图外后，同一时序下重放结果与 eager 逐位一致。
  trigger_surface: NPUGraph 捕获含动态值链（topk→div→gather）的解码步 + 捕获前存在 eager 动态 shape 解码与 no_grad 加载历史；单流、无 sleep/wakeup 也可触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
