original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off` · Cov: `var:bfa_progressive_sign_exponent` · 触发 `partial` · 置信度 `documented`'
  mechanism: 系统刻画 DNN 推理内存中**逐 bit 位**的故障敏感度，横跨 16 个工作负载（含 transformer 与 attention-free CNN）与三种浮点格式。结论：并非所有 bit 等价——不同 bit 位置对最终输出的影响呈**重尾分布**，少量关键 bit（如符号位、指数高位）翻转即可造成灾难性输出偏差，而多数 mantissa 低位翻转影响微小。据此提出 unequal error protection（UEP）策略：仅对高敏感 bit 做冗余保护。这从工程可靠性角度量化了 BFA 家族一直利用的\"稀疏关键 bit\"前提。
  source: From Bit-Position Sensitivity to Unequal Error Protection for DNN Inference Memory, arXiv:2607.19623（2026-07-21）。http://arxiv.org/abs/2607.19623v1
  behavior: 无 crash。量化了权重 bit 翻转的敏感度分布——高敏感 bit 翻转致输出灾难性偏差，低敏感位近乎无影响。为 BFA 家族的\"稀疏定向翻转\"提供了可靠性侧的经验依据。
  trigger_surface: 位敏感度刻画实验，可在 CUDA 做
  signature: infra_off。与 3.6 `bfa_progressive_sign_exponent` 同族——都是\"少量关键 bit 翻转\"；本条补充了逐 bit 敏感度的量化图谱。
  discovery: 2026-07-31 每日扫描（arxiv 2607.19623）。
