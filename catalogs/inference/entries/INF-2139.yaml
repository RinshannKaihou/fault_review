original:
  mechanism: torch_npu（v2.7.1/master）npu_format_cast_(Tensor self, Tensor src) 两参 in-place 重载（语义：将 src 转为 self 的格式并写入 self）的 aclnn 分支把 self 误传给 format_cast_impl_out_npu_aclnn（torch_npu/csrc/aten/common/FormatCastKernelNpu.cpp）：dst = format_cast_impl_out_npu_aclnn(self, ...)（应为 src），随后 self.set_(dst.storage(), ...)。后果：src 数据静默丢弃，self 被换成自身旧内容的转换结果，且 storage 指针被更换使共享旧 storage 的视图失效。legacy Identity 路径（format_cast_impl_out_npu(self, src)）正确。触发：Ascend950DT（aclnn-only 机型恒走）与 Ascend910B CANN>=9.1.0（支持且张量非 view）。该重载仅 CopyKernel.cpp 三处内部调用（legacy copy 三明治写回），Python 经 npu_format_cast_(self, src_tensor) 可达但无测试覆盖，自 !22299 引入未被 CI 发现。Ascend950 复现：nz 全 -100 的 fp16 转 NZ 格式后，src=arange 数据，调用 npu_format_cast_(nz, src) 再转回，nz 仍全 -100。修复在报告者 fork 分支（含 Group 3b 用例），未上游。
  source: https://gitcode.com/Ascend/pytorch/issues/5613（Ascend950DT/CANN 9.2.0B076 复现 + 源码行号；910B CANN>=9.1.0 同样可达）
  behavior: 在 Ascend 950 或 910B（CANN≥9.1.0）上调用两参版 torch_npu.npu_format_cast_(self, src) 后，self 并未获得 src 的数据：仍保持自身旧内容（实测预填 -100 的张量转换后仍全 -100），src 数据静默丢失；同时 self 的 storage 指针被更换，之前共享其 storage 的其他视图悄然失效。无任何报错。
  trigger_surface: npu_format_cast_(self, src) 两参重载；Ascend950 恒触发、910B CANN>=9.1.0 非视图张量触发
  discovery: 2026-10-22 每日扫描
