id: INF-2139
legacy_ids: []
slug: torch_npu_format_cast_two_arg_aclnn_uses_self
aliases: []
title: npu_format_cast_ 两参 aclnn 路径误用 self 转换源
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: FormatCast aclnn 分支
  behavior: npu_format_cast_(self, src) 的 aclnn 分支把 self 而非 src 传给转换实现，再 set_ 换 self 的 storage；legacy 路径正确，两路径语义分叉
effect:
  objects:
  - 数值结果
  detail: src 中暂存的数据被静默丢弃，self 变成"自身旧内容"的格式转换结果，共享旧 storage 的视图失效；Python 侧 npu_format_cast_(nz, src) 实测 nz 仍全为旧值 -100
  visibility: 静默错误
mitigation:
  detect: 调用后核对 self 是否获得 src 数据（报告者最小用例）
  fix: 修复分支 fix/npu-format-cast-aclnn-src（aclnn 分支转换源 self→src + Group 3b 直接用例，报告者本地，未上游合入）
