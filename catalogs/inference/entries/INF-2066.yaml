  behavior: P 节点内存池化、load_async=true 时，同一请求的 'KV pool load spec created' 每秒重复打印约 50 分钟不再推进；P 侧停在 shm_broadcast 等待，D 侧停在 acl_graph。
effect:
  objects:
  - 可用性/进度
  detail: bs64 压测约 8 分钟后全部请求 hang 且不恢复，P、D 节点同时卡死只能手动 kill；进程没有异常退出，日志只有重复的 load spec 行。
  visibility: 挂起
mitigation:
  detect: PD 分离 + load_async=true 下压测，同时抓 P 侧 pool_scheduler 重复行与两端 py-spy 栈
  fix: 待定（closed，未见修复 PR；报告给的规避是 load_async=false）
