title: SLIKG BF16 dQ 未对齐清零分支漏写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: ClearInvalidS1Output
  behavior: ClearInvalidS1Output 改为按 32B 对齐判断后，未对齐分支只剩 FP32 的清零路径；BF16 的 dQ 既不满足对齐也不满足类型分支，整段漏写，无可见压缩 KV 的 query 行保留显存旧值。
effect:
  objects:
  - 梯度
  detail: A3、TND、BF16 dQ、topk=512、mask_mode=3、cmp_ratio=4 且 clear 分段不满足 32B 对齐时，无可见压缩 KV 的 query 行 dQ 保留显存旧值，训练首步 grad_norm 变 NaN；无报错无栈，重复结果一致，换 topk/mask 后消失。
  visibility: 数值异常
mitigation:
  detect: 对无有效压缩 KV 的 query 行单独检查 dQ 是否清零；观察首步 grad_norm 是否 NaN
  fix: '待定（issue 只定位到引入该判断的 PR #11435 / commit d77a4ca，未见修复 PR）'
