  section: 第 11 类 · 解码 / 采样故障（多为 post-forward — 结构性盲点）
  meta: '`infra_off`（vLLM ngram 推测解码静默损坏 hybrid recurrent 模型输出（Qwen3-Next/Qwen3.5 GDN、Nemotron Mamba2、Kimi-Linear KDA，issue #40875）：SSM/Mamba 类 attention 的 per-request recurrent state 在同一 backend 的**推测与非推测两条路径上存放在不同位置**——非推测路径每请求 1 槽（`block_table[:,0]`），推测路径 `num_spec+1` 槽窗口、kernel 按 `num_accepted_tokens−1`（含 bonus，最小 1）选权威槽。两约定只在 `num_accepted==1`（即槽 0）重合；某步接受 draft 后状态活在槽 k>0，任何读槽 0 的路径拿到**接受 token 应用前的陈旧状态**——读在界内、shape 匹配、无检测。触发条件是"接受 draft 的步"紧接"零 draft 的步"：EAGLE/MTP 恒 draft 不产生，ngram 查找无匹配时例行产生 → 间歇性、负载依赖的掉字/重复字而非 crash。修复 PR #56531 选纯分类学方案（可 spec 的行恒走 spec 路径、零 draft 即 num_spec=0 退化单槽）；另修 `num_accepted_tokens` 初始化 0→1（0 会成槽索引 −1：某些布局 OOB 读、另一些静默错行读）） · Cov: `NEW`（spec/非spec 路径状态布局约定分歧子签名） · 触发 `partial` · 置信度 `verified`'
  mechanism: runner 与 GDN builder 多处可在两个连续步之间把一行从一种约定翻到另一种；非 0 即 −1 的占位符与未初始化 buffer 加剧错读。修复统一约定而非到处打补丁（每 backend 一份 kernel 改动或状态复制都会使 bug class 存活）。
  source: 'vLLM PR #56531（2026-09-11 open，fixes #40875；含双路径布局对照、三修复方案权衡与 prefill 尾部分类细节）。https://github.com/vllm-project/vllm/pull/56531'
  behavior: 无 crash——**间歇性掉字/重复 token**（陈旧 recurrent state 起步的生成），负载依赖且难复现。11.64（mamba spec context 陈旧 batch 映射毒化 recurrent state）与 6.212（hybrid GDN align 块边界 checkpoint NaN）之后 hybrid-state × spec 族新成员：本条不在缓存而在**路径约定的语义分叉**维度。
  trigger_surface: vLLM + ngram speculative + hybrid recurrent 模型（GDN/Mamba2/KDA）（partial）
  discovery: 2026-09-11 每日扫描。
