  behavior: 实现在 stepRef==0 时跳过全部阈值判定把 val 一律判正常返回成功；V1 资料判定条件对 stepRef 无门控（该分支语义属 V2）；且把 sfdaRef 重置为 [val,val,val] 抹平历史 min/max。
effect:
