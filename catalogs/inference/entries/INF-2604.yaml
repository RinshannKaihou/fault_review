remarks: 训练库 TRN-0424 记录同一算子「二级指针未填」导致静默空批；本条是 out_num 未文档化且=0 的另一条空结果路径。
evidence:
- url: https://gitcode.com/cann/ops-transformer/issues/8846
  kind: gitcode_issue
relations:
- kind: cross
  target: TRN-0424
original:
  mechanism: 'ops-transformer master 8a09858d8 的 ffn/ffn_worker_batching 中，kernel 在 ffn_wb_common.h:287 用 totalLength = outNum*BS*K 计算要处理的行数；ScheduleContext.FfnArea.out_num 在 docs/aclnnFfnWorkerBatching.md 的参数表（:117-124）里没有定义，只在调用示例结构体（:503）出现。报告者在 Ascend A2 910B2、CANN 9.3.0 上构造合法输入 A=2、BS=8、K=9（Y=144）、E=8、expert_ids 全合法，分别令 out_num=2（对照）与 0（缺陷）调用两段式接口：对照组 actualTokenNum=144、Y 被写满，缺陷组 GetWorkspaceSize=0、execute=0、actualTokenNum=0、Y 保持预置内容。groupList 预填 0x5A 哨兵、out 预清零，排除读写残留。同 issue 关联 #5778 记录同一算子二级指针未填的静默空批，两者都是「调用方漏填一个未文档化字段 → 算子返回成功但什么都不做」。'
  source: https://gitcode.com/cann/ops-transformer/issues/8846（open，2026-11-26，含完整 repro.cpp 与两组实测输出）
  behavior: 当上层调度代码用零初始化或漏填 ScheduleContext.FfnArea.out_num 时，aclnnFfnWorkerBatching 两段接口都返回成功，但 actualTokenNum 直接是 0，输出 y 保持调用前的旧内容，这一批 FFN token 全部凭空消失。调用方看到的是「成功但没结果」，日志里没有任何错误，只能通过回读 actualTokenNum 或比对 Y 才能发现；对照把 out_num 填成 A 就正常处理 144 个 token。
  trigger_surface: Ascend A2 910B2 / CANN 9.3.0；aclnnFfnWorkerBatching，ScheduleContext.FfnArea.out_num=0（未文档化字段，缺省结构体即 0），其余参数合法。
  discovery: 2026-11-26 每日扫描
