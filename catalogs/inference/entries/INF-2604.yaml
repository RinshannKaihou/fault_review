id: INF-2604
legacy_ids: []
slug: ffn_worker_batching_out_num_zero_drops_all_tokens
aliases: []
title: FfnWorkerBatching out_num=0 静默丢弃全部 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: ffn_wb_common.h
  behavior: ScheduleContext.FfnArea.out_num 未在资料参数表定义，kernel 却用 totalLength=outNum*BS*K 决定处理行数；out_num=0 时处理长度为 0，不报错也不校验取值范围。
effect:
  objects:
  - 数值结果
  - 输出内容
  - 可用性/进度
  detail: 144 个合法 token、out_num=0：两段 rc=0/0、actualTokenNum=0、Y 保持调用前内容，全部 token 被静默丢弃；out_num=A 对照 actual=144。生产者零初始化结构体或漏填该字段即触发。
  visibility: 静默错误
mitigation:
  detect: 回读 actualTokenNum 与输入 token 数比较；用 out_num=A 与 out_num=0 两组对照，检查 Y 是否被写、groupList 是否仍为哨兵值。
  fix: 待定（issue 建议资料补 out_num 语义/范围/缺省，或实现对 0/>A 显式报错；open，无修复 PR）
labels:
  stage: N/A
