id: INF-2255
legacy_ids: []
slug: dynamic_quant_arch35_bf16_range_overflow_variant
aliases: []
title: DynamicQuant 系 arch35 向量路径 bf16 极值极差溢出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: dynamic_quant arch35 模板
  behavior: arch35（950/A3）向量寄存器路径的非对称量化行极差 (max-min) 在 fp32 中间量计算，bf16 极值（|x|>FLT_MAX/2）下溢出 inf，scale=inf、y 全饱和且静默返回 0。
effect:
  objects:
  - 数值结果
  detail: x bf16 行内交替 ±bf16 最大值（|x|>1.70e38）时，950PR/950DT/A3 上执行非对称量化（dstType=2/29 等），scaleOut=inf、yOut 全饱和为 +127（符号信息全丢），接口两段返回 0 完全静默；arch35 路径截至报告日仍未修复。
  visibility: 数值异常
mitigation:
  detect: bf16 行内交替 ±bf16max 输入，检查 scaleOut 是否为 inf。
  fix: A2 标量路径已由 https://gitcode.com/cann/ops-nn/pull/13078 （closed 2026-10-29，guard 范式：仅极差溢出时改用 max/粒度-min/粒度）修复；arch35 向量路径需向量级 guard（Select/Greater 组合），issue 明确单独立项，尚未修复
