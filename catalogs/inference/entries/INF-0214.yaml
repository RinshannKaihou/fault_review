  meta: '`infra_off`（ttnn `gelu(variant=Tanh)` 负尾被 `1+tanh(u)` catastrophic cancellation 摧毁：x<−6 输出**恒 0**（真值 −2.3e-15 量级仍在缓慢衰减九个数量级）、[−6,−4] 相对误差最高 **196.6%**、[−8,−7] 段 100%（656,793,543 ULP）——fp32 与 bf16 双精度同病。参照系为 60 位十进制无相消等价形 `x/(1+exp(−2u))`（float64 参照在 x<−6.5 自身亦相消故不可用）；2048 点稠密扫描 [−8,−2.5]。与 #56490（erf 变体 `0.5+0.5*erf` 相消）为同文件两个**独立**内核函数/独立 GeluVariant，修其一不修其二） · Cov: `var:ttmetal_logsigmoid_large_positive_bf16_exp_double_negation_inf`（1.162 近似激活尾段相消/分支缺失族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: tanh(u) 在 u<−8 时距 −1 仅 1–2 ULP，`half_x*t + half_x` 成为两个近等量之减，结果全部有效位来自 tanh 的末 1–2 ULP；输出先坍缩到少数几个值再恒 0，而真函数仍平滑衰减。
  source: 'tt-metal #56517（2026-09-14 open，community label，含六区间 ULP/相对误差扫描表、60 位参照构造说明与 ckernel_sfpu_gelu.h:361-368 定位；明示与 #56490 erf 变体独立）。https://github.com/tenstorrent/tt-metal/issues/56517'
  behavior: 无 crash、无 NaN——负半轴激活值静默归零/错值；若处于门控/掩蔽路径则形成系统性偏置。1.162（logsigmoid 大正分支 exp 双重否定 −inf）之后"近似激活函数尾段相消/分支缺失"族新成员：本条在 tanh 变体 GELU 的负尾维度。
