original:
  mechanism: CANN 9.2.0（Ascend 910B2/A2，torch 2.14+torch_npu 2.14，aclnn C 两段式直调）math/addcmul 的 op_api 源码 aclnn_addcmul.cpp:203-209 的 IsEqualToOne 判据为 return !(value->ToFloat() > 1 || value->ToFloat() < 1)。NaN 与任何数比较均为 false，NaN>1 与 NaN<1 同为 false，取反后整体为 true，于是 value=NaN 被判为等于 1；:285-286 据此进入 l0op::AxpyV2 快路径，该路径不做 value 乘法，输出退化为 self+tensor1×tensor2。aclnnInplaceAddcmulGetWorkspaceSize 以 selfRef 为 out 直接复用 aclnnAddcmulGetWorkspaceSize，原地接口同病。资料公式 out=self+value×t1×t2 且 value 为 FLOAT 标量未声明 NaN 例外，value=NaN 时结果应为全 NaN。报告附 C 直调最小复现（对照组 value=1.0、缺陷组 out-of-place/inplace value=NaN），源码行号定位闭合。
  source: https://gitcode.com/cann/ops-math/issues/3894
  behavior: 调用 aclnnAddcmul/aclnnInplaceAddcmul 时若标量 value 传了 NaN，本应输出全 NaN（NaN 乘任何数加任何数仍是 NaN），实际却返回看似正常的有限值（等于没乘 value 的 self+t1×t2），接口返回成功码，没有任何报错；依赖 NaN 传播做异常检测的下游逻辑全部失效。
  trigger_surface: CANN 9.2.0 / Atlas A2 910B2；aclnnAddcmul、aclnnInplaceAddcmul 两接口；标量 value=NaN（任何形状/dtype 输入）。
  discovery: 2026-10-24 每日扫描
