slug: cann_addcmul_nan_value_treated_as_one
aliases: []
title: CANN Addcmul 把标量 value=NaN 判为 1 静默输出有限值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnAddcmul
  behavior: IsEqualToOne 用 !(value>1||value<1) 判等，NaN 比较全 false 取反为 true，NaN 被判为 1 进入不乘 value 的 AxpyV2 快路径。
effect:
  objects:
  - 数值结果
  detail: value=NaN 时输出全表有限值 self+t1×t2 而非应有的全 NaN，调用方以为计算正常；原地接口同病；两段接口返回 0。
  visibility: 静默错误
mitigation:
  detect: NaN 传播探针：value=NaN 时期望输出全 NaN，有限值即命中
  fix: 待定
