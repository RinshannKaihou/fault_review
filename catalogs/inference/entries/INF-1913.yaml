  behavior: 融合 SwiGLU+量化算子按 GPT-OSS 语义（gluAlpha、gluBias）实现，未按 DeepSeek V4 的 silu(gate)*up 加 swiglu_limit 截断；量化共享专家还漏传该参数
effect:
  objects:
  - 输出内容
  - 输出分布
  detail: DeepSeek-V4-Pro-w4a8（swiglu_limit=10.0）在 TP16/EP 单节点、temp=0、131 token prompt 下稳定吐出 Foracci、†source 之类非词 token；可确定性复现，无报错无 NaN
  visibility: 静默错误
mitigation:
  detect: 对 swiglu_limit>0 的 w4a8 模型做 temp=0 短 prompt 冒烟，比对融合路径与 GMM1+显式 clamp 路径的输出 token；算子级用 PyTorch 参考对齐 clamp 顺序与 gate/up 布局
  fix: issue open，无合并 PR；短期绕过是在 0 < swiglu_limit < 1e6 时跳过融合 grouped_matmul_swiglu_quant_v2，显式 clamp + silu(gate)*up + 动态量化，并把 swiglu_limit 传给共享专家回退路径
