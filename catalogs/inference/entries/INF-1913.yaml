original:
  mechanism: DeepSeek V4 的 SwiGLU 带有限幅：先对 gate/up 做 clamp(±swiglu_limit)，再 silu(gate)*up 并动态量化。vllm-ascend 在 w4a8 融合 MoE 路径把它合并进 grouped_matmul_swiglu_quant_v2，而 csrc/moe/dequant_swiglu_quant/op_kernel/dequant_swiglu_quant.h 在 swigluMode == 1 时实现的是 GPT-OSS 变体（gluAlpha=1.702、gluBias=1.0 的 SwiGluGate），语义与 DeepSeek V4 的 silu(gate)*up 不一致；csrc/gmm/grouped_matmul_swiglu_quant_v2 下 a8w4、a4w4、split-fusion 几套 clamp 实现的截断顺序与 gate/up 布局也没有针对 DeepSeek V4 做过算子级对齐。另外量化共享专家分支没有把 swiglu_limit 传下去，未量化的共享专家走不到上游 SiluAndMulWithClamp。触发条件明确：模型 config 里 swiglu_limit=10.0 且走融合量化路径。报告在 b26970e597222029d624261a8738a40f2d33ad17 的 clean main 上复现，最短用例是 131 token、temperature=0、top_p=1 的确定性请求。
  source: 2026-05-26 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/9589 （open）
  behavior: DeepSeek-V4-Pro-w4a8 在单节点 TP16、开 EP 的服务上，一条完全确定性的短请求（temperature=0）就吐出 Foracci、†source、dátummal、böjnings 这类跨语种碎片，句子结构塌掉；不报错、不 NaN，看起来像模型本身权重坏了。同一权重只要绕开融合 SwiGLU 量化算子（显式 clamp 路径）输出就正常，说明问题在算子语义而不在权重。
  trigger_surface: w4a8 量化 + swiglu_limit 有限幅的 DeepSeek V4 模型 + 融合 grouped_matmul_swiglu_quant_v2 路径（含量化共享专家）
  discovery: 2026-10-21 历史索引回填（NPU pool2_v2c，issue created < 2026-10-07）
