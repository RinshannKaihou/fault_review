  mechanism: DSA 打包 KV（token 打包/稀疏索引布局）在 host tier load-back 路径上未被正确处理——回到 device 的 packed KV 与元数据/索引不一致，注意力读到错位内容。与 6.184（vLLM KV offload 数天 uptime 后 block-not-found crash）同为 offload 往返正确性，本条**无 crash、纯语义损坏**且 DSA 特有打包布局是新的失败面。
  source: 'SGLang #38031（2026-09-04 open，8×H100 TP8，含 spec on/off 对照实验）。https://github.com/sgl-project/sglang/issues/38031 · 根因定位+修复 PR #38212（2026-09-06：HiCache 往返不备份/恢复 DSA target+draft index buffers——KV 与 recurrent state 恢复但选 token 的 index 缓冲不恢复，attention 选错 prompt 片段而 cache 报恢复成功；第二缺陷：prefix-cache 分裂落在压缩组内时不同后缀共享压缩 index 行互相覆写；报告者 8×H100 生产负载验证通过）'
