  - 数值结果
  detail: EP2/topk=1、专家计数 [5000,2000,0,0] 且总行数未超 7000 容量时，专家 1 的 2000 个 token 输出为 0.0（对照 [2000,2000,3000,0] 为 0.65625）；容量 14000 时逐位一致。
  visibility: 静默错误
mitigation:
  detect: EP2 W4A8 下对比不同专家计数与容量（7000/10000/14000），同时校验 expert_token_nums 与输出行
  fix: 临时规避 enable_fused_mc2=0（--additional-config，优先于已弃用的 VLLM_ASCEND_ENABLE_FUSED_MC2=0），回退常规 MC2/ALLTOALL；CANN 二进制根因修复待定
