original:
  mechanism: 'CANN 9.1.0 A3 ops（innerversion V100R001C25B114、ops-transformer 20260720）的 cann_ops_transformer.ops.mega_moe 在 W4A8（INT4 权重、INT8 dispatch）路径上，当较早本地专家接收足够多 token 时会丢弃后续专家输出。最小复现 num_tokens_per_rank=3500、EP=2、topk=1、max_recv_token_num=7000：对照专家计数 [2000,2000,3000,0] 时专家 1 输出 0.65625，触发计数 [5000,2000,0,0]（总行数同为 7000）时 expert_token_nums[1] 仍为 2000 但输出变为 0.0；容量 10000 时 rank0 恢复、rank1 仍 0，容量 14000 时与对照逐位一致。这是当前 nightly 选择的 MegaMoe 路径，不是 #14869 的旧 dispatch_ffn_combine_w4_a8 算子。'
