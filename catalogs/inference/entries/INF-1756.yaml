id: INF-1756
legacy_ids: []
slug: inductor_mlir_backend_wrong_output_nan
aliases: []
title: MLIR 后端整图编译标准 CNN 输出 NaN 与错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: Inductor MLIR 后端图级编译
  behavior: npu_backend=mlir 整图编译产物与 eager 完全不同：resnet18、mobilenet_v2 输出 NaN，或输出量级整体改变、最大相对误差 12682.66；逐算子与部分 stage 组合编译均正确。
effect:
  objects:
  - 数值结果
  detail: resnet18 bs8 fp32：eager absmax 0.162 对 mlir 0.715，最大相对误差 12682；错误幅度跨进程在 0.28~2.0 间变化、同进程两次仅差 2.98e-07；dynamic=True 可规避，Triton/DVM/NPUGraphs 后端均 PASS。
  visibility: 数值异常
mitigation:
  detect: 标准 CNN 在 npu_backend=mlir 下与 eager 比 max|diff| 与 isnan；再按 stage 二分（stem/layer1..4 单独编译均正确，合并到 layer3 才错）
  fix: 待定（issue open）；规避：dynamic=True，或改用 Triton/DVM/NPUGraphs/TorchAir-GE 后端；建议把 resnet 类标准模型的 MLIR 正确性纳入 CI
