original:
  mechanism: 'Ascend/pytorch #5063（2026-09-23，open，HiDevLab A3 / Ubuntu 22.04 / CANN 9.1.0 / torch 2.9.0+cpu / torch_npu 2.9.0.post6 / triton_ascend 3.2.2 / torch_mlir 0.0.1）、#5214（2026-09-28，open，Ubuntu 22.04.5 aarch64 / CANN 9.1.0 / torch 2.9.0+cpu / torch_npu 2.9.0.post6 / triton_ascend 3.2.2 / Ascend 910B3）、#4825（2026-09-15，closed，Atlas 800T A2 910B3 / CANN 9.1.0 / torch 2.9.0 / torch_npu 2.9.0.post6 / triton_ascend 3.2.2 / torch-mlir 0.0.1）：torch.compile(backend="inductor", options={"npu_backend":"mlir"}) 整图编译标准 CNN 后输出与 eager 完全不同。resnet18 bs8 fp32 上 max_abs_diff=NaN、正确性 FAIL（#5063），输出量级整体改变：eager absmax 0.1621512770652771 对 mlir absmax 0.7145952582359314，最大相对误差 12682.66（#4825）；mobilenet_v2 bs32 3×224×224 同样 NaN（#5214）。#4825 的系统二分表明：逐算子（conv/linear/bn/relu/pool）、单 stage、stem+layer1+layer2 各自编译都正确，只有 stem+layer1+layer2+layer3 合并成同一张图才出错，错误幅度跨进程在 0.28~2.0 间变化、同进程内两次运行稳定在 2.98e-07，dynamic=True 可规避；同环境同模型 Inductor-Triton（max diff 1.776e-15）、Inductor-DVM、NPUGraphs/NPUGraph_EX/AOT_Eager、TorchAir-GE 全部正确，可把缺陷定位在 MLIR 编译路径（融合/数据类型处理/Tiling），而非模型、输入或硬件。'
  source: 'Ascend/pytorch #5063（2026-09-23，open）、#5214（2026-09-28，open）、#4825（2026-09-15，closed） https://gitcode.com/Ascend/pytorch/issues/5063 https://gitcode.com/Ascend/pytorch/issues/5214 https://gitcode.com/Ascend/pytorch/issues/4825'
  behavior: 用 mlir 后端编译 resnet18/mobilenet_v2 这类标准 CNN，编译状态是 COMPLETED、不报错，跑完也不崩，但输出整片 NaN 或整体量级都变了（eager absmax 0.16 对 mlir 0.71）。同环境换任一其它后端逐位一致，所以只有把 compiled 输出与 eager 对比、或下游指标突然崩掉才会发现；同一进程里错误值稳定复现，跨进程幅度还会变。
  trigger_surface: npu_backend=mlir 整图编译（多个 stage 合并进同一张图）+ fp32 标准 CNN 推理
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
