id: INF-1375
legacy_ids: []
slug: triton_ascend_static_rnumel_softmax_miscompile
aliases: []
title: triton-ascend 静态 r-numel 致 softmax 误编译
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 归约 lowering 常量特化
  behavior: r0_numel 作为 ASTSource 编译期常量烧入时，triton-ascend 对 fused softmax 行 max 归约生成错误代码；同内核同配置仅该常量化差异即数值翻转（常量 96→97% 错，运行时 i32→正确）。
effect:
  objects:
  - 数值结果
  detail: triton_experimental 后端 torch.compile 下带 attn_mask 的 fp16 SDPA 约97%元素错、maxdiff 0.0908，确定性复现无报错；eager 正确。静态 r-numel 特化且 R0_BLOCK==rnumel 的线性化归约触发。
  visibility: 静默错误
mitigation:
  detect: torch.compile(fn) vs eager 逐元素比对（报告含 6 行最小复现）
  fix: 临时规避：torch_npu 侧去掉静态 r-tree numel 常量注入（令 r0_numel 回运行时 i32 传参；实验补丁实测 causal 11919/12288→0、alibi→1/12288，未回写安装树）；编译器侧修复 open 未定位到具体 pass
