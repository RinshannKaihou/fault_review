  meta: '`infra_off`（vLLM GLM-5.3-Flash 多轮 agentic 长会话间歇性退化成重复 token / shell 片段 word salad（(tmp)(tmp)…）：HTTP 200、正常 finished_reason、无错误无 preemption——完全静默。维护者确认为 known issue："tool call / vllm frontend"；修复 PR #56635 = 跳出 reasoning 段时显式检查 tool call token 防止其 bleed 进正文。build A/B：0.1.dev20051（08-26）干净 vs 0.28.1rc1.dev580（09-08）退化（delta 含 vLLM commit 区间 / FlashInfer 0.6.17→0.6.18 / transformers 5.15.1→5.16.1）；单轮/短请求恒干净；30+ 合成请求（10 轮工具历史、34k 上下文、并发）全部无法复现——**仅真实 agentic 客户端（Claude Code/OpenCode 类）长会话触发**，证据是 build A/B + 回滚而非独立 repro；mamba 随机舍入/SSM dtype/MTP 开关均不影响） · Cov: `NEW`（reasoning 段退出边界的 tool-call token 泄漏子签名） · 触发 `yes` · 置信度 `verified`'
  mechanism: reasoning 解析器跳出思维链段时未检查 token 是否为 tool call 起始，tool-call 控制串被泄漏进正文解码上下文，污染后续自回归生成。
  source: 'vLLM #56605（2026-09-12 open，bug+glm label，含双 build 版本矩阵、六项合成复现尝试与回滚证据）；修复 PR #56635。https://github.com/vllm-project/vllm/issues/56605'
