  target: INF-1539
pattern: PAT-INF-0169
original:
  mechanism: cann/ops-math math/top_k_v2/op_host/arch35/top_k_v2_tiling_arch35.cpp 与 sort_tiling_arch35.cpp 中，输入维度是 int64_t，但中间调度量与累乘变量是 uint32_t：unsortedDimNum（L1197-1200）以 uint32_t 起 1 并累乘 inputShape.GetDim(i)；lastDimTileNum、lastDimTileNumTimes（L185-187）、inputTopkSize（L499-500）、tileNum/tailTileNum（L516-519）同样在 uint32_t 上运算；Sort 侧 sortAxisNum 参与 xUbSize/y2UbSize/halfNum 的 uint32_t 乘法（sort_tiling_arch35.cpp L285-289）。dim 累乘、分块数、核数、workspace 大小这些关键调度值都落在 uint32_t 上，超大 batch 与超长序列场景下超过 uint32 最大值即溢出截断，且 int64_t 与 uint32_t 之间无校验直接赋值。issue 的建议是维度长度/轴数/累乘中间量改 64 位、全局偏移与总块数改 64 位、写入硬件字段前做范围校验。
  source: 2026-05-11 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/1514 （closed）
  behavior: 在超大 batch 或超长序列下调用 TopK/Sort（top_k_v2、sort 的 arch35 路径），分块数与 workspace 大小算出来是截断后的值，调度参数与实际数据量对不上，表现为结果错乱或访存越界；正常规模输入完全正常，所以很难在上线后被归因到 tiling 的类型宽度。
  trigger_surface: ops-math top_k_v2 / sort 的 arch35 tiling；输入维度累乘超过 uint32 上限（超大 batch、超长序列）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
