id: INF-1561
legacy_ids: []
slug: ops_math_topk_sort_tiling_uint32_narrowing
aliases: []
title: TopK/Sort tiling 用 uint32 承接维度累乘致溢出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: top_k_v2/sort tiling
  behavior: unsortedDimNum、lastDimTileNum、inputTopkSize、tileNum 等调度量在 uint32_t 上累乘，int64 维度直接赋值无校验；超大 batch 与超长序列下超 uint32 上限即溢出截断
effect:
  objects:
  - 数值结果
  detail: 分块数、核数与 workspace 大小被截断后调度参数错乱，写入硬件字段的偏移/块数越界，可能内存越界或结果错乱；正文为 arch35 tiling 白盒检视（top_k_v2_tiling_arch35.cpp:1197/185/499/516），未给实测 shape
  visibility: 静默错误
mitigation:
  detect: 对 numel 接近或超过 2^32 的超大 batch/长序列用例，用 64 位基准值核对 tiling 输出的分核数与 workspace 大小，并检查写入硬件字段前的值域
  fix: 待定（issue closed 但正文未给 PR）：维度长度、轴数、累乘中间量改 uint64_t/int64_t，全局偏移与总块数用 64 位，写入硬件字段前做范围校验并禁止无校验的 int64↔uint32 隐式转换
