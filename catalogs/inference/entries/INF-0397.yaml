  mechanism: apply_temperature 用 temperature 去除 logits；若 logits 中含有 -inf 项，除法产生 +inf，随后的 softmax/归一化把整个概率向量变成 NaN。相关问题：temperature 校验使用 `<`/`>` 比较，对 NaN/Inf 会静默地取 False（CVE-2026-54235）。
  source: 'vLLM #22180; 修复 PR #24734。'
  behavior: 每当 -inf logit 遇上 temperature scaling，就偶发地吐出垃圾/重复/无意义 token。
  trigger_surface: vLLM 特性路径：需对应模型/版本 pin + 场景构造
  signature: 故障位于 SAMPLING 层，发生在「最后一层隐状态 → logits 投影」之**后**。隐状态不受影响 → **隐藏态几何检测器不会捕获**，geometric/spectral/trajectory/statistical/infotheoretic 全族在隐状态空间上都看不到它。替代检测手段：在采样前对 logits/概率做 NaN/inf 扫描（输出级 cheap 检查）。这是一个结构性盲点：downstream-agnostic 的检测器整体漏检。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）
  repro: 不适用。
