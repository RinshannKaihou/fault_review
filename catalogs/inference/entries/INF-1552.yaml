status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: vllm
    component: MegaMoE receiver 容量
  behavior: mega_moe_max_tokens 被显式设为 8192（该构建默认 65536），实际专家路由量超过 8192 时 fused-MoE receiver 静默裁剪真实请求的专家计算，不报错。
effect:
  objects:
  - 输出内容
  detail: GLM-5.3 W8A8C8 六节点 P/D 下 6816 token 两轮 prompt 输出重复/乱码；prefill batch 由 8192 改 4096 即恢复正常，上限改回 65536 后该 prompt 也通过。
  visibility: 静默错误
mitigation:
  detect: 按请求统计实际专家路由量并与 mega_moe_max_tokens 比较；对照同一 prompt 在不同 max-num-batched-tokens 下的输出
  fix: 待定（issue open）；规避：mega_moe_max_tokens 用构建默认 65536、prefill batch 与上限匹配；报告者建议 fused-MoE 路径在容量溢出时报错而不是静默裁剪
