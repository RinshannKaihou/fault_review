- url: https://gitcode.com/mindspore/mindspore/issues/29315
  kind: gitcode_issue
relations: []
original:
  mechanism: 'MindSpore 2.8.0（CPU 后端，Python 3.12）：x=Tensor(zeros((0,3),float32))、y=Tensor(ones((3,2),float32))。PYNATIVE_MODE 下 ops.matmul(x,y) 返回 shape (0,2) 的空矩阵、asnumpy() 为 []；GRAPH_MODE 下 @ms.jit def f(a,b): return ops.matmul(a,b) 返回 shape () 的标量 0.0。issue 明确指出 (0,3)@(3,2) 按矩阵乘法规则应为 (0,2)，图模式把空矩阵结果错误地变成标量，两种执行模式结果不一致。issue 已 closed，正文未给出修复 PR 或修复版本。'
  source: 2026-04-24 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29315 （closed）
  behavior: 空 batch、空序列或全被 mask 掉的分支做 matmul 时，图模式拿到的不是空矩阵而是一个标量 0.0；后续 reshape、concat 或按 dim0 取索引会得到与 PyNative 完全不同的结构，值也只剩一个 0。因为 shape 是 () 而不是 (0,2)，连“结果为空的检查”都会走错分支。
  trigger_surface: GRAPH_MODE / @ms.jit 下对含 0 维的输入做 ops.matmul；MindSpore 2.8.0 CPU
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
