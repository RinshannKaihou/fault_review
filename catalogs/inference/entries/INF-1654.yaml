id: INF-1654
legacy_ids: []
slug: ms_matmul_empty_graph_scalar
aliases: []
title: 零尺寸 matmul 在图模式返回标量 0.0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: Graph/JIT matmul 空张量推导
  behavior: Graph/JIT 的 matmul 形状推导对含 0 维的输入退化成标量输出，没有按 (0,3)@(3,2)→(0,2) 的矩阵乘法规则给出空矩阵。
effect:
  objects:
  - 数值结果
  detail: x (0,3)、y (3,2) 时 PyNative 返回 shape (0,2) 空矩阵，Graph/JIT 返回 shape () 的标量 0.0；空 batch 或空序列分支下游按 shape 取索引即出错。
  visibility: 静默错误
mitigation:
  detect: 对 (0,3)@(3,2) 分别在 PyNative 与 @ms.jit 下执行并打印 shape；图模式给出 () 而不是 (0,2) 即命中
  fix: 待定（issue closed，未见修复 PR/版本说明）；方向：图模式 matmul 的 shape 推导保留 0 维，不要退化成标量
