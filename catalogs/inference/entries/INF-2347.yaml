cause:
  objects:
  - subsystem: KV缓存
    stack: transformers
    component: Mamba-1 cache 传递分支
  behavior: 对已 prime 的 Mamba-1 cache 做多 token forward 时 dispatch 静默走零状态分支重启 selective scan 返回错误 logits；Mamba-2 等价路径已修，Mamba-1 未覆盖。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: 复现（mamba-130m-hf fp32 CPU，transformers 5.20.2，main@10-31 无变化）：primed 多 token 路径与 full forward 后半 logits 不一致，静默无报错，影响长生成/批推理/评测 harness。
  visibility: 静默错误
mitigation:
  detect: 对 primed cache 的多 token forward 与 full forward logits 对照（issue 复现脚本即此法）。
  fix: '待定（issue open 2026-10-31；Mamba-2 对应修复 #46084/#46741 已在，Mamba-1 待同样处理）'
