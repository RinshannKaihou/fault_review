original:
  mechanism: vllm_ascend 的 rejection_sampler.py 里 block-verify 这条路径把整块草稿 token 一起验证，但接受判据直接照搬了逐 token 版本的公式，没有按投机解码论文里 block-wise 的形式对块内联合分布做修正（逐 token 是 min(1, p(x)/q(x)) 的单点比值，块验证需要按块内前缀的联合概率调整，否则接受概率与目标分布不一致）。触发门槛写在代码里：只有最大草稿 token 数 ≥3 才启用 block-verify，<3 走逐 token 路径不受影响。所以现象是"草稿 token 数调大反而更差"，而小 token 数下一切正常，容易被误判成模型或权重问题。report 在 0.17.0rc2.dev168+g11e058347 上给出，作者自述正在写完整修复 PR，并建议在修好前直接关掉 block_verify。
  source: 2026-03-29 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/7807 （closed）
  behavior: 用户把 --speculative-config 的 num_speculative_tokens 调到 3 以上想提升吞吐，结果生成质量反而明显下降：句子更碎、答非所问的比例上升，接受率数字也不对劲。降到 2 个草稿 token 就恢复正常，所以现场很容易归因成"草稿模型不行"。没有报错、没有 NaN，只有评测分数和人工读输出能发现。
  trigger_surface: 推测解码 + num_speculative_tokens ≥ 3（进入 block-verify 路径）
  discovery: 2026-10-21 历史索引回填（NPU pool2_v2c，issue created < 2026-10-07）
