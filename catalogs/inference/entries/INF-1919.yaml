title: block_verify 沿用逐 token 判据致接受分布错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: rejection_sampler
  behavior: block-verify 路径直接复用逐 token 的接受判据，没有按论文公式对整块联合分布做修正，接受概率与目标分布不一致
effect:
  objects:
  - 输出分布
  - 输出内容
  detail: 推测 token 数 ≥3 才走该路径，一走上生成质量就明显下降（报告称 significant degradation）；<3 个草稿 token 时不触发，全程无报错
  visibility: 质量退化
mitigation:
  detect: num_speculative_tokens≥3 时对比 block-verify 开/关的输出分布与接受率；用论文公式独立算一遍块内接受概率
  fix: issue 已 closed；report 给出的临时规避是直接关掉 block_verify（即使草稿 token 数 ≥3），作者随后提交了完整修复 PR
