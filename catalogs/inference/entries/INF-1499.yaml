original:
  mechanism: 'op-plugin issue #224（2026-07-01，closed）：正文一句——npu_moe_finalize_routing_meta 当 scale 为空且 expanded_permute_rows 的 shape 为 (E,C,H) 时，返回值的 shape 为 (E,C,H)，与实际的输出 shape (R,H) 不一致。也就是说 meta 实现（fake tensor / 图模式下的形状推导）在没有 scale 的分支里直接沿用了 expanded_permute_rows 的三维形状，而真实 kernel 的输出是按路由行数 R 展平的二维 (R,H)。正文没有给出源码位置、E/C/H/R 的具体取值、复现脚本与修复 PR。'
  source: 2026-07-01 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/224 （closed）
  behavior: 在 NPU 上按 MoE finalize routing 的常规用法传 scale=None 时，走 meta 推导（torch.compile / 图模式 / fake tensor）拿到的输出形状是 (E,C,H)，而 eager 真正算出来的是 (R,H)。形状对不上之后，编译出的图要么按 (E,C,H) 继续推导导致后面 reshape/索引错位，要么在形状校验处才炸；非空 scale 的调用不受影响。
  trigger_surface: npu_moe_finalize_routing_meta + scale=None + expanded_permute_rows 为 (E,C,H)
