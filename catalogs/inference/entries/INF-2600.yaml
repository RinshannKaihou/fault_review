slug: vllm_ascend_staged_metadata_h2d_race_kv_hit_wrong_answer
aliases: []
title: vllm-ascend 元数据 H2D 无序致 KV 命中答错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: vllm-ascend
    component: StagedWriteTensor H2D
  behavior: apply_write 以 non_blocking H2D 拷贝请求元数据后启动 apply-write kernel，但 Ascend 不保证同 stream 保序；kernel 可能读到上一轮的元数据。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: DeepSeek-V4-Flash-DSpark W4A8 + Ascend KV Pool 下，命中前缀缓存的请求间歇答错（如 secret number 变 1、重复文本），9/9 次 engine 运行至少一次；改阻塞拷贝后 5/5 正确。
  visibility: 静默错误
mitigation:
  detect: 对比池命中请求与本地 prefix cache 输出；对 apply_write 前后加同步或阻塞拷贝做差分
  fix: 待定（issue 给出阻塞 H2D 的止血对照 5/5 正确；open，无修复 PR）
