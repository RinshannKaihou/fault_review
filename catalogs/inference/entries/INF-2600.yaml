original:
  mechanism: vLLM Model Runner V2 的 staged request-metadata 路径中，`StagedWriteTensor.apply_write()`/`FusedStagedWriter.apply()` 先用 `non_blocking=True` 把 host 侧 Python list 拷到设备，紧接着启动 `_apply_write_kernel`，隐含依赖非阻塞 H2D 与后续 kernel 在同一 stream 上保序。Ascend 上该顺序不被保证：请求命中 KV 池/前缀缓存时，首步 forward 可能读到上一轮或未初始化的 `num_computed_tokens`、`all_token_ids`、block table 行，位置/块表计算错误，输出错误答案；下一步元数据被重写后又恢复正常，因此表现为间歇性错误。DeepSeek-V4-Flash-DSpark（W4A8，DP2×TP2，DSpark 投机解码）启用 AscendStoreConnector+memcache KV 池后，同一序列连续 9 次独立 engine 运行 9/9 至少一次命中请求答错；把该 H2D 改为阻塞拷贝后 5/5 次运行全部正确。本地 prefix cache 不启用池的对照实例所有轮次正确。环境 Atlas 800I A3、CANN 9.3.0、vLLM 0.33.0、torch_npu 2.10.0.post7、VLLM_USE_V2_MODEL_RUNNER=1、async_scheduling=True、FULL_DECODE_ONLY。
  source: https://github.com/vllm-project/vllm-ascend/issues/22798（open，2026-11-22，含 9/9 复现与阻塞拷贝 5/5 对照）
  behavior: 启用 Ascend KV 池/前缀缓存后，同一 prompt 的后续命中请求会间歇性输出错误答案：例如应回答 secret number 8，却输出 'The secret number is 1' 或重复文本；外部命中 token 数始终正常（每副本 16384），说明命中本身没有丢失。冷启动请求正确，后续命中请求才出错，且下一步元数据重写后恢复正常，表现为难以复现的间歇错误；不启用池、只用本地 prefix cache 的实例所有轮次正常。
  trigger_surface: vLLM Model Runner V2（VLLM_USE_V2_MODEL_RUNNER=1）+ Ascend A3 + AscendStoreConnector/memcache KV 池；DP2×TP2、FULL_DECODE_ONLY、async scheduling、DSpark 投机解码；本地 prefix cache 不触发。
  discovery: 2026-11-26 每日扫描
