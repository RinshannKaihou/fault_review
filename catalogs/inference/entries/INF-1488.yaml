  mechanism: Ascend NPU 环境（PyTorch 2.7.1 / Python 3.11.13 / CANN 9.0.0 B103 / PTA 26.0.0 B090 / 驱动 25.7.T5.B002，另装 TorchRec v1.2.0、fbgemm-gpu 1.2.0+cpu）：relu 等算子采用极致头开销（head-overhead）模板实现，模板里寄存器重置操作缺失，导致内存踩踏——越界写污染了本不属于该算子的显存，使模型 loss 变为 nan。结论由 msprobe 定位得出：接入 msprobe 采集后问题不复现，即工具插桩改变了算子执行/内存布局，把踩踏掩盖掉；issue 未给出具体算子二进制、代码行、修复 PR 或误差量级。
  source: 2026-08-14 GitCode Ascend/msprobe issue https://gitcode.com/Ascend/msprobe/issues/524 （closed）
  behavior: 模型跑起来 loss 直接是 nan，去掉 msprobe 时稳定出现；一旦按常规做法接上 msprobe 去 dump 定位，nan 就不再出现，用户会以为问题已被工具规避或根本不存在，实际缺陷仍留在算子模板里。换回不带工具的运行方式又复现。
  trigger_surface: Ascend NPU + relu 等算子的极致头开销模板；是否接入 msprobe 采集（接入即掩盖）
