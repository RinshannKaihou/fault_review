id: INF-1679
legacy_ids: []
slug: event_wait_before_record_submit_race
aliases: []
title: Event.wait 早于 record 提交时未建流间依赖致脏读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: NPUEvent/StreamWaitEvent
  behavior: Host 侧 aclrtRecordEvent 仍在驱动缓冲队列、尚未提交到 Stream A 时，消费流已下发 aclrtStreamWaitEvent；Event 非 active，等待被当 no-op 放行，硬件级流间依赖未建立。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 消费流在生产流写入前读共享 buffer，读到上一步旧值或中间值；训练侧梯度出现 NaN/Inf、loss 异常发散；Profiler 上消费算子与生产 fill_ 时间线重叠、wait 时长≈0。
  visibility: 静默错误
mitigation:
  detect: 双流 fill_+record / wait 循环 1000 步校验 buffer[0,0] 是否等于当步值；Profiler 上看 wait 是否零时长并与生产算子时间线重叠
  fix: 待定（closed，正文未给修复 PR）；建议 NPUEvent 维护 Host 侧 PendingSubmit 状态机、wait 时补物理栅栏或延迟下发；规避：event.wait 前后插 torch.npu.synchronize()（会破坏 Host-Device 重叠）
