  objects:
  - subsystem: 算子/内核
    stack: cann
    component: 混合量化 MLA metadata
  behavior: 源码侧 BalanceSchedule/GenMetadata 无条件 return true、Compute 返回 KERNEL_STATUS_OK；metadata 是否写出取决于出参缓冲区预填值的符号位。
effect:
  objects:
  - 数值结果
  detail: 合法输入、ParamsCheck 三步全过、两段接口返回 0：预填 0x00/0x5A 时写出 15 个不同值，预填 0xA5/0xFF 时 1360 个 int32 整份未写；T1=batch×maxSeqlenQ 为 1024 倍数且 cmpTopk>0、cmpMaskMode==0 触发。
  visibility: 静默错误
mitigation:
  detect: metaData 预填两种互斥 canary（0xA5A5A5A5 / 0x5A5A5A5A）各跑一次，比对是否被写；扫 T1=1023/1024/1025/1040。
  fix: '待定（issue #7581 open；master 新增 ShouldUseFd 分支但空调度仍静默成功，需按 master 复测触发组合）'
