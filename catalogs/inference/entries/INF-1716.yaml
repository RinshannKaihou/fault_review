original:
  mechanism: 'ops-transformer issue #3681（2026-07-08，arch35 ascend910b/ascend950，closed）：FlashAttention infer 在 TND 布局下，CombineSplitKVRes 计算 lseOffset = (bIdx*n2Size + n2Idx)*gSize + ... 时使用绝对 bIdx。TND 下一个 batch 的 Q 起点是累积有效 S1，而部分 batch 的 S1=0 不占序列，绝对 bIdx 与累积偏移不再相等，有效 batch 的 lseOffset 越界写到缓冲区之外，对应位置的 LSE 保留为预填的 inf（3e+99）。同路径的 attenOutOffset 已有 TND 处理，lseOffset 遗漏。复现：TND、B=6、Q cumulative seqlen=[1,1,1,1,1,2]（batch1-4 的 S1=0），开 isSoftmaxLseEnable，输出 LSE shape[2,10,1]，batch5 的 10 个点为 inf。修复方案为新增 lseBatchOffset，TND/NTD 下取 actualSeqQlenAddr[bIdx-1]。补充 issue #3682 报告仅修 S1=0 分支后，不同长度 sequence 在 combine 阶段仍可能算到同一 LSE 区域互相覆盖。'
  source: 2026-07-08 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/3681 （closed）
  behavior: TND 打包多条序列、其中有空 batch 时，打开 LSE 输出会看到部分 batch 的 LSE 整段是 inf（3e+99，即未被写过的预填值），而 attention_out 数值正常、调用过程无异常无日志；只有当序列里夹了 S1=0 的无效 batch 且开了 LSE 才出现。
  trigger_surface: TND 布局 + isSoftmaxLseEnable + 存在 S1=0 的 batch（BSND/BNSD 不受影响）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
