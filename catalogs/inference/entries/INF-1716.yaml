id: INF-1716
legacy_ids: []
slug: fa_tnd_lse_offset_uses_abs_bidx
aliases: []
title: FA TND 布局 lseOffset 用绝对 bIdx 越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: CombineSplitKVRes
  behavior: CombineSplitKVRes 的 lseOffset 按绝对 bIdx 计算，TND 下应改用累积有效 S1；S1=0 的 batch 使有效 batch 偏移越过 LSE 缓冲区。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: TND、B=6、Q cumulative seqlen=[1,1,1,1,1,2] 开 LSE 时，batch5 的 LSE 未写入而保持预填的 3e+99（inf）；attention_out 正常，调用无报错。
  visibility: 数值异常
mitigation:
  detect: TND 下构造含 S1=0 batch 的多 batch 用例并开 isSoftmaxLseEnable，检查 LSE 是否为预填哨兵值
  fix: issue 给出方案：新增 lseBatchOffset 参数，TND/NTD 下取 actualSeqQlenAddr[bIdx-1]；是否合入未核实（#3682 补充报告不同长度 sequence 仍会互相覆盖）
