original:
  mechanism: 'cann/ops-math aclnnGcd 在 Atlas A3（910_93，CANN 9.2.0，master 1d0e7bab）上 INT16 计算时，元素数 ≥3 且同张量内取值不一致时部分元素返回错误 gcd（issue #4325 实测）：最小复现 3 元素 int16 self=[1,12,12]、other=[16384,18,18]，期望 [1,6,6]，实测 [6383,6,6]，连续 3 次执行一致（确定性错误）。错值形态恒定：|较大操作数|−a×10001（a=1→b−10001 等），如 (1,16384)→6383、(2,32767)→12765、(3,32767)→2764；6383 不整除 1 也不整除 16384，非合法 gcd。INT32 用 140 组边界+4096 组随机全对，INT64 全对。与元素数和内容相关：同一对 (1,16384) 在 1/2 元素或全相同取值张量里正确；4096 元素 a∈[1,20]、b∈[1e3,32767] 随机组合错 108 条（2.6%），小集合混合取值错 1263 条（30.8%），a,b∈[1,300] 全对。两段式返回 0 属静默脏数据。资料声明 A3 支持 INT16。根因未定位（报告者给出形态规律，未给出 kernel 源码结论）。'
  source: GitCode issue https://gitcode.com/cann/ops-math/issues/4325 （open，2026-10-30 创建；含自包含 C++ 复现脚本与 3 次一致实测输出）
  behavior: 在 A3 上对 int16 张量求逐元素最大公约数：只要张量元素数≥3 且取值不一致，部分元素的结果就是错的，例如 gcd(1,16384) 算出 6383（正确是 1），错误值恒等于较大操作数减去 a×10001；同一对数值放进 1、2 元素张量或全部取值相同的张量却是对的，换成 int32/int64 也全对。接口不报错，上层拿到的是静默脏数据，混合取值小集合错误率可达 30.8%。
  trigger_surface: cann/ops-math gcd；INT16；Atlas A3（910_93）；元素数≥3 且同张量取值不一致。
  signature: gcd(1,16384)=6383（=16384−10001）；错值形态 |b|−a×10001。
