original:
  mechanism: ttnn.experimental.slice_write 对 row-major BLOCK_SHARDED L1 输入写 interleaved 张量，两种失败均源于分片输入工厂的 per-core 偏移：① 输入分片行（shard 宽×元素大小）非 16 字节倍数时无报错返回但值错——bf16 [1,2,4,8] 在 [4,4] 分片、2x2 网格（8B 分片行）写 L1-interleaved 同形张量，64 值 32 错且全在第二分片列；24B 分片行同败；16B 分片行与 8B 行 HEIGHT_SHARDED 输入精确。系统扫描：8/12/14/18/20/24/28/30/36B 分片行（bf16 与 fp32，各 3/3 进程）恰好半数输出错，16/32B 行精确。② offset 分片网格可不返回：bf16 [1,1,64,96] 在 [16,48] 分片、核 (1,1)-(2,4) 写 DRAM-interleaved 3/3 次不返回（同调用在 (0,0)-(1,3) 网格或 DRAM-interleaved 输入下精确）。复现于单 Blackhole、main f5985995a。来源 https://github.com/tenstorrent/tt-metal/issues/63683（open，2026-11-01，tt-robot 报告）。
  source: 2026-11-01 每日扫描。https://github.com/tenstorrent/tt-metal/issues/63683
  behavior: 在 Tenstorrent 上用 ttnn.experimental.slice_write 把 row-major BLOCK_SHARDED L1 张量写进 interleaved 张量：只要分片行字节数不是 16 的倍数（如 bf16 8B/24B 行），调用正常返回、无报错，但输出恰好一半的值是错的（错的全在后面的分片列）；把分片放到带偏移的核网格上还会直接卡住不返回。16/32B 对齐行、HEIGHT_SHARDED 或 DRAM-interleaved 输入则完全正确。
  trigger_surface: tt-metal main（f5985995a）；单 Blackhole；ttnn.experimental.slice_write row-major BLOCK_SHARDED 输入、分片行非 16B 倍数（错值）或 offset 核网格（挂起）
  discovery: 2026-11-01 每日扫描
