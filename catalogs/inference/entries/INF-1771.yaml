original:
  mechanism: aclnnQuantLightningIndexerV2，Atlas A2（Ascend910B2）、CANN 9.2.0、torch 2.12.0+cpu、torch_npu 2.12.0.post3，ctypes 直调两段式。B=1,S1=64,N1=64,N2=1,D=128，q[1,64,64,128] int8、k[2,128,1,128] int8（容量 2×128=256，block 0/1），block_size=128、topk=64、quantMode=2、layoutQ=BSND、layoutK=PA_BBND、maskMode=0，metadata 由 aclnnQuantLightningIndexerV2Metadata 生成。缺陷一 seqused_k 无上界校验：tiling.cpp 仅查非空+dtype（约 L573/588/607/621），blockCount_ 取 key dim0（约 L987）不与 seqused_k 比较。实测：seqused_k=257（窄表 [0,1]）→ 执行期 aicore exception 507015；=512（宽表 [0,1,0,1,0,1,0,1]）→ 静默返回越界索引 max 508、≥256 元素 2048 个；=999 → max 997、3029 个。缺陷二 block_table 无数值上界校验：tiling.cpp 只查存在性/dtype/维度（约 L569/581/761-765）与 dim0==B（约 L1057），从不读取数值。[0,5]（block_num=2）→ ret 0/0，输出与合法组 [0,1] 有 4075/4096 元素不同（确实按不存在的 block 5 寻址参与计算）。影响：下游 sparse attention 拿到不存在于 KV 的 token 索引（静默错误结果）；窄表场景直接打挂 kernel 属设备级故障。
  source: 2026-10-20 每日扫描；https://gitcode.com/cann/ops-transformer/issues/6359 ；https://gitcode.com/cann/ops-transformer/issues/6360
  behavior: 调用 QuantLightningIndexerV2 时把 seqused_k 写得超过 KV 实际容量、或 block_table 里填了超出 block 数的块号，第一段 GetWorkspaceSize 仍返回成功：宽 block_table 时算子静默返回指向不存在 token 的索引（最大可达 997 而容量只有 256），下游 sparse attention 按这些索引算出错误结果；窄 block_table 时同一越界直接引发 aicore 异常打挂设备。block_table 填 [0,5] 而实际只有 2 个 block 时输出与合法输入差 4075/4096 个元素，全程无告警。
  trigger_surface: Atlas A2 + aclnnQuantLightningIndexerV2 + seqused_k 超 KV 容量或 block_table 值 ≥ block_num
  discovery: 2026-10-20 每日扫描
