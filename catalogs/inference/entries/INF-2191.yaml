    component: FIA V5 BSND D=512 分支
  behavior: D=512 且 BSND/BSH、32<S<64 时尾块/分核搬运只写前 32 行输出，其余行不写，两段返回 0
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: attentionOut 除前 32 行外保持调用前内存（金丝雀 3.0/-7.0 均保留），S=63 时 31432/32256 元素错、max_abs=5.24；BNSD 同内存对照正确
  visibility: 静默错误
