original:
  category: cat11
  section: 第 11 类 · 解码 / 采样故障（多为 post-forward — 结构性盲点）
  meta: '`infra_off`（vLLM `DSparkSpeculator` 默认 `sample_from_anchor=True`（native DSpark 布局：anchor 是首个**被预测** token）；DeepSpec 训练的 DSpark drafter 若为 DFlash 式 **fill-in 布局**（`1+N` query 位、anchor 充当 bonus token、每个非 anchor 位是待填掩码槽），其 config 中**可选字段 `sample_from_anchor` 缺失**（该字段 2026-07-13 才加入 speculators #760、默认 DSpark=True/DFlash=False，vLLM #48639 于 07-20 接线；早于该字段或绕过 config dump 的导出路径仍产出无该键的 config）→ 加载器无从判别布局、按默认方向**静默解析**：anchor 位输出被当作被预测 token 消费、后续每位都条件于错误上下文。实测 vLLM 0.27.1 服务健康 checkpoint 接受率 **~0.9%**，全程零错误零警告；两个独立导出路径的 checkpoint 均中招） · Cov: `NEW`（draft checkpoint 布局元数据缺失 → 服务端默认值静默选错采样语义子签名） · 触发 `config` · 置信度 `verified`'
  mechanism: 布局旗标是**可选**序列化字段，新旧导出路径并存使键缺失不代表 native 布局；加载端没有布局探测/校验手段时，配置歧义按默认值消解——默认方向恰与 fill-in 布局相反，anchor token 语义（预测值 vs bonus）被反转。
  source: 'vLLM #56792（2026-09-14 open，含 0.9% 接受率实测、字段演进时间线（speculators #760 → vLLM #48639）与两条无键导出路径说明）。https://github.com/vllm-project/vllm/issues/56792'
  behavior: 无 crash、无 NaN、零警告——draft 几乎全拒（<1% 接受），推测解码退化为纯开销（吞吐≈无 spec 还更差）；输出仍正确（target 验证兜底）故精度评测不暴露，只有接受率指标可见。12.31/12.35（量化 DFlash draft 0% 接受）之后"0% 接受家族"新成员：本条根因不在数值损坏而在**配置模式缺省方向**——silent-failure 面在元数据层。
  trigger_surface: vLLM + DSpark speculative + DeepSpec/DFlash fill-in 布局导出的 drafter checkpoint（config）
  discovery: |-
    2026-09-14 每日扫描。
