  mechanism: 存在两种由固定置换关系联系起来的 RoPE 约定——Meta-LLaMA/GPT-J 的 "interleaved"（相邻维度成对）与 HF/GPT-NeoX 的 "half-split"（rotate_half）。故障是：跨约定移植权重时**没有**对 q/k 的维度做相应置换，于是每一次旋转都被作用到了错误的维度配对上。这不是缩放错误，而是一个纯置换错误。
  source: 'HF transformers #25199；ChatGLM2-6B #414；zhihu p/647085112。'
  behavior: 非常严重——很快输出乱码/不连贯文本，相对位置信息被彻底打乱。
  trigger_surface: RoPE 相关配置
  signature: off-manifold 且尖锐：固定置换把旋转维度错配，geometric 度量会显示一个大幅度、层间一致的偏差。它与 theta 改变（缩放类 RoPE 故障）可区分，因为逐维误差幅度随维度索引是非单调的——误差模式跟随 interleave 置换的结构。因此逐维 spectral 度量能把它与 fault_rope 的平滑频率衰减区分开。
  repro: 在 attention 前向钩子里，对 q/k 的 head 维度施加 interleave↔half-split 置换，再执行 RoPE；单钩子即可完成，无需改权重。
