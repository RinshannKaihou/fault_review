legacy_ids: []
slug: ms_select_const_fold_broadcast_shape_loss
aliases: []
title: 常量折叠的 select 广播后形状与数值被破坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: mindspore
    component: Graph Const 常量折叠 select
  behavior: GRAPH_MODE 下 ops.select 输入为闭包常量且需广播时，前端 evaluator 错误收缩输出 shape，并把 -0.0 与 NaN 改写为 0.0。
effect:
  objects:
  - 数值结果
  detail: cond (2,1)、x (1,3)、y (2,3) 时 PyNative 与 Graph(Arg) 得 (2,3) 的 [[1,-0,nan],[4,-5,6]]，Graph(Const) 只剩 (1,3) 一行且 -0.0、NaN 全变 0.0。
  visibility: 静默错误
mitigation:
  detect: 把 select 的输入写成闭包常量跑一次 Graph(Const)，与传参版比较输出 shape 与逐元素值；shape 变小或 -0.0/NaN 被抹平即命中
  fix: 待定（issue open，无修复 PR）；方向：常量折叠复用运行时的 broadcast 推导，不要自行折叠 shape
