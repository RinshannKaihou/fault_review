original:
  mechanism: ops.select 的三条执行路径不一致：PYNATIVE_MODE 与 GRAPH_MODE 传参（Graph Arg）都会把 cond (2,1)、x (1,3)、y (2,3) 广播到 (2,3)，输出 [[1.0,-0.0,nan],[4.0,-5.0,6.0]]；把同一组常量写成无参 @ms.jit 的闭包输入（Graph Const 常量折叠）后，前端 evaluator 把输出 shape 错误地收缩成 (1,3)，并丢掉了真实数据——-0.0 与 NaN 都被改写成 0.0。issue 给的最小复现只用 numpy 构造这三个张量，环境为 CPU、Python 3.12 的 2.9/2.10，未说明内部哪个 pass 收缩了 shape。
  source: 2026-05-18 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29395 （open）
  behavior: 同一段 select 代码，只要张量是闭包常量而不是入参，编译后输出少了一整行（(2,3) 变 (1,3)），而且 -0.0 与 NaN 变成 0.0；下游按 (2,3) 取数就会越界或读到重复行，按数值判断分支则把 NaN 当成正常 0。传参版本完全正确，因此很难怀疑到编译期折叠。
  trigger_surface: GRAPH_MODE 下 ops.select 的三个输入都是闭包常量且需要广播（触发 Graph Const 常量折叠）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
