title: Reduce V2 大输出 axes=1 时整块不写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnReduceSumV2 等五算子
  behavior: experimental reduce V2 系列（Sum/Mean/Min/Max/Prod）在 axes=1、输出元素数达到各自阈值时，两段接口返回 0，out 完全未写。
effect:
  objects:
  - 数值结果
  detail: ReduceSumV2 ≥2304(fp32)/≥2050(fp16)、Mean/Min/Max ≥2304、Prod ≥4096 时 out 全保留 -777/0xDEADBEEF；R=2049 及以下正常；五份 kernel 独立实现。
  visibility: 静默错误
mitigation:
  detect: out 预填 -777/0xDEADBEEF，扫 R=2048/2049/2304/4096；读回仍为哨兵即命中。
  fix: 待定（两条 issue 均 open，未附修复 PR）
