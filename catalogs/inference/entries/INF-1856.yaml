title: 融合 slot-mapping 非环形组不补 PAD 位
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: compute_slot_mapping
  behavior: 融合多组 launch 共用一个 positions，负位置只在 circular 组换成 PAD_ID；非环形组把它当真实槽位，pos<=-block_size 时 block 表窗口还读出本请求行。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 混合 circular/non-circular 布局（DSV4.1 compressor 状态缓存 + MLA/SWA、GLM-5-Next tail + paged）喂负位置会得到错槽位；当前 MRV1 的 positions 非负，尚未在线触发。
  visibility: 静默错误
mitigation:
  detect: 直接调 compute_slot_mapping_fused_groups，构造 circular+non-circular 混合布局并喂负位置，检查各组是否都返回 PAD_ID；与 per-group _compute_slot_mapping_kernel 对比。
  fix: 待定（issue open）；方向：对非环形组同样把负位置写成 PAD_ID，因为 positions 由整个融合 launch 共享，无法按组约定调用方保证非负
