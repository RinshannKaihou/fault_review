original:
  category: cat10
  section: 第 10 类 · 分词器 / 对话模板故障
  meta: '`infra_off` · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
  mechanism: 检查点被配上了一个与训练时 vocab / id 映射不同的 tokenizer（例如 OPT 的 config 里 bos_token_id=0，而 tokenizer_config 里 bos_token=`'</s>'`→2；或把 Llama 的 tokenizer 用在 Mistral 上）。结果是 embedding 的每一行都对应到了错误的 id。
  source: 'HF transformers #17431, #18268。Survey arXiv:2506.09713。'
  behavior: 彻底的垃圾输出 / 严重不连贯——每一个 embedding 行与 head 行在语义上都是错位的。
  trigger_surface: tokenizer/template 选择
  signature: STRONG off-manifold：每一个 token 位置都被污染。整句相对健康流形的 geometric 距离会飙升；廉价的逐层范数 / statistical 离群检测在所有位置上都会报警。它是本族中最 off-manifold 的成员，几乎没有检测器会漏检；反过来说，它对区分检测器灵敏度的价值不大，更适合作为上界参照。
  repro: 有两种等价做法——对 embedding 行做置换/重标注，或在输入侧把 token ids 按一个错误映射表重映射后再喂入。
