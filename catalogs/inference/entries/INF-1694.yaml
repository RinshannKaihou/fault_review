original:
  mechanism: 'Ascend/pytorch #5236（2026-09-29，open，triton_experimental 后端）：在 FlexAttention 的 Q_LEN < KV_LEN 不等长 causal backward 中，没有被任何 query 访问的 KV 尾部会保留未初始化梯度。典型场景 Q_LEN=384、KV_LEN=512，KV 位置 [384:512] 没有 query 访问。根因是实验后端反向模板直接写入 empty_strided 分配的 dK/dV，不可达的 KV block 没有可靠写入，导致尾部梯度不确定（取决于分配器返回的旧内存内容）。修复方案：lowering 阶段预清零 dV 输出；模板跟踪 KV block 是否存在 query block；无 query block 时把 dK 置零并跳过 dV 写回，保留预清零结果；并增加不等长 causal backward 回归测试。验证：迁移到独立目录后的 FlexAttention 专项测试 11 passed。'
  source: 2026-09-29 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/5236 （open）
  behavior: 用 triton_experimental 后端对 Q_LEN=384、KV_LEN=512 的不等长 causal 场景做反向，KV 位置 384 到 511 这一段（没有任何 query 能看到的尾部）的 dK/dV 是不确定的：每次跑可能不一样，取决于这块显存之前被谁用过。它不报错也不 NaN，梯度看着是正常浮点数，但训练时这部分 KV 的梯度是垃圾，会把模型往错误方向推。修复后同一专项测试 11 项全过。
  trigger_surface: FlexAttention + causal + Q_LEN < KV_LEN（存在无 query 覆盖的 KV 尾部 block）+ triton_experimental 反向
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
