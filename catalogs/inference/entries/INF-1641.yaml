cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: ACLNN cache queue 配置
  behavior: 旧 gate 62791fd0 在默认 aclnn_cache_queue_length 下 DSA1 的 indexer_loss/grad_norm 快速放大，置 queue length 0 后消失
effect:
  objects:
  - 训练信号
  detail: 固定 step21 checkpoint 续训到 step70，indexer_loss 与 grad_norm 快速放大，主语言模型 loss 不受影响；换新 gate 9c330863 后默认配置即与关队列逐 step 一致
  visibility: 静默错误
mitigation:
  detect: 固定 checkpoint 跑 DSA1 长轨迹，比对 indexer_loss/grad_norm 轨迹；切换 ACLNN cache queue 长度做 A/B
  fix: 升级到修复该 runtime cache 问题的 MindSpore gate 版本（正文 9c330863），或 export MS_DEV_RUNTIME_CONF=aclnn_cache_queue_length:0 规避
