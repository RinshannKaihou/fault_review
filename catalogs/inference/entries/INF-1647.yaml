title: 同 program store 后重读返回损坏值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 同程序 store→load 保序
  behavior: 同一 program 内 tl.store 写 output_ptr 后立即从同一地址 tl.load，读回的不是刚写入的值（损坏且每次不同）；把归一化拆到第二个 kernel 就完全正确。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: FlagGems top-k 带 renormalize：sum_err 1.61e10、ref_err 3.18e9、repeat_diff 3.05e9，ids 仍全对；0 次重读时 2.38e-07，1 次重读即坏，重读越多越差。
  visibility: 不可复现
mitigation:
  detect: 对“同一 program 内写后重读”的 kernel 做重复运行比较（repeat_diff）与只读回第 N 个值的消融；把归一化拆成第二 kernel 作对照
  fix: 规避=把依赖刚写入值的计算拆到第二个 kernel（issue 内已验证 repeat_diff=0）；根因落在 backend/triton-adapter-opt/bishengir/runtime 尚未定论（closed）
