id: INF-1613
legacy_ids: []
slug: sgl_kernel_npu_recompute_w_u_equal_len_batch_index
aliases: []
title: recompute_w_u 等长路径 batch 索引恒 0 静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: sglang
    component: wy_fast recompute_w_u
  behavior: 等长分支（cu_seqlens=None）由 i_bh//H 求 batch，i_bh∈[0,H) 故 i_b 恒 0；beta/g_cumsum 已是 [B,H,T]，偏移仍按 [B,T,H] 加 bos=i_b*T，少乘 H。
effect:
  objects:
  - 数值结果
  detail: B>1 且 cu_seqlens=None 时多个 batch 的结果都落在 batch 0 的位置并互相覆盖，beta/g_cumsum 也读错 head 的行；不报错、无 NaN，只有与参考逐元素比对才可见（issue 附 assert_close 复现）；服务全走 varlen 不触发。
  visibility: 静默错误
mitigation:
  detect: 对 B>1 的等长输入单独跑一份与 CUDA/eager 参考的逐元素对比；varlen 用例覆盖不到这条分支
  fix: 'issue 给出补丁：i_b=program_id(1)、i_t=i_t_o、bos_bh=i_b*H*T_max，并合并 #690 的 i_t 修复（open，未发布）；vllm-ascend 同源缺陷见 #14333'
