- url: https://github.com/sgl-project/sgl-kernel-npu/issues/709
  kind: github_issue
relations: []
original:
  mechanism: 'python/sgl_kernel_npu/sgl_kernel_npu/fla/wy_fast.py 第 42-71 行 recompute_w_u_fwd_kernel_npu_kernel（sgl-kernel-npu main 分支，Ascend 910C / Atlas 800I A3）：等长分支写成 for i_bh in range(H): i_b, i_h = i_bh // H, i_bh % H，而 i_bh 取值只有 [0,H)，故 i_b 恒为 0；kernel 的 launch grid 是 (NT,B)，真正的 batch 下标在 tl.program_id(1)。同函数 recompute_w_u_fwd_npu 在调用前把 beta、g_cumsum 转置成 [B,H,T]（transpose(1,2).contiguous()），但 kernel 内偏移仍是 g + bos + i_h*T_max + global_offs_t 且 bos=i_b*T，按 [B,T,H] 语义算，缺 i_b*H*T_max 这一项。修法是 i_b=tl.program_id(1)、bos_bh=i_b*H*T_max，并合并 #690 里 i_t 未初始化的修复；同一 kernel 三个 bug 相互关联，vllm-ascend 有同源三处。'
  source: 2026-08-16 GitHub sgl-project/sgl-kernel-npu issue https://github.com/sgl-project/sgl-kernel-npu/issues/709 （open）
  behavior: 自己拼等长 batch 调用 recompute_w_u_fwd_npu（cu_seqlens=None、B>1）时，返回的 w/u 与参考不符但没有任何报错：多个 batch 的结果写到 batch 0 的位置并互相覆盖，beta/g_cumsum 读到别的 head 的行。SGLang 服务路径总传 cu_seqlens（packed varlen），所以线上不出现；离线脚本或自研推理栈会静默拿到错值，通常靠 loss 异常或逐元素对比才发现。
  trigger_surface: sgl-kernel-npu fla wy_fast recompute_w_u 等长分支（cu_seqlens=None）+ B>1；910C 实测
