original:
  category: KV1
  section: KV §1 value-corruption（值损坏）
  meta: '`ambiguous` · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: cascade attention（共享前缀 pass + 后缀 pass，通过 `merge_attn_states`/LSE 合并）从未把学到的 sink 张量传入任何一个子 pass，因此对带 attention sink 的模型（GPT-OSS）而言，合并后的 softmax 分母是错的。该路径只在 prefix caching 启用 cascade 时才被走到，所以故障是被服务配置门控的，而不是常开的。
  source: 'vLLM PR #26203（修复把 sink 加入 cascade 路径，约 `flash_attn.py:795`）。'
  behavior: GPT-OSS-20B 的 MMLU-Pro 在开启 prefix caching 时约 0.68→0.58；退化的重复循环只在 cascade 路径上出现，非 cascade 路径不出现。
  trigger_surface: vLLM cascade attention 路径；需开启对应 backend/模型
  signature: '`ambiguous` —— 签名只在「prefix caching 触发 cascade 路径 × 模型带 learned sink」这一组合下出现；一旦触发则表现为 infra_off：缺失的 sink 过度加权非 sink token，导致注意力熵坍缩、受影响层的注意力后残差范数被抬高，且 cascade 与非 cascade 之间的差距随前缀长度扩大。可捕获的是 statistical 族（注意力熵、残差范数离群）与 geometric 族（相对非 cascade 参考的方向偏离）；trajectory 族的逐层平滑度会漏检（每层的偏移是同向的、平滑的），cheap 族除非并发变化改变 cascade 命中率，否则也看不到。'
  repro: 无 learned sink 的标准模型上只能做「softmax 分母缺项」的近似：在目标层 self-attn 的输出 hook 上，按缺失 sink 质量对应的比例 `(Z+e^s)/Z` 重新放大并归一化注意力输出，模拟分母少算一项。因此可软件复现性为 partial：能复现分母错误带来的熵坍缩，但复现不了真实的 prefix/suffix 两段式合并结构。
  locus: value-corruption
  priority: low
