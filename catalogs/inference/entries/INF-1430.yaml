cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: PoolKeyIndexer 空 work 初始化
  behavior: DSA-CP 使本地分片有 query 但无已完成 pooled key 时，PoolKeyIndexer 进入空 work 初始化路径，向 TND 输出分配之外写入
effect:
  objects:
  - KV状态
  - 模型权重
  - 输出内容
  detail: 孤立空 history 用例报非法写；模型中无关缓存权重变 NaN、请求输出重复 '!' 或非有限 logprobs
  visibility: 数值异常
mitigation:
  detect: 空 local history / 零 query / 全 padding replay 回归；mssanitizer 守护 indexer
  fix: PR https://github.com/vllm-project/vllm-ascend/pull/19073 （main）/ https://github.com/vllm-project/vllm-ascend/pull/19084 （v0.30.0）（均 open）：附加哨兵请求提供有效 work、空 pooled history 钳到 1 个有效物理池、以原始 positions/请求边界丢弃哨兵与合成 history；11 个 A3 精度/集成用例通过
