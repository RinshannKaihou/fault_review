original:
  category: KV9
  section: KV §9 跨 LLM 来源补充（GLM + Kimi 社区文档）——全部经 `gh` 核实
  meta: '`infra_off` · Cov: `NEW (recovered)` · 触发 `partial` · 置信度 `verified`'
  mechanism: 这是一个**合并条目**，聚合了三个位于边界的推测解码 KV **槽/索引**故障：(a) 长序列上 MTP 触发非法内存访问（KV slot over-run，槽越界）；(b) DeepSeek-V4 EAGLE 草稿路径中 `req_pool_indices`（形状 `[num_reqs]`）与 `out_cache_loc`（形状 `[num_reqs*num_spec_steps]`）形状不匹配；(c) MTP 草稿接受率在**特定上下文大小**处坍缩——该位置恰为 KV slot 边界，修复方式是为 GDN 模型允许**部分 `seq_rm`**。
  source: 'vLLM #40756（OPEN 2026-04-24）；SGLang #24747（CLOSED 2026-05-09）；llama.cpp #23658（CLOSED 2026-05-25）+ #22400（GDN 的部分 `seq_rm`）。*（这三者曾被回填代理错误排除，均已 `gh` 确认为真实——见本节开头的引用溯源说明；"DSv4" 是真实的截止后模型。）*'
  behavior: (a)(b) 表现为非法内存访问 / 形状断言崩溃；(c) 表现为在某些上下文长度上草稿接受率突然归零、吞吐坍塌而输出仍"正常"。
  trigger_surface: 推测解码/CUDA graph：vLLM 可开，需接受率与 batch 场景
  signature: '**大多为崩溃/断言，没有隐藏态信号**——(a)(b) 属于响亮失败，任何隐藏态检测器都无用武之地。唯一带信号的是 (c) 接受率坍缩变体，且它是**行为性**信号（acceptance rate），而非隐藏态度量；其触发受上下文长度门控（恰好落在 slot 边界时）。检测面：geometric/spectral/trajectory/statistical/infotheoretic 全族对本条目基本无效；正确的防线是槽索引的形状/边界断言与接受率监控。'
  repro: 只能覆盖 (c) 的隐藏态侧后果——单钩子于某个上下文长度阈值处把一段 KV 置零/失效（模拟槽边界处 KV 被错误移除），并沿长度轴扫描以复现"仅在特定上下文大小处出现"的门控；(a)(b) 的崩溃语义不可软件复现。
  locus: control-flow
  priority: low
