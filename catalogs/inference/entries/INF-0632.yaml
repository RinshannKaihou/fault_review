  meta: '`infra_off`（vLLM main（5be911e，2026-09-15）+ GLM-5.2-NVFP4-FP8（GlmMoeDsa，DSA sparse MLA，index_topk 2048）+ 2×B300 TP2（TP4/TP8 同病）+ `hisparse_config` + HiSparseConnector（kv_both，host_pool_gib 32）BF16 KV：**每个 completion 从第 2 个生成 token 起全为 token 噪声**（六词 prompt 即中招），首个生成 token 与非 HiSparse 对照**完全一致**；同一 HiSparse server 上 `max_tokens:1` 链式 8 次逐 token 请求**完全复现对照输出**——prefill 完好、decode 的 host-mirror 读路径损坏。无任何日志（无错误/NaN/preemption），boot 行报告 HiSparse 激活；同请求重放与双次 reboot 均字节一致（确定性）。GSM8K 5-shot strict-match **0.0000 vs 0.9409**（TP4 FlashInfer sparse-MLA 早前扫测）。#56699（cudaErrorLaunchFailure）与 #56785（indexer capture crash，#56825 已修且在本次 checkout）为不同故障） · Cov: `NEW`（host-resident KV decode 读路径损坏·首 token 正确签名子签名） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 未定位（报告者以 prefill-only 链式请求与首 token 对照将故障隔离到 decode 侧 host-mirror KV 读路径）；候选包括 host 池取回的块布局/尺度错配、异步取回与 decode 调度的可见性时序。#56889（两节点 DEP8 + FP8 KV + P2P offload 同症状 GSM8K 0%、TP8 评论复现）经本最小复现确认为同根因——09-14 "组合变量过多留观"判定升级。
