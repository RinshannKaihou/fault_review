original:
  mechanism: triton main。loop unrolling pass 对空 tl.range 的 epilogue 处理错误：plain kernel（无 unroll hint）对空 range 正确返回初始值；loop_unroll_factor=2/4 时空 range 的展开 epilogue 仍执行迭代。实测表（期望 vs 无提示/factor2/factor4）：(-3,-1,-2)→0/0/1/9；(2,0,2)→0/0/-2/-12；(0,1,-1)→0/0/0/0（该组恰好正确）；(0,10,1)→45/45/45/45（非空 range 正确）。负步长空 range 全部受影响；TRITON_INTERPRET=1 下全部正确（解释器不走该 pass）。
  source: https://github.com/triton-lang/triton/issues/12525（四组边界对照表 + interpreter 对照）
  behavior: kernel 里写了可能为空的循环（负步长或边界交叉）并设置 loop_unroll_factor 后，空循环被展开的尾部代码照常执行：累加器多加不该加的项，输出静默出错；不设展开因子时同一 kernel 正确。
  trigger_surface: triton main + tl.range(lo,hi,step) 为空（负步长/边界交叉）+ loop_unroll_factor≥2。
  discovery: 2026-10-27 每日扫描
