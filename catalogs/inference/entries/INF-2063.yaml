id: INF-2063
legacy_ids: []
slug: vllm_ascend_mla_preprocess_msprof_shape_na
aliases: []
title: 自定义 handler 下发算子使 msprof 采不到 shape
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: msprof kernel_details 采集
  behavior: mla_preprocess 走 SetCustomHandler 直接跑 lambda，绕过 aclopCompileAndExecute，GE 不注册 tensor 元信息；msprof 里该算子 shape 为 N/A。
effect:
  objects:
  - 指标/日志
  detail: decode profiling 时，kernel_details 中 mla_preprocess_0_mix_aic 出现2028次、均值约103us、cube利用率约98%，但shape/OP State为N/A；无法确认batch/seq组合或按shape聚合。
  visibility: 静默错误
mitigation:
  detect: 导出 kernel_details.csv，检查自定义 handler 下发的算子行是否有 Input/Output Shapes 与 OP State
  fix: 报告给出方案：在 SetCustomHandler 的 lambda 前后用 aclprofRangePushEx + TENSOR_INFO 宏补 shape/dtype/format（参照 add_custom.asc），未给 PR
