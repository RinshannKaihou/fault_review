original:
  mechanism: vllm-ascend 的 csrc/mla_preprocess/mla_preprocess_torch_adpt.h 用 at_npu::native::OpCommand cmd; cmd.Name("mla_preprocess"); cmd.SetCustomHandler(lambda) 下发内核。OpCommand 有两条路径：有 customHandler 时直接调 lambda 返回，不走 aclopCompileAndExecute；只有后者会把 tensor 的 shape/dtype/format 注册给 GE。于是 msprof 采集到的 kernel_details.csv 里 mla_preprocess_0_mix_aic 的 Input Shapes/Output Shapes 为 N/A、OP State 为 N/A、Block Dim 为 0，而同一 Stream 上的 RmsNorm（102,6144;6144）、MatMulCommon（102,6144;128,6144）都正常带 shape。报告给出用 aclprofRangePushEx + aclprofEventAttributes(TENSOR_INFO) 在 lambda 外层补元信息的改法。
  source: 2026-04-27 github.com issue https://github.com/vllm-project/vllm-ascend/issues/9026 （open）
  behavior: 做 decode profiling 时，kernel_details 里能看到 mla_preprocess_0_mix_aic 跑了 2028 次、均值约 103us、cube 利用率约 98%，但 shape 一栏是 N/A；无法确认它实际吃的是哪个 batch/seq 组合，也无法按 shape 聚合，性能分析到这里就断了。
  trigger_surface: vllm-ascend + msprof profiling，算子经 OpCommand::SetCustomHandler 下发（mla_preprocess）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
