title: DynamicBlockQuant minScale=+Inf 致INT8饱和
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: aclnnDynamicBlockQuant
  behavior: minScale 只校验 <0；NaN 与 +Inf 均放行。+Inf 激活钳制分支后 1/+Inf=0，scaleOut=0，y 全部饱和到 INT8 上限；NaN 则静默退化为不启用上界。
effect:
  objects:
  - 数值结果
  detail: x=[8,256] fp16（1.0~4.0）、dstType=INT8、minScale=+Inf 时两段 rc=0，y=0x7f（127）、scaleOut=0；合法基线 y=0x20/0x77、scaleOut=0.0315；-1/-Inf 正确返回 561002。
  visibility: 静默错误
mitigation:
  detect: minScale 传 NaN/+Inf 的负向用例；断言返回 161002；检查 scaleOut 是否为 0 且 y 是否全为 INT8 上限
  fix: 待定（open；issue 建议用 isfinite 校验非有限值）
