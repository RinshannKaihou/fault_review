- url: https://github.com/vllm-project/vllm-ascend/issues/23399
  kind: github_issue
relations:
- kind: var
  target: INF-2154
pattern: PAT-INF-0214
original:
  mechanism: vllm-ascend v0.32.0rc1（fla_npu a5 镜像）、Ascend950DT×2、TP2、--enforce-eager 上跑 Kimi-Linear-48B-A3B-Instruct FP8（hybrid GDN/MLA，MLA 层用 v1 attention 后端 npu_fused_infer_attention_score_v2）。MLA KV 池用 torch.empty 分配，从未写的行残留 NaN；启动 warmup 也会把自己序列长度之外的块写成 NaN。投机验证步 FIA 以 input_layout="TND_NTD"、sparse_mode=3（bottom-right mask）、actual_seq_kvlen=<seq_len> 调用，kernel 按 mask 的 2048 宽跨度做块对齐读，越过 actual_seq_kvlen 读到这些未写行；被 mask 的 NaN 行仍参与 softmax，使整个 verify 输出变 NaN（16 head×4 token×512 维）。报告者逐 verify 步统计 layer 3 的 k_nope 视图：干净步 blkcounts=[0,0,0,0,0,0]，失败步 blkcounts=[79,80,63,45,35,75]、kvl=[26]、attn_nan=32768；q_nope/q_pe/k_pe 在所有用例 0 NaN，mask 无 NaN。首个请求落在 warmup 已写有限的块上所以干净，第二个请求拿到从未写的块就失败；关掉 drafting（0 个 verify 步）同一 workload 完全干净。
  source: https://github.com/vllm-project/vllm-ascend/issues/23399（open，2026-11-26，含进程内探针与逐块 NaN 计数）
  behavior: 用 MLA 模型开投机解码和前缀缓存时，第二个及之后的请求会在 verify 步整体输出 NaN：一次生成 4 个 token、16 个 head、512 维全部是 NaN，表现为空回复或乱码；第一个请求往往完全正常，因此很容易被误判为偶发。把投机关掉、或把 KV 池里含 NaN 的块先清零，同一 workload 立刻恢复正常，说明不是输入或权重问题，而是 attention 读到了序列长度之外的未写 KV 行。
  trigger_surface: vllm-ascend v0.32.0rc1、Ascend950DT×2、TP2、--enforce-eager；Kimi-Linear-48B-A3B-Instruct FP8 的 MLA 层、npu_fused_infer_attention_score_v2；ngram 投机 num_speculative_tokens=3（verify 批 4 token）、TND_NTD、sparse_mode=3；prefix caching 开或关均可复现。
  discovery: 2026-11-26 每日扫描
