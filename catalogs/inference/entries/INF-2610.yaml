id: INF-2610
legacy_ids: []
slug: fia_mla_reads_kv_beyond_actual_seq_kvlen
aliases: []
title: FIA MLA 读超 actual_seq_kvlen 致 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm-ascend
    component: FIA v2 分页 attention
  behavior: TND_NTD + sparse_mode=3 的 verify 批上，kernel 按 2048 宽 mask 块对齐读，越过 actual_seq_kvlen 读到 KV 池未写行 NaN，被 mask 的行仍经 softmax 传播。
effect:
  objects:
  - 数值结果
  - KV状态
  detail: Kimi-Linear-48B FP8、TP2、ngram num_speculative_tokens=3：第二个请求拿到未写块后 verify 输出 [16,4,512] 全 NaN；首个请求干净，关投机后恢复。
  visibility: 数值异常
mitigation:
  detect: 在 verify 步前读取 block_table 引用块的 k_nope 视图统计 NaN 行数，并与 attention 输出的 NaN 计数对照；把整池预热写满有限值后再跑可复现首个请求干净、后续请求失败。
  fix: 规避：decode 前把 block_table 引用块中含 NaN 行的块清零（已写行有限、不受影响）；issue open，未核实修复。
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-26'
remarks: 与 INF-2154（FlashInfer MLA 页尾 padding NaN 传入有效输出）共享「mask 之外的 KV 尾部 NaN 仍进入 attention」机制，本条为 Ascend FIA 按 2048 宽 mask 块对齐读、越过 actual_seq_kvlen 的形态。
