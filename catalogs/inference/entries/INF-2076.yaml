original:
  mechanism: 环境 hdk 25.0.rc1.1、vllm-ascend 0.13.0rc1、Qwen3-8B，启动命令为 vllm serve ... --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3 -tp 4 --async-scheduling。请求 tool_choice=required、stream=true、chat_template_kwargs.enable_thinking=true 时，流式响应只有思维链增量，最终没有 tool_calls；同一 payload 改成 stream=false，或在服务端去掉 --async-scheduling，都能同时返回 CoT 与 Tool Call。报告另一组交叉验证（Qwen3-32B + 关闭 thinking）在流式下还会直接抛 JSONDecodeError，因为解析出的工具调用片段本身不是合法 JSON，说明流式路径上解析出的片段既可能丢、也可能是坏 JSON。
  source: '2026-01-07 GitHub vllm-project/vllm-ascend issue #5683 https://github.com/vllm-project/vllm-ascend/issues/5683 （closed）'
  behavior: 接 agent 框架时把服务开成流式，模型明明在想调用工具（前端能看到它写了工具名和参数），但响应里 tool_calls 一直是空的，客户端只能拿到一段思维链；把 stream 关掉立刻恢复正常，很容易被误判成模型没学会调工具。
  trigger_surface: async scheduler（--async-scheduling）+ 流式 chat completions + reasoning parser + tool-call parser
  discovery: 2026-10-21 历史索引回填（tail 池顺序深读）
