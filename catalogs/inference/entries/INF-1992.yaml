original:
  mechanism: 'issue #10524 记录 vLLM 0.18.0 + GLM-5.1 接入 Claude Code 后偶现精度问题。复现方式是两个窗口同时执行 curl 脚本、或多进程并发请求，多次请求后有较大概率出现精度异常。报告给出的观察是：精度数据集单独测试得分正常，异常时偶现复读但没有乱码；当系统同一时刻两个 DP 上分别存在一长一短两个请求时大概率触发；出现精度问题时服务日志并未打印 mooncake transfer 失败；对同一请求再发一次精度恢复正常；v0.20.2 用相同方法测试暂未发现。报告未给出根因定位，只把触发面收敛到 DP 并发 + 长短请求混跑 + Mooncake。'
