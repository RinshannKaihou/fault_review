- url: https://gitcode.com/cann/ops-transformer/issues/4094
  kind: gitcode_issue
relations: []
original:
  mechanism: cann/ops-transformer issue 4094（2026-08-03，closed，Track A / P-011）。posembedding/rope_with_sin_cos_cache/op_kernel/rope_with_sin_cos_cache_f_bf16.h 约 L235 把 positions 直接当 cosSinCache 行索引，按 uint64 展开偏移，既没有 < maxSeqLen 上界也没有 >=0 下界检查；文档要求 positions < cosSinCache.dim0。复现：ops-transformer HEAD 4b3d39658e1d，build.sh --pkg --soc=ascend910b --ops=rope_with_sin_cos_cache 安装独立 vendor 后调用 aclnnRopeWithSinCosCache，positions [2] int64、query/key [2,64] float、cosSinCache [2,32]（maxSeqLen=2）、headSize=32、isNeoxStyle=true：合法 pos=0 正常，pos=100 与 pos=-1 的 GetWS/Launch/Sync 均为 0，exit 42。
  source: 2026-08-03 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/4094 （closed）
  behavior: 带 sin/cos 缓存的 RoPE 在 positions 越界或为负时不报错：内核把越界值当成行号去表里取 cos/sin，取到的是别的（或表外）位置的旋转角，q/k 被按错误角度旋转。输出形状、数值量级都正常，长上下文续跑或位置回绕时才看得出来，表现为注意力结果整体偏移。
  trigger_surface: aclnnRopeWithSinCosCache，positions 越界/负值
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
