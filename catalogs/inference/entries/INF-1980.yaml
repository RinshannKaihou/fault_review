id: INF-1980
legacy_ids: []
slug: rope_with_sin_cos_cache_positions_unchecked
aliases: []
title: RopeWithSinCosCache 不校验 positions 范围
kind: 故障
status: active
cause:
  objects:
  - subsystem: 位置编码
    stack: cann
    component: rope_with_sin_cos_cache
  behavior: positions 作为 cosSinCache 行索引按 uint64 直接寻址，内核无 < maxSeqLen 与 >=0 检查，host 侧也不校验取值
effect:
  objects:
  - 数值结果
  detail: positions=100（表长 2）或 -1 时 GetWS/Launch/Sync 全 SUCCESS，RoPE 取到表外行的 cos/sin，旋转角完全错但形状量级正常
  visibility: 静默错误
mitigation:
  detect: 构造 positions 越界（≥cosSinCache.dim0）与负值用例，断言接口拒绝；对拍同位置合法输入的 RoPE 输出
  fix: 内核取行前补 0 <= positions < cosSinCache.dim0 校验并在 host 侧提前拒绝；issue closed 未附 MR，未核实
labels:
  stage: N/A
  confidence: documented
