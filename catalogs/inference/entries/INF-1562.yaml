id: INF-1562
legacy_ids: []
slug: ops_math_im2col_div_rtn_int_narrowing
aliases: []
title: im2col div_rtn 以 int 承接 int64 商余数窄化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: aclnn_im2col.cpp div_rtn
  behavior: 模板 div_rtn 的返回类型是 T（调用处 T=int64_t），函数体内 q、r 却声明为 int，64 位商与余数被隐式窄化；dilation*(kernelSize-1)、2*padding 的乘法也无溢出保护
effect:
  objects:
  - 数值结果
  detail: padding/kernelSize/dilation 仅校验 >0 无上界，分子超过 INT32（约 2.1e9）时 outputHeight/Width 算错，推导出的 outShape 与实际 out 比对错乱：本应报错却通过，或合法输入被误拒
  visibility: 静默错误
mitigation:
  detect: 传大 padding/kernelSize/dilation 使分子越过 INT32 边界，比对 aclnn 推导的 outputHeight/Width 与 64 位参考计算；同仓 experimental 版实现可作正确对照
  fix: issue 给方案（closed，未见 PR 号）：把第 54-55 行的 q、r 改为 T，并参照 experimental/conversion/im2col 版本用 __int128/SafeMul 对分子乘法做溢出防护
