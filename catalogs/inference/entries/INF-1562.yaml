original:
  mechanism: conversion/im2col/op_api/aclnn_im2col.cpp:47-60 定义 template <typename T> static inline auto div_rtn(T x, T y) -> T，函数体内 int q = x / y; int r = x % y; —— 返回类型按 T（此处 int64_t）声明，中间商余却是 32 位 int，对 64 位商/余数做隐式窄化；:106-113 调用 div_rtn<int64_t>((inputHeight + 2*padding[0] - (dilation[0]*(kernelSize[0]-1)+1)), stride[0]) + 1 计算 outputHeight，同式算 outputWidth，其分子乘法（2*padding、dilation*(kernelSize-1)）也没有溢出保护。对照实现 experimental/conversion/im2col/op_api/aclnn_im2col.cpp:51-79 已改用 __int128/SafeMul，说明缺陷真实且修复方案已知。触发条件是 padding/kernelSize/dilation 只校验 >0、无上界，使分子超过 INT32 范围（约 2.1e9）。
  source: 2026-09-15 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3190 （closed）
  behavior: 给 im2col 传超大 padding/kernelSize/dilation（参数检查只要求 >0），outputHeight/outputWidth 被算成窄化后的错值，于是 outShape 和实际 out 的校验错位——该报参数错误的用例反而通过，或者合法输入被拒。算子不崩、不报 NaN，只是形状与数值口径静默偏掉。
  trigger_surface: ops-math conversion/im2col 的 aclnn op_api 通路；padding/kernelSize/dilation 使 (input + 2*padding - dilation*(kernelSize-1) - 1) 超过 INT32
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
