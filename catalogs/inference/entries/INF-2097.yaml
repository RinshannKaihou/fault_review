  family: infra_off
  trigger: config
  trigger_review: false
  trigger_note: MooncakeConnector V1 + 混合/Mamba/MTP KV 布局（多个逻辑 KVCacheTensor 视图共享同一对齐分配）；vLLM v0.28.0 与 vllm-ascend main 的兼容组合
  stage: N/A
