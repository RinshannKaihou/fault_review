id: INF-2097
legacy_ids: []
slug: mooncake_v1_kv_registration_from_logical_views
aliases: []
title: Mooncake V1 按逻辑视图注册 KV 区间而非物理基址
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: MooncakeConnector 注册区间
  behavior: _get_registered_kv_tensor_buffers() 遍历 kv_cache_tensors 并按 shared_by 解析层名，从最小逻辑张量地址起按描述符长度注册，没有回到物理分配的对齐基址。
effect:
  objects:
  - KV状态
  detail: 混合/Mamba/MTP 布局下同一分配被多个逻辑视图暴露（含对齐 padding 后的视图）时，注册的可能只是视图地址、同一 backing 被注册多次、或描述符长度被套到独立分配上，Mooncake 发布的范围与实际归属不符并多占注册条目。
  visibility: 静默错误
mitigation:
  detect: 打印每个 kv_cache_tensors 视图的地址与长度，与恢复出的对齐基址比对：同一 backing 应只在基址注册一次，独立分配应保持分离
  fix: 'issue 给出注册契约（按物理分配对齐基址、合并 aliases、独立存储分开、不用 shared_by 决定归属）；回归用例在 PR #15878 中被 skip，生产修复未随之提交（issue open）'
