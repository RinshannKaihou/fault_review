original:
  mechanism: aclnnQkvRmsNormRopeCacheWithKScale 在 M-RoPE + qQuantMode/kQuantMode=Mx 下，D32 block 的 amax 极小时 E8M0 scale 静默为 0。两条独立报告：#7646（Ascend950PR、CANN 9.3.0、master 6ba3026e）实测 a_b≤0x04600001≈2^-118.19 时 qScaleOptional/kScaleCacheRef 恒 0、qOut/kCacheRef 全 0x7E/0xFE，a_b=3.762e-37 时饱和 1536/2048，a_b=7.523e-37 时 0/2048；#7637（master 811b0f2e）实测 e_b>=-124 全对（3/3），e_b∈{-125,-126} 全部输出 0（2/2），e_b=-127 理论码字本就是 0。两报告边界不同，但都指向同一条 E8M0 编码路径未按资料 L219-239 的 max(-127,…) 处理极小 amax；是否同根因未经维护者确认。0x7E 为 FP8 E4M3FN 的 NaN 编码，说明 x/0 无保护。
  source: https://gitcode.com/cann/ops-transformer/issues/7637 与 https://gitcode.com/cann/ops-transformer/issues/7646 （均 open，2026-11-16）
  behavior: 当某一 D32 block 的激活幅度很小（RMSNorm 后 amax 约 1e-36 量级）时，量化 scale 被写成 0，qOut 与写进 kCache 的 FP8 字节全变成 NaN；接口成功、无日志，后续 attention 整块 NaN。混合精度 M-RoPE 推理在长尾小激活上会出现整段输出异常。
  trigger_surface: Ascend950PR + CANN 9.3.0；aclnnQkvRmsNormRopeCacheWithKScale；qQuantMode/kQuantMode=Mx；D=128、BlockSize=4、mropeSection=[22,12,10]；#7646 基线 6ba3026e，#7637 基线 811b0f2e。
  discovery: 2026-11-16 每日扫描
