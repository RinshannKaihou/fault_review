id: INF-2098
legacy_ids: []
slug: add_rms_norm_quant_tiling_global_residue
aliases: []
title: AddRmsNormQuant 全局残留致 tiling 模板漂移
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: AddRmsNormQuant tiling
  behavior: optionalUbNum_0/_1 为 TU 级全局，写点全在 hasScales2||hasBeta 分支内且无 else 复位，同进程残留值参与重算 ubFactor 并改变模板判定，tiling 不再由本次输入唯一决定。
effect:
  objects:
  - 性能/资源
  - 数值结果
  detail: 同一输入（[48,12000] fp16 不传可选输入）模板从 singleN/12224 漂移为 splitD/6880 或 4576；输出当前与 cold 逐 bit 相同、耗时差 <1.5%；前置调用换任意 shape 仍复现（进程级，排除 tiling 缓存）。
  visibility: 性能退化
mitigation:
  detect: export ASCEND_GLOBAL_LOG_LEVEL=0 看 kernel template 与 ubFactor：cold 进程 singleN/12224，warm 进程 splitD/6880 即命中。
  fix: 待定（建议 CalcOptionalUbNum 入口无条件复位或状态成员化，issue open 未见修复 MR）
labels:
  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: 需同进程先调用一次带 beta/scales2 的 AddRmsNormQuant（非 regbase 路径）
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
  stage: N/A
remarks: 与 INF-1767/1768 同仓不同算子不同缺陷点；当前表现为模板/ubFactor 静默漂移而非数值错误，但 tiling 决定性被破坏是实际观察到的行为（实测表），非推演。
evidence:
- url: https://gitcode.com/cann/ops-nn/issues/7006
  kind: gitcode_issue
relations: []
original:
  mechanism: norm/add_rms_norm_quant/op_host/add_rms_norm_quant_tiling.cpp:51-52 声明全局 uint32_t optionalUbNum_0=0/optionalUbNum_1=0；CalcOptionalUbNum() 的写点 :120/:123/:126 全在 if(hasScales2>0||hasBeta>0) 体内，无 else 复位（:118 注释「否则不做改变」）；:219/:232 在残留值>0 时重算 normalUbFactor/splitDUbFactor/singleUbFactor（分母加可选输入占用），:237/:241 模式判定随之改变并 SetTilingKey 选到不同模板。实测（910B2/CANN 9.2.0/torch_npu 2.12.0.post3，接口 torch_npu.npu_add_rms_norm_quant 非regbase路径）：同输入 [48,12000] fp16 不传可选输入，cold 新进程模板 singleN/ubFactor 12224；warm 同进程先跑一次带 beta 的调用再跑同一目标调用，模板变 splitD/6880（仅前置 beta）或 4576（四可选全开）；输出 y1/y2/x_out 与 cold 逐 bit 相同、耗时差 <1.5%。前置调用换完全不同的 shape（--warm-cols 128）目标 shape 仍被压成 splitD/6880，证明残留是进程级、与 shape 无关（已排除 tiling 缓存）。
  source: https://gitcode.com/cann/ops-nn/issues/7006（open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 使用者在同一进程里先用带 beta 或 scales2 的 npu_add_rms_norm_quant，再跑一次不传可选输入的同 shape 调用：开 tiling 日志会看到 kernel 模板从 singleN 变成 splitD、ubFactor 从 12224 掉到 6880 或 4576；换前置 shape 也复现，只有新起进程才恢复 singleN。输出数值当前逐 bit 不变、耗时差不到 1.5%，但 tiling 选择已经不再由本次输入决定。
  trigger_surface: Atlas A2（910B2）、CANN 9.2.0、torch 2.12.0+cpu/torch_npu 2.12.0.post3；非 regbase 路径；需同进程先执行一次带 beta/scales2 的调用。
  discovery: 2026-10-21 每日扫描
