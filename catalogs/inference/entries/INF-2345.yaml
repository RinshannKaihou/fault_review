original:
  mechanism: 'triton issue #12555（2026-10-30 closed，GB200 sm_100 cc10.0，Triton 3.3.1 broken / 3.5.0+ works）：num_warps=4 时误编译一个小 kernel：chunk 循环内 if i_t % num_householder == 0 的条件 tl.store（存储循环携带状态 tile）产出错误值，包括 i_t==0（tile 可证明全零）也存出非零；循环递推本身与同一 tile 的 epilogue store 正确，说明源语义无误、错误只影响循环内条件 store。同二进制 num_warps=2 正确；升级 Triton 3.5.0+ 后 num_warps=4 正确。最小化自真实下游失败 fla-org/flash-linear-attention#1594：chunk_gated_delta_product（g=None, num_householder>=2）输出错误。触发组合：sm_100 + Triton 3.3.1 + num_warps=4 + 循环携带条件 tl.store。'
  source: GitHub issue https://github.com/triton-lang/triton/issues/12555 （closed，2026-10-30 创建并关闭；含最小化 kernel 与 fla#1594 下游链）
  behavior: 在 GB200 上用 Triton 3.3.1 编译含「循环内条件写回状态 tile」模式的 kernel（如 flash-linear-attention 的 chunk_gated_delta_product）且 num_warps=4：写回的状态值错误（连首次迭代应写的全零都非零），线性注意力/递推类模型输出静默劣化；num_warps 改 2 或升级 Triton 3.5.0+ 即恢复，可作二分定位。
  trigger_surface: triton 3.3.1；sm_100（GB200）；num_warps=4；chunk 循环内条件 tl.store 循环携带状态；fla chunk_gated_delta_product 类 kernel。
  signature: num_warps 4 vs 2 输出分叉；i_t==0 存出非零。
  discovery: 2026-10-31 每日扫描
