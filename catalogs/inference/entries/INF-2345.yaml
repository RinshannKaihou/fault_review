id: INF-2345
legacy_ids: []
slug: triton_sm100_num_warps4_loop_carried_store_miscompile
aliases: []
title: Triton 3.3.1 sm_100 num_warps=4 误编译
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: sm_100 num_warps=4 代码生成
  behavior: GB200 sm_100 上 num_warps=4 编译时，chunk 循环内条件 tl.store（存循环携带状态 tile）产出错误值（i_t==0 可证明全零的 tile 存出非零）；递推本体正确。
effect:
  objects:
  - 数值结果
  detail: 同二进制 num_warps=2 正确、Triton 3.5.0+ num_warps=4 也正确；最小化自下游 fla#1594（chunk_gated_delta_product g=None num_householder>=2 输出错值）。
  visibility: 静默错误
mitigation:
  detect: 含条件循环内 tl.store 的 kernel 在 num_warps=4 vs 2 下输出对照；i_t==0 次应存全零可作金丝雀。
  fix: 升级 Triton >=3.5.0（issue 报告 3.5.0+ 已正确；无独立修复 PR 链接，closed 2026-10-30）
