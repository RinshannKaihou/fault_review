  meta: '`infra_off`（interpreter 把 bfloat16/float8 张量存为原始无符号整数位模式（numpy 无原生支持），`ReduceOps.sum()` 直接对该整数数据 `np.sum`——NaN 位模式（bf16 0x7fc0）被当普通整数求和、溢出结果重解释为 bf16，静默产出有限值而非 NaN；compiled 路径正确传播 NaN） · Cov: `var:ttmetal_argmax_comparator_nan_semantics_dtype_split`（1.151 NaN 语义域） · 触发 `partial` · 置信度 `verified`'
  mechanism: '存储表示（整数位模式）泄漏进计算语义：归约在错误的数据表示上整体执行。与 #10697/#10699（argmin/argmax 的 NaN 比较语义冻结）根因不同——#10699 未触碰 `_sum_combine`/`ReduceOps.sum`。修复 PR #11605。'
  source: 'triton-lang/triton #11604（2026-09-06 open，含 bf16 NaN 输入最小复现：compiled NaN vs interpreter 有限值）。https://github.com/triton-lang/triton/issues/11604'
  behavior: 无 crash——interpreter 静默吞 NaN（返回错误有限值）。与 1.174 构成「interpreter 数值语义不可作黄金基准」双子签名对：一个双舍入错值、一个吞 NaN；共同教训是 interpreter 与 compiled 的 dtype 表示路径不对称（bf16/fp8 无 numpy 原生支持走位模式旁路）。
  trigger_surface: Triton interpreter + tl.sum + bf16/float8 输入含 NaN（工具链触发；CPU 可复现）
  discovery: 2026-09-06 每日扫描。
