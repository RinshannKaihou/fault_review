  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`tritongpu-fuse-nested-loops` 第三形态：外层 `tt.flatten` 循环体内同时含 `scf.while` 与携带值的 `scf.for`——pass 在 MLIR 内断言死亡 `Assertion !NodePtr->isKnownSentinel()'' failed` → `RuntimeError: PassManager::run failed`；更大 kernel 上则产出 yield 操作数与 region successor 不匹配的 `scf.if` 被 verifier 拦截） · Cov: `var:triton_fuse_nested_loops_nondominating_assume_miscompile`（1.127/1.169 同 pass 第三形态） · 触发 `partial` · 置信度 `documented`'
  mechanism: '`constructLoopNest` 把 `scf.while` 当分析域边界并在该处重启，但 while 仍是外层循环体操作、`fuseOneLevel` 必须把它切进 prologue/epilogue——切分点出错（3.7.1 与 3.8.0 相同，sm_120 实测）。去掉 flatten / 去掉 while / 去掉内层携带值均可编译，两个内层循环顺序无关。与 #11519（无 llvm.assume）、#11601（hoist 越界）区分明确。'
  source: 'triton-lang/triton #11612（2026-09-06 open，含最小 kernel、TTGIR dump 与两种失败形态）。https://github.com/triton-lang/triton/issues/11612'
  behavior: 编译期 crash（fail-loud，PassManager 失败或 verifier 错误）——不产错误值但阻断 kernel 构建。FuseNestedLoops 第三形态：1.127 静默错值、1.169 非法访存、本条 pass 内部崩溃——同 pass 对不同循环形状的三种显形， flatten=True 路径的系统性不可靠。
  trigger_surface: Triton 3.7.x/3.8.0 + flatten=True 嵌套循环 + 循环体含 scf.while 与携带值 scf.for（kernel 结构触发）
  discovery: 2026-09-06 每日扫描。
