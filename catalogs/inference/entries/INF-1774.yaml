original:
  mechanism: tt-metal wormhole_b0 llk ckernel_sfpu_typecast.h 的 calculate_typecast_fp32_to_uint32()（:249）：尾数提取路径以指数（exp-=32…CC_LT0，即 lane 仅在 biased-exponent 移位结果满足条件时启用）门控，[2^31,2^32) 区间被排除在正确转换外，输出恒 2147483648。实测（emulated device + WH n150）：2^31 本身正确；2684354560(1.25·2^31)/3221225472(1.5·2^31)/4294901760/4294967040(最大 f32<2^32) 全部返回 2147483648，torch oracle 正确；[2^31,2^32) 内 192 个随机可精确表示 f32 192/192 全错、独立 960 值 960/960 全错；[0,2^31) 稠密干净（1073741824→1073741824、2147483520→2147483520）；0.0→0 对；-1.0→4294967295（与 torch wrap 一致）；inf→2^31（torch 0）、nan→2^31（双方未定义，完整性列出）；bf16 3221225472 同样塌缩。该 u32 函数在 d9c2c92d 与 HEAD（41590f40 era）间字节相同。
  source: 2026-10-20 每日扫描；https://github.com/tenstorrent/tt-metal/issues/61736
  behavior: 把 float32 或 bfloat16 张量转成 uint32 时，凡是落在 [2^31, 2^32) 区间的值——包括完全可精确表示、完全在目标 dtype 范围内的值——全部被写成 2147483648：整整一半的目标表示范围静默塌缩成一个数；2^31 以下全部正确。不是 0-1 ULP 的舍入差异，而是以 2^31 为清晰边界的错值缺陷，调用方无任何告警。
  trigger_surface: ttnn.typecast fp32/bf16→uint32 + 输入值 ∈ [2^31,2^32)（Wormhole/Blackhole SFPU）
  discovery: 2026-10-20 每日扫描
