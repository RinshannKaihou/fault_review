title: CPU PyNative推理态BatchNorm第二输出疑似未初始化内存
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: CPU BatchNorm 推理态
  behavior: CPU 上 is_training=False 的 BatchNorm 第二个输出（batch mean）在 PyNative 与 GRAPH_MODE 下不一致，报告者判断 PyNative 返回疑似未初始化内存。
effect:
  objects:
  - 数值结果
  detail: MindSpore 2.8.0 CPU 同一组输入：GRAPH_MODE 第 2 个输出 [0.,0.]，PYNATIVE_MODE 为 [0.16018087 6.242943] 且每次运行不同；第 0/2/3/4 个输出一致。
  visibility: 静默错误
mitigation:
  detect: 推理态 BatchNorm 的全部返回值在两种模式下逐元素比对；第二个输出非零且多次运行变化即为未初始化读
  fix: 待定（issue open，无修复 PR）；方向：推理态未使用的输出显式置零
