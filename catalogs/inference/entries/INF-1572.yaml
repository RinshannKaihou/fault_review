original:
  mechanism: MindSpore 2.8.0（CPU，Python 3.12）：Net 内 ops.BatchNorm(is_training=False, epsilon=1e-5, momentum=0.1, data_format="NCHW")，输入 x 为 (1,2,2,4)、scale=[1,-1]、bias=[0.5,-0.5]、mean=[0,1]、var=[1,4]。按 issue 脚本分别以 PYNATIVE_MODE 与 GRAPH_MODE 执行后逐输出比较：输出 0（归一化结果）、2、3、4 完全相同，输出 1（通常是 batch mean）在 GRAPH_MODE 下恒为 [0.,0.]，在 PYNATIVE_MODE 下为 [0.16018087 6.242943]，报告者据此判断 PyNative 返回了未初始化内存（garbage values）。issue 没有给源码定位与修复 PR。
  source: 2026-05-26 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29425 （open）
  behavior: 推理脚本解包 BatchNorm 的全部返回值时，第二个值（batch mean）在 PyNative 下是随机浮点数、每次进程不同，Graph 下是 0；因为没人看推理态用不到的字段，错误不会报出来，一旦下游拿它做统计或拼接就会把脏值带进结果。
  trigger_surface: ops.BatchNorm 以 is_training=False 在 CPU 上推理；解包全部 5 个返回值；PyNative 与 GRAPH_MODE 对照
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
