original:
  mechanism: Ascend950（0131 主线包）上跑 hccl allreduce 静态图，输入张量 131071 个 float32，而 GE 侧 HcomOpsKernelBuilder 打出的日志是 op[HcomAllReduce] get count[131200] success，随后 SetHcomOpParam 也以 count:[131200] 下发；131200×4=524800 字节恰好是 131071×4=524284 按 32 字节对齐后的尺寸，说明 count 由对齐后的字节数反推而不是用户元素数。workspace 计算同样按 count[131200] 得到 size[2099200]、mem size[2134016]。报告者预期日志应是 count[131071]。issue 已 closed，正文未给修复。
  source: 2026-02-10 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/154 （closed）
  behavior: 静态图里 allreduce 的输入元素数不是 32 字节对齐的整数倍时，算子实际按对齐后的元素数收发数据：日志里 get count 打印的是 131200 而不是用户传入的 131071，多出的 129 个 float 也参与 reduce。前 131071 个元素的结果仍然正确，所以从输出上看不出问题，只有对比通信日志或检查缓冲区边界时才会发现。
  trigger_surface: 静态图 HcomAllReduce + 元素数非 32B 对齐（131071×float32）；Ascend950
