original:
  mechanism: 'triton main。@triton.jit 的磁盘缓存键（TRITON_CACHE_DIR 内 compiled kernels 的 key，跨进程复用）遗漏多项改变编译结果的信息。issue 以 fresh cache dir 构造多组「两 kernel 仅一处信息不同」的对照：tl.constexpr 按名字读是对照组（在 key 内）；其余每组两个 kernel 同 key，第二个静默加载第一个的二进制——跨进程（编辑值后重跑）与进程内（工厂）均复现。与 #12428（helper 名 mangle 缺 pointer constness/namedtuple 字段名致同函数复用）为相邻但独立的两层键缺失。'
  source: https://github.com/triton-lang/triton/issues/12429（多组两-kernel 对照 + 进程内/跨进程复现）
  behavior: 修改 kernel 引用的一个全局值或常量后重新运行，程序仍执行旧编译的二进制：输出与代码不符但毫无提示；清空 TRITON_CACHE_DIR 才恢复。开发迭代与 A/B 实验中表现为「改了代码结果不变」，极易误判为数值问题。
  trigger_surface: triton main + TRITON_CACHE_DIR 复用磁盘缓存 + kernel 依赖的非常量信息（全局变量值、非常量访问的 constexpr 等）被修改。
  discovery: 2026-10-27 每日扫描
