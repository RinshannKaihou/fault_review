id: INF-1644
legacy_ids: []
slug: triton_ascend_make_block_ptr_leftover_dma_alias
aliases: []
title: make_block_ptr 余量 DMA 别名到下一个 head
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: make_block_ptr 载入越界
  behavior: make_block_ptr 的 leftover DMA 按满 tile 宽度取数：packed x[T,H,K]、K=60、BK=64 时 head 0 的 60:64 列就是同 token 的 head 1，别名值进入 tl.dot。
effect:
  objects:
  - 数值结果
  detail: QK=60 的 dot 变成 40060（4 个别名 lane 各贡献 100×100）；声明 shape=(T,K) 并开 boundary_check 会本地补零从而正确，说明错在余量未裁而掩码认为在界内。
  visibility: 静默错误
mitigation:
  detect: 把末维逻辑长度声明为真实 K 并开 boundary_check 复跑对比；或对未对齐（K*elem_size 非 32B 倍数）的块载入做边界哨兵值检查
  fix: 规避：shape 末维写逻辑 K + boundary_check=(0,1)，或把 K 对齐到 32 字节；issue 已 closed，未见修复 PR
