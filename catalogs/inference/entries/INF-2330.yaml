id: INF-2330
legacy_ids: []
slug: ops_nn_index_int_indices_out_shape_unchecked
aliases: []
title: aclnnIndex 整型索引不校验 out 形状，偏小静默截断偏大未初始化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnn_index CheckShape 缺失
  behavior: indices 为整型（int64/int32）时完全不校验 out 形状：CheckShape 只对输入做日志级提示（void 返回被丢弃），从头到尾没有检查 out。
effect:
  objects:
  - 数值结果
  detail: out 偏小（(1,4) vs 真实 (3,4)）两段返回 0、写出 4 元素后静默截断（self[1]/self[2] 丢弃）；out 偏大返回 0、尾部元素保持未初始化；out 零元素或末维失配同样返回 0 放行。资料要求应返回 161002。
  visibility: 静默错误
mitigation:
  detect: 调用前自行校验 out.numel() 与 indices 推导形状一致；用已知 self 检查读回元素是否完整。
  fix: 待定（issue open，未见修复 MR）
