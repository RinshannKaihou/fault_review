  meta: '`infra_off`（vLLM 上 Qwen3.8-Flash-Next 系统性产出畸形泰文——声调标记错位（เชน่）、双写 combining mark（อีีก/ครรับ）、字符替换（ปีใหม้/คริศต์）、sara am 丢失（คานวณ），12–18 处/1000 泰文字符 × 5 种 vLLM 配置；**同有效 QSA 预算下 llama.cpp 零缺陷**（130 样本 0 命中）——已排除 #54521 persistent_topk 非确定性与 QSA block 选择：栈特定的正字法损坏） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: '报告者从 #54521（非确定）拆分并系统排除：非确定性不是原因、QSA block 选择不是原因；GB10 sm_121 ×2 TP2、FP8、enforce-eager、indexer_budget=2048、模型卡采样参数（greedy 在该模型退化不可用于质量测量，故用 10 样本率）。prompt 长度阶梯（20,394→2,959 逐级）显示损坏率随长度变化。泰文是敏感检测器而非特例：~3× token/字符 + 大量近同 combining-mark 词元，微扰显形为可见断字而非无害改写。机制面未定（tokenizer 往返/采样/内核数值均未排除），栈间对照（llama.cpp 干净）把范围压缩到 vLLM 侧。'
  source: 'vLLM #54739（2026-09-01 open，GB10×2、7 种正确/错误词形对照表、prompt 长度阶梯、5 配置 × 130 样本、llama.cpp 对照）。https://github.com/vllm-project/vllm/issues/54739 · 拆分自：#54521'
  behavior: 无 crash——泰文输出系统性正字法损坏（正确词与错词对照固定），英文任务可能同源劣化但不可见；"另一栈同预算干净"是定位关键。属「**多语言正字法作为栈特定损坏的敏感检测器**」新子签名：与 10.39（python -O 裸 assert 静默输入损坏）同"输入侧微妙损坏"域，本条的检测器思想（高 token/字符比语言）可复用于其它栈对照排查。
  trigger_surface: vLLM + Qwen3.8-Flash-Next（GB10 sm_121 报告；FP8/QSA）+ 泰文等高密度 combining-mark 语言（模型+语言组合；llama.cpp 规避）
