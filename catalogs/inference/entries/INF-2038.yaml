id: INF-2038
legacy_ids: []
slug: vllm_ascend_kvpool_block_refcount_concurrent_hit
aliases: []
title: KV pool 并发同块命中后引用计数失配致引擎退出
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: pool_scheduler 加载
  behavior: 加载流程给池 block 分配/挂引用时没有处理「同一批 block 被多个并发请求同时加载」，block 归还 free 队列时引用计数未清零，下次 get_new_blocks 取到即断言 ref_cnt==0
effect:
  objects:
  - 可用性/进度
  detail: 单机 4×910B4 + AscendStoreConnector(mooncake) 下三个请求同时 kvpool_cached=7680，三条 load spec 相邻打印后 EngineCore 立即 fatal error 退出，请求全部失败
  visibility: 报错
mitigation:
  detect: 并发发出命中同一前缀的多个请求（日志里 kvpool_cached 相同），观察 free 队列中 block 的 ref_cnt 与 get_new_blocks 断言
  fix: 待定（issue 只给原因分析，未附修复 MR）
