original:
  mechanism: vllm_ascend/distributed/kv_transfer 的 AscendStoreConnector + pool_scheduler 加载路径：并发请求同时命中同一批 KV pool block 时（日志三条 load spec 均 kvpool_cached=7680、need_to_allocate=7680、load_async=False、use_layerwise=False），pool 加载流程在给 block 分配和挂引用时没有对「同一批 block 被多个并发请求同时加载」做正确的引用计数处理，某个 block 被释放回 free 队列时引用计数没有清零，下一次 get_new_blocks 取到该 block 就触发 assert ref_cnt == 0，EngineCore 当场 fatal error。环境：vllm 0.21.1rc1.dev399+g9090368b6、vllm_ascend 0.19.1rc2.dev505+gb05d46f04、MoonCake 0.3.8.post1、910B4×4、Qwen3.6、block-size 128、prefix caching + chunked prefill。
  source: 2026-06-25 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10922 （closed）
  behavior: 多并发打同一个前缀时，服务在几条 KV pool load spec created 日志之后直接 EngineCore encountered a fatal error 退出，正在跑的请求全部中断；单请求或串行请求不会触发，压测才必现，现场只能从 ref_cnt 断言的栈里看出是池子 block 的引用计数问题。
  trigger_surface: AscendStoreConnector 池化 KV + 多并发请求命中同一批 pool block
  discovery: 2026-10-21 系统扫描（sweep_2，issue created < 2026-10-07 历史索引
