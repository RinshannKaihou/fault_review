  mechanism: 'Ascend/msmodelslim issue #666（2026-10-31，commit db54eedb）：W8A8DynamicPerGroupFakeQuantLinear（msmodelslim/ir/w8a8_dynamic.py#L90）已注册 (int8_per_token, int8_per_group) 组合且 GPTQ 文档明确支持 per_group，但其 forward 调用的 int_per_group_dequantize（msmodelslim/ir/api/impl/int_quantization.py#L203）在反量化权重时缺少转置，per-group scale/offset 被应用到错误的元素分组。实测：同一 int8 权重、group_size=2 与 scale，W8A8 动态 IR 返回 [16,16,20,20]，W8A16 正确 per-group 反量化返回 [6,14,22,30]；输入全 1 的逐 token 激活量化精确，差异全部来自权重反量化布局。与 !883 的激活 reduce 轴问题不同机制。报告者注明：默认配方未必使用这一组合，不能断言默认一键量化受影响。'
