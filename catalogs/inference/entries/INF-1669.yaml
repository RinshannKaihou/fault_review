- url: https://gitcode.com/mindspore/mindspore/issues/29589
  kind: gitcode_issue
relations: []
original:
  mechanism: MindSpore 2.10.0 + CANN 9.1.0-beta.3 + Ascend 910B2：BF16 mint.baddbmm 使用 aclnnBaddbmm 默认计算模式时，self*beta 的 epilogue 舍入偏离 FP32 参考值。最小复现是 ones(3,16,16)、eye(16) 的 bf16 三元组配 beta=3.4445/alpha=-4.775，输出 [0,0,0] 位置得 -1.3359375，而 FP32 计算后仅舍入一次到 BF16 应为 -1.328125。固定 [1,768,768] 的 10 轮 Newton-Schulz 迭代用例中，最终 ||NPU-GPU||_F/||GPU||_F 为 0.0139853456，改用 CANN FP32-add 模式后降到 0.0041635453。PyNative 与 KBK 均可复现。
  source: 2026-08-07 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29589 （open）
  behavior: BF16 下算 baddbmm，单次结果只是最后一位差一点（-1.3359375 对 -1.328125），看不出问题；但这类算子常被放在 Newton-Schulz 之类的迭代里，误差逐轮累积，10 轮后相对偏差到 1.4%，换成 FP32-add 模式才降到 0.4%。全程无报错、无 NaN，只能与 GPU/FP32 参考逐元素比对才暴露。
  trigger_surface: Ascend 910B2 + bf16 的 mint.baddbmm（aclnn 默认计算模式），beta 为非精确系数；多轮迭代场景误差累积
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
