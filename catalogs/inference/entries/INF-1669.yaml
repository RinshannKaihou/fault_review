title: BF16 baddbmm epilogue 舍入偏离 FP32 参考
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: aclnnBaddbmm bf16 舍入
  behavior: Ascend BF16 baddbmm 走 aclnn 默认计算模式时 self*beta 的 epilogue 提前按 BF16 舍入，与 FP32 计算后只舍入一次的结果不同。
effect:
  objects:
  - 数值结果
  detail: 3x16x16 用例输出 -1.3359375（FP32 后舍入一次为 -1.328125）；[1,768,768] 上 10 轮 Newton-Schulz 迭代相对误差 0.01399，改 CANN FP32-add 后 0.00416。
  visibility: 静默错误
mitigation:
  detect: 对同一 bf16 baddbmm 用例与 FP32 参考计算比较；再对固定 [1,768,768] 做 10 轮迭代看误差累积，切换 CANN FP32-add 模式观察误差是否下降
  fix: 待定（issue open，无修复 PR）；方向：对无 self 广播的形状改用 CANN cubeMathType=4（FP32-add）保持 bf16 输入输出，广播场景回退显式 FP32 计算
