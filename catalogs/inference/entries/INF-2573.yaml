  detail: x fp32 NZ、dstType=3、y INT32、round 下两段 rc=0/0，y 的 1024B 缓冲 0x99 哨兵全保留；K=4/15/16/17/32/64 六点全零写出；ND 同数据输出 0x76543210 正确。
