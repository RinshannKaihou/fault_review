  behavior: NZ 通路 CalcTilingNz 只算、WriteTilingDataNz 只写 E/K/N/needCoreNum 四个标量，其余 22 个 uint32 全为 0；kernel numBlocks=40 发射成功，y 零字节写出。
effect:
