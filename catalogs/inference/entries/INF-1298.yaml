  trigger_surface: KV/前缀/FP8 相关：vLLM 配置可触发或强相关
  signature: '**块边界处的 off-manifold KV**。检测面：per-position 的 statistical KV-norm 离群（读到已释放的垃圾内存时）+ cross-request 签名余弦（读到另一序列的合法 KV 时）——两种后果的签名强度差异很大，前者数值离群明显、后者只在跨请求余弦上可见。geometric 族在块边界处有阶跃。触发受驱逐压力/并发门控，故生产环境中签名间歇出现；一旦触发即为硬 off-manifold。'
  repro: 单钩子于 cache 写入后，把某个连续块区间的 K/V 替换为（a）随机/未初始化数值或（b）另一条序列的 K/V，两种变体分别对应 UAF 的两类后果。
  locus: block-slot-alloc
  priority: medium
