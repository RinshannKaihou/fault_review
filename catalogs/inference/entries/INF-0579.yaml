  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（ROCm sparse-MLA indexer 在**profiling run** 按 `max_num_batched_tokens`（prefill 上界）行申请 decode-logits workspace 并被 `WorkspaceManager.lock()` 终身冻结——而 decode 步至多 `max_num_seqs*(num_speculative_tokens+1)` 行（实测 256 vs 保留 8192，32× 过量）：1M 上下文模型 per-GPU **32 GiB**、占 KV cache 21%；GLM-5.3 TP4 MI355X、MTP k=3 复现，profile 峰值 34.18 GiB 中单笔分配独占 32 GiB） · Cov: `var:vllm_kv_pool_first_boot_capacity_under_allocation`（6.173 容量失准族；12.29 profiler 冻结维度的 AMD 镜像） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 注释写对了 bound（`batch_size*next_n`）代码却取 `hidden_states.shape[0]`（profiling 时 = max_num_batched_tokens）；`_ensure_workspace_size` 经 `get_simultaneous` 以峰值冻结。gfx942/gfx950 路径专属。
  source: 'vLLM #55132（2026-09-02 open，`torch.cuda.memory._record_memory_history` profile 证据 + 行数推导）。https://github.com/vllm-project/vllm/issues/55132'
  behavior: 无 crash——21% KV 容量被理论下界白锁，吞吐/并发静默缩水；与 6.185 构成 indexer workspace 容量错配双栈（NVIDIA 单位错 / AMD bound 错）。
  trigger_surface: vLLM ROCm（gfx942/gfx950）+ sparse-MLA indexer 模型 + 1M 上下文 + MTP
  discovery: 2026-09-03 每日扫描。
