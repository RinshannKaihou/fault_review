original:
  mechanism: '环境 Ubuntu 22.04、python 3.10、msmodelslim commit 692367f64f4172370df0e6a9381b33a62b4f2d61。在 Qwen2.5-7B-Instruct 的 w8a8+FA3 量化脚本里把 `query_states = self.fa_quantizer.quant(query_states, qkv="q")` 改成 `self.fa_quantizer.quant(states_tensor=1.0, qkv="q")`，期望抛 TypeError: states_tensor must be Tensor, not float.，实际没有任何报错，量化流程直接正常执行完成。即 FAQuantizer.quant 缺少入参类型校验，非法输入被静默接受。同 issue 另报两项：fa_quant/fa_amp 参数设为 model.config.num_hidden_layers 后执行报错、kvcache 调 quant_config.kv_quant() 执行报错，均属参数校验/接口问题。复现命令：`python Qwen2.5-7B-Instruct_quant_w8a8_fa3_param.py --model_path ... --save_path ...`。'
  source: '2026-06-08 GitCode Ascend/msmodelslim issue #291 https://gitcode.com/Ascend/msmodelslim/issues/291（closed）'
  behavior: 自动化异常值用例把 quant() 的输入从张量换成 1.0，本意是验证参数校验，结果量化照常跑完、打印成功、权重照常落盘：没有 TypeError、没有 warning，产物和正常量化看不出区别。等到推理精度对不上再回头看，才知道那一层 FA3 的量化根本没生效，而日志里没有任何地方提示它被跳过。
  trigger_surface: msmodelslim FA3 量化路径 + 调用方传入非 Tensor 的 states_tensor（异常值/误用入参）
