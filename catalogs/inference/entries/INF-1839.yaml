- url: https://github.com/vllm-project/vllm-ascend/issues/4803
  kind: github_issue
relations: []
original:
  mechanism: 单机混布多个 DP 时，num_input_tokens 取值为 max_num_tokens_across_dp。若当前 DP 上所有请求都在做 decode，而其他 DP 上有序列长度大于 8K 的 prefill，则 num_input_tokens 可能大于 8K；attention_v1.py 的 build_attention_metadata 会把输入 pad 到大于 8K。PA 算子的 batchsize 最大只支持 8K，pad 超过后会触发 PTA 报错，该报错只打印在 atb log 中、服务并不挂掉，实际上算子没有执行，attention out 大概率是随机数值，因此表现为精度问题。报告者对每个 all-reduce DP 的输入 tensor 做了对比截图，并给出 build_attention_metadata pad 处的代码截图。
  source: 2025-12-08 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/4803 （closed）
  behavior: 单机混布多 DP、另一个 DP 的长序列 prefill 超过 8K 时，本 DP 的 decode 请求输出精度异常，回答跑偏甚至乱码。服务健康、请求都返回 200，日志级别 INFO 下看不到报错，只有 atb log 里能找到 PA 算子的 PTA 报错。
  trigger_surface: DP 混布 + 跨 DP 的 >8K prefill + 本 DP 全 decode
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
