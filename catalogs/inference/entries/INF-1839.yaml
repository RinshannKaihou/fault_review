title: DP 混布下 attention pad 超 8K 使 PA 算子未执行出随机值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: attention 元数据 pad
  behavior: 多 DP 混布时 num_input_tokens 取 max_num_tokens_across_dp，使 decode 输入 pad 过 8K，超 PA 算子 batchsize 上限，PTA 报错只进 atb log
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: attention out 大概率为随机数值，本 DP decode 请求输出精度异常、回答跑偏甚至乱码；服务不挂、请求均返回 200，INFO 级别日志看不到报错，仅 atb log 里有 PA 算子的 PTA 报错。触发面：DP 混布+跨 DP >8K prefill+本 DP 全 decode
  visibility: 静默错误
mitigation:
  detect: 检查 atb log 中 PA 算子的 PTA 报错；对比本 DP 单独跑与跨 DP 混跑时 decode 输出
  fix: 待定；修复应避免按 max_num_tokens_across_dp pad 到超过 PA 算子 batchsize 上限（issue closed，未见 PR 链接）
