original:
  mechanism: 'Ascend/msmodelslim issue #664（2026-10-31，commit db54eedb）：fp8_quantize（msmodelslim/ir/api/impl/fp_quantization.py#L59）对输入做 scale 缩放和范围截断后直接转换存储类型，缺少尾数舍入（round-to-nearest）步骤。实测 scale=1 对 [1.1, 1.0] 量化再反量化返回 [1.100000023841858, 1.0]，而 PyTorch x.to(torch.float8_e4m3fn).float() 返回 [1.125, 1.0]（1.1 的最近 E4M3 格点是 1.125）。环境：macOS Python 3.9.6 + PyTorch 2.8.0 CPU，源码 commit db54eedbd05128cad5f1e0a7302c624b0abb3223，最小复现必现；NPU 与端到端部署未验证。影响域：QAL 伪量化精度评估链路——用该伪量化评估出的 FP8 精度与实际 FP8 部署精度系统性不一致。'
  source: GitCode issue https://gitcode.com/Ascend/msmodelslim/issues/664 （open，2026-10-31 创建；含 PYTHONPATH 最小复现脚本与代码行锚点）
  behavior: 用 msmodelslim 的 FP8 E4M3 伪量化评估模型精度：输入 1.1 量化再反量化得到 1.1 本身（未落到 E4M3 格点），而真实 FP8（PyTorch float8_e4m3fn）会舍入到 1.125。整个伪量化评估因此系统性低估/偏离真实 FP8 部署误差——依据它选定的量化方案、验收的精度结论与实际部署效果不匹配，且全程无告警。
  trigger_surface: Ascend/msmodelslim ir/api/impl/fp_quantization.py 的 fp8_quantize/fp8_dequantize（QDType.FP8_E4M3）；scale=1 附近格点间值；伪量化精度评估与量化方案选型流程。
  signature: fp8 量化反量化往返不落格点（1.1→1.1 而非 1.125）；与 torch float8_e4m3fn 结果不一致。
  repro: issue 附 PYTHONPATH=. 完整复现脚本与实测输出对照。
  discovery: 2026-10-31 每日扫描
