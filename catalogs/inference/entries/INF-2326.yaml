title: FP8 E4M3 伪量化只截断不舍入精度评估失真
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: fp8_quantize 舍入逻辑
  behavior: fp8_quantize 对 E4M3 只做缩放与范围截断后直接转存储类型，不做尾数舍入到最近可表示值，反量化后不等于最近邻 E4M3 格点。
effect:
  objects:
  - 数值结果
  - 测试判定
  detail: scale=1 时 1.1 量化反量化后仍是 1.100000023841858，而 PyTorch float8_e4m3fn 返回 1.125（正确最近邻格点）；伪量化精度评估系统性偏离实际 FP8 部署精度，量化方案选型与精度验收基于错误基准。
  visibility: 静默错误
mitigation:
  detect: 对已知格点间值（如 1.1）比对 msmodelslim 反量化结果与 torch float8_e4m3fn 结果；两者不一致即命中。
  fix: 待定（issue open，未见修复；报告于 macOS/PyTorch 2.8 CPU 环境最小复现，NPU 端到端部署未验证）
