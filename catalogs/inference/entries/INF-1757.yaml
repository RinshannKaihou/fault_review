- url: https://gitcode.com/cann/ops-nn/issues/5335
  kind: gitcode_issue
relations: []
original:
  mechanism: cann/ops-nn issue 5335（2026-08-29，closed）：Ascend950PR（A310-50-C00MM304A1）、CANN 9.1.0。ForeachACosInplace、ForeachAddListInplace、ForeachDivListInplace、ForeachLogInplace、ForeachMulListInplace、ForeachMulScalarInplace、ForeachSubListInplace、ForeachSubScalarInplace 八个算子的 OpDef 只声明 Input 未声明 Output（原注释写明 x serves as both input and output），opbuild 拿不到输出 IR 索引，建不起 input↔output 的 ref 配对，生成的 aclnn 代码里 NnopbaseSetRef、NnopbaseGetRefUnContiguousTensors、NnopbaseSetViewCopyExecutor、aclnnViewCopy 只有 extern 声明、零调用，而 NnopbaseGetUnContiguousTensors + aclnnContiguous 照常生成。非连续就地参数被抠进临时连续缓冲，内核往临时缓冲就地写，算完没有代码搬回用户 storage。静态判据是装机包头文件里 x 为 const 且无 Ref 后缀。
  source: 2026-08-29 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5335 （closed）
  behavior: 直接调 aclnn 的 foreach inplace 接口并传一个非连续视图时，调用返回成功、流同步正常、也没有报错或崩溃，但用户传进去的那段 storage 一点没变，读回来还是计算前的值：结果被静默丢弃。传连续张量时一切正常，所以这个问题从算子首版潜伏下来一直没暴露。
  trigger_surface: foreach*Inplace 的 aclnn 接口 + 非连续就地参数
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
