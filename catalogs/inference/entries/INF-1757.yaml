id: INF-1757
legacy_ids: []
slug: ops_nn_foreach_inplace_noncontiguous_result_dropped
aliases: []
title: 8 个 foreach*Inplace 非连续就地结果被丢弃
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: foreach Inplace 算子原型
  behavior: OpDef 只声明 Input 未声明 Output，opbuild 建不起 ref 配对，生成的 aclnn 代码里 Ref 回写四件套全无调用，输入连续化却照常生成。
effect:
  objects:
  - 数值结果
  detail: 直接调用 aclnn 的 foreach*Inplace 接口并传入非连续视图时，调用返回成功、流同步正常、无报错或崩溃，但用户传入的那段 storage 未发生变化，读回仍是计算前的值，结果被静默丢弃；传连续张量时一切正常。
  visibility: 静默错误
mitigation:
  detect: 用交错哨兵布局构造非连续视图调 aclnn inplace 接口，读回原 storage 看是否未变；装机包头文件里 x 是否带 Ref 后缀即可静态判定。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/9498 （合入状态未核实）：补 Output 声明恢复 ref 回写；ForeachZeroInplace 等两个跨代原型未纳入。
labels:
  stage: N/A
  confidence: documented
