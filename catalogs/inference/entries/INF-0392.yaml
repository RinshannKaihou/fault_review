  meta: '`infra_off`（SGLang v0.5.20 在 **H200（SM90）** 上 `--attention-backend trtllm_mha`（prefill+decode 双用）**正常启动、`/server_info` 报告该后端、正常速度服务——返回错误补全**；同一命令在 v0.5.17 被启动拒绝（"TRTLLM MHA backend for prefill is only supported on Blackwell GPUs (SM100)"）。**单侧各自正确**：`prefill=trtllm_mha+decode=fa3` 与 `prefill=fa3+decode=trtllm_mha` 均过正确性探针，仅双侧 trtllm_mha 组合错——gpt-oss-120b 实测） · Cov: `NEW`（架构门限放宽后静默错服务子签名——fail-loud 拒绝退化为 fail-silent；与 7.70（NVFP4 Ampere 不可达）同属能力门族但方向相反：本条是**门被错误移除**而非门缺失） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: v0.5.17 的 SM100-only prefill 守卫在 v0.5.20 中消失（或被绕过），SM90 上接受了原本不支持的组合；单侧正确说明 prefill 与 decode 内核各自在该架构可用，组合路径（kv 布局/调度假设）在 SM90 上数值不成立——错误配置从启动期 ValueError 变为运行期静默错值。根因内核层定位尚待维护者响应（akhilg-nv 确认未在调查、#32272 仅 perf 假设）。
  source: 'SGLang #40921（2026-09-23 open，含 v0.5.17/v0.5.20 双镜像启动对照、四组合正确性探针矩阵、镜像 sha 与冷缓存环境）。https://github.com/sgl-project/sglang/issues/40921'
  behavior: 无 crash——**静默错误补全**：服务健康检查全绿、吞吐正常、输出系统性错误；从拒绝到静默错误的转变使升级（0.5.17→0.5.20）本身成为正确性回归的触发器，无日志可依赖。
  trigger_surface: SGLang v0.5.20 + H200/SM90 + `--attention-backend trtllm_mha`（other_stack）
  discovery: 2026-09-23 每日扫描。
