original:
  mechanism: 'transformers 中 Gemma 2 用 50*tanh(x/50) 对 attention logits 做 soft-capping（attn_logit_softcapping）。eager 与 flex_attention 正确应用该 cap；sdpa——Gemma 2 的默认 attn_implementation——忽略收到的 softcap 参数；flash 路径在 kernel 不接受 softcap 参数时（如 ROCm kernels-community/aiter-flash-attn）同样丢弃。原本针对 Gemma 2 的提醒警告已在 #40744 移除，因此现在完全静默。报告在 H100、transformers 5.20.2、google/gemma-2-2b、wikitext-103 2048 token 上以 eager 与 sdpa 对比展示分歧（发现于 TRL on AMD 工作:huggingface/trl#7844）。问题在当前 main 6b6792ff 相关代码仍在。'
  source: 2026-10-23 每日扫描 https://github.com/huggingface/transformers/issues/49810（closed）+ 关联 https://github.com/huggingface/trl#7844（发现渠道）
  behavior: Gemma 2 系列用 transformers 默认配置（sdpa）推理/训练时，attention soft-capping 静默不生效：同一权重、同一输入，eager（有 cap）与 sdpa（无 cap）输出不同，质量评测可测出退化，但没有任何警告提示；换用不带 softcap 参数的社区 flash kernel（如 ROCm aiter）时同样丢 cap。
  trigger_surface: transformers 5.20.2（及当前 main）；google/gemma-2 系列；默认 sdpa 或不带 softcap 的 flash kernel；任何使用该模型做推理/训练的场景。
  discovery: 2026-10-23 每日扫描
