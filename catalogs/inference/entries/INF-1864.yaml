original:
  mechanism: 'Ascend/pytorch #4087（torch 2.12.0+cpu / torch_npu 2.12.0，Ascend 950P）：op-plugin 的 NPU pack_padded_sequence kernel 有意改变了输出布局——标准 PyTorch 的 packed data 是 [sum(lengths), *]，NPU 侧保留 padding 变成 [T0*B, *]，实测 lens=[12,12,9,7,7,4,2,1]、T=12、B=8 时 CPU 是 (54,3)、NPU 是 (96,3)。前向仍是恒等映射（pack 再 pad_packed_sequence 还原成原张量），所以前向看不出异常；但 _pack_padded_sequence 的反向是与后端无关的那一份 PyTorch 实现，按原布局假设生成，NPU 没有覆盖它，96 行数据被按 54 行的布局解释，梯度即错。报告者在 master 上核对代码与 v2.12.0 逐字相同（仅花括号与缩进差异），并给出不含任何 RNN 的最小复现：pack→pad 往返后 (y*g).sum().backward()。'
  source: 2026-08-17 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/4087 （open）
  behavior: 用 pack_padded_sequence + pad_packed_sequence 做一次纯往返（中间不放 RNN），前向结果和输入一模一样，所以模型前向看不出问题；但 backward 之后输入的梯度就错了——NPU 上 max|x.grad - expected| 是 4.58，CPU 是 0，不是精度级差异。打印 p.data.shape 会发现 NPU 是 (96,3) 而 CPU 是 (54,3)，正好等于 T*B 与 sum(lengths)。
  trigger_surface: torch_npu 2.12.0 + Ascend 950P；pack_padded_sequence（enforce_sorted=True）+ 反向
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
