title: NPU pack_padded_sequence 改布局未配反向致梯度错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: pack_padded_sequence 布局
  behavior: NPU kernel 有意把 packed data 从 [sum(lengths),*] 改成保留 padding 的 [T0*B,*]，反向仍是 PyTorch 按原布局生成的那份，前反向两套布局约定不对齐。
effect:
  objects:
  - 梯度
  detail: 纯 pack→pad 往返（中间无 RNN）前向恒等、CPU/NPU 前向都正确，但 NPU 的 x.grad 最大偏差 4.58，CPU 为 0；packed data shape NPU (96,3) 对 CPU (54,3)（lens=[12,12,9,7,7,4,2,1]）。
  visibility: 静默错误
mitigation:
  detect: pack→pad 往返后 backward，与 CPU 的 x.grad 比 max|diff|；同时打印 p.data.shape（NPU 是 T*B 而非 sum(lengths)）
  fix: 待定（issue open）；master 与 v2.12.0 代码逐字相同，仍受影响
