original:
  mechanism: 'ops-transformer issue #4278（A5、ascend950、基于 9.1.0 分支、cann 包 730 商法，closed）：mssanitizer 在 MoeTokenUnpermuteWithRoutingMap 上抓到 illegal read of size 4 @0x0，栈顶为 moe_token_unpermute_with_routing_map.cpp:67 的 op.Process()，即 TILING_KEY 1000（paddedMode=true）分支 KernelMoeTokenUnpermuteWithRoutingMapPad。根因是 host tiling 与 kernel 的 buffer 尺寸联动：_tiling.cpp:166 用 num_tokens_front_core_each_loop = GetAlign(num_tokens_each_front_core, maxNPerLoopForUb)，而 GetAlign 是 value1/value2*value2（整数除法向下取整）；本例 num_experts=2、capacity=1 使 rowVal=2，num_tokens_each_front_core=ceil(2/coreNum)=1，maxNPerLoopForUb≈UB/4≈49k，于是 GetAlign(1,49152)=0。kernel _pad.h:83 用该值 InitBuffer(unpermutedTokensOutQue, BUFFER_NUM, num_tokens_each_loop_current_core*sizeof(T)) 得到 0 字节缓冲，Compute()（_pad.h:117）再往里 SetValue + DataCopyPad，访问地址 0x0。旁证：示例输出 original unpermutedTokensData=[0,0,2,2]（probs 全为 1 时正确 gather 应为 [1,1,0,0]），因示例不做断言，功能错误被静默放过；生产大 shape 下 num_tokens_each_front_core>=maxNPerLoopForUb 不触发。'
  source: 2026-08-12 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/4278 （closed）
  behavior: padded 模式的 MoE unpermute 在极小 shape（专家数 2、capacity 1、每卡只分到 1 个 token）下返回的行顺序是错的——示例输入 probs 全 1，期望 [1,1,0,0] 却得到 [0,0,2,2]；正常调用不报错，只有在 mssanitizer 下才看到 illegal read @0x0，生产大 shape 完全不复现。
  trigger_surface: paddedMode=true + 每核 token 数远小于 maxNPerLoopForUb（num_experts=2、capacity=1 等极小 shape）+ A5/ascend950
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
