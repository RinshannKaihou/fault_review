id: INF-1728
legacy_ids: []
slug: unpermute_pad_getalign_zero_buffer
aliases: []
title: unpermute pad 路径 GetAlign 得 0 字节缓冲
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: unpermute pad tiling
  behavior: tiling 用 GetAlign(num_tokens_each_front_core, maxNPerLoopForUb) 算每循环 token 数，该函数整数除法向下取整，每核 1 token 时结果为 0。
effect:
  objects:
  - 数值结果
  detail: paddedMode=true、num_experts=2、capacity=1 时 kernel 按 0 字节分配输出队列，mssanitizer 报 illegal read size 4 @0x0；示例输出 [0,0,2,2]，正确应为 [1,1,0,0]。
  visibility: 静默错误
mitigation:
  detect: paddedMode=true 且每核 token 数远小于 maxNPerLoopForUb（极小 capacity）的用例要加输出断言；否则 mssanitizer 之外无法发现
  fix: 按 max(each_loop, last_loop) 分配输出队列，或 host 侧在 num_tokens_each_front_core<maxNPerLoopForUb 时让 each_loop 兜底取实际值（issue 建议，未核实合入）
