  signature: 这是**缺失**（上下文被截断）而非数值扰动，且只在长度 ≡ 0 (mod page_size) 时出现，属长度门控的 ambiguous。签名为周期性上下文截断，边界步上最后一页的注意力质量约 0——statistical（注意力质量分布）与 trajectory（沿长度的周期性尖峰）可捕获；geometric 因残存 KV 的范数与方向完全健康而容易漏检，这是"absence 类"故障对流形距离型度量的共同盲区。
  repro: partial——在 attention mask 钩子里，当 `T % page_size == 0` 时屏蔽最后 `page_size` 个位置，其余长度不动，复现周期性截断；FlashInfer 的分页元数据与 kernel 本身不可复现。
