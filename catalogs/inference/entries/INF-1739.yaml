title: scatter_nd_add 确定性路径 mask 被消费致多行错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: scatter_nd_add 确定性量化 VF
  behavior: QuantizeForSumVf/InverseQuantizeVf 把 maskLen 当参数传入，MicroAPI::UpdateMask 每调用一次就递减它，下一行沿用的是被消费后的残余值。
effect:
  objects:
  - 数值结果
  detail: 910B + CANN 9.1.0 确定性模式下，tiling 使 rowLen>1 时只有第一行量化/反量化正确，第二行起全部错值；rowLen=1 不触发。
  visibility: 静默错误
mitigation:
  detect: 确定性模式跑 rowLen>1 的多行用例，逐行比对量化/反量化中间结果；rowLen=1 的常规用例看不出来。
  fix: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/6712 （closed，合入状态未核实）：每行循环开始把 maskLen 重置为 afterAxis/colLen。
