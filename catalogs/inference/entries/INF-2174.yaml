  mechanism: 'ops-transformer #6607：aclnnMoeTokenUnpermuteWithRoutingMap 在 paddedMode=false 时 outIndex 与 permuteTokenId 两个输出从未被写：canary 0x5a5a5a5a 预填实测 6/6 全残留，两段接口均返回 0；同输入 paddedMode=true 时两输出与 numpy.sort/argsort 逐元素一致正确写出，主输出 unpermutedTokens 两种模式都正确。资料明确描述了两输出在 paddedMode=false 下的语义（outIndex 槽位索引 [0,tokens_num*topK_num-1]、permuteTokenId [0,tokens_num-1]），非该模式下无意义。环境 Atlas A2 910B2×8、CANN 9.2.0，源码 master 23cb0599，纯 aclnn C 直调复现（Python ctypes）。'
