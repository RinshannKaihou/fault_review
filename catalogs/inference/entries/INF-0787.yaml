  mechanism: causal mask 生成错误，有三种形态：dropped（完全没有 mask，模型变成双向）、inverted/transposed（反因果）、off-by-one（把 j<i 写成 j<=i 或反之）。正确的定义是 Mask[i,j]=0 if j<=i else -inf。本条为 MERGED 条目，逐一列出被合并的子故障：dropped causal mask、inverted causal mask、off-by-one causal mask。
  source: 'HF Discuss "data leakage in causal masking?"（33261）；arXiv:2405.14862；transformers #36150（SDPA 的 is_causal=False 静默变成 no-op）。'
  behavior: logits 静默出错；off-by-one 泄漏只带来轻微漂移；mask 被完全丢弃则模型退化为双向注意力。
  trigger_surface: 可复现
  signature: off-manifold。dropped / inverted 形态在**每一层**都从根本上改变了 attention 几何：attention-map 指标上表现为未来位置有非零质量、下三角非零或矩阵不对称——cheap 族的严格下三角检查即可命中。off-by-one 形态最难：几何扰动极小，与 bug_perfect_disguise 同属"行为有害但几何近乎不可见"的一类，geometric / spectral 族基本漏检，只有直接检查 mask 结构的 cheap 探针能稳定发现。
  repro: 用 hook 替换传入 attention 的 mask 张量（分别构造 dropped / transposed / 移位一格三种版本）。
