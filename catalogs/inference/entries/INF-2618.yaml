title: split_v UB-split gather 索引 16 位回绕致错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: split_v UB-split 核
  behavior: SplitVUbSplit 的 DataCopyGatherVf 用 uint16 lane 计算行×pitch+列+n 偏移，单块元素数超过 65536/sizeof(T) 时索引回绕，gather 从错误位置取数。
effect:
  objects:
  - 数值结果
  detail: Ascend960 上 split_v 切分 int8/uint8/bool，当单块 UB 可容纳超 65536 元素、size_splits 含≤128B 小段且 N 足够大使 nUbFactor 跨 16 位时，输出整行错值且无报错；950/910B 因 UB 较小不触发。
  visibility: 静默错误
mitigation:
  detect: 构造 size_splits 含 ≤128B 小段、N 足够大使 nUbFactor 跨 16 位，与 golden 逐元素比对，观察整行错值。
  fix: 待定（issue open，2026-11-27；报告建议对 UB-split 路径套用 same_len 系已有限制）
