id: INF-1673
legacy_ids: []
slug: te_int64_downcast_collapses_nondense_layout
aliases: []
title: int64 边界降档把非 dense 视图塌成 contiguous 致索引错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: boundary downcast 降档
  behavior: kernel 参数边界把 *i64 降为 *i32 并用 Tensor.to(int32) 转换数据；重叠/非 dense 视图无法零拷贝被静默物化为 contiguous，stride 变化后仍按编译期旧 stride 寻址。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: Longformer triton_experimental 训练 accuracy 33.22 远超容差；int64 索引 2359296 中 96% 错，最大值 589823（应 1179647），int32 版 0 错；scatter 后梯度最大偏差 0.0043，12 层累计精度失败。
  visibility: 静默错误
mitigation:
  detect: 对 as_strided 重叠视图 / gapped slice / broadcast 输入做 i64 索引生成，比较 compiled 与 eager 的 (out!=ref).sum()；或检查 downcast 转换缓冲的 stride 是否与源参数一致
  fix: 待定（issue closed，正文未给修复 PR）；期望 boundary downcast 的转换缓冲保持参数原始 stride，而不是塌缩为 contiguous
