original:
  mechanism: 'Ascend/pytorch #4701（2026-09-08，closed，torch_npu master + triton_experimental 后端，torchbench huggingface AllenaiLongformerBase / allenai/longformer-base-4096，--accuracy --train --float32）：NPU 向量核不支持 int64/float64，TE 在 kernel 参数边界做降档（boundary downcast）——codegen 把 *i64 签名改写为 *i32，launcher 侧用 Tensor.to(torch.int32) 转换数据。问题在 Tensor.to() 对非 non-overlapping-and-dense 布局会静默塌缩为 contiguous：backward index_put 的索引 producer 是 arange(1179648, dtype=int64).as_strided((12,4,768,64),(98304,16384,64,1)).contiguous().view(-1) 这类重叠视图（view numel 2359296 大于 storage 1179648），.to(int32) 无法零拷贝、按逻辑值重新填充，stride 由 (98304,16384,64,1) 变为 (196608,49152,64,1)；而 Triton kernel 的 load 公式按编译期记录的旧 stride（x0+16384*x1+98304*x2）编译，套在物化后的缓冲上寻址含义改变，读到错误位置。最小复现：int32 版 bad=0、int64 版 2359296 个元素中 2260992 个错误、out_max 589823 而非 1179647。错误索引经 scatter 放大到 value.weight.grad max_abs=0.0043，12 层累计后表现为最终 accuracy 失败（指标 33.22）。正文指出输出侧 empty_like 与回写 tmp.to(src_dt) 也存在同根因的布局塌缩。'
  source: 2026-09-08 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/4701 （closed）
  behavior: Longformer 用 triton_experimental 后端跑训练精度检查时 accuracy 指标掉到 33.22，远超容差；同一份数据换 int32 索引就完全正常。单独跑索引生成的那段图可以看到：2,359,296 个 int64 索引里有 96% 是错的，最大值只有 589,823（应该到 1,179,647），像是缓冲被重新排布后仍按旧步长去取。错误索引经 scatter 写进梯度，value.weight.grad 最大偏差 0.0043，12 层堆叠后表现为模型精度彻底崩掉，全程没有任何报错。
  trigger_surface: triton_experimental 后端 + 大于 32 位的索引/dtype（int64、float64）+ 非 dense 布局（重叠 as_strided、gapped slice、expand）作为 kernel 参数
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
