original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.bitwise_right_shift` 对 **UINT32** 做算术（符号传播）右移：bit 31 置位的输入——UInt32 域的一半（2^31 个值）——高位补 1。LLK `calculate_right_shift` 只给 UInt16 走无符号分支，UInt32 落入 vInt 符号扩展 else；`0x80000000>>31` 返 4294967295（应 1，4.29e9× 高估）、`0x80000000>>16` 返 4294934528（应 32768，131071×）、均匀采样 **50.00% lane 错**。且 **golden 函数 `integer_golden.py` 复刻同款算术**——现有单测的黄金值即缺陷，CI 结构性失明；纯 Python 无需硬件即可复现） · Cov: `var:ttmetal_blackhole_bitwise_right_shift_oob_guard_register_selector_as_modifier`（1.176 bitwise_right_shift 语义缺陷族） · 触发 `yes` · 置信度 `verified`'
  mechanism: SFPU shift kernel 的 dtype 分派只区分 UInt16 与"其余"，UInt32 被塞进符号扩展路径；golden 与实现同错使测试失去独立性。
  source: 'tt-metal #56385（2026-09-13 open，bug+op_cat:eltwise+community label，含 3×3 输入×移位误差矩阵、无硬件 golden 复现脚本与 LLK 源码 diff）。https://github.com/tenstorrent/tt-metal/issues/56385'
  behavior: 无 crash——**UInt32 高半域静默错值**且错误有限、貌似合理（3×–4.29e9× 高估）；golden 同错意味着"参考实现"本身不可信，任何以 golden 为准的验证都放行该缺陷。1.176（BH bitwise_right_shift 越界移位守卫缺失）之后同算子族新成员：本条在无符号 dtype 符号扩展维度、且缺陷被 golden 编码。
  trigger_surface: tt-metal + bitwise_right_shift + UINT32 + bit31 置位输入（yes；数值触发）
