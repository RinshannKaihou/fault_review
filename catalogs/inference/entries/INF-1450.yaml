  mechanism: 'NVIDIA/TensorRT-LLM #20504（c2026-10-17 open）：Breakable prefill CUDA graphs replay corrupted outputs for some buckets: the shared output buffer is on the wrong bucket。断点 prefill CUDA graph 机制下多个 bucket 复用共享输出缓冲；该缓冲被归到错误的 bucket，导致部分 bucket 回放时输出被覆盖/污染。本轮按 search item 标题与短语收录（正文未逐段深读），具体复现形状、bucket 矩阵与修复状态未核实。'
