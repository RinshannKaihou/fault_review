  behavior: 在 TensorRT-LLM 启用 breakable prefill CUDA graph 时，部分长度桶（bucket）的 prefill 回放输出是坏的：输出内容损坏但无崩溃。同请求换到未受影响的桶或关闭该图机制可恢复正常。
