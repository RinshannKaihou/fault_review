id: INF-1755
legacy_ids: []
slug: ops_nn_modulate_grad_missing_one_plus_scale
aliases: []
title: modulate_grad 反向漏乘 (1+scale) 致梯度偏小
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: modulate_grad 反向梯度
  behavior: ComputeGradients 里 grad_input 直接 Mul(grad_output, scale)，漏掉正向 y=x*(1+scale)+shift 的常数项，每个元素梯度恒缺 grad_output×1。
effect:
  objects:
  - 梯度
  detail: x=3、scale=0.5、shift=2、grad_out=1 时真 grad_x=1.5 而 kernel 输出 0.5，恰差 grad_output×1；grad_scale/grad_shift 路径正确。
  visibility: 静默错误
mitigation:
  detect: 取 x=3/scale=0.5/shift=2 的最小算例与 torch autograd 比对 input 梯度；现有 kernel UT 输入全零且零断言，恒真通过。
  fix: 待定（issue closed，未给修复 PR）：建议 grad_input 改为 grad_output×(1+scale) 并修正 aclnnModulateBackward.md 公式，补数值断言锚定。
