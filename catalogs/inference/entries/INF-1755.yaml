original:
  mechanism: cann/ops-nn issue 5601（2026-09-07，closed）：ops-nn/vfusion/modulate_grad/op_kernel/modulate_grad.cpp 第 388 行 ComputeGradients 中 has_scale_ 分支写的是 Mul(computegradInputLocal[address], computegradOutputLocal[address], computescaleLocal[0], d_size)，即 grad_input = grad_output × scale，缺 +1。本仓 modulate 的正向契约（README 与 docs/aclnnModulate.md、kernel 实现）是 y = x×(1+scale)+shift，数学推导与 torch autograd 实测给出 grad_input = grad_output×(1+scale)、grad_scale = Σ grad_output×input、grad_shift = Σ grad_output，后两项 kernel 正确。数值例 x=3、scale=0.5、shift=2、g=1 时真值 grad_x=1.5、kernel 给 0.5。现有 kernel UT 输入全零且零断言，op_host UT case_0 的调用与断言被注释，故测试发现不了。
  source: 2026-09-07 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5601 （closed）
  behavior: 把 modulate 与它的反向配成 autograd 使用时，输入侧的梯度恒定偏小一个 grad_output 项：scale=0.5 时拿到的是真值的三分之一量级（1.5→0.5），不报错、不产生 NaN，loss 曲线只是收敛得比参考实现差；scale/shift 的梯度正常，单看算子级零输入 UT 全绿。
  trigger_surface: modulate 反向 + scaleOptional 存在
