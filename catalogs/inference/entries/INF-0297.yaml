original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`ambiguous`（gated on harmful-prompt trajectory） · Cov: `NEW` · 触发 `partial` · 置信度 `verified`'
  mechanism: 对一个已做安全对齐的 LLM，翻转约 5–25 个定向权重 bit（数量落在 Rowhammer 实际可行的范围内）即可解除其拒答行为。攻击先用基于梯度的 profiling 离线定位 safety-critical 权重，再只翻这些位置上的 bit；相比先前的比特翻转攻击，所需 flip 数最多减少 40x。模型的其他能力不受可见影响，被改动的参数量极小。
  source: 'Coalson, Shumailov, Zhao, Bates, Mullins, Papernot, Anderson, "PrisonBreak", arXiv:2412.07192 。Related: CCS 2025 "How Vulnerable are LLMs against Adversarial Weight Perturbation Attacks"; arXiv:2507.03236 。'
  behavior: 在绝大多数输入上输出保持良性且与健康模型无异；只有在收到有害请求时，模型不再拒答而是照做。通用能力基本保留，因此常规质量回归测不出来。
  trigger_surface: PrisonBreak 类：CUDA 可翻权重，但找 jailbreak 位需搜索
  signature: ambiguous / 在无害输入上偏 on-manifold —— 隐状态贴近健康流形，断裂只在有害 prompt 的轨迹上显形。这是与 bug_perfect_disguise 最接近的一类：不给触发输入就"看起来健康"。无条件的中层监控（geometric 单帧离群）大概率漏检；比较可能的线索是中层"safety layer"上的 spectral 异常（"Safety Layers in Aligned LLMs", OpenReview kUH1yPMAn7），并且必须在有害-prompt 条件下采样才能显著。
  repro: partial。复现本体是一次权重变换 —— 对选定的少量权重张量元素做 bit 级篡改（读 fp32 位模式、翻指定 bit、写回），不需要 forward hook。难点在于 safety-critical 权重的定位必须靠离线梯度 profiling 单独跑一遍，不属于单钩子复现路径。
