title: cumsum fp16 内部按 fp16 累加致饱和不出 Inf
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: aclnn Cumsum 累加 dtype
  behavior: aclnn Cumsum 对 fp16 输入直接用 fp16 累加，部分和超过 65504 后饱和成 2048，既不提升到 fp32 累加，也不产生 Inf。
effect:
  objects:
  - 数值结果
  detail: 3717120 元素 fp16 对照：CPU 参考 max=inf、inf_count=3,586,185；NPU 直接 fp16 得 max=2048.0000、inf_count=0，allclose 为 False；先 .float() 再 cumsum 转回 fp16 则与 CPU 一致。
  visibility: 静默错误
mitigation:
  detect: fp16 长序列 cumsum 与 cumsum(x.float()).half() 对比，看是否出现饱和平台而不是 inf
  fix: 待定（issue open）；规避：cumsum 前 upcast 到 fp32 再转回 fp16
