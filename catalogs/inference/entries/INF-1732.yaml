original:
  mechanism: 'Ascend/pytorch #2195（2026-06-01，open，torch_npu 2.7.1 / CANN 8.x / Ascend 910B，Python 3.11）：torch.cumsum 在 fp16 上直接走 CANN 的 aclnn Cumsum kernel，kernel 内部以 float16 累加，累计和超过 fp16 上限 65504 后进入饱和，输出停在 2048 左右而不是溢出成 inf。报告给出 3717120 元素的对照脚本：CPU 侧 cumsum(inp.float()).half() 得 min=0.3340、max=inf、inf_count=3,586,185；NPU 直接 fp16 得 min=0.3340、max=2048.0000、inf_count=0，allclose(rtol=1e-3, atol=1e-5) 为 False；先在 NPU 上 .float() 再 cumsum 后转回 fp16 则与 CPU 参考一致。即缺陷位于累加 dtype 选择（应 fp32 累加后回写 fp16），而非调用方用法。'
  source: 'Ascend/pytorch #2195（2026-06-01，open） https://gitcode.com/Ascend/pytorch/issues/2195'
  behavior: 用户对 fp16 张量做 torch.cumsum，得到一条在 2048 处被削平的长平台，没有 inf、没有告警；与 CPU 或 CUDA 的 cumsum 结果在序列中后段整体偏离，累积和越大偏差越大，只有先手动 upcast 到 fp32 才能复现 CPU 数值。做 fp16 掩码累积、概率前缀和、位置累加这类计算时，后续步骤直接吃到错值。
  trigger_surface: fp16 torch.cumsum + 百万级元素（累计和超 65504）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
