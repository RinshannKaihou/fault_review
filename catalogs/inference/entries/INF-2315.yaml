title: vLLM 混合图回放 padding 行污染 null 页状态
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: gdn/mamba padding 行
  behavior: padding 行 state index 填 NULL_BLOCK_ID=block 0，统一 hybrid KV 布局里该块是全部层共享单一 null 页，不跳过 index 0 的 state kernel 在此读写循环状态。
effect:
  objects:
  - KV状态
  - 跨请求/跨样本数据
  detail: 一次 padded 回放内 block 0 出现 13 个非有限视图，NaN 污染整批 attention 输出；Triton GDN 跳过 index<=0 不触发，XPU kernel 曾触发（#660 已修），其他后端同理暴露。
  visibility: 数值异常
mitigation:
  detect: graph 回放+padding 下监控整批 NaN；对 block 0 做非有限视图计数；非 Triton GDN 后端跑 padded replay 用例。
  fix: 待定（issue 提出方案未实施：每 Mamba-spec 组预留一块清零 scratch block，padding 行指向 scratch；kernel 侧守卫作第二道防线）
