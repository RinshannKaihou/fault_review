  section: 第 7 类 · 量化（PTQ / 低位 / FP8 / 微缩度）
  meta: '`infra_off`（ModelOpt `MIXED_PRECISION` checkpoint（nvidia/Qwen3.8-Flash-Next-NVFP4 + MTP）加载即失败——两个独立缺陷叠加：(a) `RoutedExperts` 分支硬编码 if-chain 不含 `FP8_BLOCK_SCALES` → 层被建成非量化 → `AttributeError: no parameter ''w2_weight_scale_inv''`；(b) MTP 层索引域错配（checkpoint 命名 `mtp.layers.0` vs 模型构建 `mtp.layers.48`）→ quant config 查找返回 None。两者都修才能加载） · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: '`ModelOptMixedPrecisionConfig.get_quant_method` 的 `RoutedExperts` 分支只处理 FP8/NVFP4/W4A16_NVFP4/MXFP8 后 `return None`；而 `FP8_PB_WO`（同为 128×128 block FP8）在 `LINEAR_ALGOS`/`resolve()` 表**有**分发——同一算法 linear 有、routed experts 没有（if-chain 与表驱动两种注册机制并存的不对称）。缺陷 2：`Qwen4ExpMultiTokenPredictor` 以 `num_hidden_layers + idx` 构建层名，ModelOpt 配置用 `mtp.layers.0`——与 #53790（NemotronHMTP hf_to_vllm_mapper）同类：**quant 配置的 checkpoint 命名空间到不了 MTP draft**，错位轴是层索引而非前缀串。补丁双修后 MTP3 接受率 59.1%（原生支持对照 60.8%）证明 draft 正确加载。'
  source: 'vLLM #55496（2026-09-05 open，双 DGX Spark TP2+EP，含双缺陷定位、main 仍在确认与补丁对照测量；修复 PR #55498 只修 (a)）。https://github.com/vllm-project/vllm/issues/55496'
  behavior: 加载期 crash（AttributeError）——fail-loud；但缺陷 (a) 单独存在时若无 loader 报错路径（参数缺失才显形），未量化的专家层可静默以 BF16 服务——量化配置静默回退的另一种入口。与 7.69（w13 gscale 失配 warn-then-use）同 ModelOpt 配置解析域，本条是**注册机制不对称 + 命名空间不通**双缺陷。
  trigger_surface: vLLM + ModelOpt MIXED_PRECISION + FP8_BLOCK_SCALES routed experts + MTP（模型×量化格式组合触发）
  discovery: 2026-09-05 每日扫描。
