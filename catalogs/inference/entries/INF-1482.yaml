original:
  mechanism: 'op-plugin issue #367（c2026-08-07，closed，关联 PR !5687）：op_plugin/utils/KernelNpuOutputSize.cpp 的 clamp_npu_output_size 在 self.numel()==0 时直接 return self.sizes()，短路分支只复制 self.dim() 个维度，不做 left-pad，也不逐维比较 min/max 的 broadcast 形状；该函数经 op_plugin_functions.yaml 的 size: clamp_npu_output_size(self, min, max) 被 gen_opapi 生成的 clamp.Tensor / clamp.Tensor_out 调用，bug 真实可达。正确路径 broadcast_ops_npu_output_size 内部用 at::infer_size，本来已能处理 0 维、left-pad 与非法组合校验，短路分支属多余。实测矩阵：self=(0,)+min=(3,1) 得 (0,) 而非 (3,0)；self=(1,0)+min=(3,1) 得 (1,0) 而非 (3,0)；self=(0,)+min=(3,) 被静默接受而非抛 broadcast 错误；self=(0,)+标量 min 两端一致。后果是空张量场景输出形状错误，并把本应报错的非法广播输入放行到下游。'
  source: 2026-08-07 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/367 （closed）
  behavior: 在 NPU 上调 torch.clamp(input, min=..., max=...) 的 Tensor 版本，只要 input 是空张量、而 min/max 的维数比 input 高需要 broadcast 扩展，输出的形状就不对：期望按广播扩展成更高维（如 (1,0) 与 (3,1) 应得 (3,0)），实际原样返回 input 的形状 (1,0)。更隐蔽的是，本来应当报「无法广播」的非法组合（如 (0,) 与 (3,)）在 NPU 上不报错，直接给出一个空张量继续往下跑，下游拿到形状不符的中间结果。
  trigger_surface: torch.clamp / clamp.Tensor(_out) + self.numel()==0 + min/max 维数需 broadcast 扩展；min/max 为标量时不触发；非空张量走正常 broadcast 路径
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
