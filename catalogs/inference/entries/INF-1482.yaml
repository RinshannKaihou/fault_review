title: clamp 空张量短路跳过 broadcast 校验
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: clamp_npu_output_size 短路
  behavior: clamp_npu_output_size 在 self.numel()==0 时直接返回 self.sizes()，跳过 left-pad 与逐维 broadcast 比较，也不走 at::infer_size 校验。
effect:
  objects:
  - 数值结果
  detail: 空张量 clamp 的输出形状不符合 broadcast 语义（(1,0) 应为 (3,0)）；不可 broadcast 的非法输入被静默接受而非抛错；非空张量路径正常。
  visibility: 静默错误
mitigation:
  detect: 构造 self.numel()==0 且 min/max 维数需 broadcast 扩展的输入，与 CPU 对照输出形状；非空张量不触发
  fix: 修复 PR https://gitcode.com/Ascend/op-plugin/merge_requests/5687 （issue 已 closed；合入与发布状态未核实）：删除空张量短路分支，统一走 broadcast_ops_npu_output_size
