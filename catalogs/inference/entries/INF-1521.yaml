title: MLIR 融合回退不写预分配 buffer 致错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: mlir_auto_fallback 回退
  behavior: MLIR 融合 kernel 调优失败后 mlir_auto_fallback 回退 _load_fx_graph，回退路径不遵守 kernel.run(..., bufN) 的写预分配 buffer 约定。
effect:
  objects:
  - 数值结果
  detail: 整图 resnet18 与 eager 偏差 0.98/1.008 或直接 NaN，单 stage 恒正确；dynamic=True 可规避；出错组合随权重与版本变化。
  visibility: 静默错误
mitigation:
  detect: 整图 vs 逐 stage 编译同一模型，比对 max abs 与 NaN；开 dynamic=True 做 A/B；看 Tuning accuracy failed 日志
  fix: 待定（issue closed，正文未给修复 PR；期望回退路径遵守 bufN 写约定，并对静默回退打告警）
