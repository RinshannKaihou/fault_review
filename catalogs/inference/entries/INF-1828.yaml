original:
  mechanism: decode 侧开启 recompute_scheduler_enable=true 后，重算请求的续写不再基于原始 token 历史。recompute_scheduler.py 在 L339-344 已经拿到了被重算请求的 output_token_ids，但发给 API 层的 EngineCoreOutput 只带 new_token_ids=[] 和 stop_reason="recomputed"（L868-878），把历史丢掉；examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py 的代理（L973-1058）于是只从流里累加解析出的 content（delta.content / message.content / choice.text），并在收到 recomputed 标记时用 messages[0]["content"] = origin_prompt + generated_token 重建新请求。这与「从原 token 历史继续」不等价：重新分词会改变 token 序列，非 content 通道（reasoning_content、tool_calls）丢失，且重算前那次生成的输出会与新一次生成拼接在一起。报告给出一条完整可核对的 chat 请求示例，并指出这是正确性问题而非仅精度风险；环境为 vllm-ascend releases/v0.23.0 @ d17a99c + vLLM v0.23.0 @ 0fc695f，issue 2026-08-04 open。
  source: 2026-08-04 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13466 （open）
  behavior: 开启 decode 侧重算后，触发了重算的对话请求返回的回答与前面已生成的内容接不上：思考过程消失或与另一次生成的片段混在一起，工具调用字段丢失，多轮对话里模型像记得一段被改写过的历史。未触发重算的普通请求完全正常，所以只在压测或长会话里偶发。
  trigger_surface: PD 分离 + decode 侧 recompute_scheduler_enable + 示例负载均衡代理的 chat 重试路径
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
