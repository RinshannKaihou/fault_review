aliases: []
title: PD 代理用解析文本重建重算请求致历史污染
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: vllm
    component: recompute 调度与代理
  behavior: 调度器返回 new_token_ids=[] 与 stop_reason="recomputed" 丢弃历史，代理只累加解析 content 后用 messages[0][content]=prompt+文本 重建。
effect:
  objects:
  - 输出内容
  - 跨请求/跨样本数据
  detail: decode 侧开启 recompute_scheduler_enable 且经示例代理重试时，重算请求不再从原 token 历史续写：重新分词改变 token 序列，reasoning_content、tool_calls 丢失，重算前那次生成的输出与新一次生成拼接在一起。
  visibility: 静默错误
mitigation:
  detect: 开 recompute_scheduler_enable 后对比重算请求的 token 历史与实际下发文本；检查响应里 reasoning 流是否缺失。
  fix: 待定（issue 2026-08-04 open）：应从 output_token_ids 续写，而不是从解析文本重建 message。
