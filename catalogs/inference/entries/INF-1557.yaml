original:
  mechanism: cann/ops-math ReduceStdV2Update 的 Arch35 kernel 有两类确定性精度错误。一是多轮 mask 计数被重复递减：AscendC::Reg::UpdateMask<float>(remaining) 本身会通过引用自动更新 remaining，kernel 在调用后又手工递减一次，处理元素数超过单轮 FP32 mask 容量 64 时，后续数据可能被直接跳过——输入 128 个元素时后半部分不参与计算，方差和标准差随之错误。二是 FP16/BF16 group tail-A 路径源步长算错：UB 中 tail-A 的 padding 按输入 dtype 的 32B 对齐生成，Phase1OutputToWorkspace 却按 FP32 计算 cache 源步长，FP16/BF16 实际对齐宽度应为 16 个元素、错误实现按 8 个元素算，workspace 搬运读到 padding 区域，部分输出变 0（用例中索引 2、3、6、7 异常）。复现环境 Ascend950DT_9582 + CANN 9.2.0，ops-test-kit e559b7f1f550；场景一 FP32 shape=[8,16]、dim=[1]、correction=1、if_std=true/false 两态；场景二 wb_reduce_std_v2_update_0165（bfloat16）与 _0201（float16），shape=(2,256,2,256,2)、dim=[1,3]。
  source: 2026-08-11 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2593 （closed）
  behavior: 在 Ascend950 上对 128 个元素的 FP32 输入做 dim=[1] 的 reduce_std/var，输出前半段对、后半段错；换到 FP16/BF16 的多轴分组用例，输出里索引 2、3、6、7 直接变成 0，看起来像那几个位置的方差恰好为 0，实际是搬运读了 padding。没有报错也没有 NaN，只能靠和 CPU golden 逐元素比才发现。
  trigger_surface: ops-math ReduceStdV2Update Arch35（Ascend950DT + CANN 9.2.0）；元素数超 64 的多轮 mask 路径、FP16/BF16 的 group tail-A 归约路径
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
