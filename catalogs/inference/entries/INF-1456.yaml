title: vLLM prompt_token_ids 无连接器时替换渲染 prompt
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: vllm
    component: prompt_token_ids 复用路径
  behavior: 请求带 kv_transfer_params.prompt_token_ids 时 renderer 把 id 直接喂引擎替换渲染的 messages，跳过 template 与分词；无 connector 检查，任何 server 生效
effect:
  objects:
  - 输入编码
  detail: 客户端可发无害 messages 而模型跑在自选 token 序列上，chat template 与 system prompt 被移除；仅影响请求者自身响应（安全团队定级常规 issue）；0.27.0 引入、0.31.0 复现、main 仍缺检查
  visibility: 静默错误
mitigation:
  detect: 对照带/不带 kv_transfer_params.prompt_token_ids 的渲染输出 token 序列（issue 附无 GPU 复现脚本）
  fix: 上游修复未见（issue open，经安全团队转常规）；规避：入口层（网关）拒绝非 P/D 部署的 kv_transfer_params 字段
