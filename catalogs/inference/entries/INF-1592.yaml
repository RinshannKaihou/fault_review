id: INF-1592
legacy_ids: []
slug: hcomm_roce_cqe_owner_period_wrong_sq_deadlock
aliases: []
title: RoCE CQE owner 翻转周期算错致通信卡住
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: 通用
    component: Roce3GetOneCqe CQ 消费
  behavior: Roce3GetOneCqe 用 cqDepth+1024 作 owner bit 翻转周期与取模掩码；驱动把请求深度 31744 向上取整成 32768 后该值变 33792，不再是 2 的幂，掩码与周期同时失效。
effect:
  objects:
  - 可用性/进度
  detail: A5 950PR NDA RoCE 上 16 rank AllReduce（INT32、count=268435456）必然卡死：消费索引 ≥1024 后只读 slot 0~1023，新 CQE 被判为旧回执，SQ credit 不归还，SQ(16384) 写满后通信挂死。
  visibility: 挂起
mitigation:
  detect: 看建链诊断日志里 CQ_DEPTH 与 oldModelRingSize（CQ_DEPTH+1024）是否仍为 2 的幂；或统计 consIndex 超过 1024 后 CQE 是否还在被消费
  fix: issue 给出修复：ownerPeriod 取 cqContext_->cqDepth、slot 用 consIndex % ownerPeriod、owner 期望值按 (consIndex/ownerPeriod)&1 计算，不再依赖“cqDepth+1024 是 2 的幂”；issue 已 closed，合入与发布未核实
