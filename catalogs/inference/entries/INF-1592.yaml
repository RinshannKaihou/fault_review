original:
  mechanism: cann/hcomm 的 src/legacy/ascend950/unified_platform/resource/connection/aicpu/rdma_vendor_1825_ops.h，Roce3GetOneCqe 是 RoCE 路径每次 poll CQ 判断“这条回执是不是新的”的底层函数。代码以 cqDepthReal = cqContext_->cqDepth + ROCE_CQE_MAX_GEN_NUM(1024)、cqeMask = cqDepthReal-1、calHwOwner = ((consIndex & cqDepthReal)==0) 计算期望 owner。请求深度是 31×1024=31744（NDA_CQ_DEPTH_FOR_UBNIC），选这个值正是为了让 31744+1024=32768=2^15 可用位掩码；但驱动实际分配 32768（向上取整到 2 的幂），cqDepthReal 变成 33792，掩码 0x83FF（bit10~14 清零）。建链诊断日志实测：SQ_DEPTH=16384, WQE_SIZE=64, CQ_DEPTH=32768, CQE_SIZE=64, oldModelRingSize=33792。残废掩码下 consIndex 0~1023 碰巧映射到 slot 0~1023；consIndex=1024 时 1024 & 0x83FF = 0，从 index 1024 起软件永远只读 slot 0~1023，而真正的新 CQE 写在 slot 1024~32767，这些槽里是 owner 为旧值的残留回执，owner 检查不过。
  source: 2026-09-09 GitCode cann/hcomm issue https://gitcode.com/cann/hcomm/issues/867 （closed）
  behavior: 16 rank AllReduce 传 1GB INT32 数据时进程不报错也不退出，npu-smi 看设备忙、通信卡住不动，HCCL_EXEC_TIMEOUT 到点才失败；同样的模型和数据在小数据量下正常，只有 CQ 环被消费过一圈（index 越过 1024）后必现，报错日志里看不到任何 CQE 相关的提示。
  trigger_surface: A5 950PR + NDA RoCE + AICPU_TS + CQ 深度被驱动向上取整（CQ_DEPTH=32768 而请求 31744）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
