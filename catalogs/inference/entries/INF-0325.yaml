  meta: '`ambiguous`（addcmul 两条路径乘法结合次序不同：(b·c)·value vs (value·b)·c → 路径间数值不一致） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '`ttnn.addcmul` 有两条实现：LLK SFPU 内核先乘标量（`value_float * a_in1` 再乘 `a_in2`，与 `torch.addcmul` 一致）；composite fallback（`_addcmul`）先做张量积 `b*c` 最后乘标量。浮点乘法不可结合 → 两路径结果系统性不同，仅其一匹配注册 golden。路径选择取决于 dispatch 条件——同一语义 op 在不同配置下数值漂移。'
  source: 'tt-metal #53282（2026-08-17 open，community，IssueType: Bad Outputs）。https://github.com/tenstorrent/tt-metal/issues/53282'
