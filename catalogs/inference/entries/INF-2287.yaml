  behavior: arch92 AnalyzeOptionalDn 允许 pse_type=2/3 与内部 dropout 进 DN kernel，但 ProcessVec1Dn 不读 PSE、不用 dropout，attentionOut 出错。
effect:
  objects:
  - 数值结果
  detail: 实测对照（fp16，S1=507，D=219）：pse_type=2+keep_prob=0.6+sparse_mode=2 失败；keep_prob=1+sparse_mode=2 仍失败；sparse_mode=0+keep_prob=1 通过；代码原因为静态检查结论。
  visibility: 静默错误
mitigation:
  detect: pse_type=2/3、keep_prob<1 组合对拍 golden（attentionOut/softmaxMax/softmaxSum）；arch92 DN 选择条件日志。
  fix: 修复方案见关联 PR https://gitcode.com/cann/ops-transformer/merge_requests/14821 （open：arch92 普通/变长 tiling 的 AnalyzeOptionalDn 对 hasPse/hasDropOut 场景回退 ND，待 DN 内核支持后再放开；含回归方案，未合入）
