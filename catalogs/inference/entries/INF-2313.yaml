  - 数值结果
  detail: Python 整数模型：N=2^32→totalLength=0/blockDims=0、N=2^32+1→1/1；CheckShape 无 N<=UINT32_MAX 检查。静态分析定位，未实机复现（单份 localOut 即 64GiB）。
