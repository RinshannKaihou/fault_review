original:
  mechanism: 'cann/ops-transformer attention_update A2/A3 使用的 legacy Tiling 在无范围检查下将输入 LSE 第 0 维 N 从 64 位 shape 窄化为 uint32_t（issue #6953 静态分析，master 72e64e29）：op_host/decode_update_tiling.cpp:85 `const uint32_t totalLength = lseShape.GetDim(LSE_TOTAL_LENGTH_DIM)`，第 92 行用该值计算 blockDims、第 106 行写入 TilingData；API 侧 op_api/aclnn_attention_update.cpp:153 CheckShape 只比较各 Tensor 的 N 是否相等，无 N<=UINT32_MAX 检查；kernel 注释声称 Tiling 保证范围但无对应校验。报告者以 Python ctypes 最小模型验证 Host 整数逻辑：N=2^32→窄化 0→blockDims=0；N=2^32+1→窄化 1→blockDims=1（40 核模型）。确认 N 来自用户 Tensor shape、上游无限制；不是 GM 地址表达式宽化问题而是 Tiling 入口丢高位。注意事项：证据等级为源码静态分析+Host 整数模型，报告者明确未做 NPU 实机复现（N=2^32+1 时单份 localOut 超 64GiB）；触发需要天文级内存的形状，实际可达性低，但机制上属静默生成与原始 shape 不符的 TilingData。'
  source: GitCode issue https://gitcode.com/cann/ops-transformer/issues/6953 （open，2026-10-30 创建；静态分析+ctypes Host 模型验证，附源码行链接）
  behavior: 给 attention_update 传第 0 维超过 42.9 亿（UINT32_MAX）的张量：tiling 入口把维度值截断成 32 位再算分核，N=2^32 被当成 0、N=2^32+1 被当成 1，接口不报错，生成与真实形状不符的调度参数，后续计算静默错乱。注意这是源码审查+Host 整数模型验证的结论，报告者未在 NPU 上实际分配这么大内存复现；当前硬件上真实触发需要超过 64GiB 的单张量，实际影响为低概率边界，但一旦未来支持超大形状即成静默陷阱。
  trigger_surface: cann/ops-transformer attention_update；A2/A3 legacy tiling；LSE/out 第 0 维 N>UINT32_MAX（需超大内存，实际可达性低）；静态定位未实机复现。
  signature: Host 模型：N=2^32→blockDims=0、N=2^32+1→blockDims=1；两段不返回参数错误。
  repro: issue 附 Python ctypes 整数窄化模型（无需 GPU）；未实机复现已注明。
  discovery: 2026-10-30 每日扫描
