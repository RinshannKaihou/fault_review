    component: decode_update_tiling N 窄化
  behavior: decode_update_tiling.cpp:85 把 64 位 N 窄化为 uint32_t 且无范围检查，N>UINT32_MAX 后分核与 TilingData 用截断值，与实际形状不符。
effect:
