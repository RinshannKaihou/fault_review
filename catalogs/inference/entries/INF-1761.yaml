id: INF-1761
legacy_ids: []
slug: ops_nn_compare_data_zip_silent_truncation
aliases: []
title: compare_data.py 用 zip 比对致多余输出漏检
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: compare_data 脚本族
  behavior: 90/123 个 compare_data.py 用 zip(golden_file_lists, output_file_lists) 逐对比对，两侧文件数不一致时 zip 静默截断，多出的 output 文件既不比对也不报错。
effect:
  objects:
  - 测试判定
  detail: 2 golden + 3 output（第 3 个为垃圾 999.0）实测判 PASSED；多出或命名错位的 output 文件不被比对也不报错，回归看着全绿，实际验证从未覆盖那份输出；涉及 optim/loss/pooling/quant/matmul/experimental。
  visibility: 静默错误
mitigation:
  detect: 在用例目录多放一个合法命名但内容错误的 *output*.bin，若脚本仍 PASSED 即为命中；也可静态查 zip 前是否有数量校验。
  fix: 待定（issue closed，未给 MR）：循环前校验两侧文件数，不等即 FAILED 退出，并配对 basename 拦截命名错位。
