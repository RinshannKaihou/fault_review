title: 流式工具调用把内部标记泄漏进输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: GLM 流式解析器
  behavior: 本应留在模型管线内部的 reasoning/工具标记出现在对外增量里，并可混入工具名或参数。
effect:
  objects:
  - 输出内容
  detail: GLM-5.1 W4A8 流式且带 tools 时，HTTP 多为 200、响应表面正常；正文夹带 </think>、<tool_call> 等内部标记，有时整块替代正常 tool_calls；工具名可被污染，按 JSON 解析 tool_calls 会拿到非法函数名或空参数。
  visibility: 静默错误
mitigation:
  detect: 对流式 + tools 请求逐 delta 检查是否出现 <think>/<tool_call>/<arg_key>/<arg_value>；用严格 JSON 解析器校验 tool_calls 的 name 与 arguments
  fix: 待定（issue open，只给泄漏分类与样例，未附修复 PR）
