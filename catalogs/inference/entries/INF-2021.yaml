original:
  mechanism: vllm-ascend issue 12398（2026-07-20，open）。GLM-5.1 W4A8 + vllm-ascend 0.18.0，流式 chat/completions 且带 tools 回放时，本应留在模型管线内部的标记出现在对外增量里，分四类：reasoning 边界标记 <think>/</think>、<thinking>/<reasoning>，多在工具调用之前出现且无配对开标签；XML 形态的 <tool_call>/<arg_key>/<arg_value> 整块（有时整块替代正常 tool_calls）；标记注入工具名或参数，例如 [tool_call:Grep-n</arg_key><arg_value>true</arg_value>]{...}，产出非法工具名；另有 <button>/<summary>/<tool_result> 类尖括号 token 混入参数文本。报告者指出多数情况 HTTP 仍为 200、响应表面正常，症状在流式 + tools 下最明显，不同部署实例泄漏形态不同，未给出代码定位或修复 PR。
  source: 2026-07-20 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/12398 （open）
  behavior: 开着 tools 流式调用时，客户端收到的正文里会夹带 </think>、<tool_call>、<arg_key>、<arg_value> 这类内部标记，HTTP 还是 200、表面上像正常回复；严重时工具名本身被污染成 Grep-n</arg_key><arg_value>true</arg_value>，任何按 JSON 解析 tool_calls 的下游都会拿到非法函数名或空参数，只有人肉看文本才能发现。
  trigger_surface: GLM-5.1 W4A8 流式接口 + tools/工具调用解析路径
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
