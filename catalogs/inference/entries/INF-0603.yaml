  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（Ministral-3-14B-Instruct-2512 FP8（官方 0.28.0 镜像、RTX PRO 5000 72GB Blackwell SM120）持续负载下 EngineCore 死于 `CUDA error: an illegal memory access`（async_utils.py:168 `copy_event.synchronize()` 处浮出），同秒内核日志 Xid 13 "Graphics SM Warp Exception"；`VLLM_DISABLED_KERNELS=FlashInferFP8ScaledMMLinearKernel` 或 `--enforce-eager` 任一即消失——指向 FlashInfer FP8 scaled MM 线性内核在 SM120 的负载相关 IMA） · Cov: `var:vllm_flashinfer_sm120_nvfp4_fp8kv_16token_ima`（6.160 SM120 FlashInfer IMA 族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 环境：PyTorch 2.13.0+cu130、flashinfer 0.6.16.post3、`Selected FlashInferFP8ScaledMMLinearKernel for Fp8LinearMethod`、FULL_AND_PIECEWISE cudagraph、prefix caching + chunked prefill 开。两个消融开关（禁用该 kernel / eager）都消除故障，把根因收窄到该 kernel（或其与 graph capture 的组合）而非 FlashInfer 注意力后端（日志为 FLASH_ATTN）。故障为持续负载下概率性显形。
  source: 'vLLM #55571（2026-09-06 open，bug/quantization label，含 collect-env、启动配置、Xid 13 内核日志与双消融对照）。https://github.com/vllm-project/vllm/issues/55571'
  behavior: 运行期 EngineCore 死亡（Xid 13 + IMA，fail-loud）——生产服务在负载下随机崩（SLO 破坏型）。6.160（sm120 NVFP4+fp8KV 16-token IMA）之后 SM120×FlashInfer 数值内核 IMA 族第二例：本条在**线性层 scaled MM**（6.160 在注意力），共同指向 SM120 上 FlashInfer 生成内核的边界检查/布局假设缺陷面。
  trigger_surface: vLLM + SM120（RTX PRO 5000/6000 Blackwell）+ FP8 权重 + FlashInfer scaled MM + 持续负载（hw_specific；负载+平台组合）
  discovery: 2026-09-06 每日扫描。
