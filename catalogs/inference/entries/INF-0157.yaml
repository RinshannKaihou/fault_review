  meta: '`infra_off`（`ttnn.unary_chain` 在**头 op 派发到特化 kernel**时静默丢弃其后所有 op：`get_compute_kernel_path` 只看链头选 kernel，特化 kernel（hardswish/logit/lgamma/logsigmoid/identity/where_tss/mac_tss）不含 `SFPU_OP_CHAIN_0` 展开点——`hardswish→square` 返回未平方的 hardswish 结果（负值，一眼可见 SQUARE 未跑）；无错误无警告） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: kernel 选择函数对 `ops_chain.size()` 无可见性；泛型 `eltwise_sfpu.cpp` 有 chain 展开宏、六个特化 kernel 计数为 0——链被截断成单 op。与 1.144（conv depthwise activation 守卫缺项）同「特化路径静默丢功能」族，本条丢的是**链尾算子序列**。
  source: 'tt-metal #55298（2026-09-03 open，ttsim BH 实测 + 逐 kernel SFPU_OP_CHAIN_0 计数表）。https://github.com/tenstorrent/tt-metal/issues/55298'
