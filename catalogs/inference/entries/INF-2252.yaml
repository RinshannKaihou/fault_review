original:
  mechanism: 'vllm-project/vllm-ascend PR #20113（2026-10-28，open，BugFix）：finegrained_tp_config.embedding_tensor_parallel_size>1 且 DP>1（空闲 DP 引擎跑 dummy batch）。三重失效（Atlas 900 A3，DP4×TP4/EP16 + dspark 推测解码复现）：1) 首请求挂起——空闲 DP 引擎 dummy batch 直接喂 inputs_embeds、跳过主模型 token embedding 查表，AscendVocabParallelEmbedding 的跨 DP all_gather/reduce_scatter 交换在空闲秩无对应贡献，busy 秩集合通信永不完成，首个真实请求到达后引擎在 HCCL 执行超时后死亡。2) HCCL EI0019/集合死锁/首请求数据损坏——交换组 HCCL communicator 在首次集合通信时惰性创建，首次交换落在请求路径上时各秩并发创建竞态（EI0019 endpoint 冲突）或死锁；竞态得逞时首次交换返回损坏数据，第一个请求从其 prefill 首 token 起解码乱码。3) draft embedding 失步——vocab plan builder 把所有 embed_tokens 路由为 FINE_GRAINED 含推测解码 draft 模型；draft 在 propose replay 期间喂 inputs_embeds（或不在配对交换步内查表），首调用使跨 DP 交换组失步，权重被切到其从不参与的组上。issue 1 是既有缺口（该旋钮从未与空闲 DP 引擎组合使用过）非回归；1、3 仅影响 dummy batch 喂 inputs_embeds 的模型（多模态输入与 prompt-embeds），纯文本 dummy 携带 input_ids 已自配对。修复：model_runner dummy join（uses_inputs_embeds 门控）、plan builder 限制主模型模块、load_model 后容量预热交换（NZ/early-kernel 预热线程 join 后）急建 communicator。'
  source: https://github.com/vllm-project/vllm-ascend/pull/20113
  behavior: 在 DP>1（如 DP4）开启 embedding 细粒度 TP 部署多模态或 prompt-embeds 模型时：要么第一个真实请求永远不返回（busy 秩集合通信无对端，直至 HCCL 超时、引擎死亡，日志可见 HCCL 执行超时/EI0019）；要么竞态下第一个请求从 prefill 第一个 token 起输出就是乱码；带 DSpark 推测解码时 draft 权重分片错组还会让交换组持续失步。纯文本模型不受影响。
  trigger_surface: vllm-ascend + finegrained_tp_config.embedding_tensor_parallel_size>1 + DP>1 + inputs_embeds 型模型（多模态/prompt-embeds）+ 首真实请求；DP4×TP4/EP16+DSpark、Atlas 900 A3 复现。
  discovery: 2026-10-28 每日扫描
