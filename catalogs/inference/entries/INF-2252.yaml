title: vllm-ascend embedding 细粒度 TP 空闲秩失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: finegrained embedding TP
  behavior: embedding 细粒度 TP>1 在 DP>1 下，空闲 DP 引擎 dummy batch 直接喂 inputs_embeds 跳过查表，跨 DP 交换无对端、busy 秩集合通信挂死；HCCL 惰性创建竞态损坏首交换。
effect:
  objects:
  - 可用性/进度
  - 跨请求/跨样本数据
  detail: 三种失效：首请求 hang 至 HCCL 超时引擎死亡；HCCL EI0019/集合死锁；竞态下首请求从 prefill 首 token 起乱码。DP4×TP4/EP16+DSpark 在 Atlas 900 A3 复现。仅影响 inputs_embeds 型模型。
  visibility: 挂起
mitigation:
  detect: 首请求 HCCL 执行超时日志与 EI0019 报错可诊断；首 token 乱码需输出侧检查
  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/20113 （open，2026-10-28）：dummy join（镜像 LM-head join，零 token 按组定容量入交换）、draft 模型 embedding 回退标准 TP 布局、load_model 后预热交换提前建 HCCL communicator；复现与修复均在 Atlas 900 A3 验证；未合入未发布）
