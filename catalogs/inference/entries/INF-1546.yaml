slug: vllm_ascend_zero_draft_rng_advance
aliases: []
title: 零 draft 请求仍推进采样 RNG 致输出不可复现
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: sample_recovered_tokens
  behavior: 对每个请求先执行 temp_q.exponential_(generator) 再用 torch.where 丢掉，num_draft_tokens=0 的请求虽然不采用 temp_q，其 generator 状态已被一次整表抽样推进。
effect:
  objects:
  - 输出内容
  - 输出分布
  detail: 同一 seed 下，某个请求在推测解码步里有没有 draft 会改变它后续的采样序列：零 draft 请求的随机流被多抽一次，输出与参考/重跑不一致。
  visibility: 不可复现
mitigation:
  detect: 对 num_draft_tokens=0 的请求在 sample_recovered_tokens 前后比对 generator 状态（或重放同一 seed 的采样序列）；#4587 之前的逐请求实现可作为语义参考
  fix: 待定（issue open）；修复：恢复逐请求判断，只有 num_draft_tokens[i]>0 时才调用 exponential_，并补零 draft 不推进 RNG 的回归测试
