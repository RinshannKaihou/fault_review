original:
  mechanism: 'sample_recovered_tokens() 在请求没有 draft token 时也会推进该请求的 seeded generator。当前实现先对每个 generator 做 temp_q.exponential_(generator=generator)，再用 torch.where(has_draft_mask[i], temp_q, q[i]) 选择：当 num_draft_tokens[i]==0 时 torch.where 丢掉了 temp_q，但 exponential_ 已经按整个词表规模抽了一次，per-request RNG 状态被推进。这是 #4587 向量化引入的回归——在此之前实现显式保留了零 draft 请求的 generator 状态（注释写明不要为该请求生成随机数）。报告同时指出该缺陷可以用 generator 状态的单测和代码走查确认，不依赖硬件；并推测它可能贡献了 #13441 观察到的输出变化，但因为缺少原始 token id 与零 draft 轨迹，未断定因果。'
  source: 2026-08-05 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13608 （open）
  behavior: 用固定 seed 跑推测解码时，同一请求同一输入重跑会得到不同结果，而且差异出现在后续若干步：某些请求在这一步没有 draft（被语法约束全部裁掉、或本来就没有 draft），它们的随机流却被悄悄多抽了一次，于是之后的采样序列整体偏移——表现为“同 seed 不可复现”，或换 batch 组合（谁和谁同批、谁有没有 draft）结果就变。贪心解码不受影响。
  trigger_surface: 推测解码 + temperature>0 采样，且 batch 中存在 num_draft_tokens=0 的请求（draft 被裁光或首步无 draft）；固定 seed 重跑即可观察到不一致
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
