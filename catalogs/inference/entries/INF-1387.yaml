cause:
  objects:
  - subsystem: KV缓存
    stack: 通用
    component: ScatterPaKvCache host 检查
  behavior: 空态早退分支未覆盖 slotMapping：空/不足的 slotMapping 不早退不报错直接透传 kernel；tiling 以 key.dim0 推导 numTokens 去索引 slotMapping，越界读后写出错误结果。
effect:
  objects:
  - KV状态
  detail: key=[2,2,32] fp16 对照组合法 slotMapping=[0,1] 时写 128 元素；slotMapping=[](空)或[1000](不足+越界)时均 0/SUCCESS 但只写 64 元素（丢一个 token 的 scatter），无告警。
  visibility: 静默错误
mitigation:
  detect: 非法 slotMapping 下检查写入元素数与 key.dim0 一致性（报告含 ctypes 直调三用例实测表）
  fix: 待定（open；报告建议空态分支纳入 slotMapping 或元素数不一致返回 161002）
