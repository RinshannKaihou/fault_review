original:
  mechanism: aclnn_scatter_pa_kv_cache.cpp:476-488 空态早退仅覆盖 key/keyCacheRef 与 value/valueCacheRef，slotMapping 未纳入；:341/:405 未判空即 Contiguous 透传；CheckShape(:192-210) 不约束 slotMapping 元素数与 key token 数一致；tiling(scatter_pa_kv_cache_tiling.cpp:339/381/416) params_.numTokens=inputKeyShape_.GetDim(DIM_0)——取值对象（key）与真正被索引对象（slotMapping）不一致。ctypes 直调 libopapi_transformer.so 实测（910B2、CANN 9.2.0-beta.2、PA_NZ）：合法对照写 128 元素；slotMapping=[0]（空 numel==0）与 [1]={1000}（不足+越界槽位）均返回 0 SUCCESS 且 workspaceSize 与合法用例相同（16777728，证明确实下发了 kernel），写入元素降为 64——丢失一个 token 的 scatter，无告警。
  source: 'cann/ops-transformer #6114（2026-10-13 open，含源码行号、tiling 机制与 NPU 实测三用例表）。https://gitcode.com/cann/ops-transformer/issues/6114'
