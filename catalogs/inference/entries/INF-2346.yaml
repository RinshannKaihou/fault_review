  detail: 'grid 乘积恰好 2^32 的形态回绕为 0（main-dev 已由 #2875 修复同源缺陷，release/3.2.2 旧 driver.py 路径未覆盖——#2834 修复不完整）；只放宽 workspace 侧，block_dim 形参仍须 32 位（语义不同）。'
