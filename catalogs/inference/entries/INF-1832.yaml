title: AOT 编译缓存键漏 enable_custom_op 致复用错图
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: vllm
    component: AOT 缓存键
  behavior: AOT 缓存键只由 env hash、compute_hash、版本+函数位置组成，决定 trace 到哪些 Ascend 内核的 enable_custom_op() 既不在键里，加载时也没有校验。
effect:
  objects:
  - 数值结果
  - 性能/资源
  detail: 同一缓存目录下换了自定义算子选择（开/关 Ascend 融合算子）仍会命中旧图，进程实际运行与当前环境应得的不同内核实现，前端表现为精度偏差或本该生效的融合路径静默不生效。
  visibility: 静默错误
mitigation:
  detect: 对比 AOT 命中日志中的 factors 与当前环境变量；同一缓存目录切换 enable_custom_op 后重跑基线精度。
  fix: 待定（issue 2026-08-28 open）：把 enable_custom_op 纳入缓存键或在加载时校验。
