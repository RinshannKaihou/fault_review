original:
  mechanism: 开启 AOT compile 后，缓存图可以被加载进一个「按当前环境应当 trace 出另一张图」的进程，因为决定哪些 Ascend 内核被 trace 的 enable_custom_op() 既不在缓存键里，也不在加载校验里。报告的键构成来自 aot_compile_hash_factors()（vllm/compilation/caching.py:573）与 _model_hash_key()（decorators.py:255）：vLLM 自身环境变量的 hash（envs.compile_factors()）、vllm_config.compute_hash()、vLLM 版本 + forward.__qualname__ + forward.__code__.co_firstlineno。对照可见非 AOT 路径的 cache dir 是按 factors = [env_hash, config_hash, code_hash, compiler_hash] 组装的，而 enable_custom_op 这一项在两条路径里都没有被覆盖。结果是同一个缓存目录在切换自定义算子选择后仍命中旧图，进程实际执行与当前环境意图不同的内核实现。issue 2026-08-28 open。
  source: 2026-08-28 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15188 （open）
  behavior: 在一台机器上用某套自定义算子开关跑过之后，另一个进程/容器用不同开关启动，AOT 缓存仍然命中，编译阶段看起来「秒过」，但跑出来的结果与关掉缓存的基线不一致，或者某个融合算子该生效却没生效，且没有任何提示说明缓存被跨配置复用了。
  trigger_surface: AOT compile 缓存目录复用 + enable_custom_op 选择变化
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
