  - 可用性/进度
  - 性能/资源
  detail: 混部 prefill/decode 准入下，多 KV 分组模型周期性停顿，所有在途请求一起冻住约 5.5 秒后恢复；停顿时刻出现新 Triton 缓存目录，单节点可累积 135 个键，重启后复发。
  visibility: 挂起
