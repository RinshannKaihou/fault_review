  detect: 对照 Triton 缓存目录新增时刻与请求停顿；剔除 stall 后吞吐应与 MRV2 一致（824 vs 818 tok/s）；检查内核签名是否把 NUM_REQS/tile 当 constexpr
  fix: 待定（issue closed 未附修复 PR；建议 num_reqs/num_tokens 走 do_not_specialize 或收敛 tile 集合，未核实）
