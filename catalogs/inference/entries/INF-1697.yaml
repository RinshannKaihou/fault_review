  behavior: 规约块大小先做 totalS2/32 整除丢余数、ORI 尾块与 CMP 首块沿用同一 s2LoopCount、MQSMLA 重划 ORI 后未同步 cmpS2Start，使 reduceBlockId 与 metadata 分块不一致。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: SMLA/MQSMLA 开启 batch_consistency 后，同一输入与权重下仅改变 batch 切分和执行顺序，输出不一致，batch consistency 用例直接失败；某些 S2 尾块落在分块边界上的用例整核卡死、计算超时，日志无精度报错，仅任务不返回。
  visibility: 不可复现
mitigation:
  detect: 开启 batch_consistency 后按不同 batch 切分与 order 复跑同一输入，比较逐点输出；同时观察 AIV 零行是否导致超时
  fix: issue 即修复说明：块大小改 (totalS2+31)/32 再上对齐、新增 reductionLoopCount 补齐逻辑计数、重划后置 cmpS2Start=oriS2End、零行 AIV 不发该事件（closed，未核实合入版本）
