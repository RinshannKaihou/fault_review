title: vLLM 显式 truncation_side 截掉特殊 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: 分词/模板
    stack: vllm
    component: truncate_prompt_tokens 截断
  behavior: 带显式 truncation_side（即使与默认同值）时截断作用于加特殊 token 后的序列而非 prompt，截断端特殊 token（BOS/[CLS]/[SEP]/EOS）被切掉；不设该字段则保留特殊 token
effect:
  objects:
  - 输入编码
  detail: 嵌入/池化模型的 prompt token 序列静默缺结构性特殊 token：BERT 类丢 [CLS]/[SEP]、Llama 丢 BOS、Qwen3-Embedding 丢 pooling 用 EOS；Cohere /v2/embed truncate=START 同路径
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（issue 提供可复现 CPU 级最小复现：render server + tiny-random-LlamaForCausalLM 的 /v1/completions/render，unset vs "left" 输出 [1,17366,11203,29889] vs [278,17366,11203,29889]；与 AutoTokenizer 行为对照）
