id: INF-2070
legacy_ids: []
slug: torch_npu_inductor_mlir_resnet18_wrong_output
aliases: []
title: Inductor MLIR 后端编译 ResNet18 静默输出错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: inductor MLIR 后端
  behavior: MLIR 后端把整张图捕获成 graph_count=1 的单图后直接下发，编译过程无异常也无数值校验，生成的代码在 FP32 上给出与 eager 完全不符的结果且不回退
effect:
  objects:
  - 数值结果
  detail: MLIR 后端编译 FP32 ResNet18 时输出与 eager 999/1000 元素不符；五轮独立编译 max_abs 在 2.48~4.20 波动，换输入仍全错；同环境 DVM 或默认 Triton 后端 max_abs ≤1.5e-06。
  visibility: 静默错误
mitigation:
  detect: 对同一权重分别跑 eager 与 compiled 输出并做 assert_close；监控编译后 max_abs 而不是只看编译是否成功
  fix: issue 未附修复 PR（open，状态未核实）；报告者给出期望：MLIR 后端要么与 eager 在 FP32 容差内一致，要么显式报错/回退
