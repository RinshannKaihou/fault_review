original:
  mechanism: vllm 0.31.0 (pip) + nixl 1.5.0/nixl-cu13（bundled UCX）+ 2 节点 GH200 480GB（aarch64，driver 595.58.03，ConnectX 固件一节点 32.38.3057/另一 32.43.101）。KV cache 基址 4 GiB 对齐时 NixlConnector P/D decode 返回垃圾；UCX_CUDA_COPY_DMABUF=no 规避后正确（单变量对照）。机制指向 dma-buf MR 在该对齐下的地址回绕；环境已拆除，详细复现受限于已总结内容。
  source: https://github.com/vllm-project/vllm/issues/64048（环境+规避对照；环境已拆除为总结帖）
  behavior: 两节点 GH200 P/D 分离部署下，当 KV cache 物理基址恰好 4 GiB 对齐时，decode 端拿到的 KV 传输内容是垃圾、输出错误；设 UCX_CUDA_COPY_DMABUF=no 立即恢复正常。对齐条件依赖显存分配，时有时无、难以复现。
  trigger_surface: vllm 0.31.0 + NixlConnector P/D + GH200 + KV cache 基址 4 GiB 对齐 + UCX CUDA_COPY_DMABUF 路径。
