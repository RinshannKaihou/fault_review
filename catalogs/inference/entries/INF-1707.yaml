original:
  mechanism: 'ops-transformer issue #4294（2026-08-13 closed，Ascend910B3 + CANN 9.1.0-beta.3，ops-transformer HEAD 4b3d39658e1d，源码 --pkg 装成 vendor 内核 cann-ops-transformer-cann_scan_repro_linux-*.run 后复现，exit 42）：grouped_matmul_finalize_routing 的 A8W4 MSD 路径在 VectorAtomicProcess 中把 tokenRanks/rowIndex 强转为 uint64 outRow，随后直接对 yGm[outRow*n+...] 做 AtomicAdd，没有校验 outRow 是否在 [0, tokens) 内。代码位置为 gmm/grouped_matmul_finalize_routing/op_kernel/grouped_matmul_finalize_routing_antiquant_a8w4_msd.h L416-419。负 rowIndex 被强转成 uint64 后回绕为巨大偏移，越界索引在 GetWorkspace/Launch 阶段被静默接受：rowIndex=-1 时 GetWS/Launch SUCCESS、Sync 报 507057；rowIndex=1000000 时 Sync 报 507015；合法 rowIndex=0 正常。期望行为是 -1 与 1000000 在入口即被拒绝。Track A / Pattern P-011，Finding XFMR-GMMFR-001。'
  source: https://gitcode.com/cann/ops-transformer/issues/4294 （closed）
  behavior: rowIndex 越界（-1 或远超 token 数）时接口不拦，GetWorkspaceSize 和 Launch 都返回成功，看起来一切正常，直到 stream 同步才炸出设备异常（507057 / 507015）；而那次越界的 AtomicAdd 已经按回绕后的巨大偏移写进了显存，可能已经改坏别的 token 的 y 行。
  trigger_surface: grouped_matmul_finalize_routing A8W4 MSD（antiquant）路径，tokenRanks/rowIndex 含负值或 >= tokens
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
