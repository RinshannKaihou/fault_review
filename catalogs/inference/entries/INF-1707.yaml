title: GMMFinalizeRouting 未校验 rowIndex
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: gmm_finalize_routing
  behavior: A8W4 MSD 路径把 rowIndex 强转 uint64 outRow 后直接对 yGm 做 AtomicAdd，未校验 outRow 属于 [0,tokens)；负值回绕为巨大偏移。
effect:
  objects:
  - 数值结果
  detail: rowIndex=-1 时 GetWS/Launch 均返回 SUCCESS，直到 Sync 才报 507057；rowIndex=1000000 时报 507015；合法 rowIndex=0 正常。越界 AtomicAdd 发生在报错之前，可写坏其它 token 的行。
  visibility: 报错
mitigation:
  detect: 对 rowIndex 注入 -1 与 >=tokens 的值，确认 GetWorkspace/Launch 是否拒绝；用 memcheck 观察越界写
  fix: 待定（issue 为 P-011 防御性契约缺陷报告，未见修复 PR）
