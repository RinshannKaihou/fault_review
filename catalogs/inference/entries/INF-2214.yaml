  mechanism: Ascend 910_93（A3）+ CANN 9.0.0 built-in 与本仓源码编译双基线。moe_token_unpermute.h:244-265（PROBS :245 与非 PROBS :247 及尾循环 :263/:265）needCopyIn = acl_token_idx < num_out_tokens 无下界；:283-286 CopyTokenIn offset = in_token_index*hidden_size 负偏移 GM 越界读。moe_token_permute_grad.h:245,247,263,265 代码同型复制（类名同为 KernelMoeTokenUnpermute）；moe_index_copy.h:120-130 ifNumOutTokens 分支无下界、else 分支 :126 完全无校验。-1 是合法输入：moe_token_unpermute_with_routing_map 文档（aclnnMoeTokenUnpermuteWithRoutingMap.md:233）明确 -1 表示无效输入槽位，上游 moe_init_routing_v2/v3 expandedRowIdx 以 -1 初始化（vLLM 标准行为）。修法范本：moe_token_unpermute_with_routing_map_not_pad.h:228-233 IsValidInputIndex 双界判断。built-in 复现 bug、本仓源码加下界编译后消除，证明缺陷在当前 master。
  source: https://gitcode.com/cann/ops-transformer/issues/6814（三文件行号锚点 + 双基线对照 + 文档合法性引证）
  behavior: MoE 排布恢复类算子（moe_token_unpermute / moe_token_permute_grad / moe_token_permute 的 moe_index_copy）收到含 -1 的 sortedIndices（上游路由的合法无效标记）时，要么报 507035 设备错误，要么更糟：以负偏移越界读 GM 把别的数据当作 token 值静默返回，输出数值错误但接口返回成功。
  trigger_surface: CANN 9.0.0+（ops-transformer master）+ moe_token_unpermute/permute_grad/permute + sortedIndices 含 -1（vLLM MoE 标准流程产生）+ 未用 with_routing_map 变体；910_93 实测，同型代码全芯。
