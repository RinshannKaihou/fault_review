    component: add 算子 stride
  behavior: NPU eager add 把 channels_last 输入的 stride 改成 NCHW 连续布局，torch.compile 路径保留原 stride。
effect:
  objects:
  - 数值结果
  detail: shape (8,384,20,20)：CPU stride (153600,1,7680,384)，NPU eager (153600,400,20,1)；按 (153600,1,61440,384,7680) as_strided 后 100% 元素不匹配。
  visibility: 静默错误
mitigation:
  detect: 在 NPU 上对 channels_last 输入做 (x+1).stride() 并与 CPU 对比；或直接跑 as_strided 视图前后比对，NPU eager 与 compiled 结果会互相不一致
  fix: 待定（issue open，无修复 PR）：eager add 应保持输入 memory_format/stride，与 CPU 及 compiled 路径一致
