  meta: '`infra_off`（`ttnn.rpow(x, base)` 前向是 `base**x`（SFPU kernel 注释与 golden 一致）而 `rpow_bw` 返回 `grad*base*x**(base-1)`——**对 x** 求了导，正确是 `base**x*ln(base)`，两式仅在 x==1 相等；因 `x**(base-1)` 对负 x 非整数 base 无定义，op 对**每个 x<0** 强制 NaN（该处真值是普通有限数）；注册 backward golden 复刻了同一误读——**op 与 golden 一起错**） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`unary_backward.cpp` 把 rpow 的梯度公式认成 pow 的（参数序颠倒）；golden 同错意味着常规对拍测试原理上无法发现——错误被测试基础设施**双重背书**。实测 15.2² 梯度 286068 vs 正确 628.7（455× 错）。'
  source: 'tt-metal #55289（2026-09-03 closed，前向 kernel 注释/golden/导数公式三方对照 + host replay）。https://github.com/tenstorrent/tt-metal/issues/55289'
  behavior: 无 crash——梯度数量级错（可达数百倍）+ 负输入全域 NaN；「golden 与实现同源同错」是比 PCC 盲区更深层的测试失效形态（oracle 本身损坏），此前编目未见——**错误 oracle**新子签名。
  trigger_surface: Tenstorrent WH/BH + `ttnn.rpow_bw`（任意负输入即 NaN；软件 API 可触发）
  discovery: 2026-09-03 每日扫描。
