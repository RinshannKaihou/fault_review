title: TopKV2D 近值按容差判并列致错误索引
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: TopKV2D AICPU
  behavior: AICPU TopKV2D 的排序、单调分组、选择与堆路径统一以数值容差 IsValueEqual 判并列，把接近但不相等的值当作相等处理。
effect:
  objects:
  - 数值结果
  detail: '[1,1+2e-6,1+4e-6] k=1 largest 返回 index=0（应 2）；k=2 时 values[j]≠input[indices[j]]；修复版 4/4 组通过，原版 0/4；FLOAT/DOUBLE 均受影响。'
  visibility: 静默错误
mitigation:
  detect: 构造相差 1~2 ULP 的近似值，检查 top-k 索引与值是否仍与输入对应；比较 values[j] 与 input[indices[j]]。
  fix: 修复提交 f13883ba（报告者给出，仓内 UT 本轮未运行，发布状态未核实）
