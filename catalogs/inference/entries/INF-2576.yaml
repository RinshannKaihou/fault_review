original:
  mechanism: cann/ops-math math/top_k_v2_d/op_kernel_aicpu/top_k_v2_d_aicpu.cpp:64/:89/:129/:151 的排序、单调分组、选择与堆路径都用数值容差 IsValueEqual 判并列。实测 Ascend910B2（CANN 9.1.0、基线 02ebd8f9）：FLOAT [1,1+2e-6,1+4e-6]、largest=true、k=1 返回 index=0（应为 2）；k=2 时 values[j] 与 input[indices[j]] 不一致。DOUBLE 近值同样受影响。报告者把基线与修复提交 f13883ba 的完整 AICPU 生产翻译单元分别编译为独立 .so，经 aclrtBinaryLoadFromData/aclrtRegisterCpuFunc 在真实设备执行：原版 4 组定向用例 0/4 通过，修复版 4/4；完整 Host 回归 1200 组原版 819/381、修复后 1200/0。
  source: https://gitcode.com/cann/ops-math/issues/4797 （open，2026-11-16，含修复提交与设备对照）
  behavior: 取 top-k 时选到错误的元素，且返回值与索引对不上：k=1 时最大的元素根本没被选中，k=2 时 values[j] 与 input[indices[j]] 不是同一个数。下游采样、阈值筛选或多标签选择会基于错误的集合继续计算，接口无报错、无日志，只有在与严格排序参考对拍时才暴露。
  trigger_surface: AICPU TopKV2D；FLOAT/DOUBLE 近值输入；dim=0 等非末轴；Ascend910B2 + CANN 9.1.0；基线 02ebd8f9。
