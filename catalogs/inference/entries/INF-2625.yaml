title: vLLM INT4 KV 注意力漏 chunk/R-SWA 掩码
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: vllm
    component: unified_attention_int4 掩码
  behavior: INT4_PER_TOKEN_HEAD 分支调 unified_attention_int4 时不传 chunk_lookback/rswa_prefix_lens/rswa_window，kernel 用默认 -1/False。
effect:
  objects:
  - 数值结果
  detail: 启用 --kv-cache-dtype int4_per_token_head 且 TRITON_ATTN 时，chunk_lookback 层把局部注意力算成普通滑窗，R-SWA 层算成整段 causal，无报错无告警。
  visibility: 静默错误
mitigation:
  detect: 对含 chunk_lookback / R-SWA 的层，同输入分别用 int4_per_token_head 与 bf16 KV 跑 unified_attention，与按真实掩码构造的逐 token 参考比对。
  fix: 待定（issue open；建议把三个掩码参数透传到 int4 分支）
