original:
  mechanism: A5 机器上 vllm 单推理内容正常，接入 verl 后异常，于是用 msprobe dump 过程数据做对比：vllm 里采集正常，verl 里无数据。用户的改造方式是在 self.update_sampling_params(...) 上下文里 import PrecisionDebugger 与 seed_all，rank 0 建 PrecisionDebugger(dump_path=..., level='mix')，从 inference_engine.llm_engine.model_executor.driver_worker.worker.model_runner.get_model() 取到模型后 debugger.start(model=model, token_range=[1,2])，生成完再 debugger.stop()/debugger.step()。结果 dump.json 内容为 {"task":"statistics","level":"mix","framework":"pytorch","dump_data_dir":null,"data":{}}——元数据写出来了、data 是空对象。日志每步只打 'dump.json is at /home/.../dump_data_3/step0'，没有任何 error/warning 提示采集为空。issue 未给根因（token_range 与 verl generate 的 token 视图不匹配、hook 未命中模型、或 path 写错）与修复 PR。
  source: 2026-02-12 GitCode Ascend/msprobe issue https://gitcode.com/Ascend/msprobe/issues/43 （closed）
  behavior: 按参考改法把 msprobe 接进 verl 的 generate 流程后，每一步都打印 dump.json is at ... step0，看着采集在跑，打开文件却只有一个 task/level/framework 的壳，data 是 {}，dump_data_dir 是 null，一条张量统计都没有。同一台机器用 vllm 单独跑能正常采集，于是用户容易以为是 verl 的模型对象特殊、或者要调 token_range，而工具这边不给任何失败提示。
  trigger_surface: msprobe PrecisionDebugger 在 verl 训练回路（vllm 后端 generate）里的 rank0 挂载；level=mix、task=statistics；token_range=[1,2]
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
