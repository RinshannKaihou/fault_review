original:
  mechanism: 三条同一个前端（Triton on Ascend）上的问题，结论方向相反。①#160：POD 环境，按 /home/autotest/AutoTestProperty/op_mssanitizer_lingqu/Triton/out_of_bounds 下步骤（export PYTORCH_NO_NPU_MEMORY_CACHING=1、conda PY_311_PT_260、source ascend-toolkit/set_env.sh、mssanitizer -t memcheck python3 test_add.py）跑 triton add，预期能检出越界，实际没有检出越界。②#190：Ascend950PR、CANN 9.1.0-beta.3、triton 3.2.0、triton_ascend 3.2.2+dev20260724063007、torch 2.7.1+cpu、torch_npu 2.7.1.post4.dev20260327、mssanitizer 26.1.0-a9b9e9ea5c701cc8939017999fdd02c2e15905c2，FLA chunk_rwkv6_fwd_cumsum kernel（用例 05_rwkv6_cumsum_oob_memcheck，B=1,T=64,H=1,S=64,BT=16）报 GM 写越界 size 4，检测 tl.dot() 时同样报 OOB。③#145：950POD 上同一套 out_of_bounds 用例（test_mix/test_cube/test_add/test_multi_kernel）除 cube 外 mix、vector、多 kernel 均出现误报或报错；多 kernel 用例直接 python3 跑正常结束，mssanitizer 拉起后有各种报错。
  source: 2026-07-04 GitCode Ascend/mssanitizer issue https://gitcode.com/Ascend/mssanitizer/issues/145（closed）；2026-07-21 issue https://gitcode.com/Ascend/mssanitizer/issues/160（closed）；2026-08-19 issue https://gitcode.com/Ascend/mssanitizer/issues/190（closed）
  behavior: Triton 写的算子在 mssanitizer 下的结论基本不可用：越界的 add 用例什么都报不出来；同一目录里 mix、vector、多 kernel 用例在 950POD 上则要么报错要么刷假告警；tl.dot 和 FLA 的 cumsum kernel 明明是合法访问也会被报 GM 写越界。使用者无法区分是 Triton 算子真的越界，还是工具没跟上 triton_ascend 的下发方式。
  trigger_surface: Ascend 950POD/950PR + triton 3.2.0 / triton_ascend 3.2.2+dev；mssanitizer -t memcheck 包裹 python3 执行；triton out_of_bounds 系列用例
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
