  mechanism: LM-Infinite 用距离上限 `d' = min(d, L_pretrain)` 把超长相对距离夹到预训练范围内。该上限设置错误时两个方向都出问题：设得过高 → 相对距离仍然 OOD，相位爆炸；设得过低 → 远处的 token 全部坍缩到同一个位置，彼此不可区分。两种情形都损坏长程键的 RoPE。
  source: arXiv:2308.16137。
  behavior: 长上下文中远距离信息要么被噪声化，要么全部"挤"在一个位置上无法定位，近距离行为正常。
  trigger_surface: 非 vLLM 一等实现
  signature: 只作用于窗口外的键，因此是长度门控的 ambiguous。签名为**窗口外的键 position-id 被钉死/退化**：过低时远程键的相位表示秩塌陷——spectral（键子空间有效秩下降）最直接；过高时表现为 infra_off 式相位爆炸，geometric/trajectory 在远程位置段可见。窗口内位置的所有度量都正常，短 prompt 基线会漏检。
  repro: partial——在 RoPE 相位计算处对相对距离施加一个错误的 clamp（明显过低或明显过高），只影响超出窗口的键；LM-Infinite 的 Λ 形 mask 结构本身不复现。
  locus: index-position
  priority: medium
