id: INF-2323
legacy_ids: []
slug: torch_npu_310p3_fp32_gemm_silent_fp16_input
aliases: []
title: 310P3 fp32 GEMM/conv 静默按 fp16 输入精度计算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: 310P3 Cube matmul/conv 实现
  behavior: 310P3 的 Cube 单元路径将 fp32 声明输入按「fp16 输入+fp32 累加」计算，且 torch.npu.matmul/conv.allow_hf32 开关在该芯片上三态输出逐位相同、完全失效。
effect:
  objects:
  - 数值结果
  detail: matmul/addmm/F.linear/conv2d 输出与 fp16in 参照误差 1e-7~6.7e-5 吻合、与真 fp32 参照超容差 4~6 倍（2~4e-4），einsum 13/16 案超容差、稀疏错元约 1/20；无任何警告，无法经用户侧 API 恢复真 fp32。
  visibility: 静默错误
mitigation:
  detect: 固定 seed 三参照对照（真 fp32 / bf16 / fp16in=输入降 fp16 升回后 CPU 精算）；翻转 allow_hf32 三态验证输出是否逐位不变即可识别开关失效。
  fix: 待定（issue open，未见修复；A3 同版本代码开关正常，提示为 310P3 路径特有）
