original:
  mechanism: 'Ascend/pytorch issue #5785（2026-10-31，Atlas 310P3，torch_npu）：声明 float32 的 matmul/addmm/F.linear/einsum/conv2d 输出与「输入先量化到 fp16、再 fp32 累加」的 CPU 参照吻合（误差 1.47e-7~6.7e-5），与真 fp32 参照偏离 4~6 倍容差（1.99e-4~4.2e-4）。决定性实验：torch.npu.matmul.allow_hf32 显式置 False 并 readback 确认后输出逐位不变，默认/False/True 三态输出逐位相同，即该开关在 310P3 完全失效，降级无法经用户侧 API 关闭；torch.npu.conv.allow_hf32 同形态（默认 True，置 False 无效）。负对照：同芯片 softmax/layer_norm/cumsum 为真 fp32（1e-8 量级），说明降级仅发生在 Cube 单元路径；A3 上同三格算子为真 fp32 且开关生效。判读方法：每算子独立子进程、CPU 同码三参照（真 fp32/bf16/fp16in）、seed=20261031 双跑逐字节复现。einsum 13/16 案超容差（DIVERGE 1.9e-3~8.0e-3）。'
  source: GitCode issue https://gitcode.com/Ascend/pytorch/issues/5785 （open，2026-10-31 创建；含三参照误差矩阵与三态开关实验）
  behavior: 在 310P3 上对 float32 张量做 matmul/addmm/linear/conv2d/einsum，结果只有 fp16 输入精度：与真 fp32 参照误差约 2e-4~4e-4（超同 dtype 容差 4~6 倍），einsum 约 1/20 元素稀疏错值；全程无警告。把 torch.npu.matmul.allow_hf32 或 torch.npu.conv.allow_hf32 显式设为 False（readback 确认）输出逐位不变，用户无法恢复 fp32 精度；需要 fp32 数值保证的下游（如高精度投影、数值敏感层）会静默拿低精度结果。
  trigger_surface: Ascend/pytorch（torch_npu）310P3；fp32 的 matmul/addmm/F.linear/einsum/conv2d（Cube 路径）；A3 不受影响；softmax/layer_norm/cumsum 等向量路径不受影响。
  signature: fp32 GEMM 输出误差带 ~2e-4 且与「输入先转 fp16 再 fp32 累加」参照逐位级吻合；allow_hf32 三态输出逐位相同。
  repro: issue 附判读方法与固定 seed 脚本（每算子独立子进程 + CPU 三参照对照）。
  discovery: 2026-10-31 每日扫描
  notes:
  - 2026-11-01 补证 2026-11-01：#5787（kthvalue 值面 fp16 量化，INF-2350）证明该量化面不限于 Cube/GEMM 路径，选择类算子同中；原「降级仅发生在 Cube 单元路径」的边界表述据此修正
