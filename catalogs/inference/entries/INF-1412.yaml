original:
  mechanism: Blackhole fast_untilize unpack 路径（tt_metal/hw/ckernels/blackhole/metal/llk_api/experimental/llk_unpack_fast_untilize_api.h）在稠密多 tile MOP 与逐 tile BFP MOP 之间用只认 Bfp8_b/Bfp4_b 的谓词分流；unpacker 接受的其他块浮点输入（Bfp2_b 及 A-exponent 的 Bfp8/Bfp4/Bfp2，均为合法 CB 格式）被送进从单一基址步进 face、无法跳过每 tile 64 字节指数段的稠密 MOP，从第 2 个 tile 起指数读自上一 tile 尾数区，行主序输出静默错。LLK 自己的头注释写明 BFP 输入必须走逐 tile 路径正是为此。实测：tt-llk test_fast_untilize.py::test_fast_untilize_bfp2_b（Bfp2_b 输入、Float16_b/Float32 输出、4-tile 单元、36 变体）36/36 失败，tile0 正确、tile1 起每列垃圾（row0 [1,16,2.3e-13,…,-inf] vs golden [1,16,64,64,128,…]）。可达性：在树内无调用者传这些格式（ttnn 只暴露 BFLOAT8_B/BFLOAT4_B），手写 metal 程序或 tt-llk harness 可达。修复：谓词改用 IS_BFP_FORMAT 覆盖全部六个 BFP 码点。
  source: 2026-10-17 GitHub tenstorrent/tt-metal issue https://github.com/tenstorrent/tt-metal/issues/61110（36/36 实测，含修复方向）
  behavior: 在 Blackhole 上对 Bfp2_b（或 A-exponent Bfp8/4/2）输入调用 fast_untilize、数据跨多个 tile 时，第一个 tile 输出正确，第二个 tile 起整列静默错误（读到的是上一 tile 尾数区当指数算出来的垃圾值，含 ±inf）。不报错不挂起；树内 ttnn 路径暂不触达，手写 metal kernel 会命中。
  trigger_surface: Blackhole fast_untilize + Bfp2_b/A-exponent BFP 格式 + ≥2 tile；shipped 代码
  discovery: 2026-10-17 每日扫描
