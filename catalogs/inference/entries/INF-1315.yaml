  meta: '`infra_off` · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: LCKV 把层分为 warmup 层（自行计算 KV）与 condensed 层（复用顶层 KV）；warmup-vs-condensed 的分类存在差一错误，导致某个本应自行计算 KV 的 warmup 层错误地复用了 condensed 顶层的 KV。该层的查询于是与来自完全不同深度的键值做注意力。
  source: arXiv:2405.10637 + whyNLP/LCKV。
  behavior: 模型在特定层附近产生难以归因的质量下降，接缝层之外的行为基本正常。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: 跨层错源 KV 把该层推离健康流形（infra_off）。签名是 warmup/condensed **接缝处的注意力来源不连续**：trajectory 的深度剖面在该层出现单层 STEP，geometric 逐层余弦在接缝处骤降；spectral 亦可见该层表示子空间与相邻层脱节。单点全局统计量（statistical）会因只有一层受影响而漏检。
  repro: partial——在层 i 的 attention 钩子里，用层 j（更深层）缓存的 K/V 覆盖层 i 的 K/V，制造单层跨层错源；LCKV 的 warmup/condensed 架构本身在稠密标准模型上不存在，只能模拟其错源效果。
  locus: block-slot-alloc
  priority: low
