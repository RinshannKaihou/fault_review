    component: clipped_swiglu 输出分配
  behavior: kernel 只写 group 覆盖行（realBatchSize_=min(sum(gi),batch)），适配层用 at::empty 分配输出——范围外行是显存池残影；仓库 golden 表明正确语义是输出 0
effect:
  objects:
  - 数值结果
  detail: sum(group_index) 小于 batch 行数时，输出未被组覆盖的尾部行是随机非零脏数据（显存池残影）；同一代码同一输入有时全 0、有时出现残影，取决于显存分配历史；无报错，下游消费脏值；预热污染显存池后可稳定复现。
  visibility: 静默错误
mitigation:
  detect: 多次调用并先污染显存池（报告者的预热污染法）
  fix: 修复 PR !12603（clipped_swiglu 传 group_index 时输出未初始化为显存残影，改用 at::zeros 初始化，open）；grad 同缺陷另修
