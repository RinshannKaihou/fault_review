title: tt_all_gather 1xN mesh 错轴守卫静默跳过聚合
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: tt-metal
    component: tt_all_gather 守卫
  behavior: 单设备守卫检查任意轴含 1 而非目标轴：cluster_axis=1 在 [1,N] mesh（axis1 有 N 设备）恒命中，直接返回输入不做 gather；all_reduce 同款守卫。
effect:
  objects:
  - 数值结果
  detail: 2×p150a 组 [1,2] mesh（TP=2）实测：decode token embedding 经 all_gather(cluster_axis=1) 原样返回本 rank 分片；v0.80.0 与 v0.82.0-dev 守卫一致（main 同）。
  visibility: 静默错误
mitigation:
  detect: '[1,N] mesh 上验证 all_gather 输出形状/内容（应含全 rank 分片）；单测断言非目标轴为 1 时仍执行 gather。'
  fix: 待定（修复方向：守卫改为 mesh_shape[cluster_axis]==1；未见修复 PR）
