original:
  mechanism: tt-metal Blackhole 2D 组播 matmul 与 DRAM 宽分片权重的网格约定缺陷：ttnn.matmul 用 MatmulMultiCoreReuseMultiCastProgramConfig（prefill 常用）且 in1 权重经 ModelArgs.create_dram_sharded_mem_config(k,n) 按 8 个 DRAM bank 宽分片时，若 compute_with_storage_grid_size[0]≠8，返回静默错误结果——PCC 对 torch fp32 参考从 ≈0.9999 降至 0.002-0.07，无异常无断言退出码 0；同网格配 interleaved in1 正确。风险面：tt_transformers 的 find_prefill_grid（models/tt_transformers/tt/model_config.py:3904，v0.82.0-dev20261028）仍硬顶 prefill 网格 8×8 并留有「BH 用更高核心网格」TODO，任何人按 TODO 把网格放宽到 Blackhole 13 列都会在 DRAM 分片权重上静默出错。环境：tt-metal v0.80.0（978f93b），Blackhole p150a（13×10 grid、8 DRAM banks），单设备。
  source: GitHub issue https://github.com/tenstorrent/tt-metal/issues/63257 （open，2026-10-28，含 PCC 实测与 find_prefill_grid TODO 风险定位）
  behavior: 在 Blackhole 上跑带 DRAM 宽分片权重（8 bank）的 2D 组播 matmul（tt_transformers prefill 路径的典型配置）时，只要计算网格列数不是 8（例如按 TODO 放宽到 13 列），输出就静默错到 PCC≈0.002-0.07（基本全错），无报错、退出码 0；换 interleaved 布局或网格保持 8 列则正确。模型输出会整体崩坏但服务侧看不到任何异常。
  trigger_surface: tt-metal v0.80.0+/Blackhole p150a；MatmulMultiCastProgramConfig + in1 DRAM width-sharded（8 banks）；compute_with_storage_grid_size[0]≠8；tt_transformers prefill 网格放宽时高概率踩中。
  signature: PCC 0.002-0.07 vs 参考 ≈0.9999；网格[0]=8 时恢复。
  repro: issue 含复现配置（create_dram_sharded_mem_config + 放宽网格）与 PCC 数据。
  discovery: 2026-10-29 每日扫描
