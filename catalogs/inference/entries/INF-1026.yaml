  meta: '`model_on` · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: HF 的 `enforce_repetition_penalty_`（源自 CTRL）被作用在**完整的** input_ids 上（prompt + 已生成部分），而不是只作用在已生成的 token 上，于是每一个 prompt token 都被乘性地惩罚。
  source: 'HF transformers #36642（已通过 PR #37625 关闭）。Keskar et al. CTRL arXiv:1909.05858。'
  behavior: prompt 中的 token 被压制，导致奇怪的同义词替换、实体缺失、话题漂移。
  trigger_surface: 采样参数/解码策略 API
  signature: 隐藏态完全 HEALTHY；签名只出现在最后一层的 logits 上（prompt token 的 logits 被乘性压低）。廉价的 logits-space 检查（cheap 族）能抓到；geometric / spectral 等隐藏态度量一概看不见。属于典型的 post-forward 盲点。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）
  repro: 直接在 generation 配置里把 repetition penalty 的作用域改成全部 input_ids（或等价地在 logits processor 上做同样的乘性缩放），无需前向钩子。
