original:
  mechanism: 当 checkpoint 的 config.json 带 sliding_window 字段时，模型的 decode 路径按该步的 batch 状态分裂成两种 FIA 调用形态：DecodeOnly 步的 62 层全部走 _forward_fia_slidingwindow（BSH 布局 (N,1,1536)、不传 causal mask、pre_tokens=sliding_window），而混部 prefill+decode 的 ChunkedPrefill 步全部走通用 TND 的 npu_fused_infer_attention_score（packed 布局、causal 2048 triu mask、sparse_mode=3）。报告明确指出两者都算得数学正确（窗口从未真正截断），但互不位对齐：每次调用约 1 个 bf16 ulp，rank-1 层 23 的注意力输出实测差 0.000244 = 2^-12，经残差流逐层放大到层 61 的 4.0。于是同一个逻辑 token 的算法取决于它的 decode 落在混部步还是纯 decode 步，ulp 级差异在 top-2 logprob 恰好相等（≤1 ulp）的 tie 点翻转 argmax，表现为 temperature=0 的相同请求并发时输出不同。issue 2026-09-16 open，已验证的规避是去掉 config.json 里的 sliding_window。
  source: 2026-09-16 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16704 （open）
  behavior: temperature=0、同一个 prompt 并发发 8 或 16 条，多轮下来输出并不完全一致，出现分叉；分叉点都能对应到 top-2 logprob 相同的 tie，且每轮分叉位置不同，看起来像随机不确定，实际是两条内核对同一 token 算了不同位。
  trigger_surface: config.json 含 sliding_window + 混部/纯 decode 混合批（chunked prefill）+ bf16
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
