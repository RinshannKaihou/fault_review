id: INF-1410
legacy_ids: []
slug: ttmetal_bf16_tanh_nan_laundering
aliases: []
title: tt-metal bf16 tanh 把 NaN 输入洗成 ±1.0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: 多项式 bf16 tanh clamp 路径
  behavior: 多项式 tanh 的 clamp 把非有限输入（NaN/±Inf）映射到 ±1.0：正 NaN→1.0、负 NaN→-1.0、±Inf→±1，NaN 被洗白而非传播
effect:
  objects:
  - 数值结果
  detail: 254 种 bf16 NaN 位型全测：每条 NaN lane 返回 ±1.0（32-bit Dest 探针证实恰为 1.0）；上游 NaN 不再向上游传播，下游看到的是貌似正常的有限值；softcap/situ_glu/logit_softcap 同路径
  visibility: 静默错误
mitigation:
  detect: 注入 NaN 输入检查 tanh 输出是否为 NaN
  fix: issue 附修复方向：clamp 后对非有限 lane 走 accurate kernel 构造（整数递减、乘零加一），Inf→±1、NaN 保持 NaN；未核实合入状态
