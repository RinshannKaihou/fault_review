title: MSA 的 GELU 实现差异使 MLP 输出与 PTA 分叉
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: GELU 激活实现（MSA）
  behavior: MSA 的 GELU 实现与 PTA 不一致：fc1 输出逐元素相同，GELU 之后张量开始分叉；公式层面的具体差异 issue 未给出，显式替换 GELU 实现后 task3 对齐。
effect:
  objects:
  - 数值结果
  - 隐状态
  - 输出内容
  detail: MSA 双栈 bf16、同权重同输入下 task3 的 logits 与 PTA 不一致，差异不在 attention 也不在 loss；逐层 dump 显示 embedding、attention、fc1 输出逐元素一致，第一处分叉在 fc1→GELU→fc2 之间；不报错、无 NaN。
  visibility: 静默错误
mitigation:
  detect: 同权重同输入双栈逐层 dump：linear_fc1.output 一致而 linear_fc2.input 不一致，即定位到激活；把 GELU 换成 PTA 等价实现看是否对齐
  fix: 待定（issue open，无修复 PR）；issue 报告的经验规避是显式替换 GELU 实现后 task3 对齐
