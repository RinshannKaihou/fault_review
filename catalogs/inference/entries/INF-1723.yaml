original:
  mechanism: LMSV 在 PTA 与 MSA 之间做一致性对比：输入 tensor 相同、shared weight 与 embedding/backbone/lm_head 权重已对齐、graph 结构与 state_dict keys 已对齐，task3 的 logits 仍不一致。逐层 dump 显示 embedding、block0.input_layernorm、self_attention 的 linear_qkv/linear_proj、pre_mlp_layernorm、linear_fc1.output（含 after_bias）全部逐元素一致，第一处分叉出现在 linear_fc1.output 之后、linear_fc2.input 之前，即 fc1→GELU→fc2 这段；显式替换 GELU 实现后 task3 对齐。issue 未给出 GELU 公式层面的具体差异。环境为 MSA 双栈 bf16 对比。
  source: 2026-03-15 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29230 （open）
  behavior: 把 PTA 上跑通的 decoder 迁到 MSA，权重、输入、图结构都对齐之后 logits 仍然对不上，而且差异不在 attention 也不在 loss，而是在 MLP 的激活之后：fc1 输出逐元素相同，GELU 出来就对不上。没有报错、没有 NaN，只能靠逐层 dump 定位；替换 GELU 实现后恢复一致。
  trigger_surface: MSA + decoder MLP 的 GELU 激活，bf16 精度，双栈同权重同输入对比
