  meta: '`infra_off`（NEXTN/MTP draft acceptance 随服务器 uptime 约 24 小时**慢性衰减到 ~0**：fresh boot accept rate 0.47–0.76 / accept len 2.4–3.3 / 31–47 tok/s → ~24h 后 `accept rate: 0.00`、吞吐 -2.9×；无 crash、无错误、无警告——**完全重启可复现地恢复**；与 #21138（恒 0.33 权重加载）/#19796（radix 命中 NaN crash）均不同） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
  mechanism: Qwen3.8-Flash-Next（hybrid GDN 线性注意力 + QSA 稀疏全注意力 MoE，qwen4_exp）+ NEXTN 推测解码：随 uptime 累积的某个服务端状态（drafter 缓存/计数器/KV 组织）逐渐使 draft 与 target 分布脱钩——acceptance 单调下滑直到全部被拒。temp=0 单流可测；identical prompt 前后对照证明非负载漂移。慢性累积态与 6.135（scheduler deferred 计数 wedge）同"uptime 单调恶化"族，但本条恶化的是**正确性相关指标（acceptance）而非活性**，引擎全程"健康"。
  source: 'SGLang #37326（2026-09-01 open，RadixArk/Qwen3.8-Flash-Next-NVFP4、含 fresh/decay/restart 三态测量表与 #21138/#19796 排除论证）。https://github.com/sgl-project/sglang/issues/37326'
  behavior: 无 crash——静默性能坍塌（吞吐 ×1/2.9）+ 推测解码事实上关闭；日志唯一线索是 accept rate 指标本身的时间序列。属「**draft acceptance 的 uptime 慢性衰减**」新子签名：监控面应对 accept rate 建立趋势告警（斜率）而非仅阈值——本例衰减全程无任何 error 级信号。
  trigger_surface: SGLang + qwen4_exp（Qwen3.8-Flash-Next）+ NEXTN/MTP + 长 uptime（机制可迁移：凡服务端累积状态影响 drafter/target 一致性的栈）
  discovery: 2026-09-01 每日扫描。
