  meta: '`infra_off`（`uv pip install sglang`（uv<0.12）静默安装 6 个月前的 0.5.9——flash-attn-4 仅有 pre-release 版本而旧 uv 不解析 transitive pre-release specifier，resolver 无声回退到不含该依赖的最旧版本：旧版已修复的正确性 bug（TP>1 丢 down_proj all-reduce）复活，**流畅但错误的输出**，无 crash 无 NaN 无版本警告） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
  mechanism: 'sglang ≥0.5.10 的强制依赖 `flash-attn-4` 在 PyPI 只有 pre-release（4.0.0b5…b27）；uv <0.12.0 不遵循 transitive 依赖元数据中的 pre-release specifier（astral-sh/uv#19993 改变），把一切 ≥0.5.10 判为不可满足并**静默回溯**到 0.5.9——无错误无警告。0.5.9（2026-02-23）早于 qwen3_5 dense TP>1 修复 #19070（dropped down_proj all-reduce），装出的服务带着已修复 5 个月的正确性缺陷运行。`uv pip compile` 单行即可复现解析行为。'
  source: 'SGLang #35912（2026-08-21 open，含 resolver 复现命令与 #19070 因果链）。https://github.com/sgl-project/sglang/issues/35912'
  behavior: '**无 crash、无 NaN**——TP>1 下数学回答错误等静默输出缺陷（根因 bug 的原始形态），用户先怀疑模型再怀疑栈；版本号出现在启动日志但无人核对。属「**依赖解析器静默回退复活已修复缺陷**」新子签名：故障编目史上罕见的「环境层」入口——损坏不来自当前代码而来自**版本选择**本身。'
  trigger_surface: 任意环境 + uv<0.12 + `uv pip install sglang`（纯软件复现；机制栈无关，任何 pre-release transitive 依赖均可复刻该模式）
  discovery: 2026-08-27 每日扫描。
