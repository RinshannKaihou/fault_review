  meta: '`infra_off`（Kimi-K3 **strict** tool 的参数 schema 同时声明具名 property 与 schema 值 `additionalProperties` 时，编译出的 xgrammar 约束允许**具名** property 被（更松的）`additionalProperties` schema 满足而非其自身类型：JSON Schema 语义中 `additionalProperties` 只适用于 `properties` 未匹配的键，但 Kimi-K3 structural-tag builder 不把具名键从 additionalProperties matcher 排除——`{"type":"integer"}` 声明的属性可被发出为 object 仍过 grammar。CPU-only 确定性复现（无模型无 GPU），复用 sglang 自家 xgrammar 测试 harness） · Cov: `var:sglang_xgrammar_pattern_minlength_combo_drops_length_bound`（10.47 约束编译静默失效族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: '`get_kimik3_structural_tag`（`kimik3_structural_tag.py`）构建 structural tag 时未按 JSON Schema 规范从 additionalProperties 分支排除具名键——两个 matcher 的接受集并集覆盖了具名键的合法域之外的串。'
  source: 'SGLang #38587（2026-09-09 open，bug label，含确定性 CPU 复现脚本与违规 schema 最小例）。https://github.com/sgl-project/sglang/issues/38587'
  behavior: 无 crash——strict tool 参数以违反声明类型的结构**静默通过约束**（HTTP 200、grammar 校验通过）：下游解析到类型不符的值。10.47（xgrammar pattern+minLength 丢长度界）、10.40（legacy guided_json 静默丢弃约束）之后「约束编译器静默弱化」族新成员：本条在 structural-tag builder 的 schema 语义维度（不是后端丢约束而是构建时 matcher 集合计算错）。
  trigger_surface: SGLang + Kimi-K3 strict tool + 具名 property + schema 值 additionalProperties（other_stack：SGLang；CPU 可复现）
  discovery: 2026-09-09 每日扫描。
