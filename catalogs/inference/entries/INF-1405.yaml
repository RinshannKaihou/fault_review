original:
  mechanism: tt_metal/hw/ckernels/{wormhole_b0,blackhole,quasar}/metal/llk_api/llk_sfpu/ckernel_sfpu_sigmoid_appx.h 的 sigmoid 快速近似核是单段化 LUT 加 0.5f：sig(x)=lut(x,si0,si1,si2)+0.5。SFPU LUT 每段计算 A*|x|+B，A==0 且 B!=0 的段在 ±inf 输入产生 0*inf+B=NaN。该机制与 tt-llk#1701 item 18（tanh，硬件上确认）同类。IEEE/PyTorch sigmoid 对 +inf 应返回 1.0、-inf 应返回 0.0，精确路径已给出正确答案，仅近似路径错。
  source: https://github.com/tenstorrent/tt-metal/issues/60966
  behavior: 对含 ±inf 的张量用 ttnn.sigmoid(..., mode=SigmoidMode.FastApproximate)（或经 math_approx_mode 选中近似路径的任何 API），inf 位置的输出是 NaN 而不是 1.0/0.0。其余有限输入正常。下游把 NaN 继续传播。
  trigger_surface: ttnn.sigmoid 近似模式（FastApproximate / math_approx_mode）；输入张量含 ±inf 元素；Wormhole B0/Blackhole/Quasar 全架构
