original:
  mechanism: 'CANN 8.5.0 / Ascend910B3 上用 ge-edge-llm 以固定 shape（max_input_len 16，ATC --input-shape input_ids:1,16;attention_mask:1,16）构建 Qwen2.5-0.5B-Instruct 引擎：HF eager CPU、HF eager NPU、ONNX Runtime 三条路径 logits 一致，而 HF+torch.compile+TorchAir/GE 与 ATC/OM 离线链路在 step_00 就直接返回 NaN；把 generation loop 的后端换成 HF+GE 时控制台打出 Warning: tiling offset out of range, index: 32，报告者据此把问题定位到 GE/TBE 图模式的 tiling 下发，并排除 tokenizer、request compiler、sampler、runtime 封装与动态 shape。issue 已 closed，正文未给出根因与修复 PR。'
  source: 2026-04-17 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/314 （closed）
  behavior: 同一模型同一输入，只有走 GE 图模式（torch.compile+TorchAir 或 ATC 导出的 om）时首个 step 的 logits 全为 NaN（logit_min/logit_max=NaN，top5 候选 logits 也全是 NaN），后续生成变成一串感叹号；eager NPU、eager CPU 与 ONNX Runtime 都正常，很容易被误判成模型或权重问题。
  trigger_surface: CANN 8.5.0 + Ascend910B3，固定 shape [1,16]，torch.compile+TorchAir/GE 或 ATC/OM 离线链路
