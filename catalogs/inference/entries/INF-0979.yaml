  meta: '`infra_off`（SGLang `b12x-vision` 分支（两 DGX/GB10 DSV4 预览镜像 `dev-v4f-2dgx` 等三个 tag，09-02/09-03 推送）**回退了 #28035 的修复**：`serving_chat.py` 仍把合法 OpenAI assistant 历史的 `function.arguments` JSON 字符串归一化为 dict，而 `encode_arguments_to_dsml()` 在该分支重新无条件 `json.loads()` → TypeError 被捕获后把 dict 包成 `{"arguments": <dict>}`——**多包一层错误的 DSML 参数**（`<｜DSML｜parameter name="arguments">` 而非展开的具名参数）。镜像 commit 是 #28035 合并 commit 的后代，修复被分支重建丢弃） · Cov: `var:sglang_uv_resolver_silent_old_version_regression_resurrection`（6.156 已修复 bug 经发布链回退复活族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 双端归一化契约（string 或 dict 二选一）只在上游修复中处理；预览分支基于旧基重建时丢失该合并，producer 归一化与 consumer 假设再次错位。
  source: 'SGLang #39277（2026-09-13 open，含分支 commit 谱系、三个受影响镜像 tag/digest、最小复现与期望/实际 DSML 对照）。https://github.com/sgl-project/sglang/issues/39277'
  behavior: 无 crash——多轮工具调用历史被编码为错误 DSML 参数层，**模型对历史调用的参数理解静默损坏**（看不见真实参数名/值），agentic 多轮质量退化且无任何日志。6.156（uv resolver 静默回退旧版复活已修复 bug）之后"发布链回退复活"族新成员：本条在预览镜像分支维度。跨类编入第 10 类（故障面为模板/编码层）。
