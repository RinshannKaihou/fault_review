id: INF-1564
legacy_ids: []
slug: ops_math_as_strided_slice_stride_int32_truncation
aliases: []
title: as_strided 等三算子大 stride 索引截断读错地址
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: arch35 SIMT/MoveAlign 索引
  behavior: arch35(A5) SIMT 与 MoveAlign 路径的 stride 数组、inputIdx 与索引乘积累加用 int32/uint32；stride>2^31（MoveAlign）或 >2^32（SIMT）时截断，按错误地址读取
effect:
  objects:
  - 数值结果
  detail: Ascend950 arch35 上大 stride 输入读出与期望不符的数据（读错地址而非报错）；修复把 stride 数组、inputSize、strideArr 加宽到 int64/uint64，slice 行 stride>2^32 时改逐行 DMA
  visibility: 静默错误
mitigation:
  detect: 构造 stride 超过 2^31/2^32 的 as_strided/slice/strided_slice 用例，与 CPU 参考逐元素比对，并检查 GM 访问地址是否仍落在输入范围内
  fix: 'PR #3844（issue closed）：outStrideArr/gmInStride/gmOutStride 由 int32 加宽 int64，AsStridedTilingParam::inputSize 改 int64，SIMT 的 strideArr 改 uint64 且 inputIdx 用 uint64 计算、乘法显式 static_cast<uint64_t>；合入与发布状态未核实'
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: ''
