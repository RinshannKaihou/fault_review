  target: INF-1539
pattern: PAT-INF-0169
original:
  mechanism: as_strided / slice / strided_slice 三个 conversion 算子在 arch35(A5) 的 SIMT 与 MoveAlign/DualCut 路径存在整型索引溢出：stride 数组（outStrideArr/gmInStride/gmOutStride）及索引计算使用 int32/uint32，当用户输入 stride > 2^31（MoveAlign 路径）或 > 2^32（SIMT 路径）时发生截断，据此算出的 GM 地址错误，读出的是错误位置的数据。设计方案给出的修法：host 侧 stride 数组从 int32 加宽到 int64、AsStridedTilingParam::inputSize 从 uint32 改 int64、AsStridedSimtTilingData::strideArr 从 uint32 改 uint64、CheckInputInfo 的 requiredStorageSize/originalTensorStorageSize 加宽 int64；kernel 侧 SIMT 的 strideArr 形参改 uint64、inputIdx 用 uint64 计算并对乘法 static_cast<uint64_t> 防中间截断，MoveAlign/DualCut 的 stride 数组改 int64，slice two_dim_small_shape 路径在行 stride>2^32 时改逐行 DMA、GM 基址用 uint64。支持硬件为 Ascend950 arch35(A5)。
  source: '2026-07-27 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2378 （closed，关联 PR #3844）'
  behavior: 在 Ascend950 上用超大 stride 调 as_strided/slice/strided_slice，算子不报错，但读出来的张量内容和 CPU 参考不一致——索引被截断后读的是别处的内存，看起来像“数据本身不对”，实际是寻址算了错地址。
  trigger_surface: ops-math as_strided / slice / strided_slice 的 arch35(A5) SIMT 与 MoveAlign/DualCut 路径；stride 超过 2^31 或 2^32
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
