title: 动态shape下cat融合尾块掩码被删致越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: inductor cat 融合掩码 load
  behavior: 拼接维被 mark_dynamic 时，cat 与后续 pointwise 融合后由 ops.masked 生成的带掩码 load，其尾块/首分片掩码被当成常量掩码删除，load 越界。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: cat([32,200],[32,56],dim=1)+1.0 在 dynamic=True 下编译执行越界读取，表现为设备踩内存报错或结果错误；同图 eager 正确，dynamic=False 不触发。
  visibility: 静默错误
mitigation:
  detect: 对拼接维 mark_dynamic 的张量做 cat 再与 pointwise 融合编译，dump output_code.py 看 masked load 是否仍带掩码，并比对 eager
  fix: 待定（issue closed，正文未给修复 PR）；方向：NPU 侧 autotune 可选非 2 的幂 block，不能沿用上游「block 为 2 的幂」假设去删尾块掩码
