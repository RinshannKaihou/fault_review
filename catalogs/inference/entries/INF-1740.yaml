original:
  mechanism: 'Ascend/pytorch #3840（2026-08-08，closed，代码仓 v2.10.0，基线 commit 10c7c0372，版本 2.10.0.post1，后端 inductor/triton）：对在拼接维度上被 torch._dynamo.mark_dynamic 的张量做 torch.cat，再与后续算子融合时，编译执行会越界读取。触发条件是 dynamic=True、cat 的拼接维是符号维、且 cat 被融合进后续 pointwise，走 ops.masked 生成带掩码的 load。上游 _has_constant_mask 基于「Triton block 为 2 的幂」的假设删掉尾块掩码，而 NPU autotune 可以选到非 2 的幂的 block，尾块掩码被删后越界。最小复现即 fn(head,tail)=torch.cat([head,tail],dim=1)+1.0，head (32,200)、tail (32,56)，对 head 的 dim1 mark_dynamic，torch.compile(dynamic=True) 后 assert_close 失败。'
  source: 'Ascend/pytorch #3840（2026-08-08，closed） https://gitcode.com/Ascend/pytorch/issues/3840'
  behavior: 同一段 cat + 逐元素加在 eager 下结果正确，torch.compile(dynamic=True) 后要么直接报设备踩内存的错，要么安静地给出错值；把 dynamic 关掉、或不让 cat 融合进后续 pointwise 就不复现。因为输入输出形状看起来都正常，只有与 eager 对比才能发现。
  trigger_surface: mark_dynamic 标记 cat 拼接维 + dynamic=True + cat 融合进 pointwise（Inductor triton 后端）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
