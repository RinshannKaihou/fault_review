original:
  mechanism: vllm main 24324ef0（CPU 构建 VLLM_TARGET_DEVICE=cpu，macOS M5 Pro；涉及代码设备无关 Python）。条件：滑窗层模型 + offloaded chunk ≥2 GPU 块（kv_connector_extra_config block_size 大于 GPU block size 或 blocks_per_chunk>1）。链条（行号 @24324ef0）：① GPU 前缀命中把窗口前滑窗块填 null block（single_type_kv_cache_manager.py:1004-1037）；滑窗块在其 chunk 被 store 前释放也在连接器 block table 副本中置零（offloading/scheduler.py:1503-1522）；② 当首个含真数据的 GPU 块不在 chunk 首块时，load 读的 CPU slot 无 store 写过——请求 attend 全零或陈旧 KV，无任何报错。连接器单测助手 + 端到端引擎双复现。
  source: https://github.com/vllm-project/vllm/issues/63653（closed；单测+e2e 双复现与逐步行号机制）
  behavior: 带滑动窗口层的模型使用 OffloadingConnector（chunk 跨多 GPU 块）时，命中前缀缓存的请求会从 CPU 卸载层读到从未写入过的空/陈旧 KV 并照常注意力计算，输出悄悄变错，无任何错误或警告；关闭卸载或减小 chunk 即正常。
  trigger_surface: vllm main 24324ef0+ + OffloadingConnector + 滑动窗口层模型 + offload chunk ≥2 GPU 块 + 前缀缓存命中；设备无关（CPU 复现）。
