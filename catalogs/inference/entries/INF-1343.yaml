remarks: '与 1.249 共享 SrcA TF32 10-bit 尾数截断机制，但本条独立成因（unpack mode 差错而非 dtype= 转换缺失）；姊妹工厂 transpose_wh_sharded_program_factory.cpp 对 FLOAT32 用 UnpackToDest 是正确实现。测试盲区：test_sharded_concat 只参数化 bfloat16/int32/uint32，test_concat_fp32_last_dim_mantissa_not_truncated 只覆盖 interleaved。修复 PR #59639 open（前身 #59634 closed）。来源 tt-metal #59530。'
