cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: ConcatS2S 工厂 UnpackToSrc
  behavior: FLOAT32 且 L1 height-sharded 时 concat 选中 S2S 工厂，三个 buffer unpack mode 全设 UnpackToSrc，tile 经 SrcA 截断为 TF32，丢低 13 位尾数。
effect:
  objects:
  - 数值结果
  detail: L1 height-sharded FLOAT32 宽 concat（dim=-1）全元素静默 TF32 截断：8192 元素 8190 错，与 TF32 截断参考 bit-exact 相等；DRAM/L1 interleaved 同调用逐位正确。ttsim Blackhole 复现，硅上待确认。
  visibility: 静默错误
