original:
  mechanism: 'vLLM TT 插件 sample_on_device_mode 下，TTModelRunner.check_perform_device_sampling 逐步决定设备/主机采样；设备采样器最多从 32 个最可能 token 中抽取，模型类通过 model_capabilities["max_device_top_k"] 告知上限，插件 vllm-tt-plugin#140（2026-09-30 合入）据此把 temperature!=0 且 top_k 超出 1..max 的行送 host 采样（正确性修复）。但 Gemma4ForCausalLM（models/demos/gemma4/tt/generator_vllm.py:264，capabilities 在 :342）声明 supports_sample_on_device: True 却未声明 max_device_top_k，Gemma4DFlashForCausalLM(:3568)、Gemma4DFlashContractForCausalLM(:3999)、Gemma4MTPForCausalLM(:4936) 复制该 dict 同样缺失；插件对未声明者不检查，任意 top_k 直送设备。设备路径：Gemma4Model 构建 SamplingGenerator（model.py:641）→ tt_transformers Generator 解码路径调 apply_decode_state（generator.py:2797）→ format_sampling_params（models/common/sampling/generator.py:322）把所有 top_k<1 与 >32 静默改写为 32。请求的 top_k 语义被无声改变。'
  source: 2026-10-17 GitHub tenstorrent/tt-metal issue https://github.com/tenstorrent/tt-metal/issues/60365（源码行号级；plugin#140 修复边界与未声明模型清单）
  behavior: '用 vLLM TT 插件按设备采样模式跑 Gemma4（含 DFlash/Contract/MTP 变体）时，用户请求 top_k 大于 32（如 100）会被静默当成 top_k=32 采样：输出仍正常生成、无任何日志或提示，但采样分布与请求不符，多样性/任务指标悄悄偏离；top_k<1 同样被改写。只有声明了 max_device_top_k 的模型才被 #140 的路由保护。'
  trigger_surface: tt-metal Gemma4 族模型 + vllm-tt-plugin sample_on_device_mode + top_k∉[1,32]；插件 2026-09-30 后版本
  discovery: 2026-10-17 每日扫描
