original:
  mechanism: MindSpore 前端常量折叠（Graph Const）对整数归约的类型推导与运行时不一致：ops.ReduceProd 和 ops.ReduceSum 在 int8 输入下，PYNATIVE_MODE 与 GRAPH_MODE 传参（Graph Arg）都返回 Int8；把张量写成无参 @ms.jit 的闭包常量后，常量折叠把输出 dtype 提成 Int64。issue 的最小复现是 [[2,3,4],[-2,-3,4]] int8 做 keep_dims=False 的 ReduceProd(axis=1)，以及 [[1,2,3],[4,5,6]] int8 的 ReduceSum。环境为 CPU、Python 3.12 的 2.8.0。与同批 issue 29397（int32 true_divide 被折成 Float64）同属常量折叠 dtype 推导偏离运行时一族。
  source: 2026-05-18 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29394 （open）
  behavior: int8 的 sum/prod 写在闭包常量上编译后，输出 dtype 从 Int8 变成 Int64，值和 shape 都正常，只有 dtype 变了；下游若按 Int8 做量化反量化或直接写回 int8 权重，就会拿到静默变宽的中间结果，显存与带宽也跟着变。传参写法输出仍是 Int8。
  trigger_surface: GRAPH_MODE 下 int8 张量作为闭包常量参与 ReduceSum/ReduceProd（触发 Graph Const 常量折叠）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
