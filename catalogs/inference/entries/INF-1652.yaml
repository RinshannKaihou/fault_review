title: 常量折叠把 int8 reduce 输出成 Int64
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: mindspore
    component: 常量折叠 reduce dtype 推导
  behavior: Graph Const 常量折叠对 int8 输入的 ReduceSum/ReduceProd 把输出提成 Int64，PyNative 与 Graph(Arg) 都保持 Int8，同一表达式两种 dtype。
effect:
  objects:
  - 数值结果
  detail: int8 [[2,3,4],[-2,-3,4]] 做 ReduceProd 后 Graph(Const) 得 Int64、另两条路径得 Int8；dtype 悄悄变宽，下游按 Int64 计算与存储。
  visibility: 静默错误
mitigation:
  detect: 同一 reduce 表达式分别在 PyNative、jit(带参数)、jit(闭包常量) 下打印输出 dtype；int8 输入在闭包常量路径变成 Int64 即命中
  fix: 待定（issue open，无修复 PR）；方向：常量折叠复用运行时的 reduce dtype 规则（int8 入 int8 出）
