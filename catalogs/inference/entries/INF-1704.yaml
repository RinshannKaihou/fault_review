id: INF-1704
legacy_ids: []
slug: all_gather_matmul_uint32_offset_overflow
aliases: []
title: AllGatherMatmul 偏移 uint32 相乘溢出截断
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: all_gather_matmul_v2 AIV
  behavior: blockSt 与 blockSize 的乘子（cal_idx、m0、pValue、m、n）均为 uint32_t，乘法在 uint32 空间完成才赋给 uint64_t，MN 超 2^32 时截断，偏移与搬运量算错。
effect:
  objects:
  - 数值结果
  detail: 输入 shape 的 M*N 超过 uint32 最大值（4.29e9）的 all_gather_matmul_v2 AIV 中，shape 校验通过、执行不报错不崩，输出数值整体错位；缩小到 uint32 范围内恢复正常，常规尺寸回归长期不可见。
  visibility: 静默错误
mitigation:
  detect: 对超大 MN 的 shape 做定点对比测试；静态检查 kernel 中 32 位乘法的上界
  fix: 待定（issue 只给修改方案：相关变量改 uint64_t 或先转 uint64_t 再乘，未见修复 PR）
labels:
  family: infra_off
  trigger: config
  trigger_review: false
  trigger_note: 仅当 MN 超过 uint32 上限（超大 shape）时触发
  stage: N/A
