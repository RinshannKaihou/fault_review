relations: []
original:
  mechanism: 'ops-transformer issue #3714（2026-07-10 closed，x86 + 910B2）：mc2/all_gather_matmul_v2/op_kernel/all_gather_matmul_aiv_mode.h 中 uint64_t blockSt = cal_idx * m0 * pValue * n; 与 uint64_t blockSize = m * n; 两处，calIdx、m、n、m0、pValue 等乘子均定义为 uint32 数据类型，运算顺序上整条乘法先按 uint32_t 完成，结果超过 uint32 最大值时发生溢出截断，之后才赋给 uint64_t，因此超大 shape 下 block 偏移与搬运长度都算错，算子结果出现精度异常。修改方案为把相关变量直接定义为 uint64_t 或先转 uint64_t 再计算；报告者同时提醒排查其它大 shape 下相乘的地方是否有同样的溢出风险。环境为 x86 + Ascend 910B2，触发条件是输入 shape 的 MN 超过 uint32 最大值。'
  source: https://gitcode.com/cann/ops-transformer/issues/3714 （closed）
  behavior: 只有在 MN 特别大（超过 uint32 最大值）时结果才不对：shape 校验通过、执行不报错、也不崩，输出里的数值却整体错位；把 shape 缩小到 uint32 范围内立刻恢复正常，因此这类问题在常规尺寸的回归用例里长期不可见。
  trigger_surface: 输入 shape 的 M*N 超过 uint32 最大值（4.29e9）的 all_gather_matmul_v2（AIV 模式）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
