id: INF-2603
legacy_ids: []
slug: mc2_x2_noncontiguous_view_contiguous_read
aliases: []
title: MC2 算子按连续内存读非连续 x2
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: MC2 AIV 分支 x2 stride
  behavior: AllGatherMatmulV2、MatmulAlltoAllV2、QuantMatmulAlltoAllV2 的 AIV 分支接受 x2 转置/隔列视图，不做 stride 换算，直接按连续行主序读 storage。
effect:
  objects:
  - 数值结果
  detail: 转置/非连续权重视图进 MC2 矩阵乘后结果静默错：四个 shape 两段 rc=0，fp16 8×256×4 与 AG@x2ᵀ maxdiff 13.3、与连续读 storage 0.0036；bf16 23.2/0.0306；同视图 aclnnMatmul 报 161002。
  visibility: 静默错误
mitigation:
  detect: 用 shape=(n,k)、strides=(1,k) 的合法转置视图构造 x2，与 AG(x1)@x2ᵀ 及「连续读 storage」两套解析式同时对比；后者吻合而前者不吻合即为本条。
  fix: 待定（三条 issue 均 open；建议不支持非连续输入时首段返回 161002，未核实修复）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-11-26'
remarks: 同一机制三条来源：输入侧转置视图（#8857）与隔列切片（#8841/#8737），均属 MC2 融合算子不校验 x2 stride 直接按连续布局读。
