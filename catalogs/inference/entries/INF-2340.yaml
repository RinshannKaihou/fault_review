    component: max_pool3d_grad tiling
  behavior: NDHWC+FP16 且 cX<64、D/H/W 对齐切分不可行时，TrySplitAlignC 把已过 UB 校验的 cOutputInner 覆盖为 64，二分搜索下发未校验值，UB Buffer 放大致越界 AIVEC。
effect:
  objects:
  - 可用性/进度
  detail: cX=15 与 cX=2 两档复现（TilingKey=513）下训练/推理执行该算子即崩溃，报 EZ9999 AIVEC error 263（地址未对齐或越界）；崩溃前 UB 越界写有污染风险；FP32 或 C≥64 输入不受影响；TTK Dynamic/Const/Release 三模式。
  visibility: 报错
