  detect: FP16+NDHWC+cX<64 的 max_pool3d_grad 用例回归；host 侧检查下发 cOutputInner ≤ cX。
  fix: 待定（issue open；issue 给出正确 tiling 兜底方案描述，未见修复 MR）
