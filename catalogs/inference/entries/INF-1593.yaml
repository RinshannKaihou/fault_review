title: sparse_flash_mla_grad Meta 推导 int32 错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: sparse_flash_mla_grad
  behavior: Meta 用 sparse_indices.dtype（int32）创建 ori/cmp_softmax_l1_norm，FakeTensor 与 torch.compile 据此把两个 float32 输出推成 int32。
effect:
  objects:
  - 训练信号
  - 数值结果
  detail: torchtitan DeepSeek-V4 SMLA 整网 torch.compile 下 dsa_indexer_aux_loss/mean 从 4.58e-4 变为 -4.51e10；只改 Meta 输出 dtype、kernel 不动即恢复 4.58e-4。
  visibility: 静默错误
mitigation:
  detect: 在 meta device 上调 torch.ops.cann_ops_transformer.sparse_flash_mla_grad，检查 cmp_softmax_l1_norm 的 dtype 是否被推成 int32；整网看 aux loss 是否突然跳到 1e10 量级
  fix: 待定（issue closed；最小修复是把两个统计量输出的 Meta dtype 固定为 torch.float32，并在下游 Meta 显式校验 float32 契约 + 补 FakeTensor 单测）
