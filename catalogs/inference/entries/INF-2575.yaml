id: INF-2575
legacy_ids: []
slug: cann_linspace_int_output_fp32_compute
aliases: []
title: aclnnLinspace 整数输出按 fp32 计算错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnLinspace
  behavior: OutPromoteType 把 INT64 降为 FLOAT，INT32 kernel 模板也是 <int32_t,float>，整条等差序列在 float32 域计算后截断。
effect:
  objects:
  - 数值结果
  - 输入编码
  detail: linspace(1e8,1e8+6,4,int64) 得 [1e8,1e8,1e8+8,1e8+8]（应 1e8,1e8+2,1e8+4,1e8+6）；步长小于该量级 fp32 ULP 即触发；float out 正确。
  visibility: 静默错误
mitigation:
  detect: 大偏移整数 linspace 与 CPU/int64 参考逐元素比较；检查结果是否全部落在 float32 网格上（on_float32_grid）。
  fix: 待定（issue open，未附修复 PR）
