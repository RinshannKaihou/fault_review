id: INF-2598
legacy_ids: []
slug: vllm_ascend_missing_causal_conv1d_update_kernel_layout_confusion
aliases: []
title: vllm-ascend 缺失 conv 更新内核致 GDN/KDA 静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm-ascend
    component: causal_conv1d_update
  behavior: causal_conv1d_update_npu 未实现，import 失败后回退到只支持 dim-first 的 upstream 包装；GDN/KDA 的 dim-last 状态被按 mamba 布局读，stride 交换。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: GDN/KDA（Kimi K3、Qwen3-Next 等）每步 decode 的卷积窗口从错误位置读取，输出偏差实测 maxdiff=239（正确值 O(1–10)），无断言；同一调用偶发 RuntimeError，失败在崩溃与静默错值间漂移。
  visibility: 静默错误
mitigation:
  detect: 用 transpose 到 mamba 布局的参考实现对照 dim-last 状态；检查启动警告 'causal_conv1d_update is unavailable'
  fix: 待定（issue 建议实现 layout-dispatching 的 causal_conv1d_update_npu 并阻断 import 失败回退；open，未核实修复）
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-26'
remarks: 与 INF-0194（SGLang causal_conv1d_update 回退核错读状态）同属 fallback 卷积更新实现的状态布局误读族；本条是 vllm-ascend 缺失 NPU 内核后回退到 upstream PyTorch 包装，触发差异在 dim-last GDN/KDA 状态。
