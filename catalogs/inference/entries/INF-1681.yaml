id: INF-1681
legacy_ids: []
slug: op_build_failure_poisons_process_npu_state
aliases: []
title: 算子建图失败后同进程 NPU 算子静默返回零/垃圾
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: DynamicGRUV2 建图失败态
  behavior: fp32 DynamicGRUV2 因 DT_FLOAT 不支持、op store 无该算子而建图失败（EZ3002/500002），失败态未被清理且进程未按日志所述退出，同进程后续 NPU 算子返回值与 CPU 显著不一致。
effect:
  objects:
  - 数值结果
  detail: norm=0.0000（CPU 1.9893）、CE=0.0000（CPU 3.3322）；try/except 重试同一 GRU 不再抛异常但输出≈零/垃圾（输入翻倍 maxdiff=4.4e-2），训练侧表现为 loss/ppl 不动的假收敛。
  visibility: 静默错误
mitigation:
  detect: 捕获首次算子失败后在同进程跑 norm()、CrossEntropyLoss 与 CPU 同数据参照比较；重试同一算子后检查输出是否对输入翻倍不敏感
  fix: 待定（issue open，正文未给具体修复）；规避：算子致命失败后必须重启进程，不要用 try/except 重试掩盖
