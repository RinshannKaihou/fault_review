  meta: '`infra_off`（`torch.ops.trtllm.calculate_nvfp4_global_scale`：hidden >8192 且非 8192 倍数时，CTA 处理多 token 起 per-token scale 错——`getMaxAbs`（内含 `blockReduceMaxV2` 的 `__syncthreads()`）被放进 per-thread 循环，线程发散下归约失效。[512,12288] 309/512 token scale 错（例 28.0 应 42.0）、[256,28672] 101–114/256 错；[512,8192]/[1024,4096] 0 错（各 ~91 万次调用全量 fp64 参照核验）。launcher 只检查 `n%256==0`；内核 1.2.1 wheel 与 main `b031dbe` 一致） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
