  meta: '`infra_off`（vLLM 默认 `auto` 结构化输出后端下，**多分支 `allOf` JSON schema 被 xgrammar 编译成不强制任何分支的文法**：`{"x":5}`（违反 minimum:10）、缺 required 字段、甚至 `"hello"` 全部 accept——模型可产出任意违反 schema 的 JSON 且 vLLM 无错误。auto 不回退可用后端：feature gate `has_xgrammar_unsupported_json_features` 不列 `allOf`（单分支可、多分支漏）；`guidance` 后端（llguidance）同 schema 正确强制。多分支 allOf 是 Pydantic/OpenAPI 模型继承的标准产物（`allOf:[{$ref:Base},{...}]`），非构造性边角。修复 PR #56557 将 allOf 加入 gate） · Cov: `var:sglang_xgrammar_pattern_minlength_combo_drops_length_bound`（10.47 xgrammar schema 特性静默丢约束族） · 触发 `yes` · 置信度 `verified`'
  mechanism: xgrammar 0.2.3 的 JSON schema→文法编译对多分支 allOf 生成的文法恒真；vLLM 的后端选择 gate 特性清单遗漏 allOf，auto 模式因此把请求绑定到错误编译器。
  source: 'vLLM #56556（2026-09-12 open，bug+structured-output label，含四实例 accept 对照、gate 函数输出证明与 guidance 正确性对照）；修复 PR #56557。https://github.com/vllm-project/vllm/issues/56556'
  behavior: 无 crash——structured output 请求返回 200 + **违反 schema 的 JSON**（类型、required、数值约束全部不设防）；对把 schema 当 API 契约的下游是静默数据损坏。10.47（xgrammar pattern+minLength 丢长度界）之后"xgrammar schema 特性静默丢约束 + gate 不回退"族新成员：本条在 allOf 组合子维度、且为该族首个影响类型系统核心（继承）的实例。
  trigger_surface: vLLM + structured_outputs json schema + 多分支 allOf（Pydantic/OpenAPI 继承产物）+ auto/xgrammar 后端（yes）
