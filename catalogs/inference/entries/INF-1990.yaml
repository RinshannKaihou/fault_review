original:
  mechanism: 'issue #12905 记录 vllm-ascend 0.23.0rc1 + GLM-5.2 + memcache，Prefill 和 Decode 都开启 enable_sparse_sfa_c8 后，服务启动后第一次 curl 请求的回答是乱码，第二次 curl 恢复正常。同族报告 #15927（0.23.0/0.26.0rc1 + GLM-5.2 + Memcache，四机 PD 分离）给出更细的对照：curl P 节点无响应，把 c8_enable_reshape_optim 设为 false 后能正常问答，而开启 sfa c8 时存在首个 curl 乱码。两条都指向 c8 稀疏注意力路径在首个请求上的初始化/reshape 处理，未见 KV 传输失败日志。'
  source: 2026-07-27 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/12905 （closed）；同族 https://github.com/vllm-project/vllm-ascend/issues/15927 （open）
  behavior: 服务刚拉起时第一条请求返回一段语法不通的乱码，再发一次同样的请求就恢复正常；#15927 里把 c8_enable_reshape_optim 设为 false 后问答正常，说明首请求乱码只在 sfa c8 打开时出现，关掉该开关即可绕过。
  trigger_surface: GLM-5.x + memcache 的 PD 分离部署，Prefill 与 Decode 两侧都开启 enable_sparse_sfa_c8（或 sfa c8 + c8_enable_reshape_optim）
