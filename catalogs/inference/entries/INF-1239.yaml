  meta: '`infra_off` · Cov: `var:vllm_apc_dirty_block_hash` · 触发 `config`⚠ · 置信度 `documented`'
  mechanism: 同一步内的 `cache_full_blocks` 在 GPU 前向写入其 KV **之前**，就把新分配的满块插入 APC 哈希表；同一步稍后的 `get_cached_block` 命中这个刚注册的块，把未初始化/清零（或邻居序列的）GPU 显存当作有效前缀 KV 读取。上游用 `_blocks_registered_this_step` 加守卫修复。
  source: 'vLLM PR #37152（issue #37076 是一个*不同*的驱逐 bug，上游配对有误）。'
  behavior: 源文档未给出该字段。
  trigger_surface: vLLM 配置/后端/缓存开关可构造对照
  signature: '`infra_off` —— 第一个共享前缀边界块携带离流形 KV（未初始化/清零，或另一条序列的内容）。可捕获的是 geometric 族的逐位置 KV 范数离群（清零分支）与跨请求 KV 余弦（邻居分支，在块边界处计算）；trajectory 族的全局平滑度会漏检，因为异常集中在一个块宽度内。注意「清零」分支的签名与 K3.1 同形（零 K/V），区分靠的是位置——这里在共享前缀边界块，K3.1 在缓冲区尾部。'
  repro: 方案：单钩子在 prefill 后把前缀边界处一个 block_size 宽度的 KV 行整体清零（未初始化分支），或替换为同 batch 中另一条序列对应位置的行（邻居分支）。属 partial：单进程路径没有 APC 哈希表与同步时序，只能复现读到坏块的末态。
  locus: block-slot-alloc
  priority: medium
