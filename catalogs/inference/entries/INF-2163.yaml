  mechanism: CANN 9.2.0（Atlas A2 910B2，aclnnMhcPreGetWorkspaceSize/aclnnMhcPre C 直调）alpha 的 shape 为 [2] 表示无残差分支，资料《规格约束》写明 alpha=(2) 时 hRes 输出为 0、参数表只说该情况可传空指针，并未禁止传张量。实测 alpha=[2] 且调用方给 hRes 传非空张量时，两段接口都返回 0，但 hRes 内存一个字节都没被写，保持调用方原有内容。复现程序自带阴性对照（K19）：同一份代码同一套 shape 只把 alpha 换成 [3]，hRes 立刻被写满（canary 全部消失），证明读回路径有效、问题在 alpha=(2) 分支。
  source: https://gitcode.com/cann/ops-transformer/issues/6658
  behavior: 调 aclnnMhcPre 时 alpha 传 [2]（无残差分支）并且给 hRes 传了一个真实张量，函数返回成功，但 hRes 里的内容完全是调用前显存里残留的旧值（预填 -777 全部原样保留），下游当残差结果消费就是脏数据；没有任何错误码或告警。
  trigger_surface: CANN 9.2.0 / Atlas A2 910B2；aclnnMhcPre；alpha shape=[2] 且 hRes 传非空张量。
