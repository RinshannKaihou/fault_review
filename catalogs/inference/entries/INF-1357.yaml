  meta: '`infra_off`（TensorRT-LLM `Qwen3VLInputProcessorBase._preprocess` 把 `video_metadata.total_num_frames` 重写为 `len(vd.frames)` 但不重算 `fps`：IO 层已抽帧的 clip（如 10s/24fps/240 帧解码为 40 帧）使 HF `Qwen3VLVideoProcessor` 相信视频只有 40/24≈1.67s——类默认 `fps=2, min_frames=4` 下只采样 `int(40/24*2)=3→4` 帧（**无论 clip 多长恒为 4 帧摘要**，30s clip 同样 4 帧）；且 `<t seconds>` 时间戳 token 按重写后的帧数/源 fps 计算，被压缩 decoded/source 比例（真实 0/3.3/6.7/10s 变成 0.3/1.4s）。这是默认路径：调用方不传 `do_sample_frames/num_frames/fps` 时 `_decide_do_sample_frames` 自动开启采样；`do_sample_frames=False` 完全正确，证明帧本身无恙、纯元数据不一致） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
