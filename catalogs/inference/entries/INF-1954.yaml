original:
  mechanism: 'vllm-ascend issue #17044（2026-09-21，open）：pinned revision f2f74a16 的 mooncake_hybrid_connector.py 里，_transfer_kv_cache_all_groups 调 batch_transfer_sync_read，ret < 0 时 raise RuntimeError（699–706 行）；_handle_request 捕获后只 log（599–607 行），其 finally 仍然把任务标 done，在请求的任务计数/末位标记条件满足时更新 completion tracker，并向 producer 发 DONE_RECVING（608–619 行）。更关键的是该文件没有覆写 get_block_ids_with_load_errors，继承的默认实现返回空集合，而 vLLM base 契约（kv_connector/v1/base.py::get_finished）要求异步失败请求在同一 forward pass 内把失败块报出来；MultiConnector 聚合也无法重建从未上报的信息。报告者用 AST 抽取真实函数 + mock 外部依赖做了确定性 CPU 复现（只合成地址，不启动模型/NPU），并明确说明这不是对 507035 设备错误的因果解释。'
  source: 2026-09-21 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17044 （open）
  behavior: PD 混合部署里 consumer 侧一旦有块没传成功，日志里会出现一条 transfer 失败，但这一轮请求在 connector 看来仍是「接收完成」：completion tracker 前进、producer 收到 DONE_RECVING，而调度器查失败块得到空集，于是既不会重算也不会作废该请求。表现上是偶尔一次回答基于不完整或未初始化的 KV 继续 decode，HTTP 全 200、没有异常值，只能从 connector 日志与失败块上报的空缺里看出来。
  trigger_surface: Mooncake Hybrid connector + 单次传输返回负值（部分块失败）的 PD 请求
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
