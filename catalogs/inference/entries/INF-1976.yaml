original:
  mechanism: cann/ops-nn issue 5999（2026-09-18，closed）。index/apply_top_k_top_p_with_sorted/op_api/aclnn_apply_top_k_top_p.cpp L47-55 的 CheckNotNull 里，L50 命中 p==nullptr && k==nullptr 后只执行 OP_LOGE(ACLNN_ERR_PARAM_INVALID, "The inputs, p and k, should not be nullptr at the same time.")，没有 return false，L54 直接 return true；CheckParams 后续 CheckDtypeValid/CheckShapeValid/CheckFormatValid 均以 if (p != nullptr)/if (k != nullptr) 包住，双空时逐项跳过，L136 返回 ACLNN_SUCCESS。同文件 7 处 OP_LOGE 只有 L51 之后没有返回语句。资料 docs/aclnnApplyTopKTopP.md L195-203 规定该组合应返回 161001。放行后 logits 尾维为 1 时走 L181-182 的 ViewCopy(logitsContiguous, out) 直拷分支并返回成功，尾维>1 时把空的 pContiguous/kContiguous 传给 l0op::ApplyTopKTopPWithSorted，失败只表现为 ACLNN_ERR_INNER_NULLPTR。
  source: 2026-09-18 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5999 （closed）
  behavior: 采样算子少传一个可选参数（p 和 k 都没给）时，接口不报错而是直接成功：logits 尾维为 1 的那批请求，输出就是原始 logits，top-k/top-p 一步都没做，采样分布完全不受控；尾维更大的请求则拿到一个内部错误码，看不出是入参非法。两种都让调用方以为过滤已经生效。
  trigger_surface: aclnnApplyTopKTopP，p 与 k 同时为空
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
