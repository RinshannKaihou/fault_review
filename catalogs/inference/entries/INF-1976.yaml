id: INF-1976
legacy_ids: []
slug: apply_top_k_top_p_null_pk_check_swallowed
aliases: []
title: ApplyTopKTopP 双空校验只打日志，过滤被静默跳过
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: cann
    component: aclnnApplyTopKTopP
  behavior: CheckNotNull 检出 p、k 同时为空只调 OP_LOGE，缺 return false，函数落到 return true；后续各道校验都按非空分支跳过
effect:
  objects:
  - 输出分布
  detail: p、k 同为 nullptr 时返回 ACLNN_SUCCESS：logits 尾维为 1 时 out 被原样直拷、top-k/top-p 完全未做；尾维>1 时透传空指针给 l0op，报内部错误码
  visibility: 静默错误
mitigation:
  detect: 以 p=nullptr、k=nullptr 调 aclnnApplyTopKTopP，断言返回 161001（资料要求）；检查 out 是否等于未过滤的 logits
  fix: 补 return false（并按资料返回 ACLNN_ERR_PARAM_NULLPTR/161001，而非日志里的 161002 语义）；issue closed 未附 MR，未核实
