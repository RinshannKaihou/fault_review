  behavior: 用 FP8 的融合算子做分组矩阵乘 + swiglu + 动态量化，只要输入里有整行为 0 的行，输出对应位置就是 NaN；同样输入拆成 grouped_matmul、swiglu、dynamic_quant 三步算则正常。算子不报错，NaN 直接进下游激活，表现为后续全变 NaN 或 loss 异常，而触发条件只是「有一行是 0」，在 padding/稀疏专家场景很容易碰到。
