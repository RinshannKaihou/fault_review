original:
  mechanism: 'Ascend/pytorch #2409（2026-06-16，open）：调用 torch_npu.npu_grouped_matmul_swiglu_quant_v2(x, weight, weight_scale, x_scale, group_list, quant_dtype=torch.float8_e4m3fn, dequant_dtype=torch.float32)，当 x 中存在 0 值行时，output 对应位置结果为 NaN。报告给出的等价分解路径为 npu_grouped_matmul(split_item=2, group_list_type=0, group_type=0, output_dtype=bfloat16) → npu_swiglu → npu_dynamic_quant(dst_type=float8_e4m3fn)，该路径正常。issue 正文只给了算子调用与等价路径，未给根因定位、复现脚本的随机数据构造细节或偏差统计，机制待定。'
