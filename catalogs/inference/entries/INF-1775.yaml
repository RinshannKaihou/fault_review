original:
  mechanism: tt-metal 229f9d53365（Wormhole n150 KMD2.9.0/FW19.11.0；sum 案例 BH p100a 亦证）。ttnn.mean 对 4D bf16 张量做整张量归约（dim=None 或 dim=[0,1,2,3]）在大值相消时返回 0：(1,2,32,64) 全 1024.0、一半 -1024.0 且 [0,1,:,0]=-1020.0：ttnn.mean=0，torch bf16/fp32 均 0.03125；dim=[1,3] 正确。ttnn.sum 同类：(1,2,32,64) 布局 +1024/-1024/[0,1]=1.0：整张量 sum=0，torch=1024；sum(sum(x,dim=[2,3]),dim=[0,1])=1024 正确。两 issue 均 freq=always、非回归；机制（全轴 kernel 的中间精度/累加顺序）未定位。影响：models/common/metrics.py 调用整张量 bf16 mean，生产路径在用。
  source: 2026-10-20 每日扫描；https://github.com/tenstorrent/tt-metal/issues/61584 ；https://github.com/tenstorrent/tt-metal/issues/61703
  behavior: 对包含较大正负值相互抵消的 bf16 张量做整张量均值或求和（不指定维度或列出全部维度）时，ttnn 直接返回 0，而 torch 返回正确的非零小值（如 0.03125 或 1024）；把同一归约拆成两步（先 H/W 后 N/C）结果就正确。无报错，评测/指标代码里这类均值会静默变 0。
  trigger_surface: ttnn.mean/ttnn.sum 整张量全轴归约 + bf16 + 大值跨 batch/通道相消（WH/BH）
  discovery: 2026-10-20 每日扫描
