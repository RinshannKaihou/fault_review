  kind: gitcode_issue
relations: []
original:
  mechanism: A5 + CANN9.3.0 weekly（10.1 之后）+ arm64。用户按 asc-devkit examples/05_simd_simt_hybrid/01_trouble_shooting/simd_simt_ub_usage_limit 样例构造 SIMT VF 内 UB 越界场景，mssanitizer 实测无法检出。工具助手解释：A5 的 UB 内存检测方案以物理内存上限 248KB（256KB−8KB 内置预留）为有效范围；混合场景下 SIMT 需要用 DCache（按公式随配置分配，作为 GM 的缓存），越界写到 DCache 同样非法——踩踏 DCache 会造成难以定位的精度问题。属检测工具覆盖盲区记录：不转述为模型计算已损坏，仅记录监控盲区。
  source: https://gitcode.com/Ascend/mssanitizer/issues/239（A5 实测 + 官方样例复现 + 工具助手范围解释）
  behavior: 开发者写 SIMT/CUBE 混合 kernel 并越界使用 UB 时，mssanitizer 报告一切正常；实际越界已踩到 DCache（GM 缓存），后续表现为难以定位的精度问题——检测工具在该场景下漏报，监控盲区而非模型计算损坏的直接证据。
  trigger_surface: CANN 9.3.0 weekly + A5 + SIMD/SIMT 混合 kernel + UB 使用越过物理上限进入 DCache 区域。
  discovery: 2026-10-27 每日扫描
