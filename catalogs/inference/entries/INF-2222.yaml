title: mssanitizer 未覆盖 SIMT 混合场景 DCache 越界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: mssanitizer UB 越界检测范围
  behavior: A5 的 UB 内存检测以物理内存上限 248KB（256KB−8KB 预留）为有效范围，但 SIMT 混合场景 SIMT 需要用 DCache（作为 GM 缓存）；用户越界写到 DCache 属非法行为，工具实测检测不出。
effect:
  objects:
  - 指标/日志
  - 测试判定
  detail: 官方样例构造的 SIMT VF 内 UB 越界工具无法检出；越界踩 DCache 造成难定位精度问题成为监控盲区；工具漏报域，非模型计算损坏。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（issue open；工具助手已给出 248KB 范围解释）
