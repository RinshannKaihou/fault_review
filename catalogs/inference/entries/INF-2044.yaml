id: INF-2044
legacy_ids: []
slug: hcomm_check_channel_param_missing_index
aliases: []
title: CheckChannelParam 漏下标只校验第 0 个通道
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: MyRank::CheckChannelParam
  behavior: 循环体内 7 行 8 处把 channelDesc[index] 写成 channelDesc->（恒等 [0]），index≥1 的通道绕过 memHandleNum 上限、空指针与 notifyNum 三道校验
effect:
  objects:
  - 可用性/进度
  detail: channelNum>1 时非 0 号通道的超限 memHandleNum/notifyNum、空 memHandles 不会返回 HCCL_E_PARA，会继续进入资源申请与数组访问，可能造成越界读或空指针解引用。
  visibility: 报错
mitigation:
  detect: 在 CheckChannelParam 范围内 grep 'channelDesc->' 应为 0 命中；构造 channelNum>1 且第 1 个元素 memHandleNum 超限/指针为空的用例，断言返回 HCCL_E_PARA
  fix: 建议循环体内统一补 [index]（共 7 行 8 处）；issue 未附 MR，未核实是否已修
