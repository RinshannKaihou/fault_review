original:
  mechanism: cann/hcomm src/coll_communicator_mgr/resource_mgr/local/my_rank/my_rank.cc:673-707 的 MyRank::CheckChannelParam(CommEngine, const HcclChannelDesc*, uint32_t channelNum) 用 for (u32 index...) 逐元素校验，但循环体内多处漏写下标：678/681 的 channelDesc->memHandleNum、684 的 channelDesc->memHandleNum 与 memHandles、687/690 的 memHandleNum、702/705 的 channelDesc->notifyNum，共 7 行 8 处都恒等于 channelDesc[0]。同循环 :695/:698 用的是 channelDesc[index]，同函数外 HasDuplicateChannelDesc :663/:665 也正确，且报错日志格式串打印 index 而取值用 [0] 自相矛盾，可判定为漏写而非有意设计。后果是 index≥1 的元素同时绕过 memHandleNum>MEM_HANDLE_NUM_MAX、memHandleNum!=0 且 memHandles==nullptr、notifyNum>NOTIFY_NUM_MAX 三道入口校验，超限数量与空指针可直达后续资源申请和数组访问（越界读、空指针解引用）。
  source: 2026-09-17 GitCode cann/hcomm issue https://gitcode.com/cann/hcomm/issues/916 （closed）
  behavior: 多通道建链（channelNum>1）时参数校验实际上只看第 0 个通道：第 1 个及以后的 channelDesc 即使 memHandleNum 超过上限、声明了句柄但指针为空、notifyNum 超限，也不会返回 HCCL_E_PARA，而是继续走到资源申请与数组访问。调用方以为参数已校验通过，出问题时现场看不到任何参数错误，只能从越界/空指针现场反推。
  trigger_surface: HcclChannelDesc 数组长度 >1 的通道建立路径
  discovery: 2026-10-21 系统扫描（sweep_2，issue created < 2026-10-07 历史索引
