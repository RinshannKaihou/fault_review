title: 融合 QKV RMSNorm 把 K 方差算成 0 致千倍放大
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: vllm
    component: split_qkv_rmsnorm_mrope
  behavior: triton 融合 kernel 对 K 做 RMSNorm 时把方差算成 0（正确值 1.05–1.19），reciprocal_std 变成 1/sqrt(0+1e-6)=1000，K 被放大约一千倍。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: Qwen3.5-4B（bf16、16/4 头、head_size 256、rope_dim 64、partial RoPE）在 950PR 上输出错误；Q 路径与 RoPE 公式本身正常，只有 K 被放大。
  visibility: 静默错误
mitigation:
  detect: 把融合 kernel 算出的 K variance 与 torch 参考逐 head 比较（该形状应为 1.05–1.19，实测全 0）；或先用正文给出的最小 repro kernel 单独跑平方与归约。
  fix: 待定（issue closed，正文给出源码定位与最小复现 kernel，未给修复 PR）
