  meta: '`infra_off`（vLLM legacy 双内核 `_fused_moe_lora_kernel`（`fully_sharded=True` 或 `max_lora_rank>128` 时使用）无条件把两操作数 cast 到 `bfloat16`（`accumulator += tl.dot(a.to(tl.bfloat16), b.to(tl.bfloat16))`）——**fp16 MoE 模型的 LoRA 乘加精度从 10-bit 尾数静默截到 7-bit**（注释自认 cast 为 ROCm 类型推断兼容，但硬编码 bf16 而非原生 dtype；one-shot 内核（rank≤128 非分片）保留原生 dtype——同模型两条路径精度不同使 discrepancy 难诊断）） · Cov: `NEW`（内核 dtype 硬编码降精度子签名） · 触发 `config` · 置信度 `documented`'
