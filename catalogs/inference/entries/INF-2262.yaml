id: INF-2262
legacy_ids: []
slug: vllm_ascend_kv_copy_overlaid_views_same_ptr
aliases: []
title: vllm-ascend KV 块拷贝按 data_ptr 去重跳过重叠视图
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Ascend KV 拷贝 helper 视图去重
  behavior: Ascend KV 块拷贝 helper 仅按 data_ptr 对源/目标视图去重，data_ptr 相同但形状不同的视图被判同一份而跳过拷贝，[narrow,wide] 组合实际不拷贝。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: 12 组 NPU 实测（3 dtype×4 视图组合）：[narrow,wide] 单双向 6 组全 FAIL（mismatch 6/8=75%，max diff 16），[wide,narrow]/[wide,wide] 6 组 PASS；安装版与 e8a6393d 提取版一致；端到端影响未测量。
  visibility: 静默错误
mitigation:
  detect: 构造 data_ptr 相同但宽度不同的 overlay 视图对，拷贝后 assert_close（rtol=0, atol=0）；repro 已给出。
  fix: 上游 vLLM 对应修复 https://github.com/vllm-project/vllm/pull/55112 （overlaid-view 去重问题，状态未核实）；vllm-ascend 侧暂无专门修复 issue/PR（报告者已检索确认）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-29'
