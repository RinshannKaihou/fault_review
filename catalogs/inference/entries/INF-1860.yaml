  mechanism: DeepSeek-R1-Distill-Llama-70B 在服务化配置下做 ceval 数据集精度测试，测出 12.33%，而基线是 64.19%，劣化 51.86 个百分点；同一次测试里 gsm8k 测出 31.31%，基线 32.6%，只差 1.3 点。也就是说中文知识类选择题几乎全错，数学题基本正常。正文给出的服务化配置是 TP=8、--enforce-eager、--distributed_executor_backend mp、--block-size 128、--no-enable-log-requests，评测用 vllm_client 并发 16 跑 ceval，另带 TASK_QUEUE_ENABLE=2、ATB_CONTEXT_WORKSPACE_RING=1、HCCL_BUFFSIZE=120 等 ATB/HCCL 环境变量。报告只给数字与配置，没有进一步定位到算子、chat template 还是评测脚本的答案解析，也没有给修复 PR；issue 自 2026-06 起 open。
  source: 2026-06-10 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10280 （open）
