title: ttnn.softmax tile padding inf/NaN 污染整行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: softmax kernel padding 处理
  behavior: TILE 布局 float32 输入的 tile padding 含 +inf/NaN 时按整 tile 归约，padding 值参与 max/sum 使整行错误且输出无 NaN；有限 padding 正确。
effect:
  objects:
  - 数值结果
  detail: last dim=24 padding=+inf 时最大相对误差 21.8%、NaN 时 100% 错；last dim=40 +inf 达 40.8%；8200 宽 NaN 100% 错、+inf 正确。输出不含 NaN、无报错，仅逐行检查概率和（应等于 1）才能发现。
  visibility: 静默错误
mitigation:
  detect: 检查每行 softmax 概率和是否为 1 可检出（错行 sum≠1）；输出无 NaN，逐元素对照才能定量
  fix: 待定（issue open 2026-10-28 新报）
