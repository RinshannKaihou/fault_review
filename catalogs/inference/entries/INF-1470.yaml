original:
  mechanism: 'op-plugin issue #602（c2026-10-19，Atlas A3 Ascend910_9362 ×2，CANN 9.1.0，torch 2.7.1 + torch_npu 2.7.1.post4，双芯一致、确定性、上下文存活无告警）：x.masked_scatter_(mask, src) 在 mask 命中位数（如 5）多于 src 元素数（如 2）时，CPU 抛 RuntimeError（src 元素不足）；NPU 静默接受，超出 len(src) 的槽位填入越界读到的设备内存垃圾（确定性值，非 NaN）。影响：静默数据污染，填充结果看似成功，垃圾值随前向传播扩散。修复 PR !6055（[fix] masked_scatter src 容量入口校验，防越界读静默污染）已提交、open：入口校验 src.numel() >= mask.sum()，不足抛 RuntimeError 对齐 CPU 语义。复现脚本：A3 真机 /mnt/workspace/a3hunt/round6/repro_r6_mscat_smallsrc.py。issue 自述与 #598（cross_entropy 越界 target 静默吞）同属"入口无校验→fail-silent"家族第二例。'
  source: 2026-10-19 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/602 （open）+ 修复 PR https://gitcode.com/Ascend/op-plugin/merge_requests/6055 （open）
  behavior: NPU 上调 masked_scatter_、当 mask 里 True 的个数比 src 里的元素多时，不报 CPU 那样的 RuntimeError，而是默默把缺的位置填上越界读到的设备内存垃圾值（数值稳定但完全是废数据），后续计算全部被污染且无任何告警。
