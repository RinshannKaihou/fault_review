original:
  mechanism: vllm-ascend main（8be8909d4，2026-08-07；vLLM main 0406ba22c）的 v2 speculator 路径 vllm_ascend/worker/v2/spec_decode/rejection_sampler_utils.py:287-288 中，概率拒绝检验所用的均匀随机数被硬编码为常量：注释写 NPU does not support tl_rand64; always accept the draft token，代码为 u = tl.full([], 0.0, dtype=tl.float32)。当 u=0.0 时 log(u)=-inf，判据 target_log_prob > log(u) + draft_log_prob 恒为 True，任何草稿 token 都不会被拒绝，拒绝采样退化为空操作。对照 GPU 基线 vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py:534 使用 u = tl_rand32(seed, pos, includes_zero=False)。同文件 line 71 的 _npu_gumbel_block_argmax 已给出可在 NPU Triton 上工作的随机写法（tl.randint + tl.rand），可作为修复；合成拒绝采样路径（line 356）当前因缺有效 u 直接 NotImplementedError。
  source: 2026-08-07 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13730 （open）
  behavior: 非贪心（temperature>0）的投机解码请求在 NPU 上输出质量明显低于同参数的非投机推理：草稿 token 全被接受、拒绝采样不生效，长文本上表现为用词发散、指令遵从下降；服务不报错，指标上只看到接受率异常高。
  trigger_surface: v2 speculator 投机解码 + temperature>0
