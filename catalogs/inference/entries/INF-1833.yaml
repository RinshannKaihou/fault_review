  visibility: 质量退化
mitigation:
  detect: 统计非贪心投机请求的草稿接受率，接近 100% 即异常；或用同一 seed 比较投机与非投机输出的分布
  fix: 待定；报告者建议改用同文件 line 71 已验证的 NPU 写法 gumbel_seed = tl.randint(seed, pos); r = tl.rand(gumbel_seed, block) 得到 u∈(0,1]（open，未核实 PR）
