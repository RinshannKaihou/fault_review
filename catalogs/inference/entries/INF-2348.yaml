id: INF-2348
legacy_ids: []
slug: ops_transformer_fd_min_check_value_sign_lse
aliases: []
title: FA/FD minCheckValue 默认值符号错全掩码行 LSE 错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FA/FD minCheckValue 默认值
  behavior: 三个 ComputeScaleValue 接口的 minCheckValue 默认值为 +FLT_MAX_NEW，而 vregLseMax 哨兵为 -FLT_MAX_NEW，符号相反使 == 判断永不成立，全掩码行 LSE 输出错误值。
effect:
  objects:
  - 数值结果
  detail: 全掩码行（该行所有 KV 被 mask，vregLseMax 保持 -FLT_MAX_NEW）在 softmaxLseFlag 生效且不显式传 minCheckValue（走默认值）时 LSE 输出错误值而非 inf；非掩码行不受影响。修复 = 三处默认参数改 -FLT_MAX_NEW。
  visibility: 静默错误
mitigation:
  detect: 构造全掩码行输入检查 LSE 是否为 inf；显式传入 -FLT_MAX 亦可规避（显式传参路径不受默认值影响）。
  fix: 修复 MR https://gitcode.com/cann/ops-transformer/merge_requests/15023 （merged 2026-10-31：三处默认参数改为 -FLT_MAX_NEW；是否随 CANN 版本发布未核实；!15022 为同修复早期提交已关闭）
