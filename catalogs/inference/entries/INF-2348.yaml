relations: []
original:
  mechanism: 'cann/ops-transformer issue #6975/#6976（2026-10-31，Ascend950 arch35 DAV_3510/CANN 9.1.0，closed）+修复 !15023（merged 2026-10-31）：attention/common/op_kernel/arch35/vf/vf_flash_decode_arch35.h 中 FA/FD（Flash Decode）scale 计算接口的 minCheckValue 默认值错误：三个 ComputeScaleValue 接口默认值均为 FLT_MAX_NEW（+3.402823466e+38），但该参数在函数内只用于判断「整行是否完全被 mask」：Reg::Compare<float, CMPMODE::EQ>(pregCompare, vregLseMax, vregMinValue, pregTailN) + Reg::Select<T>(vregRes, vregInfValue, vregRes, pregCompare)——而同文件 vregLseMax 的初值与尾部填充哨兵均为 -FLT_MAX_NEW（L271/L348/L467-468）。哨兵符号相反使 == 判断永不成立，全掩码行的 LSE 无法按设计置为 inf 而输出错误值。问题由代码走读定位（文件+行号），修复将三处默认参数改为 -FLT_MAX_NEW，不改变显式传参路径。'
  source: GitCode issue https://gitcode.com/cann/ops-transformer/issues/6975 （closed）+ 修复 MR https://gitcode.com/cann/ops-transformer/merge_requests/15023 （merged 2026-10-31）
  behavior: 用 arch35 的 Flash Decode / FlashAttention Decode 且开启 softmaxLseFlag 输出 LSE 时，遇到整行 KV 全被 mask 掉的行（如纯 padding 行或左 padding 超长请求），LSE 本应输出 inf 标记无有效注意力，实际输出一个错误的有效数值——下游依赖 LSE 判空或做 logsumexp 组合的路径（如 chunked prefill 合并、logprob 计算）会静默用错值。不显式传 minCheckValue 的调用全部受影响。
  trigger_surface: cann/ops-transformer arch35 FA/FD（vf_flash_decode_arch35.h）；softmaxLseFlag 生效；全掩码行输入；不显式传 minCheckValue；Ascend950/CANN 9.1.0。
  signature: 全掩码行 LSE 非 inf；显式传 -FLT_MAX 恢复正确。
  discovery: 2026-10-31 每日扫描
  notes:
  - 2026-11-01 回访 2026-11-01：源 ops-transformer#6975 已 closed；修复 !15023 此前已 merged，是否随版本发布未核实
