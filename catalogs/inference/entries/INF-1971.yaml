  detail: dynamic shapes 下图模式对 isfinite 的符号形状推导缺失，伴随 evaluate_expr(8*Max(1, s67) > 8) 求值失败（reshape 硬编码形状与动态维冲突），只在 warning 级别暴露。
  visibility: 报错
mitigation:
  detect: dynamic shapes 图模式下对含 aten.isfinite 的图开 TORCH_LOGS 看是否有符号形状推导 warning；检查 ge_converter/aten 下是否存在 isfinite.py
  fix: 待定（issue open；报告建议照 aten/isinf.py 新建 ge_converter/aten/isfinite.py 调 ge.IsFinite，该目录由 pkgutil 自动发现，无需额外注册）
