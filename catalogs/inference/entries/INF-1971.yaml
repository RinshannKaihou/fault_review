  behavior: aten/ 目录下缺 isfinite.py，符号形状推导按 _CONVERTERS 分发调用 aten.isfinite.default 查不到注册项，异常被 silent 降级函数吞成 warning。
effect:
  objects:
  - 可用性/进度
