original:
  mechanism: 'Ascend/torchair issue #634（2026-08-10 open；Python 3.12.9、Ubuntu 24.04）：dynamic shapes 图模式编译含 aten.isfinite.default 的模型时符号形状推导失败。直接原因是 ge_converter/aten/ 目录下不存在 isfinite.py，infer_symbol_shape.py:325 执行 target(*meta_args, **meta_kwargs) 模拟算子调用时在 _CONVERTERS 分发表里查不到注册项，异常被 infer_and_gen_sym_shape_silent()（行 254-261）捕获后只降级为 warning。对比同类算子：isinf.py 已实现并调 ge.IsInf，isnan.py 与 isposinf.py 是占位 raise NotImplementedError，isfinite.py 缺失；auto_generated_ge_raw_ops.py 已生成 IsFinite API，可直接调 ge.IsFinite，prims/isfinite.py 虽有注册但抛 NotImplementedError 且属不同 dispatch key。伴随的符号表达式求值失败为 evaluate_expr(8*Max(1, s67) > 8)，即 reshape 的硬编码形状与 dynamic dim 冲突。'
  source: 2026-08-10 GitCode Ascend/torchair issue https://gitcode.com/Ascend/torchair/issues/634 （open）
  behavior: dynamic shapes 图模式下编译带 isfinite 的模型时，符号形状推导这一步不产出该算子的符号形状，只在日志里留一条 warning；随后能看到 evaluate_expr(8*Max(1, s67) > 8) 求值失败、reshape 的硬编码形状与动态维冲突这类二次报错。因为第一层失败被降级成 warning，用户按报错去找 reshape 的形状问题，很难定位到是 isfinite 的 converter 没注册。
  trigger_surface: torchair dynamic shapes 图模式的符号形状推导（算子图含 aten.isfinite.default）
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
