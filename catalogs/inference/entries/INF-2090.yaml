id: INF-2090
legacy_ids: []
slug: hccl_hcomm_dlinit_toctou_race_static_flags
aliases: []
title: HcommDlInit 无锁哨兵致并发 dlopen 与静态量竞争
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: hcomm_dlsym 初始化
  behavior: 两个 DlInit 用非同步哨兵 if (gLibHandle) return，多线程可同时通过并各自 dlopen；INIT_SUPPORT_FLAG 写的 static bool 被非原子并发写。
effect:
  objects:
  - 性能/资源
  - 可用性/进度
  detail: 第二个 dlopen 句柄覆盖第一个且不 dlclose、子初始化重复执行；static g_*Supported 并发写属 C++ UB，能力探测结果可能被后写者覆盖，通信库初始化出现不可复现差异。隔离模型 1000/1000 次触发。
  visibility: 不可复现
mitigation:
  detect: 多线程用 barrier 同时首次调用 HcommDlInit/HcommDeviceDlInit，统计 dlopen 次数与句柄是否泄漏、g_*Supported 是否被重复写；目标机可用 TSan
  fix: issue 给出双检锁方案（std::mutex + std::atomic，参照同文件 GetHcommVersion 的 HcommVersionCache，commit 3aa49851 已修同模式）；本 issue 的两个函数尚未修（closed）
