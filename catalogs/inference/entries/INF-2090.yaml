original:
  mechanism: 'cann/hccl 的 src/common/hcomm_dlsym/hcomm_dlsym.cc 中 HcommDlInit()（第 62-84 行）与 hcomm_device_dlsym.cc 中 HcommDeviceDlInit()（第 26-41 行）都用 if (gLibHandle != nullptr) return; 作哨兵，检查与赋值之间没有任何同步（两文件已 include pthread.h，但无 mutex/pthread_once/atomic/call_once/内存屏障）。多线程并发首次调用时都能通过哨兵，各自执行 dlopen：第二个句柄覆盖第一个、第一个句柄永不 dlclose；同时 11 个（device 侧 4 个）子初始化函数被重复并发执行，INIT_SUPPORT_FLAG 宏写入的 static bool g_*Supported 被非原子并发写，构成 C++14 [intro.races] p21 的 UB。报告者在隔离模型里用 std::barrier 对齐两线程，1000 次迭代 1000 次触发；并指出同文件 GetHcommVersion() 的同一模式已由 commit 3aa49851 用 HcommVersionCache+std::atomic+std::mutex 双检锁修复（issue #291），本 issue 的两个函数属不同函数、不同变量，需各自修。'
  source: 2026-07-15 GitCode cann/hccl issue https://gitcode.com/cann/hccl/issues/292 （closed）
  behavior: 多线程/多进程拉起通信库时，偶发能力探测结果与单线程首次初始化不同：某些 hccl 接口被判为不支持而走回退路径，或 dlopen 句柄泄漏；现象不可复现、换启动顺序就消失，日志里通常只有后续通信行为异常，没有初始化报错。
  trigger_surface: cann/hccl HcommDlInit/HcommDeviceDlInit 在多线程下并发首次调用（通信库懒加载初始化）
  discovery: 2026-10-21 第三轮顺序扫描（tail_2，issue created < 2026-10-07）
