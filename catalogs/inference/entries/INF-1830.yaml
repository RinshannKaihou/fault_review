original:
  mechanism: 开启 FlashComm1 / 序列并行（SP）后，视觉语言模型的第一个语言模型 attention 层总是按静态模型属性 is_vl_model() 跳过 SP 的 AllGather：vllm_ascend 里 SequenceColumnParallelOp.apply_impl 的判断是 need_all_gather = not (extract_layer_index(self.layer.prefix) == 0 and is_vl_model() and "attn" in self.prefix)。这个假设在 VL 模型以纯文本配置运行时不成立——例如 --language-model-only 时首层输入来自模型自己的 embedding 层，该 embedding 输出先被 SP 路径 ReduceScatter 过，进入第一层时已经是 TP 分片状态，必须在列并行 attention 投影前 AllGather。报告强调问题与具体模型无关，用 Qwen3.5 与 MiniMax-M3 都复现了同一行为，并附上现有实现片段；issue 2026-08-17 open。
  source: 2026-08-17 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/14410 （open）
  behavior: VL 模型带 --language-model-only（或多模态输入缺席、实际按纯文本跑）并开 FlashComm1/SP 时，生成质量下降、答案开始偏；关掉 SP 或改回原生多模态输入就恢复。全程不报错，日志里也看不到 mask/shape 告警，只看评测分数才会发现。
  trigger_surface: FlashComm1/SP + VL 模型纯文本运行（--language-model-only）+ 首层 attention
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
