original:
  mechanism: 'vllm-ascend 的 #9765（c50023e34）在 NPUWorker 里加了 profile_memory()：初始化 self.torch_reserved/self.torch_allocated，并在 execute_model() 与 execute_dummy_batch() 里调用，按 DEBUG 级别打印 torch reserved/allocated 显存。#11960（c1bd7c161）本意只是回退 model forward 里的 torch.npu.memory_reserved()（该调用在 TPOT 上要多花约 0.5ms），但 revert 提交把 profile_memory() 方法、两个属性初始化、两处调用一并删掉。结果是 worker 上不再有 torch_reserved/torch_allocated，execute_model 也不再打印显存。'
  source: 2026-08-12 github.com issue https://github.com/vllm-project/vllm-ascend/issues/13786 （closed）
  behavior: 想在 DEBUG 日志里看 execute_model 期间的 torch reserved/allocated 显存时，发现这两行再也没有了，worker 对象上也取不到对应属性；服务本身正常跑、不报错，只是显存缓慢增长这个问题突然失去了唯一的观测手段。
  trigger_surface: vllm-ascend NPUWorker，DEBUG 级别日志
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
