id: INF-2065
legacy_ids: []
slug: vllm_ascend_profile_memory_removed_observability
aliases: []
title: 回退误删 profile_memory 使显存指标不再可观测
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: vllm
    component: NPUWorker 显存 profiling
  behavior: 'revert PR #11960 本意只删 forward 里的 memory_reserved，却把 profile_memory()、显存属性初始化和 execute_model 里的调用一并删掉。'
effect:
  objects:
  - 指标/日志
  detail: DEBUG 级别下查看 execute_model 期间显存时，不再打印 torch reserved/allocated，worker 上取不到这两个属性；服务本身正常跑、不报错，显存缓慢增长这个问题突然失去唯一观测手段。
  visibility: 静默错误
mitigation:
  detect: DEBUG 日志里查 torch_reserved/torch_allocated 是否出现；或对 worker 取属性判断是否还存在
  fix: 恢复 profile_memory() 与其在 execute_model 开头的调用（受 DEBUG 级别守卫），报告称 PR 在推进
