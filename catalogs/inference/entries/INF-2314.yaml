id: INF-2314
legacy_ids: []
slug: vllm_kimi_k3_flashkda_nan_cross_request_spread
aliases: []
title: vLLM Kimi-K3 FlashKDA NaN 跨请求扩散 token 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flash-attention
    component: FlashKDA prefill 尾块跨序列读
  behavior: FlashKDA 以 16 行块处理序列，最后不完整块把序列结束后的 beta/v 行（属同 batch 下一序列）读入并以乘零消除，0*NaN=NaN 使一个请求的 NaN 进入另一请求的输出与循环状态。
effect:
  objects:
  - 跨请求/跨样本数据
  - 输出内容
  detail: 负载下 Kimi-K3 请求成组输出 token 0（!）至 max_tokens，logprob=null；AIME25 0.883→0.700（56/516 坏）；注入 1 NaN 使 240 个其他 decode 中 96 个坏。首 NaN 疑似 FlashMLA PDL 竞态（未证实）。
  visibility: 静默错误
mitigation:
  detect: 监控输出中连续 token 0 / logprob=null；对 KDA prefill kernel 跑 issue 附单 GPU 秒级 NaN 泄漏复现（lens=[1,700] 等）。
  fix: 修复 PR https://github.com/vllm-project/FlashKDA/pull/16 （open；序列尾后行选 0，三用例全清）与 https://github.com/vllm-project/FlashMLA/pull/41 （open；vLLM 侧 stopgap 为 kernel 间插普通 kernel）；vLLM 需 bump pin，未合入未发布。
