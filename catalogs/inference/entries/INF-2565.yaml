original:
  mechanism: 'cann/ops-math 的 UT 比对脚本族（issue #4777、#4778，2026-11-15）存在两类静默假绿：real_div 与 real 的 compare_data.py 把 int32 输出按 float32 解析，且用例目录为空时直接返回 PASSED；diag_part 的 UT 驱动把 fp32/int32 的数据生成硬编码成 float16，compare_data 对空列表也判 PASSED。两者都属于“脚本报 PASSED 但没有比对真实输出”，与 ops-nn #5511（INF-1761，zip 截断漏检）同属 compare_data 脚本族、机制不同：前者是 dtype 解析错配与空集短路，后者是文件数不一致时 zip 静默截断。修复 PR #7468（real_div/real）与 #7469（diag_part）均为 open，未合入。'
  source: https://gitcode.com/cann/ops-math/issues/4777 https://gitcode.com/cann/ops-math/issues/4778 （均 open，2026-11-15）
  behavior: 看 ops-math 的 UT 回归会以为 real_div/real 与 diag_part 全绿：int32 的输出被当成 float32 逐字节解读，数值当然对不上时就当作通过；用例目录被清空、或比对列表为空时脚本直接 PASSED；diag_part 甚至用 float16 驱动生成 fp32/int32 的期望数据。于是算子真的算错也检不出来，只有人工核对脚本或换 dtype 重跑才暴露，属于监控/回归覆盖的静默盲区。
  trigger_surface: cann/ops-math tests/ut 下 real_div、real、diag_part 的 gen_data.py/compare_data.py；int32 输出、空用例目录、fp32/int32 输入。
  discovery: 2026-11-15 每日扫描
