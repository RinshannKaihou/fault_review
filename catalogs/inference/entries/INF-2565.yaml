title: ops-math UT 比对脚本 dtype 错配并空目录假绿
kind: 故障
status: retired
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: real_div、diag_part UT
  behavior: compare_data.py 把 int32 输出按 float32 解析、空目录/空列表直接判 PASSED；diag_part 驱动把 fp32/int32 硬编码成 float16 生成数据。
effect:
  objects:
  - 测试判定
  detail: real_div/real 的 int32 结果按 float32 解读且空目录返回 PASSED；diag_part 的 fp32/int32 用 fp16 驱动数据、比对空列表判 PASSED，回归全绿但从未验证真实输出。
  visibility: 静默错误
mitigation:
  detect: 在用例目录放一个 dtype/内容错误的 output 或清空目录，脚本仍 PASSED 即命中；静态检查 compare_data 是否按 dtype 选择解析分支。
  fix: '修复 PR #7468（real_div/real 类型映射与空集校验）、#7469（diag_part 驱动 dtype 与空目录）均 open，未合入'
