cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: CCU alltoall mesh1d 核
  behavior: (1 << rankSize) 的字面量 1 是 32 位 int、rankSize 是 uint64_t：rankSize≥32 时左移是未定义行为，≥16 时结果截断进 uint16_t allBit，同步掩码缺少高位 rank
effect:
  objects:
  - 可用性/进度
  detail: 单层 mesh1d 子通信域 alltoall/alltoallv rankSize>16 时，同步掩码只覆盖低位 rank，部分 rank 到达事件不被等待，集合通信可能提前返回或后续步骤挂住；≤16 rank 读不到异常。报告自述 rankSize≥32 仓内未确证实际发生，属防御性缺失。
  visibility: 挂起
mitigation:
  detect: 静态检查 (1<<rankSize) 类掩码构造：确认移位字面量位宽与目标容器宽度，核对 rankSize 上界校验是否存在
  fix: 待定（issue closed，未见 MR）：掩码改用 uint64_t/1ULL 构造并按 rankSize 校验，或在 ParseKernelArg 补上界检查
