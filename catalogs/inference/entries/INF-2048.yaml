original:
  mechanism: cann/hccl issue 634（2026-08-21，closed，AI 缺陷扫描报告，置信度 89%）：src/ops/all_to_all_v/template/ccu/kernel/ccu_kernel_all_to_all_mesh1d.cc 第 139 行 uint16_t allBit = ((1 << arg->rankSize) - 1) & (~(1 << arg->rankId))。1 为 int（32 位有符号），arg->rankSize 为 uint64_t，rankSize≥32 时移位超出位宽属 C++ 未定义行为，rankSize>16 时结果被截断赋给 uint16_t，得到错误的同步掩码；第 144/146/151 行 1<<r 同型。调用链 CcuAlltoAllMesh1DKernel（169 行）→ ParseKernelArg（184 行，24-27 行为空实现直接返回 CCU_SUCCESS，不校验 rankSize）→ DoAlltoAll（190 行）→ sink 139 行。rankSize 来自 subCommRanks_[0].size()（ccu_temp_all_to_all_mesh_1D.cc:54），选择器 SelectCcuScheduleAlgo 对单层 mesh1d 的 else 分支不检查 userRankSize 上限，CCU_MAX_RANK_SIZE=128 允许 channels 数组到 128 个。报告自述 rankSize≥32 在仓内未确证实际发生，属防御性缺失。
  source: 2026-08-21 GitCode cann/hccl issue https://gitcode.com/cann/hccl/issues/634 （closed）
  behavior: 在大规模单层 mesh1d 通信域做 alltoall/alltoallv 时，若参与 rank 数达到 16 以上，同步掩码只覆盖低位 rank，部分 rank 的到达事件不被等待，集合通信可能提前返回或在后续步骤挂住；小规模集群（≤16 rank）读不到异常。
