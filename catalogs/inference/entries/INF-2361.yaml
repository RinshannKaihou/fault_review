id: INF-2361
legacy_ids: []
slug: vllm_ascend_retention_interval_dead_env
aliases: []
title: Ascend 混合 KV retention_interval 配置失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: KV 协调器初始化与转发
  behavior: 协调器读 0.29 清理中已删除的 env 恒得 None，不调 super().__init__()，覆写的 find_longest_cache_hit 也不转发 retention_interval，三处断裂使配置失效
effect:
  objects:
  - 性能/资源
  - KV状态
  detail: DeepSeek-V4/V4.1 上设 --prefix-cache-retention-interval 无任何效果；非法值 4097（非 block-size 32 倍数）被静默接受，四 DP 引擎正常初始化、日志无错误，上游 must be a multiple 校验从未出现
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: '修复 PR https://github.com/vllm-project/vllm-ascend/pull/20546（open，2026-11-01）：改读 CacheConfig 字段、补校验与转发；未发布。历史：#17480 修过 env 读取但 2026-10-09 被 #18029 整体回退'
