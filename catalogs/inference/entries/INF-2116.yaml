original:
  mechanism: 'A3 的 npu_hc_pre_v3（vllm-ascend commit fbb4d867，xLLM 以 hc_pre_va 集成）数值一致性问题：Sinkhorn 列归一化对行按对齐 stride 存储的列和缓冲加 epsilon 时使用 packed 元素计数。hcMult=4 时 hcMultAlign=8：ReduceSumARAPerf 后每行列和占 8 个 FP32 元素（4 有效+4 padding），但 Adds(reduceLocal, reduceLocal, hcEps, curRowFactor*hcMult) 只更新前 curRowFactor*4 个元素（3 行即前 12 个，含 row0 的 padding、漏 row2 的全部有效位）；随后除法按对齐 stride 读分母，部分行得到 epsilon 部分行没有。首次列归一化前与后续 Sinkhorn 迭代内均发生。算子级隔离复现（A3 实机，排除 attention/cache/分布式）：BF16 隐输入、hc_mult=4、hc_fn=0、hc_scale=0 排除投影 GEMM、128 相同隐行与相同外部 pre_mix、hc_base 取 zero/normal/small、迭代 1/2/4/20，全部 12 组组合复现位置依赖 comb 输出。上游修复 PR #19401（open）。'
  source: https://github.com/vllm-project/vllm-ascend/issues/19357 + 修复 https://github.com/vllm-project/vllm-ascend/pull/19401（均 open，2026-10-21 每日扫描，正文全文已读）
  behavior: 在 A3 上跑含 Sinkhorn 列归一化的 hc_pre 算子：同样的输入行因所处行位置或输入划分方式不同，comb 输出不一样（12 组对照全复现）；上游 vllm-ascend 服务与移植版都能观察到输出随行位置漂移，无报错。上层模型表现为难解释的数值不一致。
  trigger_surface: Ascend A3（910_93）、quay.io/ascend/vllm-ascend:v0.30.0rc2-a3、vllm-ascend fbb4d867、npu_hc_pre_v3/hc_mult=4。
  discovery: 2026-10-21 每日扫描
