title: vllm-ascend hc_pre_v3 epsilon 错位致输出依赖行位置
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: hc_pre Sinkhorn 列归一化
  behavior: hc_pre 对按对齐 stride 存储（hcMult=4→每行 4 有效+4 padding）的列和缓冲加 epsilon 时用 packed 计数（3 行漏 row2 有效位），部分行分母没得到 epsilon。
effect:
  objects:
  - 数值结果
  detail: 算子级隔离复现（A3 实机，hc_mult=4、排除投影 GEMM、128 相同隐行、hc_base 三态、迭代 1/2/4/20）：全部 12 组复现位置依赖的 comb 输出——相同输入因行位置/划分不同而不同。首次列归一化前与迭代内都发生。
  visibility: 静默错误
mitigation:
  detect: 同隐输入复制多行跑 hc_pre 并对比 comb 输出是否逐行一致；行位置相关差异即命中。
  fix: 上游修复 https://github.com/vllm-project/vllm-ascend/pull/19401（Fix Sinkhorn column epsilon alignment in hc_pre kernels，open 未合、发布未核实）
