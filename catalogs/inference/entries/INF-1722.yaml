id: INF-1722
legacy_ids: []
slug: sfa_tail_minus1_not_shrink_s2realsize
aliases: []
title: sparse_flash_attention 遇 -1 未收缩有效长度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SFA arch35 KV gather
  behavior: ProcessSparseKv 遇到 -1 只 break 停止 gather，不回写 runInfo.s2RealSize；该值仍由 s2BaseSize 与尾块裁剪决定，未 gather 的位置以脏数据参与 QK/softmax/PV。
effect:
  objects:
  - 数值结果
  detail: topk=2051 仅前 8 有效、其余 -1 时输出 max 达 1.9e29（仍 finite）；K=2、indices=[5,-1] 时输出 -872~156；均无报错、无 NaN/Inf。尾部仅少量 -1 时数值看似正常，但与截断到有效 topk 的结果相差 0.067。
  visibility: 静默错误
mitigation:
  detect: 构造尾部大量 -1 的 sparse_indices，与截断到有效 topk 的等价用例比对；不能只用 isfinite 判定正确
  fix: 建议：遇 -1 后同步收缩本 tile 的 s2RealSize 并对未填充位置做确定性填充；哨兵判断先看 raw index<0 再加 s2StartIdx（未核实修复）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: ''
