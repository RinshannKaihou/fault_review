original:
  mechanism: 'SGLang #44999（c2026-10-18，RTX 3090，0.5.22，probec 探针 twin：Qwen3-30B-A3B shape 2 层/128 experts/top-8，AWQ 4-bit group128 权重可精确表示、每 token 输出已知——偏离即引擎错误非数值差异）。moe_wna16_marlin 路径多数 run 有 1-18 请求从某 decode 步起错 token。对照矩阵：--quantization moe_wna16（Triton WNA16）0/0；vLLM 0.31.0 同 checkpoint 走其自带 Marlin MoE 0/0/0；bf16 源 checkpoint 0/0/0——缺陷限定 SGLang Marlin MoE。非确定性：重跑错的请求不同、部分 run 干净；--disable-radix-cache 1、--disable-cuda-graph 1、--mem-fraction-static 0.5（0 与 18 两极）都仍错；--max-running-requests 1 单请求逐次跑 11/192 仍错（4 prompt × 24 次重复：每 prompt 3-6 种不同输出、2-5 次错）——排除纯 batching 因素；批内无关请求常同 step 同时错。GEMM 隔离测试精确（tools/marlin_determinism 摘要），怀疑内核与调度/缓存管线交互，根因未定位。'
  source: 2026-10-18 GitHub sgl-project/sglang issue https://github.com/sgl-project/sglang/issues/44999 （open）
  behavior: 在 RTX 3090（SM86）上用 SGLang 0.5.22 跑 AWQ 4-bit MoE 模型（Marlin MoE 内核）时，多数运行里少数请求的生成从某个 decode 步开始变成错误 token：批处理时无关请求常在同一步一起出错；一条请求单独跑 24 次会有 2-5 次错且错误输出各不相同；重跑错的请求不一样、偶尔整轮干净。换 Triton WNA16 内核或用 vLLM 跑同 checkpoint 完全精确。
