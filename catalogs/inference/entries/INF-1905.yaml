id: INF-1905
legacy_ids: []
slug: mindformers_pynative_epoch_count_ignores_accum
aliases: []
title: 静态 batch 的 epoch 数漏乘累积致迭代器提前耗尽
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspore
    component: Trainer 迭代器 epoch 数推导
  behavior: 静态 batch 分支用 training.steps // train_epoch_step 相除，前者是 optimizer step、后者是 micro-batch，漏乘 num_accumulation_steps
effect:
  objects:
  - 训练样本流
  - 可用性/进度
  detail: accum>1 时续训被 add_skip_pass 拒绝（reset step 307584 > 298080）；不续训也会在 dataset_size×num_epochs/accum 步提前耗尽迭代器并重建
  visibility: 静默错误
mitigation:
  detect: accum>1 时核对 create_dict_iterator 的 num_epochs 是否 ≥ steps×accum/epoch_step；续训失败时比对 add_skip_pass 报的 step 与 dataset_size*num_epochs
  fix: issue 给出的修法是容量按 micro-batch 计算并保留一个 epoch 余量（与动态 batch 分支一致，静态分支用 num_accumulation_steps 作倍数）；未见关联 PR（issue 已关闭，未核实）
