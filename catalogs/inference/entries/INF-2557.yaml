id: INF-2557
legacy_ids: []
slug: ops_math_slice_with_axes_nonconstant_params_ignored
aliases: []
title: SliceWithAxes 非常量 offsets/size 被忽略
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: slice_with_axes tiling
  behavior: GetConstIntToShape 取不到常量时跳过切片参数，保留零 offsets 与完整输入 shape，kernel 只读 tiling 的 fullOffsets/outShape。
effect:
  objects:
  - 数值结果
  detail: offsets/size 由运行时张量给出时算子按整块输入拷出：切片起点和长度都错，返回成功、无告警；仅常量参数的用例表现正常。
  visibility: 静默错误
mitigation:
  detect: 用非常量 offsets/size 输入（值依赖张量）与等值常量版本对拍；检查 tiling 日志里的 fullOffsets/outShape 是否退化为 0/全 shape。
  fix: 待定：issue 给出行号定位（slice_with_axes_def.cpp:41-52、tiling GetParams:132-157、kernel arch35 slice_with_axes.h:239-272），未核实修复 PR。
