title: 11 算子 TTK golden 四类缺陷致精度结论失真
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: TTK golden 与三方标杆对照
  behavior: golden 无条件 astype(float32) 撤销了 Promote、三方腿抬档后不回窄，两者逐位相同使 cross_check 分母塌陷；另有整型强转 fp32 丢位、空张量崩溃、compose 与融合内核算法不对等。
effect:
  objects:
  - 测试判定
  detail: TTK 精度任务中，有量纲 rmse 比值随输出量级放大（lamb_next_m_v fp16 98.79）仍 PASS；3200/3200 行 |b-g|=0；整型用例 2^30+100 变 2^30+128，整型 dtype 结论从未被真正验证；空张量用例直接判 golden 失败。
  visibility: 静默错误
mitigation:
  detect: 查 golden 里是否无条件 astype(float32)、看 ttk-compare.log 是否 |b-g| 恒 0；rmse 比值远大于 mare/mere 即是塌陷指纹。
  fix: 待定（issue closed，未给 MR）：golden 保留 Promote 后 dtype、三方腿按内核精度口径 compose，并补空张量与整型用例。
