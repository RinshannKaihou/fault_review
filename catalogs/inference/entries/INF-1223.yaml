  section: 第 15 类 · 幻觉 / 忠实性 / 对齐（model_on）— 检测器已验证的信号
  meta: '`model_on` · Cov: `NEW` · 触发 `n/a` · 置信度 `verified`'
  mechanism: 事实性知识集中在 LATE layers，早层／过早退出层承载的分布更弱、更不正确。任何把有效输出权重前移的扰动（early-exit、layer-mixing、speculative decoding）都会在不把激活推离流形的前提下降低事实性。DoLa 的缓解手段正是对比早层与最终层的 logits。
  source: Chuang et al., "DoLa", ICLR 2024, https://arxiv.org/abs/2309.03883 。
  behavior: 当有效输出分布被拉向某个早层时，事实性错误增加。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。这条恰恰就是一个跨层轨迹发散签名：早层投影 logits 与最终层 logits 之间的散度本身即 DoLa 信号。trajectory 族（逐层 logit-lens 一致性）与 infotheoretic 族（早层→最终层 KL）直接测量它；geometric 族的离流形检测无效。预测：模型答错的样本上，早层到最终层的 KL 会显著更高（MATERIALLY higher）。
  repro: promptset-only，无新提示域、无新度量。在既有 factual_qa / hallucination 提示集上按对错打标，计算既有的 `logit_lens_kl`，做 EARLY layer vs FINAL layer 对比；早层位置由参数（如层深 0.125 处）确定，度量族记为 infotheoretic。
