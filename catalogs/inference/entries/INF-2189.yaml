original:
  mechanism: aclnnRotateQuant（A2 分支，CANN 9.2.0，ops-nn 711a4f5d）：资料参数表对 x 标注「支持空 Tensor」。当 x 为 (4,0)、yOut 为 int8(4,0)、scaleOut 为 float(4) 时，两段接口都返回 0，但 scaleOut 的 4 个元素一个都没写（预填金丝雀 1e30 读回仍是 1e30）。源码锚点：op_api/aclnn_rotate_quant.cpp 早退分支 `if (x->IsEmpty() || rotation->IsEmpty() || yOut->IsEmpty() || scaleOut->IsEmpty()) { *workspaceSize = 0; ...; return ACLNN_SUCCESS; }`——x、yOut 为空（0 元素）但 scaleOut 是 (4) 非空，「返回成功 + 有非空输出 + 输出未写」三者同时成立，且 workspaceSize=0 意味着第二段不下发任何 kernel。(0,256) 形态不暴露（scaleOut 为 0 元素），故缺陷仅在 M>0 且 N=0 时出现。自包含 C++ 复现（N=256 对照 + N=0 缺陷组对比 scaleOut_canary_kept）。来源 https://gitcode.com/cann/ops-nn/issues/7414（open）。与 INF-2187（GatherPaKvCache 空输入静默 no-op）同机制不同算子。
  source: 2026-10-26 每日扫描（NPU 批次 batch-20261026T230043147986-d99c34of）。https://gitcode.com/cann/ops-nn/issues/7414
  behavior: 调用 RotateQuant 旋转量化算子时，如果输入张量行数非零但列数为 0（如 (4,0)，变长场景中空 token 行），接口返回成功，但输出里的 scaleOut（形状 (4)，非空）一个元素都不写，保持调用前缓冲区内容——预填金丝雀 1e30 后读回仍是 1e30。上层拿到的 scale 是上一步或未初始化的残留值，量化系数完全错误且无任何报错；下游按错误 scale 反量化会整体错值。只有专门检查 scaleOut 是否被写过才能发现。
  trigger_surface: aclnnRotateQuant（A2 分支）；x 形状 M>0 且 N=0（scaleOut 非空的空输入形态）；Ascend 910B2、CANN 9.2.0 实测
  discovery: 2026-10-26 每日扫描
