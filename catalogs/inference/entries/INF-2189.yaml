title: RotateQuant 空张量时 scaleOut 静默未写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: aclnnRotateQuant 早退分支
  behavior: x/yOut/scaleOut 任一 IsEmpty 即返回成功且不下发 kernel；x=(4,0) 时空、scaleOut=(4) 非空，scaleOut 4 元素全部未写
effect:
  objects:
  - 数值结果
  detail: scaleOut 预填金丝雀 1e30 读回仍 1e30（一个元素都没写）；两段返回 0；仅 M>0 且 N=0 形态暴露（(0,256) 时 scaleOut 也为 0 元素）
  visibility: 静默错误
mitigation:
  detect: scaleOut 预填金丝雀检查是否被写；N=256 对照组正常写出
  fix: 待定（issue 期望：N=0 要么报 161002 要么 scaleOut 写出确定值）
