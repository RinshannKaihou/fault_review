cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: 整数零除处理
  behavior: 整数 div 除零不抛 ZeroDivisionError 而返回 INT64_MAX/MIN 垃圾值；remainder 原样返回被除数；fmod 整数除零触发设备级 507018（910B3 上进程级崩溃 ERR99999）
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: 下游把垃圾值当合法结果消费；A3 上 fmod 设备 fault 毒化上下文，级联使后续独立操作 507035 失败；CPU 三者统一 RuntimeError
  visibility: 静默错误
