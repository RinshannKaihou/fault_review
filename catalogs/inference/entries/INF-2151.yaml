original:
  mechanism: torch_npu 2.7.1.post4 整数除法/取模零除行为与 CPU 分叉（A3 双芯 CANN 9.0.0 与 910B3 单芯 CANN 9.1.0 双机一致复现，确定性）：int64 div(rounding_mode=floor) [7,-7,0]/0 返回 [9223372036854775806, 9223372036854775807, 9223372036854775806]；trunc 返回 [INT64_MAX, INT64_MIN, 0]；remainder 原样返回被除数 [7,-7,0]；CPU 三者统一 RuntimeError（ZeroDivisionError 语义）。fmod 整数除零更糟：910B3/CANN 9.1.0 进程级崩溃（ERR99999，stderr 无 Python 异常），A3/CANN 9.0.0 ACL stream synchronize failed 507018，且毒化设备上下文级联导致后续独立操作 507035 失败。附加：INT64_MIN/-1（trunc）CPU 回绕 INT64_MIN、NPU 饱和 INT64_MAX。零除检查被绕过后下游把垃圾值当合法结果消费。
  source: 2026-10-23 每日扫描 https://gitcode.com/Ascend/op-plugin/issues/628（open，双机双版本复现）
  behavior: NPU 上整数张量除以 0：div 静默返回 9223372036854775806/07 这类看起来像合法大数的垃圾值，remainder 把被除数原样返回，下游无从感知；fmod 则直接设备级 fault（A3 报 507018、910B3 整进程 ERR99999 崩溃），之后该设备上下文上其他本来正常的操作也开始报 507035。CPU 上同样的代码会立刻抛 RuntimeError。
  trigger_surface: torch_npu 2.7.1.post4；A3（CANN 9.0.0）与 910B3（CANN 9.1.0）；int32/int64 张量除以 0 或对 0 取模/取余；INT64_MIN/-1 边界。
  discovery: 2026-10-23 每日扫描
