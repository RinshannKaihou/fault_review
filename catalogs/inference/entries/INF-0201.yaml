original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.operations.moreh.norm_backward` 接受任意 float `p`，而匹配的 forward `moreh_norm` 对 `p=±inf/0` 有显式特判；backward 工厂无特判，把 `p` 与 `p−1` 直接喂 `get_floored_p_and_decimal_and_p_is_negative()`——`static_cast<uint32_t>(±inf)` 是 UB、`decimal = inf−inf = NaN`。ttsim bf16 确证：`p=+inf` 时 **argmax 元素梯度全部返回 0.0**（期望 dy 广播到 argmax 位）、部分非 max 元素带高至 1.5e38/inf 的垃圾；`p=−inf` 时 argmin 梯度正确但**非 argmin 元素残留非零梯度**（期望 0），最大到全 dy 幅度） · Cov: `var:ttmetal_norm_backward_zero_slice_singular_reciprocal_nan`（1.178 moreh_norm 参数域未守卫族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: forward/backward 工厂对参数域的守卫不对称——forward 特判 `IS_ZERO`/`MINUS_INF`，backward 无对应分支，浮点极值进入整数转换路径触发 UB 与 NaN 传播。
  source: 'tt-metal #56248（2026-09-11 open，bug+community label，含 ttsim 逐行复现、4 形状×2 维×2 阶的 8 格误差矩阵）。https://github.com/tenstorrent/tt-metal/issues/56248'
  behavior: 无 crash——**梯度静默错误**（关键位归零或垃圾值），训练侧信号损毁。1.178（norm_backward 零切片 NaN）之后 moreh 族新成员：本条在 p=±inf 参数域、前/后向守卫不对称维度。
  trigger_surface: tt-metal moreh_norm_backward + p=±inf（hw_specific；机制可迁移任何"forward 特判极值、backward 不判"的算子对）
  discovery: 2026-09-11 每日扫描。
