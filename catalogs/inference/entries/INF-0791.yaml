  mechanism: vLLM 的 block-table 映射出错，导致跨序列的 KV 泄漏或读到过期（stale）的 KV block——即一个序列的注意力读到了属于另一个序列或上一轮请求的缓存块。
  source: 'vLLM #9231。'
  behavior: 静默发生，且隐私后果严重（跨请求内容泄漏）。（源文档将行为效应与签名合并为一条给出。）
  trigger_surface: 注意力/KV 实现路径
  signature: off-manifold，形态是**跨越整个 block 的关系性簇跳变**（relational cluster jump spanning a whole block）——不是单点尖峰，而是一整段位置的表示被替换成另一个语境的表示。geometric 族的分块 Mahalanobis / 局部性感知检测在块粒度上可命中；spectral 族会看到该段引入了不属于当前上下文的主方向。相反，逐通道的 per-channel 离群检测容易漏，因为被换入的值本身在数值上完全"健康"，只是语义上属于别的序列。
  repro: 可软件复现性为 partial——单钩子可把一段 KV 条目整体替换为另一条序列的对应片段（swap mode，与 kv_corrupt 共用复现位置）；但真正的 block-table 分页机制在 HF 前向路径中并不存在，无法完整复现。
