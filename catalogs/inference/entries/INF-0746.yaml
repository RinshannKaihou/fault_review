  meta: '`infra_off`（#51415 手工 SiLU+NVFP4 fusion 按 `[num_tokens, ceil(K/64)*4]` 分配 scale 存储，而 CUDA kernel 按 128×4 swizzle 布局以整 128 行 tile 写 scale 偏移——小 batch（<128）与末尾残 tile 越出分配写：CI 在 `silu_mul_cvt_fp16_to_fp4` 记录 `CUDBG_EXCEPTION_WARP_ILLEGAL_ADDRESS`，#51415 合入后 open alert 17 连败） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: kernel 的 swizzle 写偏移按满 128 行 tile 计算，分配侧只按逻辑 token 数给行——两个对齐域（逻辑 [num_tokens] vs 物理 [128-row tile]）在手工路径上失配；既有 `create_fp4_output_tensors` allocator 会 pad 行到 128 倍数、列到 4 倍数，手工 fusion 没有用它。1/5/32/127/128/129 token 的回归矩阵覆盖悬崖两侧。
  source: 'vLLM PR #55456（2026-09-05，faulting kernel 来自 CUDA dump 而非 Python 同步栈；build 87376 引用）。https://github.com/vllm-project/vllm/pull/55456'
  behavior: kernel 期 illegal address（fail-loud，偶发取决于 heap 布局）——越界写也可能静默损坏相邻缓冲（本例 CI 显形为 fault）。NVFP4 手工融合路径的**分配-布局契约缺口**：与 7.56（scale 丢失）同 NVFP4 工程化不成熟域，本条在内存布局层。
