id: INF-1865
legacy_ids: []
slug: ops_transformer_bsa_select_block_mask_infershape_block_grid
aliases: []
title: BSASelectBlockMask 输出 shape 用原序列长
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: BSASelectBlockMask
  behavior: Host InferShape 把 seqlenQ/seqlenKV 原始值直接写进输出最后两维，未按 blockShape 与 maxQ/maxK 序列长度算 block 网格。
effect:
  objects:
  - 数值结果
  detail: BNSD/TND 输入 [1,2,256,128]/[1,2,192,128]、blockShape=[128,64] 时输出 [1,2,256,192]，文档契约是 [1,2,2,3]；返回 GRAPH_SUCCESS，5 轮稳定。
  visibility: 静默错误
mitigation:
  detect: 用不能被 blockShape 整除的序列长度跑 InferShape 用例，断言最后两维为 ceilDiv 后的 block 数；现有 3 个官方合法用例（整除口径）全部通过。
  fix: 待定（issue closed，未给 MR）：InferShape 改为按 blockShape 与 maxQ/maxK 序列长度算 Xblocks/Yblocks。
