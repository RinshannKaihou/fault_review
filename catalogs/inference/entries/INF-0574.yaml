  meta: '`infra_off`（`--tool-call-parser qwen3_coder`/`qwen3_xml` 下 `tool_choice: "required"` 与具名函数 tool_choice **不被强制**：请求成功、行为如同 `"auto"`，模型可不发 tool call；`strict: true` 无效、`VLLM_ENFORCE_STRICT_TOOL_CALLING` 默认 True 也无效——强制约束被静默降级） · Cov: `var:vllm_legacy_guided_json_silently_dropped_unconstrained_200`（10.40 约束静默失效族） · 触发 `config` · 置信度 `documented`'
  mechanism: '该 parser 路径未实现 tool_choice 强制（required/具名函数应触发 guided decoding 限定 tool-call 输出）；报告者证实与 #50477（gemma4）、#49712（poolside_v1）、#51804（step3p5）同根因——**横切于 parser 的实现缺口**而非模型特定，Qwen3 系 parser 此前未被列入受影响清单。强制开关的存在（env 默认 True）制造"已保护"假象。'
  source: 'vLLM #54808（2026-08-31 open，0.28.0 + RTX PRO 6000、Qwen3.8-27B、含 curl 级复现与 4 个同根 issue 交叉引用）。https://github.com/vllm-project/vllm/issues/54808 · 同根：#50477、#49712、#51804 · 修复 PR #55475（2026-09-05：structural-tag/engine 流式 parser 置 `supports_required_and_named=False`，阻止 JSON schema 强制注入 XML 输出 parser）'
  behavior: 无 crash、HTTP 200——agent 框架依赖 required/具名调用语义拿到"模型自行决定"的行为：该调用时未调用（工具链静默断流）。与 10.40（guided_json 约束丢弃返回 200）同"约束层静默失效"签名，本条在 tool_choice 语义层且影响面是全部使用该 parser 的 agent 部署。
