original:
  mechanism: '#16925（DSV4.1 框架支持）在 vllm_ascend/worker/block_table.py 的 compute_slot_mapping（L157）与 compute_slot_mapping_draft（L208）里加了短路：只要 self.is_circular_group 为真就 slot_mapping.gpu.fill_(PAD_SLOT_ID) 后直接 return。这个谓词与既有的 is_circular 等价，于是 #16537 在 _compute_slot_mapping_kernel 里加的 IS_CIRCULAR 环形位移计算、以及 numpy draft 路径的 if self.is_circular 分支全部变成不可达。问题在于 is_circular_kv_cache_spec 对两种 circular 组都为真，但两者语义不同：DSV4.1 的 CircularBufferSpec compressor state 本来就忽略 block-table 槽位映射、用自己的全 PAD 缓冲（attention/dsa_v41.py:756），填 PAD 正确；GLM-5-Next 的 KPool tail（is_circular=True）则把 slot_mapping 原样传给 glm5_next_kpool_tail_compress_and_write_cache_triton（attention/indexer_kpool.py:313）。主 forward 走 MultiGroupBlockTable 的融合多组 kernel（2+ 非 Mamba 组且无 DCP 时融合），环形槽位仍正确；但 Glm5NextMTPModel 的 AscendMultiKVCacheGroupMTPProposer 对每个非 primary draft 组调用 per-group 的 block_table.compute_slot_mapping（spec_decode/multi_kv_cache_group_proposer.py:211），tail 组因此整表拿到 PAD_SLOT_ID。'
  source: 2026-09-25 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17532 （open）
  behavior: 'GLM-5-Next 开 MTP 时，草稿层 KPool tail 的 KV 全部写进填充槽，tail cache 里没有真实 token 的压缩状态，后续 draft step 读到的是 PAD 区域的旧内容——draft 质量下降、接受率变差，但主模型输出仍然通顺，看不出哪里错。nightly 的 test_glm5next_tail_slot_mapping_triton 从 #16925 起在 main 上 4/4 失败：单组 circular 场景 lengths=[3,0,5] 的 27 个槽位里 8 个从环形槽位变成 PAD_SLOT_ID，而同一测试里融合多组的部分仍逐位对得上——正好印证"融合路径对、per-group 路径错"。'
  trigger_surface: GLM-5-Next + MTP drafter + KPool tail（circular 组但消费 slot mapping）#16925 之后
  discovery: 2026-10-21 历史索引回填（NPU pool2_v2c，issue created < 2026-10-07）
