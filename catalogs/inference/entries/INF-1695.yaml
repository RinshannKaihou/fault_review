title: QFA MXFP8 FD 标量传参丢失致 LSE 为 inf
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: QFA MXFP8 FD combine
  behavior: 第 15 个运行时标量 minCheckValue 在每个 AIV 首次 VF 调用时丢失并被污染为 0.0，Compare EQ(0,0) 误命中，Select 输出 3e+99 使 LSE 为 inf。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: TEST1_WK（B=6 GQA、PA BnNBsD、mask_mode=3、p_scale=8、enable_lse=True）下仅 flat=16020/16083 两点 LSE 为 3e+99（溢出为 inf），期望约 8.58，其余 19842 点与 attention 输出全对。
  visibility: 数值异常
mitigation:
  detect: 对 enable_lse 用例逐点比对 LSE，关注是否出现 3e+99/inf 的孤立坏点；可用 AscendC printf 插桩确认 Select 前判值
  fix: MR 12816（master）/12828（9.2.0）：minCheckValue 改经 UB fdMinCheckBuf_ 由 VF 内 LoadAlign 读取（closed，未核实发布）
