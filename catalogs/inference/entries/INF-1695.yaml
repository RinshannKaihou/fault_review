original:
  mechanism: 'ops-transformer issue #5634（2026-09-23 closed）：QFA MXFP8 算子在 TEST1_WK 用例（B=6 GQA、PA BnNBsD、mask_mode=3、p_scale=8.0、enable_lse=True）下 LSE 输出 inf——仅 flat=16020/16083 两点输出 3e+99（float32 溢出为 inf），期望约 8.58，其余 19842 点全部正确、attention 输出全对，5 次重跑坏点完全固定，是确定性 bug 而非竞态。根因：FD combine 的 ComputeScaleValue_8_VF_FD 是 15 参数的 __simd_vf__ 函数，第 15 个运行时标量参数 minCheckValue 在每个 AIV 首次 VF 调用时丢失（实测被污染为 0.0，应为 -3.0077e37）；当某行 FA 写入 WS 的 max 恰为合法的 ln2 量化边界值 0.0 时，Compare EQ(0.0,0.0) 误命中，Select 输出 3e+99 使 LSE 变 inf。经 4 轮 AscendC printf 插桩确认 preSel=8.577455 与期望一致、tMax/tSum 正确，仅 vfMin（Duplicate 后的判值）被污染为 0.0。修复：minCheckValue 改由 UB 传递并在 VF 内 LoadAlign 读取（MR 12816 / 12828）。'
  source: https://gitcode.com/cann/ops-transformer/issues/5634 （closed）
  behavior: 开启 LSE 返回后，个别位置的 LSE 直接是 inf / 3e+99，量级与其它位置（约 8.58）完全不在一个数量级，但 attention 主输出全对、不报错、不崩，坏点在 5 次重跑中位置完全不变；使用方若用 LSE 做后续 combine 或 logprob 计算，会得到 inf 污染的结果。
  trigger_surface: QFA（Quantized Flash Attention）MXFP8 decode，PA BnNBsD、mask_mode=3、p_scale=8、enable_lse=True
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
