  section: 第 7 类 · 量化（PTQ / 低位 / FP8 / 微缩度）
  meta: '`infra_off`（DeepSeek-V4-Flash-0731 混合量化检查点（fp8 attention/dense + I8 权重 × F8_E8M0 scale 的 mxfp4-packed routed experts）在 tag 版本 v0.5.17/v0.5.18 上经 `flashinfer_mxfp4` MoE runner 加载即 `AssertionError: Hidden size mismatch`——同 checkpoint 同 flag 同硬件在 main（2026-08-30）正常：**修复已存在于 main 但发布链未携带**） · Cov: `var:sglang_dsv4_ue8m0_default_moe_backend_distribution_distortion`（7.57 DSV4 混合量化 MoE 后端族） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: routed experts 在 safetensors 中为 I8 + UE8M0 scale（mxfp4 打包形态）而 config.json 只声明 fp8 块量化——tag 版本的 `flashinfer_mxfp4` 路径对该布局的 hidden-size 断言失败；main 上已修（快照 a1fe4e30 验证，pip overlay 与 nightly 镜像双重确认）。报告者当日在 issue 内**自行撤回**了最初两个错误主张（"fp8 experts 误检为 fp4"与"fp8 loader shape mismatch"——后者是其 env override 自伤），保留的这一项成立。用户侧的现象是"tag 版本坏、nightly 好"。
  source: 'SGLang #37342（2026-09-01 open，含更正声明、checkpoint dtype 布局表、v0.5.17/0.5.18/main 三方对照）。https://github.com/sgl-project/sglang/issues/37342'
  behavior: 启动期 assert（fail-loud）——发布版不可用；与 6.156（uv resolver 静默回退旧版复活已修 bug）同"**修复存在但用户拿到的是坏版本**"模式：本条是发布链滞后（非 resolver），提醒编目"版本载体"维度：同一缺陷在不同版本标签上呈现不同状态。
  trigger_surface: SGLang v0.5.17/v0.5.18 tag + DeepSeek-V4-Flash-0731 混合量化 + flashinfer_mxfp4（版本 + checkpoint 组合；main 已修）
