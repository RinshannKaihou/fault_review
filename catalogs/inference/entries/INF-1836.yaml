title: 开 PCP 不开 EP 时 DeepSeek-V3.2 精度从 94 掉到 73
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: PCP 与 MoE 专家并行组合
  behavior: DeepSeek-V3.2 在 PCP 开启且未加 --enable-expert-parallel 时精度明显下降，同一配置加上该开关后精度恢复；报告未给源码级定位，机制细节待定。
effect:
  objects:
  - 输出内容
  - 隐状态
  detail: 不出现乱码，只是推理质量下降：同一精度数据集开 EP 得 94 分、不开得 73 分；GSM8K 式算术题会算错（28 答成 24）。
  visibility: 质量退化
mitigation:
  detect: 在 PCP 配置下同时跑开/关 EP 的精度基线；盯分数差异而非是否报错。
  fix: 待定（issue 2026-04-22 open）：规避为 PCP 与 --enable-expert-parallel 同时开启。
