original:
  mechanism: 报告者在 DeepSeek-V3.2 上做 A/B：PCP（prefill context parallel）开启、专家并行关闭时精度明显下降；同一配置加上 --enable-expert-parallel 后精度恢复。量化证据是同一个精度数据集的得分 94（开 EP）对 73（不开 EP），并且给出一条具体样本：Jan 的宠物数是 Marcia 的三倍、Marcia 比 Cindy 多两只、Cindy 有四只，正确答案 28，不开 EP 时模型推理过程算成 4 + 6 + 18 = 24。特征是不出现乱码字符，只有精度下滑，因此不会在日志或输出格式上暴露。issue 2026-04-22 提交、仍 open，正文没有给出源码级定位，本条目按报告的证据记录触发组合与量级，机制细节待定。
  source: 2026-04-22 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/8579 （open）
  behavior: 开 PCP 但没开专家并行的 DeepSeek-V3.2 服务输出看起来完全正常，没有乱码也没有报错，但跑精度集分数从 94 掉到 73，多步算术题开始算错（把 28 算成 24），长链推理中途结论偏移。
  trigger_surface: PCP（prefill context parallel）开启且 --enable-expert-parallel 关闭
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
