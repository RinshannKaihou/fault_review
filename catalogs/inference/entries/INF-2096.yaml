title: 聊天响应带空 tool_calls 数组致 SDK 误判工具轮
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: vllm
    component: chat completion 序列化
  behavior: '响应序列化把没有工具调用的消息写成 tool_calls: []（而非 null），流式 delta 也带空数组；客户端按 message.tool_calls is not None 判定这是工具调用轮。'
effect:
  objects:
  - 输出内容
  detail: 'DeepSeek V4 工具调用第二轮（工具结果回传后）正文正常、finish_reason=stop，但 tool_calls 为空数组；OpenAI SDK 客户端据此继续工具循环并 IndexError。上游 vLLM 已由 #44105 修复。'
  visibility: 静默错误
mitigation:
  detect: 检查 chat completion 的 message.tool_calls 是 null 还是 []，流式响应检查 delta.tool_calls 是否被省略
  fix: vllm-ascend 侧建议 monkey patch 去掉空 tool_calls 数组；上游修复 https://github.com/vllm-project/vllm/pull/44105（issue closed，未核实 vllm-ascend 是否已消费该修复）
