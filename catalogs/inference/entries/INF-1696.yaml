original:
  mechanism: 'Ascend/pytorch #2651（2026-07-08，closed，.github/scripts/run_npu_test_shard.py）：NPU 测试分片执行中，某个用例触发 aclnn 算子致命错误（如 aclnnRepeat 0 维、CANN OOM、AiCore 异常）后，NPU 设备上下文被毒化：NPU 任务队列（NPUQueue.cpp）进入 CAN_EXIT 状态，此后所有算子调用变成静默 no-op，输出张量是未初始化的设备内存。NPUQueue 的 Enqueue()（NPUQueue.cpp:573-596）在致命错误后直接返回不执行，MakeSureQueueEmpty 同步（NPUQueue.cpp:313-315）在 CAN_EXIT 状态下不抛异常（runtime_error 为空），worker 进程不会退出，继续「执行」后续用例但全部产出垃圾数据；现有 runner 不检测该毒化状态，worker 一路跑到分片结束，产生大量假结果。修复：worker 增加两层毒化检测——Layer 1 签名匹配（检查 failed/error 用例 message/stdout/stderr 是否含 ERROR_EXIT 的 "The process exits for this inner error"、deviceErrorMap 硬件错误标签如 UCE ERROR / HBM MULTI BIT ECC ERROR / HCCS LINK ERROR / HCCL OP RETRY FAILED / SUSPECT REMOTE ERROR、CANN 错误码 EZ9999/EE9999/EZ1009，零开销）；Layer 2 探针计算（约 1ms，对 failed/error 用例运行 torch.ones(4,device=''npu'').sum().item()，结果不等于 4.0 或抛异常即判定毒化）。命中后在用例间隙 os._exit(70) 干净退出，父进程识别退出码 70 后重启新 worker 处理所有未上报用例。已在 A3 双 die 环境验证。本条目只记观测/评测面的判定污染，不推断模型计算本身出错。'
  source: 2026-07-08 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/2651 （closed）
  behavior: 跑 NPU 测试分片时，只要有一个用例触发了 aclnn 算子致命错误 / CANN OOM / AiCore 异常，同一个 worker 进程里排在它后面的所有用例都不再真正执行：不报错，但拿到的输出是未初始化的垃圾内存，于是被误判成通过，或得到一个毫无意义的失败信息。测试报告看起来跑完了整片，实际后半段全是假结果。加上毒化检测后，worker 会在用例间隙以退出码 70 退出，由父进程重启新 worker 续跑剩下的用例。
  trigger_surface: NPU 测试分片以 worker 复跑多用例；同 worker 内先发生算子致命错误/CANN OOM/AiCore 异常
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
