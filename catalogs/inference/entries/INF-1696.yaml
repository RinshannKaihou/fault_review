id: INF-1696
legacy_ids: []
slug: npu_queue_can_exit_silent_noop_false_pass
aliases: []
title: NPU 队列 CAN_EXIT 后算子静默 no-op 致测试假通过
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: NPUQueue 状态机
  behavior: 致命错误后 NPUQueue 进入 CAN_EXIT，Enqueue() 直接返回不执行，MakeSureQueueEmpty 在该状态下不抛异常，worker 继续跑后续用例并产出未初始化设备内存。
effect:
  objects:
  - 测试判定
  - 数值结果
  detail: 同 worker 中毒用例之后的所有用例静默失败——不报错但结果是垃圾，被误判通过或得到无意义失败，测试报告被污染；修复后按退出码 70 重启 worker 续跑。
  visibility: 静默错误
mitigation:
  detect: 用例间隙做探针计算 torch.ones(4,device='npu').sum().item() != 4.0，或匹配 ERROR_EXIT/deviceErrorMap/CANN 错误码签名；命中即判定设备上下文已毒化
  fix: 修复分支 kerer-sk/pytorch:fix/npu_poison_detect_restart（未核实合入）：worker 双层毒化检测 + 用例间隙 os._exit(70) 干净退出，父进程重启新 worker 处理未上报用例
