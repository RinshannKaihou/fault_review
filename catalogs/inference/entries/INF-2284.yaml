  mechanism: 'cann/ops-math 的 aclnnRange 两个独立校验/实现缺陷（issue #4258、#4257）：1) out 为 INT32/INT64 且 step 带小数（如 0.5）时，实现把 step 截断成整数（等效 step=1），输出退化为整数递增，与同调用的浮点 out 输出不一致——浮点路径正常说明截断只发生在整型 out 分支；2) out 声明为 2/3 维时两段返回 0 但输出全 0；资料要求 out 一维（应报 161002），实现只拒绝 0 维，多维声明漏检并以全 0 输出「成功」。两 issue 均含对照实测。'
