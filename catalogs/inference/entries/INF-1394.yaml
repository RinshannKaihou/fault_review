title: vllm-ascend Mamba KVPool 恢复前缀后输出乱码
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Mamba 状态恢复时序
  behavior: 非layerwise同步路径中preprocess_state()先复制源状态到运行状态，start_load_kv()后才恢复远端状态到源块，FULL graph回放可能消费旧源块内容。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 同一 20K token 长请求第二次发送（L2 命中 20,736 token）返回 200 但正文为空、reasoning 重复标点与异常片段，finish_reason=length；冷请求正常
  visibility: 静默错误
mitigation:
  detect: 对比冷/热请求输出与 P 侧 'need to load' 日志；关闭 HBM prefix cache 观察是否绕过；未评估
  fix: 待定（issue open，根因时序已定位到调用顺序，尚无修复 PR 链接）
