  - 数值结果
  detail: 尾维非对齐且值域±100时，round-3 1000条执行成功但290条accuracy False：整型torch.equal失败87条、NPU输出含nan/inf 78条、无error_info的二进制不一致47条、浮点误差超阈78条；720条同输入两轮185条翻转、127条两轮都失败。
  visibility: 静默错误
