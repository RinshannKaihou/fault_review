original:
  mechanism: cann/ops-nn issue 6064（2026-09-20，closed）：环境 Ascend 910B3、CANN 9.1.0、torch 2.10.0、ATK 26.7.8、hw_8x910b3，用 pyaclnn 调用镜像内系统算子 aclnnAddRelu，对照 GPU 参考端（torch 计算后转回输入 dtype）跑满 1000 条。round-3 全部 1000 条执行成功、0 执行失败，其中 290 条 accuracy False：整型 torch.equal 失败 87 条、NPU 输出含 nan/inf 78 条、无 error_info 的二进制不一致 47 条、浮点误差超阈 78 条。最强证据 case 29：bf16[31,17] 的 self/other 值域 ±100、alpha=3，数学上界 relu(self+3·other) ⊆ [0,400]，实测 max_abs_diff 5.11e13（max_abs_idx=130）、error_balance 1.64e12，报告据此判断算子读到了输入缓冲区之外的内存。同一份 720 条相同输入两轮判定中 185 条（25.7%）翻转，127 条两轮都失败。报告初步根因为“输出未完全写回或地址偏移截断”，未定位到具体代码行；round-1 的 265 条执行失败已定性为用例 alpha dtype 设计问题，不计入统计。
  source: 2026-09-20 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6064 （closed）
  behavior: 在 910B3 上用 aclnnAddRelu 做逐元素 add+relu：对齐 shape 正常，但尾维取 17、13、31、65 这类非对齐长度、值域覆盖 ±100 时，输出出现远超输入范围的数值——bf16 用例实测 5.11e13，而正确结果不可能超过 400；部分用例直接出 NaN/Inf，整型输出逐位不等。全程算子不报错、接口返回成功，同一份输入连跑两轮约四分之一用例判定翻转。
  trigger_surface: Ascend 910B3 + CANN 9.1.0 镜像内系统算子 aclnnAddRelu + 尾维非对齐（13/17/31/65/69/127/129/257）+ 值域 ±100
