original:
  mechanism: transformers 中 Qwen4-Exp 用 attn_implementation="eager" 时，batch 内含左 padding 样本会在有效 token 位置产生 NaN logits；同 batch 未 padding 样本保持有限；同权重同输入 SDPA 有限，不指定后端时默认选 SDPA 也有限。左 padding 是官方文档记载的批量生成选择。报告用随机初始化小模型（Qwen4ExpForCausalLM，五层：3 层 GatedDeltaNet+1 层 indexed-attention+1 层 GatedDeltaNet）、QSA 预算 32/8-token 输入（不依赖稀疏剪枝或小预算）、CPU FP32、eval 模式复现；transformers 5.19.0 执行复现，当前 main 6b6792ff 相关 mask 加法仍在。范围限定 eager QSA 路径，非所有 Qwen4-Exp 后端。
  source: 2026-10-23 每日扫描 https://github.com/huggingface/transformers/issues/49888（open，随机小模型 CPU 复现）
  behavior: Qwen4-Exp 指定 eager attention 且 batch 内存在左 padding 样本时，该样本的有效 token 位置 logits 变 NaN，后续生成/损失全部污染；同批未 padding 样本正常。默认后端（SDPA）无此问题，用户显式选 eager 才触发。
  trigger_surface: transformers 5.19.0（main 6b6792ff 仍在）；Qwen4-Exp；attn_implementation="eager"；batch 含左 padding 样本；CPU FP32 已复现（GPU 未测）。
  discovery: 2026-10-23 每日扫描
