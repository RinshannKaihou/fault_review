original:
  mechanism: Transformers 5.24.0.dev0（commit fa9c04ea60c5e1d2ecc38064442973fa1ddccc72）的 GenerationMixin._prepare_decoder_input_ids_for_generation() 在 src/transformers/generation/utils.py 中用 (decoder_input_ids[:, 0] != decoder_start_token_id[:, 0]).all().item() 判断是否需要为整批前置 decoder_start_token。这个 .all() 要求批内每一行都缺 start token 才插入；当一批里同时存在「已含 start token」和「不含 start token」的请求时结果为 False，整个批都不插入，本来缺 start token 的请求就少了一个位置对齐。报告者在预训练 checkpoint 上用等长、无 decoder padding 的前缀复现：facebook/bart-base（start=2）A 前缀 [2,133,138,585]、B 前缀 [133,2634,2967,10]，批内 B 缺 start token 但不报错，8 步最大 score 差 1.296694；Helsinki-NLP/opus-mt-en-de（start=58100）同构造下生成 token 改变、译文错乱，最大 score 差 13.026532、raw logit 差 20.635527。逐条单独生成时两条都正确。
  source: https://github.com/huggingface/transformers/issues/51216（open，2026-11-25，含两模型 score/logit 差表与复现代码）
  behavior: 做 encoder-decoder 模型的批量生成时，如果同一批里有的请求的 decoder 前缀自带 decoder_start_token、有的没带，没带的那几条会静默少加这个起始 token：batch 结果与逐条单独生成明显不同，翻译模型会直接输出错乱的句子，但整个过程不抛异常、日志里也看不出问题。等长、无 padding 的前缀就能触发，因此服务端做动态批处理时很容易遇到；把请求拆成单条跑就完全正常。
  trigger_surface: Transformers 5.24.0.dev0，bart-base / opus-mt-en-de 等 encoder-decoder 模型；batch 内同时存在含与不含 decoder_start_token 的 decoder_input_ids，且等长、无 decoder padding。
  discovery: 2026-11-26 每日扫描
