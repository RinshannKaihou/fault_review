title: 批内混用 decoder start token 静默少加
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: transformers
    component: generation/utils.py 前置判断
  behavior: 用 (decoder_input_ids[:,0] != start_id).all() 决定是否整批前置 start token；批内一条已含就整体跳过，其余请求缺 start token。
effect:
  objects:
  - 输入编码
  - 输出内容
  - 输出分布
  detail: bart-base 8 步最大 score 差 1.297；opus-mt-en-de 生成 token 改变、译文错乱，score 差 13.03、raw logit 差 20.64；不抛异常，逐条单独跑正确。
  visibility: 静默错误
mitigation:
  detect: 构造两条 decoder 前缀，一条含 decoder_start_token、一条不含，等长且无 pad，batch 生成后与逐条单独生成逐 token 比较。
  fix: 待定（issue open，transformers 5.24.0.dev0）
