title: MemCache 首次请求懒初始化失败致 TP 分叉挂死
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: MemCache 懒初始化
  behavior: 首个真实请求才初始化 MemCache，各 TP rank 各自重试、只看 rank 本地 store.init 返回值并 assert；部分 rank 完成、部分带新 AutoRank 重入后，后续集合通信顺序分叉。
effect:
  objects:
  - 可用性/进度
  detail: 两个 Prefill 服务 8 个 TP 进程同时初始化：一个 TP4 组 assert 后 EngineCore 退出，另一组四 rank 完成时间相差 14.4s，随后 EI0002/507034、EngineDeadError，所有 Prefill API 退出。
  visibility: 挂起
mitigation:
  detect: 记录每个 TP rank 的 store.init 返回码、AutoRank ID 与完成时间；确认首个真实请求前所有 rank 已完成初始化并处于同一集合通信序号
  fix: issue 建议：初始化在标记 ready 前完成、把 assert 换成带 rc/rank 上下文的 MemcacheInitializationError、同 DP 内 TP rank 统一成功/失败/回滚重试并限界（closed，未见合并记录）
