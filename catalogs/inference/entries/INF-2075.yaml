remarks: 与 INF-2039（MemCache 单 rank put 失败致 TP 失步）同属「单 rank 结果无 TP 级契约」但代码路径不同：本条在懒初始化与 assert，未挂变体。
evidence:
- url: https://github.com/vllm-project/vllm-ascend/issues/14121
  kind: github_issue
relations: []
original:
  mechanism: 非 layerwise MemCache 在 DSV4 compress 路径上到第一个真实请求才懒初始化（pool_worker.py 传 lazy_init，memcache_backend.py 里 res = store.init(...) 后直接 assert res == 0）。各 TP rank 独立完成/失败/重试，没有 TP 级成功或失败共识：两个 Prefill 服务 8 个 TP 进程在同一秒开始初始化，一个 TP4 组的 TP0/TP1/TP2 报 BM join failed after remote result -2，store.init 返回非 0 后 assert 失败、EngineCore 退出；另一个 TP4 组 TP0 完成、TP1/TP2/TP3 失败后带新 AutoRank ID 重入，group size 与 BMEX key 集合变化并出现 SM_INNER_BUSY(-2013)，四个 rank 完成时间相差 14.4 秒，先进模型的 rank 已到 AllGather，落后的还在 ReduceScatter。原始 -2 来自旧 MemFabric 成员在 leave/uninitialize 后处理 JoinHandle，本 issue 聚焦 vllm-ascend 的放大路径。
  source: 2026-08-12 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/14121 （closed）
  behavior: 服务启动和 /health 正常，第一个真实请求打进来后部分 Prefill 进程直接 AssertionError 退出、请求 500；另一套部署里四个 TP rank 陆续初始化成功但相差十几秒，随后整个 TP 组三分钟无进展，报 EI0002/507034 与 EngineDeadError，所有 Prefill API 退出，Decode 侧仍在。
  trigger_surface: AscendStore + MemCache 懒初始化，首个真实请求时单 rank init 失败或 BM join 慢
  discovery: 2026-10-21 第三轮顺序扫描（tail_2，issue created < 2026-10-07）
