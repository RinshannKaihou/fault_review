original:
  category: cat6
  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（SGLang 的 LMCache 集成在 LOOKUP/STORE 两条路径都不转发 `cache_salt`——`lmc_radix_cache.py` 调 `lookup_kv(token_ids, req.rid)` 时 salt 在作用域内却不传入、`StoreMetadata` 结构体无 salt 字段——**外部存储键是 token-only**，不同租户（不同 salt）同 prompt 得到相同键并共享缓存前缀） · Cov: `var:lmcache_cache_salt_isolation_missing` · 触发 `config` · 置信度 `verified`'
  mechanism: SGLang 自身 radix tree 尊重 per-request salt（文档化契约明言外部 L3 键在契约之外），但 SGLang 文档又推荐多租户用 `cache_salt` 做隔离——推荐与契约冲突处即缺陷。LMCache wire key `IPCCacheServerKey` 本有 `cache_salt` 字段且 vLLM 集成会填充，仅 SGLang 路径丢弃（LMCache 侧 issue：LMCache/LMCache#4825）。端到端实测：第二账户同前缀请求 1,198 ms vs 3,340 ms 重算基线——跨租户计时/计算侧信道。
  source: 'SGLang #37160（2026-08-29 open，SGLang 0.5.18 + LMCache 0.5.4，含代码行定位与计时证据）。https://github.com/sgl-project/sglang/issues/37160'
  behavior: 无 crash——**跨租户 KV 共享**：机密性（他人 prompt 的 KV 被自己命中）+ 计时侧信道双重暴露；`lookup` 命中本身无任何异常信号。属 K9.10 `lmcache_cache_salt_isolation_missing` 家族第三实例：6.148（ExampleConnector 从 prompt bytes 重派生键）之后，本条是**结构体缺字段 + 转发遗漏**变体——salt 在作用域内现成存在、仅未跨 handoff 边界传递。
  trigger_surface: SGLang + LMCache（`--enable-lmcache`）+ 多租户 cache_salt（外部存储启用即触发）
  discovery: 2026-08-30 每日扫描。
