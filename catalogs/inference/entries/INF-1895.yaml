original:
  mechanism: vLLM-Ascend commit 50e0ce60849a7b6fe6f94e1de085b6fc06e7006d（vLLM 752a3a5、CANN 9.0.1、A3 TP8）的 DeepSeek V4 路径，PA_ND compressed-KV 快速路径在 csrc/attention/sparse_attn_sharedkv/op_kernel/arch32/sparse_attn_sharedkv_scfa_block_vector.h 的 SASVectorBlock::CopyInKv 中，对一对压缩 KV 块用 blkTableSrcStride = Abs(keyOffset1 - keyOffset2) - sparseBlockSize * headDim 推导步长，并用 MinValid(keyOffset1, keyOffset2) 作为起始地址发起一次 strided DMA。因此拷贝按较低物理地址先行，而不是按 cmp_sparse_indices 给出的逻辑顺序；物理 block 分配是运行时状态，却改变了 merged K/V 行序。诊断内核对 rank-4 query row 629 仅改物理 block table 即翻转 61/79 个 pair slot（122 个行位置），K/V 行多重集不变，DMA 缓冲与 CPU 重建逐位一致。影响自 v0.20.2rc1 起（#9228 引入、#9339 在 910B 启用、#9270 接入 DeepSeek V4）。
  source: 2026-08-11 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/14013 （open）
  behavior: 相同 prompt 与采样参数下，DeepSeek V4 长上下文输出随 KV 分页分配/复用状态变化：logits 与选中 token 不稳定，重跑或换并发后结果不同；无异常值、无报错，A2/A3 均可观察到。
  trigger_surface: DeepSeek V4 + PA_ND 压缩 KV（A3 arch32 算子路径，block 分配/复用变化）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
