id: INF-1895
legacy_ids: []
slug: vllm_ascend_pa_nd_kv_block_order_dependence
aliases: []
title: PA_ND 稀疏注意力输出随物理 KV 块分配变化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: PA_ND sparse_attn_kv
  behavior: CopyInKv 用两个物理 GM 偏移的绝对差推导 srcStride，并从较低物理地址开始一次 DMA，未保持 cmp_sparse_indices 的逻辑顺序，merged K/V 行序随分页分配翻转。
effect:
  objects:
  - 输出分布
  detail: 仅物理 paged-KV 块分配变化（逻辑 query/KV/稀疏索引/metadata 不变）即翻转 merged K/V 行序、改变归约顺序，使 DeepSeek V4 logits 与选中 token 随分配器状态变化。
  visibility: 不可复现
mitigation:
  detect: 固定逻辑输入与稀疏索引，仅改物理 block table，逐位比较 sparse_attn_sharedkv 输出与 CPU 重建
  fix: PA_ND 对两个块分别按逻辑顺序拷贝（issue 提议，open）
