title: SSM 状态池按 K-major 索引读写转置
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: sglang
    component: fused_sigmoid_gating
  behavior: 状态池实际是 [slots,HV,V,K]（V-major），kernel 载入与写回都用 o_k[:,None]*V + o_v[None,:]（K-major）；K==V==128 时不越界不报错，读写的都是 S.T。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: 零初态时 output 正确，state 差 1.02，state^T 差 1.19e-07；随机初态后 output 相对误差 0.85，state^T 不再匹配。全程无报错、无 NaN。
  visibility: 静默错误
mitigation:
  detect: 对照时同时比较 state 与 state^T；用零初态隔离 store、随机初态再放开 load 的两次实验可区分读写腿
  fix: issue 给出交换两项的补丁（o_v[None,:]*K + o_k[:,None]，load 与 store 各一处），未见修复 PR（open）
