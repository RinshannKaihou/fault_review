original:
  mechanism: sgl-kernel-npu 的 fused_sigmoid_gating_delta_rule_update_npu（线性注意力/SSM 的 recurrent 更新核，python/sgl_kernel_npu/sgl_kernel_npu/fla/fused_sigmoid_gating_recurrent.py 第 105-112 行 load、第 156-163 行 store）把 SSM 状态池当 K-major 寻址，而池子按 V-major 存成 [slots,HV,V,K]：偏移写成 idx*HV*K*V + i_hv*K*V + o_k[:,None]*V + o_v[None,:]，正确形式是 o_v[None,:]*K + o_k[:,None]。Kimi-linear 恰好 K==V==128，乘积相同，既不越界也不崩，只是把状态转置着读写。报告者先令 S0=0 隔离 store（output 正确、state 差 1.02 而 state^T 差 1.19e-07），再取随机 S0 让 load 参与（output 相对误差 0.85，state^T 也不再匹配），并给出含 -1 padding lane 的 graph-capture decode 复现脚本与补丁。
  source: 2026-07-30 GitHub sgl-project/sgl-kernel-npu issue https://github.com/sgl-project/sgl-kernel-npu/issues/640 （open）
  behavior: GDN/线性注意力模型在 NPU 上 decode 时输出逐渐偏离：单步看只是数值不准（相对误差可达 0.85），但 KV 以外的循环状态池里存的内容其实是正确状态的转置，跨 step 累积后长序列输出漂移、复读或答非所问，日志里没有任何报错或 NaN。换成 GPU 参考实现或把 state 转置回来对比即可确认。
  trigger_surface: sgl_kernel_npu.fla.fused_sigmoid_gating_delta_rule_update_npu；K==V（如 Kimi-linear 128）时静默、K!=V 时越界
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
