cause:
  objects:
  - subsystem: 编译器
    stack: cann
    component: InplaceSub 旧融合规则（GE 图模式）
  behavior: GE 图模式把 InplaceSub 转 TensorMove+ScatterSub，旧路径跳过超范围索引，丢原生取模更新语义；跨架构编译目标还可能误跳过 A2/A3 转换。
