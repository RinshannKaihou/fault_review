original:
  mechanism: 'Ascend/torchair #800：npugraph_ex 后端的静态 kernel 编译（options={"static_kernel_compile": True, "disable_static_kernel_compile_cache": True}，fullgraph=True、dynamic=False）为了拿到算子 JSON，会把 FX 图先按单算子执行一遍；这一步没有对原地算子做输入隔离，也没有在跑完后恢复输入。模型 forward 里含 x.add_(1) 时，这遍「取 JSON」的执行直接改写了调用方传入的真实张量，随后正式执行又在这个已被改过的输入上算，输出与期望不符；调用方事后读自己的输入也是被改过的值。报告的最小复现用 arange(4) 作输入，断言 assert_close(actual_input, original+1) 暴露输入被写穿、actual 与 expected 不符；issue closed，未给出修复说明。'
  source: 2026-09-19 GitCode Ascend/torchair issue https://gitcode.com/Ascend/torchair/issues/800 （closed）
  behavior: 编译期就悄悄改掉了你自己的输入张量：跑完 compiled(x) 之后 x 已经不是原来的值（被 +1 过），所以输出也对不上，模型里只要有一个原地算子（add_、copy_、原地归一化之类）就会中招。全程不报错，关掉静态 kernel 编译就正常；排查时很难想到是「取算子 JSON 那一步多跑了一遍图」。
  trigger_surface: torchair npugraph_ex + static_kernel_compile=True；forward 内含原地修改输入的算子
