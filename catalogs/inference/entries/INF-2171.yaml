original:
  mechanism: 'ops-transformer #6636：aclnnPoolKeyIndexer 在 poolTailK>0 时 sparseIndicesOut 出现超出 KV token 上界的索引。对照实测：poolTailK=0 时 idx[0..18] 尾部为 -1 -1 -1（合法无效标记）；poolTailK=2 时同一位置变成 32 33（合法域 npool*poolSize=32，即 0..31），越界数 4（两行各 2 个）。输入数据相同（固定 LCG 种子），rc=0。该算子为稀疏 KV 池索引器（pool 选取/topk 加权），越界索引若被下游 gather 直接寻址 KV cache block，将读不存在的块。环境 Atlas A2 910B2、CANN 9.2.0，aclnn 两段式 C 接口直调（不经框架适配层），单文件 57 行复现含对照组与缺陷组。'
  source: 2026-10-25 每日扫描；issue https://gitcode.com/cann/ops-transformer/issues/6636
  behavior: 使用者视角：带 poolTailK 尾部参数调用稀疏 KV 池索引算子，接口正常返回，但输出的 sparseIndicesOut 里混进超出池大小上界的索引（如合法 0..31 时出现 32/33），而正确行为应是 -1 无效标记。下游注意力按这些索引取 KV 时读越界块，输出可能静默错值或触发设备异常；把 poolTailK 设回 0 即恢复正常，可作为规避。
  trigger_surface: Atlas A2 910B2 + CANN 9.2.0；aclnnPoolKeyIndexer poolTailK>0 的稀疏池配置。
  signature: sparseIndicesOut 出现 [npool*poolSize, npool*poolSize+poolTailK) 区间的索引；poolTailK=0 对照全 -1。
  discovery: 2026-10-25 每日扫描
