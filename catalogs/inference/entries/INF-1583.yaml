  family: infra_off
  trigger: partial
  trigger_review: false
  trigger_note: HCCL_ALGO_TYPE_NHR + cross-server 拓扑下的 broadcast/allgather；自初始 commit 8cfd9951 起存在；纯静态分析定位，未在 NPU 上执行
  stage: N/A
