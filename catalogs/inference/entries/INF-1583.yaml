relations: []
original:
  mechanism: cann/hccl 的 src/ops/broadcast/template/aicpu/ins_temp_broadcast_nhr.cc 中，BatchSR() 同时做 TX 侧 Send 与 RX 侧 Recv，TX 侧本应构建两组 DataSlice：txSrcSlices 指向本地 buffer（读）、txDstSlices 指向远端 buffer（写）。第 419 行构造 SlicesList 时写成 SlicesList txSlicesList(txSrcSlices, txSrcSlices)，第二个参数取了源片而不是 txDstSlices，于是底层 SendRecvWrite/SendRecvRead 把数据写回本地地址，remoteSendBuffAddr 指向的远端 buffer 从未被写。issue 用同函数相邻构造对照（:296 RunAllGather、:350 BatchSend、:382 BatchRecv、:431 BatchSR 的 RX 侧均传 dst 侧 slice）证明这是单点复制粘贴错误，并追溯到 8cfd9951（2026-02-12）首次提交即存在。修复为第 419 行传 txDstSlices。
  source: 2026-07-21 GitCode cann/hccl issue https://gitcode.com/cann/hccl/issues/315 （closed）
  behavior: 多服务器环境下用 NHR 算法做 broadcast（或 allgather）时，部分非 root 的 rank 拿到的数据不是 root 广播的内容，而是本地 buffer 的旧值/未初始化值；接口返回成功、没有任何错误日志，只有在跨服务器拓扑上逐 rank 对比结果才会发现，单服务器或单机多卡测试完全正常。
  trigger_surface: HCCL_ALGO_TYPE_NHR + HCCL_CMD_BROADCAST/HCCL_CMD_ALLGATHER + 跨服务器（server boundary crossing）拓扑
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
