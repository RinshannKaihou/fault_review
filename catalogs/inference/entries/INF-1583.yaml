id: INF-1583
legacy_ids: []
slug: hccl_nhr_broadcast_batchsr_tx_dst_slices_self
aliases: []
title: NHR broadcast 跨服务器 TX 目标片误指本地
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: 通用
    component: Broadcast NHR BatchSR 模板
  behavior: BatchSR 构造 TX 侧 SlicesList 时把 txSrcSlices 同时当作 src 与 dst、丢弃 txDstSlices，SendRecvWrite 把数据写回本地 buffer，远端目标 buffer 从未被写。
effect:
  objects:
  - 数值结果
  detail: 跨服务器拓扑下用 NHR 算法执行 broadcast 或 allgather 时，部分非 root rank 拿到本地 buffer 旧值/未初始化值，而非 root 广播内容；接口返回成功、无错误日志，单机/单服务器测试正常，逐 rank 对比才发现。
  visibility: 静默错误
mitigation:
  detect: 多服务器 NHR 拓扑下 broadcast 后逐 rank 与 root 源 buffer 比对；单服务器用例覆盖不到
  fix: issue 给出单行修复：ins_temp_broadcast_nhr.cc:419 改为 SlicesList txSlicesList(txSrcSlices, txDstSlices)；issue 已 closed，合入版本与发布状态未核实
