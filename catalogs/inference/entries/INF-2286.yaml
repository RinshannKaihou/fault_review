original:
  mechanism: 'cann/ops-math 的 aclnnSinc（issue #4221）与 aclnnXLogYTensor/ScalarOther（issue #4209）dtype 互推导校验缺失：未校验 self 与 out 的数据类型互推导关系，fp64→fp16 等 5 类（Sinc）/6 类（XLogY）表内非法组合不返回 161002，而是返回 0/0 并静默丢弃复数输入的虚部。两个 issue 均给出组合清单与实测（两段 rc=0）。丢虚部意味着复数信号经这些算子后只剩实部垃圾值。同仓另有一批 dtype 支持面声明不一致类（#4240/#4242/#4239/#4212/#4217，header/资料/实测三方不一致），属校验契约/文档族未并入本条。'
  source: GitCode issues https://gitcode.com/cann/ops-math/issues/4221 、https://gitcode.com/cann/ops-math/issues/4209 （均 open，2026-10-29）
  behavior: 调用 sinc 或 xlogy 系列算子时，如果输入输出 dtype 组合不合法（比如 fp64 输入配 fp16 输出、或复数输入配实数输出），接口不报错，直接输出 0/0；复数输入的虚部被悄悄丢掉。结果里出现成片的 0 值而非报错，复数信号处理链路静默损坏。
  trigger_surface: cann/ops-math sinc / xlogy 系列；非法 dtype 组合（降精度/复数→实数等 5-6 类）；混合精度或复数数据路径。
  signature: 非法 dtype 组合输出恒 0 且 rc=0。
