original:
  mechanism: 'vllm issue #64855（2026-10-31，AMD MI355X gfx950，vLLM 0.32.1 dev，main@602811546b035a5ff35256a0a008b61071b13904）：native (B, next_n) indexer padded decode 路径在 ragged 批（某请求 0<decode_len<max_decode_len）时 builder 置 requires_padding=True，indexer 用 pack_seq_triton 打包 q，但两输入不匹配：(1) weights 保持 token 序传 weights[:B*max_decode_len]，logits kernel 为打包 q 行 (b,j) 读权重行 b*next_n+j——首个短请求之后的每个 token 拿到别的 token 的权重，尾行来自 prefill token 或 padding；(2) 因果界按 batch 最大值：行 j 得 L_b - max_decode_len + 1 + j，而正确为 L_b - d_b + 1 + j（d_b 为该请求自身 decode 长度），短请求 token 丢失最后 max_decode_len - d_b 个 key 包括自身位置。后果：indexer logits 错误 → top-k KV 行选错 → sparse attention 关注错行，无错误信号只有输出质量下降。缺陷在 host 侧 metadata/输入切片（与 ROCm 版本无关）。'
  source: GitHub issue https://github.com/vllm-project/vllm/issues/64855 （open，2026-10-31 创建；含两条根因与代码锚点）
  behavior: 推测解码（MTP 类）批内请求 draft 长度不齐（有请求比最长者短）时，sparse attention 的 indexer 给每个 draft token 配错的检索权重与因果边界：短请求之后的 token 读到别的 token 的权重、且丢失靠近自身的 key——选出的 top-k KV 行系统性错误，注意力聚焦错位置，输出质量静默下降。无任何报错；同批请求长度一致（非 ragged）则不触发。
  trigger_surface: vllm native (B, next_n) indexer 路径；spec-decode 批内 decode_len 不齐（ragged）；requires_padding=True；MI355X 复现但机制在 host 侧通用于各后端。
  signature: ragged 批 indexer top-k 行集与逐请求独立运行不一致；打包 q 与 token 序 weights 行号错位。
  discovery: 2026-10-31 每日扫描
