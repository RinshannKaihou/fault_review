    stack: vllm
    component: indexer padded decode 打包
  behavior: ragged decode 批下 q 被打包但两输入不配套：weights 仍按 token 序传（短请求后每 token 读错权重行）；因果界用 batch 最大值而非请求自身 decode 长度。
effect:
  objects:
  - 数值结果
  - 输出分布
  - KV状态
  detail: indexer logits 错误 → 选错 top-k KV 行做 sparse attention，无任何报错、输出质量下降；缺陷在 host 侧 metadata/输入切片，与 ROCm 版本无关（MI355X 复现，代码锚点 main@602811546）。
  visibility: 质量退化
mitigation:
  detect: 构造含短请求（0<decode_len<max）的 ragged spec-decode 批，对照各请求独立运行的 indexer top-k 行集合。
  fix: 待定（issue open 2026-10-31，未见修复 PR）
