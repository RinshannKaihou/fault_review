id: INF-1738
legacy_ids: []
slug: npu_frexp_ilogb_ldexp_wrong_mantissa
aliases: []
title: frexp 走 ilogb/ldexp 致尾数全错、2^k 边界差一档
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: triton_helpers frexp 实现
  behavior: torch_npu 的 Triton frexp helper 用 libdevice ilogb/ldexp：ilogb 返回 fp32 而 ldexp 的指数参数只接受 int32，且 ilogb 在 2^k 边界误舍入，尾数被算错。
effect:
  objects:
  - 数值结果
  detail: frexp 经 Inductor 真正 lowering（不回退 eager）时，fp32/fp16/bf16 的尾数与指数均与 eager 不一致，2^k 边界失配 42/176/213 例；形状、dtype 正常且无报错，仅在比对 eager 结果或下游做 norm/量化换算时暴露数值整体偏移。
  visibility: 静默错误
mitigation:
  detect: fp32/fp16/bf16 的 aten.frexp 输出与 eager 逐位比对，重点覆盖 2^k 边界、inf/nan/±0 与融合 frexp+add 路径
  fix: 已修复：torch_npu/_inductor/runtime/triton_helpers.py 改为按 IEEE-754 binary32 位域直接取指数与尾数，并把 frexp 从 inductor fallback 列表移除（issue closed，改动随该 PR 提交）
