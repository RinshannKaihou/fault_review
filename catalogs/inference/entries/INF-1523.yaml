title: LayerNorm welford 归约多行互相累加致错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: welford_reduce codegen
  behavior: Welford 累加器（_acc_sum/_acc_sum_sq/_acc_count）未按 tile 做 tl.zeros 初始化，向量化外层轴的多行数据在各自 tile 内相互累加。
effect:
  objects:
  - 数值结果
  detail: LayerNorm 的 Welford 归约把不同行混在一起，输出静默错值，Ascend 950 上尤其明显；归约长度 ≤8192 的持久化归约判定缺失扩大了受影响面。
  visibility: 静默错误
mitigation:
  detect: 多行 LayerNorm（welford_reduce，含 W=512 大行）与 eager 逐元素比对；覆盖 910 与 950 两种卡
  fix: torch_npu/_inductor/codegen/triton.py 补 Welford 累加器 tl.zeros 初始化并按「向量化外层轴/标量外层轴」分别生成归约循环；issue 记录已修复（commit 未在正文给出，合入与发布未核实）
