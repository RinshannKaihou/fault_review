    component: linalg_cross fp64 叉积实现
  behavior: fp64 通路疑似以 FMA 实现叉积（z0=fma(x1,y2,-round(x2*y1))），乘积舍入残差被保留；AICORE op_kernel/cross.h 为 AscendC::Mul+Sub，两乘积位相同时精确相消为 0。
