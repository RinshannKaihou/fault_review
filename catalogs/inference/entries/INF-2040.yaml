title: 前缀缓存加 MTP 触发 mamba 后处理内核编译断言
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: triton-ascend AxisInfo
  behavior: prefix caching 使 mamba_cache_mode 变 align，hybrid 模型加投机解码走 postprocess_mamba_fused_kernel，triton-ascend 转换时 AxisInfo 越界断言
effect:
  objects:
  - 可用性/进度
  detail: hybrid/GDN 模型 + prefix caching（mamba align）+ MTP 投机解码：启动、图捕获、/health 正常；首个真实请求返回 500，出现 SmallVector.h:291 断言、Worker 意外退出、executor 关闭；去掉任一配置可稳定运行。
  visibility: 报错
mitigation:
  detect: 在 hybrid/GDN 模型上同时开 --enable-prefix-caching 与 --speculative-config，发首个真实请求；预热不覆盖该 kernel，必须用真实请求验证
  fix: '待定（issue 只做根因分析；上游 vLLM PR #40172 引入该融合 kernel，vllm-ascend 源码已注明 Ascend 后端不支持）'
