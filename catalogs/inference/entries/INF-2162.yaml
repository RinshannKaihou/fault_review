original:
  mechanism: 'CANN 9.2.0（Atlas A2 910B2，aclnn C 两段式直调）aclnnGatherPaKvCache 同一算子三个同型校验缺失（2026-10-24 三份独立报告 #6675/#6676/#6656）：(1) #6675 blockId >= num_blocks 未校验，kernel 按 blockTables 给的块号直接读 keyCache，越界数据进输出且两段 rc=0 静默返回 0 值；关联 #6576（同机制，已 closed）。(2) #6655 sum(seqLens)=12 > keyRef dim0=8 时 kernel 仍按 12 token 搬运，写到 keyRef 缓冲之外；报告用前后 0x5A 保护带定量测得越界写。(3) #6656 seqOffset[0]=100000 折算 tableOffset=25000 无值域校验，块号从 blockTables 张量之外约 100KB 处读出，输出静默错值。另 #6676 同族（keyCache 首维 0 早退返回成功不写输出、静默 no-op）。修复 PR !14535（blockTables 越界输出置零，closed）与 !14536（scatter_pa_kv_cache 同族越界 slotMapping 跳过，open）已提交，合入状态未核实。'
  source: https://gitcode.com/cann/ops-transformer/issues/6675 + https://gitcode.com/cann/ops-transformer/issues/6655 + https://gitcode.com/cann/ops-transformer/issues/6656 + https://gitcode.com/cann/ops-transformer/issues/6676 + https://gitcode.com/cann/ops-transformer/merge_requests/14535 + https://gitcode.com/cann/ops-transformer/merge_requests/14536
  behavior: 调用 GatherPaKvCache 收集 KV cache 时，如果 blockTables 里的块号超出实际 cache 块数、各序列长度之和超过输出缓冲容量、或 seqOffset 折算的偏移越界，接口都返回成功，实际却把越界内存里的数据当 KV 读进输出（或输出静默错值），甚至往输出缓冲区外面写数据（保护带实测越界写 keyRef 之外）；不崩溃、不报错，注意力输入悄悄被污染。
  trigger_surface: CANN 9.2.0 / Atlas A2 910B2；aclnnGatherPaKvCache（cacheMode=Norm、isSeqLensCumsum=false 路径）；blockTables 越界值 / sum(seqLens)>keyRef dim0 / seqOffset 超界 / keyCache 首维 0。
  discovery: 2026-10-24 每日扫描
  notes:
