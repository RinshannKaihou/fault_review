original:
  mechanism: vLLM 0.27.1 V1（main 87b804f09d 2026-10-22 同码）：MTP draft 模型来自 draft-only 检查点（只含 model.layers.N.* + config.json）且 PP>1 时，drafter 的 embed_tokens 从未初始化：(1) LLMBaseProposer._maybe_share_embeddings 只在 get_pp_group().world_size==1 时共享目标嵌入（PP 下仅打 "loaded separately" 日志，lm_head 仍共享）；(2) draft 检查点无嵌入权重，DeepSeekMTP/DeepseekV32MTP.load_weights 不写 drafter 的 embed_tokens（#46994 只覆盖顶层 tied 情形）；(3) DefaultModelLoader.track_weights_loading 把 quant_method 有 process_weights_after_loading 的模块全部参数计入 loaded_weights（UnquantizedEmbeddingMethod 有该方法），未加载嵌入通过检查——无错误。drafter 以 torch.empty 的随机位嵌入 x_{t+1}。实测（7×CMP 170HX PP7、GLM-5.3 MTP 层 78）：离线 draft top-1 真嵌入 0.779 / 零嵌入 0.200 / 随机 0.194；服务 K=1 acceptance ~0.22（0.13-0.31）与零嵌入消融吻合；把目标嵌入复制进 draft 目录后 0.55-0.85、K=2 tokens/step 2.58、+49-53%（4k）/+41-49%（100k）。输出正确性由验证保障，损失的是静默的投机加速。
  source: https://github.com/vllm-project/vllm/issues/63128（vLLM 0.27.1/main 87b804f09d，7×CMP 170HX PP7 GLM-5.3 实测含消融对照）
  behavior: 以 draft-only 检查点（只有 MTP 层权重）开 MTP 推测解码且 PP>1 时，服务正常启动、生成结果正确，但投机接受率从头部本应的 ~0.78 坍塌到 ~0.22：解码几乎不做投机加速甚至变慢，日志只有一行嵌入将单独加载的提示，无任何错误。向 draft 目录补入目标模型嵌入（数据级修复）后接受率恢复 0.55-0.85、吞吐提升 49-53%。
  trigger_surface: vLLM --speculative-config method=mtp + draft-only 检查点 + --pipeline-parallel-size>1
  discovery: 2026-10-22 每日扫描
