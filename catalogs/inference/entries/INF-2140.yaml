legacy_ids: []
slug: vllm_mtp_draft_uninitialized_embedding_pp
aliases: []
title: MTP draft-only 检查点 PP 下嵌入未初始化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: vllm
    component: MTP drafter 嵌入共享/加载检查
  behavior: _maybe_share_embeddings 仅 world_size==1 共享；draft-only 检查点无 embed_tokens 不被加载；process_weights_after_loading 使未加载参数通过检查
effect:
  objects:
  - 性能/资源
  - 输出分布
  detail: drafter 用 torch.empty 的随机位嵌入 x_{t+1}：输出仍正确（验证拒绝坏 draft），唯一症状是接受率坍塌（实测 0.779→0.22 与零嵌入消融吻合；补嵌入后 0.55-0.85、K=2 +49-53% 吞吐），投机加速静默丢失
  visibility: 性能退化
mitigation:
  detect: 离线 draft top-1 评测（真嵌入 vs 零嵌入 vs 随机嵌入消融）；对照服务 acceptance 指标
  fix: 数据级规避：把目标 model.embed_tokens.weight 复制为 draft 目录 model.layers.N.embed_tokens.weight（_rewrite_spec_layer_name 映射，免代码）；建议修复 fail-loud 或 last-stage 加载（#57171 曾提 glm5next 未合）
