original:
  mechanism: 'cann/ops-nn issue #7867（2026-10-31，Ascend 910B2/CANN 9.2.0，ops-nn master index/unique/op_api）：aclnnUnique/aclnnUnique2 的 CheckDtypeValid 只校验 self/inverseOut（Unique2 另加 countsOut），完全没有校验 valueOut 的 dtype。实测：self=FP32[8]（值 1,2,2,3,3,3,4,5）、valueOut=FP16[8]、inverseOut=INT64[8] 时 aclnnUniqueGetWorkspaceSize/aclnnUnique2GetWorkspaceSize 返回 0，调用方拿不到错误码，valueOut 实际内容是把 self 的位模式按 FP16 解释后的脏数据。资料 index/unique/docs/aclnnUnique.md 与 aclnnUnique2.md 的错误码表都明写「self 或 valueOut 的数据类型不在支持的范围之内 → 161002」且 valueOut 参数行写「数据类型同 self」。对照：aclnnUniqueConsecutive（dim=1000）对同一违约输入正确返回 161002，四接口行为不一致。'
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7867 （open，2026-10-31 创建；含自包含 dtype 探针与对照实验）
  behavior: 用 aclnnUnique/aclnnUnique2 去重并把 valueOut 声明成与 self 不同的 dtype（如 self fp32 而 valueOut fp16）时，接口返回成功、无错误码，读回的去重结果是毫无意义的乱数值（fp32 位被按 fp16 解释）；同族 aclnnUniqueConsecutive 对同样输入会正确报 161002 参数错误，可作对照定位。
  trigger_surface: cann/ops-nn unique/unique2；valueOut dtype 与 self 不一致；910B2/CANN 9.2.0。
  signature: valueOut 错型仍返回 0；输出为位模式重解释脏值；UniqueConsecutive 同输入报 161002。
  discovery: 2026-10-31 每日扫描
