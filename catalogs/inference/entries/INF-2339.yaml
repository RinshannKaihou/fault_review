id: INF-2339
legacy_ids: []
slug: ops_nn_unique_value_out_dtype_unchecked_dirty_data
aliases: []
title: aclnnUnique 不校验 valueOut dtype 输出错型脏数据
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: unique CheckDtypeValid
  behavior: CheckDtypeValid 不校验 valueOut；dtype 不一致时两段返回 0，输出为位模式重解释脏数据；同族 UniqueConsecutive 正确返回 161002。
effect:
  objects:
  - 数值结果
  detail: self=FP32、valueOut=FP16 时返回 0，valueOut 内容为 FP32 位模式按 FP16 解释的垃圾值；资料错误码表明写 valueOut dtype 不符应返回 161002；四接口行为不一致。
  visibility: 静默错误
mitigation:
  detect: 调用前自查 valueOut.dtype == self.dtype；比对 UniqueConsecutive 同输入是否报 161002。
  fix: 待定（issue open，未见修复 MR）
