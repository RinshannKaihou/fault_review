cause:
  objects:
  - subsystem: 模型定义
    stack: mindformers
    component: hash 层 seq-aux 的 f_i 统计
  behavior: hash layer 的 seq-aux 用 router 自然 top-k 统计 f_i，而不是 checkpoint tid2eid 实际选中的 expert，aux loss 与 router 梯度随之算错
effect:
  objects:
  - 训练信号
  - 梯度
  detail: 单卡 910B、FP32、关闭全部 fused 路径下，DeepSeek-V4 小算子训练的 LM/MTP/indexer/seq-aux loss 与 MindSpeed-LLM 不一致；另有 first_k_dense_replace=-1 未按全 MoE 处理、RMSNorm 等顺序不同
  visibility: 静默错误
mitigation:
  detect: 同权重、同 token batch、non-fused AdamW，与参考实现对齐 2000 step，逐指标看 LM/MTP/indexer/seq-aux 绝对误差；hash 层单独 dump tid2eid 与 router top-k 的专家集合比对
  fix: issue 自述已修复：2000 step 内 LM 2.5e-5、MTP 2.67e-5、indexer 6.66e-5、seq-aux 3.54e-6，并新增 transformer config、small-op expert、mHC、hash seq-aux 定向回归（本地 14 passed）；未附 PR 链接（closed，合并状态未核实）
