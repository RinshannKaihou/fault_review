original:
  mechanism: Ascend 910B 单卡，相同基础权重、token batch、数据集与 non-fused AdamW，运行含 DSA/indexer、HCA、MTP、MoE、mHC 与 seq-aux 的 DeepSeek-V4 小算子训练（关闭 DSV4 fused indexer 与 fused indexer loss、fused MLP、fused MoE permutation、fused RMSNorm、fused SwiGLU、Ascend/Triton mHC；FP32 参数与计算），MindFormers 与 MindSpeed-LLM 的 loss 轨迹不一致。差异来自四处执行语义/浮点顺序：(1) first_k_dense_replace=-1 未按“所有 decoder layer 均为 MoE”处理；(2) 主 decoder、MTP、mHC fold 与 final RMSNorm 的执行顺序不一致；(3) 小算子 attention/indexer、Sinkhorn、expert Linear/SwiGLU、router probability 的算子顺序不同；(4) hash layer 的 seq-aux 用 router 自然 top-k 统计 f_i，而不是 checkpoint tid2eid 实际选中的 expert，导致 aux loss 和 router gradient 错误。最小验证配置：单卡、2 个 decoder layer、1 个 MTP layer、hidden 32、FFN 32、8 head、8 expert、top-k 2、4 条 mHC residual stream、seq 512、bs 1。修复后 2000 step 内最大绝对误差 LM 2.5e-5、MTP raw 2.67e-5、indexer raw 6.66e-5、seq-aux raw 3.54e-6（2000/2000 step 在 1e-4 内），双方 canonical token-batch hash 完全一致。基线 mindformers master 75add4fa，CANN 9.1.0-beta.3，对标 MindSpeed-LLM 26.0.0-910b 镜像。
  source: '2026-07-13 GitCode mindspore/mindformers issue #2429 https://gitcode.com/mindspore/mindformers/issues/2429（closed；附修复后 2000-step 对齐数据）'
  behavior: 同权重同数据跟 MindSpeed-LLM 对练时，DeepSeek-V4 的 loss 曲线会缓慢分开：单看前几十步差异很小、没有 NaN 也不报错，但 2000 step 下来 LM/MTP/indexer/seq-aux 各条 loss 都稳定偏离参考，训练出来的模型和参考实现不是一个东西。最隐蔽的是 hash 层：aux loss 和 router 梯度用的是 router 自己算出来的 top-k，而不是 checkpoint 里 tid2eid 指向的专家，两套专家集合在 hash 层并不一致，从 loss 上只表现为小幅系统性偏移。
  trigger_surface: DeepSeek-V4 小算子（non-fused）配置 + hash layer/MoE seq-aux 打开；单卡 FP32 即可复现
  discovery: 2026-10-21 GitCode 历史 issue 回填（mindspore/ms* 簇第二池）
