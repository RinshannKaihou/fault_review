  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（vLLM v0.29.1rc1.dev145 + GLM-5.3-Flash nvfp4（182GB，BF16 lm_head/embeddings）+ 2×GB10（sm121）TP2 + FLASHINFER_MLA_SPARSE_SM120（该配置唯一可用后端）：**并发** 4 路 emoji 密集 chat 请求下非 ASCII 生成损坏——(1) 近失 CJK 字形（合法但错误的字符，非下游字符串手术可产生）；(2) byte-fragment token 率并发下 6+ vs 顺序 ~1；(3) 损坏槽位 top-3 **全被 byte-fragment token 霸占**（中等置信 −1~−2 片段后跟超高置信 −0.0x 片段），目标合并 emoji token 被挤出竞争——分布级 scramble 而非 near-tie 翻转；(4) 自回归级联：一次 fragment 落地后后续 fragment 超高置信（一墙 492 字符雪崩 80 个 FFFD）；(5) `VLLM_COMPUTE_NANS_IN_LOGITS=1` 零命中——非 NaN；(6) mojibake 是模型自身输出。并发是放大器、非 ASCII 密度是灵敏度旋钮、ASCII-only 生成不受影响） · Cov: `NEW`（并发诱导 fragment-token 分布毒化 + 自回归级联子签名） · 触发 `partial` · 置信度 `verified`'
  mechanism: 损坏位于 **sampled token ids 层**（state poisoning 类：logprobs 与采样 id 同步镜像）——并发 batching 使 byte-fragment token 在非 ASCII 高密度区域的分布中系统性挤占合并 token；一旦 fragment 进入上下文，模型对其条件化产生超高置信后续 fragment（模型侧放大），与引擎侧初始扰动形成复合。spec 解码关闭、唯一后端不可 A/B。
  source: 'vLLM #57087（2026-09-15 open，含 logprobs/top_logprobs=3 取证、顺序 vs 并发对照、NaN 探测排除、FFFD 计数（8–80/500 字符）与 DecodeStream 静默 FFFD flush 次生缺陷记述）。https://github.com/vllm-project/vllm/issues/57087'
  behavior: 无 crash、无 NaN、无日志——非 ASCII 输出出现 U+FFFD 与错误字形，ASCII 请求看似健康（触发面隐藏在负载成分里）；并发生产负载下可靠复现。6.235（GLM-5.3-Flash 累计 decode 退化）与 10.45（泰文正字法损坏）之后 GLM-5.3-Flash 非 ASCII 族新成员：本条损坏在**采样分布的 token 集合层**、由并发放大。
  trigger_surface: vLLM + GLM-5.3-Flash nvfp4 + GB10/sm121 TP2 + FLASHINFER_MLA_SPARSE_SM120 + 并发非 ASCII 密集负载（partial：硬件 + 模型 + 负载三重门控）
