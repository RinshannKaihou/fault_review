id: INF-2606
legacy_ids: []
slug: triton_experimental_int64_exempt_too_narrow
aliases: []
title: triton_experimental int64 截断大整数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: _npu_int64_exempt 降型
  behavior: 豁免名单只覆盖 RNG 类与 aten.div.*_mode；abs 等结果本身需携带大整数的算子不在名单内，指针与 compute type 一并降到 int32，超出范围的值静默截断。
effect:
  objects:
  - 数值结果
  detail: torch.abs(int64) 在 torch.compile 下：[INT64_MIN, 2^40, 2^31] → [0, 0, -2147483648]，eager/CPU 正确；2^31-1、5、7 正确，规律为取低 32 位，无编译诊断。
  visibility: 静默错误
mitigation:
  detect: 对含 2^31/2^40/INT64_MIN 的 int64 张量分别跑 eager 与 torch.compile，逐元素比较；只做能否编译的 smoke 测试测不出。
  fix: '待定（issue open；关联 #6477 为同一豁免机制在三条降型路上的另一面）'
