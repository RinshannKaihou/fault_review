  trigger_surface: KV/前缀/FP8 相关：vLLM 配置可触发或强相关
  signature: off-manifold 的量化误差**集中在 image-token 的 KV 位置**上；逐位置量化误差指标在视觉 token 段尖峰。族判为 ambiguous：门控条件是输入模态——纯文本输入下签名完全不存在。检测面：per-position 的 statistical / geometric 度量（按 token 类型分段统计）可见；全序列平均的 cheap 与 spectral 度量会被大量正常文本 token 稀释而漏检。纯文本模型无视觉 token，只能以"对某一 token 子集施加更强量化误差"的方式近似。
  repro: 在选定的 token 位置子集（充当 image-token 段的替身）上对 cached K/V 施加 E5M2 级别（2 位尾数）的粗量化 + 未校准 scale，其余位置保持 fp32；单钩子在 cache 写入后按位置掩码施加。
  locus: eviction-compression
  priority: medium
