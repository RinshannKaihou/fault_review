original:
  mechanism: tt_metal/hw/ckernels/quasar/metal/llk_api/llk_sfpu/ckernel_sfpu_typecast.h（#47700 引入）的 float→整数转换先经 sign-magnitude int32：convert<vSMag>(value, NearestEven)（SFPCAST mode 4），再 int32_to_int8（mode 13）/int32_to_uint8（mode 12）或 16 位 narrowing store。SFPCAST mode 4 不舍入完整浮点：只保留 8 位小数位再 round-to-nearest-even，小数落在 (0.5, 0.5+1/256) 且上文为偶数的值看似精确平手被向下舍：2.503→2（应 3）、10.501→10、0.50000006→0、126.500008→126、32766.502→32766。报告者在 Quasar SFPU RTL 仿真跑 Int8 平手邻域全序列与随机化验证，与硬件逐输入一致（非建模伪影）。全域统计（2^32 fp32，NaN 除外，对照 RTE+饱和）：Int8 327,552 错（全差一）、UInt8 180,096、Int16 557,056 差一外加 268,431,870 个 ≥32767.5 wrap（40000→7232）、UInt16 278,528 差一 + 125,828,351 wrap、Int32 557,056 差一。Float32 均匀分数分布下 1/512 元素受影响（[-100,100) 均匀 1e8 中 195,201 错）。Float16_b/bf16 不受影响（尾数不深于 1/256）；Float16 有 16 个受影响值。修复：四个窄格式各用一条 SFP_STOCH_RND（mode 2/3/6/7）直接转换即可逐输入精确且更快（-23%~-19% cycles），Int32 需序列；内核注释称直接转换模式返回全零的说法在仿真器与 RTL 均不成立（正文向维护者求证出处）。
  source: https://github.com/tenstorrent/tt-metal/issues/63867
  behavior: 在 Quasar 上做 float→int typecast（如量化、索引生成场景）时，小数部分恰在 0.5 到 0.5+1/256 之间的值被错误向下舍入差一（2.503→2 应为 3），Int16/UInt16 大值不饱和而是回绕（40000.0→7232）。Float32 均匀数据约每 512 个元素错 1 个，无报错、结果看似合理；累计到下游即为静默数值偏差。
  trigger_surface: tt-metal Quasar SFPU ckernel_sfpu_typecast.h（#47700 起）；float32 源 + Int8/UInt8/Int16/UInt16/Int32 目标；小数 ∈ (0.5, 0.5+1/256) 且上文偶数时差一；≥32767.5/65535.5 的 Int16/UInt16 wrap；RTL 仿真与 ttsim 验证（非实机）
  discovery: 2026-11-02 每日扫描
