id: INF-2369
legacy_ids: []
slug: quasar_sfpcast_float_int_rounding_truncation
aliases: []
title: Quasar SFPCAST typecast 8 位尾数截断错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: Quasar SFPU typecast
  behavior: float→int 转换先走 sign-magnitude int32 的 SFPCAST mode 4，该模式只保留 8 位小数再舍入，小数落在 (0.5, 0.5+1/256) 且上文为偶数的值看似精确平手被向下舍
effect:
  objects:
  - 数值结果
  detail: Float32→Int8 全域 327,552 个输入错 1（Int16 另有 2.68e8 量级 wrap 不饱和）；均匀分数分布下约 1/512 元素受影响，全部为差一错误，RTL 仿真逐输入证实与硬件一致
  visibility: 静默错误
mitigation:
  detect: 报告者跑遍 2^32 全部 fp32 输入（NaN 除外）对照 round-to-nearest-even+饱和，RTL 仿真验证
  fix: 修复方案已给：窄格式用单条 SFP_STOCH_RND 指令（mode 2/3/6/7）直接舍入+饱和，对每个输入精确且同速或更快；单测尚无修复 PR 链接（正文向维护者征询旧注释出处）
