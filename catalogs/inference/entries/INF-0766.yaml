original:
  category: cat7
  section: 第 7 类 · 量化（PTQ / 低位 / FP8 / 微缩度）
  meta: '`infra_off`（vLLM v0.29.0（rocm 镜像）+ `VLLM_ROCM_USE_AITER=1` 服务 GLM-5.3 block-scaled FP8（`GlmMoeDsaForCausalLM`）TP8 × MI325X（gfx942）+ MTP spec 5 token：**新 batch 宽度首次触发** aiter fused MoE 1stage 内核分发（`fmoe_bf16_blockscaleFp8_g1u1_vs_ps_silu_64x256E`，配置串含 `kernelName2=nan`）后引擎停止推进——两次 10s 采样间吞吐从 >2000 tok/s 跌到 0、56 请求驻留、KV 占用 21.9%（非 OOM 非抢占）；rocm-smi 显示 2 GPU 100% / 6 GPU 0%。部分冻结 75s–12.8min 后自愈（5.4h soak 中 29 次 ~10s 短停顿）；**部分永不恢复且 8 worker 无任何错误死亡**——无 traceback、无 HIP error、无 memory fault、无 watchdog，6 天 4 次致命死亡；唯一残留日志为 `shm_broadcast: No available shared memory broadcast block found in 60 seconds` 每分钟一条。同负载 gfx950（MI355X）16026 请求零错误零停顿——gfx942 特有） · Cov: `var:vllm_rocm_quickreduce_bf16_fp16_no_saturation_inf_poisoning`（7.68 ROCm aiter 数值族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: aiter fused MoE blockscale-FP8 1stage 内核（gfx942 分发）在新 batch 宽度上卡死于内核内（2/8 GPU 满载自旋、6 GPU 空转的典型内核级活锁/死锁形态）或引发无信号 worker 终止；`kernelName2=nan` 的分发记录与 batch 宽度首次出现强相关；跨架构对照（gfx950 干净）把缺陷面收敛到 gfx942 内核路径。
  source: 'vLLM #57429（2026-09-17 open，rocm/glm，含 6 天生产统计（4 致命死亡/6+ 自愈冻结/29 短停顿）、双引擎采样日志对照、aiter 分发行、rocm-smi GPU 占用形态与 gfx950 对照基线）。https://github.com/vllm-project/vllm/issues/57429'
  behavior: 双形态——(a) 可自愈冻结（75s–12.8min 零吞吐窗口）；(b) **静默引擎死亡**（无任何错误信号、worker 退出、服务面全灭）。7.68（ROCm QuickReduce bf16→fp16 无饱和 inf 毒化）与 8.69（AITER MLA gfx942 qseqlen>4 缺 kernel）之后 ROCm aiter 族新成员：本条在 **blockscale-FP8 fused MoE 引擎冻结/无错死亡**维度、行为效应是活性丧失而非数值损坏。
  trigger_surface: vLLM + ROCm gfx942（MI325X）+ aiter fused MoE + GLM-5.3 block-scaled FP8 + TP8 + MTP + 新 batch 宽度（hw_specific）
  discovery: 2026-09-17 每日扫描。
