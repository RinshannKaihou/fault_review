  meta: '`model_on` · Cov: `var:15.10` · 触发 `n/a` · 置信度 `verified`'
  mechanism: 模型对被问及的内容确实缺乏信息，采样出的输出对随机种子敏感、内容任意。关键特征是：逐 token 概率并不低（所以看单 token 置信度发现不了），但在「答案语义」这一层上的分布是平的／高熵的——同一问题重采样会得到互相矛盾但各自流畅的答案。
  source: Farquhar, Kossen, Kuhn & Gal, "Detecting hallucinations using semantic entropy", Nature 630 (2024), https://www.nature.com/articles/s41586-024-07421-0 。
  behavior: 流畅、看似合理但错误的答案，并且在重采样之间会翻转（FLIPS across resamples）。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。签名属 statistical / infotheoretic 族：跨样本的 predictive / semantic entropy 高、self-consistency 低、EigenScore 高且分散（INSIDE, ICLR 2024）。cheap 族（mean log-prob、朴素 entropy）能捕获一个较弱版本，即有信号但更钝。geometric 族的离流形检测在此为空——隐藏态本身完全在健康流形上，必须靠多次采样之间的分布结构而非单 pass 几何量。
  repro: 无模型改动，属既有 `hallucination` 标签路径的重采样变体——在事实问答提示集上对同一 prompt 做多次采样（非 greedy），按语义聚类算 semantic entropy / EigenScore；不挂任何钩子，成本在于每条 prompt 的 N 次前向。
