title: RoPE A2 上 mode=2/3 静默按 half 计算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 位置编码
    stack: cann
    component: RoPE mode 值域无校验
  behavior: mode 未校验即下传；IsAscend950() 只用于 dtype 校验未用于 mode 支持面，A2 上 mode=2/3 落到与 mode=0 相同的 half 路径。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: A2 上传 mode=2/3 两段接口返回 0，输出与 mode=0（half）逐字节相同（mode=1 vs 0 输出不同，排除数据巧合）；文档明确 A2 仅支持 0/1、承诺 161002。调用方拿到 half 位置编码，精度异常时才暴露；同代码 A2 与 950 语义不同且都返回成功。
  visibility: 静默错误
mitigation:
  detect: 同输入分别跑 mode=0/1/2/3 比较输出位模式；mode=2/3 与 mode=0 逐字节相同即命中（数据需保证模式间语义不同）。
  fix: 待定（issue 建议复用 IsAscend950() 在入口拒绝并补 UT；open 未见修复 MR）
