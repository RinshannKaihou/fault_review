original:
  mechanism: SGLang main（db90f58 与 6393e66 同码）+ Qwen3-4B + DSPARK block7 复现。ScheduleBatch.prepare_for_decode（managers/schedule_batch.py:3736）移交推测解码后在惩罚累积（:3769-3770）前返回：dflash 家族从不累积生成 token 进 penalizer；DFLASH verify 时 logits 调整另忽略预计算惩罚 buffer。EAGLE 路径 eagle_prepare_for_decode() 正确累积故不受影响。实测：temperature 0、贪心逐字节对比 repetition_penalty 1.0/2.0/frequency_penalty 2.0 三者输出完全相同；rep=100 被 SamplingParams.verify() 400 拒绝（参数确实到达 SamplingParams，非网关剥离）；vLLM 同 checkpoint 对 rep=2.0 有反应（输出劣化）。--speculative-algorithm none 的 A/B 未跑（共享端点）。
  source: https://github.com/sgl-project/sglang/issues/46752（字节级对照 + 参数到达证明）
  behavior: 用 --speculative-algorithm DSPARK/DFLASH 服务时，请求里的 repetition_penalty/frequency_penalty/presence_penalty/min_tokens 完全无效：惩罚值从 1.0 调到 2.0 输出一字不变，模型重复内容不受抑制；无任何告警，用户以为惩罚已生效。
  trigger_surface: SGLang main/v0.5.2x + --speculative-algorithm DSPARK 或 DFLASH + 请求级采样惩罚参数；EAGLE 路径不受影响。
  discovery: 2026-10-27 每日扫描
