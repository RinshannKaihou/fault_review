original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（vLLM Model Runner V2 `buffer_utils.py` `_apply_write_kernel`：`row_ptr += row_idx * row_stride + start_idx`——`row_idx` 来自 int32 张量 `write_indices`、`row_stride` 为 host 标量（`self.gpu.stride(0)`）被 Triton 特化为 int32，乘法在 **int32** 中进行；`StagedWriteTensor` 的 rows×stride 一旦越过 2^31 即回绕为负偏移、kernel 越界写。Qwen4Exp/QSA hybrid `max_model_len=1_000_000`（TP8 MI308X，乘积 ~2.6e9）自 mid-September MRv2 分派后**每个引擎在首个真实请求上 8 个 TP worker 毫秒级齐崩** `Memory access fault by GPU node-N (Reason: Unknown)`——伪装成"长上下文内核 bug"；<512k 上下文全部正常。无模型 10GB 最小复现（ROWS=65536×COLS=40000=2.62e9）；修复 `row_idx.to(tl.int64) * row_stride` 一行已在 6 个生产副本（70 万 token 请求 + FULL decode graphs）验证稳定；`_zero_kv_blocks_kernel` 已有同款 int64 cast 先例。MULTI_GROUP 路径 `row_stride` 逐写取自 `output_strides` 张量，其 dtype 待确认否则同墙） · Cov: `NEW`（Triton 隐式 int32 标量特化乘法回绕越界写子签名） · 触发 `partial` · 置信度 `verified`'
  mechanism: Triton 对 host int 标量按"值可被 int32 表示"特化为 int32，张量索引乘法不自动提升——索引数学的溢出边界从 int64 地址空间静默收缩为 int32；`StagedWriteTensor` 大行数 × 大 stride 的设计点恰在 2^31 之上。
  source: 'vLLM #57030（2026-09-15 open，rocm，含生产环境（1M 上下文全灭）叙述、无模型最小复现、一行修复 diff、6 副本生产验证与 MULTI_GROUP 次生风险标注）。https://github.com/vllm-project/vllm/issues/57030'
  behavior: 双形态——(a) 回绕后命中不可映射页：illegal memory access / Memory access fault，8 worker 齐崩引擎死亡；(b) **回绕后仍落在同一 allocation 内：静默 scribble 到其他行**（报告者原文"the silent-corruption variant is the one that should keep people up at night"）。1.167（INT32_MIN 残差校正整数族）与 1.190（typecast 正溢出饱和）之后 int32 溢出族新成员：本条在**索引乘法回绕 → 越界写**维度、且是大上下文生产配置的必然触发。
  trigger_surface: vLLM V1/V2 `StagedWriteTensor`（KV/状态 staged write 路径）+ rows×stride(0) > 2^31（partial：需 ≥~512k 上下文或等价大分配）
  discovery: 2026-09-17 每日扫描。
