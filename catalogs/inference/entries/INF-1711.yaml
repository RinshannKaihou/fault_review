id: INF-1711
legacy_ids: []
slug: ms_fusion_attention_all_zero_mask_row
aliases: []
title: 全零 mask 行使融合注意力输出退化为均匀加权
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: flash_attention_score 掩码
  behavior: 把 bool/0 掩码转成对应 dtype 的最小值参与 softmax，却没有处理整行都被屏蔽的行；该行 logits 全部相等，softmax 退化成 1/n 均匀分布。
effect:
  objects:
  - 数值结果
  detail: attention_mask 某行全 0 时，speed_fusion_attention 与 flash_attention_score 的前向输出变成对被屏蔽 key 的均匀加权，反向结果同样错；与 PTA 同输入对不上，无任何报错。
  visibility: 静默错误
mitigation:
  detect: 构造 attention_mask 中至少一行全 False（与 tril 取与后仍全 0）的 q/k/v，对比 ops.speed_fusion_attention 与 PTA 同输入的输出与梯度
  fix: 待定（issue open，无修复 PR）；方向：整行被屏蔽时显式输出 0，而不是交给 softmax 均分
