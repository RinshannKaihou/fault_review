original:
  mechanism: 'vllm-ascend issue #10932，NPU prefetch offloader。静态缓冲槽位按 slot = module_index % prefetch_step 分配，下一次 refill 的目标却按 next_index = (index + prefetch_step) % M 选取，隐含假设 next_index 与当前模块同槽；当有效 offload 模块数 M 满足 1 < prefetch_step < M 且 M % prefetch_step != 0 时该假设不成立。最小例：M=3、prefetch_step=2，槽位分配为 module0→0、module1→1、module2→0，目标序列 target(i)=(i+2)%3=[2,0,1]；module1 执行完后旧公式把 module0 灌进 slot 0，而 module2 还没执行、仍需要 slot 0，于是静态缓冲在 module2 消费前被覆盖。offload_group_size 与 offload_num_in_group 决定被选中的模块集合，因此部分合法 group 配置就会产生非整除环。实测：Ascend 910B2C + Qwen3-0.6B eager，offload_group_size=8、offload_num_in_group=1、prefetch_step=2（effective M=3），baseline/未修复/已修复分进程运行；未修复路径 32/256 负载出现 token id 不一致、chosen-token logprob 最大差 1.70258，1024/256 负载 token id 一致但 logprob 最大差 0.00917；应用槽位归属修复后两者 logprob 差均为 0.0，ACL graph 编译/捕获/回放路径亦为 0.0。通用 vLLM 的 prefetch offloader 同样存在这一源码级槽位冲突，但 token/logprob 不一致是在 Ascend NPU 路径复现的。'
  source: 2026-06-25 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10932 （open）
  behavior: 开启 prefetch offload 且 offload 模块数与 offload_prefetch_step 不整除时，服务不报错、能正常出词，但输出与不开 offload 的 baseline 不一致：短负载（32/256）上 token id 直接不同，chosen-token logprob 最大差到 1.70；长负载（1024/256）token id 碰巧一致，logprob 仍有约 0.009 的偏差。这类差异看起来像采样噪声，实际是某个未执行模块的静态缓冲被 refill 提前覆盖，只有在同进程外分别跑 baseline 与 offload 两路、逐 token 比对 id 与 logprob 时才能稳定发现。
  trigger_surface: Ascend 910B2C + prefetch offload，offload 模块数 M 不能被 prefetch_step 整除（M=3、step=2）
