original:
  mechanism: cann/hccl issue 295（2026-07-15，closed）来自 HCCL 创新大赛代码缺陷提交。src/ops/all_reduce/executor/ins_v2_all_reduce_sequence_executor.cc L121-123 的三行顺序为 dataTypeSize_ 取自 SIZE_TABLE、dataSize_ = dataCount_ * dataTypeSize_、dataCount_ = param.DataDes.count，长度在计数赋值前算出；基类 executor_v2_base.h L82 把 dataCount_/dataSize_/dataTypeSize_ 都初始化为 0。提交附隔离用例 loop-control/test_initorder_006.cc 的三组输出：新对象 INT32 count=1000 得 dataSize_=0（应 4000）；复用对象 INT8 count=500 得 1000（应 500）；复用对象 FP32 count=777 得 2000（应 3108）。全仓 14 个 *_sequence_executor.cc 及其 _aicpu/_aicpu_3level 变体均为先赋 count 后算 size，仅此类颠倒。
  source: 2026-07-15 GitCode cann/hccl issue https://gitcode.com/cann/hccl/issues/295 （closed）
  behavior: 多卡训练/推理里同一 AllReduce 执行器被反复调用时，集合通信搬的字节数和本轮张量对不上：进程不报错、不挂起，但归约后的值与单卡基线不一致；新建执行器那次更彻底，长度算成 0 相当于这一步没做归约。定位只能靠逐层比对多卡与单卡结果，日志里看不到异常。
  trigger_surface: ins_v2 AllReduce 序列执行器，count 变化或对象复用的多卡场景
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
