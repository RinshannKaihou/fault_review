id: INF-1974
legacy_ids: []
slug: hccl_allreduce_seq_executor_datasize_stale
aliases: []
title: AllReduce 执行器 dataSize_ 早算致传输长度取旧值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: cann
    component: ins_v2 AllReduce序列执行器
  behavior: dataSize_ = dataCount_ * dataTypeSize_ 写在 dataCount_ 赋值之前，用默认 0 或上一次的 count 算长度
effect:
  objects:
  - 数值结果
  detail: 新对象调用时 dataSize_=0，等于不搬数据；复用对象按上一次 count 收发，多卡归约结果与单卡基线不符，接口全程 SUCCESS 无告警
  visibility: 静默错误
mitigation:
  detect: 同一 executor 对象连续两次不同 count 的 AllReduce 交替调用，比对多卡结果与单卡推理结果；UT 断言 dataSize_ == count*SIZE_TABLE[dtype]
  fix: 交换两行赋值顺序（dataCount_ 先赋值，再算 dataSize_）；issue 只给 diff 建议，未给 MR，是否已修未核实
