id: INF-1525
legacy_ids: []
slug: torchnpu_te_e8m0_ceil_log2_boundary
aliases: []
title: FP32→E8M0 用 ceil(log2) 致 2 的幂边界编码错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: pytorch
    component: E8M0 指数编码
  behavior: FP32→E8M0 转换用 ceil(log2(x)) 求指数，log2 在 2 的整数次幂附近的浮点舍入会抹掉相邻 ULP 的边界差异，编码落到错误档位。
effect:
  objects:
  - 数值结果
  detail: 1.0 上方一个 ULP 的值本应编码到下一档，log2 舍入为 0 后与 1.0 同码；零、负数、非正规数、Inf、NaN 依赖普通正数路径的偶然结果。
  visibility: 静默错误
mitigation:
  detect: 构造 2 的整数次幂及其上下一个 ULP、零/负数/非正规数/特殊值，比对 E8M0 编码与按指数位/尾数位直接计算的结果
  fix: 修复 MR https://gitcode.com/Ascend/pytorch/merge_requests/46466（改为直接取 FP32 的指数位与尾数位计算 E8M0，仅对 NPU FP32 输入生效）；合入与发布状态未核实
