  behavior: 失控 / 无限生成：先给出正确答案，然后永不停止，反复吐出那个未被识别的结束 token。
  trigger_surface: tokenizer/template 选择
  signature: 在有用生成阶段隐藏态完全正常，签名是解码循环的产物而非前向的产物。静态隐藏态检测器基本上会漏检它（只有尾部重复段的那些位置会显示重复态签名）。它是一个有价值的 NEGATIVE 样本：专门用来打败隐藏态检测器；真正能抓住它的是对输出 token id / 长度做 statistical 检查，属于 cheap 族而非 geometric/spectral 族。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）
  repro: 只能部分注入——改写 `generation_config.eos_token_id` 或去掉模板中的 EOS 即可触发，但由于故障发生在解码循环而非前向，以单次前向隐藏态为主的观测路径只能看到尾部重复段，无法完整刻画。
