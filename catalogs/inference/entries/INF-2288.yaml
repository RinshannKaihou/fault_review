original:
  mechanism: cann/ops-transformer 的 aclnnInplaceFusedCausalConv1dV2 派发死区（Ascend950PR 8 die、CANN 9.2.0-beta.2、V2 op_api/op_host/op_kernel 均仓 master 重构）：op_host/inplace_fused_causal_conv1d_tiling.cpp:53 的 useBH=(xDimNum==3)||(xDimNum==2 && maxQueryLen<=maxDraftTokens+1)，2D 输入只要 maxQueryLen>maxDraftTokens+1 就直调 BSH 的 DoTiling() 不经模板注册表能力筛选；而 attention/fused_causal_conv1d/op_host/fused_causal_conv1d_cut_bsh_tiling_arch35.cpp:92 的 BSH 能力判定要求 maxQueryLen∈[1,8] 否则 false（注释「短序列 1..8 → BH」）。于是 maxDraftTokens+1<maxQueryLen<=8 的交集：派发选 BSH、BSH 自认不支持 → DoTiling 失败 → 561002。V1 把 maxDraftTokens 硬编码 7（阈值 8）交集为空不暴露；V2 开放属性 [0,16] 后只要 maxDraftTokens<maxQueryLen-1 必然掉进。实测矩阵：maxQueryLen=5/maxDraftTokens=4（BH）rc=0 与 numpy 一致；=5/3、=5/0（BSH）561002；=9/3（BSH）rc=0。260 条精度用例 127 条无法执行。资料约束只要求 maxQueryLen>maxDraftTokens+1 未给下界，属实现派发缺陷而非非法参数。
  source: GitCode issue https://gitcode.com/cann/ops-transformer/issues/6915 （open，2026-10-29，含派发规则/能力判定双定位与 4 行实测矩阵）
  behavior: 在 950PR 上用该 MTP/PD 混部卷积算子（V2）处理 2D 输入时，maxQueryLen 在 (maxDraftTokens+1, 8] 区间的所有请求恒定报 561002 参数错误——这批 shape 合法且同 shape 换属性即可成功，导致近半精度用例与对应生产配置完全不可用；虽是显式报错（非静默错值），但整类输入被派发层死区挡死，掩盖了真实能力边界。
  trigger_surface: Ascend950PR / CANN 9.2.0-beta.2；aclnnInplaceFusedCausalConv1dV2；2D 输入 + maxDraftTokens+1<maxQueryLen<=8（V2 开放 maxDraftTokens 后典型 PD 配置）；prefill/PD 混部。
  signature: 同 shape 下 BSH 派发 561002 / BH 派发 rc=0 的切换矩阵。
  repro: issue 附 repro.cpp（extern C 声明 + 4 组返回码）。
  discovery: 2026-10-29 每日扫描
