    component: conv1d tiling 派发
  behavior: 2D 输入派发规则 useBH 判定与 BSH 模板能力判定（maxQueryLen∈[1,8]→false）不一致：交集里派发选 BSH 而模板自认不支持，DoTiling 失败恒返回 561002。
effect:
  objects:
  - 可用性/进度
  detail: 950PR 实测：maxQueryLen=5/maxDraftTokens=3 或 0 恒 561002；同 shape maxDraftTokens=4（BH）rc=0 且与 numpy 一致；属性扫描 260 条精度用例 127 条无法执行；V2 开放属性后必踩。
  visibility: 报错
mitigation:
  detect: 2D 输入 + maxDraftTokens<maxQueryLen-1 且 maxQueryLen≤8 的组合扫描返回码；对照 BH 派发同 shape 成功。
  fix: 待定（根因已定位至 tiling.cpp:53 派发规则与 cut_bsh_tiling_arch35.cpp:92 能力判定不一致；未见修复 PR）
