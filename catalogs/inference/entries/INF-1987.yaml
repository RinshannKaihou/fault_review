slug: vllm_ascend_dcp_prefix_false_hit
aliases: []
title: DCP 前缀查询只查 DCP0 致假命中
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: KVPool DCP 键展开
  behavior: _expand_lookup_keys_by_rank 只重写 head_or_tp_rank 与 pp_rank；MLA 的 group_tp_size=1 使 DCP0 键不展开到 DCP1-7，单分片存在被当成全 rank 命中
effect:
  objects:
  - KV状态
  - 输出内容
  detail: TP=8/DCP=8/PCP=1 的 MLA 模型上，调度器先宣告外部前缀缓存命中，随后非 DCP0 分片的 get 返回 -704；该块实际未加载，请求按命中前缀继续解码
  visibility: 静默错误
mitigation:
  detect: 在 prefix-cache 告警处同时记录 scheduler 的 exists 键集合与逐 rank get 结果，出现 hit 宣告后 -704 即命中该机制；对比键里 @dcpN 是否只出现 dcp0
  fix: 待定（issue closed，未附修复 PR）；作者给出的方向是在 _expand_lookup_keys_by_rank 里按 DCP 维度补全键，#15060 为相关报告
