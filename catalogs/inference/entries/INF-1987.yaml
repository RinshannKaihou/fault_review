original:
  mechanism: 'issue #15505（vllm-ascend v0.26.0rc，Ascend NPU）指出 KVPoolWorker.lookup_scheduler() 在宣告外部前缀缓存命中前做全 rank 存在性检查。TP=8、DCP=8、PCP=1 的 MLA 模型下每个块有 8 个 DCP 专属键（...@pcp0@dcp0..7@head_or_tp_rank:0@pp_rank:0@...@<hash>），但 _expand_lookup_keys_by_rank() 只重写 head_or_tp_rank 与 pp_rank；MLA 的 get_group_tp_size(group_id)==1，本地 DCP0 worker 构造的键不会被扩展到 DCP1-7，于是调度器把 DCP0 的存在当成全 rank 命中，而后续逐 rank 装载需要每个 DCP 键都存在，非 DCP0 键可能返回 -704。作者给出的验证方式是给 m_store.exists(keys) 与后续逐 rank m_store.get(keys) 加打印，可见 scheduler 侧只有 @dcp0、装载侧是 @dcp0..7。'
  source: 2026-09-01 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15505 （closed）
  behavior: 开启外部前缀缓存后，部分请求被判为命中却拿不到完整的 KV：调度器已经按“命中”跳过 prefill，装载分片时却报 -704 取不到键，表现为命中率虚高、请求结果与未命中时不一致，日志里只有加载侧的 -704，没有索引侧的报错。
  trigger_surface: MLA 模型 + 外部 KV 池（AscendStore/Mooncake 一类）+ TP=8/DCP=8/PCP=1 的多分片键布局
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
