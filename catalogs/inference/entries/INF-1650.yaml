title: 常量折叠的 softmax 用朴素 exp 溢出成 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: Graph Const 常量折叠 softmax
  behavior: 前端常量折叠对 ops.softmax 用朴素 np.exp 实现且不先减行最大值，大幅值常量输入在编译期 exp 溢出，输出 nan 而运行时路径正确。
effect:
  objects:
  - 数值结果
  detail: 常量 [[1000,1000],[1200,1200]] 上 Graph(Const) 的 softmax 输出全 nan 并报 overflow encountered in exp，PyNative 与 Graph(Arg) 都得 [[0.5,0.5],[0.5,0.5]]。
  visibility: 数值异常
mitigation:
  detect: 同一 softmax 表达式分别用入参和无参 @jit（捕获闭包常量）执行并比较；Graph(Const) 出现 nan 或 exp 溢出告警即命中
  fix: 待定（issue open，无修复 PR）；方向：常量折叠改用减行最大值的稳定 softmax 实现，而非朴素 np.exp
