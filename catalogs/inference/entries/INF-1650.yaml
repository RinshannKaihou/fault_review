original:
  mechanism: '常量折叠路径把 ops.softmax 的常量输入交给 numpy 朴素实现：mindspore/ops/operations/manually_defined/ops_def.py:1368-1369 里先 e_input = np.exp(input.asnumpy())，再除以求和，既未减行最大值也未做裁剪。x=[[1000.0,1000.0],[1200.0,1200.0]] float32 时 exp 直接溢出，无参 @ms.jit（输入是闭包常量、走 Graph Const 常量折叠）输出 [[nan,nan],[nan,nan]]，同时抛 RuntimeWarning: overflow encountered in exp 与 invalid value encountered in divide；同一张量在 PYNATIVE_MODE 和 Graph 传参路径都得到正确的 [[0.5,0.5],[0.5,0.5]]。issue 环境为 CPU、Python 3.12 的 2.9/2.10 轮子，未给出 token 级影响。'
  source: 2026-05-18 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29396 （open）
  behavior: 同一个 softmax 表达式，输入写成闭包常量而不是函数入参，编译后输出整片变 nan，日志里只有 numpy 的 overflow/invalid 告警，进程不中断；改回传参立刻恢复正常。定长常量（固定 mask、位置相关权重）参与 softmax 的图会静默算出 nan，再往下传就污染整条链路。
  trigger_surface: GRAPH_MODE 下 softmax 的输入是闭包常量（触发 Graph Const 常量折叠）；数值幅值足以让 exp 溢出
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
