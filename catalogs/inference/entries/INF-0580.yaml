  meta: '`ambiguous`（`--enable-linear-replayssm` 强制 `--mamba-radix-cache-strategy no_buffer`——该策略把 mamba checkpoint 存在后续请求**够不到的 radix 树深度**：共享前缀复用坍塌、TTFT 最坏 **+369%**（rag 2048-tok 前缀：hit 88.2%→65.9%、TTFT mean 226→1063ms、p99 1788→4116ms）；fewshot 512-tok 前缀 hit 62.2%→**0.0%**、TTFT +92%；吞吐不变（−0.2%）——纯延迟/成本退化，无正确性信号） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
  mechanism: ReplaySSM 特性对 mamba 状态缓存策略的硬依赖（no_buffer）与 radix 前缀命中深度语义冲突——特性开启即把另一个维度的优化（prefix cache）静默关到失效档；`no_buffer` 还 assert 反对 overlap scheduler，迫使用户同时关掉 overlap（报告者固定该变量做单一变量对照）。性能回归非正确性回归，但"开特性 A 静默废掉特性 B"是配置面正确性盲区。
  source: 'SGLang #37834（2026-09-03 open，Qwen3.8-27B 1×H200、三 workload × 双臂对照表）。https://github.com/sgl-project/sglang/issues/37834'
  behavior: 无 crash、输出正确——前缀命中坍塌 + TTFT 最高 4.7×；与 6.171（spec decode 静默禁用 hybrid prefix cache）互为镜像（彼条正确性、本条性能侧），同「**特性互斥静默降级**」域。
