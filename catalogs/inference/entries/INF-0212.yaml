  mechanism: 与 1.212 共用同一复现机制，唯一差别是尖峰通道改从 **massive-activation 通道**中抽样（可用 massive 通道不足 `k` 时自动截断）。设计动机：不允许把最难的情形（尖峰落在本来就巨大的 massive/attention-sink 通道上，从而被健康分布的重尾"吞掉"）静默排除。参数轴与 1.212 相同，target 取 massive。
  source: 本项目早期实测条目（原型阶段实测，量值不跨栈继承；触发/复现已按 vLLM/CUDA 重估）。
  behavior: 与 1.212 同类（单 token 输出被推偏、无崩溃），但由于 massive 通道本身承担 attention-sink / 隐式偏置角色，同等 `c` 下对下游 attention 分布的破坏更结构性。
  trigger_surface: 同 1.212，massive 通道变体
  signature: 仍是 `infra_off`，但**故意逼近检测器盲区**：massive 通道的健康 per-channel 方差极大，标准化后同样的 `c*sigma` 位移在 Mahalanobis 意义下要小得多，因此 geometric 族的分离度系统性低于 1.212；trajectory 的 STEP 依然存在，statistical 的分位移（`activation_quantile_shift`）因为动的正是分布尾部而可能反而更敏感。
  repro: 同 1.212，唯一额外前置是需要 baseline 提供 massive_mask（健康 per-channel 幅度的 top 通道集合；无 baseline 时可用"clean hidden 在该层 |activation| 前 10 大的通道"作为替身 mask）。
  相关条目: |-
    `var:1.213` → **4.4 `fp16_overflow_ceiling`**（源文档同时注明其与 `weight_bitflip_naninf` 相关；在 fp32 设定下默认不出现，需把中间激活下转 fp16 才可复现）。
