original:
  mechanism: cann/ops-transformer SwinTransformerLnQKV 暴露可选属性 epsilon（proto 算子定义默认 0.0000001f），但 Host tiling（op_host/swin_transformer_ln_qkv_tiling.cpp）不读取该属性、tiling 数据无 epsilon 字段，Device kernel（op_kernel/swin_transformer_ln_qkv.cpp）固定 epsilon=0.00001 并用于 sqrt(variance+epsilon)。默认调用与显式自定义 epsilon 均违反接口契约，LayerNorm 方差稳定项改变后续 Q/K/V 输出。证据为固定源码 0f1cf7d13da8f8be942b746759dd317d1ebb83ec 的静态对照（属性顺序确认 epsilon 索引 4），2026-10-12/13 两次复核 master（6bcc34a8/a1e0e63d）该缺陷未变；修复 PR（!13703/!13800）将 epsilon 从第 5 属性读入 tiling 并下发 kernel，缺省回退 1e-7。两次报告（#6028、#6119）正文一致为同源双报。未运行设备构建或数值验证。
  source: 2026-10-17 GitCode cann/ops-transformer issues https://gitcode.com/cann/ops-transformer/issues/6028 与 https://gitcode.com/cann/ops-transformer/issues/6119 （均 open；固定 commit 静态对照+补丁应用验证）
  behavior: 调用 SwinTransformerLnQKV 算子时，无论用默认 epsilon 还是显式传入自定义值，LayerNorm 实际用的都是硬编码 1e-5：接口文档承诺的 1e-7 语义不生效，Q/K/V 输出与按接口契约实现的参考值有系统偏差。不报错；静态源码对照确认，未见设备端数值复现记录。
  trigger_surface: SwinTransformerLnQKV（ffn 域 swin_attention_ffn 系链路）任意调用；master 未修
