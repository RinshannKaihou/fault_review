  meta: '`infra_off`（`ttnn.sigmoid_bw` 对 x≥6.25（bf16）/16.75（fp32）返回**恒 0 梯度**：导数按 `s*(1-s)` 合成，`s=sigmoid(x)` 舍入到精确 1 后 `1-s=0`——信息已不在 s 中；真导数 `sig(x)·sig(−x)` 到 |x|=87.34 仍是正常浮点数 1.2e-37） · Cov: `var:ttmetal_prod_bw_zero_input_nan_gradient`（1.171 反向合成相消族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`unary_backward.cpp#L467-L480` 用 forward 结果合成导数，`rsub(s,1)` 在 s→1 时灾难性相消到精确零；前向再精确也无法恢复——导数必须绕开减法（恒等式 `sigmoid'' = sig(x)·sig(−x)`）。'
  source: 'tt-metal #55724（2026-09-08 open，op_cat:eltwise label，含双 dtype 阈值推导与恒等式修复）。https://github.com/tenstorrent/tt-metal/issues/55724'
