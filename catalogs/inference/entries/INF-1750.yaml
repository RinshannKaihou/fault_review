id: INF-1750
legacy_ids: []
slug: indcutor_npu_stride_layout_attr_mismatch
aliases: []
title: Inductor-NPU 生成代码 stride/布局与 eager 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: Inductor-NPU 布局与属性推导
  behavior: Inductor-NPU 为 out-variant、linalg 与池化等算子生成的输出沿用转置/私有布局未还原，零维简并场景布局推导越界，索引/维度属性又被降为 int32。
effect:
  objects:
  - 数值结果
  - 测试判定
  detail: Inductor-NPU 编译 out-variant/linalg/池化/resize_ 算子（零维简并维、符号 shape）时 23 例失败：12+ 例 stride 与 eager 不符，3 例 IndexError，2 例 dtype int64≠int32，1 例 resize_ 不支持。
  visibility: 静默错误
mitigation:
  detect: NPU 上跑 test_torchinductor_opinfo/dynamic_shapes 的 npu 变体，对输出同时比 stride 与 dtype 属性，而不只比数值
  fix: 待定（issue open，建议转需求）：torch_npu/_inductor 集成层对齐 eager 的 stride/布局语义、按 int64 下发索引属性、补 resize_ 降级路径
