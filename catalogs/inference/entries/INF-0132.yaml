  meta: '`infra_off`（`rms_norm_pre_all_gather` 的 `use_2d_core_grid=True` 路径携带与 #54697 相同的 per-row x² buffer 过分配（L1 超限于宽 fp32_dest_acc 行），且 2D 路径在普通 shape H=1024 W=1024 上**直接挂起**——hang 阻塞该路径的全部验证） · Cov: `var:ttmetal_comp_pcc_constant_fallback_fp32_tolerance_false_reject`（1.105 同"验证路径缺陷掩盖数值路径缺陷"域） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 2D core grid 工厂复制了默认工厂的 per-row 缓冲分配模式（x² 缓冲按最宽行分配）；H=1024×W=1024 的 hang 表明 2D 划分下还有独立的同步/依赖缺陷。pre-all-gather 变体把归约挪到 all-gather 前以省带宽，路径仅 2D flag 可选。
  source: 'tt-metal #55075（2026-09-01 open，wormhole 复现，含静态 dataflow buffer 分配报错与最小脚本）。https://github.com/tenstorrent/tt-metal/issues/55075 · 关联：#54697（默认工厂同缺陷）'
  behavior: 双形态——宽行 fp32_dest_acc 配置下 L1 静态分配超限（构建期报错，fail-loud）；普通 shape 上无任何输出的 hang（liveness 故障）。与 6.176（ptxas 自旋 wedge）同 silent-hang 域，本条在 tt-metal 2D grid 调度层。
  trigger_surface: tt-metal Wormhole + `rms_norm_pre_all_gather(use_2d_core_grid=True)` + 宽行 fp32_dest_acc 或 H=W=1024（软件 config/shape 即触发）
