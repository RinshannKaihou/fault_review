original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（unary 算子表中 EXP/LOG/LOG1P/LOG2/LOG10 五项的 `approximate` 标志硬编码 `true`，与表内自身约定"裸名=accurate、`*_approx`=fast"（GELU/SIGMOID/MISH 等均带 `*_approx` 兄弟拼写）**方向相反**且无任何字符串拼写可达精确内核；LLK 模板默认与 nanobind `fast_and_approximate_mode=false` 默认及文档（"Defaults to False"）均声明相反语义） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 近似路径是 3 分数位 Schraudolph bit-trick（`ckernel_sfpu_exp.h:444-461`：`tmp << (10-3)` 移入指数字段），百分位相对误差、按 x/ln2 周期、不随张量平均消掉；log 近似路径另跳过归一化使 −0.0/subnormal 不返回 −inf/正确值。经 `ttnn.matmul/linear` 与 `dit_rms_norm_unary_fused`（docstring 声称"等价于 ttnn.<activation>(rms_norm(…))"——对 exp 不成立）可达。nightly 测试把字符串 case 重写为无参对象后调用——**该表从未在设备上被执行**。
  source: 'tt-metal #55265（2026-09-02 open，含常量表声明、LLK/nanobind 双默认反证与测试重写路径）。https://github.com/tenstorrent/tt-metal/issues/55265'
  behavior: 无 crash——任何 `matmul/linear(activation="exp"/"log"/…)` 字符串融合静默使用近似内核且无规避拼写；与 1.137 同族（API 契约静默违反）但缺陷位于分发表的常量声明而非算子绑定。
  trigger_surface: tt-metal + `ttnn.matmul/linear` 字符串 activation 或 `dit_rms_norm_unary_fused`（软件算子选择即触发）
  discovery: 2026-09-02 每日扫描。
