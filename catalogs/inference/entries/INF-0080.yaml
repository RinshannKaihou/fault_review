original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（kernel cache 条目为文件组，单文件原子替换但组发布非原子 → 并发编译装载混组产物） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
  mechanism: 'Triton kernel cache 的一个条目是一组文件（IR 各阶段、cubin、metadata JSON、`__grp__` manifest）。每个单独写入经 `os.replace` 原子，但并发编译同一 key（多进程或多主机共享同一 cache dir）时各 writer 向同一目录写同名文件——读者可装载**混组**产物：A writer 的 cubin 配 B writer 的 metadata/IR。修复（PR #11319）按 writer staging 目录原子发布整组。'
  source: 'Triton PR #11319（2026-08-15 open，[RUNTIME] per-writer staging）。https://github.com/triton-lang/triton/pull/11319'
  behavior: 无报错。混组装载 = 编译产物错配，最坏情形 cubin 与 launch 元数据不一致 → 静默错误结果或运行时崩溃，且依赖编译时序、难复现。属「多写者共享编译缓存 × 组级非原子发布」**新子签名**——CI / 多机集群的典型形态。
  trigger_surface: Triton；共享 TRITON_CACHE_DIR（多进程 ray/dataloader worker、多主机 NFS）+ 同 kernel 并发首次编译
  discovery: 2026-08-16 每日扫描。
