legacy_ids: []
slug: moe_gating_topk_softmax_310p_tiling_ub_overflow
aliases: []
title: MoeGatingTopKSoftmax 310P tiling UB 溢出
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: cann
    component: MoeGating tiling 310P
  behavior: 310P tiling 的 Align() 向上取整到 16*blockNum，row<160 分片越过真实行数，尾块非 8 倍数走单整块 softmax，UB 需求超上限，softmax 写坏、TopK 产垃圾索引、MoE 路由错乱。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: vLLM+MoE(256 experts) GSM8K 约 21% 样本空输出（首 token 即 EOS）；空输出 batch input_tokens 100% 落 (144,159] 非 8 倍数；单算子 row=156/col=256/fp16 输出垃圾行，EP 机型同输入正确。
  visibility: 静默错误
mitigation:
  detect: 端到端：空输出样本的 batch input_tokens 落点统计；单算子层：RC 与 EP 机型同输入 golden 对比（kernel sha256 一致可排除设备侧）。
  fix: 修复 PR https://gitcode.com/cann/ops-transformer/merge_requests/14811 （open，CI 已通过，守卫循环逐档收缩 + 不可行时显式失败 + 3 个回归用例；未发布版本）
