title: vLLM TP 各 rank Inductor 归约自调谐致专家分叉
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: TP 复制归约各 rank 独立 autotune
  behavior: TP 复制的 fused_add_rms_norm 是 Inductor 归约，各 worker 独立 autotune 可选不同 config（4096 vs 8192），求和顺序不同使输出分叉，近并列分数下各 rank 路由不同专家。
effect:
  objects:
  - 隐状态
  - 输出内容
  - 数值结果
  detail: 实测 ~1.5e-5/token-layer，约 1e-3 token 在 69 层中至少一次专家翻转（55/1,104 次调用 topk_ids 分叉）；翻转 token 输出是两专家各半之和，无报错静默返回
  visibility: 静默错误
mitigation:
  detect: 各 rank 对每次 select_experts 哈希 router 输入/router_logits/topk_ids 并 diff（issue 的 wrapper 方法，无集合通信）；或对比各 rank Inductor 归约 config 获胜者
  fix: 规避（issue 实测验证）：inductor_compile_config 设 test_configs.force_filter_reduction_configs=true 两侧钉死同一归约 config 后 1,104/1,104 调用 0 分叉；上游修复未见（issue open）
labels:
  stage: N/A
