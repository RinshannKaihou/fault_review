remarks: 机理由编译器层非确定性（Inductor autotune）传入并行层（TP 复制计算分叉）再放大为语义错误（MoE 路由分叉），跨 编译器/并行切分 两个 subsystem 的链式缺陷，按出错放大点（无一致性保证的 TP 复制归约）归并行切分。
