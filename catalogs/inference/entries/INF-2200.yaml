  objects:
  - subsystem: 并行切分
    stack: torch_npu
    component: vllm_ascend rank_grid
  behavior: rank_grid reshape(pp,dp,tp) 与实际布局 (ext_dp,dp,pp,pcp,tp) 不符，pp>1 时组内混入不同流水线阶段 rank；无 pp 前置检查
effect:
  objects:
  - 可用性/进度
  detail: dp=2,pp=2,tp=1 时实际 DP 组应为 {0,2}/{1,3}，却构建出 {0,1}/{2,3}（各混 PP 两阶段）；首个跨 DP 交换静默挂起；仅 pp==1 且 pcp==1 时 reshape 恰好匹配，故已支持部署正常（隐含假设 pcp==1）
  visibility: 挂起
mitigation:
  detect: 静态审查（本条目即静态分析发现，无硬件复现）；对照 all_ranks 的 (external_dp,dp,pp,pcp,tp) reshape
  fix: '指南 #17968 已记录「四个旋钮暂不能与 PP 组合」；issue 期望最低修复为 config 加载时拒绝 pp>1 fail-fast'
