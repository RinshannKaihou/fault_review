original:
  mechanism: 'tt-metal 229f9d5336（Wormhole n150，p100a 同样接受不报错）。(1) #61705 ttnn.experimental.nlp_create_qkv_heads 对 WIDTH_SHARDED 输入从 (0,0) 核起读头而非输入分片网格：batch32/head_dim64/bf16/32Q+4KV 头，输入网格 (0,0)-(3,0) 精确；(1,0)-(4,0)、(0,1)-(3,1)、(0,0)-(1,1)、(2,1)-(3,2) 全部返回错误头且无报错。(2) #61650 ttnn.experimental.nlp_concat_heads_decode 接受 HEIGHT_SHARDED+ShardOrientation.COL_MAJOR 输入但按行主序遍历核：[1,16,32,128] bf16 TILE 在 (0,0)-(7,1) 8x2 网格、16 用户、8 头、head_dim 128，ROW_MAJOR 16/16 对，COL_MAJOR 14/16 错（users 1-14）、无校验无报错；姊妹算子 nlp_create_qkv_heads_decode 显式要求 ROW_MAJOR。freq=always。'
  source: 2026-10-20 每日扫描；https://github.com/tenstorrent/tt-metal/issues/61705 ；https://github.com/tenstorrent/tt-metal/issues/61650
  behavior: 用实验性 ttnn 分片 QKV 头拆分/合并算子时，输入分片网格只要不从 (0,0) 开始（nlp_create_qkv_heads），或高度分片方向为列主序（nlp_concat_heads_decode），输出的头/用户行就接错了数据：错误的注意力头或错误用户的行被静默拼进结果，无任何校验报错；标准 (0,0) 行主序网格完全正确。
  trigger_surface: ttnn.experimental.nlp_create_qkv_heads（WIDTH_SHARDED 非零起点/跨行网格）与 nlp_concat_heads_decode（COL_MAJOR 高度分片）
