  mechanism: Ascend950PR（DAV_3510）+ CANN 9.2.0-beta.2 + ops-transformer master（attention/block_attn_res_prepare，目录最近改动 2026-10-23）。aclnn 两段式 C 直调（不经 torch_npu/图模式）。第一段 op_api/aclnn_block_attn_res_prepare.cpp 仅 if(!std::isfinite(eps)||eps<=0.0) 拒绝——资料约束为「必选，必须为有限正数」，1e-40 满足且过校验。实测分界表：1e-6/1e-37/1.2e-38（正规）→ 正常；1.1e-38/1e-40/1e-45（次正规）→ numerator/logitMax/expSum 全 NaN、两段 rc=0；1e-46（收窄为 0）→ 第一段 rc=0 且 ws=0、第二段 561103；eps=0 → 161002。触发输入 blockRes 全 0（资料未禁止）。
  source: https://gitcode.com/cann/ops-transformer/issues/6785（8 档 eps 分界实测表 + 自包含 C++ 复现）
