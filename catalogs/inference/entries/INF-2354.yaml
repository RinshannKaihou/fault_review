original:
  mechanism: 'vllm-ascend SwigluGroupQuant 的 MXFP 输出存储路径：四个连续 packed store 此前用四个独立的剩余列计数器，每个 store 把同一尾部都当有效，可越行覆写相邻行或 UB 缓冲。触发于 Qwen3.8-Next W4A8 MoE：专家中间维 640 在四路 packed 输出存储路径留下不完整最终向量，独立计数器错误标记该组后续 store 为有效，写入越过行边界，导致量化激活错误或不稳定。修复（#20539，closed；v0.32.0rc backport #20540）改为四个 store 共享一个计数器。测试：Ascend 950/CANN 9.2 上 22 例 NPU 回归（tests/e2e/pull_request/one_card/test_swiglu_group_quant_mxfp_tail.py）通过；端到端 Qwen3.8-Next W4A8 GPQA Diamond 90.91%（180/198 全部请求成功）——PR 注明这是含修复的整栈部署验证、非对该修复的孤立精度归因。上游 vLLM commit 544f182d。来源 https://github.com/vllm-project/vllm-ascend/pull/20539（2026-11-01）。'
  source: 2026-11-01 每日扫描。https://github.com/vllm-project/vllm-ascend/pull/20539 ；backport https://github.com/vllm-project/vllm-ascend/pull/20540
  behavior: 在 Ascend 950 上跑 Qwen3.8-Next W4A8 MoE 推理：专家中间维 640 不是 4 的整组宽度时，SwigluGroupQuant 量化激活输出错误或不稳定（MXFP 尾部向量被重复/越界写入），下游量化 MoE 计算随之出错；配置不动、重跑结果可能漂移。修复后同栈 22 例回归与 GPQA 端到端全部通过。
  trigger_surface: vllm-ascend（v0.32.0rc 前版本）；Ascend 950 + CANN 9.2 实测；Qwen3.8-Next W4A8（专家中间维 640）等中间维留下不完整四路 packed 尾向量的 MoE 配置
