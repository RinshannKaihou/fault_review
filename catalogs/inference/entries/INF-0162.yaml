  meta: '`infra_off`（`ttnn.batch_norm` training 模式用**有偏方差**（1/m）更新 `running_var`，从不施加 Bessel 校正 m/(m−1)——`mean_NHW(square(centered))` 直接喂 `running_statistics`，运行统计量随 batch 大小系统性偏低 (m−1)/m） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
