slug: vllm_ascend_pd_stash_overwrite_gqa_draft_kv
aliases: []
title: vllm-ascend PD stash 覆盖致 GQA draft KV 损坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: mooncake_connector stash
  behavior: _stash_pending_reformat 对每 (request_id,shard_idx) 整体赋值，同 shard 分组在不同 pull task 完成时后到覆盖先前，被丢分组以未 reformat 布局被 decode 消费。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: decode TP<prefill TP 时 GQA 组（draft KV，8 KV heads）被丢；目标模型 MLA/indexer 1 KV head 不受影响——损坏对输出监控不可见，仅推测接受长度坍缩。GLM+DSPark 双节点端到端复现。
  visibility: 性能退化
mitigation:
  detect: 监控推测解码接受长度（accept length）按 shard/组拆分；对比 decode TP=prefill TP 基线；检查 stash 覆盖前后 group 数。
  fix: 待定（issue 结构性分析给出合并语义修复方向：stash 按 group 追加合并；main/v0.26rc/v0.30/v0.31.0rc @0bbf9248 均带缺陷）
