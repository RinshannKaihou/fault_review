original:
  mechanism: 'PyNative MoE 同时开启激活重计算、FSDP 与 Expert Parallel 时，重计算 replay 阶段可能报 RuntimeError: Allocated size does not match required size，调用栈在 expert_parallel.py::_build_resort_routing_map -> mint.repeat_interleave(..., output_size=total_tokens)。用 activation-checkpoint invocation id 对首次 forward 与 replay 逐层逐张量配对后，首个差异出现在 DSA Attention 的 linear_qkv(x)：完整 attention 输入与完整 linear_qkv.weight 快照逐元素一致（diff_count=0），但 qkv_combo 已经不同（diff_count=6301、max_abs≈3.1e38），Router 的输入、unshard 权重、logits、routing scores、expert bias 与 TopK indices 均可逐元素一致，说明 Router 不是首个差异点。根因在 Hyper-Parallel 的 hyper_parallel/platform/mindspore/fully_shard/param_group.py 的 ParamGroup.foreach_all_gather_copy_out()：handle.wait() 只等 HCCL all-gather 完成，随后 split_with_sizes_copy(ag_output, metadata.inp_split_sizes, dim=1, out=out) 把从融合 ag_output 到各参数 buffer 的设备拷贝加入执行队列，代码立即调 self.free_all_gather_output() 把源 storage resize 为 0，replay 消费参数时可能读到未完成、已释放或被复用的内容，传播到 K/V、Router 输入与 expert token 计数后触发 EP split 不一致。复现场景 8 卡 32K、PP2+CP2+FSDP2+EP2、full recompute（32 卡 DSV4 亦出现）；A/B：原始实现 26 个 replay tensor 不一致、4 个 rank size mismatch，仅保留 ag_output 不立即 free 后 936 个探针全一致。'
  source: 2026-08-03 GitCode mindspore/mindformers issue https://gitcode.com/mindspore/mindformers/issues/2488 （closed）
  behavior: 开激活重计算 + FSDP + EP 训 MoE 模型，训练跑到一两步就报 Allocated size does not match required size，栈落在 expert_parallel 的 repeat_interleave；同一份 checkpoint 重跑位置会变，开了 training.deterministic=true 和 hcclDeterministic=1 也压不住。把 replay 与首次 forward 的张量配对后能看到 linear_qkv 输出出现 3.1e38 量级的异常值，而输入和权重都逐元素一致——参数看起来对，算出来的东西却不对。
  trigger_surface: PyNative DeepSeek-V4（DSA/MHC/MTP/MoE）+ full recompute + fused FSDP + EP + PP/CP，8 卡 32K，MindSpore 2.10.0 + Hyper-Parallel fed8671b
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
