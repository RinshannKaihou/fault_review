  meta: '`ambiguous` · Cov: `NEW` · 触发 `partial` · 置信度 `verified`'
  mechanism: 当 `max_seqlen_q` **不是 2 的幂**时，`mla_decode_stage1_asm_fwd` 这个 MLA-decode ASM 内核对**所有 query 位置产生完全相同的输出**。无崩溃、无 NaN——唯一症状是每个位置的注意力输出（以及推测解码的接受率）**逐位相等**。
  source: 'ROCm/aiter #2720（OPEN 2026-04-13）。'
  behavior: 生成内容退化（所有位置共享同一注意力结果），推测解码接受率变成常数；服务日志完全干净。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: '**极其独特且廉价**——完全的位置不变性直接导致注意力输出堆叠的 **spectral 秩坍缩（rank collapse）** + 跨位置近零 trajectory 方差。源文档评价其"与所有现有故障正交"，在签名余弦矩阵语境下这意味着它几乎不与任何既有签名共线。族判为 ambiguous 的唯一原因是**触发受长度门控**（仅当 `max_seqlen_q` 非 2 的幂）；一旦触发，它是全目录中最强的 off-manifold 签名之一，spectral 与 trajectory 族均以极大裕度检出，连最廉价的"相邻位置隐藏态差分范数"都能看见。'
  repro: 单钩子实现——在目标层的 `self_attn` 上挂 forward hook（已验证 transformers 5.12.1 eager 路径返回二元组 `(attn_output [B,T,hidden], attn_weights)`），把 `src`（`"last"` 或 `"first"`）指定的那一行广播到全部 T 个位置，`attn_weights` 不动。prefill 可见；decode 步 T==1 时广播退化为恒等，恰与真实内核"按每次 launch 处理的 query chunk 生效"一致。诚实性说明：真实内核是受 non-pow2 `max_seqlen_q` 门控的 MLA decode 内核，此处则是在标准 GQA 层的 prefill chunk 上无条件施加坍缩——可观测量（每个位置的注意力输出完全相等）是忠实的，触发条件未建模。
  locus: layout-backend
  priority: high
