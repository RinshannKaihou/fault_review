  meta: '`infra_off`（DeepSeek-V4.1-Flash（MXFP4 experts + MXFP8 其余、`--kv-cache-dtype fp8_ds_mla`、SM103、DSpark k=5）在 nightly `dc36fcce`→`cd10ed6f` 之间 teacher-forced logprobs 于**短结构化文本**（agent/tool-call 转录、数学、非英语）显著位移：agent 转录类 top-1 翻转率 1.77%→**12.66%**、math/JP/DE 0.00%→9.00%，长 prose 基本不动（75,602 位置仅 1.07%→1.83%）；全语料 perplexity 不变（1.5077→1.5075）**掩盖分布尾部位移**。81-commit 窗口中 7 个 commit 触及 attention/量化/deepseek 路径，社区源码核查指向 **#56893（V4.1 KV 记录改 MXFP8：`kv_bytes_per_token` 584→528、`kv_page_alignment` 576→512——全 512 维含 RoPE 按 fp8 存）** 正中该配置；报告者附本地 MoE 迁移 hook（两 rung 相同、不能解释差异、未做无 hook 复现）） · Cov: `var:vllm_nvfp4_kv_cache_hnd_layout_probe_inversion`（8.53 KV 存储格式变更数值位移族——本条在 KV 记录 MXFP8 化维度） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: KV 记录从 fp8(scale)+原生 RoPE 混合改为全维 MXFP8 改变了 RoPE 通道的量化路径——长 prose 的 logprob 对该量化噪声平均不敏感，但短高置信位置（tool-call 分隔、数学符号、非英语 token）的 top-1 排序在位移下翻转；prefill-only 方法（max_tokens=1 + prompt_logprobs）排除了 DSpark drafter/accept 循环参与。
  source: 'vLLM #58391（2026-09-23 open，含 39 文档 79,544 位置逐位对比表（四类文本 × 双 nightly）、81-commit 窗口 7 候选清单与 #56893 代码 diff 定位、hook 恒等性 caveat）。https://github.com/vllm-project/vllm/issues/58391'
  behavior: 无 crash——**结构化/工具调用文本的 logprob 分布静默位移**（top-1 翻转率 12.66%），perplexity 级监控恒绿；agent/工具调用管线的确定性（temperature=0 重放一致性）在版本升级间被破坏，A/B 评测与蒸馏数据质量受影响。
  trigger_surface: vLLM nightly cd10ed6f 及后 + DeepSeek-V4.1-Flash + `--kv-cache-dtype fp8_ds_mla`（hw_specific：SM103 报告、GB300）
