  meta: '`infra_off` · Cov: `NEW` · 触发 `yes` · 置信度 `documented`'
  mechanism: 在 `SlidingWindowCache`/`HybridCache._sliding_update` 中，守卫条件 `to_shift = cache_position >= max_cache_len - 1` 在 `seq_len` 首次达到窗口时提前一步触发，缓存还没填满就被 `torch.roll` 平移，把较旧的 token 移出窗口并在某个槽里留下未初始化的零。上游修复是把 `>=` 改成 `>`。
  source: 'transformers #37574。'
  behavior: 长上下文解码中窗口边界附近的注意力被破坏；一旦 `seq_len` 越过 SWA 窗口，被清零的 K/V 槽加上错位一格的旧 token 会持续劣化生成。
  trigger_surface: 原可复现；CUDA+vLLM 下仍可软件构造
  signature: '`infra_off` —— 在 `seq_len == window` 处出现尖锐不连续：恰好一个 KV 槽为零（硬性的流形空洞），相邻槽整体平移一位，于是 decode query 在「前一个位置的 rotary 相位」下读取每个窗口位置的内容。可捕获的是 geometric 族的逐位置 KV 范数 / 零槽检测器（零槽是所有度量里最便宜的强信号）与 trajectory 族的局部跳变；spectral 族基本无响应（单槽置零几乎不动谱），infotheoretic 族只能通过注意力分布的边界畸变间接看到。'
  repro: '参考实现参数 `{L: 8, window: 16}`。在全注意力 + DynamicCache 路径上直接复现 roll 的**末态**：prefill 后在单层 L 就地（等长、逐层安全、无需跨层长度一致）把最后 `W = min(window, T)` 个位置的 K/V 左移一位并把最后一个槽清零，`window < 2` 报错（至少需要一个被平移的槽加一个被清零的槽）。'
  locus: index-position
  priority: high
