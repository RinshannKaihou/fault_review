id: INF-2023
legacy_ids: []
slug: sfa_dispose_kv_b_proj_breaks_weight_sync
aliases: []
title: SFA 层 dispose(kv_b_proj) 致在线权重同步失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: vllm
    component: AscendSFAImpl 后处理
  behavior: process_weights_after_loading 推导 W_UK_T/W_UV 后 dispose kv_b_proj.weight 成空张量（shape [0]），参数仍注册，之后 load_weights 无合法目标存储
effect:
  objects:
  - 模型权重
  detail: VERL 推送更新后的 kv_b_proj.weight 时命中 param_data.shape == loaded_weight.shape 断言（目标 [0]、来源 [7168,512]），在线同步中断，rollout 停在旧权重
  visibility: 报错
mitigation:
  detect: load_format=dummy 启动后检查 named_parameters 中 kv_b_proj.weight 的 shape 是否为 [0]；再调一次 load_weights 推真实权重看是否断言
  fix: 待定（issue 建议仅在显式关闭 live reload 时才 dispose，并引入 weight_transfer 能力开关；未附 PR，未核实）
