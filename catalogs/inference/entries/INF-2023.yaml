original:
  mechanism: 'vllm-ascend issue 15463（2026-09-01，closed）。vllm_ascend/attention/sfa_v1.py:610-611（commit e8f47fc1）里 AscendSFAImpl.process_weights_after_loading() 从 kv_b_proj 推导 SFA 内核权重 W_UK_T/W_UV 后调 dispose_layer(kv_b_proj)；dispose_layer 执行 x.set_(torch.empty((0,), ...))，TP-local 参数从 [7168, 512] 变成 [0]，但参数名仍由 named_parameters() 暴露。VERL 从 Megatron actor 推送更新后的 kv_b_proj.weight 时，vLLM 能按名解析到参数，column-parallel loader 却无法把 [7168,512] 的分片写进空存储，命中 AssertionError: param_data.shape == loaded_weight.shape。issue 指出该假设只对纯推理成立，并给出保留该参数的内存代价约 7168×512×2 B = 7 MiB/层。'
  source: 2026-09-01 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15463 （closed）
  behavior: 用 VERL 跑 GLM-5.2 的 RL、rollout  worker 以 load_format=dummy 起服务时，训练侧把新权重推过来会直接报维度断言失败，kv_b_proj 的目标张量已经是空壳（shape [0]），整条 Megatron→vLLM 在线权重同步就断在这里；如果没人推权重，服务本身看起来一切正常。
  trigger_surface: SFA 模型（GLM-5.2 等）+ VERL 实时权重同步 + load_format=dummy
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
