pattern: PAT-INF-0184
original:
  mechanism: 'torchair 的 experimental/_inductor_npu_ext/python/inductor_npu_ext/compiler/_autotune.py 在 profiler 计时阶段，c_args = [_to_ctypes_arg(arg) for arg in args]，而 _to_ctypes_arg 返回 c_void_p(arg.data_ptr())，随后逐个候选执行 wrapper_func(*c_args, c_void_p(0), kernel_key)。list(args) 只是浅拷贝：列表是新的，张量仍指向同一块显存。当候选 kernel 为原地算子（in-place 修改输入）时，计时过程中会写穿调用方真实输入缓冲区：(1) autotune 结束后真实输入已被污染，后续正式执行读到错误数据，表现为精度异常；(2) 计时循环在已被修改的数据上重复执行，各候选的对比数据不一致，选优结论也不可信。同类保护在编译期 real run 已存在——cpp_wrapper.py 对 mutated_inputs 使用 clone_preserve_strides——但 autotune 计时路径遗漏了。修复方案为计时阶段给所有 Tensor 输入建私有副本（clone_preserve_strides，保留 stride/内存布局），每轮计时前从留底副本恢复，非 Tensor 参数仍按原 ABI 传递。关联 PR：master #3760、26.2.0 #3761。'
  source: 2026-09-23 GitCode Ascend/torchair issue https://gitcode.com/Ascend/torchair/issues/833 （closed，关联 PR https://gitcode.com/Ascend/torchair/pull/3760 、https://gitcode.com/Ascend/torchair/pull/3761 ）
  behavior: 开了 TopN autotune 之后，同一个模型第一次跑（编译+选优那次）输出就和 eager 对不上，常见是某些位置的值偏大或出现异常数值，重跑或用 TOPN=1 又正常；因为污染发生在编译期计时阶段，业务代码里的输入变量被悄悄改掉，排查时很难想到是 autotune 干的。
  trigger_surface: TORCHINDUCTOR_NPU_EXT_AUTOTUNE_TOPN>1 + 选中候选 kernel 含原地写输入（in-place）行为
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
