id: INF-1604
legacy_ids: []
slug: torchair_autotune_shallow_copy_writes_through_input
aliases: []
title: TopN autotune 计时写穿真实输入致精度异常
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: inductor ext autotune 计时
  behavior: _autotune.py 用 list(args) 浅拷贝后把真实张量的 data_ptr 直接传给候选 kernel，候选为原地算子时在计时阶段改写调用方输入缓冲；编译期 real run 已有的 clone 保护未覆盖此处。
effect:
  objects:
  - 数值结果
  detail: TORCHINDUCTOR_NPU_EXT_AUTOTUNE_TOPN>1 且选中候选 kernel 含原地写输入（in-place）行为时，autotune 结束后真实输入已被污染，正式执行读到错误数据、精度异常；各候选还在被改写的输入上计时，选优不可信。
  visibility: 静默错误
mitigation:
  detect: 对比 TORCHINDUCTOR_NPU_EXT_AUTOTUNE_TOPN=1 与 >1 的输出；或 autotune 前后对输入做 clone 比对
  fix: 已有关联 PR：master https://gitcode.com/Ascend/torchair/pull/3760 、26.2.0 https://gitcode.com/Ascend/torchair/pull/3761 （计时阶段为 Tensor 输入建 clone_preserve_strides 私有副本并按轮恢复）；issue closed，合入与发布未核实
