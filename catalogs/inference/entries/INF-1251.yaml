  trigger_surface: llama.cpp 专用
  signature: 语义上 off-manifold——状态被拉向一个外来前缀所定义的簇，与 `radix_kvcache_cross_contamination` 具有相同的可检测签名。捕获者：trajectory 与 geometric（相对「用本请求真实前缀重算」的参考做逐位置余弦/方向比对）、cheap（recompute-oracle）。漏检者：所有无参考的单点指标——被污染的 K/V 本身是模型在另一段合法文本上产生的健康激活，范数、谱、熵都落在健康范围内，statistical / spectral / infotheoretic 只看当前前向时看不到任何异常。门控条件：需要一个先前请求在同一槽上留下 KV。
  repro: 单 hook 前缀拼接——抓取另一条无关 prompt 在第 L 层的前缀 K/V，在目标 prompt 前向时用 `self_attn` pre-hook 覆盖对应前缀位置的 cached K/V。与 K4.1 的区别在于污染源是「另一段文本」而非「另一套权重」。
  locus: '`cross-request`'
  priority: '`low`'
