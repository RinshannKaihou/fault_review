original:
  mechanism: SGLang /update_weights_from_disk 在 checkpoint 含模型不认识的视觉权重名时返回 success:true。Qwen3_5ForConditionalGeneration.load_weights（python/sglang/srt/models/qwen3_5.py:2391，main a50c17e979）回退分支（:2463-2474）：未知名以 .bias 结尾→无日志跳过（注释称给额外 GPTQ bias）；其余未知名→打一行 'Parameter <name> not found in params_dict' 后跳过。load_weights 不汇报跳过名或未加载参数，weight_updater 随后返回 True,'Succeeded to update model weights.'（model_runner_components/weight_updater.py:256）。RL 训练循环中 trainer 把权重转 HF 名后经此调用加载：vision tower 名转换错误时引擎一直用旧视觉权重，更新报成功；.bias 情形完全无痕。复现：sglang f7ea06e1（sglang-miles-v0.5.15-final）单 GPU，两份 Qwen3.5-0.8B 副本（zeroed/ 改 model.visual.merger.linear_fc2.{weight,bias} 值）实测更新后值未变且报成功；main 未复测但代码相同（:1763-1774 / model_runner.py:1979）。
  source: 2026-10-17 GitHub sgl-project/sglang issue https://github.com/sgl-project/sglang/issues/44504（open，1 评论；源码行号+复现脚本）
  behavior: 对 Qwen3.5（视觉模型）调用 /update_weights_from_disk 更新权重时，如果 checkpoint 里有权重名模型不认识（典型：RL trainer 做 HF 名转换时 vision tower 名字转错），引擎会直接跳过这些权重继续用旧值，但接口照样返回 success:true 'Succeeded to update model weights.'。以 .bias 结尾的未知名连一行日志都不打，其他未知名只有一行容易被刷过去的 warning。服务表面上一切正常，实际视觉塔还是旧权重。
  trigger_surface: /update_weights_from_disk + 多模态模型权重名不在 params_dict（名转换错误/格式变化）；qwen3_5.py 路径实测
  discovery: 2026-10-17 每日扫描
