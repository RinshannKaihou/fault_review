id: INF-1747
legacy_ids: []
slug: ops_nn_index_add_arch22_uint32_n_wrap
aliases: []
title: aclnnIndexAdd arch22 以 uint32 承载 N 致静默漏算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: IndexAdd arch22 tiling
  behavior: arch22 tiling 与 kernel 用 uint32 承载 M/N/K，N 是 var 尾维乘积；N≥2^32 时回绕成 N mod 2^32，内核只搬入并回写前 N' 个元素。
effect:
  objects:
  - 数值结果
  detail: 910_93 + CANN 9.2.0、FLOAT [1,N]：N=2^32+3 时只有前 3 个元素被累加、其余 4294967296 个漏算；N=2^32 时 N'=0，全部未累加；r2=0、sync=0。
  visibility: 静默错误
mitigation:
  detect: 构造 var 尾维乘积 ≥2^32 的 FLOAT 用例，采样首尾与 2^k 位置元素；小 shape 用例与 arch35 对照都发现不了。
  fix: 待定（issue open，未给修复 PR）：建议 inplaceScatterAddSupport 拦截元素数 >2^32 走 fallback，arch22 tiling 升 uint64 对齐 arch35。
