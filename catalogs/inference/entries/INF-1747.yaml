original:
  mechanism: cann/ops-nn issue 6309（2026-09-29，open）：Ascend910_93（DAV_2201）、CANN 9.2.0、ops-nn 基线 fed553be、C 直调 aclnn 两段式接口、FLOAT、dim=0、alpha=1.0、deterministic=0。aclnnIndexAdd 的 arch22 InplaceScatterAdd 在 op_host/arch22/inplace_scatter_add_tiling.cpp:30-33 以 uint32 承载 M/N/K/NAligned，:107-109 做的 N 累乘在 uint32 域回绕，:131-136 用回绕后的 N 算 NAligned 与 tilingKey；tiling 结构体 inplace_scatter_add_tiling.h:21-24 落盘 uint32，kernel 侧 inplace_scatter_add_base.h:129-133 与 inplace_scatter_add_small_tail.h:86/99/111/114 按 N*sizeof(VT) 搬运回写。arch35 对照实现已是 64 位。实测 N=4294967299 时 out[0..2]=1.0、out[3]/out[1<<28]/out[N-1] 均 0.0；N=4294967296 时全部 0.0。
  source: 2026-09-29 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/6309 （open）
  behavior: 在 910_93 上用 arch22 通路做就地 index_add，张量元素数达到 2^32 量级后只有开头极少数元素被真正累加，其余全部保持原值：接口返回成功、流同步成功、设备与主机都没有任何报错，采样输出看到的是大片“没算”的零值，很容易被当成数据准备错误。
  trigger_surface: aclnnIndexAdd arch22 + 元素数 ≥2^32 的大张量
