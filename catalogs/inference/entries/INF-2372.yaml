original:
  mechanism: 'vLLM-Ascend 310P（v0.23.0.post1，CANN 9.1.0、torch-npu 2.10.0.post4）上 Distill Qwen-1.5B FP16 生成错误答案，eager 与 ACL Graph 一致地错，独立 FP32 profiling 定位根因：未掩码 QK 分数达约 31 万（GSM8K 6 提示/168 层实测最大 322143.90625），超出 FP16 上限 65504，在常规 attention scale 之前就溢出。修复 PR #20595 对 310P 未量化 Qwen2 FP16 路径把 Q 预乘 1/8 并在 prefill/decode/splitfuse 补偿 attention scale，缓存 KV 与调用方张量不变。验证：修复+默认多进程 30 eager + 1000 graph 请求交替 batch（4/1/3/2×32 token）全部 32960 token 与独立 CPU FP32 参考精确一致；GSM8K 168 层缩放后 FP16 范围外值清零；scale-one 负对照 4 条 CPU FP32 参考序列全不匹配（证明溢出是根因）。另附受影响 Distill Llama/Transformers 5 组合的 tokenizer 兼容工具。范围声明：仅 Qwen-1.5B 与 Llama-8B、TP1 验证，更大变体与其他拓扑未验证；缩放因子有代表性 checkpoint 与输入上的覆盖，非任意 prompt 的普适数值界。'
  source: 'https://github.com/vllm-project/vllm-ascend/pull/20595（Refs #10668、#9079）'
  behavior: 在 310P 上以 FP16 跑 Distill Qwen-1.5B 推理时，生成答案错误：模型正常出字、不崩溃、logits 无 NaN，但答案与 FP32 参考不一致（scale-one 负对照与 4 条 CPU FP32 参考序列全不匹配）。GSM8K 实测未掩码 QK 分数最高约 32.2 万，远超 FP16 上限，长上下文/高激活 prompt 更易触发；用户只看到输出质量无解释地差。
  trigger_surface: vLLM-Ascend v0.23.0.post1（修复 open 未发布）；310P3 TP1；未量化 Qwen2 FP16（含 Distill Qwen-1.5B，Llama-8B 另测）；未掩码 QK > 65504 的输入；CANN 9.1.0
  discovery: 2026-11-02 每日扫描
