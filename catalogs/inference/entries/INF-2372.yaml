  fix: 修复 PR https://github.com/vllm-project/vllm-ascend/pull/20595 （open，未发布）：未量化 Qwen2 FP16 310P 路径 Q 预乘 1/8 + 各路径补偿 scale；缓存 KV 与调用方输入不变；附溢出/回归/重放测试与部署指南；覆盖限 Qwen-1.5B/Llama-8B TP1，更大变体未验证
