  mechanism: 开启 RadixCache 前缀共享时，若**同一批次**中某个重复 prompt 的 KV 由兄弟条目提供，推测 draft model 就会读到被损坏的上下文，发出错误的 `topk_index` 提议。复现：一个 batch 内放入相同的 prompt，第一个的提议正确、重复的错误；`disable_radix_cache=True` 可修复。
  source: 'SGLang #8726。'
  behavior: 批次内重复 prompt 的推测提议错误、接受率骤降甚至输出错误，而单独发送同一 prompt 完全正常。
  trigger_surface: 推测解码/CUDA graph：vLLM 可开，需接受率与 batch 场景
  signature: infra_off，但**受 batch 组成门控**（只有同批出现重复 prompt 时才触发）。触发时在重复位置处离流形：受害者的隐藏态签名与**错误的前缀捐赠者**对齐，属 cross-orthogonality / 签名余弦矩阵族的典型目标。与 `radix_kvcache_cross_contamination` 的区别在于它经由批内前缀复用污染的是 **draft 提议路径**。会漏检：单序列自比对指标与 batch-invariance 探针以外的 cheap 探针。
  repro: （源文档未给出 Inject 字段；方案）在 batch ≥ 2 且含相同 prompt 的解码路径上，用 KV 钩子把重复行的前缀 K/V 替换为兄弟行的对应片段（跨 batch 行拷贝），制造"由错误兄弟条目供给前缀"的效果；因单序列路径无 radix 树，只能近似，故为 partial。
  locus: control-flow
  priority: low
