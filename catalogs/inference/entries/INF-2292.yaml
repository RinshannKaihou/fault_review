original:
  mechanism: 'cann/ops-math aclnnSignbit 在 Atlas A2（910B3，CANN 9.2.0，master 9a37afeb）上对 self=-0.0 返回 False（issue #4306 实测）。资料 math/signbit/docs/aclnnSignbit.md 功能说明为「判断符号位是否为 1」，计算公式注明「当 self_i 为 -0 时，返回 True」。实测 self=[-0.0,+0.0,-1.0,+1.0]（double）out=[0,0,1,0]，-0.0 应为 1；self=-NaN（符号位为 1）同样返回 False；fp32/fp16/bf16/fp64 四种 dtype 表现一致；GetWorkspaceSize 与 Signbit 两段均返回 0 静默错值。同机 torch CPU signbit(-0.0)=True、torch NPU False（同一缺陷暴露面）。机理推断（报告者据现象归纳）：实现按 self<0 比较而非读符号位，-0.0 不小于 0 故返回 False。WIP 修复 MR !6907「signbit: preserve floating-point sign bits in the fallback path」方向一致，未合入未核实内容。'
  source: GitCode issue https://gitcode.com/cann/ops-math/issues/4306 （open，2026-10-30 创建；含位模式构造复现与 torch CPU/NPU 对照）；修复 MR https://gitcode.com/cann/ops-math/merge_requests/6907 （open WIP）
  behavior: 调用 aclnnSignbit 判断符号位：输入 -0.0 时返回 False，而资料和 torch CPU 都要求返回 True（-0.0 符号位是 1）；-NaN 同样被误判为 False；+0.0/±1.0 正常。fp32/fp16/bf16/fp64 全部受影响，接口不报错，依赖符号位做分支的数值代码（如区分正负零的除法前检查、符号传播逻辑）会走错分支。
  trigger_surface: cann/ops-math signbit；-0.0 与符号位为 1 的 NaN；全部浮点 dtype；Atlas A2。
  signature: signbit(-0.0)=False（应 True）；signbit(-NaN)=False。
  repro: issue 附位模式构造 repro（0x8000000000000000ULL 等）与实测输出。
  discovery: 2026-10-30 每日扫描
