original:
  mechanism: msprobe 的 pytorch_processor 在采集 fp8/fp4 tensor 时 tensor.clone() 报错，工具与 adapter 层给出的临时方案是按 UINT8 保存：float4_e2m1fn_x2、float8_e8m0fnu、float8_e4m3fn 都先 .view(torch.uint8).clone() 再落盘。数据确实写进了 dump.json（例如 NPU.npu_grouped_matmul.42 的 x 记为 torch.float4_e2m1fn_x2、shape [29,1024]），但复算阶段按记录的类型重放算子时，weight[8192] 与 scale[4096] 的 n 维对不上，报 AclNN_Parameter_Error(EZ1001) 'The n dim of weight[8192] and n dim of scale[4096] should be equal'，CheckMxTypeMCaseInputShape/CheckGroupedMatmulMxShape 失败。即 dump 阶段的类型替换让 acc_check 无法还原原始输入布局。
  source: 2026-08-17 gitcode.com issue https://gitcode.com/Ascend/msprobe/issues/272 （closed）
  behavior: 用 msprobe 采完 fp8/fp4 模型的数据，dump.json 看起来有完整张量；跑到 acc_check 时 grouped_matmul 这类算子直接报维度不相等，比对结果里这些算子只有错误没有结论，等于量化模型最关键的 mx 类型算子全都没被验证。
  trigger_surface: msprobe L1 tensor dump + acc_check，模型含 fp8/fp4（mx 类型）算子
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
