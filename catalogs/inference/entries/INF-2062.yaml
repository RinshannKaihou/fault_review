id: INF-2062
legacy_ids: []
slug: msprobe_fp8_dump_uint8_acc_check_broken
aliases: []
title: msprobe uint8 存 fp8 dump 致 acc_check 失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: msprobe dump dtype 保存
  behavior: msprobe 采集 fp8/fp4 tensor 时 clone 报错，改为 view(uint8) 存盘；dump 的 dtype 与真实输入不一致，acc_check 复算时 weight/scale 维度对不上。
effect:
  objects:
  - 测试判定
  detail: acc_check 报 'The n dim of weight[8192] and n dim of scale[4096] should be equal'，该算子的精度比对无法完成；凡 input/output 为 fp8/fp4 的算子，在 acc_check 里等于没有覆盖。
  visibility: 报错
mitigation:
  detect: 对含 fp8/fp4 算子的模型开 L1 tensor dump 后跑 acc_check，先看 dump.json 的 dtype 字段是否与算子实际输入一致
  fix: 待定（报告只给出 uint8 临时存盘方案；修复应以原生 dtype 保存或让 acc_check 按记录的类型还原后再复算）
