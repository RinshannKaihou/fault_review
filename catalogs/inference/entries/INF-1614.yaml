slug: msmodelslim_layer_wise_calib_isinstance_always_false
aliases: []
title: 逐层校准 isinstance 条件恒假，校准被静默跳过
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: pytorch
    component: llm_ptq layer_wise_calib
  behavior: layer_wise_calib 用 and 连接两个 isinstance 判断，两个量化器类互不为子类，条件恒假，逐层校准循环体一次都不执行。
effect:
  objects:
  - 模型权重
  - 数值结果
  detail: 走 layer_wise_calib 的逐层校准实际不校准，量化参数退回未校准默认值；不报错、不打日志，只在端到端评测上表现为精度劣化。
  visibility: 质量退化
mitigation:
  detect: dump 校准前后每个 LinearQuantizer/Conv2dQuantizer 的激活与权重 scale，若两次完全一致即说明循环体没执行；现有单测用 MagicMock 只断言不抛异常，覆盖不到该分支
  fix: issue closed；正文建议 quant_modules.py:620 的 and 改成 or，未核实修复 commit 与发布版本
