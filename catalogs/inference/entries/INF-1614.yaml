original:
  mechanism: 'msmodelslim commit 0ef9aaa569d2a36aa5c3884778ffb85d8d58914d（2026-08-28）：msmodelslim/pytorch/llm_ptq/llm_ptq_tools/quant_modules.py:615 的 layer_wise_calib 在 :620 用「if not (isinstance(module, Conv2dQuantizer) and isinstance(module, LinearQuantizer)): continue」过滤待校准模块，而 :334 的 LinearQuantizer 与 :453 的 Conv2dQuantizer 都直接继承 nn.Module，不存在同时满足两个 isinstance 的对象，条件恒为 False、not(...) 恒为 True，:622-:625 的 _layer_wise_activation_calib / _layer_wise_weight_only_calib 每轮都被 continue 跳过，函数等价于只做 .to(_OFFLOAD_DEVICE) 搬运。报告者在 0ef9aaa5 上逐行核对，未实机跑量化流程，「精度劣化」为静态推断；仓内单测对该函数使用 MagicMock 且只断言不抛异常，覆盖不到该分支。建议修改为 or。'
  source: 2026-08-29 GitCode Ascend/msmodelslim issue https://gitcode.com/Ascend/msmodelslim/issues/503 （closed）
  behavior: 量化配置只要走到 layer_wise_calib：量化流程照常跑完、权重正常导出、日志里没有任何异常，但逐层激活/权重校准根本没发生，量化参数用的是未校准默认值，最终只在评测分数上看出精度下降，定位成本很高；确认需要 dump 校准前后的 scale 做比对。
  trigger_surface: 量化配置命中 layer_wise_calib 逐层校准路径（quant_modules.py:615）；不依赖硬件、dtype 或模型
