original:
  mechanism: 'Triton issue #12369（c2026-10-19）：Hopper 上 warp_specialize=True 把 tile 分给两个 consumer warp group（如 BLOCK_M=128 + num_warps=4）时，第二 consumer 计算的每 tile 64~127 行被存到 128~191 行。机制：descriptor 访问只携带块起始坐标，pass 给第二 consumer 的副本 off_m + 64；指针访问携带每行偏移（off_m + tl.arange(0,128)）且 pass 已把该 arange 切片到 [64,128)；但 sliceOp 把 off_m -> off_m+64 记录进所有为第二 consumer 克隆的 op 共享的映射，指针偏移因此加两次 64。复现（单 program、descriptor load + pointer store、控制组 warp_specialize=False）：False 时 C 的 128 行全部正确写入；True 时行错位写出 tile 边界（192 行缓冲的 guard 区被写入）。'
  source: 2026-10-19 GitHub triton-lang/triton issue https://github.com/triton-lang/triton/issues/12369 （open）；同题相邻 https://github.com/triton-lang/triton/issues/12370 （open）
  behavior: Hopper 上开 warp_specialize 的 Triton kernel，如果 tile 行被拆到第二个 warp group、且同一行偏移同时用于 tensor descriptor 读取和指针写入，输出的后半行整体错位存到 64 行之外的位置，等于把结果写坏到邻近内存，全程无报错。
  trigger_surface: Triton main Hopper + warp_specialize=True（tile 分两个 consumer warp group）+ descriptor 访问与指针访问共用行偏移变量
  discovery: 2026-10-19 每日扫描
