original:
  mechanism: 'MindSpore 2.10.0（cp311 aarch64 wheel，commit 2d550373）+ Ascend 910B3 + CANN 8.5.1，PYNATIVE_MODE：CustomV2AclnnKernelMod（Gitee PR #84266 引入）的 CustomAclnnHash 只用 shape/标量值做 key、不含 tensor 地址，Launch 时 UpdateTensorForLaunch 只刷新 tensor 地址，输出设备缓冲没有清零。用入度统计类 kernel（tensor_scatter_add 语义、原子加写输出、只写有边节点）复现：n=1000、e=5000，同一 op 实例连续调用 5 次，iter0 maxdiff=0.000、iter1=14.000、iter2=28.000 递增，缓冲回收后回到 0；新建实例首次调用正确，2.9.0 无此问题。PR #89735 只修 aclnn cache 多输入/hash id=0 场景，不涉及输出清零。同 issue 的现象 1（aclnnCustom 符号 not in libopapi.so）是直接抛 RuntimeError，本条目只取现象 2。'
  source: 2026-08-28 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29644 （open）
  behavior: 自定义的高阶/图算法算子在 Cell 里反复调用时，输出一次比一次大（每次多累加一遍），整型计数类结果越跑越离谱；因为不报错、形状也对，只有和 tensor_scatter_add 参考值比对 maxdiff 才能发现，重启进程或换新实例又恢复正常。
  trigger_surface: Ascend 910B3 + CANN 8.5.1 + MindSpore 2.10.0 PYNATIVE；ops.Custom(func_type="aot") 带标量 attr 走 CustomV2AclnnKernelMod；kernel 语义为累加进输出（原子加/只写有边节点）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
