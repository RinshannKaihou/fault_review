  - 数值结果
  detail: MindSpore 2.10.0+Ascend 910B3+CANN 8.5.1 PYNATIVE，入度统计类累加 kernel 同一 op 实例连续调用 5 次，maxdiff 0/14/28 递增；缓冲回收后回 0，新建实例首次正确，2.9.0 无此问题。
