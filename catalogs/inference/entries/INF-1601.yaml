  detect: 同一自定义算子实例连续多次调用并逐次与参考实现比对 maxdiff；漂移随调用次数线性增长即为输出缓冲未清零
  fix: 待定（issue open）；方向：v2 路径 Launch 前清零输出，或显式声明 accumulate/inplace 语义
