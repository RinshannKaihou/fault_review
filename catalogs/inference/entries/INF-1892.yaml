id: INF-1892
legacy_ids: []
slug: vllm_ascend_dspark_loader_overwrites_draft_head
aliases: []
title: DSpark 加载顺序用 target 权重覆盖 draft 头
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: vllm
    component: DSpark draft head/HC 加载
  behavior: load_weights() 把 target 顶层 head/embed/HC 与 mtp.* 草稿键映射到同一参数，target 键后到即覆盖已训练的 draft 头，结果依赖分片加载顺序。
effect:
  objects:
  - 模型权重
  - 输出分布
  - 性能/资源
  detail: 多分片/多线程加载导致 target 键晚于 MTP 键到达时，草稿头与 HC 被替换；日志无权重加载错误，验证器仍拒绝错误提案，请求输出正确，但接受长度从约 5.1 塌到 1.1、C1 纯 decode TPOT 从 12.2ms 升到 48.7ms。
  visibility: 性能退化
mitigation:
  detect: 用最小 CPU 复现脚本按 mtp-first / target-first 两种顺序调用 load_weights，检查 lm_head 是否保留 7.0；线上观察接受长度
  fix: 记录已由 mtp.* 加载的目标参数、忽略后续 target 回退，仍允许后续 MTP 张量覆盖（issue 提议，open）
