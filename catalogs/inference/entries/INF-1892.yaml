original:
  mechanism: vLLM 0.28.0（commit 2cf0a691）与 vllm-ascend commit 44f9bf53、CANN 9.1.0、2 台 8×910B3、TP8、DSpark K=7（draft eager、target FULL_DECODE_ONLY、EP 开关均复现）下，DSparkDeepseekV4ForCausalLM.load_weights() 把 target checkpoint 顶层 head/embed/HC 键与 mtp.* 草稿键映射到同一目标参数；当 target 键晚于 MTP 键到达时静默覆盖已训练的 draft 参数。最小复现中 mtp.2.head.weight 与 head.weight 都映射到 lm_head.weight，draft_first=True 时最终值为 1.0 而非期望 7.0；真实模型上 8 个 draft-head 分片及 draft HC 参数与 checkpoint 不符。验证器仍拒绝错误提案，因此请求可成功但投机收益大部分丢失。
  source: 2026-09-21 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17094 （open）
  behavior: DSpark 投机解码的接受长度从约 5.1 塌到 1.1，C1 纯 decode TPOT 从 12.2ms 升到 48.7ms；生成内容仍正确，日志无权重加载错误，只有性能与接受率异常。
  trigger_surface: DeepSeek V4 DSpark + 多分片/多线程权重加载（加载完成顺序变化）
