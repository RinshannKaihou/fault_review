id: INF-1966
legacy_ids: []
slug: npu_sdpa_math_backend_selection_ignored
aliases: []
title: NPU 上 SDPBackend.MATH 指定不生效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: SDPA 后端选择
  behavior: GPU 侧用 switch(backend) 选实现，NPU 侧只按参数类型与信息选，SDPBackend.MATH 指定不生效，MATH 后端里按允许低精度归约标志升精度的分支也就不会执行。
effect:
  objects:
  - 数值结果
  - 测试判定
  detail: 高精度标志为 False（关闭高精度）时 NPU 的 bf16 结果仍与 float64 接近，与用例语义相反；NPU 不支持 double 自动降 float32，也拿不到高精度标杆。
  visibility: 静默错误
mitigation:
  detect: 分别用 SDPBackend.MATH 与默认后端跑同一 bf16 q/k/v，翻转 allow_fp16_bf16_reduction_math_sdp 看结果是否变化；NPU 上不随标志变化即为命中
  fix: 待定（issue 已 closed，正文给的是根因分析，未给修复 PR）
labels:
  family: infra_off
  trigger: config
  trigger_review: false
  trigger_note: FrameworkPTAdapter 7.2.RC1.B080 + CANN 8.3.RC1.B080；SDPBackend.MATH + allow_fp16_bf16_reduction_math_sdp 开关对照
  stage: N/A
