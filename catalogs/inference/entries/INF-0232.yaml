original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（**验证面失效**：`ttnn.selu` 的注册 golden `_golden_function_selu`（`ttnn/operations/unary.py`）直接调 `torch.nn.functional.selu(input)`——后者**根本没有 `scale`/`alpha` 参数**（硬编码典范常数），调用方传的参数落进 `*args/**kwargs` 被丢弃：golden 对 `scale=3.0, alpha=2.0` 与 `scale=0.5, alpha=0.1` 返回**逐位相同**的标准 SELU 张量。而 `scale`/`alpha` 是活的文档化参数（`unary_nanobind.cpp:1999` `nb::arg("scale")=1.0507f`、`nb::arg("alpha")=1.67326f`），经 `DEFINE_UNARY_OP_WITH_TWO_FLOAT_PARAMS` 真实穿入设备内核（`ckernel_sfpu_selu.h`）。结果：设备输出与 golden 偏差最高 **3416%** 而 **PCC>0.99 恒过**——相关性门禁对整体幅度类参考错误结构性失明） · Cov: `var:ttmetal_is_real_is_imag_goldens_call_nonexistent_torch_api`（1.180 验证层失效族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: golden 参考实现与被测 op 的参数面失配——golden 调用的 torch API 不支持 op 暴露的 kwargs，签名差异被 `**kwargs` 静默吸收而非 TypeError。golden 永远计算"标准常数 SELU"，sweep 因此验证的是**错误的参考**而非错误的方向；PCC 对"形状正确+幅度错误"的缩放类分歧天然钝感。
  source: 'tt-metal #57116（2026-09-20 open，"Bad Outputs"，含 golden 源码、nanobind 参数声明、内核 SFPU 实现三方对照与恒等输出证据）。https://github.com/tenstorrent/tt-metal/issues/57116'
  behavior: 无 crash——危害是**验证真空 + 门禁假阴性**：设备侧 SELU scale/alpha 处理的任何回归（乃至当前错误）都不会被 golden sweep 发现，且 3416% 的实际偏差在 PCC 门下恒绿。与 1.234（同日、六归约 golden 吞 `scalar=`）构成 **golden kwargs 吞噬姊妹对**：本条是单 op 手写 golden 签名错，1.234 是工厂签名缺陷批量放大到六个 op——两者共同给出「PCC 门禁对仿射幅度类参考错误原理上不可见」的最强实证（1.180 golden 从未跑过、1.135 parametrize 不可达之后验证层失效谱系的两端：炸不出声 vs 恒绿）。
  trigger_surface: tt-metal sweep/CI + 任何带非默认 scale/alpha 的 `ttnn.selu` 调用（hw_specific：CI 门失效）
  discovery: 2026-09-20 每日扫描。
