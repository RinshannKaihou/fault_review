title: PD 分离 PP=4 首请求特定 prompt 输出乱码
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: PP或ascend_direct首请求链路
  behavior: 在PD分离、Prefill PP=4、use_ascend_direct=true下，服务拉起后首个特定261-token prompt请求输出乱码；根因未定位
effect:
  objects:
  - 输出内容
  - KV状态
  detail: 首请求返回与 prompt 无关的随机英文（'The is a simple command-line tool...'），finish=length；后续普通请求正常，继续发同一 badcase 仍乱码，先发普通请求即不再乱码
  visibility: 静默错误
mitigation:
  detect: 服务拉起后先发该 261-token prompt，核对 prompt_tokens=261/3 个 KV block 与返回文本；再对照「先发普通请求再发 badcase」是否复现
  fix: 待定（issue 未给修复 PR；已排除 MTP、prefix cache、reasoning parser、KV 清零、slot mapping、eager 六项）
