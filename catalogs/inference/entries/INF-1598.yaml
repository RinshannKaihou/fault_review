title: 外部事件 wait 未 record 时写地址 0 致回放挂死
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: 通用
    component: capture_model 外部事件 wait
  behavior: 外部事件 wait 的地址先被置 0，仅当 event 已 record 且未 reset 才回填；consumer 先于 producer record 执行时，这个 0 被原样写进 wait entry。
effect:
  objects:
  - 可用性/进度
  detail: cross-model 外部事件同步在 consumer 先于 producer 执行时，设备 wait 任务拿地址 0 等值 1，信号永不满足，rtModelExecute 挂死；即使 producer 上轮 record 过，写的是上轮过期地址，同样挂死。
  visibility: 挂起
mitigation:
  detect: graph 调试日志里看 wait entry 的 waitRefreshAddr 是否为 0 或与 record 本轮 AllocExpandingPoolEvent 地址不一致
  fix: issue 建议 wait entry 取 producer 本轮即将写入的地址（PrepareExternalWaitsForReplay 在 record 发布后按 GetEventAddr 填充），而不是 event 的已发布历史地址；issue 已 closed，合入与发布未核实
