original:
  mechanism: cann/runtime 的 graph capture 实现里，capture 阶段为 producer 的 record 与 consumer 的 wait 各建占位任务（TS_TASK_TYPE_CAPTURE_RECORD_EXTERNAL / TS_TASK_TYPE_CAPTURE_WAIT_EXTERNAL）。每次 replay 时 PrepareExternalRecordsForReplay（capture_model.cc:647）为每个 record 调 AllocExpandingPoolEvent 分配全新 event 地址并把“向该地址写 1”的 SQE 填入 record entry；PrepareExternalWaitsForReplay（:676/:689-694）再把 producer 的 event 地址写进 wait entry 并 H2D 到设备表。问题在 RetainRecordedEventForExternalWait（capture_model.cc:45）：先 *eventAddr = 0U，只有在 addr 非空、eventId 有效、event->HasRecord() 且 !HasReset() 时才回填 RtPtrToValue(addr)。当 consumer 图先于 producer record 执行，HasRecord()==false，eventAddr 保持 0，wait entry 被写成 0，设备 wait 任务在 waitRefreshAddr 处解引用 0 / 等待永不到来 → rtModelExecute 挂死。即使 producer 上一轮 record 过，HasRecord()==true 写进去的也是上一轮的过期地址，而本轮 record 会用 AllocExpandingPoolEvent 分配新地址，旧地址不再被写，同样挂死。根因是 wait 地址取自 event 的“已发布历史地址”而非“本轮 producer 将写入的地址”。环境为 Ascend910_9362（chipType=5）、CANN 9.0.0、runtime 源码 9.1.0、software_sq_enable 的 value-wait 实现。
  source: 2026-08-11 GitCode cann/runtime issue https://gitcode.com/cann/runtime/issues/814 （closed）
  behavior: 开了 cross-model 外部事件同步的模型回放时，某次 rtModelExecute 直接不返回：进程不崩、不报错，设备侧的 wait 任务一直在等一个地址上的 1，日志停在 model execute 前后；把 producer/consumer 的执行顺序换一下或换机器时序就恢复，表现为偶发挂死。
  trigger_surface: cross-model external wait（capture wait external）+ consumer 图先于 producer record 执行 / producer 每轮重新分配 event 地址
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
