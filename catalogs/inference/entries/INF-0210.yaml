original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（triton **3.8.0 release wheel** 缺 main 上 13 个正确性修复（`release/3.8.x` 仅高于 merge-base `3bb23dde7`（6-23）一个 commit，此后修复全不在内）：mxfp4 MN-packed `tl.dot_scaled` 在 sm_120 返回 garbage（6 配置 524214/524288 元素错、最大绝对差 188.4，#10726 修）、E8M0 scale 字节 0/bf16 subnormal 使 16384/16384 元素全错（#11624 修）、`OptimizeThreadLocality` 错误重排 reduction（256/256 错，#11186 修）、`tl.range(flatten=True)` 空内环丢迭代（352 vs 337，#11607/#11688 修）、`tl.softmax dim≠−1` 归一化轴错（#11409 修）、constexpr 列表推导 if 过滤被忽略、`tl.full(−0.0)` 丢符号位、TMA 不对齐 stage size 设备故障（misaligned address 且粘性）、`tl.gather`/`while(int 条件)`/histogram 非 32 位崩溃等。全套 cherry-pick 构建后 main 测试逐条通过。#11733（mxfp4 dot_scaled + batched mxfp assert，#10726/#11262 修）为同触发面实例并入本条） · Cov: `var:flashinfer_vendored_trtllm_fp8_cast_bf16_double_round_fix_not_propagated`（7.83 修复未跨副本/分支传播族） · 触发 `partial` · 置信度 `verified`'
  mechanism: release 分支自 merge-base 后未回吸 main 正确性修复；PyPI wheel 用户消费的是缺修复的旧代码，而 main 自己的测试套件对 wheel 逐条运行即可抓住（方法反转：用 main 测试探 release）。
  source: 'triton #11735（2026-09-12 open，含逐条 wheel-vs-main 失败清单、cherry-pick 构建验证与"443 失败中其余为新 API/BC 变更不列入"的甄别；#11733 同日同触发面）。https://github.com/triton-lang/triton/issues/11735'
  behavior: 多数无 crash——3.8.0 wheel 用户在 mxfp4 dot_scaled、flatten range、softmax 轴、列表推导过滤等**公开 API 上静默拿错值**，另有 TMA 未对齐 stage 的粘性设备故障与若干 pass-manager 崩溃。7.83（flashinfer vendored TRT-LLM fp8 cast 修复未传播）之后"修复未跨副本传播"族新成员：本条在 release-wheel 维度、以 main 测试为探针系统性枚举。
  trigger_surface: triton 3.8.0 PyPI wheel + sm_120 mxfp4 dot_scaled / flatten range / softmax dim≠−1 / TMA 未对齐 stage 等（partial）
  discovery: |-
    2026-09-13 每日扫描。
