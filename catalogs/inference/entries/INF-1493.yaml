original:
  mechanism: 'mindstudio-probe 26.0.0a2，PyTorch 2.9.0 + MindSpeed-LLM（qwen3-4b-32k LoRA）训练：采集配置为 task=statistics、level=L1、async_dump=false、extra_info=true、statistics.data_mode=[all]、summary_mode=statistics、tensor_list 为空。训练侧 loss_func 已经抛 ValueError ''Rank 3: found NaN in local forward loss calculation''，同时采集日志里每个 rank 反复出现 ''The dump data(None) should be a dict.'' 警告——即落盘阶段拿到的是 None 而非 dict。随后用 msprobe overflow_check -i ./step0/ -o ./ 分析，工具先报多条 ''Cannot find connected communication node for 2.Distributed.all_reduce.N.forward''，最后给出 ''Cannot find any anomaly node, no need to generate analyze file.''，完全不产出分析文件。issue 未给根因（是 L1 statistics 模式本身不含 overflow_check 所需的 tensor 数据，还是 dump 写入失败）与修复 PR。'
  source: 2026-05-26 GitCode Ascend/msprobe issue https://gitcode.com/Ascend/msprobe/issues/326 （closed）
  behavior: 训练已经因为 loss 变 NaN 报错退出，用户按文档用 msprobe 采了 L1 statistics 数据再跑 overflow_check 想找溢出算子，结果工具说「找不到异常节点，不需要生成分析文件」，只留下满屏 'The dump data(None) should be a dict' 的 WARNING。看起来像「模型没问题」，实际是溢出分析链路什么都没读到。
  trigger_surface: msprobe statistics/L1 采集（tensor_list 为空）+ overflow_check 后分析；训练侧已出现 NaN loss
