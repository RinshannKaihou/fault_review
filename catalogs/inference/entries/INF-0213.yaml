  meta: '`infra_off`（ttnn `chunk_gated_delta_rule`（gated-delta-rule / FLA 家族 SSM 注意力内核）把 chunk 间状态衰减因子 dl=exp(g_sum) 拆成两个指数乘积 `exp(g_sum−decay)·exp(decay)`（`chunk_gdn_prep.cpp` `ew(cb_decayfac, cb_decay_exp, cb_dl, 1, 2)`）；在 Tensix FTZ/DAZ 下 g0≤−87.34 时 exp(g0) 下溢冲刷 +0.0f，若 g_sum−g0≥88.72 则 decayfac=+∞，**+∞×0.0=NaN** 不可逆毒化整个 recurrent state 矩阵 S；否则有限×0=**0.0f** 全抹除累计记忆（灾难性遗忘）——而数学真值 exp(g_sum) 本身完全正常（>10^−38，无需拆分）。fp32 in/out、dest_acc=Yes；Wormhole B0 硅片 + Blackhole ttsim 验证，含五档 (g0, g_sum) 门控条件 × 位级输出 × S 影响对照表与 PyTorch/FLA golden 对照） · Cov: `NEW`（代数恒等式拆分 × FTZ 边界：中间量单独溢出/下溢而真值正常子签名） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 把单个可表示的指数拆成两个指数的乘积，使中间量各自越过 fp32 指数边界（下溢被 FTZ 冲刷为 +0.0 / 上溢为 +inf）；IEEE 语义下 0×inf 即 NaN。真值正常说明这是**实现引入**的边界而非数学困难。
  source: 'tt-metal #56550（2026-09-14 open，community label，含门控条件×期望值×位级输出×S 影响的五行矩阵与源码定位 chunk_gdn_prep.cpp:470-482,585-590 / chunk_gdn_scan.cpp:170-178）。https://github.com/tenstorrent/tt-metal/issues/56550'
  behavior: 无 crash——两种静默终态：NaN 毒化（后续所有 chunk 输出 NaN）或 state 归零（灾难性遗忘、输出忽然"失忆"）；触发面为 gating 值域（g0≤−87.34 且 g_sum−g0 条件组合），长序列/强衰减模型最易命中。1.114（exp2 指数重构上溢 guard 缺失回绕）之后"指数函数实现边界"族新成员：本条在**代数拆分引入的中间量边界**维度、且后果直达 recurrent state 全矩阵。
  trigger_surface: tt-metal（WH B0 硅片/BH ttsim）+ chunk_gated_delta_rule / gated-delta-rule 族内核 + 强负 gating 输入（hw_specific；数值触发）
