  - subsystem: MoE路由
    stack: cann
    component: mega_moe_max_tokens 默认值
  behavior: 该参数作为每 rank 最大接收 token 数参与 HCCL 对称内存握手；默认 6144，而 8192 token/step × topk16 ÷ EP16 恰为每 rank 8192，窗口溢出后集合通信状态被破坏。
effect:
  objects:
  - 可用性/进度
  detail: 首个长 prefill 请求即 hard crash：Worker 报 SUSPECT REMOTE ERROR 507057，在飞 30/30 请求全失败；配置文档只说欠配会造成 token 截断式精度下降，未提示会崩。
  visibility: 报错
mitigation:
  detect: 起服务时按 max_num_batched_tokens×topk÷EP 算出每 rank 接收量，与 mega_moe_max_tokens 比较，欠配即在首个长 prefill 前改掉
  fix: '改为默认 65536 或 0（auto）；A3 上 0 不额外占 HBM。相关 PR #17162 只加了负值启动校验与 0=auto 文档'
