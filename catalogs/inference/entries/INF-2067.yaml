original:
  mechanism: mega_moe_max_tokens 并不是调优旋钮，而是作为 max_recv_token_num 传给 CANN MegaMoe 算子，参与集合通信的对称内存握手（moe_comm_method.py 的 get_symm_buffer_for_mega_moe），声明本 rank 在 MoE dispatch 后最多接收多少 token；该值在所有 EP rank 上必须一致且不小于实际接收量。实际接收量在满载下是确定的：prefill chunk 8192 token × dispatch 复制 topk16 = 131072 个 token-expert 对，EP16 均分后每 rank 8192。0.27.1 时代默认值 6144 < 8192，对称接收窗口溢出，HCCL 集合通信状态被破坏，报 SUSPECT REMOTE ERROR 507057，报告 rank（TP6）并非根因。配置文档与 warning_once 只描述欠配会导致 token 截断式精度下降（软失败），与实际硬崩不符。
  source: 2026-09-30 github.com issue https://github.com/vllm-project/vllm-ascend/issues/17202 （open）
  behavior: 按默认配置起服务、发第一个长 prefill 请求，Worker 直接报 SUSPECT REMOTE ERROR 507057，在飞的 30 个请求一起失败、引擎死亡且不可恢复；报错位置离真正的配置项很远，第一反应会去查 HCCL 网络，而配置文档只说调小会掉精度。
  trigger_surface: CANN MegaMoe 对称内存路径 + A3 EP16 + 长 prefill（max_num_batched_tokens 8192、topk16）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
