relations: []
original:
  mechanism: cann/ops-nn issue 5484（2026-09-02，closed）：硬件 Ascend 950PR（arch35 / DAV_3510），CANN 9.2.0，ops-nn master，涉及 MSELossV2 / PoissonNllLoss / MultilabelMarginLoss 的 arch35 kernel。缺陷一：reduction=sum/mean 的跨核合并用标量 Kahan 补偿求和 y = p - comp; t = total + y; comp = (t - total) - y; total = t;——当 p=±inf 时 comp = inf - inf = NaN，total 本身还是 inf 但补偿项已被污染，下一分片 y = p - NaN = NaN 使 total 变 NaN；单核时循环只跑一次、被污染的 comp 之后不再使用，所以单核不复现，核数 1→2 就是暴露阈值。缺陷二：MultilabelMarginLoss 的 partials 缓冲区仅按 usedCoreNum*wsCoreStride 分配（4 核时 32 float），而合并逻辑一次读满 VL=64 车道，DataCopyPad 只搬入 usedCoreNum 个槽，多出的车道取到 UB 残留值，残留含 ±inf/NaN 时 inf+(-inf)=NaN 现形，表现为单核/小核数下约 1/12 概率结果错误。期望：单侧 inf 或一侧 +inf 一侧 -inf 应得 inf；同位双 inf（inf-inf）或输入含 nan 应得 nan；任何核数下结果一致且不越界读。
  source: 2026-09-02 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5484 （closed）
  behavior: 在 950 上用这三个 loss 的 sum/mean 归约时，只要输入里有 ±inf，输出就变成 NaN 而不是 inf——明明是“和无穷大”却报成“不是数”，下游 loss 直接坏掉；小张量（单核）跑得好好的，一上多核就出现，看起来像随机。MultilabelMarginLoss 在核数少时还会偶发错值（约 1/12），同一条命令多跑几次结果不一样。
  trigger_surface: Ascend 950PR arch35 kernel + reduction=sum|mean + usedCoreNum≥2 + 输入含 ±inf 或 nan
