title: 三 loss 跨核合并把 inf 变 NaN 且 partials 越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 损失计算
    stack: 通用
    component: arch35 跨核合并与 partials
  behavior: arch35 跨核合并用标量 Kahan：p=±inf 时 comp=inf-inf=NaN，污染后续分片使 total 变 NaN；MultilabelMarginLoss 的 partials 按核数分配，合并却读满 64 车道而越界。
effect:
  objects:
  - 数值结果
  detail: 950PR（arch35）+ CANN 9.2.0：reduction=sum/mean 且输入含 ±inf 时输出 NaN（应 inf），单核不复现、核数 1→2 即暴露；MultilabelMarginLoss 小核数下约 1/12 结果错。
  visibility: 数值异常
mitigation:
  detect: sum/mean 归约输入里放 ±inf，与 usedCoreNum=1 的结果对比；单核通过不能当验收（缺陷在核数≥2 才出现）。
  fix: issue 5484 closed；修复 PR https://gitcode.com/cann/ops-nn/pulls/9662 （合入状态未核实）。
