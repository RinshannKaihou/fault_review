original:
  mechanism: GLM-5.2 的 MTP 共享 index 依赖三件事同时成立，Ascend 侧三件都没做到：其一，真正的 indexer 门控 skip_topk 与共享 top-k 缓冲 topk_indices_buffer 定义在内层 MLA 实现 AscendSFAImpl 上，它不是 nn.Module，named_modules() 看不到，上游 DeepSeekMultiTokenPredictor 的钩子按模块名调 set_skip_topk / compact_topk_indices 时调用根本到不了内层实现；其二，MTP/nextn 层会从 backbone 的 skip 模式继承 skip_topk=True，而它们必须在 draft step 0 自己算 index 并在运行期切换，不能一上来就处于 skip 模式；其三，draft step 0 结束后共享 top-k 缓冲没有按 token_indices_to_sample 压紧到与请求对齐的位置，step 1+ 按压缩后的行号去读就会读错行。修复即在 AscendMultiHeadLatentAttention 上加 skip_topk / topk_indices_buffer 属性转发到内层实现、在 _deepseek_v2_mla_attention_init 里用 not is_mtp_layer 屏蔽初始 skip_topk、并在 AscendSpecDecodeBaseProposer 的 draft step 0 之后调用 compact_topk_indices(token_indices_to_sample)。
  source: '2026-09-06 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15864 （closed，已由 PR #15754 / #14451 / #15759 修复）'
  behavior: 开共享 index 的 GLM-5.2 MTP 服务能正常起、正常回包，但草稿层的稀疏注意力选中的是别的请求或别的位置的 top-k 行，draft token 与目标模型越走越远，接受率下降、长文生成变慢变差；主模型输出本身仍连贯，所以只能从接受率曲线看出异常，没有报错也没有 NaN。属于"推测解码开了但收益被吃掉"的静默退化。
  trigger_surface: GLM-5.2 + MTP + index_share_for_mtp_iteration（共享 index 的投机解码）
  discovery: 2026-10-21 历史索引回填（NPU pool2_v2c，issue created < 2026-10-07）
