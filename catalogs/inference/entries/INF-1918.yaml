cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: Ascend MLA 属性转发
  behavior: skip_topk 与 topk_indices_buffer 在内层非 Module 的 MLA 实现上，上游 proposer 钩子打不到；MTP 层还会按 backbone 的 skip 模式以 skip_topk=True 初始化
effect:
  objects:
  - 输出分布
  - 输出内容
  detail: 'GLM-5.2 MTP 且 index_share_for_mtp_iteration 时，Ascend 上 draft step 1+ 读到未按请求对齐的共享 top-k 行，草稿 token 质量退化；已由 PR #15754/#14451/#15759 修复。'
  visibility: 质量退化
mitigation:
  detect: 开 index_share_for_mtp_iteration 的 GLM-5.2 MTP 服务，比对 draft 接受率与关掉共享 index 时的差异；或断言 MTP 层初始 skip_topk 为 False、draft step 0 后 topk_indices_buffer 已按 token_indices_to_sample 压缩
  fix: 已修：主 PR https://github.com/vllm-project/vllm-ascend/pull/15754 ，v0.26.0rc 分支 https://github.com/vllm-project/vllm-ascend/pull/14451 ，v0.27.1rc 分支 https://github.com/vllm-project/vllm-ascend/pull/15759
