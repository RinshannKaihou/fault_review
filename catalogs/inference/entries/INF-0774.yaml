  section: 第 7 类 · 量化（PTQ / 低位 / FP8 / 微缩度）
  meta: '`infra_off`（SGLang `--kv-cache-dtype nvfp4` 服务 `kv_cache_scheme: num_bits 8` 的 checkpoint（如 unsloth NVFP4 quant 携带 fp8 校准 `k/v_scale`）：32 个 `[1]` bf16 标量被原样加载并当作 NVFP4 **global scale** 消费（fp8 几何 amax/448 vs NVFP4 amax/6，~75× 失配→每条存储 K/V 系统性错 scale）。**单变量证明**：同机同日同 prompt，仅删这 64 字节（其余 bit-identical 22.5 GB checkpoint）长上下文 needle 1/4→4/4（d500 0/4→全对）；全程无一行日志提及 scale。2×RTX 5060 Ti TP2、0.5.21 wheel，确定性复现（跨 boot 逐字节）；与 #39942（fp8 KV scale 被丢——反向失败同盲区）互补） · Cov: `var:vllm_compressed_tensors_kv_scale_dropped`（7.52 KV scale 溯源缺失族——本条在 **scale 被错用而非丢弃**维度，跨量化几何错配） · 触发 `config` · 置信度 `verified`'
  mechanism: '`maybe_remap_kv_scale_name()` 无条件挂载 scale；fp4 路径无 checkpoint KV scheme 与运行时 dtype 的一致性校验。'
  source: 'SGLang #42369（2026-10-03 open，64 字节单变量 A/B+机制源码走读（标注推断））。https://github.com/sgl-project/sglang/issues/42369'
  behavior: 无 crash——短 prompt/工具/视觉正常，长上下文检索塌缩（答案退化为问题回声），boot 日志干净。
