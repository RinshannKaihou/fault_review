title: MindSpore Ascend VideoDecoder 稀疏批量抽帧码块损坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: mindspore
    component: VideoDecoder 批量抽帧
  behavior: 每组最后一个目标包提交后即结束该组，不等解码完成或排空输出；多区间 seek 复用同一通道且组间无 EOS/drain，前序区间解码残留污染后续帧。
effect:
  objects:
  - 输入编码
  detail: get_frames_at([1810,2212,2615]) 第 2615 帧确定性码块损坏（最大像素差 255、平均差 55），删除任一前序索引即逐字节一致；API 正常返回、无报错无告警，若这些帧直接送入视频理解模型，输入特征已被污染且不可察觉。
  visibility: 静默错误
mitigation:
  detect: 批量与单帧抽取结果逐字节比对（batch==single 断言）可发现
  fix: 待定（EOS+drain 诊断 helper 可恢复但为受控诊断、非生产补丁，未回归验证）
