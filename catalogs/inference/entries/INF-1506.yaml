id: INF-1506
legacy_ids: []
slug: op_plugin_layer_norm_empty_input_mean_rstd_shape
aliases: []
title: layer_norm 空输入 mean/rstd 返回错形状
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: native_layer_norm 空输入分支
  behavior: M<=0（归一化轴之前各维乘积为 0）的分支把 mean_out/rstd_out 建成 shape {M} 的一维空张量，而参考实现保持输入维度、归一化轴置 1（(0,3,4) 应为 (0,1,1)）。
effect:
  objects:
  - 数值结果
  detail: Ascend950+对应CANN下，torch.native_layer_norm 空输入（M<=0，如[0,3,4]/[3,4]）前向不报错、输出为空，但 mean/rstd 返回一维{0}而非PyTorch参考实现[0,1,1]；下游按keepdim取用会错位，非空输入正常。
  visibility: 静默错误
mitigation:
  detect: 构造 shape [0,3,4]、normalized_shape=[3,4] 的空输入调 torch.native_layer_norm，检查 mean/rstd 的 shape 是否为 keepdim 形式
  fix: 修复 PR https://gitcode.com/Ascend/op-plugin/pull/5841 （issue 为 closed；合入与发布状态未核实）；修法是在 M<=0 分支加 SoC 守护，Ascend950 起按输入维度算 mean_shape
