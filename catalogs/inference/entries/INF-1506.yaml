original:
  mechanism: 'op-plugin issue #495（2026-09-08，closed）：op_plugin/ops/opapi/LayerNormKernelNpuOpApi.cpp 的 native_layer_norm 在空输入场景（M<=0，M 为输入中归一化轴之前各维度乘积）下，把 mean_out/rstd_out 创建成 shape {M}（1-D 零元素张量），与框架参考实现的 shape（保持输入维度、归一化轴置 1）不一致。复现：Ascend950 上构造 input shape [0,3,4]、normalized_shape=[3,4]，调 torch.native_layer_norm(input, normalized_shape, weight, bias, eps)，期望 mean/rstd 为 [0,1,1]，实际为 {0}。修复方案是在 M<=0 分支加 SoC 版本守护 c10_npu::GetSocVersion() < c10_npu::SocVersion::Ascend950，950+ 走 else 分支按输入维度计算 mean_shape。关联 PR https://gitcode.com/Ascend/op-plugin/pull/5841。'
  source: 2026-09-08 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/495 （closed）
  behavior: 在 Ascend950 上把空 batch 送进 layer_norm（例如动态 batch 下这一轮恰好 0 条、input 是 [0,3,4]）：前向不报错，output 也是空的，但返回的 mean 和 rstd 是一维的 {0}，PyTorch 参考实现给的是保持维度的 [0,1,1]。下游若按 keepdim 形状取 mean/rstd（再 broadcast 回去做残差或统计）就对不上；非空输入完全正常。
  trigger_surface: torch.native_layer_norm + 空输入（M<=0，如 [0,3,4] / normalized_shape=[3,4]）；Ascend950 + 对应 CANN
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
