original:
  mechanism: 'Ascend/pytorch #3061（Ascend950PR_9579 / CANN 9.1.0 / torch 2.7.1+cpu / torch_npu 2.7.1 / Python 3.11.13）：op-plugin 的 op_plugin/ops/opapi/ArgSortKernelNpuOpApi.cpp 里两个 op_api::argsort 实现仅根据输入 dtype（int32/int64）判定该算子运行在 AICPU 并据此告警，判定不区分 SoC 型号，也没有考虑 CANN 针对 Ascend 950PR/950DT 的 RegBase Sort AI Core 实现。报告者用 torch_npu.profiler Level2（aic_metrics=PipeUtilization、analyse_flag=True）采集，实际 kernel 名为 aclnnSort_SortAiCoreForDavid_Sort，Accelerator Core 为 MIX_AIV，即运行在 AI Core/AI Vector 而非 AICPU。复现脚本：dtype=int32、(32,4096) 输入做 argsort（x=(arange*1009+17)%4096），配 profiler Level2 采集即可看到告警与实际核不一致。'
  source: 2026-07-20 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/3061 （open）
  behavior: 在 950PR 上跑一眼就能看到 argsort 打出「运行于 AICPU」的告警，但同一段 profile 里它的 Accelerator Core 是 MIX_AIV、kernel 名是 aclnnSort_SortAiCoreForDavid_Sort，实际跑在 AI Core 上。按告警做性能归因的人会把这段算力错记到 AICPU 头上、把 AICPU 当瓶颈去优化；算子本身的数值结果是对的。
  trigger_surface: torch_npu 2.7.1 + CANN 9.1.0（Ascend 950PR/950DT）；torch.argsort 的 int32/int64 输入
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
