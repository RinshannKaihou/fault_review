id: INF-1871
legacy_ids: []
slug: opapi_argsort_false_aicpu_engine_warning
aliases: []
title: ArgSort opapi 把 AI Core 执行误报为 AICPU
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: ArgSort op_api 引擎判定告警
  behavior: op_api::argsort 只按输入 dtype（int32/int64）把执行引擎判为 AICPU 并告警，不看 SoC 型号，也没考虑 CANN 在 950PR/950DT 上的 RegBase Sort AI Core 实现。
effect:
  objects:
  - 指标/日志
  detail: Ascend 950PR 上 argsort 实际 kernel 为 aclnnSort_SortAiCoreForDavid_Sort、Accelerator Core=MIX_AIV，却仍告警「运行于 AICPU」；按告警做性能归因会把算力记到 AICPU 上。
  visibility: 静默错误
mitigation:
  detect: profiler Level2 采集 Accelerator Core 与 kernel 名，与 opapi 告警对照；报告含 dtype=int32、(32,4096) 输入的复现脚本
  fix: 待定（issue open，未给修复 PR）
