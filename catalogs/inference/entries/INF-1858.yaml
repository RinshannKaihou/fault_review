original:
  mechanism: cann/ops-nn issue 4519（closed）：foreach_addcmul_scalar 的 int32 标量路径（out = x1 + scalar*x2*x3）把中间结果放进 float32 计算后回写整型，float32 只有 24 位有效位，|值|>2^24 的整数被舍入到相邻可表示值。作者在 Ascend910B3、CANN 9.1.0-beta.3、ops-nn HEAD e16ef626bb3a 上以 build.sh --pkg --soc=ascend910b --ops=foreach_addcmul_scalar 编包并安装到独立 vendor，用 aclnn 接口跑 x1=0、x2=x3=1、scalar=16777217（=2^24+1）的 int32 用例：期望 16777217、实得 16777216，进程退出码 42（BUG_REPRODUCED）；用例刻意取 N=1，以排除 foreach 列表容量相关因素。issue 正文把行号指向同目录 FINDING.md，未在正文给出具体源码位置与修复方案。
  source: GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4519 （closed）
  behavior: 对 int32 张量做带标量的 addcmul，只要数值超过 2^24，结果就会差 1 或几个低位：例如 16777217 算成 16777216，接口返回成功、不报错、没有 NaN，与主机上同样的整型运算对不上；量级较小的整数和 fp32 输入完全正常，所以整型用例通常只用小数值，问题长期藏着。
  trigger_surface: aclnnForeachAddcmulScalar 标量路径 + int32 且 |值|>2^24
