title: foreach_addcmul_scalar int32 丢低位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: addcmul_scalar int32 路径
  behavior: int32 的标量 addcmul 路径把中间量送进 float32 计算再回整型，|x|>2^24 时低位被舍入掉，接口仍返回成功。
effect:
  objects:
  - 数值结果
  detail: 910B3：x1=0、x2=x3=1、scalar=16777217（2^24+1）时输出 16777216，差 1；N=1 即可复现，与 foreach 列表长度上限无关。
  visibility: 静默错误
mitigation:
  detect: 用 >2^24 的 int32 值（如 2^24+1）走标量路径与主机整型语义逐值比对；小整数与 fp32 用例完全正常。
  fix: 待定（issue closed，未给 MR）：int32 路径应全程整型计算，不经 float32 中间量。
