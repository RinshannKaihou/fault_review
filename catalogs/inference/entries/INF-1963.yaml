original:
  mechanism: 'vllm-ascend issue #9395（2026-05-21，closed）：GLM-5.1-w4a8 开启 MC2 后，在新版本 CANN 9.0 镜像里返回全感叹号。评论里 MarinaMiao 给出范围：w8a8 同环境可以正常拉起，只有 w4a8+MC2 出精度问题；报错与 dispatchFFNcombine 算子相关。故障与 vllm-ascend 的 commit 绑定——vllm-ascend@a45cd(0516)+vllm@bc150f(0505) 能拉起 w4a8 但精度错；换更新的 vllm-ascend@1383e(0524) 后 w4a8 可以拉起，但 w8a8 又落到另一个精度 issue（#9554）。维护者据此判断本质是 w8a8 与 w4a8 在 dispatchFFNcombine 上的改动互相冲突、不同 commit 只能适配一种量化，建议 diff 两边改动后合并。Nagisa125 还建议用 ACL_OP_INIT_MODE=1 走旧算子初始化路径并补 CANN 8.x/9.0 的 perplexity 对比。issue 以 wait-feedback/stale 关闭，未给出修复 PR。'
  source: 2026-05-21 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/9395 （closed）
  behavior: GLM-5.1 的 w4a8 量化权重在 CANN 9.0 镜像里开 MC2 部署后，回答整段都是感叹号，等于不可用；同一台机器换成 w8a8 权重、同样开 MC2 却一切正常。现场按版本试出来的规律是「换 commit 只能救一边」：修好 w4a8 的那版 w8a8 又掉精度，所以既不敢升级也不敢降级，属于量化格式相关的静默错值而不是崩溃。
