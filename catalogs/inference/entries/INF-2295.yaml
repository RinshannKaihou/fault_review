original:
  mechanism: 'cann/ops-math aclnnReduceSum 在 self=BOOL、dtype=INT64、dims 含负轴时归约结果丢末位（少 1）且无告警（issue #4298，910B2/CANN 9.2.0 实测）。根因定位（报告者给出源码）：op_api/aclnn_reduce_sum.cpp:261-268 在 selfType==DT_BOOL 且 dataType==DT_INT64 分支里，reduceDims 用 shape[(*dims)[i]] 直接索引，负轴（如 -1）转 size_t 越界取到错值，reduceDims 落到 <2^24（maxDim=16777216），promoteType 误选 DT_FLOAT，在 fp32 上累加 16785409 个 1——fp32 尾数 24 位最大精确整数 2^24=16777216，结果被舍入为 16785408（正是 fp32(16785409) 的最近可表示值）。同函数 CheckDimValid 用 GetPosDim 做了负轴归一，证明负轴是合法输入，越界只发生在该处。判别矩阵：bool→int64 正轴正确负轴错（命中）；bool→int32、int32→int64、uint8→int64 不走该分支全对；和为偶数或 2^24 附近可被 fp32 精确表示时错误被掩盖（D6/D7 反证：不是负轴一律错，而是负轴+和不可被 fp32 精确表示才错）；keepDims 无关。重复 3 次一致为确定性缺陷。'
  source: GitCode issue https://gitcode.com/cann/ops-math/issues/4298 （open，2026-10-30 创建；含源码定位、判别矩阵与自包含 C++ 探针）
  behavior: 对 bool 张量做 sum 并指定输出 int64：把归约轴写成负数（如 [-2,-1]）时结果比正确值小 1（4097×4097 个 1 求和得 16785408 而不是 16785409），同一份数据把轴写成 [0,1] 就完全正确。无任何告警；只有当总和超过 2^24 且不能被 fp32 精确表示时才出错，总和是偶数或恰好可表示时错误被掩盖。统计计数类下游会静默拿到偏小的整数。
  trigger_surface: cann/ops-math reduce_sum；self=BOOL、dtype=INT64、dims 含负轴、归约元素数超 2^24 且和不可被 fp32 精确表示。
  signature: 同数据 dims=[0,1] 与 dims=[-2,-1] 结果差 1；错误值=fp32(真实和)。
  repro: issue 附自包含 probe（正负轴同进程对照，实测输出表）。
