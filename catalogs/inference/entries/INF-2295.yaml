title: aclnnReduceSum bool→INT64 负轴误选 fp32 丢末位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: reduce_sum promoteType 分支
  behavior: aclnn_reduce_sum.cpp:261-268 用 shape[(*dims)[i]] 未做负轴归一，负轴越界取错值使 promoteType 误选 DT_FLOAT，fp32 累加。
effect:
  objects:
  - 数值结果
  detail: bool[4097,4097] 全 1、dtype=INT64：dims=[-2,-1] 得 16785408（正确值 16785409），同数据 dims=[0,1] 完全正确；无告警，重复 3 次一致。仅当总和超 2^24 且不可被 fp32 精确表示时出错，和为偶数或恰好可表示时被掩盖。
  visibility: 静默错误
mitigation:
  detect: bool 全 1 大张量 INT64 归约，正负轴结果应一致；和为奇数且 >2^24 的用例可暴露。
