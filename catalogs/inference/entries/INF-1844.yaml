original:
  mechanism: cann/ops-math issue 1505（closed）：experimental/math/sqrt/op_kernel/sqrt.h:109-118 在 !std::is_same_v<TYPE_X,float32_t> 分支里先用 CAST_NONE 把输入抬到 float32、按 fp32 做 Sqrt，再用 AscendC::Cast(yLocal, p1, RoundMode::CAST_CEIL, processDataNum) 窄回目标低精度（:115），即向正无穷取整；项目中其他数学算子在同样「fp32 中间结果回写窄类型」的场景统一用 CAST_RINT（就近、ties to even）。作者给出的对照：sqrt(2.0) 的 fp32 值 1.41421356…，fp16 最近可表示值 1.4140625（CAST_RINT 应返回它），CAST_CEIL 返回下一个 fp16 值 1.4150390625。issue 未附设备运行日志，结论由源码比对与手算该点得出。
  source: GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/1505 （closed）
  behavior: 用 fp16/bf16 跑 sqrt，结果普遍比正确舍入值大一点点：每个不能精确表示的值都被推到下一个可表示数，整张输出呈系统性上偏而不是随机抖动，接口返回成功、没有告警，精度回归按容差判常常照样通过；把输入换成 fp32 就完全正常，所以只在低精度推理路径上长期存在。
  trigger_surface: experimental/math/sqrt + float16/bfloat16 输入
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
