id: INF-1844
legacy_ids: []
slug: ops_math_sqrt_cast_ceil_low_precision_bias
aliases: []
title: sqrt 低精度回写用 CAST_CEIL 致结果偏大
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: experimental sqrt kernel
  behavior: 非 float32 路径把 fp32 中间结果 Cast 回 fp16/bf16 时用了 RoundMode::CAST_CEIL（向正无穷取整），而不是项目其余数学算子通用的 CAST_RINT。
effect:
  objects:
  - 数值结果
  detail: fp16 sqrt(2.0)：CAST_RINT 应得 1.4140625，实际 1.4150390625；所有不能精确表示的 sqrt 结果恒向上偏一个可表示步长，接口与日志正常。
  visibility: 静默错误
mitigation:
  detect: 对 fp16/bf16 输入逐值与 fp32 结果按就近舍入比对，看是否恒为向上取整；mare/mere 类容差会掩盖 1 ulp 级系统偏差。
  fix: 待定（issue closed，未给 MR）：sqrt.h:115 的 CAST_CEIL 改为 CAST_RINT。
