original:
  mechanism: 根因未定位。现场日志显示首个请求的 prefill 批 BatchDescriptor(num_tokens=14, num_reqs=None, uniform=False) 以 cudagraph_mode NONE 执行，随后 decode 批 num_tokens=3、num_reqs=1 走 FULL 图并 Replaying aclgraph，请求在 2 秒内以 finish_reason=stop、completion_tokens=1 结束，message.content 为空串；同一条 curl 立刻重发就走正常路径返回 30 个 token 的完整回答。配置为 Qwen3.6-27B bf16、TP2、DP1、max-model-len 262144、max-num-seqs 64、qwen3_next_mtp num_speculative_tokens=2、FULL_DECODE_ONLY 且 capture sizes 从 3 起、reasoning-parser qwen3、enable_thinking=false、关闭 prefix caching。
  source: 2026-05-20 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/9355 （open）
  behavior: 服务刚拉起后的第一条 /v1/chat/completions 返回 200，但 choices[0].message.content 是空字符串，usage 里 completion_tokens=1、finish_reason=stop；客户端把空回答当正常响应。紧接着重发同一条请求就正常返回完整答案，所以只看平均值或重试后的指标发现不了，只有抓首请求响应体才能看到。
  trigger_surface: 服务启动后第一条请求（首个 prefill 批走 NONE 图、decode 走 FULL 图），MTP 投机解码
