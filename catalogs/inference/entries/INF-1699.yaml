title: MhcPreSinkhornBackward 输出 grad_x 全程未写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: MhcPreSinkhornBackward
  behavior: kernel 未执行 grad_x 写路径：initcheck 事件流显示输出 buffer MALLOC 后零写、无 MMAD、无 UB 到 GM 写指令，仅 host LOAD 读，输出保持未初始化值。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: 调用成功且无报错，grad_x 全 0；example 不校验输出，训练中该路梯度恒为 0、参数不更新。不开 sanitizer 同样全 0；开 initcheck 或加非零断言可发现未写输出。
  visibility: 静默错误
mitigation:
  detect: 开启 sanitizer 插桩跑 mssanitizer -t initcheck，逐算子核对输出 buffer 是否有写者；对输出加非零断言
  fix: 待定（issue 建议算子侧排查 grad_x 输出路径为何未执行，未见修复 PR）
