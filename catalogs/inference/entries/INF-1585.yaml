title: MoeGatingTopKSoftmax 等值 topK 索引错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: 通用
    component: gating_top_k_softmax topK
  behavior: gating 值域极小时 softmax 近均匀、概率经输出精度舍入后大量等值；kernel 的 topK 在等值处的选择与排序与标杆的稳定排序（等值按专家索引升序）不一致，选中值相同但索引归属不同。
effect:
  objects:
  - 数值结果
  detail: 正式轮 1000 例中 1 例、等值专项 483 例中 9 例失败；10 例全部仅 expertIdxOut 错位（max_diff 0.15~1.0，最低一致率 22.22%），yOut/rowIdxOut 的 max_diff 恒为 0；bf16、全零与常规值域零失败。
  visibility: 静默错误
mitigation:
  detect: gating 取 [0,0.001]~[0,0.01] 极小值域使 softmax 近均匀，比对 expertIdxOut；同时看 yOut 是否逐位一致以区分“索引口径”与“数值误差”
  fix: 待定（issue closed；需维护者明确等值时 topK 的 tie-break 口径，或让 kernel 与稳定排序一致）
