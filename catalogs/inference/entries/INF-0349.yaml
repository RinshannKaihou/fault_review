  meta: '`model_on` · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: MoE 的 top-k expert 选择本质是一个不连续的 argmax。pre-router 隐状态上一个 sub-ULP 级别的变化就可能把某个 router logit 推过 top-k 边界，改变该 token 被送往哪些 expert，进而沿约 58 个 MoE 层级联放大（router top-k sensitivity）。
  source: 'Fireworks AI blog (2026-03-10), Lesson #2。'
  behavior: logprob 漂移，偶发生成分叉；在那些 routing 真正翻转的特定 token 上被放大成阶跃式差异。
  trigger_surface: 单机 MoE/路由级联；多卡可做
  signature: ON-manifold —— 每个 expert 的输出单独看都在流形上，但被组装出的稀疏混合是另一个（仍然合法的）组合。检测器必须判定「哪些 token 走了与参考不同的 expert 集合」；geometric 的逐 token 度量可能在级联起点显示一个局部 STEP，随后回落，因此单靠幅度阈值极易漏检，需要 trajectory 的逐位置对齐比较。对非 MoE 模型，本条是「已记录的危险项」而非可复现目标。
  repro: 仅限 MoE 模型可软件复现（在 router logit 上加一个恰好跨越 top-k 边界的微扰）；dense 模型无 MoE 层，不存在对应复现位置。
