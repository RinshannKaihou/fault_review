original:
  mechanism: vLLM 0.31.0（官方 wheel，PyTorch 2.13.0+cu130，RTX A6000 sm86 + RTX 5880 Ada sm89）服务 LiquidAI/LFM2-8B-A1B（hybrid conv+SSM+full-attention，bf16）时，同一引擎实例、同 seed、同 prompts、temperature=0 的两次 llm.generate() 产生不同 token 序列。发散签名跨所有不匹配 prompt 一致：长公共前缀+单个分岔 token+再对齐——非确定归约顺序（atomicAdd/split-K 累加）扰动 logits 使 argmax 翻转的典型形态（报告者列出的 p0/p1/p3 分岔示例：3256→884、15637→2316、9029→12051 等）。排除项：cudagraph_mode=NONE 仍 3/4 prompt 发散（其中 1 个在首个输出 token 即分岔）→ 非 graph 重放伪影；temperature=0 → 无采样噪声；发散发生在暖对暖两轮之间 → 非冷启动缓存态。归因收窄：同机同栈 Qwen/Qwen1.5-MoE-A2.7B-Chat（dense-attention MoE）暖对暖与冷对暖完全一致 → LFM2/hybrid-mamba 特有。根因内核未定位（报告者明确为非确定归约假设，未给出 SASS/源码级证据），故标 documented。影响：贪心解码可复现性是评测复现与 A/B 测试基线，hybrid 模型上跨轮输出比较出现幻影 diff。
  source: vLLM issue https://github.com/vllm-project/vllm/issues/61319（2026-10-13 open，0 评论；含 repro_greedy_nondeterminism_lfm2.py 逐 prompt 分岔 token 表）
  behavior: 无报错；同一引擎两次相同请求输出序列分岔（128 token/prompt，长前缀+单点分岔+再对齐），跨轮持续存在、禁 CUDA graph 不消失；暖轮间即发散
