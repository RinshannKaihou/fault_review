remarks: 与 INF-0344（4.28 Qwen3.6 hybrid GDN 多序列 run-to-run 非确定）共享的具体失效机制：hybrid（mamba/GDN 类线性注意力）模型的 GPU 前向归约顺序非确定，同批重复提交间 logits 微扰使贪心 token 翻转——4.28 为批内多序列调度引起（272 生产 prompt 10–17% 决策翻转、max_num_seqs=1 归零），本条为同引擎暖轮间时间序引起且禁 CUDA graph 仍在，触发维度不同、机制家族相同。
