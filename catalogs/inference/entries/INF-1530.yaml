title: GroupNormSiluV2 近常数输入 rstd 偏离标杆
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: GroupNormSiluV2 方差计算
  behavior: 内核在 fp32 标量用 E[x²]−E[x]²+eps 计算 rstd，输入围绕 ±1、宽≤0.002 时相减噪声与真方差同量级；与 float64 离差平方和标杆口径不同。
effect:
  objects:
  - 数值结果
  detail: 999 条中 978 条判定、32 条不通过（3.3%）：近常数族 9/36（rstd 差 0.0006~0.0093）、|x|≥60000 族 13/27（0.0394）、bf16 meanOut 6 例 0.0041~0.0067；32 例均 activateSilu=true。
  visibility: 静默错误
mitigation:
  detect: 构造围绕 ±1、宽≤0.002 的输入并扫 eps（fp32 在 eps≤1e-4 全失败、eps≥1e-3 全通过）；标杆用 float64 定义式，别用同款原点矩算法。
  fix: issue 5906 已 closed，正文未给修复 PR；是否改 Welford 或两遍式离差算法未核实。
