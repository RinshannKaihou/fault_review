id: INF-2554
legacy_ids: []
slug: vllm_ascend_mooncake_push_kv_slot_reuse_race
aliases: []
title: Mooncake Push 未在 KV 槽复用前 fencing
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Mooncake Push 共享 KV 槽
  behavior: 共享层 KV 通过轮转 NPU 槽逐层写出时，Push 的 WRITE 可能在模型推进到下一层后才提交；源页先被复用覆盖，WRITE 读到的 KV 已不是原层内容。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: P/D 分离 + AscendStore 逐层 prefill offload + MooncakePushConnector 时，前缀命中的共享层 KV 在 WRITE 完成前被复用，decode 端收到的 KV 错误，输出静默偏离。
  visibility: 静默错误
mitigation:
  detect: 对 shared-layer offload 的每个 WRITE future 在复用前检查完成状态；对比同一 prompt 开/关 layerwise offload 的 decode 输出与 KV 内容。
  fix: 'PR #21891（open，依赖 #21256；未核实合入与发布）：在 layer hook 提交 shared-layer 读，复用前 fence WRITE futures，并把 KDA 层名传入 save hook。'
