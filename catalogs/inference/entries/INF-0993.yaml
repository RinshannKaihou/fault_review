  meta: '`infra_off`（vLLM 非 Harmony **Responses API** 路径：模型在一轮 assistant turn emit 多个 built-in tool call（如 `web_search_preview` + `code_interpreter`）时**只有最后一个被 dispatch 执行**，更早的调用留在 `response_messages` 里从未发出——与默认启用的 `ResponsesRequest.parallel_tool_calls` 语义直接矛盾，tool work 被静默省略。CPU-only pytest + AsyncMock 复现（无需 GPU/模型/服务器）） · Cov: `NEW`（built-in 调度循环缺迭代子签名） · 触发 `config` · 置信度 `verified`'
  mechanism: built-in 工具的执行循环只处理消息序列中的最后一个 function call 项，未遍历全部调用——普通（非 built-in）tool call 路径不受影响，缺陷特定于 Responses API 的内建工具分发。
  source: 'vLLM #57791（2026-09-20 open，含 CPU-only pytest 复现器（SimpleNamespace+AsyncMock 构造双 built-in 调用）、parallel_tool_calls 默认值引用）。https://github.com/vllm-project/vllm/issues/57791'
  behavior: 无 crash、无错误——多工具计划中除最后一项外全部**静默漏执行**：依赖搜索+代码执行组合的 agent 轨迹拿到不完整结果且无任何缺失信号；客户端只有在对比单工具行为时才能察觉。10.71（Anthropic deferred tools 静默 400）、57791 所在 Responses 栈与 6.180（prompt_cache_key 静默丢弃）同栈：本条是 Responses API 族在**工具分发完备性**维度的首个条目——"默认开启的并行承诺 × 单调用实现"的语义缺口。
  trigger_surface: vLLM Responses API + 模型一轮 emit ≥2 个 built-in tool call（config：默认配置即触发，需模型产生并行调用形态）
  discovery: 2026-09-20 每日扫描。
