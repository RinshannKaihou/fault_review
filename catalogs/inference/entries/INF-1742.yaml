original:
  mechanism: 'Ascend/pytorch #4307（2026-08-23，closed，Ubuntu 22.04 aarch64 / 910B2 / CANN 9.1.0-beta.1 / torch 2.13.0+cpu / torch_npu 2.13.0 源码 master c8ec201682 / triton-ascend 3.2.2）：torch.compile(npu_backend=triton_experimental) 编译「多步 reshape/transpose 视图链 + 逐元素加 + layer_norm」时，融合归约 kernel 的第三遍（normalize）load 地址表达式残留编译期未拆净的 // 与 % 复合形式，且与正确地址不等价——融合轴把 batch 数位错误地混入空间数位。报告附 TORCH_COMPILE_DEBUG=1 得到的 output_code.py：同一块输入三遍 load，前两遍是干净的系数多项式（x8 + 2*x6 + 32*x9 + 64*x7 + 1024*r0_2 + 147456*x5），第三遍出现 2*(((x1+4*x0)//4)%16) + 32*x9 + 64*((x1+4*x0)//64) + ... + (x1%2)。最小片段 B,C,H,W=128,144,32,32 上 max|d|=1.105e+01（期望 fp32 量级 1.9e-06）。模型级印证：timm mobilevit_s bs=128 推理经同一后端编译后社区 accuracy 流程判 fail_accuracy，fp64 金标 tol=0.001，实测 max_abs=0.2739。'
  source: 'Ascend/pytorch #4307（2026-08-23，closed） https://gitcode.com/Ascend/pytorch/issues/4307'
  behavior: 把 timm/mobilevit 这类带多步 reshape+transpose 再接 layer_norm 的模块交给 triton_experimental 后端编译，能编译成功、能跑完，输出 shape/dtype 都对，但数值大面积偏离 eager；换 default 后端正常。表现为模型 accuracy 流程判 fail_accuracy、下游任务指标莫名下降，单看某一行输出又「像正常数」。
  trigger_surface: triton_experimental 后端 + 多级 view 链（reshape/transpose）与 layer_norm 融合成单个归约 kernel
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
