title: 融合归约 kernel 轴索引拆分不全致 layer_norm 读错地址
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: TE 融合归约 load 地址 codegen
  behavior: triton_experimental 把视图链与 layer_norm 融成一个归约 kernel，第三遍 normalize 的 load 地址残留未拆净的 // 与 % 复合式，把 batch 位混进空间位。
effect:
  objects:
  - 数值结果
  detail: 最小片段 max|d|=1.105e+01（fp32 应约 1.9e-06）；timm mobilevit_s bs=128 推理以 fp64 金标 tol=0.001 判定 fail_accuracy，max_abs=0.2739。
  visibility: 静默错误
mitigation:
  detect: 对「多步 reshape/transpose 视图链 + 逐元素加 + layer_norm」构图，比较 compiled 与 eager 的 max|d|；TORCH_COMPILE_DEBUG=1 取 output_code.py 检查同一输入三遍 load 的地址表达式是否一致
  fix: 待定（issue closed，正文未给修复 PR）；方向：融合轴上把 // % 残式化简到与首两遍一致，或在索引层保留 2D 归约形态
