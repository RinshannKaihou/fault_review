original:
  mechanism: 'Ascend/pytorch #4771（26.2.0 众测；torch 2.7.1+cpu / torch_npu 2.7.1.post8 / CANN 9.1.0 / Ascend 910）：torch_multimodal 的 clip_vit_b32（CLIP ViT-B/32）在 torch.compile(backend="inductor", options={"npu_backend": "default"}) 下能编译并推理，图像编码分支与 eager 一致，文本编码分支（token_embedding + positional_embedding、经 encoder 的 is_causal 前向、ln_final 后按 text.argmax 取 eot 位置再做 projection）与 eager 不符，文本向量 max|Δ|=0.0268，atol=rtol=1e-3 下 allclose 失败。报告者用同一模型适配、固定种子与相同输入分别跑 DVM、NPUGraphs、NPUGraph_EX、AOT_Eager，图像与文本均通过，因此问题只在 Inductor-Triton 这条路径。报告未给出具体出错的融合 kernel 或源码定位，也未给逐算子二分。'
  source: 2026-09-14 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/4771 （open）
  behavior: 同一份 CLIP 模型、同一个文本输入，编译后的文本向量和 eager 差到 0.0268（阈值 1e-3 就不过），而图像向量完全一致；换成 DVM/NPUGraphs/NPUGraph_EX/AOT_Eager 任一后端都正常。编译不报错也不崩，只有做数值对照才发现，下游的检索/相似度会跟着偏。
  trigger_surface: torch_npu 2.7.1.post8 + CANN 9.1.0（Ascend 910）；Inductor-Triton（npu_backend=default）编译 CLIP 文本编码分支
