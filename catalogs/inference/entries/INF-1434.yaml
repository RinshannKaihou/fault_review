original:
  mechanism: 'op-plugin fp32 conv 族（conv1d/conv2d/conv_transpose1d/conv_transpose2d）在 NPU 上存在 HF32 类静默降精度，rel 误差 6.0e-4~1.8e-3（≈2^-10.5 量级，mantissa 低位宽特征），且梯度同样被污染（conv2d 3 组种子稳定 + 其余三算子 24 个形态点复测同款）。已验证无效的规避：torch.npu.set_option({''ACL_OP_SELECT_IMPL_MODE'': ''high_precision''})（已废弃不生效）、jit_compile 路径。对照实验：matmul/bmm/einsum 族同机 fp32 逐位或 <2.7e-6 达标，非平台普遍现象，缺陷限定在 conv 族 aclnn 出口的精度模式选择。issue 建议 op-plugin 侧确认 conv 族的 aclnn 出口选择（HF32 vs FP32）是否应遵循精度模式配置、文档明确 fp32 conv 精度行为与控制手段、并做家族级跟踪（四算子同根因）。复现脚本位于 A3 真机 /mnt/workspace/a3hunt/round2-3/（conv 形态矩阵与双端输出）。'
  source: 2026-10-18 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/593 （open）
  behavior: 在 Atlas A3 上用 fp32 跑 conv1d/conv2d/conv_transpose1d/conv_transpose2d，输出与 fp32 参考的相对误差达 6.0e-4~1.8e-3（HF32 类低位宽量级），无任何告警或报错；反向梯度同样偏差。两次运行逐位相同（确定性），换芯片一致；同机 matmul/bmm/einsum fp32 精度正常，可排除平台普遍现象。设置 high_precision 精度模式选项无效（选项已废弃），走 jit_compile 也无法绕开。fp16 同形态正常。
  trigger_surface: op-plugin conv 族 aclnn 路径；fp32；Atlas A3（910_9362）双芯、CANN 9.1.0、torch_npu 2.7.1.post4 实测
