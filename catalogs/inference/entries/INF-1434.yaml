title: op-plugin fp32 conv 全族静默 HF32 类降精度
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: conv 族 aclnn 出口精度模式选择
  behavior: fp32 conv1d/conv2d/conv_transpose1d/conv_transpose2d 在 NPU 上的 aclnn 出口按 HF32 类低位宽模式执行，未遵循 high_precision 精度模式配置；梯度同样被污染。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: rel 误差 6.0e-4~1.8e-3（≈2^-10.5 量级），双芯逐位相同（确定性、非随机噪声）；fp32 前向与反向梯度均偏离；set_option high_precision 已废弃不生效、jit_compile 路径无法逃逸
  visibility: 静默错误
mitigation:
  detect: 同机 matmul/bmm/einsum 对照（逐位或 <2.7e-6 达标）可排除平台普遍性；conv 形态矩阵双端逐位比对
  fix: 待定（issue open，要求 op-plugin 侧确认 conv 族 aclnn 出口选择是否遵循精度模式配置并文档化 fp32 conv 精度行为）
