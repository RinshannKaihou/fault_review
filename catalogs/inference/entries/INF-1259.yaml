  meta: '`infra_off` · Cov: `var:radix_kvcache_cross_contamination` · 触发 `no` · 置信度 `speculative`'
  mechanism: decode 节点通过 RDMA（Mooncake）接收 KV。当一个已完成的请求释放其 KV 页时，新请求可能在其入站传输**落地之前**就被分配到那些物理页 → decode 调度器从被回收的页上读到过期字节；由于元数据（`bootstrap_room`）是匹配的，整个过程静默无告警，并且跨请求累积。
  source: 'SGLang #23020（open；page-reuse 竞态只是 4 个未确认假设之一）。'
  behavior: 随请求计数渐进坍缩为乱码：准确率从第 1-50 个请求的约 94-96% 掉到第 151 个请求以后的 25-41%；重启 PD 可恢复。
  trigger_surface: 需要 P/D 分离或跨节点/RDMA 拓扑（默认实验室单机不具备）
  signature: off-manifold（infra_off）——decode 位置的一个子集上带有过期/外来 KV，比例沿序列与请求序号累积增长。捕获者：trajectory（累积型漂移，是本项目 trajectory 族最擅长的形状）、geometric（受污染位置的逐位置余弦下降）、cheap（recompute-oracle；以及「请求序号 vs 偏离度」的单调关系本身就是一个廉价判据）。漏检者：单请求快照式的 statistical / spectral——早期请求几乎无异常，签名只在长时间运行的分布尾部显现。置信度为 speculative：源 issue 未确认此机制为根因。
  repro: 随机子集污染——用单个 `self_attn` pre-hook，把 cached K/V 中一个随机位置子集替换成先前另一条 prompt 捕获的 K/V（「回收页上的过期字节」），污染比例作为参数随「请求序号」增大，以复现渐进坍缩曲线。
  locus: '`cross-node-transfer`'
  priority: '`low`'
