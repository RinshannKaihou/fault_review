  mechanism: '`flash_attn_varlen_func` 可能返回非连续（non-contiguous）的 `suffix_lse`，而 `merge_attn_states` 假定连续布局，于是索引到错误的 strided 元素，前缀/后缀的加权组合被破坏。触发概率随 TP 度与并发度上升。'
  source: 'vLLM PR #22003（强制 LSE 连续）；症状见 vLLM #22103。'
  behavior: 共享前缀工作负载上间歇性出现乱码 token；准确率约 0.55，用 `--disable-cascade-attn` 可恢复；在 batch size 为 1 时完全消失。
  trigger_surface: 同 cascade LSE merge
  signature: '`ambiguous` —— batch/TP/并发门控（batch=1 时签名消失），是 batch-invariance 检查的典型对象。触发时属 infra_off：受影响 head 的 prefix/suffix 混合权重变成任意值，产生偶发的注意力输出范数大幅偏离，以及逐位置残差 delta 的重尾分布（相对连续布局参考）。可捕获的是 statistical 族（重尾/离群检测）与 cheap 族（batch-size 变体 / 非确定性抖动探针正是为这类门控设计）；均值型 geometric 与 spectral 族会漏检，因为偶发的单 head 事件在层级聚合中被平均掉。'
  repro: 单钩子近似——在某层注意力输出上，把该层的注意力显式拆成「前缀段 / 后缀段」两次局部注意力，再用错误的 LSE 权重（打乱 stride 的取值）重新合并，只对随机子集 head 生效；并且只在 batch>1 的样本上启用，以保留 batch 门控特性。属 partial：真实 bug 的非连续性来自 kernel 内存布局，单钩子层面只能人为指定错误权重。
  locus: value-corruption
  priority: low
