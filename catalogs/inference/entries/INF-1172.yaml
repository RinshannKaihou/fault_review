  meta: '`ambiguous` · Cov: `NEW`（标定用 null —— 另见 4.3；`bug_attn_scale` 改的是数学，不是 kernel） · 触发 `config` · 置信度 `verified`'
  mechanism: 在 `attn_implementation` 的 eager / sdpa / flash_attention_2 之间切换，对**完全相同的权重**会产生数值上不同的输出：eager 是加一个 float mask；sdpa 把 softmax 与 matmul 融合并在 fp32 下计算；flash 使用不同的 masking 与累加顺序。
  source: 'transformers #36585（带 mask 时 allclose 失败）；#31787（FA2 nondeterminism）。'
  behavior: per-token 的 logit 漂移，从约 1e-3 量级（良性）一直到 argmax 翻转（在带 mask 的病态情形下）。
  trigger_surface: eager / SDPA / FlashAttention 后端切换（与 4.3 同类）；vLLM/HF 均可 A/B
  signature: 每一层都存在小幅、接近 on-manifold 的数值抖动。statistical 度量（相对参考 backend 的 per-layer cosine / L2 差值分布）能捕获；geometric trajectory 会把它标记为低幅度的宽带噪声。由于幅度与运行时噪声底同量级，单点 cheap 度量基本不可能分辨 —— 它更适合当作检测器的**标定 null**，而不是需要报警的故障。
  repro: 通过切换模型的 `attn_implementation` 属性并对照参考 backend 的隐藏态即可，无需权重改动。
