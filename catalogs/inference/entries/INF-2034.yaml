  mechanism: cann/ops-nn issue 4760（2026-08-13，closed，模式 P-011 缺索引边界检查）。loss/chamfer_distance_grad 的 aclnnChamferDistanceBackward host 侧只校验空指针与 dtype，不校验 idx1/idx2 是否落在 [0, num) 内，device 内核直接拿 idx1 作索引。源码 HEAD e16ef626bb3a837de82fb01a9f8e17ba9d065680，Ascend910B3 + CANN 9.1.0-beta.3 以 build.sh --pkg 装独立 vendor（ASCEND_CUSTOM_OPP_PATH 指向该 vendor，built_from_source=true）后复现：idx1=2（==num）返回 SUCCESS 且梯度与合法路径不同；idx1=-1 异步下发被接受，随后同步报 507035，exit 42。移走 built-in 同名算子内核后仍可复现，确认走的是源码编译内核。
  source: 2026-08-13 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4760 （closed）
