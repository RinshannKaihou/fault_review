aliases: []
title: fuse_qknorm_rope 融合致图模式恒定输出同一 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: vllm
    component: fuse_qknorm_rope 融合
  behavior: v0.18.0 图编译下开启 fuse_qknorm_rope 融合后注意力输入被改错，解码退化为每次都选同一个 token；关掉该开关即恢复。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: v0.18.0图模式、fuse_qknorm_rope默认开启、贪心解码时，Qwen2.5-1.5B-Instruct非eager对「San Francisco is a」返回「\nB\nB\nB\n」等同一token重复；加--enforce-eager或关融合后正常。
  visibility: 静默错误
mitigation:
  detect: 固定 prompt + temperature=0 各跑一次，比对 eager 与图模式输出是否一致；出现整段重复单字符即为该症状
  fix: 'serve 时加 --additional-config ''{"ascend_compilation_config": {"fuse_qknorm_rope": false}}''（issue 评论给出的规避）；issue 仍 open，未见修复 PR，现场疑与 CANN 驱动版本有关'
