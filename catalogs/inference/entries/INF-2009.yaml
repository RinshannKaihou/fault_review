original:
  mechanism: cann/ops-nn 的 matmul/mat_mul_v3/op_kernel/arch35/mat_mul_input_k_eq_zero_clear_output.h:55 边界检查写成 if (coreIdx > usedAivNum)，应为 >=。当 tailDataCount==0（totalDataAmount 被 everyAivDataCount 整除）且 coreIdx==usedAivNum 时判断为假不返回，第 64 行执行 outputGM[usedAivNum * everyAivDataCount] = outputGM[totalDataAmount] 越界写；缓冲区大小正是 totalDataAmount，合法下标 0..totalDataAmount-1。数据流上 totalDataAmount 与 aivNum 来自 tiling 数据（同文件 45-46 行），issue 给出 28/40 的可构造输入，并确认 batch_mat_mul_v3:368、fused_mat_mul:779、mat_mul_v3:253 三处调用可达。
  source: '2026-08-24 GitCode cann/ops-nn issue #5022（closed）。https://gitcode.com/cann/ops-nn/issues/5022'
  behavior: 输入 K 维为 0 的 matmul（空乘，走清零分支）在特定分核数下会写到输出缓冲区之外一个元素；过程无报错、无日志，返回结果看起来正常（K=0 时本应全 0），缓冲区相邻内存被静默改写。
  trigger_surface: mat_mul_v3 K=0 清零分支；totalDataAmount 被 everyAivDataCount 整除且 usedAivNum 小于 AivNum 的分核配置
