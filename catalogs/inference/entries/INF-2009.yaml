    component: mat_mul_v3 K=0 清零
  behavior: MatMulInputKEqZeroClearOutput 边界判断写成 coreIdx > usedAivNum，应为 >=；coreIdx==usedAivNum 时不返回，向 outputGM[totalDataAmount] 越界写
effect:
  objects:
  - 数值结果
  detail: totalDataAmount 被 everyAivDataCount 整除且 usedAivNum<AivNum（如 28/40）时，K=0 清零 kernel 在输出缓冲区末尾之外写一个元素，越界路径经 batch_mat_mul_v3、fused_mat_mul、mat_mul_v3 均可达
  visibility: 静默错误
mitigation:
  detect: 构造 totalDataAmount 被 everyAivDataCount 整除、usedAivNum 小于硬件 AivNum 的 K=0 matmul，用越界检测（mssanitizer/canary）或与 CPU 清零结果比对缓冲区尾部
  fix: issue 建议改为 coreIdx >= usedAivNum（closed）；修复 MR 与合入版本未核实
