  meta: '`infra_off`（vLLM Triton fused MoE legacy 路径（INT8/FP8 共享内核）：`per_act_token_quant` 标志**同时选择**激活 scale 与权重 scale 的索引布局——Quark `W8A8Int8MoEMethod` 的"静态 per-tensor 激活 scale + per-output-channel 权重 scale"组合走 tensor-scale 分支，**per-channel 权重 scale 被按 per-tensor 布局读取**（`int8_w8a8_moe_quant_config()` 又把 `per_out_ch_quant=False` 钉死）。组件级判决：4 专家/top-k=2 探针中把专家 3 全部 W13 通道 scale ×4 **输出无任何变化**（该专家被 4 个路由槽选中）；实验性分离两标志后扰动即影响输出、修正后的 legacy 与手工模块路径输出一致。#57092 修的是**相反组合**（per-token 激活 × per-tensor 权重），本组合在其更新后的组合测试中仍被跳过） · Cov: `NEW`（双标志共用单开关子签名；与 7.91（block-fp8 else 吞不支持值 fail-late）同属"量化粒度矩阵的未覆盖格"但本条是索引布局错读而非静默回退） · 触发 `config` · 置信度 `documented`'
  mechanism: 共享非 block W8A8 内核的 `per_channel_quant` 单布尔同时控制 per-token 激活 scale 读取与 per-channel 权重 scale 读取；Quark static INT8 的粒度组合落在两标志耦合的缺口上。组件级观察（overlay 探针 + 代码核对 `00b7847c`），**非完整模型评测**；报告者自述确定性复现脚本尚未在 GPU 运行（预测性失败声明）。
  source: 'vLLM #58532（2026-09-24 open，含组件探针设计、未路由专家控制组、双问题定位（config factory + 共享索引点）、#57092/#54959 关联与修复提案）。https://github.com/vllm-project/vllm/issues/58532'
  behavior: 无 crash——路由专家的 per-channel 校准被静默按错误布局索引（扰动不可见=校准失效面），静态 INT8 Quark MoE 输出携带系统性量化误差；FP8 共享同一实现属兼容范围但未单独复现。
