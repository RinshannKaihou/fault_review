original:
  mechanism: MindSpore 2.10.0（r2.10 日包，commit 6df146cf）+ CANN 9.0.0，8×Ascend 910B3，PyNative BF16，PP2 + MTP（num_nextn_predict_layers>0），MS_DEV_PYNATIVE_FUSION_FLAGS=--opt_level=1。第 1 步与单卡基线完全一致，第 2 步起 loss 10.450935→17.210445、grad_norm 3.336905→81.961357；关融合后 100/100 步正常。只开 Dense 或只开 GroupedMatmul 都能独立触发，故不是单个算子；隔离显示 MTP 是必要条件，辅助 loss/专家偏置、MF PR 8570、HP r1.0.0 均被排除，PP 分片梯度与单卡逐参数误差约 1.5e-7。issue 指向 lazy_fusion_op.cc / lazy_fusion_kernel.cc / lazy_fusion_flags.cc 的延迟融合执行与同步边界。
  source: 2026-07-19 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29534 （open）
  behavior: DeepSeek V3 小规模回归在 8 卡 910B3 上跑 PP2 + MTP、开 PyNative DVM 融合时，第 1 步 loss 和单卡基线一模一样，从第 2 步开始 loss 跳到 17.2、梯度范数从 3.3 涨到 82；另一个 EOD 用例第 1 步就全 NaN。进程不报错也不退出，常规功能门禁完全看不出来，只有逐步比对 loss/grad_norm 才能发现。
