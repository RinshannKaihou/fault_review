  behavior: PyNative DVM 延迟融合在流水阶段与 MTP 分支的边界上没有维护好输出地址生命周期与依赖同步，第 2 个优化器步骤起计算结果突变。
effect:
  objects:
  - 训练信号
  - 梯度
  detail: 8×910B3、PP2+MTP、开 MS_DEV_PYNATIVE_FUSION_FLAGS=--opt_level=1 时第 2 步 loss 10.45→17.21、grad_norm 3.34→81.96，另一 EOD 用例第 1 步全 NaN；关融合 100 步正常。
  visibility: 数值异常
mitigation:
  detect: PP>1 + num_nextn_predict_layers>0 + PyNative DVM 融合时同时检查第 1、2 步的 loss 与 grad_norm；只跑前向/反向不比对第 2 步会漏
  fix: 待定（issue open，无修复 PR）；已验证规避是 PP+MTP 工作负载取消 MS_DEV_PYNATIVE_FUSION_FLAGS；issue 建议核查 lazy_fusion 在流水/MTP/优化器步骤边界的地址生命周期与刷新时机
