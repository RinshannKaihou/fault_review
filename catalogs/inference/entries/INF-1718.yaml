title: flash_attn BAND mask loopCount 多 1 越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: flash_attn BAND MergeMask
  behavior: MergeMask 误把 halfS1RealSize+1 当 halfS1RealSizeLoop，s2BaseSize>=regBytes 时 loopCount 多 1，多写一整行到 attenMaskUb 之外。
effect:
  objects:
  - 数值结果
  detail: mask_mode=4、S1=31、S2=112384、D=128、PA_BNBD、block_size=512 用例 MaxAbsErr=182.42、FailRatio=1.67% 判 FAIL（修复后 0.00225/0.38%），无报错。
  visibility: 静默错误
mitigation:
  detect: BAND(mask_mode=4) 下覆盖 win_left 很大、S1 非对齐、PA_BNBD 的组合，比对 MaxAbsErr 与 FailRatio
  fix: 'PR #9114（master）/#9117（9.1.0）：loopCount 改为按 rowNumEachLoop 的 ceil 除法计算'
