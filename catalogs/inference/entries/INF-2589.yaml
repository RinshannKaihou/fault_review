title: Maximum/Minimum 整数先窄化后比较致错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnMaximum/Minimum
  behavior: 950 RegBase 的 GetComputeType 对同 dtype 输入、out dtype 不安全的组合，把 computeType 置为 out dtype 并跳过结果转换；输入先 Cast 窄化再比较，顺序与文档相反。
effect:
  objects:
  - 数值结果
  detail: self=other=INT16、out=INT8、元素 200/100 时 API 通过，200 先变 -56，max 得 100；文档语义应 max(200,100)=200 再转 INT8 得 -56。INT64→INT32 的 min 也出现 0 vs -1 分歧。
  visibility: 静默错误
mitigation:
  detect: 构造同 dtype 输入 + 可窄化/变号 out dtype 的对照（200/100→INT8、2^32-1/0→INT32），与 max-then-cast 参考比较
  fix: 待定（open；issue 给出 GetComputeType 修复方案 computeType=inDtype、needOutputCast，未见 MR/发布）
