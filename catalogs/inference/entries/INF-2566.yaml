slug: vllm_alibi_slopes_dropped_flashinfer_fp8_kv
aliases: []
title: vLLM ALiBi 模型在 FlashInfer+FP8 KV 下丢偏置
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: attention backend 选择
  behavior: 后端选择不把 ALiBi 作为条件；FlashInferImpl 保存 alibi_slopes 但从不传给 kernel，模型按无位置偏置的注意力计算。
effect:
  objects:
  - 数值结果
  - 输出分布
  - 输出内容
  detail: BLOOM-560m + --kv-cache-dtype fp8（SM89）prompt NLL 0.207→3.648；强制 TRITON_ATTN 为 0.218，说明 FP8 cache 本身正常；无 warning。
  visibility: 静默错误
mitigation:
  detect: 同一 ALiBi 模型分别用 FlashAttention 与 FlashInfer+FP8 KV 跑固定 prompt，比 prompt_logprobs/NLL；检查后端选择日志。
  fix: '#66950 让 FlashInfer 对 ALiBi 直接报错（open，未发布）；把 ALiBi 纳入后端选择条件的修复未核实'
