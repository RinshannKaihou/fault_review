title: GroupNormSiluQuant 方差误差被量化放大
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: 通用
    component: GroupNormSiluQuant 量化输出
  behavior: GroupNormSiluQuant 中分组归一化的方差/rstd 偏差经 scale 变换落到 int8 码值，方差误差被量化放大，窄方差输入下最明显。
effect:
  objects:
  - 数值结果
  detail: 1000 条全部执行成功，807 条（80.7%）判否：741 条 int8 主输出偏差中位 61 LSB、137 条整量程饱和、37 条 NPU 独有 NaN；通过组 int8 偏差恒为 0/1 LSB。
  visibility: 静默错误
mitigation:
  detect: 把通过组的 int8 偏差当对照（恒 0/1 LSB），再看失败组的偏差分布是否随窄方差输入成片抬到几十 LSB；NaN 用例单独计数。
  fix: issue 6068 已 closed，正文未给修复 PR；改方差算法还是量化 scale 计算未核实。
