  meta: '`infra_off`（int32 除法家族（div trunc/floor、remainder、fmod、scalar 提升）在 **INT32_MIN (−2147483648)** 流经残差校正路径时产生**静默、有限、貌似合理**的数值错误——WH/BH 双平台；文档化的未定义案例仅除零与 INT32_MIN/−1，其余本应正确；$5000 赏金 issue，复现文档 #51476） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 截断/向下取整整除实现先用浮点或乘法近似再以**残差符号/幅值校正**收尾；INT32_MIN 的绝对值不可表示（2^31 溢出 int32），残差计算在残差幅值与残差符号两处都可能判错，错误值有限且符号正确——通过大多数烟雾测试。scalar dispatch 与类型提升路径另有独立 INT_MIN 行为待统一。
  source: 'tt-metal #55502（2026-09-04 open，$5000 bounty，成功标准明确列出 trunc/floor/INT32_MIN/残差幅值+符号；复现 #51476）。https://github.com/tenstorrent/tt-metal/issues/55502'
  behavior: 无 crash——**整数运算静默错值**且"有限、合理"（最难测试捕获的形态）；索引/分桶/量化取整类整数管线在极端值上偏移。属「**有符号整数极限值的隐式溢出**」新子签名：|INT32_MIN| 不可表示这一 C 家族经典陷阱在硬件整数内核中的再现，与 1.123（floor_div host 倒数差一）同整数域但根因不同（彼条是除法方向、本条是表示域）。
  trigger_surface: tt-metal WH/BH + int32 div/remainder/fmod + INT32_MIN 域输入（hw_specific）
  discovery: |-
    2026-09-04 每日扫描。
