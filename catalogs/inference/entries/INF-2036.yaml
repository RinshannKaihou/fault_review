id: INF-2036
legacy_ids: []
slug: opsnn_linear_index_reciprocal_floor_offbyone
aliases: []
title: linear_index 倒数乘 floor 致 scatter_add 错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: linear_index MODE==2
  behavior: MODE==2 用 Muls(1/float(indicesStride)) 再 CAST_FLOOR 模拟整除；stride 非 2 的幂时倒数舍入使精确整数落到 q-1，线性地址整体错位
effect:
  objects:
  - 数值结果
  detail: self[2,41,2] int32、index 广播 strides=[41,1,0]、dim=1 时 164 个元素中 4 个与 CPU 不一致（out[0] NPU=42、参考=41），GetWorkspaceSize/Launch/Sync 全部返回 0
  visibility: 静默错误
mitigation:
  detect: 用非 2 幂 stride（如 41）构造 aclnnScatterAdd 广播 expand index 用例，与 CPU 参考逐元素比对；只防 fp32 溢出（<16777216）不足以拦住倒数舍入
  fix: 待定（issue 为本地 draft，未远程提交；建议改为整数除法或提升倒数精度）
