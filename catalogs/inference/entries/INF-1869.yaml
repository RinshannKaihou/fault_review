title: JSD loss 上 torch.func 梯度与 autograd 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: logsumexp+kl_div 反向
  behavior: logsumexp 与 kl_div 组合成 JSD loss 时，torch.func.grad_and_value 的反向与 torch.autograd.grad 不一致；两者单独使用都正常，根因未定位。
effect:
  objects:
  - 梯度
  detail: B,T,H,V=8,128,1024,4096 fp32 下前向 loss 两种方法完全相同，反向约 0.5% 梯度元素超出 atol=1e-5/rtol=5e-4；仅 NPU 出现，CPU/GPU 无此问题。
  visibility: 静默错误
mitigation:
  detect: 同一 loss 分别用 torch.func.grad_and_value 与 torch.autograd.grad 求梯度比 max|diff|；对 logsumexp、kl_div 单独做隔离对照
  fix: 待定（issue closed，未定位根因、未见修复 PR）
