original:
  mechanism: 'Ascend/pytorch 2.12 验证中，beit_base_patch16_224 在 torchbench 用 torch.compile 编到 mlir、akg 后端：eager 路径每步 loss 在 -0.56 附近、step time 约 48ms；compile 路径第 1 步 loss 0.0216、第 2 步 -0.0295，第 3 步起 loss 恒为 nan。每次反传都出现 ''CHECK ACCURACY FAILED! Kernel: mlir_fused_gelu_gelu_backward_view_17, Output idx: 0''，Mismatched 1~13/4841472，Greatest Abs Diff 从 3.66e-4 逐步放大到 1.96608e5、2.62144e5、3.4359738368e10，随后 dynamo 报 ''Accuracy failed: allclose not within tol=0.02''。同批 mlir_fused__softmax_backward_data_matmul_backward_17 也被列出。即编译后融合的 gelu 反向 kernel 输出了与 eager 不符的数值，误差随步数发散到 NaN。'
