original:
  mechanism: MindSpore 2.8.0（CPU 后端，Python 3.12）：target_fn 依次做 ops.add、ops.gather_nd、ops.reduce_sum，先用正常 indices 在 PyNative/Graph 各跑一次，再用 Tensor(np.empty((0,2), int32)) 的空 indices 跑。gather_nd 两侧都输出 shape (0,4) 的空张量，框架打印 ReduceSum 输入含 zero shape 的 WARNING；随后 PyNative 的 reduce_sum 返回 0.0，Graph 的 jit 版本返回 1.0，np.testing.assert_allclose 报 Mismatched elements 1/1、Max absolute difference 1.0。issue 没有给源码定位和修复 PR；正文对哪一侧返回 1.0 的表述与输出块相反，输出块显示 PyNative 0.0、Graph 1.0。
  source: 2026-05-02 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29336 （open）
  behavior: 把带 gather_nd 的模型从 PyNative 切到 GRAPH_MODE（或反向）后，indices 为空的那一步 reduce_sum 结果从 0.0 变成 1.0，其余 step 完全正常；程序不报错，只有 loss/统计量在那一步莫名偏 1，靠双模式对比测试才会命中。
  trigger_surface: gather_nd + reduce_sum 链路遇到空 indices（shape (0,2)）；PyNative 与 GRAPH_MODE 混用同一函数；MindSpore 2.8.0 CPU
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
