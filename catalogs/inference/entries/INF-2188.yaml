original:
  mechanism: 'aclnnFusedInferAttentionScoreV5 的 attenMaskOptional 校验缺失族（同接口同日三连报）：1) #7387 掩码 dtype 与 x 不一致时未拦截且输出错值（max|Δ|=0.0x 级）——掩码被按错误 dtype 解读，直接改变注意力可见性；2) #7388 innerPrecisionMode 非 0 时未报错且属性被静默忽略（两段均返回 0），精度模式请求无声失效；3) #7389 scaleValue=NaN 时未报错且被当作 1.0 参与计算（max|Δ|=0）。三者共同模式：资料未明列或未拦截的非法/边界入参在两段接口均返回 0，行为静默偏离请求语义。均为 910B/CANN 9.2.0 系实测（带复现）。来源 https://gitcode.com/cann/ops-nn/issues/7387、https://gitcode.com/cann/ops-nn/issues/7388、https://gitcode.com/cann/ops-nn/issues/7389（ops-nn 仓，均 open）。注：FusedInferAttentionScore 系算子源在 ops-transformer 仓，issue 报于 ops-nn。'
  source: 2026-10-26 每日扫描（NPU 批次 batch-20261026T230043147986-d99c34of）。https://gitcode.com/cann/ops-nn/issues/7387 https://gitcode.com/cann/ops-nn/issues/7388 https://gitcode.com/cann/ops-nn/issues/7389
  behavior: 调用 fused infer attention V5 时传入的注意力掩码如果 dtype 与主输入不一致（例如 x 是 fp16 而掩码传了 fp32 或 uint8），接口不报错、返回成功，但输出数值错误——掩码位模式被按错误类型解读，注意力可见性整体错位，输出与正确结果偏差明显（max|Δ| 达 0.0x 级）而非噪声级。同接口把 innerPrecisionMode 传非 0 值会被静默忽略（仍按默认精度算），scaleValue 传 NaN 被当 1.0 使用。上层以为设置了精度模式或特殊 scale，实际全部无声失效，只有输出对照才能发现。
