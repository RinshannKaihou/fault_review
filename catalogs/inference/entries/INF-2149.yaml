original:
  mechanism: Triton 批量 3D tl.dot（[B,M,K]x[B,K,1]，结果 N==1）在一个 warp 计算多于一个 batch（B>num_warps）时静默返回错值：线程把所有 batch 的累加器寄存器放在一个数组里，MMAv2 lowering 从一个 batch 步进到下一个时用的寄存器计数对 N==1 只有实际占用的一半，导致相邻 batch 共享寄存器。最小复现（L40S，main 6fe3348e6）：全 1 half 输入 2x16x16 · 2x16x1，num_warps=1（两 batch 同 warp）时输出 [0.0, 16.0, 32.0] 而非全 16；num_warps=2（每 warp 单 batch）正确。批间相互覆盖使结果既可能偏大又可能为 0。
  source: 2026-10-23 每日扫描 https://github.com/triton-lang/triton/issues/12394（closed，附最小复现）
  behavior: Triton kernel 里写批量 tl.dot 且第二操作数最后一维为 1（例如逐样本内积/打分）时，只要 batch 数超过 num_warps，输出静默错值：全 1 输入应得 16 的位置出现 0 或 32。无报错、无警告，调大 num_warps 到每 warp 单 batch 就正确。
  trigger_surface: Triton main（6fe3348e6）；批量 3D tl.dot 且 N==1 且 B>num_warps；复现于 NVIDIA L40S。
  discovery: 2026-10-23 每日扫描
