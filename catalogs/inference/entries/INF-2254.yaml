title: AttentionUpdate 大 LSE 公共偏移致归一权重失真输出翻倍
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: attention_update kernel
  behavior: 权重先构造 lse_out=max+log(sum(exp(lse-max))) 再 exp(lse_i-lse_out)，有限 LSE 带大公共偏移时小 log-sum 项相加被舍入丢失，权重不归一，输出显著偏离。
effect:
  objects:
  - 数值结果
  detail: FP32 sp=2 两路 LSE 均 16777216 时输出 3（正确 1.5）；LSE=1000000 输出 1.50849；7 设备场景 5 个数值失败，全部 rc=0 无报错。
  visibility: 静默错误
mitigation:
  detect: 构造大公共偏移 LSE（如全 16777216）对照组与 0 偏移基线对比输出是否仍为 1.5；权重和≠1 可直接检出。
  fix: issue 给出修复方案（权重指数改为 (lse_i-max(lse))-log(sum(exp(lse-max(lse))))，公共偏移在减法中先抵消，同步修复三个 kernel 路径与 golden），未见独立修复 PR 链接；未核实
