original:
  mechanism: SGLang v0.5.21/0.5.22 部署（非完整逐版本矩阵），两节点 GB300 MNNVL（每节点 4 GPU，跨节点 NVLink/MNNVL），Kimi-K3（moonshotai/Kimi-K3），--nnodes 2 --tp-size 8 --dcp-size 8 --dcp-comm-backend a2a --disable-custom-all-reduce --disable-radix-cache，CUDA graph 解码开，NCCL_GRAPH_MIXING_SUPPORT=1。DCP a2a 后端产生退化解码输出：失败输出初始 token 看似合理、后续退化为重复 '!'；17*23 类问题失败时答错（恢复后 391 正确）。12-prompt 贪心 smoke 探针：原始注册环境 12/12 乱码；NCCL_GRAPH_REGISTER=0（fresh server）0/12；候选启动防护（两节点、无手工 override）0/12；DCP fi_a2a 对照 0/12。issue 自述：报告观察到的 workaround 与怀疑的 NCCL graph-buffer 注册交互，确切损坏机制未确立；小 harness 未复现、#45371 PR head GPU 验证待做；探针为 smoke 非完整精度评估。
  source: 2026-10-20 每日扫描；https://github.com/sgl-project/sglang/issues/45367 ；候选修复 https://github.com/sgl-project/sglang/pull/45371
  behavior: 双节点 GB300 上以 TP8/DCP8 与 a2a 通信后端服务 Kimi-K3（开 CUDA graph）时，解码输出整体乱码：开头几个 token 看似正常，随后退化为不断重复的 '!' 字符，简单算术也答错；设置 NCCL_GRAPH_REGISTER=0 重启后同样 12 个探针全部恢复正常，换 fi_a2a 后端也正常。无崩溃无报错，服务持续返回垃圾输出。
