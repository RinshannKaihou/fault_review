title: 310P 压缩 SplitFuse 在 2049 上下文读到未来 V
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: 310P compressed attention
  behavior: 上下文长度 2049 时压缩 SplitFuse 的因果掩码只挡住 +1..+3，因果截断后 +4..+19 的未来 V 被计入当前 query 行；2048 正常。
effect:
  objects:
  - 数值结果
  detail: Q/K 全零、只把截断后 +4..+19 的 16 个 V 改成 64：目标行 0→0.5674（应保持 0），2048 时仍 0；block128/head_dim128 变体 23/384 行同样读到未来 key；无报错。
  visibility: 静默错误
mitigation:
  detect: 固定 [2048,2048] 上三角 mask + mask_type=5，Q/K 置零，只扰因果截断之后的 V，并对最后一行做阳性对照；对比 legacy 与 compressed 两条路径。
  fix: '待定（issue #21902 open；报告者附独立复现脚本）'
