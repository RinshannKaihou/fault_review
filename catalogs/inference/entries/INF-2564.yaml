original:
  mechanism: vllm-ascend 的 310P 压缩 SplitFuse（Atlas 300I DUO / Ascend 310P3，CANN 9.2.1、torch-npu 2.10.0.post7，镜像 revision 76ea9d24；dispatch 与 mask 构造读自 main 4b3bd7eb）在 context length 2049 下违反因果性：FP16、物理 KV block 64、8 query heads、1 KV head、head_dim 256、query length 384，传入与服务路径相同的固定 [2048,2048] 上三角 ND mask 与 mask_type=5（vllm_ascend/_310p/attention/attention_mask.py:24、attention_v1.py:44）。报告者把 Q/K 置零、只改 query 行 123 因果截断后 +4..+19 的 16 个 V 为 64，目标行本应保持 0，实测 compressed 路径 0→0.5673828125，legacy 路径 0→0；per-key 探针显示 2049 时 +1..+3 仍被拒、+4..+19 被放行。block 128/head_dim 128 变体在 context 32774、query 384 下 23/384 行同样读到未来 key；两张卡结果一致。
  source: https://github.com/vllm-project/vllm-ascend/issues/21902 （open，2026-11-15）
  behavior: 310P 上开压缩 SplitFuse 做长上下文 prefill 时，一旦序列长度越过 2048 边界（实测 2049、32774），部分 query 行会把因果截断之后 4~19 个位置的 V 算进来：Q/K 全零、只有未来 V 被扰动时，这些行的输出从 0 变成非零。模型仍正常出 token、无报错、无 NaN，但 attention 结果违反因果性，表现为长 prompt 的回答内容悄悄跑偏；只有把 mask 与 V 单独做探针、并比对 legacy 路径才能看见。
  trigger_surface: Ascend 310P3（Atlas 300I DUO）+ CANN 9.2.1 + vllm-ascend 压缩 SplitFuse；context length 2049（或 32774 等跨 2048 边界）；FP16、block 64/128、head_dim 256/128；固定 [2048,2048] mask、mask_type=5。
  discovery: 2026-11-15 每日扫描
