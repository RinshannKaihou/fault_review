title: 动态 shape argmax 返回 tile 内局部下标
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: triton_helpers 双源归约
  behavior: looped reduction 的 index 累加器是循环携带的，喂给双源 tl.reduce 后本后端返回当前 lane 坐标而非累加器里的全局下标，每轮把下标重置为 tile 内偏移。
effect:
  objects:
  - 数值结果
  detail: 动态 shape 且归约轴长度超过单个 tile 时，需要 indices 的 argmax/argmin/max(dim=) 返回的下标被限制在 tile 长度内，与 eager 大面积不一致；归约轴不超过一个 tile 的静态 shape 不暴露。
  visibility: 静默错误
mitigation:
  detect: 动态 shape 下对归约轴做 argmax/argmin 并与 eager 比 indices 范围；看返回值是否全部落在 tile 长度内（静态小 shape 用例查不出来）
  fix: dynamic_shape_opt 分支提交 afa0b99b4 改为两次单源归约（先求极值再求最小下标），并配 50a658b57 用内建 tl.max/tl.min 避开 tl.reduce 编译慢路径；两提交须一并合入，未核实是否已进主线
