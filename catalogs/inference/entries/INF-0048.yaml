  meta: '`infra_off`（SFPU 指数下溢 clamp 致大负输入 Inf/NaN） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`xielu` 大负分支调用私有 helper `_sfpu_neg_exp_f32_`，该 helper 将缩放后的指数 clamp 在 `UNDERFLOW_THRESHOLD = -126.5`。对 x∈[-95,-80]（正确值约 26 的小正数），SFPU 返回 Inf（bf16）/NaN（fp32）及 ~1e38 量级的符号翻转。Wormhole B0 实测 60 输入点：bf16 下 1 个非有限输出 + 9 个 >1e30；fp32 下 3 个非有限。'
  source: 'tt-metal #52607（2026-08-08 open）。修复 #52608。https://github.com/tenstorrent/tt-metal/issues/52607 。补充来源：tt-metal #54046（2026-08-22 closed，$7000 bounty——同 helper `_sfpu_neg_exp_f32_` 的指数重构 underflow clamp 区间错误：x<−87.68 全域 21,232 点密集扫描 ~0.9% 点绝对误差>1、极值达 ±2.7e38（≈FLT_MAX×1.25）与 NaN，含 source 级 fp32 IEEE 位语义模型交叉验证；`ttnn.xielu(-90) → 2.34e37` vs 正确 26.2）。https://github.com/tenstorrent/tt-metal/issues/54046'
  behavior: 无 crash、无 assert。激活函数对特定输入范围返回 Inf/NaN 及大符号翻转值→静默毒化下游（若 xielu 用于 MLP 激活则整层输出错）。属「SFPU 激活函数域外指数 clamp 致非有限输出」签名，与 1.43-1.47 同 SFPU 数值原语族。
  trigger_surface: tt-metal SFPU；xielu + 大负输入（Wormhole B0）
  discovery: 2026-08-08 每日扫描。
