id: INF-2331
legacy_ids: []
slug: ops_nn_scatter_nd_update_shape_constraint_unchecked
aliases: []
title: aclnnScatterNdUpdate 形状约束不校验越界读静默写入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: scatter_nd_update 校验缺失
  behavior: 两段式接口对资料明写的两条约束（updates 形状必须等于 indices.shape[:-1]+varRef.shape[a:]；索引维度数 a 必须 ≤ varRef.rank）不做任何校验，第一段全部返回 0。
effect:
  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: updates 偏小/偏大或 a>rank 时直到流同步才暴露设备侧异常，或干脆静默把越界读到的值写进 varRef；报告者实测非法输入部分场景静默写入错误值无任何报错。
  visibility: 静默错误
mitigation:
  detect: 调用前自行校验 updates.shape == indices.shape[:-1]+varRef.shape[a:] 与 a<=varRef.rank。
  fix: 待定（issue open，未见修复 MR）
