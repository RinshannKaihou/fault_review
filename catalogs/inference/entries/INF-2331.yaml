original:
  mechanism: 'cann/ops-nn issue #7858（2026-10-31，Ascend 910B3/CANN 9.2.0，ops-nn master 稀疏检出）：aclnnScatterNdUpdate 的两段式接口对「updates 形状必须等于 indices.shape[:-1] + varRef.shape[a:]」与「索引维度数 a 必须 ≤ varRef.rank」两条资料明写的约束不做任何校验。实测探针（varRef=FP32[7] 初值 1..7、indices=INT64[3,1]、updates 三种尺寸 + indices=[3,2]（a=2>rank=1））：GetWorkspaceSize 全部返回 0，第二段也返回 0，直到 aclrtSynchronizeStream 才暴露设备侧异常，或者干脆静默把越界读到的值写进 varRef。issue 附自包含 C++ 探针（g++ 编译运行）。'
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7858 （open，2026-10-31 创建；含自包含形状约束探针）
  behavior: 用 aclnnScatterNdUpdate 做scatter 更新时，若 updates 张量尺寸与 indices 推导不符（偏小/偏大）或 indices 维度数超过 varRef 秩，接口第一阶段照样返回成功；随后要么在流同步时才报设备异常（晚且难定位），要么更糟——不报错并把越界读到的脏值静默写进目标张量，原地参数被污染且无任何信号。
  trigger_surface: cann/ops-nn scatter_nd_update；updates 形状失配或 indices 维度数 a > varRef.rank；ACLNN 两段式直调；910B3/CANN 9.2.0。
  signature: 非法形状第一段返回 0；varRef 被写入与 updates 无关的越界读值。
  discovery: 2026-10-31 每日扫描
