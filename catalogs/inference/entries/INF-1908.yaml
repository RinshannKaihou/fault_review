original:
  mechanism: vllm-ascend 0.20.2rc1（releases/v0.20.2rc，vLLM 0.20.2、CANN 9.0.0、torch_npu 2.10.0、Ascend 910A3）的 tests/e2e/nightly/single_node/ops/singlecard_ops/triton/test_chunk_gated_delta_rule.py::TestChunkGatedDeltaRule::test_triton_fusion_ops 用 torch.randn(1,17,4,128) 构造 T=17 的 packed q/k/v，却传 q_start_loc=torch.range(0,3)（即 cu_seqlens=[0,1,2,3]，累计长度仅 3），违反 varlen 下 cu_seqlens[-1]==seqlen 的契约；同时 initial_state 为 3 个序列。用例只 assert 输出 shape 为 (1,17,8,128)/(3,8,128,128)，不校验数值。该输入使 chunk_gated_delta_rule_fwd 调用的 AscendC 算子 chunk_fwd_o 在 chunk_indices=None 时越界读 GM，报 AICORE 507015（MPU address access invalid）。由于 NPU 执行异步，CPU 侧 shape 断言看不到设备故障，测试显示 PASSED；故障只在进程退出同步时以 warning 出现，或 ASCEND_LAUNCH_BLOCKING=1 时硬失败。
  source: 2026-08-05 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10572 （open）
  behavior: CI/夜间单测报告 chunk_gated_delta_rule 融合算子用例通过，但实际上用例输入自相矛盾并触发设备越界访问，测试只比较 shape 所以没发现；算子正确性完全未被验证，故障被测试结果掩盖。
  trigger_surface: Ascend NPU 夜间单测（GatedDeltaRule triton 融合算子，异步执行）
