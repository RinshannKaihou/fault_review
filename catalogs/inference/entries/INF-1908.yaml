title: GatedDeltaRule 单测输入自相矛盾且只验形状
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: vllm
    component: chunk_gated_delta_rule 单测
  behavior: 用例构造 cu_seqlens=[0,1,2,3]（总长 3）却配 T=17 的 packed 张量，且只断言输出 shape；NPU 异步执行使 chunk_fwd_o 的越界故障不在断言处暴露。
effect:
  objects:
  - 测试判定
  detail: Ascend NPU 夜间单卡用例报告显示 PASSED，算子正确性未被验证；AICORE 507015（MPU address access invalid）仅在进程退出同步时以 warning 出现，或设 ASCEND_LAUNCH_BLOCKING=1 时硬失败。
  visibility: 静默错误
mitigation:
  detect: 开启 ASCEND_LAUNCH_BLOCKING=1 重跑该用例，并校验 cu_seqlens[-1] 是否等于 packed seqlen T
  fix: 修正测试输入（cu_seqlens 与 T 一致）并增加数值正确性断言（issue 提议，open）
