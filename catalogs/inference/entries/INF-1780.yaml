original:
  mechanism: vLLM 0.32.1rc1.dev66+g2aa5080fa，H100，MRV2/TP1/eager/无前缀缓存，FLASHMLA_SPARSE_DSV41+fp8_ds_mla KV，六层随机权重 DSV4.1 配置（128-token 窗口）。DeepSeek-V4.1 decoder replay 对带 prompt_logprobs 的请求保留所有 prefill 行，但未检查 prompt_logprob_token_ids：candidate-scoring 请求可像生成一样被修剪——eager 下长于 128-token 窗口的 chunk 被裁（PIECEWISE 达 decoder_replay_trim_threshold=768 也裁）。300-token 输入实测未修复路径保留行 172-299：scoring start=0（172 行在窗外）max abs err 1.873845、实际 next token 单独峰值 1.851233；start=100 差 1.42；start=172/200（不触裁剪位）仍差 0.238/0.146；被裁位置输出统一 -log(4096)。参考=同请求 prompt_logprobs=0（全保留）。修复（行保留条件加 prompt_logprob_token_ids is not None）后全部 0；两 chunk prefill、raw logits、重复候选、padding、混合请求均过；官方权重未测。
  source: 2026-10-20 每日扫描；https://github.com/vllm-project/vllm/issues/62651
  behavior: 在 DeepSeek-V4.1 上开 decoder replay 并用 prompt_logprobs/prompt_logprob_token_ids 做候选打分（如 RL rollout 评分、评测）时，返回的 logprob 分数形状正确但数值错误：窗口外位置给出统一的 -log(4096) 假值，窗口内位置的分数也可偏差 0.1–1.9 nat，足以改变候选排序；同请求用全保留参考即可比对出差值。生成类请求不受影响。
