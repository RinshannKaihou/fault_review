title: TopK 选中集合缺失真实最大值且跨次不同
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnn TopK（950PR）
  behavior: 同一输入多次 topk，返回的 k 个下标集合不稳定，且未选中元素中存在比选中集合最小值更大的值，选中集合不是真正的 top-k
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: Ascend950PR + CANN 9.1.0（torch_npu 2.7.1）：x.topk(k,dim=-1) 200 次循环内即命中 unselected_max > selected_min；相同输入不同批次结果有的相同有的不同，无报错
  visibility: 不可复现
mitigation:
  detect: 对 topk 的下标做 mask，比较未选中最大值与选中最小值（unselected_max > selected_min 即违例），循环多次；或与 CPU topk 逐元素比对
  fix: 待定（issue closed，未见修复 commit/MR）
