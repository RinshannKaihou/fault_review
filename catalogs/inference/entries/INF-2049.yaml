  mechanism: cann/ops-math issue 2641（2026-08-15，closed）：Ascend950PR、CANN 9.1.0（version.info timestamp 20260730_231653901）、x86_64，torch + torch_npu 2.7.1。调用 flat_idx = sub_score_reshape.topk(total, dim=-1).indices，相同输入多次运行返回的下标集合不一致，截图对比两次结果有的相同有的不同。报告者补的最小复现 has_rank_violation 在 device 上跑 x.topk(k,dim=-1)，用 scatter 标记选中集合后比较 unselected_max 与 selected_min，一旦 (unselected_max > selected_min).any() 即说明选中集合漏掉了更大的值，200 次循环内即可命中。正文未给出 k、shape、dtype 与具体错误条数，也未定位到 sort/merge 哪一级。
