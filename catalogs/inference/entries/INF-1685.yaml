title: 标量 Grid1D kernel 按 48 核发射致 loss 数据竞争
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: Inductor launcher grid 计算
  behavior: 零 free-x-node 的 xnumel=1 标量 kernel 未被按 xnumel 限制 grid_0，按 48 核发射；program_id 不参与寻址，48 个 program 同写 in_out_ptr0[0]。
effect:
  objects:
  - 训练信号
  - 数值结果
  detail: DeBERTaV2/ALBERT/MobileBERT/RoBERTa QA 的 start/end logits、梯度与参数更新均通过精度检查，仅最终 loss 标量偏 3~6；关 ACLGraph 仍复现，呈非确定性竞争。
  visibility: 不可复现
mitigation:
  detect: 对 grid_type=Grid1D、npu_num_x_nodes=0、xnumel=1 的标量 kernel 检查实际 grid_0；或把 loss 标量与逐项指标分开比对，loss 单点偏差而其余全对即指向该路径
  fix: 待定（issue closed，正文只给期望行为）：非 reduction 的零/单 free-x-node Grid1D 应按 xnumel 计算 launch grid，xnumel=1 只启动一个 program
