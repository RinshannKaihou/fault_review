title: flashinfer 块缩放量化守卫旧值致 SF 下溢 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: flashinfer
    component: 块 SF 零守卫用舍入前值
  behavior: 5 处块缩放量化站点守卫舍入前 vecMax 却用 fp8 舍入后 SFValue：SFScaleVal*vecMax/6<=2^-10 时 SF 舍为 0 而守卫通过，reciprocal(0)=inf，零元素 NaN、非零元素 inf
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: 受影响窗口为块最大值约比张量最大值低 2^18.8（~460000×）的块（全局 scale 顶格放置时）；nvfp4 GEMM/DiT norm/FP4-KV 量化输出含 NaN/inf；纯零块走守卫分支不受影响
  visibility: 数值异常
mitigation:
  detect: 输出 NaN 扫描（触发窗口确定性）
  fix: 仓内已有正确形态（#2441 修 cvt_warp_fp16_to_mxfp8 守卫 SFValue!=0；trtllm_moe_allreduce_fusion.cuh L622 同），5 站点对齐即可；修复未提交
