original:
  mechanism: 'cann/ops-nn GatherElementsV3 的 Host tiling 将展平维度乘积直接写入 uint32_t，Kernel 也用 32 位元素偏移访问 x。对合法 shape x=[1,2,65536,65536]、index=[1,2,1,1]、dim=1：xPost=65536×65536=2^32 回绕为 0，第二个结果读取错误位置。修复 PR（ops-nn !12137，open，关联 issue #6799）在 Host tiling 窄化前检查维度乘积及 Kernel 可表示的访问范围，超范围返回明确错误；新增 host tiling UT 覆盖大 x shape 拒绝路径与小 shape 正常路径。验证：无分配整数探针复现 xPost 回绕与守卫拒绝；pre-commit 通过；完整构建与 NPU 实测未运行。'
  source: 2026-10-17 GitCode cann/ops-nn PR https://gitcode.com/cann/ops-nn/merge_requests/12137 （open；关联 issue https://gitcode.com/cann/ops-nn/issues/6799 ）
  behavior: 在 NPU 上调用 GatherElementsV3 且展平后 post 维度乘积达到 2^32（如 x 形状 [1,2,65536,65536]）时——这是完全合法的 shape——乘积回绕为 0，部分输出元素从错误位置读取、数值静默错误，不报错不越界崩溃。
  trigger_surface: GatherElementsV3 + 大 shape（post 乘积 ≥2^32）；Host 探针复现，设备端未实测
