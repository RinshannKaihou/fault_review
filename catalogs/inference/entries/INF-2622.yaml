original:
  mechanism: vLLM 0.34.0（main 99d66fffac23，torch 2.14.0+cu130，Tesla T4）的 vllm._custom_ops.grouped_topk 不校验 scores.is_contiguous()，也不使用 scores.stride(0)。传入 2D 切片 scores = base[:, :num_experts]（base 为 4×48 全 99，前 16 列写入随机值）时，切片与连续副本 torch.equal 成立，但分组 top-k 的权重 max_abs_diff=0.0792249，indices 也随之偏离；连续副本与连续原张量的结果一致。原因是 CUDA 核按连续行主序寻址，行间实际间隔 48 个元素却被当成 16 个，越过切片边界读到 padding 列。期望 honor scores.stride(0)，或在入口用 STD_TORCH_CHECK(scores.is_contiguous()) / .contiguous() 显式处理。最小复现：base=torch.full((4,48),99.)，base[:,:16]=torch.randn(4,16)，比较 ops.grouped_topk(sv,...) 与 ops.grouped_topk(s_s,...) 的 weights。
  source: https://github.com/vllm-project/vllm/issues/70379（open，2026-11-27，含 torch.equal 前提与 0.0792 权重差复现）
  behavior: 把 MoE 的 scores 以非连续切片（例如从更大的 buffer 里切出前 num_experts 列）传给 vLLM 的 grouped_topk 时，路由权重和专家索引会算错，权重最大差 0.08 左右；切片和连续张量在 PyTorch 里数值完全相同，所以调用方完全看不出异常。接口不报错、不告警，MoE 层据此选错专家并加权，模型输出静默劣化。
  trigger_surface: vLLM 0.34.0 / main 99d66fff；vllm._custom_ops.grouped_topk；scores 为非连续 2D 视图（stride(0) 大于行宽）；连续输入正常
  discovery: 2026-11-27 每日扫描
