slug: vllm_grouped_topk_noncontiguous_scores_wrong_weights
aliases: []
title: vLLM grouped_topk 非连续 scores 路由权重错
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: vllm
    component: grouped_topk CUDA 核
  behavior: grouped_topk 不校验 scores 连续性、也不使用 stride(0)，对 base[:, :num_experts] 这类隔列视图按连续布局读取，路由权重静默偏离。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: 4×16 的 base[:, :16] 视图与连续副本 torch.equal，但 grouped_topk 权重 max_abs_diff=0.0792；不报错，专家选择与加权随之偏离。
  visibility: 静默错误
mitigation:
  detect: 把 scores 拷成连续副本与隔列视图分别调用 grouped_topk，比较 weights/indices；视图与副本数值相等是前提条件。
  fix: 待定（issue open；期望 honor stride 或显式 is_contiguous 检查）
