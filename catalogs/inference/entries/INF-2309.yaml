original:
  mechanism: 'cann/ops-nn FakeQuantWithMinMaxVarsPerChannel 在 TTK geir 通路 L0 精度比对失败 22 例（issue #7791，Ascend950PR，cann/golden/ttk 20261013，float32 absolute_precision 1e-8，用例来自社区 sleeveen/operator_test_case 656 例）：(1) 倒置通道（min>max）输出语义与 TF 不一致——三输入同随机域独立采样必然出现倒置通道，kernel 比对参考 golden 链 clamp 顺序（torch.clamp 先 max 后 min，倒置域取 nudged_max 侧）与 TF 原生 functor cwiseMin(nudged_max).cwiseMax(nudged_min)（先 min 后 max，倒置域取 nudged_min 侧）相反，与 TF 一致的 NPU 输出被比对判错，该域偏差达量程全跨度（max_abs_error≈200）；(2) 相等通道（min==max≠0）kernel 按退化清零输出 0，TF 原生 Nudge 的 inv_scale=+inf → 0×inf=NaN 整通道 NaN，比对呈 Expected:nan/Actual:0.0；(3) round 0.5 边界：参考 golden 链 inv_scale 为 python 标量/tensor 除法两步舍入与 IEEE 单步差 1 ULP，t=shift×inv_scale 在边界分落两侧产生 ±1 量化级失配（8-bit 宽量程超 0.01 绝对门限）。001 例 matched_ratio≈0.4789 与 P(min<max) 逐位吻合证实倒置域占比解释。注意：该单混合含「比对参考链自身缺陷」与「kernel 语义偏离 TF」两层，issue 要求两侧都按 TF 原生语义对齐。'
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7791 （open，2026-10-30 创建；含三类形态定位、matched_ratio 概率吻合证据与 TTK 命令）
  behavior: 量化感知训练的 per-channel 伪量化算子：当某通道 min>max（倒置，随机初始化常见）时 NPU 输出取的边界与 TensorFlow 相反，偏差达整个量程（约 200）；当某通道 min==max≠0 时 NPU 输出 0 而 TF 语义输出整通道 NaN。做跨框架量化对齐/移植时（TF→NPU）这些通道的结果完全对不上，且量化精度评测用例整批 FAIL（22 例），训练侧 QAT 在含倒置/相等通道时梯度与 TF 实现分叉。无崩溃，仅数值与评测判定错。
  trigger_surface: cann/ops-nn fake_quant_with_min_max_vars_per_channel；per-channel min/max 倒置（min>max）或相等（min==max≠0）通道；fp32；geir/TTK 与 TF 参考比对。
  signature: matched_ratio≈P(min<max)；Expected:nan/Actual:0.0；倒置域 max_abs_error≈量程。
  repro: issue 附 TTK 命令与用例集路径（L0_tolerance_c_s_001/008/016 点名）。
