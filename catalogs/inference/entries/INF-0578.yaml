  meta: '`infra_off`（GLM-5.3-Flash sparse-MLA indexer 的 prefill workspace 以 `get_max_prefill_buffer_size()`（token 计数）原样申请，而该 indexer 的 KV 是 **pool 粒度**且 `compress_ratio == index_kpool`、`split_indexer_prefill_chunks()` 吃的是压缩后序列长——`deepseek_v4/attention.py` 同一调用点已除以 compress_ratio，GLM 路径漏除：1M 上下文下 per-GPU 多锁 ~2.6 GiB（KV 可用 29.44→32.06 GiB、池 4.50M→4.90M token，1M needle 检索 4/4 不变）） · Cov: `var:vllm_kv_pool_first_boot_capacity_under_allocation`（6.173 容量失准族；亦为 12.29 profiler 盲区的静态变体） · 触发 `partial` · 置信度 `documented`'
  mechanism: 单位错配（token vs pool granule）+ 姊妹模型路径已有修复未对齐——与 1.153（div_bw 修复未回灌兄弟 op）同「修复存在于相邻路径」模式。#53906 引入的两缺陷之一（另一为 fp8 KV dtype 拒绝，见 8.62）。
  source: 'vLLM #55221（2026-09-03 open，与 #53906 关联；右值化前后 KV 池对照 + needle 检索回归）。https://github.com/vllm-project/vllm/issues/55221'
  behavior: 无 crash——静默容量损失（~8% KV 池），长上下文吞吐/并发下降；needle 检索不变使其难被功能测试发现，只显形为容量账目。
  trigger_surface: vLLM + GLM-5.3-Flash + 1M 级 `--max-model-len`（config 触发）
  discovery: 2026-09-03 每日扫描。
