  mechanism: '`token_to_kv_pool.get_size_per_token()` 按 `head_dim * head_num * layer_num * 2` 计算每 token 尺寸，隐含假定 K 与 V 共享 `head_dim`；对于 `v_head_dim != head_dim` 的模型（MiMo V2.5），V 被按 K 的维度分配，于是 `set_kv_buffer` 把 V 写进了形状错误的槽。'
  source: 'SGLang #26734（MiMo V2.5 + HiCache）。'
  behavior: 源文档未给出该字段。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: '`infra_off`，且带明确的 K/V 不对称：V 张量离流形而 K 完全干净——逐层可见 V 与 K 的损坏不对称，注意力输出范数暴涨而注意力**前**的状态保持干净。损坏覆盖整个 V 区域（所有位置），这与单位置的 `kv_corrupt` 是不同的空间形态。可捕获的是 geometric 族（注意力输出范数暴涨）与按 K/V 分解的探针；只看残差流输入侧的度量会完全漏检。'
  repro: 方案：单钩子对某层缓存 V 施加「按错误 head_dim 重新 reshape + 截断/补零」的整体形变，K 保持不动，以复现 V 全域损坏 + K 干净的不对称。属 partial：标准架构的 `v_head_dim == head_dim`，错配必须人为构造。
