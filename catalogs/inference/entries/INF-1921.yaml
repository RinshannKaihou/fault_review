original:
  mechanism: 现象：mindformers/pynative/distributed/parallel_dims.py 的 ParallelDims 在构造 EP 的 sparse mesh（轴布局 [pp, dp_replicate, efsdp, ep]）时，ep 嵌套在 dp_replicate 内部，本应满足 efsdp*ep == dp_shard*cp*tp，但 build_mesh() 直接用 `efsdp = fsdp * self.tp // self.ep`（fsdp = dp_shard*cp）的整除结果建 mesh，_validate() 对 ep 与该区域的整除/上界关系完全没有校验。最小复现：16 卡 dp_replicate=4、dp_shard=2、cp=1、tp=2、pp=1、ep=8（由 dp_replicate*dp_shard*cp*tp*pp==world_size 推出），EP 区域 dp_shard*cp*tp=4 < ep=8，efsdp=4//8=0，sparse mesh (pp=1, dp_replicate=4, efsdp=0, ep=8) 乘积为 0，问题直到后续 _unflatten/_validate_meshes 才以与根因无关的 mesh size mismatch 暴露。对照：dp_replicate=1、dp_shard=2、cp=2、tp=2、ep=8 合法（EP 区域=8，可整除）不受影响。环境：Ascend 910B，MindFormers master pynative + hyper_parallel DTensor/DeviceMesh；该逻辑是纯 Python 维度推导，与卡型无关。
  source: '2026-06-18 GitCode mindspore/mindformers issue #2370 https://gitcode.com/mindspore/mindformers/issues/2370（closed）'
  behavior: 按合法 world_size 约束配出 ep 大于单个 dp_replicate 组内 dp_shard*cp*tp 的并行配置（例如 HSDP 下把 ep 开到 8）时，启动校验一声不响通过，训练走到 mesh 构建/展开阶段才崩，报的是一个和 ep、efsdp 毫无关系的 mesh size 不匹配，从日志完全看不出是并行维度配错；排查只能手工反推 sparse mesh 各轴乘积。同样的模型把 dp_replicate 设成 1 就一切正常，很容易误判成环境或版本问题。
  trigger_surface: PyNative + hyper_parallel DeviceMesh + HSDP（dp_replicate>1），且 ep > dp_shard*cp*tp 或 ep 不整除该区域
  discovery: 2026-10-21 GitCode 历史 issue 回填（mindspore/ms* 簇第二池）
