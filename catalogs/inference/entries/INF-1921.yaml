id: INF-1921
legacy_ids: []
slug: mindformers_parallel_dims_efsdp_silent_zero
aliases: []
title: ep 越界时 ParallelDims 让 efsdp 静默塌 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindformers
    component: ParallelDims.build_mesh
  behavior: build_mesh 用 efsdp=fsdp*tp//ep 的整除结果建 EP sparse mesh，_validate 既不校验 ep 能否整除 dp_shard*cp*tp，也不校验 ep 上界，越界时 efsdp 直接为 0
effect:
  objects:
  - 可用性/进度
  detail: 16 卡 dp_replicate=4/dp_shard=2/cp=1/tp=2/ep=8（EP 区域仅 4）时 sparse mesh 乘积为 0，非法配置不在校验期被拒，直到 _unflatten/_validate_meshes 才报与根因无关的 mesh-size 不匹配
  visibility: 报错
mitigation:
  detect: 构造 ParallelDims 后打印 build_mesh() 的 sparse mesh 轴与乘积，检查 efsdp*ep 是否等于 dp_shard*cp*tp
  fix: issue 只给期望（_validate 阶段拒绝并提示增大 dp_shard 而非依赖 dp_replicate），未附 PR（closed，修复状态未核实）
