slug: vllm_ascend_qwen3vl_long_image_nan_kv_pollution
aliases: []
title: Qwen3-VL 长文加图触发 NaN 并永久污染 KV cache
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: vllm
    component: torch.compile 多模态图
  behavior: vllm-ascend 的 torch.compile 后端为“长文本 + 图像”这一输入形状生成的图数值不稳定，fp16 与 bf16 都产出 NaN；具体算子未定位。
effect:
  objects:
  - 输出内容
  - KV状态
  detail: 约 8600 token 文本 + 一张图的请求输出全是 '!!!!'（NaN），此后连 hello world 也全是 '!!!!'，KV cache 被永久污染只能重启；加长超时与换 dtype 都无效。
  visibility: 数值异常
mitigation:
  detect: 同一服务先发简单请求确认正常，再发长文本+图请求，然后重发简单请求；若第三条也开始输出 '!!!!' 即命中 KV 污染，查 attention 输出是否 NaN
  fix: 待定（issue closed，未给修复 PR）；规避：重启服务清空 KV，或对该多模态长序列形状关掉编译（enforce_eager）待验证
