original:
  mechanism: Qwen3-VL-32B-Thinking 在 vllm-ascend（vLLM v0.11.0，910B2，TP=4）上跑一个约 8600 token 的长文本 + 一张图的请求会稳定触发 NaN：输出是一串 '!!!!'。更严重的是 KV Cache Pollution——服务刚起来时简单请求（hello）是正常的，发过那条“坏”请求之后，连 hello 都开始输出 '!!!!'，且不会自愈，只有重启服务才能恢复。报告者排除了精度/超时解释：bf16 与 float16 都会复现；把 VLLM_SHM_BROADCAST_TIMEOUT_MS 提到 20 分钟让服务熬过长编译后，仍然输出同样的 NaN，说明不是 timeout 而是数值问题。报告的判断是 vllm-ascend 的 torch.compile 后端为这个“长文本 + 图像”输入形状生成了数值不稳定/损坏的计算图，具体是哪个算子未定位。服务端日志没有报错、没有崩溃，只有 APIServer 后续的 500。
  source: 2025-10-31 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/3934 （closed）
  behavior: 多模态模型（Qwen3-VL 这类）收到一条长文本 + 图片的请求后，回答变成一串感叹号；更麻烦的是这条请求会把这个 serve 的 KV cache 弄脏，之后所有请求（包括 hello world 这种最简单输入）都输出感叹号，只能重启进程。换 fp16/bf16、调大超时都无效，日志里也看不到报错。
  trigger_surface: Qwen3-VL 类多模态模型 + torch.compile（compilation level 3 + cudagraph）+ 长文本（约 8.6k token）与图像同请求；短请求与关闭编译未验证
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
