    component: MooncakeConnectorV1 P→D
  behavior: P/D 均启用 prefix caching 时，污染被锁定在 P→D KV 传输与前缀缓存命中路径，疑似 D 侧缓存与传输 KV 交互，致重复相同长 prompt 间歇性输出损坏；直连未复现。
