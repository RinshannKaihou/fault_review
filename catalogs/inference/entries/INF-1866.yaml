id: INF-1866
legacy_ids: []
slug: npu_fft_c2r_missing_truncate_conjugate
aliases: []
title: NPU _fft_c2r 未截断/共轭致结果与 CPU 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: _fft_c2r opapi 实现
  behavior: c2r 执行前没有把输入最后一维截断/补零到 out_sizes/2+1，hfft 方向也没有对输入取共轭，NPU 直接拿原长度复数输入做变换。
effect:
  objects:
  - 数值结果
  detail: 4 点复数输入、last_dim_size=4 时 CPU 得 [-1.1455,-0.0125,-0.5291,1.3803]，NPU 得 [-0.6020,1.1085,-1.0726,0.2593]，四个元素全不同；同例在 CUDA 与 CPU 一致。
  visibility: 静默错误
mitigation:
  detect: 同一复数张量在 CPU/NPU 各调一次 aten._fft_c2r 逐元素比对（报告含 4 元素最小样例）
  fix: 待定（issue closed，未见合并 PR）；报告者的补丁在 c2r 前置截断/补零至 N/2+1 并对 hfft 取共轭后不一致消失
