original:
  mechanism: 'torch_npu master（2.13）/Ascend 950 的 Inductor 后端存在两处独立数值正确性缺陷，均由 PyTorch v2.13.0 社区用例的 NPU 测试入口复现（test_torchinductor.py::GPUTests::test_pixel_shuffle_channels_last_npu 与 test_cuda_repro.py::CudaReproTests::test_dynamic_persistent_reductions）。缺陷一：channels-last pixel_shuffle 拆轴时将相对 divisor 用于根坐标查找并错误复用旧坐标，宽度索引中的取模被消去，原用例 54758/73728 个输出超差。缺陷二：动态 persistent 归约使用首次输入的尺寸 hint 选择归约块，当归约长度由 31 增至 33 时仍用 32 大小的块，尾部 mask 无法修复块本身过小，漏算有效元素；复现入口对 (x+1).sum(0) 用 torch.compile(dynamic=True) 约束首维 ≤64，依次输入 31×127、32×128、33×129 与 CPU 参考比较，跨 32 时出现漏算，报 AssertionError: Tensor-likes are not close。报告给出修复方向：子轴查找用根坐标 divisor、仅完整长度恒等取模才复用原坐标；复用上游 _get_persistent_RBLOCK 按可证明动态上界确定归约块。上游 GPU Inductor 对应路径正确，属 NPU 后端移植缺陷。'
  source: https://gitcode.com/Ascend/pytorch/issues/5632
  behavior: 用 torch.compile 在 NPU 上编译模型后结果与 eager/CPU 参考对不上：channels-last 的 pixel_shuffle 层输出大片元素数值错误（用例约 74% 元素超差，最大绝对差约 3.9）；开 dynamic=True 的归约（如 sum）在输入尺寸从 31 变到 33 后结果漏算、与参考 not close 断言失败；全程无报错无 NaN，只有比对时才发现错值。
  trigger_surface: torch_npu master/2.13 + Ascend 950；torch.compile 图模式；channels-last pixel_shuffle 或 dynamic=True 的 persistent 归约，归约长度跨 32 边界。
  discovery: 2026-10-24 每日扫描
