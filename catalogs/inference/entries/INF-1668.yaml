title: TE softmax store 丢归约掩码致 pad lane 写穿行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: TE store 掩码重建
  behavior: store 掩码重建把 lane 形融合归约节点误判为外层标量而不加 r0_mask；R0_BLOCK=16 大于段长 14 时 pad lane 地址越过行边界。
effect:
  objects:
  - 数值结果
  detail: SAM 输出 990 个 NaN：5 行整行 196 全坏，5 行仅 col0/1 坏；内核级对拍 155,998 个错配、修复后 0；普通行最后两个位置被邻居覆盖（0.00236 而非 0.00028），全掩码行 pad NaN 经 maximum 扩散整行。
  visibility: 数值异常
mitigation:
  detect: 末维 196、含全掩码行的 softmax 输入（R0_BLOCK=16>14）编译后与 eager 对拍，检查相邻行 col 0/1 是否被改写或出 NaN；也可内核级按地址公式构造参考值
  fix: MR https://gitcode.com/Ascend/pytorch/merge_requests/47195 （open，未核实是否合入）：在白名单构造处 triton.py:3662 把分解式含内层 lane 符号的融合节点纳入白名单（+11/-1）
