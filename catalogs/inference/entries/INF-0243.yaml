  meta: '`infra_off`（#57179「fit approximate tanh on a 6-entry SFPLUT」reland（`10110bf223d`，2026-09-21 merge）使 **Llama 3.2-90B-Vision e2e BERTScore F1 均值 0.722 → 0.6815 跌破 0.69 门禁**：相邻 commit bisect 双腿精确复现（reland 腿 per-sample 分数与 09-22 scheduled run 逐位一致，非噪声）；sample 0/3 各跌 0.044/0.040、sample 1/2 不变——视觉路径 `llama_cross_block.py`/`llama_image_block.py`/`llama_tile_position_embedding.py` 以 `ttnn.tanh(gate, fast_and_approximate_mode=True)` 门控 cross-attn/MLP 输出，单元容差内通过、e2e 语义质量退化 4 个点） · Cov: `NEW`（近似内核替换通过单元容差、仅 e2e 质量门可见的回归子签名） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 近似 tanh 的 SFPLUT 拟合误差逐元素小（单元测试容差内），但视觉 cross-attention/MLP 门控大量消费 tanh 输出，误差经语义级放大到 BERTScore 可测的输出质量退化；单元级验证（PCC/容差）对"分布级质量位移"结构性失明——与 1.233/1.234（PCC 门禁对仿射幅度失明）构成验证面盲点的又一方向：**容差内通过 ≠ 语义无损**。
