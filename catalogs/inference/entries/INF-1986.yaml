id: INF-1986
legacy_ids: []
slug: aclrt_batch_api_num_silent_narrowing
aliases: []
title: aclrt 批量接口 num 窄化后静默只处理前几项
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: cann
    component: aclrt 批量接口
  behavior: 公开参数为 size_t，实现不查范围直接转下层 uint32_t/int32_t，UINT32_MAX+2 变成 1 或按掩码取小值后继续执行
effect:
  objects:
  - 可用性/进度
  detail: 请求批量复位/导入 4294967297 项时接口返回 ACL_SUCCESS 而实际只处理 1 项，调用者以为全部完成；跨进程句柄或 Notify 状态与预期不一致
  visibility: 静默错误
mitigation:
  detect: 对每个批量接口用 UINT32_MAX+1/+2 的 num 调用，断言返回参数错误；mock 下层接口断言未被调用
  fix: 转换前检查 num <= UINT32_MAX（或 INT32_MAX）并返回参数错误，补边界回归；runtime 侧已给 MR https://gitcode.com/cann/runtime/merge_requests/4455 ，合入未核实
