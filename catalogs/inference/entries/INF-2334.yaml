original:
  mechanism: 'cann/ops-nn issue #7822（2026-10-31，Atlas A2 910B/CANN 9.2.0）：aclnnEmbeddingBag 在 includeLastOffset=true 时最后一个 offset 没有被当作 bag 的结束边界，bag 一直聚合到 indices 末尾。最小复现：weight=fp32[100x32]、indices=int64[7]={0,5,9,5,5,77,3}、offsets=int64[2]={0,4}、mode=sum——includeLastOffset=true 时 out[0] 元素和 110.28（等于 7 条索引全算），false 时 62.11（仅 indices[0:4]，正确）；同一二进制同一张卡只改一个 bool。资料 aclnnEmbeddingBag.md 写明 includeLastOffset=true 时最后 offset 是结束位置、第 i 个 bag 范围为 [offsets[i], offsets[i+1])，尾部 indices[offsets[last]:] 不参与任何 bag，输出 shape 也声明为 (bagOffsets-1, embeddingDim)。矩阵证据：30 条 800 级用例里 includeLastOffset=true 的 133 条全部 FAIL 且每条恰好差一整行（embeddingDim 个元素），与边界错误一致。'
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7822 （open，2026-10-31 创建；含最小对照表与 133 条 FAIL 矩阵）
  behavior: 用 aclnnEmbeddingBag 做稀疏特征聚合（NLP/推荐场景 bag-of-embeddings 求和）且 includeLastOffset=true 时，每个 bag 都会多聚合到 indices 末尾：本应只聚合前 4 条索引的 bag 把后面 3 条也加进去，输出和从 62.11 变 110.28——静默偏大、无报错，特征语义整体错乱；把 includeLastOffset 改成 false 同数据即恢复，可作定位对照。
  trigger_surface: cann/ops-nn embedding_bag；includeLastOffset=true；offsets 末值 < indices 长度（存在应被排除的尾部索引）；910B/CANN 9.2.0。
  signature: includeLastOffset 翻转 true→false 输出变化；每 bag 恰多出尾部一整段 embedding 求和。
  repro: issue 附 repro_embag_short.cpp（LAST=0/1 环境变量对照运行）。
  discovery: 2026-10-31 每日扫描
