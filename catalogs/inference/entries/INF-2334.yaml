    component: embedding_bag offsets 边界
  behavior: includeLastOffset=true 时最后一个 offset 未被当作 bag 结束边界，bag 一直聚合到 indices 末尾，把应被标记掉的尾部索引也算进去。
effect:
  objects:
  - 数值结果
  detail: 最小例 out[0] 和 110.28（多算 indices[4:7] 三条）而期望 62.11，只改这一个 bool 输出即变；800 级用例矩阵中 includeLastOffset=true 的 133 条全部 FAIL 且每条恰差一整行。
  visibility: 静默错误
mitigation:
  detect: 对 includeLastOffset=true/false 各跑一次比对输出（两者在末 offset 前 material 应一致）；构造尾部索引可区分的用例。
  fix: 待定（issue open，未见修复 MR）
