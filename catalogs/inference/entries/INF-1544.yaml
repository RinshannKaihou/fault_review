original:
  mechanism: PD 分离部署的 D 节点上，execute_dummy_batch() 在真实前向之间运行以保持 cudagraph 热，但这个 dummy 前向会走完整模型执行路径，包括与 KV connector（MooncakeLayerwiseConnector）交互的 attention 层。报告列出三处缺陷：(1) execute_dummy_batch 没有屏蔽 KV 写入，_dummy_run(for_dummy_batch=True) → _build_attention_metadata() → _get_block_table_and_slot_mapping() 在 for_dummy_batch 分支里直接对 blk_table_tensor 和 slot_mapping 做 fill_(0)，把 connector 需要的真实值覆盖成 dummy 数据；(2) save_kv_layer 与 DP all-reduce 存在竞态，dummy batch 的 DP all-reduce 与 connector 的 save_kv_layer() 在共享张量上重叠；(3) DP all-reduce 干扰导致 KV 数据损坏，被清零/污染的 block_table 让 connector 去读错误的 KV cache 位置。与其它 PD 问题叠加时，真实推理会崩在 causal_conv1d_update_npu（gdn.py:228），报 aclrtSynchronizeEvent error code 507014 aicore execution times out，调用栈为 execute_model → _model_forward → model forward → linear_attn → gdn_attention_core。
  source: 2026-06-09 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10245 （open）
  behavior: PD 分离（D 侧用 layerwise connector）跑一段时间后，某些请求会拿到别人的/无效的 KV：输出错乱或者直接卡在 aicore 超时上，报 507014；日志里看不出与 dummy batch 有关，因为 dummy 执行本身不报错，只有它清零过的元数据在后续请求里才暴露。
  trigger_surface: PD 分离 + execute_dummy_batch（保 cudagraph 热）+ MooncakeLayerwiseConnector；dummy 与真实请求共用 block_table/slot_mapping，且 DP all-reduce 与 save_kv_layer 重叠
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
