mitigation:
  detect: 抓 execute_dummy_batch 前后 block_table/slot_mapping 的内容，确认 dummy 之后是否被 fill_(0)；对照关掉 dummy batch 或让 dummy 不写元数据时的 KV 传输结果
  fix: 待定（issue open，无修复 PR）；方向：dummy batch 必须屏蔽 KV 写入、用独立元数据缓冲，并把 save_kv_layer 与 DP all-reduce 串行化
