original:
  mechanism: 'op-plugin issue #605（c2026-10-19，Atlas A3 Ascend910_9362 ×2，CANN 9.1.0，torch 2.7.1 + torch_npu 2.7.1.post4，双芯一致）：attn_mask 为 bool 全 False 行（query 完全被屏蔽）时 CPU 输出 0（softmax 分母为 0 的既定语义），NPU 输出完整注意力值 0.4767——bool mask 转 bias 的转换边界 bug（-inf 未落到该行）。同场景 float -inf mask 双端一致（对照干净），定位在 bool→bias 转换分支。影响：注意力对全屏蔽 query 输出非零值，生成/解码场景会静默产生非法 token。建议 bool→bias 转换分支对全 False 行输出 -inf（对齐 CPU）。复现脚本：/mnt/workspace/a3hunt/round7/。'
  source: 2026-10-19 GitCode Ascend/op-plugin issue https://gitcode.com/Ascend/op-plugin/issues/605 （open）
  behavior: NPU 上跑 scaled_dot_product_attention、attn_mask 用 bool 型且存在整行全 False（该 query 被完全屏蔽）时，输出不是 CPU 语义的 0，而是完整的注意力值（约 0.48）：被屏蔽位置反而贡献了注意力，下游生成会静默产生非法内容。同样的掩码用 float -inf 表示则两端一致。
  trigger_surface: torch_npu SDPA + bool attn_mask + 全 False 行；Atlas A3、CANN 9.1.0；float mask 不触发
