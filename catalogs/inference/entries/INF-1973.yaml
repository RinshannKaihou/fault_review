title: torchair import 期改写全局 inductor 配置
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: import 期全局配置改写
  behavior: import 期直接改 dynamo_config.recompile_limit、DeviceProperties.multi_processor_count 与 size_asserts，无 restore。
effect:
  objects:
  - 性能/资源
  - 测试判定
  detail: 所有后续 torch.compile（含非 NPU 代码）都继承这些值：size_asserts 关闭后形状断言静默放行，multi_processor_count=0 影响设备属性查询与 buffer 分配。
  visibility: 静默错误
mitigation:
  detect: import inductor_npu_ext 前后分别读 torch._dynamo.config.recompile_limit、torch._inductor.config.size_asserts 与 DeviceProperties.multi_processor_count，确认被改写且无恢复路径
  fix: 待定（issue 已 closed；报告建议把这些值放进 NPU 专用的 Inductor config 覆盖，不要改全局对象）
