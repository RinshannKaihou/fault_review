title: AttentionUpdate 空 Tensor 出零 block 并除零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: AttentionUpdate tiling
  behavior: legacy 路径 blockDims=0 时仍做 totalLength % blockDims 与除法，UBSan 报除零；函数仍返回 GRAPH_SUCCESS 并把 block 数置 0
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: lse=[0]、localOut=[0,128]、updateType=0、sp=1 的空序列输入下 Host tiling 返回成功却给出 blockNum=0 的不可执行配置；文档声明支持空 Tensor，totalLength=128 时正常得 blockDims=40
  visibility: 静默错误
mitigation:
  detect: 在 UBSan 构建下跑 legacy totalLength=0 的 AttentionUpdate Host tiling（AttentionUpdateTilingTest.LegacyFloatUpdateType0EmptyTotalLength），断言 blockNum>0 或明确 GRAPH_FAILED
  fix: issue 关联 MR https://gitcode.com/cann/ops-transformer/merge_requests/10526（合入状态未核实）
