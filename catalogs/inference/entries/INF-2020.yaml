original:
  mechanism: 'cann/ops-transformer（commit a2ee2d92804d6d04fcc64e748628000539ab1464）的 attention/attention_update/op_host/decode_update_tiling.cpp:91-99 在 legacy 路径按 totalLength 计算 block 数，totalLength=0 时 blockDims 为 0，随后仍执行 totalLength % blockDims 与 totalLength / blockDims。Host UT（updateType=0、sp=1、lse=[0]、localOut=[0,128]、out=[0,128]）显示 ExecuteTiling 返回 GRAPH_SUCCESS 但 tilingInfo.blockNum=0，正数 block 断言失败；等价探针在 UBSan 下报 runtime error: division by zero，totalLength=128 对照得 blockDims=40。README 与接口文档声明 AttentionUpdate 支持空 Tensor，因此该输入不应触发除零或零 block 配置。'
  source: '2026-08-24 GitCode cann/ops-transformer issue #4532（closed）。https://gitcode.com/cann/ops-transformer/issues/4532'
  behavior: 带空序列（lse 长度为 0）的 AttentionUpdate 图在编译期做 Host tiling 时不报错，返回成功但下发一个 0 个 block 的配置；这类图要么在编译/下发阶段异常，要么执行时什么也不算，而接口文档写的是支持空 Tensor，使用者会以为空输入是合法 no-op。
  trigger_surface: AttentionUpdate legacy Host tiling 的 totalLength=0 空 Tensor 输入
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
