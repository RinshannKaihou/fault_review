  detail: FLOAT16 n=2051 输出仅 2050 个不同值（2049 舍入为 2048）；BF16 n=259 仅 258 个不同值（257 舍入为 256）；FLOAT n>2^24+1 同理；确定性、与随机种子无关；破坏无重复索引/洗牌/抽样调用方前提
  visibility: 静默错误
mitigation:
  detect: 对输出做 unique 计数与 n 对照（2051/259 边界即刻暴露）
  fix: 修复 PR https://gitcode.com/cann/ops-math/merge_requests/6411 （open）：Host 校验改为按可精确表示的最大连续整数（FP16 2^11/BF16 2^8/FLOAT 2^24 配合 n-1 判据），对齐 PyTorch check_supported_max_int_with_precision；950PR 真机 op_host UT 6 边界用例全过；另修 INT8/UINT8/INT16 边界差一误拒（#3575）
