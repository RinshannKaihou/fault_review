original:
  mechanism: 'StatelessRandperm（arch35/Ascend 950）合同是输出 0..n-1 的随机排列，但浮点输出 dtype 下产生确定性重复值。根因：kernel（stateless_randperm.h:74-85 CopyData）先得到整数索引排列再逐项 static_cast<Y> 写入输出；Host（stateless_randperm_tiling_arch35.cpp:47-55,139-151,268-277）只按 dtype 最大有限值校验（FLOAT16 65504/BF16 INT64_MAX 边界/FLOAT FLT_MAX），没校验 0..n-1 全部整数能否被 dtype 精确表示。IEEE 舍入使转换非单射：FLOAT16 n=2051 时 2049→2048（输出 2050 个不同值）、BF16 n=259 时 257→256（258 个）、FLOAT n>2^24+1 同理。与随机种子、排序结果无关，确定性触发。验证边界：A3 主机验证了源码判定表达式与标准 FLOAT16/BF16 转换（Python 标准库模拟 CopyData 复现重复值）；A3 非 arch35，尚未在 950/A5 跑原始 kernel，但重复值由整数全集到目标 dtype 非单射直接推出。修复 PR !6411（open）对齐 PyTorch 参考实现 check_supported_max_int_with_precision：maxValueMap 浮点值改为可精确表示的最大连续整数（FP16 2^11、BF16 2^8、FLOAT 2^24，配合 n-1 判据即 FP16 n≤2049/BF16 n≤257/FLOAT n≤2^24+1，与 PyTorch 对 Half/Float 限制一致，BF16 为 PyTorch 自身疏漏一并补齐），950PR 真机 op_host UT 6 个边界用例全过。同 PR 另修 #3575 整数边界差一误拒（n>dtype最大值 改为 n-1>max，INT8 n=128/UINT8 n=256/INT16 n=32768 可表示长度曾被误拒）。'
  source: '2026-10-18 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3576 （open，2026-10-14）；姊妹 #3575 https://gitcode.com/cann/ops-math/issues/3575 ；修复 PR https://gitcode.com/cann/ops-math/merge_requests/6411 （open）'
  behavior: 在 Ascend 950 上用浮点 dtype 调 StatelessRandperm/torch.randperm：dtype=float16 且 n=2051 时输出只有 2050 个不同值（2049 与 2048 重复）、dtype=bfloat16 且 n=259 时只有 258 个不同值，float32 在 n 超过 2^24+1 后同理。每次都发生、与种子无关，无报错。依赖无重复索引的洗牌/抽样调用方拿到重复索引后行为被静默破坏。
  trigger_surface: cann/ops-math StatelessRandperm arch35（950）；浮点输出 dtype + n 超出该 dtype 连续整数精确表示范围（FP16≥2050/BF16≥258/FLOAT>2^24+1）；torch.randperm NPU 路由
