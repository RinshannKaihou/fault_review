    component: 输出转换与 Host 校验
  behavior: kernel CopyData 逐项 static_cast<Y> 写输出，Host 只按浮点 dtype 最大有限值校验 n，未校验 0..n-1 连续整数能否被精确表示；舍入使非单射转换产生重复值。
