id: INF-1541
legacy_ids: []
slug: ops_nn_advance_step_st_golden_hardcoded_constants
aliases: []
title: AdvanceStep ST 参考返回硬编码常量
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: 通用
    component: advance_step ST executor
  behavior: ST executor 的 __call__ 读出 9 个入参后逐个覆盖成 4 个手写常量张量返回；同文件真正的 CPU golden Advance_step 全仓无人调用，参考值与输入无关。
effect:
  objects:
  - 测试判定
  detail: 该 ST 用例拿固定常量 {2,2,2,2,0,1,1,1} 等与设备输出比对，n_pad 补零、按 blockSize 映射等逻辑从未被验证；同算法在 UT 造数脚本里另有一份被正常调用。
  visibility: 静默错误
mitigation:
  detect: grep 参考实现的调用点：golden 函数定义了却无人调用、__call__ 直接返回字面量张量，就说明用例发现不了该输出错误；改输入看参考值是否随之变化。
  fix: issue 6349 open；修复方向是让 __call__ 调用本文件的 Advance_step 并删掉硬编码覆盖，未给 PR
