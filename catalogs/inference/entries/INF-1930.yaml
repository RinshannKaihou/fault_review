title: 优化器 construct 加 jit 后学习率被固化
kind: 故障
status: active
cause:
  objects:
  - subsystem: 优化器
    stack: mindspore
    component: mint.optim AdamW + @jit
  behavior: '@ms.jit 修饰优化器 construct 后 param_groups 里的 lr 在编译期被当常量捕获，reconfig_param_groups 每步写回的 lr 不进入计算图，5 步内 lr 恒为初始值'
effect:
  objects:
  - 训练轨迹
  - 优化器状态
  detail: 同脚本带 jit 时 5 步打印 lr 恒为 0.001（Tensor），去掉 jit 后按 0.001→1e-4→1e-5→1e-6→1e-7 衰减；loss 收敛异常但无任何报错或告警
  visibility: 静默错误
mitigation:
  detect: 每步打印 param_groups[0]['lr'] 与真正传给 adamw_opt 的 lr，看是否随 scheduler 变化；对比 construct 有无 @ms.jit 的两条 lr/loss 曲线
  fix: 待定（issue open，未给 PR）
