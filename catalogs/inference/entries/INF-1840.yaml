title: allreduce 非确定性致 MoE topk 专家选择抖动约 1% 坏例
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: vllm
    component: allreduce 非确定性
  behavior: allreduce 输出偶发异常波动并传导到融合算子 moe_gate_topk，专家选择随之抖动；把 topk 拆成小算子后坏例概率显著下降，开 HCCL_DETERMINISTIC=true 后 3000+ 坏例不再复现（此前 5%）
effect:
  objects:
  - 输出内容
  - 输出分布
  detail: 复杂编码/agent 任务中约 1% 概率出现精度类坏例：toolcall 与 think 标签丢失、重复输出、指令遵从下降；首 token 后 logits 偶发 0.5~1 的显著波动
  visibility: 不可复现
mitigation:
  detect: 开启 HCCL_DETERMINISTIC=true 复跑坏例集：坏例消失即可判定为非确定性通信；或对比 moe_gate_topk 前后 logits 波动
  fix: 待定；规避手段是 export HCCL_DETERMINISTIC=true（报告者实测 3000+ 坏例 0 复现），代价是明显性能损失
labels:
