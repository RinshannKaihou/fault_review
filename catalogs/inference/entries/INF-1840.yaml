remarks: 报告者是端到端定位（替换算子 + 开确定性开关），未给到 allreduce 内部具体出错位置；开确定性后不复现是强证据但非源码级根因。
evidence:
- url: https://github.com/vllm-project/vllm-ascend/issues/8359
  kind: github_issue
relations: []
original:
  mechanism: 以 vllm-ascend v0.11 与 v0.18.rc1 搭编码服务，模型为 MiniMax M2 系列与 Qwen3.5 系列（A2 910B3）。复杂编码/agent 任务中约 1% 概率出现精度坏例（toolcall 与 think 标签丢失、重复输出、指令遵从下降）。定位过程：每个 first token 之后的 logits 偶发 0.5~1 的显著波动；进一步检查算子发现融合算子 moe_gate_topk 的专家选择波动明显，根因指向上游 allreduce 通信算子的异常输出。两组实验：(1) 把 moe_gate_topk 替换为若干小算子后精度退化概率显著降低；(2) export HCCL_DETERMINISTIC=true 后用 3000+ 坏例测试集验证不再复现（此前复现率 5%）。据此判断 vllm-ascend 底层通信存在偶发非确定性，导致门控专家选择跳变。报告者同时指出确定性计算会带来明显性能损失。
  source: 2026-04-17 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/8359 （open）
  behavior: 线上编码服务偶发回答质量事故：约 1% 的复杂任务请求出现 toolcall 参数丢失、think 标签缺失、整段重复输出或答非所问，同一请求重试往往就正常，因此看起来像模型随机性而不是 bug。加载 moe_gate_topk 小算子替换版或打开 HCCL_DETERMINISTIC 后问题消失，但吞吐下降。
  trigger_surface: MoE 模型 + allreduce（TP/DP 通信）+ 非确定性通信开关关闭 + 长上下文 agent 任务
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
