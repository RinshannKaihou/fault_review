  meta: '`infra_off`（`alloc_req_slots` 按每请求固定头room常量（`num_reqs×3`）预留并驱逐 mamba checkpoint，而非本 batch 实际将取数——prefix 命中者实际取 2、chunk 续传者实际取 0，紧池下盈余驱逐在少数 slot 间循环，checkpoint 缓存被系统性洗掉） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
