title: triton-ascend 整型除零取余编译态恒返 −1
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 整型 rem 除零 lowering
  behavior: 编译的整型 a%b 在除数恒为 0 时输出恒为 -1（逐 lane），编译成功不报错；向量 splat/0 维标量/字面量三种除数形态全命中。eager remainder(x,0) 返回被除数——compiled 与 eager 分裂。
effect:
  objects:
  - 数值结果
  detail: int32/int64 下任何非 −1 输入 lane 全错（确定性极强，无需测试配置即触发生产数值路径）；float16/32 x%0 编译态与 eager 同为 NaN 不受影响。
  visibility: 静默错误
mitigation:
  detect: compiled vs eager torch.remainder 对照（报告含三形态最小复现）
  fix: 待定（open）
