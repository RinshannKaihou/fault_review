original:
  mechanism: triton-ascend 编译的整型取余 a%b 当除数 b 恒为 0 时输出恒为常量 −1（逐 lane），静默错值；三种除数形态（tl.full 向量 splat 0 / tl.load 0 维标量 0 / 字面量 a%0）全部命中，int32/int64 同型。同设备 eager 参考语义为返回被除数：torch.remainder(x,0)（NPU aclnn）对 x=[-9..-1024] 逐元素返回 x 本身；PyTorch 文档 floor-mod 恒等式亦以此为极限。Inductor 基本不变量（编译结果==eager）在整型除零点被打破。浮点侧不受影响（f16/f32 x%0 编译态与 eager 同 NaN，0/23 错）。#2290/#2289 覆盖不到本单，是 floor-mod 链上第四个独立缺陷、唯一直接命中生产数值路径的一个（仪器断言默认关、不需要测试配置即触发）。环境：910B4、driver 25.5.1、CANN 9.2.0-beta.2、torch 2.16.0.dev/torch_npu 2.16.0+git322546e、triton-ascend 3.6.0。
