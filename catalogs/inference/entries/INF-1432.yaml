original:
  mechanism: triton-ascend（3.6.0+dev20260922220228）上带 mask 的向量 store 写每请求标量时，部分合法输出槽位未被写入：输出保留初始化哨兵 -777 而非期望的请求状态索引；把该 mapping store 换成标量循环后同一测试全部通过。发现于 vLLM DFlash _prepare_dflash_inputs_kernel（vllm/v1/worker/gpu/spec_decode/dflash/speculator.py）的 mapping 写入测试；报告附无 vLLM 依赖的独立复现器（保留 request indexing、context/rejection mask、mapping store、padding 写入），eager 执行即失败（先测 eager 再捕获 graph，非 graph replay 特有；graph 用 relaxed 模式仅作诊断条件）。报告非最新源码构建，已询问后续 daily wheel 是否包含修复，无回复。
  source: 2026-10-17 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/2457 （open；独立复现器+scalar workaround 对照）
  behavior: 在 Ascend 上跑含 masked 向量 tl.store 的 Triton kernel（如 vLLM DFlash 投机解码的请求映射准备）时，部分本应写入的输出位置保持初始哨兵值 -777 不变：下游拿到错误的状态索引，投机解码映射错乱。eager 与图模式都错；把向量 store 改成标量循环就正确。
  trigger_surface: triton-ascend + masked vector store（每请求标量映射形态）；vLLM DFlash speculator 实际路径
  discovery: 2026-10-17 每日扫描
