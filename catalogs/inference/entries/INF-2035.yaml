id: INF-2035
legacy_ids: []
slug: opsnn_gather_elements_v3_index_range_unchecked
aliases: []
title: GatherElementsV3 负/越界索引静默读错元素
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: gather_elements_v3 kernel
  behavior: device 侧只在 indexVal<0 时加一次 xGatherDim_，之后不校验是否落入 [0,gatherDim)：-1 被 wrap 成 3，正越界直接参与地址计算
effect:
  objects:
  - 数值结果
  detail: gatherDim=4、index=-1 时返回 SUCCESS 且 out[0][0]=6（等价按 3 读），index=4 时返回 SUCCESS 且 out[0][0]=0；-1000000 才在设备侧报 507035
  visibility: 静默错误
mitigation:
  detect: 用 -1、-1000000、gatherDim 三档索引调 aclnnGatherElementsV3，断言返回参数错误并与 CPU torch.gather 逐元素比对
  fix: 待定（issue 未附修复 MR；建议 wrap 后补 [0,gatherDim) 校验并返回参数错误）
