original:
  mechanism: ops-nn experimental/index/gather_elements_v3/op_kernel/gather_elements_v3.h Compute 段（HEAD e16ef626bb3a）：int32_t indexVal = idxLocal.GetValue(i); if (indexVal < 0) indexVal += xGatherDim_; 随后直接 xRealOffset = xBase + indexVal * xPostDim_ + (postStart + i) 取 xGm_。wrap 之后没有 indexVal<0 || indexVal>=xGatherDim_ 的拒绝或钳位，非法索引可走通 GetWorkspaceSize/Launch/SynchronizeStream 全链路。复现用 910B3 + CANN 9.1.0-beta.3、自编译 gather_elements_v3 vendor 包（build.sh --pkg --ops=gather_elements_v3 --experimental，ASCEND_CUSTOM_OPP_PATH 指向该 vendor，移走 built-in 后仍复现），self={4,2} 值 0..7、dim=0。
  source: 2026-08-13 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4765 （closed）
  behavior: 把越界或负的 index 传给 GatherElementsV3 时，接口不报参数错误：-1 被当成 3 读回 self[3][0]=6，+4 直接算出错误地址读回 0，结果为看似正常但错误的元素；极端负值 -1000000 才在 SynchronizeStream 处以 507035 暴露。对齐 torch.gather 的「拒绝非法索引」语义时，调用方拿不到任何提示。
  trigger_surface: aclnnGatherElementsV3（experimental gather_elements_v3）负索引或正越界索引
  discovery: 2026-10-21 系统扫描（sweep_2，issue created < 2026-10-07 历史索引）
