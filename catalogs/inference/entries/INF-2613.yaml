original:
  mechanism: flashinfer 源码 560d7e296（nightly-v0.6.18，RTX 3090/SM86、Python 3.12.16、torch 2.14.1+cu130、CUDA 13.5）的 MinPSamplingFromProbKernel 计算 pivot = max_val * min_p，并把 x >= pivot 的槽位全部标记为 valid 交给 DeviceSamplingFromProb。默认 min_p=0 时 pivot=0，于是所有零概率槽（被 top-k/top-p 清零的、以及 padded vocab 的槽）都被当作合法候选；逆 CDF 循环在没有任何槽被选中时回退到 last_valid_id，落到 d-1。触发条件是 curand_uniform() 恰好返回 1.0（u==q），或第一遍总和 q 比 tile 总和 S 大几个 FP32 ULP 且 u 落在 (S,q]。生产环境 unpadded_vocab=200058、padded_vocab=201024，约 537k 生成 token 后返回 201023（padded_vocab-1），被服务运行时的域检查拒绝并终止服务；不 padding 时同一路径静默返回一个被 top-k/top-p 排除的 token。最小复现：4×4096 全零 probs、min_p=0，修复前返回 [4095,4095,4095,4095] 且 valid 全 True，修复后返回 [0,0,0,0] 且 valid 全 False。
  source: https://github.com/flashinfer-ai/flashinfer/issues/9887（open，2026-11-23，含最小复现与生产触发计数）
  behavior: 在用 min_p 采样（尤其是默认 min_p=0）时，极少数 token 会返回一个概率严格为 0 的 id：有 padded vocab 时是 vocab 末尾的 padding 槽（例如 201023），没有 padding 时是被 top-k/top-p 排除掉的 token。服务端如果做了 token 域校验会突然报错并终止；不做校验则静默采样到非法 token 并继续生成，输出从此跑偏。绝大多数请求完全正常，只有约几十万 token 里命中一次，因此很难复现，也很难和正常采样区分。
  trigger_surface: flashinfer nightly-v0.6.18（560d7e296）、CUDA 13.5、RTX 3090/SM86；min_p_sampling_from_probs，min_p=0（默认）或极小的 min_p，输入分布含大量零概率槽/padded vocab；curand_uniform 返回 1.0 或 q 与 S 差几个 FP32 ULP 时命中。
  discovery: 2026-11-26 每日扫描
