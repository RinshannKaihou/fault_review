title: FlashInfer min_p 回退返回零概率 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: flashinfer
    component: MinPSampling kernel
  behavior: pivot=max_val*min_p，min_p=0 时 pivot=0，零概率槽（top-k/top-p 清零槽与 padded vocab）全被标为 valid；逆 CDF 未选中时回退 last_valid_id=d-1。
effect:
  objects:
  - 输出内容
  detail: padded_vocab=201024 的生产服务约 537k token 后返回 201023，被运行时域检查终止；无 padding 时静默返回被排除 token；全零分布 4×4096 返回 [4095×4] 且 valid=True。
  visibility: 静默错误
mitigation:
  detect: 用全零概率分布或 top-k 后仅剩少量候选的分布跑 min_p_sampling_from_probs(min_p=0)，检查返回值是否落在零概率/padded 槽、valid 是否为 True；再与 min_p>0 的正常路径对照。
  fix: issue 展示修后返回 [0,0,0,0] 且 valid=False；截至 2026-11-26 未见合并 PR（未核实）。
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-26'
remarks: 与 INF-2593 同属 FlashInfer 采样阈值退化导致静默返回固定 token；本条触发在 min_p=0 的 pivot=0 全槽 valid + 逆 CDF ULP 越界后的 fallback，而非 top_k/top_p 的零阈值。
