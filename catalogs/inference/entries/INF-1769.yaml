title: triton-ascend num_stages>1 流水错调度携带态存储
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: 软件流水循环携带 store 调度
  behavior: 循环体内存储循环携带值的 kernel 在 num_stages>1 时被错误调度，in-loop store 读到过期流水级，kernel 静默产出错误结果（非崩溃非编译错）
effect:
  objects:
  - 数值结果
  detail: Mamba-2 SSD _state_passing_fwd/_bwd_kernel（num_stages=3 autotune 配置）约 25–46% 新进程产出位相同的错误输出（rel diff ~1e-3 vs 参考 ~4e-7）；前向反向同中；钉 num_stages=1 后 16/16 进
  visibility: 静默错误
mitigation:
  detect: 同脚本多进程重跑并与纯 torch 参考对比；坏进程输出位级稳定（编译期调度决定）是特征签名
  fix: 规避：检测 torch_npu 时为 state-passing autotune 配置钉 num_stages=1（state-spaces/mamba#1063 已带；GPU/ROCm 调度不受影响）；上游修复未见（open）
