  meta: '`infra_off` · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: 在 transformers v5 的 dynamic-weight-loading 重写下，对自定义 `PreTrainedModel` 子类调用 `from_pretrained` 时，如果没有匹配的 converter 把 legacy checkpoint 的键名映射过来，可能静默返回随机初始化的权重 —— `loading_info` 干净，**没有** missing-key 警告。
  source: 'HF transformers #46620。"Migrating to Transformers 5+ Guide"（v5 dtype-default 变更）。'
  behavior: 完全 / 近乎完全的静默失效：线上服务的模型本质上是未训练的，却在加载时不报任何 error 或 warning。
  trigger_surface: 加载/文件/config 操作可复现
  signature: 灾难级 off-manifold —— 随机初始化的模块从受影响的第一层起就产生远离健康流形的激活。geometric / statistical / trajectory / cheap 四族全部立刻触发。与 `missing_keys_silently_ignored` 的区别在于本故障是**完全静默**的（无任何加载告警）。
  repro: weight-clone-restore：把某一个完整 decoder layer（默认 `L=0`）的全部参数就地替换为随机张量，随机张量按该参数自身的 std 缩放（`noise * max(std, 1e-3)`），使其看起来像一次全新的随机 init 而非 bit-flip 式的加性尖峰；退出时逐参数还原。这是本项目的「未训练检查点」基线。
