title: 并行 redistribution DFS 缺 visited 致编译卡死
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindspore
    component: RedistributionNextNode
  behavior: 沿 node_users 递归展开 MakeTuple/TupleGetItem/Depend 时无 visited 去重，DAG 汇合点使工作量按路径数指数增长、同一状态重复追加 next_nodes
effect:
  objects:
  - 可用性/进度
  - 性能/资源
  detail: mcore pp>1、大 seq_length、多路 micro-loss 时编译卡死：单线程 CPU 100%、日志停在 insert mirror op for AddInfo44 后 ≥30 分钟无进展、不报错不退出；关掉后约 13 分钟出 step；DEBUG 疯狂刷 Depend 日志。
  visibility: 挂起
mitigation:
  detect: 编译停在同一 mirror op 且单核满载时，用 MS_SUBMODULE_LOG_v={PARALLEL:0} 看是否只刷 IsParallelCareNode；对照关闭 calculate_per_token_loss 复测
  fix: issue 提出按 (node, get_item_index, make_tuple_index) 三元组记忆化（复杂度从路径数指数降到状态数线性），正文称已提 PR 但未给链接（未核实是否合入）；临时规避为关闭 calculate_per_token_loss 或减小图规模
