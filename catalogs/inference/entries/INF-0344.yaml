  meta: '`infra_off`（vLLM 0.30.0 Qwen3.6-35B-A3B（hybrid GDN+MoE）：单 prompt 独跑 bit-reproducible，但**同一 batch-of-two 重复提交两次 logprobs 差至 0.168**、单 prompt 与批内版本差至 0.198（20 prompts 实测表）；决策式用法中同 prompt 批内评分使 272 真实 prompts 的 10–17% 所选选项改变。批效应在 prefix caching off、`max_num_batched_tokens=32768`、`--gdn-prefill-backend triton`、`enforce_eager`、fp32/bf16 mamba cache、bf16 checkpoint 下均在；`max_num_seqs=1` 时精确 0.0。另有 `enable_return_routed_experts` 下两 identical 请求约 40% (token,layer) 路由与单请求版不同（token 0 起，两副本彼此一致）——疑 per-request capture 错位，可能独立问题。根因内核未定位（候选：默认 config 的 Triton fused MoE、GDN chunked prefill varlen、FA2 varlen）） · Cov: `var:sglang_vlm_greedy_cross_build_near_tie_flip_worker_nondeterminism`（4.12 多序列路径非确定族——本条在 **run-to-run 非确定**（非仅 batch-variant）维度且附路由层证据） · 触发 `config` · 置信度 `documented`'
  mechanism: 多序列路径存在跨运行非确定的内核（未定位）；单序列路径确定。
