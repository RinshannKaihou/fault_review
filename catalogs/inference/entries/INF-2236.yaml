  behavior: aclnnDequantSwigluQuantGetWorkspaceSize 不校验 yOut/scaleOut 尺寸是否等于推导尺寸，出参声明小于推导值时两段接口返回 0，内核按 x 推导的真实尺寸写满输出，越过声明张量边界。
effect:
