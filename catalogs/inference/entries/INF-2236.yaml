  - 数值结果
  - 跨请求/跨样本数据
  detail: yOut 声明 [4,32]（真实 [4,64]）时边界外被写 128 字节，行数 1/4/16 时越界 32/128/512 字节线性增长；scaleOut 同型（声明 [1] 实际 [4] 时多写 3 个 float）。对照组越界恒 0，排除哨兵误判。
  visibility: 静默错误
