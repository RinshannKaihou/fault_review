remarks: 与 INF-1983（EmbeddingBag indices 范围未校验，越界取到垃圾行）同属 embedding 类算子 indices 值域未校验；本条为前向 aclnnEmbedding，负索引走 GatherV2/Embedding 产生 NaN 行，而非 EmbeddingBag 的越界读。
