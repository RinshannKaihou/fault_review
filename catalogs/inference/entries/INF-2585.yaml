pattern: PAT-INF-0211
original:
  mechanism: 资料《aclnnEmbedding.md》`:187` 明文规定「当 indices 中有负值时算子报错」，`:110` 把范围写死为 `[0, weight.shape[0])`；实现 `op_api/aclnn_embedding.cpp:125` 的 CheckParams 只做空指针、dtype、最大维 8、out/indices 维匹配四步，不看 indices 值域，也不查正向越界；`:285` 把 indices 直接 Contiguous 送进 `l0op::GatherV2`/`l0op::Embedding`。实测 Ascend 950PR/A5、CANN 9.3.0，weight=[8,16] FLOAT、indices INT64 4 个，输出预填 canary -1234.5：基线 [0,1,2,3] 输出 1.000/1.010/1.020；[-1,1,2,3] 两段 rc=0，输出 -nan 行，NaN 数=16；[-1,-2,-3,-4] NaN 数=64；[-1000000,1,2,3] NaN 数=16；canary 残留 0/64，证明输出被整体写入而非未初始化；正向越界 [0,1,2,8] 不产生 NaN，属资料已声明的「输出随机值」行为，不在本条范围。
  source: https://gitcode.com/cann/ops-nn/issues/8965（open，2026-11-17，含 canary 与负索引 NaN 计数）
  behavior: 在 Ascend 950PR 上调用 aclnnEmbedding 做 embedding 查表时，如果 indices 里出现 -1、-2 这类负值，接口两段都返回成功，但对应行会被写成整行 NaN：4 个负索引就有 64 个 NaN，合法索引的行仍然正常。资料明确说负值应报错，实际不报；调用方拿到形状正常的 [K, dim] 输出，只有下游出现 NaN loss/NaN logits 才会发现。正向越界的行为不同（输出随机值，不产生 NaN），所以不能靠「有没有 NaN」统一判断。
  trigger_surface: Ascend950PR（A5）、CANN 9.3.0、ops-nn master 82d9467b；aclnnEmbedding、weight=[8,16] FLOAT、indices INT64 含负值。
  discovery: 2026-11-26 每日扫描
