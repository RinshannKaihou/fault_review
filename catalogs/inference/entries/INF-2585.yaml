title: aclnnEmbedding 负索引未拦截静默产 NaN 行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnEmbedding
  behavior: CheckParams 只查空指针/dtype/最大维/out 维匹配，不查 indices 值域；负索引被直接送进 GatherV2/Embedding，负地址行读成 NaN，正向越界则按资料声明输出随机值。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: weight [8,16] FLOAT、indices 4 个 INT64，负值用例两段 rc=0，输出对应行全 NaN（NaN 数=负索引数×16），canary 残留 0/64 证明已写入；正向越界不产生 NaN。
  visibility: 数值异常
mitigation:
  detect: 构造 indices 含 -1/-2 的用例，断言应返回 161002；检查输出是否出现整行 NaN
  fix: 待定（open；issue 建议在 CheckParams 补 [0, weight.shape[0]) 值域检查）
labels:
  stage: N/A
  confidence: documented
