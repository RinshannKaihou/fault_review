  meta: '`infra_off` · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 跨层 KV 共享（CLA / YOCO / LCKV / MLKV）中，锚层计算 `anchor = (layer // sf) * sf` 出现差一、`sharing_factor` 取错、或 owner-map 写错，都会让一个跟随层用自己的查询去对**另一**层或另一头组的 K/V 做注意力。owner 层自身不受影响，只有被错映射的 follower 层读到错误来源。
  source: arXiv:2405.12981（CLA）/ 2405.05254（YOCO）/ 2406.09297（MLKV）。
  behavior: 模型在特定深度出现表示断层，整体输出质量下降但无任何报错，owner 层的行为与基线一致。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: 跨层错源是 infra_off。签名为**错误映射的跟随层处出现突兀的方向跳变；owner 层与基线匹配**——trajectory 的深度剖面呈单层/局部 STEP，geometric 逐层余弦在该层骤降，spectral 上该层表示子空间与其前后层脱节。全局 statistical 因受影响层数少而信噪比低，易漏检。
  repro: partial——在 follower 层的 attention 钩子里，用另一层（错误 anchor）的缓存 K/V 覆盖本层 K/V，或置换头组映射；标准稠密模型无跨层共享，注入的是"错源"效果而非真实共享拓扑的差一。
  locus: cross-node-transfer
  priority: medium
