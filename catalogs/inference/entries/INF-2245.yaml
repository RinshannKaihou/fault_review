title: vLLM Gumbel 采样器把全 NaN logits 变成固定 token
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: V2 Gumbel sampler NaN 处理
  behavior: V2 Gumbel sampler 对全 NaN logits 按 1024 列块 argmax 再跨块 argmax，确定性返回 0*1024+1023=1023；全 NaN logits 被静默采样成固定 token，无任何报错。
effect:
  objects:
  - 输出内容
  - KV状态
  detail: GLM-5.3 ~116K prompt 长请求：~16K token 连贯推理后突然截断，随后数字乱码，再持续输出 token 1023（'lock'）直至客户端取消；同 pod 其他请求不受影响。closed（2026-10-28）但首个 NaN 来源未闭环。
  visibility: 静默错误
mitigation:
  detect: issue 建议：默认开启 VLLM_COMPUTE_NANS_IN_LOGITS 类统计或加廉价 NaN guard，把全 NaN logits 变成报错（未实施，未评估）
  fix: issue closed（2026-10-28）；关闭原因与修复 commit 未核实；首个 NaN 来源未定位（HiSparse/NIXL 传输路径存疑）；建议中的 sampler NaN guard 未见合入
