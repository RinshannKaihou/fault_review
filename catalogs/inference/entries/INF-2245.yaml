original:
  mechanism: 'vllm/vllm issue #63811（2026-10-26 报，closed 2026-10-28）：vLLM 371745ebd6（2026-10-18）+ cherry-pick #62401/#61680，V2 model runner，GLM-5.3 FP8 + MTP(3) + fp8 KV + prefix caching，P/D 分离，decode pod 8×H100 TP8+EP CUDA graphs on，KV 传输 MultiConnector[NixlConsumer, HiSparseConnector(host_pool 1024GiB)]。症状链：长请求中某步起每步 forward 产生全 NaN logits；V2 Gumbel sampler 对全 NaN logits 按 1024 列块 argmax+跨块 argmax 确定性返回 0*1024+1023=1023（GLM-5.3 词表 154880，token 1023=''lock''；temperature 0.0/1.0 同结果；全 inf 返回 0），采样器把 NaN 静默变成可读 token，掩盖了故障；该 token 写回的 KV 为 NaN，近期位置几乎每步被选中，请求持续中毒且其他请求不受影响。首个 NaN 来源未定位：单机 8×H200 复现尝试（HiSparse 无 NIXL、本地 prefill、96% hot-buffer、TB 级 host→device、含抢占）约 25 请求未复现。issue 同时指出 sampler 静默吞 NaN 使问题难察觉，建议默认 NaN 计数/guard。closed 但 issue 内无根因结论。'
  source: https://github.com/vllm-project/vllm/issues/63811
  behavior: P/D 分离部署（HiSparse+NIXL）下，偶发长请求在长上下文中途输出突然截断，随后是几十个字符的数字乱码，然后无限重复同一个词（GLM-5.3 上是 'lock'，token id 1023）直到客户端超时取消；期间服务不报错、其他请求正常、同会话下一轮也正常。根因是该请求从某步起每步 logits 全 NaN，而 Gumbel 采样器把全 NaN 确定性映射成 token 1023 并继续产出看似正常的文本，监控完全无感知。
  trigger_surface: vLLM V2 runner + P/D 分离 + MultiConnector[HiSparse+NIXL] + 长上下文（~116K prompt）+ GLM-5.3 FP8/MTP/fp8 KV；罕见（fleet 中偶发单请求）。采样器行为本身平台无关：任何来源的全 NaN logits 都会被映射为固定 token。
  discovery: 2026-10-28 每日扫描
  notes:
