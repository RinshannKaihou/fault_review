  meta: '`infra_off` · Cov: `NEW` · 触发 `no` · 置信度 `verified`'
  mechanism: 在 NVFP4 的 prefill/decode 分离（PD-disaggregated）服务中，`--kv-cache-dtype fp8` 把输出损坏到 **2+2=5** 的程度；换成 BF16 即修复。根因是 FP8 KV 在 prefill 侧量化、经跨节点传输、再在 decode 侧反量化时**无法往返（round-trip）**——量化元数据与数值在传输边界上不一致。
  source: 'vLLM #42179（CLOSED 2026-05-09）。'
  behavior: 基础算术这类最简单的确定性任务都给出错误答案（2+2=5），服务无报错。
  trigger_surface: 需要 P/D 分离或跨节点/RDMA 拓扑（默认实验室单机不具备）
  signature: off-manifold KV，且**只出现在被传输的 KV 块上**（cross-node × quant 复合）。检测面：per-block / per-position 的 statistical KV-norm 离群与 geometric 偏移在传输块边界处最强，块边界形成可定位的空间结构；纯全局 cheap 度量能看到严重退化但无法定位；spectral 族对块状扰动响应中等。因为损坏幅度极大（算术都错），这是一个"检测容易、定位难"的 infra_off 故障。
  repro: 以"对 KV 的一个连续位置区间（充当被传输的块）施加 fp8 量化-反量化不匹配（用错误的 scale 反量化）"近似；单钩子在 cache 写入后按区间施加。
  locus: cross-node-transfer
  priority: |-
    low
