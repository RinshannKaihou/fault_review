id: INF-2621
legacy_ids: []
slug: nccl_symm_mem_allreduce_wrong_group
aliases: []
title: NCCL 对称内存 all-reduce 跨组取错 rank 集
kind: 故障
status: active
cause:
  objects:
  - subsystem: 集合通信
    stack: vllm
    component: pynccl 对称内存 all-reduce
  behavior: VLLM_USE_NCCL_SYMM_MEM=1时，对称all-reduce op只注册一次并闭包首个注册组（TP组）；rank≥4、尺寸<16KiB或>512KiB且成员与TP组不同的组，op不接收调用组，按TP组rank集归约。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: TP8+DCP4、每 rank 填 rank+1 时，DCP 组 [0..3]/[4..7] 应得 10/26，实际得到 TP 组和；不挂起不报错，DCP 解码输出被污染。
  visibility: 静默错误
mitigation:
  detect: 构造 TP 与另一组 rank 集不同的进程组，各组填 rank+1 后 all-reduce，核对每组结果是否等于本组成员之和；覆盖 ≥4 rank 且尺寸 ≤16KiB 或 ≥512KiB。
  fix: 待定（#66304 提议把调用组传入 op；本条 issue open，未核实修复）
