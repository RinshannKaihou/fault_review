cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: DequantRopeQuantKvcache
  behavior: Nkv==1 特化分支跳过整条 scaleK/scaleV/offset 量化通路，kCacheRef/vCacheRef 直接写 clamp(round(kOut))，未除以 scale 也未加 offset。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: Nkv=1、scaleK=4 时 kCache 写 10（应 2），scale=0.5 时写 10（应 20）；Nkv=2/4 同配置正确；两段 rc=0 无告警。
  visibility: 静默错误
mitigation:
  detect: kCacheRef/vCacheRef 预填 -128 哨兵，按 Nkv=1/2/4 × scale 0.5/1/4 × 有无 offset 扫，与 clamp(round(x/scale)+offset) 对拍。
  fix: '待定（issue #7589 open，未附修复 PR）'
