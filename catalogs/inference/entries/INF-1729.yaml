id: INF-1729
legacy_ids: []
slug: ms_pynative_int_output_grad_metadata
aliases: []
title: PyNative 未区分 dtype，int32 索引输出也挂反向节点
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: SetTensorGradMetaData 元数据
  behavior: SetTensorGradMetaData 不检查输出 Tensor 的 dtype，把 int32 索引输出与浮点输出一起挂到同一个 BackwardNode 上。
effect:
  objects:
  - 梯度
  detail: ops.sort 的 indices 显示 requires_grad=True 且 _output_index=1，整数输出被当成可求导；不可求导输出补位不当还会让多输出元数据索引错位。
  visibility: 静默错误
mitigation:
  detect: PyNative 下对 ops.sort 等混合 dtype 多输出算子取 grad，打印 indices.requires_grad/_output_index；为 True 即命中
  fix: issue 给出修复：SetTensorGradMetaData 只给 float/complex 输出挂反向节点，int/bool 输出保留默认 TensorMeta 占位以免索引错位（状态 open）
