original:
  mechanism: PyNative 自动求导会为算子的每个 Tensor 输出设置梯度元数据，但 SetTensorGradMetaData 没有区分输出 dtype 是否可求导。对 ops.sort 这类同时返回浮点结果和整数索引的多输出算子，int32 索引输出也被连到反向节点。issue 在已安装的 MindSpore 2.9.0（tag v2.9.0，commit 4bcfac448b6fdf3c7cb87d11154699ad88b69a00）上跑最小复现，输出 Float32 True <Sort, seq=0> 0 / Int32 True <Sort, seq=0> 1，确认整数索引输出挂着 Sort 反向节点。修复需为空的不可求导输出保留默认 TensorMeta 占位，避免多输出索引错位。
  source: 2026-08-10 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29597 （open）
  behavior: PyNative 下用 ops.sort 这类“浮点值 + 整数索引”的多输出算子，拿到的 indices 带 requires_grad=True，还指向同一个反向节点。前向不受影响，但任何按 requires_grad 判断“这个输出能不能反传”的逻辑会走错分支；不可求导输出补位不当时，多输出的元数据索引还会整体错位。2.9.0 与 2.10 上都能看到。
  trigger_surface: PyNative + ops.sort 等混合 dtype 多输出算子；CPU，MindSpore 2.9.0/2.10
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
