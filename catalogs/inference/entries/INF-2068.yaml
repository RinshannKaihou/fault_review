original:
  mechanism: torch 2.7.1 以下版本没有原生 torch.float8_e8m0fnu，torch_npu 用 uint8 代替；2.8 起单算子路径能返回原生类型。报告者在 torch 2.8 环境用同一份 npu_grouped_matmul_swiglu_quant_v2 调用（x/weight 为 float4_e1m2fn_x2，weight_scale/x_scale 为 float8_e8m0fnu）做两组实验：单算子直接调用打印 y.dtype/y_scale.dtype 得到原生 torch.float8_e8m0fnu；把同一模块用 torch.compile(model, backend=npu_backend, dynamic=True, fullgraph=True) 编译后，同样的输出仍是 torch.uint8。即 torchair 的图模式 dtype 映射没有跟上新增的 e8m0 类型，与单算子路径分叉。
  source: 2026-08-04 gitcode.com issue https://gitcode.com/Ascend/torchair/issues/289 （closed）
  behavior: 写算子适配代码时，同一份脚本在 eager 下拿到 float8_e8m0fnu，改成图模式编译后拿到 uint8；数值本身没变，但按 dtype 分支的代码（view、类型提升、量化 scale 解析）会静默走另一条路，且没有任何告警。
  trigger_surface: torchair 图模式（torch.compile + npu_backend）下的量化算子，torch>=2.8 原生 e8m0 类型
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
