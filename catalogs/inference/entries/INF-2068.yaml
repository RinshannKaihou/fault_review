title: 图模式与单算子返回 dtype 不一致（e8m0 vs uint8）
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: torchair 图模式 dtype 转换
  behavior: torch 2.8 下 npu_grouped_matmul_swiglu_quant_v2 单算子路径输出原生 float8_e8m0fnu，torchair 图模式同一调用输出仍是 uint8，两条路径 dtype 映射不一致。
effect:
  objects:
  - 数值结果
  detail: 同一脚本分别在单算子和 torch.compile(backend=npu_backend, fullgraph=True) 下打印 y_scale.dtype：前者 float8_e8m0fnu，后者 uint8；下游按 dtype 分支（view/类型转换）会静默走不同路径。
  visibility: 静默错误
mitigation:
  detect: 同一算子分别跑 eager 与 torchair 图模式，比对输出张量 dtype 而非只比数值
  fix: 待定（issue closed，未见修复 PR；图模式 dtype 映射需与单算子对齐到原生 e8m0）
