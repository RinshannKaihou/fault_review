  meta: '`infra_off`（官方 recipe 声称 Qwen3.8-Flash-Next 支持 Mooncake 分布式 KV，实际启用即分级失败：`block_size must be divisible by hash_block_size` → 加 `--prefix-match-unit 8` 后 `MooncakeStoreConnector does not support: ... (mamba_cache_mode != ''align'')`——hybrid GDN 模型 offload 路径的配置断言链逐级拒绝，每级的"修复"引入下一级失败） · Cov: `var:vllm_glm53_dsa_indexer_tail_cache_block_size_offload_align_impossible`（6.179 同 hybrid offload 配置壁垒族） · 触发 `config` · 置信度 `documented`'
  mechanism: 与 6.179 同构的另一栈内路径（Mooncake 分布式 vs CPU offload）：hybrid 模型（GDN 线性注意力 + 全注意力）多 KV 组的 block 尺寸/组织与连接器的统一假设冲突；`mamba_cache_mode` 的 align 支持矩阵未覆盖 MooncakeStoreConnector。分级报错使运维逐旗试错，而每面旗都指向未实现组合。官方 recipe 的存在（qwen38-flash-next + kv_offle=kv_store_distributed_mooncake）与实际行为矛盾。
  source: 'vLLM #54726（2026-09-01 open，H20×4、Qwen/Qwen3.8-Flash-Next-FP8、RDMA Mooncake 配置、含三级失败阶梯与官方 recipe 链接）。https://github.com/vllm-project/vllm/issues/54726'
  behavior: 启动期失败（fail-loud）——文档承诺的部署形态实际不可用；分级 assert 链把不可用性伪装成"配置错误"，排障成本高（每级报错都暗示存在可达配置）。
  trigger_surface: vLLM + Qwen3.8-Flash-Next（hybrid GDN）+ MooncakeStoreConnector / prefix-match-unit 调整（config 即触发）
  discovery: 2026-09-01 每日扫描。
