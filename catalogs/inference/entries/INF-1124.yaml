original:
  category: cat12
  section: 第 12 类 · 权重 / 适配器 / 检查点加载故障
  meta: '`infra_off`（静默随机初始化） · Cov: `var:from_pretrained_silent_random_init` · 触发 `yes` · 置信度 `documented`'
  mechanism: 在 transformers 中，当一个**转换过的 checkpoint** 被通过**错误的 Auto 类**加载（`model_type` 不匹配），框架**静默跳过转换**，未初始化的部分权重保持**随机初始化**状态。模型不报错、加载"成功"，生成的输出**流畅但与真实权重无关**——典型"静默随机初始化"。与 12.2 `from_pretrained_silent_random_init` 同族，本条特化为 model_type mismatch 下的转换跳过路径。
  source: 'HF transformers #47405（2026-07-18 open）。环境：transformers 5.14.1，torch 2.12.0a0+cu12.9，B300 SXM6。模型：Inkling-975B（多模态，`model_type: inkling_mm_model`，转换后 checkpoint）。https://github.com/huggingface/transformers/issues/47405'
  behavior: 无 crash、无 NaN、无报错。错误 Auto 类 + model_type mismatch 导致转换被跳过、权重随机初始化，模型**流畅地生成与真实权重无关的输出**——最危险的 near-perfect-disguise：表面完全正常。
  trigger_surface: HuggingFace transformers 可在本环境直接复现
  signature: infra_off / near-perfect-disguise。随机初始化权重生成的输出在隐藏态上可能落入异常区域，但因模型仍自洽生成，单帧 geometric 度量未必离群。与 12.2 同族。
  discovery: 2026-07-31 每日扫描。
