id: INF-1862
legacy_ids: []
slug: npu_sparse_mask_drops_explicit_zero_rows
aliases: []
title: NPU sparse_mask 丢显式全零行致 SparseAdam 首步失败
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: sparse_mask 稠密转稀疏路径
  behavior: 稠密输入走 mul_out_sparse：先按稠密相乘再把结果 to_sparse(sparse_dim)，mask 指到的全零行在转换时被删，输出的 indices/values 不再对应 mask 结构。
effect:
  objects:
  - 数值结果
  detail: 二维稠密表 + 一维行 COO mask：全零行被删除（全表全零时 indices 变 [[]]，仅第 1 行全零时变 [[3]]，CPU 均为 [[1,3]]）；原生 SparseAdam 首步即 size mismatch 报错。
  visibility: 静默错误
mitigation:
  detect: 同输入在 CPU/NPU 各做一次 sparse_mask，比 _indices()/_values()；分别取全表全零、单行全零、行内部分零三例
  fix: 待定（issue open，未给修复 PR）。临时规避：按 mask indices 用 index_select 取行并保留原 indices（报告者探针已验证可与 CPU 数值对照通过）
