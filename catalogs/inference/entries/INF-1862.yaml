- url: https://gitcode.com/Ascend/pytorch/issues/4669
  kind: gitcode_issue
relations: []
original:
  mechanism: 'GitCode Ascend/pytorch #4669（torch 2.12.0 / torch_npu 2.12.0 / CANN 9.1.0，Ascend910_9362）：NPU 的 Tensor.sparse_mask 对二维稠密输入 + 一维行稀疏 COO mask 会删掉 mask 指定的全零行。源码核查指向 op-plugin 子模块 1831123f 的 op_plugin/ops/opapi/sparse/SparseTensorUtils.cpp：mul_out_sparse() 先把稀疏 mask 转稠密相乘，再对结果调 dense_result.to_sparse(sparse_dim)，to_sparse 只保留非零元素，于是「mask 指到但内容为零」的行整行消失。CPU 侧 sparse_mask 是与 mask_template 相乘的实现，保留 mask 的全部 indices 与显式零 values，两边结构语义不一致。报告者的最小复现覆盖全零、全一、单行全零、行内部分元素为零四种情形，只有含全零行时丢索引；Embedding(sparse=True) 的真实反向梯度同样触发。2.7.1/2.9.0 上该路径直接在 SparsePrivateUse1::mul.out 报 unsupported，2.12.0/9.1.0 稀疏乘法探针能过但零值结构问题仍在。'
  source: 2026-09-07 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/4669 （open）
  behavior: 拿二维 embedding 表做 sparse_mask 再交给原生 SparseAdam，第一步 step() 就报 The size of tensor a (2) must match the size of tensor b (0)：动量初始化后的 values 行数和梯度行数对不上。直接 print 稀疏张量能看到 mask 指到的全零行整行消失（indices 从 [[1,3]] 变成 [[]] 或 [[3]]），但没有任何报错或告警，同一段代码在 CPU 上结构完整。
  trigger_surface: torch_npu 2.12.0 + CANN 9.1.0；二维稠密张量 .sparse_mask(一维行 COO mask)，mask 覆盖的行内容为全零
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
