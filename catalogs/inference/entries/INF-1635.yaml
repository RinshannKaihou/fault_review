- url: https://gitcode.com/Ascend/MindIE-LLM/issues/429
  kind: gitcode_issue
relations: []
original:
  mechanism: MindIE-LLM dev 版（CANN 8.5.0 / Atlas A3 / ubuntu 22.04）的 tool calling 解析链有两处缺陷：其一，非流式输出时解析函数无法正确处理 arguments 的 type，所有工具调用参数统一被表示成 string，导致 bfcl 非流式评测里参数类型全部与参考不符、精度偏低；其二，解析器假定的结构化文本标记是 <|DSML|function_calls>，而 DeepSeek-V3.2-w8a8-mtp-QuaRot 量化权重生成的标记是 <function_calls>（缺少 DSML 前缀），当前解析方法直接失败，结构化字段解析不出来。正文未给定位文件与修复 PR，两处都在同一条解析路径上、由同一个 issue 报告。
  source: 2026-04-10 GitCode Ascend/MindIE-LLM issue https://gitcode.com/Ascend/MindIE-LLM/issues/429 （closed）
  behavior: 用非流式接口做工具调用：请求成功返回、HTTP 200，但解析出来的 arguments 里数字和布尔都被写成字符串，下游按 schema 校验或直接用就会出错，bfcl 一类的评测分数明显偏低；换成 DeepSeek-V3.2-w8a8-mtp-QuaRot 权重时更彻底——模型输出的是不带 DSML 前缀的标记，解析器完全认不出，tool_calls 为空。两种情况都不会报错。
  trigger_surface: 非流式 tool calling 响应解析（arguments 类型）+ QuaRot w8a8 量化权重输出的无 DSML 前缀标记
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
