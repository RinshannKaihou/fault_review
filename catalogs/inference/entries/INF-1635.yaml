id: INF-1635
legacy_ids: []
slug: mindie_tool_call_parser_arguments_type_and_dsml_prefix
aliases: []
title: tool-call 解析把 arguments 变字符串，不认无 DSML 标记
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: 通用
    component: tool-call 解析（非流式）
  behavior: 非流式解析函数无法正确解析 arguments 的 type，统一表示成 string；且解析器只认 <|DSML|function_calls> 形式，QuaRot w8a8 权重输出的 <function_calls> 直接解析失败。
effect:
  objects:
  - 输出内容
  - 测试判定
  detail: bfcl 非流式评测精度偏低、工具调用参数类型全被写成字符串；DeepSeek-V3.2-w8a8-mtp-QuaRot 权重下结构化字段解析失败，请求本身不报错。
  visibility: 静默错误
mitigation:
  detect: 对非流式 tool calling 请求检查返回的 arguments 类型（应为原始 object 而非 string）；用 QuaRot 量化权重跑一次 bfcl，观察结构化字段是否为空
  fix: issue closed；正文只描述两处解析缺陷，未给修复 PR 与版本
