original:
  mechanism: 'vLLM #62304（c2026-10-18，v0.31.0，Qwen3.5-0.8B probec probe twin——真实 shape 合成权重、正确输出精确已知且对归约顺序不敏感，偏离即引擎错误）。n-gram 投机解码（k=4, prompt_lookup_max=4, min=2）在部分 draft 被接受的步骤上，GDN（Gated DeltaNet，3/4 层）循环状态漏掉已接受 token 的更新：对每个失败请求回放 oracle，状态缺失一个此前已接受 token 的写（8 例中 6 例为首个错输出前一步接受的 token）；无任何失败可由拒绝 draft 的写被保留解释。探针设计：GDN 层循环状态是每 class 一个槽的表，每个 decode token 写自己 class 的槽、后续步读槽——输出直接暴露状态包含哪些写。部分请求仅错一个 token 后恢复正确（单次漏写的探针形状）。对照矩阵：12 种无投机配置（三注意后端×prefix cache 开关×chunked prefill×eager×抢占×bf16 SSM cache×双 decode kernel×FP8 KV）全 0 错；SGLang 0.5.22 NGRAM 同探针精确。触发细节数据见 effect。确定性：同 8 请求同 967 个错 token，两主机+重跑一致；async_scheduling/enforce_eager/max_num_seqs=1 不变（不依赖调度）。'
  source: 2026-10-18 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/62304 （open）
  behavior: 在 vLLM 0.31.0 上对混合 GDN 模型（Qwen3.5 类）开 n-gram 投机解码后，greedy（temperature=0）输出对部分请求出错：同一批 192 个请求约 4-10% 的请求从某步开始产出错误 token（多数错一个 token 后恢复）。错误确定性可复现；关掉投机解码后 12 种配置全部精确，draft 全被接受时也全对。投机解码不应改变 greedy 输出，属静默损坏。
  trigger_surface: vLLM 0.31.0；ngram/ngram_gpu 投机 + 部分 draft 接受步；混合 GDN 模型（Qwen3.5）；RTX 3090 两主机
