original:
  mechanism: 在 run_mode='predict'、context.mode=0（Graph 模式）、context.device_target='CPU' 的组合下，mindformers 的 build_context 会自动把 MindSpore Context 的 infer_boost 设为 'on'，导致部分算子被放到 host 侧执行时结果不对。issue 给的最小复现只构造 LlamaEmbedding(128256, 4, float32)，输入 tokens=[[0,1,2]]，在 build_context 之后调用 emb(tokens) 并把结果与 emb.embedding_weight[0..2] 对比：期望三个位置分别等于权重第 0、1、2 行，实际输出 (1,3,4) 的三个位置全部是 embedding_weight[0] 的同一份数据（打印出的三个 4 维向量逐位相同）。问题定位在 infer_boost 开关默认值而非 gather 算法本身，正文主要证据是 LlamaEmbedding 里的 gather 在 host 侧出错的复现；版本为 MindFormers dev（commit 未在正文给出），环境 Ascend 910B4 主机 + CPU 后端、MindSpore 2.5.0、CANN 7.5。
  source: 2024-11-23 GitCode mindspore/mindformers issue https://gitcode.com/mindspore/mindformers/issues/181 （closed）
  behavior: 在 CPU 上做 graph 模式推理，模型能正常跑完、不报错，但输出全是重复或明显离谱的内容；把 embedding 单独拿出来看，输入 [0,1,2] 三个不同 token 拿到的是同一行权重，三个向量逐位相同。整条链路没有任何异常日志，只有把中间张量和权重逐行对比才能发现从 embedding 开始就错了。
  trigger_surface: run_mode=predict + context.mode=0（Graph）+ device_target=CPU，MindFormers dev + MindSpore 2.5.0
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
