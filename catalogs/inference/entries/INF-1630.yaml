title: 自动开 infer_boost 致 CPU 推理 embedding 错行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: infer_boost host gather
  behavior: predict + Graph + device_target=CPU 时 build_context 自动把 Context 的 infer_boost 置 on，host 侧 gather 走 infer_boost 路径后结果错
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: LlamaEmbedding 对 tokens [0,1,2] 三个位置返回同一行 embedding_weight[0]，输出逐位相同；不报错，下游生成全部基于错误 embedding
  visibility: 静默错误
mitigation:
  detect: CPU graph 推理后比对 embedding 输出与直接索引权重；检查 Context 的 infer_boost 是否被 build_context 自动置 on
  fix: 待定（issue closed，正文只给复现脚本；规避是不要在该场景用 predict+CPU 默认 infer_boost，未核实默认值是否已改）
