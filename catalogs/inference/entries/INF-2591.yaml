remarks: 与 INF-1582（同算子 bf16/fp16 中间精度口径不一致）同属 MoeFinalizeRouting 累加精度策略缺陷；本条具体为 fp16 原生 half 累加在大 K 抵消场景下的灾难性精度丢失。
