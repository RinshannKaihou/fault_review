  - 数值结果
  - 隐状态
  detail: K=96、前32行 1024/中32行 1/后32行 -1024 的合法输入，数学结果 32.0，实测输出 0.0；两段返回 0，调用方只能从模型精度异常发现。
  visibility: 静默错误
mitigation:
  detect: 构造 K 个大值正负抵消、小项夹在中间的用例，与 fp32 参考对照；检查输出是否为 0 或数量级偏差
  fix: 待定（open；issue 建议改为 fp32 中间累加，未见修复 MR）
