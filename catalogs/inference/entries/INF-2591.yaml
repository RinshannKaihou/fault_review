title: MoeFinalizeRoutingV4 fp16 大 K 累加灾难性抵消
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnMoeFinalizeRoutingV4
  behavior: fp16 路径用 half 精度顺序累加 K 个 expandedX 行；大值互相抵消时小项在 32768 上加 1 被舍入掉，最终结果与资料公式/fp32 中间量口径出现数量级偏差。
effect:
