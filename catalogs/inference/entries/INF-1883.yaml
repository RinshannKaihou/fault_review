id: INF-1883
legacy_ids: []
slug: mindie_structured_output_no_stop_json_continues
aliases: []
title: 结构化输出不停机，JSON 后继续补人类轮次
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: 通用
    component: json_schema 约束停机制
  behavior: 'json_schema 约束只保证采样出的 token 合法，生成到 schema 闭合后没有触发停止，模型继续按 chat 模板续写下一轮，把 prompt 以 Human: 形式回显在 JSON 之后'
effect:
  objects:
  - 输出内容
  detail: 'Qwen3-30B-A3B（MindIE 3.0.0，ATB）带 response_format json_schema 的请求，content 是合法 JSON 后紧跟 Human: 提取以下文本…，finish_reason 仍是 stop、HTTP 200 无告警'
  visibility: 静默错误
mitigation:
  detect: 对结构化输出请求直接 json.loads 校验；解析失败时看尾部是否粘了下一轮模板文本（Human:/Assistant:），而不是怀疑模型能力
  fix: 未修复（issue 已关闭，未核实是否由后续版本修复）；规避：服务端按首个完整 JSON 截断，或检查结构化路径下 stop token/EOS 是否真正生效
