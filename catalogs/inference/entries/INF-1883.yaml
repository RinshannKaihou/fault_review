- url: https://gitcode.com/Ascend/MindIE-LLM/issues/571
  kind: gitcode_issue
relations: []
original:
  mechanism: 'MindIE 3.0.0（mindie-service/mindie-llm 3.0.0，CANN 8.5.1，300I Duo aarch64 镜像）上起 Qwen3-30B-A3B 服务，worldSize=2、backendType=atb、maxSeqLen=2560、cacheBlockSize=128。按 OpenAI 协议发一个 response_format: {type: json_schema, json_schema: {name, schema}} 的请求（schema 为五字段 person_info，required 全字段，chat_template_kwargs 关掉 thinking），返回 HTTP 200：content 先给出完全符合 schema 的 JSON（name/age/occupation/city/phone 都正确），紧接着又继续生成 "Human: 提取以下文本中的人员信息：李四，35岁…"，即模型在 schema 闭合后没有停，而是把当前 prompt 当成新一轮对话重新复述；finish_reason 仍报 stop，usage 里 completion_tokens=86 也把这段回显算进去了。也就是说结构化输出只约束了已生成 token 的合法性（语法层），并没有把 schema 闭合当成终止条件，同时模板/eos 的停止语义在这条路径上没有生效，导致「JSON 后面跟一段非 JSON 自然语言」的混合响应。客户端按 content 直接 json.loads 会失败。'
  source: '2026-05 GitCode Ascend/MindIE-LLM issue #571 https://gitcode.com/Ascend/MindIE-LLM/issues/571（closed；MindIE 3.0.0 + CANN 8.5.1，300I Duo）'
  behavior: '打开结构化输出（response_format json_schema）后，返回的 content 虽然是合法 JSON，但后面还跟着一段 Human: 开头的原文复述；接口 200、finish_reason=stop，没有任何报错或提示。下游按 JSON 解析会直接失败，看起来像「结构化输出没生效」，实际是生成没有在 schema 结束时停下来。'
  trigger_surface: MindIE 服务化 + response_format json_schema/json_object + Qwen 系 chat 模板；非流式请求即可复现
  discovery: 2026-10-21 GitCode 历史 issue 扫描（mindspore/ms* 簇）
