title: vLLM-Ascend 省略 --block-size 时元数据失配输出乱码
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: block size 刷新与元数据构建不一致
  behavior: 源码级假设（非运行时 trace）：带 prefix caching/chunked prefill 且未传 --block-size 时，Ascend 构建前解析为 128，随后 worker 按后端偏好选 16，与已分配规格不一致
effect:
  objects:
  - KV状态
  - 输出内容
  detail: DeepSeek V4.1 Flash P/D 部署省略 --block-size 时全部 8 个端点与 16 组 P/D 对检查失败：reasoning 复述错误的校验码与算式、content 为 null 或空、1024 token 截断；显式 --block-size 128 输出正常
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定（issue open；规避：显式传 --block-size 128）
