id: INF-1741
legacy_ids: []
slug: ops_nn_scatter_nd_update_deterministic_var_idx_uninit
aliases: []
title: scatterNdUpdate 确定性路径残留索引致误写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: scatterNdUpdate 确定性分支
  behavior: 确定性分支的 varIdxGm 未显式初始化，非法索引行在 compute 阶段读到上一轮残留的合法索引，被当成有效更新写回。
effect:
  objects:
  - 数值结果
  detail: deterministic_level=3：先跑合法索引 [10,11,12,13]，再跑全 -1，槽位 10 仍被写入 7.0；关闭确定性则无误写，返回码始终正常。
  visibility: 静默错误
mitigation:
  detect: 确定性开启时连跑两组用例（先合法索引、再全 -1），检查是否仍有槽位被改写；单组用例和无确定性对照都看不出来。
  fix: issue closed；修复把 varIdxGm 全局内存初始化为 -1 并新增 tiling 字段 indicesAxis（未给 MR 号，合入状态未核实）。
