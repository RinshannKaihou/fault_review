original:
  mechanism: cann/ops-nn issue 5564（2026-09-04，closed）：Ascend 950。ScatterNdUpdate 确定性场景下 varIdxGm 没有显式初始化，非法索引行在 compute 阶段可能读到上一轮残留值导致误写；修复新增 tiling 字段 indicesAxis 并把 varIdxGm 全局内存初始化为 -1。作者给的两步复现：第一次合法索引 [10,11,12,13] 后非零槽位为 [10,11,12,13]；第二次索引全 -1 后仍出现“被改动槽位 [10]，值 [7.0,7.0,7.0,7.0]”，与 update 填的 7.0 一致，说明残留索引把上一次的更新重放了一次；关闭确定性后无误写。
  source: 2026-09-04 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5564 （closed）
  behavior: 开启确定性（deterministic_level=3）后，一串原本应当“什么都不写”的非法索引（全 -1）调用仍会改写输出中的某个槽位，值恰好等于上一轮 update 的内容；关闭确定性就恢复正常，因此这类误写只在确定性通路出现，接口返回码始终是成功。
  trigger_surface: scatterNdUpdate + deterministic_level=3 + 非法/负索引行
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
