title: aclnnSquaredRelu out 契约缺失错写越界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: squared_relu out 校验
  behavior: 第一段不校验 out 与 input shape 一致也不拒绝非连续 out：偏小 out 时内核按 input 元素数写完越界；非连续 out 时按连续内存写而按逻辑 stride 读回错位。
effect:
  objects:
  - 数值结果
  detail: input=fp32[4x8]：out=[4x4] 越界写 16 元素、out=[1x8] 越界写 24；out strides=[8,1]（资料标 ×）时 8 逻辑元素 4 个错值，两段均返回 0。框架把 out 传成切片/转置视图时常见。
  visibility: 静默错误
mitigation:
  detect: 出参 shape/stride 契约探针（偏小 out + 金丝雀越界检测、非连续 out 逻辑视图比对）。
  fix: 待定（未见修复 MR）
