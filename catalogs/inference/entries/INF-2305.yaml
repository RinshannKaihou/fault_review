original:
  mechanism: 'cann/ops-nn aclnnSquaredRelu out 参数契约缺失两缺陷（issue #7756/#7757，910B3/CANN 9.2.0，master 59c0720c 实测）：(1) GetWorkspaceSize 不校验 out 与 input shape 一致——input=fp32[4x8]、out=fp32[4x4] 时两段返回 0，内核按 input 32 元素写完，越界写 16 个元素（out=[1x8] 时越界 24）；资料要求 out 与输入 dtype/shape/格式一致，应 161002 拒绝。(2) 非连续 out（shape[2,4]、strides[8,1]、storage[2,8]）被放行（资料「非连续Tensor」标 ×），内核按连续内存写 8 个结果，按逻辑 stride 读回时第二行仍是哨兵值——8 个逻辑元素 4 个错值。两者均两段返回 0 静默错值/越界。报告者指出框架侧把 out 传成视图（切片、转置 buffer、narrow）很常见，误差被后续层放大且无告警。与 10-29 GeluMul 族（INF-2261）同属 out 契约缺失大类，本条为独立算子的独立提单。'
  source: GitCode issue https://gitcode.com/cann/ops-nn/issues/7756 、https://gitcode.com/cann/ops-nn/issues/7757 （均 open，2026-10-30 创建；各含 CTRL/DEFECT 实测与自包含复现）
  behavior: 调用 aclnnSquaredRelu 时把输出张量传得比输入小（如输入 [4,8] 传 [4,4]）：接口返回成功，内核按输入大小往输出缓冲区写，多出来的 16/24 个元素写到缓冲区外，踩坏相邻显存；把输出传成非连续视图（如带 stride 的切片）时，内核按连续内存写、调用方按 stride 读，一半逻辑元素还是初始值。两种情况都无报错，输出错值或相邻数据损坏，且都是框架里传视图时自然发生的形态。
  trigger_surface: cann/ops-nn squared_relu；out 偏小（越界写）或非连续（错位写）；两段式 ACL 直调；910B3。
  signature: 偏小 out 时缓冲区外哨兵被覆写；非连续 out 时逻辑视图一半元素为初始值。
  repro: 两 issue 各附自包含 repro.cpp（CTRL/DEFECT 分组输出）。
  discovery: 2026-10-30 每日扫描
