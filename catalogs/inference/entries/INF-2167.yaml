  mechanism: CANN 9.2.0 Atlas A2（910B2）上 aclnnSparseFlashMlaMetadata 把每个 Batch 的 Q 侧有效 token 数可选输入 sequsedQOptional 整条数据通路丢弃：固定 batchSize=4、maxSeqlenQ=1024 等配置，只改 sequsedQ 元素值（1024/256/64/2/1/0），metadata 内容指纹全部 9ae9154dd9ceb7e3 不变、非零元素恒 105，与完全不传时逐字节相同；sequsedQ 全 0（语义上无任何 Q token 应全空调度）仍满长。分核方案按 maxSeqlenQ 满长切 s2/m 区间，下游 aclnnSparseFlashMla 按满长任务搬运 KV 多算。对照实验同签名 sequsedOriKvOptional 真实改变调度（256→105、1→11 非零元素），证明 seqused 数据链本身通、唯独 sequsedQ 没接进去；kernel 侧针对 seqused_q 的越界校验也从未触发。
