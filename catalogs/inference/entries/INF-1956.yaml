original:
  mechanism: 'vllm-ascend issue #5404（2025-12-26，closed）：DeepSeek-v3-W8A8 用 Mooncake layerwise 1P1D 部署，decoder 侧日志一直打印「Number of completed KV cache recv requests: 0」，报告者因此怀疑 prefill 传来的 KV 没有被 decode 使用，并追问如何判断 mooncake 是否生效。维护者 LCAIZJ 回复：这个 0 是代码里硬编码打印的，不是实际计数——该行在 DP0 之外的 rank 上不反映真实状态，要看 DP1 的 receive requests 日志（那里会显示 1）。也就是说这条被运维当成「KV 是否生效」唯一依据的日志从来不会随负载变化，现象与实现不一致，属于监控/日志盲区而不是 KV 传输真的失败。issue 后被以「新版本已解决」关闭，没有留下修复 PR 编号。'
  source: 2025-12-26 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/5404 （closed）
  behavior: layerwise PD 部署起来后，prefill 明确发出了 KV、decoder 也能正常回答（「我是一个人工智能助手…」），但 decoder 日志里的完成计数始终是 0，和「KV 已收到」的实际情况相反。运维在没有其它判据时只能认定 KV 传输没生效，于是去查网络、查 connector 配置，把排查时间花在了不存在的问题上；同一份日志在看板上还会被当成 PD 链路故障率指标。
  trigger_surface: Mooncake layerwise PD 分离 + decoder 侧 DP rank > 0 的完成计数日志
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
