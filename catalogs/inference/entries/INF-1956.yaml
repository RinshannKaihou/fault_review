title: Layerwise 完成计数硬编码 0，无法判断 KV 是否生效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: vllm
    component: layerwise KV 接收计数日志
  behavior: Decoder 侧「Number of completed KV cache recv requests」被硬编码打印为 0，不反映实际接收；需查看 DP1 的 receive requests 日志。
effect:
  objects:
  - 指标/日志
  detail: Mooncake layerwise 1P1D 部署里 decoder 始终显示 0，运维据此判断 KV 没被应用、被引向错误的排查方向；实际请求正常返回。
  visibility: 静默错误
mitigation:
  detect: 对比 DP0 与其它 DP rank 的 receive requests 日志，或直接看 KV 传输侧计数；不要以该行日志作为 KV 是否生效的判据
  fix: 待定（维护者确认是硬编码，issue 以「新版本已解决」关闭，未给对应 PR 编号）
