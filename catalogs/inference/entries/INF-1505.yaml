  - subsystem: 观测/评测
    stack: pytorch
    component: INT_TYPE 与二进制比较
  behavior: core/common/const.py 的 INT_TYPE 不含 int8，比对按 not inexact 判 SKIP；放开类型后又沿用要求完全一致的 compare_bool_tensor，量化算子必判 fail
effect:
  objects:
  - 测试判定
  detail: api_accuracy_checker 比对含 int8 输出的 NPU 量化算子时，结果为 SKIP，备注为 'data type numpy.int8 not inexact'；改严格二进制比较后 error_rate 非 0、全部 fail
  visibility: 静默错误
mitigation:
  detect: 比对结果里筛 Status=SKIP 且 Message 含 'not inexact' 的行，统计被跳过的 int8 输出算子数；不要以 SKIP 当通过
  fix: 待定（#190 只给出修复总结，未给 PR 编号；#260 提出 requantize_compare 容忍量化误差，属方案讨论）
