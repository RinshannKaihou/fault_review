  behavior: 对 bfloat16 张量调用 ttnn.softplus，所有 x<-5（默认参数）的元素输出精确 0.0，而 PyTorch bf16 输出 0.0025~0.0067 的小正值；在 -5 附近输出不连续跳变。无报错，负区激活被整体抹零。
