  mechanism: tt_metal/hw/ckernels/{wormhole_b0,blackhole,quasar}/metal/llk_api/llk_sfpu/ckernel_sfpu_softplus.h 的 softplus BF16 实现对 beta*x<=threshold 且 |beta*x|>5 的负输入做尾部钳位返回 +0.0。但该区间真值 log1p(exp(beta*x)) 是小而严格可表示的 bf16 值（torch 上 x=-6 为 0.00247、x=-5.03125 为 0.0065），钳掉的残差就是全部输出。函数还不连续：-5.0 输出 0.006713 正确（a=5.0 不大于边界走多项式路径），下一个可表示 bf16 值 -5.03125 的输出从 0.0065 跳变为 0.0。实测对照 torch（bf16 输出、RNE、默认 beta=1/threshold=20）逐点列表确认。
