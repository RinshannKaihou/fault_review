original:
  mechanism: 'Ascend/torchair #412（A5、CANN 9.0.0、torch/torch_npu 2.7.1、Python 3.13、Ubuntu 24.04）：torchair 图模式下把 all_gather、all_reduce、broadcast、reduce_scatter_tensor、all_to_all、all_to_all_single 串在同一个 torchair.scope.super_kernel("sp1", "None") 作用域里执行时，reduce_scatter 的结果精度异常，同组其它通信算子输出正常。判定性证据：把传给 reduce_scatter 的输入从 dict_result[''reduce_scatter_input_tensor''] 改成 .detach().clone()（即让通信算子持有私有缓冲）后精度恢复；不用 super_kernel、走普通图模式也正常。这说明同组内后续算子复用了 reduce_scatter 的输入缓冲，输入在 reduce_scatter 读取前/期间被覆写。issue 未给出 torchair 侧具体 pass 或源码位置。'
  source: 2026-04-03 GitCode Ascend/torchair issue https://gitcode.com/Ascend/torchair/issues/412 （closed）
  behavior: 多卡图模式下把几个集合通信算子放进一个 super_kernel 作用域，reduce_scatter 出来的结果就是错的，而同一组里的 all_gather/all_reduce/broadcast/all_to_all 都对；不报错也没有 NaN。给这个输入加一个 detach().clone()、或干脆不用 super_kernel，结果就恢复正确——现象看起来像「某个通信算子的输入被兄弟算子写掉了」。
  trigger_surface: A5 + CANN 9.0.0 + torch 2.7.1；torchair 图模式 + scope.super_kernel 内连续下发多个集合通信算子
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
