id: INF-1875
legacy_ids: []
slug: torchair_superkernel_reduce_scatter_input_overwritten
aliases: []
title: super_kernel 组内 reduce_scatter 输入被覆写致精度错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: super_kernel 通信算子输入复用
  behavior: super_kernel 组里连发 all_gather/all_reduce/broadcast/reduce_scatter/all_to_all 时，reduce_scatter 的输入张量未被当作需保持的输入，被同组后续算子覆写。
effect:
  objects:
  - 数值结果
  detail: A5 + CANN 9.0.0 + torch 2.7.1：reduce_scatter 结果与期望不符，同组其它通信算子正确；把该输入改成 detach().clone() 后精度正常，去掉 super_kernel 作用域也正常。
  visibility: 静默错误
mitigation:
  detect: 同图开/关 used_superkernel 比对各通信算子输出；对可疑输入加 detach().clone() 看是否恢复
  fix: 待定（issue closed，未给出 torchair 侧 pass 定位）
