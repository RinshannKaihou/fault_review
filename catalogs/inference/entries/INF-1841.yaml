original:
  mechanism: vllm-ascend 的 rotary_embedding.py 里存在两套实现分支：一套调用 Triton kernel，一套调用 Ascend C（triton-ascend）实现。G8600 镜像默认环境里 triton 与 triton-ascend 同时存在，代码会走下面（Triton）分支；把 triton 卸载、只保留 triton-ascend 后改走上面（Ascend C）分支。报告者认为无论 Triton 实现还是 Ascend C 实现，位置编码结果应当一致，但实测走 Triton 分支时出现推理重复输出（乱码）现象，并附图对比两条分支的代码与输出。issue 正文未给出两种实现的数值 diff 量级，也没有给出修复 PR。
  source: 2026-04-08 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/8047 （open）
  behavior: 在默认镜像（triton 与 triton-ascend 共存）上推理，输出出现重复句子、整段复读甚至在长文本里乱码；同模型同参数把 triton 卸掉只留 triton-ascend 后恢复正常。因为没有任何报错，容易被当成模型本身的行为。
  trigger_surface: rotary_embedding 实现分支选择 + triton 与 triton-ascend 共存
