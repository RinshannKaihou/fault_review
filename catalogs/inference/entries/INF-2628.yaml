id: INF-2628
legacy_ids: []
slug: flashinfer_cuda_rmsnorm_row_offset_uint32_wrap
aliases: []
title: FlashInfer CUDA RMSNorm 行偏移 32 位回绕
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: norm.cuh RMSNorm 系列
  behavior: 六个 CUDA JIT norm kernel 用 uint32_t 计算 bx*stride 的行起始偏移，行起点达到 2^32 元素时回绕，读写落到错误行。
effect:
  objects:
  - 数值结果
  detail: 3 行 bf16、行距 2^31 元素时第 3 行返回第 1 行结果（max err 3.52）；连续 fp16 (350000,12288) 从第 349526 行起错，回绕块还改写第 0 行；无报错。
  visibility: 静默错误
mitigation:
  detect: 用 as_strided 构造行距 2^31 的 3 行张量，逐行与 fp32 参考比对并检查 y[2]==y[0]；或用 (350000,12288) fp16 全量对拍并检查第 0 行是否被改写。
  fix: 待定（issue open；CuTe DSL norm 与 CUDA LayerNorm 已改用 64 位偏移）
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-27'
remarks: 与 INF-2540（aclnnIsInf 超 2^31 元素偏移溢出）同属 32 位偏移算术在大元素量下回绕；本条载体是 CUDA RMSNorm 行基址，阈值 2^32 元素。
