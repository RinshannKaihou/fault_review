original:
  mechanism: 'aclnnApplyAdamWQuant 的 mRef（输入/输出）调用后恒为 0：256 元素全 0（min=max=sum=0）；同一调用内 vRef 256/256 索引与参考一致、absmaxMRef 一致（0.4）；mRef 预填 127 后仍被写 0，排除「未写回」。资料《aclnnApplyAdamWQuant》参数表：mRef 为「AdamW 优化器公式中 m 参数量化前的索引值，根据索引导出 qmapM 中具体的值」，应按更新后的 m 写出新量化索引（与 vRef 对称）。当前写全 0 导致下一步以 0 号索引反量化 m（absmaxMRef 系统性偏小：第 2 步实测 0.2013，参考 0.5268）。环境：Atlas A2（910B2）、CANN 9.2.0、ops-nn master a429215a3471（apply_adam_w_quant 自 a61e016a71f4 后无改动），2026-11-01 复现，自包含 C++ repro（对照组 vRefIdx 偏差 0，缺陷组 mRefIdx 偏差 255）。关联 #7736（同接口另一现象：全零 block 归一化 NaN，已收 INF-2320 族；closed）。来源 https://gitcode.com/cann/ops-nn/issues/7901（open，2026-11-01；#7896/#7900 为重复提交后已删/已关副本）。'
  source: '2026-11-01 每日扫描。https://gitcode.com/cann/ops-nn/issues/7901 （重复帖 #7896/#7900 closed）'
  behavior: 用 aclnnApplyAdamWQuant 做量化 AdamW 状态更新：调用返回成功，vRef 和 absmaxMRef 都对，但 mRef 输出 256 个元素全是 0（预先填 127 也会被覆盖成 0）。下一步拿 0 号索引去反量化动量 m，动量被系统性算小（absmaxMRef 实测 0.2013，正确值 0.5268），训练/推理中的量化优化器状态静默损坏，无任何报错。
