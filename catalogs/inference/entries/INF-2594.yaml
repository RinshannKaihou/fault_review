original:
  mechanism: 'MsModelSlim `br_hif_support_271120`（复现提交 ec80c616f2c85e30418f924695f1d63234ffc6a4）导出 HiF4 权重时，`weight_scale` 的打包顺序与设备解码器不一致。预期按小端序：每组权重 4 字节，依次是一级 Lv1、二级 Lv2、三级 Lv3 的低字节和高字节，Lv2/Lv3 标志位从对应字节的 bit0 开始写入；按该布局固定输入应输出 `C0 AA 01 04`。原实现把 Lv1 放在最高字节，并从 bit7 开始写 Lv2/Lv3 标志，实测输出 `80 20 55 C0`；设备按预期布局读取时得到错误的缩放因子。受影响的是 AscendV1 与 MindIE 导出的 `W4A4_HIFP4`、`W4A8_HIFP4_MXFP8` 权重的 `weight_scale`，固定输入每次生成相同错误字节。修复 PR #1216 已提交，自测脚本与 183 项 CPU 单测通过，导出格式与 HiF4 转换文档待补小端布局说明、旧布局权重需重新导出。'
  source: https://gitcode.com/Ascend/msmodelslim/issues/728（open，2026-11-23，含预期/实测字节与修复 PR）；修复 PR https://gitcode.com/Ascend/msmodelslim/merge_requests/1216
  behavior: 用 MsModelSlim 导出 HiF4（W4A4/W4A8）量化权重后，模型加载能成功，但推理结果数值错误：weight_scale 的 4 个字节被打成 `80 20 55 C0`，而设备解码器期望 `C0 AA 01 04`，三级缩放因子的位域整体错位。导出工具不报错，权重文件看起来完整，只有拿设备解码结果或参考反量化对照才能发现；AscendV1 与 MindIE 两条导出链路的 W4A4_HIFP4、W4A8_HIFP4_MXFP8 都受影响。
  trigger_surface: MsModelSlim br_hif_support_271120（复现提交 ec80c616）、AscendV1/MindIE 导出 W4A4_HIFP4、W4A8_HIFP4_MXFP8；HiF4 权重的 weight_scale 小端打包。
  discovery: 2026-11-26 每日扫描
