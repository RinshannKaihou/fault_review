title: HiF4 导出 weight_scale 打包顺序与设备解码不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: msmodelslim
    component: HiF4 weight_scale 导出
  behavior: HiF4 W4A4/W4A8 导出时把 Lv1 放在最高字节、Lv2/Lv3 标志从 bit7 起写；设备按小端布局从 bit0 读三级 scale，读出的缩放因子错位。
effect:
  objects:
  - 模型权重
  - 数值结果
  detail: 固定输入导出 weight_scale 应为 C0 AA 01 04，实测 80 20 55 C0；AscendV1 与 MindIE 导出的 W4A4_HIFP4、W4A8_HIFP4_MXFP8 权重均受影响，加载后量化模型数值错误。
  visibility: 静默错误
mitigation:
  detect: 对固定权重导出后按小端逐字节核对 weight_scale 的 Lv1/Lv2/Lv3 位域；与设备解码器/参考反量化结果对照
  fix: 修复 PR https://gitcode.com/Ascend/msmodelslim/merge_requests/1216 已提交（自测与 183 项 CPU 单测通过；是否合入/发布未核实）；文档待补小端布局与旧权重需重导
