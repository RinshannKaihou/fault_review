  mechanism: 基于分数的 KV 驱逐策略保留 attention 得分 top-k 的 token 加上最近若干 token，其余淘汰。当预算过小、或启发式排序判断失误（一个对未来至关重要的 needle 此刻累计得分很低）时，该 needle 的 K/V 被丢掉。本条为 MERGED 条目，合并的子故障为：SnapKV mis-rank（SnapKV 排序失误）、heavy-hitter budget collapse（heavy-hitter 预算过小导致崩溃）。
  source: Zhang, Sheng, Zhou et al., "H2O", NeurIPS 2023, https://arxiv.org/abs/2306.14048 。SnapKV arXiv:2404.14469。DefensiveKV arXiv:2510.13334；"Pitfalls of KV Compression" arXiv:2510.00231。
  behavior: 被驱逐区段发生静默检索失败——模型无法回答关于这些内容的问题，并可能转而编造。不会崩溃。
  trigger_surface: 可复现
  signature: '**ON-manifold**：残存的 cache 是一个合法子集，模型基于它做出的推断本身自洽。签名形态是**结构性缺失（STRUCTURAL-ABSENCE）**：被驱逐区段的 per-position cache occupancy 恒为 0，needle 位置的 attention-share 塌陷为零。需要对比式探针（contrastive probe，即与保留完整 cache 的参照对照）才能发现；activation-norm 类的 geometric 离群检测、以及 statistical 族的分布检测都会漏检，因为没有任何数值离群。'
  repro: 用 hook 按选定策略丢弃指定位置的 KV 条目（可直接指定 needle 位置以构造确定性的检索失败）。
