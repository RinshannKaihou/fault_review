- url: https://github.com/vllm-project/vllm-ascend/issues/23545
  kind: github_issue
relations: []
original:
  mechanism: vllm-ascend 0.32.0rc2.dev48（vLLM 0.32.0）在 Ascend 950DT、TP=2、eager 模式下服务 Kimi-Linear-48B-A3B-Instruct（KimiLinearForCausalLM，hybrid GDN + full attention，FP8 checkpoint）。开启 prefix caching 时 vLLM core 为 KimiLinearForCausalLM 默认选择 mamba cache mode='align'，并打印 'Mamba cache mode is set to align ... by default when prefix caching is enabled'。三个并发请求共享长公共前缀、在公共前缀之后各自埋入不同的 magic number，结果三个响应都包含最先填充共享前缀那条请求的数字，另外两条的数字从未出现；换两种任务后出现三条不同输入产生逐字节相同输出。8K 请求出现 128 个 '!' 的退化输出。同一组请求串行重放全部正确；加 --no-enable-prefix-caching 后长上下文检索分数从 8K/32K 的 0.0/33.3 提升到 100.0。报告者判断根因在 mamba 状态复用边界：prefix cache 命中的发散点不是线性注意力状态的安全边界，状态不应在不同 prompt 间复用。
  source: https://github.com/vllm-project/vllm-ascend/issues/23545（open，2026-11-27，含并发串答、串行对照与关闭 APC 的端到端分数）
  behavior: 给混合线性注意力模型开启默认 prefix caching 后，多个请求只要共享一段长前缀、后面内容不同，就会互相串答案：每个并发请求都返回最先那条请求里的内容，自己的信息完全不出现；不同输入甚至会产出逐字节相同的回答。长上下文任务从 8K 起出现整段 '!' 的退化输出。串行发或关掉 prefix caching 就恢复正常，服务本身不报错、不崩溃，只有答案静默错。
  trigger_surface: vllm-ascend 0.32.0rc2.dev48 / vLLM 0.32.0；Ascend 950DT；KimiLinearForCausalLM（hybrid GDN+full）FP8；enable_prefix_caching=True（默认）；chunked prefill 2048；TP=2 eager
  discovery: 2026-11-27 每日扫描
