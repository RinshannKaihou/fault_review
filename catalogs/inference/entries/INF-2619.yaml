id: INF-2619
legacy_ids: []
slug: vllm_ascend_mamba_align_prefix_cache_cross_request_reuse
aliases: []
title: vllm-ascend Mamba 前缀缓存跨请求复用错答
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm-ascend
    component: Mamba align 模式状态复用
  behavior: 混合 GDN 模型默认 mamba cache mode='align'，前缀缓存按 token 前缀命中复用 mamba/GDN 状态，但发散点不是安全状态边界，状态被跨 prompt 复用。
effect:
  objects:
  - 跨请求/跨样本数据
  - KV状态
  - 输出内容
  detail: 开启默认 prefix caching 时，3个共享长前缀、后段不同的并发请求都返回最先填充共享前缀那条请求的内容，自身信息不出现；不同输入可产生逐字节相同输出；8K请求出现128个'!'。串行重放正确，关闭后8K/32K检索升至100.0。
  visibility: 静默错误
mitigation:
  detect: 并发发送共享长前缀、后段各埋不同标记的请求，检查每个响应是否返回自己的标记；串行重放与 --no-enable-prefix-caching 作对照。
  fix: 规避：--no-enable-prefix-caching（报告者实测完全修复）；根因修复未见，issue open
