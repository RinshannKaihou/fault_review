title: K3 解析器要求 response 前缀致合法 JSON 被判错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: kimi_k3_xtml.parse
  behavior: think 结束后只接受以 <|open|>response<|sep|> 开头的 response_tail（或它尚未写完的前缀），模型直接输出裸 JSON 时走 else 分支抛 KimiK3XTMLParseError
effect:
  objects:
  - 输出内容
  detail: response_tail 已是完整合法 JSON，仍抛 K3 think block must be followed by a response block.，请求 500，内容未返回给客户端
  visibility: 报错
mitigation:
  detect: 对 thinking 开启的 K3 请求检查 parse 分支是否命中 else；用裸 JSON 输出（不带 response 标记）的样本回归
  fix: 待定（issue 只给打点与 traceback，无修复 MR）
