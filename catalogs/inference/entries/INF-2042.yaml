original:
  mechanism: 'vllm_ascend/patch/platform/kimi_k3_xtml.py 的 parse(text, final)：thinking_enabled 分支在找到 THINK_END 后取 response_tail，只有 startswith(RESPONSE_START) 才前进 cursor，只有 not final 且 RESPONSE_START.startswith(response_tail) 才当成未写完的流早返回，其余一律 raise KimiK3XTMLParseError(K3 think block must be followed by a response block.)。实际模型这一次把回复直接写成 {"reply": ...} 形式的裸 JSON（reasoning 里已说明「My response must be raw JSON matching the schema」），response_tail 是完整合法 JSON 而不是以 <|open|>response<|sep|> 开头，于是被判成格式错误。打点输出 reasoning=...、cursor=376、response_tail={"reply":"您好!您还没有提供需要提取的文本内容。..."} 后被 400/500 路径吞掉。镜像 vllm-ascend:kimi-k3-a3，A3 单机。'
  source: 2026-07-30 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13204 （open）
  behavior: '开 thinking 后要求 JSON 格式化输出时，接口直接 500 Internal Server Error（ASGI 里 KimiK3XTMLParseError: K3 think block must be followed by a response block.），客户端拿不到任何内容；但从打点看模型其实已经生成了合法的 {"reply": ...} JSON，只是没套 response 标记。关闭结构化输出或换模型能绕过，属于解析层把正确内容判成错误。'
  trigger_surface: K3 解析器 + thinking 开启 + 结构化 JSON 输出（模型直接输出裸 JSON）
  discovery: 2026-10-21 系统扫描（sweep_2，issue created < 2026-10-07 历史索引
