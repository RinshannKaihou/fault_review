  meta: '`infra_off`（`ttnn.slice`（row-major program factory）在**非最内维被截断且最内维 begin 非对齐**时漏算一次行跳跃：`(5,65,1025)` fp32 输入 `slice([0,0,1],[5,64,1025])` 得 6144 元素错（6/320 输出行）、输出形状正确、无任何错误；每个坏行内容恰为**应被丢弃的前一行**（线性偏移 −1025 = 恰一行 stride）；batch 0/4 全对、受害 batch 仅前数行错后 resync；bf16 时坏行降为 1（错误行数 dtype 依赖）；ROW_MAJOR/TILE 双布局同错；bisect 锁定 `70ba57dc3ab`） · Cov: `NEW`（数据移动游标步进数学错子签名；与 1.196 slice bounding-box vs corerange、1.226 ragged concat 游标同族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: row-major 切片内核在跨批次边界推进游标时，非对齐 innermost begin 使"跳过整输入行"的计数少进一位——读取起点落在应丢弃的行上；dtype 改变页/tile 对齐关系从而改变受害行数，说明缺陷在游标数学而非布局搬运。
  source: 'tt-metal #57382（2026-09-22 open，Bad Outputs，含三行 arange 取证（out[1,0]=input[0,64]）、f32/bf16 双 dtype 对照、ROW_MAJOR/TILE 双布局、逐 commit bisect 表）。https://github.com/tenstorrent/tt-metal/issues/57382'
