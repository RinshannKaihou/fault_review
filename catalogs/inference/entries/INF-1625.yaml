title: GBS 不能整除 DP×local_batch 时梯度累积步数被静默截断
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspore
    component: GBS 与数据均衡校验
  behavior: 只在静态 batch 分支校验 base_units > global_batch_size，不校验整除；GBS=10、DP=4、local_bs=2 时 base_units=8，10 // 8 把累积步数截成 1
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: 每步实际处理样本数与配置 GBS 不一致且无告警；HF 流式数据与 balance_enabled 同开时均衡器按 dataset[index] 随机读会提前推进迭代器，造成跳样本、顺序错乱与续训位置异常
  visibility: 静默错误
mitigation:
  detect: 启动前断言 global_batch_size % (DP × local_batch_size) == 0；流式数据集上检查是否同时开了 balance_enabled
  fix: 待定（issue closed，正文只指出三处缺校验，未给修复方式）
