original:
  mechanism: '三处缺校验，均由负载均衡/流水相关代码路径引入：1) GBS 未校验能否被 DP * local_batch_size 整除，原代码只在静态 batch 分支检查 if base_units > global_batch_size: raise ValueError，该检查发现不了 GBS 大于 DP*local_batch_size 但不能整除的情况（GBS=10、DP=4、local_batch_size=2 时 base_units=8），后续 10 // 8 把梯度累积步数静默截断为 1，实际每步样本数与配置 GBS 不一致；只在静态 batch 分支校验还让动态 batch scheduler 或数据均衡先拿错误配置跑，抛出的错误无法暴露根因。2) HF 流式数据与数据负载均衡同时开启时未提前报错：均衡器要通过 dataset[index] 随机读取一个 GBS 窗口内所有样本的 actual_seq_len 再重排索引，而 HFIterableDataset.__getitem__ 每调用一次就推进内部迭代器，streaming: true 与 balance_enabled: true 同开会提前消费数据，可能跳样本、数据顺序错误、续训位置异常。3) PP 场景按 rank 本地 model_parts 判断 MoE（has_moe = all(any(hasattr(layer.mlp,''experts'') ...) for part in model_parts)），混合 Dense/MoE 模型切分后不同 rank 可能分别只持有 Dense 层或 MoE 层，has_moe 不一致，开 pipeline_parallel_overlap_b_f 时部分 rank 关闭 overlap，schedule 执行序列不一致。基线 master / NPU。'
  source: 2026-09-22 GitCode mindspore/mindformers issue https://gitcode.com/mindspore/mindformers/issues/2599 （closed）
  behavior: 配 GBS=10、4 张卡、local_batch_size=2，训练照常跑起来，不报错也没有警告，但每个 step 实际只吃了 8 个样本，累积步数从应有的 2 被截成 1；对不上 loss 曲线时先会怀疑数据或学习率。开 HF 流式数据又顺手打开数据负载均衡，训练中途会莫名其妙跳样本、顺序错乱，续训位置也对不上。混合 Dense/MoE 模型开 PP 与 forward/backward overlap 时，部分 rank 按自己手上的层判断没有 MoE 而关掉 overlap，schedule 就不再一致。
  trigger_surface: 'global_batch_size 不能整除 DP×local_batch_size；streaming: true + balance_enabled: true；混合 Dense/MoE 模型 + PP + pipeline_parallel_overlap_b_f'
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
