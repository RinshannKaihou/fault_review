original:
  mechanism: AscendDSAMetadataBuilder 类把 Hadamard 矩阵以设备张量形式保存在 self.hadamard 上，并把它提供给 attention metadata、最终被 DeepSeek V4 稀疏 attention kernel 使用。执行 sleep(level=1) / wake_up() 一次循环后，该张量变为全零，导致稀疏 attention 用零矩阵做 Hadamard 变换、attention 计算错误。报告者用截图给出张量内容对比，并 @Ronald1995 请求跟进；issue 已 closed，正文未给出修复 PR 或具体恢复清单代码位置。缺陷性质是休眠时释放的设备内存/张量在唤醒路径上未被重新初始化。
  source: 2026-06-18 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/10684 （closed）
  behavior: 用 sleep/wake_up 做显存休眠唤醒（如 RL rollout 与推理复用同一进程）后，DeepSeek V4 系列的回答质量下降、结果与唤醒前不一致；服务不崩溃也不报错，日志里没有异常，只有把 self.hadamard dump 出来才看到它已经是全零。
  trigger_surface: DSA 稀疏 attention + sleep(level=1)/wake_up 周期
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
