original:
  mechanism: 'vllm_ascend/ops/triton/linearnorm/split_qkv_rmsnorm_rope.py 的 split_qkv_rmsnorm_rope（vllm::qkv_rmsnorm_rope）先把 positions 用 tl.load 搬进 UB tile，再在 tl.range 循环里用 get_element(x,(i,)) 把它当标量读出来查 cos_sin_cache。x 每个外层迭代重新 load，但标量单元与该次 MTE 传输之间没有排序，从第二个外层迭代起可能读到上一轮的位置，导致整行 token 的每个 Q/K head 按错误角度旋转；V 不做 RoPE 因此不受影响。竞态需要 iter_num_per_vec>1，而每轮行数由 UB 预算决定，所以形状越大触发阈值越低。报告在 bf16、head_dim=128、全 RoPE 下与 fp32 参考对比：num_tokens=257 时 max|err| 8.03/6.84，1024 时 9.36/6.46，容差 5e-2，6/6 次失败且逐次输出不同；num_tokens=1、16 通过。该缺陷自该算子加入的 #4711（2025-12）起存在，main@10b4fb2a9 仍在。issue 给出自包含合成输入复现脚本与 "rows off by one position" 统计。'
  source: 2026-09-16 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16674 （open）
  behavior: 在同一 serve 里跑 bf16 长 prompt 推理时，输出会随机变味：不是报错，也不是 NaN，而是文本质量下降、乱答、重复，且同一请求重跑结果不同。触发取决于 token 数与 head 形状——单条短请求（num_tokens 很小）看起来完全正常，长 prompt 或高并发打包后才开始出错；因为只有 Q/K 被按错位置旋转，V 正常，所以任何只比对 V 或只看是否有异常的检查都发现不了。
  trigger_surface: split_qkv_rmsnorm_rope / vllm::qkv_rmsnorm_rope 融合算子 + bf16 + 全 RoPE；num_tokens 超过随 (num_q_heads,num_kv_heads) 变化的阈值即触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
