id: INF-1551
legacy_ids: []
slug: vllm_ascend_split_qkv_rmsnorm_rope_pos_race
aliases: []
title: QKV 融合算子 RoPE 位置竞态致 Q/K 错转
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: triton QKV 融合算子
  behavior: get_element 从同一轮仍在填充的 UB tile 里标量读 RoPE position，MTE 传输与标量读之间没有排序，第二个外层迭代起读到上一轮的 position。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: num_tokens 超过形状相关阈值后 Q/K 每行按错误位置旋转，max|err| 达 9.4（算子自测容差 5e-2），6 次调用结果互不相同；V 不走 RoPE 所以正确。
  visibility: 不可复现
mitigation:
  detect: 同输入重复调用 6 次，比对输出是否逐位一致，并与 fp32 RMSNorm+RoPE 参考比 max|err|；(12,1) 形状从 num_tokens=1024 起、(64,4) 从 257 起观察
  fix: 待定；待修复项为 vllm_ascend/ops/triton/linearnorm/split_qkv_rmsnorm_rope.py 中 position 的取法，改成直接从 global memory 读标量可消除 UB 竞态（issue open，未见合并 PR）
