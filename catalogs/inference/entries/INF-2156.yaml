original:
  mechanism: tt-metal ttnn.conv1d 在 groups==in_channels、无 bias、dilation>1 时走 1D depthwise 专用路径，其 reader kernel 按步长 1 逐输入位遍历 kernel tap，完全忽略 dilation。结果静默错值：与 torch.nn.functional.conv1d 精确参考对比（N150，unit-tap 权重），C64/K3/dilation2/L40/batch2 错 3492/10240；C1024/K4/dilation2/L12（GDN 卷积形状）错 13811/36864；C128/K5/dilation3/L100 错 10790/25600；C96/K3/dilation4/L64/batch3 错 13119/36864。L1/DRAM 输入与 bfloat16/float32 均同样失败；dilation=1 正确；全零 bias 时走通用路径也正确。tt-metal 7acfb79a92，Wormhole N150（TT Console），KMD 2.9.0/FW 19.11.0。#49694 曾包含同一 reader 修改并获 approve，后因不活跃被关闭。
  source: 2026-10-23 每日扫描 https://github.com/tenstorrent/tt-metal/issues/62052（open，附精确计数表）
  behavior: ttnn.conv1d 传 groups=C、dilation>1、不带 bias 时输出静默错值（对照 torch 精确参考 30–40% 元素错），无任何报错；同参数加一个全零 bias（走通用路径）或 dilation=1 就正确。GDN/mamba 类模型的 depthwise 卷积形状（C1024/K4/L12）命中。
  trigger_surface: tt-metal 7acfb79a92（Wormhole N150）；ttnn.conv1d：groups==in_channels 且 dilation>1 且 bias_tensor=None；bf16/fp32、L1/DRAM 均触发。
  discovery: 2026-10-23 每日扫描
