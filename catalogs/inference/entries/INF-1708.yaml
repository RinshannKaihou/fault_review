original:
  mechanism: 'ops-transformer issue #5027（2026-09-07 closed，Ascend 950PR DAV_3510 / Ascend950DT_9584，cann-9.2.0，ops-test-kit ttk，aclnn 与 kernel 双通路）：rotary_position_embedding 的测试资产 tests/assets/golden.py 与 NPU kernel 的实际计算行为不一致，导致大幅值/极值用例出现虚假精度失败，影响算子精度回归判定。具体表现：用 ttk 以 --compare close --golden-mode Promote 跑 aclnnRotaryPositionEmbedding / V2 的大幅值用例（input_data_ranges 含 (-1000,-10)、(65504,65504)、(3.4028235e+38,3.4028235e+38) 等），golden 产出有限值而 NPU 产出 ±inf 或 nan，isclose 判 FAIL。根因不是算子缺陷：NPU kernel 内部以 float32 做乘加，真实乘积有限时不会中间溢出，只有最终结果超出输出 dtype 表示域时才按 IEEE754 饱和为 ±inf/nan。golden 在 Promote 模式下把输入提升到更宽 dtype（fp16→fp32、fp32→fp64）后计算且不回落到输出 dtype 值域，与 NPU 的输出溢出语义失配；默认 Enable 模式下 golden 直接用输入 dtype 计算 x*cos+x_rot*sin，fp16 中间结果 65504*cos 会假溢出为 inf 而 NPU 因 fp32 内部计算得 61888 这样的有限值，两种模式都无法复现 NPU 的真实行为。'
  source: https://gitcode.com/cann/ops-transformer/issues/5027 （closed）
  behavior: 跑精度回归时一批大幅值/极值用例稳定 FAIL，但把同样的输入交给 kernel 与 golden 分别检查会发现 NPU 的结果其实是对的（fp32 内部计算、输出 dtype 溢出才饱和），错的是参照实现；因此失败与 dtype、输入值域强相关，只要把值域压回常规范围就全过，容易误判成算子精度回退。
  trigger_surface: ttk（ops-test-kit）--compare close --golden-mode Promote/Enable 跑 rotary_position_embedding，input_data_ranges 含接近输出 dtype 上限的极值
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
