title: indexer_quant_cache MX-FP4 半字节错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: pytorch
    component: indexer_quant_cache
  behavior: MX-FP4 每字节打包 2 个逻辑元素，headDim 为奇数时相邻行起点交替落在字节高/低 4 位；kernel 把 cache 声明为 int8_t，只能整字节 CopyOut，无法表达半字节偏移。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: quantMode=3 且 cache.headDim=65 时 cache 输出精度仅 56.9%~62.5%（不同 stride 方案都到不了 100%），属系统性错位而非随机噪声；无报错，tiling 直接放行。
  visibility: 静默错误
mitigation:
  detect: 对 quantMode=3 构造奇数 headDim，逐元素比对 cache 量化结果与 golden；同时检查分页 view 的 row/block stride 奇偶
  fix: 在 host tiling（indexer_quant_cache_tiling_arch35.cpp）要求 quantMode=3 时 headDim 与分页 row/block stride 必为偶数，否则 GRAPH_FAILED（关联 MR，closed，未核实合入版本）
