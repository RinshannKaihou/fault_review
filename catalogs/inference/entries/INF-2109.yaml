original:
  mechanism: fabric ERISC 路由器把包的精确字节尺寸传给 eth_send_packet_bytes_unsafe()，但 Ethernet TX 队列只搬整 16 字节字：tt_eth_ss_regs.h 的 ETH_TXQ_TRANSFER_SIZE_BYTES 必须为 16 的倍数。包尺寸非 16 倍数时尾部部分字从不被发送，接收路由器转发该 buffer 槽位已存在的陈旧字节，目的端拿到损坏的尾部字节，无错误抛出。受影响发送点：tt_metal/fabric/impl/kernels/edm_fabric/fabric_erisc_router.cpp 的 send_next_data() 与 tt_metal/fabric/hw/inc/edm_fabric/fabric_erisc_router_speedy_path.hpp 的 speedy 路径。影响：任何非 16B 整数倍 fabric payload 尾部损坏；fast dispatch 把任意长度完成队列写转发到远端 chip，宿主读远端 chip 可得错误数据。复现：WH 4×N300（8 chips）、main @fb8a11a93da：./build/test/tt_metal/perf_microbenchmark/dispatch/test_prefetcher --gtest_filter='PrefetcherTests/PrefetcherHostTestFixture.*' 全部 4 测 Data mismatch，坏字恰为尺寸非 16 倍数记录的尾部；TT_VISIBLE_DEVICES=0（无 fabric hop）同测试通过。
  source: https://github.com/tenstorrent/tt-metal/issues/61919（open 0 评论，2026-10-21 每日扫描，正文全文已读）
  behavior: 多 chip Wormhole/Blackhole 系统上经 fabric 发送尺寸不是 16 字节整数倍的报文（如 fast dispatch 的完成队列记录）：远端收到的最后几个字节是陈旧数据，宿主从远端 chip 读回的数值悄悄错误且无任何报错；单 chip 或 payload 恰好 16B 对齐时正常。表现为多 chip 作业里偶发且稳定的读数错位，极难定位。
  trigger_surface: Wormhole 4×N300 实测、tt-metal main @fb8a11a93da、fabric hop + 非 16B 整数倍 payload（fast dispatch 完成队列写等）。
  discovery: 2026-10-21 每日扫描
