original:
  mechanism: 'DeepSeek-V4-Pro-W4A8-mtp 用 vllm serve 起服务（--data-parallel-size 2 --tensor-parallel-size 16 --enable-expert-parallel --speculative-config {''num_speculative_tokens'':1,''method'':''deepseek_mtp''}），请求 ''Repeat the following text exactly: hello world ...''，max_tokens=4096、temperature=0，只切换 stream。stream=false 时模型在约 703 token 处自然停止、finish_reason=stop；stream=true 时同一 prompt 不识别 EOS，一直生成到 4096 token、finish_reason=length。报告者怀疑流式 SSE 分块路径消费或屏蔽了 stop 信号，或 MTP 激活时 EOS 判定没有传播到流式输出；不同输入长度（含 1024 token 输入）均可复现，thinking 模式关闭。'
  source: 2026-07-01 github.com issue https://github.com/vllm-project/vllm-ascend/issues/9260 （open）
  behavior: 同一个问题、同样参数，非流式客户端拿到 703 token 的正常回答，流式客户端却一路吐到 4096 token 才凭 max_tokens 结束，末段全是重复续写；账单上的 completion token 数和首包后延迟都明显变大，而接口不返回任何错误。
  trigger_surface: vllm-ascend 流式接口（stream=true）+ DeepSeek-V4-Pro W4A8 + deepseek_mtp 投机解码
