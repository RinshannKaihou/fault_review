  meta: '`infra_off`（Quasar 同宽 reshard 的 `reshard_same_width_reader.cpp` 中**同一 core 的两个 DM RISC 都运行同一 reader 并写同一 `scratch + src_offset`**——`src_offset` 在每个远端 core 归零，两 RISC 互踩对方 scratch 写入；HEIGHT_SHARDED→HEIGHT_SHARDED、L1 输出、非对齐 RM 行（如宽 3 bf16）时 64 行按 32+32 分给两 RISC，都在 `src_offset=0` 起 → `[0,0,31,2]` 处失配。mainline 已由 #53028 以 `is_reader` CTA + 二号 RISC 偏移修复，**修复未带到 Quasar 拷贝**（#51217 的后续、非 #51271 item 3 的 dest stride）） · Cov: `NEW`（双 DM RISC 共享 scratch 竞争写子签名） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 工厂只建一份 scratch DFB（`num_entries = remote_units_per_shard`）且两个 worker 用同一 reader 源码，无 per-RISC 偏移切分；dest-stride 修复后该独立缺陷仍使 `test_quasar_reshard_same_width_row_major_local_stride` 失败。
  source: 'tt-metal #56226（2026-09-11 open，bug label，含源码证据、失败坐标与对齐 mainline #53028 的修复方案）。https://github.com/tenstorrent/tt-metal/issues/56226'
  behavior: 无 crash——非对齐宽度 reshard 输出静默错数据。1.122（Quasar softplus 修复未跨 arch 传播）之后"mainline 修复未带到 Quasar 拷贝"族又一例：本条在 reshard 数据搬运维度。
  trigger_surface: tt-metal Quasar + same-width reshard + 非对齐 RM 行宽（hw_specific）
  discovery: 2026-09-11 每日扫描。
