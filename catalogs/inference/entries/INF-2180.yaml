    component: SFPU round kernel（WH/BH）
  behavior: kernel 用 x*fl(10^-k)（不精确，如 0.01f=0.0099999998）代替精确除法 x/10^k，再 round-half-even；50.000004 在 d=-2 乘积恰舍到 0.5 得 0，正确为 100。
effect:
  objects:
  - 数值结果
  detail: FLOAT32 decimals<0 时邻 tie 输入整步（10^k）错值：50.000004/-2→0（应100）、1499.9999/-3→2000（应1000）、-1999850.1/-2→-1999800（应-1999900）；确定性必现。
  visibility: 静默错误
