relations: []
original:
  mechanism: 'Ascend/pytorch #4373（2026-08-26，closed，torch 2.13 + torch_npu，Atlas A2/910B2）：参与 torch.compile(options={"npu_backend":"triton_experimental"}) 归约的 tensor 元素总数超过 int32 上限 2147483648 时，索引全部保持 int32，线性地址回绕，输出结果错误或触发设备故障（MTE/EE1003 核心报错）。上游 select_index_dtype() 在 numel*reduction_numel > int32_max 时把 index_dtype 置为 tl.int64，但旧实现把该信号传导到整棵索引 codegen，导致大向量 arange tile 全量 upcast；而实际溢出只发生在个别乘加项（如 268435456*x1，系数乘轴长-1 超 2^31）。全量 upcast 属过度修复，UB（Unified Buffer）占用翻倍致编译挂死。修复 PR 43736 改为「贪心提升 + 局部 guard」：静态/字面系数跨界仅提升溢出 addend，大 tile 保持 int32；动态轴长以 trace-time hint 快照判定，保留的 int32 项安装符号 guard，运行期轴长超快照则 guard 失败重编译。复现：x=torch.randn(8388609,256,device="npu")（numel=2^31+257），sum(dim=1)。'
  source: 'Ascend/pytorch #4373（2026-08-26，closed；修复 PR https://gitcode.com/Ascend/pytorch/pull/43736） https://gitcode.com/Ascend/pytorch/issues/4373'
  behavior: 当被归约的张量元素数刚好越过 2^31（LLM 里的 logits 展平、大词表 softmax、长序列 sum 都可能到），编译能过、能跑，但归约结果与 eager 不同；有时直接掉进设备故障报 MTE/EE1003。想靠把索引全升 int64 规避时，编译又挂死不返回。
  trigger_surface: triton_experimental 归约 + numel > 2^31（示例 2^31+257）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
