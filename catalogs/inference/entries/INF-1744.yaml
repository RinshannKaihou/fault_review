id: INF-1744
legacy_ids: []
slug: te_reduction_int32_index_overflow_2_31
aliases: []
title: 归约元素数超 2^31 时 int32 索引回绕致错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: select_index_dtype 索引提升
  behavior: 索引 dtype 的提升只能按整棵 codegen 全升或全不升：不升时线性地址在 2^31 处回绕；全升 int64 又让大 arange tile 的 UB 占用翻倍，编译挂死。溢出实际只发生在个别乘加项上。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: numel=2^31+257 的 (8388609,256) 张量在 triton_experimental 下做 sum(dim=1)，编译能过、能跑，但归约结果与 eager 不同，或直接触发设备故障（MTE/EE1003 核心报错）；若把索引全量提升 int64 规避，则编译挂死不返回。
  visibility: 静默错误
mitigation:
  detect: 构造 numel 略超 2^31 的张量做归约，与 eager 比对；同时看编译耗时/UB 占用是否异常
  fix: 已修复：PR https://gitcode.com/Ascend/pytorch/pull/43736 改为贪心提升 + 局部 guard——只提升越界 addend（生成 268435456*x1.to(tl.int64)），大 tile 保持 int32，动态轴长用 trace 期快照加符号 guard
