  meta: '`infra_off`（某 `(max-num-batched-tokens, max-num-seqs)` shape 的**首次**启动比后续同参启动少 ~5% KV cache 容量——首启时 compile + CUDA-graph capture 的分配先于容量探测且部分驻留，探测所得可用内存偏低：两组 shape 实测 82,688 vs 88,096 与 82,256 vs 86,528 token；差异随 compile cache 持久化固化——**部署容量取决于启动历史**） · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: 容量探测在自有临时分配未完全回收的时刻采样；严格 drain（两 boot 前均等到 255 MiB 空闲）排除残留显存因素后差异仍在——是首启路径自身的 probe-while-warmup 时序问题。首启亦慢 30–35s（capture 不命中 `~/.cache/vllm/torch_compile_cache`），第二次起从缓存加载。AWQ Qwen3-32B TP2、v0.28.0 V1 引擎实测。
  source: 'vLLM #54383（2026-08-29 open，含双 shape 双 boot 对照表与 drain 脚本）。https://github.com/vllm-project/vllm/issues/54383'
  behavior: 无 crash、无错误——同配置部署的**容量不可复现**（±5%）：压测/容量规划出现无法归因的漂移，首启实例并发能力系统性偏低；与任何故障无关却与一切容量假设有关。属「**容量探测依赖启动历史**」新子签名：与 6.136（hidden-states KV budget 高估启动拒绝）同启动期容量核算域，本条不拒绝启动而是**静默少给**且带历史依赖。
  trigger_surface: vLLM V1 + 新 shape 首启（每机器每 shape 一次；compile cache 失效后重现）
  discovery: 2026-08-30 每日扫描。
