  trigger_note: vLLM 0.13.0 + vllm-ascend 0.13.0rc2.dev154+gff4c1a47b,torch_npu 2.8.0,eagle3 drafter;为便于复现作者改了 vllm_ascend/ascend_forward_context.py 中 sp_enabled 的判定（删掉 and num_tokens > 1000）
  stage: N/A
