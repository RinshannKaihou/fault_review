original:
  mechanism: issue 定位在 eagle3 投机解码叠加序列并行（SP）的场景:作者为了稳定复现,直接改 vllm_ascend/ascend_forward_context.py,删掉判定 sp_enabled 时附带的 and num_tokens > 1000 条件,使 SP 恒开,然后跑同一段脚本统计接受率。SP 开时 num_drafts 597、num_draft_tokens 1791、num_accepted_tokens 402、mean acceptance length 1.67,token0 接受率 0.59、token1 只有 0.08、token2 及以后 0.00;把 VLLM_ASCEND_ENABLE_FLASHCOMM1 注释掉（SP 关闭）后,num_drafts 437、num_draft_tokens 1311、num_accepted_tokens 564、mean acceptance length 2.29,token0 0.62、token1 0.40、token2 0.27。目标模型权重与脚本完全不变,只有 SP 开关不同,因此作者判断是 drafter 模型在 SP 路径上的精度问题（草稿分布被切分/还原不正确）,而不是采样或权重问题。
  source: 2026-01-12 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/5825 （closed）
  behavior: 开了 SP/FLASHCOMM1 之后,eagle3 投机解码看着还在工作,但几乎接受不了第二个及以后的草稿 token,推理吞吐比不开 SP 时还差;输出内容本身读起来正常,只有 SpecDecoding metrics 里的 per-position acceptance 暴露了异常,很容易被当成“草稿模型本来就这样”。
  trigger_surface: eagle3 投机解码 + 序列并行（VLLM_ASCEND_ENABLE_FLASHCOMM1=1,sp_enabled 为真）+ 长序列(num_tokens 超过判定阈值)
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
