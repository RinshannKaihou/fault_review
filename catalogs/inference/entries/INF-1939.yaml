title: eagle3 开 SP 后草稿 token1 接受率掉到 0.08
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: eagle3 草稿前向（SP）
  behavior: 启用 SP/FLASHCOMM1 后，eagle3 草稿模型在 SP 路径上的分布/精度异常，第二个及以后草稿 token 几乎不被接受；同权重同脚本关闭 SP 即恢复
effect:
  objects:
  - 输出分布
  - 性能/资源
  detail: SP 开:mean acceptance length 1.67、token0 0.59、token1 0.08、token2 起 0.00;SP 关:2.29、0.62、0.40、0.27;输出仍可读,表现为投机解码几乎不加速
  visibility: 质量退化
mitigation:
  detect: 对比开/关 VLLM_ASCEND_ENABLE_FLASHCOMM1 两次的 SpecDecoding metrics,重点看 per-position acceptance（token0/1）与 mean acceptance length;也可修 ascend_forward_context.py 里 sp_enabled 的判定条件做定点复现
  fix: 待定（issue closed 未给修复 PR）；规避：关闭 FLASHCOMM1/SP,或让 sp_enabled 判定与 drafter 实际切分保持一致
