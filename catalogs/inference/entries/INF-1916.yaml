id: INF-1916
legacy_ids: []
slug: vllm_ascend_qwen3_reasoning_parser_thinking_budget_noop
aliases: []
title: qwen3 parser 不计数致 thinking 预算静默失效
kind: 故障
status: active
cause:
  objects:
  - subsystem: 输出解析
    stack: vllm
    component: qwen3 reasoning parser
  behavior: Ascend 后端配置 --reasoning-parser qwen3 且请求带 thinking_token_budget 时，不累加 reasoning token，预算耗尽截断/注入 </think> 路径未激活
effect:
  objects:
  - 输出内容
  - 性能/资源
  detail: budget 设 10/50/200 与不设时 reasoning 长度内容完全一致（700+ token），completion_tokens_details 为 null 或 reasoning_tokens=0；无报错，成本按 max_tokens 放大
  visibility: 静默错误
mitigation:
  detect: 用 /v1/chat/completions 发 thinking_token_budget=50，量 reasoning 字段 token 数与 completion_tokens_details.reasoning_tokens；再用 /v1/completions 直连确认模型原始输出里确实有 <think> 标记
  fix: issue open，无修复 PR；需让 Ascend 侧 parser 真正接管预算计数与截断（或在 parser 未生效时显式报错/告警）
