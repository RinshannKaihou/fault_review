original:
  mechanism: '在 Ascend 后端上 --reasoning-parser qwen3 只是被加载，实际的 thinking token 计数与"预算耗尽时强制截断/注入 </think>"这条路径从未被激活：parser 不累加 reasoning token 数，因此 budget 判断永不成立，模型的 <think>…</think> 段落完整吐完才结束。报告用 /v1/completions 绕过 chat template 直连，确认模型原始输出里确实有 <think> / </think> 标记，所以不是模型不按格式生成；budget 设 10、50、200 和不设，reasoning 长度与内容完全一致，completion_tokens_details 在 v0.23 为 null、在 v0.21 为 reasoning_tokens: 0。移除 --speculative-config 后仍复现，v0.21.0 与 v0.23.0rc1 都能复现，模型架构被解析成 Qwen3_5ForConditionalGeneration。'
  source: 2026-07-29 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13060 （open）
  behavior: 用户设置 thinking_token_budget=50 想让模型少想一点，实际拿到 700 多 token 的完整推理过程，reasoning 字段一个字都没截；reasoning_tokens 统计要么是 null 要么是 0，监控上完全看不出预算没生效。没有报错、没有告警，只有账单和延迟按 max_tokens 上限付。对按 token 计费或对首字延迟敏感的服务是直接成本损失。
  trigger_surface: Ascend 后端 + --reasoning-parser qwen3 + 请求里的 thinking_token_budget（配合 enable_thinking=true）
  discovery: 2026-10-21 历史索引回填（NPU pool2_v2c，issue created < 2026-10-07）
