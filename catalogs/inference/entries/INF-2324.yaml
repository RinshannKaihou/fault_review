title: 950PR index_put_/scatter_ 越界写静默腐蚀邻接内存
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: torch_npu
    component: index_put_/scatter_ 越界防护
  behavior: 950PR 上 index_put_/scatter_ 的越界索引写不抛任何异常（call/sync/read 三相静默，8/8 档零 raise），写指针按线性偏移裸走出界，物理腐蚀目标张量之外的相邻内存。
effect:
  objects:
  - 数值结果
  - 跨请求/跨样本数据
  detail: 越界写值与用户写入值逐位相同地落到紧邻张量（哨兵 S3[871]/[65407] 精确预言）；d=+8 等小越界恰好落入分配隙时完全无痕；靶内 63 个未触碰行被回卷覆盖。CPU 同码 7/7 立即抛错，复机重跑逐位复现。
  visibility: 静默错误
mitigation:
  detect: 目标张量前后各布 1MB 哨兵缓冲区逐位比对（issue 方法）；调用侧自行校验 index 范围（index < size 与 >=0）后再调用。
  fix: 待定（issue open；A3/910B3 为 5/7 档 sync 期延迟抛、310P3 7/7 延迟抛，仅 950PR 全静默）
