  meta: '`infra_off` · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 两种形态：(1) repeat_kv 在 RoPE **之前**还是**之后**执行——一个 order-of-operations 造成的数值发散问题；(2) query-head → KV-group 映射写错（该用 repeat 却用了 repeat_interleave，或反之），导致注意力头对着错误的 KV group 计算注意力。本条为 MERGED 条目，逐一列出被合并的子故障：repeat before/after RoPE（顺序错误）、wrong head-group mapping（头组映射错误）。
  source: 'Megatron-DeepSpeed #294；transformers #25420（GQA KV-cache deviation）；NATTEN #92。'
  behavior: 顺序变体只造成极小的 logit 漂移；错组变体造成静默的质量下降，且退化局限在受影响的那些 head 上。
  trigger_surface: 注意力/KV 实现路径
  signature: off-manifold。错组变体有很强的 per-head attention 签名：某个 head 的注意力模式不再匹配它学到的 KV group，用 per-head attention-pattern 异常检测（cheap / geometric 族在 head 粒度上）可以捕获；但如果只看整层聚合的隐状态范数，信号会被其他 head 稀释掉。顺序变体签名很弱，且必须与 FlashAttention 自身的实现发散做去混淆（属于第 4 类噪声底问题），statistical 族在此几乎无法分辨。注：目录中另有一条独立命名的近邻故障 `gqa_head_group_repeat_vs_interleave_mismap`。
  repro: 可软件复现性为 partial——单钩子可重排 query-head 到 KV-group 的映射（复现错组变体）；而 repeat_kv 与 RoPE 的先后顺序需要改动 attention 前向实现本身，单钩子不足以覆盖。
