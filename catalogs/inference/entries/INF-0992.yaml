original:
  category: cat10
  section: 第 10 类 · 分词器 / 对话模板故障
  meta: '`infra_off`（vLLM 通用多模态 `PromptReplacement` 管线在 chat 渲染 + 分词后的**平坦 token 序列上按 token 值匹配**占位符，**不保留匹配 token 的来源**（模板生成 vs 用户正文）。Qwen2.5-VL 的 `<|image_pad|>` 是**用户可拼写的特殊 token**（id 151655）：用户文本中的字面出现与模板生成的媒体占位符分词到同一 id——用户正文出现更早时**消费排队的图像更新**，图像特征 span（448×448 图 = 256 tokens）被插进用户正文、真 `<|vision_start|><|image_pad|><|vision_end|>` 槽只剩 1 个 raw 未展开 pad token。**两条布局总长（292 tokens）与 token 多重集完全相同**——长度/词法层面审计全盲，只有 processor trace 可见绑定迁移。端到端（Qwen2.5-VL-3B/7B）：视觉安全裁决 YES/UNSAFE→NO/SAFE、下游决策 BLOCK→ALLOW；describe 探针仍识别图中武器（可感知但结构性 grounding 错位）。候选受影响面：Qwen2-VL/Qwen3-VL/Keye/Mimo-V2-Omni/LLaVA-OneVision2/Bagel 及 LLaVA/InternVL/Idefics3/DeepSeek-VL2/LFM2-VL 等 `<image>`-占位符 adapter 族（chat_utils 无等价占位符预留）） · Cov: `NEW`（绑定键退化到 token 值、缺 provenance 的媒体绑定劫持子签名） · 触发 `yes` · 置信度 `verified`'
  mechanism: 绑定算法的匹配键是 token 值而非占位符实例身份——用户可拼写的特殊 token 使"第一个值匹配消费媒体更新"的顺序假设被打破；`chat_utils` 组装 chat parts 时不为模板媒体占位符做预留/标记，`PromptReplacement` 事后无法区分来源。
  source: 'vLLM #57740（2026-09-20 open，含 token 级 attack/control 对照布局（pad runs 位置迁移）、Qwen2.5-VL-3B/7B 端到端安全裁决翻转实测、v0.29.0 tag 不可变源码引用与受影响 adapter 清单）。https://github.com/vllm-project/vllm/issues/57740'
  behavior: 无 crash、无 NaN——图像被"搬进"用户正文位置、真槽位空转：模型可感知内容但结构 grounding 错位，视觉安全裁决可被**单条用户文本**翻转（UNSAFE→SAFE/BLOCK→ALLOW），是输入侧可控的安全面失效；多模态 RAG/agent 的图文对齐静默破坏。13.33（convert_to_rgb alpha 当前景）之后多模态输入管线族新成员：本条在**绑定键退化**维度——首个用户可控的 grounding 错位签名，且总长与 token 多重集不变使常规输入审计原理上不可见。
  trigger_surface: vLLM 多模态服务（Qwen2-VL/Qwen2.5-VL/Qwen3-VL/LLaVA/InternVL 等 token 值匹配型 adapter）+ 用户正文含字面占位符 token（输入触发：普通 API 消息文本即可）
  discovery: 2026-09-20 每日扫描。
