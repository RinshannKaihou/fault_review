  mechanism: KV 复用要求 paged-context FMHA，而后者不支持 INT8 KV（有断言守卫）；强行启用可以跑起来，但在约 3000 个请求之后中止（`GPTAttentionPlugin::enqueue` 中 SIGABRT），因为 paged-context 的 INT8 路径在复用期间错误处理了量化块布局与 scale。
  source: 'TensorRT-LLM #2166（以 not-planned 关闭；相关 #2112）。'
  behavior: 源文档未单列该字段；机制中记载的可观测后果是运行约 3000 个请求后 SIGABRT 中止。
  trigger_surface: TensorRT-LLM 专用；vLLM 无直接等价除非同概念
  signature: 族记为 `ambiguous`，需要把两个成分拆开看：源文档判定「崩溃前，复用块的 INT8 反量化给出粗糙的离流形 KV（阶梯状量化误差、有效秩更低）」，但按本项目的轴，**纯 INT8 伪量化**的误差属于模型能吸收的 model_on 型；真正 infra_off 的成分是复用期间的量化块布局 / scale 错配，而其终态是崩溃（无隐藏态可测）。可捕获的是 spectral 族（有效秩下降、谱平坦化对阶梯量化误差最敏感；注意 feasibility 评估将 spectral 判为语义信号、对轻度 infra 故障原理不敏感，该主张需在目标栈验证）；geometric 族响应微弱，trajectory 族通常漏检。源文档同时指出：只有 INT8 伪量化部分是单机可复现的。
  repro: 尚未实现；建议方案是单钩子对某层缓存 K/V 做 INT8 伪量化（round-to-scale），并对被「复用」的前缀段使用与后缀段不同的 scale，从而把 scale 错配这一 infra_off 成分与纯量化这一 model_on 成分分离开来测。属 partial：崩溃路径不可复现。
  locus: block-slot-alloc
  priority: low
