slug: ms_ascend_addmm_kbk_scalar_rounding
aliases: []
title: KBK Addmm 按输入 dtype 重建 alpha/beta 致偏差
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: Ascend Addmm ACLNN 适配
  behavior: KBK 路径按输入 Tensor 的 dtype 重建 alpha/beta，bf16 输入让非精确 Scalar 在进入 ACLNN 前先被舍入，PyBoost 保留原始 Scalar。
effect:
  objects:
  - 数值结果
  detail: bf16 输入 beta=-4.775 时 PyBoost 得 62.25、KBK 得 62.0；beta=0 时 81.5 对 81.0，同一算子在两条执行路径上结果不同。
  visibility: 静默错误
mitigation:
  detect: 同一 addmm 调用分别走 PyBoost 与 jit(backend=ms_backend, jit_level=O0)，用非精确 alpha/beta（如 -4.775000095367432）比较输出；两者不等即命中
  fix: 待定（issue open，无修复 PR）；方向：KBK 与 PyBoost 统一 alpha/beta 的 dtype 处理，不要按输入 Tensor dtype 重建 Scalar
