original:
  mechanism: 'Ascend/pytorch #2198（2026-06-01，open，torch-npu v2.7.1-26.0.0 / Ascend 910B）：aten::div.Tensor_mode 在 NPU eager 上的整数除实现内部把 int64 操作数 cast 成 f32 做除法，再 cast 回 int64。f32 尾数只有 24 位，取 2^32~2^40 的整数时输入本身已被舍入，商随之偏移。报告的最小复现：a=torch.randint(2**32, 2**40, [100,100])、b=torch.randint(-10,-1,[100,100])，两路 .to("npu:0") 后 torch.div(a_npu,b_npu,rounding_mode="trunc")，约 18% 元素与 CPU torch.div 不等，(result.cpu()==cpu_ref).all() 为 False；rounding_mode="floor" 同样受影响，且 test/inductor/test_torchinductor.py::NPUTests::test_div7_npu 亦因此失败。缺陷在算子内部的中间 dtype，调用方无法从参数上察觉。'
  source: 'Ascend/pytorch #2198（2026-06-01，open；由 huyuchao/pytorch#9 转投） https://gitcode.com/Ascend/pytorch/issues/2198'
  behavior: 对 int64 张量做 torch.div(..., rounding_mode="trunc"/"floor")，返回 dtype 仍是 int64、形状正确、无报错，但大数值区间的商随机地差几个整数；与 CPU 结果逐元素比较有约六分之一不同。用它算下标、步数、分块边界时后续 gather/scatter 取到错误位置，且在小值上测试往往看不出问题。
  trigger_surface: int64 张量 + rounding_mode=trunc/floor 的 torch.div，操作数超过 2^24（示例 2^32~2^40）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
