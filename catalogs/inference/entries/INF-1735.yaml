id: INF-1735
legacy_ids: []
slug: npu_int64_div_rounding_mode_via_fp32
aliases: []
title: int64 带 rounding_mode 的 div 内部走 fp32 致错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: aten::div.Tensor_mode NPU
  behavior: aten::div.Tensor_mode 的 NPU 内核把 int64 操作数 cast 成 fp32 再做除法，再用 fp32 结果转回 int64；fp32 只有 24 位尾数，2^24 以上的整数不可精确表示。
effect:
  objects:
  - 数值结果
  detail: a∈[2^32,2^40]、b∈[-10,-1] 的 100×100 int64，trunc/floor 下约 18% 元素与 CPU 不一致，(result==cpu_ref).all() 为 False；inductor 用例 test_div7_npu 亦失败。
  visibility: 静默错误
mitigation:
  detect: int64 大值（>2^24，取到 2^32 以上）做 trunc/floor div 后与 CPU 逐元素比较
  fix: 待定（issue open）；规避：改用 fp64 或整数安全路径自行实现带 rounding_mode 的整除
