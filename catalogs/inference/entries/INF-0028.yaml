original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（naive exp 分解溢出 → 静默 inf） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`ttnn.logaddexp` / `ttnn.logaddexp2` 的 naive 分解 `log(exp(a)+exp(b))` 在 |a| 或 |b| > ~88.7（FP32 下 `exp` 的溢出阈值）时，中间 `exp` 结果溢出 → 最终静默返回 `inf`。修复改用数值稳定恒等式 `max(a,b) + log(1+exp(-|a-b|))`（因 `exp(-|a-b|)` 参数 ≤ 0，结果 ∈ (0,1]，永不溢出）。legacy FPU 路径保留了旧的 broken 分解，仅 SFPU 与 binary_ng 路径被修复。'
  source: 'tt-metal PR #52107（2026-08-04 open，fixes #52037）。https://github.com/tenstorrent/tt-metal/pull/52107 。补充来源：PR #53720（2026-08-19 closed，第二版数值稳定 fused SFPU 实现 `max(a,b)+log1p(exp(−|a−b|))`，同修 #52037，LOGADDEXP/LOGADDEXP2 移入 SFPU-true 组）。https://github.com/tenstorrent/tt-metal/pull/53720'
  behavior: 无 crash。大输入 logaddexp/logaddexp2 静默返回 inf 而非正确有限值——naive 数学分解的中间值溢出。属「SFPU 数学函数 naive 分解中间值溢出 → 静默 inf」新子签名。
  trigger_surface: Tenstorrent TT-Metal，非 NVIDIA 环境
  discovery: 2026-08-04 每日扫描。
