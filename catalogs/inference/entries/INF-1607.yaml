id: INF-1607
legacy_ids: []
slug: torchair_bmm_epilogue_fusion_batch_broadcast_guard
aliases: []
title: BatchMatMul epilogue 融合未拦 batch 轴广播
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: matmul epilogue 融合守卫
  behavior: epilogue 融合守卫只用 rank 与前置 batch 维比较判断，epilogue 输入 rank 大于 MatMul 输出 rank 的广播情形被放行，融合 kernel 读到错误数据。
effect:
  objects:
  - 数值结果
  detail: bmm+where 且 where 的额外输入沿 batch 轴广播（[1,1,1,1024] 对 [40,1024,1024]）时，融合出的 CV kernel 取值错位，max_rel≈1.2e4；关闭融合即与 CPU 参考一致，运行期无报错。
  visibility: 静默错误
mitigation:
  detect: 对 bmm+epilogue（where/expand）同时跑开/关 MatMul 融合，比较 max_rel；检查 epilogue 额外输入 rank 是否大于 matmul 输出 rank
  fix: 待定（issue 只给根因与复现，修复应补 rank 更大/广播维度的拦截条件，未附 PR）
