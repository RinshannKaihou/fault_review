original:
  mechanism: 'ops-transformer issue #2000（2026-04-21 closed）：MhcPreBackward 的 kernel 代码存在两处会带来精度问题的写法：(1) D_、N_、fusionSize_、nD_ 等变量声明为 uint64_t，但部分 AscendC API 的参数只支持 uint32_t，传参时被截断，偏移量因此算错；(2) MicroAPI::Duplicate<P>(alphaPreReg, alphaPre, maskPre) 等三处使用的 maskPre/maskPost/maskComb 未初始化就被当作掩码。复现方式：shape (1,1,4,64) 与 (1,1,4,16384) 同时跑，循环 10 次——(1,1,4,64) 表现为一次 pass 一次 fail，(1,1,4,16384) 表现为一直 fail。issue 正文给出 xCopyParams.blockCount/blockLen/srcStride/dstStride 的赋值片段作为证据，环境为任意环境。'
  source: https://gitcode.com/cann/ops-transformer/issues/2000 （closed）
  behavior: 同一份输入连跑两次结果会变：小 shape (1,1,4,64) 一次过、一次不过，大 shape (1,1,4,16384) 则稳定不过；没有报错也没有 NaN，只是与参考值差一点，典型的需要多跑几轮才发现的偶现精度问题。
  trigger_surface: MhcPreBackward，hidden 较大（16384）或两个不同 shape 交替执行时
