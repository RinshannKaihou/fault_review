  meta: '`infra_off`（TRT-LLM 共享 FlashInfer workspace（`torch.empty` 未清零）+ split-KV 注意力的 merge pass 可覆盖本 pass 注意力 kernel 未写的 tile——读回**早前不同形状 plan 的 partials**，其 log-sum-exp 可为 −inf，merge 出非有限注意力行；CUDA graph 下 batch 组合变化时已观测非有限输出） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 两条污染路径：(1) `torch.empty` 分配的 buffer 首次使用即 merge 到任意残留内存；(2) 计划间 tile 覆盖面变化使 merge 读取当前 kernel 未写的 extent——320 MB workspace 中早期 plan 的 `tmp_v/tmp_s` 残留。修复：分配时清零 + 每次 `wrapper.run()` 前只 reset 当前 plan 可寻址的窄范围（offset/size 取自 FlashInfer plan info）。
  source: 'TensorRT-LLM PR #18755（2026-09-05，nvbugs 驱动；paged prefill/paged decode/ragged-prefill 三路径同修）。https://github.com/NVIDIA/TensorRT-LLM/pull/18755'
  behavior: '**非有限注意力输出**（−inf LSE merge → NaN/inf 行）在 CUDA graph 复用计划变化时间歇显形——依赖历史计划序列的"记忆效应"损坏。与 6.190（graph 烤入旧地址）同为"复用工作区携带历史状态"族，本条在第三方 kernel 的 scratch workspace 层且显形为数值损坏而非内存错配。「**计划依赖的 workspace 残留**」新子签名：损坏内容由此前请求的形状历史决定。'
  trigger_surface: TRT-LLM + FlashInfer split-KV attention + CUDA graph + batch 组合变化（栈×计划序列触发）
