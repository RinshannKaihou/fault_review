original:
  mechanism: aclnnGroupNorm / aclnnGroupNormSilu 在 fp32 输入满足「组内均值远大于标准差」（完全合法入参，数据量级仍在 fp32 正常范围）时，rstdOut 返回 NaN 或 1/sqrt(eps)（方差被算成 0），out 随之大块 NaN；两段式接口均返回 0，静默脏数据。GroupNormSilu 实测（910B2，CANN 9.2.0）：x=fp32[1,128] 50±0.001 / 1000±0.01（组内方差 3.5e-7/3.5e-5），期望 rstd≈310.77/148.35，实际 rstdOut=NaN、out 128/128 全 NaN、meanOut 正常。GroupNorm 实测（910B2）：x=1000±0.01 fp32，fp64 逐组参考 rstd=55.52/56.08，实测 nan/316.23（=1/sqrt(1e-5)），out 256 元素中 128 个 NaN。两算子良态对照（均值≈0）同形状正常（与 fp64 参考相对误差 ~6e-8），证明是大均值下方差计算（疑似 E[x²]−mean² 形态）灾难性抵消导致方差为负/0，而非非法入参。资料约束（rank 2-8、group 整除 C、eps>0、fp32）均满足。两个 issue 均带完整 C++ 复现脚本。来源 https://gitcode.com/cann/ops-nn/issues/7334、https://gitcode.com/cann/ops-nn/issues/7347（均 open）。
  source: 2026-10-26 每日扫描（NPU 批次 batch-20261026T230043147986-d99c34of）。https://gitcode.com/cann/ops-nn/issues/7334 https://gitcode.com/cann/ops-nn/issues/7347
  behavior: 对 fp32 张量做 GroupNorm 或 GroupNormSilu，当数据整体偏移很大而波动很小（例如全部在 1000 附近、波动 ±0.01，即均值远大于标准差）时，输出的倒数标准差 rstdOut 变成 NaN（或 1/sqrt(eps)），归一化输出整块 NaN；而同样的形状、同样 dtype、均值接近 0 的数据完全正常。接口返回成功无任何错误码，meanOut 也正常，只有看输出才会发现。任何含大 DC 偏移激活的归一化层（如某些传感器特征、残差累积后的激活）会静默产出 NaN 激活并在网络中扩散。
  trigger_surface: aclnnGroupNorm / aclnnGroupNormSilu（fp32）；组内均值远大于标准差（如 x≈1000±0.01、50±0.001）；Ascend 910B2、CANN 9.2.0 实测；fp16/bf16 未实测
  discovery: 2026-10-26 每日扫描
