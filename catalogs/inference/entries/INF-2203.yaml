remarks: '同仓同日 #7334（GroupNormSilu）与 #7347（GroupNorm）为同一数值机制在两个算子上的实例，本条合并收录；#7348（nullptr gamma/beta 静默按 1/0 代入）与 #7363/#7321（空 Tensor 出参 inf/0/NaN 契约）为同算子族不同机制，留观'
