    component: GroupNorm 族方差归约
  behavior: fp32 组内方差远小于均值平方时方差计算灾难性抵消为负或 0，rstdOut 输出 NaN 或 1/sqrt(eps)，两段返回 0
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: x=1000±0.01（var≈3.5e-5）时 rstdOut=NaN/1/sqrt(eps)、out 128/128 或 256 中 128 个 NaN；良态输入（均值≈0）同形状正常（相对误差 ~6e-8）；meanOut 始终正常
  visibility: 数值异常
mitigation:
  detect: 大均值小方差输入（如 1000±0.01）与 fp64 逐组参考对照；检查 rstdOut 是否 NaN
  fix: 待定
