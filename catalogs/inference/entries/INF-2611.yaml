id: INF-2611
legacy_ids: []
slug: triton_ascend_libdevice_subnormal_ftz
aliases: []
title: triton-ascend libdevice 次正规数归零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton-ascend
    component: libdevice lowering FTZ
  behavior: libdevice 与 tl.* 的 exp/sin/sqrt/atan/sinh/tanh/erf 在 lowering 时做 flush-to-zero：exp 的结果落进次正规区间返回 0，其余先把次正规输入冲成 0 再计算。
effect:
  objects:
  - 数值结果
  detail: exp(-88.0) 返回 0（应 6.0546e-39）、exp(-89.0) 返回 0（应 2.2274e-39）；最小次正规 ±1.4e-45 输入时 sin/atan/sinh/tanh/erf 返回 ±0，sqrt 返回 [0, nan]；正常范围输入正确。
  visibility: 静默错误
mitigation:
  detect: 用 torch.nextafter(0,1) 构造最小次正规输入、用 -88/-89 构造次正规结果，分别跑 libdevice.sin/sqrt/exp 等与 torch CPU 对拍；正常量级用例全部通过不能证明无此问题。
  fix: 待定（两条 issue 均 open；#3322 指出 cosh/sinh 早期溢出报告的上游根因就是 exp 次正规结果被冲零）
