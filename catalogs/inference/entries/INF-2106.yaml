id: INF-2106
legacy_ids: []
slug: scaled_masked_softmax_fp16_scale_overflow
aliases: []
title: ScaledMaskedSoftmax fp16 乘 scale 溢出行 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SMS v2 fp16 腿
  behavior: bf16 先 Cast fp32 再乘 scale，fp16 直接半精域 Muls：x 在 fp16 范围但 x*scale 超上限时中间量溢出 inf，SoftMax 得 inf-inf=NaN。
effect:
  objects:
  - 数值结果
  detail: x=[60000,0]、scale=2.0、mask 全 0 时，fp32/bf16 得 [1,0]，fp16 得 [nan,nan]，三 dtype 腿不一致，接口返回成功无告警；触发条件为 x 在 fp16 范围内但 |x*scale|>65504（预处理放大或显式大 scale）。
  visibility: 数值异常
mitigation:
  detect: 半精 attention 中 logits 接近 fp16 上限（预处理放大或 scale>1）时出现整行 NaN 即可对照 bf16/fp32 腿定位。
  fix: 待定（应统一先升 fp32 再乘；issue open 未见修复 MR）
