title: INTrainingReduceV2 AR 折叠丢低位极值抵消输出 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: AR 归约结构与折叠
  behavior: ARA以默认AR结构定位oom元数据，400000元素需112B与默认184B不符；FLOAT求和中间溢出先于抵消，全载AR折叠丢低位分量；DYN Tiling未校验输出ND格式，非法格式误落rank、零R缺诊断。
effect:
  objects:
  - 数值结果
  detail: 极值对消输入 sum=0 被算成 NaN；137 条动态 oom 失败 + 6 条极值 sum 精度失败（三方冻结输入复现）；修复（400000 单独注册 ARA 结构 + 全 R 共享二进制缩放保留 AR 高/低分量）后 19/19 原失败用例通过、485/486 L1 首跑通过。
  visibility: 数值异常
mitigation:
  detect: 极值对消输入（±FLT_MAX 序列）检查 sum 是否 NaN；动态 shape 高压回归。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/pull/13239 （open：ARA 结构单独注册+二进制缩放+格式诊断；CANN 9.3.0 实测 19/19 通过，未发布未核实）
