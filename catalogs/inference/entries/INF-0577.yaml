  behavior: EngineDeadError——服务数天后死亡（在途请求全失败）；uptime 依赖使其在 CI/短测不可见，是"长期运行才显形"的 offload 状态机裂缝。
  trigger_surface: vLLM + OffloadingConnector + 多天 uptime + 大规模 DP/TP 拓扑（生产负载触发）
