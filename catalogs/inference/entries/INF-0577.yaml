  meta: '`infra_off`（KV offload `prepare_load` 在**数天 uptime 后**于 CPU 侧 cache 查不到 block key——`assert block is not None` 失败 → EngineDeadError，整个 DP rank 的服务死亡；24×H100 TP8+DP3、DSV4-Pro 1M 上下文、fp8 KV + dspark k=7 + OffloadingConnector 512 GiB CPU 生产的长期运行故障，非启动期） · Cov: `var:vllm_kv_offload_finished_request_unwritten_final_slot_cross_request_poisoning`（6.157 offload 契约漂移族） · 触发 `partial` · 置信度 `documented`'
  mechanism: '`vllm/v1/kv_offload/cpu/manager.py:138` 的 `prepare_load` 以 block key（二进制 hash）查 CPU cache 断言存在——多天运行中某 key 的条目被逐出/未写入/生命周期错配（issue 未给出根因定位，long-lived 进程的状态漂移面）。与 6.157（完成请求末槽未写→跨请求投毒）同 offload 供需契约族，本条显形为**迟到 crash**（fail-loud 但数天潜伏）。'
