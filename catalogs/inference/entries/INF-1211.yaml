original:
  category: cat14
  section: 第 14 类 · 长上下文能力失效（model_on — 健康模型的盲点）
  meta: '`model_on` · Cov: `var:14.8` · 触发 `n/a` · 置信度 `verified`'
  mechanism: 当 query 与 gold needle 之间没有任何词面／token 重叠时，QK 相似度矩阵退化为低秩（大量 key 在模型看来同等可信），softmax 无法在 gold 位置上锐化，随着上下文变长，gold token 分到的 attention share 持续塌缩。关键在于这不是实现 bug：同一模型在同样长度下的字面 NIAH（literal needle-in-a-haystack）仍然通过，塌缩只在去掉字面匹配线索后出现。该故障是模型能力上限本身，权重、kernel、mask 全部健康。
  source: Modarressi et al., "NoLiMa", ICML 2025, https://arxiv.org/abs/2502.05167 。
  behavior: 在标准 NIAH 上表现完美的模型，在语义等价但非字面的检索任务上于中等长度（2K–32K）区间灾难性失败。
  trigger_surface: 长上下文字面匹配崩塌：任务/评测条件
  signature: ON-manifold。签名不在激活值上，而在 QK 相似度的 SPECTRAL 结构上：去掉字面重叠后相似度矩阵秩下降／特征值集中，gold token 的 attention share 随长度衰减更快。能被 spectral 族（attention 谱／effective rank 探针 + 长度扫描）捕获；geometric 族的激活范数离群检测完全看不到它，statistical 与 cheap 族同样漏检。这是本项目论点的核心盲点：一个隐藏态完全健康、却给出错误答案的 model_on 样本。
  repro: 仅提示集构造，不做任何模型改动——按 NoLiMa 方式构造「query 与 needle 无词面重叠」的长上下文样本对，并与字面 NIAH 对照组做长度扫描；属 promptset-only 类（与 `long_context` 同路径），不挂任何钩子。
