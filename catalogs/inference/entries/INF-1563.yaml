id: INF-1563
legacy_ids: []
slug: ops_math_slice_write_aicpu_negative_begin_oob
aliases: []
title: SliceWrite AICPU 未拒负 begin 生成越界写地址
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: slice_write_aicpu.cpp
  behavior: 第 93-100 行只校验 value 尺寸加偏移不超过 x 尺寸，未拒绝负的行/列偏移；begin=[-1]、value 长 1、x 长 4 时 1+(-1)<=4 成立，第 43-45 行随即以 x_data-1 作写入地址并拷贝
effect:
  objects:
  - 数值结果
  detail: 一维负列偏移与二维负行/列偏移均可写到 x 缓冲区之前；按源码同款条件做的最小复现经 ASan 报 stack-buffer-overflow（WRITE of size 4），调用链上游未拒负偏移时 x 之前的相邻内存被写坏或进程异常
  visibility: 静默错误
mitigation:
  detect: 对 begin 取负值（含二维行偏移）的用例检查返回码应为参数错误；用 ASan 构建或 mssanitizer memcheck 观察写入地址是否落在 x 之前
  fix: issue 建议（open，未见 PR）：先确认 value_dim<=x_dim，再用 offset<=x_dim-value_dim 判断以避开加法溢出；UT 覆盖一维负列偏移、二维负行/列偏移返回参数错误，以及零偏移与 offset==x_dim-value_dim 的正向边界
