original:
  mechanism: 'cann/ops-math（commit 77f7e4c2286fb5a6c5f473f6df25b07236fe49d7）conversion/slice_write/op_kernel_aicpu/slice_write_aicpu.cpp:93-100 只检查 value 尺寸加偏移不超过 x 尺寸，没有拒绝负的列偏移或行偏移：以 x 长 4、value 长 1、begin=[-1] 为例，判断 1+(-1)<=4 成立，随后第 43-45 行把 x_data-1 用作写入地址，第 50-56 行继续向该地址拷贝，可能写到 x 缓冲区之前；二维输入的行偏移同样缺下界。报告者在 Ubuntu 20.04.5/aarch64、Driver 25.5.5、GCC 9.4.0 下用源码同款条件写独立最小复现（ASan 构建，非已构建 kernel 的端到端调用），运行得到 AddressSanitizer: stack-buffer-overflow，WRITE of size 4。报告明确声明未运行项目级 AICPU UT，也未做端到端 CANN kernel 调用。'
  source: 2026-10-02 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3390 （open）
  behavior: 把负的 begin 偏移传给 SliceWrite，参数检查放行，kernel 直接把数据写到 x 缓冲区之前；现象是相邻内存被写坏或进程异常退出，而调用方拿到的是成功返回。只有用 ASan/memcheck 才能看到越界写的证据。
  trigger_surface: ops-math conversion/slice_write AICPU kernel；begin 含负行偏移或负列偏移且上游未拒绝
