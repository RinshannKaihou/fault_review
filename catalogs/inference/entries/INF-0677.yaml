  mechanism: Microscaling FP4 以 32 元素块（MXFP4）或 16 元素块（NVFP4）为单位量化，块内共享一个 exponent；只要块内出现一两个 outlier，就会把该块的共享 scale 抬高，使块内其余数值被压缩到 4-level 分辨率上。本条为 MERGED 条目，合并的子故障为：MXFP4 与 NVFP4 两种 microscaling 格式（块大小分别为 32 与 16）。
  source: arXiv:2509.23202（MXFP4/NVFP4 PTQ）；AMXFP4, ACL 2025 Findings；NVIDIA "Introducing NVFP4" blog。
  behavior: 精度渐进下降，且集中在 outlier 密集的层；偶尔产生 Flips（token 级翻转）。
  trigger_surface: 量化后端/位数/KV quant 配置
  signature: off-manifold（硬性的 16-level 栅格 clipping）。per-block 量化误差由块内 max 通道主导，块级 scale 出现偏斜。cheap 族的廉价探针是"每块中饱和 FP4 码字占总码字的比例"。statistical 族可从量化残差的块内结构看到规律性；由于扰动是逐块的小幅栅格化，geometric 族的全局范数/距离检测灵敏度低，spectral 族仅在 outlier 密集层才可能见到谱形变化。
  repro: 用 forward hook 做 block-microscaled fake-quant——把张量按 32（或 16）元素分块，块内取共享 exponent 后量化回 4 bit。
