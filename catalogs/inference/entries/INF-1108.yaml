original:
  category: cat11
  section: 第 11 类 · 解码 / 采样故障（多为 post-forward — 结构性盲点）
  meta: '`infra_off`（vLLM `--hf-overrides` **以 dict 形式**扩展上下文（如 YaRN ×4）时 **MTP draft 模型不继承 override**——`compose_draft_hf_overrides()` 文档明示 dict override "not applied to the draft"，draft 保持原生 `max_position_embeddings` 作 `max_model_len`；该长度喂 `gpu_model_runner._input_fits_in_drafter` 输入门：batch 最长序列 + spec tokens 超 **draft 的** max_model_len 后，vLLM **跳过整个 draft 提案、以普通 token 0 填充全部请求**——rejection sampler 只认 -1 占位、token 0 是普通 token 仅当 target 恰采到 0 才被"接受"（≈0%）。结果：越界期间引擎级 MTP 接受率坍塌至 ~0（per-position 0.000/0.000）、每步仍付 target verify 成本、**target 输出保持正确、零日志**。Qwen3.8-27B-FP8（hybrid GDN）+ 2×H20 + `--max-model-len 1000000` + MTP k=2 生产实测） · Cov: `var:vllm_qwen38_flash_next_mtp_episodic_zero_acceptance_repetition_collapse`（11.63 MTP 接受率静默坍塌族——本条给出配置继承断链成因） · 触发 `config` · 置信度 `verified`'
  mechanism: target 与 draft 的 `max_model_len` 来自不同配置源（target 拿 dict override、draft 拿原生 config），drafter 输入门按 draft 的窄门限截断；截断行为不是报错而是静默 dummy 填充，且 dummy 值（0）与占位符（-1）语义冲突使 rejection sampler 把"无提案"当"必败提案"。11.63（MTP 偶发 0% 接受 + 跨模型指纹）之后该族新成员：本条给出**确定性的配置传播断链**成因与精确越界阈值。
  source: 'vLLM #58080（2026-09-22 open，vLLM 0.26.0 V1，含 `_input_fits_in_drafter`/`compose_draft_hf_overrides` 代码定位、per-position acceptance 指标（0.000/0.000）、RoPE 对象不发散的修正分析（diverge 的是 draft max_model_len））。https://github.com/vllm-project/vllm/issues/58080'
  behavior: 无 crash、无错误日志、**target 输出正确**——唯一可见信号是 spec-decode 指标（接受率 0、每步 verify 照付的吞吐损失）；长上下文 + dict override 部署在序列越过 draft 原生门限后 MTP **静默失效**为纯负担（延迟退化、零收益），监控不看 spec 指标即无感知。
  trigger_surface: vLLM + MTP/native MTP + dict 形式 `--hf-overrides` 扩上下文 + 序列超 draft 原生 max_position_embeddings（config）
  discovery: 2026-09-22 每日扫描。
