id: INF-2154
legacy_ids: []
slug: flashinfer_mla_padding_nan_propagation
aliases: []
title: FlashInfer MLA 把页尾 padding NaN 传入有效输出
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: MLA paged attention 内核
  behavior: CUTLASS/CuTe DSL monolithic 后端的 MLA 分页注意力未隔离有效 KV 长度之外的存储（末页未用尾部、block_tables 未用槽位指向的物理页），其中 NaN 会传播进有效输出行；传播路径为疑似、未证实。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: 仅毒化存储越界区即可让有效输出行出现 NaN（单请求最多 540,672 个非有限元素）；同输入 FA2 后端保持有限且匹配参考
  visibility: 数值异常
mitigation:
  detect: 对 KV 池未用区域预填非 NaN 哨兵后复跑可定位
  fix: 待定（两个 issue open；疑似机制为越过 kv_len 加载后 0×NaN 进入 P@V，报告者明示非证实的 kernel 级根因）
