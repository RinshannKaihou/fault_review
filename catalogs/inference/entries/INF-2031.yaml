original:
  mechanism: 'vllm-project/vllm-ascend issue 16315（2026-09-11，open）：A5、MiniMax-M3-MXFP8、TP4/DP2、--gpu-memory-utilization 0.92、--async-scheduling、kv-transfer-config 用 AscendStoreConnector（backend mooncake，kv_both），evalscope 跑 AIME2025×4 共 120 题。异步调度 + KV 连接器使 defer_block_free=True，_free_request_blocks() 把被抢占请求的块停进 deferred_frees，等 last_sched_seq > processed_step_seq 的 fence 才归还。schedule() 的分配重试循环每轮选一个 victim 抢占，但空闲块数不变，于是逐个抢占整条 running 队列仍无法给触发请求分配；下一步 update_from_output() 排空 deferred_frees、请求被重新加入，循环重复。实测抢占 14841 次、每次 free_blocks=0、0 tok/s 持续 40+ 分钟；打上游 PR #49675 后 120/120 完成、抢占 60 次。'
  source: 2026-09-11 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16315 （open）；修复 https://github.com/vllm-project/vllm/pull/49675
  behavior: 服务不崩也不报错，EngineCore 还活着并继续收新请求，但吞吐掉到 0：请求卡在 preempt→re-add→preempt 循环里，只有 SCHED-FREEZE 打点或抢占计数暴涨能看出来；不做压测很难发现。
  trigger_surface: async scheduling（默认开）+ KV 池连接器 + KV cache 打满
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
