title: 异步调度叠 KV 池时抢占重试活锁致 0 tok/s
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: vllm
    component: schedule() 抢占重试活锁
  behavior: defer_block_free 打开后被抢占请求的块停在 deferred_frees 等 step fence，重试循环每轮都看不到空闲块，把整个 running 队列逐个抢占后仍分不到容量，形成活锁
effect:
  objects:
  - 可用性/进度
  detail: A5+MiniMax-M3-MXFP8 TP4/DP2，async scheduling+KV池连接器且KV cache打满跑120题时，服务不崩不报错但0 tok/s持续40+分钟，抢占14841次且每次free_blocks=0。
  visibility: 挂起
mitigation:
  detect: 异步调度 + KV 池压到使用率 ~100%，观察 preemption 计数暴涨而 free_blocks 恒 0、Running>0 但吞吐为 0 且持续 30s 以上
  fix: '上游 PR #49675（vllm）：抢占前先探 victim 的块能否在本 step 释放，不能则 break 而不是继续抢占；报告者实测 120/120 完成、preemption 14841→60、free_blocks 231~811'
