  mechanism: ops-transformer 的 aclnnMatmulReduceScatterV2 对 reduceOp（资料仅支持 "sum"）与 commTurn（仅支持 0）无白名单校验：A2 910B2 双卡、CANN 9.2.0、ctypes 双 rank 探针实测传 reduceOp="max" 或 commTurn=1 时第一段返回 0、执行成功、输出与 "sum"/0 逐元素完全相同（M=32,K=256,N=128 bf16，max 与 sum 输出不同元素数 0/2048、commTurn=1 同）——两个属性被静默忽略。同一输入改用 V1（aclnnMatmulReduceScatter）返回 561002，证明 V1 有校验、V2 缺失。用户配置 max 归约时实际执行 sum，语义反转且无告警。
