legacy_ids: []
slug: fp8_silent_bf16_fallback
aliases: []
title: 原生 FP8 checkpoint 在 A2/A3 静默以 BF16 运行
kind: 故障
status: retired
cause:
  objects:
  - subsystem: 量化
    stack: vllm
    component: fp8_block 平台分支
  behavior: fp8_block.py 以 is_950() 决定 mxfp8_method，非 950 时为 None，process_weights_after_loading 把整块 FP8 权重反量化成模型 dtype 走非量化 GEMM，不报错
effect:
  objects:
  - 性能/资源
  - 输出分布
  detail: A2/A3 无 FP8 matmul 却静默降级 BF16：权重显存翻倍（fp8 1B→bf16 2B）、加载峰值更高，27B FP8 单卡属性破坏；唯一痕迹一条看似正常的 info 日志；文档 quantization.md:117 写成 intended
  visibility: 性能退化
mitigation:
  detect: 对比加载后权重大小/显存占用；查 fp8_block.py mxfp8_method 是否 None
  fix: 已有修复 PR/MR：https://github.com/vllm-project/vllm-ascend/pull/21516（发布状态待核实）
