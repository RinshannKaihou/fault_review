title: vLLM ROCM_ATTN 滑窗不 mask V，0×NaN 污染整行
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: ROCM_ATTN 滑窗 kernel
  behavior: 两个 Triton kernel 只把窗外 key 的 score mask 掉（softmax 权重 0）但仍加载其 V 并算 p@v；KV 管理器会释放整窗外的块供复用，窗外槽位可含 NaN/Inf，0*NaN=NaN 污染整行。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: MI355X 实测（Qwen3.8-27B+DFlash2，drafter 2048 token 窗非因果）：8k 并发 1 接受长度 3.05（少复用故不显现）；并发 16 塌到 1.21（修复后 3.22）；64k 并发 1 run failed（修复后 2.84），无报错。
  visibility: 数值异常
mitigation:
  detect: 滑窗层 + ROCM_ATTN 下出现间歇性整行 NaN/接受长度骤降；切 TRITON_ATTN 对照。
  fix: 修复任务 https://github.com/vllm-project/vllm/issues/62415（zero V for out-of-window keys，open 未合）
