original:
  mechanism: 'ROCM_ATTN 的 Triton kernel（prefix_prefill.py 的 context_attention_fwd 与 chunked_prefill_paged_decode.py 的 kernel_paged_attention_2d）把窗外 key 的 score mask 掉使 softmax 权重为 0，但仍不带 mask 地加载这些 key 的 V 并计算 p@v。KV cache 管理器会释放整块在窗外的 block 供其他请求复用；hybrid 模型中同一块内存还可能存 mamba state。窗外槽位因此可含 NaN/Inf，0*NaN=NaN 使整行输出 NaN。context_attention_fwd 跑带上下文的 prefill 块与每个 spec decode verify 步；kernel_paged_attention_2d 在 HIP paged-attention kernel 不可用时跑 decode。实测（MI355X gfx950、vllm/vllm-openai-rocm:nightly-rocm100-0cbac6cd1，Qwen3.8-27B+z-lab/Qwen3.8-27B-DFlash2，drafter 用 2048 token 窗非因果 attention）：8k/并发1 接受长度 3.05、54.9 tok/s（修复后 3.05/55.5）；8k/并发16 1.21、132.5（修复后 3.22、225.3）；64k/并发1 run failed（修复后 2.84、9.6）。并发 1 时少有块被释放复用故不显现。kernel 测试对每个窗外槽填 NaN/Inf，两个 kernel 因果/非因果均出 NaN。TRITON_ATTN 已对窗外 key mask V（triton_unified_attention.py 的 sw_mask_v）。修复任务 #62415（zero V）open。'
  source: https://github.com/vllm-project/vllm/issues/62828（open，2026-10-21 每日扫描，正文全文已读）
  behavior: ROCm 上用 ROCM_ATTN 跑带滑动窗口的模型（尤其 hybrid 或 DFlash2 等非因果 drafter）：一旦窗外 KV 块被别的请求复用过、里面残留 NaN/Inf，attention 输出整行变 NaN——DFlash2 场景表现为草稿接受率暴跌（并发 16 时 3.2→1.2）或长输入直接跑挂，无任何报错；并发低时几乎不触发，换 TRITON_ATTN 即恢复。
  trigger_surface: MI355X（gfx950）实测、vLLM 自有 Triton kernel 故其他 ROCm GPU 同受影响、nightly-rocm100-0cbac6cd1（0.30.1rc1.dev558）；滑窗层 + 窗外块复用/含 NaN。
  discovery: 2026-10-21 每日扫描
