remarks: 与 10-19 INF-1468 类「加载未初始化/复用显存参与计算」家族同类机制但不同库不同 kernel（本条 vLLM 自有 Triton kernel、score mask 而 V 未 mask）。MI355X/nightly 实测，vLLM 自有 kernel 故其他 ROCm GPU 同受影响。
