id: INF-2084
legacy_ids: []
slug: cann_masked_scatter_with_position_infershape_shapesize
aliases: []
title: masked_scatter 推导以元素总数当秩越界读 shape
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: masked_scatter_with_pos
  behavior: InferShape 用 xShape->GetShapeSize()（元素总数）当 SetDimNum 参数和循环上界，而非 GetDimNum()；[2,3,4] 时 24>3，循环里 GetDim(i) 越界读 Shape 容器。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: 任何元素总数大于秩的输入（几乎所有多维张量）都会在 Host 推导阶段越界读容器，输出 shape 依赖越界读到的内存，可能生成错误 shape 或宿主进程段错误。
  visibility: 报错
mitigation:
  detect: 对 [2,3,4]、[N]（N>1）等输入跑 masked_scatter_with_position 的 Host InferShape UT，在 ASan 下看 GetDim 是否越界
  fix: issue 修复建议：改用 GetDimNum() 作为 SetDimNum 参数与循环上界，并在读取前校验 rank（closed，未见合并记录）
