relations: []
original:
  mechanism: cann/ops-nn 的 masked_scatter_with_position Host InferShape（index/masked_scatter_with_position/op_host/masked_scatter_with_position_infershape.cpp）第 34 行把 xShape->GetShapeSize()（各维乘积，元素总数）用作 SetDimNum 参数与第 40-41 行循环上界，而正确值是 GetDimNum()（秩）。shape 为 [2,3,4] 时 GetShapeSize()=24、GetDimNum()=3，循环到 i=23，第 41 行 xShape->GetDim(i) 对 i>=3 越界访问 Shape 内部容器；即使一维 [N]（N>1）也会读 GetDim(1) 到 GetDim(N-1)。第 35-37 行只检查 xShapeSize<0，不防这种混淆。函数通过 IMPL_OP_INFERSHAPE 注册为入口、框架直接调用，可达性确认；触发条件是任何元素总数大于维度数的张量。
  source: 2026-08-24 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/5018 （closed）
  behavior: 构图阶段推导 masked_scatter_with_position 的输出 shape 时，宿主进程读到 Shape 容器之外的内存：轻则输出 shape 里出现离谱维度、后续 tiling/算子跟着失败，重则 host 段错误；算子本身还没开始算，使用者很难把问题归到 shape 推导。
  trigger_surface: masked_scatter_with_position 构图 + 元素总数大于秩的常规多维输入
  discovery: 2026-10-21 第三轮顺序扫描（tail_2，issue created < 2026-10-07）
