id: INF-1599
legacy_ids: []
slug: cann_causal_conv1d_non_contiguous_offset_and_inplace_loss
aliases: []
title: causal_conv1d 非连续张量写错位与原地丢失
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: causal_conv1d 非连续路径
  behavior: kernel 按连续布局硬编码输出偏移，非连续 y 的写入落到错误位置；非连续 convStatesRef 的原地更新没有写回用户原始 tensor（prefill 的 aclnn_causal_conv1d_fn 同款）。
effect:
  objects:
  - 数值结果
  - KV状态
  detail: 传入非连续 y 时卷积结果写错位、数值不对；传入非连续 convStatesRef 时 convStates 的 in-place 更新静默丢失（用户拿到的是旧 state），算子不报错。修复后新增 3 个非连续用例，UT 59/59 通过。
  visibility: 静默错误
mitigation:
  detect: 用 transpose/切片构造非连续 y 与 convStatesRef 调用算子，比对输出与 convStates 的逐元素值及 stride 布局
  fix: 已修（kernel 侧对 y 补 l0op::Contiguous 后改传 yFinal；算子调用后按指针比较用 l0op::ViewCopy 把更新写回用户原始 tensor；op_api/aclnn_causal_conv1d_fn.cpp 的 prefill 路径同步修复）
