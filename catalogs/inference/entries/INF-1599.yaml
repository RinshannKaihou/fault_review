original:
  mechanism: 'ops-transformer issue #5496（2026-09-20 closed，ascend950）记录 causal_conv1d 非连续张量的两处精度缺陷及修复：(1) kernel 按连续布局硬编码输出偏移，非连续 y 的写入落到错误位置，修复为对 y 补 l0op::Contiguous(y) 得到 yFinal 并改传 yFinal；(2) 非连续 convStatesRef 的原地更新没有写回用户张量，导致 in-place 更新静默丢失，修复为算子调用后按指针比较（if (convStatesFinal != convStatesRef) / if (yFinal != y)）用 l0op::ViewCopy 把更新写回用户原始 tensor；op_api/aclnn_causal_conv1d_fn.cpp 的 prefill 路径存在同款缺陷并同步修复。UT 新增 3 个非连续用例：update_convStates_y_non_contiguous、update_2d_varlen_non_contiguous、fn_convStates_y_non_contiguous，验证结果 59/59 全过。'
  source: 2026-09-20 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/5496 （closed）
  behavior: 把非连续（转置或切片出来的）张量喂给 causal_conv1d：输出会写到错误的位置、数值对不上；走带 state 的接口时，convStates 的原地更新直接丢掉，调用方手里还是更新前的旧 state，下一步 decode 就从错误的卷积历史继续算。两种情况算子都不报错。
  trigger_surface: 传入非连续 y 或非连续 convStatesRef（update 与 fn/prefill 两条路径）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
