original:
  mechanism: 'vLLM issue #62417（c2026-10-19）：8×RTX PRO 6000 Blackwell（SM120）TP8+EP，DeepSeek-V4.1-Flash-1017 checkpoint，--enable-expert-parallel --kv-cache-dtype fp8 --attention-config FLASHINFER_MLA_SPARSE_DSV41 --engram-config cpu_offload:true --speculative-config dspark。开启 DSpark（k=3/4/5/7 全部）后 thinking 模式 /v1/chat/completions 出现退化循环（"to invoketo invoke..."、"*75*75*75..."），无结构化 tool_calls 产出。隔离实验逐变量完成：同 boot 关闭投机（同 tokenizer、同 parser）干净（17*19 → 正确分离 reasoning/content=323；12-turn agent 会话 12/12 零错误）；/v1/completions 纯文本 25 档基准（1K ladder c1-c128、长上下文 32K-1M）投机开启下零失败、256-prompt needle 99.6%——损坏特定于 chat/thinking 格式。原版 DeepSeek-V4.1-Flash + DSpark 同机干净。已排除：tokenizer 文件（两 checkpoint 逐字节相同）、模板渲染（vLLM 内置 deepseek_v41 模板与官方 encoding/encoding.py 参考逐字节一致）、tokenization（/tokenize 正确解析特殊 token）、采样设置。vLLM 0.32.0 release 与 nightly 0.32.1rc1.dev24 均复现。根因未定位（issue open）。'
  source: 2026-10-19 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/62417 （open）
  behavior: 开启 DSpark 投机解码服务 DeepSeek-V4.1-Flash-1017 时，chat 接口的思考流输出变成重复片段循环（如 to invoketo invoke 反复、*75*75*75 连刷），工具调用不再以结构化 tool_calls 返回；同一服务器关掉投机立刻恢复正常，纯文本 completions 接口始终正常。所有投机步数 k 都触发，release 与 nightly 都在。
  trigger_surface: DeepSeek-V4.1-Flash-1017 + DSpark 投机（任意 k）+ chat/thinking 模式；SM120 TP8+EP 实测
