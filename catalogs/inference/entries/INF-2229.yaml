original:
  mechanism: 'P150（stock tree with #61609）。ttnn.softmax/scale_mask_softmax 对最后 tile 的 padding 列以加 -inf tile 掩蔽，但 NaN+(-inf)=NaN、+inf+(-inf)=NaN，掩码失效。隐式 tile padding 是未定义数据：BEVFormer reshape([1,900,16]→[1,900,4,4]) 在列 4..31 留 stale L1 字节；#61609 改 matmul L1 布局后这些字节变 NaN（恢复 DFB 顺序只是碰巧又变有限——最初归因已更正）。证据矩阵：失败测试中每个 ttnn.linear vs torch PCC≥0.99997 无坏行，softmax PCC 0.82/0.71；padding 列 NaN 计数与坏 softmax 行数精确对应 270↔270、38↔38；softmax 前 zero padding（不动 matmul）BEVFormer 8/8 通过。'
  source: https://github.com/tenstorrent/tt-metal/issues/62506（诊断更正帖 + NaN/坏行精确对应 + 规避验证）
  behavior: 任何末维不是 32 倍数的 interleaved softmax（或 scale_mask_softmax）只要隐式 tile padding 里恰好有 NaN 或 inf（如上游 reshape 残留），对应输出行就被毒化算错，无报错；BEVFormer 上表现为 4/8 精度检查失败、PCC 掉到 0.998 以下。
  trigger_surface: tt-metal + ttnn.softmax/scale_mask_softmax + 末维非 32 倍数 + 隐式 tile padding 含 NaN/±inf（依赖上游算子残留）。
  discovery: 2026-10-27 每日扫描
