  mechanism: aclnnGenericBlockSparseAttention 1000 例 ATK 精度测试（cann:9.3.0-910b-weekly.20261104、Atlas A2 910b3）中 18 zero-sig + 136 runfail 溯源到前置算子：round-1 200 例中 24 例 execution success 但 attentionOut/softmaxLse 全零（lse 保持预分配 0.0 而非 -FLT_MAX），metadata header 全缺失。探针三段式：v1 全零输入时 24 例 metadata 均产出合法 header（magic 0x5341534d、version 8、usedSize 272、configSignature 与源码 FNV 公式逐例吻合）→ 排除结构/标量触发；v2a 随机值 12/41 不写（≈29%），含 round-1 全部通过的参照组；v2b case 78 第 1 次写第 2 次不写、case 89 相反。队列级复跑 24 例中 18 转 PASS、6 再失败，失败子集与 round-1 不同。面 (b)：全零 metadata 时主算子仍 SUCCESS 且不写输出；面 (c)：两配置块 AICPU 崩溃 136 例。
