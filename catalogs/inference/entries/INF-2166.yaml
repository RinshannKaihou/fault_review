  behavior: trtllm-gen fused MoE 的 fused_moe_120 在 SM120 产生静默损坏输出，运行时无架构门控即接受调用；测试矩阵自声明仅保证 SM100/SM103。
effect:
  objects:
  - 输出内容
  detail: 同权重同配置仅切 moe backend：DEEPGEMM_MXFP4 全部正确，flashinfer_cutlass 从第 1 个 token 起垃圾（6131>6131*19=…）；无任何报错，流畅但错误的补全。
  visibility: 静默错误
mitigation:
  detect: 切换 moe backend A/B 对比输出；gsm8k/固定题集回归
  fix: 报告建议运行时可用性门控对齐测试矩阵（mirror tests/moe/utils.py 的 SM100/SM103 限制），未实现
