original:
  mechanism: flashinfer 0.7.2 wheel（8×RTX 6000D 84G SM120 cc12.0，vLLM 0.32.1rc1.dev440，DeepSeek-V4.1-Flash-1017 TP8+EP8）。vllm --moe-backend flashinfer_cutlass 对 MXFP4×MXFP8 专家配置解析到 FLASHINFER_CUTLASS_MXFP4_MXFP8，即 JIT fused_moe_120 内核（boot log Building JIT module fused_moe_120 + Tuning trtllm::fused_moe::gemm1/gemm2 各 21 profiles）。该路径在 SM120 输出静默损坏；flashinfer 自己的测试矩阵 tests/moe/utils.py 写明 only guaranteed to work on SM100 and SM103（其他架构 6063 个测试 skip），但运行时 API 无对应门控，SM120 调用被照常接受。单变量 A/B：同权重同引擎配置同 graph（PIEWISE）同 spec（DSpark k4），auto→DEEPGEMM_MXFP4 输出正确（17*19=323、中文问答、tool calls 正常），flashinfer_cutlass 从第 1 个 token 起垃圾（6131 > 6131*19=…）；关 spec decode 依旧损坏。
  source: https://github.com/flashinfer-ai/flashinfer/issues/7179
  behavior: 在 SM120（RTX 6000D 等）上用 vLLM flashinfer_cutlass MoE 后端跑 DeepSeek-V4.1-Flash：服务正常起来、无任何报错，但生成内容从第一个 token 就是错的（简单乘法题输出乱数字），中文问答和工具调用全部损坏；同一份权重切回 DEEPGEMM 后端立刻全对。流利但错误的补全对线上质量监控完全隐形。
  trigger_surface: flashinfer 0.7.2 fused_moe_120（trtllm-gen fused MoE）；SM120；vLLM --moe-backend flashinfer_cutlass + MXFP4×MXFP8（DeepSeek-V4.1-Flash）；graph/spec 配置无关。
  discovery: 2026-10-24 每日扫描
