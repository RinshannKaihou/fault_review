  meta: '`infra_off`（nightly 上启用任一推测解码（mtp 或 dflash）使 hybrid GDN 模型的 `prefix_cache_hits_total` 静默归 **0**——align-mode prefix caching 启动日志正常出现但**永不命中**，重复长 prompt 全额重 prefill；v0.24.0 同机同模型正确共存（MTP k=3 下 9,901-token 二次发送命中 8,000、TTFT 7.27s→1.33s）= 跨版本回归） · Cov: `NEW` · 触发 `partial` · 置信度 `verified`'
  mechanism: 'A/B 三行对照（同机 GB10 nightly、18,219-token prompt ×2、max_tokens=10）：仅 APC 时命中 17,248 / TTFT 9.46s→0.64s；+MTP k=3 命中 **0**；+dflash k=7 命中 **0**。回归窗口 v0.24.0 → v0.28.1rc1.dev43。与 #53670（命中但逐命中重算）、#41884（DFlash+APC IndexError crash）均不同——本条是**静默零命中**。无 crash、无 warning、无日志，唯一可见信号是 metrics 恒 0 与 TTFT 不降。'
  source: 'vLLM #54360（2026-08-29 open，含三配置 A/B 表与 v0.24.0 共存对照）。https://github.com/vllm-project/vllm/issues/54360'
  behavior: 无 crash、输出正确——**缓存系统性失效的性能静默回退**：重复 prompt 全价重算，生产中仅以 TTFT 异常/成本上升显形；不做 metrics 基线对比则不可发现。属「**特性组合下缓存静默失效（回归型）**」新子签名：与 6.153（align retention 默认 0 无日志死状态）同「无日志的缓存死状态」域，本条由 spec-decode 组合触发且是**跨版本可对照的回归**（不是初始缺配置）。
  trigger_surface: vLLM nightly（v0.24.0<v≤v0.28.1rc1.dev43）+ hybrid GDN 模型 + `--speculative-config`（mtp/dflash）+ `--enable-prefix-caching`（组合即触发）
