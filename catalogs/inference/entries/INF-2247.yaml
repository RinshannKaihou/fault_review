id: INF-2247
legacy_ids: []
slug: rowhammer_triton_jit_pass_bitflip_slowdown
aliases: []
title: Rowhammer 翻转 Triton JIT 优化 pass 致持续减速
kind: 故障
status: active
cause:
  objects:
  - subsystem: 外部攻击
    stack: 硬件
    component: CPU DRAM 中 Triton 编译管线
  behavior: LLVMhammer 在 CPU DRAM 上 Rowhammer 翻转 Triton 编译管线中性能关键优化 pass 的比特，生成功能等价但次优的 GPU kernel；经磁盘缓存持久化，单次翻转致后续推理持续减速。
effect:
  objects:
  - 性能/资源
  detail: 单 GPU 推理服务延迟增加 4-16%（Qwen2.5-7B/Llama-3.1-8B/Mistral-7B/DeepSeek-7B，RTX 4090 与 RX 7900 XTX）；规模化后折算年度运营成本增加。功能输出正确，纯性能影响。
  visibility: 性能退化
mitigation:
  detect: 论文给出 Karnage 工具自动定位可利用翻转点（攻击方用）；防御方检测未评估
  fix: 待定（论文 arXiv:2610.30798，2026-10-22；未见上游修复）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-28'
remarks: ''
evidence:
- url: https://arxiv.org/abs/2610.30798
  kind: arxiv
relations: []
original:
  mechanism: arXiv:2610.30798（2026-10-22，Amplifying Latency and Cost of LLM Inference via Rowhammer Attack）：LLVMhammer 对 Triton JIT 编译管线（MLIR/LLVM）发起 Rowhammer 攻击，在 CPU DRAM 中翻转性能关键优化 pass 的比特，使 Triton 生成功能等价但次优的 GPU kernel；因 Triton 把生成的 kernel 缓存在磁盘，单次成功翻转在后续推理执行中持续生效。Triton 的 target 无关阶段跨 GPU 厂商共享，攻击厂商无关。配套 Karnage 工具自动定位编译管线中可利用的翻转位置（免人工检查）。评估：Qwen2.5-7B-Instruct、Llama-3.1-8B-Instruct、Mistral-7B-v0.3、DeepSeek-llm-7B-chat，NVIDIA RTX 4090 与 AMD RX 7900 XTX，单 GPU 推理服务延迟增加 4-16%，规模化后折算额外年度运营成本。输出正确性保持——这是存活性攻击（延迟/成本）而非正确性攻击。
  source: https://arxiv.org/abs/2610.30798
  behavior: 攻击者在能触发行翻转的机器上让 LLM 推理服务悄悄变慢：单次成功比特翻转让 Triton 编译出功能相同但更慢的 GPU kernel，且因 kernel 磁盘缓存而长期生效，服务输出内容完全正确、无任何报错，监控上只表现为吞吐下降、延迟上升 4-16%，容易被当成正常负载波动。
  trigger_surface: CPU DRAM 易受 Rowhammer 的主机 + Triton JIT 编译路径 + LLM 推理服务（实验覆盖 NVIDIA/AMD 消费卡）；攻击面为 Triton target 无关编译阶段，厂商无关。
  discovery: 2026-10-28 每日扫描
