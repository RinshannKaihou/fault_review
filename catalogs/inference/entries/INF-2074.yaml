original:
  mechanism: 环境 PyTorch 2.10.0+cpu、torch_npu 2.10.0、CANN 9.0.0（V100R001C10SPC001B250）、npu-smi 25.5.1、Ascend 910C×4 双芯=8 芯片、GLM-4.6V（128 专家，TP8+EP8）、vllm-ascend 0.22.1rc1。开启 HCCL_OP_EXPANSION_MODE=AIV 后 vllm serve 启动并完成图捕获，首个 curl 请求进入 NPUGraph 回放即卡在 Replaying aclgraph；npu-smi 显示 AIVector 8–16%、AICore 0%，即 AIV 核在等一个不会完成的握手，约 5 分钟后 EngineCore shm_broadcast 超时自崩。对照组：同一环境下标准 dist.all_reduce/dist.all_to_all 在 AIV + NPUGraph 回放正常，说明死锁特化在 MC2 dispatch/combine 算子；注释掉 AIV 后同样启动，3 轮请求全部成功。
  source: '2026-08-06 GitCode Ascend/pytorch issue #3762 https://gitcode.com/Ascend/pytorch/issues/3762 （open）'
  behavior: 服务能正常起来、日志显示 Application startup complete，但第一条请求进去就再也不返回；客户端一直挂着直到超时，卡上看是 AIV 核在跑、算力核完全闲，五分钟后整个 EngineCore 自己崩掉。把 AIV 环境变量去掉就一切正常，很难从现象联想到是 MC2 算子与图回放不兼容。
  trigger_surface: HCCL_OP_EXPANSION_MODE=AIV + NPUGraph/aclgraph 捕获回放 + EP MoE 的 npu_moe_distribute_dispatch / combine
