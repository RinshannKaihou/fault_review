cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: racecheck 插桩覆盖
  behavior: 同一份人为构造的 cross_pipe 竞争用例在 A5 上动态插桩正常却检不出竞争；950 上换 0307 版编译器由符合预期变为漏报；ctrl 寄存器未复位时静态与动态插桩结论互不相同。
effect:
  objects:
  - 测试判定
  detail: 按官方用例目录里明确的错误写法跑 racecheck 得到零告警；换编译器版本（0226→0307）同一场景从报出变不报，插桩方式不同结论也不同——是否漏报取决于环境与工具链。
  visibility: 静默错误
mitigation:
  detect: 在已知存在竞争的用例上做回归：同一算子在 A5/950 与各编译器版本、静态与动态插桩下各跑一次 racecheck，结论不一致即视为覆盖缺口。
  fix: 待定（三个 issue 均以“漏报/不一致”闭环，未见公开修复 PR 或根因说明）
