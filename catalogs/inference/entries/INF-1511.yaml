original:
  mechanism: 同一套人为构造的竞争用例在不同环境/工具链上得到互相矛盾的结论。①#88：A5 环境，按固定步骤（/home/autotest/AutoTestProperty/op_mssanitizer_lingqu/race_check/cross_pipe/hset/error，source cann 包、bash xasc.sh 编译、mssanitizer -t racecheck race.fatbin）跑构造好的竞争场景，预期能检出竞争，实际“动态插桩正常，但没有检测出竞争”。②#49：950 环境下 0226 版编译器行为符合预期，0307 版编译器竞争检测漏报——同一份用例、同一台机器，仅编译器版本不同结论就相反。③#69：ctrl 寄存器未复位的场景下，静态插桩与动态插桩检测结果不一致；该 issue 正文只有结论，未给根因与复现细节。
  source: 2026-03-12 GitCode Ascend/mssanitizer issue https://gitcode.com/Ascend/mssanitizer/issues/49（closed）；2026-03-30 issue https://gitcode.com/Ascend/mssanitizer/issues/69（closed）；2026-04-24 issue https://gitcode.com/Ascend/mssanitizer/issues/88（closed）
  behavior: 用官方用例目录里明确写错的竞争代码跑 racecheck，工具插桩正常结束、日志里没有报错，却一条竞争都没报；把编译器从 0226 换到 0307 后同一场景从“能报”变成“不报”，同一算子改用静态插桩又会给出另一个结论。使用者无法从一次检测结果判断到底是算子无竞争，还是工具这次没覆盖到。
  trigger_surface: Ascend A5 / 950 + cross_pipe hset 竞争用例；racecheck 静态与动态插桩；编译器 0226 vs 0307；ctrl 寄存器未复位场景
