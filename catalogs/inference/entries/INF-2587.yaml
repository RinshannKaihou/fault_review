title: FlashAttentionScore scale=0 非对齐 Skv 静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnFlashAttentionScore
  behavior: Ascend950PR fp16、scaleValue=0、headNum>=16 且 Skv 非128倍数时，输出与公式定义的均匀注意力不符，整块偏离 mean(V)；Skv=128 或 fp32 不复现。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: Skv=129、Nq=16 fp16 时 max|out-mean(v)|=0.095181，192000/262144 元素偏差>1e-2；Skv=128 对照偏差 0.000000；两段 rc=0。
  visibility: 静默错误
mitigation:
  detect: scale=0 时用 mean(V) 作解析参考；覆盖 Skv=128/129、headNum=8/16、fp16/fp32
