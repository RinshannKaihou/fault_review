original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.lgamma` FLOAT32 直接在输入处求 Stirling 渐近级数、无参数移位——`0.2<x<2`（函数最常被求值的区间）误差达数十万 ULP：x=0.6 处 **474,555 ULP**（相对 3.87e-2）、峰值 9.04e-2 相对误差 @ x=0.5129；x≥2 与 x<0.15 准确（0–1 ULP），缺陷限于域中部；内核注释自称 "Minimal coefficients for 0-3 ULP"） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`ckernel_sfpu_lgamma.h` 对 x<0.5 做反射 `z=1-x` 后直接以 Stirling 基式求值——反射的对称性使误差成为 (x−0.5) 的**偶函数**（0.3/0.7、0.4/0.6 误差逐对相等），该对称性即诊断指纹：渐近级数在小 z 处不收敛，而库标准做法（musl/lgamma）先以递推把参数移位到大 z 再求级数。'
  source: 'tt-metal #55356（2026-09-03 open，ttsim BH + v0.79.0-dev20260902、双精度 math.lgamma 对照、误差偶函数对称表）。https://github.com/tenstorrent/tt-metal/issues/55356'
  behavior: 无 crash——中间域百分比量级相对误差（统计/损失计算静默失真）；注释与实现的 ULP 声明相差五个数量级。属「**渐近级数无参数移位**」新子签名，与 1.126（digamma 共享 log 体精度下限）同「特殊函数实现完整性」域但机制独立（彼条共享低精度子程序、本条缺移位步骤）。
  trigger_surface: Tenstorrent WH/BH + `ttnn.lgamma` + x∈(0.2,2)（软件 API 可触发）
  discovery: 2026-09-03 每日扫描。
