original:
  mechanism: 'cann/ops-math aclnnRightShift 在无符号整数 shiftBits>=bitWidth 时输出 input>>(bitWidth-1) 而非资料要求的 0（issue #4303，910B3/CANN 9.2.0，master 18109487 实测）。资料 experimental/math/right_shift/docs/aclnnRightShift.md:21-22 原文：「无符号整数：若 shiftBits_i >= bitWidth，则输出 0」。实测：uint8 200>>8=1（应 0，200>>7 亦为 1）、255>>255=1、uint16 65535>>16=1、uint32/uint64 同型；s>=bitWidth 后输出冻结在 s=bitWidth-1 的结果（uint8 的 s=8/9/255 与 s=7 同为 1），是确定性钳位而非未定义行为读取。有符号分支正确（int8 -1>>8=-1，符合资料「input<0 输出 -1」）。两段返回 0 静默错值。报告者注明钳位代码在 master 仍在（git fetch 后核对）。'
  source: GitCode issue https://gitcode.com/cann/ops-math/issues/4303 （open，2026-10-30 创建；含 uint8/16/32/64 与 int8 对照矩阵、自包含 repro.cpp）
  behavior: 对无符号整数做右移：当移位量大于等于位宽（如 uint8 移 8 位以上）时，输出固定等于把原数右移 7 位的结果（255 右移任意越界值都得 1），而按资料应该输出 0；有符号整数同条件行为正确。接口不报错，做位域提取、掩码对齐的整数逻辑会拿到非零脏值。
  trigger_surface: cann/ops-math right_shift；无符号 uint8/16/32/64；shiftBits>=bitWidth。
  signature: uint8 255>>255=1（应 0）；输出=x>>(bitWidth-1) 冻结。
  repro: issue 附自包含 repro.cpp（CTRL/DEFECT 分组实测）。
  discovery: 2026-10-30 每日扫描
