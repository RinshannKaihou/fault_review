title: aclnnRightShift 无符号越界钳位输出 1
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: right_shift 无符号越界分支
  behavior: 无符号整数 shiftBits>=bitWidth 时实现未按资料输出 0，而是把移位量钳到 bitWidth-1，输出 input>>(bitWidth-1)。
effect:
  objects:
  - 数值结果
  detail: uint8 200>>8 实测 1（应 0）、255>>255=1；uint16 65535>>16=1；uint32/uint64 同型。有符号分支正确（-1>>8=-1）。输出冻结在 s=bitWidth-1 的结果，两段返回 0。
  visibility: 静默错误
mitigation:
  detect: unsigned x>>bitWidth 断言 0；移位量越界扫描（s=bw、bw+1、255 三点）。
  fix: 待定（未见修复 MR）
