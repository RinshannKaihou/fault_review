original:
  mechanism: 'Ascend/pytorch #2663（2026-07-08，closed）：torch.npu.amp.autocast 的实现把 float64 张量也做向下转型。PyTorch 官方 autocast 语义是只对 fp32 做 cast（fp32→fp16/bf16），float32 与 float64 中被 cast 的只有 fp32，float64 保持不动。报告给出复现片段：with torch.npu.amp.autocast(dtype=torch.float16): x_f64 = torch.tensor(1.0, dtype=torch.float64, device=''npu'')，期望仍为 float64，实际被 cast 成 float16。作者给出的定位方向是检查 torch_npu/csrc/amp/ 下的 autocast 实现，把 float64 加入不 cast 的白名单。混合精度训练中靠 fp64 保精度的统计量（loss scaling 的 scale、某些归一化的分母）因此被降精度，误差在区内逐步累积。'
  source: 'Ascend/pytorch #2663（2026-07-08，closed） https://gitcode.com/Ascend/pytorch/issues/2663'
  behavior: 在 torch.npu.amp.autocast 区里创建的 float64 标量或张量，取出来 dtype 已变成 float16，数值被截断；同一个脚本在 CPU/CUDA 的 autocast 下 dtype 保持 float64、结果一致，所以迁移过来的混合精度代码只有 NPU 上悄悄掉精度。表现为 loss 或归一化数值缓慢偏移，没有任何告警。
  trigger_surface: torch.npu.amp.autocast 区内构造或使用 float64 张量
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
