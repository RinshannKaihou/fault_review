id: INF-1737
legacy_ids: []
slug: npu_amp_autocast_downcasts_float64_to_fp16
aliases: []
title: autocast 把 fp64 张量降为 fp16 违背 PyTorch 语义
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: amp autocast cast 白名单
  behavior: torch.npu.amp.autocast 的实现把 float64 张量也向下转型，未将 float64 列入不 cast 的白名单，而官方 autocast 语义只对 fp32 做 cast、float64 应保持不动。
effect:
  objects:
  - 数值结果
  detail: autocast(dtype=float16) 区内 torch.tensor(1.0, dtype=float64) 变成 float16；依赖 fp64 精度的统计量（loss scale、归一化分母）在区内被降精度，误差持续累积。
  visibility: 静默错误
mitigation:
  detect: autocast 区内打印 tensor.dtype，与 CPU autocast 的 dtype 决策对比
  fix: 待定（issue closed，正文未给 PR）；建议在 torch_npu/csrc/amp/ 下把 float64 加入不 cast 白名单
