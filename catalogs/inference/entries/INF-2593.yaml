  target: INF-1045
pattern: PAT-INF-0208
original:
  mechanism: flashinfer 0.7.3（A100 80GB、CUDA 13.0、torch 2.14.0+cu130）中，`top_k_sampling_from_probs`、`top_p_sampling_from_probs`、`top_k_top_p_sampling_from_logits` 以及 `top_k_renorm_probs` 对退化阈值不做拒绝：k=0 时 4×1000 随机分布（行 argmax=[850,471,775,228]）恒返回 token 0，且 token 0 不在 row0 的 top-2；p=0 同样 4 行恒返回 token 0；`top_k_renorm_probs(k=0)` 输出 4000/4000 为 0（不是 NaN），再喂给采样器继续得到 token 0；重复采样只有 1 个唯一值。`*_from_probs` 与 `*_from_logits` 两条独立 kernel、top-k-first + rejection 路径行为一致，`k=-1`/`k>vocab`/`p>=1` 则按文档做 unfiltered sampling，说明断裂点正好在零。库内 `min_p_sampling_from_probs(p,0.0)` 能正确做 no-filter（100 次抽到 96 个不同 token），所以这是采样 kernel 之间的语义不一致，不是设计选择。
  source: https://github.com/flashinfer-ai/flashinfer/issues/9981（open，2026-11-24，含两条 kernel、四条 API 的确定性复现）
  behavior: 直接调用 FlashInfer 的 top_k/top_p 采样接口时，如果把 k 设成 0 或 p 设成 0，接口不报错，而是每次固定返回 token 0：即使这一行的 argmax 是 850、top-2 是 [850,280]，也照样给 0；top_k_renorm_probs(k=0) 还会返回全零分布，继续采样仍然是 0。重复采样只有一个唯一值，完全不是从分布里采样，也不等于 greedy；服务端看到的是合法 token id，不会触发任何校验或告警，只有检查采样多样性或与 no-filter 语义对照才能发现。
  trigger_surface: flashinfer 0.7.3 wheel、A100 80GB、CUDA 13.0、torch 2.14.0；top_k_sampling_from_probs/from_logits、top_p_sampling_from_probs、top_k_top_p_sampling_from_logits、top_k_renorm_probs；k=0 或 p<=0。
  discovery: 2026-11-26 每日扫描
