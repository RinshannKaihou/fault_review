title: FlashInfer top_k/top_p 零阈值静默返回 token 0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: flashinfer
    component: top_k/top_p sampling
  behavior: top_k/top_p 采样接口对 k=0 或 p<=0 的退化阈值不做拒绝，不报错且固定返回 token 0；top_k_renorm_probs(k=0) 返回全零分布。
effect:
  objects:
  - 输出内容
  detail: 4×1000 随机分布、argmax=[850,471,775,228]，k=0 时 4 行恒返回 token 0（不在 row0 top-2）；p=0 同样恒 0；k=0 的 renorm 输出 4000/4000 为 0；重复采样只有 1 个唯一值。
  visibility: 静默错误
mitigation:
  detect: k=0/p=0 的负向用例断言报错或退化为 greedy；检查 top_k_renorm_probs(k=0) 是否为全零；与 min_p=0 的正确 no-filter 行为对照
  fix: 待定（open；issue 建议显式拒绝 k<=0/p<=0，p==0 退化为 greedy，renorm(k=0) 返回 NaN 或 identity）
labels:
  stage: N/A
  confidence: documented
  coverage: var
  discovered: '2026-11-26'
remarks: 与 INF-1045（SGLang seeded 采样遇空分布静默输出 token 0）同属采样退化/空分布静默返回 token 0；本条为 FlashInfer 的零阈值 top_k/top_p 空候选路径，涉及两条独立 kernel 与 renorm 链。
