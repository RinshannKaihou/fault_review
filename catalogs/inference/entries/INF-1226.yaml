  mechanism: 本条是 META / baseline 行，不是故障。它登记的是三个已被论文验证的隐藏态／内部签名幻觉检测器：EigenScore（INSIDE, ICLR 2024）；DoLa（ICLR 2024）；针对长文本实体捏造的逐 token 线性探针（Slobodkin EMNLP 2025）。源文档 Implementable 标为 yes，但那指的是「这些探针式度量可以实现」，而不是「可以复现一个故障」——因此本表的触发列记为 `n/a`，也不设「复现方式」字段。
  source: EigenScore (INSIDE, ICLR 2024)；DoLa (ICLR 2024)；per-token linear probes for long-form entity fabrication (Slobodkin EMNLP 2025)。源文档未给出这三条的完整作者列表、arXiv 号与 URL（DoLa 的完整引用见 15.5：Chuang et al., ICLR 2024, https://arxiv.org/abs/2309.03883 ）。
  behavior: 不适用——本行不产生行为效应；它记录的是「这些是针对幻觉的、已验证的隐藏态／内部签名检测器」。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: 这三者本身就是 model_on 侧的已验证签名度量，提供了现成的基线检测器：EigenScore 属 statistical / infotheoretic 族（隐藏态协方差谱的分散度），DoLa 属 trajectory / infotheoretic 族（早层 vs 最终层 logit 散度，见 15.5），Slobodkin 探针属 geometric 族（逐 token 线性探针）。它们的存在是 model_on 分支的合理性依据（rationale）：说明 on-manifold 故障确实留有可被内部信号读出的痕迹，监控不必只依赖离流形几何量。
