  meta: '`infra_off`（`--kv-cache-dtype fp8` 在 `FLASHINFER_MLA_SPARSE_SM90` 后端无法启动：fp8 KV cache 以 `uint8` storage 分配、`run()` 以 `float8_e4m3fn` view 使用，而 `FlashInferMLASparseSM90Builder` 把 **storage dtype（uint8）** 传给 wrapper 的 `plan()`——`ValueError: MLA kv_data_type torch.uint8 is not supported`，启动即死；放弃 fp8 KV 则损失 1.78× KV 容量（2.53M vs 4.50M token）） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: '`_SM90State(...)` 构造处把存储 dtype 与逻辑 view dtype 混用——GLM-5.3-Flash 部署路径（#53906 引入）上 fp8 KV 与 sparse MLA builder 的 dtype 契约缺口。fail-loud 但发生在**启动期之后的选择期**（用户已按文档开 fp8 KV）。'
  source: 'vLLM #55221（2026-09-03 open，缺陷 1/2；GLM-5.3-Flash、SM90）。https://github.com/vllm-project/vllm/issues/55221'
