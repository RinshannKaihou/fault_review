  meta: '`infra_off`（hybrid 多 KV-group 模型（Kimi-K3 MLA+GDN）的 finish-time save 路径：`MultiConnector` 下 `update_state_after_alloc` 只把真实 `num_external_tokens` 转发给第一个 connector，`KVCacheStoreSendingThread → _handle_request` 仍用全局 g_idx 索引 per-group `block_ids_per_group[g_idx]` 抛 IndexError——**为 offload/迁移引入的 saver 线程在 hybrid 多组模型上 crash**） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 'hybrid 模型的 KV group 数 >1，每个 group 有独立的 block_ids 结构；MultiConnector 的 token 计数转发只到达第一个子 connector，后续 connector 收到 0/陈旧计数但仍被逐 group 驱动——saver 线程对 `block_ids_per_group` 的元组索引越界。修复（PR #54643）把真实 token 数转发给全部 connector。与 6.168（hybrid 页对齐巨块）同"hybrid 多组泛化缺口"域：单组假设的代码路径在多组模型上首次暴露。'
  source: 'vLLM PR #54643（2026-08-31 open，bug + kv-connector label，Kimi-K3 + MooncakeStoreConnector + MultiConnector 栈 traceback）。https://github.com/vllm-project/vllm/pull/54643'
