original:
  mechanism: 'vllm-ascend 非 layerwise AscendStore KVPool 传输可损坏缩放块跨步 MLA 缓存：一个调度块含多个 kernel 块，每块内 NoPE/RoPE 分量被另一分量或 padding 交错分隔；旧元数据把每组件 payload 乘 kernel 块比后按一段连续区拷贝，区间重叠且漏掉每逻辑块最后 5 个物理槽（640 token）。实测 A3 Kimi-K3 布局（5760-token 调度块 / 128-token kernel 块，比 45）：真实 17280-token 池恢复后第一 MLA 层收到相同 hidden states 但不同历史 KV、产出不同输出。修复 PR（#19069 v0.30.0 / #19070 main，open）：受影响非分层组件每物理块一个传输描述符、保留逻辑块跨步；dense 与比 1 缓存保留紧凑描述符；注册实际物理存储跨度；拒绝需分段传输的非连续内部块。缓存兼容性：修复后打包内容与旧池对象不兼容（总字节不变），需全端一起升级并用新 cache 命名空间/cache_salt 或使受影响条目失效，仅重启 worker 不使持久池对象失效，无自动迁移。layerwise 描述符/部分块路径未改。Related to #18898。'
  source: 2026-10-17 GitHub vllm-project/vllm-ascend PR https://github.com/vllm-project/vllm-ascend/pull/19069 （open；真实池恢复实测+兼容性说明）
  behavior: 用非 layerwise AscendStore 做 KV 池恢复/传输且模型是缩放块跨步 MLA 缓存（如 Kimi-K3）时，恢复后的 KV 内容静默错：漏掉每逻辑块尾部若干 token 的 KV、组件区间互相重叠。服务不报错，模型用损坏的历史 KV 生成，输出与正确恢复不同。
  trigger_surface: AscendStore 非 layerwise 传输 + 块跨步缩放 MLA 缓存 + kernel 块比>1；A3 Kimi-K3 实测
