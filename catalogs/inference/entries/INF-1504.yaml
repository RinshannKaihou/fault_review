  detail: catlass/ops-nn/shmem/aclnn 融合与 mc2 算子在合法输入上稳定报 illegal read/write、非法释放或 out of bounds，按打印地址对 InitBuffer 空间并不越界；真越界被同批误报稀释，910B 与 910C 结论还不同。
  visibility: 报错
mitigation:
  detect: 把告警里的地址+size 与源码 InitBuffer/访问范围逐条核对，并用同算子换搬运方式（nd2nz→逐块拷贝、关 compact 模式）复测同一用例。
  fix: 待定（各 issue 均以“误报”闭环，未见公开修复 PR；#196/#207 为扫网专项，归因指向搬运指令地址模型）
