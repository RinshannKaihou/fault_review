id: INF-2093
legacy_ids: []
slug: vllm_ascend_prefix_cache_with_mtp_token_corruption
aliases: []
title: prefix caching 与 MTP 同开致输出 token 崩坏
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: prefix cache 与 MTP 路径
  behavior: GDN 混合架构上 --enable-prefix-caching 与 qwen3_5_mtp 投机解码同开时输出 token 级崩坏；具体出错代码未定位（待定）。
effect:
  objects:
  - 输出内容
  detail: 服务加载无报错、MTP 接受率仍 70%~100%，但短文本出现复读插入与错字（通义千问→通义谦）、长文本数字量词错乱；去掉 --enable-prefix-caching 后同一请求恢复正常。
  visibility: 静默错误
mitigation:
  detect: 同一请求分别在开/关 --enable-prefix-caching 下比对输出文本与 token id，并确认 MTP 接受率是否仍正常
  fix: issue 只给规避：关闭 --enable-prefix-caching；无修复 PR（issue open，未核实）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-21'
remarks: ''
evidence:
- url: https://github.com/vllm-project/vllm-ascend/issues/17338
  kind: github_issue
relations: []
original:
  mechanism: 环境为 Atlas 300I Duo（310P3，44GB×4）TP4、openEuler 24.03、vLLM 0.23.0 + vllm-ascend 0.23.0（CANN 9.1.0、torch_npu 2.10.0.post4），模型 Qwen3.8-27B-w8a8-310p（model_type=qwen3_5，64 层 3:1 GDN:full 混合注意力，mtp_num_hidden_layers=1）。启动命令同时带 --enable-prefix-caching、--speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":1}'、--mamba-ssm-cache-dtype float16 与 cudagraph FULL_DECODE_ONLY；对照实验只删掉 --enable-prefix-caching 一行、其余完全不变，重起服务后同一请求输出正常。报告者未定位到具体出错代码，也没有给出 KV/attention 内部的比对数据，故因果落点记为待定；MTP 接受率在崩坏时仍为 70%~100%，说明 draft 阶段本身未报错。
  source: 2026-09-23 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17338 （open）
  behavior: 服务能正常加载并返回 200，日志里没有任何报错或警告，MTP 投机解码的接受率指标也正常（70%~100%），但回答内容在 token 级崩坏：问「请介绍一下你自己」时思考段出现「请介绍一下你自己介绍」的复读插入，正文写出「我是通义谦」，长文本里数字量词错乱（500 字写成 50 字、5000 字），图片/视频用例同样出现错字与破碎复述。把 --enable-prefix-caching 去掉后同样的请求全部恢复正常，接受率升到 90% 以上，加速效果也正常。
  trigger_surface: 310P（Atlas 300I Duo）上的 GDN 混合架构 w8a8 模型 + 前缀缓存与 MTP 投机解码同时开启
  discovery: 2026-10-21 第三轮顺序扫描（final_tail，issue created < 2026-10-07）
  notes:
  - 2026-10-21 opus-5.5 复核重写（原文因果落点待定，未说复用路径组合出错）
