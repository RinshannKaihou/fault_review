original:
  mechanism: 'vllm-ascend issue #19119（c2026-10-19，回溯型跟踪单，closed——修复 #18838 已合入后的 bug 追踪；Qwen3-0.6B 单卡 eager、上游 vLLM c4df37df）：Ascend worker 覆写上游 sleep/wake 生命周期但未保留 sleep_preserve_parameter_names 选定的模型参数。level-2 sleep 丢弃 weights pool；若后续权重更新故意省略选定/冻结参数（RL 更新常见形态），其原值不恢复到既有存储，唤醒后推理结果错误。复现序列：启用 sleep 模式并配置 preserve 参数名 → 记录参数值与确定性推理参考 → 进入 level-2 sleep 并唤醒 weights pool → 重载 checkpoint/更新时故意省略该参数 → 对比参数与推理输出。修复（#18838，已合入）：实现选定参数跨睡眠保留、恢复进既有存储；KV-only 唤醒保留备份直到权重恢复；level-1 行为不变。'
  source: '2026-10-19 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/19119 （closed，修复 PR #18838 已合入）'
  behavior: NPU 上开启二级睡眠并在权重更新时省略部分受保护参数（如 RL 冻结参数）的服务，唤醒后这些参数的值没有恢复成睡眠前的原值，推理输出随之悄悄出错；升级到含修复的版本或只睡 KV 不动权重池则无此问题。
  trigger_surface: 'vllm-ascend + --enable-sleep-mode level-2 + sleep_preserve_parameter_names + 唤醒后更新省略选定参数；修复 #18838 之前版本'
  discovery: 2026-10-19 每日扫描
