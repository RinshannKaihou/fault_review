  mechanism: DFlash 式推测解码需要**非因果（non-causal）草稿注意力**，这与 KV cache 量化（fp8、TurboQuant）在原理上根本不兼容 → 在稠密注意力与混合注意力上都出现退化的 token 循环（degenerate token loops）。
  source: 'vLLM #41559（OPEN 2026-05-03，"DFlash ... incompatible with all KV cache quantization"）；vLLM #40831（CLOSED 2026-04-24，"TurboQuant KV × any speculative decoding ... degenerate token loops"）。'
  behavior: 生成陷入 token 级重复循环；两个特性各自可用，组合即坏。
  trigger_surface: 推测解码/CUDA graph：vLLM 可开，需接受率与 batch 场景
  signature: 非因果读取下读到量化损坏的 KV → **off-manifold + 重复**。检测面：重复循环使隐藏态轨迹周期化，trajectory 族（轨迹自相似/周期性）与 infotheoretic 族（输出熵坍缩）是最灵敏的；spectral 族会看到有效秩下降；statistical KV-norm 因量化误差幅度有限而可能只有中等信号。重复输出同时也是极廉价的 cheap 行为检测目标。
  repro: 单钩子叠加两件事——对 cached K/V 施加 fp8 级量化误差，并放宽注意力掩码使草稿位置能读到未来位置（模拟非因果读取）；无 draft 模型时只能在单模型上复现"量化 KV × 非因果读"的复合后果。
  locus: control-flow
  priority: low
