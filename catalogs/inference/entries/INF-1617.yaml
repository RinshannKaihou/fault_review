title: TP 去冗余存盘丢 DSA 参数分片，重载首 loss 跳到 12.4
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: mindspore
    component: DSA attention TP 布局登记
  behavior: DSA replicated-TP 分支只给 self_attention 装 PrepareModuleInputOutput，只变换激活、不登记 attention 参数的 TP Replicate 布局
effect:
  objects:
  - 模型权重
  - 训练信号
  detail: FSDP 全局 layout 缺 tp 维，remove_redundancy 把不同 TP rank 当冗余：linear_qkv.weight 两 chunk 同为 62.883965（应 43.835247/62.883965），DSA2 重载首 loss 0.48→12.405167
  visibility: 静默错误
mitigation:
  detect: 检查 checkpoint metadata 的 mesh names 是否含 tp、同层各 chunk 校验和是否重复；续训首 step loss 与保存前最后一步比对
  fix: 显式登记 DSA self-attention 参数为 TP Replicate，并让 DSA2 weight absorb 读 linear_kvb.weight 时转 local Tensor；修复后 step121 loss 0.484146（未核实发布）
