id: INF-2608
legacy_ids: []
slug: regbase_rmsnorm_quant_large_finite_zero_output
aliases: []
title: RegBase RMSNorm 系大有限值输出归零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: ops-nn RegBase RmsNorm 归约
  behavior: RegBase 归一化在 FP32 中做 x² 平方与累加，很大但完全有限的输入可致平方和超 FP32 上限、rstd 下溢为 0；部分路径公共缓冲仅 8 个 FP32 槽却访问第 9 个 RMS 倒数槽。
effect:
  objects:
  - 数值结果
  detail: RmsNormDynamicMxQuant 两个 1e20 bf16 → y=[0,0]、rstd=0（修后 [1,1]）；RMSNormQuantV3 交替 ±1e19、gamma=8 → 0 而非 ±8；AddRmsNormQuant 大 epsilon 时 y1 全 0。
  visibility: 静默错误
mitigation:
  detect: 用 1e19–1e20 量级有限输入、gamma 取 2^67/8、epsilon 取 FLT_MAX 与常值两组对照，回读 rstd 与 y；同时检查每核 9 行场景下 RMS 倒数槽的申请字节数（应为 96B 而非 24B）。
  fix: PR 16328（RmsNormDynamicMxQuant）、16321（RMSNormQuantV3）、16338（AddRmsNormQuant）均见 GitCode，open，合并与发布未核实。
