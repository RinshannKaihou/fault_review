remarks: 与训练库 TRN-0397（AddRmsNormQuant 大 epsilon/大数溢出错量化）同属 RegBase 归一化归约在 FP32 中溢出；本条覆盖推理侧 RmsNormDynamicMxQuant/RMSNormQuant 与 AddRmsNormQuant 三个算子。
