title: Median/NanMedian 误把负 subnormal 计为 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: Median radix NaN 统计
  behavior: PreProcess 原地把浮点输入转 radix key 后，OnRadixInputLoaded 又把已改写数据按浮点统计 NaN：负 subnormal 的 key 位模式恰为 NaN，被误计入 NaN 统计。
effect:
  objects:
  - 数值结果
  detail: 输入完全不含 NaN/Inf、只含负 subnormal（[-1e-38,-1e-40]）时，Median 的 NaN 传播与 NanMedian 的非 NaN 中位秩被破坏，中位数值与 int64 索引双错（修复前精度失败、修复后零容差通过）；正 subnormal 对照不受影响。
  visibility: 静默错误
mitigation:
  detect: ND FP32 输入取值压到负 subnormal 区间（如 [-1e-38,-1e-40]）跑 Median/NanMedian 与 golden 比对。
  fix: 修复 PR 含可复现 CSV 用例 median_sch02_fp32_negative_subnormal 与 nan_median_sch02_fp32_negative_subnormal（零容差，修复前失败修复后通过；修复单合入/发布状态未核实）
