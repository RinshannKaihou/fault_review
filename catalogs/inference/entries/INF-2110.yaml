original:
  mechanism: Ascend 950 的 Median/NanMedian 在多核 radix 路径中把输入中的负 subnormal（次正规数）误计为 NaN，导致中位数和索引错误；输入本身可以完全不含 NaN/Inf。根因位于 index/kth_value/op_kernel/arch35/common/kth_value_radix_more_core_base.h：PreProcess 原地将浮点输入转换为 radix key，随后 OnRadixInputLoaded 又将这段已改写的数据按浮点值统计 NaN——FP32 负 subnormal 位模式 0x80000001 转换为 key 0x7ffffffe，后者按 FP32 解读就是 NaN。Median 的 NaN 传播与 NanMedian 的非 NaN 中位秩计算因此受影响；即使正确中位数是普通数值，只要输入含这些负 subnormal 就可能触发。复现：Ascend950DT_9574、CANN 9.3.0、TTK v3.0.0 build 8b3f093，ND、FP32、shape=(1,1,151992)、dim=-1、取值 [-1e-38,-1e-40] 全负 subnormal，经 TTK release kernel 通路执行并与仓库 golden.py 比对 values/int64 indices，命中 schId=2、tiling key=258；修复 PR 附 CSV 用例 median_sch02_fp32_negative_subnormal 与 nan_median_sch02_fp32_negative_subnormal（零容差，修复前精度失败修复后通过）；正 subnormal 为对照场景不受影响。
  source: https://gitcode.com/cann/ops-nn/issues/7143（open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 输入数据里只要混入 FP32 负 subnormal（约 -1e-38 到 -1e-40 量级的极小值），Median/NanMedian 的中位数值和索引就可能错——这些数会被当成 NaN 处理：Median 可能传播出错误中位数，NanMedian 的忽略 NaN 语义把这些合法小数排除。数据不含任何 NaN/Inf，也无报错。
  trigger_surface: Ascend950DT_9574、CANN 9.3.0、Median/NanMedian 多核 radix 路径（schId=2/tiling key=258）、ND FP32 含负 subnormal。
  discovery: 2026-10-21 每日扫描
