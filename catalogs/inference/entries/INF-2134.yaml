original:
  mechanism: transformers 5.17.0（同码至 v5.20.2 与 main 73d9b84f）integrations/finegrained_fp8.py 的 Fp8Dequantize._dequantize_one 以 block_m = rows // scale_rows 从 scale 网格反推块尺寸。DeepSeek 式块 FP8 检查点的 weight_scale_inv 是 [ceil(M/128), ceil(K/128)]，尾块为部分块：(1) rows%scale_rows!=0 时直接 ValueError——DeepSeek-V3/R1 每层 self_attn.kv_a_proj_with_mqa.weight [576,7168]（kv_lora_rank 512+qk_rope 64）scale [5,56]，故无 GPU 机器（自动回退 dequantize）与 CC<8.9 GPU 上这些检查点无法加载；(2) 除法恰好整除时（如 [192,K] 配 2 行 scale 网格）用 96 而非 128 的块尺寸，加载成功且权重错。非反量化路径（FP8Linear）按 (out_features+block-1)//block 分配 scale 行，同检查点在 FP8 GPU 上正常。CPU 复现：按真实 MLA 维度构造 DeepSeek-V3Config 小检查点 + 128×128 块量化 + ceil 网格，CUDA_VISIBLE_THREADS 为空加载即触发。
  source: https://github.com/huggingface/transformers/issues/49873（transformers 5.17.0/5.20.2/main 73d9b84f，CPU 复现）
  behavior: DeepSeek-V3/R1 等块 FP8 检查点在 transformers 里走反量化加载（无 GPU 或算力<8.9 自动回退）时：要么因 576 维 MLA 投影的尾块直接 ValueError 无法加载；要么在维度恰好整除的层用错块尺寸（96 而非 128）成功加载但权重数值错误，推理输出静默偏差。GPU FP8 直载路径不受影响。
  trigger_surface: transformers ≥5.17 + DeepSeek 式 128 块 FP8 检查点 + dequantize 路径
  discovery: 2026-10-22 每日扫描
