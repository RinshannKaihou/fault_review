  mechanism: 'EulerOS 2.0 + Ascend 910B4 + CANN 8.3.RC1 + mindspore 26.0.0a1：用 msprobe compare -m offline_model 做「om 模型自身前后比对」（目标是把 fp32 onnx 经 atc 转成 om 前后的推理精度对齐）。工具链路是先用 atc --mode=1 把 om 转成 json（日志可见 ''Start to converting the model to json'' 与 ''Complete model conversion to json''），再分别 dump npu 与 npu_golden 两侧数据，最后调 msaccucmp.py compare -m/-g/-f/-cf 生成 result.csv。比对结束时日志出现 ''WARNING the original name: PartitionedCall_/fc2/Gemm_add_9:0:9 of net output maybe not correct!''，result.csv 结果全部是 NAN。issue 未进一步定位是 net output 名映射失败还是两侧 dump 目录错配，也没有修复 PR；用户在正文里同时贴了 -gp/-tp 两种写法的命令。'
