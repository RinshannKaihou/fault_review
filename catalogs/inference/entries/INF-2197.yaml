title: BlockSparseAttention 超大掩码偏移 uint32 回绕错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: block_sparse_attention 偏移
  behavior: 展平偏移（kvseqlen×blockShape 乘加）用 uint32 承载，超 2^32 回绕，寻址错位产生精度问题
effect:
  objects:
  - 数值结果
  detail: kvseqlen=10M、blockShape=128 时（展平偏移 ~1.28e9×块数超 2^32）ATK 双标杆精度不通过；修复 PR 将偏移计算提升为 uint64_t 后转换
  visibility: 静默错误
mitigation:
  detect: 超大 kvseqlen×blockShape 用例与 ATK 双标杆对照
  fix: 修复 PR https://gitcode.com/cann/ops-transformer/merge_requests/14632 （open，未发布）：计算相关偏移时数据类型提升为 uint64_t，确保乘法前完成类型转换
