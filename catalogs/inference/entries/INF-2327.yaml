id: INF-2327
legacy_ids: []
slug: msprobe_cosine_overflow_misjudge_zero_vector
aliases: []
title: msprobe Cosine 比对大数溢出与微小值误判为全零
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: cann
    component: alg_cosine_similarity 计算
  behavior: compare 直接用原始数值算点积与 L2 范数（float64 机器精度判零向量）：有限大数平方溢出产生 inf/inf、0/inf 错误结果；微小非零向量范数下溢被判为全零，正交/反向微小向量返回 1.0。
effect:
  objects:
  - 测试判定
  - 指标/日志
  detail: 相同大数向量 [1e200,1e200] 报 NaN 并提示数据含 NaN（应为 1.0）；大数与普通非平行向量返回 0.0（应为 0.7071）；正交/反向微小非零向量返回 1.0（应为 0/-1）。真实方向差异被掩盖，精度定位结论错误。
  visibility: 静默错误
mitigation:
  detect: 构造 [1e200,1e200] 与 [1e-200,0] 两类边界用例检查比对结果；结果应为 1.0/0 而非 NaN/1.0。
  fix: 待定（issue 附修复方案：按各自最大绝对值归一后再算点积与范数，仅真全零走零分支；未见修复 MR 合入）
