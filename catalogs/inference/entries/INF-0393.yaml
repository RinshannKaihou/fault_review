  meta: '`ambiguous`（SGLang diffusion 服务路径 `--tp-size 2` 输出图像被**致密多色 chroma speckle 噪点**覆盖（平滑区域尤甚）、构图保持正确；同 prompt/配置 `--tp-size 1` 干净。跨引擎同构：vLLM-Omni 独立 TP 实现（PR #7759 分支）在 TP=2 呈**相同损坏**、单卡干净（对侧 vllm-project/vllm-omni#8135）。排除证据链：(1) flash-attn 自建 sm_120 换 sdpa 后 vLLM 侧损坏不变；(2) 两卡互换 rank 损坏不变；(3) NCCL 传输专项测试 bf16/fp16/fp32 all-reduce vs Gloo fp64 参考误差恰为正常舍入（fp32≈4e-8、fp16≈半 ULP、bf16≈1 ULP）、4096² 50 轮压力零 NaN/Inf；(4) 单卡同 offload flags 干净排除 offloader。假设（报告者）：Qwen-Image-2.1 单流联合 text+image attention + per-head QK-norm（zero-centered RMSNorm、fp32、weight+1）+ AdaLN 调制 MLP——若**调制输出或 norm 状态按普通 FFN 语义切分/all-reduce**，部分和求和恰好产生这种轻度保结构损坏） · Cov: `NEW`（DiT TP 分片把 per-head/调制的**不可切分状态当普通 FFN 切分**子签名；与 5.34 MiniCPM 局部 RMS 分母（attention 侧 norm×TP）同属"归一化×切分"交叉域但本条在调制/norm 状态维度且跨双引擎验证） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: 双独立引擎同构损坏 + NCCL 清白 + rank 交换不变，把根因收敛到两侧共享的"vLLM 式 parallel-layer 切分约定 × 该 DiT 的单流 norm/调制结构"交互；精确张量位点未定位（报告者提供 side-by-side PNG/像素差分图与 NCCL 测试脚本于请求）。混合异构卡（RTX 5070 Ti + 5070、均 sm_120、WSL2）环境。
