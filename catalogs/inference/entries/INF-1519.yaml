title: 多 token 调用致设备对该算子路径持久降级
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: npu_recurrent_gated
  behavior: 传入单序列多 token（actual_seq_lengths 元素>1）且 state 缓存 slot 数不足时，该算子多 token 路径失败。
effect:
  objects:
  - 可用性/进度
  detail: 首次报 507057，重启容器后报 507035；npu-smi 仍 Health=OK、常规健康检查通过，跨进程/容器不恢复，非 root 无法 reset；其它算子负载正常。
  visibility: 报错
mitigation:
  detect: 同一卡上依次用 actual_seq_lengths=[1] 与 >1 调用，再重测此前通过的 [2,2]；查 npu-smi health 与 plog
  fix: 待定（issue open；报告者建议补 slot 数/形状参数校验与约束文档，恢复需 root 复位）
