  signature: 偏 ON-manifold：隐藏态是由正确的 target 模型算出来的，因此逐 token 的状态看上去都健康，故障活在 post-softmax。geometric 检测器 MISS 掉它；签名在输出轨迹上（n-gram 统计、acceptance-rate 分布）。之所以标为 ambiguous，是因为它是否显形取决于草稿模型与 target 的一致程度以及具体输入。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）
  repro: 以后处理形式注入——按 buggy 的接受准则（off-by-one 或错误 clamping）重采样输出 token 分布，无需改动前向计算图。
