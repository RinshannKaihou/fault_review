legacy_ids: []
slug: cann_all_uint8_out_truncates_self_values
aliases: []
title: CANN aclnnAll out=UINT8 输出数值截断非布尔
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnAll out dtype 路径
  behavior: out dtype 为 UINT8（资料列为支持）时，kernel 不做 all() 归约，而是把 self 的数值直接截断成 UINT8 写入 out；out=BOOL 路径正确。
effect:
  objects:
  - 数值结果
  detail: '[100,200,300,400]→[100,200,44,144]（300%256=44），[0.1..0.8]→[0,0,0,0]；BOOL 对照 [1,1,1,1]。多 self dtype 均错，两段返回 0，静默脏数据。'
  visibility: 静默错误
mitigation:
  detect: 用 BOOL 对照或断言 out 值域∈{0,1} 可发现
  fix: 待定（issue 未附修复）
