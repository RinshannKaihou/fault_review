id: INF-1885
legacy_ids: []
slug: mindie_multimodal_size_limit_config_not_propagated
aliases: []
title: 多模态大小限制不透传，Python 侧仍按 20MB 拦
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: 通用
    component: 多模态输入大小校验
  behavior: C++ 侧读到 maxImageFileSizeMB 并打印，但未透传到 Python tokenizer，后者仍按默认 20MB 拦截；maxRequestLength 超限时 413 文案固定写 512MB
effect:
  objects:
  - 可用性/进度
  - 指标/日志
  detail: 配置 maxImageFileSizeMB=40 后，40MB 以内图片仍被拒，报 The size of image_url cannot exceed 20.0 MB；请求体超过 maxRequestLength 时返回 413，文案固定写 512MB，与配置不符；图片近 20MB 阈值时必现。
  visibility: 报错
mitigation:
  detect: 启动后比对 infer_tokenizer.cpp 打印的 image/audio/video 上限与 Python 侧实际拦截阈值；把 413 文案与实际 maxRequestLength 配置对照
  fix: issue 称已提交对应修复 PR（正文未给链接，未核实是否合入）；规避：手工导出环境变量让 Python 侧取到同一阈值
