original:
  mechanism: '服务化部署多模态模型时，输入大小限制在整条校验链路上不一致。配置 ServerConfig.maxRequestLength=50、MultimodalConfig.maxImageFileSizeMB=40 后：C++ 侧确实读到了配置，infer_tokenizer.cpp:43 打印 Init multimodal env from config: image=40MB, audio=20MB, video=512MB, total=1000MB, pixels=100000000；但请求进入 Python 侧后仍按默认值判断，tokenizer.py-648 抛 The size of image_url cannot exceed 20.0 MB（InferTokenizer::DownloadUrl），40MB 图片被 20MB 默认阈值拦掉，说明配置值没有透传给 Python tokenizer 进程。另一处是 HTTP 层：请求体超过 maxRequestLength 时返回 413，文案写死 Maximum allowed size is 512MB，与配置的 50（单位由服务解释）无关，用户据此无法判断实际生效的阈值。预期是 413 文案回显配置值、多模态各项上限与服务配置一致、且无需手工导出环境变量就能透传。'
  source: '2026 GitCode Ascend/MindIE-LLM issue #328 https://gitcode.com/Ascend/MindIE-LLM/issues/328（closed，附修复 PR 说明；MindIE 26.0.0.B070 + CANN 8.5.1，Atlas A2）'
  behavior: 给多模态服务配了 maxRequestLength 和 maxImageFileSizeMB（比如 40MB），但发 40MB 以内的图片仍被拒，报 The size of image_url cannot exceed 20.0 MB；请求体超限时返回的 413 又固定说上限是 512MB，和自己配的数完全对不上。看起来配置没生效，只能手工设环境变量绕过。
  trigger_surface: MindIE 多模态服务化 + 自定义 MultimodalConfig/maxRequestLength；图片接近默认 20MB 阈值时必现
  discovery: 2026-10-21 GitCode 历史 issue 扫描（mindspore/ms* 簇）
