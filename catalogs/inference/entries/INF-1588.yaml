cause:
  objects:
  - subsystem: 量化
    stack: 通用
    component: moe_init_routing_v3 量化路径
  behavior: MXFP4 的 scale 每行字节数用 cols/32 整数除法算，cols 非 32 倍数时余数被丢、逐行搬运起点漂移；静态量化全载模板按全部源行分配 buffer 却逐行 Compute(1)，小 cols 时写越 buffer。
effect:
  objects:
  - 数值结果
  detail: cols 非 32 倍数时 scale 错位，量化输出精度固定在约 33%；小 cols 多核时 64B Store 对齐溢出 buffer、踩踏相邻 UB 触发 AIV error；另有 golden 量化判据问题。
  visibility: 静默错误
mitigation:
  detect: quantMode=0/9/13 下取 cols 非 32 倍数（如 33/48/65）核对 scale 逐行落点与量化输出；小 cols、多核场景加 mssanitizer memcheck 查 UB 越界
  fix: 待定（issue closed，正文未附修复 PR；期望方向为 scale 行字节数改对齐上取整、量化输出改用 ULP 判据）
