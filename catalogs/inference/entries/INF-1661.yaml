id: INF-1661
legacy_ids: []
slug: ops_nn_gather_elements_v2_no_index_range_check
aliases: []
title: aclnnGather 负/越界索引静默回绕或越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: scalar 内核索引寻址
  behavior: gather_elements_v2_scalar.h 把 xGatherPos 直接乘 xPostDim_ 算 GM 偏移，无 [0,gatherDim) 检查；负索引转无符号成巨偏移，越界读或回绕到最后一行。
effect:
  objects:
  - 数值结果
  detail: 910B3 + CANN 9.1.0-beta.3 源码编译包、self[4,2] fp32、dim=0：index[0][0]=-1 时两段接口全 0 且 out[0][0]=6.0（当最后一行）；-1000000 时 out[0][0]=0.0 垃圾值。
  visibility: 静默错误
mitigation:
  detect: 用含 -1 与极大负值（-1000000）的 indices 调 aclnnGather，与 torch.gather 行为对照；API 返回 0 但结果不同即命中。
  fix: 'issue 4456 closed；正文只给根因位置与期望（索引先校验 [0,size(dim))），未给修复 PR。同族 #4762/#4765/#4771/#4772 为 embedding_bag、gather_elements_v3、scatter_elements_v2、scatter_list 的同一缺校验。'
