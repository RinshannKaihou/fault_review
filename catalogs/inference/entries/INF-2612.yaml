title: SGLang SSM state 用 bf16 长推理掉 8 分
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: sglang
    component: mamba_ssm_dtype 状态存储
  behavior: 显式将 --mamba-ssm-dtype 设为 bfloat16 后，GDN 循环状态按 bf16 存储；每一步 decode 累加更新时，bf16 的 8 位尾数在长链上累积舍入误差。
effect:
  objects:
  - KV状态
  - 输出内容
  detail: Qwen3.5-9B MATH-500 thinking 1000 次生成：float32 0.663 → bf16 0.584（−0.079±0.015），16k 截断 285→370；float16 同 2 字节无损失。
  visibility: 质量退化
mitigation:
  detect: 固定模型与采样参数，只在 --mamba-ssm-dtype float32/bfloat16/float16 间切换跑长推理评测（MATH-500 thinking、16k 预算），同时统计 finish_reason=stop 与截断数；GSM8K 式短评测会漏检。
  fix: 待定（issue open；float32 是模型默认，bf16 需显式开启）
