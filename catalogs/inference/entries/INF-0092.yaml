  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（Blackhole ELWMUL dest-reuse 累加到最高 dst_index 的最后 tile face-3 数值损坏，每 8-tile 组恒命中第 8 个） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: Blackhole 上 ELWMUL（FPU 乘法）配 dest reuse（`DEST_TO_SRCA`/`DEST_TO_SRCB`）时，累加目标为 DEST bank 最高 `dst_index`（32×32 tile 下 index 7）的最后一个 tile 返回错误值；损坏**严格限于该 tile 的 face 3**，faces 0–2 与 golden 一致。bfloat16 in/out、HiFi4、224 累加 tile 配置下 28/224 输出 tile 受影响，且恒为每 8-tile 组的第 8 个——DEST bank 填满时的边界路径（最高 dst_index 的 face-3 数据通路）在 dest-reuse 模式下数值错误。`DEST_TO_SRCA` 与 `DEST_TO_SRCB` 均复现，LoFi/HiFi2 亦复现（与精度无关）。
  source: 'tt-metal #53693（2026-08-19 open，附 parameterize `test_eltwise_binary_dest_reuse` 的最小复现：32×32 tile 用 `[256,32]` output_dimensions 填满 bank 后 4 个用例失败）。相关调查 #53631（MOVD2B handoff 在 `*_reuse_dest_srcb` LLK 中 SrcB DVALID 未排空前置 math）、修复线索 #53655（custom MoE dest-reuse LLK stale source-valid waits）。https://github.com/tenstorrent/tt-metal/issues/53693'
  behavior: 无 crash。数值静默损坏且**空间模式规则**（每 8-tile 组最后一个 tile 的 face 3）——GEMM/elementwise 大 shape（填满 DEST bank）下输出系统性偏离 golden，小 shape（不触及最高 dst_index）完全正确，形成"小测试通过、大负载损坏"的盲区。属「DEST bank 最高 dst_index 边界 × dest-reuse 数据通路」**新子签名**。
  trigger_surface: Tenstorrent Blackhole；ELWMUL + dest reuse + 足够多累加 tile 填满 DEST bank（32×32 tile × ≥8 组）
  discovery: 2026-08-19 每日扫描。
