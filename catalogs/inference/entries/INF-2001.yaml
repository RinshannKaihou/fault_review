id: INF-2001
legacy_ids: []
slug: pd_proxy_decoder_score_double_release
aliases: []
title: PD 代理重算失败重复释放 decoder 分数致永久偏载
kind: 故障
status: active
cause:
  objects:
  - subsystem: 调度/服务
    stack: vllm
    component: load-balance proxy 调度器
  behavior: reassign_instances 已释放旧 decoder，重试 prefill 失败或取消后 finally 用旧 instance_info 再释放一次；active_tokens 无下界，变负后 min-heap 永选它
effect:
  objects:
  - 性能/资源
  detail: PD 分离代理示例中，重算重试失败或客户端提前断开时，同一 decode 节点负载被扣两次，active_tokens 变负后持续被选为最闲，请求集中该节点，其他 decode 空闲；日志看不到异常，仅延迟和排队变差，重启前不自愈。
  visibility: 性能退化
mitigation:
  detect: 构造 stop_reason=recomputed 且重试 prefill 失败/客户端断连，打印 SharedProxyScheduler 的 active_tokens，看是否变负且 pick_decoder 恒选同一节点
  fix: '释放前校验归属（保证只释放一次）并给 active_tokens 加 max(0,...) 下界；issue 未附修复 PR，同族 #14967 由 #11850 修，本条修复未核实'
