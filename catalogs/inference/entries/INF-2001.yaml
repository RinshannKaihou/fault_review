original:
  mechanism: vllm-ascend 代理示例脚本的 SharedProxyScheduler（2026-09-14 main0914）。generate_stream 收到 stop_reason=recomputed 的 chunk 后调 reassign_instances，后者已对旧 decoder 执行 release_decoder；随后 assign_instances(is_initial_request=False) 重新预填，若该 prefill 失败（5xx/连接）或被 asyncio.CancelledError 取消，只回滚新 prefiller 的 KV，异常向上抛，generate_stream 的 finally 仍以旧的 instance_info 调 _finish_instance → finish_request → _release_load(DECODE, active_tokens=True)。_release_load 对 active_kv_cache 有 max(0.0, ...) 夹紧，对 active_tokens 没有下界，于是旧 decoder 的分数被扣两次。issue 用 FakeServer + min-heap 复现 active_tokens=-1000 后 pick 恒返回 d0，并在真实类和 main0914 调用序列上确认。
  source: 2026-09-14 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/16517 （closed）
  behavior: 只要一次重算重试失败或客户端提前断开，代理就把同一个 decode 节点的负载扣两次：该节点 active_tokens 变负，此后每个请求都被判成「最闲」而被选中，真实负载全压在一个节点上，其他 decode 长期空闲。代理日志里看不到异常，表面只是延迟和排队变差，重启代理前不会自愈。
  trigger_surface: PD 分离 + load_balance_proxy_server_example.py 的重算重试失败/取消路径
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
