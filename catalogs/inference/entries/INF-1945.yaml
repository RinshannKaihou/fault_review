  behavior: L1 采集对 autograd.Function 子类只采到 forward 内的 torch api，backward 里的 grad_output.t().mm(input) 等调用一条都采不到，也不提示该层反向未被覆盖
effect:
  objects:
  - 指标/日志
  detail: msprobe L1 采集自定义 autograd.Function 子类时，dump 中 forward 段有数据、反向段为空且不提示漏采；按层逐条检查才发现缺了一段。GPU+torch_npu 示例中出现。
  visibility: 静默错误
mitigation:
  detect: 采集后按层核对 forward/backward 两段是否都有算子记录，对缺失反向的层改用 module 级或 tensor 级补采
