id: INF-1736
legacy_ids: []
slug: mhc_sinkhorn_bwd_inputsum_buffer_32b_short
aliases: []
title: mhc_sinkhorn_backward sum 缓冲小 32B 越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: mhc_sinkhorn_bwd UB 缓冲
  behavior: sum 的 DataCopyPad 写 32 float(128B)，而 Init 只按 tUbFactor×nAlignSize=24 float(96B) 分配 inputSumQue_，越界 32B。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: tUbFactor=3<nSize_=4 且 perloopSize%8!=0 时 mssanitizer 报 illegal write 32B @0x820，越界落点 0x880 正是 CopyOut 输出缓冲，连带 160/96 字节未初始化读。
  visibility: 静默错误
mitigation:
  detect: 小 T（每核 token 数<8）且 perloopSize%8!=0 的用例走 mssanitizer memcheck/initcheck，并给示例补 CPU 参考断言
  fix: 把 inputSumQue_ 每缓冲尺寸改为 max(normCorePerLoopTSize*nAlignSize_, nSize_*INDEX_BLOCK_LEN)（issue 建议，未核实合入）
