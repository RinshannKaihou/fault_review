original:
  mechanism: 'ops-transformer issue #4282（ascend950，mssanitizer 工具检测，closed）：mhc_sinkhorn_backward 上 memcheck 报 illegal write of size 32 @0x820 与两条 uninitialized read（160B/96B），作者用插桩日志定位到同一条根因——CopyInNormAndSumPad（mhc_sinkhorn_backward_simd.h:329）里 sum 的 DataCopyPad 按 nSize_(=4)×INDEX_BLOCK_LEN(8)=32 float=128 字节写入，步长 32 字节，落点 0x820/0x840/0x860/0x880；而 Init（simd.h:142）给 inputSumQue_ 分配的是 normCorePerLoopTSize(=3)×nAlignSize_(=8)=24 float=96 字节/缓冲。写 128 字节、只分配 96 字节，第 4 块（0x880 起）越界 32 字节，正好落在相邻的 CopyOut 输出队列缓冲上，把输出缓冲前 32 字节写脏；CopyOut 再拷整段输出时，普通核有 192-32=160 字节、尾核 128-32=96 字节未初始化，数字与日志完全吻合，三条报错是同一越界在不同核上的连锁反应。触发条件为 normCorePerLoopTSize(tUbFactor)=3 < nSize_=4 且 perloopSize%8!=0（走 pad 分支），即小 T、每核 token 数小于 N。建议按 max(tUbFactor*nAlignSize, nSize_*INDEX_BLOCK_LEN) 分配。'
  source: 2026-08-12 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/4282 （closed）
  behavior: 小 T 的 Sinkhorn 反向（每核分到的 token 数小于 N、且不是 8 的倍数）时，越界写会踩到相邻的输出缓冲，反向结果里混进未初始化数据，但调用本身不报错、shape 正常；示例程序也不做结果断言，所以除了 mssanitizer 报 illegal write 32B 与两条 uninitialized read，用户侧看到的就是算出来的梯度悄悄不对。
  trigger_surface: ascend950 + mhc_sinkhorn_backward + normCorePerLoopTSize< nSize_ 且 perloopSize%8!=0（小 T 走 CopyInNormAndSumPad）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
