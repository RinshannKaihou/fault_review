  meta: '`infra_off`（`ttnn.sort` Single Row Single Core 工厂（padded 宽 ≤2048，非 2 幂宽 sort 全走此工厂）：sort 维 pad 到 2 幂时用应排最后 的哨兵值（float 的 ±inf / uint16 的 0/65535）——**输入自身含该值时真实元素与 padding 并列**，`stable=False` 按位置破并列使 padding 元素（index ≥ n）混入返回行：实测 n=100 descending 时 128 个越界 index、n=1000 时 768 个（全 padding 混入）；**values 全对、只有 indices 错**，任何下游 gather/scatter 用这些 index 即 OOB 读。MultiCore DRAM 工厂同病已被 #58600 修复（#53326），Cross Core 工厂用 index-aware 比较器无恙） · Cov: `var:ttmetal_sort_bf16_integer_collapse_nondeterministic_index`（1.23 ttnn.sort 损坏族——同为 sort op 返回索引损坏，但 1.23 是 bf16 整数值坍塌、本条是 padding 哨兵值与真实值并列把 pad index 泄入返回值） · 触发 `hw_specific` · 置信度 `verified`'
