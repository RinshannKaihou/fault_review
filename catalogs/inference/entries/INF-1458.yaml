original:
  mechanism: 'vLLM issue #62554（c2026-10-19，4×H100 NVLink，v0.27.2rc1.dev，NCCL 2.30.7）：RL 部署 packed NCCL 权重更新后 weight checker 报权重不匹配、同更新的推理副本互相不一致，仅 fused MoE w13_weight 受影响。机制：packed_nccl_broadcast_consumer 把每个 pack 收进 num_buffers 个 slot stream 之一的 fresh torch.empty，再以视图传给 post_unpack_func；layerwise reload（online_process_loader）保留视图直到该层权重齐全，然后在完成该层的 pack 回调里于该 pack 的 stream 上重放缓冲加载并立即丢弃视图（info.reset()）。当一层跨多个 pack 时：(1) 另一 slot stream 上的缓冲失去最后引用，caching allocator 把它归还该 stream 池——allocator 不知道排在别的 stream 上的重放仍在读它；(2) 该 stream 的下一次接收（pack N+1）常分到同一块，NCCL 在重放拷贝仍在飞时写入 pack N+1，拷贝读到 pack N+1 字节。num_buffers=k 时暴露条件为 pack 偏移 ≥k 且非 k 的倍数，即层须跨 ≥k+2 packs。默认 num_buffers=2 在某 trainer 发送布局下稳定触发、另一布局不触发。'
  source: 2026-10-19 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/62554 （open）
  behavior: RL/在线学习场景用 packed NCCL 更新 MoE 权重后，部分专家权重静默变为错误内容：weight checker 报不匹配，多个收到同一更新的推理副本彼此答案不同。默认双缓冲配置下，当每层权重的传输跨越足够多个 pack 时稳定发生，无任何报错。
  trigger_surface: packed NCCL 权重更新（packed=True）+ layerwise reload + MoE（fused w13 拼装层）；trainer 发送布局每专家层 ≥num_buffers+2 packs；v0.27.2rc1.dev3331 实测（main 的 packed_tensor.py 同样复现）
