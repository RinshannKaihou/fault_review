  meta: '`ambiguous` · Cov: `NEW` · 触发 `other_stack`⚠ · 置信度 `documented`'
  mechanism: 在 `use_paged_context_fmha` + `enable_chunked_context` 下，由 chunk 位置推出的 block/slice 索引会超出每请求 KV 缓冲区（报错原文为 "slice 2044 exceeds buffer size 420"）；开启 `enable_kv_cache_reuse` 会让它更早触发。触发条件是高并发 / 小 `max_num_tokens`。
  source: 'TensorRT-LLM #1377（同类 #1480）。'
  behavior: 负载下输出被静默截断；其中一部分会命中缓冲区溢出异常——真实模式是崩溃，而不是静默乱码。
  trigger_surface: TensorRT-LLM 专用；vLLM 无直接等价除非同概念
  signature: 源文档未给出隐藏态签名字段。按其行为效应可以确定的是：崩溃路径没有隐藏态可测，截断路径缺的是 token 而不是状态（截断前的隐藏态本身正常），因此对 geometric/spectral/trajectory/statistical/infotheoretic 各族基本不可见，只能靠输出长度与异常计数这类带外信号发现。族记为 `ambiguous`，因为它完全受并发度与 `max_num_tokens` 门控。
  repro: 源文档标 partial；能注入的只是「越界 slice 读到缓冲区其他位置内容」这一推测性的非致命分支，即在单层把一段尾部位置的 KV 行替换为缓冲区中其他位置的行。崩溃与截断本身不属于隐藏态可观测范围，因此这条注入的可信度低于其余条目。
  locus: index-position
  priority: low
