original:
  category: cat14
  section: 第 14 类 · 长上下文能力失效（model_on — 健康模型的盲点）
  meta: '`model_on` · Cov: `var:14.8` · 触发 `n/a` · 置信度 `verified`'
  mechanism: 超出单 needle 检索之后，聚合（aggregation）、变量追踪（variable tracking）、多跳（multi-hop）任务需要跨层、跨位置的多步 attention 路由；这类路由在长上下文下先于单点检索崩溃。RULER 的测量结果是：NIAH 在 32K 仍然通过时，模型的有效上下文（effective context）已经塌缩到 4–8K。
  source: Hsieh et al.（NVIDIA），"RULER", NeurIPS 2024, https://arxiv.org/abs/2404.06654 。
  behavior: 在单 needle 检索仍然工作的长度上，聚合／变量追踪任务出现陡峭的准确率悬崖；模型自信地给出错误的计数或丢失的中间状态。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。签名属 TRAJECTORY + SPECTRAL 混合族：多跳需要跨层／跨位置的连贯 attention 路由，而 dispersion（14.2）加低秩化（14.1）会把这条路由打断，表现为逐层轨迹的连贯性下降。geometric 族的激活范数检测器完全不响应；单 pass 的 statistical 度量也看不到，必须做跨层轨迹或 attention 谱度量。
  repro: 仅提示集构造，无模型改动——按 RULER 的 aggregation / variable-tracking 任务族生成长度扫描样本，与同长度的单 needle NIAH 对照，记录逐层轨迹度量；promptset-only，不挂钩子。
