  mechanism: InfiniGen 用"提前一层"的推测预取：以第 i−1 层的（偏斜的）注意力分数预测第 i 层需要哪些 token，从 CPU 预取到 GPU 工作集。当真实注意力与推测偏离时，一个关键 token 虽然在 CPU 上存在，却不在 GPU 工作集中，于是在本层不可见。
  source: arXiv:2406.19707（OSDI'24）。
  behavior: 偶发的、与输入强相关的信息丢失——同一模型对多数请求正常，对少数注意力模式跨层跳变的请求答错。
  trigger_surface: 非 vLLM 一等实现
  signature: 由"层间注意力分数是否一致"门控，属 ambiguous。签名是**本应落在被丢弃 token 上的 softmax 质量被重新分配**——statistical（注意力分布相对全量参照的 KL / 质量迁移）与 infotheoretic 最直接；由于剩余 KV 全部健康，geometric 的流形距离几乎不动，属漏检族。trajectory 可见受影响层的局部扰动但幅度小。
  repro: partial——在层 i 的 attention 钩子里，用层 i−1 的注意力分数取 top-k 决定层 i 可见的位置集合，其余位置屏蔽，复现"跨层推测失配导致关键 KV 不可见"；CPU/GPU 卸载与预取路径不复现。
  locus: eviction-compression
  priority: medium
