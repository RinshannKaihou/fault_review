  meta: '`ambiguous` · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
  mechanism: Rust 实现的 "fast" tokenizer（tokenizers 库）与 Python 实现的 "slow" tokenizer（SentencePiece）在归一化规则、unknown/special-token 处理、或 OOV/词表边界处理上不一致，于是同一段文本被切成不同的 token 序列。
  source: 'HF transformers #29159。Survey arXiv:2506.09713。'
  behavior: 从静默的细微漂移，一直到在特定输入上产生彻底错误的 token。
  trigger_surface: tokenizer/template 选择
  signature: 完全取决于两条路径是否真的产生了不同的 input_ids。若 ids 不同：embedding lookup 序列被扰动，受影响位置出现小幅 geometric 漂移，需要逐位置的度量才看得见。若两条路径在 ids 上一致：**没有任何隐藏态签名**——这是本族里的结构性盲点之一，只能靠对比两条 tokenize 路径的输出来发现。
  repro: 只能部分注入——需要同时具备 fast 与 slow 两套 tokenizer 且找到真实分歧的输入；更实际的做法是手工构造一对"仅在少数位置不同"的 ids 序列来模拟其隐藏态效果。
