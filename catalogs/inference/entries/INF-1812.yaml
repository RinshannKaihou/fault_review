- url: https://gitcode.com/cann/ge/issues/327
  kind: gitcode_issue
relations: []
original:
  mechanism: 报告者是 GE 开发者，对比两条链路的默认取值：离线推理场景 precision_mode 未显式指定时会落到偏性能的默认策略，op_select_implmode 未显式指定时默认走 high_performance；在线 TorchAir 路径显式设置 ge.opSelectImplmode=high_precision。同一模型、同一输入、同一硬件下因此出现数值分歧，RMSNorm 这类对中间数值范围敏感的子图表现最明显（ReduceMean、Rsqrt、Softmax、Attention 同类）。提单诉求是新增能力，让在线与离线可以显式对齐精度模式与算子实现模式；正文未给具体版本号与修复 PR，issue 仍为 open。
  source: 2026-04-20 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/327 （open）
  behavior: 把 Hugging Face 模型导出成离线 OM 部署时，在线 HF + TorchAir 推理结果正常、ONNXRuntime 参考结果也正常，但同一模型同输入的离线 OM 结果明显偏差，且不是轻微误差而是整段推理结果异常；按算子逐层 probe 后发现是离线路径的默认精度/实现模式与在线不同，用户很难想到同为 GE 的在线与离线默认策略并不一致。
  trigger_surface: 离线 ATC→OM 链路未显式配置精度模式与算子实现模式，模型含 RMSNorm/Reduce/Softmax/Attention 等敏感子图
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
