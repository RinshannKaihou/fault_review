id: INF-1812
legacy_ids: []
slug: online_offline_precision_mode_default_mismatch
aliases: []
title: 在线离线默认精度模式不一致致 OM 数值偏差
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: cann
    component: ATC 精度模式默认值
  behavior: 离线 ATC 未显式指定时 precision_mode 落到偏性能默认策略、op_select_implmode 默认 high_performance，在线 TorchAir 显式设 high_precision。
effect:
  objects:
  - 数值结果
  detail: 离线 ATC→OM 未显式配置精度/实现模式、模型含 RMSNorm 等敏感子图时：同一模型同一输入，在线 HF+TorchAir 与 ONNXRuntime 正常，离线 OM 明显偏差、整段推理异常；逐层 probe 后定位为离线默认精度/实现模式与在线不同，用户很难想到两者默认策略不一致。
  visibility: 静默错误
mitigation:
  detect: 同一模型分别跑在线 TorchAir 与离线 OM，逐层比对；核对 atc 的 precision_mode / op_select_implmode 是否与在线一致
  fix: 显式指定 atc --precision_mode 与 --op_select_implmode 对齐在线设置；issue 仍 open，正文未给修复 PR
labels:
  stage: N/A
  confidence: documented
