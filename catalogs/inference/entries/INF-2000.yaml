original:
  mechanism: 'cann/ops-math issue 2870（2026-08-25，closed）：conversion/im2col/tests/assets/golden.py 的 _calc_need_padding()（L115-133）按 [h_before,w_before,h_after,w_after] 返回，消费端（L89-92）却按 im2col_proto.h L52 文档约定的 [pad_h_top,pad_h_bottom,pad_w_before,pad_w_after] 成对读取，生产者和消费者对元素顺序的理解互相矛盾。最小反例 N=1,C=2,H=5,W=4、ksizes=[2,2]、strides=[2,2]、dilations=[1,1]、SAME：正确补齐应为 [0,1,0,0] 得 3×2 输出，golden 实际返回 [0,0,1,0] 被读成 H:(0,0)、W:(1,0)，unfold 出 2×2 块后 reshape([1,8,3,2]) 抛 ValueError: cannot reshape array of size 32 into shape (1,8,3,2)。现有用例全部满足 w_before==h_after（如 [1,1,1,1]），错位交换无副作用，属巧合通过。'
  source: 2026-08-25 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2870 （closed）
  behavior: 改 im2col 的 SAME 分支或跑非方形输入回归时，golden 直接抛 reshape 的 ValueError，看起来像 kernel 出错；而通过的那些用例其实没有覆盖非对称补齐，kernel 真把补齐加到 H 上也不会被发现，回归一直绿着。
  trigger_surface: im2col golden + padding_mode=SAME + 非对称补齐（w_before≠h_after）
