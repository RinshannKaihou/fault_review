  visibility: 静默错误
mitigation:
  detect: 对非方形输入（H≠W）且 SAME 补齐总量为奇数的配置跑 im2col ST/UT，看是否 reshape 报错或 golden 与 numpy 滑窗实现不符
  fix: issue 称随附修复 PR 把返回语句改成 proto 文档顺序（未给 PR 编号）；作者用 numpy 显式滑窗 + TF-SAME 公式对拍 5 组配置，修复后 8/8 全绿
