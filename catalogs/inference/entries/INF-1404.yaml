id: INF-1404
legacy_ids: []
slug: trtllm_grouped_mla_gen_missing_cumseqlens
aliases: []
title: TRT-LLM grouped MLA 核缺 cumSeqLens 批>1 错读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tensorrt-llm
    component: AttentionOp MLA 生成参数
  behavior: AttentionOp 填 runner 参数从不设 cumSeqLensQ/Kv 指针；mSelectsGroupedMla=true 选中 grouped MLA 生成核时读取它们；默认核不读，main 无症状
effect:
  objects:
  - 数值结果
  detail: 微基准（Kimi K3 MLA decode+MTP）batch 1 正确、batch 4/16 输出错（sum -209.5/-218.6 vs 期望 -243.7）；serving batch-4 图捕获 illegal address，batch 5..16 偶然成功
  visibility: 静默错误
mitigation:
  detect: 开启 grouped 选择后对 batch>1 做输出 sum 对照；graph 捕获失败即信号；未评估
  fix: 待定（issue open；报告者验证过的 workaround：grouped 选择开启且 batch>1 时 AttentionOp 先launch 单 CTA 核写 cumSeqLensQ[i]=i*maxSeqLenQ 与 cache_seq_lens 前缀和到捕获前分配的 device buffer，batch 1 跳过，可成 PR）
