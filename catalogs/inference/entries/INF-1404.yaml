original:
  mechanism: TensorRT-LLM cpp/tensorrt_llm/common/attentionOp.cpp 的 trtllm-gen MLA 生成分支填 TllmGenFmhaRunnerParams 时 seqLensKvPtr=params.cache_seq_lens 但从不设 cumSeqLensQPtr/cumSeqLensKvPtr。当前默认选择的 SwapsAbForGen 内核不读这两个指针所以 main 无症状（潜伏缺陷）；当 FmhaOptions::mSelectsGroupedMla=true（#15009 提议方向）选中 grouped tokens×heads MLA 生成核（VarSeqQ64Kv128{Static,Persistent}GroupedKeepsAbForGen）时它们被读取：standalone TllmGenFmhaRunner 微基准（Kimi K3 MLA decode 形状+MTP、KV len 64）batch 1 正确、batch 4/16 错（输出 sum -209.5/-218.6 vs 期望 -243.7）；传入正确 cumSeqLensQ=[0,T,2T,...] 与 cumSeqLensKv=cache_seq_lens 前缀和后全部 batch 与非 grouped 核一致。serving（Kimi K3+MTP+CUDA graphs）下 batch-4 图捕获在 grouped cubin 加载后即 CUDA_ERROR_ILLEGAL_ADDRESS，batch 5..16 偶然成功。#15009 只测了 batch 1 所以没暴露。相关：#20376（mask type 注册不匹配）、#20377（NVRTC fallback 失败）、#20382（FP8 KV grouped E4M3 cubin heads/rank 不整除 64 时挂起）。
  source: https://github.com/NVIDIA/TensorRT-LLM/issues/20375
  behavior: 开启 grouped MLA 生成核选择的 TensorRT-LLM 服务（SM107、BF16 MLA、MTP），batch>1 的生成输出静默错误（微基准输出 sum 偏差 ~15%），或 CUDA graph 捕获直接 illegal address 崩溃（batch 4）；某些 batch 尺寸（5..16）碰巧成功。默认路径（未开 grouped 选择）当前无症状。
  trigger_surface: TensorRT-LLM main；SM107；MLA 生成（HQk 576/HV 512）+ paged KV 32/页 + mSelectsGroupedMla=true + batch>1；Kimi K3 with MTP serving 与微基准均复现
  discovery: 2026-10-16 每日扫描
