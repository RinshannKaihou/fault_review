  mechanism: PP/MoE 场景下未把 RNG seed 广播到各 rank，导致随机采样在不同 rank/stage 上不一致；另一变体是 TP 对某个张量维度做了错误的 partition，使 all-reduce 求和了错误的切片。
  source: 'arXiv:2506.09713 (Fix Tensor Shape Alignment); vLLM #6449; bug-study RC.9。'
  behavior: 各 rank 采样结果不同；或 all-reduce 求和错误切片 → 输出为垃圾。
  trigger_surface: 分布式 seed 未广播：多进程初始化可构造
  signature: 两个变体的判定完全相反。sampling-fault 变体是 post-forward 的：隐状态完全健康，**隐藏态检测器原理上漏检**，只能靠输出级的跨 rank 可复现性对拍捕获。shape-mis-partition 变体则是严重 OFF-manifold，geometric/spectral/trajectory 全族都会强烈报警。因此本条在签名层面必须拆开讨论，不能作为单一标签使用。
  repro: 只有 shape-mis-partition 变体可在单机复现 —— 用钩子把某层输出按错误的维度切分再求和（等价于对错误切片做归约）；seed 广播变体涉及多进程 RNG 状态，单进程单钩子路径无法注入。
