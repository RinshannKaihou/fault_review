original:
  mechanism: 'ops-math issue #3652（c2026-10-19，实机 A3/Ascend910_93，CANN 9.2.0-beta.2，纯 aclnn_capi 两段式直调）：aclnnAddN 对"所有输入 dtype 必须一致"契约没有任何校验。资料侧声明：add_n_proto.h 要求 same shape and type；aclnnAddN.md 返回码表列 161002=tensors 中 Tensor 数据类型不一致。源码侧（math/add_n/op_api/aclnn_add_n.cpp）CheckParams：CheckShape 逐项比 shape（shape 一半落地）；CheckDtypeValid 只逐项查 ADD_N_DTYPE_SUPPORT_LIST 白名单、不比较输入之间 dtype（type 一半完全没落地）；OP_CHECK_DTYPE_NOT_SAME((*tensors)[0], out, return false) 只比 tensors[0] 与 out 且 return false 被当状态码 0==ACLNN_SUCCESS 吞掉。实测：x1=fp32(1.0)+x2=int32(0x4B000000)→8388609.0；x2=0x7FC00000→nan；x1=fp16(1.0)+x2=fp32(1.0)→1.0,2.875（fp32 位模式拆两个 fp16 且按元素数索引越界读）；x2=uint8(255)→161002 被拒。即只有某路 dtype 不在白名单才报错，两路都在白名单内就完全不校验。来源：aclnnAddN A3 三线挖掘报告（2026-10-18，ADDN-DTYPE-01）。'
  source: 2026-10-19 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3652 （open）
  behavior: 直接调 aclnnAddN 把两个 dtype 不同的张量（如一个 fp32 一个 int32、或一个 fp16 一个 fp32）相加时，接口不报资料声明的 161002，而是把第二个输入的比特位按第一个输入的类型重新解释：int32 位模式读成大数或 NaN、fp32 拆成两个 fp16 还伴随越界读，返回看似正常的错误数值。
  trigger_surface: aclnnAddN（aclnn 直调或经框架分发）+ 输入 dtype 彼此不同但均在支持白名单；A3、CANN 9.2.0-beta.2 实测
  discovery: 2026-10-19 每日扫描
  notes:
