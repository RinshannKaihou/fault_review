title: aclnnAddN 混合 dtype 不校验静默错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: AddN dtype 校验缺失+返回值吞
  behavior: CheckDtypeValid 只查白名单不比较输入间 dtype；dtype 比对检查的 return false 被当 ACLNN_SUCCESS 吞掉；白名单内混合 dtype 按 tensors[0] 重解释其它输入位模式。
effect:
  objects:
  - 数值结果
  detail: fp32+int32(0x4B000000)→8388609.0；fp32+0x7FC00000→nan；fp16+fp32→fp32 拆两 fp16+越界读；uint8 被拒 161002——白名单内混合静默错
  visibility: 静默错误
mitigation:
  detect: 调用侧核对各输入 dtype 一致；故意混 dtype 的白名单外值试探是否被拒
  fix: 待定（issue open；修复建议：CheckDtypeValid 追加与 tensors[0] 逐项 dtype 比对 + 修 return false 被吞）
