relations: []
original:
  mechanism: '下一个 token 的左移在整条链路里只应发生一次，实际发生了两次。第一步：指令处理器 tokenize 时已经左移，mindformers/dataset/handler/alpaca_handler.py 里 labels = labels[1:] + [self.ignore_token_id]。第二步：模型与 loss 不再位移——parallel_core/training_graph/base_models/gpt/gpt_model.py 的 PreprocessLabelsAndMasks.construct 在 labels 非 None 时只做 reshape，loss_func.py 的 CrossEntropyLoss.construct 直接用 logits[i] 对 label[i]。第三步：PackingHandler 的 _process_sample 在 pack 模式下又对 labels 左移一次：elif k == ''labels'': data[k] += sample[k][1:] + [config.pad_token]，其他键（含 input_ids）原样拼接。同文件的 truncate 模式（truncate_examples）与不打包路径都只原样拼接 labels，pack 模式与它们不一致，佐证是笔误。影响范围是所有使用 Alpaca/CodeAlpaca + PackingHandler 的官方 SFT 配置（configs/qwen3/finetune_qwen3.yaml、configs/deepseek3/finetune_deepseek3_671b.yaml 与 12b_16p_pp16.yaml、configs/general/llm_finetune_*_template.yaml）。复现：用 finetune_qwen3.yaml（Alpaca+Packing）微调后推理出现系统性丢字；把二次左移去掉后 loss 明显下降、生成恢复通顺。'
  source: '2026 GitCode mindformers issue #2400 https://gitcode.com/mindspore/mindformers/issues/2400（closed）；同一问题的 issue #2399 https://gitcode.com/mindspore/mindformers/issues/2399'
  behavior: 用官方 Alpaca 指令数据 + PackingHandler 做 SFT 时，训练 loss 一直降不下去、比预期高；训完推理会成段地丢字，读起来像每隔一个词掉一个，但又不是完全乱码，很容易被当成模型小或数据质量问题。换回非打包（或不左移 labels 的打包实现）后同数据 loss 明显更低、输出正常。
  trigger_surface: 'SFT + Alpaca/CodeAlpaca 指令处理器 + pack_strategy: pack（PackingHandler）'
  discovery: 2026-10-21 GitCode 历史 issue 扫描（mindspore/ms* 簇）
