id: INF-1903
legacy_ids: []
slug: mindformers_packing_handler_labels_second_shift
aliases: []
title: PackingHandler 对 labels 二次左移致标签错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 数据管线
    stack: mindspore
    component: PackingHandler labels 拼接
  behavior: 指令处理器 tokenize 时已把 labels 左移一位，PackingHandler 的 pack 模式又左移一次而 input_ids 不动，模型实际在学用位置 t 预测 t+2
effect:
  objects:
  - 训练样本流
  - 训练信号
  detail: Alpaca/CodeAlpaca + pack 策略的官方 SFT 配置训练 loss 明显偏高；推理出现系统性丢字（像每隔一个 token 掉一个）而非乱码；去掉二次左移后同数据同超参 loss 下降、生成恢复通顺
  visibility: 质量退化
mitigation:
  detect: 对比 pack 模式与 truncate 模式/非打包路径的 labels 拼接方式；或直接比对 batch 内 labels 与 input_ids 的错位位数
  fix: issue 给出的修复是删掉 _process_sample 里 labels 的特判、与 input_ids 一样原样拼接（与 truncate 模式一致），正文称见关联 PR 但未给链接（未核实是否合入）
