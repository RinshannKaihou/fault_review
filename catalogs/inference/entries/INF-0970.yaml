  meta: '`infra_off`（Qwen3.8-Flash-Next（社区 NVFP4+PLE overlay）上 `tool_choice:"required"` + `enable_thinking:false` + `stream:true` 的组合不被强制：12 工具定义下 3 次运行 2 次返回纯文本 `finish_reason:"stop"`（tool_calls 空）——非流式或 thinking on 均正常、仅 2 工具时全模式正常（工具集大小参与触发）；tool-eval-bench TC-45 场景 0/8 通过而同客户端打 SGLang + Qwen3.8-27B 8/8——required 约束在 streaming+reasoning-parser 路径被丢弃而非模型行为；伴随：thinking on + MTP 时 xgrammar 反复 `Failed to advance FSM` / `matcher has terminated`（reasoning→tool-call 边界）） · Cov: `var:vllm_qwen3_xml_tool_choice_required_silently_acts_as_auto`（6.181 required 降级族） · 触发 `partial` · 置信度 `documented`'
  mechanism: '结构化输出约束在流式 + reasoning-parser + 大工具集的组合下失联（疑似语法构造/advance 在 reasoning 段切换处丢失）；可能关联 #18819、#39130（同症状 `--reasoning-parser gemma4`）。社区 checkpoint + primitive-ai PLE overlay 环境限制了官方 FP8 checkpoint 的对照测试（>96 GB VRAM 不可得）。'
  source: 'vLLM #55552（2026-09-06 open，bug/structured-output/tool-calling label，含三次流式运行对照、TC-45 0/8 vs SGLang 8/8 与完整 bench 仓库链接）。https://github.com/vllm-project/vllm/issues/55552'
  behavior: 无 crash——required 语义静默失效（应出工具调用却出纯文本）：依赖 tool_choice 强制的 agent 编排拿不到工具调用即行为漂移。6.181（qwen3_xml required 静默降级 auto）之后 required 降级族第二例：本条多出流式×thinking×工具数三维触发面与 xgrammar FSM advance 失败的伴随信号（后者本身是 11.57 grammar fail-open 的邻近域）。
