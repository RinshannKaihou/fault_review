original:
  category: KV4
  section: KV §4 cross-request（跨请求，缓存键 / 汏染）
  meta: '`model_on` · Cov: `NEW` · 触发 `no` · 置信度 `verified`'
  mechanism: cache-aware 的 PD router 从 `body.messages.first()`（通常就是 system prompt）提取前缀文本，于是 radix 前缀匹配与 worker 选择被「共享 system prompt 的重叠」主导，而不是真正可复用的那段前缀；多轮请求因此被路由到一个并不持有其 KV 的 worker，被迫完整重算。
  source: 'SGLang #26263（修复 PR #27430；cache-hit 69%→96%）。'
  behavior: 输出完全正确（被正确重算），只有系统指标退化：前缀缓存命中率从 69% 提升到 96% 说明修复前有大量本可复用的前缀被浪费，重算 token 数与延迟随之升高。
  trigger_surface: 需要 P/D 分离或跨节点/RDMA 拓扑（默认实验室单机不具备）
  signature: '**无**——隐藏态与健康前向逐位相同（这里标 `model_on` 是指状态严格留在健康流形上，而非模型吸收了扰动）。这是一条纯系统指标故障，检测面在前缀缓存命中率 / 重算 token 计数，任何隐藏态度量族（geometric / spectral / trajectory / statistical / infotheoretic / cheap）都必然漏检。源文档明确把它作为有据可查的**负例（盲区）**收录，用来界定本项目检测器的能力边界。'
  locus: '`cross-request`'
  priority: '`low`'
