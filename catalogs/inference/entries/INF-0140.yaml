original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（Blackhole `p_unpacr_nop` 携带三个 Wormhole 打包值常量：BH 的 `UNPACR_NOP` 是 9 独立操作数编码、WH 是单打包立即数，而 `Unpack_Pop` 位域仅 2 位——WH 值溢出邻位后每个常量编码出**与其名字相反的控制**：RESET_ALL_BANKS→clear-to-ONE、STALL_RESET_WR_RDY→clear both banks、SET_DVALID→**DVALID 永不发布**（显形为 hang）；`TTI_UNPACR_NOP` 从不调用 `TT_UNPACR_NOP_VALID` 故无诊断；main/全分支零引用——**潜伏非现役**） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 三常量与 WH 头文件 byte-identical（结构体自带 standing TODO "bits do not match"）；WH 两参数调用形式在 BH 不编译，故非拷贝调用点风险而是**移植替换风险**——写 BH 9 操作数形式时在同名常量的 Unpack_Pop 槽取值即触发。dest-reuse 工作正 WH+BH 并排发布（#54683/#55107）、#54731 落地后计划 shared helper，暴露面上升。修复：仅 BH 删除三常量（把误用变成编译错误）。另附 `p_zeroacc` 的 CLR_HALF_32B/CLR_ALL_32B 按 WH 方式编码 32-bit 模式（BH `TT_OP_ZEROACC` 有独立 `use_32_bit_mode` 操作数）——两者不可能同时是硬件读到的控制，未决。
  source: 'tt-metal #55269（2026-09-02 open，含编码位表、全仓引用审计与修复提案）。https://github.com/tenstorrent/tt-metal/issues/55269'
  behavior: 双形态——潜伏错值（bank 交接静默失败→错数据）或 hang（DVALID 永不发布）；当前生成代码不可达，属「**ISA 常量跨 arch 携带编码错位**」新子签名：源 arch 正确、目标 arch 静默错编码、无编译期/运行期保护的一类移植地雷。
  trigger_surface: tt-metal Blackhole LLK 开发 + 移植代码使用三常量之一（代码编写期风险，非运行期 shape）
  discovery: 2026-09-02 每日扫描。
