original:
  mechanism: 'tt-metal issue #61398（c2026-10-19）：ttnn.move（ttnn.reallocate 与 ttnn.experimental.quasar.move 建于其上）在 DRAM 中搬移 interleaved ROW_MAJOR tensor、当新 buffer 与旧 buffer 重叠、tensor 行数多于设备核数且行大小非 64 字节倍数时静默返回错值。bf16、rows = cores+1 与 cores+3、输出与输入 bit 级对比（Blackhole P100A）：行宽 8/16/24/40/72 元素（16/32/48/80/144 字节）DRAM 全错、L1 全精确；行宽 32（64 字节）DRAM 也精确。24 个 DRAM case 中 20 错；早期 284 配置扫描（11 种行宽至 2KB、TILE 四种 dtype、DRAM/L1）在 P100A/P150 发现 21 个错误配置、Wormhole N150 18 个，全部 row-major DRAM。'
  source: 2026-10-19 GitHub tenstorrent/tt-metal issue https://github.com/tenstorrent/tt-metal/issues/61398 （open）
  behavior: 在 Tenstorrent 设备上对行主序、行字节数不对齐 64 字节的 DRAM 张量做 move/reallocate（如内存整理触发），当新旧内存块重叠且张量行数超过核数时，搬完的数据悄悄变成错值；同样形状放 L1 或 TILE 布局则完好。
  trigger_surface: ttnn.move/reallocate/quasar.move + DRAM ROW_MAJOR + buffer 重叠 + rows>核数 + 行字节非 64 倍数；P100A/P150/N150
  discovery: 2026-10-19 每日扫描
