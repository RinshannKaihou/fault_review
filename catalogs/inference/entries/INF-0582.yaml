original:
  category: cat6
  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（`ROCM_DEFAULT_MRV1_ARCHITECTURES` 加入 `GlmMoeDsaForCausalLM` 以把 **GLM-5.2** 留在 MRV1——但 GLM-5.3 共享同一架构字符串，被一并切到 MRV1，而 MRV1 对该架构产出损坏生成：ROCm MI350/MI355 上 GLM-5.3（Quark-MXFP4-AttnFP8）GSM8K 5-shot 从 **91.6% 跌到 14.9%**；bisect 定位 #53155（`ce2e343be`），main 仍带病） · Cov: `var:sglang_envs_declared_runtime_defaults_split`（6.164 按架构字符串选择路径的分裂族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 以 `architectures` 字符串为判据的运行时路径选择把同字符串的新版本模型卷入为旧版本定制的兼容路径——版本维度（5.2 vs 5.3）在架构判据中不可见；MRV1 执行器对 GLM-5.3 的新算子/结构计算错误而非崩溃。与 6.164（声明/运行时分裂）同为「判据粒度粗于差异粒度」，本条判据是架构字符串、差异是模型版本。
  source: 'vLLM #54924（2026-09-02 open，bisect `44fe2a392..40824284b` + main `1b4b2a18b` 复核、GSM8K 双臂数值）。https://github.com/vllm-project/vllm/issues/54924'
  behavior: 无 crash——**精度塌方 6.2 倍**（91.6%→14.9%）且服务表面完全正常（能对话、能返回 200）；基线对照需要跑 benchmark 才能发现，生产中若无人跑 eval 即静默劣化。属「**按架构字符串的路径选择对同名新版本过包含**」：兼容性 workaround 污染未来模型的标准显形。
  trigger_surface: vLLM ROCm + GLM-5.3（GlmMoeDsaForCausalLM）+ main（截至 `1b4b2a18b`）（模型+平台组合即触发）
  discovery: |-
    2026-09-04 每日扫描。
