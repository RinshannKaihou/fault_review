id: INF-1848
legacy_ids: []
slug: vllm_ascend_prefix_cache_cross_request_context_leak
aliases: []
title: 前缀缓存命中后把别的请求上下文答出来
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: 前缀缓存块复用
  behavior: 共享前缀命中时复用的 KV 块仍带着别的请求的后缀内容：probe 请求把 prime 阶段写进缓存的姓名答了出来，唯一首字符对照组不串扰。
effect:
  objects:
  - 跨请求/跨样本数据
  - 输出内容
  detail: DeepSeek-V4-Flash 开 prefix caching、100 并发共享 3008 token 前缀：两次运行 84/100 与 85/100 的 probe 回复含 prime 标记文本，对照组 0 泄漏。
  visibility: 静默错误
mitigation:
  detect: 两阶段探针：先并发灌入带标记的 prime prompt 填满 KV，再用同一共享前缀、只问问题的 probe 请求，统计回复是否含标记；同时用唯一首字符对照组排除正常续写。
  fix: 待定（issue closed，正文只给复现脚本与判定规则，未给修复 PR，也未定位到 hash 冲突还是块复用）
