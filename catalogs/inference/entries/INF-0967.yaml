  meta: '`infra_off`（服务端 `--default-chat-template-kwargs ''{"reasoning_effort": "medium"}''` 时，请求显式指定的 `reasoning_effort`（`chat_template_kwargs` 内或顶层字段）被静默覆盖为服务端默认——与所有其他 chat_template_kwargs 键的 request-first 优先级相反；无拒绝、无告警，文档仅建议"别同时配置"） · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: '`_convert_to_internal_request` 先把 `reasoning_effort` 从 `chat_template_kwargs` pop 到顶层字段，`_process_messages` 再对 `chat_template_kwargs` 做 `setdefault` 合并服务端默认——因键已被 pop，default 被插入即使请求原本选了别的值；此后渲染读 pop 出的字段还是 default 取决于合并序，最终服务端默认胜出。'
  source: 'SGLang #38104（2026-09-05 open，含 `serving_chat.py` 两步操作序的逐行定位）。https://github.com/sgl-project/sglang/issues/38104'
  behavior: 无 crash——请求级推理档位静默丢失（xhigh 请求按 medium 渲染）：思考深度与 token 消耗系统性错档，客户端无法察觉。与 10.38（DSV4 tool_choice=auto × 深推理档静默空响应）相邻：reasoning_effort 配置语义域；本条是「**pop-then-setdefault 的优先级反转**」——合并顺序 bug 显形为配置覆盖。
  trigger_surface: SGLang + `--default-chat-template-kwargs` 含 reasoning_effort + 请求级覆盖（config 组合触发）
  discovery: 2026-09-05 每日扫描。
