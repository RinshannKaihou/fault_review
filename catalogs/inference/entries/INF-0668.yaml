  meta: '`infra_off`（SGLang 并发启动两实例且 scheduler port 冲突：worker 侧 `get_zmq_socket(bind=True)` 绑定失败后**静默重试 port+42**（仅日志一行），客户端/HTTP/metrics/disagg orchestrator 仍连配置端口——**请求被送达并执行于先占端口的另一实例**：输出写入错误实例的 output file、或对端已退出时本实例永久等待。`settle_port` 只在 parse 时刻查空闲，窗口内被占即触发；默认 `5555+randint(0,100)` 下多任务同启 ~3/40 命中） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: bind 重试策略把"端口被占"降级为"换端口继续"，而所有对端连接按静态配置端口发起——端点身份与进程身份解耦。
  source: 'SGLang #43731（2026-10-11 open，双实例日志对照 + 3/40 并发启动统计）。https://github.com/sgl-project/sglang/issues/43731'
  behavior: 无 crash——跨实例请求串答（拿到别的模型/会话的结果）或无限挂起。
  trigger_surface: SGLang + 并发多实例启动 + scheduler/master 端口冲突（partial）
  discovery: 2026-10-12 每日扫描。
