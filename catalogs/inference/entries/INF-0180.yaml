  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（CPU 后端 + `Qwen3_5MoeForConditionalGeneration`：torch.compile/inductor 编译路径下 **MoE kernel 产出全词表 NaN logits**（重排为 garbage token），bf16 未量化 checkpoint 与 GPTQ-Int4 量化**均复现**（报告者当日勘误：最初归因 GPTQ-Int4 dequant 内核是错的，同一 checkpoint 的 bf16 版同崩）；`--enforce-eager` 两例皆愈——量化方法无关的 CPU MoE × inductor 编译缺陷，AMX CPU（amx_bf16/int8/tile 全在）TP=1 即触发） · Cov: `var:triton_fp8_e5m2_transposed_store_codegen_corruption`（1.12 编译器代码生成损坏族） · 触发 `partial` · 置信度 `documented`'
  mechanism: vLLM 0.28.0 CPU 官方镜像；NaN 从首个生成 token 起贯穿整个 rollout，eager 执行同一模型干净——故障位于 torch.compile/inductor 为该 MoE 架构生成的 CPU 内核路径（或其与 Inductor 分解的组合），与权重量化方法正交。chunked prefill 开、KV cache 16 GiB、OMP auto 均为常规配置。
  source: 'vLLM #55560（2026-09-06 open，torch.compile+quantization label，含同日勘误更新、bf16 与 GPTQ-Int4 双复现与 eager 消融）。https://github.com/vllm-project/vllm/issues/55560'
  behavior: 无 crash——**静默 NaN 服务**（输出为重排垃圾文本），与 7.53（CPU WNA16 编译守卫失配）同为 CPU 后端编译路径缺陷，但本条不挑量化、显形为 NaN 而非不可用；对 CPU 推理基准/本地部署是全输出损坏型。1.12（Triton codegen 腐蚀）之后编译器生成代码数值损坏族在 **CPU Inductor** 域的第一例。
  trigger_surface: vLLM CPU 后端 + Qwen3_5Moe 架构 + torch.compile 默认路径（partial：架构特定，配置即触发、eager 即愈）
  discovery: 2026-09-07 每日扫描。
