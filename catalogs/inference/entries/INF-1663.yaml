title: TensorScatterUpdate 并行分支吞掉越界错误码
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: AICPU UpdateOneOutput 并行
  behavior: updates_nums>65536 时走 ParallelFor，其无条件返回 OK 覆盖 worker 写的 PARAM_INVALID；ret 还是非原子 uint32，多 worker 并发读写。
effect:
  objects:
  - 数值结果
  detail: 910B3 + CANN 9.1.0 内置算子：x[14000,5]、indices 含 14000 越界值、updates_nums=70000 时 RunGraph 返回 success，输出 10 个元素错；降到 ≤65536 则正确报 PARAM_INVALID。
  visibility: 静默错误
mitigation:
  detect: 同一份越界 indices 分别用 >65536 与 ≤65536 的 updates 规模各跑一次比较 RunGraph 返回值；只测小规模会漏。
  fix: issue 5084 closed；正文给出对齐 InitializeOutput/scatter_elements/scatter_nd_max：ret 改 std::atomic<uint32_t>、用局部变量承接单次结果、不让 ParallelFor 返回值覆盖；未给 PR 号。
