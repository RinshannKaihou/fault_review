id: INF-1713
legacy_ids: []
slug: ms_addmm_input_grad_shape_broadcast
aliases: []
title: addmm 在 mat1 为 (1,x) 时 bias 梯度多出一维
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: mint.addmm 反向广播归约
  behavior: addmm 反向对 input 的梯度没有按前向广播语义归约：mat1 为 (1,x) 时把 (1,N) 的行向量直接当 bias 梯度返回，没有沿第 0 维求和。
effect:
  objects:
  - 梯度
  detail: bias 形状 (256,) 时 grad_b 返回 (1,256)，与参数形状不一致；x、w 的梯度形状和 loss 都正常，只有 bias 梯度错，无报错。
  visibility: 静默错误
mitigation:
  detect: 对 mint.addmm(b, x, w) 用 value_and_grad 取三个位置的梯度，检查 grad_b.shape 是否等于 b.shape；mat1 取 (1,N) 时即可命中
  fix: 待定（issue open，无修复 PR）；方向：input 梯度先按 mat1 的 shape 沿广播维求和再返回
