original:
  mechanism: 在 MindSpore 2.7.0 + CANN 8.0.0 上，x=(1,512)、w=(512,256)、b=(256,)，用 mindspore.value_and_grad 对 mint.addmm(b,x,w) 的平方均值求导：输出 loss 是标量、grad x 为 (1,512)、grad w 为 (512,256)，但 grad b 的 shape 是 (1,256)。issue 用 md5 对比各张量，只有 bias 梯度的 shape 与 bias 本身不一致，说明反向对 input 的贡献没有按广播维归约。issue 注明最新版本即可复现。
  source: 2025-08-30 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/21071 （closed）
  behavior: 用 mint.addmm 训练带 bias 的线性层、且 batch 维为 1 时，bias 的梯度形状从 (N,) 变成 (1,N)。优化器按参数形状更新时形状对不上，或者被静默广播，训练不报错但 bias 更新与参考实现不一致；其他参数的梯度和 loss 都正常，很容易被当成优化器问题排查。
  trigger_surface: mint.addmm，mat1 形状 (1,x)；MindSpore 2.7.0 + CANN 8.0.0
