    stack: mindspore
    component: aux loss tracker 累加
  behavior: MoE aux loss 在前向经 router._attach_and_log_aux_loss → save_to_aux_losses_tracker 累加进 tracker；反向重算前向时同一路径再累加一次，被重计算层数值翻倍
effect:
  objects:
  - 指标/日志
  - 训练信号
  detail: 4 卡 DSV3 小模型、seq 可被专家数整除时 load_balancing_loss 打印 ≈2.0（应≈1.0），关重计算约 1.1；force_expert_balance=True 时 dispatch 已 128/128/128 均衡，aux 仍打印不均衡值
  visibility: 静默错误
mitigation:
  detect: 同配置开/关 recompute 比对逐层 tracker 值与聚合 load_balancing_loss；force_expert_balance 下核对 aux 与 num_tokens_per_expert 是否一致
  fix: PR !8415：重计算上下文内跳过 tracker 累加，force_balance 时用均衡后 selected_experts_indices 重建 routing_map；修复后 ≈1.2、主 loss 逐位不变
