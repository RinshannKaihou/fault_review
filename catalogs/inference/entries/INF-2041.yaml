slug: vllm_ascend_mm_batch_second_req_empty_output
aliases: []
title: 多模态批量第二路请求输出为空
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: vllm
    component: model_runner_v1 输入准备
  behavior: V1多进程下两视频同批，调度输出含缓存请求且调度token数较正常多1；疑似拼接缓存请求token多算1个，使模型输入首维与调度记录不一致。
effect:
  objects:
  - 输出内容
  detail: 两个视频同批推理时第 1 路返回正常 JSON，第 2 路 output 为 None/空串；单独推理该视频、或 VLLM_ENABLE_V1_MULTIPROCESSING=0 时正常，全程无报错
  visibility: 静默错误
mitigation:
  detect: batch>1 的多模态请求逐条比对返回条数与内容是否为空，并核对 total_num_scheduled_tokens 与 input_embeds 首维是否一致
  fix: 待定（issue 只给现象与怀疑点，未附修复）
