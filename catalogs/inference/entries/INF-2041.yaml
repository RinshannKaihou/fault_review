original:
  mechanism: V1 多进程（VLLM_ENABLE_V1_MULTIPROCESSING 默认开启）下把两个视频放进同一 batch 推理：报告者抓到的 SchedulerOutput 里带 scheduled_cached_reqs，total_num_scheduled_tokens=2818，而同输入的正常 SchedulerOutput 是 2817 且没有 scheduled_cached_reqs；他据此怀疑 _prepare_inputs（vllm/v1/worker/model_runner_v1.py）在拼接 cached req 的 token 时多算了 1 个，导致传给模型 forward 的 input_embeds 首维是 2818，而调度侧按 2817 记，第二个请求分不到输出。关闭 V1 多进程后同一 batch 正常，单独推理第 2 个视频也正常。版本 vllm/vllm-ascend 0.12.0。
  source: 2025-12-16 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/5083 （closed）
  behavior: 一次提交两个视频的批量推理，返回列表条数正确，但第二个视频的文本是空的：脚本打印「✅ 批次 1 输入输出数量匹配」「✅ 第 0 个视频输出正常」「❌ 第 1 个视频输出为空」。接口 200、没有异常，下游把这些空结果当正常响应写库，只有逐条检查输出长度时才会发现少了一条。
  trigger_surface: V1 多进程 + 多模态（视频）batch>1
  discovery: 2026-10-21 系统扫描（sweep_2，issue created < 2026-10-07 历史索引
