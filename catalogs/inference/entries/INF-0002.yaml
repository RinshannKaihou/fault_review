  meta: '`ambiguous`（gated） · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: mercurial core / 执行单元**只在特定数据模式 + 指令序列**下算错。CEE（computational error events）"highly dependent on workload and on f,V,T"（依赖于工作负载与频率/电压/温度）；绝大多数 forward pass 是干净的，但落在特定激活值区间时会**确定性地**给出错误结果。映射到实现上，即一个仅当激活统计量满足触发谓词（trigger predicate）时才污染输出的 forward hook。本条为 MERGED 条目，合并了两个子故障：（a）mercurial cores；（b）input-gated CEE。
  source: Hochschild, Turner, Mogul et al., "Cores that Don't Count", HotOS 2021, https://sigops.org/s/conferences/hotos/2021/papers/hotos21-s01-hochschild.pdf 。Dixit, Pendharkar, Beadon et al., "Silent Data Corruptions at Scale", https://arxiv.org/abs/2102.11245 。
  behavior: 间歇性——多数 token 正确，偶尔某些 token（其中间激活恰好落入触发区）被污染。看上去像一次罕见、不可复现的幻觉，但对**同一个触发输入是可复现的**。
  trigger_surface: 权重/激活 bit spray：CUDA bitflip
  signature: off-manifold，但**仅在被触发的输入上出现**：被污染的 pass 有签名，其余 pass 完全没有。跨多 token 的 trajectory / 分布漂移类度量能把它当作稀有尾部事件捕获；单次 pass 的 geometric 检查会漏检。它与真正的幻觉（model_on）可区分：即使该 token 看起来合理，被污染的 pass 仍留下 off-manifold 的 geometric 离群点。
  repro: 用一个**受激活统计量谓词门控**的 hook——先计算该层激活的统计量（如某通道范数/最大值落入指定区间），谓词为真时才施加污染，否则透传。
