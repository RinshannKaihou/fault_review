original:
  mechanism: 'ops-transformer issue #6325（c2026-10-19，Ascend 310P3，torch 2.10.0+cpu / torch_npu 2.10.0，CANN 9.1.0-beta.1，npu-smi 26.1.1）：npu_prompt_flash_attention 普通 MHA（不启用 GQA）、Q/K 全零、V 仅指定 Head/Channel 常数 35 其余为零、标准因果 mask 时，数学上所有有效 score 相等、输出应恒为 35、与序列长度无关。实测 position 1870 输出 35.0 正常、1871 起输出 +Inf、至 2047 共 177 个位置（Total nonfinite 177）。根因对应关系：FP16 最大有限值 65504；有效 token 数 n=1871 时 n×35=65485<65504 正常、n=1872 时 65520 进入向 Inf 舍入区。V 改 4 后（2048×4=8192）全部正常。结论（黑盒推测待验证）：PromptFlashAttention 某条 FP16 执行路径可能在 softmax 归一化之前对未归一化的 P×V 累加结果进行了 FP16 范围受限的存储、转换或分块合并，中间值溢出。尚未确认具体 kernel 指令、临时 buffer 或 Cast 位置，向维护者请求 kernel/tiling 选择与中间 dtype 信息。复现不依赖具体模型、权重及 ONNX/ATC 转换流程。'
  source: 2026-10-19 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/6325 （open）
  behavior: 在昇腾 310P3 上用 FP16 跑 PromptFlashAttention，当某个位置的注意力加权累加和（未除以归一化分母前）逼近 FP16 上限 65504 时（例如值 35 的 V 累计约 1872 个 token），该位置起输出突然变成 +Inf 并持续到序列尾；把 V 幅度调小（如 4）后完全正常。输出 Inf 而非正确常数，位置与 FP16 上限精确对应。
  trigger_surface: Ascend 310P3 + torch_npu.npu_prompt_flash_attention + FP16 + 长有效 token 数 × V 幅度逼近 65504；标准因果 mask；不依赖模型权重
