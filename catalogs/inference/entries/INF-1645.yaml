original:
  mechanism: triton-ascend 3.6.0+gitfd24f3aa（commit fd24f3aad05c1c11f244be192c72c0b7ad7b96ae，CANN 9.0.0、torch 2.7.1、torch_npu 2.7.1.post4、PyTorch 2.7.1、Ubuntu 22.04 AArch64）在 Ascend 910B3 的 SIMD 编译模式（compile_mode=simd、enable_mixed_cv=True、multibuffer=False、num_stages=1、num_warps=4、use_bytecode=True）下：对 32×32 fp16 张量 y 取第一行（al.extract_slice 后 tl.permute 成列），再用 al.insert_slice(x, col, (0,0), (BLOCK,1), (1,1)) 插到另一个 32×32 张量的第 0 列，插入的那一列正确，但插入区域之外的元素被一起改写（第 0 行第 2 列起变成 8.84，参考应为 0.0412）。逐元素比对 mismatch=474、max abs error=8.8025。复现脚本自带 corrupted_outside_insert 判定并附完整输出，可判定是 insert_slice 局部写入的 lowering 越界覆盖，而不是用户索引错。
  source: 2026-08-18 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/1635 （closed）
  behavior: 用 insert_slice 往输出 tile 的某个局部位置写一小块（典型场景：把一列/一行的中间结果拼回大张量）时，返回张量里被插入的位置正确，但周围大片元素变成无关的数值：实测 1024 个元素里 474 个不对、最大偏差 8.8，量级与真实数据同阶，肉眼和 loss 都不易察觉。整个过程无报错无 NaN，只有逐元素对比参考实现才能发现。
  trigger_surface: SIMD 模式下 al.insert_slice 部分写入（非整块），910B3 fp16
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
