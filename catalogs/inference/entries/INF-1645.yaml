title: insert_slice 破坏插入切片之外的元素
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: al.insert_slice lowering
  behavior: SIMD 模式下把 extract_slice→permute 得到的列 insert_slice 到 32×32 张量 (0,0) 处，插入列正确但切片之外的元素被改写；910B3、fp16、3.6.0+gitfd24f3aa。
effect:
  objects:
  - 数值结果
  detail: 与 torch 逐元素比对 mismatch 474、max abs error 8.80；第 0 行第 2 列起变成 8.84 而参考是 0.0412，无报错，只有逐元素对比可见。
  visibility: 静默错误
mitigation:
  detect: 用哨兵值填底张量后只插入一小块，逐元素检查插入区域之外的单元是否保持不变
  fix: 待定（issue closed，正文未给修复 PR）；规避=改用指针偏移载入/整块 select 而非 insert_slice
