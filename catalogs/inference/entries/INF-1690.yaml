slug: fp64_silent_downcast_to_fp32
aliases: []
title: fp64 输入被静默降为 fp32 致校验与精度失败
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: ToKernelNpu dtype 降级
  behavior: 算子不支持 double 时 ToKernelNpu 只打印一条 Warning 就把输入 cast 为 float 执行，cholesky 等矩阵运算在 fp32 下完成，结果不再满足 fp64 语义。
effect:
  objects:
  - 数值结果
  detail: Wishart(fp64 10×10 precision_matrix) 构造抛 ValueError PositiveDefinite；协方差最大偏差 1.83e-5（容差 1e-5）、方差偏差 0.82（容差 0.5）；A2 3 例、A5 1 例失败。
  visibility: 静默错误
mitigation:
  detect: 对 fp64 输入检查 stderr 是否出现 ToKernelNpu.cpp:40 的 "Device do not support double dtype now, dtype cast replace with float"；对比 CPU fp64 结果与容差
  fix: '待定（issue open）；方向 1：数值敏感路径的 fp64 输入显式报错；方向 2：补齐算子 fp64 支持（关联 issue #4377）'
