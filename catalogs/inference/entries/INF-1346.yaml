  meta: '`infra_off`（`Tile(tile_shape, face_shape, transpose_tile)` 构造器接受非方 face 的转置 tile（如 `Tile({16,32},{8,16},true)`），而 `tilize_utils.cpp` 四个转换器假设 `face_H == face_W`：swizzled↔nfaces 循环 `row < face_W, col < face_H` 越界读 face 外——**heap-buffer-overflow READ/WRITE**（ASan 捕获；无 ASan 时 glibc `free(): invalid next size`）；row-major 往返不闭合（数据错）；377-382 行边界检查打印 dst/src idx 后**仍然 memcpy**。CPU-only 确定性复现；32×32/16×16、16×32/16×16 转置、16×32/8×16 非转置全通过——触发精确钉在转置×非方 face 组合。Python Tile binding 只建默认方 face，C++ API 可达） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
