original:
  mechanism: 'vLLM #61231（c2026-10-12，配置解析级、无 GPU 无权重复现，L40S 环境仅背景）。EAGLE/EAGLE-3 draft head 从 draft checkpoint 自身 hf_config 构建，rotary embedding 只来自 draft config 的 rope 键：vllm/config/speculative.py 把 draft config 包进 EAGLEConfig、不复制 target 任何 rope 键，hf_config_override 只按架构改 model_type/architectures；llama_eagle3.py 用 draft_model_config.hf_config 建 decoder 层；llama.py _init_rotary_emb 调 get_rope(..., rope_parameters=getattr(config,''rope_parameters'',None))；transformers 对无 rope 键的 LlamaConfig 填 rope_parameters={''rope_theta'':10000.0,''rope_type'':''default''}，vllm get_rope 又独立默认 rope_parameters.get(''rope_theta'',10000)——两层都落 10000，target 值无路径到达 drafter。draft config 无 rope 键时 drafter 以 base 10000 运行、无任何日志。issue 附两个 Hub config.json 的解析脚本复现（0.31.0 release wheel、0.31.1.dev2 source、main bd5bbce6 路径相同）。'
  source: 2026-10-12 GitHub vllm-project/vllm issue https://github.com/vllm-project/vllm/issues/61231 （open）
  behavior: 在 vLLM 用 EAGLE/EAGLE-3 投机解码且 draft 模型的 config.json 没写 rope_theta（而 target 模型用的不是 10000）时，drafter 悄悄按 base 10000 计算位置编码，与 target 不一致：草稿质量/接受率劣化，无任何日志提示。这是纯配置解析问题，不用 GPU 就能确认解析结果。
  trigger_surface: vLLM EAGLE/EAGLE-3；draft config.json 无 rope 键 + target rope_theta≠10000；0.31.0~main
