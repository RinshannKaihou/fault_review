title: SparseFlashAttentionV2 950PR 静默忽略 value
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: SparseFlashAttentionV2
  behavior: 950PR 的 attentionMode=2 实现不读非空 value 张量，V 恒取 key；value 传全 0/全 1/等于 key 三种数据时 attentionOut 逐字节相同，只改 key 才变化。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: T1=2/T2=64/D=512/K=8 fp16，value=all0 与 all1 的 attentionOut sha256 相同；只改 key 时 max|diff|=1.024e3，证明探针有效；两段 rc=0，无告警。
  visibility: 静默错误
mitigation:
  detect: 固定 q/k，仅替换 value 数据，比较 attentionOut 位模式；同时替换 key 作阳性对照
  fix: 待定（open；master 0feb6ec0 上 arch35 仍无 valueGm，未见修复 MR）
