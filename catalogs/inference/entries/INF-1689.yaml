title: ops.all 把纯虚数当假值返回 False
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: ops.all 复数真值判定
  behavior: ops.all 对 complex 张量只按实部判真值（丢掉虚部），纯虚数元素 5j 被判为 False，与任何非零复数都为真的语义不符。
effect:
  objects:
  - 数值结果
  detail: Tensor([1+2j,3+4j,5j]) 上 ops.all 返回 False，换成 1+5j 则返回 True；CPU 与 GPU 行为一致，复数 mask/断言会被静默判错。
  visibility: 静默错误
mitigation:
  detect: 构造实部为 0、虚部非零的 complex 张量调用 ops.all；返回 False 即命中，再用实部非零的同形状张量做对照
  fix: 待定（issue open，无修复 PR）；方向：真值判定按 |real|!=0 or |imag|!=0，而不是只看实部
