original:
  mechanism: mindspore.ops.all 对 complex 张量的真值判定只取实部（或先把复数转成实部再判），因此非零但纯虚的元素被当成 0。复现：x=Tensor([1+2j,3+4j,5j], complex64) 时 ops.all(x) 返回 False；y=Tensor([1+2j,3+4j,1+5j], complex64) 返回 True。CPU 与 GPU 行为一致，说明不是某个后端 kernel 的问题，而是真值判定实现丢掉了虚部。issue 指出这与 Python 语义（任何非零复数都为真）不符，环境为 CPU/GPU 双后端对照，无修复 PR。
  source: 2025-08-28 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/21082 （open）
  behavior: 复数张量上跑 ops.all（比如判断 mask/输入是否全非零），只要元素是纯虚数就会被判成假：返回 False 但数据明显非零。CPU 与 GPU 都一样，因此换后端也排除不掉；只有把元素改成实部非零才恢复正常。
  trigger_surface: complex64/complex128 张量上调用 ops.all，元素实部为 0 而虚部非零；CPU 与 GPU 均复现
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
