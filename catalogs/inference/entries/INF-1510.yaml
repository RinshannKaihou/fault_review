original:
  mechanism: '同一族误报，分两类。A 类“有同步仍报冲突”：#113 在 /race_check/simt_simt_inner 用例上报同一核内同一线程之间发生竞争；#121 单独用 --check-cross-npu-races=yes 即对 device 0 与 device 1 上同一条 PIPE_MTE3 写（kernel1.cpp:38，同一 GM 地址 +0x12c0c0017000）报 WAW，而用例目录名为 no_race_when_sync_with_cross_npu_barrier，即两卡之间本有同步；#118 在 FixPipe 对同一块地址 AtomicAdd 时报 GM WAW；#195 在 --check-dcci=yes 下对带 DCCI+SyncAll 的多 kernel 用例报 UB 竞争；#215 在纯 SIMT 场景的 atomic_intrinsics、reduce_sum、bank_conflict、sincos_compute 上报竞争，其中 reduce_sum 经确认是“检测同步桩指令少了 1 个”；#216 asc-devkit 的 scalar_atomic_operations 示例在原子操作之间报竞争。B 类“桩取到的 id 越界”：#183 动态插桩的 set/wait_flag 桩函数拿到的 event id 超过合法范围时 racecheck 误报，例如 ops-transformer spare_flash_attention_grad 出现 MTE2 同 pipe WAW；#166 synccheck 在 mode4 核间同步场景下 AIV 上 flag id 超过 15（属非法范围）时报死锁，但硬件会截断 AIV 的 flag id，算子实际不会死锁。另有 #125 shmem dispatch_gmm_combine 报竞争同时未展示调用栈、异常 kernel 名字展示错误。'
  source: 2026-05-25 GitCode Ascend/mssanitizer issue https://gitcode.com/Ascend/mssanitizer/issues/113（closed）；2026-05-28 issue https://gitcode.com/Ascend/mssanitizer/issues/118（closed）；2026-05-30 issue https://gitcode.com/Ascend/mssanitizer/issues/121（closed）；2026-06-09 issue https://gitcode.com/Ascend/mssanitizer/issues/125（closed）；2026-07-28 issue https://gitcode.com/Ascend/mssanitizer/issues/166（closed）；2026-08-11 issue https://gitcode.com/Ascend/mssanitizer/issues/183（closed）；2026-08-25 issue https://gitcode.com/Ascend/mssanitizer/issues/195（closed）；2026-09-17 issue https://gitcode.com/Ascend/mssanitizer/issues/215（closed）；2026-09-18 issue https://gitcode.com/Ascend/mssanitizer/issues/216（closed）
  behavior: 带 cross-npu barrier 的两卡同步写、对同一地址的 AtomicAdd、SyncAll 之后的多核访问，都会被报成 WAW/WAR 竞争；同一线程内的顺序访问也会被当成线程间竞争；把 --check-dcci=yes 或 --check-cross-npu-races=yes 单独打开时误报明显变多。synccheck 会为一个硬件本来会截断 flag id 的算子判死锁。误报往往还伴随调用栈缺失或 kernel 名不对，进一步降低可读性。
  trigger_surface: Ascend 910B/950PR POD + AscendC/CATLASS/shmem 算子；-t racecheck、--check-cross-npu-races=yes、--check-dcci=yes、synccheck mode4；--block-id 单核执行
