title: 竞争与同步检测在 ID 越界、有同步场景误报
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: racecheck/synccheck 冲突判定
  behavior: 竞争/同步判定未识别同线程顺序、跨卡barrier、原子累加、DCCI+SyncAll等同步语义；set/wait_flag桩event id超界未处理；synccheck未按硬件截断超范围AIV flag id；同步桩少一条时未正确识别
effect:
  objects:
  - 测试判定
  - 指标/日志
  detail: 同核同线程、带 cross-npu barrier 的两卡同址写、FixPipe 同址 AtomicAdd、DCCI+SyncAll 之后、纯 SIMT 原子/归约算子都稳定报竞争；synccheck 对 AIV flag id>15 报死锁而硬件截断后实际不死锁。
  visibility: 静默错误
mitigation:
  detect: 看到竞争告警先核对两侧是否有 SyncAll/跨卡 barrier/同一原子累加，并单开 --check-cross-npu-races 或 --check-dcci 复测；synccheck 报死锁时核对 AIV flag id 是否 >15。
  fix: 待定（各 issue 均以“误报”闭环；#168 提出核间同步 mode4 的 flag_id 合法性告警，方向是让工具按硬件截断语义处理，未见公开 PR）
