  meta: '`infra_off`（vLLM 结构化输出 `auto` 后端选择：#59061 的 unsupported-feature 检查只有一条组合子规则（`allOf` 列表 ≥2），**组合子与约束关键字同节点共存**的 schema（xgrammar #858 实际 mishandle 的情形：anyOf/oneOf/单支 allOf 旁有 type/properties/required）仍走 xgrammar——xgrammar 丢邻近关键字、schema 编译为等价 `{}` 的 any-JSON 规则，**约束静默不生效无任何错误**（两个 schema 实测：xgrammar 接受全部 9 个非法实例，guidance（本应 fallback）拒绝全部）。无 GPU 纯 schema 编译复现，main `049507aa`） · Cov: `var:vllm_xgrammar_multibranch_allof_silently_unenforced_no_fallback`（10.64 xgrammar 静默不强制族——本条把缺口从"多支 allOf 漏检"扩到 **auto 分派谓词与 xgrammar 真实缺陷域错配**） · 触发 `config` · 置信度 `documented`'
