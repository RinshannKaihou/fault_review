  objects:
  - subsystem: 编译器
    stack: triton
    component: fp8 dot 加法折叠 pass
  behavior: sm_89 上 acc += tl.dot(a,b) 被静默重写为 tl.dot(a,b,acc)，运行和放进 fp8 mma.sync 内部低精度累加，而不是保留显式 fp32 add
