  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（SFPU 条件表达式编译层缺陷：`v_if (a < b) { v_and (a < 1.0f); } v_else { b = 5.0f; } v_endif` 中 `v_and` 位于**非最后一个 v_if block** 时，编译器在 block 末尾而非开头插入 `SFPCOMPC`（状态取反）——汇编自证：`SFPGT L1,L0`、`SFPGT L10,L0` 后紧跟 `SFPCOMPC` 再 `SFPLOADI L1` `SFPENCC 3,10`，谓词状态在装载/编码指令执行时已被取反，后续指令按**反逻辑**生效。具名变量 `v_and(cond1, cond2)` 语义在多 block 条件下静默产生错误掩码/错误分支结果） · Cov: `NEW`（SFPU 谓词状态机时序子签名——`SFPCOMPC` 插入位置错误属编译器/lowering 层，区别于 1.9 类数据通路竞态与 1.99 unpack-sync 竞态族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: tt-metal SFPU `v_if/v_else/v_endif` 控制流宏到 `SFPCOMPC`/`SFPENCC` 指令的 lowering 规则：`AND` 组合谓词位于非末 block 时取反时机提前；issue 附最小重现（4 行 SFPU 代码 + 生成的反汇编序列逐行标注）。
  source: 'tt-metal #57889（2026-09-25 open，含最小重现与反汇编对照）。https://github.com/tenstorrent/tt-metal/issues/57889'
  behavior: 无 crash——以 `v_and` 组合谓词编写的条件 SFPU 内核在多 block 场景下静默产出反逻辑结果；LLK 侧影响面取决于既有内核是否使用该模式（未普查）。
  trigger_surface: tt-metal SFPU 内核开发 + `v_if` 序列中非末 block 的 `v_and`（hw_specific：编译期缺陷、WH/BH 均适用）
