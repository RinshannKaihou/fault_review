cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: PFA tiling 全局残留
  behavior: tiling 用全局变量承接 baseApi per-call 语义但只在 baseApi 分支赋值，末尾无条件加进 tilingKey，历史调用残留污染本次 key，kernel 按错误模板 key 执行触发 AICore 越界。
effect:
  objects:
  - 可用性/进度
  - 数值结果
  detail: 同算子同入参下，先经 SH+sparse_mode∈{20,21,22} 的 baseApi 路径再调普通 PFA，kernel 实收 tilingKey 从 …01012 变为 …401012，AICore 越界失败（3/3 复现）；cold 与 ctrl 组正常。
  visibility: 报错
mitigation:
  detect: 对比 tiling 侧 key 与 kernel 实收 key：ASCEND_GLOBAL_LOG_LEVEL=0 下 grep 'The Tiling key is' 与 'GetKernelByTillingKey'，两者不等即 host 侧二次加工污染。
  fix: 待定（issue open，未见修复 MR）
