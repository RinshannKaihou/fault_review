original:
  mechanism: prompt_flash_attention tiling 用全局变量 BENCHMARK_TILING_KEY 承接「本次是否走 baseApi(ATB) 路径」这一 per-call 语义，但只在 baseApi 分支（inputLayout==SH 且 sparseMode∈{20,21,22}，prompt_flash_attention_tiling.cpp:2933/:5947）赋值、主路径不赋值，而 DoOpTiling 末尾无条件把它加到 tilingKey 上。同进程先跑过一次 baseApi 路径后，再调普通 PFA 会拿到被污染的 key，直接 AICore 越界。910B2 实测（CANN 9.2.0，ops-transformer master dce5bb84，入口 torch_npu.npu_prompt_flash_attention）：目标调用 BNSD {2,8,128,64} fp16 sparse_mode=0，三组对照：cold 无前置 → tiling 侧 key 1012/kernel 实收 1000000000000001012 正常；ctrl 前置 SH+sparse_mode=0（不进 baseApi）→ 正常；warm 前置 SH+sparse_mode=20（进 baseApi）→ tiling 侧仍 1012 但 kernel 实收 2000000000004001012，AICore 越界失败。三组 tiling 侧算出的 key 都是 1012，差异全部来自 tilingKey += BENCHMARK_TILING_KEY 吃到残留高位，warm 组 3/3 稳定复现。
  source: https://gitcode.com/cann/ops-transformer/issues/6417（open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 使用者在一个进程里先用 SH 布局、sparse_mode=20/21/22 的 prompt flash attention（ATB baseApi 路径），之后再调普通 BNSD 布局的 npu_prompt_flash_attention：同样的输入会突然报 AICore 越界（AI Core 异常、任务失败），且三组独立进程每次必现；不碰 baseApi 路径或换新进程就正常。定位手段是开 tiling 日志对比 tiling 侧与 kernel 实收的 tilingKey，两者不等即命中。
  trigger_surface: Ascend 910B2、CANN 9.2.0、torch_npu 2.12.0.post3、ops-transformer master dce5bb84；触发需同进程先执行一次 SH+sparse_mode∈{20,21,22} 的 baseApi 调用。
  discovery: 2026-10-21 每日扫描
