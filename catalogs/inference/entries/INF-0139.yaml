original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（Quasar 比零谓词 gtz/gez/ltz/lez 对 NaN 返回 1.0——谓词只看符号位与"幅值≠0"，无 inf 拒绝项；Wormhole/Blackhole 同名内核载入 `BFLOAT16_INF` 并加 `|v|<=inf` 链显式拒绝 NaN——**修复存在于 WH/BH 而 Quasar 拷贝从未收到**） · Cov: `var:ttmetal_quasar_softplus_threshold_fix_not_propagated`（1.122 修复未跨 arch 传播族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '`quasar/ckernel_sfpu_comp.h:118-132` 以 `(v>=0)&&(mag!=0)` 型谓词分类 lane：`+NaN=0x7FC00000` 符号位清零且幅值非零 → gtz/gez 写 1；`−NaN` 对称破坏 ltz/lez（gtez/lez 的 write-0 谓词为假，lane 保留循环默认 1）。WH/BH `ckernel_sfpu_comp.h:78-131` 在 `|v|!=0` 之上加 `TTI_SFPIADD(0, INF, ABS_V, …GTE0)`（|NaN|>inf → 拒绝）。issue 自述"与 #54857（1.122）同形"。'
  source: 'tt-metal #55273（2026-09-02 open，双 arch 代码对照）。https://github.com/tenstorrent/tt-metal/issues/55273'
  behavior: 无 crash——NaN 被误报为"正/负数"，流入比零谓词的掩码/过滤/select 静默极性反转。1.122（Quasar softplus）、1.129（zero-flag 状态泄漏）之后「修复未跨 arch 后端传播」族第三例，本条在谓词内核。
  trigger_surface: Tenstorrent Quasar + gtz/gez/ltz/lez + NaN 输入（软件可复现）
  discovery: 2026-09-02 每日扫描。
