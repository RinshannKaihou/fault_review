original:
  mechanism: cann/ops-math AccumulateNV2 在 Arch35（Ascend950）+ CANN 9.2.0 通路的动态输入与边界场景有五类问题：TilingKey 编码了 DEF 输入类型约束已覆盖的冗余 dtype 信息；广播场景的输出 Shape 与输入广播 Stride 推导不完整，动态输入或不同 Rank 时可能生成错误的访问参数；空 Tensor / 空广播场景存在非法路径，零维计算可能触发 0 % 0 并继续访问无效数据；非 32 字节对齐的尾块访问存在越界风险；FP16 多输入累加直接使用低精度累加，FP32 多输入累加在边界场景存在舍入误差，造成精度不稳。调用通路为 ACLNN 与 GEIR（ACLNN 场景不下发 N 属性）。复现方式是跑覆盖多输入广播、不同 Rank、空 Tensor、非 32B 对齐尾块、FP16/FP32 多输入累加的动态输入用例；issue 自述对应 Arch35 通路整改，涉及 TilingKey、InferShape、Tiling、Kernel 及 UT，正文未给逐项实测误差量级。
  source: 2026-09-03 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3014 （closed，关联 MR https://gitcode.com/cann/ops-math/merge_requests/5310）
  behavior: 在 Ascend950 上把多个张量做 AccumulateNV2：FP16 输入直接按低精度累加，元素一多结果就慢慢偏；广播形状不一致或 Rank 不同时，输出的访问参数算错；空 Tensor / 空广播用例会走进零维计算（0%0）并继续取数据；元素数不是 32 字节对齐时尾块还越界访问。这些都不报错，表现是精度不稳或偶发异常。
  trigger_surface: ops-math AccumulateNV2 的 Arch35（Ascend950）+ CANN 9.2.0 通路，ACLNN 与 GEIR 调用；多输入/不同 Rank 广播、空 Tensor、非 32B 对齐尾块、FP16 多输入累加
