title: GatherPaKvCache 32B 取整搬运丢尾数据
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: 通用
    component: GatherPaKvCache ND kernel
  behavior: ND kernel 把真实搬运字节数除以 32 写入 DataCopyParams.blockLen 但不处理余数：非 32 倍数的 token 搬运量向下取整，余数字节不搬。
effect:
  objects:
  - KV状态
  detail: INT8、Norm、blockSize=1、num_heads=1 下 head_size=17 时 copyLen=0 整 token 未写；head_size=33 仅写 32B 尾 1B 丢失；K/V 两路均存在。输入满足 README 全部约束，与逐元素按位一致承诺冲突。
  visibility: 静默错误
mitigation:
  detect: 非 32B 对齐 head_size 的 gather 后逐元素比对 KV（报告含源码行级定位）
  fix: 待定（open，master 4bbfb3b2 未修；Host 检查未要求 32B 对齐）
