original:
  mechanism: 按 vllm-ascend 官方文档 docs/source/tutorials/models/DeepSeek-V4-Pro.md 的 A2 默认配置做 PD 分离：Prefill 侧启动命令不带 block size，Decode 侧默认带 block size。报告者指出这使 A2 PD 分离模式下两端 KV transfer 不一致，经 proxy 转发调用即产生乱码。正文附了两侧完整启动脚本（DeepSeek-V4-Pro-w4a8-mtp、MooncakeHybridConnector、prefill dp4/tp8 + decode dp8/tp4、--no-enable-prefix-caching、speculative-config mtp），差异点在 Prefill 未显式配置块大小。issue 未给出两端 KV 布局的具体字节差异，也未给修复 PR。
  source: 2026-08-19 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/14545 （open）
  behavior: 按官方 A2 PD 分离脚本启动 DeepSeek-V4-Pro 后，通过 proxy 发请求得到乱码回答；服务健康、KV transfer 日志正常，没有任何报错提示配置不一致，只有把两端 block size 对齐才恢复。
  trigger_surface: PD 分离 + Prefill/Decode block size 不一致 + MooncakeHybridConnector
