  mechanism: GPTQ（act-order / Cholesky）、AWQ（salient-channel scaling）、SmoothQuant（alpha migration）三种主流 PTQ 方案各自都能保住聚合精度，但会改变**具体生成哪些 token**——即所谓 "Flips" 盲区：基准分数不变，逐 token 输出却已经偏移。
  source: GPTQ arXiv:2210.17323；AWQ arXiv:2306.00978；SmoothQuant arXiv:2211.10438；Flips arXiv:2407.09141。
  behavior: 聚合精度层面 on-manifold（看不出退化），但逐 token 生成结果与 fp 基线不同。（源文档将行为效应与签名合并为一条给出。）
  trigger_surface: 量化后端/位数/KV quant 配置
  signature: model_on，且是最难的一类"无签名故障"：扰动完全落在自洽流形内，geometric / spectral / trajectory 族都只看到与健康量化不可分的微小位移。源文档指出其在概念上已被 7.88 `quant_Nbit` 的 bits × scheme 扫描覆盖，本 fault_name 无独立复现价值。可行的观测轴是 statistical / infotheoretic 族的逐 token logprob 与分布距离，而非隐状态几何。
  repro: 复用既有 quant_Nbit 权重侧 fake-quant 钩子（源文档标注 "yes (existing)"），按 GPTQ/AWQ/SmoothQuant 的缩放差异切换 per-channel 缩放与 alpha migration 参数。
