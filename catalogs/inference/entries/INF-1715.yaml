- url: https://gitcode.com/mindspore/mindspore/issues/28870
  kind: gitcode_issue
relations: []
original:
  mechanism: op plugin 的输入接口 GetFloatInput、GetFloatVecInput、GetOptionalFloatInput、GetFloat2DVecInput 原来以 float 返回，float64 入参在接口层被截成 float32 再参与计算，double 输入因此拿不到应有的精度。修复把返回类型统一成 double，并按实际存储类型读取后提升。同一批改动还包括 grad_math_ops.cc 里 Log/Log2/Log10 的复数梯度：原实现没有用共轭参与链式求导，复数输入的反向结果与 PyTorch 不一致。涉及 custom_kernel_input_info.h/_impl.h、op_plugin/utils/op_utils.h/.cc。环境写 Ascend、CPU、GPU，版本 master 与 2.8.0 分支。
  source: 2026-01-16 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/28870 （closed）
  behavior: 在 CPU op plugin 路径上用 float64 跑数学算子，结果精度只有 float32 水平，和 PyTorch 的 double 结果差得比预期多，但没有报错也没有 NaN；复数 Log/Log2/Log10 做反向时梯度方向不对，训练里表现为这些算子的梯度始终对不上参考实现。
  trigger_surface: CPU op plugin 后端，float64/double 入参，或 complex64/complex128 输入走 Log/Log2/Log10 反向
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
