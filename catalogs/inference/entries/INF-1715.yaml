id: INF-1715
legacy_ids: []
slug: ms_op_plugin_float_input_double_truncation
aliases: []
title: op plugin 按 float 读入参致 float64 精度丢失
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: op plugin 标量入参读取
  behavior: GetFloatInput 系列接口以 float 为返回类型读取算子浮点入参，float64 输入在接口层就被截断成 float32；复数 Log 梯度分支也没有取共轭。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: 在 CPU op plugin 路径上用 float64 跑数学算子，结果精度只有 float32 水平，与 PyTorch double 结果差得比预期多但不报错、无 NaN；complex64/complex128 走 Log/Log2/Log10 反向时梯度方向不对，训练中始终对不上参考实现。
  visibility: 静默错误
mitigation:
  detect: 用 float64 输入跑 op plugin 路径的数学算子，比较 float32 与 float64 结果的相对误差；complex 场景直接用 Log 的解析梯度做对照
  fix: issue 自身即修复说明：接口返回类型统一为 double/vector<double>，按实际存储类型读取后提升；grad_math_ops.cc 抽 IsComplexType，Log/Log2/Log10 复数梯度改用共轭；补 Log/Reciprocal/Exp2/Sinh 复数 ST（issue 已 closed）
labels:
  stage: N/A
