original:
  mechanism: vLLM 0.32.0（v1/attention/backends/flashinfer.py L2264-2271）native FlashInfer 路径在 FP8 K/V 下把 layer._q_scale_float 传给 kernel，即使 Q 是 BF16/FP16 且未经 FP8 量化——非单位 query scale 因此错误缩放注意力（sm_scale*q_scale），q_scale=1 时掩盖。CPU 参数边界复现（调用真实 FlashInferImpl.forward，GPU 包装换数值替身）：stored_q_scale=1.0 时 passed=1.0；stored_q_scale=0.25 时 passed=0.25、error=1.234（断言 "BF16 Q must not receive FP8 query descaling"）；query-dtype 修复后两档 passed=1.0。服务实测：Qwen3.8-27B FP8 非单位 attention scale 在 0.29.0/0.32.0 输出垃圾、0.23.0 通过检查；修复后恢复。#53481 线程、#53754（gaoxiaomo）修复 PR、Ministral 复现同在。
  source: https://github.com/vllm-project/vllm/issues/63043（vLLM 0.32.0 CPU 边界复现 + 0.29/0.32 服务实测）
  behavior: FP8 KV cache 模型（如 Qwen3.8-27B FP8）以 BF16 查询运行 vLLM 0.29-0.32 native FlashInfer 后端且注意力 q_scale 非默认 1 时，请求输出垃圾文本；无报错。同配置 q_scale=1 正常，dtype 修复后同请求恢复正常输出。
  trigger_surface: vLLM 0.29-0.32 + native FlashInfer + FP8 K/V + BF16/FP16 Q + 非单位 q_scale
  discovery: 2026-10-22 每日扫描
