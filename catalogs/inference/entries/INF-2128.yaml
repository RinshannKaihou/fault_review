original:
  mechanism: Ascend TorchBench --accuracy（torchbench.py）在 NPU 上系统性误报 fail_accuracy：resnet18/50 fp32 推理（v2.13.0-26.2.0 分支与 master@ec69335 双版本可复现、偏差逐位一致，eager vs compiled maxdiff≈4.85e-4 超 allclose@1e-4）。根因链：上游判据是两段式——same() 先 allclose(tol)，失败后用 fp64 golden 做 RMSE 比值宽松回退（res_error ≤ 2.0×ref_error + tol/10）；本 case res/ref≈1.03 本应判过。NPU 上链条静默断裂：(1) NPU 无 float64 内核，x.double()/x.to(torch.float64) 被静默替换为 float32（ToKernelNpu.cpp:40 仅 W 告警）；(2) fp64 golden 采集退化为第二次 fp32 前向，产出伪 golden（无异常无提示）；(3) same() 的 fp64 回退以 fp64_ref.dtype==torch.float64 为门槛被静默跳过；(4) 判据退化为裸 allclose 绝对阈，合法求值顺序差异被判失败。插桩实测最终 same() 调用点 fp64_outputs 为 Tensor 但 dtype=float32；同偏差下真 fp64 golden（CPU）判 True。上游 H100 nightly 同链全绿。修复 PR !48370（CPU 算 fp64 golden）open。预训练权重是必要条件（真实 BN running_var 决定偏差量级）。
  source: https://gitcode.com/Ascend/pytorch/issues/5602（v2.13.0-26.2.0/master 双版本复现 + 插桩证据）；修复 https://gitcode.com/Ascend/pytorch/merge_requests/48370（open）
  behavior: 在 NPU 上跑 TorchBench 精度评测（--accuracy）时，resnet/densenet 等 CV 模型被系统性误报精度失败（fail_accuracy）：合法的浮点求值顺序差异（与 fp64 真值等距）被判为错误；fp64 参考（golden）被静默降级为 float32 后宽松回退判据失效。评测结论失真，用户误以为算子/编译有正确性缺陷；同链 H100 全绿可对照。随机权重测不出，须预训练权重。
  trigger_surface: Ascend NPU + TorchBench --accuracy（fp32 推理、预训练权重）；NPU 缺 float64 内核的机型
  discovery: 2026-10-22 每日扫描
