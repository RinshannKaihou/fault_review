original:
  category: cat8
  section: 第 8 类 · KV 缓存 / 注意力机制故障
  meta: '`infra_off`（KV-sharing 层（Gemma-3n/Gemma-4 E 系列 `num_kv_shared_layers`）读 **target 层**以 target 的 `k_scale`/`v_scale` 写入的量化 KV cache，但量化 KV checkpoint 对 sharing 层无 scale（它们没有 K/V 投影、llm-compressor 不产出）——这些层停留 1.0 默认值、以错 scale 反量化：Gemma-4-E2B NVFP4 KV 实测 layer 15-34（20 个 sharing 层）k=v=1.0 而 layer 0-14 带校准值，attention 输出相对误差 0.40-0.91（正常层 0.10-0.26）；修复把 target 层 scale 传播到 sharing 层后 needle 检索 2/9 → 7/9（bf16 KV 基线 5/9）） · Cov: `var:vllm_qwen35_kv_scale_checkpoint_route_missing_autoweights_loader`（8.59 KV scale 路由缺失族） · 触发 `config` · 置信度 `verified`'
  mechanism: '缓存生产者（target 层）与消费者（sharing 层）的 scale 语义在绑定共享缓存时未同步。修复在 worker KV-cache 设置处（modular `init_kv_cache` 与 legacy `initialize_kv_cache_tensors` 双路径）把 target 的 scale 拷贝到 sharing 层（`torch.no_grad()` 下，scale 可为 nn.Parameter）；fp8 KV 同样适用（FlashInfer 把 k_scale 折进 softmax scale、v_scale 施于输出）。同 class 的 Gemma-4 MTP draft 层变体已由 #49262 处理（speculator 私有拷贝），本条是 target 模型自身 sharing 层、与 spec 无关。'
  source: 'vLLM PR #55559（2026-09-06，bug/quantization/mrv2 label，含逐层 scale dump、逐层误差对照与 needle 前后对照）。https://github.com/vllm-project/vllm/pull/55559'
  behavior: 无 crash——量化 KV + KV-sharing 架构下**过半层注意力输出系统性偏差**（0.4-0.9 相对误差），长文 needle 检索质量退化（不是塌方：chat 格式 8/8 不变——**静默质量回归**最难发现的档位）。8.59（Qwen3.5 KV scale 加载路由缺失）之后 KV scale 传播域第二例：加载路由 → 共享绑定传播。
  trigger_surface: vLLM + Gemma-3n/Gemma-4-E（num_kv_shared_layers）+ 量化 KV（NVFP4/fp8）checkpoint（模型×量化组合触发）
  discovery: 2026-09-06 每日扫描。
