  signature: ON-manifold。这条的意义主要是反面警示：cheap 族中以 perplexity / 平均 log-prob 为代表的廉价健康检查在此故障上不仅失效，而且会给出与真实退化反向的信号，因此不能作为长上下文健康度的单一 gate。可用的方向仍是 trajectory / spectral 族的长度扫描；源文档未给出更具体的可捕获度量。
  repro: 仅提示集构造，无模型改动——固定推理题目内容，只在前缀追加无信息 padding 做长度扫描，同时记录 perplexity 与推理正确率两条曲线以复现反相关；不挂钩子。
