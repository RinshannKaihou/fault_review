  objects:
  - subsystem: 算子/内核
    stack: cann
    component: synccheck 跨函数依赖分析
  behavior: 同一块 UB 在 Init 里由 Vector 的 Duplicate 初始化、随后在 Process 里被 DataCopyPad 写入，两处共用 buffer 且只插了 MTE2→V 方向，synccheck 未报缺 V→MTE2 同步
effect:
