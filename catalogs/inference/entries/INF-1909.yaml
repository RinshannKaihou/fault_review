original:
  mechanism: AscendC 算子 FlatQuantBnn 在 Init 函数里从同一 bufQueue 取一块 UB，用 ReinterpretCast 起了多个别名：xTensor 与 p1Tensor 指向同一段内存（x2Tensor/p2Tensor 按 Mceil×Nceil 偏移切分）。Init 里对这块内存做 Duplicate<T>(xTensor, 0, ...) 等 Vector 初始化；Process 里再对 p1Tensor 做 DataCopy(p1Tensor, p1GM[...]) 或走 DataCopyPad 分支搬运。代码在搬运之后只插了 set_flag(PIPE_MTE2, PIPE_V) / wait_flag(PIPE_MTE2, PIPE_V) 一个方向，缺 V→MTE2 的反向同步；按流水并发语义，Vector 的 Duplicate 可能还没结束，MTE2 的 DataCopyPad 就已经开始往同一块 buffer 写，拷进来的数据会被 Vector 操作覆盖，于是单测精度时好时坏。人工补 SetFlag<HardEvent::V_MTE2>/WaitFlag 后问题消失，确认为竞争。提交者用 mssanitizer --kernel-name=FlatQuantBnn --tool=synccheck 扫描，期望工具指出这条跨函数（Init 与 Process 之间、同一 buffer 别名）的缺失同步，实际在 CANN 8.5.1（910B2）与 CANN 9.1.0（A5 950PR）上都只输出无关 WARNING、没有 Error，即这类跨调用点的 V/MTE2 竞争被漏报。
  source: '2026-09-01 GitCode Ascend/mssanitizer issue #206 https://gitcode.com/Ascend/mssanitizer/issues/206（closed；CANN 8.5.1/9.1.0，910B2 与 A5 950PR）'
  behavior: 算子的单元测试精度时好时坏，怀疑是流水同步没写全，于是用 mssanitizer 的 synccheck 模式扫一遍，结果一条 Error 都没有，只有一堆不相关的 WARNING；最后人工按 buffer 复用关系补了一条 V→MTE2 的 SetFlag/WaitFlag，精度立刻稳定，说明真正缺失的同步工具没扫出来。
  trigger_surface: AscendC 算子 + 跨函数（Init/Process）复用同一 UB buffer + --cce-auto-sync=off；单测精度间歇失败
