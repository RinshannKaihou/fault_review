original:
  mechanism: 'ops-transformer issue #5385（Atlas A3 910_93 16/32 卡、A2，CANN 9.2.0，closed）：MegaMoe（mc2/mega_moe）在 expertPerRank%8!=0 时输出精度错误，两处独立缺陷。其一，CacheRouteTablesToUb 用 2D DataCopyPad 把 tokenPerExpert 路由表搬进 UB，UB 侧每个 block 实际占用向上 32B 对齐的空间（行距=AlignUp(expertPerRank,8)），epr%8!=0 时 UB 行距大于 GM 侧紧凑步长，而 dispatch/combine/epilogue 仍按紧凑步长 expertPerRank 索引，导致 dstEpIdx>=1 的路由数据错位；受影响内核为 A3 内核加 A2 的 bf16/int8/bf16_w4a8 三个内核。其二，output_1（expert_token_nums）的清零/累加/写回用普通 DataCopy（要求 GM 地址与长度均为 32B 倍数），epr%8!=0 时偏移与长度非 32B 对齐，结果错乱。典型触发：32P（epr=28）用例 kimi_k3_32p_int8_64bs_16k_3584h 精度失败，16P（epr=56）因天然对齐不受影响。修复 PR master !12208、9.2.0 !12209。'
  source: 2026-09-17 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/5385 （closed）
  behavior: 在 32P（每 rank 28 个专家）上跑 MegaMoe 的 MoE 层，output_0 与 expert_token_nums 都与 golden 对不上，loss 与后续层随之偏移；换 16P（每 rank 56 个专家）同一模型就正常。表现只是精度不达标，没有报错也没有越界告警，所以容易当成量化误差忽略。
  trigger_surface: Atlas A3(910_93)/A2 + CANN 9.2.0 + mega_moe + expertPerRank%8!=0（如 32P epr=28）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
