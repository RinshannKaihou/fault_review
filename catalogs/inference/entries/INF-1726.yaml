mitigation:
  detect: 取 expertPerRank%8!=0 的卡数（如 32P，epr=28）跑 MoE 端到端精度，同时校验 expert_token_nums
  fix: PR !12208（master）与 !12209（9.2.0 cherry-pick）：按对齐行距索引路由表，ExpertTokenNums 改用对齐的搬运算子
