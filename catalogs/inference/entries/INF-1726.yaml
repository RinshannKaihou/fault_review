title: MegaMoe epr%8!=0 时路由表 UB 行距不对齐
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: mc2 mega_moe UB 搬运
  behavior: CacheRouteTablesToUb 用 2D DataCopyPad 搬路由表，UB 行距被上对齐到 AlignUp(epr,8)；epr%8!=0 时消费方仍按紧凑步长 epr 索引，dstEpIdx>=1 的数据错位。
effect:
