id: INF-1672
legacy_ids: []
slug: ms_leaky_relu_alpha_float32_rounding
aliases: []
title: float64 输入下 leaky_relu 的 alpha 先按 f32 舍入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: leaky_relu alpha 标量转换
  behavior: CPU 后端 PyNative 与 Graph 下，float64 输入且非精确 Python 浮点 alpha（0.2）时，alpha 先转 float32 再扩展到 float64 参与计算。
effect:
  objects:
  - 数值结果
  detail: x 为 float64、alpha=0.2 时 PyNative 与 Graph 输出都偏离 float64 公式 3.725290298461914e-09，误差量级正好对应 alpha 的一次 f32 舍入。
  visibility: 静默错误
mitigation:
  detect: float64 输入 + 非精确 alpha（0.2）与 np.where(x>=0,x,alpha*x) 的 float64 结果比较；出现 ~1e-9 量级偏差即命中，再换 alpha 为可精确表示的 0.5 做对照
  fix: 待定（issue open，无修复 PR）；方向：float64 输入时 Python alpha 直接按 float64 转换，不经 float32
