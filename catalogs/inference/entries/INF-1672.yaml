original:
  mechanism: MindSpore 2.9.0 / 2.10.0（PyPI 官方 CPU 轮子，Python 3.11.15，Ubuntu 24.04 WSL2）：x 为 float64（np.linspace(-1.25,1.1,6).reshape(2,3)）、alpha=0.2 时，ops.leaky_relu 在 PyNative 和 Graph 下输出 dtype 都是 float64，但与 np.where(x>=0,x,np.float64(0.2)*x) 的最大绝对误差为 3.725290298461914e-09。issue 指出该误差恰好对应先把 alpha 转成 float32 再扩展到 float64：0.2 的 float32 表示与 float64 表示不同，单精度舍入被带进双精度计算。两个版本均复现，无修复 PR。
  source: 2026-08-14 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29607 （open）
  behavior: 双精度链路上调用 leaky_relu，alpha 传 Python 浮点 0.2，输出 dtype 仍是 float64、值域也正常，只有和手写双精度公式对比才看到 3.7e-09 的偏差。对需要 float64 精度基线的回归（数值对齐、梯度校验、与 PTA float64 对拍）会被这一位误差卡住，且很难判断是算子还是自己公式写错。
  trigger_surface: float64 输入 + 非精确 Python 浮点 alpha（0.2）；PyNative 与 Graph 都受影响，CPU 后端
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
