  meta: '`infra_off` · Cov: `NEW`（无既有故障改动 norm 的**位置**；`bug_rmsnorm_eps` 只扰动 epsilon） · 触发 `yes` · 置信度 `documented`'
  mechanism: 把归一化从子层之前（pre-norm，所有现代 decoder 的做法）移到残差相加之后（post-norm），破坏了残差高速公路。用一份按 pre-norm 训练出来的权重去跑 post-norm，会灾难性地扭曲激活分布。
  source: Nguyen & Salazar, "Transformers without Tears", IWSLT 2019（arXiv:1910.05895）。
  behavior: 灾难性：到了深层就是垃圾输出或 NaN，质量严重崩塌。
  trigger_surface: 实现 patch/错误配置
  signature: 从第 1 层起就大幅 off-manifold：残差流范数**不再随深度增长**。geometric（per-layer norm growth）+ trajectory 度量可以轻易捕获，是本目录中最容易检测的一类。
  repro: 真实 pre-norm 为 `h_out = h_in + f(RMSNorm(h_in))`，真实 post-norm 为 `h_out = RMSNorm(h_in + f(h_in))`。forward_hook 只能观察到已经算完的 pre-norm 输出，无法在不重跑子层的前提下恢复 `f(h_in)`，所以在单钩子分辨率上做诚实近似：用 `f_out = hook_output - h_in` 还原子层贡献，再用该 block **自己的** RMSNorm 学习增益与 eps（`post_attention_layernorm`，与 `input_layernorm` 同类、具有匹配的 `.weight`/`.variance_epsilon` 接口）对残差和 `h_in + f_out` 重新归一化。**核验注**：这是"把 norm 移到残差相加之后"在单个 hook 点分辨率上的近似，**不是**字面意义的架构改写（那需要 patch block 自身的 forward 以跳过其内部 pre-norm 调用，hook 做不到）。
