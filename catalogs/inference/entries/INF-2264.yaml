original:
  mechanism: SGLang 调度器重牵引（retraction）语义缺陷：当调度器 retract 运行中请求并稍后重新 prefill 时，请求的采样惩罚累加器（frequency_penalty、presence_penalty、repetition_penalty）与 min_new_tokens 计数器被重置为零，从重牵引点起按未生成过任何 token 惩罚，后续 token 与同一请求不 retract 时的输出不同（min_new_tokens 请求还会超长生成），完全静默（无错误、文本看似合理、相同输入、greedy、默认配置）。retraction 无需 opt-in：decode 循环在 check_decode_mem() 失败时自动调用 retract_decode（managers/scheduler.py:4472-4488，KV-cache 压力下自动发生），优先级抢占和文档化的 /pause_generation {"mode":"retract"} 也触发。reset_for_retract 保留已生成的 output_ids（managers/schedule_batch.py:2072-2123），但重 prefill 构建 fresh BatchedPenalizerOrchestrator（sampling/sampling_batch_info.py:276-285），历史计数丢失。
  source: GitHub issue https://github.com/sgl-project/sglang/issues/47245 （open，2026-10-29，含代码行号定位）
  behavior: 在线服务 KV cache 吃紧时（或优先级抢占、/pause_generation retract），被重牵引再续跑的请求会忘记自己已经生成过哪些 token：带 repetition/frequency/presence penalty 的请求从续跑点起惩罚完全失效（相当于没开），同一请求与不重牵引版本在 greedy 下输出直接不同；设了 min_new_tokens 的请求会超长输出。全程无报错、日志默认无区分，输出内容看起来仍然合理。
  trigger_surface: SGLang 服务；decode KV 压力触发自动 retract、优先级抢占或显式 /pause_generation retract；使用任意 sampling penalty 或 min_new_tokens 的请求。
  signature: 同请求 retract/不 retract 的 greedy 输出 diff；retract 后惩罚项效果消失。
  repro: issue 正文含触发路径与代码行号；端到端复现步骤依赖 KV 压力构造。
  discovery: 2026-10-29 每日扫描
