title: circular_pad 单侧 padding=0 跳过越界校验返回错误环绕
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: circular_pad tiling 校验
  behavior: CheckLeftAndRight 只在 left>0 且 right>0 时才比较 left/right 与 inputW；一侧为 0 时整段校验被跳过，超界 padding 直接进 kernel
effect:
  objects:
  - 数值结果
  detail: left=3 > inputW=2、right=0 的 {1,1,2,2} fp32 输入下 API 返回 SUCCESS 且无告警，输出为错误环绕（0 1 2 1 2 0 3 4 3 4）
  visibility: 静默错误
mitigation:
  detect: 对「单侧 padding=0 且另一侧 > inputW」的非法组合建参数校验用例，比对 aclnnCircularPad2d 输出与参考环绕实现，检查是否应拒绝
  fix: issue 内提出将条件改为任一侧超界即失败（closed）；修复 MR 与合入版本未核实
