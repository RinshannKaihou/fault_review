original:
  mechanism: OPS_MATH/conversion/circular_pad/op_host/circular_pad_tiling.cpp 的 CheckLeftAndRight 条件写为 if (left > 0 && right > 0 && (left > inputW || right > inputW))，只有左右两侧都非 0 才做「不得大于 inputW」的比较。因此 left=3、right=0、inputW=2 时校验直接放行，GetWorkspaceSize/Launch/SynchronizeStream 全部返回 0，超界 padding 进入 kernel 生成错误环绕。环境为 CANN 9.1.0-beta.3、ops-math 2d1098d3e902、Ascend910B3，源码编译单算子包装入 ASCEND_CUSTOM_OPP_PATH 后复现，进程退出码 42。
  source: '2026-08-03 GitCode cann/ops-math issue #2484（closed）。https://gitcode.com/cann/ops-math/issues/2484'
  behavior: 用 aclnnCircularPad2d 处理 {1,1,2,2} 的 fp32 输入、padding={left=3,right=0,top=0,bottom=0}，接口不报错、返回成功，但输出张量出现错误的循环环绕值（0 1 2 1 2 0 3 4 3 4）；调用方看到的是参数被接受、数字看似合理但实际错。
  trigger_surface: circular_pad tiling 的单侧 padding=0 且另一侧大于 inputW 的非法参数；CANN 9.1.0-beta.3 + Ascend910B3
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
