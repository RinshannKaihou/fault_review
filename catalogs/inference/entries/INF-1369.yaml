original:
  mechanism: 'tt-metal main @337e303cd55（2026-10-13）在 Wormhole 上：ttnn.gather 对 rank>4 张量、归一化负 dim 后 dim<rank-3 时返回乱序值——输出形状正确、index 与输入同形也无报错。缺陷位于把低维合并进带 batch 的 4D 视图再转置交给 gather 内核的准备层，所用逆转置与合并方式不匹配（issue 标题即 wrong inverse transpose）。唯一正确例外：dim==rank-4 且其前所有维度为 1（此时合并维只含被 gather 的维）。影响矩阵：rank5 dim 0,1 错、2,3,4 对；rank6 dim 0,1,2 错、3,4,5 对。TILE 走 codegen、ROW_MAJOR 走 native、TILE+gather_force_native 也失败，三路同样错误输出，证明缺陷在共享准备层。本条为 #58402 第 18 项拆出的独立跟踪项，同缺陷在 #56880 的评论中也已报告。复现为纯 torch/ttnn 脚本（[2,2,32,32,64] dim1、[2,3,1,1,32] dim0/1/2、[2,3,2,4,5,32] dim2 等形状族）。'
  source: tt-metal issue https://github.com/tenstorrent/tt-metal/issues/60398（2026-10-13 open，0 评论；#58402 item 18 拆分 + Wormhole 复现脚本 + 影响矩阵）
  behavior: 无 raise 无 assert；输出形状正确但内容乱序（scrambled）；同输入每次运行一致错误（确定性错值，非随机）
