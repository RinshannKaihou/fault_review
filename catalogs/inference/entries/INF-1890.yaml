  mechanism: 'vLLM-Ascend 0.23.0rc1（vLLM 0.23.0、CANN 9.0.1、A3 双机 DP2×TP8×EP16、W4A8_DYNAMIC、VLLM_ASCEND_ENABLE_FUSED_MC2=1、eager prefill）中，csrc/mc2/dispatch_ffn_combine_w4_a8/op_kernel/dispatch_ffn_combine_w4_a8_kernel.hpp 的 CombineV2 以 cumsumMM 得到 packed 行数，却与 token 行容量 params.maxOutputSize 比较并在 preSrcExpertSum + currentExpertM 超限时把 currentExpertM 置 0，导致较早专家 packed 计数超过容量后后续本地专家被截断。源码 commit 1a086ce8ab27a01d2b2fdef32797b6d989f4727f L1128-L1179。issue 指出与 #8320（padding token 溢出容量）及 workspace 别名复用是不同缺陷。'
