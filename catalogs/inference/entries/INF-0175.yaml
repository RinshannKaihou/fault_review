  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（Blackhole `bitwise_right_shift` 越界移位量（[0,31] 之外）返回错值而非 0：负移位量变左移（`8 >> -1 = 16`、`1024 >> -8 = 262144`）——`ckernel_sfpu_shift.h` 的范围守卫把寄存器选择符 `p_sfpu::LCONST_0` 传到指令修饰符位置、且缺其左移兄弟有的 `TTI_SFPCOMPC`，符号扩展块随即在守卫本应清零的 lane 上执行） · Cov: `var:ttmetal_remainder_sfpu_overshoot_correction_bypass`（1.103 SFPU 守卫旁路族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: SFPU 指令的守卫实现错误（选择符 vs 修饰符编码位错置 + 缺 comparator 指令），修复改用 Wormhole 已有的 SFPI 实现（守卫最后施加）。80 个值/移位组合从 25 错修到 0（ttsim Blackhole 验证）。注：负值越界移位处 kernel 契约/Wormhole/左移兄弟给 0，而注册 golden（torch）饱和到 -1——修复选择跟 Wormhole 而非 golden。
  source: 'tt-metal PR #55572（closes #55332，2026-09-06，p0/pr-risk:high）。https://github.com/tenstorrent/tt-metal/pull/55572'
  behavior: 无 crash——越界移位静默错值（负移位变左移放大而非清零）。1.103（remainder 校正旁路）之后 SFPU 守卫编码域第二例；「守卫存在但实现编码错」与「守卫被旁路」是同族两种显形。golden 与硬件语义分歧本身（饱和 vs 归零）也是测试基准域的注脚。
  trigger_surface: tt-metal Blackhole + bitwise_right_shift + 越界移位量（hw_specific；数值触发）
