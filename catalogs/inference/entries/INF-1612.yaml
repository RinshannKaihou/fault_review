pattern: PAT-INF-0180
original:
  mechanism: 'MindSpore 2.8.0（CPU，Python 3.12）：x=int32 [-2147483648,-9,0,9,2147483647]，y=int32 [3,-2,1,4,-7]。PYNATIVE_MODE 下 ops.true_divide(x,y) 得 Float32；GRAPH_MODE 下 @ms.jit def func_arg(a,b): return ops.true_divide(a,b) 传参调用也得 Float32；同一表达式改成无参 @ms.jit def const_func(): return ops.true_divide(x,y)（走 Graph Const 常量折叠）得 Float64，数值也从 -7.158279e+08 变成 -7.15827883e+08。issue 指出该 dtype 不一致会把隐式 Float64 张量带进静态图，导致下游严格要求 Float32 的算子类型推导报错。无修复 PR。'
  source: 2026-05-18 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29397 （open）
  behavior: 把除法表达式写成用闭包常量而不是函数入参，编译后输出 dtype 从 Float32 变成 Float64，下游 matmul/cast 因类型不匹配报错；如果下游能接受 Float64，整条链路就静默按双精度算，显存和速度都变，数值与参数版对不上。
  trigger_surface: GRAPH_MODE 下 jit 函数捕获闭包常量做 true_divide（触发 Graph Const 常量折叠）；输入为 int32；MindSpore 2.8.0 CPU
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
