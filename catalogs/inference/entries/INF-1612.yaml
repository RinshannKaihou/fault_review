id: INF-1612
legacy_ids: []
slug: ms_true_divide_const_fold_float64
aliases: []
title: 常量折叠把 int32 true_divide 输出成 Float64
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: mindspore
    component: Graph Const 常量折叠 dtype
  behavior: 编译期常量折叠路径对 int32 输入的 true_divide 把结果提升为 Float64，而 PyNative 与 Graph(Arg) 运行时路径都输出 Float32，同一表达式两种 dtype。
effect:
  objects:
  - 数值结果
  detail: x/y 为 int32 时 Graph(Const) 得 Float64、PyNative 与 Graph(Arg) 得 Float32；隐式 Float64 进静态图，下游严格要求 Float32 的算子报类型错，放行则整图按 Float64 算。
  visibility: 静默错误
mitigation:
  detect: 同一表达式分别在 PyNative、jit(带参数)、jit(闭包常量) 下打印输出 dtype；三者不一致即为常量折叠 dtype 推导缺陷
  fix: 待定（issue open，2.8.0）；方向：常量折叠复用运行时的 promote 规则
labels:
  family: infra_off
  trigger: other_stack
  trigger_review: false
  trigger_note: MindSpore 2.8.0 CPU；GRAPH_MODE 下闭包常量走 Graph Const 常量折叠，int32 true_divide 被推成 Float64
