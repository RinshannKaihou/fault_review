  mechanism: 'vllm-ascend issue #2767（2025-09-05，closed）：GLM-4.5 在 DP2+TP8+EP 下精度错乱，维护者在 issue 正文与评论里给出根因——「wrong implementation of allgather moe_comm_method when enable EP」，纯 TP 路径不受影响。评论补充定位过程：先按 DP+EP 与纯 TP 对照确认只在 DP+EP 复现，再用 vllm-ascend 0.10.0rc1 测试发现不回退，于是把区间收敛到 0.10.0rc1 与 0.10.1rc1 之间的 PR 集。同一根因的另一份报告是 issue #2537（v0.10.0rc1 镜像，复杂问题回答混乱），wangxiyuan 指向 PR #2601，shen-shanshan 在 #2537 里贴出与 #2767 一致的 root cause。规避手段是纯 TP16 部署，或套用 PR #2898，上游侧对应 vllm PR #24849。'
