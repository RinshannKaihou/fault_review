id: INF-1591
legacy_ids: []
slug: cann_recurrent_gated_delta_rule_fp32_state_copyout_sizeof
aliases: []
title: recurrent_gated_delta_rule state 拷贝错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: rdv CopyOutState 拷贝长度
  behavior: arch35 CopyOutState 用 sizeof(outType)（bf16=2B）算 blockLen 与 srcStride，state 为 fp32 时字节数、步长都错；golden 对 fp32 state 未 clone。
effect:
  objects:
  - KV状态
  - 数值结果
  detail: state为fp32且输出为bf16时，rdv 74参数组合的fp32-state系列（param_combinations2/3）精度校验失败：PctThd 99.50%、PctRlt 1.920128%、Max-RelativeError 1.9999902；bf16 state正常。
  visibility: 静默错误
mitigation:
  detect: state dtype=fp32 而输出为 bf16 的 rdv 用例（bash test_run.sh rdv），核对 state 逐行内容与 PctRlt 是否超 PctThd
  fix: PR 9182 （blockLen/srcStride 改用 sizeof(stateType)；golden 的 initial_state 加 .clone() 避免原地污染）
