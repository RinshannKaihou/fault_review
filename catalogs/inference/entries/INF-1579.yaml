- url: https://gitcode.com/mindspore/mindspore/issues/29175
  kind: gitcode_issue
relations: []
pattern: PAT-INF-0168
original:
  mechanism: Ascend 动态图 + DVM 无图融合（MS_DEV_PYNATIVE_FUSION_FLAGS="--opt_level=1"），master：LazyFusionKernelAscend 构图时用 ops_map_ 判断输入是融合内部中间结果还是外部输入，key 是 device_address（裸指针）。view 类算子（Reshape/Transpose/Slice）的输出与输入是不同 TensorPtr 但共享 device_address。复现：x1 为 (100,) float32，y0=ops.reshape(x1[10:18],(2,1,4))、y1=x1[40:44]（(4,)），y2=AddExt(mul(x0,y0), y1)；mul 先把 y0 以 (2,1,4) 的 Load 写入 ops_map_[0xABCD]，AddExt 用 y1 的同一地址命中该条目，复用 (2,1,4) 的 Load 而不是新建 (4,) Load，DVM 后续按错 shape 计算。
  source: 2026-03-04 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29175 （open）
  behavior: 同一段 PyNative 代码对同一个大张量切出两个切片、其中一个还 reshape 过，再分别参与运算，开启无图融合后结果算错；因为两个切片地址相同、形状不同，错误表现为某个分支的数字整体对不上，没有异常也没有 shape 报错。
  trigger_surface: Ascend PyNative + DVM 无图融合 --opt_level=1；同一基张量经 slice/reshape 产生多个共享 device_address 的 view 后混用
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
