id: INF-1579
legacy_ids: []
slug: ms_dvm_ops_map_view_address_collision
aliases: []
title: view 算子共享 device_address 致融合取错输入
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: mindspore
    component: DVM ops_map_ 地址键
  behavior: ops_map_ 以 device_address 裸指针为 key，slice/reshape 出的多个 view 共享同一地址却 shape 不同，后一个 view 命中前一个的 Load 节点。
effect:
  objects:
  - 数值结果
  detail: x1[10:18] reshape 成 (2,1,4) 与 x1[40:44] 的 (4,) 地址相同，AddExt 复用 (2,1,4) 的 Load，DVM 按错 shape 计算，输出错误。
  visibility: 静默错误
mitigation:
  detect: 对同一基张量切多个 slice/view 后混用，比较开关 DVM 融合的输出；或打印 ops_map_ 的 key 与命中的 Load shape
  fix: 待定（issue open，master）；方向：key 改为 TensorPtr/alias 标识或 (address, shape, stride)
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: ''
