  meta: '`infra_off`（P2P kv_offload tier `_timeout_pending_store_jobs` 把超 30 s 的 store job 判失败并解钉主槽，但该 job 可能**已挂在运行中的 RDMA 传输上**：传输继续读、槽可被复用覆写、传输完成后 `_settle_xfer_jobs` 因 job 已移除而跳过——round 以 `TransferDoneMsg(success=True)` 收尾，消费者从传输期间可能被覆写的块解码（静默 KV 损坏；触发需 >30 s 慢传输，如降级 RDMA 路径）。#59329 只处理了尚未 fetch 的 parked 块） · Cov: `NEW`（超时清理与在途传输生命周期错转子签名） · 触发 `partial` · 置信度 `documented`'
  mechanism: 超时 sweep 不检查 `_inflight` 归属；成功回报与实际数据完整性脱钩。
