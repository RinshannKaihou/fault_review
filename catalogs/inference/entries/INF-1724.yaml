title: FD 全遮挡行 LSE 哨兵 -FLT_MAX 与 +inf 不一致
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: arch35 FD LSE VF
  behavior: arch35 公共 FD LSE 用位模式 0xFF167699（约 -2e38）判全遮挡行，而 FA softmax 约定的无效行哨兵是 0xFF7FFFFF（-FLT_MAX），FD 行遂写成 -FLT_MAX。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: Flash MLA FP16、Q BNSD[5,18,509,576]、KV PA_BBND 下 45810 个 LSE 点中 390 个错误，全为 FD 覆盖的全遮挡行；改非 FD 调度后错误为 0，正常行前后差 3.8e-6。
  visibility: 静默错误
mitigation:
  detect: 构造全遮挡行（causal+长 KV+FD 调度）并开 LSE 输出，检查全遮挡行取值是否为约定的 +inf，同时比对正常行
  fix: PR 12021（master）/12022（9.2.0）：统一 vf_flash_decode_arch35.h 中 5 处 LSE 哨兵判断为 -FLT_MAX_NEW，移除旧位模式与指针强转
