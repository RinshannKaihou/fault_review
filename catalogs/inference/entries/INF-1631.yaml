    component: 首次启动 program 落地
  behavior: Inductor triton_experimental 编出的 odometer 式归约核首次启动时 pid>=group_tail 的 program 全部没落地，其输出单元保持旧值；同进程重启同一二进制即写全，ttir 逐行正确。
effect:
  objects:
  - 数值结果
  - 梯度
  detail: broadcast 反向归约出现 35 行 f16/f32 错值（Mismatched 30/50=60%，恰为高 pid program 拥有的单元），连 aten.add 广播梯度都错，op/dtype 无关，5/5 复现。
  visibility: 静默错误
mitigation:
  detect: 同一输入在首启动与同进程二次启动各取一次结果对比；或对广播反向归约族做逐元素对账（opinfo 已暴露 35 行）
  fix: 规避=同进程二次启动或改回默认 inductor 后端；根因未定位（open）
