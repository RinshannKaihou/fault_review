original:
  mechanism: triton-ascend 3.6.0 + torch 2.14.0a0 + torch_npu 2.14.0（gitb4c7212）+ CANN 9.1.0，Ascend 910B4，仅 TORCHINDUCTOR_NPU_BACKEND=triton_experimental。Inductor 编出的 triton_unk_fused_sum_0（XBLOCK=1、R0_BLOCK=10、num_warps=2、grid=(40,)）是标准 odometer 分组：pid<10 走 IF 分支 base=2*pid、trip=2，写 0-19 号单元；pid>=10 走 ELSE 分支 base=pid+10、trip=1，写 20-49 号单元。首次启动时 ELSE 段的 program 全部没有落地，20-49 号单元保持未写（stale），同进程内对同一二进制再次 launch 则完整写出。报告者已排除数学误编译：ttir 逐行正确，失败面只与 program id 分段有关。下游在 torch inductor NPU opinfo 上表现为 35 行确定性 f16/f32 错值（add/atan2/clamp/copysign/hypot/ldexp/max/min/nextafter/pow/xlogy/where 等），aten.add 的广播梯度同样错，5/5 复现且换进程位级一致。
  source: 2026-09-19 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/2292 （open）
  behavior: 用 torch.compile(triton_experimental) 在 NPU 上跑带广播的反向归约（例如简单的 a+b 求梯度），第一次编译后首次执行就有约 60% 的输出单元是旧值：梯度或结果里成片出现 30/50 不一致、数值像随机残留，而同一进程里再跑一次就全对。没有报错也没有 NaN，重新起进程又回到第一次的错误状态，非常容易误判成测试环境问题。
  trigger_surface: triton_experimental 后端 + 首次 launch + odometer 分组 kernel（grid 分 pid<group_tail 两段 trip）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
