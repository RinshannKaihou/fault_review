evidence:
- url: https://gitcode.com/cann/ops-math/issues/2603
  kind: gitcode_issue
relations: []
original:
  mechanism: experimental reduce_prod_v2 在 axes∉{0,1}（默认 -1）时走 ReduceProdV2Axes2：该分支对 curTileLen（来自未裁剪的 tailDataNum）全量做 Ln + 累加，没有 globalIdx>=totalElements 的跳过判断；tiling（experimental/math/reduce_prod_v2/op_host/reduce_prod_v2_tiling.cpp）用 inputLengthAlign32 分核，因此非 32B 整除的合法输入会把 GM 对齐 pad/OOB 数据（常为 0）读入，Ln(0)=-inf 使乘积变 0/NaN。复现：Ascend910B3 + CANN 9.1.0-beta.3、ops-math HEAD 2d1098d3e902，以 build.sh --pkg --soc=ascend910b --ops=reduce_prod_v2 --experimental 编包并安装到独立 vendor，aclnnReduceProdV2 跑 x=float32 shape{1,5} 全 1、axes=-1、keepdims=1，期望 1.0、实得 0，进程退出码 42（BUG_REPRODUCED）。同族问题分单提交：#2605 reduce_sum_v2、#2488 reduce_mean_v2、#3134 reduce_max_v2、#3135 reduce_min_v2 同为 AxesAll 对齐 pad 污染，max/min 的 pad 零值会把结果拉成 0。
  source: 2026-08-13 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/2603 （closed）
  behavior: 对一个元素个数不是 32 字节对齐的普通张量做全归约（axes=-1），数值就被污染：全 1 输入求乘积得到 0，求和/求均值/求最大最小也能被 pad 的零值带偏。算子正常返回 SUCCESS、没有 NaN 报错，结果看上去只是“算错了”，和 torch 同名归约一比才发现。
  trigger_surface: ops-math experimental reduce_prod_v2/reduce_sum_v2/reduce_mean_v2/reduce_max_v2/reduce_min_v2，axes∉{0,1}（含默认 -1）且 numel 非 32B 整除；Ascend910B3 + CANN 9.1.0-beta.3
