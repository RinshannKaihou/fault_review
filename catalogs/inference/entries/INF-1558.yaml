title: reduce_v2 AxesAll 对齐 pad 污染全归约结果
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: reduce_*_v2 Axes2 kernel
  behavior: Axes2 路径（axes∉{0,1}，默认 -1）对未裁剪的 curTileLen 全量做 Ln 累加，无 globalIdx>=totalElements 跳过；tiling 按 32B 对齐分核，非整除输入把 pad 读入
effect:
  objects:
  - 数值结果
  detail: 'Ascend910B3 + CANN 9.1.0-beta.3，x=float32{1,5} 全 1、axes=-1、keepdims=1 时 prod 返回 0 而期望 1（pad 零经 Ln 变 -inf）；同族 #2605 求和、#2488 均值、#3134 最大、#3135 最小同款'
  visibility: 静默错误
mitigation:
  detect: 用 numel 非 32B 整除的合法 shape（如 {1,5}）配合 axes=-1 全归约，与 torch 同名归约逐元素比对；乘积、最大值这类对 pad 零值敏感的口径最先暴露
  fix: 待定（issue 未给修复 PR；方向是 Axes2 累加前按 totalElements 跳过 pad 元素，与 ReduceProdV2Axes2 的 globalIdx 边界对齐）
