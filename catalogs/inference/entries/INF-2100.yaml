original:
  mechanism: aclnnSinkhorn 输出参数 p 传非连续 Tensor 时不拒绝、返回 0，但 fp32 路径静默忽略 p 的 strides 把结果按连续布局写入，输出内容与语义不符；同样非连续 p 的 fp16/bf16 路径处理正确。文档（math/sinkhorn/docs/aclnnSinkhorn.md 参数表）声明 cost 支持非连续、p 不支持，但实现既不拒绝也不报错。源码 aclnn_sinkhorn.cpp:156-166：fp32 分支 l0op::Sinkhorn(costContiguous, tol, p, ...) 直接把非连续 p 当 kernel 输出（kernel 按连续布局写、strides 完全忽略）；非 fp32 分支先 AllocTensor 连续 pCast 计算再 Cast + l0op::ViewCopy(pOut, p) 按 strides 搬运因此正确；CheckParams 只有 CheckNotNull 与 CheckDtypeValid、无 p 连续性检查。复现（910B2、CANN 9.2.0、ops-math HEAD 3e45432d）：cost fp32 [4,4] 连续，p 三形态——连续对照取 ref；转置视图 view=[4,4] strides=[1,4]；自洽判别对每个 (i,j) 按偏移 A=i*stride0+j*stride1（尊重）与 B=i*C+j（忽略）两种解释从存储读出算 L1，只有 A≈0 为正确、只有 B≈0 为静默错值；fp16 同三步对照。
  source: https://gitcode.com/cann/ops-math/issues/3796（open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 给 aclnnSinkhorn 传转置等非连续的输出张量 p 且 cost 是 fp32：接口返回成功，但结果按连续布局写进了底层存储，从 p 读出来的矩阵内容错位；同样的 p 换 fp16/bf16 输入却正确。文档明写 p 不支持非连续，但实现不给错误码、静默产出错值。
  trigger_surface: Atlas A2（910B2）、CANN 9.2.0、aclnnSinkhorn、fp32 cost + 非连续输出 p。
  discovery: 2026-10-21 每日扫描
