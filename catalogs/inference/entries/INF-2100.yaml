title: Sinkhorn fp32 分支忽略非连续输出 strides 写错位置
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnSinkhorn fp32 分支
  behavior: fp32 分支把非连续 p 直接当 kernel 输出按连续布局写；非 fp32 分支先写连续临时张量再 ViewCopy 按 strides 搬运故正确；CheckParams 对 p 连续性无检查，文档声明不支持却不拒绝。
effect:
  objects:
  - 数值结果
  detail: p 为转置视图（strides=[1,4]）时 fp32 输出内容与语义不符；同样非连续 p 的 fp16/bf16 正确——同接口两分支行为不一致；返回 0 无报错。自洽判别（尊重/忽略 strides 两读法 L1 对比）实锤。
  visibility: 静默错误
mitigation:
  detect: 对输出 p 用转置视图调用并与连续缓冲对照；两读法（尊重/忽略 strides）L1 误差对比定位。
  fix: 待定（应在 CheckParams 拒绝非连续 p 或 fp32 分支补 ViewCopy；issue open 未见修复 MR）
