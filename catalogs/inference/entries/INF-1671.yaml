title: 图模式 simplify_loops 合并非相邻轴致 RoPE 索引错位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: simplify_loops/reindex
  behavior: can_merge_dims 经 Max(1,e)->e 折叠放松后允许非相邻迭代轴合并，而 reindex() 按位置消费索引变量、只能表达相邻轴合并，索引变量被静默错绑。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: Llama-2-7b fp16 bs=1 seq=512 图模式 vs eager cos=0.75（应约 1.0）；同一 kernel 喂 BNSD contiguous 输入逐位正确、喂 mm 行主序输入全错；不抛异常，只掉精度。
  visibility: 静默错误
mitigation:
  detect: 图模式与 eager 跑同一模型比 cos similarity；对可疑 kernel 分别喂 contiguous 与 mm 行主序视图，若前者逐位对后者全错即索引按错误 layout 生成
  fix: PR https://gitcode.com/Ascend/pytorch/pull/47232 （open，未核实合入）：can_merge_dims 开头加相邻轴守卫（b-a!=1 拒绝）；修复后整模型 cos=1.000046、bitwise 确定
