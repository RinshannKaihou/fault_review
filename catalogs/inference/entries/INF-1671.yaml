original:
  mechanism: 'Ascend/pytorch #5209（2026-09-28，open，Ascend 910B2 / CANN 9.1.0 / torch 2.14.0.dev20260801+cpu / torch_npu 2.14.0.dev20260801+git1b64dad，backend=triton_experimental）：torch_npu/_inductor/triton_experimental/fx_passes.py 的 _patched_simplify_loops_impl 中，can_merge_dims 允许合并不相邻的迭代轴，但配套 reindex() 按位置消费索引变量，只能表达相邻轴、外层吸收内层的合并形态。根因是 _install_fold_max1_in_loop_merge 用 Max(1,e)->e 折叠放松了合并测试的数学条件（本意让 conv 输出轴可合并），放松后部分不相邻轴对也通过数学测试，索引变量被错绑到错误位置，生成的 kernel 按错误输入 layout 读取数据。上游原生 simplify_loops 只合并相邻轴。对照实验：同一 kernel 喂 BNSD-contiguous 输入 bitwise 全对，喂 mm 行主序输入全错，证明 kernel 数学正确、索引公式按错误 layout 生成。Llama-2-7b（fp16, bs=1, seq=512）图模式 vs eager 整模型 cos similarity 0.75；触发 kernel 为 RoPE 前置的 neg/slice/transpose（轴 s=512、n=32、d=64）。修复 PR #47232 加相邻轴守卫后 cos=1.000046、bitwise 确定。'
  source: 2026-09-28 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/5209 （open）
  behavior: 同一份 Llama-2-7b fp16 权重（bs=1、seq=512），eager 和 torch.compile 图模式的输出对不上：整模型 cos similarity 只有 0.75，而正常情况下应接近 1.0。没有任何报错或 NaN，看起来就是"模型效果变差"。单独把出错的 RoPE 前置 kernel 拿出来，喂连续布局的输入结果逐位正确，喂 matmul 输出的行主序视图则全错，说明 kernel 本身没算错，是它按错误的布局公式去取数。
  trigger_surface: triton_experimental 图模式 + 存在非相邻迭代轴可合并的循环（如 RoPE 前置 slice/transpose 作用在 mm 输出的行主序视图上）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
