original:
  mechanism: 'vllm/vllm issue #62781（2026-10-21，open）：GDN（gated delta net）线性注意力 fp16 溢出族在 Intel XPU 的复现与修复缺口。1) XPU 对 prefill 与 decode 都走 Triton GDN 路径，此前报告（#54146 AMD MI50、#62116 NVIDIA L40S）均未提 XPU。2) #62119 自述『Known gap』：库级修复被绕过，因 qwen_gdn_linear_attn.py 在 5 处无条件按 activation dtype 分配 core_attn_out 并就地传入 chunk 路径（:974 forward_xpu、:898 fused CUDA decode、:934 generic CUDA、:851 ROCm AITER、:1029 CPU）——v0.27.2 实测核实。3) 两个待合修复都门在 initial_state.dtype==torch.float32；Intel 官方 Holo4-27B 指南的 XPU 配方用 --mamba-ssm-cache-dtype float16，循环状态本身 fp16，未归一化累加器在状态内即饱和 65504，不在门内。实测：Intel Arc Pro B70（Xe2/Battlemage 32GB）+ arcitech-psp/Holo4-27B-AutoRound-W4A16（Qwen3.5 系 64 层、24×linear+4×full_attention/块）+ vLLM 0.27.2rc1.dev77（ac7509e2b）+ vllm-xpu-kernels 0.1.12.3 + oneAPI 2026.2 + NEO 26.27.39122.11；4.7K/18.7K/37.4K token needle 检索 0/9（多语 token soup），短 prompt 完美。含本地 SYCL GDN kernel 补丁（复现用途）。与 INF-1446（GDN chunk prefill fp32 状态降 fp16 溢出）同一『GDN 状态/读出经 fp16 物化溢出』机制，差异：XPU 平台 + 修复缺口（float32 门与 5 处 activation-dtype 分配点未覆盖）+ fp16 状态缓存配置。'
  source: https://github.com/vllm-project/vllm/issues/62781
  behavior: '在 Intel Arc Pro B70 上用 vLLM 服务 Qwen3.5 系 GDN 架构模型（如 Holo4-27B W4A16）时，短问题回答完全正常，但长上下文大海捞针检索 4.7K/18.7K/37.4K token 全部 0/9 找不到；无报错无 NaN，输出读起来正常。即使上游 #54146/#62119 修复合入也不覆盖 XPU 路径与 fp16 状态缓存配置（--mamba-ssm-cache-dtype float16），照官方 XPU 指南配置即中招。'
  trigger_surface: Intel XPU（Arc Pro B70/Xe2）+ vLLM ≥0.27.2 Triton GDN 路径 + Qwen3.5 系 GDN 模型 + 长上下文；--mamba-ssm-cache-dtype float16（Intel 官方指南配方）额外使循环状态本身 fp16 饱和。短 prompt 不触发。
  discovery: 2026-10-28 每日扫描
