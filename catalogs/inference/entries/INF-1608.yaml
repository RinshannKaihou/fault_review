id: INF-1608
legacy_ids: []
slug: ms_quant_matmul_dtype_override_oob_read
aliases: []
title: quant_matmul dtype override 缺宽度校验致越界读
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: mindspore
    component: aclnn QuantMatmul dtype
  behavior: GetQuantMatmulAclDtype 只把 override dtype 转成 aclDataType，不校验字节宽度；新路径按 override 重解释原 device buffer 而非 Cast 出新 tensor。
effect:
  objects:
  - 数值结果
  detail: override 宽于实际 dtype（如 int8 buffer 传 float16/int32）时 ACL 按 numel*itemsize 读 2~4 倍范围，读出相邻显存，结果被污染或非法地址 crash。
  visibility: 静默错误
mitigation:
  detect: 审查 x1_dtype/x2_dtype 等 override 是否与实际 tensor dtype 位宽一致；量化 matmul 输出与 dequant 参考比对，异常时看 ACL 是否报非法地址
  fix: 待定（issue 只给建议：override 字节宽度必须与 tensor->data_type() 一致或按 4bit 规则展开 shape，否则 MS_EXCEPTION；确需变宽的场景保留 PyBoostUtils::CastTensor 路径）
