original:
  mechanism: mindspore/ops/kernel/ascend/aclnn/pyboost_impl/customize/quant_matmul.cc:89（commit 794864e2_9c452665，910b，Python 3.12）：改动把 x1/x2 的 dtype override 语义从真实 Cast 改成按新 dtype 重解释同一块 device buffer——旧代码 PyBoostUtils::CastTensor(x1_val, x1_dtype) 会产出按目标 dtype 定尺的新 tensor，新代码直接构造 AclTensorWrapper{x1, GetQuantMatmulAclDtype(x1, x1_dtype)}，而 aclnn_tensor_wrapper.h:98-144 的 ConvertType 仍沿用原 shape/stride/storage_shape 与 device_address，只换 dtype。aclCreateTensor 按 numel(storage_shape)*itemsize(override) 计算张量覆盖范围，但这块显存是按真实 dtype 的 itemsize 分配的；GetQuantMatmulAclDtype(68-77) 对 override 与实际 dtype 的字节宽度没有任何一致性校验。当 override 更宽（实际 int8/uint8、override float16/int32）时读范围是 buffer 的 2~4 倍，device 侧越界读，结果被相邻显存污染或 ACL 报非法地址 crash。此外 IsFourBitType 只覆盖 ACL_FLOAT4_E2M1/E1M2、不含 ACL_INT4，int4 override 也不做 shape 展开。issue 的复核结论是『真但场景受限』，需用户显式误传更宽 dtype 才触发，无复现脚本。
  source: 2026-09-07 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29671 （open）
  behavior: 调用量化 matmul 时如果把 x1_dtype/x2_dtype 传得比真实权重宽（例如 int8 权重标成 float16），算子不报错、照常返回结果，但读的是权重 buffer 之外 2~4 倍的显存，输出被相邻数据污染；同一份权重不传 override 时结果正常，只有对比才能发现。
  trigger_surface: Ascend 910B + MindSpore pyboost 自定义 quant_matmul 路径；调用方显式传入更宽的 x1_dtype/x2_dtype dtype override（如 int8 权重传 float16/int32）
