original:
  mechanism: ttnn.batch_norm 在输入 bfloat16、参数张量（running stats/weight/bias）float32、compute_kernel_config fp32_dest_acc_en=False 时返回错值且无报错。文档（batch_norm_nanobind.cpp:66-68）列出 bf16 输入+fp32 参数为支持组合，未提 fp32_dest_acc_en。16 位 Dest 下 fp32 操作数按 bf16 精度持有（bf16 级误差属预期），但实测误差远超：issue 复现中 epsilon=0 时输入与结果在 bf16 精确，两带 epsilon 参考差 <1e-5，失败行 1856/2048 值对 float64 参考与逐步 bf16 舍入参考均偏 >2%+0.02（最大 2.5），其中 1728 恰为 0。对照全通过：fp32_dest_acc_en=True（无 config 时默认，batch_norm_utils.cpp:28）、bf16 stats、fp32 输入+stats@fp32_dest_acc_en=False。随机数据 [2,3,33,40] 三个独立进程 6911/7920 输出偏差 >5%+0.05，训练模式同败。来源 https://github.com/tenstorrent/tt-metal/issues/63629（open，2026-11-01，tt-robot 报告）。main f5985995a 级别。
  source: 2026-11-01 每日扫描。https://github.com/tenstorrent/tt-metal/issues/63629
  behavior: 在 Tenstorrent 上用 ttnn.batch_norm：bfloat16 输入配 float32 的 running_mean/weight/bias、且显式关掉 fp32_dest_acc_en 时，输出大量错值——2048 个值里 1856 个偏出 2%（最大偏 2.5）、1728 个干脆是 0，随机输入下约 87% 输出偏差超 5%；全程无报错。默认配置（不传 compute_kernel_config）或把 stats 也改成 bf16 则全部正确。
  trigger_surface: tt-metal main（f5985995a 级）；ttnn.batch_norm bf16 输入 + fp32 参数 + fp32_dest_acc_en=False；eval 与 training 模式均触发
  discovery: 2026-11-01 每日扫描
