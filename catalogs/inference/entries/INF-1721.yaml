original:
  mechanism: mindspore/core/include/ir/tensor.h 里的 has_fallback_ 用来标记该 Tensor 是否要走 Python fallback。它只在 Python Tensor 构造（TensorPy_init）和子类化（TensorPy_make_subclass）时被赋值，之后不再更新。若 Python 侧在构造完成后动态添加 __fallback__，C++ 侧仍为 false，算子直接进 C++ 执行，跳过本应由 Python 处理的逻辑；若构造后移除 __fallback__，C++ 侧仍为 true，无谓走 fallback。修复是移除该缓存字段，所有判定点改用 PyObjectHasFallbackAttr() 实时查询。环境为 master，全平台。
  source: 2026-03-10 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/29222 （closed）
  behavior: 给 ms.Tensor 子类在构造之后动态挂 __fallback__（比如包装自定义 dispatch），算子行为与预期不符：Python 实现没有被调用，结果由 C++ 路径给出，可能算错也可能抛异常；反过来构造后删掉 __fallback__ 时，本该走快路径的算子仍然绕一圈 Python。整个过程没有任何告警。
  trigger_surface: ms.Tensor 子类 + 构造后动态增删 __fallback__；Ascend/GPU/CPU 全平台、所有执行模式
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
