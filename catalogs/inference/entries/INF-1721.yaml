id: INF-1721
legacy_ids: []
slug: ms_tensor_has_fallback_cache_stale
aliases: []
title: has_fallback_ 缓存不随 __fallback__ 更新
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: mindspore
    component: Tensor has_fallback_ 缓存
  behavior: C++ Tensor 的 has_fallback_ 只在 TensorPy_init/make_subclass 时赋值一次，Python 侧随后增删 __fallback__ 不会同步，fallback 判断读到陈旧状态。
effect:
  objects:
  - 数值结果
  detail: 构造后再挂 __fallback__ 的 Tensor 仍走 C++ 执行，本应由 Python 处理的逻辑被跳过，可能算错或抛异常；反向删掉 __fallback__ 则多余走 fallback，只剩性能损失。
  visibility: 静默错误
mitigation:
  detect: ms.Tensor 子类构造后动态设置 __fallback__，观察是否走 Python 实现（或 C++ 侧 fallback 判定）；构造后删除同理
  fix: issue 给出修复：删除 Tensor::has_fallback_ 及其 getter/setter，判定点统一改为 PyObjectHasFallbackAttr() 直接查 Python 属性；涉及 tensor.h、tensor_py_reg.cc、converter.h/.cc、pynative_execute.cc、cell_backward_hook_op.cc（状态 closed）
