- url: https://github.com/vllm-project/vllm-ascend/issues/17520
  kind: github_issue
relations: []
original:
  mechanism: Ascend 910B、CANN 8.5.1（私有构建，已读 fused_infer_attention_score/flash_attention_regular.h 与 block_epilogue_online_softmax.hpp）、vllm-ascend da421af 上跑 DFlash 投机解码（num_speculative_tokens=15 + 1 bonus，block 16）：验证步把每条序列 16 个 query token 折叠进一次 npu_fused_infer_attention_score 调用。vllm_ascend/attention/attention_v1.py 在折叠时按 batch 行分组 query，没有维护逐 query 的 causal KV 长度，混合批（不同序列 KV 长度不同）中应看到不同 KV 范围的 query 被并入同一组，产生错误 attention 输出。报告者给出确定性证据：某请求第 401 位置出现 8-token 与 868-token 的观察事件差，同一底层 KV、仅改 query 分组即得不同输出。第二层是 CANN FAI kernel 按 MAX_KV_STACK_LEN=512 分块处理 KV，尾块恰为 256 或 512 列时走 CalcLocalRowSum 特殊归约树、否则走顺序 RowsumTAILTILE，改变 query 组边界即改变走哪条归约路径，相同输入也产生 bf16 漂移。复现负载 155 请求、并发 16、DP2、全 EOS。
  source: 2026-09-24 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17520 （open）
  behavior: 贪心采样下开启 DFlash 投机解码，输出本应与不带投机的推理逐 token 相同，实际在特定位置开始分叉：同模型同输入的回答出现用词差异甚至语义偏离，服务无报错、无 NaN，只有与 target-only 基线逐 token 对比才看得出。
  trigger_surface: DFlash 验证步 + 混合批不同 KV 长度 + 前缀缓存 + 910B/CANN 8.5.1
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
