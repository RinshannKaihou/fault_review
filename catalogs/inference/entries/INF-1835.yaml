  behavior: 验证步把每条序列 16 个 query 折叠进一次 npu_fused_infer_attention_score 调用时，按 batch 行分组而不维护逐 query 的 causal KV 长度，不同 KV 范围 query 被并组
effect:
  objects:
  - 数值结果
  - 隐状态
  - 输出内容
  detail: 贪心采样 + 前缀缓存 + DFlash（block 16）下，投机输出与 target-only 基线在特定位置分叉（某请求第 401 位置出现 8-token 与 868-token 观察事件差）；改 query 分组边界即产生 bf16 漂移，服务无报错、无 NaN
  visibility: 静默错误
mitigation:
