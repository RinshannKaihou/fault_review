original:
  category: cat10
  section: 第 10 类 · 分词器 / 对话模板故障
  meta: '`infra_off`（vLLM Whisper 长音频（>30s `max_audio_clip_s`）按每窗最静点切 chunk（`split_audio`），切点落语音中时**带时间戳解码**（`verbose_json` 必需）闭合最后一个完整 segment 后对其后至切点的音频**不产任何内容**——丢失的词同时从 `segments` 与 `text`（由 segments 拼装）双处消失；`json`/`text` 格式用 `<|notimestamps|>` 解码则保留这些词。espeak-ng 合成语音确定性复现：同 30s 窗 `json` 67 词 vs `verbose_json` 59 词（最后 3.6s "or shortness of breath. Home glucose readings range" 丢失）；977s 无停顿剪辑损失按比例放大。非 #32588 时间戳漂移、非 #52927 切点扫描 bug——**只要切点落在语音内即丢**，与切点选择无关） · Cov: `NEW`（带时间戳解码的 segment 完整性窗口子签名） · 触发 `config` · 置信度 `verified`'
  mechanism: timestamp-token 解码路径在 chunk 末尾只输出到"最后一个完整 segment 边界"，边界后至音频截断点的残段既不闭合为新 segment 也不并入文本；非时间戳路径（`<|notimestamps|>`）无 segment 概念、逐词解码无此窗口。10.41（Whisper chunk 提前 EOT 静默丢音频）之后 Whisper 分块族新成员：10.41 丢的是**整段尾音频**（EOT 误触发），本条丢的是**最后一个 segment 后的残段词**（时间戳模式的完整性窗口），丢多少取决于切点与最近 segment 边界的距离。
  source: 'vLLM #58029（2026-09-21 open，v0.25.1 + whisper-large-v3 + RTX 5070 Ti、fp32/fp16 双验证，含 espeak-ng 确定性复现脚本、67/59 词对照、与 #32588/#52927 的无关性论证、977s 长剪辑外推）。https://github.com/vllm-project/vllm/issues/58029'
  behavior: 无 crash、无错误——`verbose_json` 转录**静默缺词**且格式间不一致（同音频 `json`/`text` 更完整）：长音频转录的词级精度系统性劣化，依赖 `verbose_json` 做字幕/医疗转录（报告者用例即临床口述）的应用拿到不完整文本；两格式对照是唯一检测面。
  trigger_surface: vLLM `/v1/audio/transcriptions` + `response_format=verbose_json` + 音频 >30s 且切点落语音内（config：长音频默认路径）
  discovery: 2026-09-21 每日扫描。
