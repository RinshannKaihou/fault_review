  meta: '`infra_off`（ModelOpt NVFP4 主检查点 + FP8 量化的 PLE n-gram 表加载失败：`hf_quant_config.json` 的 `ignore` 列表含 `"*.ple.*"`、PLE 表单独量化为 FP8（独立 `model-plefp8-*.safetensors` 分片 + 全局 `ngram_embedding.weight_scale`）——恰为 `Qwen4ExpPLEFp8EmbeddingMethod`（"FP8 PLE embedding + 单全局 checkpoint scale"）设计对应的布局，但该方法**因量化方法选择逻辑从未被选中**，203/206 分片后 ValueError） · Cov: `var:transformers_nvfp4_moe_decompress_missing_weight_global_scale`（12.25 混合量化 checkpoint 加载路由族） · 触发 `partial` · 置信度 `documented`'
  mechanism: 量化方法分发按主 config（NVFP4）为 `ngram_embedding` 构建 weight loader，遇到 FP8 布局的 `weight_scale` 参数无路径可用——per-module 异构量化（ignore + 独立量化）的正确路由逻辑存在（`Qwen4ExpPLEFp8EmbeddingMethod`）但选择条件（方法判据/名字匹配）不覆盖此 checkpoint 的组合，导致"为它写的方法没被用上"。#53896 合并后 nightly 与 08-26 分支构建均复现。
  source: 'vLLM #54765（2026-09-01 open，2×RTX PRO 6000 SM120、RadixArk/Qwen3.8-Flash-Next-NVFP4、含 hf_quant_config 摘录与分片布局表）。https://github.com/vllm-project/vllm/issues/54765'
  behavior: 启动期 ValueError（fail-loud）——混合量化 checkpoint 整体不可加载；正确路由代码已存在但不可达，属「**per-module 量化方法分发缺口**」：与 7.65（恒等 mapping 静默禁用 layer_quant_config，同周）构成"量化配置路由语义歧义"对：彼条静默错配、本条显式失败。
  trigger_surface: vLLM + ModelOpt NVFP4 检查点带 FP8-quantized PLE 表（Qwen3.8-Flash-Next 类；checkpoint + 版本组合触发）
  discovery: 2026-09-01 每日扫描。
