  mechanism: CANN 8.3.RC1.alpha003 + torch 2.7.1，Ascend910B4-1：一个只做减均值除方差的 module，torchair online 推理与 PyTorch 完全对齐，但经 torchair.dynamo_export 导出 air、再用 atc 转 om 后推理，结果与 PyTorch 的余弦相似度只有 0.65。逐个算子 dump io 后发现 om 与 online 的算子执行顺序不同（om 先执行 tensormove，online 先执行 transpose），且第一个 transpose 的输入也不同；最终定位为 torch.compile 内部会自动转成 .contiguous，而转成静态图之后这次 contiguous 转换不再发生。issue 已 closed，正文未给出修复 PR。
