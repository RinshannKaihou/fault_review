title: NanToNum fp16 posinf 属性 NaN 被饱和成 65504
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: nan_to_num fp16 通路
  behavior: 910B TBE nan_to_num.py 中 posinf/neginf 走 tbe.var（fp16 下 vsel 标量寄存器），把 NaN 饱和成 dtype 最大值，fp16 下 ±inf 被替换成 65504.0 而非 NaN。
effect:
  objects:
  - 数值结果
  detail: fp16 posinf/neginf=NaN 时 ±inf 元素输出 65504.0（0x7BFF）而非 NaN；fp32/bf16 正确、nan 属性正确；12 种 shape 与两入口均复现。
  visibility: 静默错误
mitigation:
  detect: fp16 输入 [NaN,+inf,-inf,1.0]，属性 nan/posinf/neginf 分别取 NaN，检查 +inf/-inf 位置输出位模式（0x7BFF=65504 而非 NaN）。
  fix: 待定（issue 给出根因参考与期望：vsel 标量不应饱和 NaN；未见修复 PR）
