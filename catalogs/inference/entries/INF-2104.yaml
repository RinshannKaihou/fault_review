id: INF-2104
legacy_ids: []
slug: threshold_backward_global_race
aliases: []
title: ThresholdBackward 全局 thresholdVal_ 多线程竞争
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnnThresholdBackward
  behavior: per-call threshold 放进程级全局，第一段写入与 IsFloatEqual 读取之间可被其他线程覆盖，线程按他人 threshold 选错 kernel 模板（ReluGrad vs ThresholdGradV2D）。
effect:
  objects:
  - 梯度
  - 数值结果
  detail: 多线程并发时 A 线程读到 B 的 threshold：threshold=0 应走 ReluGrad 却走 ThresholdGradV2D，输出 0 掩码整片错位，无报错；判别元素 self≈0.0020 两线程期望 1/0 随机互换。4 线程每轮连调 32 次第一段再校验以最大化窗口。
  visibility: 静默错误
mitigation:
  detect: 并发负载下 ThresholdBackward 梯度掩码与阈值对不上（单线程正常、多线程随机错位）即可怀疑；根因定位靠读 aclnn_threshold_backward.cpp:33/:115/:147。
  fix: 待定（建议去掉全局、参数随 executor 传递；issue open 未见修复 MR）
