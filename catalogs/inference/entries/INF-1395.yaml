    component: cumsum 多核 GM 写路径
  behavior: blockDim=56（tiling_key 1101/1102）多核分支发生系统性 GM 越界写；归因方向为各 block 写出范围边界计算，疑似越界破坏跨核中间数据，fp16 同时结果错误
effect:
  objects:
  - 数值结果
  detail: fp16 N≥4095 全部精度 FAIL；fp32 N≥4097 越界但结果侥幸正确；N≤2048（blockDim=1）正常；单 case 定位实验累计 3324 条越界告警
  visibility: 静默错误
mitigation:
  detect: mssanitizer --tool=memcheck 包裹执行（TTK kernel 模式，op_debug_config=sanitizer 插桩）即可稳定检出；未评估线上监测
  fix: 待定（issue open，归因指向 arch35 cumsum_core_ss_oneway_ss.h / cumsum_core_ss_twoway_ss.h 多核分支边界计算，建议排查各 block 写出范围）
