original:
  mechanism: '-vv 与 -vc 是 msprobe config_check 下两个本不该同时使用的功能。实测 `msprobe config_check -vv verl_hyper_params_verify.yaml fsdp_agentloop.log -vc fsdp_agentloop_one.log fsdp_agentloop_two.log` 与把两个参数调换顺序后的命令，都没有任何报错或冲突提示，日志里两次都只执行了 -vc：输出只有 Saving json file to disk: .../verl_param_compare_result/NPU_config.json、bench_config.json 与 hyper_params_compare.csv，-vv 的 hyper_params_verify 结果不产出，也没有“-vv 被忽略”之类的行。工具在同时收到互斥参数时应明确告知当前行为，而不是静默选择其一执行。环境：msprobe 最新版本编译安装，py311。'
  source: '2026-06-13 GitCode Ascend/msprobe issue #395 https://gitcode.com/Ascend/msprobe/issues/395（closed）'
  behavior: 一条命令里把 -vv 和 -vc 都写上（或写反顺序），工具一声不响只跑 -vc：屏幕上照样打印 MindStudio 横幅和一串 INFO，输出目录里也有一份 csv，看上去这次“配置检查”跑成功了，实际上超参校验根本没执行。只有去核对产物文件名才会发现 hyper_params_verify 的结果不存在，冲突本身在日志里没有任何痕迹。
  trigger_surface: msprobe config_check 同时给出 -vv 与 -vc（互斥功能）
  discovery: 2026-10-21 GitCode 历史 issue 回填（mindspore/ms* 簇第二池）
