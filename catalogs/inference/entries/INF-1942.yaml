title: config_check 同时给 -vv/-vc 时静默只跑 -vc
kind: 故障
status: active
cause:
  objects:
  - subsystem: 配置/参数
    stack: pytorch
    component: config_check 参数解析
  behavior: 同时传 -vv 与 -vc 两个互斥功能时不做冲突校验、不提示，两种参数顺序下都只执行 -vc，超参校验结果不产出
effect:
  objects:
  - 测试判定
  - 指标/日志
  detail: 两次执行的输出都只有 -vc 产出的 verl_param_compare_result/*.csv 与 NPU_config.json，没有 hyper_params_verify 结果，也没有任何冲突告警
  visibility: 静默错误
mitigation:
  detect: 检查输出目录是否同时出现 -vv 的 hyper_params_verify.csv 与 -vc 的 compare 结果；两者互斥时应在参数解析处直接报错
  fix: 待定（issue closed，仅要求“互斥参数应明确告知用户”，正文未给修复 PR）
