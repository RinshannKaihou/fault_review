title: aclnnIndexAdd arch22 索引缺校验致越界写
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: arch22 scatter_add 索引寻址
  behavior: inplace_scatter_add_small_tail.h:88 等四处把 indices 按 uint32 取出后直接算 varGm[indexValue*N] 偏移，无 [0,M) 校验；arch35 有守卫，arch22 缺失。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: 910_93、CANN 9.2.0、master 1e0c064：idx=M 时 var[1] 不更新、canary 12345→12365（越界写且 ret=0）；idx=-1 位模式 4294967295 致约 17GB 偏移，stream 同步报 507035 向量核异常。
  visibility: 静默错误
mitigation:
  detect: var 尾部多分配两元素作 canary 并预置哨兵，传 idx=M 后读回；负索引用例强制 stream 同步看是否 507035。
  fix: issue 6308 open；建议按 arch35 样板在取值后加 if (indexValue >= M) continue（uint32 下负值位模式天然被拦）；未给修复 PR。
