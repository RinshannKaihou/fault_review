remarks: '与 #4767/#4766（同机理，910B3 + CANN 9.1.0-beta.3，均 closed）构成残留未修复族：作者在 9.2.0 + master 1e0c064 上仍复现。本条是索引直接当写偏移（越界写），与读侧缺校验的 6304/4456 后果不同。'
