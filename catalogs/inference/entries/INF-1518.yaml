cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: npu_fused_infer_attn
  behavior: 长序列 bf16 下融合 attention kernel 的累加精度显著低于 matmul→softmax→matmul 分解路径，误差随序列长度放大。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: S=8192、D=128、单头：分解路径 max abs 1.67e-7、平均相对 3.4e-6；融合 3.06e-4、1.09e-2（约 3000×）；自回归解码逐步放大，生成退化为重复输出。
  visibility: 静默错误
mitigation:
  detect: 同一组 bf16 q/k/v 分别走融合算子与逐算子分解，与 CPU fp64 参考比对 max abs 与平均相对误差；长序列（S≥2048） 才明显
  fix: 待定（issue open，无修复 PR；报告者请求算子提供 fp32 accumulate 选项或确认调用契约）
