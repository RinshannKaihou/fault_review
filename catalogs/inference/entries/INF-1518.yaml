original:
  mechanism: 'Ascend/pytorch #5238（2026-09-29，open，Ascend 910B2C / CANN 9.0.0 / torch 2.10.0+cpu / torch_npu 2.10.0.post4）：同一组 bf16 q/k/v（TND 布局、sparse_mode=0、D=128、单头），路径 A 用 matmul→softmax→matmul 逐算子分解，路径 B 用 npu_fused_infer_attention_score 单 kernel。与 CPU fp64 参考比：S=8192 时路径 A max abs 1.67e-07、平均相对 3.4e-06；路径 B max abs 3.06e-04、平均相对 1.09e-02，约 3000 倍，多个随机种子稳定复现。差异来自融合 kernel 在长序列上的累加/规约精度（报告者未给源码级定位，请求算子团队复核并评估 fp32 accumulate 选项）。报告指出在长序列自回归场景该偏差被逐步放大，下游表现为生成内容退化成重复输出。'
  source: 2026-09-29 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/5238 （open）
  behavior: 同样一组 bf16 输入，用融合的 npu_fused_infer_attention_score 和手工 matmul+softmax+matmul 得到的结果对不上：短序列看不出来，序列到 8192 时融合路径相对误差约 1%，最大绝对误差是分解路径的约 1800 倍。数值看起来仍在合理范围、不报错不 NaN，但在长序列自回归生成里误差被逐步放大，最后表现为输出退化成反复重复同一段内容。
  trigger_surface: 融合 attention 算子 + bf16 + 长序列（S≥2048，实测 8192）+ TND/sparse_mode=0；逐算子分解路径不触发
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
