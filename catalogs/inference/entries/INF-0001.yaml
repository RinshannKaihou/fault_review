original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off` · Cov: `var:1.212` · 触发 `yes` · 置信度 `verified`'
  mechanism: GPU/加速器 SDC 会**同时**翻转多个 bit，且这些翻转常在一个 SIMT warp（32 lanes）内共同对齐。门级 stuck-at 注入研究显示，单 bit 翻转只占全部事件的 **<40%**（即 **>60% 为 multi-bit**），并呈现 warp-aligned 的空间周期性。落到 Linear/matmul 上，其表现是**同一个 block、同一个 token 的隐状态中若干个通道被共同污染**——是一片成簇的 "spray"，而不是干净的单通道加性尖峰。本条为 MERGED 条目，合并了三个子故障：（a）"GPU multi-bit SDC"；（b）"MBU/warp-aligned"（多 bit 翻转 / warp 对齐模式）；（c）rowhammer 成簇形态与之重叠的部分（rowhammer-clustered shape overlap）。
  source: 'Tung, Huang, Saxena, Shirvani, Hukerikar, Jain, Tyagi, Gongalore, "The Anatomy of Silent Data Corruption: GPU Error Pattern Study and Modeling Guidance", DSN 2026 Industry Track, https://arxiv.org/abs/2605.04213 （>60% multi-bit, warp-aligned）。旁证：Sullivan, Tsai, Ding et al., "Characterizing and Mitigating Soft Errors in GPU DRAM", MICRO-54 2021（HBM2 中子束实验中的局部性）。'
  behavior: 产生"看起来合理"的错误 logits；NaN/Inf 只占约 **1%** 的结果，因此几乎从不崩溃。表现为输出的细微漂移，偶尔在生成流中冒出一个明显错误的 token。
  trigger_surface: 多通道 SDC：扩展 1.212 `sdc_spike` 的 hook 模式
  signature: 强 off-manifold，但形态是空间 block 内**一簇共同被污染的通道**（共享的幅度/符号偏置），而非单个通道。当前 `sdc_spike` 所假设的 per-channel 检测器会**部分漏检**；需要具备空间/局部性感知的 geometric 检测器（clustered Mahalanobis），或能识别相关多维分量的 spectral 检测器。cheap 类度量在幅度足够大时可命中，但无法区分它与单通道 spike。
  repro: 用一个 forward hook 对某一 block、某一个 token 的隐状态**连续通道子向量**（contiguous channel sub-vector）整体施加共同的幅度/符号偏置即可。
