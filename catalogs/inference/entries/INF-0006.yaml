  mechanism: SDC 发生在 LLM **预训练**期间，静默地扰动了一次权重更新，而该扰动一路存活进入了发布出来的 checkpoint。部署时模型带着**已经偏离"真实"流形的权重**运行，而 forward pass 本身完全干净、没有任何运行期故障。
  source: Ma, Pei, Lausen, Karypis, "Understanding Silent Data Corruption in LLM Training", ACL 2025, https://aclanthology.org/2025.acl-long.996/ （arXiv:2502.12340）。Altenberd, Wiesner, Kao, "Exploring Silent Data Corruption as a Reliability Challenge in LLM Training", arXiv:2604.00726。补充：SCOUT, "Symmetric Consensus Outlier Detection for Failure Localization in LLM Pre-Training", arXiv:2608.11034（2026-08-14 每日扫描）；LLM-PRISM, "Characterizing Silent Data Corruption from Permanent GPU Faults in LLM Training", arXiv:2604.10390（RTL 级 GPU 故障仿真 × 随机注入引擎，2026-08-15 每日扫描）；TrainSDC, "Characterizing and Mitigating Silent Data Corruption in Large Language Model Training", arXiv:2608.30769（Transformer 前向/反向全部主要计算接口的 SDC 易感性系统刻画：前向脆弱性高度位置依赖——Q/K 路径故障产生持续训练偏差；反向脆弱性由梯度指数分布而非位置主导；防护 = Q/K 路径重算 + residual-gain 监控 + 指数感知梯度缩放，开销 1.65%–6.76%，2026-09-01 每日扫描）；SProbe, "Syndrome Decoding for Silent Data Corruption in Quantized Integer GPU Arithmetic", arXiv:2609.19743（**推理侧** SPC 检测+定位+修复：INT8 量化推理 GEMM 的 INT32 累加器无 parity/ECC、瞬态故障返回合法错整数——SProbe 追随内核对未修改 vendor GEMM 输出做三素数域（61-bit prime field）Freivalds 随机化门（漏检 ≤2^-141）+ per-row 幂和 syndrome 经 Berlekamp-Massey/Chien/Forney 的 Reed-Solomon 解码定位列与精确幅值、最多修复 4 个碰撞错误/行并可原位修复累加器；H100 七类注入故障全检出、INT8 医疗 LLM 消除全部观察到的静默损坏；开销 cuBLASLt GEMM 的 11%（N=65536）–49%（N=16384）；与 ABFT 二元判决对照可检出行/列和相消的模式，2026-09-18 每日扫描）。
  behavior: 质量退化被"烤"进了模型：perplexity 略差，偶尔给出更糟的答案。
  trigger_surface: DRAM soft error 软件近似
  signature: '**ambiguous 且 on-manifold**：被污染的权重产生的是一个**自洽的**流形，只是稍微错了一点。没有干净参考的单 pass 隐藏态检测器会把它判为 NORMAL——这是终极盲区。只有持有一个**干净参考 checkpoint** 做流形对流形（manifold-to-manifold）比较才可能检出。它直接挑战单模型自参照监控的前提假设：geometric/spectral/trajectory/statistical/infotheoretic 各族在单模型自参照设定下**全部漏检**。'
  repro: '**持久性地**扰动少量权重条目（而非 forward hook），即构造"tainted checkpoint"基线，然后与干净 checkpoint 做双模型对比。'
