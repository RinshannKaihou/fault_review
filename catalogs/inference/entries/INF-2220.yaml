original:
  mechanism: 三芯实测（950PR/2.9.1=901150、classic910/2.7.1=099723、910B3/2.7.1=257835；convpool_099/257.log L8-L9 与 convpool_901.log L12 锚点：dtype cpu=torch.int64 npu=torch.int8/int32）。max_pool1d/2d indices：CPU int64（契约）、950PR/2.9.1 int32、2.7.1 双芯 int8（md5 逐字同）；max_pool3d indices 三芯 int32/int64 分裂较小。int8 定量：64×64 输入 kernel2 → 8320 索引 512 个负（6.2%），触发边界池化输出空间尺寸 >11×11（int8 上限 127）；1D 长度 64 暂安全（最大 62）、更长必触；224×224 输入几乎全部损坏。2.9.1 int32 实用边界高（>2^31）但同为契约分歧。pool 数值主路径（max/avg/adaptive/NaN 契约/count_include_pad）三芯全净——缺陷仅在 indices dtype 一轴。
  source: https://gitcode.com/Ascend/op-plugin/issues/652（三芯 dtype 矩阵 + int8 溢出定量 + 在档 log 锚点）
  behavior: max_pool2d(return_indices=True) 在 2.7.1 栈返回的索引 dtype 是 int8 而非契约的 int64：池化输出大于 11×11 后索引值超 127 环绕成负数（64×64 输入 6% 索引为负），检测头反查、特征定位等消费端拿到负索引引发错位读取，全程无报错；950PR/2.9.1 返回 int32，同为契约分歧。
  trigger_surface: torch_npu 2.7.1（classic910/910B3）+ max_pool1d/2d(return_indices=True) + 池化输出空间尺寸 >11×11；950PR/2.9.1 全尺寸 dtype 契约分歧（int32）。
  discovery: 2026-10-27 每日扫描
