  source: Land & Bartolo, "Fishing for Magikarp", EMNLP 2024, https://aclanthology.org/2024.emnlp-main.649/ (arXiv:2405.05417)。Liu et al., "Glitch Tokens" (GlitchHunter), FSE 2024 (arXiv:2404.09894)。
  behavior: 输出怪异、回避、乱码、"不可言说"；重复；类似拒答；glitch token 出现时伴随虚假幻觉。
  trigger_surface: tokenizer/template 选择
  signature: 签名 STRONG。该 token 自身位置的隐状态是一个接近 embedding 范数量级的离群点，位于稀疏区域。廉价的逐 token L2-norm 离群检测（statistical 族）加上到健康 token 簇的 geometric 距离，在 layer 0/1 就能抓到；污染随后以"单 token 异常轨迹"的形式沿层传播，trajectory 族亦可见。它在 token 级是 off-manifold、在序列级却接近 on-manifold，故整句聚合的度量会削弱信号——必须保留逐位置分辨率。
  repro: 两条路径都在单钩子层面可行——直接覆写 `embed_tokens.weight[t]` 为一个退化/异常范数向量，或在 tokenize 后把某个位置的 input id 替换为已知的 under-trained id。
