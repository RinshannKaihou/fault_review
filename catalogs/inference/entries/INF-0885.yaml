  meta: '`model_on` · Cov: `var:9.26` · 触发 `config` · 置信度 `verified`'
  mechanism: 模型训练时用了 PI / NTK / YaRN / Llama3 类的 rope scaling，但服务侧的加载路径把 `rope_scaling` 丢掉（置为 None），于是用训练好的权重跑退化成了朴素 RoPE。权重仍然是长上下文微调过的，但位置编码回到了原始 base 频率。
  source: 'Unsloth #3083；vLLM #10293。'
  behavior: 在原始训练上下文长度处出现陡峭的 perplexity 断崖：低于该长度一切正常，超过之后迅速劣化。
  trigger_surface: RoPE 相关配置
  signature: 边界以下是 on-manifold（与健康模型不可区分），边界以上转为 off-manifold。用按长度分层（length-stratified）的度量对比 L-1 与 L+1 处的隐状态，会看到一个突兀的跳变；这种"长度阈值化"本身就是一个可辨识的签名，其他故障不具备。只在短序列上评估的 geometric/spectral 检测器会完全漏检。
  repro: 单钩子只能部分复现——需要构造一个带 rope_scaling 的检查点再于加载时抹掉该字段；若手头模型本身无 rope scaling，则只能用改写 rotary base/scale 属性的方式近似模拟长度阈值行为。
