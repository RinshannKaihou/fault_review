  mechanism: SirLLM 维护一个与 KV 张量并行的、每 token 的熵数组用于驱逐排序。驱逐之后熵数组与 KV 张量的重新索引不一致，或衰减按步而非按轮应用，都会让槽 j 处的熵值不再对应那里实际的 KV。排序依据与被排序对象错位，驱逐决策随之全错。
  source: arXiv:2405.12528 *（可信的分层 bug，非已记录的缺陷）*。
  behavior: 驱逐策略退化为近似随机，重要 token 被丢弃、无关 token 被保留，长上下文质量不稳定地下滑。
  trigger_surface: 非 vLLM 一等实现
  signature: 元数据与 KV 槽错位属 infra_off 式索引故障。签名是**熵数组/KV 槽索引错位**，其隐藏态表现为"被保留的 token 集合与注意力实际需要的集合不相关"——statistical（保留集与高注意力质量集的重合度）是主指标；geometric/spectral 对这种"保留了错误但健康的 KV"完全漏检。置信度为 `speculative`：源文档明确标注这是可信的分层 bug 而非已记录的缺陷，任何检测结论都应带此保留。
  repro: partial——实现一个按并行元数据数组排序的驱逐器，并在驱逐后故意用错位的索引重排该数组（或按步而非按轮施加衰减），观察保留集与真实注意力质量的脱钩；SirLLM 本体需原栈复现。
  locus: eviction-compression
  priority: low
