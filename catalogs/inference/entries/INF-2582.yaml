title: QkvRmsNormRopeCache slotMapping 越界跨张量写
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: cann
    component: QkvRmsNormRopeCache
  behavior: kernel 按 b=slot/BlockSize、o=slot%BlockSize 直接取址，不校验 slotMapping 是否落在 [0,BlockNum*BlockSize-1]，负值与越界值被回绕或跨张量寻址。
effect:
  objects:
  - KV状态
  - 跨请求/跨样本数据
  detail: slot=[0..7] 正常写 0..7；[-1]*8 写 kCache slot31、vCache 整批不写；[32]*8 kCache 一个 slot 未写、vCache slot0 被写；[33]*8 写 vCache slot1；同输入 6 次 kCache 得 5 种签名；rc=0/0。
  visibility: 静默错误
mitigation:
  detect: slotMapping 注入 -1/32/33，kCache/vCache 预填 0 后按 slot 统计是否被写；重复 6 次比较签名。
  fix: 待定（issue open，未附修复 PR；报告者要求越界返回 161002 或至少钳制）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-11-16'
remarks: '与 #7637/#7646（同算子 E8M0 小 amax）根因不同：本条是 slot 地址不校验。'
