relations: []
original:
  mechanism: aclnnQkvRmsNormRopeCacheWithKScale（Ascend950PR、CANN 9.3.0、torch_npu 2.14.0、master 6ba3026e，PerTokenPerHead）在 slotMapping 元素越界或为负时两段返回 0/0，但 kernel 按 b=slot/BlockSize、o=slot%BlockSize 直接取址。实测 kCacheRef/vCacheRef 均为 [4,2,8,128] fp8、容量 4*8=32、全部预填 0：slot=[0..7] 正常写 0..7；slot=[-1]*8 写 kCache slot31、vCache 整批不写；slot=[-8]*8 写 kCache slot24；slot=[32]*8 时 kCache 一个 slot 未写、vCache slot0 被写；slot=[33]*8 写 vCache slot1。同一输入签名 6845708d3c7c 重复 6 次，kCacheRef 得到 5 种不同签名。资料 L712 要求 slotMapping 每个元素位于 [0,BlockNum*BlockSize-1]。
  source: https://gitcode.com/cann/ops-transformer/issues/7648 （open，2026-11-16，含 repro_slot.cpp 与逐 slot 回读）
  behavior: KV cache 写入落到别的 slot 甚至另一个张量：本该写入的位置保持旧值，相邻请求的 vCache 被污染；同一请求重复运行写出的 cache 内容不一致，后续 attention 读到错位/串请求的 KV，接口仍返回成功。
  trigger_surface: Ascend950PR + CANN 9.3.0 + torch_npu 2.14.0；PerTokenPerHead；kCache/vCache [4,2,8,128] fp8、容量 32；slotMapping 含负值或 ≥32。
  discovery: 2026-11-16 每日扫描
