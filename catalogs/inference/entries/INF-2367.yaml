title: defer_block_free 暂停请求丢 MTP 计数读过期状态槽
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm-ascend
    component: defer_block_free 调度暂停
  behavior: accepted 计数只存在按 batch 行号索引的临时量里，被暂停的请求移出 InputBatch 时删掉 prev 映射，回来时缺省发布为 1
effect:
  objects:
  - KV状态
  - 隐状态
  detail: 混合 GDN + MTP + async 调度下被暂停请求的 recurrent 状态地址（accepted-1）丢失，下次 forward 读过期状态槽，生成被静默污染成复读环/乱码；GPQA 从 83-88 掉到 64-72
  visibility: 静默错误
mitigation:
  detect: 报告者有同步现场记录（defer=true、sched_seq>processed_seq、pending D2H 值 2/4 被发布成 1）与真实 FLA GDN 内核因果探针（计数 3→输出 0.375、计数 1→0.125、拷回正确状态恢复 0.375）
  fix: 修复建议按请求 ID 保存计数（快照 req→row、event 同步后收割、生命周期失效），报告者称已有实现并验证（A/B：计数丢失事件每 rank 3298→0、16384 token 复读环请求 1651 token 干净结束），尚未提 PR
