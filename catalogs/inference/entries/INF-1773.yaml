original:
  mechanism: tt-metal 229f9d5336（Wormhole n150 KMD2.9.0/FW19.11.0 与 Blackhole p100a KMD2.8.0/FW19.8.1 同 commit 同结果）。两个 uint16 操作数配 32 位输出 dtype（ttnn.int32/uint32/float32）时，add/subtract/multiply、六个比较（eq/ne/lt/le/gt/ge）与三个逻辑（and/or/xor）返回错误值，有无广播均中；默认输出 dtype 或 uint16 输出正确。[1,2,64,96] uint16 值 0-12、12288 元素实测：add int32 11320 错、subtract 11503、multiply float32 10370、eq int32 6525（ttnn.eq 返回 13 种不同值：2,3,4,5…而非 0/1）、gt float32 7780、logical_or float32 n150 12224/p100a 5717；default/uint16 输出全部 0 错。18 二元运算×6 广播形（无/行/首操作数行/列/行×列/scalar）×5 输出 dtype 共 210 组合在每张卡全错，全部为 32 位输出。机制（uint16→32 位读出/转换路径哪里错）issue 未定位。频率 always。
  source: 2026-10-20 每日扫描；https://github.com/tenstorrent/tt-metal/issues/61550
  behavior: 用 ttnn 对两个 uint16 张量做加/减/乘、比较或逻辑运算并指定更宽的输出 dtype（int32/uint32/float32，例如把比较结果当 int32 掩码）时，结果大面积错误：相等比较会返回 2、3、4、5 等值而不是 0/1，加法大部分元素不对；同调用换成默认输出 dtype 或 uint16 输出则完全正确。Wormhole 与 Blackhole 都错，无任何报错。
  trigger_surface: ttnn eltwise 二元/比较/逻辑 + uint16 TILE 操作数 + 32 位输出 dtype（含广播）
  discovery: 2026-10-20 每日扫描
