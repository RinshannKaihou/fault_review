  detect: 对 arch35 chunk_kda_fwd 用 rowEnd>rowBegin 的最小 shape 跑单算子用例并加超时；同仓 chunk_kda_fwd_prepare_arch35.h:279 的有界 for 循环可作对照
  fix: 循环体内递减 remaining，或改成 for(col=0;col<cols;col+=ELEMENTS_PER_REG) 并在每轮重算剩余量；issue closed，未附修复 MR，是否已修未核实
