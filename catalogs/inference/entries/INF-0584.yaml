original:
  category: cat6
  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（MIG 容器内 NVML 对**父设备**的查询被权限拒绝——异常被 `EngineArgs.get_batch_defaults()` 的 catch-all 吞掉、`device_memory=0`——内存阶梯落入最小 GPU 档：H200 2g.35gb 引擎静默拿 `max_num_batched_tokens=2048`/`max_num_seqs=256`（整卡档为 8192/1024），吞吐 **-28~53%**；唯一痕迹是默认日志级不输出的 `logger.debug`；同机整卡对照同镜像同探针返回 16384/8192 档） · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: NVML 平台解析物理 index 并取**父设备** handle，MIG 容器内该查询 permission-denied；catch-all 以 0 兜底而非回退 `torch.cuda.get_device_properties().total_memory`（`NonNvmlCudaPlatform` 已有正确做法）；chunked prefill 引擎拿 2048 步预算对照 40,960 `max_model_len`。5,118 个 engine step 零步超过 2048 桶实证 clamp 真实生效。
  source: 'vLLM #55381（2026-09-04 open，v0.28.0 tag + main 根因确认、MIG/整卡同机对照、-28~53% 吞吐表、修复建议）。https://github.com/vllm-project/vllm/issues/55381'
  behavior: 无 crash、输出正确——**静默性能塌方**（最高损失一半吞吐）且零可见告警；容量规划/成本核算全部失真。属「**能力探测失败被静默降级到最保守档**」新子签名：与 6.162（liveness 伪 sentinel）同为"异常处理吞掉关键信号"，本条吞的是硬件探测、显形为性能而非正确性；同机整卡/MIG 差异使问题看似"硬件慢"而逃过归因。
  trigger_surface: vLLM + MIG 容器（NVML 父设备权限拒绝）+ 依赖默认 batch 参数（环境组合触发；显式 `--max-num-batched-tokens` 即绕过）
  discovery: |-
    2026-09-04 每日扫描。
