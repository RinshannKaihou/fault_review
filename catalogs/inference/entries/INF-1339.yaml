  signature: 受 dtype/bit 宽门控（q8_0 无签名、q4_0/q5_0 有），属 ambiguous。签名是**键通道集中的量化误差，值接近参考**——这一 K/V 不对称是与逐 token 型 fp8 漂移相区分的关键：spectral（键的通道协方差被离群通道主导后失真）与 statistical（逐通道误差分布高度偏斜）可捕获；对 K/V 不做区分的 geometric 全局偏离度量会把它误当作普通量化漂移（model_on）而漏判严重性。
  repro: partial——对该层缓存的 **K** 施加按张量的低 bit 伪量化（4/5 bit，单一 scale），而 V 保持不变或用更高 bit，复现"键通道离群值被按张量网格压碎"；llama.cpp 的 q4_0/q5_0 块结构不精确复现。
