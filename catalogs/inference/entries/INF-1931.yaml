original:
  mechanism: issue 指出 vllm_ascend/lora/punica_npu.py 既可以用 vllm 的 LoRA ops 也可以用 vllm_ascend 自己的 ascend_c 算子实现,两者在同输入下本应等价,实测不等价。作者写了 bgmv_expand/bgmv_shrink/sgmv_expand/bgmv_expand_slice/sgmv_shrink 等的一致性用例:bgmv_expand 在 num_tokens=256、hidden_in=16、hidden_out=1024、lora_rank=16、num_loras=4、bf16 下 max diff 29.25、mean diff 4.34,远超声明的 tolerance 0.01,首 token 前五个元素 vllm 为 [-2.1875, 2.0625, -2.4062, 2.2656, 1.4766]、ascend 为 [1.7344, -2.0156, -2.6094, -0.3750, -0.9062];bgmv_shrink 的 ascend 输出出现 1.1409e+10、6.3439e+07 这类量级并算出 NaN;sgmv_expand 在 seq_lengths [63,14,45,134] 的 batch 下 max diff 30.125、mean 4.375。问题仅在换用 ascend 算子时出现,等价切换 torch 实现即与参考一致,说明偏差来自 ascend 侧的 bgmv/sgmv kernel 而非调用方参数。
  source: 2026-06-30 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/11221 （open）
  behavior: 挂 LoRA 适配器做推理时,回答质量比同权重同请求的 GPU/参考实现差,但服务不报错、形状正常、没有 NaN 提示;把 LoRA 相关算子换成 vllm 的 torch 实现后差异消失,因此很难在线上定位,只有做算子级逐元素对比才看得到几十量级的偏差。
  trigger_surface: 启用 LoRA / 多 LoRA（Punica 路径）并使用 vllm_ascend 自带 bgmv/sgmv 算子；关闭 LoRA 不触发
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
