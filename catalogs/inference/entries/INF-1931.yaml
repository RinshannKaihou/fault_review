title: Ascend LoRA bgmv/sgmv 算子输出与参考差 29
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: LoRA bgmv/sgmv 算子
  behavior: ascend_c 版 bgmv/sgmv 与 vllm LoRA ops/torch 实现不等价：expand max diff 29.25、mean 4.34（容差0.01），shrink 出现 1e10 量级并算出 NaN
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: 256 token、hidden 16↔1024、lora_rank 16 的单测里首 token 元素级差 2~4,shrink 方向出现 NaN;线上表现为挂载 LoRA 后回答质量异常而不报错
  visibility: 静默错误
mitigation:
  detect: 用同一组随机张量分别调 vllm.lora.ops.torch_ops 与 vllm_ascend.lora.lora_ops 中的 bgmv/sgmv 系列,逐元素比对 max/mean diff;LoRA 服务上线前跑该对照,容差 0.01 内才算通过
  fix: 待定（issue open,未给出修复 PR）；可先用 vllm 的 torch_ops 实现替换 ascend 算子作为规避
