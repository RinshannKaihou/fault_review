title: BlockAttnRes golden 未模拟 FP32 FTZ 致误判
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: pytorch
    component: BlockAttnRes golden
  behavior: CPU golden 未模拟 Ascend 950 默认的 FP32 FTZ，Update 的 Phase2OneVL 归一化顺序也与 TwoVL/Generic 不同，极端输入下正负零/Inf/NaN/有穷值的分类与 NPU 不同。
effect:
  objects:
  - 测试判定
  detail: 输入含全零、约 1e-38 的 FP32 subnormal 与约 ±3.4028235e38 极值时，TTK 精度比较报 NPU 与 golden 的正负零/Inf/NaN/有穷值分类不一致，无独立报错日志，算子本身行为正确。
  visibility: 静默错误
mitigation:
  detect: 对含 subnormal 与近上限极值的输入分别跑 NPU 与 golden，逐元素比较分类（零/次正规/Inf/NaN）而不只比值
  fix: MR 11661：统一 Phase2OneVL 的归一化顺序，并在 Update/Prepare golden 的 Sqrt、Div、Sub+Exp 边界模拟 FTZ（closed，未核实发布）
