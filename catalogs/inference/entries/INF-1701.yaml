title: AscendC Cast int32 转 float 在深流水后全 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: pytorch
    component: AscendC Cast（mix kernel）
  behavior: 4-deep cross-core pipeline 达满深度后（kvSeqLoop>=3），AIV 侧 Cast<float,int32_t> 转换 Fixpipe（SPLIT_M）写入 UB 的 int32 数据，输出全为 NaN。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: Sk=128/256（1~2 个 kvSeqLoop）正确，Sk>=512（>=4 个）时 Cast 输出全 NaN，softmax 输入与 attention 输出随之全 NaN；非零 int32 写独立 buffer 仍复现，全零输入跳过 Cast 则全部 shape 通过。
  visibility: 数值异常
mitigation:
  detect: 按 kvSeqLoop 逐档放开（Sk=128/256/512/1024）比对 Cast 输出；用全零输入跳过 Cast 做对照
  fix: 待定（报告请求维护者确认是否 known limitation 及 PipeBarrier/Fixpipe 形式 workaround，未见修复）
