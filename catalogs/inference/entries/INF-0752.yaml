  meta: '`infra_off`（B200 + FlashInfer TensorRT-LLM attention backend + NVFP4 KV cache（`--kv-cache-dtype` NVFP4）服务 `Qwen/Qwen3.5-397B-A17B-FP8`：全 1,319 例 GSM8K（temp 0、≤1,024 token）——FP8 KV 对照 flexible exact match 96.664% / invalid 0.682%，NVFP4 KV 仅 **4.5-6.5% / 93.2-94.9% invalid**（响应多为空或立即终止），并发 64 与 512 两档均坏、编译 CUDA-graph 路径全程保留——引擎无错无警告的 NVFP4 KV 精度塌方） · Cov: `var:vllm_nvfp4_kv_cache_hnd_layout_probe_inversion`（8.53 NVFP4 KV 布局/正确性族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: NVFP4（4-bit 浮点 + 双 scale）KV 量化在 FlashInfer TRT-LLM 后端的解码路径上对该模型族的精度保持失效——非个别 token 退化而是整体输出分布崩塌（93%+ 响应无法产出可解析答案）；并发档不敏感说明是确定性精度缺陷而非竞态。
  source: 'vLLM #55673（2026-09-07 open，bug+quantization label，含 FP8/NVFP4 KV × 并发 64/512 四格评测表、环境与评测协议）。https://github.com/vllm-project/vllm/issues/55673'
  behavior: 无 crash——**静默精度塌方**（96.7% → 4.5%，显形为空回复/立即终止而非 gibberish）。8.53（NVFP4 KV HND 布局探测反转）之后 NVFP4 KV 族第二例：8.53 是布局探测分支错、本条是 NVFP4 KV 对大模型（397B MoE）解码精度的整体不可用——「KV 量化格式合法运行但语义塌方」。
