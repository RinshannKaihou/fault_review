  mechanism: 安全对齐过度激活，对表面上像不安全请求、实际良性的请求给出拒答。相对于其他 model_on 故障，这条的电路是干净的、单一的、可隔离的（a clean single, isolable on-manifold circuit target）——因此是最适合做 on-manifold 探针验证的靶子。
  source: Röttger et al., "XSTest", NAACL 2024 (arXiv:2308.01263)。Cui et al., "OR-Bench", ICML 2025 (arXiv:2405.20947)。源文档未给出 URL。
  behavior: 对一个良性请求返回拒答模板。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。强假设：拒答会在中层激活一条特定的 "safety/refusal" 方向，因此 geometric 族的线性探针应当能把「被拒的良性请求」与「被正常回答的良性请求」分开。这是全套件中最干净的单电路 on-manifold 目标。离流形几何量（Mahalanobis 离群、激活范数）无效，因为隐藏态完全在健康流形内；cheap 族亦无信号。
  repro: promptset-only，ZERO model mutation（与 `hallucination` / `long_context` 同为 promptset-only，不挂钩子）。用 over-refusal 提示集对模型自身 greedy 回复打标；签名度量是小型线性探针，仅在 calibration split 上拟合（绝不碰 test），分离 refused vs answered 的中层 mean-pooled 隐藏向量。
