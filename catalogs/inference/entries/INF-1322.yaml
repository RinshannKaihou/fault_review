  mechanism: MERGED——本条合并两个子故障：(a) `RadixTrie::find` 返回父节点 / 过度递归，报告出比实际更长的共享前缀，于是当前请求复用了并不属于它的那段 KV；(b) SGLang 中 `prefix_len == block_size` 时复用了一个过期的边界块。两者都让前缀/块接缝之后的 KV 与当前请求的真实 token 不对应。
  source: '`gh`：TGI PR #3067（"Fix two edge cases in RadixTrie::find"）；SGLang #22819。'
  behavior: 高缓存命中率场景下偶发的内容串味——生成中掺入另一请求前缀的语义，且随流量模式而不可复现。
  trigger_surface: KV 子系统场景构造
  signature: 复用他请求 KV 是 infra_off。签名是**前缀/块接缝处的离散注意力跳变**：trajectory（沿 token 轴的位置突变）与 geometric（接缝后位置的流形偏离）可见；由于污染的 KV 本身是"另一段真实文本"的健康 KV，其范数与谱统计都正常，statistical/spectral 容易漏检——这类"健康但错位"的污染最终要靠 cheap 族的 recompute-oracle 确认（前提：记录 batch 组成的 bitwise 重算或 batch-invariant kernels）。
  repro: partial——prefill 后把 cache 前 `p` 个位置的 K/V 替换为另一条 prompt 的对应行（"过度匹配的共享前缀"），或替换恰好一个 block_size 边界块（"过期边界块"）；radix trie 本身需 vLLM/SGLang 栈复现。
  locus: cross-request
  priority: medium
