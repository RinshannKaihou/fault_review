original:
  mechanism: vLLM 0.20.2（V1）+ vllm-ascend 0.20.2rc1、transformers 5.5.3、CANN 9.0、Ascend 910C 16 卡（TP=2）部署自训练 DeepSeek-V2 架构 32B MoE（config model_type=deepseek_v2、architectures=[DeepseekV2ForCausalLM]）。vllm-ascend 日志把该模型映射到 vllm_ascend.models.deepseek_v4:AscendDeepseekV4ForCausalLM。用户 prompt 超过约 5k–8k 字符（约 2k–8k token）时生成乱码中文、U+FFFD 替换符、复读循环并以 finish_reason=length 结束；短于 5k 字符正常；同权重 SGLang 正常。损坏从第一个生成 token 即出现，说明编码上下文在 prefill/decode 交界前已坏。chunked prefill（compile_ranges_endpoints=[2048]）、关闭图模式、调 repetition_penalty 均无效。issue 质疑 V2→V4 代码路径对长上下文 MLA/rope 的处理，但未定位具体缺陷。
  source: 2026-08-18 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/14464 （open）
  behavior: DeepSeek-V2 架构模型在 vLLM-Ascend 上处理较长中文 prompt（约 5k–8k 字符以上）时，输出从首 token 起即为乱码/替换符并陷入复读，最终被 length 截断；短 prompt 与 SGLang 对照均正常，服务无报错。
  trigger_surface: DeepSeek-V2 架构 + 长中文上下文（>5k–8k 字符），vLLM-Ascend V1 引擎
