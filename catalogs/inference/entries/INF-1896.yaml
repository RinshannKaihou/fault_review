cause:
  objects:
  - subsystem: 模型定义
    stack: vllm
    component: DeepSeek-V2→V4 模型映射
  behavior: V2→V4 映射路径（AscendDeepseekV4ForCausalLM）下，长上下文（>5k–8k 字符）首个生成 token 前编码上下文已损坏；具体缺陷未定位，issue 仅质疑该路径对长上下文 MLA/rope 的处理。
effect:
  objects:
  - 输出内容
  detail: 约 5k–8k 字符以上中文 prompt 生成乱码、替换符与复读并以 length 截断；<5k 正常，SGLang 同权重正常，chunked prefill/图模式等配置不影响。
  visibility: 质量退化
mitigation:
  detect: 同一 32B DeepSeek-V2 微调模型按 prompt 长度 1k/5k/8k 扫描，并与同权重 SGLang 对照
  fix: 待定（issue 仅质疑 V2→V4 映射与长上下文 MLA/rope，open 未见修复）
