title: ngram 推测解码输出与 prompt 无关的杂串
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: ngram prompt_lookup 草案
  behavior: ngram 推测用 prompt_lookup_max/min 在 prompt 内取草案 token 后，草案与验证结果拼接出错，与 prompt 无关的 token 被接受并输出。
effect:
  objects:
  - 输出内容
  detail: prompt '123412'、temperature=0、max_tokens=12 时输出「34这条路的长度是1000米…forbidden, 123oud, 1AMENT, 1itol」这类杂串。
  visibility: 静默错误
mitigation:
  detect: short prompt + temperature=0 跑 ngram 推测，与非推测输出逐 token 比对；出现与 prompt 无关的 token 即命中
  fix: 'vllm-ascend PR #4090（已合入：Fix ngram precision issue and open e2e ngram test）'
