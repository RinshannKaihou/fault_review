original:
  mechanism: 'tt-metal matmul 的三个 program factory——MatmulMultiCoreReuseProgramConfig、MatmulMultiCoreReuseMultiCastDRAMShardedProgramConfig、MatmulMultiCoreReuseMultiCastBatchedDRAMShardedProgramConfig——在每个 K block 后把部分和以 fp32 打进中间 buffer 并经 SrcA 重载继续累加，而 SrcA 把重载数据截断为 TF32（10 位 mantissa），fp32 精度随重载次数线性流失。mcast_1d/2d 工厂在 #50250 已改为无损重载，这三个工厂漏改。量化证据（fp64 参考、bf16 可表示输入、HiFi4、fp32 输出、in0_block_w=1）：reuse（B=8, 256x4096x256）相对最大误差 packer_l1_acc=False 2.47e-2 / True 8.6e-4，对照 auto/mcast 8.3e-5；DRAM-sharded LLM decode 路径（32x4096x1280）2.44e-2；batched DRAM-sharded（B=8, 32x2048x64）1.26e-2–8.5e-4；带 fused bias 同样 1.3e-2–2.55e-2。误差为系统性负偏置（截断）：reuse 案例输出 ~1000 上平均符号误差 -21。in0_block_w=4 时约缩小 3.5x（重载更少）。core_grid=CoreGrid(y=1,x=8) 会在 batched matmul 上自动选中 reuse 工厂 + in0_block_w=1 并出现同样 2.47e-2。issue 2026-10-08 创建、2026-10-09 closed/completed（Tenstorrent 维护者 jberkowitzTT 2026-10-13 邀请进入 bounty 板块），closed 状态与修复发布未核实。'
  source: 'tt-metal issue https://github.com/tenstorrent/tt-metal/issues/59828（2026-10-08 创建、2026-10-09 closed/completed；fp64 对照误差表 + 工厂覆盖矩阵 + #50250 对照）；评论 https://github.com/tenstorrent/tt-metal/issues/59828#issuecomment（jberkowitzTT 2026-10-18 bounty 邀请）'
  behavior: 无报错；fp32_dest_acc_en=True 的 matmul 输出带随 K 增长的系统性截断偏差（相对误差最高 2.47e-2 vs 正确工厂 8.3e-5，约 300x），包含 LLM decode 常见形状（32x4096x1280）
  trigger_surface: tt-metal + 三个 reuse/DRAM-sharded matmul 工厂 + fp32_dest_acc_en=True + 多 K block 累加；自动路径（core_grid y=1,x=8）可达
  discovery: 2026-10-13 每日扫描
