title: tt-metal SFPU replay 体溢出覆写 FPU MOP 槽
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: tt-metal
    component: SFPU replay buffer 槽位划分
  behavior: accurate bf16 exp 的 replay 体（20-22 条）与 dequant 体（槽 15..19）越过 SFPU/FPU 分界槽 16，覆写 matmul/reduce 录制的 MOP 体；后续 tile 重放被污染程序
effect:
  objects:
  - 数值结果
  detail: exp(dequant) 后的 matmul/reduce tile 静默错（tile0 正确、tile1+ 错；reduce 行和 -26 vs 40），无 hang 无 assert（dequant 先 init 的反向序在 BH 上 hang）
  visibility: 静默错误
mitigation:
  detect: tt-llk test_matmul_exp_interleave.py / dequant+reduce gtest（报告随附）
  fix: 待定（issue 报告于 Wormhole n150 / Blackhole p100a shipped 代码）
labels:
  confidence: documented
  coverage: NEW
  discovered: '2026-10-17'
  stage: N/A
remarks: 两个 issue 同机制（SFPU replay 体越界覆写 FPU MOP 槽），合并为一条，双证据。
