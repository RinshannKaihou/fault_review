id: INF-1648
legacy_ids: []
slug: triton_ascend_gather_load_reuses_first_value
aliases: []
title: gather 载入基址变化却读回同一值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: triton
    component: gather tl.load 复用
  behavior: 循环内两次 gather 只有行基址不同（base_x 分别为 0 与 2），device_print 显示基址已变而 val 完全相同；第二次载入复用了首次的读取结果，未按新地址重取。
effect:
  objects:
  - 数值结果
  detail: 2×2 int32 gather 得 [[-227508220],[-227508220]]，参考是 [[-227508220],[-983948943]]；无报错，只有逐元素对比可见（Triton 3.2、CANN 9.0.0、910B3）。
  visibility: 静默错误
mitigation:
  detect: 在 kernel 内 device_print 每次载入的基址与返回值，两个不同基址给出同一值即为信号；离线对 gather 结果做逐元素参考对比
  fix: 待定（issue closed，正文未给修复 PR/规避）
