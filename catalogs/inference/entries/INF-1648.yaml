original:
  mechanism: 用户写的 torch_gather 类 Triton kernel（Triton 3.2、CANN 9.0.0、Ascend 910B3）在 for iN in range(BLOCK_N) 循环里每次算 base_x = gid * x_stride0，再 tl.load(x_ptr + base_x + indices)；device_print 显示两次迭代的 base_x 分别是 0 和 2、indices 都是 1、mask 都为真，但两次 val 打印出同一个值 -227508220，而正确结果应为 -227508220 与 -983948943。也就是说第二次载入没有按新基址重新取数，而是复用了首次 gather 的结果（或 DMA 描述符未随基址更新）。输出张量因此每个 batch 行都是第一行的值，与参考逐元素比对 False，没有任何报错。报告者据此定位为载入地址被复用而非索引计算错误（indices 与 mask 打印均正确）。
  source: 2026-05-30 GitHub triton-lang/triton-ascend issue https://github.com/triton-lang/triton-ascend/issues/333 （closed）
  behavior: gather/embedding 类算子在 NPU 上跑多批次循环时，除第一批之外的所有批次都返回第一排的数据：输出张量每行内容完全相同，看起来像广播错了，但 indices 和 mask 打印都正常、也不报错。逐元素和 torch.gather 对比立刻能看出来，用 print 观察 kernel 内基址会发现基址在变而返回值不变。
  trigger_surface: 循环内以变化的行基址做 tl.load 索引 gather（多批次循环复用同一表达式）；910B3 + Triton 3.2
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
