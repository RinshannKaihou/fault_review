original:
  mechanism: DeepSeek-V4-Flash-0731 在流式 Tool Call 场景下频繁出现精度异常：Tool Call 的 arguments 已经完整闭合后，模型并没有立即结束 Tool Call，而是继续输出普通 content，而这些 content 开头都是一些乱码词语。报告贴出的原始 SSE 事件流显示，arguments 闭合后 delta.content 依次是“收起”“The”“ kn”“obs are set”“. Now splice”“ into”“ the two”“ client-”“return paths:接着”这类碎片，因此报告怀疑在 Tool Call 结束阶段没有及时触发 finish_reason="tool_calls"，把后续增量当成普通文本发给了客户端。正文给了 Prefill/Decode 两段的完整启动脚本，但没有进一步定位到 parser 或 finish_reason 判定代码，也没有给修复 PR；issue 已 closed。
  source: 2026-08-04 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13441 （closed）
  behavior: 接 Claude Code 这类客户端时，工具调用会莫名其妙变成“参数已经给完，后面又追加一段乱码文本”，客户端因此报参数非法或把乱码当回答显示；流式与非流式表现不同，非流式往往看不出来。请求本身 HTTP 200，没有报错。
  trigger_surface: 流式 tool call 输出（stream=true + tool_call_parser）+ DeepSeek-V4-Flash-0731 + PD 分离
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
