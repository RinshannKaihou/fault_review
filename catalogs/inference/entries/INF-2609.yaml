    component: _apply_linearize fixup
  behavior: linearize 重锚 tile 槽位后，通用 dim fixup 只改写以 ", <dim>)" 结尾的参数；tl.associative_scan 中间位置参数、dim=-1、tl.full 末槽都没匹配，仍指向旧槽的轴。
