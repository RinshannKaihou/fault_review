original:
  mechanism: 'torch_npu 的 triton_experimental 后端在 linearize 阶段重锚 tile 槽位之后，_apply_linearize 里那道通用 dim fixup 只改写以 ", <dim>)" 结尾的 dim 参数。上游 scan() 用三种它看不见的形态寻址归约轴：(1) tl.associative_scan((v,), triton_tensor_ndim() - num_reduction_dims, fn)，dim 是中间位置参数，文本是 ", 1," 而非 ", 1)"；(2) triton_helpers.select_one(.., rbase == (RBLOCK - 1), dim=-1, keep_dims=True)，写作 dim=-1；(3) <acc> = tl.full([<dense_size_list() 末槽置 1>], ..)，既非旧 dense_size 字面量也非全 1 字面量。x 树拆成多个 register 轴时归约槽会移动，这三行仍指向旧槽上现在坐着的那条轴；两条轴都非 singleton 时这不会编译失败，kernel 编得过但扫错轴。报告者在 CANN 9.3 + master、910B4、TORCHINDUCTOR_NPU_BACKEND=triton_experimental 上实测：int32 5×5×5、cumsum(dim=1) 有 100/125 个元素错（绝对差 26），fp16 cumsum 相对误差 15.54、cumprod 16.03（79.2% 元素错），fp32 cumsum 50.31、cumprod 129.74。与 #6459（一维 scan 编译失败）相互独立。'
  source: https://gitcode.com/Ascend/pytorch/issues/6461（open，2026-11-26，含逐节点 opinfo 误差表与三种寻址形态源码定位）
  behavior: 用 torch.compile 跑多维 cumsum/cumprod（例如按序列维对 2D/3D 张量做累积和），编译能通过、没有任何 warning，但结果沿错误的轴扫描：int32 用例 125 个元素里 100 个不对、绝对差 26，因为整型没有舍入，这只能是真错；fp32 cumprod 相对误差能到 130 倍。只检查「能不能编过」的 smoke 测试完全发现不了，要拿 eager 结果逐元素对拍才暴露。
  trigger_surface: CANN 9.3 + master、Ascend 910B4，torch/torch_npu 2.16.0.dev20261107、triton 3.6.0 + triton_ascend 3.6.0.post2，TORCHINDUCTOR_NPU_BACKEND=triton_experimental；多维张量的 cumsum/cumprod（scan 族），非最内维。
  discovery: 2026-11-26 每日扫描
