id: INF-1717
legacy_ids: []
slug: ms_batchnormgradext_dtype_forced_f32
aliases: []
title: BatchNormGradExt 把权重梯度类型写死 float32
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: mindspore
    component: BatchNormGradExt 类型推导
  behavior: InferType 把 dweight/dbias 的输出类型写死为 float32，既不跟随 weight 也不跟随 input；float64 输入的反向梯度被静默降精度。
effect:
  objects:
  - 梯度
  detail: input 为 float64 时 CPU 反向的 dweight/dbias 变成 float32，与期望的 float64 不符，数值上表现为细微误差；dx 仍正确，日志里只看到 dtype 变化。
  visibility: 静默错误
mitigation:
  detect: float64 输入跑 batch_norm 反向，打印 dweight/dbias 的 dtype；不是 float64（weight 为 float32 时应跟 weight）即命中
  fix: issue 给出修复：dx 跟随 input；weight 非 None 时 dweight/dbias 跟随 weight，weight 为 None 时跟随 input；新增 C++ UT tests/ut/cpp/ops/test_ops_batch_norm_grad_ext.cc（状态 closed）
labels:
  stage: N/A
  confidence: documented
  coverage: NEW
  discovered: '2026-10-20'
remarks: ''
evidence:
- url: https://gitcode.com/mindspore/mindspore/issues/28897
  kind: gitcode_issue
relations: []
original:
  mechanism: BatchNormGradExt 是 batch_norm 反向的扩展算子，输出 dx/dweight/dbias 的 dtype 由 InferType 决定。原规则把 dweight/dbias 固定为 float32，忽略 weight 与 input 的真实类型，于是 float64 输入时这两个梯度张量被强制成 float32，在 float64 场景产生细微误差，日志里能看到 dweight/dbias 与期望 dtype 不一致。修复规则：dx 与 input 一致；weight 非 None 时 dweight/dbias 与 weight 一致，weight 为 None 时与 input 一致。环境为 CPU plugin 后端、master。
  source: 2026-01-23 GitCode mindspore/mindspore issue https://gitcode.com/mindspore/mindspore/issues/28897 （open）
  behavior: 用 float64 在 CPU 上跑带 BatchNorm 的网络做反向，dweight/dbias 的 dtype 掉成 float32，前向和 dx 都正常，loss 也不报错，只有把梯度打印出来或和参考实现逐位对比才发现精度损失；高精度回归里这类梯度会一直偏低精度。
  trigger_surface: CPU plugin 后端 + input=float64 的 batch_norm 反向（BatchNormGradExt）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
