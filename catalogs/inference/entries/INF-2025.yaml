title: 开 SP 后千 token 以上请求输出乱码
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: SP 长请求切分
  behavior: 开启 VLLM_ASCEND_ENABLE_FLASHCOMM=1（SP）后，925 token 输入正常、1040 token 起整段退化为同一 token 重复；长度跨过约 1000 token 边界即触发，原文未定位到代码
effect:
  objects:
  - 输出内容
  detail: Qwen3-MoE、vllm@1b67b0 + vllm-ascend@00ba07：启用 SP 后，925 token 返回通顺中文，1040 token 返回整段重复的韩文假名 token；HTTP 200、finish_reason=length，日志无异常
  visibility: 静默错误
mitigation:
  detect: 同一 prompt 构造 925 与 1040 token 两个版本，SP 开启下比对输出；若仅在长版本出现单 token 重复即命中
  fix: 待定（issue closed，未见 MR）：规避手段是关闭 VLLM_ASCEND_ENABLE_FLASHCOMM / 不用 SP，长度为 1000 token 附近的请求需重点回归
