original:
  mechanism: vllm-project/vllm-ascend issue 3374（2025-10-11，closed）：vllm@1b67b0 + vllm-ascend@00ba07，Qwen3-MoE，启动时 export VLLM_ASCEND_ENABLE_FLASHCOMM=1 打开 SP，同时 TASK_QUEUE_ENABLE=0、VLLM_USE_V1=1、HCCL_OP_EXPANSION_MODE=AIV、HCCL_INTRA_PCIE_ENABLE=1 且清空 .torchair_cache。同一台服务上 prompt_tokens=925 的请求返回通顺中文，prompt_tokens=1040 的请求返回整段重复的韩文假名 token；两条请求只差长度，说明触发点在序列并行对长请求的切分/拼接路径上。issue 正文只给了两个 curl 的输入输出对照，没有给出根因定位或修复 PR。
  source: 2025-10-11 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/3374 （closed）
  behavior: 接入 SP 提升长序列吞吐后，短问题答得好好的，一旦 prompt 到一千 token 上下（长文档、多轮上下文）就整段变成同一个 token 的复读，客户端收到的是 HTTP 200 和 finish_reason=length，服务端日志干干净净，只有人工看输出才发现答非所问。
  trigger_surface: VLLM_ASCEND_ENABLE_FLASHCOMM=1 + prompt ≳1000 token
  discovery: 2026-10-21 系统扫描 sweep_5（顺序深读）
