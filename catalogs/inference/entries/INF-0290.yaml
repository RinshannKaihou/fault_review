  meta: '`infra_off`（`ttnn.group_norm` fp32 DEST（fp32 输入或 bf16 输入 + `fp32_dest_acc_en=True`）+ interleaved 输入：mcast/no-mcast 工厂把通道 subblock 取 `get_max_subblock(block_wt, 8)`，而 fp32 DEST 在 half-sync 模式只有 4 tile 容量——**一组跨 ≥5 channel tile（C/G≥160）起确定性错值**（C=1024 时 max err 1.00 vs 正确配置 0.011；`dst_full_sync_en=True` 或 `use_welford=True` 正确、≤4 tile/组正确；sharded 工厂已有 `fp32_dest_acc_en && !dst_full_sync_en ? 4 : 8` 正确封顶，interleaved 两工厂漏掉） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
  mechanism: subblock 容量谓词与 DEST 格式的 half-sync tile 上限不匹配，compute kernel 单次 `tile_regs_acquire` 请求 5–8 个 fp32 tile。
  source: 'tt-metal #59848（2026-10-08 open，逐 C 值误差表 + sharded 工厂正确守卫对照）。https://github.com/tenstorrent/tt-metal/issues/59848'
  behavior: 无 crash——宽组 group_norm 归一化统计静默错值且随组宽增长。
  trigger_surface: tt-metal + group_norm + fp32 DEST + interleaved + 每组 ≥5 channel tile（config）
  discovery: 2026-10-12 每日扫描（10-09 未覆盖清单补录）。
