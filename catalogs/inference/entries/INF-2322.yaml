title: vLLM npcache 源 .bin 更新后静默服务旧权重
kind: 故障
status: active
cause:
  objects:
  - subsystem: 权重/检查点
    stack: vllm
    component: npcache 权重缓存失效逻辑
  behavior: vLLM 为 .bin 检查点创建 npcache 后，替换/更新源 .bin 文件不会使缓存失效；只要 np/weight_names.json 存在，新进程继续加载旧 NumPy 数组，无任何校验源文件是否变化。
effect:
  objects:
  - 模型权重
  detail: 复现：embed_tokens 全元素 +1.0 并回写 .bin 后，npcache 新进程加载的 embedding sum 仍 378.0/哈希不变（旧张量），auto 加载器同目录读到 447.0/新哈希；同目录两种 load_format 结果系统性分叉，属静默模型版本正确性失败。
  visibility: 静默错误
mitigation:
  detect: 更新 .bin 后比对 npcache 与 auto 加载的权重哈希/sum；或删除 np/ 目录强制重建。
  fix: 待定（issue open 2026-10-30，vLLM 0.32.0；报告建议缓存校验源 shard 指纹，未见修复 PR）
