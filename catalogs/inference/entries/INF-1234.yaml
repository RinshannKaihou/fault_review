  source: 'llama.cpp #9171（平移后 KV-cache 满）、#7742（架构特定的错误输出）。'
  behavior: 源文档未单列该字段；机制中记载的可观测后果是上下文过早耗尽（KV-cache full）或在折叠位置下输出错误。
  trigger_surface: llama.cpp 专用
  signature: '`ambiguous` —— 只在启用 self-extend 且上下文超过 `grp_attn_w` 时出现（#7742 还带架构门控）。需要注意机制的两半在本项目轴上分属不同族：**正确**的 self-extend 位置折叠本身是模型能吸收的 model_on 型压缩，而**错误**的 shift/reclaim 才把状态推离流形。签名是折叠后的相对位置把不同 token 坍缩到同一有效位置，导致 K/query 点积的位置可分性下降、组内注意力异常尖锐。可捕获的是 statistical 族（注意力峰度）与 infotheoretic 族（注意力熵 / 位置可分性）；geometric 族的范数离群检测漏检，因为折叠只改相位不改幅值。'
  repro: 方案：单钩子对缓存 K 按 `pos → grp_start + (pos - grp_start) // grp_attn_n` 的折叠位置重新旋转，query 侧保持原位置以复现「组内多 token 同相位」的坍缩。属 partial：真实故障还包含 reclaim 逻辑导致的缓存耗尽，单钩子层面无法复现该资源侧行为。
  locus: index-position
  priority: medium
