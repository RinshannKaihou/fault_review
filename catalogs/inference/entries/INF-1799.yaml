  mechanism: Ascend 300I Duo 上，GE 走 ACL 流程把模型转成 mslite/mindir 时，在 PreRunAfterOptimizeAfterStage1 阶段的 GE 图里可以看到 conv2d 算子的全部输入（x、filter、bias）都被转成了 fp16；而 Torch 前向在 x/filter 为 fp16、bias 为 fp32 时输出是 fp32，报告者需要保留 fp32 精度，因此在 issue 里询问是哪个 GE 优化 pass 做了这次类型转换、能否单独让 bias 保留 fp32。issue 为咨询性质、已 closed，正文未给出 pass 名称与开关。
