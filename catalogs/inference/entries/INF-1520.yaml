id: INF-1520
legacy_ids: []
slug: torchnpu_te_int64_constant_downcast_identity
aliases: []
title: TE 后端 int64 降型致 masked 归约错值
kind: 故障
status: active
cause:
  objects:
  - subsystem: 编译器
    stack: pytorch
    component: TE 后端 int64 降型
  behavior: codegen 的 constant 与 triton_compute_type 把 int64 无条件降为 int32，INT64 边界常量按低 32 位截断成 0/-1，指针签名同时降为 *i32。
effect:
  objects:
  - 数值结果
  detail: 全掩码行 amax 返回 0、amin 返回 -1（应为 ±INT64 边界），argmax/argmin off-by-one；|x|≥2^31 的 int64 载荷回绕（2^40+1 得 2）；default/eager 正确。
  visibility: 静默错误
mitigation:
  detect: TE 后端编译 masked amax/amin/argmax/argmin 的 int64 用例，比对全掩码行 identity 与大值载荷；default 后端作对照
  fix: int64 降型加值域守卫（仅 [-2^31, 2^31-1] 内降型），越界常量保持 tl.int64，并让该 kernel 的 *i64 指针跳过降型；issue closed，实现 PR 未在正文给出
