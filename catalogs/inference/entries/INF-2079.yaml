aliases: []
title: quantize_add_layer_norm INT8 逐 bit 差
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: quantize_add_layer_norm
  behavior: arch35 在 FP32 里完成归一化与 scale/offset 后走 RINT->half->int8，golden 先把归一化结果降精度回转再量化，舍入边界处的中间精度与顺序不同，少量 INT8 元素逐 bit 不一致
effect:
  objects:
  - 数值结果
  detail: 22条INT8未过binary_equal（黑盒17/177、白盒5/12），无memory OOB；FP16/D=768无zero_points每条约1/768元素不一致，BF16/D=128有zero_points约1/128不一致，BF16/D=768约3~4/768，一条99.16%元素一致
  visibility: 静默错误
mitigation:
  detect: 对每个 shape 统计 INT8 输出与 golden 的逐 bit 不一致元素占比；注意同时看输出 1 的浮点残差会掩盖输出 0 的失败
  fix: issue 未附修复 PR（closed，修复状态未核实）；报告者指出需用设备 dump 逐元素比对确认 golden 与 kernel 的舍入顺序，即定位线索而非已证明的唯一根因
