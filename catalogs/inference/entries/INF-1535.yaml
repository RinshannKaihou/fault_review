id: INF-1535
legacy_ids: []
slug: ops_nn_cross_entropy_extreme_logits_cancellation
aliases: []
title: CrossEntropyLoss 极端 FP32 logits 出 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: CrossEntropyLoss 日志概率计算
  behavior: 先算 input−rowMax 再 Exp，-FLT_MAX 这类极端负值进入指数路径触发 NaN；再用 logBatchSum=rowMax+log(expSum) 回代，整行极端值时消减致错误 log-softmax。
effect:
  objects:
  - 数值结果
  - 训练信号
  detail: CrossEntropyLoss 使用含 -FLT_MAX 的 FP32 logits 时，部分 masked（如 [0,-FLT_MAX,1]）或整行 -FLT_MAX 会使损失/逐 token log-prob 出现 NaN 或明显错误值；正常量级 logits 下正常。
  visibility: 数值异常
mitigation:
  detect: 构造含 torch.finfo(float32).min 的行与整行 -FLT_MAX 的输入，检查输出是否 NaN 或与 log_softmax 参考不符；常规值域用例发现不了。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/9233 （open，未发布）：Exp 前把稳定化输入下限钳到 -87.0f、log-prob 改为 (input−rowMax)−logExpSum、新增两类极端 logits 回归用例
