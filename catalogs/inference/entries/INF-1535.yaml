relations: []
pattern: PAT-INF-0172
original:
  mechanism: cann/ops-nn merge request 9233（2026-08-25，open）：CrossEntropyLoss 在极端 FP32 logits（-FLT_MAX / torch.finfo(torch.float32).min）下数值不稳定。原实现先计算 input−rowMax 后直接进入 Exp，极端哨兵值在指数路径上触发 NaN；log-prob 又按 logBatchSum=rowMax+log(expSum) 再算 input−logBatchSum，整行均为 -FLT_MAX 时 rowMax 与小量 logExpSum 相加发生严重消减，得到错误的 log-softmax。修改三处：Exp 前把稳定化后的输入下限限制为 -87.0f；log-prob 改为 (input−rowMax)−logExpSum，避免先把 rowMax 与小量相加；补极端 logits 回归用例，覆盖部分 masked 与整行 -FLT_MAX 两种场景（[0,-FLT_MAX,1] 与三个 -FLT_MAX）。PR 只跑 pre-commit、clang-format、codespell、OAT 检查，未附数值比对结果；状态 open。
  source: 2026-08-25 GitCode cann/ops-nn merge request https://gitcode.com/cann/ops-nn/merge_requests/9233 （open）
  behavior: 做带 masked logits 的交叉熵时，只要某些位置填成 -FLT_MAX（float32 的最小值，常见于 padding/mask 的硬置负无穷），损失和逐 token 的 log-prob 就会冒出 NaN，或者整行都是 -FLT_MAX 时给出明显错误的数值；换成正常量级的 logits 就完全正常。这类输入在训练/推理里常被当成“该位置永不选”的标准写法，所以出错时很难想到是算子本身。
  trigger_surface: CrossEntropyLoss + FP32 logits 含 -FLT_MAX（部分 masked 或整行极端负值）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
