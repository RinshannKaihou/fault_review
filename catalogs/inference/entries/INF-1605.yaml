original:
  mechanism: torchair 图模式在把 PyTorch 图转成 GE 图时使用默认的 DFS 拓扑排序。当图里存在多个彼此没有执行序依赖的 HcomAllToAllV 算子时，排序本应给出与输入图一致、且各卡一致的顺序；但 torchair 的 DFS 是非稳定拓扑排序，其内存优先（mem-priority）机制会依算子输出 shape/内存需求调整拓扑序。由于两卡的 HcomAllToAllV 输出 shape 存在差异，同一张图在两卡上排出不同的算子顺序，集合通信的收发次序于是错开，出现精度问题（issue 环境：CANN 9.0.0、torch_npu 2.7.1、Python 3.11、EulerOS 2.12、两卡）。issue 复现脚本仅做三处无依赖的 HcomAllToAllV，未给日志；根因由报告者定位到 DFS 非稳定拓扑与内存优先调整顺序。
  source: 2026-03-02 GitCode Ascend/torchair issue https://gitcode.com/Ascend/torchair/issues/349 （closed）
  behavior: 图模式下把多个互不依赖的 all-to-all/all-to-all-v 放在同一个 forward 里时，两卡的通信算子执行顺序不一样，alltoall 的收发对不上，输出数值错但形状合法、没有报错，只有在两卡结果对比或与 eager 对比时才发现；把通信算子拆到不同子图或加显式依赖后现象消失。
  trigger_surface: torchair 图模式 + 图内多个无执行序依赖的 Hcom* 通信算子 + 各卡输出 shape 不同（触发内存优先重排）
