id: INF-2602
legacy_ids: []
slug: recurrent_gated_delta_rule_ub_pad_uninit_state
aliases: []
title: RecurrentGatedDeltaRule 读 state UB 对齐空隙
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: arch22 CopyInState
  behavior: CopyInState 用 DataCopyPad 只写每行 alignKState 个元素，dstStride 跳到更大的 alignK_，行内 32B 对齐空隙从未写，随后整行 DataCopy 进入计算。
effect:
  objects:
  - 数值结果
  - 隐状态
  detail: fp32 state 且 Dk%16∈1..8（如 Dk=65）时 initcheck 在同处报 uninitialized read 2080B，100 条用例 56 条命中；空隙残留 NaN 时零输入 out 出 NaN（200 次 72–77 次），Dk=64 对照 0 次。
  visibility: 数值异常
mitigation:
  detect: 对 Dk%16≠0 的 fp32 state 用例跑 mssanitizer --tool=initcheck，查看 recurrent_gated_delta_rule_arch22.h:246 是否报未初始化读；或在同卡先制造 NaN 残留下跑零输入用例，检查 out 是否出现 NaN。
  fix: 待定（issue open，无修复 PR；报告建议按 alignKState 写满行内空隙或让 DataCopy 只搬 alignKState 段，未核实）
