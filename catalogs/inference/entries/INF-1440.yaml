original:
  mechanism: quantize_add_layer_norm 算子 950 实现量化前缺少规格要求的低精度回转。golden 参考脚本在量化前多做一步：把 float32 归一化结果先舍入到低精度类型（fp16/bf16）再转回 float32，之后才除以 scale 取整（golden.py:83-84 norm.to(t).float()）。950 芯片 arch35 目录的两个内核（full_load、welford）没做这一步，归一化结果保持 float32 直接进入量化。CPU 双路复算完全区分两者：设备输出与不带回转算法在全部 244,954 个数值上逐位相同；golden 与带回转算法逐位相同——即设备按自己的算法是准确的，1,867 个差异（22 条用例、全部 ±1）全部来自回转的有无。该步不是 golden 写错：它对应 SE 规格（5.2 节）规定，910 系同名算子（single_row_kernel）量化段就这么实现，950 是该算子家族唯一没实现的分支。修复 PR !11513（open）：arch35 两内核量化计算处补两次类型转换（输入为 fp32 时编译期跳过）。950 真机验证：issue 的 22 条用例重放 22/22 逐位恢复；TTK 282 条两轮回归 y frozen 通过 57→259、noroundtrip 265→54（行为确实转向带回转）、x 输出 163/163 不变、越界 282 全净；无一条从通过变失败（23 条剩余失败=21 条修复前已失败+2 条千万级元素求和顺序 ±1 已知类）。
  source: 2026-10-18 GitCode cann/ops-nn PR https://gitcode.com/cann/ops-nn/merge_requests/11513 （open，c2026-10-08 u2026-10-18）；关联 issue 22 条 binary_equal 失败（PR 描述内联）
  behavior: 在 Ascend 950 上对 fp16/bf16 输入使用 quantize_add_layer_norm（量化 add+层归一化融合算子）时，量化输出 y 与标准答案逐位比对失败：22 条用例共 1,867 个数值不一致、每个都恰好差 ±1 个量化档。无报错，服务照常运行；fp32 输入用例不受影响（逐位不变）。同一检查点在 910 系芯片上行为符合规格。
