id: INF-1902
legacy_ids: []
slug: vllm_ascend_xgrammar_unbounded_array
aliases: []
title: xgrammar 无 maxItems 数组无限膨胀至截断
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: xgrammar 结构化输出
  behavior: xgrammar 对未声明 maxItems 的 array<string> 不设上界，语法允许无限追加元素，模型持续生成直至 max_tokens，唯一项耗尽后退化为两项交替复读。
effect:
  objects:
  - 输出内容
  detail: json_schema 请求返回数百至数千个 tags 元素并以 finish_reason=length 结束；唯一项用尽后输出两项交替重复，结构化响应不可用。
  visibility: 静默错误
mitigation:
  detect: 对 array<string> 且无 maxItems 的 json_schema 请求设置大 max_tokens，统计数组元素数与 finish_reason
  fix: 上游讨论增加语法循环检测或默认上界（vllm#40099、xgrammar#688 方向，均 open）；当前仅能在 schema 中显式写 maxItems
