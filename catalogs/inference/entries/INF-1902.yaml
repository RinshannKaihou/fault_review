original:
  mechanism: 'vLLM 0.24.0（vllm-ascend nightly-main commit e1bd15041）部署 Qwen3-235B-A22B-Instruct w8a8，8×Ascend 910A3、TP=8，结构化输出后端为 xgrammar。请求 response_format=json_schema，schema 含 tags: {type: array, items: {type: string}} 且未声明 maxItems。xgrammar 生成的 JSON 语法允许数组无限追加元素，也没有循环检测，模型持续输出数百至数千个元素直到 max_tokens，finish_reason=length；唯一项词表耗尽后退化为两个元素交替重复。issue 关联 vllm#40099（loop detection，open）、xgrammar#160/#802（minItems/maxItems 与 grammar runaway，同机制）、vllm#17865（仅在声明 maxItems 时生效）。'
  source: 2026-08-05 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13646 （closed）
  behavior: 使用 json_schema 约束输出时，只要数组字段没有 maxItems，模型就会不停生成数组元素直到 max_tokens，响应被 length 截断；元素唯一值用完后变成两项来回重复，客户端拿不到可用的结构化结果。
  trigger_surface: xgrammar 结构化输出 + array<string> 未声明 maxItems + 较大 max_tokens
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
