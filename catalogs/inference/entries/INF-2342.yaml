original:
  mechanism: 'cann/ops-nn MR !13251（2026-10-31 merged，refs issue #7163）：aclnnLogit/aclnnLogitGrad 公开原型声明 double eps，但实现链路在入 launcher 前按 float32 窄化，对两类取值静默改写：(1) 负的 double 次正规 eps（如 -1e-320）窄化为 -0.0F，eps>=0 判定错误成立，算子被错误切到 clamp 模式；(2) LogitGrad 侧正的 double 次正规 eps（如 1e-320）窄化为 +0.0F，边界下界变为 0，x=0 落入有效桶输出 inf（资料应为 0）。修复：窄化前保留 eps 符号与次正规语义——aclnnLogit/LogitGrad 负 eps 映射为 float 无 clamp 哨兵 -1.0F；LogitGrad 正次正规 eps 映射为 FLT_TRUE_MIN（所有受支持输入均在 float 网格上，x>=FLT_TRUE_MIN 与 x>=eps binary64 逐例等价）。测试：A2（910B3/CANN 9.2.0）上板回归 3 dtype × 24 组 eps（含 ±次正规、ulp 级、近 1、NaN/Inf）× 20 组输入 × 正反向，含 strided/inplace/空 tensor/尾块，修复范围内用例全过、float 网格可精确表示 eps 输出与修复前逐位一致。float 非精确的常规 eps（ulp 级边界差异）不在本最小修复范围（#7163 对应复现项保持开放）。'
  source: 修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13251 （merged 2026-10-31）refs issue https://gitcode.com/cann/ops-nn/issues/7163 （训练库 TRN-0374 同机制）
  behavior: 调用 aclnnLogit/aclnnLogitGrad 并传入极小的 eps（次正规量级，如 1e-320）：负 eps 时算子静默按 clamp 模式计算（语义翻转），LogitGrad 正 eps 时边界 x=0 的输出从应有的 0 变成 inf。接口不报错、常规 eps 数值看不出差异，只有次正规区间和 x=0/1 边界暴露。修复已 merge（!13251），float 可精确表示的 eps 行为逐位不变。
  trigger_surface: cann/ops-nn logit/logit_grad；eps 为 double 次正规（|eps|<FLT_TRUE_MIN 量级，如 ±1e-320）；x=0/1 边界；A2 910B3/CANN 9.2.0。
  signature: 负次正规 eps 触发 clamp 分支；x=0 输出 inf 而非 0。
  discovery: 2026-10-31 每日扫描
