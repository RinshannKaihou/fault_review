id: INF-2342
legacy_ids: []
slug: ops_nn_logit_eps_narrowing_subnormal_clamp_flip
aliases: []
title: aclnnLogit eps 窄化丢次正规语义 clamp 分支翻转
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: aclnn_logit eps 窄化
  behavior: 原型声明 double eps 但实现入 launcher 前按 float32 窄化：负 double 次正规 eps 窄化为 -0.0F 使 clamp 判定错误翻转；LogitGrad 正次正规窄化使 x=0 输出 inf（应 0）。
effect:
  objects:
  - 数值结果
  detail: 负次正规 eps：clamp 语义静默翻转；正次正规 eps：x=0 输出 inf 违反资料（应 0）。修复在窄化前保留 eps 符号与次正规语义（负→-1.0F 哨兵、正→FLT_TRUE_MIN），float 网格可精确表示的 eps 行为不变；边界 ulp 级差异另案。
  visibility: 静默错误
mitigation:
  detect: 对 ±次正规 eps（±1e-320）与 x=0/1 边界做前后对照；检查 clamp 分支是否随 eps 符号翻转。
  fix: '修复 MR https://gitcode.com/cann/ops-nn/merge_requests/13251 （merged 2026-10-31，refs issue #7163：A2 910B3 实测 3 dtype×24 组 eps×20 组输入正反向全过；是否随 CANN 发布未核实；float 非精确常规 eps 的 ulp 级差异不在该修复范围）'
