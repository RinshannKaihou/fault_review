original:
  mechanism: 'experimental/conversion/tril/op_host/tril_tiling.cpp 把 tiling 中间状态放 namespace optiling 匿名空间 TU 级可变全局：:51 声明 int64_t matrix_Num=1；:148-149 唯一写点 matrix_Num *= inputShape.GetDim(i)（只对前 rank-2 维累乘），全文件无复位，:119/:133 的 memset_s 只清 TrilTilingData 清不到该全局；:169 用它算 total_Length_Aligned，:221 写入 tiling data。kernel 侧 op_kernel/tril.h:89 把 matrixNum 赋为 GM 访存循环上界（:161/:183 循环条件）且无边界校验。复现（910B2/CANN 9.2.0，最小桩头直接编译 tiling 源文件、同进程按序调用 tiling 入口）：单起进程基线 matrixNum 2/1、lastTileLength 24/32；同进程 {2,3,4}→{2,3,4} 第二次 matrixNum 4、lastTileLength 48（两次入参完全相同）；{2,3,4}→{5,6} 第二次 matrixNum 2（应 1）、lastTileLength 64（应 32）；空输入路径 :116 提前返回同样不复位。ub_Sharing_Num 走 keyThree（:203 置 4）后再走 keyTwo（else 分支不写）时 loopCnt 基线 2 变 4、fullTileLength 24568 变 12280。kernel 循环越界后果为代码推演，未上板观测。可达性：CMakeLists.txt:47 ENABLE_EXPERIMENTAL 默认 OFF，默认发布包不含该算子。triu #3710 为镜像实现同型缺陷（triu_tiling.cpp:56/:158-159/:179/:231，复现表同）。报告者已在两单内做全量查重（3608 条，关键词含 matrix_Num/ub_Sharing_Num），确认与 #3675/#801/#1004/#1772 不同机理。'
  source: https://gitcode.com/cann/ops-math/issues/3709 + https://gitcode.com/cann/ops-math/issues/3710（均 open，2026-10-21 每日扫描，本地批次正文深读）
  behavior: 在 --experimental 构建的 CANN 包里，同一进程第二次及以后调用 aclnnTril/aclnnTriu（experimental 路径）时 tiling 结果错误：两次完全相同的入参第二次算出的 matrixNum/lastTileLength 与第一次不同（如 matrixNum 应 2 实为 4），kernel 的 GM 访存循环上界按错误值放大；换 shape、插空输入都无法恢复，只有新起进程才正常。默认发布包不含该算子，不触发。
  trigger_surface: Atlas 800T A2（910B2）、CANN 9.2.0、aarch64；仅 --experimental 构建包含的 experimental/conversion/tril、triu；同进程第二次调用起。
