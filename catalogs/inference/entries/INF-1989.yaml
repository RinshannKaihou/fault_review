original:
  mechanism: 'cann/ops-math issue #3363 指出 conversion/clip_by_value_v2/tests/assets/golden.py 的 clip_by_value_v2_golden 在 BF16 输入时先把 x、clip_value_min、clip_value_max 转成 float32，之后又用已经转换过的 x.dtype 判断是否需要把结果转回 BF16——该判断恒为假，函数实际返回 float32。算子注册定义（op_host/clip_by_value_v2_def.cpp:35-38）把 y 声明为与输入同 dtype，tests/st/arch35/ttk_kernel_clip_by_value_v2_st.csv 第 2、3、16-29 行有 16 条 BF16 输入、BF16 输出记录。作者在本机以 ml_dtypes.bfloat16 构造 x=[-3,0,3]、clip 到 [-1,1]，实测 input dtype bfloat16、output dtype float32、数值 [-1,0,1]，据此认定这 16 条用例的参考输出类型错了。仓库 commit 77f7e4c2286fb5a6c5f473f6df25b07236fe49d7。'
  source: 2026-09-29 GitCode cann/ops-math issue https://gitcode.com/cann/ops-math/issues/3363 （closed）
  behavior: 算子的 ST 用例看上去全绿，但参考值本身是 float32：BF16 输出若被写成 float32，或用 float32 容差去比，测试都不会报错；下游看到的“已验证”并不能说明 BF16 路径的 dtype 行为正确。
