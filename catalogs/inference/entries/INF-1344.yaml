title: update_cache padding 行越界写 cache 外 DRAM
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: tt-metal
    component: update_cache writer
  behavior: 输入 tilize 到 64 行高后，writer 按 padded 高逐 user 行走、无 Bcache 钳制，padding 行 48..63 被当真实 user 写出，越出 cache 张量页数。
effect:
  objects:
  - 数值结果
  detail: num_users>32 且非 32 倍数（如 48）时触发；无 TT_FATAL、无 crash，cache 内部值全对，越界 NOC 写落在 cache 外部 DRAM，表现为同 run 中无关张量的莫名损坏，极难归因。
  visibility: 静默错误
mitigation:
  detect: 待定
  fix: 待定
labels:
  stage: N/A
  confidence: verified
  coverage: var
  discovered: '2026-10-12'
remarks: '8.96（update_cache fp32 毒化邻 31 行，同 op #59561）的写侧姊妹：8.96 是 cache 内相邻行 fp32 精度毒化（数值面），本条是 padding 行越界写 cache 外 DRAM（地址面），失效维度正交。越界写按 cache_id=user*cache_batch_num_tiles+… 计算地址；worked example：Bcache=48 时 pad users 写 page 12288..16129，全部 ≥ cache_total 12288。校验只查 cache.padded_shape[0] <= input.padded_shape[-2] 与 batch_offset，无 %32 约束。来源 tt-metal #59824，main@e495861 复核未变。'
