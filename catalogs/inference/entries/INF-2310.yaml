cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: is_close Cast<float>
  behavior: arch35 is_close_dag.h 对整数输入先 Cast<float> 再比较，|x|≥2^24 的不同整数在 fp32 舍入到同值，零容差下仍判 close。
effect:
  objects:
  - 数值结果
  detail: int32 16777217 vs 16777216 实测 True（应 False）；int64 2^53+1 vs 2^53、1e18+1 vs 1e18 同错；阈值 |x|≥2^24，2^24−1 及以下正确；master 该行仍为 Cast<float>。
  visibility: 静默错误
mitigation:
  detect: rtol=atol=0 下断言 (16777217,16777216)=False；整数 dtype 全零容差扫描。
  fix: '待定（WIP MR !6909 isclose: compare wide integers exactly when tolerances are zero，未合入）'
