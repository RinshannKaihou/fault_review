title: FlashComm 序列并行缺前置约束致 DP 部署精度错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 并行切分
    stack: vllm
    component: sequence parallel 启用条件
  behavior: 开 FLASHCOMM（序列并行）但 tp_size=1 或 MoE 未开 expert parallel 时没有校验，代码按 SP 语义切分/归约，结果与单卡不一致。
effect:
  objects:
  - 输出内容
  detail: DP8/TP1 且 VLLM_ASCEND_ENABLE_FLASHCOMM=1 的 Qwen3-30B 精度异常，量化与非量化都复现；A2 复现、A3 正常；修复后该组合被直接拦住。
  visibility: 质量退化
mitigation:
  detect: DP 部署下逐条比对同一 prompt 与单卡/纯 TP 基线输出，同时记录 tp_size 与 --enable-expert-parallel 是否开启
  fix: 'vllm-ascend PR #4014（[Bugfix] Add constraints for sequence parallelism，2025-11 已合入 main）：对 tp_size>1 与 MoE 需开 EP 加约束，升级到含该 PR 的版本'
