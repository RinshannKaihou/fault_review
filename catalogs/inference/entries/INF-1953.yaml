original:
  mechanism: 'vllm-ascend issue #4273（2025-11-19，closed）：Qwen3-30B（msModelslim 量化，vllm-ascend 0.11.0，DP8/TP1，VLLM_ASCEND_ENABLE_FLASHCOMM=1，HCCL_OP_EXPANSION_MODE=AIV，--enable-expert-parallel）在 DP8 场景下精度异常；评论补充非量化模型同样复现，说明与量化无关。维护者 zhangxinyuehfad 确认 A2 上可复现、A3 上测试正常，并给出修复 PR #4014《[Bugfix] Add constraints for sequence parallelism》：该 PR 并不改算法，而是给序列并行加前置约束——要求 tp_size > 1，且 MoE 模型必须开 enable_expert_parallel，其它组合直接拦住。也就是说 SP/FlashComm 在 tp_size=1 的 DP 部署里本来没有有效的切分维度，代码仍按 SP 语义做切分与归约，产出与单卡不一致的结果，属于缺校验而非缺 kernel。issue 已随 PR 合入关闭。'
  source: 2025-11-19 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/4273 （closed）
  behavior: 按社区样例在 8 卡上把 Qwen3-30B 拉成 DP8/TP1 并打开 FLASHCOMM 后，服务能正常起来、请求也不报错，但回答质量明显不对，量化与非量化权重都这样；同一套权重换成 A3 或调整并行配置就正常。现场很难判断是量化精度还是并行配置，最后靠维护者比对 A2/A3 与 PR 里的约束条件才定位到「序列并行在 tp=1 时本来就不该启用」。
  trigger_surface: DP8/TP1 + VLLM_ASCEND_ENABLE_FLASHCOMM=1（序列并行）+ MoE 模型
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
