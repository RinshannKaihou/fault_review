original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（七个公开 ttnn op（`clone(dtype=)`、`copy` 跨 dtype 目标、`to_memory_config(dtype=)`、`interleaved_to_sharded`、`sharded_to_interleaved`、`tilize(dtype=)`、`to_layout(dtype=)`）对**整数↔浮点**及 uint16↔int32/uint32、int32/uint32→uint16 的 dtype 转换经 plain datacopy kernel **按位重解释**：4,096 个 [0,255] 精确可表示随机整数实测 **99.5–99.8% 输出元素与输入值无关**（float32→int32、bfloat16→int32、int32→float32 等 12 组合全灭；对照组 `ttnn.typecast` 同张量 0% 误差精确转换）——校验接受全部组合、无任何报错） · Cov: `var:1.227`（整数位型被浮点内核按位重解释族——1.190/1.227/1.260 三连之后的第四站点：本条在**数据搬运 dtype= 转换入口**且双向（int→float / float→int）全错） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: datacopy kernel 不做数值转换、直接搬运位型；报告者附 8 op × 12 转换组合的差错率矩阵（Blackhole simulator）与 typecast 精确对照列。
  source: 'tt-metal #58372（2026-09-29 open，与 #58371 同报告者姊妹篇）。https://github.com/tenstorrent/tt-metal/issues/58372'
  behavior: '无 crash——经数据搬运路径做跨类 dtype 转换时**静默返回与输入无关的垃圾值**（非近似、非 1-ulp——完全错值）；与 #58371 合看：数据搬运 dtype= 路径的转换语义整体缺失。'
  trigger_surface: tt-metal + 数据搬运 op 的整数↔浮点/窄整型 dtype= 转换（hw_specific；ttnn.typecast 精确）
  discovery: 2026-09-29 每日扫描。
