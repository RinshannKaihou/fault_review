  source: 'mlx-vlm #845（8x alpha bug，已由 PR #846 修复）；HF Forum #148164；peft #1836；vLLM #22077。'
  behavior: on-manifold 漂移：输出仍然连贯，但适配器被过度或不足施加 —— 风格错误、指令遵循的校准失准。
  trigger_surface: 加载/文件/config 操作可复现
  signature: 细微且 ON-manifold：对一个低秩 delta 做统一标量缩放，几何上仍然贴近健康流形。statistical 漂移度量加上作用于输出的 infotheoretic 度量有机会抓到；纯 geometric 的单点度量很可能漏检。
  repro: weight-clone-restore：对一个 Linear 生成小随机低秩因子 `B (out_f×rank) * 0.01`、`A (rank×in_f) * 0.01`，分别按 `wrong_scale`（默认 = raw alpha = 16）与 `correct_scale`（默认 = alpha/rank = 2）构造两个 delta，把差值 `delta_wrong - delta_correct` 加到权重上 —— 即"施加了错误缩放的 delta 而非正确缩放的 delta"这一净效应；退出时 copy 回克隆权重。
