id: INF-2024
legacy_ids: []
slug: vllm_free_kv_cache_block_queue_negative_blocks_race
aliases: []
title: FreeKVCacheBlockQueue 多连接器下负块数竞态
kind: 故障
status: active
cause:
  objects:
  - subsystem: KV缓存
    stack: vllm
    component: FreeKVCacheBlockQueue
  behavior: 多个 KV connector 同时挂载、前缀缓存频繁命中时，为 FreeKVCacheBlockQueue 算出的 num_new_blocks 变成负数，空块队列的链表操作随之越界或重复入队；vLLM < 0.29.0 存在该竞态
effect:
  objects:
  - KV状态
  detail: 长时间跑 PD 分离或多 connector 服务且前缀缓存频繁命中时，偶发返回错乱文本、答非所问，或请求前缀像别人的内容；重启能好一阵，KV 命中率越高越容易出现；日志无明确报错，只能从 block 复用异常反推；dsv4 负载下复现概率相对较高。
  visibility: 静默错误
mitigation:
  detect: 同时挂多个 KV connector 并压前缀缓存命中率，检查 FreeKVCacheBlockQueue 的 num_new_blocks 是否为负、free block 数是否与在用请求对不上
  fix: 上游 vLLM PR https://github.com/vllm-project/vllm/pull/52707 （merged，v0.29.0 起）；vllm-ascend 侧需确认所用 vLLM 版本已带该修复
