  mechanism: 'vllm-project/vllm-ascend issue 15990（2026-09-08，open）：使用 vLLM 0.29.0 之前的版本时，FreeKVCacheBlockQueue 在多 connector 且前缀缓存频繁命中的场景下存在竞态——为队列计算的 num_new_blocks 会变成负数，队列的空闲块链表被错误改写（重复入队/越界）。报告者给出该 bug 的上游修复为 vLLM PR #52707，并说明 dsv4 负载下复现概率相对较高；issue 正文只保留了这个结论与指向 PR 的链接，未附完整错误日志。'
