  meta: '`ambiguous` · Cov: `NEW` · 触发 `other_stack`⚠ · 置信度 `documented`'
  mechanism: TGI/guidance/outlines 的受约束解码 + 流式输出；约束施加、special-token 切分、或 stream 模式下的 detokenization 存在 bug，产生畸形的结构化输出。本条为 MERGED 条目，合并的子故障为：(a) special-token splitting（特殊 token 在约束/流式路径上被切开）；(b) stream detokenization（流式反分词产生空白/边界伪影）。
  source: 'HF forum "TGI with guidance generates weird output" (140854); vLLM #4577。综述 RA.5/RA.4。'
  behavior: 畸形 JSON/markdown、被切开的 special token、空白字符伪影。
  trigger_surface: TGI 专用
  signature: 门控于实现路径，故为 ambiguous。若约束只是对 token 做后处理/正则，隐状态完全健康，**隐藏态检测器漏检**；若约束是对 logits 做 mask，则 mask 后的分布被改变而 mask 前的隐状态依旧健康 —— 签名只在 logit/采样阶段可见，隐状态几何仍然漏检。替代检测手段：输出级结构校验器（JSON schema / 语法校验）与 detokenization 往返对拍。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）
  repro: 可软件复现 —— 用一个作用于 lm_head 输出的钩子施加 logit-mask 约束（把非法 token 的 logit 置为 -inf），从而复现「隐状态健康、logits 被改」的形态，用作检测器盲点的阳性对照。
