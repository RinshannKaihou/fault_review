title: index_cache 与 dspark 前缀命中致接受率塌陷
kind: 故障
status: active
cause:
  objects:
  - subsystem: 解码/采样
    stack: vllm
    component: dspark index cache
  behavior: index cache 用 skip_topk 复用上层 topk_indices_buffer，而 spec decode 只在 model 层共享该 buffer，impl 层引用变陈旧；命中前缀缓存后 DSA top-k 索引未恢复。
effect:
  objects:
  - 输出分布
  - 输出内容
  detail: DeepSeek-V4 同开 dspark（7 个草稿）、前缀缓存、use_index_cache 与 DSA 后，命中前缀的请求每步接受 token 数锐减，TPOT 劣化约 2.7 倍而 ITL 基本不变。
  visibility: 质量退化
mitigation:
  detect: 对比命中/未命中前缀缓存时的 accept_len 与 TPOT（ITL 不变即指向接受数下降）；检查 topk_indices_buffer 在 spec decode 与 index cache 之间复用后是否刷新。
  fix: 待定（issue open，正文只给到源码注释级线索与复现配置）
