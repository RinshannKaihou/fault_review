original:
  mechanism: MindIE-LLM 的重计算（recompute）路径在计算 maxOutputLen 时逻辑写错：每次都用上一次的结果去计算下一次的输出长度，形成迭代减法；当一个请求内多次触发重计算时，maxOutputLen 会被越减越小，最终可能小于 0，随后按这个值裁剪输出，导致生成被提前截断。正文只给出这一句根因描述与一张截图，未给定位文件、版本号与修复 PR。
  source: 2026-04-24 GitCode Ascend/MindIE-LLM issue https://gitcode.com/Ascend/MindIE-LLM/issues/552 （closed）
  behavior: 长输出或显存紧张到需要重计算的请求，返回内容会在中途被截断——本来还能继续生成却提前结束，精度测试里表现为答案缺尾、指标下降；请求本身成功返回、finish_reason 看着正常，不看输出长度和完整参考根本发现不了。
  trigger_surface: 同一请求内多次触发重计算（长输出 + 重计算开启）；单次重计算或不触发重计算不受影响
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
