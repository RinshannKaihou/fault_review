title: 重计算用上次结果迭代扣减 maxOutputLen 致输出截断
kind: 故障
status: active
cause:
  objects:
  - subsystem: 重计算/卸载
    stack: 通用
    component: 重计算 maxOutputLen 计算
  behavior: 重计算路径算 maxOutputLen 时拿上一次的结果去算下一次的输出，形成迭代减法；多次触发重计算后 maxOutputLen 可能小于 0，再按这个值裁剪输出。
effect:
  objects:
  - 输出内容
  detail: 多次重计算的请求输出被提前截断，精度测试与生成结果缺尾；过程不报错，只有对比完整输出或看截断长度才发现。
  visibility: 静默错误
mitigation:
  detect: 构造长输出 + 多次触发重计算的请求，比对实际返回 token 数与 max_tokens/剩余长度；在重计算分支打印每次的 maxOutputLen，观察是否单调递减到负数
  fix: issue closed；正文只给出根因描述（maxOutputLen 迭代减法），未给修复 PR 与版本
