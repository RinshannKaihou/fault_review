  - 数值结果
  detail: Ascend950 arch35上，normType=2输入含较大正值时输出Inf/NaN，含较大负值时输出0且相对误差100%；约11例同输入复跑不一致，batch尾行或k边界行成片NaN，算子返回成功。修复前ACLNN 499/500、E2E 429/481通过。
  visibility: 数值异常
mitigation:
  detect: ttk 跑 normType=2 的大正值/大负值用例与 expertCountAlign%64==32 的 k 边界用例，比对 NaN/Inf 位置并重复执行查非确定性
  fix: 待定（issue closed，正文未附修复 PR；其中 topk 并列值一例为 golden 比对误报，非算子缺陷）
