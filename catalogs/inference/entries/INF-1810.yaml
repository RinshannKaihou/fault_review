title: GE Roll 忽略 dims 退化为一维移位致精度异常
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: GE Roll 算子
  behavior: dims 不为 0 时 Roll 忽略 dims，退化成按 flatten 的一维循环移位，多 axis 的 shift 落到错误元素上。
effect:
  objects:
  - 数值结果
  detail: TorchAir 图模式下 Swin 窗口注意力的 torch.roll(dims=(2,3)) 结果错位、模型精度下降；改用 cat 手工移位后精度恢复，eager 无此问题（910B3 / CANN 25.5.0）。
  visibility: 静默错误
mitigation:
  detect: 图模式下对 dims≠0 的 roll 与 eager/cat 等价实现逐元素比对
  fix: 规避：用 cat/slice 按 dim 手工实现 roll（报告者验证精度恢复）；待定（issue closed，正文未给修复 PR）
