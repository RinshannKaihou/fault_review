original:
  mechanism: TorchAir 编译时报 aten::roll 的 ge_converter 未实现，用户用 @register_fx_node_ge_converter(torch.ops.aten.roll.default) 注册 return ge.Roll(self, shifts=shifts, dims=dims) 替代。图编译不报错，但 ge.Roll 在 dims 不等于 0 时忽略 dims 参数，退化为 flatten 后的一维 roll：按展平顺序做循环移位，而不是按 dims 指定的轴分别移位，多 axis 的 shift 因此落到错误元素上。定位到 Swin 类窗口注意力的两次 torch.roll(x, shifts=(-shift_size,-shift_size), dims=(2,3))；把这两处换成按 dim 用 torch.cat 拼接的等价实现后精度恢复正常。环境 Ascend 910B3、CANN 25.5.0。
  source: 2026-06-22 GitCode cann/ge issue https://gitcode.com/cann/ge/issues/453 （closed）
  behavior: 图模式编出的模型能跑通、不报错，但整体精度对不上；逐算子排查后落在窗口移位：dims=(2,3) 的 roll 被当成展平后的一维移位，特征图整体错位，attention 之后偏差被放大。把 roll 换成 cat 拼接的等价写法后精度立即恢复正常，同一份代码在 eager 下直接用 torch.roll 也没有问题。
  trigger_surface: TorchAir/GE 图模式下的 ge.Roll，dims 参数非 0
  discovery: 2026-10-21 历史索引回填（issue created < 2026-10-07）
