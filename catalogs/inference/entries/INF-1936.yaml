  - 输出内容
  detail: GLM-4.6V W8A8 文本推理 content 恒 null、thinking 死循环（删 top_k/top_p 或加 repetition_penalty 1.2 才恢复）；图片推理各配置下 content=null、finish_reason=length，量化日志仍 SUCCESS
  visibility: 质量退化
mitigation:
  detect: 量化产物落盘后检查 generation_config.json 是否携带非默认采样项；拉起服务时看 vLLM 是否打印 sampling parameters overridden by generation_config 警告
  fix: issue 未给修复；实测删除 generation_config 中的 top_k/top_p 或加 repetition_penalty 1.2 可缓解文本侧（未核实是否为官方方案）；TP=8 另报 aclnnDequantSwigluQuantV2 lastdim 需整除 64 的 shape 错误
