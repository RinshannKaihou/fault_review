  mechanism: 'msprobe 2026/6/25 master 编译版本，Ascend 910B：nan check 溢出检测对同一模型跑两次，两份 dump 数据 diff 后只有 is_nan 一处不同（< is_nan: 1 / > is_nan: 0），即相同输入、相同数据下检测结论不稳定，报告者用 diff data_dump/step0/proc2793859/dump.json 与 proc2797671/dump.json 复现。第二个问题与配置面相关：配置了 statistics.tensor_list 后，NanTest 采集走 aclnnNanTest，日志报 Execution_Error(EZ1009) ''Failed to execute operator NanTest_0. Reason: SoC version ascend910b verification failed. This SoC is not configured through the AddConfig API of the OpDef class''，随后打印 ''Nan check overflow tensor collection failed ... tensor collection will be skipped''；此时即使节点检测出 is_nan:1，也没有按预期触发 Exception。issue 未给根因代码位置与修复 PR。'
  source: 2026-06-26 GitCode Ascend/msprobe issue https://gitcode.com/Ascend/msprobe/issues/413 （closed）
  behavior: 同一个模型、相同数据跑两次 nan check，一次报 is_nan:0 一次报 is_nan:1，用户无法判断到底有没有溢出。配了 tensor_list 之后工具只打一条 WARNING 说溢出张量采集失败被跳过，然后又允许任务继续跑完；已经检出 is_nan:1 的节点也不会抛异常中断，溢出在监控视角里变成「可选信息」。
  trigger_surface: msprobe nan check（statistics/overflow 检测）；statistics.tensor_list 非空的配置路径；Ascend 910B
