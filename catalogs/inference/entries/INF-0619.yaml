  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（GPT-OSS-120B vLLM model tests 在 wh_galaxy_perf 上 structured-output 步骤**三周从未过闸**（HT 90.6–96.9%、LL 15.6–37.5%，`correct_rate==100.0` 门自 08-21 起 22 份日志全红）：每个失败样本都是 prefill 正确采样 `<｜channel|>` 之后、**首个 decode token 起生成垃圾**（`cosmos cosmos cosmos` 类单词循环，186–1022 token）；HarmonyError（"channel marker present but no channel value found"）只是信使——JSON grammar 在 final channel 出现前不 engage，垃圾是无约束文本。受控对照：同一 build、贪心 device 采样的 demo（prefill_128/batch128）在同期同 runner pool 完全连贯——损坏需要 structured 路径独有的东西；structured 请求强制 host 采样（`check_perform_device_sampling` 对 `has_structured_outputs` 返 False，tenstorrent/vllm#277），尽管 `sample_on_device_mode: all`，整个 structured 步骤跑 host-logits decode 变体（`trace_ids_decode[False]` + 每步全 padded-vocab logits 回读）。根因候选排序 H1（host-logits decode 路径）≥H2（请求更替设备状态）>H3（LL EP 行分歧——唯一自然解释部分流数百 token 后恢复连贯，SW 层 128 token 遗忘分叉）>H4（HT 行稀疏 padding combine）；无硬件无法定证。HT 失败几乎总在前 6 个被接纳请求（22/23 索引 ≤5）） · Cov: `NEW`（host-logits 回读 decode 路径专属损坏子签名） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: '报告做了逐行静态审计排除（async-scheduling/host-sampling 顺序、bitmask 时序、prefill→decode 交接、KV 放置、MoE combine 的 zero-fill 排除 stale-L1），并给出最便宜判别实验（去 `sample_on_device_mode` 跑 plain benchmark / structured benchmark 加 `--no-structured-output`）。基准脚本的 "✅ Structured output passed" 是自身 echo 文本而非结果、垃圾流恰含 `{...}` 时 `correctness: true`——**测试假阳性掩盖链**。'
  source: 'tt-metal #56100（2026-09-10 open，bug label，含 22 份 job 日志的样本级核验、受控对照与 H1–H4 候选排序）。https://github.com/tenstorrent/tt-metal/issues/56100'
  behavior: '无 crash——structured 请求自首 token 起垃圾/空响应（HarmonyError 被流式生成器捕获后 `[DONE]`，客户端计为成功空文本）；同 build 的 device 采样路径干净。与 6.174（QSA+NEXTN decode graph 静默语义损坏）同属"graph/trace 变体专属损坏"，本条变体轴是 host-vs-device 采样路径且 #44746（per-user KV corruption with `sample_on_device_mode=all`）是其 device-sampled 姊妹症状（未编目，报告引用）。'
  trigger_surface: tt-metal vLLM 插件 + GPT-OSS structured output + host-logits decode 变体（hw_specific：Galaxy）
  discovery: 2026-09-10 每日扫描。
