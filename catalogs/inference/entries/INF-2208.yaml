  objects:
  - subsystem: KV缓存
    stack: vllm
    component: Mooncake 布局注册 stride 当长度
  behavior: 按 head 注册传输区时把整块步长同时当块间距与传输长度，BHLNC 下每 4KB segment 传输 196608 字节并越写相邻块。
effect:
