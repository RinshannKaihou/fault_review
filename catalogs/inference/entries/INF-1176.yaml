  meta: '`infra_off` · Cov: `NEW` · 触发 `partial` · 置信度 `verified`'
  mechanism: Zamba2 的 `torch_forward` 存在**因果性违反**：inter-chunk state recurrence 在错误轴上 reduce，导致**位置 P 的 token 改变了 P 之前位置的 logits**。这是纯 PyTorch 路径（无 `mamba_ssm`）下的参考实现 bug——当未安装 `mamba_ssm` 时，transformers 走纯 PyTorch fallback，该 fallback 的 state recurrence reduce 轴写错了。
  source: 'transformers #47475（2026-07-28）。https://github.com/huggingface/transformers/issues/47475'
  behavior: 在自回归生成中，新生成的 token 改变已生成 token 的表示——违反因果性。输出可能表现为"回溯修正"或质量退化。
  trigger_surface: 需特定模型代码路径
  signature: infra_off——因果性违反。签名形态是"前缀 token 的隐状态随后续 token 的加入而变化"，这在标准 causal transformer 中不应该发生。可由 trajectory 族的逐位置前向差异检测（同一前缀 +1 token 后前缀隐状态是否不变）；geometric 单帧快照可能漏检（取决于影响幅度）。
  repro: partial——在纯 PyTorch fallback 路径上可以复现（不依赖 mamba_ssm），但需要 Zamba2 模型。
  discovery: 2026-07-29 每日扫描。
