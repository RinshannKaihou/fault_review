title: Triton MXFP4 转换结果依赖同张量无关元素
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: triton
    component: mxfp.py _from_float
  behavior: tie-break 的 is_tie.sum() 在全张量与候选维全局归约，多元素时几乎恒>1，即使无任何元素 tie，epsilon 也从所有偶 mantissa 候选减去，同值编码随批内容变化。
effect:
  objects:
  - 数值结果
  - 模型权重
  detail: 略高于 1.0/1.5 中点的值单独转换正确选 1.5（E2M1=3），加入一个无关第二元素后第一个值的编码变为 2（表示 1.0）；转换结果随批内无关内容变化，非确定、违反逐元素语义。
  visibility: 不可复现
mitigation:
  detect: 同一值单元素张量 vs 多元素张量分别转换比对编码；对拍独立 MXFP4 参考实现。
  fix: 待定（issue 给出修复方向：tie 判定应逐元素 mask 而非全局 sum；未见修复 PR）
