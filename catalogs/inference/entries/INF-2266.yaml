original:
  mechanism: 'Triton python/triton/tools/mxfp.py 的 MXFP4Tensor._from_float() 编码缺陷：```min_errors, _ = torch.min(errors, dim=1, keepdim=True); is_tie = (errors == min_errors); if is_tie.sum() > 1: ...; errors = errors - (tie_breaker * 1e-6)```。is_tie.sum() 在整个张量与候选维度上全局归约，两个及以上输入元素时几乎恒大于 1，即使没有任何单个输入处于 tie；epsilon 随后从每个偶 mantissa 候选中减去而非仅从并列最小误差的候选减去，导致同一 float32 值的编码取决于是否与无关值一起转换。示例：略高于 1.0 与 1.5 中点的值应 round-to-nearest 选 1.5（E2M1 编码 3），单元素张量正确；加入无关第二元素后第一个值编码变为 2（表示 1.0）。该工具用于权重/激活 MXFP4 量化转换，逐元素语义被破坏。'
  source: GitHub issue https://github.com/triton-lang/triton/issues/12506 （open，2026-10-27，含定位代码段与示例）
  behavior: 用 Triton 的 MXFP4 工具做量化转换时，同一个数值的量化结果会随同批其他无关数值的存在而改变：单独转换是对的，和别的值放在一起就被舍入到相邻编码（1.5 变 1.0）；导致量化产物不可复现、依赖批次内容，且全程无告警。影响所有用该工具生成的 MXFP4 权重/激活。
  trigger_surface: triton.tools.mxfp（MXFP4Tensor._from_float）；多元素张量转换（几乎所有实际使用场景）；MXFP4 量化权重准备与在线量化路径。
  signature: 单元素 vs 多元素张量同值编码不一致（3 vs 2）。
  repro: issue 正文含最小示例与定位代码。
  discovery: 2026-10-29 每日扫描
