  meta: '`infra_off`（`ttnn.atan2` 对 max(|x|,|y|) > 2^126 的普通操作数对返回**精确 0 或精确 π/2**（达 0.785 rad = 45° 误差）——内部 reciprocal 在 2^126 以上下溢，象限信息坍缩；#52094 大比值问题、#52340 修复之外的**第三个未守卫调用点**；fp32/bf16 均可达） · Cov: `var:ttmetal_div_subnormal_denominator_reciprocal_nan`（1.154 reciprocal 中间值族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 'atan2 输出有界于 π、操作数与结果都是普通数，但内部 `1/|·|` 中间值越界——与 #52094（|b|≥2^126 返回 0）、1.154（|b|<2^-126 返回 NaN）同一 reciprocal 策略的三处独立调用点；边界锐利（max=2^125 精确、>2^126 坍缩）。修复模式已两次确立（守卫或改写）却未横向清扫全部调用点。'
  source: 'tt-metal #55124（2026-09-02 open，操作数对-真值-设备值五点对照表）。https://github.com/tenstorrent/tt-metal/issues/55124'
