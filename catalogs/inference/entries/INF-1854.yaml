  mechanism: 0.23.0 版本 + GLM-5.2 w8a8c8 模型在 A3 PD 分离环境现网连续运行一周后出现精度问题（vLLM 0.23.0，vllm-ascend 0.23.1.dev22+g39118d6f9，torch 2.10.0 + torch_npu 2.10.0.post4，CANN 9.1.0）。报告给出的可观测线索有三条：出现精度问题的响应里存在乱码；观察 decode 节点处理该请求时 dp 的 mtp 接受率很低，低于 10%；一旦出现过该问题，因为 KV 已经被缓存，再次重发、命中 KV 缓存后仍然乱码。因此报告的判断是错误已经进到缓存里，用户业务侧感知到精度问题的概率很大。正文给了完整的 collect_env 与启动参数，但没有定位到具体代码或 MTP 分支，也没有给修复 PR。
  source: 2026-09-02 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15586 （open）
  behavior: 线上服务跑一段时间后，个别请求的回答里出现乱码，接着同一请求无论怎么重发都还是乱码（命中缓存），像被“污染”了一样；同时 decode 节点的投机解码接受率掉到 10% 以下。日志不报错，只能靠抓乱码响应和接受率指标发现。
