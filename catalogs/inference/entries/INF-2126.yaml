  objects:
  - subsystem: 算子/内核
    stack: cann
    component: adaptive_avg_pool2d 空输入早退
  behavior: aclnn_adaptive_avg_pool2d.cpp L400-404 把 self 空与 out 空合并处理直接返回 SUCCESS：self 空而 out 非空时仍有元素该写而一个不写，输出停留未初始化内存
effect:
  objects:
  - 数值结果
  detail: 返回码 0 但 out 全部为内存池残留：首次分配页常为 0 故常"看起来正确"，内存池复用后读出脏值（污染实验证实）；同族 avg_pool2d/max_pool2d 空输入正确报错
  visibility: 静默错误
mitigation:
  detect: 空 self + 非空 out 调用后检查 out 是否被写（对照已污染显存池）
  fix: 待定（issue 给出代码位置与语义分析，修复未提交）
