original:
  mechanism: ops-nn（master a946a7b2，2026-10-22）aclnnAdaptiveAvgPool2d 在 self 为空张量（H=0、W=0、N=0 或 C=0）、out 为非空张量时第一段接口直接返回 ACLNN_SUCCESS 且一个元素都不写（pooling/adaptive_avg_pool2d/op_api/aclnn_adaptive_avg_pool2d.cpp:400-404 的 if (self->IsEmpty() || (IsRegbase() && out->IsEmpty())) 早退合并了两种语义相反的情形——out 空确实无元素可写，self 空而 out 非空时输出仍有 N×C×outH×outW 个元素待写）。用户拿到未初始化内存：内存池首次分配页通常为 0，常"看起来"返回正确全 0；池被复用后读出脏值（报告者污染实验第 3 节证实内容随分配历史变化）。同族 avg_pool2d、max_pool2d 对相同空输入正确报错，仅 adaptive_avg_pool2d 静默放行。A2 910B2 8 卡、CANN 9.2.0、torch 2.12.0+cpu/torch_npu 2.12.0.post3，profiler 确认落到 aclnnAdaptiveAvgPool2d。
  source: https://gitcode.com/cann/ops-nn/issues/7229（A2 910B2/CANN 9.2.0 实测 + master a946a7b2 源码行号）
  behavior: 在 NPU 上对空输入张量（如 batch 或通道为 0 的裁剪产物）调用 adaptive_avg_pool2d 且输出非空时，接口返回成功但输出张量内容为未初始化显存：值随之前的显存使用历史变化，有时碰巧全 0 掩盖问题。CPU 对同输入报错。下游静默消费这些脏值。
  trigger_surface: aclnnAdaptiveAvgPool2d + 空 self + 非空 out；Ascend 910B2/CANN 9.2.0
  discovery: 2026-10-22 每日扫描
