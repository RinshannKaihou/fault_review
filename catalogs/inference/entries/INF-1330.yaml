  mechanism: PyramidInfer 在**预填充期间**就逐层剪枝 KV；一个在早期层被判为非关键而丢弃的 token，会从整个上层堆栈中消失。与可重排的事后（post-hoc）预算不同，晚绑定的 token 无法被重新考虑——早期的一次误判不可逆。
  source: arXiv:2405.12532。
  behavior: 对"关键信息出现在早期但只有到后期推理才用得上"的任务质量骤降，普通短问答基本无感。
  trigger_surface: 非 vLLM 一等实现
  signature: 受输入门控（只有当被丢弃 token 后来变得关键时才出错），故记 ambiguous。签名同属"缺失"类：**上层 KV 长度 < 深层注意力目标**。与 K10.18 一样，statistical（逐层 cache 长度、注意力质量落空）可见，而 geometric/spectral 因残存表示自洽而漏检；trajectory 的深度剖面可见 GRADUAL 型的逐层长度收缩。
  repro: partial——在各层 forward 钩子上按层深递增地移除一部分位置（层越深保留越少），且一旦移除不再恢复，复现"逐层不可逆剪枝"的金字塔形长度剖面；PyramidInfer 的关键度打分策略不复现。
  locus: eviction-compression
  priority: medium
