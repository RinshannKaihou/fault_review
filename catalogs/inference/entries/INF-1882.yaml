original:
  mechanism: 'Ascend/pytorch #2608：torch_npu.profiler 的 FLOPs 估算链（_flops_hook.py 的 wrapper → _flops_formulas.py 的 npu_fusion_attention_flops → _calculate_common_layout_flops → _parse_dims → _head_dim）默认 q/k head_num 相同，没有考虑 GQA：_parse_dims 用 kv_heads 解析 k_shape 的 hidden size，_head_dim 抛 ValueError("Hidden size 512 must be divisible by the number of heads 28")，被 wrapper 捕获后只打一条 WARNING:torch_npu.profiler._flops_hook:Failed to calculate FLOPs for npu_fusion_attention 就不再产出 FLOPs。另外把 actual_seq_qlen 累积长度换算成实际序列长度后，单个 seq 可能为 0，此时直接 raise actual_seq_qlen and actual_seq_kvlen must contain valid cumulative lengths。报告者是在 mindspeed 训练（iteration 4/10）的 profile 里踩到这两条。'
  source: 2026-07-03 GitCode Ascend/pytorch issue https://gitcode.com/Ascend/pytorch/issues/2608 （closed）
  behavior: GQA 模型（kv head 数与 q head 数不同）profile 出来 attention 那几行没有 FLOPs，只有一条 Failed to calculate FLOPs for npu_fusion_attention 的 WARNING 躺在 stderr 里；含 0 长度序列的 batch 干脆报 actual_seq_qlen… 错误。汇总表照常生成，只是 FLOPs/MFU 那几列偏小或空着，做性能分析时会误判 kernel 效率。
