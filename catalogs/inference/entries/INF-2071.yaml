relations: []
original:
  mechanism: vllm-ascend 在 DSA-CP（DSA 上下文并行）+ FULL_DECODE_ONLY 全图模式下，DSA-CP 的 metadata builder 把 query_start_loc 与 CP 后缀长度以异步 H2D 拷贝送到 device，而 FULL graph replay 没有对这两个 ad-hoc copy event 建立依赖；同时传给 SMLA 的 sparse-index 张量每次 forward 重新分配，图重放继续使用 capture 时的地址；C2 dummy capture 时压缩 cache 长度为 0 还会走进 Python empty-cache 分支并被一起捕获。报告者的判据是：同一模型同一请求参数，关闭图重放或打开 DSpark 结果都不同，故排除采样；先跑 32 并发再以 1/4 批重放同一图即可复现 GPQA-Diamond 精度下降与 raw 输出差异。
  source: 2026-09-29 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/17729 （closed）
  behavior: 压测先跑 32 并发，再发 1/4 批的小请求，服务不报错、token 正常吐出，但 GPQA-Diamond 的答案与关闭图重放时相比明显变差，raw completion 也换了一套说法；使用者容易当成模型能力波动，而不是图重放读到了过期的 CP 元数据或稀疏索引。
  trigger_surface: DeepSeek V4.1 Flash + DSA-CP + FULL_DECODE_ONLY + batch 由大到小复用同一 decode 图
  discovery: 2026-10-21 第三轮顺序扫描（tail_2，issue created < 2026-10-07）
