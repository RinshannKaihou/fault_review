id: INF-2071
legacy_ids: []
slug: vllm_ascend_dsa_cp_full_graph_replay_stale_metadata
aliases: []
title: DSA-CP 全图重放不等元数据拷贝致 DSV4 答错
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: vllm
    component: FULL graph 重放输入
  behavior: DSA-CP 元数据构造把 query_start_loc 与 CP 后缀长度异步拷到 device，FULL decode 图重放不依赖这些拷贝事件；SMLA 稀疏索引每次前向新分配，图仍用捕获时地址。
effect:
  objects:
  - 输出内容
  - 输出分布
  detail: 同一请求先在 32 并发跑过、再以 1/4 批重放同一 decode 图后，GPQA-Diamond 解析答案与 raw completion 明显不同；关图重放或开 DSpark 即恢复。
  visibility: 质量退化
mitigation:
  detect: 按 32→1/4 批序切换请求复用同一 decode 图，比对 GPQA 解析答案与 raw completion；检查重放前 CP 元数据 H2D 拷贝是否存在事件依赖
  fix: issue 提议：两处 CP 元数据拷贝改为同步、稀疏索引刷新到模型固定地址缓冲、FULL 图捕获时保证压缩组存在，并补 in-place 刷新单测（closed，未见合并记录）
labels:
  family: infra_off
  trigger: config
  trigger_review: false
  trigger_note: vllm-ascend + DSA-CP + FULL_DECODE_ONLY + 关 DSpark；同一 decode 图被更小 batch 重用（32→1/4）
  stage: N/A
  confidence: documented
  coverage: NEW
