  meta: '`infra_off`（`communicator_mhc.py` 从早于 PR #24785 的 `communicator.py` 快照改编、未回映上游修复——两个 override 缺 `should_use_dp_reduce_scatterv()` 分支，构成**顺序依赖缺陷对**：(1) SUM_LEN 轮 MoE partial 永不 combine，每 token 只带 owning DP rank 的 1/4 routed experts（EP4）→ "A: A: A:" 重复坍缩；(2) 只修 (1) 则 `mlp_reduce_scatter=False` 使 dense MLP（GLM 0–2 层）被 all-reduce + scatter 双重归约、输出精确 ×4——流畅输出但 tool-call schema 49/63 vs TP 基线 372/372） · Cov: `NEW` · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 'MHC communicator 是从 base 快照衍生的镜像文件，base 在 PR #24785（2026-05-10 修复 SUM_LEN 的 reduce_scatterv producer 契约）后演进、镜像未回映。(1) `MHCCommunicateSummableTensorPairFn._scatter_hidden_states` 缺 combine；(2) `MHCLayerCommunicator.should_use_reduce_scatter` 仍发布 False。两修齐用恢复与 plain TP 精确对等。触发门：`moe_a2a_backend==none ∧ dp-attention ∧ attn_dp_size>1 ∧ tp_size==attn_dp_size ∧ moe_ep_size==attn_dp_size`；损害限于 SUM_LEN 轮。报告者实际经历了"只移植 (1) 修复"引入更隐蔽回归的过程。'
  source: 'SGLang #36879（2026-08-28 closed，PR #36507 head `aa8c950a3d` 复现，含 tau2-airline schema 对照表）。https://github.com/sgl-project/sglang/issues/36879'
  behavior: '**无 crash、两种输出都流畅**——(1) 重复坍缩/回声/自信错答（逐 DP rank 严重度不同）；(2) ×4 缩放的静默语义损坏，单 prompt 冒烟通过。属「**镜像文件快照漂移的顺序依赖缺陷对**」新子签名：第二个缺陷只在第一个修复后可达，部分移植比不移植更危险（quiet regression）；与 5.7（communicator map 损坏）同 communicator 域。'
  trigger_surface: SGLang + GLM-5.3-Flash/MHC 模型 + `--enable-dp-attention` + EP=DP=TP（config 组合即触发）
  discovery: 2026-08-29 每日扫描。
