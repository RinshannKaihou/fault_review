original:
  mechanism: 'vllm-ascend PR #19288（修复单含完整根因+硬件复现）。设 eplb_config.expert_map_record_path 时：(1) EplbUpdator.forward_before 在 update_expert_weight_flag() 为真时生成 D2D 任务并调 asyn_expert_weight_transfer，不检查 record path——loader 进入 TRANSFERRING；(2) forward_end 在 record path 设置时跳过 update_expert_map_and_weight；(3) 该函数是唯一等待 P2P 请求并把 loader 拉回 WAITING 的代码——loader 终身停在 TRANSFERRING，首轮 isend/irecv 永不被等待，后续每轮日志 Current D2D weight update is on-going, cannot accept new update task 并直接返回；(4) EplbWorker.do_update 每次 EPLB 计划后无论是否被应用都置 old_expert_maps=new_expert_maps 并写 shared_dict["expert_maps"]——第二轮起按从未实际执行的布局规划。修复：forward_before record 模式弹队列但提前返回不生成迁移；EplbWorker 增 record_only（经 EplbProcess 从 expert_map_record_path 传入），recording 时仍发布计划供导出但以已安装布局为下轮基准。测试：TestEplbUpdatorRecordMode/TestEplbWorkerRecordOnly 三回归用例修复前失败、修复后过；tests/ut/eplb 24 passed（此前 19）。硬件复现：DeepSeek-V2-Lite-Chat、4×Ascend 910B3、policy 2、采集间隔 50——带 record path 每 server 第二轮起 on-going 日志、无任何权重更新轮完成；一次运行 84 计划 0 应用；无 record path 正常。'
  source: 2026-10-20 每日扫描；https://github.com/vllm-project/vllm-ascend/pull/19288
  behavior: 在 vllm-ascend 上配置 EPLB expert_map_record_path 开 recording 模式后，服务表面正常运行，但专家负载记录与规划从第一轮之后就全部失效：首轮权重迁移发起后再无人等待完成，后续所有更新请求被 on-going 日志拒绝，一次运行可累计 84 个计划而实际执行 0 个；记录导出的专家分布图基于从未落地的布局，用它决策后续动态迁移会错。
  trigger_surface: vllm-ascend + EPLB + expert_map_record_path（recording 模式）
