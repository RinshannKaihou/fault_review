original:
  mechanism: hcomm MR !6144（修复单含完整根因+板端日志）。AllGather AIV RDMA 路径（CollAllGatherAivRdmaExecutor → aiv_all_gather_910b_rdma）机内重排阶段按 (i*rankSize_+blockIdx_)*len 计算写 output 偏移，公式隐含 userRankSize==serverNum*localRankSize 的两级分解假设。PD 分离等部署下 level1 子通信域成员数（serverNum）可能大于 op 通信域实际跨 server 数：userRankSize=8、localRankSize=8、level1ServerNum=4 时 kernel 中 i=0 写 output[0-7] 正确，i=1..3 继续写 output[8..31] 而 AllGather 输出缓冲仅 userRankSize*len（8*len），越界写触发 MTE invalid GM address。修复（kernel 参数表无 userRankSize 无法内核自证边界，落在 host executor）：kernelServerNum=min(userRankSize/localRankSize, level1 子通信域成员数)，一致拓扑折算值与原值相同；清理死代码 sendSize、补 serverNum 对账日志。板端复现：userRankSize=8/localRankSize=8/level1ServerNum=4/单卡 61440B，原代码 i=1..3 越界写至 output[8..31]（超 480KB 缓冲约 1.4MB）。待上板回归。
  source: 2026-10-20 每日扫描；https://gitcode.com/cann/hcomm/merge_requests/6144 ；同题 closed https://gitcode.com/cann/hcomm/merge_requests/6142 ；兜底 https://gitcode.com/cann/hcomm/merge_requests/6146
  behavior: PD 分离等多 server 部署下走 AllGather AIV RDMA 路径时，若 level1 通信域成员数超过实际跨 server 数，kernel 会按错误公式往输出缓冲之外写最多数 MB 的数据：设备报 MTE invalid GM address 异常，同批通信结果不可信；一致拓扑（rank 数恰为 server×local）不受影响。
  trigger_surface: 910B + AllGather AIV RDMA + PD 分离/level1 成员数超配拓扑
  discovery: 2026-10-20 每日扫描
