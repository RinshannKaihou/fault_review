  meta: '`infra_off`（DFLASH/DSPARK draft KV 池的预留按原始 `tp_size` 计算，而 draft 池实际按 `attn_tp_size` 分片——DP attention 下两者差 `attn_dp_size` 倍，预留少计至该倍数；target KV 池已吃掉几乎全部 `--mem-fraction-static` 预算时 draft worker 随后分配自己的 KV 池即 OOM） · Cov: `var:vllm_hidden_states_kv_budget_overestimate_startup_reject`（6.136 预算记账域） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: '预留公式与分配分片度的并行度维度错配（tp vs attn_tp）。Kimi-K3 PD 部署解码节点 `--tp-size 16 --dp-size 16 --enable-dp-attention` + DSPARK draft：`_build_mha_kv_pool` 处 `torch.OutOfMemoryError: Tried to allocate 3.50 GiB`（GPU 267.69 GiB、free 1.46 GiB），rank1 4.33 GiB 分配失败。修复 PR #38203 按 `attn_tp_size` 计预算。'
  source: 'SGLang #38202（2026-09-06 open，PD decode 节点完整启动配置与分配失败栈）；修复 PR #38203。https://github.com/sgl-project/sglang/issues/38202'
  behavior: 启动期 OOM crash（fail-loud，但报错在 draft worker 池分配、根因是预留记账维度错——预算看似合理仍爆）。6.136（hidden-states KV budget 高估启动拒绝）之后预算记账域新成员：本条是 **draft/target 两级预算的并行度维度不一致**，DP attention 放大。
