original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.is_real`/`is_imag` 的 golden 函数调用不存在的 `torch.is_imag`/`torch.is_real`（正确拼写 `torch.isreal`，且无逐元素 isimag）——任何 golden 对照在比较前就 AttributeError，两 op **从未被验证过**；配套 sweep 还用错谓词（is_imag 的参考用了测虚部的 `torch.isreal`）且输入分布恒非零使谓词恒 false——all-false vs all-false 恒过，从不 exercise 任何东西） · Cov: `var:ttmetal_kv_cache_pcc_gate_parametrize_unreachable_never_ran`（1.135 测试从不运族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 三层验证失效叠加：golden API 拼写错（从不执行）、sweep 参考谓词错（is_imag 测了虚部而 ttnn 测实部——混合输入上一半元素分歧）、sweep 输入分布错（两列都从非零区间采样，谓词永假）。修复后 golden vs device 0/1024 错——**op 本身是对的，坏的只是验证**。
  source: 'tt-metal PR #55577（2026-09-06，含三层失效逐项分析与修复后 MATCH 输出）。https://github.com/tenstorrent/tt-metal/pull/55577'
  behavior: '无运行期故障——危害在**验证真空**：两 op 的任何未来回归都不会被 golden/sweep 发现（对照通道自身坏死）。1.135（parametrize 不可达从未运行）之后测试有效性域第二例，本条更极端：参考实现调用不存在的 API，说明 golden 从未在任何 CI 上跑通过也无人注意。「验证层自身失效」对依赖 sweep 结果的审计（如 1.179 的 #25529）是上游风险。'
  trigger_surface: tt-metal 测试基础设施 + is_real/is_imag sweep（hw_specific；CI 触发）
  discovery: 2026-09-06 每日扫描。
