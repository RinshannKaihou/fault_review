original:
  mechanism: 现象与二分：固定 batch、固定输入 shape 的 PYNATIVE_MODE 训练在 GPU 上单步耗时随已执行步数单调增长，1800 步内 3.3~4.6 倍（多次 run 区间 1.5~5.1），主机 RSS 仅 +1~2%、GPU 显存零增长，因此不是内存泄漏；回归边界为 2.7.2→2.8.0，2.9.0/2.10.0 未修；同一模型的 GRAPH_MODE（nn.TrainOneStepCell）在 2.6~2.10 全程平稳且单步比 pynative 起始值还快一倍以上（13~19 ms vs 30~43 ms）。退化只与累计步数相关，与是否每步新建 Tensor、是否用官方 dataset/sink 管道无关。模块消融（probe_module.py，单变量、三次重复）：完整网络每 1500 步增加 +90~94 ms，去掉 3 个 SE 块后只 +8.6~9.0 ms（相差约 10 倍）；单独去掉 BatchNorm2d 或 Dropout 无明显改善；SE 内部写法（x.shape+reshape / AdaptiveAvgPool2d / s[:,:,None,None] / mean）都不改变退化幅度，说明与 SE 带来的算子与权重张量数量相关，而非形状推导或池化算子本身。2conv 单分支 CNN 3600 步退化 0%（4.6→4.7 ms），toy 结构也只在 0~24%，所以单分支标准模型与短时冒烟测试都抓不到。复现脚本自包含（numpy+mindspore），STEPS/BLOCK 可调，每 300 步打印 ms/step 并采样 RSS 与显存。
  source: '2026 GitCode mindspore/mindspore issue #29687 https://gitcode.com/mindspore/mindspore/issues/29687（open；MindSpore 2.6.0.dev/2.7.2/2.8.0/2.9.0/2.10.0 对照，GPU 后端）'
  behavior: 用 GPU 跑动态图训练时，训练越跑越慢：前期每步 30~40 ms，跑到一两千步变成 120~180 ms，而显存和内存都没涨，机器也没换；换成图模式同一模型反而又快又稳，精度两边一致，只有速度变差。小模型、单分支网络基本看不出来，带多个 SE/门控块的双分支网络最明显。
  trigger_surface: GPU 后端 + PYNATIVE_MODE + 多分支/多 SE 结构的卷积网络；步数上千才显形
