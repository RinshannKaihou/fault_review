    component: PyNative 逐步执行路径
  behavior: 2.8.0 起 GPU PyNative 下固定 batch/shape 的单步耗时随累计步数单调上升，主机 RSS 仅 +1%、显存零增长，排除内存泄漏；GRAPH_MODE 全版本平稳
effect:
  objects:
  - 性能/资源
  detail: GPU+PYNATIVE_MODE 多分支/多SE卷积网络，步数上千才显形：前期每步30~40ms，一两千步后升至120~180ms（1800步内3.3~4.6倍，多次run 1.5~5.1）；完整网络每1500步+90~94ms，去掉3个SE块仅+8.6~9.0ms；精度两边一致。
  visibility: 性能退化
mitigation:
  detect: 画「每步耗时 vs 累计步数」曲线（平均吞吐会把单调增长摊平），同配置跑 GRAPH_MODE 作对照，并与 2.7.2 对比确认 2.8.0 回归
  fix: 未修复（2.9.0 / 2.10.0 仍复现）；规避：改用 GRAPH_MODE（需固定输入 shape、补齐末批）或停留在 2.7.2
