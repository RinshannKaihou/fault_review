  detail: arch35 内核：var 6288948 行、M 5375 万时连跑三次分别错 4/2/13 行，错误值双向、同一执行内多行写成同一值；M<500 万常规泛化集发现不了；ScatterMax/Min/Mul/Div 共用该内核。
  visibility: 不可复现
mitigation:
  detect: 用 M 大于 500 万的 indices 反复跑同一用例（≥3 次）比对输出；M 在百万级的常规用例无法暴露该竞态。
  fix: issue 5687 closed（跟踪 9.2.0 分支同步 master 修复，未给 MR 号）；另附 foreach_div_list_inplace 未开 0 ULP Div 档（3126 万元素中 8.29% 偏 1 ulp）与 23 个算子 golden 六类缺陷。
