    component: scatter_reduce 排序同步
  behavior: SortLocalRuns() 循环尾只发 MTE3→MTE2，未约束下一轮 V/S 对同一对 UB 的写；DataCopyPad 未读完缓冲即被 Sort/Adds/补哨兵覆写，落盘排序键与索引被污染。
