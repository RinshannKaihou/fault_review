original:
  mechanism: 'SGLang #45000（c2026-10-18，RTX 3090，0.5.22，probec 探针 twin Qwen3-0.6B 28 层：128×128 block-FP8 权重以 2 的幂 block scale 可被 FP8 精确表示、每 token 输出已知）。FP8 Marlin（weight-only，SM86 无 FP8 tensor core）多数 run 1-5 请求错 token（首 token 或后续 decode 步起）。对照：bf16 源 checkpoint 精确；vLLM 0.31.0 同 checkpoint 走其 FP8 Marlin 0/0/0；GEMM 隔离（tools/marlin_determinism）精确。矩阵：默认 5/7 run 有错（0-5 请求/run）；--disable-overlap-schedule 0/5 精确；--attention-backend triton 1/1 有错；--disable-radix-cache 1/5；--disable-cuda-graph 1/3。探针失败模式：每层在 KV cache 里查一个 token，失败请求输出切换为查找落空时探针发的 token（所有失败请求同一 token）——某层某 token 的 q/k/v 或 attention 读坏了；共享前缀同批请求同 step 同 token 失败。'
  source: 2026-10-18 GitHub sgl-project/sglang issue https://github.com/sgl-project/sglang/issues/45000 （open）
  behavior: 在 RTX 3090 上用 SGLang 0.5.22 跑 128×128 block-FP8 模型（FP8 Marlin weight-only 路径）时，多数运行有 1-5 个请求的生成出错（有的从第一个 token 就错，有的从中间某步开始），重跑错的请求不同、偶尔整轮干净。关闭 overlap scheduler 后同样负载 5 次全部精确；同 checkpoint 用 vLLM 或 bf16 版本也全部精确。
  trigger_surface: SGLang 0.5.22 FP8 Marlin weight-only；block-FP8 checkpoint；SM86；默认管线（overlap scheduler 最强关联）
