original:
  mechanism: torch_npu 的 triton_experimental 后端在 Inductor codegen 阶段执行 _apply_linearize：为修正归约维槽位变化，按文本匹配 `, {old_reduction_dim})` 替换成 real_reduction_dim，匹配条件只要求行内出现 triton_helpers. 子串。npu_triton_helpers.lt/gt/eq 等比较算子名同样含该子串，因此 `tmp21 = npu_triton_helpers.lt(tmp18, 0)` 这种间接索引的负下标回绕判据被改成 `lt(tmp18, 1)`（3 轴时 2）。复现环境 Ascend 950DT、torch 2.15.0+cpu、torch_npu 2.15.0+git7abfe3c、triton 3.6.0，恢复 aten.fractional_max_pool2d 原生 lowering 后编译：linearize=True 时 values maxdiff 16.0/32.0 且 indices 不一致，linearize=False 时 maxdiff 0、indices 全等，应用本修复后 maxdiff 0。错误形态为输出第 0 行整行越界读返回 0，其余格子正确。任何在归约上下文使用 npu_triton_helpers 比较算子的 kernel 都可能被污染，不报错只错值。
  source: https://gitcode.com/Ascend/pytorch/issues/6112 ｜修复 PR https://gitcode.com/Ascend/pytorch/merge_requests/49690 ｜关联 https://gitcode.com/Ascend/pytorch/issues/6106
  behavior: 在 triton_experimental 后端编译带间接索引/比较的算子时，生成代码里的 `npu_triton_helpers.lt(idx, 0)` 被改写成 `lt(idx, 1)` 或 `lt(idx, 2)`，合法下标 0 被当成负下标加上整个维度大小后越界读：输出某些行整行变成 0 或错行，其余格子看起来正常，编译和运行都不报错。fractional_max_pool2d 在 950DT 上 values 最大绝对偏差 16~32、indices 与 eager 不一致；关掉 codegen_linearize 或应用修复后偏差为 0，因此只有逐元素对拍才能发现。
  trigger_surface: torch_npu triton_experimental 后端（TORCHINDUCTOR_NPU_BACKEND=triton_experimental）默认开启 codegen_linearize；kernel 在归约上下文调用 npu_triton_helpers.lt/gt/eq/le/ge/ne 做间接索引或 mask 比较；Ascend 950DT + torch 2.15/torch_npu 2.15 + triton 3.6.0。
  discovery: 2026-11-14 每日扫描
