cause:
  objects:
  - subsystem: 编译器
    stack: torch_npu
    component: TE linearize pass
  behavior: _apply_linearize 用文本替换改归约维槽位；npu_triton_helpers.lt(x, 0) 的常量 0 也命中 ', 0)' 被替换成 real_reduction_dim，负下标回绕判据失效。
effect:
  objects:
  - 数值结果
  detail: 合法下标 0 被判为负、加上整个维度后越界读；950DT 上 fractional_max_pool2d values maxdiff 16/32、indices 不一致，两段无报错；关 linearize 后 maxdiff 0。
  visibility: 静默错误
mitigation:
  detect: 对同一 lowering 分别在 codegen_linearize=True/False 下编译，逐元素对比生成的 tmp = npu_triton_helpers.lt(..., 0) 是否被改写。
  fix: 'PR #49690（open，2026-11-14 未合入，未核实发布）：在文本改写处排除 npu_triton_helpers.lt/gt/eq/le/ge/ne。'
