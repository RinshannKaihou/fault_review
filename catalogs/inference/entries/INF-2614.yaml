id: INF-2614
legacy_ids: []
slug: flashinfer_merge_state_dtype_unchecked
aliases: []
title: FlashInfer merge_state 不校验 dtype
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: flashinfer
    component: cascade merge_state
  behavior: 只校验 shape/device，不校验 dtype：s 非 fp32 时新 LSE 写进临时副本，v dtype 不一致时按 v_a 重解释位型，mask 不是 bool/uint8 时按字节读。
effect:
  objects:
  - 数值结果
  - 输出分布
  detail: 3 路链式合并偏差最大 3.9；fp16+bf16 v 偏差 1.4–1.9，bf16+fp16 约 400，fp16+fp32 出 NaN；int32 mask [1,1,0,1] 只合并第 0 行；全部无报错。
  visibility: 静默错误
mitigation:
  detect: 对 merge_state_in_place 传 fp16/bf16/fp64 的 s 后回读调用方 s 是否被更新；对 v_a/v_b 混 dtype、mask 用 int32 的用例与 fp32/bool 基线比对。
  fix: 待定（issue open，建议在 cascade 入口显式校验 s/v/mask 的 dtype 并拒绝）
