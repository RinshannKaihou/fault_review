  meta: '`infra_off`（W8A8FP8 create_weights 不初始化 ParallelLMHead partition 元数据 → 加载 crash） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
  mechanism: '`CompressedTensorsW8A8Fp8.create_weights` 未初始化 `ParallelLMHead` 权重加载所消费的 partition-size 元数据（`output_size_per_partition` 等属性），加载时抛 `AttributeError: ''ParallelLMHead'' object has no attribute ''output_size_per_partition''`。修复（PR #52451）在 create_weights 中初始化两个 partition-size 属性并加回归测试。'
  source: 'vLLM #52434（2026-08-15 open）/ 修复 PR #52451（open）。torch 2.13.0+cu132，aarch64。https://github.com/vllm-project/vllm/issues/52434'
  behavior: 加载期 **crash**（AttributeError），fail-fast。属「量化方法类未实现基类 partition 协议」**新子签名**——量化与并行走查（TP LM-head）的接口缺口。
  trigger_surface: vLLM；compressed-tensors W8A8-FP8 checkpoint + ParallelLMHead（TP 加载路径）
  discovery: '2026-08-15 每日扫描。（2026-08-16 补充来源：vLLM PR #52543 —— `ParallelLMHead` 是唯一不从 `LinearBase` 派生的可量化投影，缺 `output_size_per_partition` 等几何属性，compressed-tensors 量化 `lm_head` 加载即 `AttributeError`；PR #52543 把 LinearBase 几何暴露到 ParallelLMHead 使 lm_head 可量化。与 12.18 同一接口缺口、另一修复方向。https://github.com/vllm-project/vllm/pull/52543 ）'
