id: INF-1988
legacy_ids: []
slug: vllm_ascend_metrics_negative_counter_hang
aliases: []
title: 指标负增量致 prometheus 抛错挂死
kind: 故障
status: active
cause:
  objects:
  - subsystem: 观测/评测
    stack: vllm
    component: prompt token 来源计数
  behavior: 开 index cache 后前缀复用 token 可能大于本轮新 prompt token，增量算成负值，counter 的 inc(增量) 收到负值触发 prometheus 客户端校验异常，之后 counter 不再增长、服务不再回包
effect:
  objects:
  - 可用性/进度
  - 指标/日志
  detail: v0.18.0 + GLM5.1-w4a8 A3 PD 1P1D 现网压测约 10 分钟后请求不再返回；async_llm 的 record() 抛异常，指标停更但进程不退出
  visibility: 挂起
mitigation:
  detect: 监控 counter_prompt_tokens_by_source 的增量是否出现负值；对 metrics record() 包异常计数并在请求回调链路加超时告警
  fix: 待定（issue closed，正文未给修复 PR 编号）
