original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off` · Cov: `NEW` · 触发 `yes` · 置信度 `verified`'
  mechanism: 在 EOS token 相关参数上翻 3–30 个 bit —— 具体是 EOS token 的 embedding 行以及与之 tied 的 lm_head 行 —— bit 位置由 ADMM 求解选出，目标是最小化 P(`<EOS>`)。少至 3 个 bit 就能让 ~100% 的 prompt 一直生成到 max output length。
  source: Yao et al., "BitHydra", arXiv:2505.16670 。
  behavior: 输出永不终止：几乎对任何 prompt 都会一路 babble 到 max tokens；且语义常常仍然连贯，看上去只是"话特别多"。
  trigger_surface: 随机权重 bitflip 扫描
  signature: 中间层隐状态基本 ON-manifold（只动了与 EOS 有关的参数），所以只看中层隐藏态的监控器会 MISS 掉它 —— 签名位于最终 logit 层的 EOS-logit 时间序列与生成长度上。可由作用在 EOS-logit 轨迹上的 statistical 度量捕获，mid-layer geometric 度量不行。这是本项目"隐藏态检测器"路线的一个 IMPORTANT NEGATIVE RESULT：存在真实、可复现、危害明确、却结构性地不在隐藏态里的故障。
  repro: yes。直接对 `embed_tokens` 的 EOS 行以及 lm_head 对应行（tied 时是同一张量）翻几个 bit 即可，属于纯权重变换，无需 forward hook；开销可忽略，观测量取生成长度 + 每步 EOS logit。
