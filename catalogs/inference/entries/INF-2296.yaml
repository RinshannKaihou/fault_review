title: aclnnRemainder fp32 负除数乘积溢出返 -inf/0
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: remainder 中间乘积 fp32 溢出
  behavior: out = self − floor(self/other)*other 的中间乘积在 fp32 域计算：负除数使 floor 商绝对值变大，乘积越过 3.4e38 溢出，self−(±inf) 得 ∓inf 或经舍入得 0.0。
effect:
  objects:
  - 数值结果
  detail: fp32、|self|≈3.4e38 且 other<0 时无报错：remainder(3.4e38,-1.2e38)=-inf（真值约 -2e37），remainder(3.0e38,-1.0e38)=0.0（真值约 -1e37）；35 组扫描 19 组命中，正除数与 fp64 全对。
  visibility: 数值异常
