id: INF-1714
legacy_ids: []
slug: fa_mla_skip_batch_softmax_slot_collision
aliases: []
title: FA MLA 被 skip 空 batch 占用 softmax 槽位
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: cann
    component: FA MLA arch35 槽位管理
  behavior: multiCoreInnerIdx在skip前自增，空batch也占3槽环形缓冲；PRELOAD_N=1时前一非空batch末s2的bmm2延到后一非空batch，中间skip次数%3==0则vec1覆写vec2未读的softmax状态
effect:
  objects:
  - 数值结果
  detail: arch35 MLA noquant多batch推理中夹一个空batch（KV长度为0或mask窗口无有效KV，s2LoopEndIdx<=0被skip）且位于核分配序列中间、累计skip次数%3==0时，attention_out逐元素偏差而同调用LSE正常；PRELOAD_N改0结果对得上。
  visibility: 静默错误
mitigation:
  detect: 构造 KV 长度为 0 的空 batch 并置于核分配序列中间，比较 PRELOAD_N=1 与 PRELOAD_N=0 的 attention_out
  fix: 'PR #8319（master）/#8320（9.1.0）：把 multiCoreInnerIdx++ 从 ComputeAxisIdxByBnAndGs1 移到 skip 检查之后'
