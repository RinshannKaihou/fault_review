original:
  mechanism: cann/ops-nn issue 4520（2026-08-03，closed）：Ascend910B3 + CANN 9.1.0-beta.3、ops-nn HEAD e16ef626bb3a，算子 quant/fake_quant_affine_cachemask 的 910B 非 regbase 路径。op_host tiling 先按 32B 上对齐得到 totalLengthAligned，kernel 的全 tile 循环统一用 CopyOut(..., tileLength)；当 totalLengthAligned 恰好整除 tileLength 时最后一块仍按 tileLength 写出，越过本通道 calcLength，落到下一通道或张量尾后 pad。作者用 build.sh 编包装进独立 vendor 后跑 aclnnFakeQuantPerChannelAffineCachemask，out[0]=7.0 符合预期，但尾后 canary 由 123456 变 0.0、mask 由 0xAB 变 0，进程退出码 42（BUG_REPRODUCED）。
  source: 2026-08-03 GitCode cann/ops-nn issue https://gitcode.com/cann/ops-nn/issues/4520 （closed）
  behavior: 做 w8a8 伪量化校准或逐通道仿射量化时，输出张量与 mask 的尾部几个元素被写成 0，多通道输入下上一通道会覆盖下一通道开头；单点比对和常规精度跑都看不出来，接口返回 SUCCESS 无告警，被污染的尾部随量化参数、mask 判定继续往下游传。
  trigger_surface: aclnnFakeQuantPerChannelAffineCachemask + 910B 非 regbase + numel 32B 对齐且整除 tileLength
  discovery: 2026-10-21 系统扫描 sweep_5（顺序深读）
