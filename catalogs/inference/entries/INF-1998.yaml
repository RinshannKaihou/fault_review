title: fake_quant 对齐 CopyOut 写穿通道边界
kind: 故障
status: active
cause:
  objects:
  - subsystem: 量化
    stack: cann
    component: fake_quant 对齐 CopyOut
  behavior: tiling 把 calcLength 按 32B 上对齐成 totalLengthAligned；整除 tileLength 时整 tile 按 tileLength 做 CopyOut，越过本通道 calcLength 写后续内存
effect:
  objects:
  - 数值结果
  detail: 910B3 + CANN 9.1.0-beta.3：out[0]=7.0 正确，但尾后 canary 由 123456 变 0.0、mask 由 0xAB 变 0；多通道时污染下一通道，接口仍返回 SUCCESS
  visibility: 静默错误
mitigation:
  detect: 输出与 mask 尾部预填 canary（123456 / 0xAB），numel 取 32B 对齐且整除 tileLength 的长度跑 aclnnFakeQuantPerChannelAffineCachemask
  fix: 待定（issue closed，未见 MR）：CopyOut 长度按 min(tileLength, calcLength-offset) 裁剪，多通道按通道边界分别封口
