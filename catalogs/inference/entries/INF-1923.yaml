original:
  mechanism: 'PYNATIVE_MODE deepseek_v3 训练，tensor_parallel=4 + context_parallel=2（context_parallel_method: ulysses）+ Muon qk_clip_enabled=True 时，训练在第 1 步结束后死锁：部分卡 AICore 持续 100%、其余空转，不再前进也不报错。8 卡 num_attention_heads=8 下第 1 步打印完 loss 与 max_attention_logit 后停止；各 rank 的 max-logit dump 行数为 rank0/1 各 4 行、rank2~7 为 0 行。根因在 FlashAttention._update_max_logits：softmax_val 是 CP mesh 上 head 维被 ulysses 切分的 DTensor，max_logits_val 是 TP mesh 上 Shard(0) 的参数，两者不在同一 mesh；_local_head_slice(softmax_val) 实测返回的已经是 TP 局部坐标（get_global_shape 给出的 head 数等于 TP 局部 head 数），代码却当作全局 head 坐标再减 max_logits_val 的全局 TP 基址。rank0 基址 0 → (0,1) 正确；rank1 基址 2 → (-2,-1) 负索引回绕到 0 碰巧正确；rank2/3 基址 4/6 → 越界空切片，本卡 head 全丢，max_logits_val 恒为全 0。随后 GPTModel.get_max_attention_logit() 用 `if mint.sum(mint.abs(local_param)) <= 0: continue` 按本地分片是否全 0 跳过该层，这个筛选在 rank 间不一致，而调用方 MaxLogitsMonitor._dump / TrainingStateMonitor._dump_max_attention_logit 会对入选项调用 param.full_tensor()（集合通信），部分 rank 跳过、部分进入 → 参与方不匹配 → 死锁。环境：Atlas 800T A2（910B2）×8、CANN 9.1.0、MindSpore 2.10.0、mindformers master 含 !8448。'
  source: '2026-09-01 GitCode mindspore/mindformers issue #2571 https://gitcode.com/mindspore/mindformers/issues/2571（closed）'
  behavior: 开 CP + tp4 + Muon qk_clip 训练时，第一个 step 正常打出 loss 和一行 max_attention_logit，然后整机就停在那里：有的卡 AICore 打满、有的卡空转，日志既没有报错也不再更新，只能人工 kill。换成 tp2 或关掉 qk_clip 就完全正常，所以最初会以为是 CP 通信或集群问题；实际是部分 rank 的 max_logits 被算成全 0 后跳过 dump，剩下 rank 在 full_tensor() 集合通信里等不到对端。
  trigger_surface: PYNATIVE + Muon qk_clip + tensor_parallel>=4 + ulysses/hybrid 头维切分 CP
  discovery: 2026-10-21 GitCode 历史 issue 回填（mindspore/ms* 簇第二池）
  notes:
  - 2026-10-21 opus-5.5 复核重写（负索引回绕是tp4 rank1现象，tp2下完全正常，且无现有用例全过）
