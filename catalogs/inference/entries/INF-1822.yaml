id: INF-1822
legacy_ids: []
slug: vllm_ascend_gdn_recompute_w_u_unwritten_outputs
aliases: []
title: GDN recompute_w_u 首启漏写输出致首个请求全 NaN
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: vllm
    component: recompute_w_u 内核
  behavior: wy_fast.py 的 recompute_w_u_fwd_kernel 在进程首次真实 prefill 时漏写 u/w 输出的部分元素；输出由 empty_like 分配，残留未初始化内存。
effect:
  objects:
  - 数值结果
  - 输出内容
  detail: 引擎启动后第一次推理 logits 全 NaN，greedy 退化成 token id 0（连续 '!'）；之后每个请求都正常，表现为像 warmup 的假象。单个 NaN 元素即可经 fwd_h→fwd_o→out_proj 污染整个隐状态。
  visibility: 数值异常
mitigation:
  detect: 对 GDN chunk 流水线做分阶段 NaN/Inf 探针；比对首次 prefill 与后续请求的输出。
  fix: 已合入的修复只是把 u/w 输出改为零初始化（仅掩盖后果）；漏写本身的根因仍待查（triton-ascend codegen / 启动同步）。
