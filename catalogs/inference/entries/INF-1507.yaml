original:
  mechanism: initcheck 判定“某地址没被写过”依赖对搬运指令写入范围与 padding 段的建模。#213 给出机制层面现象：LOAD_L1_2D 指令加载 padding 地址段时误报未初始化告警——padding 段本就不会被真实数据写入，工具仍对其做未初始化检查。#209 是与之对应的能力需求：让初始化检测支持识别搬运类指令的 padding 数据段，侧面证实该段当时不在识别范围内。其余为同类现象在具体算子上的表现：#55 catlass 09_splitk_matmul（Ubuntu 22.04.5，bash scripts/build.sh 09_splitk_matmul --enable_mssanitizer 后 mssanitizer -t initcheck 256 512 1024 0）报未初始化；#156 cann-samples kv_rms_norm_rope_cache_story 报未初始化；#189 CATLASS 49_ascend950_flash_attention_infer 报未初始化；#204 CATLASS 53_ascend950_fp8_mx_matmul 在 -DCATLASS_ARCH=3510 编译、加 --block-id=1 使能单核后报未初始化。四条 issue 的预期结果均为“没有未初始化”。
  source: 2026-03-17 GitCode Ascend/mssanitizer issue https://gitcode.com/Ascend/mssanitizer/issues/55（closed）；2026-07-17 issue https://gitcode.com/Ascend/mssanitizer/issues/156（closed）；2026-08-19 issue https://gitcode.com/Ascend/mssanitizer/issues/189（closed）；2026-08-30 issue https://gitcode.com/Ascend/mssanitizer/issues/204（closed）；2026-09-07 issue https://gitcode.com/Ascend/mssanitizer/issues/209（closed）；2026-09-16 issue https://gitcode.com/Ascend/mssanitizer/issues/213（closed）
  behavior: 对已经正确初始化、结果也正确的算子跑 mssanitizer -t initcheck，会报出对某段 UB/L1 的未初始化读写，而那段地址正好是搬运指令的 padding 区（或单核执行时不会走到的那部分）。把 --block-id 去掉或换 memcheck 交叉验证时结论会变，说明告警来自工具对数据段范围的假设，而不是算子真的读了没写的内存。对 kv_rms_norm_rope_cache 这类带 padding 的算子，团队会反复花时间排除假告警。
  trigger_surface: Ascend 950/910 + mssanitizer initcheck；LOAD_L1_2D 等搬运指令带 padding 段的算子、catlass/cann-samples 模板算子；--block-id 单核执行
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
