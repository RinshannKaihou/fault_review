title: npu_moe_token_unpermute_grad dtype 推导异常
kind: 故障
status: active
cause:
  objects:
  - subsystem: MoE路由
    stack: pytorch
    component: unpermute_grad dtype 推导
  behavior: grad_probs 的 dtype 推导依赖 grad_unpermuted_tokens 而非 probs；probs=fp32 与 grad_unpermuted_tokens=bf16 时 grad_probs 被推成 bf16。
effect:
  objects:
  - 梯度
  detail: 混合精度反向中 probs=fp32 且 grad_unpermuted_tokens=bf16 时，grad_probs 被推成 bf16，与 probs 不一致，降低梯度精度；后续与 fp32 参数/优化器状态结合可能产生 nan，严重时训练异常。dtype 一致不触发。
  visibility: 静默错误
mitigation:
  detect: 混合精度（probs=fp32、grad_unpermuted_tokens=bf16）下比对 grad_probs.dtype 与 probs.dtype，并检查是否出现 nan
  fix: 待定（issue closed，修复 PR 未在正文给出，合入与发布状态未核实）；方向：grad_probs 的 dtype 按 probs 推导
