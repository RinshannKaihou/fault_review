original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off` · Cov: `NEW`（`weight_bitflip` 的 nan/inf 结果类，独立 fault_id，无独立复现路径） · 触发 `yes` · 置信度 `documented`'
  mechanism: 不是一种独立的注入机制，而是 3.19 的**结果分类**：当指数位翻转（典型是 `exp_high = bit 30`）把权重推成 nan/inf 时，该样本**保留**（不丢弃、不 clamp）并以自己的类别上报。
  source: 本项目早期实测条目（原型阶段实测，量值不跨栈继承；触发/复现已按 vLLM/CUDA 重估）。
  behavior: 一旦 nan/inf 进入残差流，整条前向被污染，logits 全为 nan，解码输出为空/垃圾；`behavioral_harm` 对此有专门保护（`ppl_delta` 在非有限时置为 `float("inf")`）。
  trigger_surface: 3.19 的 exp_high→nan/inf 结果类；CUDA 可稳定打出
  signature: 名义上是最"极端"的 `infra_off`，但对检测器而言反而是**平凡情形**：cheap 族的 `nan_inf_flag` 一票命中且成本近零。真正的意义在于它**破坏其余度量族**——geometric/spectral/statistical 的数值在含 nan 的隐状态上全部退化为 nan，因此监控管线必须先按 nan_inf 分流再计算其它族，否则会污染整体统计。它是"cheap 族严格优于所有昂贵族"的极点，正好构成噪声底阳性对照（折入图例）那类"cheap 族无用"的对照极点。
  repro: 无需新代码——用 3.19 的 `exp_high` 位类别在幅度足够的权重位置翻转即可产生；标记为 `partial` 的原因是它依赖翻转结果是否真的溢出（fp32 下 `bit 30` 翻转是否出 inf 取决于原值指数），并且当前仓库把重标签留给调用方，没有实验配置真正走过这条分支。
  相关条目: '**4.4 `fp16_overflow_ceiling`** 的 Coverage 明确写 "related to `weight_bitflip_naninf`"（但其主挂靠是 `var:1.213`）。'
