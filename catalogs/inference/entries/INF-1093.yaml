  meta: '`infra_off`（TRT-LLM（1.3.0rc26.dev，main 同路径）**EAGLE3 dynamic-tree 推测解码**可产出**请求 grammar 之外的 token 前缀**：grammar `aa(bc|de)f`、max_tokens=4 下线性模式仅产出合法前缀 `aabc`/`aade`，tree 模式（depth 2、top-K 32）产出非法前缀——dynamic-tree 的 flat-mask 路径未把 grammar 约束传播到树状 draft 的全部分支；feature matrix 声称支持 guided decoding × dynamic spec 组合；单层 Llama/EAGLE3 dummy 权重 + 32-token 字符词表即可复现，与权重无关） · Cov: `NEW` · 触发 `other_stack` · 置信度 `verified`'
  mechanism: dynamic-tree 解码为每分支维护 flat attention/draft mask；grammar bitmask 只施加在主路径（线性 mask 语义）而树状分支的扩展 token 未经过滤即被提交——约束解码状态机与树状 draft 扩展的交集计算缺失。
  source: 'TRT-LLM #18892（2026-09-08 open，Speculative Decoding label，含公开复现脚本 guided_tree_worker.py、feature matrix 引用与期望/实际对照）。https://github.com/NVIDIA/TensorRT-LLM/issues/18892'
  behavior: 无 crash——**输出静默违反声明的 grammar 约束**（结构化输出契约破坏：JSON schema/正则约束的调用方拿到非法输出且无从得知）。11.57（grammar bitmask fail-open）之后约束解码正确性域第二例：本条是 spec 树扩展绕过约束，机制独立于 bitmask 默认值。
