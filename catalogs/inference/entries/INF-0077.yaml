  meta: '`infra_off`（TT_ASSERT 输入校验在 Release 构建被编译掉 → polyval 越界读 / complex_tensor 校验消失） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 三个 ttnn 用户入口（`polyval`、`complex_tensor`、`mac`）用 `TT_ASSERT` 做输入校验，而 `tt_stl/tt_stl/assert.hpp` 的 `TT_ASSERT` 是 `#ifdef DEBUG` 包裹的——Release 构建中完全编译掉。于是 `polyval` 在空 vector 上越界读 `coeffs[0]`；`complex_tensor` 的 shape 校验整体消失。
  source: 'tt-metal #53285（2026-08-16 open，"Bad Outputs"）。组件 `binary_composite_op.cpp` / `complex.cpp` / `ternary_composite_op.cpp`。https://github.com/tenstorrent/tt-metal/issues/53285'
  behavior: 无 crash（Release 下断言不存在）。越界读返回垃圾系数参与计算；shape 校验消失后非法形状静默通过。属「debug-only 断言被当输入校验（fail-open 校验面）」**新子签名**。
  trigger_surface: tt-metal；Release 构建 + polyval / complex_tensor / mac 入口
  discovery: 2026-08-16 每日扫描。
