  behavior: base.h 与子类的 numCore、eps、isXOut、gmOffset_、scales1Exist 等成员无默认值；InitBaseParams 提前返回或分支跳过时，分核数、尾块长度、scale 存在性按垃圾值参与运算
effect:
  objects:
  - 数值结果
  detail: 跑 add_layer_norm_quant，尤其带 smooth scale 或 per-channel 量化路径时，偶发整块输出不对、某些通道像没做量化；重跑或换 shape 有时正常；日志无 error 也无 NaN，只能靠与 PyTorch 对拍发现。
  visibility: 静默错误
mitigation:
  detect: 在 InitBaseParams 的提前返回/分支路径上打印 numCore、numLastDim、eps、gmOffset_，或把成员默认值改成哨兵值后跑不同 shape 的 add_layer_norm_quant 用例
  fix: 待定（issue 建议给所有成员补默认值：numCore=0、numLastDim=0、eps=0.0f、isXOut=false、gmOffset_=0、scales1Exist=false、alignedStride=0），未见 MR
