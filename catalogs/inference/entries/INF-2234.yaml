    component: Inkling prefill 图缓冲注册
  behavior: prologue kernel 按整个 launch grid 写 K/V，含 padding token（out_cache_loc=0）的 stale 数据写入 slot 0；页<128 的滑窗注意力读 slot 0 得 NaN。
effect:
