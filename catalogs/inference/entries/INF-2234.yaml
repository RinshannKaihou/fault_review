  detail: GUMBEL=0 时 multinomial assert 每 rank 退出；默认 GUMBEL=1 时受影响请求静默返回 token id 0（'!'）且 logprob 为 NaN。H200 FA4 默认页 1 即触发；B200 FA4 强制页 128 掩盖读取。
  visibility: 数值异常
