original:
  category: cat10
  section: 第 10 类 · 分词器 / 对话模板故障
  meta: '`model_on`（静默错误基准数字） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
  mechanism: '`trtllm-eval aime25`/`aime26` 子命令把 `--chat_template_kwargs` 默认设为 `''{"thinking_budget": 32768}''`。但 DeepSeek-V4 **不读 `thinking_budget`**——其 renderer 读 `thinking`/`enable_thinking`。未知键被**静默忽略**，`thinking` 回退到 `False`，benchmark 以**非 thinking 模式**运行。结果是基准准确率**减半且无任何警告**——评测数字静默错误。'
  source: 'TRT-LLM #17020（2026-07-29 open，1.3.0rc21，main 上字节一致）。组件 `evaluate/lm_eval.py`、`tokenizer/deepseek_v4/tokenizer.py`。https://github.com/NVIDIA/TensorRT-LLM/issues/17020'
  behavior: 评测工具报告的准确率约为真实 thinking 模式的一半，且无警告。属"对话模板参数键不匹配导致的静默评测错误"——典型的 silent wrong benchmark。
  trigger_surface: TensorRT-LLM 专用；vLLM 无直接等价除非同概念
  signature: model_on / perfect-disguise。模板参数错误不影响模型前向正确性，只影响 benchmark 运行模式。检测面在评测工具的参数校验（非隐藏态）。
  discovery: 2026-07-30 每日扫描。
