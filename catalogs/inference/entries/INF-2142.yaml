  objects:
  - subsystem: KV缓存
    stack: vllm
    component: CPU 后端 dtype 校验与写核
  behavior: CpuPlatform 不校验 kv-cache-dtype，恒选 CPU_ATTN；量化格式下按 uint8 分配缓存，写核对 fp8 外 dtype 按 bf16 字节步长写，越过缓存末端
effect:
  objects:
  - KV状态
  - 输出内容
  detail: 启动不报错；短请求看似正常（Qwen2.5-0.5B greedy 答 Paris），~100 token prompt 从首个生成 token 起输出垃圾且无错误日志；块序号进入 KV 池上半区后写入越过缓存末端，最小复现 4 块越界 512 字节（期望 0）。
  visibility: 静默错误
