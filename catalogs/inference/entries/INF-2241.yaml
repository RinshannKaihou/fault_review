original:
  mechanism: 'cann/ops-transformer issue #6822（2026-10-28，open）：aclnnQuantCompressor 的 stateBlockTableOptional 元素值直接作为 state_cache 的物理块号进入 kernel，接口资料声明取值范围 [0, block_num)，实现无任何一层校验。实测（Ascend950PR，CANN 9.2.0-beta.2，torch 2.14.0+torch_npu 2.14.0，源码基线 ops-transformer master f3f3135a，算子目录 attention/quant_compressor）：block_table={2}（block_num=2）时 GetWorkspaceSize 与执行均返回 0，state_cache 之后 1 MiB 守护区（0xA5 预填）被写入 65536 字节，mssanitizer memcheck 报 illegal_write 256 次（每次 256B）；对照组 block_table={1} 越界 0 字节。复现为自包含 C++（repro_qc_bt.cpp，含编译命令），两次调用除该元素外参数完全一致。'
  source: https://gitcode.com/cann/ops-transformer/issues/6822
  behavior: 调用 aclnnQuantCompressor 时若 stateBlockTable 中某个块号越界（如填成 block_num），接口不报任何错（两段 rc=0），内核直接按越界块号写 state_cache 之后的显存：实测 1 MiB 守护区被写 65536 字节。用 mssanitizer memcheck 跑同参数能看到 256 次 illegal_write；普通调用与日志完全无异常，被写的相邻对象是否受影响取决于显存布局。
  trigger_surface: Ascend950PR + CANN 9.2.0-beta.2 + aclnnQuantCompressor 两段式 C 直调 + stateBlockTableOptional 含 [0, block_num) 之外的值（上溢边界或更大）；ops-transformer master f3f3135a。
  discovery: 2026-10-28 每日扫描
