  meta: '`infra_off`（`ttnn.from_torch`/`ttnn.to_dtype`/宿主 `typecast`/`Tensor::from_span` 的浮点→整数转换用**未检查 `static_cast`**：越界值是 C++ UB——x86_64 `cvttss2si` 给 INT_MIN（含 +inf/NaN）、aarch64 `fcvtzs` 饱和且 NaN→0；两架构互不相同且**都与设备侧转换不一致**，哪个错取决于目标 dtype；FLOAT32/BFLOAT16 源全受影响） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`tensor_apis.cpp:484` `transform_buffers` 对每元素 `static_cast<DstType>(value)` 无范围检查；宿主 UB 使同一张量在不同构建架构上产出不同整数张量，并与设备内核的转换语义分叉——同一 op 存在两个互斥真值。'
  source: 'tt-metal #55825（2026-09-08 open，community label；早期同文提交 #55815 已关为重复）。https://github.com/tenstorrent/tt-metal/issues/55825'
  behavior: 无 crash——宿主侧 dtype 转换**静默产出架构相关的错值**（越界/inf/NaN 输入的映射因 CPU 架构而异）；跨架构结果分歧本身是排障陷阱（x86 上验证通过、arm 上静默不同）。「宿主/设备语义分叉」新子签名。
  trigger_surface: tt-metal 宿主 dtype 转换路径 + 浮点越界/inf/NaN 值 → 整数 dtype（hw_specific；构建架构决定显形形态）
