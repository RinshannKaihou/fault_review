    component: stop_token_ids 范围校验
  behavior: _verify_common 只校验 stop_token_ids 是否 int，不校验词表范围；越界 id 仅在 proxy 注入 min_tokens=1 或用户自带 min_tokens>0 而走设备侧时被当 logits 索引。
effect:
  objects:
  - 输出分布
  - 可用性/进度
  detail: DeepSeek-V4-Flash（词表 129280）收到 stop_token_ids=151645：CANN 9.0.x 静默写脏 logits；9.1.0 IndexCheck 断言挂死 P 实例，8 个 TP rank 同崩。
  visibility: 静默错误
mitigation:
  detect: 在入口校验 stop_token_ids < tokenizer 词表大小；CANN 9.1 上看 IndexCheck_int32_high_performance_1 断言与 fault kernel 名
  fix: '上游 vllm PR #54196 增加 _validate_stop_token_ids（越界直接 400）；本仓 releases/v0.23.0 backport #15228'
