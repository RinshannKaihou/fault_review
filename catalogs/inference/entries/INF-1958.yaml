original:
  mechanism: 'vllm-ascend issue #15200（2026-08-28，open）：0.23.0 四机 A3、3D1D 部署 DeepSeek-V4-Flash-w8a8-mtp，请求参数里带 stop_token_ids 时 P 实例中断，报错算子 IndexCheck。评论 QwertyJack 给出完整根因：vllm/sampling_params.py 的 _verify_common 只校验 stop_token_ids 是否 int，不校验范围，而同文件的 logit_bias、allowed_token_ids 都有词表校验；151645 是旧版 DeepSeek V3 tokenizer 的 <|im_end|>，而 DeepSeek-V4-Flash 词表只有 129280。stop_token_ids 有两条消费路径：CPU 比较（无害）与设备侧 logits 索引；只有经 proxy 注入 min_tokens=1 或用户自带 min_tokens>0 时才会走设备侧。CANN 9.1.0 的 IndexCheck_int32_high_performance_1 断言 idx<bound 失败导致 vector core exception、device context abort，P 的 8 个 TP rank 同时崩；CANN 9.0.1 上同一越界不报错但把 logits 写脏。修复为上游 vllm #54196 增加 _validate_stop_token_ids，本仓 backport 为 #15228。'
  source: 2026-08-28 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/15200 （open）
  behavior: 沿用 DeepSeek-V3 客户端配置（stop_token_ids 带 151645）打 DeepSeek-V4-Flash 服务时，请求可能直接把 P 实例打挂：HTTP 500，设备日志里是「index value 151645 exceeds bounds 129280」与 IndexCheck 断言失败，8 个 rank 同步崩，Python 栈最后浮在 MTP draft 的同步点上，第一眼很难定位到真实故障。在 CANN 9.0.x 上更隐蔽——不崩、不报错，但越界写把 logits 弄脏，采样结果被静默影响，因此无论哪个 CANN 版本都该在入口拦住。
  trigger_surface: 请求 stop_token_ids 越界 + 设备侧 logits 索引路径（proxy 注入 min_tokens 或请求自带 min_tokens>0）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
