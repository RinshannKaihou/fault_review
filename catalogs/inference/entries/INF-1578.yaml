original:
  mechanism: 'ops-transformer issue #3691（2026-07-09 closed，Ascend950PR_9589 + CANN 9.1.0，master f0116064）分析 KvRmsNormRopeCache 的 regbase recompute 模板（tilingKey 20000）：host 侧 kv_rms_norm_rope_cache_regbase_recompute_tiling.cpp:357 取 basicBlockLoop=FindNearestPower2(ubFactorDvLoopCountCeil)，而 FindNearestPower2 对 value<=1 返回 0（同文件 243 行）。当 dv≤ubFactor（dv 一个 UB 块即可载入）时 basicBlockLoop==0，kernel 侧 ReduceSumBasicComputeVF 的 for(basicBlockIdx<basicBlockLoop) 循环一次都不进，循环体内的 DataCopyPad / CastPowVF / ReduceSum / UpdateCache 全部未执行，cacheBuffer 从未写入，totalSumLocal（类成员的默认构造 LocalTensor<float>）也从未赋值；随后 RmsNormWithoutQuant / RmsNormAsymQuantWithVCache / RmsNormSymQuantWithVCache / RmsNormAsymQuant / RmsNormSymQuant 五处均无条件执行 totalSumLocal.GetPhyAddr() 并把该地址当平方和读入 1/sqrt(Σx²/dv+eps)。Init() 中已有 if(basicBlockLoop==0){resultCacheID_=0;} 的特判，说明该状态被预期到但计算路径没处理。触发：full_load 的 tiling 在 dk>dv 时 UB 分母由 dk 主导，dk 超大 + dv 小会落入 recompute 且 dv≤ubFactor，bf16 取 dk=32768/dv=512 即命中（kv=[1,1,2,33280]、gamma=[512]、cache_mode=Norm、is_output_kv=true、epsilon=1e-5）；dv==ubFactor 恰整除同样命中。上板实测（ttk kernel -b=release --seed 42，numpy golden rtol=atol=4e-3）：c_kv[0,:4] 修复前 [316,211,-184,62.5]，golden [1.3858,0.9232,-0.8066,0.2734]，max_abs 314.62、max_rel 229.36、1024/1024 元素不匹配；修复后 [1.3828,0.9219,-0.8047,0.2734]、max_abs 0.0039、0 个不匹配。'
  source: 2026-07-09 GitCode cann/ops-transformer issue https://gitcode.com/cann/ops-transformer/issues/3691 （closed）
  behavior: 当 dk 很大而 dv 很小（dv 一个 UB 块就能装下）时，这个 RmsNorm 算子的归一化分母整体算错：输出 c_kv 不是 x/sqrt(mean(x^2)+eps)*gamma，而是被放大约 200 多倍的另一组数，整张输出 1024 个元素没有一个对。算子照样返回成功、不报错，也没有用例覆盖这条路径，只能靠 dump 输出后用 numpy 独立算一遍才发现。
  trigger_surface: KvRmsNormRopeCache regbase recompute + dv 只占一个 UB 块（dk 超大、dv≤ubFactor 或 dv 恰整除 ubFactor）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
