title: KvRmsNormRopeCache dv 单块时 Σx² 未计算
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: recompute 模板归约路径
  behavior: FindNearestPower2(1) 返回 0，dv≤ubFactor 时 basicBlockLoop=0，折叠循环不进入、Σx² 未算；totalSumLocal 保持默认构造，五处 RmsNorm 仍取其地址。
effect:
  objects:
  - 数值结果
  detail: bf16、dk=32768/dv=512 实测 c_kv 1024/1024 元素错、放大约200多倍（max_rel 229.36）；修复后 max_abs 0.0039。算子返回成功、不报错，也没有用例覆盖该路径。
  visibility: 静默错误
mitigation:
  detect: 构造 dk 超大 + dv 小（或 dv 恰整除 ubFactor）使 recompute 模板的 dv 只占一个 UB 块，dump c_kv 与 numpy 的 x/sqrt(mean(x^2)+eps)*gamma 比对
  fix: PR https://gitcode.com/cann/ops-transformer/pull/8518 （为 ReduceSumBasicComputeVF 增加 basicBlockLoop==0 的单块归约分支并给 totalSumLocal 赋值；另建议加固 RmsNormBasicComputeVF 的 foldPoint==0 隐式前置条件）
