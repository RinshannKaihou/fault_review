id: INF-1893
legacy_ids: []
slug: vllm_ascend_async_mtp_stale_accepted_counts
aliases: []
title: 异步 MTP 在 batch condense 后复用旧接受计数
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: vllm
    component: InputBatch/NPUModelRunner
  behavior: condense() 先改写持久 InputBatch 行，_prepare_inputs 再按 prev_positions 重映射上一轮接受计数时读到被覆盖的默认值 1，使 Mamba/GDN 状态拷贝偏移错误。
effect:
  objects:
  - 输出内容
  detail: 高 batch 压缩/KV 压力下 Qwen3.5/3.6 hybrid 间歇返回重复、丢失或乱码 token：512 请求中 2 条损坏（KV 100%）；关闭 async scheduling 后 0/1024。
  visibility: 静默错误
mitigation:
  detect: 固定 8196-token 前台请求 + 16 条长请求压满 KV，512 次 temperature=0 请求比对输出哈希；对照关闭 async scheduling
  fix: 上一轮接受计数先写入独立 CPU/GPU 快照，按 prev_positions 重映射后再写回 InputBatch（issue 提议，open）
