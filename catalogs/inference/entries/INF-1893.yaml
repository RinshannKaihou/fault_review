relations: []
original:
  mechanism: 'vLLM 0.23.0 + vllm-ascend 0.23.0rc1（含 #12255）、torch-npu 2.10.0.post2、CANN 9.0.1、A3 2 卡 TP2、Qwen3.6-35B-A3B-w8a8，启用 --enable-prefix-caching、--async-scheduling、qwen3_5_mtp（num_speculative_tokens=3）、FULL_DECODE_ONLY 与 --num-gpu-blocks-override 288。上一轮接受计数被复制到 InputBatch.num_accepted_tokens_cpu；在下一次 _prepare_inputs 重映射前，异步 condense() 已更新持久 input-batch 行，新请求可把上一轮的行（如 row 11 接受 4）覆盖为默认 1，随后 prev_positions 重映射读到 1。该错误值改变 Mamba/GDN state-copy 偏移，导致请求重放或丢弃固定 token。NPUModelRunner 与 vLLM core 都有同一读路径；vLLM PR #38556 只同步了拷贝，未隔离可变行。压力复现 512 请求中 2 条输出不同（KV 100%），关闭 async scheduling 后 0/1024。'
  source: 2026-08-09 GitHub vllm-project/vllm-ascend issue https://github.com/vllm-project/vllm-ascend/issues/13863 （open）
