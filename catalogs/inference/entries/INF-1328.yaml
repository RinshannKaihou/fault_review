  signature: 受 batch 占用率与页边界跨越双重门控，故为 ambiguous。签名是**随批次占用 + 页边界跨越增长的每序列注意力后余弦漂移**——geometric（注意力输出余弦相对单序列参照）配合 cheap 族的 batch-invariance 探针最有效；由于漂移温和且逐步累积，单点 statistical 阈值容易判为噪声，trajectory 的累积曲线更可靠。
  repro: partial——在 attention 输出上注入幅度随 batch 占用与"已跨越页数"增长的小扰动；由于上游根因未确立，这一注入只能复现症状形状而非机制，须在报告中明确标注。
