title: Winograd 驻留切分错位读到未初始化 workspace
kind: 故障
status: active
cause:
  objects:
  - subsystem: 算子/内核
    stack: 通用
    component: winograd 驻留变换任务切分
  behavior: 运行时 M 轴调节档把 cout 分块从模板 64 改成 48/32/16，驻留变换任务切分仍按常量 64 划分；两套块边界错位后部分驻留半区无人写入，MMAD 读到未初始化 workspace。
effect:
  objects:
  - 数值结果
  detail: fp32 cout=192/cin=448/pad(1,0) 用例中 64 个完整 co 通道（[48-63]/[96-127]/[160-175]）读到未初始化数据，占 33.3% 元素，本机 NaN、fuzz 环境为 0；错误通道与缺口区间逐一吻合。
  visibility: 数值异常
mitigation:
  detect: fp32 winograd 路径上核对输出通道分组是否整段为 0 或 NaN；用 TTK 复现用例比对，tiling_key 不变说明修的是块边界而非路径选择。
  fix: 修复 PR https://gitcode.com/cann/ops-nn/merge_requests/11267 （closed）：运行时分块大小自 IterateAll 透传至驻留任务切分，块宽不足驻留长度时整块驻留只产生 1 个任务
