  meta: '`infra_off`（PDMux 调度器事件循环在 **≥4K-token prefill 之后**的混合 decode+split-prefill batch 上死锁于 `decode_stream.synchronize()`（hybrid GDN 模型）——时序敏感（单 b1 轮 30–70% 触发），PR #37905 附单 GPU ~10 分钟自包含复现脚本 + 嵌入 py-spy dump；验证环境还需两条 stale-field 修复（`self.gpu_id`→`self.ps.gpu_id` 等）PDMux 才能启动） · Cov: `NEW` · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 长 prefill 改变的事件顺序与混合 batch 的 stream 交错在 `decode_stream.synchronize()` 形成循环等待——多 stream 调度器的经典死锁形态；复现脚本双向验证（仅前置修复→exit 2 死锁；全 PR→三轮全过 exit 0）。附带暴露 PDMux 分支连启动都依赖未合入的 stale-field 修复（特性分支腐化信号）。
