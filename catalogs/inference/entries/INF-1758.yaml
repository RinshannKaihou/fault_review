original:
  mechanism: 'Ascend/pytorch #4758（2026-09-12，closed，环境「不限制」）：torch_npu 注册为 PrivateUse1 后，torch.Stream()（accelerator 方式）与 torch.npu.Stream()（NPU 直调）都能创建 NPU 流，但底层 C++ 结构体不同。THPStream（torch/csrc/Stream.h L8-16）为 PyObject_HEAD + stream_id(偏移 0) + device_type(8) + device_index(16) + context(24) + weakreflist(32)，共 56 字节；THNPStream（torch_npu/csrc/npu/Stream.h L10-12）继承 THPStream 并在偏移 56 处多一个 c10_npu::NPUStream npu_stream。torch.Stream() 走 THPStream_pynew → tp_alloc(THPStreamType)（torch/csrc/Stream.cpp L69、L487），只分配 56 字节；torch.npu.Stream() 走 THNPStream_pynew（torch_npu/csrc/npu/Stream.cpp L46、L161）分配完整大小。THNPEvent_record（torch_npu/csrc/npu/Event.cpp L135-141）签名声明 THNPStream*，注册为 METH_O（L210）不做参数类型检查，直接 self->npu_event.record(stream->npu_stream) 读偏移 56 之后的未分配内存，属 UB；读到的垃圾被解释为 NPUStream，其 device_index() 随机。进入 NPUEvent::record（torch_npu/csrc/core/npu/NPUEvent.cpp L100-121）后，L101 checkNotExternalStream 与 L106-113 的 TORCH_CHECK 才因 device_index 不匹配抛 "Event device ... does not match recording stream''s device"——报错是 UB 的幸运结果，若垃圾 device_index 恰好匹配就会继续 LaunchRecordEventTask。Event/Stream 的 wait、elapsed_time 与 __eq__ 同样缺检查（THNPStream_eq 于 torch_npu/csrc/npu/Stream.cpp L154/L131）。CUDA 与 XPU 的对应实现有 THPStream_Check、转基类、只读基类字段，故安全。'
  source: 'Ascend/pytorch #4758（2026-09-12，closed） https://gitcode.com/Ascend/pytorch/issues/4758'
  behavior: 脚本里一边用 torch.Stream()/torch.Event()（新 accelerator API），一边用 torch.npu.Stream()/torch.npu.Event()（NPU 直调），把 torch.Stream 递给 NPU Event 的 record 会抛「Event device ... does not match recording stream's device」；换个调用顺序或换个对象就可能不报错，却把事件记到一个不存在的流上，后续 wait 的时序依赖落空，多流推理出现难以复现的脏读。同一段代码在 CUDA/XPU 上正常。
  trigger_surface: torch.Stream()/torch.Event() 与 torch.npu.* 的 Stream/Event 跨类型混用（record/wait/elapsed_time/__eq__）
  discovery: 2026-10-20 历史索引回填（issue created < 2026-10-07）
