title: NPU Event 无类型检查越界读 npu_stream 字段
kind: 故障
status: active
cause:
  objects:
  - subsystem: 运行时/执行
    stack: pytorch
    component: Stream/Event C 结构布局
  behavior: THNPStream 比基类多一个 npu_stream 字段，THNPEvent 的 record/wait 却注册为 METH_O、不做类型检查，直接把入参当 THNPStream 读该字段，读到分配块之外。
effect:
  objects:
  - 数值结果
  - 可用性/进度
  detail: torch.npu.Event().record(torch.Stream()) 抛 Event device 不匹配；该报错只是 UB 的偶然结果——垃圾 device_index 恰好相等时会按垃圾流继续下发 record 任务。CUDA/XPU 同位置有类型检查且只读基类字段。
  visibility: 不可复现
mitigation:
  detect: 把 torch.Stream/torch.npu.Stream 与 torch.Event/torch.npu.Event 的四种组合逐一喂给 record/wait/elapsed_time；越界读用 ASAN 确认
  fix: 待定（issue closed，未给修复 PR）；按 CUDA/XPU 模式修：入口加 TORCH_CHECK(THPStream_Check(...))，转基类 THPStream*，用 stream_id/device_index/device_type 经 c10::Stream::unpack3 重建 Stream
