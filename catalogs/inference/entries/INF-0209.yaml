  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（ttnn.pad 单核 row-major 工厂 `PadRmReaderWriterProgramFactory` 的 reader kernel **从不读 `input_tensor_start`（前向填充量）**：把 pad 值追加在 stick 尾部而非写前缀——请求 `(49290,0)` 前向填充得到 `[x0..xn,0..0]` 而非 `[0..0,x0..xn]`，无任何错误。多核默认工厂有 `front_padding` 分支正确处理；tt-mlir 恒 `use_multicore=True`、test_pad.py 单核用例全为零前向填充——该路径零覆盖；#56121 让宽单核前向填充构建成功（此前在 program creation 更早失败）后与 torch 对照才显形） · Cov: `NEW`（布局算子的前缀量被静默丢弃/错位子签名） · 触发 `yes` · 置信度 `verified`'
  mechanism: 单核 reader 只实现 trailing padding 路径；`input_tensor_start` 字段存在但未接线，工厂静默接受其不支持的语义而不 TT_FATAL。
  source: 'tt-metal #56323（2026-09-12 open，bug label，含期望/实际行对照、双工厂源码定位与前后 sanity 日志；修复方向二选一：实现前缀或 fail-loud 拒绝）。https://github.com/tenstorrent/tt-metal/issues/56323'
  behavior: 无 crash——单核 row-major pad 的前向填充**静默错位**（数据整体前移一个 padding 宽度）；依赖 pad 前缀对齐的下游（序列左 padding、对齐预处理）发生系统性位置错乱。1.143（avg_pool2d 全局快路径交错 pad 误读）之后"布局/边界量被错误消费"族新成员：本条在前缀填充维度、单核工厂盲区。
  trigger_surface: tt-metal + ttnn.pad + ROW_MAJOR + use_multicore=False + 前向填充 >0（yes）
  discovery: |-
    2026-09-13 每日扫描。
