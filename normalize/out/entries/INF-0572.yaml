  meta: '`infra_off`（GLM-5.3-Flash KV offloading 不可用：sparse-MLA indexer 的 `tail_cache` KV 组 `block_size=4` 无法对齐 prefix-hash 粒度（tokens_per_hash=8704），`OffloadingConnector`（及 LMCache）配置期 assert 拒绝——`--mamba-cache-mode align` 不达该组，报错推荐的 `--enable-prefix-caching` 是死胡同（默认已开）） · Cov: `var:vllm_hybrid_page_alignment_giant_blocks_fixed_footprint_collapse`（6.168 hybrid 多 KV 组对齐域） · 触发 `config` · 置信度 `documented`'
  mechanism: hybrid 模型 KV 组异构（indexer.k_cache block 8704 / indexer.tail_cache block 4 / MambaSpec 8704）；offloading 配置断言只接受全部组可被 tokens_per_hash 整除，`--mamba-cache-mode align` 只重排 Mamba 组不触及 indexer 子组。报错文案把用户引向已启用的 prefix-caching flag——**修复建议本身不可用**。与 6.168（hybrid 页对齐巨块固定足迹坍塌）同"hybrid 多组 block 尺寸不一致 × 统一 hash 粒度"主题：彼条运行期坍塌、本条配置期拒绝（fail-loud 但指导错误）。
  source: 'vLLM #54831（2026-08-31 open，MI350X gfx950、GLM-5.3-Flash MXFP4、fp8_e4m3 KV、CPUOffloadingSpec，含 per-group 打点 dump）。https://github.com/vllm-project/vllm/issues/54831'
  behavior: 启动期 assert（fail-loud）——offload 能力对该模型家族整体不可用（无法启用），但错误消息误导排障方向。与 6.182（同模型族 Mooncake 分级失败）构成 hybrid GDN/indexer 模型 offload 路径的双重配置壁垒。
  trigger_surface: vLLM + GLM-5.3-Flash（DSA indexer）+ OffloadingConnector/LMCache（config 即触发）
  discovery: 2026-09-01 每日扫描。
