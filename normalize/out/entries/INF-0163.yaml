  meta: '`infra_off`（`ttnn.polygamma` 对 **n ≥ 7** 在一大段普通正 x 上返回**精确 0.0**，真值是可表示的普通 fp32（最坏 n=11、x=3142.29 返回 0 vs 真值 1.23e-32，1.678e7 ULP）——n! 尺度因子在**累加之后**才施放，累加中间值先一步溢出/下溢；n≤11 是公开 API（`TT_FATAL(k >= 1 && k <= 11)`）） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
