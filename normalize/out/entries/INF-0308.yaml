  meta: '`infra_off`（缓解侧：对权重做旋转/正交变换使位翻转敏感度均匀化——免训练 BFA 防御） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 利用 3.8 已编目的「位位置敏感度不均」（UEP）现象的**对偶面**：对 LLM 权重矩阵施加正交旋转 Q，使任意单个位翻转对输出的扰动能量被均匀摊薄（敏感位热点消失），从而免重训地提升对 BFA 与随机位翻转的鲁棒性；推理时在对应位置施加逆变换恢复语义。
  source: 'arxiv 2603.16382 "Rotated Robustness: A Training-Free Defense against Bit-Flip Attacks on Large Language Models"（2026-03-17）。https://arxiv.org/abs/2603.16382'
  behavior: 无 crash（防御方法论文）。权重损坏从「灾难性单点失效」降级为「均匀小扰动」——与 3.19 `weight_bitflip` 的 `mantissa_*` 单翻转弱故障锚点形成对照。属「旋转域敏感度均匀化防御」**新子签名**（与 3.8 UEP 图谱互补：一个刻画敏感度、一个抹平敏感度）。
