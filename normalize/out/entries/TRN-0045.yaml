  mechanism: Megatron-FSDP v1 `gradient_reduce_preprocessing` 在 `average_in_collective=True` 时**忽略 `scaling_factor`**：该模式把梯度平均折进集合通信算子执行，预处理阶段本应配平的缩放不再应用——expert 梯度 `[6, 10]` 而非 `[3, 5]`（**恒 ×2**，DP=2 repro）。#7452 Appendix C 第二条；09-19 裁决收录：与 PAR.05「应累加的梯度被乘 2」互为镜像（**应缩放的梯度没缩放**），且经 Qwen3.5-35B-A3B MFSDP recipe（EP=2）真实可达。修复 = preprocessing 阶段对 `average_in_collective` 分支同样施加 scaling（或显式拒绝该组合）。
  source: 'Megatron-LM #7452 Appendix C（2026-09-17；audit 数值对照）。https://github.com/NVIDIA/Megatron-LM/issues/7452'
  behavior: 无 crash——MFSDP v1 + `average_in_collective=True` 的 run 里**有效学习率恒 ×DP**，loss 照常下降、收敛动态随 DP 度不可比。与 PAR.05 同族「FSDP 梯度缩放算术」第 2 个实例（那边 2^N 翻倍、这边 DP× 不缩）；与 PAR.16 同日收录且方向相反（16 缩小 / 17 放大）——同一 audit 揭示 FSDP/DDP 缩放语义的两个对偶断点；与 PAR.13（liger 绕过 reducer）不同：那边梯度从不归约、这边归约了但系数错。
  discovery: 2026-09-19 每日扫描
