  mechanism: speculative-config 内的 `kv_cache_dtype` 意图是"给 drafter 的 KV 用 fp8"，但键名与顶层 `--kv-cache-dtype` 相同而解析域不同：draft config 构造把未指定/默认的 `"auto"` 原样下传，FlashInfer 后端的 dtype 表不认识 auto；显式归一后第二条路径（SM89 4×4090 + hybrid GDN + DFlash2 drafter）在 attention init 段 native crash——同一配置的两级失败。
  source: 'vLLM #54690（2026-09-01 open，4×RTX 4090 SM89、Qwen3.5-family hybrid（full-attn+GDN）INT8-W8A16、method=dflash、两级失败与 main 代码核对）。https://github.com/vllm-project/vllm/issues/54690'
  behavior: 启动崩溃（fail-loud，两级形态：Python ValueError → 无 traceback 的 native crash）——该 spec+hybrid 组合不可部署；无静默形态但第二级 native crash 难归因（无栈）。与 7.52（KV scale 丢弃）同"KV dtype/scale 配置语义在 spec 路径上无主路径同等的归一化"主题。
