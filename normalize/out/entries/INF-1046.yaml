  source: 'SGLang PR #33805（2026-08-06 open）。DeepSeek-V4-Flash-0731，2x RTX PRO 6000 SM120，TP=2，DSPARK block size 5。在 77,824 token 精确 retract（`align_page_size(int(778496 * 0.1))`）。https://github.com/sgl-project/sglang/pull/33805'
  behavior: 单请求生成被调度器 retract（mid-generation kill，无 crash）。属「推测算法路径遗漏 SWA 驱逐→线性内存增长」签名——dflash-family 与 EAGLE 的驱逐逻辑不对称新子签名。
