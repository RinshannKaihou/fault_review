  meta: '`ambiguous`（FunASR-Nano 语音模型 `--dtype float16` 下 ASR 转写退化为无限 token 重复循环——zh.mp3 复现输出整屏 "locklocklock…"；H100、`--enforce-eager` 下仍复现，dtype 相关） · Cov: `var:fp16_overflow_ceiling`（4.4） · 触发 `partial` · 置信度 `documented`'
  mechanism: fp16 窄动态范围 × ASR encoder（深层卷积/注意力混合）中间激活——上溢/精度损失使 decoder logits 坍缩到重复吸引子（声学帧间差异低于 fp16 可分辨度）。报告为 vLLM serve 形态（audio transcription 端点）；dtype 是唯一变量开关（fp16 → 垃圾循环），eager 排除编译路径。属 4.4（fp16 溢出天花板）在 audio 模型族的新显形：语言模型的退化显形通常是重复短语，audio token 退化显形为单 token 无限循环。
  source: 'vLLM #54569（2026-08-31 open，H100×4、vllm serve + /v1/audio/transcriptions、modelscope checkpoint、含请求级复现命令与完整垃圾输出）。https://github.com/vllm-project/vllm/issues/54569'
  behavior: 无 crash——转写结果为无意义重复 token 串（整段输出被单 token 占满）；模型可用性完全丧失但服务健康。dtype 切回 bf16/fp32 即恢复（4.4 的标准规避）。
  trigger_surface: vLLM + FunASR 类 audio 模型 + `--dtype float16`（config 即触发；需该 checkpoint）
  discovery: 2026-09-01 每日扫描。
