  trigger_surface: KV/前缀/FP8 相关：vLLM 配置可触发或强相关
  signature: MLA 层上**时间滞后的 off-manifold 累积**——单轮快照落在健康流形内，只有沿轮次轴累积后才越界，故族判为 ambiguous。检测面：需要**跨轮的 trajectory 度量**（同一会话的隐藏态位移轨迹）才能看见；任何 per-request 无状态的 geometric / spectral / cheap 检测器都会在早期轮次给出健康判定而漏检。这是本目录中少数需要"跨请求状态"才能检测的故障之一。
  repro: 单钩子以"每次前向对 cached K/V 复合施加一次小幅 fp8 量化误差（不清零累计）"近似跨轮复合；标准模型无 MLA 低秩 `c_KV`，故只能把复合效应移植到标准 K/V 上。
  locus: eviction-compression
  priority: low
