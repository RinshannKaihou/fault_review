original:
  category: KV8
  section: KV §8 control-flow（推测解码 / beam-search / CUDA-graph × KV）
  meta: '`infra_off`（设计性缺陷，非个案 bug） · Cov: `NEW`（根本性结论，非单一 bug） · 触发 `partial` · 置信度 `verified`'
  mechanism: '**证明所有现有 batch speculative decoding 实现都违反输出等价性（output equivalence）**——即批量推测解码的输出分布与标准自回归生成**不恒等**。根本原因是 batch 场景下不同请求的 draft token 接受/拒绝决策互相耦合（batched verify 在 GPU 上需要统一处理），而单请求 spec-dec 的接受/拒绝依赖该请求自身的 draft logits 分布。批量处理改变了采样路径的概率结构，导致最终输出分布发生系统性偏移。这是推测解码正确性的**根本性缺陷**而非个案实现 bug。'
  source: arXiv 2510.22876v3, "Batch Speculative Decoding Done Right"（2025-10-26）。http://arxiv.org/abs/2510.22876v3
  behavior: 批量推测解码服务的输出分布与非批量自回归解码不恒等——偏差程度取决于 batch 组成与 draft 模型质量。对大多数 prompt 偏差可能很小，但在 draft acceptance 边界附近可能翻转 token。无 crash、无 NaN，输出看起来合理但分布被系统性地偏移。
  trigger_surface: 推测解码/CUDA graph：vLLM 可开，需接受率与 batch 场景
  signature: infra_off 的设计性变体——不是某一次前向的 bug，而是一类实现的系统性偏移。签名形态是"输出分布的 KL 偏移"而非隐状态的几何离群，因此可被 infotheoretic 族（predictive_entropy / KL-divergence across batch vs non-batch）捕获；单次 pass 的 geometric / spectral 度量难以区分批量 vs 非批量路径的差异。对编目 K§8 有重要补充价值——它把 K§8 的"推测解码控制流 bug"从个案 bug 提升为一类**设计性正确性缺陷**。
  repro: 不可软件复现——需要完整推测解码服务栈 + 批量调度，单进程路径无法复现 batch verify 路径。
  locus: '`control-flow`'
  priority: '`high`（影响所有 batch spec-dec 部署，根本性正确性缺陷）'
  discovery: 2026-07-29 每日扫描（daily_scan_2026-07-29.md），arXiv A4。
