  meta: '`infra_off`（`tensorrt_llm/llmapi/llm_args.py` 携带手维护的第二份 `TOKENIZER_ALIASES` 字典（canonical 表在 `tokenizer/tokenizer.py`，load_custom_tokenizer/trtllm-bench/serve 脚本都用它）——canonical 表新增的别名永不镜像进副本：`TorchLlmArgs` 校验器对缺失别名落到裸字符串 `rsplit(''.'', 1)` → `Failed to load custom tokenizer ''<alias>'': not enough values to unpack`，错误信息指向标识符格式而非缺失注册；同一别名字符串在其它三个入口全部正常） · Cov: `var:ttmetal_unary_chain_specialized_header_drops_chain_tail_op`（1.107 双源常量失配族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 同一映射的重复定义无单一 source of truth，漂移只在新增侧发生（副本只会更旧）。修复删除副本直接 import canonical 表（四个解析点共享一个定义），并加对象恒等测试（`llm_args.TOKENIZER_ALIASES is tensorrt_llm.tokenizer.TOKENIZER_ALIASES`）防副本回潮 + 逐别名 module/class 可分性测试。
  source: 'TensorRT-LLM PR #18768（2026-09-06，api-compatible label，含七个 CPU 单测）。https://github.com/NVIDIA/TensorRT-LLM/pull/18768'
  behavior: 请求期/启动期 crash（fail-loud 但**误导性**——错误指向用户输入格式而非内部表漂移；且同别名跨入口行为不一致本身即正确性疑点）。1.107（GELU LUT 双源常量失配）之后重复定义漂移族新成员：本条在 tokenizer 别名解析域；「校验器与解析器各持一份真理」是配置面反模式。
  trigger_surface: TRT-LLM + 新注册的 --custom_tokenizer 别名 + TorchLlmArgs 校验路径（other_stack：TRT-LLM；别名生命周期触发）
