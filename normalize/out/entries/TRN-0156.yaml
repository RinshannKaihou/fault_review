  meta: 'stage: `sft/rl` · Cov: `var:expert_reshard_id_permutation` · 置信度 `documented`'
  mechanism: verl DeepSeek-V4 RL 栈里 Megatron 桥接的 routed experts 量化（MXFP4 ckpt → 训练侧 bf16）要求 rollout 端保持 ckpt 自带 packed 布局，但 SGLang `process_weights_after_loading` 在模型加载时跑一次 CUTLASS interleave、把四个专家参数 republish 为**全新 Parameter 对象**——`set_weight_attrs` 挂的 `weight_loader` 等属性全丢，后续每次训练→rollout 权重同步在 `deepseek_v4.py` 撞 AttributeError（fail-fast 面）。真正的静默面在**量化布局契约**：训练侧从 ckpt 直接训 packed MXFP4 专家、rollout 侧在 interleave 前后两种布局间同步，双方若任一侧静默容忍布局差异（如 sentinel 协议回退），权重被按错误 interleave 解释。修复方向 = 自定义 weight loader 在每次 sync 前 stage 恢复 ckpt 布局 buffer（interleave 是置换、字节守恒，可原地 reinterpret）。
  source: 'verl PR #7747（H200/SM90 FlashInfer CUTLASS W4A16 验证；SGLang 侧 vLLM 对应实现 `vllm_fp4_utils.py` 已存在）。https://github.com/verl-project/verl/pull/7747'
  behavior: fail-fast 面（AttributeError）之外，布局错配若被容忍则 rollout 采样自**错误解释的专家权重**——与 RL-RO.09（fused expert view 冻结在捕获时刻）同族：训练/rollout 两侧对同一份 MoE 权重的视图或布局语义不一致；与 CKPT.09/NUM.09 同链（量化表示在存取/初始化路径被破坏）。此处为 draft PR、机制以布局契约记录在案。
  discovery: 2026-09-05 每日扫描
