  mechanism: hash-routed MoE 层的 token dispatch 按 `tid2eid` 哈希表执行；但 aux load-balancing loss 开启时，router 侧从 learned logits 另算一份 top-k routing map 进 aux loss——**优化的是一份从未被 dispatch 执行的路由**。两个路由图（执行 vs 优化）可以任意分叉，aux loss 的梯度把 router 往与实际 token 分配无关的方向拉。修复 = hash MoE 层跳过 aux loss。
  source: 'Megatron-LM PR #7079（dev 分支，draft；机制为「learned routing map can differ from the hash routing map that was actually executed」——修复理由直接给出机制）。https://github.com/NVIDIA/Megatron-LM/pull/7079'
  behavior: 无 crash、无 NaN；aux loss 数值正常下降但负载均衡目标与真实 dispatch 脱钩——router logits 被训成「纸上均衡」，实际 token 分布不变。与 MOE.03（train/rollout 路由不一致）同族不同位：那边是**时间维**（训练重算 vs rollout 执行），这边是**同一步内**（loss 优化的路由 vs forward 执行的路由）。
  discovery: 2026-09-06 每日扫描
