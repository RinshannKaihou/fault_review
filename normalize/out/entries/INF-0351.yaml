  mechanism: DeepEP 的 low-latency dispatch 在 expert 负载严重不均衡 + token 数较大时，NVSHMEM ibgda 的 per-expert token count 的 atomic-fetch-add 结果会被翻倍/三倍地送达，导致 token 被 dispatch 到 / combine 自错误的 expert。
  source: 'deepseek-ai/DeepEP #427 (2025-09-24)。'
  behavior: 错误的 token 被路由到/取回自错误的 expert → MoE 输出被破坏；间歇性发生（仅在特定的不均衡度 + token count 组合下触发）。
  trigger_surface: 需要 P/D 分离或跨节点/RDMA 拓扑（默认实验室单机不具备）
  signature: OFF-manifold，且是 token 选择性的、与 expert 对齐的：只有被错误 dispatch 的 token 位置离开流形。statistical 的 outlier_count 与 trajectory 的 cos-drift 可标出受影响的 token 位置；而对全序列取平均的 geometric 汇总量会被健康 token 稀释而漏检。
  repro: 本故障属 MoE / 服务栈专有；在 dense 单模型路径上只能做形态近似 —— 用一个钩子对选定的一小部分 token 位置整行替换为另一组 token 位置的 FFN 输出，模拟「token 取回自错误 expert」的稀疏、位置对齐破坏。
