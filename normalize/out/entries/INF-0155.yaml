  meta: '`infra_off`（`ttnn.atanh_bw` 对**上游梯度恰为零的每个元素**返回 NaN：`where(eqz(grad), t_nan, …)` 守卫本意编码 |x|=1 极点的 0×inf=NaN 却无极点条件，第二守卫只救回 x==0——开区间 0<|x|<1（atanh 全有限域）内 grad=0 一律 NaN；零上游梯度是常客（attention mask、dropout、padding、graph 里的 where），**一个零毒化整个 backward**） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`unary_backward.cpp` L972 的 NaN 注入守卫只看 grad 不看极点条件；nightly `uniform(-100,100)` 抽样使精确零永不出现且 PCC 忽略 NaN lane——测试分布盲区（第三例，与 1.139/1.155 构成方法论三联）。'
  source: 'tt-metal #55290（2026-09-03 closed，逐点对照表 + host replay）。https://github.com/tenstorrent/tt-metal/issues/55290'
