  signature: 零填充 KV 混入真实 cache 属 infra_off，但完全受 batch 填充与 graph 捕获门控，故记为 ambiguous。签名是"注意力质量落在应为空的尾部位置"——statistical（注意力熵/尾部位置质量）与 cheap 侧的 batch-invariance 探针（同一序列在不同 batch 组成下输出应不变）最敏感；geometric 在单序列 batch=1 下完全漏检。
  repro: partial——prefill 后在某层 cache 尾部追加若干全零 K/V 行并放宽 attention mask 使其可见，模拟"零填充槽被写入"；真实的 kernel 越界写与分页布局不可复现。
