original:
  category: cat4
  section: 第 4 类 · 数值 / 精度 / 不确定性（本项目的噪声底）
  meta: '`model_on`（GPT-NeoX eager attention 路径 `nn.functional.softmax(attn_weights, dim=-1, dtype=torch.float32)` 硬编码——fp16/bf16 下是合理升精度、fp32 下是 no-op，但模型显式转 **float64** 后每张 attention map 被**静默降回 fp32** 再转回 fp64：对外暴露 fp64 参数/激活/输出，前向内部却被钉在 fp32 分辨率） · Cov: `var:tf32_matmul_truncation`（4.2 声明精度被静默截断族；方向相反——本条向下截断） · 触发 `config` · 置信度 `documented`'
  mechanism: '`dtype=torch.float32` 字面量在低精度是稳定性升 cast、在 fp64 是隐藏降 cast——升/降语义随调用方 dtype 反转而无人察觉。Pythia-410M-deduped + eager attention：模型与输入全转 fp64，forward hook 对中游 residual 加 1e-9 扰动——当前实现下响应被 fp32 softmax 路径湮灭，改 `dtype=query.dtype`（或 `promote_types(query.dtype, float32)`）即恢复。transformers 5.14.1 / PyTorch 2.13 CPU 复现。'
  source: 'huggingface/transformers #48459（2026-09-01 open，含最小复现步骤、两种修复写法与数值证据）。https://github.com/huggingface/transformers/issues/48459'
  behavior: 无 crash、无 NaN——fp64 推理实际只达到 fp32 分辨率；小扰动敏感性实验（扰动响应检验）静默失败、fp64 参考实现的"金标准"地位失真。属「**硬编码中间 dtype 对高精度调用方静默降级**」：4.2（tf32 乘法截断）的镜像形态，故障在 softmax 而非 matmul、方向向下而非向上。
  trigger_surface: transformers GPT-NeoX eager attention + torch.float64 模型（config 即触发）
  discovery: 2026-09-02 每日扫描。
