  meta: '`infra_off`（`--structured-outputs-config {"backend": "guidance"}` 下任何产生结构性标签的 tool-calling 请求在**首 token 前**被拒：`VLLMValidationError: Invalid grammar specification: ''triggers''`（llguidance 拒绝 vLLM 传入的 tool-call schema 键）——`tool_choice=auto`+`strict:true`（pydantic-ai 默认）、`required`、named choice 全部 400/流内 error；模型/GPU/流量无关（请求验证期触发），v0.28.0 官方镜像与 nightly 同坏） · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: vLLM 组装的 tool-call grammar 词汇（含 `triggers` 结构标签）与 llguidance 1.7.6 的 schema 理解不匹配——服务栈与 grammar 引擎之间的接口版本漂移；llguidance 对未知顶层键 KeyError 被包装为 ValidationError 向客户端透出。fail-loud 但发生在请求级，服务本身存活。
  source: 'vLLM #55152（2026-09-03 open，v0.28.0（llguidance 1.7.6/xgrammar 0.2.3）+ nightly 双确认，触发条件矩阵）。https://github.com/vllm-project/vllm/issues/55152'
  behavior: tool-calling 请求 100% 拒绝（HTTP 400 / 流内 error）——非静默，但**破坏面取决于客户端习惯**：pydantic-ai 等默认 `strict:true` 的 SDK 用户全坏，裸 `auto` 无 strict 用户无感——同一配置"有人全坏有人全好"的分裂式故障显形。与 10.46（tool_choice=none 吃 content）同为 tool 协议装配域，本条在 grammar 引擎接口层。
  trigger_surface: vLLM + guidance 结构化输出后端 + 任何 strict/required/named tool_choice（config+请求组合触发）
