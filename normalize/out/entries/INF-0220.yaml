  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（ttnn.add/subtract/multiply **带融合激活**在两个操作数 dtype 不一致（如 fp32×bf16、bf16×fp8_b）时返回无效结果，而混合浮点 dtype 本应是受支持的组合。损坏形似**位域旋转**：z=−1000（bf16 0x447A）的 abs 返回 0x3D44——结果指数域是输入的低字节、尾数域是高字节去掉最高位，指向 unpack 阶段以错误 DataFormat 解包。差异/1024 计量：同 dtype 0 错，fp32×bf16 1008、fp8_b×fp32 1012、bf16×fp8_b 659——几乎全错） · Cov: `var:ttmetal_matmul_fused_activation_param_assembly_errors`（1.170 融合激活参数装配错族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 融合激活路径的第二个操作数直送 unpack 时未按其真实 dtype 编码解包格式（dtype 元数据只沿主操作数传播），激活子序列消费的位流按错误宽度/格式重解释——指数/尾域错位即位旋转形态。
  source: 'tt-metal #56738（2026-09-16 open，bug + op_cat:eltwise，含八组 dtype 矩阵差异表与位域旋转分析、最小复现脚本）。https://github.com/tenstorrent/tt-metal/issues/56738'
  behavior: 无 crash、无 NaN——输出为量级貌似合理的错值（位旋转后的浮点仍有限），等价的"先乘后单独激活"两步调用完全正确，使缺陷只在融合路径显形；下游把融合激活当纯优化替换时静默中招。1.170（融合激活参数装配错 + 容差掩护）之后融合路径族新成员：本条在**双操作数 dtype 混合**维度、签名是位域旋转。
