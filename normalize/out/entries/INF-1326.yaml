  signature: '`o_proj` 输入的头/seq 轴被转置，属 infra_off。与 K10.14 同族但注入点在**注意力输出侧**而非 KV 存储侧，因此签名集中在 `o_proj` 之后的残差流：geometric 与 statistical 在该层输出上强响应，trajectory 呈 STEP；spectral 可见输出协方差结构被置换。若上下游恰好 `H == M`，无任何形状告警可依赖，只能靠隐藏态度量。'
  repro: partial——在 `self_attn` 输出钩子上做 `y.transpose(1, 2).contiguous().view(y.shape)`（头/seq 轴互换后按原形状重读），再交给 `o_proj`；FlashInfer 块稀疏 wrapper 本身需 FlashInfer 栈复现。
