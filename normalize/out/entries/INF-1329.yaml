  meta: '`ambiguous` · Cov: `NEW` · 触发 `yes` · 置信度 `documented`'
  mechanism: SepLLM 把每个段落凝缩为其尾部的**分隔符** token；若复用了错误 tokenizer 的分隔符 id 列表，或输入本身分隔符稀疏（代码 / CJK / base64），某个段落就会没有任何被保留的分隔符。窗口溢出时该段落被整体丢弃且不留摘要——不是被压缩，而是彻底消失。
  source: arXiv:2412.12094（ICML'25）。
  behavior: 模型表现得像 prompt 中间那一段从未出现过，在分隔符稀疏的输入（代码、中文、base64）上尤其容易触发。
  trigger_surface: 原可复现；CUDA+vLLM 下仍可软件构造
  signature: 受输入分隔符密度与 tokenizer 匹配度门控，属 ambiguous。签名是**覆盖空洞**：`past_key_values` 长度远远坍缩到预算之下，序列中段注意力质量约 0，而存活 KV 的范数完全不变——**是缺失，而非扰动**。这使 geometric/spectral 这类"流形距离"度量系统性漏检（残存状态本身健康、在流形上），必须靠 statistical（注意力质量分布、cache 长度）与 cheap 族的结构性监控（缓存长度 vs 预期长度）来看见。
  repro: 不运行 SepLLM 的压缩，而是 prefill 后一次性从**每一层**移除连续位置区间 `[floor(seg_start_frac*T), floor(seg_end_frac*T))`（必须跨层一致：解码 mask 只从第 0 层的长度构造一次）。签名包含覆盖空洞 / cache 长度坍缩，外加随之而来的位置移动（下一个解码 token 的 position_ids 变为**收缩后**的长度，所有存活的区间之后位置相对查询也被重新索引）。钩子挂在最后一个 decoder 层（此时所有层都已写入 prefill 行）。
  locus: eviction-compression
  priority: high
