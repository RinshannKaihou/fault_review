  mechanism: Landmark / InfLLM 类的块检索用块内代表元（representative）估计块的相关性；代表元选得差（例如被高范数的 sink token 主导）会导致选到错误的块、或直接漏掉包含答案的 needle 块。此外，对所有块共享的均匀块距离还会错误地偏移 RoPE。
  source: arXiv:2305.16300 / 2402.04617。
  behavior: 长上下文检索任务上偶发性地"找不到"明明存在的答案，而对同一文档的其他问题正常。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: 由 needle 位置与代表元质量门控，属 ambiguous。签名是**真实块尽管持有答案却排在 top-k 之下**——这仍是"缺失"类：被漏检块的 KV 从未参与注意力。statistical（注意力质量分布 vs 全量参照）与 infotheoretic 可见；geometric/spectral 因参与计算的表示自洽而漏检。附带的均匀块距离 RoPE 偏移则是位置类扰动，trajectory 在块边界处可见。
  repro: partial——按固定块大小分块，用每块首 token 作代表元算相关性并只保留 top-k 块参与注意力（其余屏蔽），故意让高范数 sink 块占据名额；Landmark/InfLLM 的训练式检索头不复现。
  locus: eviction-compression
  priority: low
