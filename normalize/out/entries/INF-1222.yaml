  meta: '`model_on` · Cov: `NEW` · 触发 `n/a` · 置信度 `verified`'
  mechanism: 模型未能遵守一条显式的指令／约束（长度、措辞、格式、否定），要么从一开始就忽略，要么在长 CoT 生成过程中逐步漂移丢失该约束。故障发生在表示层的衰减上，权重与 kernel 全部健康。
  source: Zhou et al. IFEval；Dong et al. ACL 2026 (arXiv:2512.14754)；Zhu et al. ReasonIF arXiv:2510.15211；Li & Yu, "When Thinking Fails", NeurIPS 2025 (arXiv:2505.11423)。源文档未给出 URL。
  behavior: 输出长度／格式错误、指定措辞缺失、否定式要求被无视、约束在生成中途被放弃。
  trigger_surface: 能力/幻觉评测条件，非模型变更
  signature: ON-manifold。签名属 trajectory 族：约束的表示在早层是存在的，随层数／生成步数逐渐衰减；跨层的 attention／轨迹探针（追踪约束 token 的影响力）能捕到这段衰减。单层快照的 geometric 族看不到（每一层单独看都在流形上），必须跨层做差分；cheap 族无信号。
  repro: promptset-only，无模型改动、无新度量代码。用指令约束提示集按约束满足与否打标，签名度量直接复用既有 trajectory 族的 `layerwise_cosine_drift`。
