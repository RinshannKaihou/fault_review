  behavior: 偏好对 prompt 边界系统性错位：本该属于条件的末轮消息进了两个 completion，DPO 在错位的对比目标上训练，无 crash 无 NaN。与 SFT.06（截断内生造 identical pair）互补——同属 SFT.04 现象族的**变换内生**生成路径：这条收「前缀包含/相同」输入下 split 算术的 off-by-one。
