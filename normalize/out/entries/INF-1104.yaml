  meta: '`infra_off`（SGLang main（#39574 `0dabef3d30` 起）EAGLE 推测解码 + 专家并行：draft 批到达 `ForwardBatch.init_new` 时 `input_ids is None`（scheduler 在 init_new 之后重建），`num_tokens` 推导为 **0 而非 None** → `global_num_token_non_padded` 变成"活的 0" → padded-region mask 以 0 计数武装，把 **draft 批每个 topk id 置 -1**；`StandardDispatcher.dispatch` 在 `-1` drop 检查**之前**执行 `local_expert_mapping[topk_ids]`——PyTorch 负索引回绕取表尾，末 EP rank 上 `mapping[-1]==mapping[287]==71` 是**真实本地专家**（rank 0–2 的 -1 良性恰掩埋缺陷）→ 整批行灌入专家 71：`masked_m[71]=384 > m_max=256`、`src2dst=[18176,18559]` 越 `72*256=18432` 区域 **OOB 写**。Eager：`cudaErrorIllegalAddress`（coredump 指 `fill_gateup_input_triton_kernel`，bounded 后腐蚀顺移到 `silu_mul_quant_varlen_kernel`）；**CUDA graph：无 crash——部分在途请求 `spec_accept_rate=0.00` + `!!!!!` 垃圾洪泛至 token 上限**，期间新准入请求健康（腐蚀是每请求持久状态）；关 overlap scheduler 或 `CUDA_LAUNCH_BLOCKING=1` 即消失。GLM-5.3-Flash（288 专家 top-8，ep_size=4×H20、EAGLE topk=1/3 draft steps）48 并发 ~8k 生成可靠复现） · Cov: `NEW`（计数哨兵 0/None 语义混用 × 负索引回绕先于 drop 检查的复合子签名） · 触发 `config` · 置信度 `verified`'
  mechanism: 三层小错叠加——(1) `len(input_ids) if input_ids is not None else 0` 把"未知"折叠为"零"；(2) mask 以活计数 0 把全部行判为 padding 置 -1；(3) dispatch 顺序（映射先于 drop 检查）让 -1 经 PyTorch 负索引语义变成合法表尾专家 id。任何一层单独正确即不触发。
  source: 'SGLang #40156（2026-09-18 open，含四步行号级调用链、masked_m/src2dst/cap 数值证据、eager vs CUDA graph 双形态对照、48 并发复现配置与无服务器聚焦 repro 设计）。https://github.com/sgl-project/sglang/issues/40156'
  behavior: 双形态——eager：`cudaErrorIllegalAddress` crash；CUDA graph：**静默腐蚀**（accept_rate 塌 0、`!` 洪泛垃圾输出、per-request 持久）。11.20（DSpark large decode CUDA graph 非确定 IMA）与 6.233（padded 行流入 topk 路由 IMA）之后 spec×MoE 路由族新成员：本条在 **draft 批计数哨兵 × 负索引专家映射**维度——CUDA graph 把 OOB 写从 crash 降级为静默垃圾。
  trigger_surface: SGLang main≥#39574 + EAGLE spec + 专家并行（末 EP rank）+ overlap scheduler + CUDA graph + 高并发长生成（config：默认组合触发）
