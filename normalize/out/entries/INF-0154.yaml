  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.hardswish_bw` 两处边界比较相对 torch 参考全部**反向**：ttnn 在 −3 用 `<`（torch `<=`）、在 +3 用 `<=`（torch `<`）——恰在 x=±3（bf16 精确、激活张量常见值）走错分支，x=−3 处梯度连符号都错（返回 −0.4999 应为 0）；同行第二缺陷：斜率常数 `0.3333f` 而前向 kernel 用正确舍入的 1/3——fp32 下全域 (−3,3) 损失 336–2097 ULP，x=2.5 返回 1.33325（应 1.3333333）） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`unary_backward.cpp` 的嵌套 where 以 `lt(input,-3)/le(input,3)` 分支——与 aten 参考内核的 `<=`/`<` 逐边相反；注册 golden 是 torch autograd，op 与自己的 golden 在 ±3 分歧。nightly 用 uniform(−100,100) + PCC：320×384 张量中两条错 lane 推不动 PCC——**测试分布盲区**放行边界 bug（与 1.139 的 PCC 分布盲区同方法论警示）。'
  source: 'tt-metal #55291（2026-09-03 closed，torch autograd 对照表 + 源级 where 链分析）。https://github.com/tenstorrent/tt-metal/issues/55291'
  behavior: 无 crash——±3 精确命中处梯度错（含符号翻转）+ 全域小数点级偏差；hardswish 是常见激活，边界值命中非罕见。与 1.152/1.153 同「与 torch 参考的边界/分支语义错配」域，本条是**比较方向反置**形态。
  trigger_surface: Tenstorrent WH/BH + `ttnn.hardswish_bw` + x=±3 精确值或任意 (−3,3) 值（软件 API 可触发）
  discovery: 2026-09-03 每日扫描。
