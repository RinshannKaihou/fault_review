  meta: '`model_on`（SGLang DeepSeek-V4 SM120/121 decode 把 q 无条件 pad 到 64 头（历史 SM90 FlashMLA `{64,128}` 特化约束），但 SM120 路径的 FlashInfer `sparse_mla_sm120` 分派表实际覆盖 `(16,512)`——移除 pad 是 0.50% decode 步的正当优化。**不可解释的观察**：移除后端到端 greedy 输出可复现地改变（两个未打补丁 boot 4/4 一致 vs 打补丁 1/4 一致），而内核隔离 A/B **bit-identical**（0/49152 元素差；填充头灌随机值亦不泄漏进真实头、chunks_per_block 1–10 与 attn_sink 三配置全同）、kernel inventory diff 0/299 共享条目——输出变化来源无法定位。代码内注释自认"内核读所有 padded 头；未初始化值可影响 real-head 输出"，与 bit-identical 证据矛盾。4×GB10 TP4 稳态确定性复现） · Cov: `NEW`（配置敏感性噪声底：端到端确定性改变但逐级对照全零差异子签名） · 触发 `hw_specific` · 置信度 `speculative`'
  mechanism: 未定位。pad 头数影响某处未知的执行路径选择（候选：autotune 状态、kernel 变体选择、q buffer 分配/初始化路径）；内核本身被排除。
  source: 'SGLang #39235（2026-09-12 open，含双 boot 稳态对照、49152 元素 bit-identical 隔离实验、0/299 kernel inventory diff 与生产 trace 计时）。https://github.com/sgl-project/sglang/issues/39235'
  behavior: 无 crash、无 NaN——greedy（temperature=0）输出在补丁前后确定性分歧；报告者以 4/4 一致的双 boot 噪声底证明非随机性。4.12（VLM greedy 跨 build near-tie 翻转）之后"确定性输出在配置微扰下改变"噪声底族新成员：本条的特殊性在于**逐级对照全部无法解释端到端分歧**——正是注入实验（同型微扰 → 观察输出轴）的现成现实样本。
