original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（"看起来在流形上"的典型硬案例） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 硅缺陷 / wear-out 型 SDC，在 attention/GEMM 的重计算过程中产生一个**错误但有界**（不是 NaN）的数值。它是 data-dependent 的，只在特定操作数模式下触发，且错误值始终停留在 fp32 可表示范围内。带有该缺陷的设备可以连续数月通过各类检查而不被发现。本条为 MERGED 条目，合并了三个子故障：（a）bounded/wear-out SDC；（b）"corrupted gradient variance"；（c）thesis blind-spot companion（作为课题盲区的对照样本）。
  source: Meta Engineering, "How Meta keeps its AI hardware reliable"（2025-07-22），https://engineering.fb.com/2025/07/22/data-infrastructure/how-meta-keeps-its-ai-hardware-reliable/ （"~1 fault per thousand devices"）。Dixit arXiv:2102.11245 ；Hochschild HotOS 2021。
  behavior: 一个细微错误/漂移的 token，无 NaN、无崩溃、无任何错误信号。
  trigger_surface: 梯度幅度相关 SDC 描述偏训练；推理侧可用幅度相关 hook 近似
  signature: '**本项目最硬的案例**——虽属 off-manifold，但幅度低且有界，靠 cheap 类度量可能与 model_on 的量化/幻觉**无法区分**。假设：需要 spectral / infotheoretic 度量再叠加多 token trajectory；whole-block 的 geometric 离群度可能接近无信号。它是 `bug_perfect_disguise` 在 infra 轴上的对应物（companion）。'
  repro: 仅能部分复现——施加**低幅度、有界**的扰动，并挂上 data-dependent 触发条件；难点在于让扰动幅度低到贴近噪声底（运行时噪声底量级之上但远小于 spike；噪声底需在目标栈实测）同时仍改变输出。
