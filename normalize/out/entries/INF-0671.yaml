  meta: '`infra_off`（SM90/SM120 `trtllm_fmha_v2_prefill` 把 tile_id_counter（ctas_per_head>1 时含 barrier/lock counters）放在 `workspace_buffer` 开头，launch 前 memset 清零但内核原子递增后**留下非零值**；`trtllm_batch_decode_with_kv_cache`（XQA）把同一 workspace 前 8 MB 当"必须零初始化"的 semaphore 区——**同引擎共享 workspace 时每次 prefill 后的首个 decode 静默产生错误注意力输出**。SGLang 已 workaround（给 fmha_v2 传 `workspace[8MB:]` 切片）；vLLM 侧共享 workspace 的 trtllm 路径同暴露） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: 两个内核族对同一缓冲区的初始化契约相反（一个"离开时非零"、一个"进入时必须零"），共享 workspace 的服务引擎默认组合即触发。
  source: 'flashinfer #6151（2026-10-06 open，`fmha_v2_run.cu`/`decode.py` 逐行定位 + H200 独立 repro）。https://github.com/flashinfer-ai/flashinfer/issues/6151'
  behavior: 无 crash——prefill 后首个 decode 注意力输出静默错误。
