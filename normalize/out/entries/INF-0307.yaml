  meta: '`infra_off`（GDB 驱动、目标二进制上直接注入累积权重位翻转的 per-layer 故障谱 profiler） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: SPINE 把累积（cumulative）权重位翻转经 GDB 直接注入 edge CPU 上运行的目标推理二进制（无需重训、无需改码），生成 per-layer 故障谱。跨越多种拓扑、量化力度与内存布局评估，指出量化网络权重在推理期间持续暴露于辐射诱发位翻转，并据此推导选择性加固（selective hardening）策略。
  source: 'arxiv 2606.19526 "SPINE: A Fault Injection Profiler for Quantized Neural Networks under Accumulated Faults"（2026-06-17）。https://arxiv.org/abs/2606.19526'
  behavior: 无 crash（故障注入方法学论文）。贡献在于**累积翻转 × 真实内存布局**的 per-layer 敏感度刻画——现有研究多用单次翻转 + 理想化布局，SPINE 补上「累积扰动如何映射为误预测」。为量化模型的 SDC/BFA 加固与分层保护优先级提供依据。属「二进制级累积故障注入 profiling」**新子签名**（方法论条目，与 3.8 UEP 图谱互补：一个给敏感度、一个给累积映射）。
