  meta: 'stage: `pretrain/shared` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 生产集群里被自动化清扫出的「不健康节点」仍能跑完 step。用 XLA 确定性执行 + 同步机制，把 SDC 隔离到子模块计算、单次 optimizer step、一段训练窗口三个尺度。多数节点上子模块/梯度扰动相对小，但足以把模型推进**另一个局部最优**（权重轨迹分叉）；部分节点会打出 loss spike。
  source: Ma, Pei, Lausen, Karypis, "Understanding Silent Data Corruption in LLM Training", ACL 2025 / arXiv:2502.12340。https://arxiv.org/abs/2502.12340
  behavior: 无 Xid、无 NaN 也能训下去。最终 ckpt 与健康节点同配置不同权重；微调阶段可见不同幅度的 loss spike。ABFT 对 GEMM 的覆盖在该研究中大多失败——故障往往不在矩阵乘单元。
  discovery: 2026-08-17 基础调研
