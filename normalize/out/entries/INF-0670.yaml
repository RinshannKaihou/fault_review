  meta: '`infra_off`（NVFP4 KV + `--enable-hierarchical-cache --hicache-io-backend kernel --hicache-write-policy write_through`：host pool 行几何按 device **元素**数而非字节数计算（NVFP4 device 行 packed 2 元素/字节）——大常驻前缀逐出到 L2 host 池再回载后 **spec decode 静默永久失效**：`spec_accept_length` 钉 1.00（健康 2.0–3.0）、target 输出字节精确正确只有恢复的 draft KV 是垃圾、吞吐反降 25%（draft 税零收益）、`/flush_cache` 不恢复、仅重启可愈。生产 3h 常规流量触发（137k-token 请求推池至 0.86）+ cycle 0 确定性 3/3 复现；on-engine 探针 + 离线字节精确合成定罪） · Cov: `NEW` · 触发 `config` · 置信度 `verified`'
  mechanism: '`pool_host/mha.py` 以 device 元素计数推 host 行数，无 FP4-aware host pool；回载块几何错位使 draft KV 全坏而 target 校验掩盖。'
