  section: 第 6 类 · 服务栈 / 缓存正确性（vLLM/TGI/SGLang/TRT-LLM）
  meta: '`infra_off`（GLM-5.3-Flash W4A16（B300 TP1、~372k 上下文、reasoning_effort=max + 原生工具调用多 agent 负载）：长会话中段突然崩塌为重复低熵输出（`= = = =` / `.0.0.0.0.`），坏输出已在 raw vLLM SSE 中（非客户端重构）。隔离实验矩阵：MTP 开关无效、prefix cache 开关无效、H200/B300 双硬件同病、**SGLang 同病**（15–20 分钟后同类退化——栈无关）；决定性对照——(1) 失败请求冷重放健康（finish_reason=tool_calls 正常）；(2) 5 并发冷重放健康；(3) 顺序重放 76 个成功请求后第 77 个崩入 `.1.1.1.`→`.0.0.0.`；(4) 第 77 个单独冷重放健康；(5) 前 76 个仅 prefill 预热（~2.76M prompt token、仅 76 decode token）后第 77 个**健康**——触发条件是**累计 decode/reasoning token 深度**（76 请求完整 decode），非 prompt 累计、非上下文窗口、非 KV 复用。已排除并回退测试：历史 reasoning 注入（471k 字符清理后缓解但复发）、content:null 归一化、PR #56635/b150783） · Cov: `NEW`（累计 decode 深度依赖的迟发退化子签名：prefill 深度被实验排除、decode 深度独占触发） · 触发 `other_stack` · 置信度 `documented`'
  mechanism: 未定位（报告者实验收窄到"跨请求累计 decode/reasoning token 量"这一单一变量）。候选方向（vLLM/SGLang 双栈同病指向模型无关的公共层或模型本身）：KV/RoPE 位置相关的慢漂移、采样/温度调度状态、量化 W4A16 激活分布漂移、或模型在长 reasoning 累计后的固有行为；prefill-only 2.76M token 不触发排除单纯 token 吞吐。
  source: 'vLLM #56868（2026-09-14 open，bug+tool-calling+quantization+glm label，含五组重放对照矩阵、SSE 原始证据与三项已排除修复）。https://github.com/vllm-project/vllm/issues/56868'
  behavior: 无 crash、无 NaN——运行数分钟至数十分钟后突发重复 token 崩塌并卡死在 reasoning 内（不再发出 tool call），会话不可恢复；负载强依赖（长 reasoning agent 场景）。10.62（GLM-5.3-Flash reasoning 退出 tool-call token bleed）与 4.20（SM120 配置敏感性噪声底）之后 GLM-5.3-Flash 退化族新成员：本条在**跨请求累计 decode 深度**维度、双栈复现。
  trigger_surface: vLLM/SGLang + GLM-5.3-Flash（W4A16）+ 长 reasoning 累计 decode 负载（other_stack：双栈 + 模型侧候选）
