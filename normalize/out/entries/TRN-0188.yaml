original:
  category: SFT
  section: SFT
  meta: 'stage: `sft/rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: trl 各 trainer 以字符串 model id + `model_init_kwargs.revision` 加载时，模型按指定 revision 取权重，自动创建的 `processing_class` 却走 `AutoProcessor.from_pretrained(get_config_model_id(model.config))` **不带 revision**——从仓库默认 revision 拉 tokenizer/chat template。同一 trainer 内权重与模板来自不同 revision；同一模式存在于 stable DPO/GRPO/KTO/RLOO/SFT/Distillation trainer。
  source: 'trl #6974（GRPOTrainer 等价代码 + 复现形状；修复 PR #6978 转发 revision 至全部 stable + experimental trainer（含 Reward），逐 trainer 加 `test_init_auto_processing_class_uses_model_revision` 回归）。https://github.com/huggingface/trl/issues/6974 ；verl 实例（2026-09-04 补）：PR #7658——student/teacher Hub id 不 pin revision 时随 `main` 漂移，家族（Gemma-4）在 `main` 上移动 tokenizer/`generation_config` 后两边加载不同 snapshot 训练即坏；修复 = `HFModelConfig`/teacher config 加 `revision` 并贯穿 tokenizer/processor/`AutoConfig`/`generation_config`/FSDP/vLLM/reward tokenizer。https://github.com/verl-project/verl/pull/7658'
  behavior: checkpoint revision 的 chat template 与默认 revision 不同时（模板修复后的 fork/发布 revision 常见），训练全程用错模板格式化对话——这是 SFT.01（训服模板错位）的**加载侧生成机制**：不是人配错，是「按 revision 取权重」与「按默认取模板」两条加载路径静默分叉。无任何警告；显式传 `processing_class` 才能绕开。
  discovery: 2026-08-30 每日扫描
