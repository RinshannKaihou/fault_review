  meta: '`infra_off`（**验证面失效**：`ttnn/ttnn/operations/reduction.py` 的 `_create_golden_function` 工厂 `def golden_function(input_tensor, dim=None, keepdim=False, **_)` 把 `scalar=` kwarg 吸进 `**_` 从不转发给 torch 函数——golden 计算**未缩放**归约、设备计算缩放归约，参考最高偏差 **300%** 而 **PCC 恒 1.0**。`scalar` 是活的文档化参数（`generic_reductions_nanobind.hpp:56` "A scaling factor to be applied...Defaults to 1.0"、:179 及 `std_var_reductions_nanobind.cpp:82,97` 的 `nb::arg("scalar")=1.0f`；对照 `correction` 才是显式弃用参数）。一个工厂签名缺陷同时污染 **ttnn.sum/mean/max/min/std/var 六个 op** 的参考实现） · Cov: `var:ttmetal_is_real_is_imag_goldens_call_nonexistent_torch_api`（1.180 验证层失效族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: golden 生成工厂的签名是参数白名单，`**_` 兜底使工厂覆盖的每个 op 新增参数都自动落入"参考不消费"陷阱——签名漂移被吞而非报错。缩放因子是纯乘性偏差，PCC（皮尔逊相关）对整体缩放不变，故 1.0 恒过。
  source: 'tt-metal #57115（2026-09-20 open，"Bad Outputs"，含工厂源码、六 op nanobind 声明对照与 deprecated-参数反例）。https://github.com/tenstorrent/tt-metal/issues/57115'
  behavior: 无 crash——六 op 的 scalar 语义（含设备侧未来回归）完全脱离验证覆盖；PCC=1.0 与 300% 偏差并存说明**相关性类门禁不能单独承担参考正确性验证**。1.233（单 op 手写 golden）与本条（工厂批量放大）构成 golden kwargs 吞噬姊妹对；与 1.105（comp_pcc 常量回退容差假阳性）同属"门禁恒绿"失效方向。
  trigger_surface: tt-metal sweep/CI + 任何带 `scalar=` 的六归约调用（hw_specific：CI 门失效）
  discovery: 2026-09-20 每日扫描。
