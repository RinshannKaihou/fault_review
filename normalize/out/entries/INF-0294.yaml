  meta: '`infra_off` · Cov: `var:3.19` · 触发 `no` · 置信度 `verified`'
  mechanism: 以极高频率反复"锤击"（hammer）某一 GDDR6 行会引发电磁耦合，从而翻转**相邻行**中的 bit。GPUHammer 在一块 A6000 上跨 **4 个 bank** 翻转了多达 **8 个 bit**，对被针对的 ML 权重造成最高 **80%** 的准确率下降。**同样的连续权重行（contiguous-weight-row）签名**也会由 HBM 备用行 / row-remap 池耗尽（Xid 63，wear-out）产生。本条为 MERGED 条目，合并了两个子故障：（a）GPUHammer（主动 rowhammer 攻击）；（b）HBM spare-row / row-remap exhaustion twin（磨损老化导致的同形态孪生故障）。
  source: 'Lin, Qu, Saileshwar, "GPUHammer: Rowhammer Attacks on GPU Memories are Practical", USENIX Security 2025, https://www.usenix.org/conference/usenixsecurity25/presentation/lin-shaopeng （arXiv:2507.08166）。NVIDIA Security Notice a_id 5671（2025 年 7 月）。磨损孪生：Cui et al. arXiv:2503.11901。'
  behavior: '**持久性、成簇**的权重损坏：某个 projection 的若干**相邻权重行**上有多个 bit 被翻转。后果范围从静默的细微偏置一直到灾难性失效（若命中指数位则产生 NaN）。'
  trigger_surface: Rowhammer 真实攻击；软件 bitflip 只是代理
  signature: off-manifold，且是**持久的**、**空间成簇的**（连续权重行 → 相邻输出通道）。per-channel 的 geometric/spectral 度量会看到一个**多通道相关偏置**，这是单点 `weight_bitflip` 所没有的；空间连续性成簇正是本条相对已有覆盖的新增贡献。trajectory 类度量因为损坏在所有 token 上恒定存在而信号偏弱。
  repro: 直接在某个 Linear 权重的**一段连续行切片**内翻转若干个 bit（持久修改权重，而非 forward hook）。
