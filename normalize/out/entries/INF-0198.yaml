original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（Triton gfx942（MI300X）block-pingpong 两 cluster 调度竞态 LDS：`s_barrier` 发射在 `ds_read` 的 waitcnt **之前**，另一 warp group 的 stage j+1 `ds_write` 落进单级 LDS 缓冲 → 128×128 输出 tile 内 intra-tile 行 32–47 的 **4×32 列对齐 patch**（一个 v_mfma_f32_32x32x2_f32 累加器 sub-fragment）消费**下一个 k 步**的 A 操作数——B=identity、A[r,k]=1000r+k 探针下 100% 错误元素均为精确 `A[r, k+64]`（+BLOCK_K）偏移、从非行偏移非垃圾；fp32 matmul BLOCK_M=128/N=128/K=64、num_warps=8、num_stages=2 配置 200/200 迭代错，`TRITON_HIP_USE_BLOCK_PINGPONG=0` 后 0/200；gfx950（async-copy 路径）不触发；PyTorch inductor max-autotune MI300 CI 验证 500/500 失败） · Cov: `var:ttmetal_sdpa_decode_mask_seed_scalar_store_no_drain_race`（1.9 存储/等待链同步缺失族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 调度器发射 `s_barrier` 时未先等待本组 `ds_read2` 完成——另一组对同一单级 LDS 缓冲的下一 stage 写入与本组未完成的读竞争。是否**观察到**错误取决于指令排布：失败变体在 barrier 前背靠背发射 stage 的 ds_read2 块，通过变体在 read 间交错指针递增 VALU（减少未决读）——缺失的 wait 是两者共同的 bug，间距只决定是否显形（tutorial 式 matmul 同配置 0/200 通过）。
  source: 'triton #11696（2026-09-10 open，含 identity 探针的 +BLOCK_K 偏移证明、inductor CI 1377 失败迭代/1312 错元素统计与开关对照）。https://github.com/triton-lang/triton/issues/11696'
  behavior: 无 crash——fp32 matmul 静默错值（4×32 patch、值错至 ~8 量级 on N(0,16) 尺度输入）；在 PyTorch 生态以"inductor max-autotune 验证 flaky 失败"形态浮出。1.121（sdpa_decode mask seed store 无 drain 竞态）之后"写后读同步缺失"族新成员：本条在 AMD 后端调度器代码生成维度、且错误值有确定性结构（下一步操作数）。
  trigger_surface: Triton AMD gfx942 + block-pingpong 调度 + LDS 单级缓冲 matmul 类内核（hw_specific）
