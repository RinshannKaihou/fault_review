original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（tensor-scalar 比较 kernel（2023 年形式）是 lt/gt 的逐 lane 补码——`ge(x,s)=1-lt(x,s)` 按构造成立，原理上无法实现 IEEE NaN 语义；tensor-tensor 比较 kernel（2026 重写）已带显式 NaN 拒绝——同一 `ttnn.ge/le` 公共 op 两种重载走两代内核、语义分歧，heaviside 分支逻辑根本无法发出 NaN） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: '`calculate_unary_ge` 与 `calculate_unary_lt`（ckernel_sfpu_unary_comp.h，2023）评估同一谓词、返回相反常数（`v_if(v<s)` 分别置 0/1）——`ge == 1 - lt` 在每条 lane 按构造成立，对 NaN 输入两者都给出错误答案且互为补码；tensor-tensor 重载（2026）经 `calculate_binary_comp_fp32_weak_ordered` 已带显式 NaN 拒绝。同一公共 op `ttnn.ge(Tensor, float)` 与 `ttnn.ge(Tensor, Tensor)` 因此有两套 NaN 语义；heaviside 的分支逻辑同构、无法发出 NaN。Wormhole/Blackhole 上 scalar kernel 逐字节一致。'
  source: 'tt-metal #54447（2026-08-26 open，含 binary.cpp/unary.cpp/comp.h 精确行号与两代 kernel 对照）。https://github.com/tenstorrent/tt-metal/issues/54447'
  behavior: 无 crash。NaN 输入下 scalar 重载静默给出非 IEEE 结果（比较结果随实现形式翻转），数值管线中 NaN 掩码/过滤逻辑在两种重载间不一致——同 op 跨重载语义分歧是难以通过单点测试发现的静默正确性坑。属「**同名 op 跨重载代次语义分歧**」新子签名。
  trigger_surface: Tenstorrent Wormhole/Blackhole；`ttnn.ge/le` tensor-scalar 重载 + 含 NaN 输入（软件 API 层可触发）
