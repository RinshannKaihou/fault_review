  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: RLVR 用自动 verifier 给组内多条 completion 打分，GRPO advantage 把这些分数当**独立测量**做组内中心化——但同一 verifier 对同一 prompt 的组内错误是**相关的**（答案形式聚类：fraction/radical/symbolic/interval 错成一片，unit/percent 较轻）。24,998 组 × 8 completions（Qwen2.5-1.5B，MATH/GSM8K/DeepMath-103K）实测组内 verifier 错误相关 ρ=0.530（95% CI 0.500-0.560）：可交换误差模型下 8 样本组的设计效应把有效样本量压到 **1.70**——组内基线（GRPO 的方差归一分母、leave-one-out 均值）建立在远比名义 n=8 弱的统计量上。跨四种 rule-based verifier 重放组相对 advantage：**至少一条 advantage 符号翻转**的组达 0.83%。
  source: arXiv:2609.06386（2026-09-06，"Are Verifier Errors Independent Within a GRPO Group? Evidence from Qwen2.5 Rollouts"）。https://arxiv.org/abs/2609.06386
  behavior: 无 crash、无 NaN；reward 与训练指标一切正常。低烈度但系统性的方向污染：符号翻转的 advantage 把策略往 verifier 错判的方向推，且组内相关使「多采样平均」的去噪效率比名义低约 4.7×。与 RL-RWD.03（RM 过优化）不同：错不在 reward 模型被钻、在**测量误差的组内结构**被组相对估计器假设掉；与 RL-ADV.08（guess 与 reasoning 同 advantage）互补：那边是 outcome 无法区分路径，这边是 outcome 本身带相关噪声。
  discovery: 2026-09-10 每日扫描
