  meta: '`infra_off`（xgrammar 后端下 `pattern` + `minLength` 同时出现时**长度界被静默丢弃**：`{"pattern":"^[a-z]+$","minLength":5}` 接受 `"ab"`（2 字符，违反 minLength）；`--grammar-backend outlines` 则保留长度界、丢 `pattern` 与数值界——**两个后端各丢不同的约束子集**；PR #28804 已确立"xgrammar 静默忽略部分 JSON schema 关键字并提议准入期拒绝"，本条是其未覆盖的新组合） · Cov: `var:vllm_legacy_guided_json_silently_dropped_unconstrained_200`（10.40 约束静默失效族） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: xgrammar 的 JSON schema→CFG 编译对 pattern/minLength 联合语义无完整支持，缺失时既不拒绝 schema 也不施加约束；outlines 后端的丢弃集互补（pattern+数值界）。fuzzer 发现、CPU 秒级复现（exit 1 = bug 存在）。
  source: 'SGLang #37707（2026-09-03 open，fuzzer 发现、xgrammar 最小复现脚本）。https://github.com/sgl-project/sglang/issues/37707'
  behavior: 无 crash——结构化输出静默违反声明的 schema 约束（接受过短字符串）；与 10.40（guided_json 整体丢弃）同签名不同粒度：本条是**约束的子集丢弃**（更难发现——多数字段仍被约束）。跨后端丢弃集不一致还意味着同一 schema 在不同 deployment 有不同语义。
  trigger_surface: SGLang + xgrammar/outlines 后端 + JSON schema 含 pattern+minLength（或 pattern+数值界）组合（config 触发）
