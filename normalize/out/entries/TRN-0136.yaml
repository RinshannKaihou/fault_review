  mechanism: 同一份训练脚本、同数据同种子，verl `v0.9.0` → `HEAD`（1dda039b）的 distillation loss 从 step 1 起静默分叉：多教师 OPD（GRPO + FSDP2 + vLLM rollout/teacher）在 NVIDIA B300 与寒武纪 MLU 两套硬件栈复现。本编目用 compare API 核对两 ref 间 40 个 ahead commit / 297 个变更文件：`examples/on_policy_distillation_trainer/` 下只有启动脚本（uv 包装，报告者经 `ray job submit` 绕开）变更，蒸馏数值路径的漂移藏在共有 trainer/数据/kernel 路径里，框架侧无 assert、无警告。把 KER.04 的「发行版升级 + 无 golden 对照」族推广到「框架 ref 漂移」向量：升级后不跑 step-1 parity 对照就只有「曲线看起来在训」。
  source: 'verl #7540（双硬件 A/B 复现脚本 + 曲线截图，0 评论未分诊；compare 核验见 `daily/raw/2026-08-26/issues/verl_compare_*.json`）。https://github.com/verl-project/verl/issues/7540 ；配置面线索（2026-08-30 补）：verl #7597——#7540 报告命令里嵌套 `actor.fsdp_config.strategy=fsdp2` 在 unmodified main 上被**静默丢弃**（请求 FSDP2、实际跑 FSDP1，effective 全部落 fsdp），A/B 两版本的有效引擎策略可能根本不同；#7597 使 `actor.strategy` 成为可执行真源并拒绝冲突嵌套值（该 PR 明确不主张解释 #7540 的 loss 分叉本身，蒸馏数值代码两版本间未变）。https://github.com/verl-project/verl/pull/7597'
  behavior: '`distillation/loss`、`teacher_mass`、`student_mass` 与基线版本自第一步起数值不一致，但全程有限、无 NaN、无 crash；root cause 尚未定位（issue 未分诊）。'
