original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（Tenstorrent sfpi ≥7.75.0 把 `vFloat == vFloat`（及 `!=`、`vFloat == 非零常量`）下推为**整数减法 + SFPSETCC LREG_EQ0**——谓词变成**位模式等同**而非 IEEE 754 相等：`NaN == NaN` 为 **true**、`x != x`（isnan 惯用法）为 **false**、`+0.0 == -0.0` 为 **false**。7.70.0–7.74.0 的旧下推是浮点减 + 同一 SETCC——NaN 判定恰好正确而 infinity 判定错误；**两种下推都不符合 IEEE**。行为在工具链 7.75.0 起翻转（逐版本 disassembly 核验 7.70→7.77 共 9 个 release，sha256 校验），Blackhole p150 与 Wormhole n300 硅片实测） · Cov: `NEW`（编译器 lowering 语义随版本摆动子签名） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 向量浮点比较被编译成整数域零值检测，符号位/NaN 载荷位参与"相等"判定；isnan 惯用法 `x != x` 编译通过、无警告、静默返回错误答案。工具链升级（7.74→7.75）即可让既有内核的 NaN 守卫语义**反转**——同一源码两个版本的二进制对 NaN 输入给出相反分支。
  source: 'tt-metal #56659（2026-09-15 open，含三表达式 × IEEE 对照表、9 版本 sfpi disassembly 溯源（7.75.0 build 915 为翻转点）与 BH/WH 双架构硅片验证；代码生成级复现无需设备）。https://github.com/tenstorrent/tt-metal/issues/56659'
  behavior: 无 crash——所有依赖 `==`/`!=`/自反性做 NaN/Inf 守卫的 SFPU 内核在 7.75.0+ 下**守卫方向翻转**（NaN 检测失效即 NaN 放行）或 ±0 等价性破裂；且错误方向取决于编译用的工具链版本，形成"同源码跨版本行为分歧"的静默面。1.109（比较器 NaN/±0 语义 dtype 分裂）与 1.151（argmax 比较器 NaN 语义）之后比较语义族新成员：本条缺陷在**编译器 lowering 层**、随工具链版本摆动。
