  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off`（BFA 家族 LLM 时代变体：.gguf 单文件量化权重的**单比特**翻转即可定向诱发三类语义级失败——事实错误/推理退化/生成有害内容，脆弱位可用敏感熵模型高效定位） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: LLM 蒸馏与 .gguf 单文件量化部署把权重空间暴露于前所未有的硬件攻击面（Rowhammer/BFA 可远程触发位翻转）。论文系统发现并验证主流开源模型（DeepSeek、Qwen 等）的 .gguf 量化权重中存在单比特脆弱位：翻转单个 bit 即可诱发三类定向语义失败——Artificial Flawed Intelligence（输出事实错误）、Artificial Weak Intelligence（逻辑推理能力退化）、Artificial Bad Intelligence（生成有害内容）。通过信息论权重敏感熵模型 + BitSifter 概率启发式扫描框架，可在数亿参数模型中高效定位关键脆弱位（脆弱性显著集中于特定 tensor）。
  source: arXiv:2510.00490 "Has the Two-Decade-Old Prophecy Come True? Artificial Bad Intelligence Triggered by Merely a Single-Bit Flip in Large Language Models"（2025-10-01）。https://arxiv.org/abs/2510.00490
  behavior: 无 crash、无 NaN——翻转后模型正常服务但语义被定向操纵，输出层面与普通幻觉/能力退化不可区分，诊断需权重位级比对。比 NaN 型 BFA 更隐蔽：攻击效果停留在语义层。与 3.6（BFA progressive sign/exponent）同族但目标位是"语义敏感位"而非"数值破坏位"。
  trigger_surface: '.gguf 量化权重文件 + 单 bit 翻转（BitSifter 定位敏感位后可确定性注入；var: 亦适用 bf16/safetensors 权重的敏感位扫描思路）'
  discovery: 2026-08-20 每日扫描。
