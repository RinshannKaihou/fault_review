  meta: '`infra_off`（vLLM CPU 构建（`VLLM_TARGET_DEVICE=cpu`，`HAS_TRITON` true 走 triton-cpu 3.8.0）`apply_top_k_top_p_triton` 可**丢 top-p 必须保留的 token**（精确参照 `apply_top_k_top_p_pytorch` 对照：8-token 行 token 6 携 7.5% 概率质量被丢、行和 0.925<0.95；400 shuffled Zipf 行 400/400 kept-set 不同；514,800 seeded 行扫描 V≤4096 时 0–4% 行差、k=3/p=0.9 时单个被丢 token 携 1.3–11.5% 质量）。**到达引擎**：tiny Llama+自定义 logits processor，4000 单 token 请求 token 6 采样数 V2=0/V1=0（top_p=0.95）vs 精确分布 ~300（top_p=1.0 时 278/328 正常）。既有测试只比 kept 计数不比 kept 集合且 V≥1024） · Cov: `NEW`（top-p 截断内核边界条件错子签名） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: triton top-p 累计质量边界的包含性判断错（见 issue Cause 节）。
