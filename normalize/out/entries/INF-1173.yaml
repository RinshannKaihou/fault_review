  meta: '`ambiguous` · Cov: `NEW` · 触发 `yes` · 置信度 `documented`'
  source: Shazeer arXiv:2002.05202（SwiGLU）。
  behavior: 源文档把行为效应与签名合并描述 —— 若替换在结构上差异很大（例如 ReLU→SwiGLU），后果是灾难性的；若差异较小，则只是细微的 on-manifold 统计偏移。
  trigger_surface: 实现 patch/错误配置
  signature: 两种极端并存：结构性替换可由 geometric 度量直接检测出 off-manifold；而相近激活之间的替换只留下细微的 on-manifold statistical 偏移，需要分布级度量，单点 geometric 会漏检。这也是它被标为 `ambiguous` 的原因 —— 族归属取决于替换对的结构距离。
  repro: 对选定层的 `mlp.act_fn` 做上下文期内的 monkeypatch（实测 HF decoder 的 `mlp.act_fn` 是一个普通 callable module，例如 `SiLUActivation`），映射到 `F.relu`/`F.gelu`/`F.silu`/identity。注意 `nn.Module.__setattr__` 拒绝把普通函数/lambda 赋给当前持有 nn.Module 的属性名，因此需通过 `object.__setattr__` 绕过，以保证这仍然是**单个 callable 的替换**而不是子模块替换；退出时还原原始 `act_fn`。
