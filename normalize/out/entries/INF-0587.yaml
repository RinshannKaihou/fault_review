  meta: '`infra_off`（diffusion layerwise-offload 的 mapped-weight courier 在私有 copy stream 上创建 CUDA 张量交还 compute 线程，`_collect_mapped_layer()` 等 copy event 却**不调 `gpu_tensor.record_stream(compute_stream)`**——最后一个 Python 引用释放时 caching allocator 只知 copy stream（已完成后即复用 storage），compute stream 可能仍在读） · Cov: `NEW` · 触发 `other_stack` · 置信度 `documented`'
  mechanism: PyTorch caching allocator 的 stream 语义：不 record 消费者 stream，则生产者 stream 完成后 storage 即可复用——compute kernel 侧 use-after-free；权重被换掉后前向读到别的分配的内容。与 6.194 前的 courier/异步 offload 族（6.149/6.151）同为生命周期契约缺口，本条是 allocator API 使用遗漏（一行 `record_stream`）而非逻辑错误。
  source: 'SGLang #37963（2026-09-04 open，main `dae126d5` 复现 + 最小复现器）。https://github.com/sgl-project/sglang/issues/37963'
  behavior: '**静默数据竞争**（权重内容被随机替换）：输出偶发损坏/错值，随负载与分配时序漂移——经典难复现形态；compute stream 恰好先完成则无症状。与 6.190（workspace realloc UAF）同为"地址生命周期与使用方脱钩"，本条在 allocator stream 语义层。属「**跨 stream 张量交接缺 record_stream**」新子签名。'
  trigger_surface: SGLang + diffusion layerwise-offload mapped-weight 路径（main `dae126d5`；功能开启即暴露）
