  meta: '`infra_off`（vLLM DeepSeek-V4.1-Flash + DSpark 推测解码 + FULL_DECODE_ONLY CUDA graph：**padded graph 行流入 DSV4 MoE 路由**——`dsv4_topk` Triton 快速路径把 padding 行当真实 token 路由（产出非法 expert id/越界路由），后续异步 CUDA illegal memory access → worker/EngineCore 死亡。8×H20 TP8/EP8 生产复现（max_num_seqs>256 高并发触发，256 稳定）；第二用户 1024 并发独立复现并定位根因。两个本地补丁均 1024/1024 两轮全过：(a) padded 行发零权重 + −1 expert sentinel（PR #53577 方向）、(b) draft 模型改走 generic MoE router 绕开快速路径（target 不变）） · Cov: `NEW`（CUDA-graph padding 行跨入 MoE 路由子签名） · 触发 `partial` · 置信度 `verified`'
  mechanism: graph 捕获的固定 batch 形状产生 padding 行，`is_padding` 信息未传播进 MoE router 前向上下文；dsv4_topk 快速路径对全部行无差别执行路由计算，padding 行的路由输出（垃圾 expert id）被下游当作真实路由消费。
