  signature: 基本 ON-manifold、信号很弱——残差流保持健康，因为故障是采样 CHOICE 而非计算。签名存在于输出 token 轨迹上（n-gram 重复导致的熵坍缩），而不在中间层。这是与本课题直接相关的关键盲点：**健康的隐藏态配上退化的输出**。geometric/spectral 族在此无能为力，只有对输出序列做 trajectory/statistical 统计才可见。（后前向盲区通用规则：所有隐藏态检测器原理上不可见，可行覆盖是 replay/oracle 类——bit-exact 重算、Token-DiFR——与输出级统计。）
  repro: 对一个固定的健康模型使用 greedy 解码即可——"故障"就是解码策略本身，作为 generation 参数注入，不需要任何钩子。
