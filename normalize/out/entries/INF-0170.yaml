  meta: '`infra_off`（`ttnn.prod_bw` 以 `reciprocal(input)×(prod×grad)` 计算梯度——输入含精确零元素时 `+inf×0.0 → NaN`，而数学上正确的梯度应为有限值（单零位置=其余元素积×grad）） · Cov: `var:ttmetal_atanh_bw_zero_upstream_gradient_pervasive_nan`（1.156 反向零哨兵族） · 触发 `hw_specific` · 置信度 `documented`'
