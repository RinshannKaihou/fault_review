  meta: '`infra_off`（Marlin **int8-activation** 路径（`VLLM_MARLIN_INPUT_DTYPE=int8`）：`marlin_act_int8_process_scales` 用 `s.max()`（非 `abs().max()`）归一化并落 `int16`，CUDA 内核以 `reinterpret_cast<uint16_t*>` 读——**任一负 group scale 被读成大正数**（4096 组 50.8% 负：kernel 视图 [1,65535] vs 真值 [−4086,4096]，例 −0.0225→+1.3，倍数 min 15/median 95.8/max 65535；反量化权重误差达典型幅度的 170×）。对称 int4 导出（AutoRound 对称模式约半数组为负）整体半数组垃圾——仍加载、仍运行、仍"benchmark 正常"。CPU 数值演示+双侧源码定位（marlin_utils.py:544 / marlin_template.h:1129），精确修法（abs().max()+有符号读）误差 1.91e-05） · Cov: `var:sglang_gptq_marlin_moe_bf16_scale_dtype_and_tp_descact_w2_sharding_nan`（7.62 Marlin scale 位型族——本条在 **激活 scale 的符号位重解释**维度） · 触发 `config` · 置信度 `verified`'
  mechanism: int16 位型经 uint16 读出后符号位变幅值；归一化未取绝对值使负值必然存在。
  source: 'vLLM #59403（2026-09-30 open，CPU 数值闭合演示+源码行号+三修法对照）。https://github.com/vllm-project/vllm/issues/59403'
  behavior: 无 crash——约半数 group 的激活缩放静默错百倍，输出质量静默塌缩而服务面全绿。
  trigger_surface: vLLM + VLLM_MARLIN_INPUT_DTYPE=int8 + num_groups>1 + 含负 scale checkpoint（config）
  discovery: 2026-10-09 每日扫描。
