  meta: 'stage: `pretrain/sft` · Cov: `NEW` · 置信度 `documented`'
  mechanism: 训练进程为加速捕获的 CUDA graph 里**冻结了 capture 时刻的执行语义**：Python 分支走向、buffer 突变都在内。普通验证（`model.eval()` + `torch.no_grad()`）本应切到 eval 语义，却仍**重放训练态（grad 模式开启）捕获的 graph**——capture 期执行的 MoE router token-count 累积这类 buffer 写被原样重放进验证前向，eval 指标混入训练态副作用。修复 = eval/no_grad 下回退 eager 执行；显式推理捕获与 ckpt-forward replay 保持原行为。
  source: 'Megatron-LM PR #6992。https://github.com/NVIDIA/Megatron-LM/pull/6992'
  behavior: 无 crash、无 NaN；val loss/metrics 被 replay 的训练态 buffer 污染——用被污染的验证曲线做早停/lr 决策/回滚判断，信号源本身就是错的。与 ACT.03（replay 图与训练图分叉）互为镜像：那边训练路径 replay 错范围、这边验证路径 replay 错模式；与 OBS.06（诊断路径错值）同层：训练健康，**观测层拿的是另一个计算的输出**。与 RL-RO.09（fused view 冻结在捕获时刻）共享「capture 冻结旧语义」机制，但冻结的是控制流/buffer 而非权重。
  discovery: 2026-09-04 每日扫描
