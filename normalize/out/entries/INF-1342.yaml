  mechanism: 显式上下文缓存（explicit context caching）以 TTL（默认 60 分钟）存储内容的 KV；在 TTL 内改动源 GCS 对象，缓存资源仍指向由**过期字节**算出的 KV，因为缓存 id 并不追踪可变内容。服务端于是用旧文档的 KV 前缀回答关于新文档的问题。
  source: 来源：ai.google.dev/gemini-api/docs/caching（原文警告）。
  behavior: 用户更新了源文件后继续提问，模型的回答仍基于编辑前的版本，最长可持续一个 TTL 周期且无任何提示。
  trigger_surface: 其他服务栈/API
  signature: 这是最纯粹的 model_on / "perfect disguise" 情形——KV 本身是**健康输入的健康编码**，只是编码的是错误的输入。隐状态完全在流形上，geometric/spectral/trajectory/statistical/infotheoretic **全族漏检**。签名（若被静默提供）只体现为"KV 前缀编码的是编辑前的文档"，**只能相对一次全新重算才可检测**——即 cheap 族的 recompute-oracle 轴（同 8.85 `kv_corrupt` 的重算对照；前提：记录 batch 组成的 bitwise 重算）是唯一通道，这与 `bug_perfect_disguise`（9.25）的判定一致。
  repro: partial——用 prompt A 做 prefill 得到 KV，随后把输入 token 换成 prompt A'（A 的小改版）继续解码，即"KV 来自旧字节、查询来自新字节"；API 侧的 TTL / 缓存资源生命周期需服务侧复现。
  locus: api-prompt-cache
  priority: |-
