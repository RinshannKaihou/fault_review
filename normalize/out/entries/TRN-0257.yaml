original:
  category: OBS
  section: OBS
  meta: 'stage: `rl` · Cov: `NEW` · 置信度 `documented`'
  mechanism: trl `GRPOTrainer` 把 loss-path 指标（`policy_loss`、`entropy` 等）**每个 micro-batch append 一次**，`log()` 对 logging interval 内全部条目取平摊平均——而 transformers 5.11 会把 epoch 最后一个 accumulation window 截短到 remainder（`current_gradient_accumulation_steps` = remainder）：长窗贡献 3 条、短窗贡献 1 条，flat mean 按 3:1 加权，与 per-optimizer-window 平均**差 2 倍**（实测 `policy_loss` logged −0.000557 vs window-mean −0.001114）。基础 `loss` 不受影响，偏差只打击 RL 诊断指标。同窗口内另有一层：`policy_loss` 的 capture 时点随 `loss_type` 分支而异——`grpo/bnpo/dr_grpo/sapo/luspo` 在 rescale 前 capture（window 量级），`cispo/dapo/vespo` 在 normalizer 折入后 capture（micro-batch 量级），两种量级差 `grad_accum / steps_per_generation` 倍，代码与文档均未声明。
  source: 'trl #7047（4-micro-batch / gas=3 受控实测，两种聚合方式对照）+ 同族 #7011（八种 loss_type 的 capture-scale 对照）。https://github.com/huggingface/trl/issues/7047 ；https://github.com/huggingface/trl/issues/7011 ；修复 PR #7053/#7042（optimizer-window 粒度统一记录）+ #7066（per-token entropy 指标修复顺带）。'
  behavior: 无 crash；RL 训练的 policy_loss/entropy 曲线系统性错值——跨 run 对比、跨 loss_type 对比、与 loss 交叉验证全部给出错误答案，且错值方向与 epoch 尾窗相关（不均态、随数据量波动）。与 OBS.06（RL 诊断不掩 padding）同族：训练本体健康，诊断层系统性错值；差异在机制是**聚合粒度错位**而非掩码遗漏。
  discovery: 2026-09-05 每日扫描
