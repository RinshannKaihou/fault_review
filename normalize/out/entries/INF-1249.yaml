original:
  category: KV4
  section: KV §4 cross-request（跨请求，缓存键 / 汏染）
  meta: '`ambiguous` · Cov: `var:cache_position_off_by_one` · 触发 `partial` · 置信度 `documented`'
  mechanism: 当 `padding_side='left'` 时，`position_ids` / `cache_position` 必须由 attention mask 推导（`clamp(cumsum(mask)-1, min=0)`）；若按序列下标朴素推断，就会把 pad 前缀也计入 → 真实 token 拿到错误的 RoPE 位置，并且缓存里的 pad 位置也被 attend 到。自 transformers 4.42 起，仅仅是 mask 的存在与否就足以移动缓存生成路径下的 logits。
  source: 'transformers #29419、#31943（PR #31944）、#29149。'
  behavior: 源文档未给出独立的「行为效应」条目；按机制，同一条 prompt 在 batch（左填充）与单条推理下生成结果不一致，且不一致程度随该行的 pad 长度增大。
  trigger_surface: 原 partial；单机 vLLM 上可尝试场景化复现
  signature: ambiguous——签名被 batch 结构与 pad 长度门控，batch=1 时完全消失。表现为「跨序列污染 + 位置偏移」两重叠加：被填充的行在 pad 槽上携带非零 attention mass，同时该行整体带一个等于 pad 长度的 RoPE 相位偏移。捕获者：cheap（batch-vs-single 输出/隐藏态偏离，即 batch-invariance 检查）、geometric（attention-mass-on-pad 的结构性检测）、trajectory（逐行不同幅度的偏移）。漏检者：任何 batch=1 的单序列基线，以及把 batch 内各行平均掉的 statistical 汇总量。与 `cache_position_off_by_one` 那种全局恒定、近乎零效应的偏移不同，这里的偏移是逐序列不同的。
  repro: 走 batch 变体路径：构造左填充 batch，在 `model.model.rotary_emb` 上挂单个 hook，给每一行加上等于其 pad 长度的 `position_ids` 偏移（复用 `cache_position_off_by_one` / `bug_perfect_disguise` 的 position 改写惯用法），并同时放开 pad 槽的 mask，使 attention 能落到 pad 上。
  locus: '`cross-request`'
  priority: '`medium`'
