original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`tt_llk_quasar/common/inc/ckernel_instr_params.h` 的 `p_unpacr` 携带 **Blackhole 的 UNPACR_NOP flavour 编码**：BH 九操作数末位是 `Unpack_Pop`（0=POP,1=CLR_SRC,2=NOP,3=POP+stream），Quasar 六操作数末位是 `Nop_type`（0=clear srcA/B,1=cycle delay,2=NOP+Dvalid）——值全合法但语义错位。`llk_unpack_dummy` 请求 `UNP_CLRSRC`（值 1），在 Quasar 实发**纯 cycle-delay NOP**：其文档自述的 SrcA 清除从未发生、`Src_ClrVal_Ctrl` 未被咨询、前置 STALLWAIT 等待一个不存在的清除；其余 in-tree 调用点恰逢值 0/2 碰巧正确。指令仍编译、执行、不 fault） · Cov: `var:ttmetal_bh_unpacr_nop_wh_packed_constants_misencode`（1.141 UNPACR_NOP 编码错位族） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: 跨 arch 指令参数表拷贝时编码语义未随 ISA 手册重映射；"每个值都合法"使编译器与硬件都无从拦截。
  source: 'tt-metal #56204（2026-09-11 open，bug+LLK+Quasar label，含双 ISA 编码对照表与逐调用点审计）。https://github.com/tenstorrent/tt-metal/issues/56204'
  behavior: 无 crash——dummy unpack 的 SrcA 清除静默缺失；当前 in-tree 主路径碰巧不受影响（潜伏缺陷），新调用点按字面语义使用即中招。1.141（BH UNPACR_NOP 携带 WH 打包常量）的镜像：那条是 BH 携带 WH 值、本条是 Quasar 携带 BH 值——同族"flavour 字段跨 arch 错位"第二例。
  trigger_surface: tt-metal Quasar LLK + p_unpacr UNPACR_NOP 路径（hw_specific）
  discovery: 2026-09-11 每日扫描。
