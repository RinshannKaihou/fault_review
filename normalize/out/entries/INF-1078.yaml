original:
  category: cat11
  section: 第 11 类 · 解码 / 采样故障（多为 post-forward — 结构性盲点）
  meta: '`infra_off`（GlmMoeDsa（GLM-5.2 INT4）默认路由到 V2 model runner，但 `DeepseekV32Model` 无 `@support_torch_compile` 装饰——`--compilation-config mode=3` 下引擎打印 "torch.compile is turned on, but the model does not support it" 后**静默跑 eager**，无错误无编译失败提示；本地强加装饰后又撞两处 Dynamo fullgraph 失败（`lru_cache` 包装的 `get_device_capability` C 调用、`ContextVar.get`），V1 回退路径则死在 `triton_kernel_wrapper_functional was not removed` 断言——三条路径无一条能编译） · Cov: `NEW` · 触发 `partial` · 置信度 `verified`'
  mechanism: '三层缺陷。(1) V2 runner 的 DSA 模型类缺 compile 支持装饰 → mode=3 打印一行警告后静默 eager（编译成 no-op 无提示）。(2) 本地补装饰后 `wrapper.py` 的 `fullgraph=True` 拒绝两处：`fused_q_cutedsl.py:37` 的 `current_platform.has_device_capability(100)`（`@lru_cache` 包裹的 C 调用不可 trace）；`workspace.py:153` 的 `_workspace_lane.get()`（ContextVar.get 不支持 trace，`@torch._dynamo.disable` 也因 fullgraph 被拒）。(3) `VLLM_USE_V2_MODEL_RUNNER=0` + model-class override 走 V1 又在 KV-cache init dummy run 死于 `AssertionError: triton_kernel_wrapper_functional was not removed`。8×A100 TP8、MTP k=3 环境实测。'
  source: 'vLLM #54197（2026-08-28 open，main@2026-08-27，含三路径完整报错链）。https://github.com/vllm-project/vllm/issues/54197'
  behavior: '**无 crash、输出正确**——纯性能/语义静默降级：用户以为在跑编译路径实际 eager（延迟/吞吐偏离预期），warning 淹没在启动日志里。属「**能力探测装饰缺失 = 编译请求静默降级 eager**」新子签名：与 7.59（bench 静默跑 BF16 fallback）同"请求的执行模式与实际不符"族；本条三路径连环失败说明该模型族的 compile 支持是**系统性缺口**而非单点遗漏。'
  trigger_surface: vLLM + GlmMoeDsa/DSA V2 runner 模型 + `--compilation-config mode>=3`（config 组合即触发；V1 回退需额外 override）
  discovery: 2026-08-28 每日扫描。
