original:
  category: cat3
  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`ambiguous`（bit-flip → LLM 认知偏见/决策级劫持，不破坏功能性） · Cov: `NEW` · 触发 `partial` · 置信度 `documented`'
  mechanism: CogBias 框架定义"决策级劫持"威胁——通过翻转少量权重 bit 隐蔽、低成本、持久地操纵 LLM 认知立场，间接影响下游决策者。可微分 sentiment evaluator 将主观偏好转为优化信号，多目标 loss 联合约束（目标话题立场偏移 + 非目标任务影响最小化 + 输出分布保持），BitScout 定位关键 bit，在超稀疏 flip 预算下实现定向认知干预。与 PrisonBreak（3.1 jailbreak）/Bithydra（3.2 EOS 抑制）/TFL（3.9 输出操纵）不同：**CogBias 不触发安全拒绝也不改变功能性输出结构，而是注入认知偏见**——模型在目标话题上产生系统性立场偏移，对非目标任务影响有限，使常规安全/质量回归无法检测。Llama-3.2-3B/Mistral-7B/Qwen2.5-14B 上少量 bit 翻转即稳定诱导目标话题显著立场偏移。
  source: '"Decision-Level Hijacking: Injecting Cognitive Bias into Large Language Models via Bit-Flip Attacks", arXiv:2607.25227（2026-07-28）。http://arxiv.org/abs/2607.25227v1'
  behavior: 无 crash、无 NaN。少量权重 bit 翻转 → 目标话题上认知立场显著偏移，非目标任务功能保持正常。属 BFA 家族「bit-flip → 认知偏见注入」**新子签名**——不破坏功能性而是操纵价值对齐。
  trigger_surface: 3.19 `weight_bitflip` 复现路径 + 可微分 sentiment evaluator + BitScout 定位（需反向传播）
  signature: ambiguous / 在非目标输入上贴近健康流形；目标话题输入上产生系统性立场偏移。比 PrisonBreak 更隐蔽——不触发安全层，需要立场/情感监控才能检测。
  discovery: 2026-08-12 每日扫描（arxiv 2607.25227）。
