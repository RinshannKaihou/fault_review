  meta: '`infra_off`（tt-metal #55107 "[LLK][Bug fix] Drain the math pipeline in the Dest→Src bank waits" 的 **BH-only unpack 半边**——"pipeline the dummy publications"（Stall_Clr_Cntrl=1）放宽了一个等待：MiniMax-H3 ring-attention SDPA 在 4x32 Blackhole Galaxy quad 上**每个 t2va 生成都是噪声**（视频 1.7–3.3 bits/px/frame vs 干净 clip 0.34、音频钉在 0 dBFS），自首个请求起确定性复现；仅 revert 该 commit（kernel headers only、同一 `.so`）即恢复 43/43 请求干净——修复 WH 竞态的 PR 在 BH 上引入静默错值，且 PR 文本自flag "failure would surface downstream, not at the changed instruction"、`llk_unpack_A_sdpa.h`/`llk_unpack_A_rmsnorm.h` 无 `unit_tests_llk` 覆盖） · Cov: `NEW`（修复 PR 半边跨 arch 引入静默错值子签名） · 触发 `hw_specific` · 置信度 `verified`'
  mechanism: dummy publication 流水化改变了 unpack 等待与下游消费的耦合时序——ring-attention 类内核恰是依赖旧耦合的调用者；kernel 源 bisect（同 host 库、每步重建 JIT cache）定位到 `1b17275b8df`，revert 单 commit 恢复干净（再 revert 相邻三个 commit 则 audio decode 挂起，证明依赖链真实存在）。
  source: 'tt-metal #56120（2026-09-10 open，含 4x32 mesh 上的 kernel 源 bisect 矩阵与 commit 级 A/B 证据）。https://github.com/tenstorrent/tt-metal/issues/56120'
  behavior: 无 crash——视频/音频输出全噪声（服务 200）。1.122（Quasar softplus 修复未跨 arch 传播）的镜像形态：那条是"修复未带到第二 arch"、本条是"修复的另一半在第二 arch **引入**损坏"；同属 1.99（TT-NOP 注入器暴露的 LLK unpack-sync 竞态族）的亲属但方向相反。
  trigger_surface: 'tt-metal BH（Galaxy）+ 含 #55107 的 main 基线 + ring-attention SDPA 类内核（hw_specific）'
