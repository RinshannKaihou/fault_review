original:
  category: cat1
  section: 第 1 类 · 硬件 / 静默数据损坏（SDC）
  meta: '`infra_off`（`ttnn.operations.moreh.softmin` 对归约维含 +inf 的行**静默返回全零行**（torch F.softmin 返回良定义分布、inf 位为 0）、含 −inf 行同样全零（torch 返全 NaN 行）。根因：程序工厂为 softmin 定义 `SOFTMIN=1`，但 `kernels/` 下**无任何 `#ifdef SOFTMIN` 分支消费该 define**——define 死亡，全部内核按 softmax 变体计算，`e=−(x−m)` 对 inf 输入产生 NaN 再被吞为零。W 小/W 大/H/NC/dim0/dim1/mask 全并行路径一致错；sibling moreh_softmax/moreh_logsoftmax 对 +inf 行处理正确（同 setup 验证）） · Cov: `var:ttmetal_moreh_norm_backward_pinf_ninf_ub_cast_zero_or_garbage_gradients`（1.202 moreh 族特殊值未守卫） · 触发 `yes` · 置信度 `verified`'
  mechanism: 编译期开关与内核实现脱节——工厂定义的宏从未被任何内核读取，操作语义靠共享 softmax 内核的（错误）隐式行为达成；±inf 输入暴露分歧。
  source: 'tt-metal #56371（2026-09-13 open，bug+community label，含 ttsim BH 七行证据矩阵与 define 消费性 grep 证明）。https://github.com/tenstorrent/tt-metal/issues/56371'
  behavior: 无 crash——含 ±inf 行的 softmin **静默全零**（应 one-hot/NaN）；有限输入下与正确实现一致（bf16 噪声级 max err≈0.005），缺陷只在边界值显形。1.202（moreh_norm_backward ±inf 梯度全零/垃圾）之后 moreh 族新成员：本条在"死编译开关 + 共享内核错误复用"维度。
  trigger_surface: tt-metal + moreh.softmin + 归约维含 ±inf（yes；数值触发）
