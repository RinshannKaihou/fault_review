  meta: '`infra_off`（`TritonGPUFuseNestedLoops` 对**上界低于下界的空动态内层循环**（`tl.range(5, ub)` 且 `ub<5`）miscompile：flatten 后内层体每轮外层各执行一次——`ub=3` 时 flatten 版返回 4、普通嵌套版正确返回 0；合法 kernel 合法调用下的错误返回值） · Cov: `var:triton_fuse_nested_loops_nondominating_assume_miscompile`（1.127 同 pass 变体） · 触发 `partial` · 置信度 `verified`'
  mechanism: flatten 变换对动态 trip count 的"内层为空"情形（upper bound < lower bound）假设内层至少执行零次的边界处理错误——扁平化循环没有对空内层区间做守卫，落入循环体一次。sm89 / Triton 3.8.0 最小复现。
  source: 'triton #11656（2026-09-09 open，含两函数最小对照 repro：flattened_empty_inner vs ordinary_empty_inner）。https://github.com/triton-lang/triton/issues/11656'
  behavior: 无 crash——空循环语义被破坏，依赖空内层做条件跳过的 kernel **静默多算**。1.127（非支配 assume miscompile）、1.169（零 trip bound load 提升越界 IMA）之后 FuseNestedLoops 族第三变体：本条显形为错误计数而非越界。
