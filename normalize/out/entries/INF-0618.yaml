  meta: '`infra_off`（SGLang 联合 Full/SWA/Mamba 分支点缓存：SWA 按页对齐选边界、Mamba 按 checkpoint 网格对齐选边界，两目标**独立计算**；插入取全部组件请求长度的 `min(…)`——KV 可切片到该长度、**checkpoint 不可切片成更早状态**。实例：已有 checkpoint 64/128、新请求共享 96 token 后分叉（仅 checkpoint64 可复用），SWA 提议 branch96、Mamba 网格 round-down 到 64 已缓存故不提议新分支，prefill 继续到 192 并存 state192——插入取 `min(96,192)` 把 **state192 挂到 key96**，后续请求命中 96 从错误 Mamba 状态恢复。H200 + 真实 `thinkingmachines/Inkling` checkpoint + Rust TreeCore + Triton + page size 1 + Mamba `extra_buffer` 复现：warm-cache logprobs 三组输入全部分歧、greedy 输出一组改变；冷缓存重复完全一致） · Cov: `NEW`（多组件分支目标合并 min 语义对不可切片状态错配子签名） · 触发 `other_stack` · 置信度 `verified`'
  mechanism: 'scheduler 只跟踪 Mamba 的目标而不用 SWA 的 branch96 决定 checkpoint 选择；插入逻辑的 `min` 长度对可切片的 KV 合法、对不可切片的 SSM/conv state 非法。PR #37584 把 SWA branching 传播进 Rust 后端后在共享插入逻辑中暴露；示例不需 SWA eviction 或 HiCache。'
  source: 'SGLang #38815（2026-09-10 open，bug label，含逐步时序示例与 H200 GPU 复现参数）。https://github.com/sgl-project/sglang/issues/38815'
  behavior: 无 crash——**跨请求状态污染**：命中共享前缀的后续请求从比键所声称更晚（含更多本请求未见 token）的 Mamba 状态恢复，warm-cache 输出/ logprobs 系统性偏离冷缓存。6.144（Mamba align 状态物化 × 查找上限错配零命中）同族但根因在新层：多组件**分支目标合并语义**而非单一组件的物化/查找错配。
