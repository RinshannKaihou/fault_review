original:
  category: cat10
  section: 第 10 类 · 分词器 / 对话模板故障
  meta: '`infra_off`（Qwen3 XML parser 的参数名正则接受除 `>` 外任意字符——模型写出的畸形 `<parameter>` 元素（缺名字/缺 `>`/多余 `=`）把后续**全部内容（含闭合标签）当 key** 流式透出；前缀无法扩展、`_flush_arg_converter` 静默返回 None，客户端持有未终结 JSON——Responses API 流（Codex CLI）此后该会话**每个请求 400**） · Cov: `var:vllm_kimi_k3_parser_channel_terminator_assumption_tool_call_silent_drop`（10.42 parser 流式假设族） · 触发 `config` · 置信度 `documented`'
  mechanism: '`_PARAM_RE`/`_PARTIAL_PARAM_RE` 的 name 组 `[^>]+` 过宽：`<parameter=` + 换行、`<parameter=ids: [...]`、`<parameter=note=`（stray `=`）等模型实际会写的近错形式全部滑入，partial converter 用到闭合标签 `>` 为止的整段当 key（如 `"echo SAC_NAME=...\\n</parameter"`）流出；final conversion 不产生该 key → 流式前缀不变量破坏 → flush 静默 None。修复把 name 收紧为 `[^>\s<]` 并让 partial/final 一致丢弃畸形元素。'
  source: 'vLLM PR #55497（fixes #55495，2026-09-05，含三形态畸形元素与 Codex 会话级 400 链路）。https://github.com/vllm-project/vllm/pull/55497'
  behavior: 无 crash——一次坏 tool call 使流式输出含未终结 JSON；**会话级连锁**：逐字存储 tool call 的客户端（Responses API/Codex CLI）把坏 JSON 回传，会话内每个后续请求被 400 拒绝。与 10.42（Kimi-K3 通道终止符假设静默丢 tool call）互补：彼条丢调用、本条注入毒 key——同"parser 对模型近错输出的假设"族，10.44（数组非 object 丢邻居）第三成员。
  trigger_surface: vLLM + qwen3/qwen3_coder tool parser + 模型近错 XML 输出 + 流式 + 逐字回传客户端（parser×模型行为触发）
  discovery: 2026-09-05 每日扫描。
