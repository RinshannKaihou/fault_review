  meta: '`model_on` · Cov: `var:9.26` · 触发 `config` · 置信度 `verified`'
  mechanism: 训练用一种 `rope_type`（yarn / llama3），服务时却用了另一种（linear / dynamic）。Llama-3.1 那套 grid-search 出来的 'llama3' 类型需要 transformers>=4.43，更老的技术栈会静默回落到别的类型。结果是各旋转频率带被按错误的规则重映射。
  source: 'HF Llama-3.1-8B discussion #15；vLLM #6689；CTranslate2 #1743。'
  behavior: 长上下文能力出现由微弱到中等的退化；错误是按频率带选择性发生的。
  trigger_surface: RoPE 相关配置
  signature: on-manifold。wrong-type 造成的误差是 frequency-band-selective 的——只有部分旋转频率带被错误缩放。因此对 rotary 频率做 spectral 度量，或把注意力分数按 head-dimension band 分组后再做度量，可以暴露一个带内局部化（band-localized）的偏差。反之，对整层隐状态求全局范数的 geometric/statistical 度量会因为误差被平均掉而漏检。
  repro: 直接改写模型 config 中的 `rope_scaling` 类型字段（或等价地替换 rotary embedding 的 inv_freq 计算方式），无需前向钩子。
