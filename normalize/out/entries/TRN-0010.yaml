  mechanism: Softmax-CE / LayerNorm 输入沿全 1 向量的梯度在精确算术下抵消（𝟙ᵀg = 0）。低精度乘法噪声打破抵消，行均值 mₜ = (1/d) Wₜᵀ𝟙 变成无漂移鞅；累积能量 Aₜ→∞ 时参数几乎必然发散。这是 FP8 训练「看起来在跑、谱已塌」的理论核。
  source: Zheng, Huang, Liang, "Mean-Square Divergence of Low-Precision Gradient Descent"（华为）。本地 `martingale_monitor` 实现 Ēₜ / ‖𝟙ᵀW‖ / srank。
  behavior: loss 尚未分叉时 Ēₜ 已比 BF16 高一个数量级；有效秩向个位数塌缩；weight decay 挡不住。本实验室在 gpt-size E4（bitshift O4）上看到 `realized_var` 提前抬升。
  discovery: 2026-08-17 基础调研（文献 + 本地 monitor）
