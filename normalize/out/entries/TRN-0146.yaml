original:
  category: KER
  section: KER
  meta: 'stage: `pretrain` · Cov: `NEW` · 置信度 `documented`'
  mechanism: Megatron `GPTModel` 在 `parallel_output=False` 或 `runtime_gather_output=True` 时以 `gather_output` 建输出层（gpt_model.py:292/579/671）——logits 是**全词表、TP replicated**；但带 labels 的路径 `compute_language_model_loss` 无条件调 vocab-parallel CE（language_module.py:127），该 CE 把最后一维当作**本地词表分片**：TE fused 路径有 assert 挡住、**非 fused 路径没有**。TP=2、logits `[0,1,2,3]`、label 3 repro：observed loss 1.1333369 = 正确值 0.4401897 **+ log(2)**（replicated logits 被当 shard 求和/归一，系统性偏 log(TP)）；物理梯度 `[0.0160,0.0436,0.1184,0.3220]` vs 参照 `[0.0321,0.0871,0.2369,-0.3561]`——target 项丢失。两个触发项都是公开模型选项。修复 = assert sharded、gathered 时回退普通 CE 或拒绝组合。
  source: 'Megatron-LM #7452（2026-09-17；finding 2，113 行 CPU/Gloo repro；未发现既有上游报告）。https://github.com/NVIDIA/Megatron-LM/issues/7452'
  behavior: 无 crash——loss 恒偏 **+log(TP)**、梯度结构性错误（target 梯度项消失）；「能训、loss 略高」的形态使它极易被归因为超参/数据。与 KER.14 同函数族但断点相反：那边输入确是 shard、归约缺失；这边输入是 **replicated 却被当 shard**——分布式类型混淆的两个方向；与 DATA.06（tokenizer 本地 vocab 分片错位）症状面相邻（词表域错值）但机制在 CE kernel 入口契约。
  discovery: 2026-09-18 每日扫描
