  mechanism: torchtitan Muse Glimmer 的 final output norm 用 `gain_center=0.0` 且继承 `_gain_norm` 的**零初始化 weight**——有效 scale = 0+0 = 零：final hidden states 与 logits 全零，首个 backward 的 decoder/lm_head 梯度也全零。内部 norm 的零初始化是有意的 gain-center 语义，final norm 复用同一初始化路径则是错的：输出侧需要单位 scale。修复 = 仅 final norm weight 初始化为 1、参数化不变。
  source: 'torchtitan PR #4489（已合并；standalone RMSNorm forward/backward 检查：修复前输出与梯度全零、修复后非零）。https://github.com/pytorch/torchtitan/pull/4489'
  behavior: 预训练从「第一步对所有下游参数零梯度」起步——loss 平但不学（首步优化器更新为零），warmup 期损失曲线看似正常爬升、实际起步期已被浪费；更糟的路径是与先验初始化假设耦合的隐式质量损失。无 crash、无 NaN。与 LOSS.04（长跑静默退化）不同：本条是**初始化即静默错**，收敛掩盖起步缺陷；与 CKPT.03（随机初始化）对照：零初始化比随机更隐蔽——数值范围看起来完全正常。
  discovery: 2026-09-06 每日扫描
