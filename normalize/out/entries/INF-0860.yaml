  meta: '`infra_off`（Ascend 910C `ascend` attention 后端 `--page-size 16`：通过 `aclnnFusedInferAttentionScoreV3` 的 kernel tiling 检查但**每个请求从首 decode 步起输出连贯却语义垃圾**（"Repeat after me..." → " iterate!!!..."、"capital of France" → "pectionpection..."）——无错误无警告、指标健康；page 1 被 kernel 硬拒（#25169 的 blockSize 对齐）、page 128 正确：三档 page size 中间档是静默坏路径） · Cov: `var:vllm_dsv4_sm120_sparse_mla_page_size_advertise_mismatch`（8.52 页大小后端契约族） · 触发 `hw_specific` · 置信度 `documented`'
  mechanism: 'page_size=1 的早校验（#25169）不覆盖本例——16 是 kernel tiling 检查眼中的合法值，错误在其后的执行语义层。plain server（无 speculative）即复现，排除 spec accept 路径。issue 明确警告：若 #25169 的早拒绝落地，page_size=1 被挡而 **16 的静默坏路径仍在**。'
  source: 'SGLang #38196（2026-09-06 open，Ascend 910C，含三档 page size 行为表与双 prompt greedy 输出）。https://github.com/sgl-project/sglang/issues/38196'
  behavior: 无 crash——全请求**连贯却语义垃圾**的输出（最难与模型能力问题区分的显形）。8.52（DSV4 SM120 页大小声明失配内核静默跳过）之后页大小契约族新成员：NPU 栈的 tiling 合法性 ≠ 语义正确性，「检查通过但执行错」是 8.52「声明即跳过」的镜像。
  trigger_surface: SGLang + Ascend 910C + ascend attention backend + page_size=16（hw_specific；配置即触发）
  discovery: 2026-09-06 每日扫描。
