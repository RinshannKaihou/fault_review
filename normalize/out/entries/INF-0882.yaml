  meta: '`infra_off`（GLM-5.3-Flash kpool sparse indexer（ROCm aiter 路径）：`always_select_tail=True` 只保证 ≤3 token 的**不完整尾池**入选，完整 recent 池与其他候选竞争 top-k、可排在 `index_topk=2048` 截断之外——长 prompt 下尾部上下文检索**非确定失败**（block table 正确）。强制最后 128 池（512 token、25% 预算）入选修复全部失败长度至 256K 满上下文。Strix Halo gfx1151 TP2 AWQ-W4A16 v0.31.0.dev 实测，needle+decoy 探针） · Cov: `var:vllm_glm53flash_rocm_indexer_block_table_granularity_mismatch_kpool_generic_slotmap`（8.83 GLM kpool 选择族——本条在 **选择策略对尾部池无保证**维度而非寻址错误） · 触发 `hw_specific` · 置信度 `documented`'
