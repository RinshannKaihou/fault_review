  meta: '`infra_off`（Qwen3.5/3.6 多模态 wrapper checkpoint 的 MTP `n_predict` 解析为 **None**：`mtp_num_hidden_layers` 从 **wrapper 顶层 config** 读取而非 `text_config`——wrapper 顶层无此键，MTP 声明存在却被静默解析失败，推测解码不生效） · Cov: `NEW` · 触发 `config` · 置信度 `documented`'
  mechanism: 多模态模型的 config 是嵌套结构（wrapper 含 `text_config`/`vision_config`），文本层专有键（MTP 层数）在 wrapper 顶层不存在——读取点选错作用域得到 None；与 6.185（workspace token/pool 粒度错配）同为"复合配置结构的作用域假设错误"，本条在 spec 配置解析。
  source: 'vLLM #55322（2026-09-04 open，label: multi-modality）。https://github.com/vllm-project/vllm/issues/55322'
  behavior: 无 crash、无警告——**MTP 静默不生效**：服务以普通 decode 运行（正确但慢），用户以为在用推测加速；与 11.55（compile 静默 eager 降级）同"性能特性静默失效"签名，本条失效轴是配置作用域。对照 12.24（MTP 权重被丢、accept len 恒 1）：本条连 drafter 都不构建。
