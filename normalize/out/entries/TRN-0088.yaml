  mechanism: padding_free 打包把多条序列 flatten 成一条 token 流，还原侧靠 `position_ids` 的下降沿推断序列边界。前一序列长度为 1 时下降沿不存在（`0 | 0 1 2` 中 `0 < 0` 为 False），两条独立序列被静默合并。ms-swift `revert_padding_free()` 实测：单 batch 的 sentence embedding 从 516 条错减为 260 条，labels 数量不变 → 样本与标签错位。
  source: 'ms-swift #9903（含根因代码分析 + debug 日志，已修复关闭）。https://github.com/modelscope/ms-swift/issues/9903'
