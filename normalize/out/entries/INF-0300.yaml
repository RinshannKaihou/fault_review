  section: 第 3 类 · 比特翻转攻击与定向权重篡改（BFA 家族 + LLM 时代变体）
  meta: '`infra_off` · Cov: `NEW` · 触发 `no` · 置信度 `verified`'
  mechanism: 翻转编译后的 BLAS/GEMM 库中某条 CONDITIONAL BRANCH 指令的 ONE bit，使分支判定反转，GEMM 在每次调用时都走错误路径；端到端的实现途径是 DRAM Rowhammer 打在代码页上。故障位于模型之下的库层，因此是 model-independent 的 —— 使用该库的任何模型都会被同一处翻转破坏。
  source: Li et al., "Yes, One-Bit-Flip Matters!" (FrameFlip), USENIX Security 2024, https://www.usenix.org/conference/usenixsecurity24/presentation/li-shaofeng 。
  behavior: 确定性、与模型无关的破坏：对 ALL inputs 输出都塌缩到固定/错误结果，不随输入变化。
  trigger_surface: opcode/框架代码段翻转，非模型权重；权限与稳定性差
  signature: OFF-manifold，但在所有输入与所有 checkpoint 上 UNIFORM —— 表现为流形位置的一个恒定几何位移，而不是逐样本的尖峰。可由 statistical / 分布类度量捕获（与健康参考分布之间存在一致的固定偏移）；逐样本的 SDC-spike 式 geometric 检测器可能完全不触发，因为"每个样本都一样坏"会被基线归一化吃掉。它是 bug_perfect_disguise 在 kernel/library 层的结构孪生。源文档明确标注：这是有据可查的检测盲区，且在纯 PyTorch forward-hook 层面 NOT injectable——故障住在库里。
