  meta: '`infra_off`（b12x W4A16 实验路径 BF16 激活 × MXFP4（`fp4_e8m0_k32`）：FP4 unpack（`v*2^-126`）× E8M0 解码（`2^(e-120)`）× MMA（`mul.bf16x2`）使每个非零权重恒乘 `2^-119`、epilogue 以 `2^119` 全局补偿——**E8M0 scale 字节 <121 时 MMA 权重落 BF16 subnormal**（乘积入 FP32-subnormal 失精度或消失）、**<114 时 FP4 0.5 被刷为零**（110 时除 ±6 外全部归零）；真实 MXFP4 checkpoint 的 scale 字节分布 ~100–130 正中陷阱。无 NaN/Inf、聚合 cos 可保持 0.99999——现有测试与精度门不可见。MiMo 等模型受影响；RTX 5080/RTX PRO 6000 SM120 + vLLM 服务路径复现） · Cov: `NEW` · 触发 `hw_specific` · 置信度 `verified`'
