  meta: '`infra_off`（ttnn **BF16 路径**的 trunc/floor/ceil 对 NaN 按符号位返回 ±inf（0x7FC0→+inf、0xFFC0→−inf）、frac 对 NaN 与 ±inf 一律返回 +inf；**fp32 路径同特殊值集 0 mismatch 全对**。torch/IEEE 754 语义应保 NaN。次生观察：bf16 trunc/floor/ceil(−0.0) 返 +0.0 丢零符号。binary_fmod/rdiv/binary_remainder 的 LLK 共享 `_trunc_body_` 疑似同病（未运行时验证）） · Cov: `var:ttmetal_softmax_sfpu_exp_sanitize_swallows_nan_inf_uniform_or_zero`（1.197 特殊值语义静默改写族） · 触发 `hw_specific` · 置信度 `verified`'
