  meta: '`infra_off`（ttnn 一元特殊函数把 NaN 输入静默映射为**看似正常的有限值**：`ttnn.erf` 返 ±1.0（SFPSWAP min/max 按位排序把 +NaN 当 >+Inf，clamp(+NaN,10)=+10 后走 erf(+10) 指令流）、`ttnn.erfc` 返有限值（erfc(5)≈2.4e-12）、`ttnn.i1` 返有限值（i1(88.5)≈1.15e37）、`ttnn.gelu` 负 NaN 返 0——WH 与 BH 一致；上游 NaN 被"洗白"成普通数，破坏 NaN 传播诊断与 NaN-mask 语义） · Cov: `var:ttmetal_softmax_sfpu_exp_sanitize_swallows_nan_inf_uniform_or_zero`（1.197 NaN 吞噬族——本条把面从 softmax exp 扩到 erf/erfc/i1/gelu 四个 unary 特殊函数） · 触发 `hw_specific` · 置信度 `documented`'
