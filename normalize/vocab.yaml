# 故障影响·对象 —— 哪个“东西”变错了（可多选，1–3 个，按主次排序）。
effect_object:
  数值结果: 算子或中间张量的输出值错误
  隐状态: 前向激活/隐藏态偏离
  输出分布: logits、logprobs、采样分布
  输出内容: 生成的 token、文本、结构化输出、API 响应字段；也包括生成的图像/音频/视频与 embedding/pooling 向量
  KV状态: KV cache 或循环状态（SSM/线性注意力）的内容或映射关系
  输入编码: 分词结果、chat template 渲染、输入 token 序列、特殊 token 注册、多模态输入预处理结果（像素/音频特征）、prompt embedding
  跨请求/跨样本数据: 一个请求或训练样本的数据/状态泄漏、污染到另一个（推理跨请求、训练 packing 跨文档）
  可用性/进度: 推理服务或训练作业挂起、死锁、中断、请求丢失、step 不前进
  性能/资源: 输出正确，但吞吐、延迟、显存占用变差，或配置的资源策略静默不生效
  梯度: 反向梯度值或梯度同步
  模型权重: 参数或检查点内容
  优化器状态: 动量/二阶矩/scaler 等优化器状态
  训练样本流: 样本顺序、重复、遗漏、mask/label
  训练信号: loss、reward、advantage、KL、IS ratio 的数值
  训练轨迹: 收敛、发散、loss spike、最终模型质量
  指标/日志: 监控、指标、日志读数
  测试判定: 测试或评测给出错误的通过/失败结论

# 故障影响·可见性（可选；判定“出问题时外部看得到什么”）。
visibility:
  静默错误: 无报错、无 NaN，结果数字看似合理但错误
  质量退化: 无报错，但评测/指标上可观察到质量下降
  数值异常: 出现 NaN / Inf / 溢出等显式异常值
  不可复现: 同一输入多次运行、或换 batch/并行度后结果不一致
  性能退化: 输出正确，只有延迟、吞吐或资源占用变差
  挂起: 进程或请求卡住、无进展
  报错: crash、assert、异常退出（编目一般不收纯报错类；仅在伴随静默后果时出现）

# 判定规则（抽取与人工审核共用）
rules:
  - 功能域优先：缺陷只出现在某个功能特性的代码路径上时（量化、KV缓存、MoE路由、位置编码、解码/采样、分词/模板、输出解析、重计算/卸载、RL训练回路、数据管线），subsystem 选该功能域；只有不专属于任何功能特性的通用缺陷，才选 算子/内核、编译器、运行时/执行。
  - 非故障条目：kind 为 结论/统计/方法 时，cause 写该条目所针对的故障对象（如针对 GPU SDC 的检测器 → 硬件），effect 写所针对故障的影响；确实对应不上时写 N/A。
  - 外部攻击只用于有蓄意攻击者的条目；自然发生的位翻转、老化、电压降归 硬件。
  - 多对象：只有修复必须同时改两个不同 subsystem 时才写多项；同一 subsystem 内的多个组件合写进一个 component，用“、”分隔。
  - effect.objects 通常 1–2 项，第一项写最直接变错的东西。
  - 触发条件不是对象：resume、TP>1、长序列、某模型架构只是触发条件，subsystem 按“出错的那段代码”归属（如 resume 后 sampler 丢种子 → 数据管线）。
