# 故障模式库受控词表 v1.2（2026-10-12 用户批准升级）
# v0 → v1：按 45 条试点的 A/B 分歧与词表缺口修订；v1.1 只澄清描述、不改枚举值（见 pilot/REPORT.md）。
# v1.1 → v1.2：按全量迁移提出的 91 条词表缺口修订（见 run/REPORT.md）：新增 输出解析、配置/参数、构建/发布；放宽若干描述；补充半受控 stack。
#
# 规则：
# - subsystem / effect_object / kind / visibility 是严格枚举，validate.py 遇到词表外的值直接报错。
# - stack 是半受控：词表外的值只告警，用来提示“是否该把新栈加进来”。
# - 任何字段都可以写占位符：待定（应有值、尚未填写或尚未核实）/ N/A（对本条不适用）。

placeholders:
  - 待定
  - N/A

# 条目性质。参考库默认“一行一个故障”；本库历史上混入了结论、统计和方法类条目，需要显式标出。
kind:
  故障: 可复现或有来源证实的具体故障模式（绝大多数条目）
  结论: 元结论/设计依据，不是可复现故障（原 Cov=rationale、META-FINDING）
  统计: 基率、频率、生产计数（如“1/1000 器件”“每 1–2 周一次 SDC”）
  方法: 检测器、验证器、定位工具或防护方案本身（如 FP-Sketch、SCOUT）
  指针: 指向另一编目中同一故障的说明，不是独立故障

# 故障原因·对象 —— 缺陷位于哪个子系统（按“哪里坏了”，不按“看起来像什么”）。
# 判定口诀：问“修复要改哪里”。tt-metal 的 SFPU 数学函数写错 → 算子/内核，不是 硬件。
subsystem:
  硬件: 计算硅、显存/HBM、互连物理层、供电（SDC、ECC、位翻转、rowhammer、电压降、老化）
  算子/内核: 张量算子与 kernel 实现（matmul、attention/SDPA kernel、激活/数学函数、归约、layout/sharding/padding/搬运算子、SFPU/LLK、FlashAttention、TE、cuDNN）
  编译器: Triton / torch.compile / Inductor / XLA / sfpi 等代码生成与优化 pass
  运行时/执行: 设备调度与执行（program cache、CUDA graph、stream/同步、内存分配器、driver、设备固件、dispatcher、model runner 的输入准备）
  集合通信: all-reduce / all-to-all / P2P / RDMA / KV 传输通道本身
  并行切分: TP/PP/DP/EP/SP/CP 的切分逻辑、rank/mesh 映射、梯度归约语义
  KV缓存: KV 存储、block 分配、前缀缓存、卸载/驱逐/压缩、KV 跨节点传输的管理逻辑；含线性注意力/SSM 的循环状态池
  调度/服务: 请求调度、批处理、抢占、请求生命周期、API/前端、多模态输入预处理与缓存
  输出解析: 把模型生成文本解析为结构化响应的后处理（tool-call parser、reasoning parser、content/reasoning/tool_calls 切分、流式增量解析）
  解码/采样: sampler、logits processor、惩罚项、推测解码、结构化输出、beam search
  量化: 量化方案、scale/zero-point、低位格式、量化 kernel 与量化权重
  位置编码: RoPE 及其缩放/插值配置
  分词/模板: tokenizer、chat template、detokenize、特殊 token
  模型定义: 建模代码、架构配置、计算图、attention mask 构造
  权重/检查点: 权重与 adapter 的加载/保存/转换/合并、adapter 挂载与 target_modules 匹配、模型文件下载与缓存、检查点内容与重分片（LoRA 计算 kernel 归 算子/内核）
  数据管线: 数据集、packing、loss mask/label 构造、shuffle/sampler、curriculum
  优化器: 优化器、学习率调度、梯度裁剪、loss scaling、梯度累积
  损失计算: loss 与辅助 loss 的计算、归约与归一化
  MoE路由: router、专家分派、负载均衡偏置（融合 MoE 专家计算 kernel 归 算子/内核）
  重计算/卸载: activation checkpointing、激活/参数 offload、ZeRO 梯度与优化器状态的 CPU offload
  RL训练回路: reward、advantage、KL、重要性采样修正、rollout↔train 的权重/分布同步
  观测/评测: 指标、日志、健康检查、测试 golden/容差、评测 harness
  配置/参数: 通用配置与参数基础设施（CLI/环境变量/YAML 的解析、默认值、优先级、传递与弃用转发）；只服务某一功能域的配置项归该功能域
  构建/发布: 打包、依赖解析、wheel 变体、发布分支或版本未携带已有修复
  模型自身: 代码无缺陷时模型能力或对齐本身的失效（幻觉、长上下文失效、能力上限）
  外部攻击: 蓄意的位翻转攻击、后门植入、恶意权重篡改（被攻击的部件写进 component）

